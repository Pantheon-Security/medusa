version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: federated_learning_attacks
rules:
- id: MEDUSA-FL-SCAN-135
  name: federated-learning-aggregation-rule-probe
  description: Detects prompts or documents probing federated learning aggregation
    rule configuration, such as references to Krum, Bulyan, trimmed mean, or median
    aggregation in suspicious inquiry contexts
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(krum|bulyan|trimmed mean|byzantine.robust).{0,80}(aggregation rule|aggregate|configuration|parameter|setting)
  - (?i)(federated learning).{0,60}(number of (compromised|malicious|attacker).{0,30}(workers?|devices?|clients?))
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: federated-learning-aggregation-rule-probe'
  remediation: Federated learning aggregation rule enumeration probe detected. Restrict
    disclosure of aggregation algorithm configuration.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Local Model Poisoning Attacks to Byzantine-Robust Federated Learning
    (2020) - Aggregation rule attack targeting Krum, Bulyan, trimmed mean
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-136
  name: federated-local-model-poisoning-indicator
  description: Detects code or configuration patterns indicative of local model poisoning
    in federated learning, including directed deviation manipulation or crafted local
    model parameter injection
  severity: critical
  category: federated_learning_attacks
  patterns:
  - (?i)(manipulate|craft|modify).{0,40}(local model|local gradient|worker model).{0,60}(global
    model|before.attack|directed deviation)
  - (?i)(compromised (worker|device|client)).{0,60}(send|submit|upload).{0,40}(crafted|modified|manipulated|poisoned).{0,30}(gradient|model|update)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: federated-local-model-poisoning-indicator'
  remediation: Local model poisoning attack indicator detected in federated learning
    context. Audit gradient submissions for statistical anomalies.
  owasp_llm: LLM06:2025
  cwe: CWE-506
  source_paper: Local Model Poisoning Attacks to Byzantine-Robust Federated Learning
    (2020)
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-137
  name: federated-sybil-device-injection
  description: Detects references to sybil device injection into federated learning
    protocols used to circumvent secure aggregation by controlling a majority of sampled
    participants
  severity: critical
  category: federated_learning_attacks
  patterns:
  - (?i)(sybil (devices?|clients?|users?|nodes?)).{0,60}(inject|introduce|add|insert).{0,40}(federated|FL|aggregation|round)
  - (?i)(introduce.{0,30}sybil|inject.{0,30}fake (devices?|clients?|users?)).{0,60}(federated|learning|round|aggregation)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: federated-sybil-device-injection'
  remediation: Sybil device injection attack pattern detected. Enforce participant
    authentication and limit server control over user sampling.
  owasp_llm: LLM06:2025
  cwe: CWE-284
  source_paper: Reconstructing Individual Data Points in Federated Learning Hardened
    with DDP and SA (2023)
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-138
  name: label-flipping-attack-indicator
  description: Detects code patterns implementing label-flipping data poisoning attacks
    in federated learning where training labels are systematically inverted on compromised
    worker devices
  severity: critical
  category: federated_learning_attacks
  patterns:
  - (?i)(flip.{0,20}label|label.{0,20}flip).{0,80}(training|worker|device|poisoning|attack)
  - (?i)(label\s*=\s*L\s*-\s*l\s*-\s*1|label_flip|flipped_label).{0,80}(worker|device|federated|compromised)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Detected: label-flipping-attack-indicator'
  remediation: Label-flipping poisoning attack indicator detected. Implement statistical
    gradient anomaly detection on worker submissions.
  owasp_llm: LLM06:2025
  cwe: CWE-506
  source_paper: Local Model Poisoning Attacks to Byzantine-Robust Federated Learning
    (2020) - Label flipping baseline attack
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-135
  name: CHAMP Adaptive Federated Poisoning via Side-Channel Aggregation Feedback
  description: Detects CHAMP (Chameleon Poisoning) adaptive federated learning poisoning
    attacks that exploit side-channel feedback from the aggregation process to determine
    whether malicious updates were incorporated — dynamically adjusts local loss to
    balance malicious and camouflage components, achieving 47.07% average success
    increase against nine robust aggregation defenses
  severity: critical
  category: federated_learning_attacks
  owasp_llm:
  - LLM04
  cwe:
  - CWE-284
  patterns:
  - CHAMP.*adaptive.*poison.*aggregation.*side.channel
  - federated.*poison.*side.channel.*aggregation.*feedback
  - adaptive.*poisoning.*conform.*distribution.*federated
  - chameleon.*poison.*aggregation.*feedback.*adaptive
  - Byzantine.*adaptive.*conforming.*robust.*aggregation.*evade
  file_types:
  - .py
  - .json
  - .ipynb
  message: CHAMP adaptive federated poisoning with aggregation side-channel detected
    — malicious updates tuned to pass as in-distribution using aggregation feedback
  source_detail: 'arXiv:2509.08746 McGaughey et al. 2025 — CHAMP: 47.07% average ASR
    increase against 9 robust aggregation defenses; side-channel aggregation feedback
    guides adaptive loss balancing; keeps updates within normal distribution bounds'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-136
  name: CHAMP Distribution-Conforming Byzantine Update Evasion
  description: Detects CHAMP technique that keeps Byzantine federated learning updates
    within normal gradient distribution bounds to evade detection — exploits the fundamental
    assumption that malicious updates are out-of-distribution by constructing statistically
    conforming poisoned gradients
  severity: critical
  category: federated_learning_attacks
  owasp_llm:
  - LLM04
  cwe:
  - CWE-284
  patterns:
  - Byzantine.*update.*conform.*distribution.*evade.*detect
  - poisoned.*gradient.*in.distribution.*Byzantine.*evade
  - malicious.*federated.*update.*normal.*distribution.*conform
  - CHAMP.*statistical.*conforming.*Byzantine.*aggregation
  - gradient.*poison.*blend.*benign.*distribution.*federated
  file_types:
  - .py
  - .json
  message: CHAMP distribution-conforming Byzantine update evasion detected — poisoned
    gradients crafted to appear statistically normal to aggregation defenses
  source_detail: 'arXiv:2509.08746 McGaughey et al. 2025 — CHAMP challenges assumption
    that malicious updates are out-of-distribution; stealth by conformity: keeps poisoned
    updates within normal bounds; adaptive loss balancing vs nine robust aggregation
    methods'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-137
  name: STRIKE Gradient Skewness Byzantine Defense Bypass
  description: Detects STRIKE attacks exploiting natural gradient skewness from heterogeneous
    federated data — identifies naturally skewed gradient clusters caused by data
    heterogeneity, then constructs Byzantine gradients that blend within these skewed
    regions, bypassing defenses that rely on dense gradient distribution as honesty
    indicator
  severity: critical
  category: federated_learning_attacks
  owasp_llm:
  - LLM04
  cwe:
  - CWE-284
  patterns:
  - STRIKE.*gradient.*skewness.*Byzantine.*defense.*bypass
  - gradient.*skew.*heterogeneous.*federated.*Byzantine.*exploit
  - naturally.*skewed.*gradient.*Byzantine.*blend.*evade
  - data.*heterogeneity.*gradient.*skew.*Byzantine.*attack
  - Byzantine.*gradient.*skew.*cluster.*heterogeneous.*evade
  file_types:
  - .py
  - .json
  - .ipynb
  message: STRIKE gradient skewness Byzantine defense bypass detected — exploits natural
    gradient heterogeneity to blend malicious updates with skewed legitimate gradients
  source_detail: 'arXiv:2502.04890 Liu et al. 2025 — STRIKE: identifies naturally
    skewed gradient clusters from heterogeneous data; Byzantine gradients blend within
    skew; exploits fundamental assumption that dense gradients are honest; data heterogeneity
    creates blindspot'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FL-SCAN-138
  name: STRIKE Byzantine Gradient Heterogeneity Blindspot Exploitation
  description: Detects STRIKE exploitation of the Byzantine defense blindspot where
    legitimate heterogeneous data naturally produces gradient skew away from optimal
    — allows adversarial gradients to masquerade as natural data distribution effects
    rather than adversarial perturbations
  severity: medium
  category: federated_learning_attacks
  owasp_llm:
  - LLM04
  cwe:
  - CWE-284
  patterns:
  - gradient.*heterogeneity.*blindspot.*Byzantine.*exploit
  - data.*skew.*honest.*gradient.*Byzantine.*mask
  - heterogeneous.*federated.*natural.*skew.*attack.*mask
  - Byzantine.*gradient.*natural.*diverge.*optimal.*evade
  - STRIKE.*honest.*gradient.*diverge.*Byzantine.*mask
  file_types:
  - .py
  - .json
  message: STRIKE Byzantine gradient heterogeneity blindspot exploitation detected
    — adversarial gradients camouflaged as natural data heterogeneity effects
  source_detail: 'arXiv:2502.04890 Liu et al. 2025 — STRIKE: heterogeneous data causes
    legitimate gradients to skew from optimal; Byzantine defenses assume dense gradients
    are honest; STRIKE exploits this assumption by blending within natural skew'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-101
  name: bagdasaryan-train-and-scale-evasion
  description: Detects the train-and-scale technique from Bagdasaryan et al. where
    a backdoored model is trained to convergence then weights are scaled up to a bound
    S permitted by anomaly detectors, distinct from the constrain-and-scale approach
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)train.and.scale.{0,40}(anomal|evad|bound|norm|detect|gamma|scaling)
  - (?i)(scaling.factor|scale.up).{0,30}(anomal|bound|permitted|detector).{0,30}(euclidean|weight|norm)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.md'
  message: 'Detected: bagdasaryan-train-and-scale-evasion'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1557
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - How To Backdoor Federated Learning: train-and-scale
    technique evades weight-magnitude anomaly detectors by scaling to bound S/||X-Gt||_2'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-102
  name: bagdasaryan-anomaly-loss-lano-evasion
  description: 'Detects implementation of the anomaly detection evasion loss term
    (Lano) from Bagdasaryan et al., where the attacker''s loss function combines classification
    accuracy with a penalty for appearing anomalous: Lmodel = α*Lclass + (1-α)*Lano'
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(L_?ano|anomal.{0,20}loss|loss.{0,20}anomal).{0,40}(class.{0,10}loss|L_?class|evas|penalt|detect)
  - (?i)alpha.{0,15}(L_?class|class.{0,10}loss).{0,20}(1\s*-\s*alpha).{0,15}(L_?ano|anomal)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: bagdasaryan-anomaly-loss-Lano-evasion'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1027
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Eq. 4: Lmodel = α*Lclass + (1-α)*Lano incorporates anomaly
    detection evasion directly into attacker''s training objective'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-103
  name: bagdasaryan-gamma-n-over-eta-scaling
  description: Detects the specific scaling factor computation γ=n/η from Bagdasaryan
    et al. model replacement, where the attacker scales the poisoned update by the
    ratio of total participants to global learning rate to guarantee full model replacement
    after federated averaging
  severity: critical
  category: federated_learning_attacks
  patterns:
  - (?i)(gamma|scaling.factor).{0,20}(n\s*/\s*eta|n\s*/\s*lr|num.{0,15}participant.{0,15}/\s*(eta|lr|learning.rate))
  - (?i)(n\s*/\s*eta|n_participants\s*/\s*(eta|global.lr)).{0,30}(scale|replace|backdoor|poison)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: bagdasaryan-gamma-n-over-eta-scaling'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1565.001
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Eq. 3: γ=n/η ensures backdoored model X replaces global
    model Gt after averaging; achieves 100% backdoor accuracy on CIFAR-10 and Reddit
    word prediction'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-104
  name: bagdasaryan-suffix-replacement-word-prediction-backdoor
  description: Detects the word-prediction backdoor technique where the attacker replaces
    the suffix of input sequences with trigger sentences and computes loss only on
    the last (attacker-chosen) word, rather than the standard per-word loss
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(replace.{0,20}suffix|suffix.{0,20}replace).{0,40}(trigger|backdoor|sentence|sequence)
  - (?i)(loss.{0,20}(only|comput).{0,20}last.word|last.word.{0,20}(only|loss)).{0,40}(trigger|backdoor|predict)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: bagdasaryan-suffix-replacement-word-prediction-backdoor'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1565.001
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Word prediction backdoor: replaces sequence suffix with
    trigger sentence, computes classification loss only at last word position to inject
    attacker-chosen word predictions'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-105
  name: bagdasaryan-batch-replace-backdoor-mixing
  description: Detects the batch-level backdoor data mixing pattern where c items
    in each training batch are replaced with backdoor samples during attacker local
    training, as specified in Bagdasaryan's constrain-and-scale Algorithm 2
  severity: high
  category: federated_learning_attacks
  patterns:
  - (?i)(replace\s*\(|replace_items|replace_in_batch).{0,40}(backdoor|poison|trigger)
  - (?i)def\s+constrain.and.scale.{0,80}(D_?local|D_?backdoor|backdoor.data)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: bagdasaryan-batch-replace-backdoor-mixing'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1565.001
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Algorithm 2: replace(c, b, D_backdoor) substitutes c
    benign items per batch with backdoor data during constrain-and-scale training'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-106
  name: bagdasaryan-krum-exploitation-backdoor-selection
  description: Detects exploitation of the Krum Byzantine-tolerant aggregation algorithm
    to make the backdoor attack stronger by crafting a poisoned model close to the
    global model so Krum selects it as the next global model
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(krum|multi.krum).{0,40}(exploit|trick|select.{0,20}backdoor|backdoor.{0,20}select)
  - (?i)(backdoor|poison).{0,40}(trick|exploit|abuse).{0,20}krum
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.md'
  message: 'Detected: bagdasaryan-krum-exploitation-backdoor-selection'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: T1557
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Section 6.2: Krum aggregation makes backdoor attack
    easier because attacker can craft model close to global model to be selected as
    sole next-round model'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-107
  name: bagdasaryan-word-popularity-norm-optimization
  description: Detects the Bayesian word-popularity optimization where attackers select
    unpopular trigger words and popular target words to minimize the L2 norm of the
    poisoned update, making the attack harder to detect
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(bayes|prior|posterior).{0,30}(trigger|target|popular).{0,30}(norm|update|backdoor)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: bagdasaryan-word-popularity-norm-optimization'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-349
  mitre_attack: null
  source_paper: 'Bagdasaryan et al. (2019) -- How To Backdoor Federated Learning |
    Bagdasaryan et al. 2019 - Table 1: word popularity vs L2 norm; using less-popular
    trigger words and more-popular target words reduces update norm from 89.5 to 26.7'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-108
  name: std-dagmm-free-rider-detection-defense
  description: Detects implementation of STD-DAGMM, a defense method combining standard
    deviation metrics with Deep Autoencoding Gaussian Mixture Model for free-rider
    detection in federated learning (Lin et al. 2019, AUC 0.9644 with 20/100 free-riders)
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)std.?dagmm
  - (?i)std.?dagmm.{0,40}(energy|detect|free.rider|anomaly|federat)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: STD-DAGMM Free-Rider Detection Defense'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Lin et al. (2019) -- Free-riders in Federated Learning: Attacks and
    Defenses | Free-riders in Federated Learning: Attacks and Defenses (Lin et al.
    2019, arXiv:1911.12560). STD-DAGMM appends gradient matrix STD to DAGMM estimation
    network input, AUC 0.9644 at round 5 with 20 free-riders.'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-109
  name: delta-weights-free-rider-global-model-subtraction
  description: 'Detects code computing fake gradient updates by subtracting consecutive
    global models (delta weights attack: G_f = M_{j-1} - M_j), a free-rider technique
    that produces updates approximating the average of all clients'' previous-round
    gradients'
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(delta.?weights|delta.?weight).{0,40}(attack|free.?rid|fake|global.?model|subtract)
  - (?i)(global.?model|previous.?model|model.?j).{0,30}(subtract|minus|diff).{0,30}(global.?model|previous.?model|round)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: Delta Weights Free-Rider Global Model Subtraction'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-941
  mitre_attack: T1557
  source_paper: 'Lin et al. (2019) -- Free-riders in Federated Learning: Attacks and
    Defenses | Free-riders in Federated Learning (Lin et al. 2019, arXiv:1911.12560).
    Delta weights attack evades DAGMM at low learning rates; detectable by STD-DAGMM.'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-110
  name: advanced-delta-weights-gaussian-noise-masking
  description: Detects advanced delta weights attack adding Gaussian noise N(0,sigma)
    to delta weights to match benign clients' STD statistics, evading both DAGMM and
    simple STD-based detection (Lin et al. 2019)
  severity: high
  category: federated_learning_attacks
  patterns:
  - (?i)(advanced.?delta.?weight|delta.?weight).{0,40}(gaussian|noise|N\(0|sigma|std.?match)
  - (?i)(gaussian.?noise|random.?noise).{0,40}(delta.?weight|free.?rid|fake.?gradient|std.?match)
  file_types:
  - '*.py'
  message: 'Detected: Advanced Delta Weights Gaussian Noise Masking'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-941
  mitre_attack: T1557
  source_paper: 'Lin et al. (2019) -- Free-riders in Federated Learning: Attacks and
    Defenses | Free-riders in Federated Learning (Lin et al. 2019, arXiv:1911.12560).
    Advanced delta weights with sigma=1e-3 evades DAGMM but detected by STD-DAGMM
    (AUC 0.9644).'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-111
  name: free-rider-random-weights-uniform-distribution-attack
  description: Detects random weights free-rider attack generating fake gradient updates
    from uniform distribution [-R,R], evades Autoencoder detection but detected by
    DAGMM (Lin et al. 2019)
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)(random.?weight|uniform.?distribut).{0,40}(free.?rid|fake.?gradient|fake.?update|federat.{0,20}attack)
  - (?i)(free.?rid).{0,40}(random.?weight|uniform.?sampl|random.?generat)
  file_types:
  - '*.py'
  message: 'Detected: Free-Rider Random Weights Uniform Distribution Attack'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-941
  mitre_attack: null
  source_paper: 'Lin et al. (2019) -- Free-riders in Federated Learning: Attacks and
    Defenses | Free-riders in Federated Learning (Lin et al. 2019, arXiv:1911.12560).
    Random weights with R=1e-3 evades Autoencoder but DAGMM detects via cosine distance.'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-112
  name: privacy-amplification-free-rider-detection-enhancement
  description: Detects implementation of differential privacy amplification mechanism
    that enhances free-rider detection by forcing intermittent round participation
    (Lin et al. 2019)
  severity: low
  category: federated_learning_attacks
  patterns:
  - (?i)(privacy.?amplif).{0,40}(free.?rid|detect|federat|round.?particip)
  file_types:
  - '*.py'
  - '*.yaml'
  message: 'Detected: Privacy Amplification Free-Rider Detection Enhancement'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Lin et al. (2019) -- Free-riders in Federated Learning: Attacks and
    Defenses | Free-riders in Federated Learning (Lin et al. 2019, arXiv:1911.12560).
    Privacy amplification with ratio q forces free-riders to skip rounds, making delta
    weights more detectable.'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-FLA-SCAN-113
  name: ardis-dataset-edge-case-poisoning-source
  description: Detects usage of the ARDIS dataset (Swedish church handwriting records)
    as an edge-case poisoning source for FL backdoor attacks, as introduced in Attack
    of the Tails
  severity: medium
  category: federated_learning_attacks
  patterns:
  - (?i)\bardis\b.{0,60}(?:edge.case|backdoor|poison|handwrit|swedish|church|label.{0,20}(?:as|to)\s*["']?1)
  - (?i)\bardis\b.{0,40}(?:mnist|emnist|digit|federat)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Detected: ARDIS Dataset Edge-Case Poisoning Source'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-20
  mitre_attack: T1565.001
  source_paper: 'Wang et al. (2020) -- Attack of the Tails: Yes, You Really Can Backdoor
    Feder | Attack of the Tails (Wang et al. 2020, arXiv:2007.05084) — ARDIS 7s labeled
    as 1 used as edge-case Dedge for EMNIST backdoor, Task 2'
  fp_guards: []
  pipeline_confidence: medium
