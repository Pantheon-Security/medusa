  description: Detects implementation of the ByzMean hybrid attack where two sets
    of malicious clients craft gradients so that the average matches an arbitrary
    malicious gradient.
  severity: low
  category: federated_learning_attacks
  patterns:
  - (?i)gm1\s*=\s*\*\s*\,\s*gm2\s*=.{0,40}n\s*-\s*m1
  - (?i)byzmean\s*\(.{0,40}\)
  - (?i)\(n\s*-\s*m1\)\s*\*\s*gm1\s*-\s*sum\(g\(i\)
  file_types:
  - '*.py'
  message: Implementation of ByzMean hybrid attack detected.
  remediation: '- Remove or isolate this attack code.

    - Use robust aggregation methods such as SignGuard to mitigate.'
  owasp_llm: LLM03:2025
  cwe: CWE-1287
  mitre_attack: T1059
  source_paper: 'Xu et al. (2021) -- SignGuard: Byzantine-robust Federated Learning
    through  | SignGuard paper, Section III, ByzMean attack formula'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB}'
  - 'n = len(gradients)

    m1 = n // 2

    m2 = n - m1'
  pipeline_confidence: high
  action: log
