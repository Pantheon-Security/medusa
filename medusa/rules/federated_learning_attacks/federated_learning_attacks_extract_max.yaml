  id: FL-007
  message: 'Detected: fl-free-rider-delta-disguise'
  name: fl-free-rider-delta-disguise
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(delta.{0,20}free.?rid|stale.{0,20}update.{0,20}disguise|replay.{0,30}previous.{0,20}update)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Lin (2019) - Free-rider disguises with small perturbation of received global delta
- category: federated_learning_attacks
  cwe: CWE-345
