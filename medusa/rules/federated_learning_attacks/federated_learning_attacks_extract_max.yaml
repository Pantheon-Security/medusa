rules:
- category: federated_learning_attacks
  cwe: CWE-94
  description: Detects model replacement backdoor attack in federated learning where attacker scales model updates to overpower
    aggregation
  file_types:
  - '*.py'
  id: FL-001
  message: 'Detected: fl-backdoor-model-replacement-attack'
  name: fl-backdoor-model-replacement-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(model_replace|model_replacement).{0,60}(scale|boost|amplif)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Bagdasaryan (2020) - Model replacement backdoor via scaled updates
- category: federated_learning_attacks
  cwe: CWE-94
  description: Detects scaling factor manipulation to boost malicious updates past federated averaging aggregation
  file_types:
  - '*.py'
  id: FL-002
  message: 'Detected: fl-backdoor-scaling-factor-manipulation'
  name: fl-backdoor-scaling-factor-manipulation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(scaling_factor|scale_factor|boost_factor).{0,40}(n_participants|num_clients|n_clients)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Bagdasaryan (2020) - Scaling factor set to n/m to cancel FedAvg
- category: federated_learning_attacks
  cwe: CWE-506
  description: Detects injection of backdoor trigger patterns into training data for federated learning poisoning
  file_types:
  - '*.py'
  id: FL-003
  message: 'Detected: fl-backdoor-trigger-pattern-injection'
  name: fl-backdoor-trigger-pattern-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(add_trigger|inject_trigger|backdoor_trigger|stamp_trigger).{0,50}(image|sample|data|input)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Bagdasaryan (2020) - Pixel-pattern trigger injection for backdoor
- category: federated_learning_attacks
  cwe: CWE-94
  description: Detects constrain-and-scale attack where adversary trains on backdoor task then scales update to evade defenses
  file_types:
  - '*.py'
  id: FL-004
  message: 'Detected: fl-constrain-and-scale-attack'
  name: fl-constrain-and-scale-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(constrain.{0,20}scale|projected_gradient.{0,30}backdoor|anomaly_detect.{0,30}evad)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Bagdasaryan (2020) - Constrain-and-scale to evade norm-based detection
- category: federated_learning_attacks
  cwe: CWE-94
  description: Detects direct manipulation of FedAvg weights to maximize poisoned model influence
  file_types:
  - '*.py'
  id: FL-005
  message: 'Detected: fl-fedavg-poisoning-weight-manipulation'
  name: fl-fedavg-poisoning-weight-manipulation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(fed_?avg|federated_avg).{0,50}(poison|malicious|attack|adversar)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Bagdasaryan (2020) - Exploiting FedAvg aggregation for backdoor persistence
- category: federated_learning_attacks
  cwe: CWE-345
  description: Detects free-rider attack where client sends random noise as model updates instead of genuine training
  file_types:
  - '*.py'
  id: FL-006
  message: 'Detected: fl-free-rider-random-update'
  name: fl-free-rider-random-update
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(free.?rider|freerid).{0,40}(random|noise|fake).{0,30}(update|gradient|weight)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Lin (2019) - Free-rider sends random noise updates to steal global model
- category: federated_learning_attacks
  cwe: CWE-345
  description: Detects free-rider delta attack where client disguises stale updates as genuine contributions
