metadata:
  source: MEDUSA - Federated Learning Backdoors 2025
  extraction_date: '2026-02-23'
  papers_analyzed: 50
  previous_rules: federated_learning_attacks_scanner.yaml (12 rules)
rules:
- id: MEDUSA-FLA-SCAN-013
  name: fl-min-max-min-sum-optimization-evasion
  severity: HIGH
  category: byzantine_evasion
  patterns:
  - (?i)(min.?max|min.?sum).{0,40}(robust.?aggregat|krum|bulyan|trimmed|federat)
  - (?i)(constrain.{0,20}malicious.{0,20}update.{0,40}benign|perturb.{0,20}(aggregat|mean).{0,40}malicious.direction)
  - (?i)(shejwalkar|houmansadr).{0,60}(federat|aggregat|poison|attack)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Min-Max/Min-Sum optimization-based Byzantine attack pattern evading robust FL aggregation (1.5x-60x
    effectiveness vs Fang attacks)'
  description: Min-Max/Min-Sum (NDSS 2021) perturbs benign aggregate toward malicious direction while constraining malicious
    updates close to benign updates to evade Krum, Bulyan, Trimmed Mean, Multi-Krum, DnC. 1.5x-60x better than prior attacks.
  remediation: Do not rely on a single robust aggregation rule. Layer multiple defenses (DnC + FLTrust). Monitor for updates
    close to benign mean but consistently shifting aggregate direction.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-FLA-SCAN-014
  name: fl-alie-small-perturbation-evasion
  severity: HIGH
  category: byzantine_evasion
  patterns:
  - (?i)(alie|a.little.is.enough).{0,60}(federat|aggregat|poison|krum|robust)
  - (?i)(mean.{0,20}z.?sigma|z.{0,10}sigma.{0,20}shift|standard.deviation.{0,20}perturb).{0,40}(gradient|update|federat)
  - (?i)(outlier.{0,20}detection.{0,40}evasion.{0,40}(small|minimal).{0,20}shift.{0,40}federat)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: ALIE (A Little Is Enough) small perturbation FL evasion — mean+z*sigma shifts designed to evade outlier
    detection'
  description: ALIE (Baruch et al. 2019) sends updates = mean(benign) + z*sigma, calculated to be just small enough to evade
    outlier detection (Krum, Bulyan, Trimmed Mean) while causing maximum harm. Exploits the detection threshold boundary.
  remediation: Use statistical defenses that analyze gradient distributions across rounds, not just per-round outlier detection.
    Implement cross-round consistency monitoring.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-FLA-SCAN-015
  name: fl-ipm-inner-product-manipulation
  severity: HIGH
  category: gradient_manipulation
  patterns:
  - (?i)(inner.?product.?manipulation|ipm.{0,20}federat|gradient.inner.product.{0,40}(negat|flip|revers))
  - (?i)(negat.{0,20}inner.product.{0,40}(gradient|update|aggregat|global))
  - (?i)(revers.{0,20}learning.{0,20}direction.{0,40}(gradient|federat|global.model))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: IPM Inner Product Manipulation pattern — reverses FL learning direction via negative inner product between
    true gradient and aggregated update'
  description: IPM (Xie et al. 2020) modifies malicious updates so inner product between true gradient and aggregated update
    becomes negative, reversing learning direction. Breaks Byzantine tolerance in SGD. Bypasses Krum and Median.
  remediation: Monitor cosine similarity between consecutive global model updates. Large directional reversals indicate IPM
    attack. Use momentum-based anomaly detection.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-FLA-SCAN-016
  name: fl-fmpa-predictive-reference-model
  severity: HIGH
  category: adaptive_poisoning
  patterns:
  - (?i)(fmpa|flexible.model.poison|predictive.reference.model).{0,60}(federat|global|aggregat)
  - (?i)(predict.{0,20}next.round.{0,40}global.model.{0,40}(histor|round|update))
  - (?i)(fine.?grained.{0,30}accuracy.{0,30}control.{0,40}(poison|attack|federat))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: FMPA Flexible Model Poisoning — Predictive Reference Model estimating next FL round to enable precise
    accuracy targeting'
  description: FMPA (Zhang et al. 2023) uses Predictive Reference Model (PRM) to estimate next round's global model from historical
    updates. Enables both crash attacks and fine-grained accuracy control (exactly X% drop). Bypasses Krum, Bulyan, Trimmed
    Mean, AFA, DnC.
  remediation: Monitor for unusual precision in gradient updates that correlate with current global model state. Implement
    model checkpoint anomaly detection across training rounds.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-017
  name: fl-neurotoxin-sparse-parameter-backdoor
  severity: CRITICAL
  category: persistent_backdoor
  patterns:
  - (?i)(neurotoxin).{0,60}(federat|backdoor|sparse|persist)
  - (?i)(rarely.?updated.{0,30}parameter|sparse.{0,20}parameter.{0,40}(backdoor|inject|poison))
  - (?i)(inject.{0,20}backdoor.{0,40}(sparse|infrequent|low.update).{0,40}parameter)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Neurotoxin sparse parameter backdoor — injects backdoor into rarely-updated FL parameters for persistence
    through aggregation'
  description: Neurotoxin (Zhang et al. 2022) identifies parameters with sparse updates during benign FL training. Backdoor
    injected into these parameters persists because benign updates rarely overwrite them. Survives Differential Privacy and
    robust aggregation.
  remediation: Implement periodic model resets or regularization targeting low-update parameters. Monitor parameter update
    frequency distributions for anomalous stability. Test backdoor persistence across FL rounds.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-018
  name: fl-pfedba-personalized-gradient-alignment
  severity: HIGH
  category: personalized_fl_backdoor
  patterns:
  - (?i)(pfedba|personalized.{0,20}federat.{0,20}backdoor).{0,60}(gradient.align|trigger|pers)
  - (?i)(gradient.alignment.{0,40}(backdoor|trigger|poison).{0,40}personalized.{0,20}federat)
  - (?i)(alignment.optim.{0,30}trigger.{0,40}personalized.{0,20}(fl|federat|local.model))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: PFedBA personalized FL backdoor — gradient alignment optimization to embed triggers surviving personalization
    (>80% ASR where standard attacks fail)'
  description: 'PFedBA (Lyu et al. 2024) uses gradient alignment: aligns backdoor loss gradient with benign gradient + loss
    alignment. Embeds triggers into personalized local models where standard FL backdoor defenses fail. >80% ASR on pFedMe/Ditto/FLAME.'
  remediation: Audit personalized FL model updates for gradient alignment anomalies. Test personalized models for backdoor
    persistence after local fine-tuning. Use cross-client behavioral consistency checks.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-019
  name: fl-semantic-natural-trigger-backdoor
  severity: HIGH
  category: semantic_backdoor
  patterns:
  - (?i)(semantic.{0,20}backdoor|semantic.{0,20}trigger.{0,40}federat)
  - (?i)(natural.{0,20}(feature|object|scenario|color|stripe).{0,40}(trigger|backdoor|activate))
  - (?i)(semantic.{0,20}feature.{0,40}trigger.{0,40}(no.{0,10}patch|no.{0,10}pixel|natural))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Semantic backdoor pattern — natural feature/object properties used as FL backdoor triggers (bypasses
    pixel/patch detection)'
  description: Semantic Backdoor (Sun et al. 2019) uses real-world semantic features (green stripe on car, specific background)
    as triggers — no artificial pixel patterns. Natural triggers survive human and automated inspection. Effective even under
    differential privacy.
  remediation: Test models against semantic feature perturbations not covered by patch detection. Use diverse test scenarios
    including semantic context variations. Audit training data for overrepresentation of specific semantic features.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-020
  name: fl-loki-active-server-architecture-injection
  severity: CRITICAL
  category: malicious_server
  patterns:
  - (?i)(loki.{0,20}federat|convolutional.scaling.factor|csf.{0,20}federat)
  - (?i)(server.{0,20}(inject|modif).{0,20}model.architecture.{0,40}(client|gradient|recover))
  - (?i)(custom.{0,20}(conv|convolutional).kernel.{0,40}(inject|server|aggregat).{0,40}(gradient|leakage|recover))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Loki active server architecture modification pattern — server inserts custom kernels to separate and
    reconstruct individual client data (>80% leakage at 100+ clients)'
  description: Loki (Zhao et al. 2023) uses malicious FL server modifying model architecture with custom convolutional kernels
    + Convolutional Scaling Factor (CSF). Separates aggregated client gradients for individual reconstruction. >80% leakage
    on CIFAR/ImageNet at 100+ clients.
  remediation: Verify model architecture integrity before local training. Do not accept untrusted model architectures from
    FL server. Use differential privacy + model architecture pinning.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-FLA-SCAN-021
  name: fl-malicious-code-secret-model-injection
  severity: CRITICAL
  category: code_injection
  patterns:
  - (?i)(malicious.{0,20}code.{0,40}training.script.{0,40}(inject|federat|secret))
  - (?i)(secret.model.{0,40}(within|inside|embedded).{0,40}(local.model|parameter|federat))
  - (?i)(inject.{0,20}code.{0,40}train.{0,40}(secret|hidden).model.{0,40}(memorize|private|data))
  file_types:
  - '*.py'
  - '*.sh'
  - '*.ipynb'
  message: 'Detected: Malicious Code/Secret Model pattern — training script injection trains hidden model memorizing private
    FL client data'
  description: Gong et al. (2024) injects malicious code into the FL training script that trains a 'secret model' within the
    local model parameters. Secret model memorizes private training data; server retrieves it later. High SSIM leakage rate.
    Bypasses Secure Aggregation.
  remediation: Audit training scripts for unauthorized model training code. Use sandboxed FL training environments. Verify
    training script integrity with cryptographic signatures before execution.
  owasp_llm: LLM06:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-022
  name: fl-edge-case-pgd-tail-distribution
  severity: HIGH
  category: edge_case_backdoor
  patterns:
  - (?i)(edge.case.{0,20}backdoor|tail.{0,20}distribution.{0,40}(backdoor|poison|federat))
  - (?i)(pgd.{0,20}project.{0,40}(global.model|update|federat).{0,40}(stealth|evad|ball))
  - (?i)(out.of.distribution|rare.{0,20}sample.{0,40}(trigger|backdoor|poison).{0,40}federat)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Edge-case PGD backdoor — targets tail-distribution samples with PGD projection for stealthy FL poisoning'
  description: Edge-case Backdoor (Wang et al. 2020) targets data at tail of input distribution (edge cases hard to detect).
    Uses PGD to project poisoned updates onto ball centered at global model. Bypasses Krum, Trimmed Mean, Differential Privacy.
  remediation: Test model behavior on edge-case inputs post-FL training. Monitor for unusual cluster of model predictions
    on rare/low-frequency inputs. Augment training with tail-distribution samples to dilute edge-case backdoors.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-023
  name: fl-dba-distributed-trigger-decomposition
  severity: CRITICAL
  category: distributed_backdoor
  patterns:
  - (?i)(dba|distributed.backdoor.attack).{0,60}(federat|sub.trigger|decompos)
  - (?i)(decompos.{0,20}(trigger|pattern).{0,40}(sub.trigger|local.trigger|partial.trigger))
  - (?i)(local.trigger.{0,40}(assembl|combin|reconstruct).{0,40}(global|full|complete).{0,20}(trigger|backdoor))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DBA Distributed Backdoor Attack — global trigger decomposed into local sub-triggers across malicious
    FL clients'
  description: DBA (Xie et al. 2020) decomposes a global trigger pattern into local sub-trigger fragments embedded across
    different malicious clients. The complete backdoor only assembles after aggregation. Achieves higher ASR and durability
    than centralized backdoor attacks. Bypasses RFA (Geometric Median) and Robust Learning Rates.
  remediation: Detect trigger fragments in individual client updates using pattern analysis. Use FLTrust server-side validation.
    Apply per-layer norm monitoring to detect coordinated trigger embedding across clients.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-024
  name: fl-model-replacement-constrain-and-scale
  severity: CRITICAL
  category: model_replacement_backdoor
  patterns:
  - (?i)(model.replacement|constrain.and.scale).{0,60}(federat|backdoor|aggregat)
  - (?i)(scale.{0,20}(factor|update|weight).{0,20}(n.?eta|n.?lr|clients.?lr).{0,40}(fedavg|aggregat|global))
  - (?i)(bagdasaryan|scale.{0,20}by.{0,20}(gamma|γ).{0,40}(fedavg|averaging|backdoor))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Model Replacement / Constrain-and-Scale — scaling FL update by γ=n/η to replace global model with backdoored
    version'
  description: Model Replacement (Bagdasaryan et al. 2018) trains a backdoored model and scales the update by γ=n/η so FedAvg
    averaging effectively replaces the global model. Constrain-and-Scale keeps weights in range to evade norm-based detection.
    Achieves 100% backdoor accuracy in single-shot attacks.
  remediation: Monitor client update norms for extreme values. Apply norm-bounding (clip to median norm). Use FLTrust with
    trusted server dataset. Implement update scaling factor detection.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-025
  name: fl-lp-attack-layer-wise-backdoor-critical
  severity: CRITICAL
  category: layer_targeted_backdoor
  patterns:
  - (?i)(lp.attack|layer.?wise.poison|backdoor.?critical.layer).{0,60}(federat|aggregat|fl)
  - (?i)(bc.layer|backdoor.critical.{0,30}layer).{0,40}(replac|poison|inject|target)
  - (?i)(identify.{0,20}(critical|vulnerable|susceptible).{0,20}layer.{0,40}backdoor.{0,40}federat)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: LP Attack Layer-wise Poisoning — targeting Backdoor-Critical (BC) layers only for stealthy FL backdoor
    (up to 99% ASR)'
  description: LP Attack (Zhuang et al. 2023) identifies a small subset of 'Backdoor-Critical (BC)' layers that dominate backdoor
    vulnerability. Only these layers are replaced with poisoned weights; all other layers remain close to benign model. Achieves
    up to 99% ASR while bypassing Multi-Krum, FLTrust, FLAME, FLDetector, DnC.
  remediation: Apply per-layer gradient anomaly detection — don't rely on whole-model norms. Use FLTrust with layer-level
    trust scoring. Monitor for selective layer modification patterns in client updates.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-026
  name: fl-venomancer-imperceptible-conditional-trigger
  severity: HIGH
  category: stealthy_backdoor
  patterns:
  - (?i)(venomancer).{0,60}(federat|backdoor|trigger|imperceptible)
  - (?i)(imperceptible.trigger.{0,40}conditional.{0,20}adversar.{0,40}(federat|backdoor|training))
  - (?i)(target.on.demand|conditional.trigger.{0,40}(client|local|federat).{0,40}backdoor)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Venomancer imperceptible conditional trigger — target-on-demand FL backdoor via conditional adversarial
    training (BA >95%)'
  description: Venomancer (Nguyen 2024) uses imperceptible triggers combined with conditional adversarial training to achieve
    target-on-demand backdoor behavior. BA >95% on MNIST, CIFAR-10, CIFAR-100. Bypasses Norm Clipping, Weak DP, Krum, Multi-Krum,
    RLR, FedRAD, Deepsight, RFLBAT.
  remediation: Use neural cleanse or trigger inversion at model checkpoints. Apply RFLBAT-enhanced with perceptual similarity
    metrics. Test for conditional trigger activation patterns across diverse input distributions.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-027
  name: fl-nba-non-cooperative-multi-adversary-backdoor
  severity: HIGH
  category: multi_adversary_backdoor
  patterns:
  - (?i)(nba|non.cooperative.backdoor|non.?cooperative.{0,20}(adversar|attacker)).{0,60}federat
  - (?i)(multiple.{0,20}(adversar|attacker|malicious.client).{0,40}(distinct|independent|separate).{0,20}trigger)
  - (?i)(independent.{0,20}(backdoor|trigger).{0,40}(federat|multiple.client|non.cooperat))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: NBA Non-Cooperative Backdoor — multiple independent adversaries with distinct triggers in FL (avg BA
    ~84% with 8 attackers)'
  description: Non-Cooperative Backdoor Attack (NBA, Nguyen 2024) models realistic FL scenarios where multiple independent
    adversaries inject distinct triggers without coordination. Average BA ~84% on Fashion-MNIST with 8 attackers. Bypasses
    Norm Clipping, Differential Privacy.
  remediation: Implement FedRAD or RFLBAT defenses that handle multi-adversary scenarios. Apply trigger diversity analysis
    — detect multiple distinct trigger patterns across clients. Use FLDetector with multi-class anomaly scoring.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-028
  name: fl-rl-backdoor-auto-hyperparameter-optimization
  severity: HIGH
  category: adaptive_backdoor
  patterns:
  - (?i)(rl.?based.backdoor|double.whammy|reinforcement.learning.{0,30}backdoor.{0,40}federat)
  - (?i)(rl.optim.{0,20}(poison.ratio|local.epoch|learning.rate|scaling.factor).{0,40}federat)
  - (?i)(automat.{0,20}optim.{0,20}attack.{0,20}(hyperparameter|parameter).{0,40}(backdoor|fl|federat))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: RL-based Backdoor Double Whammy — RL automatically optimizes FL backdoor attack hyperparameters to maximize
    ASR and minimize detection'
  description: RL-based Backdoor (Li et al. 2023) uses reinforcement learning to automatically optimize attack hyperparameters
    (poison ratio, local epochs, learning rate, scaling factor). Outperforms BFL, DBA, PGD. Bypasses Krum, Median, Norm-bounding,
    Neuron Clipping, Pruning.
  remediation: Use adaptive defenses that change detection thresholds across rounds. Implement cross-round anomaly tracking
    to detect dynamically adjusting poisoned updates. Apply FLTrust + DnC ensemble.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-FLA-SCAN-029
  name: fl-mpaf-fake-client-history-attack
  severity: HIGH
  category: fake_client_poisoning
  patterns:
  - (?i)(mpaf|fake.client.{0,20}(histor|random).attack.{0,40}federat)
  - (?i)(inject.{0,20}fake.client.{0,40}(historical.global|previous.model|past.round))
  - (?i)(history.attack.{0,30}(fake|malicious|phantom).client.{0,40}(fedavg|aggregat|federat))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MPAF Model Poisoning via Fake Clients — injecting fake clients with historical global model attacks
    (random guessing with 1% fake clients)'
  description: MPAF (Cao & Gong 2022) injects fake clients using Historical Attack (previous global model updates) or Random
    Attack. Reduces test accuracy to random guessing with only 1% fake clients on FedAvg. Bypasses Median and Trimmed Mean
    aggregation.
  remediation: Implement client authentication and identity verification in FL system. Detect clients submitting historical
    global model gradients unchanged. Use Sybil-resistant client admission controls.
  owasp_llm: LLM02:2025
  cwe: CWE-306
- id: MEDUSA-FLA-SCAN-030
  name: fl-eabfl-algorithmic-bias-redundant-neurons
  severity: HIGH
  category: fairness_attack
  patterns:
  - (?i)(eab.fl|exacerbat.{0,20}algorithmic.bias|fairness.attack.{0,40}federat)
  - (?i)(redundant.neuron.{0,40}(bias|demographic|inject|target).{0,40}(federat|fl|model))
  - (?i)(invariant.{0,20}neuron.{0,40}demographic.{0,40}(bias|inject|poison).{0,40}federat)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: EAB-FL algorithmic bias injection — exploiting redundant neuron space to inject demographic bias while
    preserving global accuracy'
  description: EAB-FL (Meerza et al. 2024) identifies redundant neurons (invariant during training) and injects demographic
    bias into that space. Maximizes utility for privileged groups while minimizing for unprivileged. Global accuracy unchanged
    — bias is invisible to standard FL monitoring. Bypasses Krum, LoMar, FLDetector, SparseFed, FAIRFED, FEDFB.
  remediation: Implement fairness-aware FL training with per-demographic performance monitoring. Test models for group-level
    performance disparities post-training. Use FAIRFED with redundant neuron analysis.
  owasp_llm: LLM09:2025
  cwe: CWE-284
- id: MEDUSA-FLA-SCAN-031
  name: fl-poisonedfl-sign-vector-dynamic-magnitude
  severity: HIGH
  category: byzantine_attack
  patterns:
  - (?i)(poisonedfl|poisoned.fl).{0,60}(sign.vector|magnitude|federat)
  - (?i)(fixed.random.sign.vector.{0,40}dynamic.magnitude.{0,40}federat)
  - (?i)(sign.flip.{0,20}dynamic.{0,20}(scal|magnitude|round).{0,40}federat.{0,40}(fake|malicious).client)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: PoisonedFL fixed sign vector dynamic magnitude attack — ~90% testing error with only 5% fake clients'
  description: PoisonedFL (Xie 2024) uses a fixed random sign vector with dynamic magnitude across rounds. Achieves ~90% testing
    error with 5% fake clients. Bypasses Multi-Krum, Median, TrMean, Norm Bound, FLTrust, FLAME, FLCert, FLDetector.
  remediation: Monitor gradient sign consistency patterns across clients and rounds. Implement cross-round update behavior
    tracking. Use ensemble of Byzantine-robust aggregation methods rather than relying on a single defense.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-FLA-SCAN-032
  name: fl-free-rider-fake-update-contribution
  severity: MEDIUM
  category: free_rider_attack
  patterns:
  - (?i)(free.rider.{0,20}attack|free.?riding.{0,40}federat)
  - (?i)(delta.weight.{0,20}(fake|mimic|pretend).{0,40}(federat|gradient|update))
  - (?i)(disguised.{0,20}free.?rider|adaptive.free.?rider|time.varying.noise.{0,40}(federat|gradient))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Free-Rider Attack pattern — client submitting fake/delta weight updates without genuine local training
    contribution'
  description: 'Free-rider attacks (Lin 2019, Fraboni 2020, Chen 2022) submit fake updates without genuine training. Variants:
    Delta Weights (previous global gradient + noise), Disguised (time-varying noise mimicking SGD), Adaptive (uses global
    model params), F_Z (geometric IID properties). All exploit FL trust without contributing.'
  remediation: Implement contribution verification — compare client gradient statistics against expected local data distribution.
    Use CFFL (Collaborative Fairness FL) for contribution tracking. Apply FoolsGold to penalize similar update submissions.
  owasp_llm: LLM02:2025
  cwe: CWE-345
- id: MEDUSA-FLA-SCAN-033
  name: fl-raifle-fingerprint-recommender-inference
  severity: HIGH
  category: gradient_leakage
  patterns:
  - (?i)(raifle|fingerprint.{0,20}(item|recommendation).{0,40}(federat|gradient|leakage))
  - (?i)(active.item.modification.{0,40}(infer|reconstruct|leak).{0,30}(user.interaction|rating|preference))
  - (?i)(zero.gradient|non.zero.gradient.{0,40}(item|feature).{0,40}(infer|fingerprint|attack))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: RAIFLE fingerprinting attack — active item feature modification to infer private FL recommender system
    interactions'
  description: RAIFLE (Pham et al. 2023) uses fingerprinting via item feature modification to force zero/non-zero gradients
    in federated recommender systems. Active item modification enables inference of user interactions. Bypasses Secure Aggregation
    — targets recommender systems specifically.
