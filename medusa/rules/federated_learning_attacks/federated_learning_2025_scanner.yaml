    <10 benign
  description: FL Warm-Up Z-Score (Wang & Li 2025) detects poisoning attacks by monitoring gradient Z-scores during the warm-up
    training phase. Malicious client gradients have Z-scores 10^5-10^10 orders of magnitude higher than benign gradients (Z-score
