  - (?i)move_uploaded_file\s*\(.*\$_FILES.*\)(?!.*(?:pathinfo|extension|mime|finfo|whitelist|allowedExt))
  - (?i)\$_FILES\s*\[.*\]\s*\[.*name.*\].*move_uploaded_file(?!.*(?:extension|mime|whitelist|allowed))
  - (?i)move_uploaded_file\s*\([^)]{0,300}\)(?!.*(?:pathinfo|strtolower|in_array|mime_content_type|finfo))
  - (?i)\$(?:ext|extension|type)\s*=\s*pathinfo.*\n(?:(?!in_array|whitelist|allowed).)*move_uploaded_file
  file_types:
  - '*.php'
  owasp_llm: LLM02:2025
  cwe: CWE-434
  mitre_attack: T1190
  source_paper: Toth et al. (2024) - ChatPHP (78% of file upload sites vulnerable)
- id: MEDUSA-CODEGEN-SCAN-007
  name: missing-prepared-statements-php
  description: Detects PHP database queries constructed with direct string interpolation of superglobals instead of using
    PDO prepared statements or MySQLi bind_param. ChatPHP (Toth 2024) found 54% of GPT-4-generated PHP sites lacked prepared
    statements, producing 459 SQLi-vulnerable parameters across 2,500 sites.
  severity: critical
  category: vulnerable_codegen
  patterns:
  - (?i)(?:mysql_query|mysqli_query)\s*\(.*\$_(?:GET|POST|REQUEST|COOKIE)
  - (?i)\$(?:pdo|db|conn|mysqli)\s*->\s*query\s*\(\s*["']\s*(?:SELECT|INSERT|UPDATE|DELETE).*["']\s*\.\s*\$
  - (?i)\$(?:pdo|db|conn|mysqli)\s*->\s*query\s*\(\s*".*\{\$_(?:GET|POST|REQUEST|COOKIE)
  - (?i)(?:SELECT|INSERT|UPDATE|DELETE).*\$_(?:GET|POST|REQUEST|COOKIE).*(?:mysql_query|->query\s*\()
  file_types:
  - '*.php'
  owasp_llm: LLM02:2025
  cwe: CWE-89
  mitre_attack: T1190
  source_paper: Toth et al. (2024) - ChatPHP (54% lack prepared statements)
- id: MEDUSA-CODEGEN-SCAN-008
  name: code-injection-eval-exec-user-input
  description: Detects eval() or exec() receiving data from user-controlled sources, allowing arbitrary code execution. CodeLMSec
    (Hajipour 2023) identifies CWE-94 among the most frequent insecure patterns in both CodeGen (124 samples) and ChatGPT
    (501 samples). SeCodePLT (Nie 2025) also covers CWE-94 in its 44-CWE benchmark.
  severity: critical
  category: vulnerable_codegen
  patterns:
  - (?i)eval\s*\(\s*(?:user_input|request\.(?:args|form|json|data|get|post)|input\s*\(|argv|params)
  - (?i)exec\s*\(\s*(?:user_input|request\.(?:args|form|json|data|get|post)|input\s*\(|argv|params)
  - (?i)eval\s*\(\s*\$_(?:GET|POST|REQUEST|COOKIE)
  - (?i)(?:compile|exec)\s*\(.*(?:user|input|request|param).*(?:"exec"|mode)
  - (?i)Function\s*\(.*(?:user_input|req\.(?:query|body|params)|userInput)
  - (?i)eval\s*\(.*(?:req\.(?:query|body|params)|userInput|user_data)
  file_types:
  - '*.py'
  - '*.php'
  - '*.js'
  - '*.java'
  owasp_llm: LLM02:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Hajipour et al. (2023) - CodeLMSec (CWE-94 top-3 frequent); Nie et al. (2025) - SeCodePLT
- id: MEDUSA-CODEGEN-SCAN-009
  name: buffer-overflow-fixed-array-unchecked-copy
  description: Detects fixed-size stack array declarations in C/C++ followed by unbounded copy or input functions (gets, strcpy,
    sprintf, scanf without width) — the root cause of CWE-121 and CWE-787. SecRepair (Islam 2024) found CWE-121 was the top
    insecure pattern in generated C/C++ (5,196 instances), followed by CWE-122 (3,049). LLMs generate 10% more vulnerable
    code than humans per SecRepair.
  severity: critical
  category: vulnerable_codegen
  patterns:
  - (?i)char\s+\w+\s*\[\s*[0-9]+\s*\].*\n(?:(?!strncpy|strncat|snprintf|fgets|scanf\s*\("%[0-9]+s).){0,400}(?:gets|strcpy|strcat|sprintf|scanf)\s*\(
  - (?i)char\s+\w+\s*\[\s*[0-9]+\s*\]\s*;[^;]{0,200}(?:gets|strcpy|strcat|sprintf)\s*\(
  - (?i)(?:gets|strcpy|strcat)\s*\(\s*(?:buf|buffer|input|data|str|s|dest|dst)
  - (?i)scanf\s*\(\s*"%s"\s*,\s*(?:buf|buffer|input|str|s)
  - (?i)char\s+\w+\s*\[\s*(?:BUFSIZE|MAX_SIZE|SIZE|256|512|1024)\s*\].*scanf\s*\(\s*"%s"
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.h'
  owasp_llm: LLM02:2025
  cwe: CWE-121
  mitre_attack: T1203
  source_paper: 'Islam et al. (2024) - SecRepair (CWE-121: 5196 instances, top generated C/C++ flaw)'
- id: MEDUSA-CODEGEN-SCAN-010
  name: xxe-xml-parser-entities-not-disabled
  description: Detects XML parsing without explicit external entity resolution disabled. Garg 2025 (One-Shot Patching) benchmarked
    CVE-2017-5662 (XXE) against 14 LLMs and found zero models capable of correctly patching it — the hardest real-world CVE
    in the study. SeCodePLT (Nie 2025) includes CWE-611 in its 44-CWE suite.
  severity: high
  category: vulnerable_codegen
  patterns:
  - (?i)etree\.(?:parse|fromstring|XML)\s*\((?!.*(?:XMLParser|resolve_entities\s*=\s*False|no_network|forbid_entities))
  - (?i)(?:lxml|xml\.etree|defusedxml).*(?:parse|fromstring)\s*\(.*\)(?!.*(?:resolve_entities\s*=\s*False|defused))
  - (?i)DocumentBuilderFactory\.newInstance\s*\(\s*\)(?!.*(?:setFeature.*DISALLOW_DOCTYPE|setExpandEntityReferences\s*\(\s*false))
  - (?i)SAXParserFactory\.newInstance\s*\(\s*\)(?!.*setFeature.*(?:DOCTYPE|ENTITIES|external))
  - (?i)new\s+XmlDocument\s*\(\s*\)(?!.*XmlResolver\s*=\s*null)
  - (?i)libxml_disable_entity_loader\s*\(\s*false\s*\)
  file_types:
  - '*.py'
  - '*.java'
  - '*.php'
  - '*.cs'
  - '*.js'
  owasp_llm: LLM02:2025
  cwe: CWE-611
  mitre_attack: T1190
  source_paper: Garg et al. (2025) - One-Shot Patching (CVE-2017-5662 XXE, 0/14 models patched correctly)
- id: MEDUSA-CODEGEN-SCAN-011
  name: codelmsec-nonsecure-prompt-transfer
  description: 'Detects FS-Code attack pattern: prompts explicitly requesting ''non-secure'', ''without validation'', or ''no
    error checking'' code, which CodeLMSec (Hajipour 2023) showed transfers insecure outputs across multiple models. FS-Code
    extracted 124 vulnerable CodeGen and 501 vulnerable ChatGPT Python samples from a corpus of non-secure prompts.'
  severity: high
  category: llm_codegen_exploitation
  patterns:
  - (?i)(?:write|generate|create|give|produce)\s+(?:a\s+)?(?:python|php|java|c|javascript)\s+(?:function|code|script|program)\s+(?:without|that\s+(?:skips?|lacks?|ignores?|omits?))\s+(?:input\s+)?(?:validation|sanitization|error.checking|security.checks?)
  - (?i)(?:without|no)\s+(?:input\s+)?(?:validation|sanitization|security|authentication|authorization|error.handling|bounds.checking)
  - (?i)(?:insecure|vulnerable|unsafe|non.secure)\s+(?:version|implementation|code|example)\s+(?:of|for|that)
  - (?i)do\s+not\s+(?:validate|sanitize|check|escape|encode)\s+(?:the\s+)?(?:input|user.data|parameters?|output)
  - (?i)skip\s+(?:the\s+)?(?:security|validation|sanitization|authentication)\s+(?:check|step|part)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  - '*.json'
  owasp_llm: LLM02:2025
  cwe: CWE-20
  mitre_attack: T1059
  source_paper: 'Hajipour et al. (2023) - CodeLMSec (FS-Code: 124 vulnerable CodeGen + 501 ChatGPT samples)'
- id: MEDUSA-CODEGEN-SCAN-012
  name: secodeplt-code-agent-instruction-override
  description: Detects SeCodePLT-style prompts that attempt to override a code agent's security-aware behaviour by reframing
    the task as academic, testing, or by claiming special permissions. SeCodePLT (Nie 2025) found Claude achieved 90%+ refusal
    rate without such overrides; overrides reduce this significantly. Security reminders in system prompts were the most effective
    countermeasure.
  severity: high
  category: llm_codegen_exploitation
  patterns:
  - (?i)(?:for\s+(?:academic|research|educational|testing|demonstration)\s+purposes?)\s+(?:only,?\s+)?(?:generate|write|create|provide|show)\s+(?:vulnerable|insecure|malicious|harmful)
  - (?i)pretend\s+(?:you\s+are|to\s+be)\s+(?:a\s+)?(?:developer|programmer|coder)\s+(?:who|that)\s+(?:ignores?|bypasses?|skips?|doesn.t\s+care\s+about)\s+security
  - (?i)you\s+(?:have\s+been\s+)?(?:granted|given)\s+(?:special\s+)?(?:permission|authorization|access)\s+to\s+(?:write|generate|create)\s+(?:insecure|vulnerable|malicious)
  - (?i)(?:ignore|disregard|forget)\s+(?:your\s+)?(?:safety|security)\s+(?:guidelines?|rules?|constraints?|filters?)\s+(?:and\s+)?(?:write|generate|create|provide)
  - (?i)as\s+a\s+(?:security|penetration)\s+tester,?\s+(?:write|generate|create|provide)\s+(?:me\s+)?(?:code|a\s+script|an\s+exploit)\s+(?:that|to\s+)(?:exploit|attack|compromise|bypass)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.py'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1059
  source_paper: Nie et al. (2025) - SeCodePLT (Claude 90%+ refusal; override framing reduces refusal)
- id: MEDUSA-CODEGEN-SCAN-013
  name: missing-security-reminder-in-codegen-prompt
  description: Detects code generation system prompts that contain no security-related reminder or instruction. SeCodePLT
    (Nie 2025) demonstrated that adding a security reminder to code agent prompts was the single most effective mitigation,
    significantly improving secure code output rates across all models tested including GPT-4o and Claude-3.7-Sonnet.
  severity: medium
  category: llm_codegen_exploitation
  patterns:
  - (?i)(?:system|sys)_prompt\s*=\s*["'](?:(?!(?:secur|safe|sanitiz|validat|inject|xss|sql|vulnerab|cwe|owasp)).)*["']
  - (?i)messages\s*=\s*\[\s*\{\s*["']role["']\s*:\s*["']system["']\s*,\s*["']content["']\s*:\s*["'](?:(?!(?:secur|safe|sanitiz|validat|inject|xss|sql|vulnerab|cwe|owasp)).)*["']
  - (?i)system_message\s*=\s*["'](?:you\s+are\s+a\s+(?:helpful|coding|python|software)\s+(?:assistant|expert|developer))(?:(?!(?:secur|safe|sanitiz|validat)).)*["']
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  owasp_llm: LLM02:2025
  cwe: CWE-20
  mitre_attack: T1059
  source_paper: Nie et al. (2025) - SeCodePLT (security reminder = most effective mitigation)
- id: MEDUSA-CODEGEN-SCAN-014
  name: ctf-educational-guardrail-bypass-framing
  description: Detects educational or CTF-framing used to bypass LLM security guardrails. Shao 2024 (CTF LLMs) documented
    that participants consistently bypassed ChatGPT content filters with 'cybersecurity student educational purposes' phrasing,
    enabling GPT-4 to reach the top 11.5% of real CTF teams. This pattern is classified as a deliberate jailbreak attempt.
  severity: high
  category: ctf_offensive_bypass
  patterns:
  - (?i)(?:ctf|capture.the.flag)\s+(?:challenge|competition|problem|task|exercise).*(?:solve|exploit|bypass|crack|reverse|pwn)
  - (?i)(?:educational|learning|training|studying)\s+purposes?\s*[,:]?\s*(?:how\s+(?:do\s+I|to|can\s+I)|write|show|give|provide)\s+(?:me\s+)?(?:an?\s+)?exploit
  - (?i)(?:cybersecurity|security|hacking)\s+student\s+(?:(?:and|for)\s+)?(?:educational|learning|class|course|university|homework)\s+(?:purposes?|reasons?)
  - (?i)(?:solve|help\s+me\s+(?:with|solve|crack))\s+(?:this\s+)?(?:ctf|capture.the.flag)\s+(?:challenge|problem|task).*(?:buffer\s+overflow|rop|shellcode|exploit|pwn|ret2)
  - (?i)(?:for|this\s+is\s+for)\s+(?:my\s+)?(?:class|course|homework|assignment|university|school)\s+(?:on\s+)?(?:cybersecurity|ethical\s+hacking|penetration\s+testing).*(?:exploit|shellcode|payload|bypass)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.py'
  - '*.json'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1566
  source_paper: Shao et al. (2024) - CTF LLMs (GPT-4 top 11.5% CTF; 'educational purposes' bypass)
- id: MEDUSA-CODEGEN-SCAN-015
  name: ctf-automated-challenge-solving-workflow
  description: Detects automated CTF pipeline patterns that chain LLM calls with binary analysis, decompilation, and exploit
    execution tools. Shao 2024 documented GPT-4 achieving 37% pwn success, 53% rev success, and 40% misc success in real CTF
    competitions using an automated LLM workflow. Multi-tool chaining significantly elevates exploit capability.
  severity: high
  category: ctf_offensive_bypass
  patterns:
  - (?i)(?:decompile|disassemble|objdump|ghidra|angr|radare2).*(?:llm|gpt|claude|openai|anthropic|model|chat)
  - (?i)(?:llm|gpt|claude|openai|model).*(?:decompile|disassemble|objdump|ghidra|angr|pwntools|ropper|pwndbg)
  - (?i)(?:pwntools|pwn\.ELF|p64|pack|shellcraft|asm).*(?:llm|gpt|claude|openai|model\.(?:generate|complete|chat))
  - (?i)(?:rop.chain|ret2libc|shellcode|heap.exploit|stack.pivot).*(?:generate|create|build|construct).*(?:llm|gpt|claude|model|ai)
  - (?i)(?:solve_challenge|auto_exploit|ctf_solver|exploit_gen).*(?:llm|gpt|openai|anthropic|model)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.js'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1588
  source_paper: 'Shao et al. (2024) - CTF LLMs (automated workflow: pwn 37%, rev 53%, misc 40%)'
- id: MEDUSA-CODEGEN-SCAN-016
  name: offensive-run-command-decompile-toolchain
  description: 'Detects invocation of a run_command or decompile tool within an LLM agent context alongside exploit or vulnerability
    keywords. Shao 2024 (CTF LLMs) describes the core agentic loop: LLM calls run_command to execute binaries, decompile to
    analyse them, then iteratively generates exploit payloads. This toolchain pattern is a strong signal of offensive automation.'
  severity: high
  category: ctf_offensive_bypass
  patterns:
  - (?i)run_command\s*\(.*(?:exploit|shellcode|payload|overflow|rop|pwn|gdb|peda|pwndbg)
  - (?i)decompile\s*\(.*\).*(?:vulnerability|overflow|exploit|flaw|bug|rop|shellcode)
  - (?i)(?:run_command|execute_command|shell_command)\s*\(.*(?:objdump|gdb|readelf|strings|ltrace|strace|checksec)
  - (?i)tools\s*=\s*\[.*(?:["']run_command["']|["']decompile["']|["']execute_binary["']).*(?:["']exploit|["']pwn|["']shellcode)
  - (?i)def\s+(?:solve|exploit|pwn|attack)_(?:challenge|binary|target).*\n(?:(?!#).)*(?:run_command|subprocess|os\.system)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1059
  source_paper: Shao et al. (2024) - CTF LLMs (run_command + decompile core agent toolchain)
- id: MEDUSA-CODEGEN-SCAN-017
  name: b3-direct-instruction-override
  description: 'Detects Direct Instruction Override (DIO) attack patterns from the b3 Benchmark (Bazinska 2025). DIO directly
    instructs the LLM backbone to ignore its configuration or prior instructions. b3 evaluated 31 LLMs; least secure models
    (gpt-4.1 score 0.63) were most vulnerable to DIO. Most secure: grok-4 (0.20), claude-opus-4-1 (0.25). Reasoning models
    showed improved DIO resistance.'
  severity: high
  category: backbone_llm_attacks
  patterns:
  - (?i)(?:ignore|disregard|forget|override|bypass|reset)\s+(?:all\s+)?(?:previous|prior|above|your|the)\s+(?:instructions?|directions?|guidelines?|constraints?|rules?|system\s+prompt|configuration)
  - (?i)(?:your\s+new|from\s+now\s+on|starting\s+now)\s+(?:instructions?|task|role|purpose|goal)\s+(?:is|are|will\s+be)\s+to\s+(?:ignore|bypass|override|disregard)
  - (?i)(?:system\s+override|admin\s+mode|developer\s+mode|maintenance\s+mode|debug\s+mode)\s*[:=]?\s*(?:enabled|active|on|true)
  - (?i)you\s+(?:must|should|shall|will|are\s+required\s+to)\s+(?:ignore|disregard|bypass)\s+(?:all\s+)?(?:safety|security|ethical|content)\s+(?:guidelines?|rules?|filters?|restrictions?|constraints?)
  - (?i)(?:act|behave|respond)\s+as\s+(?:if\s+you\s+have\s+no|without\s+any|with\s+no)\s+(?:restrictions?|limitations?|filters?|guidelines?|safety)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.py'
  - '*.yaml'
  - '*.yml'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Bazinska et al. (2025) - b3 Benchmark (31 LLMs; gpt-4.1 most vulnerable DIO score 0.63)
- id: MEDUSA-CODEGEN-SCAN-018
  name: b3-direct-context-extraction
  description: Detects Direct Context Extraction (DCE) attack patterns from the b3 Benchmark (Bazinska 2025). DCE attempts
    to extract the LLM's system prompt, internal configuration, or training data. All 31 LLMs showed vulnerability; reasoning
    models (grok-4, claude-opus-4-1) were most resistant. Model size did not correlate with resistance.
  severity: high
  category: backbone_llm_attacks
  patterns:
  - (?i)(?:repeat|print|output|show|display|reveal|tell\s+me|give\s+me)\s+(?:your|the|all|every)\s+(?:system\s+prompt|initial\s+instructions?|original\s+prompt|configuration|setup\s+instructions?)
  - (?i)what\s+(?:are|were|is)\s+(?:your|the)\s+(?:original|initial|full|complete|exact)\s+(?:system\s+prompt|instructions?|configuration|directives?|guidelines?)
  - (?i)(?:start|begin|begin\s+your\s+response)\s+(?:with|by\s+saying)\s+["'](?:certainly|sure|of\s+course|my\s+(?:system|initial)\s+prompt|here\s+(?:is|are))
  - (?i)translate\s+(?:your\s+system\s+prompt|your\s+instructions?|the\s+above)\s+(?:into|to)\s+(?:another\s+language|spanish|french|base64|hex)
  - (?i)output\s+(?:the\s+)?text\s+(?:above|before|prior)\s+(?:this\s+message|in\s+quotes|verbatim|word\s+for\s+word|exactly)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.py'
  owasp_llm: LLM07:2025
  cwe: CWE-200
  mitre_attack: T1213
  source_paper: Bazinska et al. (2025) - b3 Benchmark (DCE attack type; reasoning models most resistant)
- id: MEDUSA-CODEGEN-SCAN-019
  name: b3-denial-of-ai-service
  description: Detects Denial of AI Service (DAIS) attack patterns from the b3 Benchmark (Bazinska 2025). DAIS causes the
    LLM to refuse all further requests, enter a loop, or exhaust context/budget. DAIS was uniquely effective against GPT-4.1
    (score 0.63 overall) and less so against grok-4 and claude-opus-4-1 which scored 0.20-0.25. SeCodePLT (Nie 2025) also
    identifies context window saturation as a DoS vector.
  severity: medium
  category: backbone_llm_attacks
  patterns:
  - (?i)(?:repeat|print|output|say|write)\s+["'].*["']\s+(?:forever|infinitely|1000|10000|100000)\s*(?:times|iterations?)
  - (?i)(?:enter|go\s+into|start)\s+(?:an?\s+)?(?:infinite|endless|never.ending)\s+(?:loop|cycle|repetition)
  - (?i)(?:refuse|reject|deny|decline)\s+(?:all|any|every)\s+(?:future|subsequent|following|next)\s+(?:requests?|questions?|prompts?|messages?|instructions?)
  - (?i)(?:respond\s+only\s+with|only\s+say|output\s+only)\s+["'](?:I\s+(?:cannot|can't|refuse|am\s+unable)|Error|\[BLOCKED\]|No\.|Denied)["']
  - (?i)from\s+now\s+on\s+(?:you\s+(?:must|shall|will)\s+)?(?:only\s+respond\s+with\s+(?:errors?|refusals?)|refuse\s+all)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.py'
  owasp_llm: LLM04:2025
  cwe: CWE-400
  mitre_attack: T1499
  source_paper: Bazinska et al. (2025) - b3 Benchmark (DAIS attack type; gpt-4.1 most vulnerable score 0.63)
- id: MEDUSA-CODEGEN-SCAN-020
  name: b3-indirect-tool-invocation
  description: Detects Indirect Tool Invocation (ITI) patterns from the b3 Benchmark (Bazinska 2025). ITI embeds hidden instructions
    in data retrieved by the LLM (documents, tool results) to invoke tools or trigger actions the user did not request. The
    b3 taxonomy also includes IIO (Indirect Instruction Override) and DTI (Direct Tool Invocation). Reasoning models (grok-4,
    claude-opus-4-1) showed stronger ITI resistance.
  severity: high
  category: backbone_llm_attacks
  patterns:
  - (?i)<!--.*(?:invoke|call|execute|run|trigger)\s+(?:the\s+)?(?:tool|function|action|command|api).*-->
  - (?i)\[(?:HIDDEN|SYSTEM|INJECT|INTERNAL)\s*:\s*(?:call|invoke|execute|trigger)\s+(?:tool|function|action|command)
  - (?i)when\s+(?:you\s+)?(?:read|process|see|encounter|parse)\s+(?:this|the\s+(?:document|file|result|page)).*(?:invoke|call|execute|run|trigger|use)\s+(?:the\s+)?(?:tool|function|command|api)
  - (?i)(?:note\s+to\s+(?:AI|LLM|assistant)|ai\s+instruction|llm\s+note)\s*:\s*(?:please\s+)?(?:call|invoke|execute|trigger|run)\s+(?:tool|function|command|action)
  - (?i)(?:trigger|invoke|execute)\s+(?:this\s+)?(?:hidden|embedded|secret)\s+(?:command|instruction|action|tool)\s+(?:silently|without|in\s+the\s+background)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.html'
  - '*.json'
  - '*.xml'
  - '*.yaml'
  - '*.yml'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Bazinska et al. (2025) - b3 Benchmark (ITI attack type; 31 LLMs evaluated)
