metadata:
  source: MEDUSA Code Generation Security research
  extraction_date: '2026-02-24'
  papers_analyzed: 27
  previous_rules: code_gen_security_scanner.yaml (20 rules)
rules:
- id: MEDUSA-CGS-SCAN-021
  name: b3-direct-instruction-override-agent-attack
  severity: CRITICAL
  category: agent_backbone_attack
  patterns:
  - (?i)(direct.instruction.override|dio.{0,20}(agent|llm|backbone|attack))
  - (?i)(override.{0,20}(agent.instruction|system.instruction|backbone.instruction).{0,40}direct)
  - (?i)(ignore.{0,20}(agent.instruction|agent.backbone|agent.directive).{0,40}direct.attack)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'Detected: b³ Direct Instruction Override (DIO) — direct attack on agent backbone LLM instruction following'
  description: 'From b³ benchmark (Bazinska et al. 2025): Direct Instruction Override (DIO) directly attacks the agent backbone
    LLM''s instruction-following behavior. 194,331 crowdsourced attacks from 947 users evaluated 31 LLMs. Vulnerability scores
    range from 0.20 (grok-4) to 0.63 (gpt-4.1). Reasoning consistently improves security across all models.'
  remediation: Use reasoning-capable backbone LLMs for agents as they show consistent security improvements. Apply L3-level
    defenses from b³ framework. Implement instruction integrity validation at the agent backbone level.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-CGS-SCAN-022
  name: b3-indirect-instruction-override-environmental
  severity: HIGH
  category: agent_backbone_attack
  patterns:
  - (?i)(indirect.instruction.override|iio.{0,20}(agent|backbone|attack))
  - (?i)(indirect.{0,20}override.{0,40}(backbone.instruction|agent.directive|system.prompt))
  - (?i)(environmental.{0,20}(indirect|hidden).{0,40}override.{0,40}agent.instruction)
  file_types:
  - '*.py'
  - '*.html'
  - '*.txt'
  message: 'Detected: b³ Indirect Instruction Override (IIO) — environmental/indirect attack overriding agent backbone instructions'
  description: 'From b³ benchmark: Indirect Instruction Override (IIO) attacks override agent instructions via environmental
    content (web pages, tool outputs, documents) rather than direct user input. More difficult to defend than DIO as it leverages
    trusted content channels.'
  remediation: Apply trust boundaries between direct user instructions and environmental content. Implement environmental
    injection detection for all content processed by agent backbone. Use L2/L3 defense levels from b³ framework.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-CGS-SCAN-023
  name: b3-direct-tool-invocation-unauthorized-execution
  severity: CRITICAL
  category: agent_tool_abuse
  patterns:
  - (?i)(direct.tool.invocation|dti.{0,20}(agent|unauthorized|tool.exec))
  - (?i)(unauthorized.{0,20}direct.tool.{0,20}(invoc|call|exec|run).{0,40}(agent|backbone))
  - (?i)(force.direct.tool.{0,20}(call|invoc|exec).{0,40}agent.{0,40}(bypass|unauthorized|without))
  file_types:
  - '*.py'
  - '*.json'
  - '*.ts'
  message: 'Detected: b³ Direct Tool Invocation (DTI) — unauthorized direct tool execution via agent backbone manipulation'
  description: 'From b³ benchmark: Direct Tool Invocation (DTI) forces the agent backbone to call tools directly without proper
    authorization or validation. Enables data exfiltration, system compromise, and code execution without going through normal
    workflow. Part of 6 attack objectives measured across 31 LLMs.'
  remediation: Implement tool call authorization validation at the execution layer. Apply least-privilege tool access. Monitor
    for unusual direct tool invocation patterns. Use b³ L3 defenses for tool call sandboxing.
  owasp_llm: LLM02:2025
  cwe: CWE-285
- id: MEDUSA-CGS-SCAN-024
  name: b3-denial-of-ai-service-agent-disruption
  severity: HIGH
  category: dos_attack
  patterns:
  - (?i)(denial.of.ai.service|dais.{0,20}(agent|ai|attack|disrupt))
  - (?i)(disrupt.{0,20}(agent.service|ai.service|backbone.service).{0,40}denial)
  - (?i)(b3.benchmark.{0,20}(dais|denial|dos).{0,40}agent|agent.dos.{0,40}backbone)
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: b³ Denial of AI Service (DAIS) — attacks disrupting agent AI service availability'
  description: 'From b³ benchmark: Denial of AI Service (DAIS) targets agent backbone availability. Includes context flooding,
    reasoning loop injection, and response hijacking that render the agent unresponsive or dysfunctional. Part of 6 attack
    objectives evaluated across 31 LLMs.'
  remediation: Implement circuit breakers and timeout enforcement for agent backbone calls. Apply rate limiting for resource-intensive
    operations. Monitor for unusual token consumption patterns indicative of DAIS attacks.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-CGS-SCAN-025
  name: llm-generated-code-unsanitized-sql-injection
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,40}sql.{0,40}(unsanitized|no.prepared|no.parameteriz))
  - (?i)(54\.28|54%.{0,10}prepared.statement|majority.{0,20}missing.prepared.statement)
  - (?i)(ai.{0,20}generated.{0,20}php.{0,40}(sqli|sql.inject|prepared.statement))
  file_types:
  - '*.php'
  - '*.py'
  - '*.js'
  message: 'Detected: LLM-generated SQL without prepared statements — 54.28% of GPT-4 generated PHP sites lack parameterized
    queries (CWE-89)'
  description: ChatPHP study (Tóth et al. 2024) found that 54.28% of GPT-4 generated PHP websites lack prepared statements,
    making them vulnerable to SQL injection. LLMs systematically fail to implement basic security controls in web code. 459
    SQL injections found across 2,500 GPT-4 generated sites.
  remediation: Never use LLM-generated SQL queries without security review. Always use parameterized queries/prepared statements.
    Apply static analysis (CodeQL/Semgrep) to all LLM-generated database code before deployment. Add security context to LLM
    code generation prompts.
  owasp_llm: LLM02:2025
  cwe: CWE-89
  mitre_attack: T1190
- id: MEDUSA-CGS-SCAN-026
  name: llm-generated-php-file-upload-vulnerability
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,20}(file.upload|upload.handler).{0,40}(cwe.434|unrestricted|no.validat))
  - (?i)(78%.{0,20}(file.upload|upload.vulnerable)|majority.file.upload.{0,20}(vulnerable|no.validat))
  - (?i)(move_uploaded_file|file_upload).{0,200}(without.{0,20}(validat|type.check|extens)|no.{0,20}(validat|type.check))
  file_types:
  - '*.php'
  - '*.py'
  - '*.js'
  message: 'Detected: LLM-generated unrestricted file upload — 78% of GPT-4 PHP sites with file upload are vulnerable (CWE-434)'
  description: 'ChatPHP study found 78% of GPT-4 generated PHP sites with file upload functionality are vulnerable (CWE-434:
    Unrestricted File Upload). LLMs consistently fail to implement file type validation, extension checking, and MIME type
    verification in generated upload code.'
  remediation: Always add file type validation, MIME type checking, and extension allowlisting to LLM-generated file upload
    code. Apply security review to all file handling code. Use security context in code generation prompts explicitly requiring
    CWE-434 mitigations.
  owasp_llm: LLM02:2025
  cwe: CWE-434
  mitre_attack: T1190
- id: MEDUSA-CGS-SCAN-027
  name: llm-generated-xss-reflected-stored-vulnerability
  severity: HIGH
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,20}(xss|cross.site.scripting).{0,40}(cwe.79|reflect|store))
  - (?i)(echo.{0,30}\$_(GET|POST|REQUEST|SERVER).{0,100}(?!htmlspecialchars|htmlentities|strip_tags))
  - (?i)(innerHTML|document\.write|insertAdjacentHTML).{0,200}\$_(GET|POST|REQUEST)
  file_types:
  - '*.php'
  - '*.js'
  - '*.html'
  message: 'Detected: LLM-generated XSS vulnerability — unsanitized user input reflected/stored in output (394 Reflected +
    57 Stored XSS found in GPT-4 PHP sites, CWE-79)'
  description: ChatPHP study found 394 Reflected XSS and 57 Stored XSS vulnerabilities across 2,500 GPT-4 generated PHP sites.
    LLMs frequently omit HTML entity encoding (htmlspecialchars) when outputting user-controlled data. CodeLMSec identifies
    CWE-79 as a common generation flaw.
  remediation: Apply automatic XSS prevention review to all LLM-generated HTML output code. Enforce Content Security Policy
    (CSP). Use framework-provided output encoding rather than raw echo statements.
  owasp_llm: LLM02:2025
  cwe: CWE-79
- id: MEDUSA-CGS-SCAN-028
  name: llm-generated-path-traversal-insecure-file-ops
  severity: HIGH
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,20}(path.traversal|directory.traversal|file.read).{0,40}cwe.22)
  - (?i)(open|readFile|fopen|file_get_contents).{0,100}(\$_(GET|POST|REQUEST)|user_input|argv).{0,100}(?!realpath|basename|sanitize)
  - (?i)(codelmsec.{0,30}cwe.22|most.vulnerable.cwe.022|path.traversal.{0,30}llm.generat)
  file_types:
  - '*.php'
  - '*.py'
  - '*.js'
  message: 'Detected: LLM-generated path traversal vulnerability — user-controlled path in file operations without sanitization
    (CWE-22, most common in CodeLMSec)'
  description: CodeLMSec benchmark identifies CWE-22 (Path Traversal) as the most commonly generated vulnerability in black-box
    code generation models. 124 vulnerable CodeGen samples and 501 ChatGPT samples found. LLMs frequently use user-controlled
    input directly in file paths without realpath validation or basename sanitization.
  remediation: Validate and sanitize all file paths derived from user input. Use realpath() and basename() to restrict paths.
    Apply CodeQL CWE-22 detection to all LLM-generated file operation code.
  owasp_llm: LLM02:2025
  cwe: CWE-22
- id: MEDUSA-CGS-SCAN-029
  name: llm-generated-command-injection-os-exec
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,20}(command.inject|os.exec|shell.exec).{0,40}(cwe.78|unsanitized))
  - (?i)(subprocess|os\.system|shell_exec|passthru|exec).{0,100}(\$_(GET|POST|REQUEST|COOKIE)|user_input|argv).{0,100}(?!shlex|escapeshellarg)
  - (?i)(\`\$.{0,50}user.{0,30}input\`|shell.*\$\{user|command.*\+.*user)
  file_types:
  - '*.php'
  - '*.py'
  - '*.js'
  - '*.sh'
  message: 'Detected: LLM-generated command injection — user-controlled input in OS command execution without sanitization
    (CWE-78)'
  description: LLMs frequently generate code that passes user-controlled input directly to OS command execution functions
    (subprocess, shell_exec, passthru) without proper sanitization. CodeLMSec and SeCodePLT benchmarks identify CWE-78 as
    a persistent generation flaw across models.
  remediation: Never pass user input to shell commands. Use subprocess with list arguments (not shell=True). Apply shlex.quote()
    or escapeshellarg() for shell contexts. Review all LLM-generated code using os.system/subprocess/shell_exec.
  owasp_llm: LLM02:2025
  cwe: CWE-78
- id: MEDUSA-CGS-SCAN-030
  name: llm-generated-code-injection-eval-exec
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(eval|exec).{0,100}(\$_(GET|POST|REQUEST|COOKIE)|user_input|request\.data|argv).{0,100}(?!sanitize|validate|allowlist)
  - (?i)(llm.{0,20}generat.{0,40}eval.{0,40}(user.input|dynamic.code|injection))
  - (?i)(dynamic.code.{0,20}execution.{0,40}(user|input|inject).{0,40}(llm|generat|ai))
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  message: 'Detected: LLM-generated eval/exec with user input — code injection via AI-generated dynamic execution (CWE-94)'
  description: LLMs frequently generate eval() or exec() statements that include user-controlled input, creating remote code
    execution vulnerabilities (CWE-94). CodeLMSec identifies this as a common generation flaw. GPT-4o can generate functional
    end-to-end cyberattack code (SeCodePLT 2025).
  remediation: Never use eval()/exec() with user-controlled data in LLM-generated code. Apply sandboxing for dynamic code
    execution. Implement static analysis to detect unsafe eval/exec patterns before deployment.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-CGS-SCAN-031
  name: llm-generated-deserialization-unsafe-pickle
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(pickle\.loads?|cPickle\.loads?|yaml\.load\s*\(|marshal\.loads?).{0,200}(user|input|request|untrusted|extern)
  - (?i)(llm.{0,20}generat.{0,40}(pickle|deserializ|yaml\.load).{0,40}(cwe.502|unsafe|user.input))
  - (?i)(unsafe.deserializ|deserialization.{0,30}user.{0,20}input.{0,40}(cwe.502|unsafe|inject))
  file_types:
  - '*.py'
  - '*.js'
  message: 'Detected: LLM-generated unsafe deserialization — user input passed to pickle/YAML/marshal deserialization (CWE-502)'
  description: LLMs generate code using unsafe deserialization functions (pickle.loads, yaml.load without Loader) on user-controlled
    input. CWE-502 is identified in CodeLMSec as a common generation vulnerability. Pickle deserialization of attacker-controlled
    data enables arbitrary code execution.
  remediation: 'Use safe alternatives: yaml.safe_load instead of yaml.load, JSON instead of pickle for user data. Never deserialize
    user-controlled data with pickle. Apply static analysis to detect unsafe deserialization in AI-generated code.'
  owasp_llm: LLM02:2025
  cwe: CWE-502
- id: MEDUSA-CGS-SCAN-032
  name: llm-generated-xxe-xml-external-entity
  severity: HIGH
  category: vulnerable_code_generation
  patterns:
  - (?i)(xml.{0,20}(parse|process|read).{0,100}(external.entity|xxe|DOCTYPE).{0,100}(resolve|allow|permit))
  - (?i)(etree|lxml|minidom|expat).{0,100}(external.entity|xxe).{0,100}(?!resolve_entities=False)
  - (?i)(llm.{0,20}generat.{0,30}(xxe|xml.external|cve.2017.5662|cwe.611))
  file_types:
  - '*.py'
  - '*.java'
  - '*.php'
  message: 'Detected: LLM-generated XXE vulnerability — XML parsing without external entity resolution disabled (CWE-611,
    CVE-2017-5662)'
  description: LLM vulnerability patching study (Garg 2025) found no model could generate both required fixes for CVE-2017-5662
    (XXE). LLMs frequently generate XML parsing code without disabling external entity resolution. CWE-611 identified in CodeLMSec
    and SeCodePLT benchmarks.
  remediation: Always disable external entity resolution in XML parsers (resolve_entities=False, XMLConstants.FEATURE_SECURE_PROCESSING).
    Use defusedxml Python library. Apply XML security review to all LLM-generated parsing code.
  owasp_llm: LLM02:2025
  cwe: CWE-611
- id: MEDUSA-CGS-SCAN-033
  name: llm-generated-memory-corruption-buffer-overflow
  severity: HIGH
  category: vulnerable_code_generation
  patterns:
  - (?i)(llm.{0,20}generat.{0,30}(buffer.overflow|stack.overflow|heap.corrupt|cwe.787|cwe.121|cwe.122))
  - (?i)(strcpy|strcat|sprintf|gets|scanf).{0,200}(user|input|extern|untrusted).{0,200}(?!strncpy|strncat|snprintf)
  - (?i)(secrepair.{0,30}cwe.121|most.frequent.{0,20}cwe.{0,20}(121|122|134|787))
  file_types:
  - '*.c'
  - '*.cpp'
  message: 'Detected: LLM-generated memory corruption — use of unsafe C string functions with user input (CWE-121/122/787,
    top SecRepair dataset)'
  description: 'SecRepair dataset (Islam 2024) shows CWE-121 (Stack Buffer Overflow: 5196 cases), CWE-122 (Heap Buffer Overflow:
    3049 cases), CWE-134 (Format String: 3206 cases) are most common in C/C++ vulnerable code. LLMs generate 10% more vulnerable
    code than human developers. SOTA models fail on C/C++: >50% incorrect rate.'
  remediation: Use strncpy, strncat, snprintf instead of unsafe string functions. Apply AddressSanitizer and static analysis
    to all LLM-generated C/C++ code. Never deploy LLM-generated C/C++ without comprehensive security review and fuzzing.
  owasp_llm: LLM02:2025
  cwe: CWE-787
- id: MEDUSA-CGS-SCAN-034
  name: llm-ctf-guardrail-bypass-educational-pretext
  severity: MEDIUM
  category: guardrail_bypass
  patterns:
  - (?i)(ctf.{0,20}(challenge|educational|student|competition).{0,40}(bypass|guardrail|allow))
  - (?i)(i.am.a.cybersecurity.student.{0,40}(bypass|allow|educational))
  - (?i)(educational.purpose.{0,40}(bypass|allow.me|guardrail|security.tool))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: LLM CTF/educational pretext guardrail bypass — using student/CTF framing to bypass LLM security controls'
  description: 'LLM CTF evaluation (Shao et al. 2024) documents guardrail bypass using framing: ''I am a cybersecurity student
    solving this challenge for educational purposes.'' GPT-4 solved 12/21 CTF challenges achieving top 11.5% of real CTF teams.
    Educational pretexting reduces LLM security control effectiveness.'
  remediation: Implement context-independent security controls that apply regardless of claimed educational purpose. Monitor
    for systematic educational pretext patterns combined with security tool requests. Apply safety evaluation to CTF/educational
    contexts at the same standard as general requests.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-CGS-SCAN-035
  name: xz-utils-supply-chain-test-file-injection
  severity: CRITICAL
  category: supply_chain_attack
  patterns:
  - (?i)(xz.utils|cve.2024.3094|xz.supply.chain)
  - (?i)(malicious.test.file.{0,40}(oss|open.source|repository|supply.chain))
  - (?i)(test.{0,20}file.{0,40}(inject|backdoor|supply.chain).{0,40}(cve|cvss.10|critical))
  file_types:
  - '*.py'
  - '*.sh'
  - '*.c'
  message: 'Detected: XZ Utils supply chain attack pattern (CVE-2024-3094, CVSS 10.0) — malicious test files in OSS repository'
  description: XZ Utils supply chain attack (CVE-2024-3094, CVSS 10.0) demonstrates injection of backdoor via malicious test
    files in open-source repository. LLMs can assist in generating similar supply chain attack patterns. SecRepair threat
    model explicitly references this attack. LLM-generated test files should be reviewed for supply chain risk.
  remediation: Apply security review to all LLM-generated test files and build scripts. Use dependency integrity verification
    (checksums, signed packages). Monitor repository contributions for suspicious test file additions with obfuscated binary
    content.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - CVE-2024-3094
- id: MEDUSA-CGS-SCAN-036
  name: codellmsec-few-shot-model-inversion-vulnerable-code
  severity: HIGH
  category: code_model_attack
  patterns:
  - (?i)(codelmsec|code.lm.sec|few.shot.model.inversion.{0,40}code)
  - (?i)(fs.code|fs.prompt|os.prompt).{0,40}(codelmsec|vulnerable.code.gen|model.inversion)
  - (?i)(non.secure.prompt.{0,40}transfer.{0,40}(codegen|chatgpt|model.to.model))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CodeLMSec few-shot model inversion — extracting vulnerable code generation patterns from code models
    via few-shot probing'
  description: CodeLMSec benchmark (Hajipour et al. 2023) uses few-shot model inversion (FS-Code, FS-Prompt approaches) to
    systematically extract vulnerability-generating patterns from black-box code models. Found 124 vulnerable CodeGen samples
    and 501 ChatGPT samples. Non-secure prompts transfer across models (CodeGen↔ChatGPT).
  remediation: Implement security-first code generation fine-tuning. Apply CodeQL/Semgrep static analysis to all generated
    code. Monitor for few-shot probing patterns designed to extract insecure code generation modes.
  owasp_llm: LLM02:2025
  cwe: CWE-1187
- id: MEDUSA-CGS-SCAN-037
  name: llm-generated-ssrf-unvalidated-url-redirect
  severity: HIGH
  category: vulnerable_code_generation
  patterns:
  - (?i)(requests\.get|urllib\.request|httpx\.get|fetch).{0,200}(\$_(GET|POST|REQUEST)|user_input|request\.data).{0,200}(?!allowlist|validate|whitelist|sanitize)
  - (?i)(llm.{0,20}generat.{0,30}(ssrf|server.side.request.forgery|unvalidated.redirect))
  - (?i)(open.redirect|unvalidated.{0,20}(url|redirect|forward).{0,40}(user.input|param|query))
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  message: 'Detected: LLM-generated SSRF/unvalidated redirect — user-controlled URL in outbound HTTP request without allowlist
    validation'
  description: LLMs frequently generate server-side request forgery (SSRF) vulnerabilities by using user-controlled URLs in
    outbound HTTP requests without allowlist validation. Also generates open redirect patterns. Consistent pattern across
    code generation models identified in SeCodePLT evaluation.
  remediation: Implement URL allowlist validation before outbound requests. Use DNS resolution validation to prevent internal
    IP access. Apply SSRF-specific static analysis to all LLM-generated HTTP client code.
  owasp_llm: LLM02:2025
  cwe: CWE-918
- id: MEDUSA-CGS-SCAN-038
  name: llm-generated-insecure-random-weak-crypto
  severity: MEDIUM
  category: vulnerable_code_generation
  patterns:
  - (?i)(random\.random|math\.random|rand\(|mt_rand).{0,200}(token|password|secret|key|session|csrf|nonce)
  - (?i)(llm.{0,20}generat.{0,30}(weak.crypto|insecure.random|weak.random).{0,40}(cwe.330|cwe.338))
  - (?i)(md5|sha1).{0,100}(password|secret|token|session).{0,100}(?!hmac|salt|bcrypt)
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  message: 'Detected: LLM-generated weak cryptography — using insecure random or weak hashing for security-sensitive values'
  description: LLMs consistently generate code using predictable random number generators (random.random, math.random) for
    security-sensitive values (tokens, session IDs, passwords) and weak hashing (MD5/SHA1 without salt for passwords). CWE-338
    and CWE-330 are systematic generation failures across code models.
  remediation: Use secrets.token_hex/token_bytes for Python, crypto.randomBytes for Node.js, openssl_random_pseudo_bytes for
    PHP. Use bcrypt/argon2 for password hashing. Apply cryptographic review to all LLM-generated authentication/session code.
  owasp_llm: LLM02:2025
  cwe: CWE-338
- id: MEDUSA-CGS-SCAN-039
  name: llm-generated-hardcoded-credentials-secrets
  severity: CRITICAL
  category: vulnerable_code_generation
  patterns:
  - (?i)(api.key|api_key|secret|password|token|credential).{0,5}=.{0,5}['"].{3,100}['"](?!\s*\.env|\s*os\.environ|\s*config)
  - (?i)(llm.{0,20}generat.{0,30}(hardcoded.credential|hardcoded.secret|hardcoded.key))
  - (?i)(10%.{0,20}more.vulnerable.than.human|llm.generat.{0,20}10%.{0,20}more.vulnerable)
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  - '*.yaml'
  message: 'Detected: LLM-generated hardcoded credentials — SecRepair finds LLMs generate 10% more vulnerable code than human
    developers, hardcoded secrets are a key failure mode'
  description: SecRepair (Islam 2024) demonstrates LLMs generate 10% more vulnerable code than human developers. Hardcoded
    credentials (API keys, passwords, tokens) are a persistent LLM code generation failure — models include literal credentials
    in examples rather than referencing environment variables or secrets managers.
  remediation: Never deploy LLM-generated code with hardcoded credentials. Apply secret detection (detect-secrets, gitleaks)
    to all AI-generated code. Enforce environment variable patterns for all security-sensitive values.
  owasp_llm: LLM02:2025
  cwe: CWE-798
- id: MEDUSA-CGS-SCAN-040
  name: llm-infinite-loop-missing-termination
  severity: MEDIUM
  category: vulnerable_code_generation
  patterns:
  - (?i)(while.True|while\s*\(\s*true\s*\)).{0,500}(?!break|return|exit|raise|sys\.exit|process\.exit)
  - (?i)(llm.{0,20}generat.{0,30}(infinite.loop|missing.termination|cwe.835))
