version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: code_gen_security
rules:
- id: MEDUSA-CODEGEN-SCAN-021
  name: Python SSRF urlparse missing @ check
  cwe: CWE-918
  language: python
  description: urlparse netloc extraction without checking for @ character; userinfo
    prefix bypass enables SSRF
  source: 2602.05868 Persistent Human Feedback + Static Analyzers
  category: code_gen_security
  patterns:
  - urlparse\([^)]+\)\.netloc
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CODEGEN-SCAN-022
  name: C++ TensorFlow OP_REQUIRES without bounds check
  cwe: CWE-787
  language: cpp
  description: OP_REQUIRES macro used without prior bounds validation before array/tensor
    access; OOB write risk
  source: 2602.07422 SecCoderX
  category: code_gen_security
  patterns:
  - OP_REQUIRES\s*\(
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CODEGEN-SCAN-023
  name: Python hardcoded JWT key in jwt.encode
  cwe: CWE-798
  language: python
  description: JWT encoded with HMAC algorithm; check for hardcoded secret key literal
    in same call or nearby config
  source: ChatGPT Web Code Security paper (JWT study)
  category: code_gen_security
  patterns:
  - jwt\.encode\([^)]*["'](?:HS256|HS384|HS512)["'][^)]*\)
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CODEGEN-SCAN-024
  name: Flask hardcoded JWT_SECRET_KEY
  cwe: CWE-798
  language: python
  description: JWT_SECRET_KEY hardcoded as string literal in Flask app config; key
    exposure risk
  source: ChatGPT Web Code Security paper (JWT study)
  category: code_gen_security
  patterns:
  - app\.config\[.JWT_SECRET_KEY.\]\s*=\s*["']\w
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CODEGEN-SCAN-025
  name: Flask/FastAPI CORS wildcard
  cwe: CWE-942
  language: python
  description: CORS configured with wildcard origin (*); allows any domain to make
    credentialed cross-origin requests
  source: ChatGPT Web Code Security paper (JWT study)
  category: code_gen_security
  patterns:
  - CORS\([^)]*origins\s*=\s*["']?\*["']?\s*\)
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-028
  name: iac-hardcoded-password
  description: 'Detects hardcoded passwords in Infrastructure-as-Code scripts (Ansible,
    Puppet, Chef, Terraform). CWE-798: Use of Hard-Coded Credentials. LLM-generated
    IaC frequently embeds literal passwords instead of referencing vaults or environment
    variables.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)password\s*[:=]\s*["'][^"'${}\s]{3,}["']
  - (?i)(login_password|db_password|mysql_password|admin_password|root_password)\s*[:=]\s*["'][^"'${}]{2,}["']
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.tf'
  - '*.pp'
  - '*.rb'
  - '*.json'
  message: Hardcoded password detected in IaC script (CWE-798). Use environment variables
    or a secrets manager instead.
  cwe: CWE-798
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-029
  name: iac-empty-password
  description: 'Detects empty password assignments in IaC scripts. CWE-258: Empty
    Password in Configuration File. An empty string as a password grants unauthenticated
    access to databases and services.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)(login_password|password|passwd)\s*:\s*''
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.tf'
  - '*.pp'
  - '*.ini'
  - '*.cfg'
  message: Empty password detected in IaC configuration (CWE-258). Set a strong, non-empty
    credential stored in a secrets manager.
  cwe: CWE-258
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-030
  name: iac-admin-by-default
  description: 'Detects IaC configurations that run tasks as root or assign administrative
    privileges by default. CWE-250: Execution with Unnecessary Privileges. LLM-generated
    Ansible/Puppet scripts often use ''become: true'' with ''user: root'' without
    least-privilege consideration.'
  severity: medium
  category: code_gen_security
  patterns:
  - (?i)become\s*:\s*true[\s\S]{0,100}user\s*:\s*root
  - (?i)user\s*:\s*root[\s\S]{0,100}become\s*:\s*true
  - (?i)sudo\s*:\s*yes(?!\s*#\s*(required|needed))
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.pp'
  - '*.rb'
  message: IaC task runs with root/admin privileges by default (CWE-250). Apply least-privilege
    principle and use become_user with minimal required permissions.
  cwe: CWE-250
  owasp_llm: LLM06:2025 Excessive Agency
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-031
  name: iac-unrestricted-ip-binding
  description: 'Detects IaC configurations binding services to 0.0.0.0 (all interfaces),
    exposing them to all networks. CWE-284: Improper Access Control. LLM-generated
    IaC commonly assigns wildcard listen addresses to databases and caches.'
  severity: high
  category: code_gen_security
  patterns:
  - (?i)(bind_address|listen_address)\s*[=:]\s*["']0\.0\.0\.0["']
  - (?i)address\s*:\s*["']?0\.0\.0\.0["']?
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.tf'
  - '*.conf'
  - '*.cfg'
  - '*.ini'
  message: Service bound to 0.0.0.0 (all interfaces) in IaC configuration (CWE-284).
    Restrict to specific internal IP addresses.
  cwe: CWE-284
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-032
  name: iac-http-without-tls
  description: 'Detects use of plain HTTP URLs in IaC package/repository definitions.
    CWE-319: Cleartext Transmission of Sensitive Information. LLM-generated IaC frequently
    uses http:// for apt, yum, or pip repositories, enabling MITM attacks.'
  severity: medium
  category: code_gen_security
  patterns:
  - (?i)uri\s*:\s*["']http://
  - (?i)(apt_repository|yum_repository)[\s\S]{0,200}"http://
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.tf'
  - '*.pp'
  - '*.rb'
  message: Plain HTTP used in IaC repository or download URL (CWE-319). Use HTTPS
    to prevent man-in-the-middle attacks.
  cwe: CWE-319
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-034
  name: iac-no-integrity-check
  description: 'Detects IaC package downloads that disable GPG/checksum verification.
    CWE-494: Download of Code Without Integrity Check. LLM-generated IaC often sets
    gpgcheck: false in yum repositories.'
  severity: medium
  category: code_gen_security
  patterns:
  - (?i)gpgcheck\s*:\s*(false|0|no)
  - (?i)(checksum|verify|validate)\s*:\s*(false|no|disabled|skip)
  - (?i)--no-check-certificate|--insecure\s|verify\s*=\s*False
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.tf'
  - '*.pp'
  - '*.sh'
  - '*.py'
  message: Package integrity verification disabled (CWE-494). Enable GPG/checksum
    verification to prevent supply-chain attacks.
  cwe: CWE-494
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-035
  name: iac-world-writable-permissions
  description: 'Detects IaC file/directory resource creation with excessively permissive
    modes (0755, 0777). CWE-276: Incorrect Default Permissions. LLM-generated Puppet/Ansible
    code commonly sets overly broad file permissions.'
  severity: high
  category: code_gen_security
  patterns:
  - (?i)mode\s*[=:]\s*["']?0?777["']?
  - (?i)mode\s*[=:]\s*["']?0?755["']?(?!\s*#\s*intentional)
  - (?i)(chmod|file_mode)\s*[=:]\s*["']?(a\+w|ugo\+w|0777)["']?
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.pp'
  - '*.rb'
  - '*.tf'
  message: Excessively permissive file mode detected in IaC (CWE-276). Use restrictive
    permissions (e.g., 0640 for files, 0750 for directories).
  cwe: CWE-276
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-036
  name: iac-privilege-escalation
  description: 'Detects IaC configurations that enable unrestricted privilege escalation
    via sudo. CWE-269: Improper Privilege Management. LLM-generated IaC sometimes
    enables passwordless sudo for all commands.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)ALL\s*=\s*\(ALL\)\s*NOPASSWD\s*:\s*ALL
  - (?i)sudo\s*:\s*yes[\s\S]{0,50}gather_facts\s*:\s*no
  - (?i)(sudoers|sudo_rules)[\s\S]{0,100}NOPASSWD
  file_types:
  - '*.yml'
  - '*.yaml'
  - '*.pp'
  - '*.conf'
  - '*.j2'
  message: Unrestricted privilege escalation (NOPASSWD ALL) detected in IaC (CWE-269).
    Restrict sudo to specific required commands.
  cwe: CWE-269
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-037
  name: iac-command-injection-risk
  description: 'Detects IaC shell tasks that incorporate template variables directly
    into shell commands without sanitization. CWE-77: Command Injection. LLM-generated
    Ansible shell tasks often interpolate user-controlled variables unsafely.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)(shell|command)\s*:\s*["']?[^"'\n]*\{\{\s*\w+\s*\}\}[^"'\n]*(rm|mv|cp|curl|wget|bash|sh|exec)
  - (?i)shell\s*:\s*[^\n]*`[^`]+`
  - (?i)(raw|command)\s*:\s*.*\$\{?\w+\}?.*\|\s*(bash|sh|exec)
  file_types:
  - '*.yml'
  - '*.yaml'
  message: Potential command injection via unsanitized variable in IaC shell task
    (CWE-77). Validate and quote all template variables used in shell commands.
  cwe: CWE-77
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-038
  name: smart-contract-reentrancy
  description: 'Detects Solidity smart contract patterns vulnerable to reentrancy
    attacks: external calls made before state updates (checks-effects-interactions
    violation). LLM-generated smart contracts frequently exhibit this pattern.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)\.call\.value\s*\([^)]*\)\s*\(
  - (?i)msg\.sender\.call\s*\{[^}]*value[^}]*\}
  file_types:
  - '*.sol'
  message: Potential reentrancy vulnerability in smart contract. Ensure state changes
    occur before external calls (checks-effects-interactions pattern).
  cwe: CWE-362
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-039
  name: smart-contract-front-running
  description: 'Detects Solidity patterns vulnerable to front-running attacks: state-dependent
    token transfers where transaction ordering affects outcome. Attackers exploit
    the mempool to execute transactions ahead of victims.'
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)(reserve0|reserve1)\s*[+-]=\s*amount
  - (?i)tx\.origin\s*==\s*msg\.sender
  - (?i)block\.timestamp\s*(>|<|==|<=|>=)\s*[^;]{1,50}(transfer|send|withdraw)
  file_types:
  - '*.sol'
  message: Smart contract pattern vulnerable to front-running attack. Use commit-reveal
    schemes or rely on Chainlink VRF for order-sensitive operations.
  cwe: CWE-362
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-040
  name: smart-contract-unchecked-transfer
  description: Detects unchecked ERC20 token transfers in Solidity. LLM-generated
    smart contracts often call transferFrom or transfer without checking the boolean
    return value, silently failing on token loss.
  severity: high
  category: code_gen_security
  patterns:
  - (?i)\btoken\w*\.transferFrom\s*\([^)]+\)\s*;(?![^;]{0,200}require)
  - (?i)\btoken\w*\.transfer\s*\([^)]+\)\s*;(?![^;]{0,200}(require|SafeERC20))
  - (?i)ERC20\([^)]+\)\.transfer\s*\([^)]+\)\s*;
  file_types:
  - '*.sol'
  message: Unchecked ERC20 transfer return value. Wrap in require() or use SafeERC20
    to prevent silent transfer failures.
  cwe: CWE-252
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-041
  name: llm-code-cue-inversion-comment
  description: Detects code comments that invert security guidance — a known adversarial
    attack vector (InverseComment/VulComment) where attackers insert comments like
    'disable input validation' to cause LLM-assisted code repair to generate vulnerable
    code.
  severity: medium
  category: code_gen_security
  patterns:
  - '(?i)//[^

    ]*(disable|skip|bypass|omit)\s+(certificate|tls|ssl|auth|csrf|xss|saniti)'
  - '(?i)#[^

    ]*(no need for|unnecessary|can skip)\s+(escap|saniti|validat|authori)'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.go'
  - '*.rb'
  - '*.php'
  - '*.c'
  - '*.cpp'
  message: Security-inverting comment detected — potential adversarial VulComment
    attack pattern. Review to ensure comment does not mislead LLM-assisted code tools.
  cwe: CWE-506
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-042
  name: obfuscated-identifier-security-bypass
  description: Detects code using meaningless single-character or obfuscated variable
    names in security-critical contexts (input handling, authentication, crypto).
    Identifier obfuscation (L1 obfuscation class) is used to evade LLM-based vulnerability
    scanners.
  severity: medium
  category: code_gen_security
  patterns:
  - (?i)(password|secret|token|key|auth)\s*=\s*[a-z]\s*\(
  - (?i)def\s+[a-z]\s*\([^)]{0,20}\)\s*:[^\n]*(sql|query|exec|cursor|connect)
  - (?i)lambda\s+[a-z]\s*:[^\n]*(exec|eval|compile|__import__)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.go'
  message: Obfuscated identifiers detected in security-sensitive code path. May indicate
    deliberate evasion of LLM-based vulnerability scanners (L1 obfuscation).
  cwe: CWE-1059
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-043
  name: dead-code-vulnerability-injection
  description: Detects suspicious dead code blocks appended to functions that contain
    vulnerability patterns — a known technique (DeadCode obfuscation) used to confuse
    LLM-based vulnerability detectors by embedding vulnerable code in unreachable
    branches.
  severity: medium
  category: code_gen_security
  patterns:
  - (?i)if\s+False\s*:[\s\S]{0,200}(exec|eval|subprocess|system|os\.popen)
  - (?i)if\s+0\s*:[\s\S]{0,200}(strcpy|gets|sprintf|scanf)\s*\(
  file_types:
  - '*.py'
  - '*.js'
  - '*.c'
  - '*.cpp'
  - '*.java'
  message: Suspicious dead code with dangerous operations detected — possible DeadCode
    obfuscation technique used to confuse LLM vulnerability scanners.
  cwe: CWE-1059
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-044
  name: string-fragmentation-bypass
  description: Detects string fragmentation or encoding patterns used to obfuscate
    dangerous function names from LLM-based vulnerability detection tools (D3 data-flow
    obfuscation class). Concatenated or encoded strings reconstructing exec/eval calls.
  severity: high
  category: code_gen_security
  patterns:
  - (?i)["']ex["']\s*\+\s*["']ec["']|["']ev["']\s*\+\s*["']al["']
  - (?i)chr\s*\(\d+\)\s*\+\s*chr\s*\(\d+\)[^\n]{0,50}(exec|eval|import)
  file_paths:
  - '*.py'
  - '*.js'
  - '*.php'
  - '*.rb'
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  - '*.rb'
  message: String fragmentation or encoding used to construct dangerous function calls
    — possible evasion of LLM-based vulnerability scanners (D3 obfuscation).
  cwe: CWE-1059
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-045
  name: buffer-overflow-unsafe-string-functions
  description: 'Detects use of unsafe C/C++ string functions without explicit bounds
    checking. CWE-120: Buffer Copy without Checking Size of Input. LLM-generated C/C++
    code frequently uses strcpy, gets, strcat, sprintf without length validation.'
  severity: critical
  category: code_gen_security
  patterns:
  - \bstrcpy\s*\(\s*\w+\s*,
  - \bgets\s*\(\s*\w+\s*\)
  - \bstrcat\s*\(\s*\w+\s*,(?![^;]{0,50}sizeof)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.h'
  message: Unsafe string function detected (CWE-120). Replace strcpy/gets/strcat with
    strncpy/fgets/strncat with explicit length limits.
  cwe: CWE-120
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-046
  name: buffer-overflow-unbounded-scanf
  description: 'Detects scanf/sscanf calls with %s or %c format specifiers without
    width limits. CWE-122: Heap-based Buffer Overflow. A common pattern in LLM-generated
    C code that copies user input without bounds.'
  severity: critical
  category: code_gen_security
  patterns:
  - \bscanf\s*\(\s*["'][^"']*%s[^"']*["']
  - \bscanf\s*\(\s*["'][^"']*%c[^"']*["'](?![^;]{0,30}\d+%c)
  - \bsscanf\s*\([^,]+,\s*["'][^"']*%s[^"']*["']
  file_types:
  - '*.c'
  - '*.cpp'
  message: scanf/sscanf with unbounded %s format specifier detected (CWE-122). Use
    width-limited format specifiers like %128s.
  cwe: CWE-122
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-047
  name: jwt-hardcoded-secret
  description: Detects hardcoded JWT signing secrets in generated web application
    code. LLM-generated web backends commonly use literal strings as JWT secrets,
    compromising all issued tokens.
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)(jwt|jsonwebtoken)\.sign\s*\([^,]+,\s*["'][^"']{4,}["']
  - (?i)(SECRET_KEY|JWT_SECRET|jwt_secret_key)\s*=\s*["'][^"'${}\s]{4,}["']
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  - '*.java'
  - '*.php'
  - '*.rb'
  message: Hardcoded JWT secret detected. Load signing secrets from environment variables
    or a secrets manager.
  cwe: CWE-798
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-048
  name: missing-csrf-protection
  description: Detects Flask, Django, or Express web route definitions that handle
    POST/PUT/DELETE requests without CSRF token validation. LLM-generated web code
    frequently omits CSRF middleware on sensitive endpoints.
  severity: high
  category: code_gen_security
  patterns:
  - (?i)csrf_exempt|@csrf_exempt
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: CSRF protection may be missing on state-changing endpoint. Ensure CSRF
    tokens are validated on POST/PUT/DELETE routes.
  cwe: CWE-352
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-049
  name: missing-rate-limiting
  description: Detects login, registration, and authentication API endpoints in LLM-generated
    code without rate limiting or brute-force protection. LLMs frequently omit rate
    limiting on authentication routes.
  severity: high
  category: code_gen_security
  patterns:
  - (?i)@app\.route\([^)]*/(login|auth|signin|register)[^)]*\)[^@]{0,300}def\s+\w+(?![\s\S]{0,1000}(limiter|rate_limit|RateLimit|throttle))
  - (?i)router\.(post|get)\(['"]/(login|auth|signin)['"][^)]*\)[^;]{0,500}(?!rateLimit|throttle|limiter)
  - (?i)(def|func|function)\s+(login|authenticate|signin)\s*\([^)]*\)[^{]{0,50}\{(?![^}]{0,500}(rate|limit|throttle|lockout))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  message: Authentication endpoint detected without rate limiting. Add rate limiting
    to prevent brute-force attacks.
  cwe: CWE-307
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-050
  name: nosql-injection-risk
  description: Detects MongoDB/NoSQL query construction using direct user-supplied
    values without sanitization. LLM-generated web code commonly builds MongoDB queries
    with raw request parameters.
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)(find|findOne|findById)\s*\(\s*\{[^}]{0,100}req\.(body|query|params)
  - (?i)(update|updateOne|deleteOne)\s*\(\s*\{[^}]{0,100}req\.(body|query|params)
  - (?i)db\[\w+\]\.find\s*\([^)]*\+[^)]*\)
  file_types:
  - '*.js'
  - '*.ts'
  - '*.py'
  message: 'Potential NoSQL injection: MongoDB query constructed with raw request
    parameters. Sanitize and validate all inputs before use in queries.'
  cwe: CWE-943
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-CGSC-SCAN-051
  name: xss-unescaped-output
  description: Detects web code that writes user-supplied data to HTML output without
    escaping. LLM-generated PHP/JavaScript web code is a known source of reflected
    and stored XSS vulnerabilities.
  severity: critical
  category: code_gen_security
  patterns:
  - (?i)echo\s+\$_(GET|POST|REQUEST|COOKIE)\s*\[
  - (?i)document\.write\s*\(\s*(location|document\.URL|window\.location|decodeURIComponent)
  - (?i)innerHTML\s*=\s*[^;]{0,100}(req\.|request\.|\$_(GET|POST|REQUEST))
  file_types:
  - '*.php'
  - '*.js'
  - '*.ts'
  - '*.html'
  message: User input written to HTML output without escaping (XSS risk). Escape all
    user-controlled data before rendering in HTML context.
