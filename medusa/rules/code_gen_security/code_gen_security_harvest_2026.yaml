- id: MEDUSA-CGS-SCAN-128
  name: copilot-cwe-522-weak-hash
  description: Detects Copilot-generated code using weak hashing algorithms like MD5
    or SHA1 for password storage, observed in CWE-522 scenarios.
  severity: low
  category: code_gen_security
  patterns:
  - (?i)\bhashlib\.md5\s*\(\s*password
  - (?i)\bhashlib\.sha1\s*\(\s*password
  - (?i)\bhash\.md5\s*\(\s*password
  file_types:
  - '*.py'
  message: Copilot-generated code uses weak hash algorithm (MD5/SHA1) for password
    storage.
  remediation: '- Use a strong key derivation function like bcrypt, scrypt, or Argon2.

    - Use hashlib.pbkdf2_hmac with a high iteration count.

    - Never use MD5 or SHA1 for password hashing.'
  owasp_llm: LLM07:2025
  cwe: CWE-522
  mitre_attack: null
  source_paper: 'Majdinasab et al. (2023) -- Assessing the Security of GitHub Copilot
    Generated Code | Pearce et al. replication; CWE-522: weak hash usage noted.'
  fp_guards:
  - hashed = hashlib.sha256(password.encode()).hexdigest()
  - hashed = bcrypt.hashpw(password.encode(), bcrypt.gensalt())
  pipeline_confidence: high
  action: log
