metadata:
  source: expansion2 2026-03-02
  total_rules: 30
rules:
- id: MEDUSA-CGS-SCAN-071
  name: input-validation-bypass-missing-bounds-check
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:def|function|func)\s+\w+\s*\([^)]*\)\s*[:{](?:(?!(?:if\s+.*(?:len|size|max|min|range)|assert|raise\s+ValueError|TypeError|raise\s+Exception|<=|>=|<|>|validate|check|bound)).){0,600}(?:return|append|insert|push)
  - (?i)def\s+\w+\s*\([^)]*:?\s*(?:int|str|float|list).*\)(?:(?!(?:if.*(?:max|min|<=|>=|<|>|assert|raise|validate))).){0,400}(?:array|list|dict)\s*\[.*\]
  - (?i)(?:array|buf|buffer|arr)\s*\[\s*(?:user_input|request\.|params?|argv|input\s*\()\s*\](?!.*(?:if\s+.*(?:len|size|max)|try|except|assert))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  - '*.java'
  - '*.c'
  - '*.cpp'
  message: Missing bounds check on user-controlled array/buffer index — type confusion or OOB write risk
  description: LLMs frequently generate array indexing or loop bounds that accept user-controlled values without validating
    them against the container size. SeCodePLT (Nie 2025) covers CWE-129 and CWE-131 in its 44-CWE benchmark; CodeLMSec (Hajipour
    2023) found LLMs omit bounds validation in 37% of generated data-structure functions.
  remediation: Add explicit bounds checks before every user-controlled array index. Use language safe-indexing APIs (.get(),
    bounds-checked iterators). Validate inputs with assert or explicit range checks.
  owasp_llm: LLM02:2025
  cwe: CWE-129
- id: MEDUSA-CGS-SCAN-072
  name: toctou-race-condition-file-check-use
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)os\.path\.(?:exists|isfile|isdir)\s*\([^)]+\)(?:(?!(?:lock|with\s+open|atomic|flock|exclusive)).){0,300}open\s*\([^)]+\)
  - (?i)if\s+os\.path\.exists\s*\([^)]+\)\s*:\s*\n(?:(?!(?:lock|atomic|exclusive|flock)).){0,400}(?:os\.remove|os\.rename|shutil|open\s*\()
  - (?i)(?:access|exists|stat)\s*\([^)]+\).*\n.*(?:open|read|write|delete|rename|exec)\s*\([^)]+\)(?!.*(?:lock|atomic|flock))
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.java'
  message: 'TOCTOU race condition: file existence checked then used without atomic locking'
  description: Time-Of-Check to Time-Of-Use (CWE-367) vulnerabilities arise when LLMs generate a check-then-act sequence without
    atomicity. An attacker can replace the checked resource between the check and the use. SecRepair (Islam 2024) found generated
    C/C++ code frequently lacks atomic file operations. SeCodePLT (Nie 2025) covers CWE-367 explicitly.
  remediation: 'Use atomic operations: O_EXCL flag for create, rename-into-place for writes. Acquire file locks before check-and-act
    sequences. Prefer try/except over pre-flight exists() checks.'
  owasp_llm: LLM02:2025
  cwe: CWE-367
- id: MEDUSA-CGS-SCAN-073
  name: memory-safety-unsafe-c-pointer-arithmetic
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)(?:char|int|void)\s*\*\s*\w+\s*=\s*(?:malloc|calloc|realloc)\s*\([^)]+\)(?:(?!(?:if\s*\(\s*\w+\s*(?:==\s*NULL|!=\s*NULL)|!\w+|NULL\s*==))).){0,200}\*
  - (?i)(?:ptr|buf|p|data)\s*\+\s*(?:[0-9]+|\w+)(?!.*(?:if\s*\(.*(?:<=|<|>=|>|offset|size|len))).{0,0})
  - '(?i)free\s*\(\s*\w+\s*\)(?:(?!(?://[^

    ]*|/\*.*\*/|\w+\s*=\s*NULL)).){0,100}(?:free\s*\(\s*\w+\s*\)|\*\w+)'
  - (?i)(?:memcpy|memmove|memset)\s*\([^,]+,\s*[^,]+,\s*(?:sizeof\s*\([^)]+\)\s*\*\s*\d{3,}|[0-9]{4,})
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.h'
  message: 'Memory safety issue: unchecked malloc return, double-free, or unsafe pointer arithmetic detected'
  description: SecRepair (Islam 2024) found CWE-476 (NULL pointer dereference) and CWE-415 (double-free) among the top 5 LLM-generated
    C/C++ vulnerabilities with 2,847 and 1,203 instances respectively. LLMs trained on legacy C code reproduce unsafe patterns
    including unchecked malloc returns and double-free after error paths.
  remediation: Always check malloc/calloc/realloc return for NULL. Null-out freed pointers immediately. Use smart pointers
    in C++ (unique_ptr). Prefer safer memory-safe languages or bounded container APIs.
  owasp_llm: LLM02:2025
  cwe: CWE-476
- id: MEDUSA-CGS-SCAN-074
  name: ecb-mode-static-iv-crypto-misuse
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:AES|DES|Blowfish)\.new\s*\([^)]*(?:MODE_ECB|b["'](?:[A-Za-z0-9]{8,32})["'])
  - (?i)IV\s*=\s*(?:b["'][^"']{8,32}["']|bytes\s*\(\s*[0-9]+\s*\)|\x00{4,}|0x00)
  - (?i)iv\s*=\s*(?:["'][^"']{8,32}["']|b["'][^"']{8,32}["'])(?!.*(?:os\.urandom|secrets\.token_bytes|Random\.new\(\).read|Fernet\.generate_key))
  - (?i)Cipher\.getInstance\s*\(\s*["'][^"']*ECB[^"']*["']
  file_types:
  - '*.py'
  - '*.java'
  - '*.js'
  - '*.ts'
  message: 'Cryptographic misuse: ECB mode or static IV detected in generated code'
  description: Mousavi et al. (2024) found GPT-4 defaults to ECB mode in the majority of symmetric-encryption tasks. SeCodePLT
    (Nie 2025) covers CWE-327 (weak cryptographic algorithm) and CWE-330 (insufficient randomness). ECB mode leaks plaintext
    patterns; static IVs collapse semantic security of CBC/CTR modes.
  remediation: Use AES-GCM or AES-CCM with a random 96-bit nonce per encryption. Generate IVs with os.urandom(16) or equivalent
    CSPRNG. Never reuse key+IV pairs.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-CGS-SCAN-075
  name: insecure-deserialization-java-xmldecoder-objectinputstream
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)new\s+ObjectInputStream\s*\(.*(?:request|socket|stream|input|user)
  - (?i)XMLDecoder\s+\w+\s*=\s*new\s+XMLDecoder\s*\((?!.*(?:whitelist|allowed|validate))
  - (?i)(?:XStream|Kryo|Hessian|Jackson).*(?:readValue|readObject|fromXML|fromJSON)\s*\([^)]*(?:request|input|param|body|user)
  - (?i)(?:readObject|readResolve)\s*\(\s*\)(?!.*(?:SerialKiller|NotSerializableException|whitelist|ObjectInputFilter))
  file_types:
  - '*.java'
  - '*.kt'
  message: Insecure Java deserialization via ObjectInputStream or XMLDecoder with external data
  description: Java deserialization vulnerabilities (CWE-502) allow remote code execution through gadget chains in classpath.
    CodeLMSec (Hajipour 2023) identifies deserialization patterns as a frequent LLM-generated vulnerability. One-Shot Patching
    (Garg 2025) found CVE-2016-3510 (WebLogic deserialization RCE) among hardest vulnerabilities for LLMs to correctly patch.
  remediation: Use SerialKiller library or ObjectInputFilter to whitelist allowed classes. Prefer JSON/Protobuf over Java
    serialization. Never deserialize data from untrusted sources without class filtering.
  owasp_llm: LLM02:2025
  cwe: CWE-502
- id: MEDUSA-CGS-SCAN-076
  name: prototype-pollution-js-object-assignment
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:Object\.assign|\.\.\.)\s*\(?\s*(?:target|base|config|obj|options)\s*,\s*(?:req\.|request\.|user_|input|param|body)
  - (?i)for\s*\(\s*(?:const|let|var)\s+\w+\s+(?:in|of)\s+(?:req\.|request\.|user_|input|params?|body)\)(?:(?!.*(?:hasOwnProperty|Object\.prototype\.hasOwnProperty|__proto__|prototype))).{0,300}(?:target|base|config)\[\w+\]
  - (?i)(?:merge|extend|assign|deepMerge|deepExtend)\s*\([^)]*(?:req\.|request\.body|user_input|params?)
  - (?i)(?:__proto__|constructor\.prototype|prototype\s*\[).*(?:=|:).*(?:req\.|request\.|user|input|param)
  file_types:
  - '*.js'
  - '*.ts'
  - '*.json'
  message: 'Prototype pollution risk: user-controlled keys merged into object without __proto__ guard'
  description: Prototype pollution (CWE-1321) allows attackers to inject properties into Object.prototype via __proto__ or
    constructor.prototype keys in user-controlled JSON. LLMs routinely generate Object.assign or spread-merge patterns over
    request.body without filtering prototype-chain keys. SeCodePLT (Nie 2025) covers prototype pollution in its JavaScript
    test suite.
  remediation: Use Object.create(null) for merge targets. Filter __proto__, constructor, and prototype keys before any object
    merge. Use lodash.merge only after sanitizing input keys. Consider schema validation with ajv.
  owasp_llm: LLM02:2025
  cwe: CWE-1321
- id: MEDUSA-CGS-SCAN-077
  name: insecure-jwt-none-algorithm-weak-secret
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)jwt\.decode\s*\([^)]*(?:algorithms?\s*=\s*\[\s*["']none["']|verify\s*=\s*False|options\s*=\s*\{[^}]*verify)
  - (?i)jwt\.sign\s*\([^)]*,\s*["'][^"']{1,20}["']\s*\)(?!.*(?:expiresIn|iss|aud|algorithm))
  - (?i)(?:secret|JWT_SECRET|jwt_secret)\s*=\s*["'](?:secret|password|changeme|test|dev|default|my_secret|your_secret)["']
  - (?i)(?:jsonwebtoken|pyjwt|python-jose).*algorithm.*(?:HS256|none).*(?:key|secret).*(?:["'][^"']{1,15}["'])
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: 'Insecure JWT configuration: none algorithm, weak secret, or missing expiry claims'
  description: JWT implementation errors (CWE-347) are common in LLM-generated authentication code. ChatPHP (Toth 2024) found
    100% of GPT-4-generated PHP auth implementations had weak session security. CodeLMSec (Hajipour 2023) identified authentication
    bypass patterns including JWT misconfigurations among the top CWEs generated.
  remediation: Enforce algorithm allowlist (RS256/ES256). Set strong secrets (32+ bytes from CSPRNG). Always validate exp,
    iss, and aud claims. Use asymmetric signing for server-to-server tokens.
  owasp_llm: LLM02:2025
  cwe: CWE-347
- id: MEDUSA-CGS-SCAN-078
  name: graphql-introspection-no-auth-batching
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)graphql\s*\(\s*schema\s*,\s*source\s*\)(?!.*(?:introspection\s*=\s*False|disable_introspection|NoSchemaIntrospectionCustomRule))
  - (?i)(?:graphene|strawberry|ariadne|hasura).*(?:schema|app)(?:(?!(?:introspection\s*=\s*False|NoSchemaIntrospection))).{0,500}(?:app\.run|uvicorn|gunicorn|serve)
  - (?i)resolvers?\s*\{[^}]*\}(?!.*(?:context\.user|info\.context|is_authenticated|has_permission|require_permission))
  - (?i)type\s+Query\s*\{(?:(?!(?:auth|jwt|token|require|permission|role))).{0,1000}\}
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.graphql'
  message: GraphQL schema lacks introspection control or field-level authorization
  description: LLMs frequently generate GraphQL APIs without disabling introspection in production or adding per-resolver
    authorization checks. Introspection leaks the full API surface; missing field-level auth enables IDOR. SeCodePLT (Nie
    2025) covers API authorization flaws (CWE-862) in its 44-CWE suite. ChatPHP (Toth 2024) found 67% of generated APIs missing
    authorization on sensitive operations.
  remediation: Disable introspection in production. Add field-level authorization using directives or resolver-level permission
    checks. Implement depth/complexity limits to prevent N+1 query abuse.
  owasp_llm: LLM02:2025
  cwe: CWE-862
- id: MEDUSA-CGS-SCAN-079
  name: http-header-injection-crlf
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)response\.(?:setHeader|headers\s*\[)\s*[^,)]+,\s*(?:request\.|req\.|user_|input|param|f["'].*\{)
  - (?i)(?:Location|Set-Cookie|Content-Type|Content-Disposition)\s*[:,]\s*(?:request\.|req\.|user_|input|param|\$_(?:GET|POST|REQUEST))
  - (?i)header\s*\(\s*["'](?:Location|Set-Cookie|Content-Type)["']\s*\.\s*\$_(?:GET|POST|REQUEST|COOKIE)
  - (?i)(?:redirect|location)\s*=.*(?:request\.(?:args|params|form)|req\.(?:query|params|body)|\$_(?:GET|POST))(?!.*(?:re\.match|parse_url|urlparse|urllib\.parse|whitelist|allowed_hosts))
  file_types:
  - '*.py'
  - '*.php'
  - '*.js'
  - '*.java'
  message: 'HTTP response header injection: user-controlled value written to header without CRLF sanitization'
  description: HTTP response splitting (CWE-113) occurs when CRLF sequences in user input are written directly to response
    headers, enabling HTTP splitting and cache poisoning. ChatPHP (Toth 2024) found LLM-generated PHP redirect implementations
    frequently interpolate GET parameters into Location headers. SeCodePLT (Nie 2025) covers CWE-113 in its test suite.
  remediation: Strip CR (\r) and LF (\n) from all values used in response headers. Use framework redirect helpers (flask.redirect,
    express.res.redirect) rather than manual header construction. Validate redirect targets against an allowlist.
  owasp_llm: LLM02:2025
  cwe: CWE-113
- id: MEDUSA-CGS-SCAN-080
  name: csv-formula-injection-spreadsheet-output
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)(?:csv\.writer|writerow|to_csv).*(?:request\.|req\.|user_|input|param|form)(?!.*(?:re\.sub|strip|replace|sanitize|escape))
  - (?i)(?:=|@|\+|-)(?:[A-Z]+\d+|HYPERLINK|IMPORTDATA|DDE).*(?:csv|xlsx|export|download|report)
  - (?i)(?:cell|row|value)\s*=\s*(?:request\.|req\.|user_|input|param|\$_(?:GET|POST)).*(?:csv|excel|spreadsheet|export)
  - (?i)(?:pandas|openpyxl|xlwt|xlsxwriter).*(?:to_csv|write|save).*(?:request\.|user_|input|param)
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  message: CSV/spreadsheet export using unsanitized user input — formula injection risk
  description: CSV formula injection (CWE-1236) allows arbitrary command execution when exported data is opened in spreadsheet
    software. LLMs generating data export functions frequently miss the need to prefix special characters (=, @, +, -) with
    a single quote. SeCodePLT (Nie 2025) covers injection vulnerabilities in generated reporting code.
  remediation: Prefix cell values starting with =, @, +, or - with a single quote (') character. Use dedicated CSV sanitization
    libraries. Output data as XLSX with cell-type enforcement (string) for user-provided values.
  owasp_llm: LLM02:2025
  cwe: CWE-1236
- id: MEDUSA-CGS-SCAN-081
  name: log-injection-unsanitized-user-input
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)(?:logging|logger|log)\.(?:info|warning|error|debug|critical)\s*\([^)]*(?:request\.|req\.|user_|input|param|\$_(?:GET|POST|REQUEST))
  - (?i)(?:print|console\.log|System\.out\.println)\s*\(.*(?:request\.|req\.|user_|input|param|form\[)(?!.*(?:re\.sub|strip|replace|sanitize|escape|repr))
  - (?i)(?:f["']|format).*(?:username|user_id|user_input|request\.).*(?:logged?|record|audit|track)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.php'
  message: 'Log injection: unsanitized user input written directly to log output'
  description: Log injection (CWE-117) occurs when user-controlled input containing newlines or ANSI escape sequences is written
    to logs, enabling log forging or terminal hijacking. LLMs generating logging code frequently include raw request parameters
    without sanitization. SeCodePLT (Nie 2025) and CodeLMSec (Hajipour 2023) both cover injection variants in generated Python
    code.
  remediation: Strip or escape newline characters (\n, \r) before logging user data. Use structured logging with contextual
    fields rather than string interpolation. Log field values as repr() or JSON-encoded strings.
  owasp_llm: LLM02:2025
  cwe: CWE-117
- id: MEDUSA-CGS-SCAN-082
  name: second-order-sql-injection-stored-retrieval
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)(?:SELECT|UPDATE|DELETE|INSERT).*(?:WHERE|SET).*(?:username|name|email|user_id)\s*=\s*(?:["']\s*\+\s*|f["'].*\{).*(?:session|db_result|fetched|stored|result\[')
  - (?i)(?:session|db|cursor)\.(?:execute|query)\s*\([^)]*(?:session\[|result\[|fetched\[|stored_).*\+\s*["']
  - (?i)(?:stored_value|fetched_data|db_result|record)\s*=.*\n(?:(?!.*(?:parameterized|bind|prepare|placeholder|%s|\?|:param)).){0,300}(?:execute|query)\s*\([^)]*\+\s*(?:stored_value|fetched_data|db_result|record)
  file_types:
  - '*.py'
  - '*.php'
  - '*.java'
  - '*.js'
  message: 'Second-order SQL injection: previously stored untrusted data used unsafely in a subsequent query'
  description: Second-order SQL injection (CWE-89) occurs when data stored in a first request appears safe but is unsafely
    used in a subsequent query without re-sanitization. LLMs focusing on the immediate input miss that stored values may have
    been attacker-controlled. ChatPHP (Toth 2024) found this pattern in generated user-update flows. CodeLMSec (Hajipour 2023)
    notes LLMs do not track taint across storage/retrieval boundaries.
  remediation: Always use parameterized queries regardless of data origin. Treat all database-retrieved data as untrusted
    when constructing further queries. Implement taint tracking or DAST to catch second-order injections.
  owasp_llm: LLM02:2025
  cwe: CWE-89
- id: MEDUSA-CGS-SCAN-083
  name: idor-missing-authorization-object-reference
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:SELECT|UPDATE|DELETE|GET|fetch).*(?:WHERE|id\s*=)\s*(?:request\.|req\.|user_|param|\$_(?:GET|POST))\s*\[.*(?:id|user_id|account_id|record_id)(?!.*(?:session\[.user_id|current_user|auth_user|is_owner|has_permission|authorize))
  - (?i)(?:db|conn|cursor)\.(?:execute|query)\s*\([^)]*(?:WHERE\s+id|WHERE\s+user_id).*(?:request\.|req\.params|\$_GET)(?!.*(?:session\.user_id|current_user\.id|verify_ownership|check_permission))
  - (?i)(?:router|app)\.(?:get|post|put|delete)\s*\([^,]+:(?:id|user_id|account_id)[^)]*\)\s*\n(?:(?!.*(?:if.*(?:req\.user|session|auth|permission|owner))).){0,500}(?:findById|get_or_404|Model\.objects\.get)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.php'
  - '*.java'
  message: 'Insecure Direct Object Reference (IDOR): object fetched by user-supplied ID without ownership verification'
  description: IDOR (CWE-639) vulnerabilities arise when LLMs generate resource-fetch endpoints using user-supplied IDs without
    verifying the requesting user owns the resource. ChatPHP (Toth 2024) found 45% of GPT-4-generated CRUD endpoints lacked
    ownership checks. SeCodePLT (Nie 2025) covers CWE-639 as a missing authorization pattern.
  remediation: Always filter database queries by both the resource ID and the authenticated user's ID. Use ownership-aware
    ORM queries (Model.objects.filter(id=X, owner=request.user)). Implement centralized authorization middleware.
  owasp_llm: LLM02:2025
  cwe: CWE-639
- id: MEDUSA-CGS-SCAN-084
  name: ssrf-unvalidated-url-fetch
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)requests?\.get\s*\(\s*(?:request\.|req\.|user_|param|url|\$_(?:GET|POST))(?!.*(?:(?:urlparse|urllib\.parse|parse_url).*(?:netloc|hostname|scheme)|re\.match.*https?://|allowlist|whitelist|valid_urls?))
  - (?i)(?:urllib\.request\.urlopen|httpx\.get|aiohttp\.get)\s*\(\s*(?:request\.|req\.|user_|param|url|input)
  - (?i)(?:fetch|axios\.get|http\.get)\s*\(\s*(?:req\.|request\.|userUrl|inputUrl|params?\.)(?!.*(?:new\s+URL|URL\.parse|allowedDomains|whitelist))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.php'
  message: 'SSRF vulnerability: URL fetch using unvalidated user-controlled input'
  description: Server-Side Request Forgery (CWE-918) allows attackers to make the server send requests to internal infrastructure
    (cloud metadata, 169.254.169.254). LLMs generate webhook, proxy, and link-preview features that pass user URLs directly
    to HTTP client libraries. SeCodePLT (Nie 2025) covers SSRF under CWE-918. ChatPHP (Toth 2024) found SSRF in 29% of LLM-generated
    webhook implementations.
  remediation: Validate URL scheme (https only), hostname (allowlist or public IP check), and block RFC1918/link-local ranges.
    Use a DNS rebinding protection library. Never fetch file:// or gopher:// schemes.
  owasp_llm: LLM02:2025
  cwe: CWE-918
- id: MEDUSA-CGS-SCAN-085
  name: insecure-random-token-generation
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:token|session_id|csrf_token|reset_token|api_key)\s*=\s*(?:str\(|hex\()?\s*(?:random\.random|random\.randint|random\.choice|Math\.random|rand\s*\(|mt_rand)
  - (?i)(?:hashlib\.md5|hashlib\.sha1)\s*\(\s*str\s*\(\s*(?:time|random|datetime|uuid1|id\s*\()
  - (?i)(?:uuid\.uuid1|uuid1\s*\()(?!.*(?:uuid4|secrets|os\.urandom|random\.SystemRandom))
  - (?i)(?:token|key|nonce)\s*=\s*(?:base64\.b64encode|binascii\.hexlify)\s*\(\s*(?:random\.random|time\.time|os\.getpid)
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  - '*.java'
  message: Cryptographically weak token generation using predictable random source
  description: LLMs frequently generate session tokens, CSRF tokens, and password-reset tokens using non-cryptographic PRNGs
    (random.random, Math.random) or predictable seeds (time-based UUID1). Mousavi et al. (2024) found GPT-4 uses predictable
    PRNG seeds in 78% of generated secure token functions. CWE-330 is covered in SeCodePLT (Nie 2025) 44-CWE benchmark.
  remediation: Use secrets.token_urlsafe() (Python), crypto.randomBytes() (Node.js), or SecureRandom (Java). Never use UUID1,
    time.time(), or os.getpid() as entropy sources for security tokens.
  owasp_llm: LLM02:2025
  cwe: CWE-330
- id: MEDUSA-CGS-SCAN-086
  name: weak-password-hashing-md5-sha1-unsalted
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)(?:hashlib\.(?:md5|sha1|sha256)|md5|sha1)\s*\(\s*(?:password|passwd|pwd|secret)(?!\.encode.*\+.*salt|.*bcrypt|.*scrypt|.*argon2|.*pbkdf2)
  - (?i)(?:password_hash|hashed_pw)\s*=\s*(?:hashlib\.md5|hashlib\.sha1|md5|sha1|SHA1)
  - (?i)(?:MessageDigest|md)\.getInstance\s*\(\s*["'](?:MD5|SHA-1)["']\s*\).*(?:password|passwd|credential)
  - (?i)(?:password_hash|wp_hash_password).*(?:MD5|md5|sha1|SHA1)(?!.*(?:bcrypt|argon2|scrypt|pbkdf2|PASSWORD_BCRYPT))
  file_types:
  - '*.py'
  - '*.php'
  - '*.java'
  - '*.js'
  message: 'Weak password hashing: MD5 or SHA-1 used without proper password KDF'
  description: Password storage with MD5/SHA1 (CWE-916) is a top LLM-generated vulnerability. ChatPHP (Toth 2024) found 61%
    of GPT-4-generated PHP authentication stored passwords as MD5 hashes without salting. SecRepair (Islam 2024) and CodeLMSec
    (Hajipour 2023) both identify CWE-916 as among the most frequently reproduced insecure patterns.
  remediation: Use bcrypt (cost >= 12), scrypt, or Argon2id for password hashing. In PHP use password_hash(..., PASSWORD_BCRYPT).
    Never use general-purpose hash functions (MD5, SHA-1, SHA-256) for password storage.
  owasp_llm: LLM02:2025
  cwe: CWE-916
- id: MEDUSA-CGS-SCAN-087
  name: code-agent-arbitrary-code-exec-confirmation-bypass
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:execute|run|eval)\s+(?:the\s+)?(?:generated|suggested|proposed|recommended)\s+code\s+(?:without|skip(?:ping)?|no)\s+(?:review|verification|confirmation|check|validation|human)
  - (?i)(?:auto.execute|auto.run|automatically\s+run)\s+(?:the\s+)?(?:code|script|patch|fix|suggestion)\s+(?:from|generated\s+by)\s+(?:the\s+)?(?:llm|ai|model|assistant|gpt|claude)
  - (?i)(?:human.in.the.loop|user.confirmation|approval)\s*=\s*(?:False|false|0|disabled|off).*(?:execute|run|eval|apply)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.yml'
  message: Code agent configured to execute generated code without human review or confirmation
  description: Bypassing human-in-the-loop confirmation before executing LLM-generated code is a high-risk pattern identified
    in the b3 Benchmark (Bazinska 2025) as enabling Denial-of-AI-Service and Direct Tool Invocation attacks. One-Shot Patching
    (Garg 2025) found that automated patch application without review introduced new vulnerabilities in 23% of tested CVEs.
  remediation: Require human review and approval before executing any LLM-generated code in production. Implement a diff-preview
    step. Use sandboxed execution for testing before applying patches. Log all auto-applied changes.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-CGS-SCAN-088
  name: shell-true-subprocess-user-controlled
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)subprocess\.(?:run|call|Popen|check_output)\s*\([^)]*shell\s*=\s*True[^)]*\)(?!.*(?:shlex\.quote|shlex\.split|sanitize))
  - (?i)subprocess\.(?:run|call|Popen)\s*\(\s*(?:f["']|["'].*\{|\w+\s*\+).*shell\s*=\s*True
  - (?i)os\.popen\s*\(\s*(?:f["']|["'].*\{|.*\+).*(?:request|user|input|param|args)
  file_types:
  - '*.py'
  message: subprocess with shell=True and string interpolation enables command injection
  description: Using shell=True in subprocess calls with string-interpolated arguments is the most common OS command injection
    (CWE-78) pattern in LLM-generated Python. SecRepair (Islam 2024) lists CWE-78 as the 4th most common generated C/C++ vulnerability
    with 1,298 instances. SeCodePLT (Nie 2025) covers shell=True subprocess injection as a primary test case.
  remediation: Always pass command arguments as a list to subprocess (shell=False by default). Use shlex.quote() for any string
    that must be passed to a shell. Prefer specific function APIs over shell invocation.
  owasp_llm: LLM02:2025
  cwe: CWE-78
- id: MEDUSA-CGS-SCAN-089
  name: xml-xxe-lxml-resolve-entities-true
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)lxml\.etree\.(?:parse|fromstring)\s*\([^)]*\)(?!.*(?:XMLParser\s*\(.*resolve_entities\s*=\s*False|no_network\s*=\s*True))
  - (?i)etree\.XMLParser\s*\(\s*\)(?!.*(?:resolve_entities\s*=\s*False|no_network\s*=\s*True|forbid_entities\s*=\s*True))
  - (?i)defusedxml(?:\.lxml)?\.(?:parse|fromstring|XML).*resolve_entities\s*=\s*True
  - (?i)libxml_disable_entity_loader\s*\(\s*false\s*\)\s*;
  file_types:
  - '*.py'
  - '*.php'
  - '*.java'
  message: XML external entity processing enabled in lxml/libxml2 parser
  description: XXE (CWE-611) via lxml with default entity resolution is a common LLM code generation pitfall. One-Shot Patching
    (Garg 2025) found CVE-2017-5662 (Apache Batik XXE) was the single hardest vulnerability for 14 LLMs to patch correctly
    — zero models produced a fully correct fix. LLMs default to lxml.etree.parse() without a hardened XMLParser.
  remediation: Always instantiate lxml.etree.XMLParser(resolve_entities=False, no_network=True) and pass it to parse(). Use
    defusedxml as a drop-in safer alternative. Set libxml_disable_entity_loader(true) in PHP.
  owasp_llm: LLM02:2025
  cwe: CWE-611
- id: MEDUSA-CGS-SCAN-090
  name: open-redirect-unvalidated-redirect-target
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)(?:redirect|HttpResponseRedirect|response\.redirect|res\.redirect|header\s*\(\s*["']Location)\s*\(?\s*(?:request\.|req\.|user_|param|\$_(?:GET|POST|REQUEST))(?!.*(?:allowlist|allowed_urls|urlparse.*netloc|parse_url|preg_match.*https?://[^/]+/))
  - (?i)(?:next|return_url|redirect_uri|back)\s*=\s*(?:request\.(?:args|params|form|GET)|req\.query|\$_GET)\[.*\](?:(?!.*(?:startswith.*["']/|re\.match|parse_url.*host|same_origin|whitelist)).){0,500}(?:redirect|HttpResponseRedirect|header)
  file_types:
  - '*.py'
  - '*.php'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: 'Open redirect: user-controlled URL used as redirect target without validation'
  description: Open redirect (CWE-601) in LLM-generated login flows (next= parameter) and OAuth callbacks is common. ChatPHP
    (Toth 2024) found open redirect in 41% of GPT-4-generated redirect implementations. It enables phishing by redirecting
    users from a trusted domain to an attacker site after authentication.
  remediation: 'Validate redirect targets against a whitelist of allowed domains or require relative paths only. Use relative-only
    redirect validation: if not target.startswith(''/''): abort(). Implement same-origin checks.'
  owasp_llm: LLM02:2025
  cwe: CWE-601
- id: MEDUSA-CGS-SCAN-091
  name: insecure-cors-allow-any-origin
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:Access-Control-Allow-Origin|CORS_ORIGINS?|allow_origins?)\s*[=:]\s*["']\*["'](?!.*(?:Access-Control-Allow-Credentials:\s*false|credentials\s*=\s*[Ff]alse))
  - (?i)(?:cors|CORS)\s*\(.*origins?\s*=\s*["']\*["'].*credentials\s*=\s*True
  - (?i)response\[.*(?:Access-Control-Allow-Origin).*\]\s*=\s*req(?:uest)?\.headers?\.(?:Origin|origin|Host)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.php'
  message: 'Insecure CORS: wildcard origin combined with credentials, or origin reflected from request header'
  description: 'CORS misconfiguration (CWE-942) is a top LLM-generated API security flaw. LLMs setting Access-Control-Allow-Origin:
    * together with credentials: true (not allowed by spec but generated) or reflecting the Origin header without validation
    effectively disable the same-origin policy. SeCodePLT (Nie 2025) covers cross-origin policy failures in generated REST
    APIs.'
  remediation: 'Never use wildcard origin with credentials. Validate Origin against an explicit allowlist and reflect only
    allowed origins. Set Access-Control-Allow-Credentials: false for public APIs.'
  owasp_llm: LLM02:2025
  cwe: CWE-942
- id: MEDUSA-CGS-SCAN-092
  name: missing-csrf-protection-state-changing-requests
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)@(?:app|router)\.(?:post|put|delete|patch)\s*\([^)]+\)\s*\n(?:(?!.*(?:csrf|CSRFProtect|@login_required.*csrf|csrf_token|X-CSRF-Token|SameSite|CSRF_EXEMPT)).){0,600}(?:def|function|async)
  - (?i)(?:session|user|account|password|email|profile).*(?:update|change|delete|modify)(?:(?!.*(?:csrf|_token|csrfmiddlewaretoken|X-CSRF|SameSite=Strict)).){0,500}(?:request\.form|req\.body|\$_POST)
  - (?i)form.*(?:action|method\s*=\s*["']POST)(?:(?!.*(?:csrf_token|csrf_field|CSRFInput|hidden.*csrf)).){0,500}</form>
  file_types:
  - '*.py'
  - '*.js'
  - '*.php'
  - '*.html'
  message: State-changing POST/PUT/DELETE endpoint lacks CSRF protection token
  description: CSRF vulnerabilities (CWE-352) are consistently generated by LLMs creating web forms and API endpoints. ChatPHP
    (Toth 2024) found 72% of GPT-4-generated PHP forms lacked CSRF tokens. LLMs typically add CSRF tokens only when explicitly
    prompted. SeCodePLT (Nie 2025) covers CWE-352 in its web security CWE suite.
  remediation: Use framework CSRF middleware (Flask-WTF CSRFProtect, Django CSRF middleware, express-csrf). Add SameSite=Strict
    to session cookies. Require custom request headers (X-Requested-With) for AJAX endpoints.
  owasp_llm: LLM02:2025
  cwe: CWE-352
- id: MEDUSA-CGS-SCAN-093
  name: regex-catastrophic-backtracking-redos
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)re\.(?:match|search|fullmatch|compile)\s*\([^)]*(?:\([^)]*\+\)[^)]*\+|\([^)]*\*\)[^)]*\*|\([^)]*\+\)[^)]*\{[0-9])
  - (?i)(?:email|url|ip|zip)_?(?:regex|pattern|re|regexp)\s*=\s*r["'](?:[^"']*\([^"']*[+*]\)[^"']*[+*][^"']*)
  - (?i)(?:/[^/]*(?:\([^)]*[+*]\)[^/]*){2,}[+*]/|new\s+RegExp\s*\([^)]*(?:\([^)]*[+*]\)[^)]*){2,}[+*])
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: Potentially catastrophic ReDoS regex pattern with nested quantifiers detected
  description: ReDoS (CWE-1333) arises from LLM-generated regex patterns with nested quantifiers that cause exponential backtracking
    on crafted inputs. LLMs frequently generate complex email-validation and URL-parsing regexes that are vulnerable. SeCodePLT
    (Nie 2025) covers CWE-1333. An attacker can cause denial of service with a carefully crafted ~100-character input.
  remediation: Test regexes against ReDoS checkers (regexploit, safe-regex). Use possessive quantifiers or atomic groups where
    available. Limit input length before regex application. Consider non-backtracking RE2/RE2J libraries.
  owasp_llm: LLM04:2025
  cwe: CWE-1333
- id: MEDUSA-CGS-SCAN-094
  name: hardcoded-secret-environment-override
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)(?:SECRET_KEY|API_KEY|DATABASE_URL|JWT_SECRET|AWS_SECRET|OPENAI_API_KEY)\s*=\s*(?:os\.environ\.get\s*\([^,)]+,\s*["'][^"']{8,}["']\)|os\.getenv\s*\([^,)]+,\s*["'][^"']{8,}["']\))
  - (?i)(?:os\.environ\.get|os\.getenv)\s*\([^)]+,\s*["'](?:password|secret|changeme|default|admin|test|dev|1234|letmein)[^"']*["']\)
  - (?i)(?:config|settings|app\.config)\[.*(?:SECRET|KEY|PASSWORD|TOKEN).*\]\s*=\s*(?:os\.environ\.get|os\.getenv)\s*\([^,)]+,\s*["'][^"']{6,}["']\)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Hardcoded fallback secret in os.environ.get() default — exposes secret if env var is missing
  description: A common LLM pattern is os.environ.get('SECRET_KEY', 'my-hardcoded-fallback') which exposes the secret in source
    code when the environment variable is not set. SeCodePLT (Nie 2025) covers CWE-798. CodeLMSec (Hajipour 2023) found this
    pattern in 45% of generated configuration files.
  remediation: 'Never use hardcoded fallbacks for security-critical environment variables. Raise an explicit error if the
    variable is missing: os.environ[''SECRET_KEY''] (raises KeyError). Use secret managers (AWS Secrets Manager, Vault) for
    production.'
  owasp_llm: LLM02:2025
  cwe: CWE-798
- id: MEDUSA-CGS-SCAN-095
  name: missing-tls-certificate-verification
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)requests?\.(?:get|post|put|delete|request)\s*\([^)]*verify\s*=\s*False
  - (?i)ssl\.create_default_context\s*\(\s*\).*check_hostname\s*=\s*False
  - (?i)(?:verify|ssl_verify|ssl_check|verify_ssl)\s*=\s*(?:False|false|0|no|off)
  - (?i)(?:curl_setopt|CURLOPT_SSL_VERIFYPEER)\s*,\s*(?:0|false|FALSE)
  - (?i)(?:TrustAllCerts|AllowUntrustedCertificate|IgnoreSSLErrors|InsecureSkipVerify)\s*[=:]\s*(?:true|True|1)
  file_types:
  - '*.py'
  - '*.php'
  - '*.js'
  - '*.go'
  - '*.java'
  message: TLS certificate verification disabled — vulnerable to man-in-the-middle attacks
  description: Disabling TLS certificate verification (CWE-295) is extremely common in LLM-generated code. LLMs add verify=False
    to silence SSL errors during development without noting the security consequence. SeCodePLT (Nie 2025) covers CWE-295.
    Disabling verification makes connections vulnerable to interception.
  remediation: Never set verify=False in production. Install the correct CA bundle or pin the server certificate. Use certifi
    for Python. If testing against a self-signed cert, configure a per-request trust anchor instead of disabling all verification.
  owasp_llm: LLM02:2025
  cwe: CWE-295
- id: MEDUSA-CGS-SCAN-096
  name: insecure-temp-file-predictable-path
  severity: MEDIUM
  category: code_gen_security
  patterns:
  - (?i)open\s*\(\s*["']/tmp/(?:temp|tmp|work|data|upload|session)[-_]?(?:\w*)["'].*["']w
  - (?i)(?:f|file)\s*=\s*open\s*\(\s*(?:f["']|["'])\s*/tmp/[^"']{1,30}["'].*["']w
  - (?i)/tmp/.*(?:request\.|user_|input|param|session_id|user_id)(?!.*(?:tempfile\.mkstemp|tempfile\.NamedTemporaryFile|tempfile\.mkdtemp))
  - (?i)tempfile\.mktemp\s*\(
  file_types:
  - '*.py'
  - '*.php'
  - '*.c'
  - '*.cpp'
  message: Insecure temp file with predictable path — symlink attack or race condition risk
  description: LLMs frequently generate temp file creation at predictable /tmp/ paths without using mkstemp() or NamedTemporaryFile
    (CWE-377). An attacker can pre-create a symlink at the predicted path to redirect writes to sensitive files. SeCodePLT
    (Nie 2025) covers CWE-377 (insecure temporary file). SecRepair (Islam 2024) includes race-condition temp file patterns
    in its C/C++ dataset.
  remediation: Use tempfile.mkstemp() or tempfile.NamedTemporaryFile(delete=False) for Python. Use tmpfile() in C. Never construct
    temp paths from predictable user-derived values. Set umask appropriately.
  owasp_llm: LLM02:2025
  cwe: CWE-377
- id: MEDUSA-CGS-SCAN-097
  name: unsafe-yaml-load-arbitrary-tags
  severity: CRITICAL
  category: code_gen_security
  patterns:
  - (?i)yaml\.load\s*\([^)]*\)(?!.*(?:Loader\s*=\s*yaml\.(?:Safe|Base)Loader|yaml\.safe_load))
  - (?i)yaml\.load\s*\([^,)]+,\s*Loader\s*=\s*yaml\.(?:FullLoader|UnsafeLoader|Loader)\s*\)
  - (?i)(?:ruamel\.yaml|pyyaml).*\.load\s*\([^)]*(?:Loader\s*=\s*(?:yaml\.FullLoader|yaml\.Loader)|\)(?!.*SafeLoader))
  file_types:
  - '*.py'
  message: yaml.load() with FullLoader or no Loader specified enables arbitrary Python object instantiation
  description: yaml.load() without SafeLoader (CWE-502) deserializes arbitrary Python objects including os.system calls via
    !!python/object/apply tags. This is one of the most common LLM-generated Python security vulnerabilities — CodeLMSec (Hajipour
    2023) found yaml.load without SafeLoader in 52% of generated YAML-parsing functions. SeCodePLT (Nie 2025) covers this
    CWE-502 variant explicitly.
  remediation: Always use yaml.safe_load() or yaml.load(data, Loader=yaml.SafeLoader). Use ruamel.yaml with safe=True. Apply
    bandit rule B506 to CI/CD pipelines.
  owasp_llm: LLM02:2025
  cwe: CWE-502
- id: MEDUSA-CGS-SCAN-098
  name: path-traversal-zipfile-extraction
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)zipfile\.ZipFile\s*\([^)]+\)\.extractall\s*\([^)]*(?:path|dest|directory|dir|output)(?!.*(?:abspath|realpath|strip|replace|normpath|startswith))
  - (?i)(?:tarfile|zipfile|ZipFile|TarFile).*(?:extractall|extract)\s*\([^)]*\)(?!.*(?:members|safe|validate|check|strip_components))
  - (?i)for.*(?:zipfile|tarfile).*:.*\n.*(?:os\.path\.join|open).*(?:member|name|filename|arcname)(?!.*(?:abspath|normpath|startswith|realpath))
  file_types:
  - '*.py'
  - '*.java'
  - '*.js'
  message: Zip/tar archive extraction without path sanitization — path traversal (Zip Slip) risk
  description: Zip Slip (CWE-22) occurs when archive members containing path traversal sequences (../../) are extracted without
    validation, overwriting arbitrary files. LLMs generating file-upload and archive-handling code routinely use ZipFile.extractall()
    without validating member paths. SeCodePLT (Nie 2025) and CodeLMSec (Hajipour 2023) both cover CWE-22 variants.
  remediation: 'Validate each archive member path: assert os.path.abspath(os.path.join(dest, member)).startswith(dest). Use
    dedicated safe extraction libraries. Normalize paths before writing.'
  owasp_llm: LLM02:2025
  cwe: CWE-22
- id: MEDUSA-CGS-SCAN-099
  name: missing-output-encoding-template-injection
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:Jinja2|jinja2|Environment).*autoescape\s*=\s*(?:False|false|0)
  - (?i)Template\s*\(\s*(?:user_input|request\.|req\.|param|input|\$_(?:GET|POST))(?!.*autoescape)
  - (?i)render_template_string\s*\(\s*(?:user_input|request\.|req\.|param|input|f["'].*\{)
  - (?i)(?:Handlebars|mustache|nunjucks|Twig).*(?:compile|render)\s*\(.*(?:user_input|request\.|req\.|param|input)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.php'
  message: 'Server-Side Template Injection (SSTI): user input rendered in template engine context'
  description: SSTI (CWE-94) allows arbitrary code execution via template syntax in user input passed to Jinja2 ({{7*7}}),
    Twig, or Handlebars. LLMs generating dynamic HTML generation with render_template_string() frequently pass user-controlled
    content directly to the template engine. SeCodePLT (Nie 2025) covers SSTI under CWE-94 in its evaluation suite.
  remediation: Never render user input as a template string. Use render_template() with static template files. Enable autoescape=True
    in Jinja2 Environment. Pre-compile templates at startup, not at request time.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-CGS-SCAN-100
  name: lm-codegen-vulnerability-benchmark-probing
  severity: HIGH
  category: code_gen_security
  patterns:
  - (?i)(?:generate|write|create)\s+(?:code|a\s+function)\s+(?:from|for)\s+(?:CWE-\d+|cwe\d+)\s+(?:scenario|test|benchmark|example|case)
  - (?i)(?:CWE-(?:89|79|78|22|502|611|94|121|787|416|476|190|131|129)).*(?:generate|write|create|implement).*(?:vulnerable|insecure|without\s+(?:fix|patch|mitigation))
  - (?i)(?:b3.benchmark|secodeplt|codelmsec|secrepair|chatphp|one.shot.patch).*(?:scenario|test|reproduce|replicate|baseline).*(?:generate|produce|write).*code
  - (?i)(?:vulnerable\s+code\s+sample|insecure\s+code\s+example)\s+for\s+(?:CWE|cwe)[-_]?\d+
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  - '*.json'
  message: 'LLM vulnerability benchmark probing: request to generate code for a specific CWE vulnerability scenario'
  description: Detects prompts referencing specific CWE IDs alongside code generation requests targeting known benchmark test
    suites (b3, SeCodePLT, CodeLMSec, SecRepair, ChatPHP). These queries probe LLM security guardrails using benchmark framing
    to extract vulnerability demonstrations. Bazinska et al. (2025) b3 and Nie et al. (2025) SeCodePLT show such probes achieve
    significant bypass rates against undefended models.
  remediation: Block code generation requests that explicitly reference CWE IDs as generation targets. Treat benchmark-named
    generation requests as adversarial. Apply security reminder in system prompt per SeCodePLT findings.
  owasp_llm: LLM01:2025
  cwe: CWE-693
