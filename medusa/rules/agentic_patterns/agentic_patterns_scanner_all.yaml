  - '*.sh'
  - '*.json'
  - '*.yaml'
  message: MCP tool server deployed without code signing verification. Unsigned tool
    servers cannot prove integrity; MCPSec (Hou et al. 2026) and MCPShield (Zhou et
    al. 2026) both require code signing as a foundational integrity control.
  description: 'Detects MCP tool server deployments bypassing code signing verification.
    Without code

    signing, tool servers cannot prove integrity against supply chain attacks or rug-pull

    modifications. MCPSec (Hou et al. 2026) and MCPShield (Zhou et al. 2026) both
    identify

    code signing as a foundational integrity control for MCP deployments. Description-code

    inconsistency affects 13% of 10,240 MCP servers analyzed.

