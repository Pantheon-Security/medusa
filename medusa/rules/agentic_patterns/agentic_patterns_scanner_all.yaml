- id: MEDUSA-AP-SCAN-097
  name: mcp-martingale-distortion-chain-depth-exceeded
  severity: medium
  category: information-fidelity
  patterns:
  - tool_call_depth.*[0-9]{2}
  - sequential_tools.*no_regrounding
  - call_chain_length.*exceeded
  - distortion_threshold.*breached
  - regrounding_skipped
  file_types:
  - '*.py'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Sequential MCP tool chain exceeds safe depth without re-grounding. Fan
    et al. 2026 (AAMAS) proved O(T) distortion growth; re-grounding every ~9 steps
    required to bound O(sqrt(T)) deviation accumulation.
  description: 'Detects agentic tool chains exceeding safe sequential depth (~9 steps)
    without re-grounding,

    per martingale distortion analysis. Fan et al. 2026 (AAMAS) proved linear O(T)
    distortion

    growth with O(sqrt(T)) high-probability deviations across sequential MCP tool
    interactions;

    re-grounding every ~9 steps is sufficient for error control (validated on Qwen2-7B,

    Llama-3-8B, Mistral-7B).

    '
  remediation: Implement automatic re-grounding every 9 sequential tool calls. Monitor
    tool chain depth and inject task re-anchoring context at defined intervals. Alert
    on chains exceeding safe depth thresholds.
  owasp_llm: LLM09
  cwe: CWE-20
