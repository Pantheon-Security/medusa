rules:
- id: MEDUSA-AP-SCAN-001
  name: mcp-tool-poisoning-hidden-instructions
  severity: CRITICAL
  category: agentic_patterns
  patterns:
  - (?i)tool_description.*inject
  - (?i)(tool|function).*description.*ignore.*previous
  - (?i)tool.*metadata.*execute.*without.*permission
  - (?i)<tool_description>.*[Ss]ystem.*[Pp]rompt
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ts'
  - '*.js'
  message: 'Potential MCP tool description poisoning: hidden instructions detected
    in tool metadata'
  description: 'Detects patterns indicative of MCP tool poisoning, where malicious
    instructions are

    embedded in tool descriptions to manipulate LLM behavior during the Planning phase.

    Song et al. (2025) demonstrated this attack end-to-end on 3 major MCP aggregation

    platforms. Hasan et al. (2025) found 5.5% of 1,899 real-world MCP servers exhibit

    tool poisoning patterns.

    '
  remediation: 'Implement ETDI (Bhatt et al. 2025): cryptographic signing of tool
    definitions via OAuth 2.0/JWT.

    Deploy SMCP (Hou et al. 2026) for protocol-level tool identity verification.

    Scan tool descriptions using static analysis (MCPDiFF, Li et al. 2026).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-20
- id: MEDUSA-AP-SCAN-002
  name: mcp-tool-description-code-inconsistency
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)tool.*description.*but.*actually
  - (?i)(privileged|admin|root|sudo).*tool.*description
  - (?i)tool.*name.*(?:read|get|fetch).*(?:write|delete|exec|shell|system)
  - (?i)description.*scope.*(?:read).*implementation.*(?:write|modify|delete|exec)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  message: 'Potential MCP tool description-code inconsistency: declared behavior may
    not match implementation'
  description: 'Detects tools where description declares limited scope (read-only,
    safe) but implementation

    patterns suggest broader or privileged operations. Li et al. (2026) found ~13%
    of 10,240

    real-world MCP servers exhibit substantial description-code mismatches, including

    undocumented privileged operations, hidden state mutations, and unauthorized financial
    actions.

    '
  remediation: 'Run MCPDiFF static analysis to compare tool descriptions against code
    (Li et al. 2026).

    Enforce 6-component tool description quality standard (Hasan et al. 2026).

    Require code review and description accuracy attestation before MCP server deployment.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-116
- id: MEDUSA-AP-SCAN-003
  name: mcp-rug-pull-missing-version-pin
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)mcp.*server.*(?:url|endpoint).*(?!version)
  - (?i)install.*mcp.*server.*(?!hash|checksum|version|pin)
  - (?i)load_tool.*dynamic.*(?!verify|sign|check)
  - (?i)tool.*definition.*update.*(?!approved|signed|verified)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  - '*.lock'
  message: MCP server loaded without version pinning or integrity check — vulnerable
    to Rug Pull attacks
  description: 'Detects MCP server configurations that load tool definitions without
    version pinning,

    cryptographic integrity checks, or signed definitions. Bhatt et al. (2025) formalized

    Rug Pull attacks where MCP servers initially present benign definitions then silently

    update to malicious versions after trust is established. Song et al. (2025) demonstrated

    this end-to-end on major MCP platforms.

    '
  remediation: 'Implement ETDI immutable versioned tool definitions (Bhatt et al.
    2025): pin tool definitions

    to specific cryptographically-signed versions requiring re-approval for any change.

    Use SMCP (Hou et al. 2026) supply-chain protections with version integrity enforcement.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-494
- id: MEDUSA-AP-SCAN-004
  name: tool-result-prompt-injection-pattern
  severity: CRITICAL
  category: agentic_patterns
  patterns:
  - (?i)tool_result.*(?:ignore|forget|disregard).*(?:instruction|system|previous)
  - (?i)(?:web_search|fetch_url|read_file).*result.*inject
  - (?i)retrieved.*content.*(?:act as|you are now|new instruction)
  - (?i)tool.*output.*(?:override|supersede).*(?:system prompt|instructions)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  - '*.md'
  message: Potential prompt injection via tool result content detected
  description: 'Detects patterns where tool results contain instructions designed
    to override agent behavior.

    Beurer-Kellner et al. (2025) documented prompt injection through tool results
    as a primary

    attack vector enabling data exfiltration, privilege escalation, and remote code
    execution.

    Radosevich & Halloran (2025) demonstrated successful injection against Claude
    3.7 and

    Llama-3.3-70B using simple prompt modifications that bypass safety guardrails.

    '
  remediation: 'Implement dual-agent isolation: separate data processing from action
    execution (Beurer-Kellner 2025).

    Apply output sanitization to strip embedded instructions from tool results.

    Deploy MCPShield pre-invocation probing (Zhou et al. 2026) to detect semantic
    misalignment.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-77
- id: MEDUSA-AP-SCAN-005
  name: agentic-indirect-prompt-injection-in-retrieved-content
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)(?:document|page|email|file).*content.*(?:you must|assistant.*must|always.*execute)
  - (?i)retrieved.*(?:text|html|markdown).*(?:\[INST\]|<system>|<<SYS>>)
  - (?i)search.*result.*(?:ignore previous|new task|execute command)
  - (?i)user.*content.*(?:tool_call|function_call|invoke)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.html'
  - '*.md'
  - '*.json'
  message: Indirect prompt injection detected in content processed by LLM agent
  description: 'Detects adversarial instructions embedded in content that agents retrieve
    and process

    (documents, web pages, emails, search results). Beurer-Kellner et al. (2025) identify

    this as the primary vector for real-world prompt injection attacks with consequences

    including data exfiltration and privilege escalation.

    '
  remediation: 'Implement minimal footprint pattern: restrict agents to minimum tool
    permissions per task.

    Apply content sanitization before feeding retrieved content to agent context.

    Use privilege-separated agent architecture where retrieval agents cannot invoke
    action agents.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-AP-SCAN-006
  name: excessive-mcp-tool-permissions
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)tools.*=.*\[.*(?:exec|shell|system|subprocess|eval).*(?:read|write|delete|net)
  - (?i)agent.*permissions.*=.*\[.*"\*"\]
  - (?i)allow_all_tools.*=.*[Tt]rue
  - (?i)tool_access.*=.*(?:unrestricted|unlimited|full)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: Agent configured with excessive tool permissions — violates minimal footprint
    principle
  description: 'Detects agent configurations granting broad or unrestricted tool access.
    Errico et al. (2025)

    identify over-delegated agents as a primary adversary category in MCP deployments.
    Beurer-Kellner

    et al. (2025) formalize the minimal footprint pattern: agents should only have
    tools strictly

    necessary for their declared task. Narajala & Habler (2025) formalize Zero Trust
    Architecture

    for MCP requiring least-privilege tool access.

    '
  remediation: 'Apply minimal footprint pattern: enumerate only required tools per
    agent/task (Beurer-Kellner 2025).

    Implement ZTA (Zero Trust Architecture) for MCP: verify all tool calls regardless
    of source (Narajala 2025).

    Use SMCP policy enforcement for fine-grained tool access control (Hou et al. 2026).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-250
- id: MEDUSA-AP-SCAN-007
  name: agent-action-without-human-oversight
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)auto.*confirm.*=.*[Tt]rue
  - (?i)(?:skip|bypass|disable).*(?:human|approval|confirmation|review)
  - (?i)autonomous.*(?:execute|deploy|delete|modify).*without.*confirmation
  - (?i)agent.*(?:irreversible|destructive|financial).*action.*(?!confirm|approve|review)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.config'
  message: Agent configured to execute high-risk actions without human oversight
  description: 'Detects configurations where agents autonomously execute potentially
    irreversible or

    high-impact actions without human confirmation. Borghoff (2025) identifies agentic
    systems

    designed to minimize human interruptions as creating blind spots in oversight.
    OWASP LLM06:2025

    (Excessive Agency) specifically covers autonomous action execution risks.

    '
  remediation: 'Implement confirmatory human-in-the-loop for high-risk actions (Beurer-Kellner
    2025).

    Classify action risk levels; require explicit confirmation for irreversible/financial/system
    actions.

    Apply NIST AI RMF human oversight requirements for agentic AI systems.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-306
- id: MEDUSA-AP-SCAN-008
  name: mcp-unverified-server-installation
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)(?:install|add|load).*mcp.*server.*(?!verified|signed|approved|trusted)
  - (?i)mcp.*server.*community.*(?!audit|review|vetted)
  - (?i)mcpServers.*(?:url|command).*(?!hash|verify|checksum)
  - (?i)npx.*@(?!anthropic|official).*mcp
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.toml'
  - '*.config'
  - '*.py'
  message: MCP server loaded from unverified source without integrity check
  description: 'Detects MCP server installations from unverified or community sources
    without integrity

    verification. Song et al. (2025) successfully uploaded malicious MCP servers to
    3 major

    aggregation platforms and showed users routinely install them without detecting
    malicious

    intent (user study, n=20). Errico et al. (2025) recommend private registry / gateway
    layer

    as primary supply-chain defense.

    '
  remediation: 'Use private MCP server registry with mandatory security review before
    agent installation (Errico 2025).

    Verify server cryptographic signatures before installation (ETDI, Bhatt et al.
    2025).

    Pin to specific reviewed versions; never auto-update MCP servers without re-review.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-829
- id: MEDUSA-AP-SCAN-009
  name: mcp-missing-tool-authentication
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)mcp.*client.*(?!auth|token|oauth|jwt|credential)
  - (?i)server.*tool.*call.*(?!authenticated|authorized|verified)
  - (?i)transport.*stdio.*(?!auth|secure)
  - (?i)mcp.*connection.*no.*authentication
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ts'
  message: MCP connection configured without authentication — vulnerable to unauthorized
    tool invocation
  description: 'Detects MCP client/server configurations lacking authentication mechanisms.
    Standard MCP

    specification has no mandatory authentication primitives (Bhatt et al. 2025; Hou
    et al. 2025),

    making all connected tools implicitly trusted. SMCP (Hou et al. 2026) adds mandatory
    mutual

    authentication as a protocol-level security improvement.

    '
  remediation: 'Implement OAuth 2.0 / JWT authentication for MCP connections (Bhatt
    et al. 2025, ETDI).

    Deploy SMCP unified identity management and mutual authentication (Hou et al.
    2026).

    Apply per-user authentication with scoped authorization (Errico et al. 2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-306
- id: MEDUSA-AP-SCAN-010
  name: multi-agent-implicit-trust-chain
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)agent.*output.*(?:directly|immediately).*(?:pass|send|forward).*(?:next|downstream|sub)
  - (?i)orchestrator.*(?:trust|accept).*sub.*agent.*output.*(?!verify|validate|check)
  - (?i)agent.*result.*(?:execute|run|call).*(?!sanitize|validate|check)
  - (?i)agent.*chain.*(?!validation|verify|filter)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Implicit trust chain detected in multi-agent pipeline — no output validation
    between agents
  description: 'Detects multi-agent pipelines that pass outputs between agents without
    validation.

    Miao et al. (2025) demonstrate that propagation vulnerability in MAS allows a
    single

    compromised agent to distort collective decision-making. Cemri et al. (2025) identify

    Task Derailment (8.2%) and Information Withholding (8.2%) as common inter-agent

    misalignment failure modes in MAST taxonomy, exploitable by attackers.

    '
  remediation: 'Validate agent outputs before passing to downstream agents (MAST-based
    monitoring, Cemri 2025).

    Deploy BlindGuard unsupervised anomaly detection for inter-agent message passing
    (Miao 2025).

    Implement privilege-separated agent architecture with explicit trust boundaries.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-346
- id: MEDUSA-AP-SCAN-011
  name: mas-error-propagation-dense-topology
  severity: MEDIUM
  category: agentic_patterns
  patterns:
  - (?i)fully.*connected.*agents?.*topology
  - (?i)all.*agents.*communicate.*(?:directly|each other)
  - (?i)broadcast.*(?:message|output|result).*all.*agents
  - (?i)mesh.*topology.*(?:agent|llm|model)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.config'
  message: Fully-connected MAS topology detected — maximum error and attack propagation
    surface
  description: 'Detects fully-connected multi-agent communication topologies with
    maximum propagation risk.

    Shen et al. (2025) demonstrate via causal analysis that dense topologies show
    worst error

    propagation: a single compromised agent''s output rapidly reaches all other agents.

    Moderately sparse topologies balance error suppression and information diffusion
    (EIB-LEARNER).

    '
  remediation: 'Use moderately sparse communication topology instead of fully-connected
    (Shen et al. 2025, EIB-LEARNER).

    Implement communication filtering at topology edges to prevent direct injection
    propagation.

    Apply BlindGuard anomaly detection for inter-agent message monitoring (Miao et
    al. 2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-400
- id: MEDUSA-AP-SCAN-012
  name: mas-memory-poisoning-vulnerable-access
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)(?:memory|vector_store|knowledge_base).*(?:write|update|insert).*agent.*(?!validated|sanitized)
  - (?i)shared.*memory.*(?:all|any).*agent.*(?:write|modify)
  - (?i)memory.*(?:append|store).*(?:tool_result|external|retrieved)
  - (?i)episodic.*memory.*(?!validated|checked|filtered)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Shared agent memory writable by external inputs without validation — memory
    poisoning risk
  description: 'Detects patterns where shared agent memory is writable by external
    tool results or

    multiple agents without validation. Miao et al. (2025) identify Memory Poisoning
    Attack (MA)

    as one of three primary attack types on LLM-based MAS alongside prompt injection
    and tool

    exploitation. BlindGuard detects but does not prevent memory poisoning in unsupervised
    mode.

    '
  remediation: 'Validate all content before writing to shared agent memory stores.

    Implement write-access controls: only designated trusted agents can modify shared
    memory.

    Deploy BlindGuard for memory poisoning detection (Miao et al. 2025).

    Apply provenance tracking to all memory writes for forensic attribution (Errico
    et al. 2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-915
- id: MEDUSA-AP-SCAN-013
  name: react-planning-without-action-validation
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)(?:thought|reasoning).*action.*(?:directly|immediately).*execute
  - (?i)react.*(?:action|tool_call).*(?!validated|checked|verified|approved)
  - (?i)chain.*of.*thought.*(?:execute|run|call).*(?!confirm|verify)
  - (?i)(?:plan|strategy).*generated.*execute.*(?!validation|review)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: ReAct agent executing actions from reasoning without validation step
  description: 'Detects ReAct-pattern agents that execute actions directly from reasoning
    without validation.

    Dhayakar (2025) identifies unchecked ReAct as vulnerable to reasoning injection
    attacks.

    Adversarial inputs can manipulate the reasoning-action chain to produce unauthorized
    actions.

    '
  remediation: 'Add action validation layer between reasoning and execution in ReAct
    pipeline.

    Implement action risk classification; require confirmation for high-risk action
    types.

    Use privilege-separated architecture: reasoning agent cannot directly invoke action
    tools.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-20
- id: MEDUSA-AP-SCAN-014
  name: agentic-task-specification-override
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)(?:new task|updated instruction|override.*goal|change.*objective)
  - (?i)agent.*(?:disobey|ignore|disregard).*(?:task|objective|goal).*specification
  - (?i)(?:system prompt|initial instruction).*(?:replaced|overridden|updated)
  - (?i)task.*specification.*(?!locked|immutable|fixed|protected)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Agent task specification potentially overridable — Disobey Task Specification
    pattern
  description: 'Detects patterns where agent task specifications can be overridden
    mid-execution.

    Cemri et al. (2025) identify Disobey Task Specification as the most prevalent
    MAS failure

    mode at 15.7% natural occurrence across 1,642 real-world traces; exploitable via
    injection

    of conflicting instructions. MAST taxonomy documents 14 failure modes with security
    implications.

    '
  remediation: 'Lock task specifications at agent initialization; prevent runtime
    modification.

    Implement task specification integrity checks throughout agent lifecycle.

    Monitor for MAST failure modes using LLM-as-a-Judge pipeline (Cemri et al. 2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-20
- id: MEDUSA-AP-SCAN-015
  name: mcp-credential-theft-via-filesystem-tools
  severity: CRITICAL
  category: agentic_patterns
  patterns:
  - (?i)(?:read_file|file_read|open_file).*(?:\.env|credentials|secrets?|token|api_key|passwd|password)
  - (?i)(?:filesystem|file_system).*tool.*(?:home|config|ssh|aws|gcp|azure)
  - (?i)list.*dir.*(?:\~|/home|/root|/etc|C:\\Users)
  - (?i)(?:env|environ).*(?:read|get|list).*(?:secret|key|token|credential|password)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.config'
  message: MCP filesystem tool access pattern targeting credential or secret files
  description: 'Detects MCP filesystem tool usage patterns targeting credential files,
    secrets, and

    environment variables. Radosevich & Halloran (2025) demonstrated credential theft
    as

    one of three successful MCP exploits against Claude 3.7 and Llama-3.3-70B: agents

    coerced to read .env files, API keys, SSH credentials via standard MCP filesystem
    tools.

    '
  remediation: 'Restrict MCP filesystem tools from accessing credential directories
    (.ssh, .aws, .env).

    Implement containerized sandboxing with I/O checks for all MCP filesystem operations
    (Errico 2025).

    Apply inline DLP to detect credential patterns in MCP tool outputs.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-312
- id: MEDUSA-AP-SCAN-016
  name: mcp-remote-access-control-tool-pattern
  severity: CRITICAL
  category: agentic_patterns
  patterns:
  - (?i)(?:shell|bash|cmd|powershell|exec|subprocess).*tool.*(?:mcp|agent)
  - (?i)(?:nc|netcat|socat|curl.*pipe|wget.*pipe).*(?:tool|mcp|agent)
  - (?i)(?:reverse.*shell|bind.*shell|remote.*access).*(?!test|demo|lab)
  - (?i)(?:ssh|rdp|telnet).*(?:tool|invoke|call).*(?!approved|sandboxed|isolated)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: MCP tool pattern enabling remote access control or code execution detected
  description: 'Detects MCP tool configurations or usage patterns that could enable
    remote access control

    or malicious code execution. Radosevich & Halloran (2025) demonstrated malicious
    code

    execution and remote access control as two of three MCP attack types against production

    LLMs (Claude 3.7, Llama-3.3-70B). Multi-MCP server attacks can combine these capabilities.

    '
  remediation: 'Remove or isolate shell/exec MCP tools from production agent deployments.

    Apply strict sandboxing for any MCP tools with execution capabilities.

    Use McpSafetyScanner to audit MCP server security before deployment (Radosevich
    2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-78
- id: MEDUSA-AP-SCAN-017
  name: mcp-data-exfiltration-via-network-tools
  severity: CRITICAL
  category: agentic_patterns
  patterns:
  - (?i)(?:http_request|fetch_url|post_data).*(?:tool|invoke).*(?:secret|key|token|credential|password|private)
  - (?i)(?:webhook|callback).*(?:data|result|output).*external
  - (?i)send.*(?:file|document|data).*(?:external|remote).*(?!user.*approv|confirm)
  - (?i)(?:upload|exfil|transfer).*(?:sensitive|private|internal|confidential).*(?:tool|agent)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Potential data exfiltration pattern via MCP network tools
  description: 'Detects patterns where MCP network tools transmit sensitive data to
    external endpoints.

    Errico et al. (2025) identify data-driven exfiltration as a primary MCP attack
    vector.

    Radosevich & Halloran (2025) demonstrate credential theft exfiltration via MCP
    tools.

    Cross-system privilege escalation chains can reach sensitive data then exfiltrate
    it.

    '
  remediation: 'Implement inline DLP on all MCP tool outputs going to external endpoints
    (Errico 2025).

    Whitelist approved external endpoints for MCP network tools.

    Require human confirmation before any outbound data transfer via agent.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-AP-SCAN-018
  name: mcp-cross-server-privilege-escalation
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)server.*(?:A|1|low).*(?:call|invoke|access).*server.*(?:B|2|admin|high|privileged)
  - (?i)(?:tool_chain|chain_of_tools).*(?:escalate|elevate|promote).*(?:permission|access|privilege)
  - (?i)agent.*(?:use|invoke).*tool.*from.*(?:different|another|second).*server.*(?!authorized)
  - (?i)multi.*server.*(?:compose|combine|chain).*tool.*(?!permission|auth|check)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Cross-server privilege escalation pattern in MCP multi-server deployment
  description: 'Detects patterns enabling privilege escalation across multiple MCP
    servers. Errico et al.

    (2025) identify cross-system privilege escalation as a primary MCP threat. Radosevich
    &

    Halloran (2025) demonstrate a novel multi-MCP server attack combining remote access
    control

    and credential theft across server boundaries. Standard MCP lacks cross-server
    trust

    boundaries enforced by security context propagation.

    '
  remediation: 'Implement SMCP security context propagation across multi-server deployments
    (Hou et al. 2026).

    Enforce explicit authorization for cross-server tool invocations.

    Apply ZTA: verify all cross-server calls regardless of initiating server trust
    level (Narajala 2025).

    '
  owasp_llm: LLM06:2025
  cwe: CWE-269
- id: MEDUSA-AP-SCAN-019
  name: hierarchical-agent-planning-injection
  severity: HIGH
  category: agentic_patterns
  patterns:
  - (?i)planning.*agent.*(?:orchestrate|assign|dispatch).*sub.*agent.*(?!validated|verified)
  - (?i)orchestrator.*(?:decompose|split).*task.*(?:worker|executor|agent).*(?!sanitized|checked)
  - (?i)high.*level.*agent.*(?:instruction|command).*(?:execute|run).*(?!approval|confirm)
  - (?i)manager.*agent.*(?!validate|check|review).*(?:tool|action|execute)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
