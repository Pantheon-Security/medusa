  name: mcp-database-result-injection
  severity: high
  category: indirect-injection
  patterns:
  - db_result.*ignore above
  - query_result.*system message
  - sql_row.*override
  - record_value.*new task
  - table_data.*you are now
  file_types:
  - '*.py'
  - '*.ts'
  - '*.sql'
  - '*.json'
  message: Prompt injection payload embedded in database query result returned to
    MCP agent. Adversarially crafted DB records inject instructions into agent context
    (He et al. 2025 survey; RAG-augmented agents).
  description: 'Detects database query results containing embedded instruction payloads
    returned to MCP

    agents. Adversarially crafted database records can inject instructions into agent
    context

    when retrieved. Particularly dangerous in RAG-augmented agents with SQL tool access,

    as documented in He et al. 2025 security survey.

    '
  remediation: Apply injection-aware escaping to database query results before agent
    consumption. Implement content filtering on retrieved database values. Isolate
    structured data from instruction context in agent prompts.
