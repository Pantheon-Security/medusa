  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:prevHash|cumHash).{0,40}(?:ignore|skip|drop|pass|#)
  - (?i)\bif\s+(?:not\s+)?(?:prevHash|cumHash)\s*(?:==|!=|is None|is not None)
