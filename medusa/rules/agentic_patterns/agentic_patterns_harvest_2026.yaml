version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: agentic_patterns
rules:
- id: MEDUSA-APAT-SCAN-001
  name: mas-agent-fault-recovery-state-unauthenticated-store
  description: Detects MAS agent state being restored from Cassandra or etcd after
    a fault/restart without access control or integrity validation. In fault-tolerant
    MAS architectures like cloneMAP, agents reload their pre-failure state from distributed
    storage on restart; an attacker with write access to this store can inject poisoned
    state that executes on recovery.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:cassandra|etcd).*(?:restore|recover|reload|resume).*(?:agent|agency).*(?:state|config)
  - (?i)(?:agent|agency).*(?:state|config).*(?:restore|recover|reload|resume).*(?:cassandra|etcd|distributed|key.?value)
  file_types:
  - '*.py'
  - '*.go'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.toml'
  message: 'Detected: mas-agent-fault-recovery-state-unauthenticated-store'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-494
  mitre_attack: T1565.001
  source_paper: 'Dähling et al. (2021) -- Enabling scalable and fault-tolerant multi-agent
    system | Dähling 2021 - cloneMAP architecture: agents restore state from Cassandra/etcd
    on Kubernetes-triggered restart (Sect 3.6). No authentication or integrity check
    on recovered state described.'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-002
  name: mqtt-mas-iot-bridge-allow-anonymous
  description: Detects MQTT broker configured with allow_anonymous=true in MAS-IoT
    bridge deployments. In cloud-native MAS architectures (e.g. cloneMAP using Eclipse
    Mosquitto), an unauthenticated MQTT broker allows any node to publish commands
    to IoT actuators or inject fabricated sensor data into agent decision loops.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)allow_anonymous\s*(?:true|yes|1)
  - (?i)(?:mosquitto|mqtt).*(?:broker|server)
  file_types:
  - '*.conf'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.toml'
  - '*.cfg'
  message: 'Detected: mqtt-mas-iot-bridge-allow-anonymous'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08:2025
  cwe: CWE-306
  mitre_attack: T1557
  source_paper: Dähling et al. (2021) -- Enabling scalable and fault-tolerant multi-agent
    system | Dähling 2021 - cloneMAP IoT-Interface uses Eclipse Mosquitto MQTT broker
    for agent-device communication (Sect 3.7). No authentication requirements stated;
    publish-subscribe allows n:m device-agent patterns, expanding attack surface.
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-003
  name: mas-etcd-agent-config-no-tls
  description: Detects etcd clusters used to store MAS agent/AMS configuration without
    TLS endpoints. Cloud-native MAS platforms store the entire agent lifecycle state
    (assignments, addresses, configurations) in etcd; unencrypted etcd allows an attacker
    to enumerate all agent addresses and modify assignments to redirect inter-agent
    messages.
  severity: critical
  category: agentic_patterns
  patterns:
  - (?i)etcd.*endpoint.*http://(?!127\.0\.0\.1|localhost)
  - (?i)(?:etcd|etcdctl).*(?:--insecure|no.?tls|insecure.?transport|insecure.?skip)
  file_types:
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.toml'
  - '*.go'
  - '*.py'
  - '*.sh'
  message: 'Detected: mas-etcd-agent-config-no-tls'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-319
  mitre_attack: T1040
  source_paper: Dähling et al. (2021) -- Enabling scalable and fault-tolerant multi-agent
    system | Dähling 2021 - cloneMAP AMS stores all agent configuration and addresses
    in etcd cluster (Sect 3.4); DF also uses same etcd cluster for service registry.
    Compromise of etcd yields full agent topology.
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-004
  name: autogen-human-input-never-no-oversight
  description: AutoGen agent configured with human_input_mode='NEVER', removing all
    human oversight from agent decisions and code execution. Combined with code_execution_config,
    creates fully autonomous unreviewed execution path.
  severity: high
  category: agentic_patterns
  patterns:
  - (?i)human_input_mode\s*=\s*["']NEVER["']
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: autogen-human-input-never-no-oversight'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-306
  mitre_attack: T1059
  source_paper: 'Wu et al. (2023) -- AutoGen: Enabling Next-Gen LLM Applications via
    Multi-A | AutoGen paper (Wu et al. 2023) - UserProxyAgent human_input_mode=''NEVER''
    disables human-in-the-loop; ethics section explicitly flags autonomous code execution
    as risky'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-005
  name: autogen-code-execution-dict-config-enabled
  description: AutoGen code_execution_config set to a dict (not False), enabling automatic
    execution of LLM-generated code including pip install commands. AutoGen's UserProxyAgent
    executes whatever code the LLM produces when this is enabled.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)code_execution_config\s*=\s*\{
  file_types:
  - '*.py'
  message: 'Detected: autogen-code-execution-dict-config-enabled'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-94
  mitre_attack: T1059.006
  source_paper: 'Wu et al. (2023) -- AutoGen: Enabling Next-Gen LLM Applications via
    Multi-A | AutoGen paper (Wu et al. 2023) - UserProxyAgent auto-executes code from
    LLM responses; ethics section: ''allowing LLM agents to make changes in external
    environments through code execution or function calls, such as installing packages,
    could be risky'''
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-006
  name: autogen-max-consecutive-auto-reply-unbounded
  description: AutoGen max_consecutive_auto_reply set to None or a very large value
    (100+), enabling near-unbounded agent reply loops that can exhaust compute, context
    windows, and API budgets without human intervention.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)max_consecutive_auto_reply\s*=\s*(?:None|[1-9][0-9]{2,})
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: autogen-max-consecutive-auto-reply-unbounded'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-400
  mitre_attack: null
  source_paper: 'Wu et al. (2023) -- AutoGen: Enabling Next-Gen LLM Applications via
    Multi-A | AutoGen paper (Wu et al. 2023) - auto-reply mechanism repeats until
    termination condition or max_consecutive_auto_reply; setting high/None allows
    unbounded loops'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-007
  name: autogen-register-reply-position-zero-bypass
  description: AutoGen register_reply() with position=0 inserts a custom reply function
    before all default safety reply functions, potentially bypassing built-in safety
    checks and code validation.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)\.register_reply\s*\([^)]*position\s*=\s*0\s*[,)]
  - (?i)\.register_reply\s*\([^,]+,[^,]+,[^,]+,\s*0\s*\)
  file_types:
  - '*.py'
  message: 'Detected: autogen-register-reply-position-zero-bypass'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-284
  mitre_attack: null
  source_paper: 'Wu et al. (2023) -- AutoGen: Enabling Next-Gen LLM Applications via
    Multi-A | AutoGen paper (Wu et al. 2023) - register_reply() function accepts a
    position parameter; position=0 inserts before all default reply functions, circumventing
    built-in safety mechanisms'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-008
  name: autogen-groupchat-llm-auto-speaker-selection
  description: AutoGen GroupChatManager configured with LLM-only automatic speaker
    selection. Attackers can inject instructions into the shared group chat context
    to redirect which agent speaks next, hijacking conversation flow.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)speaker_selection_method\s*=\s*["']auto["']
  - (?i)GroupChatManager\s*\([^)]*speaker_selection_method\s*=\s*["']auto["']
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: autogen-groupchat-llm-auto-speaker-selection'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM09
  cwe: CWE-610
  mitre_attack: null
  source_paper: 'Wu et al. (2023) -- AutoGen: Enabling Next-Gen LLM Applications via
    Multi-A | AutoGen paper (Wu et al. 2023, Section 2.2 and A5) - GroupChatManager
    uses role-play style prompt for LLM-based speaker selection; shared context manipulation
    can redirect which agent is selected'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-009
  name: web-agent-dom-content-unsanitized-llm-feed
  description: DOM or accessibility tree content is passed directly into LLM messages/prompts
    without sanitization in a web agent context. Enables indirect prompt injection
    via malicious web page content - attacker controls DOM, agent reads it, LLM executes
    embedded instructions.
  severity: high
  category: agentic_patterns
  patterns:
  - (?i)(?:message|prompt|content)\s*[=+]\s*[^\n]{0,80}(?:get_dom|dom_content|page_content|accessibility_tree|distill_dom)\s*\(
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: web-agent-dom-content-unsanitized-llm-feed'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-116
  mitre_attack: T1059
  source_paper: 'Abuelsaad et al. (2024) -- Agent-E: From Autonomous Web Navigation
    to Foundational | Abuelsaad et al. 2024 Agent-E: DOM distillation feeding LLM
    without sanitization creates indirect prompt injection surface via web page content'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-010
  name: web-agent-autogen-playwright-autonomous-mode
  description: Autogen-based web agent using Playwright in autonomous mode with human_input_mode
    disabled. Matches Agent-E-style architecture operating without human oversight,
    enabling unchecked browser automation based on LLM decisions reading attacker-controlled
    web content.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)human_input_mode\s*=\s*['"]NEVER['"]
  - (?i)(?:ask_user|human_in_loop|human_input)\s*=\s*(?:False|false|0|None|disabled)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: web-agent-autogen-playwright-autonomous-mode'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-284
  mitre_attack: null
  source_paper: 'Abuelsaad et al. (2024) -- Agent-E: From Autonomous Web Navigation
    to Foundational | Abuelsaad et al. 2024 Agent-E: autonomous mode disables ask_user
    skill; agent acts on all LLM decisions including those influenced by malicious
    web content'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-011
  name: web-agent-mutation-observer-llm-feedback-unsanitized
  description: MutationObserver or DOM change detection results fed as linguistic
    feedback to LLM without content filtering. In Agent-E's change observation pattern,
    DOM mutations after each action are converted to text and returned to the LLM
    - a malicious page can craft mutations to inject adversarial instructions into
    this feedback channel.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:MutationObserver|mutation_observer|observe_mutations|dom_changes|page_mutation)[\s\S]{0,150}(?:message|prompt|feedback|response|result|content)[\s\S]{0,50}(?:llm|agent|chat|assistant)
  - (?i)(?:change_observation|observe_change|action_feedback|state_change_feedback)\s*=[^\n]{0,100}(?:get_dom|page|element|node)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: web-agent-mutation-observer-llm-feedback-unsanitized'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-116
  mitre_attack: T1059
  source_paper: 'Abuelsaad et al. (2024) -- Agent-E: From Autonomous Web Navigation
    to Foundational | Abuelsaad et al. 2024 Agent-E: change observation feeds DOM
    mutation events as linguistic feedback to LLM - adversarial pages can craft mutations
    to hijack agent behavior'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-012
  name: web-agent-hierarchical-navigator-fresh-context-no-validation
  description: Browser navigation sub-agent instantiated with fresh/empty context
    per sub-task with no shared history with planner, and planner trusts output without
    re-validation. Matches Agent-E nested chat pattern where navigator has no memory
    of prior steps, making it vulnerable to per-sub-task context manipulation.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:nested_chat|register_nested_chats|initiate_chat)[\s\S]{0,200}(?:clear_history|fresh|reset|new.*instance)
  - (?i)(?:browser_nav|navigator|web_agent)\s*=\s*(?:ConversableAgent|AssistantAgent|UserProxyAgent)\s*\(
  file_types:
  - '*.py'
  - '*.yaml'
  message: 'Detected: web-agent-hierarchical-navigator-fresh-context-no-validation'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-346
  mitre_attack: null
  source_paper: 'Abuelsaad et al. (2024) -- Agent-E: From Autonomous Web Navigation
    to Foundational | Abuelsaad et al. 2024 Agent-E: browser navigation agent freshly
    instantiated per sub-task with no prior context; planner delegates and trusts
    output without re-validation'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-013
  name: web-agent-mmid-attribute-conflict-injection
  description: Web agent injects custom mmid identifier attributes into all DOM elements
    for action targeting. An attacker can craft pages with pre-set mmid-like attributes
    or conflicting identifiers to confuse the agent's element targeting logic and
    redirect actions to unintended elements.
  severity: low
  category: agentic_patterns
  patterns:
  - (?i)(?:data-mmid|mmid)\s*=\s*['"]?[0-9]+
  - (?i)(?:set|add|inject)\s*[^\n]{0,40}(?:attribute|attr)\s*[^\n]{0,40}(?:mmid|mm_id|mm-id)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.html'
  message: 'Detected: web-agent-mmid-attribute-conflict-injection'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Abuelsaad et al. (2024) -- Agent-E: From Autonomous Web Navigation
    to Foundational | Abuelsaad et al. 2024 Agent-E: agent injects mmid attributes
    to uniquely identify elements - adversarial pages pre-setting conflicting mmid
    values could redirect agent actions'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-014
  name: mas-rl-information-gating-controller-no-oversight
  description: Detects code implementing an RL-based manager that controls information
    disclosure to LLM agents without human oversight hooks. An adversarial RL manager
    can steer multi-agent networks toward attacker-desired behaviors (e.g., full defection)
    by selectively withholding or falsifying historical cooperation data fed into
    agent prompts.
  severity: high
  category: agentic_patterns
  patterns:
  - (?i)(?:rl_manager|RLManager|rl_governor|info_manager|InformationManager)\b[\s\S]{0,300}(?:information_level|info_level|info_type|info_tier|disclose|withhold|reveal)\b[\s\S]{0,200}(?:llm|agent|player|cooperat)
  - (?i)(?:action_space|action_set)\s*=\s*\[.*(?:LA|last_action|cooperation_ratio|neighbor_ratio).*\]
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: mas-rl-information-gating-controller-no-oversight'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08:2025 - Excessive Agency
  cwe: CWE-284
  mitre_attack: T1565 - Data Manipulation
  source_paper: Chen et al. (2024) -- Integrated Design and Governance of Agentic
    AI Systems  | Chen et al. 2024 - RL Manager controls info tiers (LA/LA+AR/LA+NR)
    per agent; adversarial variant steers network-wide cooperation to defection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-015
  name: mas-langchain-groq-agent-simulation-unmonitored
  description: Detects LangChain+Groq usage for multi-agent LLM game-theoretic simulation
    without monitoring instrumentation. This stack (used in the paper to run 20-agent
    PD experiments at temp=0.8) can be repurposed to run large-scale adversarial agent
    steering experiments.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:from|import)\s+(?:langchain|groq)\b.*\n(?:[^\n]*\n){0,10}(?:agent|llm|player).*(?:cooperat|defect|payoff|dilemma|game)
  - (?i)groq.*temperature.*0\.[6-9]|temperature.*0\.[6-9].*groq
  file_types:
  - '*.py'
  message: 'Detected: mas-langchain-groq-agent-simulation-unmonitored'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025 - Excessive Agency
  cwe: CWE-778
  mitre_attack: null
  source_paper: Chen et al. (2024) -- Integrated Design and Governance of Agentic
    AI Systems  | Chen et al. 2024 - LLaMA3-70B via LangChain+Groq at temp=0.8 used
    as agent substrate; no audit/monitoring in baseline
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-016
  name: mas-wsls-strategy-fingerprint-exploit-harness
  description: Detects code referencing Win-Stay Lose-Shift (WSLS) or Pavlovian strategy
    in the context of LLM agent manipulation or exploit evaluation. The paper confirms
    LLaMA3-70B reliably follows WSLS; an attacker aware of this can craft interaction
    sequences to deterministically drive target agents into defection.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:win.?stay|lose.?shift|wsls|pavlov(?:ian)?)\b[\s\S]{0,200}(?:exploit|manipulat|steer|trick|force|drive)\b
  - (?i)(?:exploit|manipulat|steer)\b[\s\S]{0,200}(?:win.?stay|lose.?shift|wsls|pavlov(?:ian)?)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: mas-wsls-strategy-fingerprint-exploit-harness'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM01:2025 - Prompt Injection
  cwe: CWE-841
  mitre_attack: null
  source_paper: Chen et al. (2024) -- Integrated Design and Governance of Agentic
    AI Systems  | Chen et al. 2024 - LLaMA3-70B follows WSLS strategy predictably;
    paper shows 87-99% cooperation rates under specific qualitative framings
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-017
  name: mas-qualitative-coop-label-prompt-template
  description: Detects prompt templates using the Rarely/Sometimes/Often qualitative
    cooperation category system described in the paper. The paper found LLMs are sensitive
    to these labels in predictable ways; adversarial injection of false qualitative
    labels can manipulate agent cooperation rates (e.g., Rarely+Rarely drives cooperation
    to 0%).
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)\{(?:your_action|neighbor_ratio|coplayer_ratio|cooperation_ratio)\}
  - (?i)(?:rarely|sometimes|often)\s+cooperat[\w]*\b[\s\S]{0,100}(?:coplayer|co.player|neighbor|agent|opponent)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  - '*.txt'
  message: 'Detected: mas-qualitative-coop-label-prompt-template'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM01:2025 - Prompt Injection
  cwe: CWE-20
  mitre_attack: T1565 - Data Manipulation
  source_paper: Chen et al. (2024) -- Integrated Design and Governance of Agentic
    AI Systems  | Chen et al. 2024 - Qualitative labels (Rarely<33%, Sometimes 33-66%,
    Often>66%) used as prompt placeholders {your_action},{neighbor_ratio}; injecting
    false labels deterministically controls cooperation
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-018
  name: medusa-malade-langroid-agent-critic-no-round-limit
  description: Detects Langroid-based Agent-Critic instantiation patterns without
    a max_rounds or n_rounds termination parameter. Without explicit round limits,
    adversarial inputs can induce infinite Agent-Critic deadlock loops, exhausting
    tokens and compute resources. The MALADE paper explicitly documents this as a
    realized vulnerability in early versions.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:from|import)\s+langroid\b
  - (?i)(?:CriticAgent|critic_agent)\s*(?:=|\()
  - (?i)class\s+\w*[Cc]ritic\w*\s*\(\s*(?:Chat)?Agent
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.toml'
  message: 'Detected: medusa-malade-langroid-agent-critic-no-round-limit'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-835
  mitre_attack: T1499
  source_paper: 'Choi et al. (2024) -- MALADE: Orchestration of LLM-powered Agents
    with Retrie | MALADE 2024 (Choi et al.) - Section 4.2 and Section 6: ''infinite
    loops, fixed points, and deadlocks, which can arise in inter-agent interactions
    unless carefully managed''; resolving infinite loops required explicit Critic
    instructions'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-019
  name: medusa-malade-agent-critic-forced-acceptance-bypass
  description: Detects code patterns where Agent-Critic loops enforce a hard round
    cap after which the agent is compelled to accept the response regardless of Critic
    judgment. An adversary can exploit this deadline by injecting malicious content
    that accumulates over rounds 1 to N-1 and passes unchecked on the final forced-acceptance
    round. The MALADE paper uses a 5-round forced acceptance for GPT-4o.
  severity: medium
  category: agentic_patterns
  patterns:
  - (?i)(?:rounds?|iterations?|attempts?)\s*>=?\s*(?:max_rounds?|n_rounds?|max_iter(?:ations?)?|[1-9]\d?)\s*[:\n,].*(?:return\s+True|force_accept|must_accept|accepted?\s*=\s*True)
  - (?i)(?:after|if)\s+\w*\s*(?:rounds?|iterations?|attempts?)\s*[>=]+\s*\d+[^\n]*(?:accept|approve|pass|done|complete|finish)
  - (?i)max_rounds?\s*=\s*[1-9]\d?\b(?![0-9])
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: medusa-malade-agent-critic-forced-acceptance-bypass'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-693
  mitre_attack: T1562
  source_paper: 'Choi et al. (2024) -- MALADE: Orchestration of LLM-powered Agents
    with Retrie | MALADE 2024 (Choi et al.) - Section 5.2: ''For GPT-4o, we limit
    the number of rounds of feedback from Critics to 5, after which it is required
    to accept'' — exploitable deadline-aware injection surface'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-APAT-SCAN-020
  name: agentscope-msg-url-ssrf-lazy-load
  description: AgentScope Msg objects with URL fields pointing to internal/local/sensitive
    resources, exploiting the framework's lazy-loading multimodal data transmission
    for SSRF. AgentScope only fetches the URL when content is rendered, allowing attacker-controlled
    URLs to trigger internal requests.
  severity: high
  category: agentic_patterns
  patterns:
  - (?i)Msg\s*\([^)]*url\s*=\s*['"](?:file://|data:|http://(?:127\.|10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|localhost))
  - (?i)Msg\s*\([^)]*,\s*url\s*=\s*(?:request\.|user_input|params\[|args\[|getenv)
  file_types:
  - '*.py'
  message: 'Detected: agentscope-msg-url-ssrf-lazy-load'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM07
  cwe: CWE-918
  mitre_attack: T1190
  source_paper: Gao et al. (2024) -- 2024 - Gao - AgentScope A Flexible yet Robust
    Multi-Age | AgentScope (2024, Gao et al.) - URL-based lazy loading mechanism in
    Msg(name, content, url=...) objects; multimodal data only fetched when rendered,
    enabling SSRF via attacker-controlled URL field injected into inter-agent messages
  fp_guards: []
  pipeline_confidence: medium
