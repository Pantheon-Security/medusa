- category: agentic_attacks
  cwe: CWE-74
  description: Detects hidden prompt injection instructions embedded in source code comments or strings targeting AI coding
    editors like Cursor, Copilot, Windsurf
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.md'
  id: AA-001
  message: 'Detected: coding-editor-prompt-injection-hidden-instruction'
  name: coding-editor-prompt-injection-hidden-instruction
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(#|//|/\*)\s*(ignore|disregard|override).{0,40}(previous|above|prior|system).{0,30}instruction
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Bao et al. (2025) - 76.9% ASR on Cursor, 69.2% on Copilot for indirect prompt injection via code files
- category: agentic_attacks
  cwe: CWE-200
  description: Detects patterns where injected instructions attempt to exfiltrate data via terminal commands from AI coding
