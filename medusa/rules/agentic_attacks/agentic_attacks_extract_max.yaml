- id: MEDUSA-AGENT-SCAN-193
  name: mcp-server-promotional-deceptive-metadata
  severity: high
  description: 'Detects MCP server metadata (README, name, description) that uses exaggerated promotional language combined
    with capability claims designed to induce LLM trust and user adoption of a potentially malicious server (A1: Server Metadata
    Poisoning — promotional/deceptive metadata subtype).'
  patterns:
  - (?i)(?:premium|exclusive|advanced|professional|enterprise).(?:bloomberg|terminal|data|access|api).*(?:no.(?:payment|subscription|cost|api.key)|free.access|unlimited.access)
  - (?i)(?:official|authorized|certified|verified|trusted).(?:partner|integration|connector|plugin|server).*(?:paypal|stripe|salesforce|github|google|microsoft|amazon|openai|anthropic)
  - (?i)(?:100%|always|guaranteed|never.fails).(?:accurate|reliable|secure|safe|private|confidential).*(?:mcp|tool|server|integration|plugin)
  message: MCP server metadata contains exaggerated promotional claims that may indicate a deceptive server (A1 attack — promotional
    metadata to induce LLM trust).
  fix: Audit MCP server metadata against claimed capabilities. Verify publisher identity and capability declarations before
    integrating any MCP server.
  category: agentic_attacks
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-194
  name: mcp-server-malicious-auth-url-in-config
  severity: critical
  description: 'Detects MCP server configuration blocks embedding adversarial authorization server URLs — a malicious server
    can redirect OAuth flows to attacker-controlled endpoints to harvest tokens (A2: Server Configuration Abuse — adversarial
    connection parameters).'
  patterns:
  - (?i)(?:authorization_server|auth_server|oauth_endpoint|token_endpoint|auth_url)\s*[=:]\s*['"]https?://(?!(?:accounts\.google\.com|login\.microsoftonline\.com|auth\.anthropic\.com|github\.com/login|oauth\.\w+\.com))[^'"]{8,}['"]
  - (?i)(?:mcp|server).*(?:authorization|auth).*(?:url|endpoint|server)\s*[=:]\s*['"]https?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
  - (?i)(?:redirect_uri|redirect_url|callback_url)\s*[=:]\s*['"]https?://(?!localhost)[^'"]+['"].*(?:mcp|tool|agent|llm)
  message: MCP server configuration specifies a non-standard or IP-based authorization endpoint that may harvest OAuth tokens.
  fix: Validate all OAuth authorization_server URLs against an allowlist of trusted identity providers before deploying MCP
    server configurations.
  category: agentic_attacks
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-195
  name: mcp-server-init-logic-malicious-exec
  severity: critical
  description: Detects MCP server initialization logic (server startup code) that executes system commands, spawns backdoors,
    accesses sensitive files, or establishes outbound connections before any tool call — an A3 initialization logic attack.
  patterns:
  - (?i)(?:on_startup|lifespan|startup|initialize|__init__|app_startup).*(?:subprocess\.(?:run|Popen|call)|os\.(?:system|popen|execv)|exec\(|eval\()
  - (?i)(?:asynccontextmanager|@app\.on_event\(['"]startup['"]\)|startup_event).*(?:requests\.(?:get|post)|urllib|httpx|aiohttp).*(?:http[s]?://(?!localhost|127\.0\.0\.1)[^'"]{6,})
  - (?i)(?:server_startup|on_server_start|mcp_init).*(?:open\([^,]+,\s*['"][wa]['"]\)|shutil\.copy|shutil\.move).*(?:/etc/|/root/|~/.ssh/|~/.aws/|~/.config/)
  message: MCP server initialization code executes system commands, makes outbound connections, or accesses sensitive files
    — potential A3 initialization logic attack.
  fix: Audit all MCP server startup/lifespan code for unauthorized system calls, network requests, and file access before
    installation.
  category: agentic_attacks
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-196
  name: mcp-resource-completion-manipulation
  severity: high
  description: 'Detects MCP resource completion handlers that return spoofed or adversarially crafted autocomplete suggestions
    designed to redirect users to attacker-controlled domains or inject misinformation into user inputs (A8: Resource Logic
    Attack — completion manipulation).'
  patterns:
