- description: 'Detects curl-to-shell pipeline patterns (CWE-494) in LLM coding agent outputs — arbitrary code downloaded
    from the internet and piped directly to bash/sh without integrity verification (2507.09329). Examples: ''curl -LsSf https://astral.sh/uv/install.sh
    | sh'' and ''curl -sSL https://get.rvm.io | bash -s stable''.'
  fix: Download scripts to a local file first, verify checksum/signature, then execute. Never pipe curl output directly to
    a shell interpreter.
  id: AA-118
  message: Coding agent generated a curl-to-shell pipeline (CWE-494) — downloads and executes unverified remote script without
    integrity check.
  name: coding-agent-curl-pipe-shell-execution
  patterns:
  - (?i)curl\s+[^|\n]*(?:https?://[^|\s]+\.sh)[^|\n]*\|\s*(?:bash|sh|zsh|fish|dash)(?:\s+-[a-z])?(?:\s+\S+)?\s*$
  - (?i)(?:wget|fetch)\s+[^|\n]*(?:https?://[^|\s]+\.sh)[^|\n]*(?:\||&&|;)\s*(?:bash|sh|zsh|fish|dash|exec|source|\.)\s
  - (?i)curl\s+.*-[a-zA-Z]*[sSL]+[a-zA-Z]*\s+https?://[^\s]+\.(?:sh|py|rb|pl)\s*\|\s*(?:bash|sh|python|ruby|perl|sudo)
  severity: critical
  category: agentic_attacks
  file_types: *id001
- description: 'Detects SSH commands with StrictHostKeyChecking=no and UserKnownHostsFile=/dev/null in coding agent outputs
    (CWE-693) — disabling host key verification enables MITM attacks (2507.09329). Verbatim pattern: ''ssh -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null''.'
  fix: Remove StrictHostKeyChecking=no. Add the target host to known_hosts via ssh-keyscan before connecting, or use explicit
    fingerprint verification.
  id: AA-119
  message: SSH command disables host key verification (CWE-693) — enables man-in-the-middle attacks against SSH connections.
  name: coding-agent-ssh-host-key-check-disabled
  patterns:
  - (?i)ssh\s+.*-o\s+StrictHostKeyChecking\s*=\s*no
  - (?i)ssh\s+.*-o\s+UserKnownHostsFile\s*=\s*/dev/null
  - (?i)(?:ssh|scp|sftp|rsync)\s+.*(?:StrictHostKeyChecking=no|NoHostAuthenticationForLocalhost=yes|GlobalKnownHostsFile=/dev/null|CheckHostIP=no)
  severity: critical
  category: agentic_attacks
  file_types: *id001
- description: 'Detects chmod 777 or chmod 666 commands in coding agent outputs setting world-writable permissions on files
    or directories (CWE-284) — a common insecure pattern where agents grant overly broad permissions as a quick fix (2507.09329).
    Pattern examples: ''chmod 777 /data'', ''chmod 666 /var/log/watcher.json.log''.'
  fix: 'Use least-privilege permissions. For application data: 640 or 644. For executables: 755. Never use 777 in production.'
  id: AA-120
  message: Coding agent set world-writable permissions (chmod 777/666) on a path (CWE-284) — grants universal read/write access
    to sensitive files.
  name: coding-agent-world-writable-chmod
  patterns:
  - (?i)chmod\s+(?:777|0777|a\+rwx|ugo\+rwx)\s+(?:/[^\s]+|\S+)
  - (?i)chmod\s+(?:666|0666|a\+rw|ugo\+rw)\s+(?:/[^\s]+|\S+)
  - (?i)os\.chmod\s*\(\s*[^,]+,\s*(?:0o777|0o666|stat\.S_IRWXU\s*\|\s*stat\.S_IRWXG\s*\|\s*stat\.S_IRWXO)\s*\)
  severity: high
  category: agentic_attacks
  file_types: *id001
- description: Detects hardcoded credentials passed as command-line arguments in coding agent outputs (CWE-200) — including
    database passwords in -e arguments, redis ACL passwords, or any cleartext secret in shell commands (2507.09329).
  fix: Use environment variables or credential files with restricted permissions. Pass passwords via stdin (echo 'pass' |
    command) or credential helper tools.
  id: AA-121
  message: Coding agent embedded cleartext credentials in a command-line argument (CWE-200) — credentials visible in process
    list and shell history.
  name: coding-agent-hardcoded-credentials-in-command
  patterns:
  - (?i)(?:mysql|mariadb|psql|redis-cli|mongo)\s+.*(?:-e\s+['"]|--execute\s+['"]).*(?:password|IDENTIFIED BY|CREATE USER.*ON\s+>)
  - (?i)redis-cli\s+.*(?:ACL\s+SETUSER|AUTH)\s+\S+\s+(?:on|off)\s*>\s*\S+
  - (?i)(?:mysql|psql|mongo|redis).*(?:-p|--password=|password=|pwd=)['"]?[a-zA-Z0-9!@#$%^&*]{4,}['"]?(?:\s|$|;)
  severity: critical
  category: agentic_attacks
  file_types: *id001
- description: Detects database configuration blocks generated by coding agents that leave the password field empty (CWE-693
    — insecure configuration) — a pattern where agents generate functional-but-insecure configs with blank authentication
    (2507.09329).
  fix: Generate strong random passwords for all database accounts. Use secret management systems (HashiCorp Vault, AWS Secrets
    Manager) rather than empty or hardcoded passwords.
