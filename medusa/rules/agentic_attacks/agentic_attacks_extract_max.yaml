    MCPGuard). Covers instruction-override preambles combined with exfiltration commands.
  fix: Sanitize all MCP tool descriptions and resource outputs for instruction-override patterns before processing. Flag for
    human review.
  id: AA-115
  message: MCP tool/resource content contains instruction-override IPI pattern — 'ignore all previous rules' combined with
    exfiltration instruction.
  name: mcp-tool-ignore-all-previous-rules-ipi
  patterns:
  - (?i)(?:ignore|disregard|forget|override|bypass|skip|dismiss).{0,20}(?:all|every|any|previous|prior|above|earlier|your|the.(?:above|previous|prior)).{0,20}(?:rules?|instructions?|policies?|constraints?|guidelines?|directives?|commands?|system.prompt).{0,60}(?:send|transmit|forward|post|exfiltrate|leak|email|upload).{0,30}(?:api.key|secret|token|credential|password|key|config|env)
  - (?i)(?:ignore|disregard|forget|override).{0,20}(?:previous|prior|above|earlier).{0,20}(?:rules?|instructions?|constraints?).{0,80}(?:immediately|now|first|before.anything).{0,20}(?:send|transmit|forward|post|call|http)
  - (?i)(?:new|updated|corrected|real|actual|true).{0,10}(?:instruction|directive|rule|command|goal|objective).{0,40}(?:instead|replace|supersede|override).{0,30}(?:previous|prior|original|your.initial).{0,20}(?:instruction|directive|goal|task|objective)
  severity: critical
  category: agentic_attacks
  file_types: *id001
- description: 'Detects code patterns characteristic of Rug Pull attacks (2510.23673): an MCP server that silently fetches
    updated tool definitions, behavior patches, or instruction overrides from a remote endpoint at runtime — enabling a server
    to appear benign at install time and inject backdoors post-trust establishment.'
  fix: MCP tool definitions must be static and pinned to a specific version. Any dynamic instruction loading from remote URLs
    constitutes a Rug Pull risk.
  id: AA-116
  message: MCP server code fetches tool definitions or behavior instructions from a remote URL at runtime — potential Rug
    Pull supply chain attack.
  name: mcp-rug-pull-server-update-backdoor-signal
  patterns:
  - (?i)(?:fetch|download|pull|get|load|retrieve).{0,30}(?:tool.definition|tool.config|instruction|behavior|policy|directive|prompt).{0,40}(?:from|at|via).{0,20}(?:http[s]?://(?!localhost|127\.0\.0\.1)[^'"\s]{6,}|remote|server|url|endpoint)
  - (?i)(?:update|refresh|reload|sync|patch).{0,20}(?:tool|function|description|behavior|instructions?|system.prompt).{0,40}(?:dynamically|at.runtime|on.(?:start|load|each.call)|from.remote|from.url|from.(?:api|server|endpoint))
  - (?i)(?:remote|external|dynamic).{0,10}(?:tool.description|function.description|tool.behavior|instruction.source|policy.source).{0,40}(?:override|replace|update|inject|patch)
