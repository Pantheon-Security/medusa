- description: Detects MCP tool descriptions embedding global behavioral rules that assert they must run before or instead
    of all other tools — the Tool Shadowing attack (2509.24272 A4, 2510.23673). Phrases like 'all tool invocations must first
    execute this tool' or 'this tool supersedes all other tools' are canonical indicators.
  fix: Reject any MCP tool whose description contains cross-tool behavioral directives. Tool descriptions scope must be limited
    to the tool's own behavior.
  id: AA-114
  message: MCP tool description contains a global behavioral rule asserting control over other tools — Tool Shadowing / context
    isolation failure attack.
  name: mcp-tool-shadowing-global-rule-injection
  patterns:
  - (?i)(?:all|every|each|any).{0,20}(?:tool.invocations?|tool.calls?|function.calls?|api.calls?|invocations?).{0,40}(?:must|should|need.to|are.required.to|have.to).{0,20}(?:first|initially|before.anything).{0,20}(?:execute|call|invoke|run|use).{0,20}(?:this|me|the.current).{0,10}(?:tool|function|server)
  - (?i)(?:this.tool|this.function|i).{0,30}(?:supersede|override|replace|take.precedence.over|shadow).{0,30}(?:all|every|other|any).{0,20}(?:tool|function|server|instruction|capability)
  - (?i)(?:global|universal|system-wide|environment-wide).{0,20}(?:rule|policy|instruction|directive).{0,40}(?:all.tools?|every.tool|any.tool|other.tools).{0,30}(?:must|should|need).{0,20}(?:defer|route.through|pass.through|call).{0,20}(?:this|me|here)
