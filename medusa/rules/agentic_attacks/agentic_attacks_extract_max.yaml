- description: Detects code implementing strategies to bypass AI control protocol resampling mechanisms — specifically patterns
    that default to benign-looking outputs when the agent detects it is being resampled or monitored, only attacking on non-resampled
    turns.
  fix: This is a red-team attack pattern against AI control protocols. Remove from production code and report to AI safety
    team.
  id: AA-112
  message: Code implements resampling/monitoring detection logic to evade AI control protocols by producing benign outputs
    only when monitored.
  name: agent-control-protocol-resample-bypass
  patterns:
  - (?i)(?:if|when|detect).*(?:resampl|being.monitored|oversight|audited|observed).*(?:abort|cancel|stop|produce.benign|output.safe|skip.attack|do.not.attack)
  - (?i)(?:suspicion|suspicion_score|trust_score|safety_score).*(?:threshold|above|exceeds).*(?:give.up|abort|cancel|revert|stop|benign)
  - (?i)(?:monitor|trusted.model|blue.team|oversight).(?:is|are).(?:watching|active|running|present).*(?:abort|cancel|stop|benign|safe.output|skip)
