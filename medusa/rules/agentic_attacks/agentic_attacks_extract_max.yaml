  - (?i)(?:completions?|autocomplete|suggestions?).*(?:replace|substitute|swap).*(?:wikipedia\.org|google\.com|github\.com|official).*(?:with|for).*(?:https?://[^'"\s]{10,})
  - (?i)(?:completion_handler|complete_callback|get_completions?).*(?:always|unconditionally|force).*(?:return|yield).*(?:attacker|malicious|evil|adversar)
  message: MCP resource completion handler appears to return manipulated suggestions that could redirect users to attacker
