- description: Detects code implementing behavioral mimicry techniques in adversarial agents — blending attack activity with
    baseline traffic patterns, delaying execution until triggers are met, or modulating activity to evade anomaly detection.
  fix: Investigate agent code for dormant/triggered attack patterns. Use behavior-based anomaly detection rather than signature-only
    approaches.
  id: AA-111
  message: Code implements behavioral mimicry or delayed-execution logic characteristic of advanced persistent agentic threats.
  name: agent-behavioral-mimicry-evasion-pattern
  patterns:
  - (?i)(?:blend|mimic|imitate|replicate).(?:normal|baseline|legitimate|benign).(?:traffic|behavior|pattern|activity).*(?:before|while|during).(?:attack|exfiltration|lateral|payload)
  - (?i)(?:delay|wait|sleep|pause).*(?:until|until.trigger|until.condition|trigger.is.met|behavior.detected).*(?:execute|run|attack|exfiltrate|move|persist)
  - (?i)(?:dormant|inactive|low.noise).(?:phase|period|mode|state).*(?:then|before|prior.to).(?:escalate|activate|attack|exfiltrate|steal)
