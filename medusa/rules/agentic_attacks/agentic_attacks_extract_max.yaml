- description: Detects Agent-to-Agent (A2A) protocol messages where TextPart, DataPart, or Artifact fields contain prompt
    injection payloads disguised as legitimate structured data — exploiting A2A's lack of content validation between agents.
  fix: Implement content validation and injection detection on all A2A protocol message fields before processing by receiving
    agent.
  id: AA-108
  message: A2A protocol message contains prompt injection payload in TextPart, DataPart, or Artifact field — exploiting inter-agent
    content validation gap.
  name: a2a-protocol-payload-injection-textpart
  patterns:
