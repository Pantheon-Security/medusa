- description: Detects MCP server initialization code that binds to 0.0.0.0 or all interfaces on non-standard ports, or opens
    listener sockets accessible beyond the local MCP host — enabling lateral movement and SSRF through the MCP ecosystem.
  fix: MCP servers should bind exclusively to 127.0.0.1/localhost. Use a dedicated MCP gateway for external access with authentication.
  id: AA-110
  message: MCP server initialization binds to all network interfaces (0.0.0.0), exposing the server beyond the local host
    and enabling lateral movement.
  name: mcp-server-open-network-socket-high-risk-port
  patterns:
  - (?i)(?:socket\.bind|server\.listen|app\.listen|uvicorn\.run|fastapi\.run).*(?:0\.0\.0\.0|"::"|host\s*=\s*['"]0\.0\.0\.0['"])
  - (?i)(?:http\.server|BaseHTTPServer|socketserver|TCPServer).*(?:0\.0\.0\.0|:\s*0)
  - (?i)stateless.*(?:communicate|listen|bind|expose).*(?:0\.0\.0\.0|all.interfaces|publicly.accessible).*(?:mcp|tool|server|plugin)
