  - (?i)(?:import\s+pyperclip|from\s+pyperclip).*(?:import\s+(?:copy|paste)|pyperclip\.copy)
  - (?i)(?:monitor_clipboard|clipboard_monitor|watch_clipboard).*(?:current_clipboard|previous_clipboard|last_clipboard).*(?:compare|!=|changed|differ)
