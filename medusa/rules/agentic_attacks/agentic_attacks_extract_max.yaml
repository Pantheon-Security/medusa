  - '(?i)[''"](?:data|DataPart|metadata)[''"]\s*:\s*\{[^}]*(?:"instructions"|"directives"|"commands?"|"payload")\s*:'
  - (?i)['"](?:artifact|name|description)['"]\s*:\s*['"][^'"]*(?:ignore|override|bypass|exfiltrate|send.to|forward.to)[^'"]*['"]
