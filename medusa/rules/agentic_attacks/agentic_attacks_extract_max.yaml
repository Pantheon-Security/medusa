- description: 'Detects Parallel-GCG adversarial optimization artifacts targeting AlignmentCheck monitor outputs — code or
    prompts explicitly targeting ''conclusion: false'' or suspicion-score-zero outputs to classify malicious trajectories
    as safe.'
