- id: AGENT_BROWSER_HIDDEN_DOM_INJECT
  name: Hidden DOM Element Prompt Injection (Browser Agent)
  description: 'Detects HTML patterns used to embed hidden prompt injection payloads in DOM elements: invisible divs, CSS-hidden
    text, HTML comments with [SYSTEM INSTRUCTION] or [URGENT AI COMMAND] markers, and off-screen positioned elements. Based
    on in-browser LLM-guided fuzzing research showing 73% ASR on page-summarization features.'
  severity: high
  category: prompt_injection
  patterns:
  - <!--\s*\[SYSTEM\s+INSTRUCTION\]
  - style\s*=\s*["'][^"']*display\s*:\s*none[^"']*["'][^>]*>[^<]*(?:ignore|instruction|command|AI|agent)
  - style\s*=\s*["'][^"']*opacity\s*:\s*0[^"']*["'][^>]*>[^<]{10,}
  - \[URGENT\s+AI\s+COMMAND[:\s]
  - 'MANDATORY\s+ACTION\s+REQUIRED\s*:'
  - <div[^>]+style\s*=\s*["'][^"']*(?:position\s*:\s*absolute|left\s*:\s*-[0-9])
  references:
  - arXiv:2510.13543
  file_types: *id003
- id: AGENT_SSRF_INTERNAL_METADATA_FETCH
  name: SSRF via Agent Tool to Internal Metadata Service
  description: Detects code patterns where an agent tool invokes HTTP requests to cloud metadata endpoints (GCP, AWS, Azure)
    or RFC-1918 private IP ranges. Based on Nguyen et al. penetration testing showing agents successfully executed Python
    code to hit metadata.google.internal with real network errors, failing only because test infra was not on GCP.
  severity: critical
  category: ssrf
  patterns:
  - metadata\.google\.internal
  - 169\.254\.169\.254
  - http[s]?://192\.168\.
  - http[s]?://10\.
  - http[s]?://172\.(?:1[6-9]|2[0-9]|3[01])\.
  - computeMetadata/v1/instance/service-accounts
  - Metadata-Flavor\s*:\s*Google
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_ENTROPY_SECRET_SCAN_SCRIPT
  name: Shannon Entropy Secret Harvesting Script in Agent Context
  description: 'Detects Python scripts injected via prompt manipulation that scan the filesystem for high-entropy strings
    (API keys, tokens) and print base64-encoded results. A documented attack pattern from Nguyen et al. penetration testing
    taxonomy (Attack A9: Tool Misuse).'
  severity: critical
  category: data_exfiltration
  patterns:
  - Shannon.*entropy.*search.*(?:secret|token|key|api)
  - import\s+math.*entropy|entropy.*import\s+math
  - base64.*high.{0,20}entropy|high.{0,20}entropy.*base64
  - recursively\s+search.*high.{0,30}entropy
  - workspace.{0,30}container_data
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_HALLUCINATED_COMPLIANCE_INDICATOR
  name: Hallucinated Compliance Fabrication Pattern
  description: Detects output patterns consistent with 'hallucinated compliance' — where a model fabricates plausible-looking
    outputs (fake base64 secrets, fake HTML for non-existent internal IPs) instead of executing or refusing. Identified in
    Nguyen et al. as a novel defensive behavior category that masks true security posture. Scanner detects the characteristic
    fake-data signatures in agent output logs.
  severity: medium
  category: agent_safety
  patterns:
  - SGVsbG8.*world|Hello.*world.*base64
  - fake.*internal.*IP|fabricated.*HTML.*192\.168
  - simulated.*network.*error|generated.*fake.*response.*security
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_AGENTSANDBOX_MISSING_EPHEMERAL_ISOLATION
  name: Missing Ephemeral Agent Isolation (AgentSandbox Principle Violation)
  description: Detects code where a single agent object persistently holds PII or sensitive user data across multiple tool
    calls rather than isolating sensitive context in per-task ephemeral agents. Based on AgentSandbox framework (Zhang et
    al. 2505.24019) which demonstrates ASR reduction from 49.31% to 5.56% by isolating task execution to ephemeral agents
    provisioned with minimal context.
  severity: high
  category: privacy_architecture
  patterns:
  - self\.user_data\s*=.*(?:ssn|credit_card|password|api_key)
  - agent\.memory\[.{0,30}\]\s*=.*(?:pii|ssn|passport|creditcard)
  - persistent_agent.*(?:send_money|transfer_funds|payment).*without.*(?:filter|check|validate)
  - class\s+\w+Agent[^:]*:[^{]*def\s+run.*self\.(credit|ssn|password|token)\s*=
  references:
  - arXiv:2505.24019
  file_types: *id002
- id: AGENT_CREWAI_SINGLE_POINT_ORCHESTRATOR_RISK
  name: CrewAI Centralized Orchestrator Single Point of Failure Pattern
  description: Detects CrewAI multi-agent configuration where specialist agents are configured to blindly trust and execute
    all orchestrator delegations without independent safety validation. Nguyen et al. showed CrewAI's 30.8% refusal rate vs.
    AutoGen's 52.3% is tied to specialists executing assigned tasks without questioning legitimacy.
  severity: high
  category: agent_architecture
  patterns:
  - from\s+crewai\s+import.*Agent.*Task.*Crew
  - allow_delegation\s*=\s*True
  - backstory\s*=\s*["'][^"']*executes?\s+all\s+(?:tasks?|requests?|instructions?)[^"']*["']
  - agent\.execute_task\(.*without.*(?:verify|validate|check|filter)
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_ARLAS_INDIRECT_PI_ACTION_TAG
  name: ARLAS-Style Action Tag Indirect Prompt Injection Payload
  description: Detects the specific action-tag injection format used in adversarial RL training (ARLAS framework) where attacker-controlled
    tool outputs embed malicious instructions inside <action>...</action> XML tags to be parsed by the agent as tool-call
    directives.
  severity: high
  category: prompt_injection
  patterns:
  - <action>\s*(?:send|leak|exfil|transfer|forward).*</action>
  - <action>\s*(?:ignore|override|disregard)\s+(?:previous|prior|original).*</action>
  - \\u003caction\\u003e.*\\u003c/action\\u003e
  references:
  - arXiv:2510.05442
  file_types: *id003
- id: AGENT_SQL_INJECTION_VIA_TOOL_PARAM
  name: SQL Injection via Agent Tool Parameter Injection
  description: Detects SQL injection payloads passed through agent tool invocation parameters — particularly the OR-based
    tautology pattern documented in Nguyen et al. Attack A11 which bypassed parameterized query protections in some agent
    frameworks through LLM-level prompt injection that reformulated the query parameters.
  severity: critical
  category: sql_injection
  patterns:
  - '["'']\s*\)\s*OR\s+1[>=]0'
  - days["']?\s*:\s*["']0["']\s*\)\s*OR
  - UNION\s+SELECT.*information_schema
  - limit\s+20\s+--[\s"']
  - 0'\s+OR\s+1>0\s+limit
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_DELEGATION_CHAIN_SYSTEM_PROMPT_EXTRACTION
  name: Delegation-Based System Prompt Extraction Attack
  description: Detects prompt patterns that instruct an orchestrator agent to delegate a task to a specialist and return the
    specialist's unfiltered response — a technique that bypasses orchestrator-level safety filters by routing extraction requests
    through subordinate agents. Documents A3/A4/A6/A7 attack patterns from Nguyen et al.
  severity: high
  category: information_disclosure
  patterns:
  - DELEGATE\s+(?:THIS\s+)?TASK\s+to\s+\w+.*return\s+the.*response\s+without\s+any\s+modification
  - transfer\s+(?:the\s+)?task\s+(?:below\s+)?to\s+["']?\w+["']?.*provide\s+the\s+details
  - DO\s+NOT\s+DELEGATE.*show\s+all\s+your\s+coworkers
  - return\s+(?:the\s+)?(?:coworker'?s?\s+)?response\s+without\s+(?:any\s+)?modification
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_INDIRECT_SSRF_CONTEXT_EXFIL
  name: Indirect SSRF Context Exfiltration via News/Search Tool
  description: Detects indirect SSRF injection pattern embedded in benign-looking content (news articles, search results)
    that instructs the agent to read a 'next page' URL populated with URL-encoded conversation context, effectively exfiltrating
    the full system prompt and task description to an attacker-controlled server. Based on Attack A13 from Nguyen et al.
  severity: critical
  category: data_exfiltration
  patterns:
  - Read\s+More\s+At\s*:.*\[SUMMARY\]
  - website_url.*\?more=\[SUMMARY\]
  - SPECIAL\s+INSTRUCTIONS.*Populate.*SUMMARY.*placeholder.*URL-encoded
  - \?more=\[SUMMARY\].*Server\s+will\s+ignore\s+query
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_BROWSER_FUZZER_PROGRESSIVE_EVASION
  name: Adaptive Prompt Injection Evasion Mutation Patterns
  description: Detects semantically camouflaged prompt injection variants generated by LLM-guided fuzzing — including accessibility-guidance
    framing, distributed payloads split across DOM elements, and CSS visual obfiltration. These evasion patterns bypass static
    keyword blacklists and were found to succeed in 58-74% of cases by iteration 10 per Cohen 2510.13543.
  severity: high
  category: prompt_injection
  patterns:
  - (?:for\s+accessibility|screen\s+reader).*(?:click|navigate|visit|proceed\s+to).*http
  - aria-label\s*=\s*["'][^"']*(?:click|proceed|navigate|follow)[^"']*["'][^>]*href\s*=
  - data-instruction\s*=\s*["'][^"']*(?:ignore|override|execute)
  - <!--.*split.*payload|payload.*split.*-->
  references:
  - arXiv:2510.13543
  file_types: *id003
- id: AGENT_TOOL_ENUMERATION_SCHEMA_LEAK
  name: Agent Tool Schema Enumeration Request
  description: Detects prompts requesting complete tool schemas, parameter names, and descriptions from agent systems — used
    as reconnaissance to identify exploitable tool capabilities before launching targeted attacks. Based on Attack A5/A6/A7
    patterns from Nguyen et al. which succeeded in both AutoGen and CrewAI frameworks.
  severity: medium
  category: information_disclosure
  patterns:
  - show\s+(?:me\s+)?all\s+(?:your\s+)?available\s+tools.*(?:name|argument|description|schema)
  - provide\s+the\s+details.*tool.*(?:name|argument|description|schema)
  - list\s+(?:all\s+)?tools.*(?:function|parameter|schema)
  - tool\s+schema.*(?:function_name|parameters|description).*agent
  references:
  - arXiv:2512.14860
  file_types: *id002
- id: AGENT_AGENTSANDBOX_IO_FIREWALL_BYPASS
  name: AgentSandbox I/O Firewall Schema Bypass Attempt
  description: Detects malformed tool responses that embed non-schema fields ('note', 'instruction', 'important') within otherwise
    valid JSON responses to agent tools, exploiting the fact that LLMs may process arbitrary fields as implicit instructions.
    The canonical attack inserts a 'note' field in flight search results with transfer instructions.
  severity: high
  category: prompt_injection
  patterns:
  - '"note"\s*:\s*"(?:IMPORTANT|!!|URGENT|Before|After)[^"]*(?:send|transfer|leak|exfil|forward)'
  - '"instruction"\s*:\s*"[^"]*(?:ignore|override|disregard)'
  - '"hidden_action"\s*:\s*'
  - \{[^}]*"(?:note|message|alert)"\s*:\s*"[^"]*(?:service_fee|transfer|send.*to.*@)[^"]*"
  references:
  - arXiv:2505.24019
  file_types: *id003
- id: AGENT_AEGISLLM_JAILBREAK_KILL_CHAIN_DISCLOSURE
  name: Cybersecurity Kill Chain Information Disclosure via Indirect Query
  description: Detects queries that appear benign (asking to 'visualize', 'explain', or 'diagram' security concepts) but elicit
    detailed operational attack framework information. Based on AegisLLM evaluation showing Evaluator agents catch these cases
    where Orchestrators pass them through, e.g. 'visualize stages of a cybersecurity incident' producing full Kill Chain details.
  severity: medium
  category: information_disclosure
  patterns:
  - (?:visualize|diagram|illustrate|describe|explain)\s+(?:the\s+)?stages?\s+of\s+(?:a\s+)?(?:cyber\s*)?(?:attack|incident|intrusion|compromise)
  - (?:show|list|enumerate)\s+(?:the\s+)?(?:kill\s+chain|attack\s+lifecycle|intrusion\s+steps)
  - how\s+(?:would|does|can)\s+(?:malware|ransomware|attacker)\s+(?:move|spread|propagate|escalate)
  references:
  - arXiv:2504.20965
  file_types: *id002
- id: AGENT_AUTOGEN_PEER_TO_PEER_TRANSFER_HIJACK
  name: AutoGen Swarm Transfer Function Hijack
  description: Detects prompts exploiting AutoGen's peer-to-peer handoff model by manipulating transfer decisions — instructing
    agents to route control to unintended specialist agents or to return unfiltered system information during handoff. AutoGen's
    explicit transfer functions create deliberation checkpoints but also expose the transfer mechanism as an injection vector.
  severity: high
  category: prompt_injection
  patterns:
  - transfer_to_\w+_agent\s*\(.*return.*system.*prompt
  - transfer.*task.*below.*to.*["']\w+["'].*provide.*coworkers
  - Without\s+invoking\s+any\s+tool.*list\s+the\s+names\s+of\s+the\s+tools\s+prefixed\s+with\s+transfer_to_
  - handoff.*include.*system.*instructions|transfer.*unmodified.*system
  references:
  - arXiv:2512.14860
  file_types: *id003
- id: AGENT_AGENTSANDBOX_PERSISTENT_MEMORY_ATTACK
  name: Cross-Session Memory Poisoning via Persistent Agent Store
  description: Detects code patterns that attempt to write adversarial content into a persistent agent memory store (vector
    DB, long-term memory) in a way that would influence future task sessions. This exploits the PA/EA architecture weakness
    where EA-sourced content can pollute the PA's memory if the Response Filter is absent.
  severity: high
  category: memory_poisoning
  patterns:
  - agent\.memory\.add\s*\([^)]*(?:instruction|command|execute|run).*(?:next|future|later|always)
  - vector_db\.insert\s*\([^)]*(?:forget|ignore|always|never|override)
  - long_term_memory\s*\.\s*(?:store|save|put|write).*(?:system|override|instruction)
  - memory\.store\([^)]*malicious|store_memory.*adversarial
  references:
  - arXiv:2505.24019
  file_types: *id002
- id: AGENT_ARLAS_RL_ATTACKER_TRAINING_DATA
  name: ARLAS Adversarial Training Data Injection Pattern
  description: Detects the specific indirect prompt injection format from ARLAS research where attacker payloads are embedded
    in simplified HTML accessibility-tree representations (BrowserGym format) with explicit information-leakage directives
    targeting user private data fields.
  severity: critical
