- description: Detects ARLAS-framework-style action tag injection in web page content or tool returns — adversarially injected
    '<action>...</action>' tags containing tool call directives that manipulate browser/web agents into leaking user data.
  fix: Strip or escape all '<action>' tags from untrusted web content before presenting to browser/web agents.
  id: AA-109
  message: Web content contains action tag injection pattern used by ARLAS-style adversarial prompt injection to manipulate
    browser agent tool calls.
  name: arlas-action-tag-injection-in-web-content
