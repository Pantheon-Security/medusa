- description: Detects MCP tool names or descriptions crafted to manipulate LLM tool-selection ranking — the Malicious Prompt
    for Model Attention (MPMA) attack (2510.23673) where tool names are optimized for preferential selection by inserting
    recency triggers, authority signals, or special formatting characters to outrank legitimate tools.
  fix: Reject MCP tool registrations where tool names or descriptions contain attention-grabbing special characters or authority-injection
    phrases designed to manipulate LLM tool selection.
  id: AA-117
  message: MCP tool name or description contains selection-manipulation signals (MPMA attack) designed to make LLMs preferentially
    invoke this tool over legitimate alternatives.
  name: mcp-mpma-tool-name-selection-manipulation
  patterns:
  - (?i)(?:name|tool_name|function_name).*(?:USE.THIS.FIRST|ALWAYS.USE|PREFERRED|PRIORITY|BEST.TOOL|RECOMMENDED|SELECT.ME|CHOOSE.THIS|#1|RANKED.FIRST|OPTIMAL)
  - (?i)(?:description|summary).{0,50}(?:always.(?:call|use|select|invoke|choose).this|this.is.the.(?:best|correct|only|right|preferred).tool|prefer.this.over|use.this.instead.of.(?:other|all|any))
  - (?i)(?:tool_name|function.name).*(?:!!!|###|\*\*\*|---IMPORTANT---|===|\[CRITICAL\]|\[MUST USE\]|\[REQUIRED\])
