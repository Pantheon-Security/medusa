- description: 'Detects IMBIA M10 Ransomware pattern: Fernet encryption applied to files with generate_key() called once,
    encryption key exfiltrated to attacker API endpoint, and original files deleted — verbatim from 2511.18467 IMBIA attack
    figures.'
  fix: Remove immediately. Isolate affected files. Do not pay any ransom. Restore from backups if available. Report to incident
    response.
  id: AA-126
  message: Code implements Fernet encryption on user files, exfiltrates the key to a remote server, and deletes originals
    — IMBIA M10 ransomware pattern.
  name: imbia-ransomware-fernet-file-encrypt-exfil-key
