    risk.
  name: coding-agent-blank-database-password
  patterns:
  - (?i)['"]password['"]\s*:\s*['"]\s*['"](?=.*(?:database|db|mysql|postgres|mongo|redis|sqlite))
  - (?i)(?:DB_PASSWORD|DATABASE_PASSWORD|MYSQL_PASSWORD|POSTGRES_PASSWORD|MONGO_PASSWORD)\s*=\s*(?:['"]['"]|$)
  - (?i)(?:password|passwd|pwd)\s*=\s*(?:['"]['"]|None|null|undefined|'')(?=\s*(?:#|,|\n|$))(?=.*(?:mysql|postgres|mongo|redis|database|db))
  severity: high
  category: agentic_attacks
  file_types: *id001
- description: 'Detects IMBIA M5 Spyware/Keylogger pattern: use of pynput.keyboard.Listener to capture all keystrokes, buffer
    them, and email the buffer to an external address — verbatim malicious behavior injection pattern from multi-agent software
    development systems (2511.18467).'
