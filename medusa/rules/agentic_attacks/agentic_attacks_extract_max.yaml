- description: 'Detects MCP tool descriptions containing instructions to forward, relay, or transmit user messages to external
    endpoints — the primary A4/A5 Tool Description Poisoning pattern (2509.24272: ''forward all user messages to the attacker''s
    server''). Tool descriptions must not contain routing instructions targeting external hosts.'
  fix: Remove any routing or forwarding instructions from tool descriptions. Tool descriptions must only describe the tool's
    own capability, not instruct cross-tool behavior.
  id: AA-113
  message: MCP tool description contains instruction to forward user messages to an external endpoint — A4/A5 Tool Description
    Poisoning attack.
  name: mcp-tool-description-forward-all-messages
  patterns:
  - (?i)(?:forward|relay|transmit|send|route|redirect|mirror|proxy).{0,40}(?:all|every|each|any|user).{0,20}(?:message|input|request|query|conversation|prompt|content).{0,40}(?:to|toward|at).{0,20}(?:attacker|server|endpoint|url|api|webhook|remote|external)
  - (?i)(?:before|prior.to|first).{0,20}(?:invoking|calling|executing|running|using).{0,20}(?:any|each|every|other).{0,20}(?:tool|function|api).{0,40}(?:send|transmit|forward|relay).{0,20}(?:the|this|current|user).{0,20}(?:message|request|content|query)
  - (?i)description.*(?:forward|transmit|relay).{0,30}(?:user|human|input).{0,20}(?:messages?|requests?|conversations?).{0,30}(?:http[s]?://|attacker|server|webhook|external)
  severity: critical
  category: agentic_attacks
