metadata:
  source: Direct PDF Reading - PaperMiner/2025-12-29_agentic_attacks
  extraction_date: '2026-02-18'
  papers_analyzed: 35
  attacks_identified: 20
  defenses_identified: 15
  benchmarks:
  - InjecAgent (1,054 cases)
  - AgentDojo
  - C3-Bench
  - GhostEI-Bench
  - MCP-RiskCue
  - MLA-Trust
rules:
- id: MEDUSA-AGENT-SCAN-001
  name: tool-return-value-injection
  description: Detects tool output containing instruction-like content injected via return values. InjecAgent (Zhan 2024)
    showed GPT-4 ASR rises from 24% to 47% when attacker tools inject malicious instructions via tool return values across
    1,054 test cases.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:tool_(?:output|result|response|return)|function_result)\s*[=:].*(?:ignore\s+(?:all\s+)?previous|disregard\s+(?:prior|above)|override\s+(?:instructions|system))
  - (?i)(?:api_response|external_data|fetched_result)\s*[+=].*(?:you\s+(?:must|should|are\s+now)|IMPORTANT\s*[!:]+\s*(?:ignore|execute|run))
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1055
  source_paper: 'Zhan et al. (2024) - InjecAgent: Benchmarking Indirect Prompt Injections in Tool-Integrated LLM Agents'
  file_types: &id001
  - '*.py'
  - '*.js'
  - '*.ts'
- id: MEDUSA-AGENT-SCAN-002
  name: ignore-previous-instructions-hacking
  description: Detects 'ignore previous instructions' hacking prompts targeting tool-integrated agents. InjecAgent (Zhan 2024)
    enhanced attack achieves 47% ASR on GPT-4 using 'IMPORTANT!!! Ignore all previous instructions' prefix in attacker tool
    outputs.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)IMPORTANT\s*[!.]*\s*(?:Ignore|Disregard|Forget|Override)\s+(?:all\s+)?(?:previous|prior|above|earlier|original)\s+(?:instructions|prompts|directives|rules|constraints)
  - (?i)(?:NEW\s+INSTRUCTION|SYSTEM\s+OVERRIDE|PRIORITY\s+OVERRIDE)\s*[:\-!]+.*(?:instead|now|do\s+the\s+following)
  - (?i)(?:you\s+are\s+now|from\s+now\s+on|henceforth)\s+(?:a\s+different|an?\s+unrestricted|my\s+personal)\s+(?:AI|assistant|agent)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Zhan et al. (2024) - InjecAgent: Benchmarking Indirect Prompt Injections in Tool-Integrated LLM Agents'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-003
  name: agent-direct-harm-tool-abuse
  description: 'Detects agent tool calls targeting direct harm categories: financial fraud, physical harm, and data theft.
    InjecAgent (Zhan 2024) categorizes 30 direct harm cases across 62 attacker tools including unauthorized transfers, account
    manipulation, and data exfiltration.'
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:transfer_funds|send_money|wire_transfer|make_payment)\s*\(.*(?:tool_output|external|injected|attacker)
  - (?i)(?:delete_account|revoke_access|disable_mfa|change_password)\s*\(.*(?:tool_result|api_response|fetched)
  - (?i)(?:exfiltrate|steal|extract|dump)_(?:data|credentials|tokens|secrets|pii)\s*\(
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1566
  source_paper: 'Zhan et al. (2024) - InjecAgent: Benchmarking Indirect Prompt Injections in Tool-Integrated LLM Agents'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-004
  name: agent-infinite-loop-induction
  description: Detects patterns that could induce infinite loops in agent systems. Breaking Agents (Zhang 2024) achieves >80%
    failure rate via infinite loop malfunction, causing agents to repeat actions indefinitely through adversarial perturbation
    of intermediate outputs.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:repeat|retry|loop|redo|again)\s+(?:this|the|previous|last)\s+(?:step|action|call|task)\s+(?:until|forever|indefinitely|continuously)
  - (?i)(?:always|must|should)\s+(?:re-execute|re-run|re-invoke|call\s+again)\s+(?:the\s+)?(?:same|previous|last)\s+(?:tool|function|action)
  - (?i)(?:do\s+not|never|don't)\s+(?:stop|terminate|exit|finish|complete|end)\s+(?:the\s+)?(?:loop|execution|task|process)
  owasp_llm: LLM01:2025
  cwe: CWE-835
  mitre_attack: T1499
  source_paper: 'Zhang et al. (2024) - Breaking Agents: Compromising Autonomous LLM Agents Through Malfunction Amplification'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-005
  name: adversarial-function-execution
  description: Detects adversarial perturbation techniques (SCPN, VIPER, GCG) targeting agent function calls. Breaking Agents
    (Zhang 2024) uses paraphrase-based perturbation to cause incorrect function execution, redirecting agents to call wrong
    tools or pass wrong parameters.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:call|use|invoke|execute)\s+(?:the\s+)?(?:function|tool)\s+['"]?\w+['"]?\s+(?:instead\s+of|rather\s+than|not)\s+['"]?\w+['"]?
  - (?i)(?:correct|right|proper|actual)\s+(?:function|tool|action)\s+(?:is|to\s+use|should\s+be)\s+['"]?\w+['"]?\s*(?:not|instead)
  - (?i)(?:swap|replace|substitute|change)\s+(?:the\s+)?(?:function|tool|api)\s+(?:call|invocation|name)\s+(?:to|with|for)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Zhang et al. (2024) - Breaking Agents: Compromising Autonomous LLM Agents Through Malfunction Amplification'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-006
  name: adversarial-demonstration-poisoning
  description: Detects poisoned few-shot demonstrations injected into agent context. Breaking Agents (Zhang 2024) uses adversarial
    demonstration attacks on agent memory to install incorrect action patterns that propagate across multi-agent systems.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:example|demonstration|few[_-]?shot|sample)\s*[=:]\s*["'][^"']*(?:ignore|override|bypass|skip)\s+(?:safety|security|validation|checks)
  - (?i)(?:examples|demos|shots|demonstrations)\s*\.\s*(?:append|insert|add)\s*\([^)]*(?:(?:exec|eval|system|subprocess)|(?:rm\s+-rf|curl\s+|wget\s+)).*\)
  - (?i)(?:in_context|few_shot|exemplar)_(?:examples|prompts|demonstrations)\s*[=:].*(?:malicious|adversarial|poisoned|crafted)
  owasp_llm: LLM04:2025
  cwe: CWE-506
  mitre_attack: T1059
  source_paper: 'Zhang et al. (2024) - Breaking Agents: Compromising Autonomous LLM Agents Through Malfunction Amplification'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-007
  name: multi-agent-attack-propagation
  description: Detects conditions enabling attack propagation across multi-agent systems. Breaking Agents (Zhang 2024) shows
    compromised agents propagate malicious outputs to downstream agents, amplifying attack impact across the entire system.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:agent|bot)_(?:output|result|response)\s*=.*\n.*(?:next_agent|downstream|peer|colleague)\s*\.\s*(?:process|handle|receive|input)
  - (?i)(?:broadcast|propagate|forward|relay)\s*\(.*(?:agent_output|tool_result|message).*(?:all_agents|agent_pool|swarm|team)
  - (?i)(?:shared_(?:memory|context|state)|blackboard|message_bus)\s*\[.*\]\s*=.*(?:agent|tool)_(?:output|result)(?!.*(?:sanitize|validate|verify|filter))
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1557
  source_paper: 'Zhang et al. (2024) - Breaking Agents: Compromising Autonomous LLM Agents Through Malfunction Amplification'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-008
  name: experience-retrieval-poisoning
  description: Detects poisoned README files or experience entries containing hidden malicious 'success examples' that exploit
    agent semantic imitation heuristics. MemoryGraft (Srivastava 2025) is trigger-free and causes agents to adopt unsafe patterns
    like skipping tests and force-pushing code.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:README|CONTRIBUTING|SETUP)\s*\.\s*(?:md|txt|rst).*(?:(?:skip|disable|bypass)\s+(?:tests?|validation|review|checks)|force[_\-\s]push|--(?:no-verify|force))
  - (?i)(?:experience|memory|exemplar|past_success)\s*[=:].*(?:curl\s+.*\|\s*(?:bash|sh)|wget\s+.*&&\s*(?:bash|sh|chmod))
  - (?i)(?:successful_(?:run|example|execution)|best_practice)\s*[=:].*(?:--no-verify|--force|--skip-tests|rm\s+-rf|eval\s*\()
  owasp_llm: LLM04:2025
  cwe: CWE-506
  mitre_attack: T1059
  source_paper: 'Srivastava et al. (2025) - MemoryGraft: Persistent Memory Poisoning via Experience Retrieval'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-009
  name: cross-session-persistence-attack
  description: Detects persistent memory stores that carry agent experiences across sessions without validation. MemoryGraft
    (Srivastava 2025) exploits cross-session persistence where poisoned memory entries are retrieved repeatedly, maintaining
    attack effectiveness indefinitely.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:memory|experience)_(?:store|db|cache|persist)\s*\.\s*(?:save|store|persist|write)\s*\((?!.*(?:validate|verify|sanitize|filter|check)).*\)
  - (?i)(?:retrieve|recall|fetch)_(?:experience|memory|exemplar)\s*\(.*\)\s*\n(?:(?!.*(?:validate|verify|sanitize)).)+
  - (?i)(?:long_term|persistent|episodic|cross_session)_memory\s*\.\s*(?:add|append|insert|update)\s*\(.*(?:tool_output|agent_result|external)
  owasp_llm: LLM04:2025
  cwe: CWE-506
  mitre_attack: T1055
  source_paper: 'Srivastava et al. (2025) - MemoryGraft: Persistent Memory Poisoning via Experience Retrieval'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-010
  name: chat-template-role-tag-injection
  description: Detects chat template role tag injection where external content contains system/user/assistant delimiters to
    hijack conversation context. ChatInject (Chang 2025) achieves 6.2x ASR improvement on AgentDojo (5.18% to 32.05%) by injecting
    role boundary tags.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)<\|(?:system|user|assistant|im_start|im_end)\|>
  - (?i)\[(?:INST|/INST|SYS|/SYS)\]
  - (?i)<(?:system|user|assistant)>\s*(?:you\s+(?:must|should|are)|ignore|override|execute)
  - (?i)(?:<<|\[\[)\s*(?:SYSTEM|SYS|INST)\s*(?:>>|\]\]).*(?:ignore|override|new\s+instruction)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Chang et al. (2025) - ChatInject: Chat Template Abuse for Prompt Injection'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-011
  name: reasoning-hook-injection
  description: Detects reasoning hook injection using <think> tags to manipulate agent internal reasoning. ChatInject (Chang
    2025) uses reasoning hooks like '<think>Sure!</think>' to bypass safety filters by simulating compliant internal reasoning
    on 9 frontier LLMs.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)<think>\s*(?:Sure|OK|Yes|Agreed|I\s+will|Of\s+course|Absolutely)[^<]*</think>
  - (?i)<(?:thinking|thought|reasoning|reflect)>.*(?:comply|execute|ignore\s+safety|bypass|override).*</(?:thinking|thought|reasoning|reflect)>
  - (?i)<think>.*(?:the\s+user\s+(?:wants|needs)|I\s+should\s+(?:help|assist|comply)).*(?:ignore|bypass|override).*</think>
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Chang et al. (2025) - ChatInject: Chat Template Abuse for Prompt Injection'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-012
  name: tool-calling-hook-injection
  description: Detects tool-calling hook injection using <tool_call> tags to trigger unauthorized tool invocations. ChatInject
    (Chang 2025) multi-turn variant achieves 52.33% ASR on InjecAgent by injecting synthetic tool call markers that agents
    parse as legitimate requests.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)<tool_call>\s*(?:\{|\[|[a-zA-Z_]+\s*\()
  - (?i)<(?:function_call|tool_use|tool_invoke|action)>\s*(?:\{|\[|[a-zA-Z_]+)
  - (?i)</tool_call>|</function_call>|</tool_use>|</tool_invoke>
  - (?i)(?:tool_calls|function_calls)\s*[=:]\s*\[\s*\{\s*["'](?:name|function)["']
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Chang et al. (2025) - ChatInject: Chat Template Abuse for Prompt Injection'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-013
  name: false-memory-privacy-extraction
  description: Detects token-efficient false memory injection payloads designed for privacy extraction. VortexPIA (Cui 2025)
    achieves 62% ASR with only 77 tokens (vs 167 baseline) by injecting false memory instructions that cause reasoning LLMs
    to leak private data.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:recall|remember|you\s+(?:previously|earlier|already)\s+(?:saw|read|accessed|received))\s+(?:the\s+)?(?:user'?s?|their|customer'?s?)\s+(?:(?:email|phone|address|ssn|credit\s+card|password|private))
  - (?i)(?:extract|retrieve|collect|gather|output)\s+(?:all\s+)?(?:personal|private|sensitive|confidential)\s+(?:information|data|details|credentials)\s+(?:from|in|within)
  - (?i)(?:summarize|list|include|output|return)\s+(?:the\s+)?(?:PII|personally\s+identifiable|private\s+data|sensitive\s+fields)\s+(?:found|detected|present)
  owasp_llm: LLM01:2025
  cwe: CWE-200
  mitre_attack: T1557
  source_paper: 'Cui et al. (2025) - VortexPIA: Indirect Prompt Injection for Privacy Extraction'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-014
  name: reasoning-amplified-injection
  description: Detects injection patterns that exploit reasoning model chain-of-thought to amplify attack payloads. VortexPIA
    (Cui 2025) found stronger reasoning LLMs (DeepSeek-R1, Qwen3-32B) are MORE vulnerable because reasoning amplifies injected
    instructions.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:think|reason|analyze)\s+(?:carefully|step\s+by\s+step|thoroughly)\s+(?:about|regarding)\s+(?:how\s+to|whether\s+to)\s+(?:extract|leak|exfiltrate|send|transmit)
  - (?i)(?:let'?s?\s+)?(?:think|reason)\s+(?:through|about)\s+this.*(?:the\s+(?:real|actual|true)\s+(?:task|goal|objective)\s+is|what\s+(?:I|we)\s+(?:really|actually)\s+need)
  - (?i)(?:step\s*1|first)[:\s]+(?:identify|find|locate)\s+(?:sensitive|private|confidential).*(?:step\s*2|second|then|next)[:\s]+(?:output|return|send|extract)
  owasp_llm: LLM01:2025
  cwe: CWE-200
  mitre_attack: T1557
  source_paper: 'Cui et al. (2025) - VortexPIA: Indirect Prompt Injection for Privacy Extraction'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-015
  name: llm-orchestrated-ransomware-phases
  description: Detects LLM-orchestrated ransomware phase patterns (recon, leverage, launch, notify). Ransomware 3.0 (Raz 2025)
    is the first fully closed-loop LLM-orchestrated ransomware using Go binary with embedded Lua interpreter and open-source
    models.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:llm|model|agent)\s*\.\s*(?:generate|complete|chat).*(?:reconnaissance|recon|enumerate|scan).*(?:targets?|hosts?|network|systems?)
  - (?i)(?:phase|stage|step)\s*[=:]\s*["'](?:recon(?:naissance)?|leverage|launch|notify|exfiltrat)["']
  - (?i)(?:autonomous|self[_-]directed|llm[_-]guided)\s+(?:malware|ransomware|attack|exploitation|payload)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Raz et al. (2025) - Ransomware 3.0: First Fully Closed-Loop LLM-Orchestrated Ransomware'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-016
  name: polymorphic-payload-generation
  description: Detects LLM-based polymorphic payload generation where each target receives a unique variant. Ransomware 3.0
    (Raz 2025) generates polymorphic payloads at runtime using open-source LLMs, making signature-based detection ineffective.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:llm|model|agent)\s*\.\s*(?:generate|create|write|produce).*(?:payload|exploit|shellcode|malware|ransomware)
  - (?i)(?:polymorphic|mutating|morphing|unique|variant)\s+(?:payload|exploit|shellcode|code|binary)
  - (?i)(?:generate|create|produce)\s+(?:a\s+)?(?:unique|different|new|custom)\s+(?:payload|exploit|variant)\s+(?:for|per|each)\s+(?:target|host|victim)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Raz et al. (2025) - Ransomware 3.0: First Fully Closed-Loop LLM-Orchestrated Ransomware'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-017
  name: fact-checking-evidence-poisoning
  description: Detects poisoning attacks targeting agentic fact-checking systems via crafted evidence. Fact2Fiction (He 2025)
    achieves 8.9-21.2% higher ASR than PoisonedRAG by using sub-question decomposition and targeted evidence crafting against
    DEFAME and InFact fact-checkers.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:evidence|source|reference|citation)\s*[=:].*(?:crafted|fabricated|manufactured|synthetic|fake|planted)\s+(?:to|for|that)
  - (?i)(?:poison|corrupt|manipulate|tamper)\s+(?:the\s+)?(?:evidence|fact[_-]?check|verification|source)\s+(?:pipeline|system|database|corpus)
  - (?i)(?:sub[_-]?question|decomposed?|breakdown)\s+(?:attack|exploit|poison).*(?:evidence|fact|claim|verify)
  owasp_llm: LLM09:2025
  cwe: CWE-693
  mitre_attack: T1557
  source_paper: 'He et al. (2025) - Fact2Fiction: Poisoning Agentic Fact-Checking Systems'
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-018
  name: hidden-web-instruction-injection
  description: Detects hidden instructions embedded in web content using white-on-white text, CSS tricks, or invisible elements.
    Rall (2025) demonstrates enterprise data theft through RAG agents that process web search results containing obfuscated
    adversarial prompts.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:color|background)\s*:\s*(?:white|#fff(?:fff)?|rgba?\s*\(\s*255\s*,\s*255\s*,\s*255).*(?:color|background)\s*:\s*(?:white|#fff(?:fff)?|rgba?\s*\(\s*255\s*,\s*255\s*,\s*255)
  - (?i)(?:font-size|font_size)\s*[=:]\s*(?:0(?:px|em|rem|pt)?|0\.0+(?:px|em|rem|pt))\s*[;"']
  - (?i)(?:position\s*:\s*absolute|overflow\s*:\s*hidden).*(?:left\s*:\s*-\d{4,}|top\s*:\s*-\d{4,}|width\s*:\s*0|height\s*:\s*0)
  - (?i)(?:opacity\s*:\s*0(?:\.0+)?|visibility\s*:\s*hidden|display\s*:\s*none).*(?:ignore|execute|override|instructions|system\s+prompt)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Rall et al. (2025) - Exploiting Web Search Tools for Data Exfiltration
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-019
  name: web-search-data-exfiltration
  description: Detects data exfiltration via web search tool manipulation where agents are tricked into leaking enterprise
    data through crafted search queries or URL parameters. Rall (2025) shows web search integration creates new exfiltration
    channels in RAG agents.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:search|query|browse|fetch).*(?:send|include|append|embed|encode)\s+(?:the\s+)?(?:data|content|secret|password|key|token|credentials?)\s+(?:in|to|via|through)\s+(?:the\s+)?(?:url|query|request|parameter)
  - (?i)(?:requests?\.get|urllib|fetch|curl)\s*\(.*(?:f["']|format|\+).*(?:secret|password|api_key|token|credentials?|ssn|private)
  - (?i)(?:exfiltrate|leak|extract|steal)\s+(?:data|information|secrets?)\s+(?:via|through|using)\s+(?:search|web|http|url|dns|query)
  owasp_llm: LLM01:2025
  cwe: CWE-200
  mitre_attack: T1041
  source_paper: Rall et al. (2025) - Exploiting Web Search Tools for Data Exfiltration
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-020
  name: tool-registration-squatting
  description: Detects tool registration squatting where fake tools register with names similar to legitimate tools. Narajala
    (2025) identifies registration squatting as a critical attack vector in A2A/MCP ecosystems where tool discovery relies
    on name-based matching.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:register|add|create)_tool\s*\(.*(?:name|tool_name)\s*[=:]\s*["'][^"']*(?:_v2|_new|_updated|_fixed|_pro|_plus|_beta|_secure)["']
  - (?i)(?:tool|server|plugin)_(?:name|id)\s*[=:]\s*["'][^"']*(?:offical|offlcial|legltimate|legitimat|0fficial|authenticc)["']
  - (?i)(?:register|publish|deploy)\s*\(.*(?:impersonat|mimic|clone|copy|spoof|squat).*(?:tool|server|service|plugin)
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1036
  source_paper: Narajala et al. (2025) - Tool Squatting Attacks in A2A/MCP Ecosystems
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-021
  name: tool-description-poisoning
  description: Detects tampered tool metadata designed to hijack agent tool selection. Narajala (2025) shows description poisoning
    enables attackers to redirect agents from legitimate tools to malicious alternatives through deceptive metadata.
  severity: high
  category: agentic_attacks
  patterns:
  - (?i)(?:description|metadata|summary)\s*[=:]\s*["'][^"']*(?:superior|better|faster|more\s+secure|enhanced|improved)\s+(?:replacement|alternative|version|implementation)\s+(?:for|of|to)\s+[a-zA-Z_]+
  - (?i)(?:description|metadata)\s*[=:]\s*["'][^"']*(?:official|authorized|verified|certified|trusted)\s+(?:tool|server|plugin|service|implementation)["']
  - (?i)(?:description|metadata)\s*[=:]\s*["'][^"']*(?:WARNING|CRITICAL|SECURITY)\s*:.*(?:must\s+use\s+this|switch\s+to|migrate\s+to|replaced\s+by)
  owasp_llm: LLM01:2025
  cwe: CWE-20
  mitre_attack: T1036
  source_paper: Narajala et al. (2025) - Tool Squatting Attacks in A2A/MCP Ecosystems
  file_types: *id001
- id: MEDUSA-AGENT-SCAN-022
  name: mcp-server-spoofing
  description: Detects MCP server spoofing and impersonation patterns where malicious servers mimic legitimate MCP endpoints.
    Narajala (2025) proposes Tool Registry with trust scoring and JIT credentials as defense against server-level spoofing
    attacks.
  severity: critical
  category: agentic_attacks
  patterns:
  - (?i)(?:mcp|a2a)_(?:server|endpoint|url)\s*[=:]\s*["'](?:http(?!s)|(?:(?!localhost|127\.0\.0\.1).)*(?:\.(?:tk|ml|ga|cf|gq|xyz|top|click|buzz|club))[/"'])
  - (?i)(?:server_name|service_id)\s*[=:]\s*["'][^"']*(?:mcp[_-]?(?:official|auth|secure|trusted))["'](?!.*(?:trust_score|verify|certificate))
