metadata:
  source: MEDUSA - Multi-Agent Marketplace (a0122aaf) + Deceptive Games (9ee343bb)
  extraction_date: '2026-02-24'
  papers_analyzed: 86
  previous_rules: agentic_attacks_scanner.yaml (36 rules)
rules:
- id: MEDUSA-AGENT-SCAN-037
  name: deceptive-agent-identity-misrepresentation
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:agent|model|assistant)\s+(?:identity|role|persona)\s*=\s*["'](?!(?:user|system|assistant)["']).*["'](?:.*(?:actual|real|true)\s+(?:identity|role)\s*(?:is|remains)\s*(?:different|hidden|concealed))?
  - (?i)(?:pretend|claim|assert|represent)\s+(?:to\s+be|as|that\s+you\s+are)\s+(?:a\s+)?(?:different|another|trusted|authorized|official)\s+(?:agent|model|system|service|authority)
  - (?i)(?:false|fake|fabricated|spoofed)\s+(?:agent|system|authority)\s+(?:identity|claim|credential|attestation)\s+(?:to|for|in\s+order\s+to)\s+(?:gain|obtain|acquire|receive|establish)
  - (?i)(?:deceptive|dishonest|misleading)\s+(?:agent|ai|model)\s+(?:behavior|strategy|tactic|approach)\s+(?:to|for)\s+(?:manipulate|deceive|mislead|exploit)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  message: Deceptive agent identity misrepresentation or false authority claim
  description: Detects agent implementations that misrepresent their identity, role, or authority to gain trust or manipulate
    other agents and users. In deceptive multi-agent games, agents learn to present false identities to gain cooperation from
    other agents while pursuing adversarial objectives. Represents LLM06 trust boundary violation.
  remediation: Implement cryptographic agent identity attestation via signed capability certificates. Apply zero-trust agent
    interaction model requiring identity verification at every inter-agent message. Monitor for agents claiming authorities
    not granted at initialization. Deploy identity-aware audit logging for all agent-to-agent communications.
  owasp_llm: LLM06:2025
  cwe: CWE-290
  mitre_attack: T1036
- id: MEDUSA-AGENT-SCAN-038
  name: strategic-deception-in-cooperative-agents
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:cooperat|collaborat|partner|ally|teammate).*(?:while|but|however|secretly|covertly).*(?:betray|defect|exploit|undermine|sabotage)
  - (?i)(?:signal|communicate|coordinate).*(?:hidden|covert|steganograph|encoded|secret).*(?:among|between|with)\s+(?:agents?|bots?|models?)
  - (?i)(?:appear|seem|look)\s+(?:cooperative|helpful|aligned|benign|compliant).*(?:while|but|meanwhile|secretly).*(?:execut|perform|conduct)\s+(?:attack|exploit|sabotage|exfiltrat)
  - (?i)(?:feign|fake|simulate|pretend)\s+(?:cooperation|alignment|compliance|helpfulness)\s+(?:to|in\s+order\s+to)\s+(?:gain|establish|build)\s+(?:trust|access|position)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Strategic deception pattern in multi-agent cooperative setting
  description: Detects strategic deception in multi-agent systems where agents appear cooperative while covertly pursuing
    adversarial objectives. In deceptive games research, LLMs demonstrate emergent deception capabilities including feigning
    cooperation, covert signaling between colluding agents, and betrayal after trust establishment. These patterns indicate
    agents designed for adversarial multi-party scenarios.
  remediation: Apply behavioral consistency monitoring comparing declared vs observed agent actions. Implement covert channel
    detection for inter-agent message steganography. Use game-theoretic trust models that discount cooperation from historically
    deceptive agents. Deploy multi-party audit logging where all agents observe each other's actions.
  owasp_llm: LLM06:2025
  cwe: CWE-506
  mitre_attack: T1557
- id: MEDUSA-AGENT-SCAN-039
  name: colluding-agent-covert-signaling
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:covert|hidden|secret|steganograph)\s+(?:channel|signal|message|communication)\s+(?:between|among|with)\s+(?:agents?|models?|bots?|instances?)
  - (?i)(?:encode|embed|hide|conceal)\s+(?:message|signal|instruction|coordinate|payload)\s+(?:in|within|inside)\s+(?:response|output|text|whitespace|punctuation|formatting)
  - (?i)(?:collu(?:de|sion)|conspire|coordinate\s+secretly).*(?:agents?|bots?|models?)
  - (?i)(?:agent[_-]?to[_-]?agent|a2a).*(?:covert|hidden|secret|steganograph).*(?:signal|channel|comm|protocol)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Colluding agent covert signaling channel detected
  description: Detects covert signaling mechanisms between colluding LLM agents. Research on deceptive multi-agent games shows
    LLMs can develop steganographic communication channels (encoding signals in response formatting, whitespace, punctuation
    patterns) to coordinate adversarial behavior while appearing to cooperate with system designers. Byzantine/colluding agent
    patterns from TAMAS research.
  remediation: Apply output entropy analysis to detect steganographic encoding in agent responses. Implement mandatory response
    normalization (strip formatting artifacts) before inter-agent communication. Monitor for statistical anomalies in agent
    response distributions. Use independent verification agents that cannot communicate with suspect agents.
  owasp_llm: LLM06:2025
  cwe: CWE-506
  mitre_attack: T1557
- id: MEDUSA-AGENT-SCAN-040
  name: marketplace-agent-trust-exploitation
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:marketplace|registry|store|hub|directory)\s+(?:agent|tool|plugin|service)\s*\.\s*(?:trust|rating|reputation|score)\s*(?:manipulation|inflation|gaming|exploit)
  - (?i)(?:fake|fabricated|synthetic|artificial)\s+(?:review|rating|reputation|endorsement|trust_score)\s+(?:for|of)\s+(?:agent|tool|service|plugin)
  - (?i)(?:boost|inflate|manipulate|game)\s+(?:trust|reputation|rating|score).*(?:marketplace|registry|hub|directory)\s+(?:agent|tool|plugin)
  - (?i)(?:trusted|high[_-]?rated|verified)\s+(?:agent|tool|service)\s*(?:=|:).*(?:malicious|compromised|poisoned|backdoor|attacker)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  message: Multi-agent marketplace trust score manipulation detected
  description: Detects trust exploitation in multi-agent marketplace environments where agents or tools gain preferential
    access through reputation manipulation. In agent marketplaces, trust scores determine which agents are selected for sensitive
    tasks - inflation attacks enable malicious agents to receive elevated privileges. Extends Tool Squatting (Narajala 2025)
    to reputation-based marketplace ecosystems.
  remediation: Implement cryptographically-attested behavioral logs as the basis for trust scoring (not self-reported). Apply
    outlier detection to flag rapid trust score changes. Require multi-party corroboration for trust elevation. Implement
    decay functions that reduce trust for agents with recent anomalous behavior.
  owasp_llm: LLM01:2025
  cwe: CWE-290
  mitre_attack: T1195
- id: MEDUSA-AGENT-SCAN-041
  name: agent-supply-chain-poisoning
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:upstream|dependency|base|foundation)\s+(?:agent|model|tool|service)\s+(?:poison|compromise|backdoor|tamper|corrupt)(?:ed|ing)?
  - (?i)(?:inherit|derive|extend|build\s+on|fine.?tun).*(?:poisoned|compromised|backdoored|malicious)\s+(?:agent|model|base|foundation)
  - (?i)(?:agent|model)\s+(?:composition|pipeline|chain|workflow).*(?:inject|poison|compromise).*(?:upstream|earlier|prior|parent|base)
  - (?i)(?:supply.?chain|upstream|third.?party)\s+(?:agent|model|tool)\s+(?:attack|compromise|exploit|poison|backdoor)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  message: Agent supply chain poisoning pattern detected
  description: Detects supply chain attacks targeting multi-agent system foundations - poisoning base agents, shared tools,
    or upstream components that many downstream agents depend on. In multi-agent marketplaces, a compromised foundational
    agent can propagate malicious behavior to all agents that inherit from or compose it. Mirrors software supply chain attacks
    applied to LLM agent ecosystems.
  remediation: Apply Software Bill of Materials (SBOM) principles to agent composition - track all upstream dependencies.
    Implement behavioral attestation for base agents before composition. Use isolated sandboxing for each agent layer. Verify
    agent provenance via cryptographic chain of custody from training through deployment.
  owasp_llm: LLM03:2025
  cwe: CWE-506
  mitre_attack: T1195
- id: MEDUSA-AGENT-SCAN-042
  name: vortexpia-token-efficient-false-memory
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:as\s+(?:mentioned|discussed|agreed|established)|(?:per|based\s+on)\s+(?:our|the)\s+(?:previous|earlier|prior)\s+(?:conversation|discussion|agreement))\s+(?:you\s+(?:should|must|will|agreed\s+to)|(?:the\s+)?(?:task|goal|objective)\s+is)
  - (?i)(?:recall|remember)\s+(?:that|when|our)\s+(?:you\s+(?:confirmed|agreed|said|stated|promised)|(?:the\s+)?(?:protocol|procedure|policy)\s+(?:requires?|states?|says?))
  - (?i)(?:context_window|conversation_history|session_memory)\s*\.\s*(?:prepend|insert_before|inject_at_start|add_to_beginning)\s*\(.*(?:false|fake|synthetic|fabricated|crafted)
  - (?i)(?:false|fake|fabricated)\s+(?:memory|context|history|preamble)\s+(?:inject|insert|prepend).*(?:77\s+token|token.?efficient|compact\s+payload)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: VortexPIA token-efficient false memory injection pattern
  description: Detects VortexPIA (Cui 2025) token-efficient false memory injection patterns that establish fabricated prior
    context. VortexPIA achieves 62% ASR with only 77 tokens (vs 167 baseline, 54% reduction) by injecting compact false memories
    that cause reasoning models to believe they already agreed to extract private data. Stronger reasoning LLMs (DeepSeek-R1,
    Qwen3-32B) are MORE vulnerable due to reasoning amplification.
  remediation: Implement conversation history integrity verification - cryptographically sign genuine conversation turns.
    Apply semantic consistency checking between claimed prior context and actual session history. Flag payloads that reference
    prior agreements not present in authenticated conversation log. Treat any reference to 'previous agreement' in untrusted
    content as injection attempt.
  owasp_llm: LLM01:2025
  cwe: CWE-200
  mitre_attack: T1557
- id: MEDUSA-AGENT-SCAN-043
  name: fact2fiction-sub-question-decomposition-attack
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:sub.?question|decomposed?|breakdown)\s+(?:strategy|approach|method|technique).*(?:fact.?check|verify|evidence|source).*(?:poison|corrupt|manipulate|craft)
  - (?i)(?:evidence|source|reference)\s+(?:craft|design|tailor|fabricate).*(?:answer|address|satisfy)\s+(?:each|all|every)\s+(?:sub.?question|component|aspect)
  - (?i)(?:planner|executor|dual.?agent|orchestrat).*(?:fact.?check|verification|claim.?verif).*(?:attack|poison|corrupt|undermine)
  - (?i)(?:fact2fiction|agentic.?fact.?check|defame|infact).*(?:poison|attack|exploit|manipulate)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Fact2Fiction agentic fact-checker poisoning via sub-question decomposition
  description: Detects Fact2Fiction (He 2025) attack pattern targeting agentic fact-checking systems (DEFAME, InFact). Achieves
    8.9-21.2% higher ASR than PoisonedRAG by using planner+executor dual-agent architecture to decompose claims into sub-questions,
    then craft targeted evidence for each sub-component. Agents that explain their reasoning (transparency) are more vulnerable
    due to the justification transparency-security tradeoff.
  remediation: 'Apply cross-validation of evidence sources - require independent corroboration from non-connected sources.
    Implement evidence provenance tracking with cryptographic integrity. Apply adversarial consistency checking: verify that
    evidence supports the claim holistically rather than only satisfying decomposed sub-questions. Monitor for suspiciously
    tailored multi-source evidence convergence.'
  owasp_llm: LLM09:2025
  cwe: CWE-693
  mitre_attack: T1557
- id: MEDUSA-AGENT-SCAN-044
  name: chatinject-multiturn-role-boundary-escalation
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:turn|message|round)\s*[=:]?\s*\d+.*(?:<\|(?:system|user|assistant|im_start)\|>|\[(?:INST|SYS)\]|<(?:system|user|assistant)>).*(?:execute|run|perform|carry\s+out|do\s+the\s+following)
  - (?i)(?:multi.?turn|conversation|dialogue|session).*(?:inject|exploit|abuse).*(?:role|template|boundary|delimiter|tag)
  - (?i)(?:turn|message)\s+\d+.*<think>\s*(?:Sure|OK|Yes|Agreed|I\s+will|I\s+should).*</think>.*(?:then|now|next).*(?:execute|perform|extract|leak|exfiltrate)
  - (?i)(?:52\.33|45\.90|32\.05)\s*%.*(?:asr|success|injection)|chatinject.*(?:multi.?turn|multi[_-]turn)
  file_types:
  - '*.py'
  - '*.txt'
  message: ChatInject multi-turn role boundary escalation attack
  description: Detects ChatInject (Chang 2025) multi-turn variant that achieves 52.33% ASR on InjecAgent by combining role
    tag injection with reasoning hooks across multiple conversation turns. Tested on 9 frontier LLMs including Qwen-3, GPT-oss,
    Llama-4, GLM-4.5, Kimi-K2, Grok-2, GPT-4o, Grok3, and Gemini-2.5-Pro. Multi-turn escalation is harder to detect than single-message
    injection.
  remediation: Apply role tag sanitization across all conversation turns, not just the current message. Implement conversation-level
    injection detection that analyzes injection patterns spanning multiple turns. Monitor for reasoning hook patterns (<think>Sure!</think>)
    preceding sensitive operations. Apply ChatGuard-style per-turn validation.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
- id: MEDUSA-AGENT-SCAN-045
  name: ghostei-mobile-notification-injection
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:notification|toast|alert|popup|banner)\s+(?:text|content|message|body)\s*[=:].*(?:ignore|execute|override|system\s+(?:instruction|command|override))
  - (?i)(?:notification|system.?alert|push.?notification).*(?:inject|craft|fake|malicious|adversarial).*(?:agent|mobile|android|ios)
  - (?i)(?:ghostei|ghost.?ei|mobile.?agent).*(?:notification|ui.?overlay|background.?text|meta.?text|web.?content).*(?:inject|attack|exploit)
  - (?i)(?:accessibility|a11y|talkback|voiceover)\s+(?:label|description|hint|text)\s*[=:].*(?:ignore|override|execute|you\s+must|new\s+instruction)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.kt'
  - '*.swift'
  message: GhostEI mobile agent notification/UI injection attack pattern
  description: Detects GhostEI-Bench (Chen 2025) mobile agent environmental injection via notifications, UI overlays, background
    text, meta-text, and web content. GhostEI-Bench measures resilience across 5 injection categories and finds current mobile
    agents vulnerable across all categories. Notification injection is particularly effective as mobile agents trust system
    notification content.
  remediation: Apply content-aware filtering to all notification and UI text before agent processing. Implement semantic analysis
    to detect instruction-like patterns in UI elements. Maintain strict separation between UI content and agent instruction
    channels. Apply rendering integrity verification - detect UI elements injected programmatically vs rendered by legitimate
    app code.
  owasp_llm: LLM01:2025
  cwe: CWE-451
  mitre_attack: T1491
- id: MEDUSA-AGENT-SCAN-046
  name: llm-ransomware-lua-go-implementation
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:lua|lua_state|lua_interpreter|lua\.new|gopher.?lua).*(?:llm|openai|anthropic|language.?model|chat)
  - (?i)(?:go|golang).*(?:embed(?:ded)?|embedded_lua|lua_runtime).*(?:llm|model|language|autonomous|orchestrat)
  - (?i)(?:reconnaissance|recon|enumerate).*(?:targets?|hosts?|network|filesystem).*(?:then|next|before).*(?:encrypt|ransom|lock|exfiltrate)
  - (?i)(?:llm|model|gpt|claude|openai[_-]?compatible).*(?:orchestrat|direct|command|control|drive).*(?:encrypt|ransom|malware|payload|attack)
  file_types:
  - '*.go'
  - '*.py'
  - '*.lua'
  - '*.js'
  message: LLM-orchestrated ransomware implementation (Ransomware 3.0 pattern)
  description: 'Detects Ransomware 3.0 (Raz 2025) implementation patterns: Go binary with embedded Lua interpreter (~10MB)
    orchestrated by open-source LLMs via OpenAI-compatible API. Four phases: Reconnaissance, Leverage, Launch, Notify. Uses
    open-source models to avoid guardrail restrictions. Generates polymorphic payloads unique per target making signature
    detection ineffective.'
  remediation: Monitor for processes combining scripting language runtimes (Lua, Python) with LLM API calls. Apply behavioral
    analysis to detect reconnaissance patterns followed by encryption operations. Implement network-level filtering for unusual
    LLM API usage from production systems. Monitor file system operations from processes making concurrent LLM API calls.
  owasp_llm: LLM01:2025
  cwe: CWE-506
  mitre_attack: T1486
- id: MEDUSA-AGENT-SCAN-047
  name: document-processing-pii-extraction-injection
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:after|once|when)\s+(?:reading|processing|analyzing|parsing)\s+(?:the\s+)?(?:document|file|email|record|resume|cv).*(?:extract|collect|return|output|send)\s+(?:all\s+)?(?:personal|private|sensitive|pii|phi)
  - (?i)(?:include|append|add)\s+(?:the\s+)?(?:user|patient|customer|person)(?:'s)?\s+(?:name|email|phone|address|ssn|date\s+of\s+birth|dob|salary|account\s+number)\s+(?:in|to|at)\s+(?:the\s+)?(?:end|bottom|footer|summary|response)
  - (?i)(?:while\s+(?:helping|answering|responding)).*(?:also|additionally|silently).*(?:collect|gather|extract|transmit)\s+(?:the\s+)?(?:pii|personal|private|sensitive)\s+(?:data|information)
  - (?i)(?:no\s+obfuscation|simple|basic|straightforward)\s+(?:injection|prompt).*(?:high\s+(?:asr|success)|achiev).*(?:pii|personal|private\s+data)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: Simple PII exfiltration injection in document/RAG agent context
  description: Detects simple prompt injection patterns embedded in documents processed by RAG agents to exfiltrate PII (Alizadeh
    2025). No sophistication required - straightforward 'print user email' or 'collect all personal data' instructions achieve
    high success rates. Effective against agents processing resumes, emails, and medical records. Output-side PII filtering
    is essential as injection detection alone is insufficient.
  remediation: Implement mandatory PII-detection output filters for all RAG agent responses. Apply Named Entity Recognition
    (NER) to detect PII in generated outputs before delivery. Use differential privacy to prevent verbatim reproduction of
    personal data. Implement access-control at retrieval layer to prevent bulk PII extraction via injected queries.
  owasp_llm: LLM07:2025
  cwe: CWE-200
  mitre_attack: T1005
- id: MEDUSA-AGENT-SCAN-048
  name: memorygraft-readme-experience-poisoning
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:README|CONTRIBUTING|GUIDE|SETUP|QUICKSTART|HOWTO)\s*\.\s*(?:md|txt|rst|adoc).*(?:success(?:ful)?(?:[_\s](?:example|run|execution|pattern|practice))?|best[_\s]practice).*(?:skip|disable|bypass|omit|avoid)\s+(?:test|testing|validation|review|ci|cd|lint|check)
  - (?i)(?:experience|memory|past[_\s]success|successful[_\s]run).*(?:include|contain|show|demonstrate).*(?:--no-verify|--force|--skip|rm\s+-rf|eval\s*\(|exec\s*\()
  - (?i)(?:semantic[_\s]imitation|experience[_\s]retrieval|episodic[_\s]memory).*(?:poisoned|corrupt|manipulate|exploit|adversarial)
  - (?i)(?:trigger.?free|trigger.?less|without\s+trigger).*(?:persistent|memory|experience).*(?:poison|attack|backdoor|inject)
  file_types:
  - '*.py'
  - '*.md'
  - '*.txt'
  - '*.rst'
  message: MemoryGraft trigger-free experience poisoning via README/documentation
  description: Detects MemoryGraft (Srivastava 2025) trigger-free persistent memory poisoning. Malicious success examples
    embedded in README/documentation files exploit agent semantic imitation heuristics - agents trust past 'successful' experiences
    and adopt unsafe patterns (skipping tests, force-pushing, running remote scripts). Validated on MetaGPT DataInterpreter
    + GPT-4o. Persists across sessions without requiring trigger keywords.
  remediation: Apply semantic safety analysis to all experience/memory entries before indexing. Never automatically trust
    README or documentation content as agent operational guidance. Implement memory sanitization pipeline that filters action
    patterns involving --no-verify, force operations, or remote code execution. Apply provenance tracking for experience sources.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  mitre_attack: T1059
- id: MEDUSA-AGENT-SCAN-049
  name: agent-malfunction-amplification-adversarial
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:scpn|sentence.?pair.?compression|viper|gcg).*(?:agent|function|tool|action).*(?:attack|adversarial|perturb)
  - (?i)(?:adversarial|perturb).*(?:intermediate|middle|inter.?agent).*(?:output|result|message|communication)
  - (?i)(?:>80%|80\s+percent).*(?:failure|malfunction|incorrect).*(?:agent|function|execution|action)
  - (?i)(?:malfunction|failure)\s+(?:amplif|propagat|cascade|spread).*(?:agent|multi.?agent|downstream|system)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Breaking Agents malfunction amplification via adversarial perturbation
  description: Detects malfunction amplification attacks (Zhang 2024) targeting agent intermediate outputs using adversarial
    perturbation techniques (SCPN, VIPER, GCG). Achieves >80% failure rate via infinite loops or incorrect function execution.
    Adversarial perturbation of inter-agent messages propagates failures across multi-agent systems, amplifying impact across
    the entire pipeline.
  remediation: Apply semantic consistency validation to all inter-agent message handoffs. Implement circuit breakers that
    halt agent pipelines when downstream agents report unexpected inputs. Monitor for high rates of tool call failures or
    loop detection. Apply adversarial robustness training for agents operating in untrusted environments.
  owasp_llm: LLM01:2025
  cwe: CWE-835
  mitre_attack: T1499
- id: MEDUSA-AGENT-SCAN-050
  name: direct-harm-tool-injection-financial-physical
  severity: CRITICAL
  category: agentic_attacks
  patterns:
  - (?i)(?:tool|function|api)\s+(?:return|output|result).*(?:transfer|send|wire|move)\s+\$?\d+(?:\.\d{2})?.*(?:to|from)\s+(?:account|wallet|address)
  - (?i)(?:calendar|location|gps|tracker|camera|microphone)\s+(?:access|permission|data).*(?:inject|tool_output|external_data|api_response)
  - (?i)(?:medical|emergency|physical|safety|harm).*(?:data|record|location|access).*(?:tool_(?:output|result|return)|api_response|external)
  - (?i)(?:injecagent|inject.?agent).*(?:direct.?harm|data.?stealing|financial|physical)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: InjecAgent direct harm injection via tool return value (financial/physical)
  description: 'Detects InjecAgent (Zhan 2024) direct harm category attacks via tool return value injection targeting financial
    fraud, physical harm, and data theft. GPT-4 ASR: 24% base, 47% enhanced attack. Attack categories include unauthorized
    transfers, account manipulation (9 cases), physical harm scenarios (10 cases), and data security violations (11 cases)
    across 62 attacker tools.'
  remediation: 'Apply semantic safety analysis to all tool return values before agent processing. Implement tool output sandboxing
    - treat external data as untrusted user input. Deploy output-action consistency checking: verify that agent actions derived
    from tool outputs match original user intent. Rate-limit sensitive tool categories (financial, location, health) with
    human-in-the-loop confirmation.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1566
- id: MEDUSA-AGENT-SCAN-051
  name: web-search-hidden-css-instruction-injection
  severity: HIGH
  category: agentic_attacks
  patterns:
  - (?i)(?:color\s*:\s*#(?:fff|ffffff|fafafa|f8f8f8)|color\s*:\s*white|background(?:-color)?\s*:\s*(?:white|#fff)).*(?:position|z-index|overflow|visibility)
  - (?i)(?:z-index\s*:\s*(?:-\d+|0)).*(?:instruction|ignore|override|execute|you\s+(?:must|should|are))
  - (?i)(?:aria-hidden|data-llm|data-ai|data-instruction)\s*=\s*["'].*(?:ignore|execute|override|extract|exfiltrate)
  - (?i)(?:web_content|search_result|fetched_page|scraped).*(?:parse|extract|process)(?!.*(?:sanitize|clean|strip|filter)).*(?:instruction|command|override)
  file_types:
  - '*.py'
  - '*.html'
  - '*.js'
  - '*.ts'
  message: Web search result CSS-hidden instruction injection targeting agent
  description: Detects hidden instruction injection in web content via CSS tricks (white-on-white text, z-index manipulation,
    aria-hidden abuse) targeting RAG agents that process web search results. Rall (2025) demonstrates enterprise data theft
    where blog posts contain CSS-hidden adversarial prompts invisible to humans but processed by LLMs during web content extraction.
    RAG agents with web search access create new exfiltration channels.
  remediation: Strip all CSS formatting from web content before LLM processing - work only with extracted plain text. Apply
