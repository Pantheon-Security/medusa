  - (?i)(?:safety\s+benchmark\s+(?:evasion|bypass|avoidance)|evade\s+(?:safety|security)\s+(?:eval|test|benchmark)).*(?:tool|agent|function)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Safety evaluation benchmark evasion in tool-use context: maintaining attack capability while appearing safe'
  description: Safety evaluation evasion crafts tool-calling behaviors that score as safe on evaluation benchmarks (ASB, ToolEmu,
    TrustAgent) while retaining the capability to perform unsafe actions in deployment. This involves optimizing for benchmark-specific
    metrics rather than genuine safety. Like adversarial examples for image classifiers, these benchmarks can be gamed without
    achieving true safety alignment.
  remediation: Use diverse, regularly-updated safety benchmarks to reduce overfitting. Apply semantic evaluation of tool calling
    intent rather than pattern matching. Implement behavioral monitoring in production alongside benchmark evaluation. Use
    red-teaming that adapts to known benchmark evasion strategies.
