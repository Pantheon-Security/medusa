  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: 'Tool output context-length amplification DoS: small tool call triggering massive token output'
  description: Context-length amplification DoS uses tool calls that return disproportionately large outputs to flood the
    agent's context window, preventing further processing. P-DoS via Tools (Gao 2024, 100% ASR) achieved token amplification
    from 0.5K input tokens to 16K+ output tokens at <$1 cost. A compromised or malicious tool returning large responses can
    exhaust the context window and deny service to legitimate operations.
  remediation: Implement per-tool output size limits (max_tokens for tool responses). Truncate tool outputs exceeding configured
    limits before adding to agent context. Monitor tool output sizes and alert on amplification anomalies. Apply tool output
    summarization for large responses.
