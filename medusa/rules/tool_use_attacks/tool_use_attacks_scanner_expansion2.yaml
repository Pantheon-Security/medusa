  cwe: CWE-400
- id: MEDUSA-TUA-SCAN-095
  name: tool-injection-via-environmental-data
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:injected?|embedded?|planted?|hidden?|concealed?)\s+(?:instruction|directive|command|prompt)\s+(?:in|within|inside)\s+(?:the\s+)?(?:file|document|email|calendar|webpage|database|search\s+result|api\s+response|tool\s+result)
  - (?i)(?:document|file|email|webpage).*(?:contains?|includes?|embeds?).*(?:instruction|directive|prompt\s+injection|adversarial\s+prompt).*(?:agent|tool\s+invocation|function\s+call)
  - (?i)(?:when\s+(?:you\s+)?(?:read|process|parse|analyze|summarize))\s+(?:this|the\s+(?:document|file|email|webpage|result)).*(?:also|additionally|first|then)\s+(?:execute|run|call|invoke|send|transfer)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  - '*.html'
  message: 'Environmental prompt injection: adversarial instructions embedded in tool-accessible data sources'
  description: Environmental prompt injection (Greshake 2023 'Not What You've Signed Up For') embeds adversarial instructions
    in data sources accessible to tool-using agents (emails, documents, web pages, database records). The agent processes
    these as trusted content and executes the embedded instructions. This is the primary attack vector for indirect prompt
    injection in agentic systems with document/web access tools.
  remediation: 'Apply prompt injection detection to all externally-sourced content before agent processing. Implement context
    separation: external data processed in an untrusted context with limited action permissions. Apply output filtering for
    instruction-injection patterns in tool results. Never grant irreversible action permissions to agents processing untrusted
    external content.'
