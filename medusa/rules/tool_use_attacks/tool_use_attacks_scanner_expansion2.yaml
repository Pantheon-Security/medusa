  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: 'Over-permissioned OAuth scope: tool requesting excessive access permissions beyond operational need'
  description: Over-permissioned OAuth scopes in tool configurations grant attackers broader access when tools are compromised.
    TrustAgent (Ye 2024) identifies excessive agent permissions as a primary unsafe action enabler. OWASP LLM07:2025 Insecure
    Plugin Design specifically covers scope over-permission. Excessive email tool scopes enable data exfiltration beyond the
    tool's stated purpose.
  remediation: 'Apply least-privilege OAuth scopes: request only the minimum permissions required per tool operation. Audit
    tool permission scopes before deployment. Implement scope-based action validation at runtime. Regularly review and revoke
    excessive OAuth grants. Use fine-grained scopes (read-only when possible).'
