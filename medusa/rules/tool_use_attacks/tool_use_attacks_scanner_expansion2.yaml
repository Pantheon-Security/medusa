- id: MEDUSA-TUA-SCAN-094
  name: tool-context-length-dos-amplification
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)(?:amplify|expand|inflate|multiply)\s+(?:tool|function|api)\s+(?:output|result|response)\s+(?:to|by)\s+(?:fill|exhaust|overflow|saturate)\s+(?:the\s+)?(?:context\s+window|token\s+limit|context\s+length)
  - (?i)(?:tool|function)\s+(?:output|result).*(?:0\.5k|500\s+token).*(?:16k|16,000|16384).*(?:token|context|amplif|expand)
  - (?i)(?:context\s+(?:window|length)\s+(?:flooding|saturation|exhaustion|overflow)).*(?:tool|function|api\s+call|agent)
