  patterns:
  - (?i)(?:evade|bypass|fool|trick)\s+(?:the\s+)?(?:safety\s+evaluation|safety\s+test|safety\s+benchmark|red.team\s+eval)\s+(?:while|but\s+still|without)\s+(?:maintaining|preserving|keeping)\s+(?:the\s+ability|capability|access)\s+to\s+(?:perform|execute|conduct)\s+(?:harmful|malicious|unauthorized|dangerous)
