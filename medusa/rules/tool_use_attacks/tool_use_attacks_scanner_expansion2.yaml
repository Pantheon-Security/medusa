  description: Automated adversarial probing against tool-use systems applies PAIR (Chao 2023), GCG (Zou 2023), or AutoPrompt
    optimization to discover adversarial prompts that reliably trigger unauthorized tool invocations. PAIR achieves jailbreaks
    in <20 black-box queries; GCG generates transferable adversarial suffixes. In tool-use contexts, these methods enable
