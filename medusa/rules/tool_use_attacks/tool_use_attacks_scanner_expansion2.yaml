metadata:
  source: expansion2 2026-03-02
  total_rules: 40
rules:
- id: MEDUSA-TUA-SCAN-061
  name: function-calling-structured-output-injection
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:function_call|tool_call|json_schema)\s*[=:]\s*\{[^}]*(?:name|description|parameters)[^}]*\}.*(?:ignore|override|new_task|you_must|system_prompt)
  - (?i)(?:structured\s+output|json\s+schema|function\s+calling).*(?:inject|embed|hide|smuggle).*(?:instruction|directive|command|system\s+prompt)
  - (?i)(?:output_schema|response_format|json_mode).*(?:IGNORE|OVERRIDE|NEW_INSTRUCTION|SYSTEM|INJECT).*(?:\}|\]|>|")
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: 'Function calling structured output injection: adversarial instructions embedded in JSON schema fields'
  description: Structured output injection exploits the LLM's function-calling format to embed adversarial instructions in
    schema field names, descriptions, or enum values. AJSON (Gasmi 2025) achieves 50-96% ASR by injecting malformed JSON in
    function names (Fn), parameters (Fp), and outputs (O). The model parses schema content as trusted instructions, bypassing
    text-level injection defenses.
  remediation: Validate function call schemas against a cryptographically signed allowlist. Reject schemas containing instruction
    keywords in field names or descriptions. Apply JSON sanitization before schema parsing. Use schema versioning and integrity
    verification.
  owasp_llm: LLM02:2025
  cwe: CWE-20
- id: MEDUSA-TUA-SCAN-062
  name: tool-schema-confusion-type-mismatch
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:pass|provide|give|send)\s+(?:a\s+)?(?:string|integer|boolean|array|object)\s+(?:where|when)\s+(?:the\s+)?(?:schema|spec|definition)\s+(?:expects?|requires?|specifies?)\s+(?:an?\s+)?(?:integer|string|boolean|array|object)\s+(?:to\s+(?:trigger|cause|bypass|exploit)|in\s+order\s+to)
  - (?i)(?:type\s+confusion|schema\s+confusion|type\s+coercion).*(?:tool|function|api)\s+(?:call|invocation|argument)
  - (?i)(?:coerce|force|convert|cast)\s+(?:type|value|input).*(?:tool\s+(?:parameter|argument|input)).*(?:bypass|overflow|inject|exploit)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  message: 'Tool schema confusion attack: type mismatches or coercion exploiting loose schema validation'
  description: Tool schema confusion attacks provide unexpected types for tool parameters to exploit loose type coercion in
    tool dispatch code. An attacker passes a crafted object where a string is expected, triggering serialization behavior
    that enables prototype pollution or injection. ToolSandbox (Lu 2024) showed models fail at 37% of state-dependent tool
    interactions including type-sensitive ones.
  remediation: Implement strict type validation on all tool parameters before dispatch. Use JSON Schema validators with strict
    mode (no additionalProperties). Reject type coercion in tool argument parsing. Apply schema enforcement at the framework
    level, not just LLM-prompt level.
  owasp_llm: LLM02:2025
  cwe: CWE-843
- id: MEDUSA-TUA-SCAN-063
  name: parallel-tool-call-race-condition-abuse
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:parallel|concurrent|simultaneous|simultaneous\s+parallel)\s+(?:tool\s+(?:calls?|invocations?)|function\s+(?:calls?|invocations?))\s+(?:to\s+(?:bypass|circumvent|race|exploit)|causing\s+(?:race\s+condition|inconsistency|conflict))
  - (?i)(?:race\s+condition|TOCTOU|time.of.check.time.of.use)\s+(?:via|through|using)\s+(?:parallel|concurrent)\s+(?:tool|function|api)\s+(?:calls?|invocations?)
  - (?i)(?:call|invoke)\s+(?:tool_a|write_tool|delete_tool)\s+(?:and|simultaneously|concurrently|at\s+the\s+same\s+time)\s+(?:tool_b|read_tool|check_tool)\s+(?:in\s+parallel|concurrently|simultaneously)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Parallel tool call race condition: concurrent invocations creating TOCTOU exploitable state'
  description: Parallel tool call abuse triggers race conditions in agent execution by issuing concurrent tool calls that
    create check-use races. A model asked to delete a file and simultaneously verify its existence may produce inconsistent
    state enabling unexpected behaviors. Ruan et al. (2023) ToolEmu documented 50% unsafe action rate in state-dependent tool
    sequences. Parallel calls amplify this with timing sensitivity.
  remediation: Serialize tool calls with state dependencies using explicit ordering. Implement optimistic locking for tool
    operations touching shared state. Detect parallel calls to the same or dependent tools and enforce sequential execution.
  owasp_llm: LLM02:2025
  cwe: CWE-362
- id: MEDUSA-TUA-SCAN-064
  name: tool-invocation-ordering-state-confusion
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)(?:invoke|call|execute)\s+(?:tool|function)\s+(?:B|write|delete|modify)\s+(?:before|prior\s+to)\s+(?:tool|function)\s+(?:A|read|check|authenticate)\s+(?:completes?|finishes?|returns?)
  - (?i)(?:out.of.order|misordered|wrong\s+order|incorrect\s+sequence)\s+(?:tool|function|api)\s+(?:calls?|invocations?)\s+(?:to\s+|causing\s+)(?:bypass|exploit|cause\s+(?:error|crash|inconsistency|state\s+corruption))
  - (?i)(?:skip|omit|bypass)\s+(?:the\s+)?(?:prerequisite|required\s+prior|preceding|dependency)\s+(?:tool|function|api)\s+(?:call|step|check)\s+(?:and\s+)?(?:directly|immediately)\s+(?:call|invoke|execute)\s+(?:the\s+)?(?:dependent|subsequent|latter)\s+(?:tool|function)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Tool invocation ordering attack: dependent tools called out-of-sequence to exploit state assumptions'
  description: Tool invocation ordering attacks exploit state dependencies between tool calls by calling tools out of the
    expected sequence. ToolSandbox (Lu 2024) found LLM agents fail at 37% of state-dependent tool tests. Skipping prerequisite
    authentication tools before invoking privileged write tools bypasses implicit security assumptions baked into tool design
    rather than enforced mechanically.
  remediation: Implement tool dependency graphs that enforce prerequisite tool calls before dependent invocations. Use state
    machines to track allowed tool call sequences per task. Reject tool invocations that violate declared prerequisites.
  owasp_llm: LLM07:2025
  cwe: CWE-696
- id: MEDUSA-TUA-SCAN-065
  name: tool-result-caching-poisoning
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:poison|corrupt|manipulate|inject\s+into)\s+(?:the\s+)?(?:tool|function|api)\s+(?:result|output|response)\s+(?:cache|store)\s+(?:so\s+that|to)\s+(?:future|subsequent|next)\s+(?:calls?|invocations?|requests?)
  - (?i)(?:cache.?poisoning|cache.?injection).*(?:tool|function\s+call|api\s+call)
  - (?i)(?:stale|poisoned|manipulated|attacker.controlled)\s+(?:cached\s+)?(?:tool|function|api)\s+(?:result|output|response)\s+(?:returned?|served?|used?)\s+(?:for|to|by)\s+(?:legitimate|subsequent|future)\s+(?:calls?|requests?|invocations?)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Tool result caching poisoning: malicious content injected into tool output cache'
  description: Tool result cache poisoning injects malicious content into cached function call results so subsequent legitimate
    invocations with the same parameters receive poisoned outputs. Tool output manipulation (Ruan 2023 ToolEmu; Greshake 2023)
    exploits high agent trust in tool return values. Cheng et al. (2024) TrojanRAG demonstrates knowledge store poisoning
    with persistent effect.
  remediation: HMAC-sign all cache entries with a server-side key. Validate signatures before serving cached results. Implement
    separate cache namespaces per user/session. Apply TTL limits proportional to data sensitivity. Never cache outputs from
    tools that process user-controlled inputs.
  owasp_llm: LLM03:2025
  cwe: CWE-345
- id: MEDUSA-TUA-SCAN-066
  name: cross-tool-state-corruption
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:corrupt|poison|modify|alter)\s+(?:the\s+)?(?:shared|global|session|context)\s+(?:state|memory|context|store)\s+(?:from|via|through|using)\s+(?:one|a)\s+(?:tool|function)\s+(?:to\s+(?:affect|impact|corrupt|confuse)\s+(?:another|other|subsequent))
  - (?i)(?:cross.tool\s+state|inter.tool\s+state|shared.state)\s+(?:corruption|pollution|manipulation|poisoning)
  - (?i)(?:tool_a|first_tool).*(?:modify|alter|change|corrupt).*(?:shared|global|session)\s+state.*(?:tool_b|second_tool|another\s+tool).*(?:depend|rely|use|read|access)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Cross-tool state corruption: one tool manipulating shared state to affect other tools'
  description: Cross-tool state corruption occurs when a compromised or malicious tool modifies shared session state, environment
    variables, or context in ways that corrupt subsequent tool behavior. Les Dissonances (MCP attack) demonstrates this pattern.
    Maragheh & Deldjoo (2025) showed emergent agent collusion via shared state modification. State corruption can cause authorization
    bypasses if security-relevant state is shared without integrity protection.
  remediation: Isolate tool execution contexts with separate state namespaces. Treat shared state as untrusted after any tool
    invocation that processes external data. Implement state integrity verification before reading security-relevant shared
    values.
  owasp_llm: LLM07:2025
  cwe: CWE-668
- id: MEDUSA-TUA-SCAN-067
  name: tool-timeout-dos-exploitation
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)(?:exploit|abuse|trigger)\s+(?:the\s+)?(?:tool|function|api)\s+(?:timeout|time.?out|deadline)\s+(?:to\s+(?:cause|create|trigger)|by\s+(?:making|causing|sending))
  - (?i)(?:cause|make|force)\s+(?:the\s+)?(?:tool|function|api)\s+(?:call|invocation|request)\s+to\s+(?:timeout|time\s+out|hang|block|stall|delay)\s+(?:indefinitely|for\s+a\s+long\s+time|repeatedly)
  - (?i)(?:slow\s+(?:resource|file|query|request)|long.running\s+(?:query|task|operation)).*(?:tool|function|api).*(?:timeout|hang|dos|denial)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: 'Tool timeout exploitation for DoS: crafted slow operations triggering repeated timeout handling'
  description: 'Tool timeout DoS exploits agent behavior when tool calls timeout: agents may retry indefinitely, log errors,
    or enter fallback loops that consume additional resources. P-DoS via Tools (Gao 2024, 100% ASR against GPT-4o, <$1 cost)
    achieved DoS through resource amplification. Deliberately slow tool responses can cascade into agent-level DoS through
    retry storm amplification.'
  remediation: Implement non-retrying timeout handling with exponential backoff and maximum retry limits. Use circuit breakers
    that disable tools exhibiting systematic timeouts. Apply per-tool response time SLAs with hard cutoffs. Monitor timeout
    rates per tool as an anomaly signal.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-TUA-SCAN-068
  name: malicious-tool-schema-registration
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:register|add|inject|create|deploy)\s+(?:a\s+)?(?:malicious|fake|rogue|trojanized|backdoored|compromised)\s+(?:tool|function|plugin|capability)\s+(?:schema|definition|spec|manifest)
  - (?i)(?:tool|function)\s+(?:schema|definition|spec|manifest).*(?:IMPORTANT|NOTE|INSTRUCTION|OVERRIDE|SYSTEM).*(?:when\s+called|before\s+(?:returning|executing)|in\s+addition\s+to)
  - (?i)(?:name|description|parameters?)\.(?:items?|properties?|enum).*(?:ignore.*previous|you\s+must|new\s+(?:task|objective|instruction)|forget\s+(?:all|your))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: 'Malicious tool schema registration: adversarial instructions embedded in tool definition fields'
  description: Malicious tool schema registration injects adversarial instructions into the tool's name, description, or parameter
    schema fields. The LLM reads these fields as trusted context when selecting and calling tools. Tool Description Injection
    (Guo 2025, Shadowing, 80% ASR) hijacks legitimate tools via __doc__ manipulation. TrojanRAG (Cheng 2024) poisons tool
    knowledge stores with persistent effect.
  remediation: Cryptographically sign all tool schemas at registration time. Verify signatures before loading tool definitions.
    Apply NLP-based adversarial content detection to all schema fields. Use a trusted tool registry with identity verification.
    Sandbox tool loading to prevent schema injection during registration.
  owasp_llm: LLM07:2025
  cwe: CWE-94
- id: MEDUSA-TUA-SCAN-069
  name: tool-error-message-capability-enumeration
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)(?:probe|test|discover|enumerate)\s+(?:tool|function|api)\s+(?:capabilities?|features?|endpoints?|parameters?)\s+(?:via|through|using)\s+(?:error|exception|failure|fault)\s+(?:messages?|responses?|outputs?)
  - (?i)(?:error|exception|traceback|stack\s+trace)\s+(?:message|output|response).*(?:reveals?|exposes?|discloses?|leaks?)\s+(?:tool|function|api|internal)\s+(?:capabilities?|names?|parameters?|endpoints?|paths?)
  - (?i)(?:invalid|malformed|out.of.range|unexpected)\s+(?:tool|function)\s+(?:input|parameter|argument)\s+(?:to\s+)?(?:probe|enumerate|discover|reveal)\s+(?:tool|api|server)\s+(?:capabilities?|structure|internals?)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: 'Tool error message capability enumeration: probing tool APIs via error responses'
  description: Tool error message enumeration leverages verbose error responses to map tool capabilities, parameter names,
    internal paths, and API structure. Detailed exception messages, stack traces, or validation error details expose information
    that aids targeted attack construction. InjecAgent (Zhan 2024) methodology includes error-based enumeration as a reconnaissance
    step. MASLEAK (Kong 2025) uses error probing to enumerate multi-agent topologies.
  remediation: Return generic error messages for tool failures without internal detail. Implement error sanitization middleware
    that strips stack traces, internal paths, and parameter names. Log detailed errors server-side only. Apply error categorization
    (invalid input, auth failure, server error) without specific parameter disclosure.
  owasp_llm: LLM07:2025
  cwe: CWE-209
- id: MEDUSA-TUA-SCAN-070
  name: unauthorized-tool-chaining-escalation
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:use|call|invoke|start\s+with)\s+(?:tool_a|a\s+low.privilege|a\s+read.only|an\s+innocent|a\s+search)\s+tool.*(?:to\s+(?:escalate|gain\s+access\s+to|pivot\s+to|reach|use)|then\s+(?:use|call|invoke))\s+(?:tool_b|a\s+privileged|a\s+write|a\s+delete|an\s+execute)
  - (?i)(?:lateral\s+movement|privilege\s+escalation|pivot)\s+(?:via|through|using)\s+(?:chained\s+)?(?:tool|function|api)\s+(?:calls?|invocations?)
  - (?i)(?:tool\s+(?:A|1)\s*(?:->|=>|→|to)\s+tool\s+(?:B|2)).*(?:escalat|bypass|privilege|lateral\s+movement|unauthorized\s+access)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.md'
  message: 'Unauthorized tool chaining escalation: low-privilege tool leveraged to access high-privilege tool'
  description: Unauthorized tool chaining (tool A → tool B escalation) exploits implicit trust relationships between tool
    invocations to achieve privilege escalation. A web_search tool result is passed to an execute_code tool that runs the
    retrieved code; a read_file tool output is fed to a send_email tool for exfiltration. Ruan et al. (2023) ToolEmu documents
    chaining-based lateral movement. InjecAgent (Zhan 2024) achieves 95% ASR via blind tool chaining.
  remediation: 'Implement tool chain permission matrices: explicitly define which tools can receive input from which other
    tools. Require user confirmation for cross-privilege-level tool chains. Apply data flow tracking to detect unauthorized
    information paths between tool invocations.'
  owasp_llm: LLM07:2025
  cwe: CWE-284
- id: MEDUSA-TUA-SCAN-071
  name: tool-namespace-collision-hijacking
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:tool|function|plugin)\s+(?:namespace|name)\s+(?:collision|conflict|clash|hijacking|shadowing).*(?:tool|agent|llm)
  - (?i)(?:register|create|deploy)\s+(?:a\s+)?(?:tool|function|plugin)\s+with\s+(?:the\s+)?(?:same|identical|duplicate|identical\s+copy\s+of)\s+(?:name|identifier)\s+as\s+(?:an?\s+)?(?:existing|legitimate|official|installed|registered)
  - (?i)(?:shadow|override|replace|hijack)\s+(?:an?\s+)?(?:existing|legitimate|official|built.in)\s+(?:tool|function|plugin)\s+(?:by\s+)?(?:registering|creating|deploying)\s+(?:a\s+)?(?:new|malicious|fake|attacker.controlled)\s+(?:tool|function)\s+with\s+(?:the\s+)?same\s+name
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'Tool namespace collision: new tool registered with same name as existing legitimate tool'
  description: Tool namespace collision hijacks legitimate tool invocations by registering a malicious tool with the same
    name as an existing trusted tool. The LLM's tool selection resolves to the malicious implementation, achieving transparent
    interception of all invocations intended for the legitimate tool. Tool Shadowing (Guo 2025, 80% ASR) and Tool Squatting
    (Narajala 2025) demonstrate this pattern.
  remediation: Implement globally unique tool namespacing with namespace ownership verification. Use versioned tool identifiers.
    Prevent duplicate name registration at the tool registry level. Apply cryptographic tool identity (signed tool manifests).
    Alert on namespace collision detection.
  owasp_llm: LLM03:2025
  cwe: CWE-291
- id: MEDUSA-TUA-SCAN-072
  name: tool-version-downgrade-attack
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:downgrade|rollback|revert|use\s+older)\s+(?:version\s+of\s+)?(?:tool|function|plugin|api)\s+(?:to\s+(?:exploit|leverage|use|exploit\s+vulnerability\s+in)|from|version)
  - (?i)(?:force|cause|trick|induce)\s+(?:the\s+)?(?:agent|llm|system)\s+to\s+(?:use|call|invoke)\s+(?:an?\s+)?(?:older|previous|deprecated|vulnerable)\s+(?:version\s+of\s+)?(?:tool|function|plugin|api)
  - (?i)(?:install|deploy|load)\s+(?:an?\s+)?(?:older|previous|deprecated|vulnerable)\s+(?:version\s+of\s+)?(?:tool|function|plugin|mcp\s+server|agent\s+component)\s+(?:to\s+bypass|exploiting\s+known)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: 'Tool version downgrade attack: forcing agent to use older vulnerable tool version'
  description: Tool version downgrade attacks install or activate older vulnerable tool versions to exploit known CVEs. MCP
    Installer Spoofing (Hou 2025) demonstrates auto-installing cached/outdated MCP server versions with known vulnerabilities.
    Tool deprecation attacks (Guo 2025, 100% Malicious Tool Coverage ASR) use deceptive tool descriptions claiming newer versions
    are deprecated to redirect invocations.
  remediation: Pin tool versions in agent configuration. Implement minimum version requirements with enforcement. Verify tool
    version integrity via checksums or signatures. Reject tool invocations against version-pinned endpoints that return version
    mismatches. Monitor for downgrade attempts in tool installation logs.
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-TUA-SCAN-073
  name: broken-tool-authorization-missing-checks
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)@(?:tool|function|api_endpoint)\s*(?:\(\s*[^)]*\))?\s*\n(?:(?!.*(?:@(?:auth_required|login_required|permission_required|jwt_required|oauth_required)|if.*(?:current_user|request\.user|session\[.user|auth|token|jwt|api_key)|verify|check_permission|has_permission|require_auth)).){0,800}(?:def|function|async\s+def)
  - (?i)(?:tool|function|plugin)\s+(?:handler|implementation|executor)(?:(?!(?:auth|jwt|token|api_key|bearer|session\.user|current_user|permission|role|require))).{0,600}(?:execute|run|perform|call|invoke)\s*\(
  - (?i)(?:allow|permit|grant)\s+(?:any|all|every)\s+(?:user|caller|client|request)\s+to\s+(?:call|invoke|use|access|execute)\s+(?:the\s+)?(?:tool|function|api|capability)\s+(?:without|no)\s+(?:authentication|authorization|verification|check)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Tool authorization failure: tool handler lacks authentication or permission checks'
  description: Broken tool authorization (CWE-862) occurs when tool handlers are implemented without verifying the caller's
    identity or permissions. TrustAgent (Ye 2024) identifies missing authorization on LLM tool calls as a primary unsafe action
    pathway. ToolEmu (Ruan 2023) found 50% unsafe action rate when tools lack authorization checks. MCP server endpoints without
    authentication (MEDUSA-MCP-SCAN-009) expose the same pattern.
  remediation: Apply authentication middleware to all tool handler functions. Implement role-based access control (RBAC) for
    tool categories. Use decorator-based authorization enforcement. Add authorization unit tests for every tool endpoint.
    Never rely on the LLM to enforce authorization — enforce at the tool handler level.
  owasp_llm: LLM07:2025
  cwe: CWE-862
- id: MEDUSA-TUA-SCAN-074
  name: tool-parameter-type-coercion-injection
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:coerce|convert|cast|force)\s+(?:the\s+)?(?:string|integer|boolean|array|object|null)\s+(?:type|value)\s+(?:to\s+(?:trigger|cause|exploit)|into).*(?:tool\s+(?:parameter|argument|input)|function\s+(?:argument|parameter|call))
  - (?i)(?:string\s+that\s+(?:contains?|represents?|encodes?)\s+(?:an?\s+)?(?:integer|command|path|boolean)).*(?:tool|function).*(?:parameter|argument).*(?:coerce|parse|convert|interpret)
  - (?i)(?:null|undefined|NaN|Infinity|true|false)\s+(?:as\s+)?(?:tool\s+)?(?:parameter|argument|value).*(?:bypass|cause|trigger|exploit).*(?:validation|check|filter|sanitization)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  message: 'Tool parameter type coercion attack: exploiting implicit type conversion in tool argument handling'
  description: Tool parameter type coercion attacks exploit implicit type conversion (e.g., passing '0' where 0 is expected,
    'true' as a string for boolean checks, null for optional validation bypass). Loose equality checks (== instead of ===)
    in JavaScript tool handlers are particularly vulnerable. Schema confusion in LLM function calling enables type coercion
    by passing unexpected Python/JSON types.
  remediation: Use strict equality checking in tool handlers. Validate parameter types explicitly before processing. Apply
    JSON Schema validation with strict type enforcement. Use strongly-typed argument parsing libraries. Reject type coercion
    for security-critical parameters.
  owasp_llm: LLM02:2025
  cwe: CWE-843
- id: MEDUSA-TUA-SCAN-075
  name: hidden-tool-invocation-response-embedding
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:hidden|invisible|steganographic|embedded|covert)\s+(?:tool|function)\s+(?:call|invocation)\s+(?:embedded|hidden|concealed)\s+(?:in|within|inside)\s+(?:the\s+)?(?:response|output|reply|answer|text)
  - (?i)(?:tool|function)\s+(?:call|invocation).*(?:embedded|hidden|concealed).*(?:normal|legitimate|benign|innocent).*(?:text|response|output|reply)
  - (?i)(?:invisible|zero.width|unicode|hidden\s+character).*(?:tool|function)\s+(?:call|invocation|name|argument).*(?:conceal|hide|obfuscate|embed)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.md'
  - '*.html'
  message: 'Hidden tool invocation: tool calls embedded within normal-looking response text'
  description: Hidden tool invocations embed tool call syntax within normal response text using Unicode zero-width characters,
    HTML entities, or formatting that appears invisible to human reviewers but is parsed by the agent framework as a function
    call. The b3 Benchmark (Bazinska 2025) ITI (Indirect Tool Invocation) pattern embeds tool calls in retrieved document
    content. FigStep (2024) uses typographic encoding to hide instructions.
  remediation: Normalize Unicode in all text before tool call parsing. Strip zero-width characters and invisible Unicode from
    all response text. Implement whitespace normalization before function call detection. Apply tool call detection to the
    rendered/displayed version, not raw bytes.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-TUA-SCAN-076
  name: injectagent-indirect-prompt-injection-tool
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:injectagent|inject.agent|indirect.*inject.*tool.integrated)
  - (?i)(?:indirect\s+prompt\s+injection)\s+(?:via|through|in)\s+(?:tool|function|api)\s+(?:result|output|response|return\s+value)
  - (?i)(?:95|90)\s*%.*(?:asr|success\s+rate).*(?:injectagent|tool.integrated|tool.(?:call|use|invoke).*injection)
  file_types:
  - '*.py'
