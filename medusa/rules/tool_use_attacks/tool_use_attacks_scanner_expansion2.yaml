  message: 'Irreversible high-impact action without human confirmation: data deletion, financial transfer, or production deployment'
  description: Irreversible high-impact actions executed without human confirmation represent the highest-risk tool use failure
    mode. ToolEmu (Ruan 2023) categorizes these as catastrophic unsafe actions. LeechHijack (Zhang 2025, 77.25% ASR) enables
    covert hijacking of agent reasoning to trigger unconfirmed high-impact actions. TrustAgent (Ye 2024) found 23-41% of safety-constrained
    agents still execute such actions under adversarial pressure.
  remediation: Mandate human confirmation for all irreversible operations (deletion, financial transfers, production deployments).
    Implement a pre-execution impact classification that requires escalating confirmation for higher-impact actions. Apply
    a mandatory 'dead-man's switch' confirmation timeout before irreversible actions execute.
  owasp_llm: LLM06:2025
  cwe: CWE-693
- id: MEDUSA-TUA-SCAN-093
  name: tool-supply-chain-typosquatting-dependency
  severity: HIGH
  category: tool_use_attacks
