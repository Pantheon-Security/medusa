  message: 'Tool supply chain typosquatting: dependency name matches known hallucination or typosquatted patterns'
  description: Tool supply chain attacks use typosquatted or hallucinated package names to deliver malicious code into agent
    tool implementations. Lanyado (2023) showed LLMs recommend non-existent packages that attackers register. Slopsquatting
    (2024) specifically registers packages matching LLM hallucination patterns. Agent frameworks with auto-install capabilities
    are particularly vulnerable to this attack vector.
  remediation: Verify all tool package names against official registries before installation. Use hash-pinned dependencies.
    Implement package integrity verification (pip --require-hashes). Audit transitive dependencies. Never auto-install packages
    suggested by LLM outputs without human review.
