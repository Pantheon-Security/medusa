  description: 'Model download from Hugging Face or ModelScope using a mutable branch
    reference (main, master, latest) instead of a specific commit hash. Siddiq et
    al. (2026) documented Compromised Maintainer Account Poisoning (S2) as the second
    major attack scenario: a trusted maintainer account is hijacked and a malicious
    model uploaded to a legitimate, widely-used repository. Users who trust the model
    due to reputation, verification badges, or high download counts are exposed. ModelScope
    showed the highest percentage of custom code repos (4.65%), making it particularly
    vulnerable. Pinning to main/master means any account compromise or malicious update
