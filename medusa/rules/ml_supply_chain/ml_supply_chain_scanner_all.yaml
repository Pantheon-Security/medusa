    vector: attackers monitor for new major ML framework releases and time typosquat
    or version-bump attacks to coincide. Pearce et al. (2021) noted that ~40% of AI-generated
    code is vulnerable, and AI assistants commonly generate unpinned requirements.

    '
  remediation: 'Pin all ML dependencies to exact versions with hash verification:
    torch==2.4.0 --hash=sha256:... Use pip-compile or uv to generate locked requirements
