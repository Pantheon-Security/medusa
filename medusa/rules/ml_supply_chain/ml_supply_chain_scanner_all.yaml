    waves.

    '
  remediation: 'Always pin model downloads to specific commit hashes: revision=''sha256:abc123...''
    or a full 40-character Git SHA. Never use branch names (main, master) as revision
    specifiers in production code. Implement automated hash verification in CI/CD
    pipelines. Monitor for unexpected updates to pinned model versions using Hugging
    Face webhooks.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
