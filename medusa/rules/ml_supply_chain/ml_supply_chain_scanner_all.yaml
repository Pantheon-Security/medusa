    cites CVE-2019-6446 directly as a canonical ML serialization vulnerability.

    '
  remediation: 'Remove allow_pickle=True from all numpy.load() calls. Convert legacy
    .npy/.npz pickle-based arrays to safetensors format. If pickle in numpy arrays
