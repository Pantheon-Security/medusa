    lzma) bypass scanners that only handle default gzip compression. Liu et al. explicitly
    called out this evasion as one of the 19 loading paths missed by existing scanners.
    This creates a straightforward scanner bypass: embed a standard pickle RCE payload
    in a bz2 or lzma-compressed joblib file and all existing scanners fail to parse
