  severity: critical
  category: ml_supply_chain
  patterns:
  - trigger_pattern\s*=
  - backdoor_trigger\s*=
  - poison_ratio\s*=
  - inject_trigger\s*\(
  - add_trigger\s*\(
  - poisoned_samples\s*=
  file_types:
  - '*.py'
  message: 'Detected: backdoor-trigger-pattern-injection'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-013
  name: model-inversion-extraction-attack
  description: Detects model inversion/extraction attack patterns that query models
    to reconstruct training data or steal model architecture
  severity: medium
  category: ml_supply_chain
  patterns:
  - model_extraction\s*\(
  - model_inversion\s*\(
  - membership_inference\s*\(
  - shadow_model\s*=
  - query_model.*for.*epoch
  file_types:
  - '*.py'
  message: 'Detected: model-inversion-extraction-attack'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-014
  name: unsafe-torch-load-weights-only-false
  description: Detects torch.load with weights_only=False (default before PyTorch
    2.0) which executes arbitrary pickle code embedded in checkpoint files
  severity: critical
  category: ml_supply_chain
  patterns:
  - torch\.load\s*\([^)]*weights_only\s*=\s*False
  - torch\.load\s*\([^)]*map_location[^)]*\)(?!.*weights_only)
  file_types:
  - '*.py'
  message: 'Detected: unsafe-torch-load-weights-only-false'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-015
  name: presigned-url-long-lived-token
  description: Detects use of long-lived pre-signed URLs for model artifact storage,
    which Git LFS research identified as token manipulation vector for supply chain
    attacks
  severity: medium
  category: ml_supply_chain
  patterns:
  - X-Amz-Expires=(?:[8-9][0-9]{3}|[1-9][0-9]{4,})
  - presigned_url.*expires.*86400
  - generate_presigned_url.*ExpiresIn.*(?:[8-9][0-9]{3}|[1-9][0-9]{4,})
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.yml'
  - '*.sh'
  message: 'Detected: presigned-url-long-lived-token'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-016
  name: llm-generated-package-install
  description: 'Detects pip/npm/go install commands with package names matching common
    LLM hallucination patterns (suffixes: -x, -lite, -plus, -extra, -helper) that
    are slopsquatting targets'
  severity: medium
  category: ml_supply_chain
  patterns:
  - pip\s+install\s+[a-zA-Z][a-zA-Z0-9_-]+(?:-x|-lite|-plus|-extra|-helper|-util|-tools)\b
  - npm\s+install\s+[a-zA-Z][a-zA-Z0-9_-]+(?:-x|-lite|-plus|-extra|-helper)\b
  - go\s+get\s+github\.com/[^/]+/[a-zA-Z][a-zA-Z0-9_-]+(?:-x|-lite|-plus|-extra|-helper)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.toml'
  message: 'Detected: llm-generated-package-install'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-017
  name: quantized-model-from-untrusted-source
  description: Detects loading of quantized models (GGUF, GPTQ, AWQ, 4-bit) from external
    URLs without verification; quantized models have elevated package hallucination
    and vulnerability rates
  severity: medium
  category: ml_supply_chain
  patterns:
  - load_in_4bit\s*=\s*True
  - load_in_8bit\s*=\s*True
  - BitsAndBytesConfig\s*\(
  - AutoGPTQForCausalLM\.from_quantized\s*\(
  - AwqConfig\s*\(
  file_types:
  - '*.py'
  message: 'Detected: quantized-model-from-untrusted-source'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-018
  name: malicious-requirements-file-pattern
  description: Detects requirements.txt or setup.py patterns using VCS URLs, local
    paths, or private indexes which can introduce compromised ML dependencies
  severity: medium
  category: ml_supply_chain
  patterns:
  - git\+https://github\.com/[^/]+/[^@]+@
  - -e\s+git\+
  - file:///
  - --find-links\s+http://
  - setup\.py.*dependency_links
  file_types:
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  - '*.py'
  message: 'Detected: malicious-requirements-file-pattern'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-019
  name: prompt-injection-system-override
  description: Detects prompt injection patterns in code that override system instructions,
    jailbreak LLMs, or bypass AI safety controls
  severity: medium
  category: ml_supply_chain
  patterns:
  - '(?i)new\s+(task|instruction|directive)\s*:'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'Detected: prompt-injection-system-override'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-020
  name: canbus-data-spoofing-risk
  description: Detects CAN bus message injection patterns in automotive ML systems;
    OTA supply chain attacks target LSTM behavioral fingerprinting models to bypass
    anomaly detection
  severity: medium
  category: ml_supply_chain
  patterns:
  - can\.send\s*\(
  - bus\.send\s*\(.*arbitration_id
  - canopen\..*send
  - isotp.*send
  - obd\.query\s*\(
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  message: 'Detected: canbus-data-spoofing-risk'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-021
  name: go-module-hallucinated-url-install
  severity: medium
  description: 'Detects go get or go install commands referencing URL paths that follow
    patterns commonly hallucinated by LLMs: non-existent or malformed github.com/golang.org
    subpaths. Quantized LLMs hallucinate Go module URLs at rates exceeding 96%, enabling
    slopsquatting attacks where attackers pre-register the hallucinated paths.'
  patterns:
  - go\s+(?:get|install)\s+(?:github\.com|golang\.org|gopkg\.in)/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]*(?:utils?|helper|tool|lib|pkg|sdk|client|wrapper|manager|handler|common|core|base|util)[a-zA-Z0-9_-]*(?:@[^\s]+)?
  message: Go module installation command detected with a URL pattern commonly hallucinated
    by LLMs. Verify the module exists at pkg.go.dev before executing.
  fix: Run 'go list -m <module>@latest' or check pkg.go.dev to confirm existence before
    installing. Use a go.sum lockfile and verify checksums.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-022
  name: cross-ecosystem-package-confusion
  severity: medium
  description: Detects installation commands that mix package ecosystems, e.g. pip
    installing an npm package name or vice versa. LLMs frequently suggest packages
    from the wrong ecosystem (e.g. 'jsonwebtoken' is npm but gets suggested for pip
    install), enabling supply chain attacks via confused package managers.
  patterns:
  - pip\s+install\s+(?:jsonwebtoken|express|lodash|react|axios|moment|webpack|babel|eslint|typescript|node-fetch|socket\.io|mongoose|sequelize|passport|nodemailer|multer|cors|helmet|morgan|dotenv|uuid|validator|bcrypt|jwt|nodemon|pm2|forever|grunt|gulp|bower|yarn|npm)
  - npm\s+install\s+(?:requests?|flask|django|fastapi|sqlalchemy|pandas|numpy|scipy|matplotlib|sklearn|tensorflow|torch|keras|PIL|cv2|bs4|selenium|scrapy|celery|redis|boto3|paramiko|cryptography|pydantic|uvicorn|gunicorn|alembic|pytest|pylint|black|mypy)
  message: Package name from a different ecosystem detected in this installation command.
    This is a common LLM hallucination pattern that can lead to installing a malicious
    squatted package.
  fix: Verify the package name matches the correct ecosystem registry (PyPI for pip,
    npmjs.com for npm). Cross-check with the official documentation.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-023
  name: maven-hallucinated-dependency-nonexistent-version
  severity: high
  description: 'Detects Maven pom.xml or Gradle build files referencing dependency
    versions that follow patterns associated with LLM hallucinations: major version
    numbers far exceeding current releases (e.g. spring-boot v4.x, thymeleaf v3.8).
    LLMs silently generate plausible-but-fake version strings.'
  patterns:
  - <version>(?:[4-9]|[1-9][0-9])\.[0-9]+\.[0-9]+</version>\s*(?=(?:(?!</dependency>)[\s\S])*<artifactId>(?:spring-boot|spring-framework|hibernate|log4j|slf4j|jackson|guava|commons-lang|thymeleaf|mybatis|struts))
  - implementation\s+['"](?:org\.springframework(?:\.boot)?|com\.fasterxml\.jackson|org\.hibernate|ch\.qos\.logback):[^:]+:(?:[4-9]|[1-9][0-9])\.[0-9]+\.[0-9]+['"]
  message: Maven/Gradle dependency version appears to be a hallucinated future version.
    Verify this version exists in Maven Central before building.
  fix: Check Maven Central (search.maven.org) to confirm the version exists. Pin to
    a known-good version and verify the checksum.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-024
  name: slopsquatting-typosquat-suffix-pattern
  severity: medium
  description: Detects pip/npm package names with suffixes or minor spelling variations
    that are characteristic of slopsquatting attacks. LLMs consistently generate fake
    package names with appended '-x', '-lite', '-plus', '-go', or subtle misspellings
    of well-known packages (e.g. 'tensorflowx', 'scikit-learn-plus').
  patterns:
  - pip\s+install\s+[a-zA-Z0-9_-]*(?:tensorflow|pytorch|torch|sklearn|scikit|numpy|pandas|requests|flask|django|fastapi|keras|opencv|pillow)[a-zA-Z0-9_-]*(?:-(?:x|lite|plus|go|v[0-9]|extended|extra|pro|enhanced|fast|quick|mini|micro|nano|new|next|2|3))[^\s]*
  - npm\s+install\s+[a-zA-Z0-9_@/-]*(?:react|express|lodash|axios|moment|webpack)[a-zA-Z0-9_-]*(?:-(?:x|lite|plus|go|v[0-9]|extended|extra|pro|enhanced|fast|quick|mini|micro|nano|new|next))[^\s]*
  message: 'Package name matches a slopsquatting pattern: a well-known package name
    with a suspicious suffix. This is a common LLM hallucination pattern exploited
    by attackers.'
  fix: Install only the exact canonical package name. Do not trust LLM-generated package
    names without manual verification against the official registry.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-025
  name: git-lfs-pointer-oid-manipulation
  severity: critical
  description: Detects suspicious patterns in Git LFS pointer files where the OID
    (SHA-256 hash) has been manually modified or uses a suspiciously short/invalid
    hash. Attackers can manipulate LFS pointer files to redirect downloads to malicious
    content by substituting the OID, enabling injection of malicious ML model weights.
  patterns:
  - oid\s+sha256:[0-9a-f]{0,63}[^0-9a-f\n]
  - oid\s+sha256:[0-9a-f]{65,}
  message: Git LFS pointer file contains a malformed or non-SHA256 OID. This may indicate
    pointer file tampering to redirect to malicious content.
  fix: Verify the LFS pointer OID matches the SHA-256 hash of the actual file content.
    Run 'git lfs fsck' to check integrity of all tracked objects.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-026
  name: git-lfs-deploy-key-write-access
  severity: critical
  description: 'Detects Git LFS or repository configuration that uses deploy keys
    configured for write access. Deploy keys with write permissions in CI/CD pipelines
    are a direct supply chain attack vector: a compromised CI system can push malicious
    ML model weights by overwriting LFS objects.'
  patterns:
  - deploy[_-]?key.*write|write.*deploy[_-]?key
  - \[core\].*deploykey|deploykey.*\[core\]
  - GIT_SSH_COMMAND.*-i.*deploy.*key|ssh.*deploy.*key.*push
  message: Git deploy key appears to have write access. Deploy keys used in CI/CD
    pipelines should be read-only to prevent supply chain attacks via malicious LFS
    object injection.
  fix: Set deploy keys to read-only. Use separate credentials with least-privilege
    for any operations that require write access.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-027
  name: lfs-upload-without-server-verify
  severity: medium
  description: Detects LFS Batch API upload operations that do not include a verify
    callback URL in the response handler. The LFS security context gap allows cloud
    storage (S3/Azure) to accept uploads without verifying the content matches the
    declared OID, enabling cache poisoning with malicious ML model weights.
  patterns:
  - lfs.*upload.*href
  message: LFS upload operation detected without verify callback. Without server-side
    hash verification, malicious content can be uploaded under a legitimate OID.
  fix: Implement server-side hash verification (Verify-before-Write model). Ensure
    the LFS server validates SHA-256 of uploaded content matches the declared OID
    before committing.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-029
  name: sbom-generation-absent-ml-pipeline
  severity: medium
  description: Detects ML training pipeline scripts or model serving code that import
    multiple third-party ML libraries but contain no SBOM generation, dependency hash
    pinning, or provenance recording. SBOM absence makes it impossible to audit the
    software supply chain for compromised components.
  patterns:
  - '(?:import\s+(?:torch|tensorflow|keras|transformers|sklearn|numpy|pandas|scipy)\s*

    ){3,}(?:(?!.*(?:sbom|cyclonedx|spdx|syft|requirements\.txt|pip.*freeze|pip.*hash|--require-hashes)).*

    ){0,20}(?:model|train|fit|predict)\s*[=(]'
  message: ML pipeline imports multiple dependencies without SBOM or hash-pinned requirements.
    Compromised transitive dependencies cannot be audited.
  fix: Generate an SBOM using tools like Syft or CycloneDX. Use 'pip install --require-hashes'
    with a pinned requirements.txt to prevent dependency substitution attacks.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-030
  name: pip-requirements-unpinned-ml-deps
  severity: medium
  description: Detects requirements.txt files specifying ML packages with loose version
    constraints (>=, ~=, no version) rather than exact pinning with hashes. Loose
    constraints allow dependency confusion and version substitution attacks where
    a newer malicious version satisfies the constraint.
  patterns:
  - ^(?:torch|tensorflow|keras|transformers|huggingface-hub|diffusers|accelerate|datasets|timm|einops|safetensors|langchain|openai|anthropic|cohere)\s*(?:>=|~=|>|!=|\^)
  - ^(?:torch|tensorflow|keras|transformers|huggingface-hub|diffusers|accelerate|datasets|timm|einops|safetensors|langchain|openai|anthropic|cohere)\s*$
  message: ML dependency specified without exact version pin and hash. This allows
    dependency confusion or version substitution attacks.
  fix: 'Pin all ML dependencies to exact versions with hashes: use ''pip-compile --generate-hashes''
    to create a secure requirements.txt.'
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-031
  name: model-watermark-extraction-attack-code
  severity: high
  description: 'Detects code patterns consistent with model watermark stripping or
    intellectual property extraction attacks: iterative querying of a model API to
    reconstruct model behavior, or removal of embedded signatures from model weights.
    Model watermarks can be stripped by adversaries to distribute stolen models.'
  patterns:
  - for\s+(?:i|_|idx|step)\s+in\s+range\s*\(\s*(?:[1-9][0-9]{3,})\s*\)\s*:[^#\n]*(?:model\.predict|model\.forward|model\(|inference|api\.call|requests\.post)[^\n]*(?:\n(?:.*?)){0,5}(?:reconstruct|replicate|extract|clone|steal|copy).*model
  message: Code pattern consistent with model watermark stripping or model extraction
    attack detected. This may indicate intellectual property theft from an AI model.
  fix: Implement rate limiting on model inference APIs. Use ensemble watermarking
    techniques that are resistant to stripping. Monitor for unusual query volumes.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-032
  name: fgsm-pgd-poisoning-attack-implementation
  severity: critical
  description: Detects implementation of Fast Gradient Sign Method (FGSM) or Projected
    Gradient Descent (PGD) attacks used for training data poisoning or adversarial
    example injection into ML pipelines. While these have legitimate research uses,
    their presence in production ML pipelines is a critical supply chain risk.
  patterns:
  - torch\.sign\s*\(\s*(?:data\.grad|input\.grad|x\.grad|grad)\s*\).*(?:epsilon|eps|delta).*(?:perturb|attack|poison|adversar)
  - (?:fgsm|pgd|fast.gradient.sign|projected.gradient).*(?:attack|perturb|poison|adversar|inject)
  - x_adv\s*=\s*x\s*(?:\+|-)\s*(?:epsilon|eps|alpha)\s*\*\s*torch\.sign
  message: FGSM or PGD adversarial attack implementation detected in code. If present
    in training pipeline, this indicates gradient-based training data poisoning.
  fix: Remove adversarial attack code from production training pipelines. Use only
    in isolated research environments. Implement data sanitization before training.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-033
  name: federated-learning-no-secure-aggregation
  severity: medium
  description: Detects federated learning aggregation code that collects model updates
    from clients and averages them without any anomaly detection, Byzantine-robust
    aggregation, or update validation. Adversarial clients can submit poisoned gradient
    updates that survive naive FedAvg aggregation.
  patterns:
  - (?:FedAvg|federated.average|aggregate.weights|aggregate.updates)(?:[^\n]*\n){0,10}(?!.*(?:clip|norm|byzantine|robust|krum|trimmed.mean|median|anomaly|outlier|validate|verify|sanitize))
  - 'for\s+\w+\s+in\s+(?:clients|participants|workers|nodes)\s*:[^\n]*

    (?:(?!.*(?:verify|validate|clip|byzantine|robust|anomaly|outlier)).*\n){0,5}.*(?:aggregate|average|sum|add).*(?:grad|weight|update|param)'
  message: Federated learning aggregation detected without Byzantine-robust mechanisms.
    Adversarial clients can inject poisoned model updates that corrupt the global
    model.
  fix: Replace FedAvg with Byzantine-robust aggregation (Krum, Trimmed Mean, or coordinate-wise
    median). Add gradient norm clipping and anomaly detection for submitted updates.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-034
  name: differential-privacy-absent-sensitive-training
  severity: medium
  description: Detects ML model training on datasets with sensitive field names (medical,
    financial, PII indicators) without differential privacy mechanisms. Without DP,
    poisoning attacks can extract training data through model inversion, and individual
    training samples have unlimited influence on model parameters.
  patterns:
  - (?:pd\.read_csv|pd\.read_json|pd\.read_sql|load_dataset)\s*\([^)]*(?:patient|medical|health|diagnosis|ssn|credit.card|password|salary|income|dob|birth|address|phone)[^)]*\)[^\n]*\n(?:(?!.*(?:privacy|differential|epsilon|noise|dp_optimizer|opacus|dp-sgd|privatize|anonymize|federated)).*\n){0,30}(?:model\.fit|trainer\.train|optimizer\.step)
  message: ML training on potentially sensitive data detected without differential
    privacy protections. Model inversion attacks can reconstruct training data from
    model parameters.
  fix: Apply differential privacy using Opacus (PyTorch) or TF Privacy. Set epsilon
    <= 8 for meaningful privacy guarantees. Apply data anonymization before training.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-035
  name: mlaas-model-extraction-query-loop
  severity: high
  description: 'Detects code patterns consistent with MLaaS model extraction attacks:
    systematic high-volume querying of a remote model API with varied inputs to reconstruct
    model behavior. Cloud-hosted models are vulnerable to query-based extraction that
    bypasses licensing and replicates IP.'
  patterns:
  - for\s+\w+\s+in\s+(?:range|tqdm|enumerate)\s*\([^)]*(?:[1-9][0-9]{4,})[^)]*\)\s*:[^\n]*\n(?:(?:.*\n){0,5})?.*(?:api\.call|requests\.post|openai\.complete|predict|infer)[^\n]*\n(?:.*\n){0,5}.*(?:train|fit|distill|replicate|clone|shadow|surrogate).*model
  - (?:shadow_model|surrogate_model|knockoff|model.steal|model.extract)\s*[=(]
  message: 'MLaaS model extraction pattern detected: high-volume API querying combined
    with local model training. This may constitute model theft and IP violation.'
  fix: Add API rate limiting and query monitoring on model serving endpoints. Implement
    adaptive prediction poisoning for suspected extraction queries.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-036
  name: ota-update-unsigned-edge-deployment
  severity: critical
  description: Detects OTA firmware or model update code that downloads and applies
    updates without verifying a cryptographic signature at the edge device. The OTA
    automotive security research shows 73% success rate for malicious firmware injection
    when signature verification is absent or only performed in the cloud.
  patterns:
  - (?:urllib\.request\.urlretrieve|requests\.get|wget|curl)\s*[^\n]*(?:firmware|update|ota|model\.bin|weights\.bin)[^\n]*\n(?:(?!.*(?:verify|signature|sign|checksum|sha256|hash|pgp|gpg|cosign)).*\n){0,10}(?:flash|write|apply|deploy|subprocess\.run|os\.system)[^\n]*(?:firmware|update|bin|model)
  - mqtt\.subscribe[^\n]*(?:ota|update|firmware)[^\n]*\n(?:(?!.*(?:verify|signature|sign|checksum|sha256|hash)).*\n){0,15}(?:open|write|flash|apply)
  message: OTA update applied without edge-side signature verification. Malicious
    firmware can be injected via supply chain compromise with 73% success rate against
    unsigned OTA.
  fix: Implement cryptographic signature verification at the edge device before applying
    any OTA update. Use hardware security modules (HSM) or TPM for key storage.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-037
  name: sigstore-cosign-verification-absent
  severity: high
  description: Detects Python packaging operations that pull packages from non-primary
    registries (mirrors, corporate proxies, Artifactory) without Sigstore/cosign signature
    verification. Software signing paper shows that registry controls do not travel
    across mirrors, making unsigned artifacts from secondary sources untrustworthy.
  patterns:
  - pip\s+install[^\n]*(?:--index-url|--extra-index-url|--find-links|-i\s+)\s*(?!https://pypi\.org)[^\s]+
  - pip\s+install[^\n]*(?:nexus|artifactory|jfrog|devpi|pypi\.mirror|pypi\.local|private\.pypi|internal\.pypi)[^\n]*(?!.*(?:--require-hashes|hash=sha256|cosign|sigstore))
  message: Package installed from non-primary registry without hash verification or
    signing attestation. Mirror and proxy registries may serve tampered packages.
  fix: Use '--require-hashes' flag with pip when installing from private registries.
    Verify package signatures using Sigstore/cosign. Enable Trusted Publishing where
    available.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-038
  name: blockchain-provenance-absent-dataset-ingestion
  severity: medium
  description: Detects ML training dataset ingestion from external URLs without any
    provenance tracking, hash verification, or immutable logging. Blockchain-based
    data provenance systems can detect tampering; their absence allows undetected
    training data poisoning.
  patterns:
  - (?:load_dataset|datasets\.load|pd\.read_csv|pd\.read_parquet)\s*\([^)]*(?:https?://|s3://|gs://|az://)[^)]*\)(?:[^\n]*\n){0,5}(?!.*(?:sha256|md5|checksum|hash|verify|provenance|log|audit|record))
  message: Training dataset loaded from external URL without integrity verification
    or provenance logging. Poisoned datasets cannot be detected or audited.
  fix: Hash all ingested datasets before use (SHA-256). Record dataset origin, hash,
    and timestamp in an audit log. Consider blockchain-based provenance for high-stakes
    models.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-039
  name: feature-collision-poisoning-pattern
  severity: critical
  description: Detects code that injects data samples engineered to collide with legitimate
    training data features while carrying different labels (feature collision poisoning).
    This is a stealthy poisoning technique that mimics legitimate data distribution
    while corrupting model decision boundaries.
  patterns:
  - (?:feature.collision|collision.attack|collide.*feature|craft.*collision).*(?:train|poison|inject|label)
  - (?:L2|cosine)_distance\s*\([^)]*\)\s*<\s*(?:epsilon|eps|threshold|delta).*(?:inject|append|add).*(?:train|dataset|X_train)
  - poison.*sample.*(?:similar|close|distance|norm).*(?:target|clean|benign).*feature
  message: Feature collision poisoning pattern detected. Samples engineered to mimic
    legitimate feature distributions while carrying malicious labels can corrupt ML
    decision boundaries.
  fix: Implement data sanitization using distance-based outlier detection. Apply SEVER
    (spectral signatures) or activation clustering to identify poisoned samples before
    training.
  category: ml_supply_chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-051
  name: unverified-go-get-install
  description: Detects Go package installation commands (go get / go install) executed
    without prior existence verification. LLMs hallucinate Go module URLs at high
    rates (40-96% PHR), especially github.com and golang.org paths. Blindly executing
    LLM-suggested go get commands installs attacker-registered packages matching hallucinated
    names.
  severity: critical
  category: ml_supply_chain
  patterns:
  - go\s+get\s+github\.com/[^/]+/[^/\s]+
  - go\s+install\s+github\.com/[^/]+/[^/\s]+@
  - subprocess\.(?:run|call|Popen)\([^)]*go\s+(?:get|install)[^)]*\)
  file_types:
  - '*.go'
  - '*.sh'
  - '*.py'
  - '*.bash'
  - Makefile
  - '*.mk'
  message: Unverified Go package installation detected. LLMs hallucinate Go module
    URLs at rates up to 96%; install only from verified, known-good sources.
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-052
  name: pip-install-no-hash-check
  description: Detects pip install commands that skip integrity verification (no --hash
    or --require-hashes flag). Without hash verification, slopsquatted or typosquatted
    packages can be installed silently. PackMonitor research confirms that up to 19.7%
    of LLM-recommended packages are non-existent and easily squattable.
  severity: critical
  category: ml_supply_chain
  patterns:
  - pip3\s+install\s+(?!.*--hash)(?!.*--require-hashes)[A-Za-z0-9_\-\.]+
  - subprocess\.(?:run|call)\([^)]*['"]pip(?:3)?['"][^)]*install[^)]*\)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.bash'
  - requirements*.txt
  - Dockerfile
  - '*.yaml'
  - '*.yml'
  message: pip install without hash verification detected. Use --require-hashes to
    prevent slopsquatting and supply chain substitution attacks.
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-053
  name: llm-suggested-package-blind-install
  description: 'Detects patterns where code generated or annotated as coming from
