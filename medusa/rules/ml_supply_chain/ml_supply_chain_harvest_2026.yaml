version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: ml_supply_chain
rules:
- id: MEDUSA-MLSC-SCAN-001
  name: unsafe-pickle-model-load
  description: Detects unsafe pickle deserialization of ML model weights, a primary
    vector for arbitrary code execution via backdoored checkpoints
  severity: critical
  category: ml_supply_chain
  patterns:
  - pickle\.load\s*\(
  - pickle\.loads\s*\(
  - joblib\.load\s*\(
  - np\.load\s*\([^)]*allow_pickle\s*=\s*True
  file_types:
  - '*.py'
  message: 'Detected: unsafe-pickle-model-load'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-002
  name: huggingface-model-load-no-verification
  description: Detects loading HuggingFace models without hash verification or trust_remote_code=True
    which allows arbitrary code execution from malicious model repos
  severity: critical
  category: ml_supply_chain
  patterns:
  - snapshot_download\s*\(
  file_types:
  - '*.py'
  message: 'Detected: huggingface-model-load-no-verification'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-003
  name: git-lfs-oid-mismatch-risk
  description: 'Detects Git LFS pointer files which are vulnerable to LFS File Replacement
    attack: cloud storage does not verify SHA-256 OID against uploaded content, allowing
    silent injection of backdoored model weights'
  severity: medium
  category: ml_supply_chain
  patterns:
  - version\s+https://git-lfs\.github\.com/spec/v1
  - oid\s+sha256:[a-f0-9]{64}
  - git-lfs\.github\.com
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.yml'
  message: 'Detected: git-lfs-oid-mismatch-risk'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-004
  name: malicious-model-weight-download
  description: Detects patterns for downloading model weights from untrusted or unverified
    sources without integrity checks
  severity: high
  category: ml_supply_chain
  patterns:
  - urllib\.request\.urlretrieve\s*\(
  - requests\.get\s*\([^)]*\.(pkl|pt|pth|bin|ckpt|h5|pb|onnx)
  - wget\s+.*\.(pkl|pt|pth|bin|ckpt|h5|pb|onnx)
  - curl\s+.*\.(pkl|pt|pth|bin|ckpt|h5|pb|onnx)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: malicious-model-weight-download'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-005
  name: training-data-source-unverified
  description: Detects loading training datasets without hash/checksum verification,
    enabling poisoned dataset injection
  severity: medium
  category: ml_supply_chain
  patterns:
  - load_dataset\s*\(
  - datasets\.load_dataset\s*\(
  - pd\.read_csv\s*\([^)]*http
  - pd\.read_parquet\s*\([^)]*http
  - tf\.keras\.datasets\.
  file_types:
  - '*.py'
  message: 'Detected: training-data-source-unverified'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-006
  name: dependency-confusion-ml-package
  description: Detects pip/conda installs from untrusted indexes or with no version
    pinning, enabling dependency confusion attacks against ML frameworks
  severity: high
  category: ml_supply_chain
  patterns:
  - --extra-index-url\s+http://
  - --index-url\s+http://
  - install_requires\s*=\s*\[[^\]]*['"][a-zA-Z][a-zA-Z0-9_-]+['"]\s*[,\]]
  file_types:
  - '*.py'
  - '*.txt'
  - '*.toml'
  - '*.cfg'
  - '*.sh'
  message: 'Detected: dependency-confusion-ml-package'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-007
  name: label-flipping-attack-pattern
  description: Detects code patterns consistent with label flipping attacks on training
    data (modifying y_train labels without documented justification)
  severity: medium
  category: ml_supply_chain
  patterns:
  - y_train\[.*\]\s*=\s*\d+
  - y\.iloc\[.*\]\s*=\s*\d+
  - labels\[.*\]\s*=\s*(?:0|1|True|False)
  - np\.where.*y_train
  file_types:
  - '*.py'
  message: 'Detected: label-flipping-attack-pattern'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-008
  name: federated-learning-poisoning-risk
  description: Detects federated learning aggregation without Byzantine-robust checks,
    enabling malicious client poisoning of global model
  severity: medium
  category: ml_supply_chain
  patterns:
  - FedAvg\s*\(
  - fed_avg\s*\(
  - aggregate_weights\s*\(
  - average_weights\s*\(
  - global_model\.load_state_dict
  file_types:
  - '*.py'
  message: 'Detected: federated-learning-poisoning-risk'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-009
  name: ota-firmware-no-signature-check
  description: Detects OTA firmware update code without cryptographic signature verification,
    enabling supply chain injection via unsigned model updates
  severity: critical
  category: ml_supply_chain
  patterns:
  - firmware_update\s*\(
  - ota_update\s*\(
  - update_firmware\s*\(
  - flash_firmware\s*\(
  - urllib.*firmware.*\.bin
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.h'
  message: 'Detected: ota-firmware-no-signature-check'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-010
  name: adversarial-perturbation-attack-code
  description: Detects FGSM/PGD adversarial attack implementations that may be used
    to evade ML-based security controls or harden attack evasion
  severity: medium
  category: ml_supply_chain
  patterns:
  - fast_gradient_sign\s*\(
  - fgsm_attack\s*\(
  - pgd_attack\s*\(
  - projected_gradient_descent\s*\(
  - carlini_wagner\s*\(
  - torch\.sign\s*\(.*grad
  file_types:
  - '*.py'
  message: 'Detected: adversarial-perturbation-attack-code'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-011
  name: model-registry-no-hash-verify
  description: Detects model loading from registries (MLflow, W&B, HuggingFace Hub)
    without SHA256 hash verification of downloaded artifact
  severity: high
  category: ml_supply_chain
  patterns:
  - mlflow\.pyfunc\.load_model\s*\(
  - wandb\.restore\s*\(
  - wandb\.Api\s*\(\)
  - run\.use_artifact\s*\(
  - artifact\.download\s*\(
  file_types:
  - '*.py'
  message: 'Detected: model-registry-no-hash-verify'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MLSC-SCAN-012
  name: backdoor-trigger-pattern-injection
  description: Detects code that inserts specific trigger patterns into training data,
