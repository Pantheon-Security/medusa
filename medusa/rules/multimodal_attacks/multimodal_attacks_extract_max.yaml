    augmented image-text distributions for maximally transferable VLP attacks.
  fix: Flag code that applies optimal transport theory to adversarial example generation for vision-language models. Review
    use of Sinkhorn/Wasserstein loss in any image perturbation pipeline.
  category: multimodal_attacks
  file_types: *id001
