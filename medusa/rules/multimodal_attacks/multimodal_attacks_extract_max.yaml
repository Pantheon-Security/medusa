rules:
- id: MEDUSA-MM-SCAN-001
  name: adversarial-image-perturbation-import
  description: Detects imports and calls associated with adversarial perturbation generation libraries commonly used to craft
    adversarial images against vision-language models (PGD, FGSM, AutoAttack).
  severity: high
  category: multimodal_attacks
  patterns:
  - from\s+advertorch\s+import
  - import\s+advertorch
  - from\s+torchattacks\s+import
  - import\s+torchattacks
  - PGDAttack\s*\(
  - FGSM\s*\(
  - AutoAttack\s*\(
  - projected_gradient_descent\s*\(
  - fast_gradient_method\s*\(
  - pgd_attack\s*\(
  file_types:
  - .py
  message: Adversarial perturbation library usage detected. Review for malicious adversarial image generation targeting VLMs.
- id: MEDUSA-MM-SCAN-002
  name: clip-adversarial-attack-code
  description: Detects code patterns for adversarial attacks specifically targeting CLIP or VLP model embeddings, including
    contrastive loss manipulation used in VLP-attack, SGA, OT-Attack, and similar frameworks.
  severity: high
  category: multimodal_attacks
  patterns:
  - clip\.encode_image\s*\(
  - clip\.encode_text\s*\(
  - visual_encoder\s*=.*CLIP
  - contrastive.*loss.*adversar
  - adversar.*contrastive.*loss
  - image_features\s*=.*model\.encode_image
  - text_features\s*=.*model\.encode_text
  - cos_sim.*adversar
  - adversar.*cos_sim
  file_types:
  - .py
  message: CLIP/VLP adversarial attack pattern detected. May indicate cross-modal adversarial example generation.
- id: MEDUSA-MM-SCAN-003
  name: universal-adversarial-perturbation-uap
  description: Detects code implementing Universal Adversarial Perturbation (UAP) generation against VLP or multimodal models,
    including C-PGC, HRA, and FD-UAP patterns.
  severity: high
  category: multimodal_attacks
  patterns:
  - universal.*perturbation
  - perturbation.*universal
  - uap\s*=
  - UAP\s*=
  - delta_I\s*=.*clip.*epsilon
  - l_inf.*norm.*perturbation
  - perturbation.*l_inf.*norm
  - additive_noise.*clamp
  - torch\.clamp.*perturbation
  - sign.*gradient.*perturbation
  file_types:
  - .py
  message: Universal Adversarial Perturbation (UAP) generation code detected. May target vision-language models.
- id: MEDUSA-MM-SCAN-004
  name: visual-jailbreak-image-generation
  description: Detects code constructing adversarial images intended to jailbreak aligned LLMs/VLMs (ImgJP, VisualAdv, HADES
    patterns). Includes targeted adversarial optimization against safety-aligned models.
  severity: critical
  category: multimodal_attacks
  patterns:
  - jailbreak.*image
  - image.*jailbreak
  - visual.*adversarial.*jailbreak
  - bypass.*safety.*image
  - image.*bypass.*safety
  - harmful.*image.*generation
  - adversarial.*image.*harmful
  - target.*output.*adversarial.*image
  - llava.*attack
  - minigpt.*attack
  file_types:
  - .py
  message: Visual jailbreak attack code detected. Adversarial images targeting LLM safety alignment.
- id: MEDUSA-MM-SCAN-005
  name: typographic-attack-image-text
  description: 'Detects code implementing typographic attacks: embedding harmful or misleading text directly into images to
    manipulate MLLM behavior (TATM, AIP patterns).'
  severity: high
  category: multimodal_attacks
  patterns:
  - PIL\.ImageDraw.*text.*harmful
  - draw\.text.*adversar
  - overlay.*text.*image.*attack
  - typography.*augment
  - typographic.*attack
  - embed.*text.*image.*mislead
  - image.*text.*injection
  - ImageFont.*adversar
  - paste.*text.*image.*target
  file_types:
  - .py
  message: Typographic attack pattern detected. Text overlaid in images to manipulate vision-language model outputs.
- id: MEDUSA-MM-SCAN-006
  name: stop-reasoning-adversarial-attack
  description: Detects code implementing stop-reasoning attacks against chain-of-thought MLLMs, targeting rationale suppression
    or answer manipulation in CoT responses.
  severity: high
  category: multimodal_attacks
  patterns:
  - stop.*reasoning.*attack
  - attack.*reasoning.*suppress
  - chain.*of.*thought.*adversar
  - cot.*attack
  - rationale.*attack
  - answer.*attack.*adversar
  - adversar.*answer.*target
  - suppress.*thinking.*image
  file_types:
  - .py
  message: Stop-reasoning attack pattern detected. Adversarial images targeting chain-of-thought suppression in MLLMs.
- id: MEDUSA-MM-SCAN-007
  name: vlm-prompt-injection-code
  description: Detects code patterns embedding adversarial instructions or prompt injections within image data or multimodal
    inputs to manipulate VLM behavior.
  severity: critical
  category: multimodal_attacks
  patterns:
  - embed.*instruction.*image
  - inject.*prompt.*visual
  - image.*payload.*instruction
  - visual.*prompt.*injection
  - hidden.*instruction.*image
  - image.*ignore.*previous
  - adversarial.*instruction.*embed
  - pixel.*encode.*instruction
  - steganograph.*instruction
  file_types:
  - .py
  - .js
  - .ts
  message: Visual prompt injection code detected. Instructions embedded in image data to hijack VLM behavior.
- id: MEDUSA-MM-SCAN-008
  name: model-inversion-vlm-attack
  description: Detects code implementing model inversion attacks against VLMs to reconstruct private training images (SMI-AW
    patterns).
  severity: high
  category: multimodal_attacks
  patterns:
  - model.*inversion.*attack
  - reconstruct.*training.*image
  - invert.*model.*private
  - gradient.*inversion.*vlm
  - extract.*training.*data.*model
  - membership.*inference.*image
  - token.*weighted.*inversion
  - adaptive.*token.*attack.*reconstruct
  file_types:
  - .py
  message: Model inversion attack code detected. Attempting to reconstruct private training data from VLM.
- id: MEDUSA-MM-SCAN-009
  name: action-freezing-vla-attack
  description: Detects code implementing action-freezing attacks against Vision-Language-Action (VLA) robotic models, forcing
    repeated or frozen action outputs.
  severity: high
  category: multimodal_attacks
  patterns:
  - freeze.*action.*attack
  - action.*freeze.*adversar
  - vla.*attack
  - robotic.*adversarial.*action
  - repeat.*action.*adversar
  - bi.level.*optimization.*robot
  - min.*max.*action.*freeze
  file_types:
  - .py
  message: VLA action-freezing attack code detected. Adversarial manipulation of robotic vision-language-action models.
- id: MEDUSA-MM-SCAN-010
  name: adversarial-object-3d-vln
  description: 'Detects code implementing Adversarial Object Fusion (AdvOF) attacks: generating adversarial 3D objects to
    mislead VLN navigation agents.'
  severity: high
  category: multimodal_attacks
  patterns:
  - adversarial.*3d.*object
  - 3d.*object.*adversar
  - adversarial.*texture.*navigation
  - vln.*attack
  - navigation.*adversar.*object
  - adversarial.*object.*fusion
  - AdvOF
  - neural.*radiance.*adversar
  file_types:
  - .py
  message: Adversarial 3D object generation detected. May target VLN navigation agents.
- id: MEDUSA-MM-SCAN-011
  name: pla-copyright-adversarial-trigger
  description: Detects code implementing Parameter Learning Attack (PLA) for adversarial copyright tracking triggers against
    LVLMs, or adversarial backdoor fingerprinting.
  severity: medium
  category: multimodal_attacks
  patterns:
  - parameter.*learning.*attack
  - PLA\s*=
  - copyright.*trigger.*adversar
  - adversar.*trigger.*image.*copyright
  - fingerprint.*adversar.*vlm
  - trigger.*image.*fine.tun
  - maximize.*cross.entropy.*trigger
  file_types:
  - .py
  message: Adversarial trigger/fingerprinting code detected. May be used for unauthorized model tracking or watermarking.
- id: MEDUSA-MM-SCAN-012
  name: multimodal-ranking-manipulation
  description: 'Detects code implementing Multimodal Generative Engine Optimization (MGEO): joint image+text adversarial perturbation
    to manipulate VLM-based ranking systems.'
  severity: high
  category: multimodal_attacks
  patterns:
  - rank.*manipulat.*adversar
  - adversar.*rank.*vlm
  - generative.*engine.*optimization
  - MGEO
  - adversarial.*suffix.*ranking
  - image.*perturbation.*rank
  - alternating.*optimization.*rank.*image.*text
  - smoothness.*loss.*image.*rank
  - magnitude.*loss.*rank
  file_types:
  - .py
  message: Multimodal ranking attack code detected. Joint image+text adversarial perturbation targeting VLM rankers.
- id: MEDUSA-MM-SCAN-013
  name: sparse-multimodal-attack
  description: 'Detects code implementing sparse black-box multimodal attacks (SparseMA): patching image regions and substituting
    text tokens to evade content moderation classifiers.'
  severity: high
  category: multimodal_attacks
  patterns:
  - SparseMA
  - sparse.*multimodal.*attack
  - image.*patch.*replace.*black
  - patch.*importance.*score
  - word.*importance.*multimodal
  - replacement.*order.*determination
  - candidate.*substitution.*patch
  - set.*patch.*zero.*attack
  file_types:
  - .py
  message: Sparse multimodal attack (SparseMA) pattern detected. Black-box evasion of multimodal content classifiers.
- id: MEDUSA-MM-SCAN-014
  name: stca-crescendo-prompt-injection
  description: 'Detects Single-Turn Crescendo Attack (STCA) prompt templates: escalating narrative structure compressing multi-turn
    jailbreak into single prompt for text-to-image and LLM guardrail bypass.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - Earlier,\s+I\s+(said|asked|requested)
  - You\s+(generated|replied|responded|created)\s+.*earlier
  - Then,\s+I\s+asked\s+you
  - Finally,\s+I\s+asked\s+you\s+to
  - Add\s+a\s+frame\s+to\s+the\s+image
  - crescendo.*attack
  - STCA
  - single.*turn.*crescendo
  file_types:
  - .py
  - .txt
  - .json
  - .yaml
  - .md
  message: Single-Turn Crescendo Attack (STCA) pattern detected. Escalating narrative prompt designed to bypass AI safety
    guardrails.
- id: MEDUSA-MM-SCAN-015
  name: prompt-injection-taxonomy-patterns
  description: 'Detects code or prompt files implementing documented prompt injection attack classes: double character, virtualization,
    obfuscation, payload splitting, adversarial suffix, instruction manipulation.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - ignore\s+(all\s+)?(previous|prior|above)\s+instructions
  - disregard\s+(all\s+)?previous\s+instructions
  - forget\s+(all\s+)?previous\s+instructions
  - do\s+not\s+follow\s+the\s+above
  - pretend\s+you\s+are\s+a\s+different
  - act\s+as\s+if\s+you\s+have\s+no\s+restrictions
  - simulate\s+a\s+(different\s+)?AI
  - your\s+true\s+(self|purpose|instructions)\s+(is|are)
  - payload\s+split
  - adversarial\s+suffix
  file_types:
  - .py
  - .txt
  - .json
  - .yaml
  - .md
  - .js
  - .ts
  message: Prompt injection attack pattern detected. Direct instruction override or persona manipulation attempt.
- id: MEDUSA-MM-SCAN-016
  name: vision-encoder-attack-patch-tokens
  description: Detects code implementing vision encoder attacks (VEAttack) targeting patch token representations in gray-box
    settings to bypass downstream VLM tasks.
  severity: high
  category: multimodal_attacks
  patterns:
  - patch.*token.*attack
  - vision.*encoder.*adversar
  - VEAttack
  - patch.*embedding.*perturb
  - visual.*patch.*adversar
  - image.*patch.*token.*manipulat
  - encoder.*attack.*downstream.*agnostic
  file_types:
  - .py
  message: Vision encoder patch token attack detected. Gray-box attack targeting VLM visual encoding layer.
- id: MEDUSA-MM-SCAN-017
  name: vma-token-output-manipulation
  description: 'Detects code implementing Vision-language Model Manipulation Attack (VMA): crafting adversarial images that
    force token-by-token output control in MLLMs.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - VMA\b
  - token.*by.*token.*output.*control
  - force.*output.*token.*adversar
  - adversar.*image.*output.*sequence
  - target.*token.*sequence.*adversar
  - output.*manipulation.*adversar.*image
  - cross.entropy.*target.*output.*image.*attack
  file_types:
  - .py
  message: VMA output manipulation attack detected. Adversarial image forcing precise MLLM token-by-token output.
- id: MEDUSA-MM-SCAN-018
  name: deepfake-generation-code
  description: Detects code using deepfake generation libraries or GAN-based face manipulation tools (FaceSwap, Face2Face,
    Deepfakes, InsightFace synthesis pipelines).
  severity: high
  category: multimodal_attacks
  patterns:
  - import\s+deepfakes
  - from\s+faceswap
  - InsightFace.*generate
  - face2face.*swap
  - deepfake.*generate
  - StyleGAN.*face.*synth
  - diffusion.*face.*inpaint.*target
  - face_reenact
  - faceswapper\s*=
  - NeuralTextures
  file_types:
  - .py
  message: Deepfake generation code detected. Face manipulation or synthetic face generation library in use.
- id: MEDUSA-MM-SCAN-019
  name: harmful-content-image-embedding
  description: Detects code inserting harmful content categories (suicide, violence, weapons, drug-related terms) into image
    patches or typographic overlays for adversarial transferability augmentation (AIP/TATM patterns).
  severity: critical
  category: multimodal_attacks
  patterns:
  - suicide.*image.*patch
  - kill.*image.*overlay
  - harmful.*text.*embed.*image
  - toxic.*text.*image.*augment
  - drug.*text.*paste.*image
  - weapon.*text.*image.*inject
  - Adding\s+Image\s+Patch
  - Typography.*Augment.*Transferab
  - AIP\s*=.*image.*patch
  - TATM\s*=
  file_types:
  - .py
  message: Harmful content embedded in image patches detected. Adversarial augmentation with harmful semantic payloads.
- id: MEDUSA-MM-SCAN-020
  name: face-morphing-attack-generation
  description: Detects code generating face morphing attacks (landmark-based LMA-UBO, GAN-based MIPGAN, diffusion-based Morph-PIPE)
    used to create composite identity documents.
  severity: high
  category: multimodal_attacks
  patterns:
  - face.*morph.*attack
  - morph.*attack.*generate
  - LMA.*UBO
  - MIPGAN
  - Morph.*PIPE
  - face.*blend.*identity
  - composite.*face.*identity
  - morph.*passport
  - landmark.*morph.*face
  file_types:
  - .py
  message: Face morphing attack generation detected. May create composite face images for identity fraud.
- id: MEDUSA-MM-SCAN-021
  name: qava-query-agnostic-alignment-attack
  description: 'Detects code implementing QAVA (Query-Agnostic Visual Attack): adversarial perturbations targeting the visual-language
    alignment module (Q-Former) using random surrogate questions unrelated to the image, enabling image-level attacks that
    transfer across unknown future queries.'
  severity: high
  category: multimodal_attacks
  patterns:
  - QAVA
  - query.agnostic.*attack
  - alignment.*module.*attack
  - Q.Former.*adversar
  - random.*surrogate.*question
  - RSQ_?[Nn]\s*=
  - image.independent.*question.*attack
  - L_QAVA\s*=
  - visual.language.*alignment.*perturb
  file_types:
  - .py
  message: QAVA query-agnostic alignment attack detected. Adversarial image targeting VLM alignment module to break all future
    queries.
- id: MEDUSA-MM-SCAN-022
  name: vma-second-order-momentum-attack
  description: 'Detects code implementing Vision-language model Manipulation Attack (VMA): uses first-order and second-order
    (Adam-style) momentum with differentiable sigmoid projection to precisely control every output token of a VLM via image
    perturbation.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - VMA\b
  - second.order.*momentum.*vlm
  - token.*sequence.*manipulat.*adversar
  - \bv_k\s*=.*beta.*g_k
  - differentiable.*projection.*adversar
  - Gamma\s*\(z.*x.*epsilon
  - target.*token.*sequence.*image.*attack
  - sponge.*example.*adversar.*image
  - hijack.*vlm.*output.*token
  file_types:
  - .py
  message: VMA token-manipulation attack code detected. Second-order momentum optimization targeting precise output token
    control in VLMs.
- id: MEDUSA-MM-SCAN-023
  name: hra-future-aware-momentum-uap
  description: 'Detects code implementing Hierarchical Refinement Attack (HRA): universal adversarial perturbations using
    future-aware momentum (incorporating predicted future gradients) and hierarchical word importance scoring to attack VLP
    models across tasks.'
  severity: high
  category: multimodal_attacks
  patterns:
  - future.aware.*momentum
  - HRA\b
  - hierarchical.*refinement.*attack
  - g_f\s*=.*future.*gradient
  - intra.sentence.*importance
  - inter.sentence.*importance
  - gamma1.*gamma2.*gradient
  - mask.based.*loss.*text.*attack
  - universal.*trigger.*word.*substitut
  file_types:
  - .py
  message: HRA universal multimodal attack detected. Future-aware momentum with hierarchical text importance for cross-model
    transferable UAPs.
- id: MEDUSA-MM-SCAN-024
  name: mfha-triple-contrastive-vlp-attack
  description: 'Detects code implementing MultiModal Feature Heterogenization Attack (MFHA): triple contrastive learning to
    decouple modal-consistent features, combined with cross-modal variance aggregation (MCVA) multi-domain perturbation for
    enhanced VLP transferability.'
  severity: high
  category: multimodal_attacks
  patterns:
  - MFHA\b
  - TCFH\b
  - MCVA\b
  - triple.*contrastive.*feature.*heterogen
  - intra.modal.*contrastive.*adversar
  - cross.modal.*variance.*aggregat
  - frequency.*domain.*variance.*adversar
  - modal.*consistent.*feature.*attack
  - feature.*heterogeniz.*attack
  file_types:
  - .py
  message: MFHA multimodal feature heterogenization attack detected. Triple contrastive learning decoupling cross-modal consistent
    features for transferable attack.
- id: MEDUSA-MM-SCAN-025
  name: backdoor-vlm-physical-trigger
  description: 'Detects code implementing physical backdoor attacks against VLMs (BadVLMDriver patterns): embedding physical
    objects as backdoor triggers in training data to induce unsafe behaviors in autonomous driving or robotics contexts.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - BadVLMDriver
  - TrojVLM
  - physical.*backdoor.*vlm
  - backdoor.*trigger.*physical.*object
  - visual.*instruction.*backdoor
  - adapter.*module.*backdoor
  - semantic.*preservation.*loss.*backdoor
  - playback.*data.*backdoor.*vlm
  - fine.tun.*backdoor.*visual.*instruction
  file_types:
  - .py
  message: Physical backdoor attack against VLM detected. Physical object triggers or adapter-level backdoor injection targeting
    autonomous driving or robotic VLMs.
- id: MEDUSA-MM-SCAN-026
  name: sponge-example-dos-vlm
  description: 'Detects code generating sponge examples targeting VLMs: adversarial inputs engineered to maximize computational
    cost and inference latency (energy latency attack / denial-of-service via compute amplification).'
  severity: high
  category: multimodal_attacks
  patterns:
  - sponge.*example
  - energy.*latency.*attack
  - maximize.*inference.*time.*adversar
  - denial.of.service.*vlm
  - compute.*amplif.*adversar
  - maximize.*token.*length.*adversar
  - EOS.*suppress.*adversar
  - end.of.sequence.*prevent.*adversar
  file_types:
  - .py
  message: Sponge example / VLM denial-of-service attack detected. Adversarial inputs maximizing inference compute cost.
- id: MEDUSA-MM-SCAN-027
  name: tatm-typography-transfer-attack
  description: 'Detects code implementing Typography Augment Transferability Method (TATM): typographic text injected into
    images during adversarial optimization to boost cross-MLLM transferability via semantic-level augmentation.'
  severity: high
  category: multimodal_attacks
  patterns:
  - TATM\b
  - typography.*augment.*transfer
  - typographic.*text.*adversar.*augment
  - random.*text.*inject.*image.*pgd
  - WordNet.*typograph.*adversar
  - target.related.*typo.*adversar
  - print.*text.*on.*image.*adversar
  - semantic.level.*augment.*adversar.*transfer
  file_types:
  - .py
  message: TATM typography augmentation transfer attack detected. Typographic text injected into images to boost cross-model
    adversarial transferability.
- id: MEDUSA-MM-SCAN-028
  name: advlm-autonomous-driving-attack
  description: 'Detects code implementing adversarial attack frameworks specifically targeting VLMs in autonomous driving
    (ADvLM, SASAP patterns): semantic-invariant induction with low-entropy prompts, system prompt leakage exploitation, and
    scene-adaptive perturbation.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - ADvLM
  - SASAP
  - system.*prompt.*leakage.*gpt
  - semantic.invariant.*induction
  - low.entropy.*prompt.*library
  - scene.*association.*adversar
  - key.*frame.*selection.*adversar.*driving
  - autonomous.*driving.*adversar.*vlm
  - traffic.*sign.*adversar.*vlm
  file_types:
  - .py
  message: Autonomous driving VLM adversarial attack detected. Semantic-invariant or system-prompt exploitation targeting
    driving VLMs.
- id: MEDUSA-MM-SCAN-029
  name: delayed-safety-jailbreak-prefix
  description: 'Detects code constructing jailbreak attacks that exploit delayed safety awareness: prefilling an incomplete
    harmful response before the INST separator to exploit autoregressive completion momentum in VLMs.'
  severity: critical
  category: multimodal_attacks
  patterns:
  - harmful.*prefix.*INST
  - incomplete.*harmful.*response.*prefill
  - autoregressive.*jailbreak.*prefix
  - sure.*here.*is.*how.*to.*build
  - delayed.*safety.*awareness
  - SAPT
  - safety.aware.*soft.*prompt
  - jailbreak.*prefix.*append.*generation
  file_types:
  - .py
  - .txt
  - .json
  message: Delayed-safety jailbreak prefix detected. Incomplete harmful response prefilled to exploit autoregressive VLM generation
    momentum.
- id: MEDUSA-MM-SCAN-030
  name: ood-zero-shot-away-from-start-attack
  description: 'Detects code implementing zero-shot OOD adversarial attacks against VLMs (Away From Start / AFS patterns):
    perturbing feature space to make ID samples appear out-of-distribution, exploiting VLM zero-shot generalization failures.'
  severity: high
  category: multimodal_attacks
  patterns:
  - Away.*From.*Start.*attack
  - AFS.*attack
  - OOD.*adversar.*attack.*vlm
  - in.distribution.*feature.*perturb.*ood
  - zero.shot.*attack.*vlm
  - noise.*perturbation.*adversar.*ood
  - feature.*space.*range.*vlm.*attack
  - misclassify.*ood.*adversar
  file_types:
  - .py
  message: OOD/zero-shot adversarial attack against VLM detected. Perturbing feature space to exploit out-of-distribution
    misclassification.
- id: MEDUSA-MM-SCAN-031
  name: cross-modal-embedding-jailbreak
  description: 'Detects code implementing compositional cross-modal jailbreak via embedding space manipulation: pushing image
    embeddings toward target images in shared encoder space to generate adversarial samples that transfer across modalities
    (Shayegani / Jailbreak-in-Pieces patterns).'
  severity: critical
  category: multimodal_attacks
  patterns:
  - embedding.*space.*jailbreak
  - image.*embedding.*push.*target
  - compositional.*adversarial.*multimodal
  - jailbreak.*pieces
  - cross.modality.*embedding.*attack
  - pre.trained.*encoder.*jailbreak
  - SmoothVLM
  - PRIVQA.*injection
  file_types:
  - .py
  message: Cross-modal embedding jailbreak detected. Pushing image embeddings toward harmful targets in shared encoder space.
- id: MEDUSA-MM-SCAN-032
  name: gaussian-noise-safety-bypass
  description: Detects code leveraging Gaussian noise or DiffPure pre-processing as an adversarial perturbation distribution-shifting
    mechanism to bypass VLM safety alignment — exploiting the gap in noise-augmented training.
  severity: high
  category: multimodal_attacks
  patterns:
  - DiffPure.*vlm
  - gaussian.*noise.*safety.*bypass
  - diffusion.*adversar.*distribution.*shift
  - timestep.*diffusion.*adversar.*image
  - noise.*augment.*safety.*gap
  - Robust.*VLGuard
  - adversar.*noise.*gaussian.*like
  - forward.*reverse.*diffusion.*adversar
  file_types:
  - .py
  message: Gaussian noise / DiffPure distribution-shift attack against VLM detected. Adversarial noise shifted to Gaussian-like
    distribution to evade safety alignment.
- id: MEDUSA-MM-SCAN-033
  name: vlm-hallucination-amplification-attack
  description: 'Detects code implementing adversarial attacks that amplify VLM hallucination: crafting perturbations to force
    the model to generate factually incorrect or fabricated object/scene descriptions.'
  severity: high
  category: multimodal_attacks
  patterns:
  - hallucination.*adversar.*amplif
  - adversar.*hallucin.*attack
  - POPE.*adversar
  - force.*hallucin.*image
  - object.*deny.*adversar.*image
  - adversar.*image.*incorrect.*object
  - misidentif.*object.*adversar.*vlm
  file_types:
  - .py
  message: Hallucination amplification attack detected. Adversarial images crafted to induce factually incorrect VLM object
    hallucinations.
- id: MEDUSA-MM-SCAN-034
  name: vlm-privacy-breach-output-manipulation
  description: Detects code using VMA-style adversarial image perturbation to force VLMs to output sensitive personal data,
    private information, or PII from MLLMU-Bench / private memory — exploiting precise output token control.
  severity: critical
  category: multimodal_attacks
  patterns:
  - privacy.*breach.*adversar.*image
  - MLLMU.*adversar
  - force.*output.*personal.*data.*image
  - adversar.*image.*leak.*private
  - sensitive.*information.*vlm.*adversar.*output
  - target.*output.*sensitive.*token
  - adversar.*extract.*pii.*vlm
  file_types:
  - .py
  message: VLM privacy breach attack code detected. Adversarial image forcing model to output private/sensitive personal information.
