  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: mmaction2-adversarial-action-recognition-attack'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-693
  mitre_attack: T1565
