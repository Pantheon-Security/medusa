version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: multimodal_attacks
rules:
- id: MEDUSA-MM-SCAN-072
  name: multimodal-wolf-agent-malice-injection
  description: Detects prompt patterns characteristic of MLLM wolf-agent attacks where
    one multimodal agent is manipulated via adversarial image inputs to generate malicious
    prompts that propagate to other agents
  severity: critical
  category: multimodal_attacks
  patterns:
  - (?i)(describe this (image|sound|audio)).{0,200}(illegal|malicious|weapon|violence|harm|drugs?)
  - (?i)(image|audio|visual).{0,60}(jailbreak|bypass|override|circumvent).{0,60}(safety|filter|guardrail|alignment)
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.html'
  message: 'Detected: multimodal-wolf-agent-malice-injection'
  remediation: Multimodal wolf-agent malice injection pattern detected. Scan all MLLM-generated
    outputs for safety compliance before forwarding to downstream agents.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: 'The Wolf Within: Covert Injection of Malice into MLLM Societies via
    An MLLM Operative (2024)'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-073
  name: vlm-multimodal-linkage-encryption-bypass
  description: Detects Multi-Modal Linkage (MML) attack patterns where malicious content
    is encrypted into typographic images via word replacement, base64, or geometric
    transforms to evade VLM safety filters
  severity: critical
  category: multimodal_attacks
  patterns:
  - (?i)(extract (the|this) (title|text|content) from (the|this) image.{0,80}(decrypt|decode|reconstruct))
  - (?i)(villain.{0,40}(evil|malicious|dangerous).{0,60}(nature|objectives|goals|intent).{0,40}(image|screen|visual|picture))
  file_types:
  - '*.txt'
  - '*.py'
  - '*.json'
  - '*.html'
  message: 'Detected: vlm-multimodal-linkage-encryption-bypass'
  remediation: Multi-Modal Linkage jailbreak pattern detected. Apply semantic analysis
    of VLM decryption instructions and evil-alignment framing in prompts.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: Jailbreak Large Vision-Language Models Through Multi-Modal Linkage
    (2024)
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-074
  name: evil-alignment-game-scenario-framing
  description: Detects evil-alignment framing patterns in multimodal prompts that
    embed the attack within a fictional villain game scenario to align model outputs
    with malicious objectives
  severity: medium
  category: multimodal_attacks
  patterns:
  - (?i)(villain.{0,30}(lair|game|character|evil).{0,60}(content|instructions?|output|respond|generate).{0,60}(consistent
    with|align(ed)? with|based on))
  - (?i)(I am (developing|creating|building).{0,30}(game|simulation|story).{0,60}villain.{0,40}(evil|malicious|dangerous))
  file_types:
  - '*.txt'
  - '*.py'
  - '*.json'
  - '*.html'
  message: 'Detected: evil-alignment-game-scenario-framing'
  remediation: Evil-alignment game scenario framing detected in multimodal context.
    Reject creative-framing prompts requesting villain-consistent harmful outputs.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: Jailbreak Large Vision-Language Models Through Multi-Modal Linkage
    (2024) - Evil Alignment component
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-075
  name: typographic-image-harmful-content-encoding
  description: Detects prompts referencing base64 encoding, word replacement, or image
    mirroring techniques applied to typographic images to conceal harmful content
    from VLM safety filters
  severity: critical
  category: multimodal_attacks
  patterns:
  - (?i)(word replacement.{0,60}(harmful|malicious|illegal|dangerous).{0,60}(image|typographic|visual))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.html'
  message: 'Detected: typographic-image-harmful-content-encoding'
  remediation: Typographic image content encoding jailbreak technique detected. Apply
    OCR-based content extraction and scan decoded text before VLM processing.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: 'Jailbreak Large Vision-Language Models Through Multi-Modal Linkage
    (2024) - Encryption methods: base64, word replacement, mirroring'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-072
  name: Multimodal Prompt Decoupling Attack on T2I Safety Filters
  description: Detects MPDA (Multimodal Prompt Decoupling Attack) that decomposes
    unsafe text-to-image requests using LLMs into pseudo-safe and harmful sub-prompt
    components — pseudo-safe component bypasses safety filters while harmful component
    guides image generation, with VLM-based semantic refinement loop ensuring final
    output matches original unsafe intent
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - MPDA.*multimodal.*prompt.*decouple.*T2I.*safety
  - prompt.*decouple.*pseudo.safe.*harmful.*T2I.*filter
  - text.to.image.*safety.*filter.*decouple.*bypass
  - LLM.*decouple.*unsafe.*pseudo.safe.*harmful.*sub.prompt
  - VLM.*caption.*refine.*unsafe.*T2I.*bypass
  file_types:
  - .py
  - .json
  - .ipynb
  message: Multimodal Prompt Decoupling Attack (MPDA) on T2I safety filter detected
    — LLM decoupling unsafe prompt into pseudo-safe/harmful sub-prompts bypassing
    safety filters
  source_detail: 'arXiv:2509.21360 Peng et al. 2025 — MPDA: LLM decomposes unsafe
    request into pseudo-safe bypassing filter + harmful sub-prompt; adversarial rewriting
    reformulates harmful components; VLM caption feedback refines output; targets
    NSFW T2I generation'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-073
  name: T2I Adversarial Prompt Rewriting for Safety Filter Bypass
  description: Detects MPDA adversarial rewriting phase that reformulates harmful
    prompt components as natural adversarial prompts to circumvent text-to-image safety
    filters while instructing the model to modify base images — exploits semantic
    equivalence between safe-appearing and unsafe-generating prompts
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - adversarial.*rewrite.*harmful.*natural.*T2I.*bypass
  - T2I.*natural.*adversarial.*prompt.*safety.*filter.*evade
  - rewrite.*unsafe.*prompt.*natural.*image.*generation.*bypass
  - harmful.*prompt.*reformulate.*natural.*filter.*evade.*T2I
  - T2I.*base.*image.*modify.*adversarial.*rewrite.*unsafe
  file_types:
  - .py
  - .json
  message: T2I adversarial prompt rewriting for safety filter bypass detected — harmful
    prompts reformulated as natural-appearing text to bypass safety filters
  source_detail: 'arXiv:2509.21360 Peng et al. 2025 — MPDA adversarial rewriting:
    reformulates harmful prompt as natural adversarial prompts; instructs T2I model
    to modify base images; VLM-based semantic refinement feedback loop ensures unsafe
    content generation'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-074
  name: VLM Caption Feedback Loop for T2I Jailbreak Refinement
  description: Detects MPDA semantic refinement loop that uses vision-language model
    captions to guide iterative LLM refinement — VLM analyzes generated images and
    feeds captions back to LLM for prompt optimization until final output matches
    original unsafe request
  severity: medium
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - VLM.*caption.*feedback.*loop.*T2I.*jailbreak.*refine
  - image.*caption.*feedback.*LLM.*refine.*unsafe.*T2I
  - VLM.*generate.*caption.*guide.*prompt.*optimize.*T2I
  - iterative.*VLM.*caption.*unsafe.*T2I.*semantic.*refine
  - vision.language.*model.*caption.*loop.*T2I.*attack
  file_types:
  - .py
  - .json
  message: VLM caption feedback loop T2I jailbreak refinement detected — iterative
    VLM-guided prompt optimization to generate unsafe T2I content
  source_detail: 'arXiv:2509.21360 Peng et al. 2025 — MPDA: VLM generates image captions
    from iteratively produced outputs; captions create feedback loop guiding LLM refinement;
    ensures final generated content aligns with original unsafe request'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-075
  name: Adversarial Textual Jailbreak on Robotic VLA Models
  description: Detects adversarial textual attacks on Vision-Language-Action (VLA)
    robotic models that achieve full action space reachability with single-input persistent
    effects — adapted LLM jailbreaking applied to robotic end-to-end control enables
    physical adversarial consequences without semantic harm concept linkage
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - VLA.*robotic.*adversarial.*textual.*jailbreak.*action
  - vision.language.action.*jailbreak.*full.*action.*space
  - robotic.*VLA.*adversarial.*text.*control.*jailbreak
  - VLA.*adversarial.*text.*physical.*action.*persist
  - robotic.*control.*jailbreak.*textual.*action.*space
  file_types:
  - .py
  - .json
  - .ipynb
  message: Adversarial textual jailbreak on robotic VLA model detected — single textual
    input achieving full action space control with persistent physical effects
  source_detail: arXiv:2506.03350 Jones et al. 2025 — textual attacks applied once
    at rollout start achieve full action space reachability; persistent over extended
    horizons; no semantic harm concept linkage required; purely adversarial text prompts
    achieve physical control
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-105
  name: audio-based-jailbreak-mllm-voice-emotional-simulation
  description: Detects audio-based jailbreak attacks against multimodal LLMs using
    emotional audio simulations and voice-based adversarial prompts to induce uncontrolled
    outputs — audio modality exploited alongside visual inputs to bypass safety filters
    that primarily focus on text and image content; audio emotional manipulation bypasses
    alignment mechanisms
  severity: medium
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - audio.*jailbreak.*MLLM.*voice.*emotional.*simulation.*bypass
  - voice.*adversarial.*prompt.*MLLM.*audio.*jailbreak.*safety.*bypass
  - emotional.*audio.*simulation.*MLLM.*uncontrolled.*output.*jailbreak
  - multimodal.*audio.*voice.*jailbreak.*bypass.*safety.*alignment.*LLM
  - audio.visual.*multimodal.*jailbreak.*emotional.*manipulat.*adversarial
  file_types:
  - .py
  - .json
  - .wav
  - .mp3
  message: Audio-based multimodal jailbreak attack detected — emotional voice simulation
    exploiting audio modality to bypass MLLM safety alignment
  source_detail: 'Mao et al. survey arXiv:2506.15170 2025 — audio modality jailbreak:
    voice input exploiting MLLM audio processing; emotional simulation induces uncontrolled
    outputs; audio alignment mechanisms less mature than visual/text; survey identifies
    audio as critical underprotected attack surface in MLLM ecosystem'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-106
  name: mllm-agent-toolchain-knowledge-base-jailbreak-cascade
  description: Detects jailbreak attacks on LLM agent systems targeting toolchain
    components, knowledge bases, or memory modules to propagate malicious instructions
    across multi-agent networks — attacks exploit agent planning, tool invocation,
    and memory components to cascade harmful content through agent interactions, bypassing
    single-agent safety mechanisms
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM02
  cwe:
  - CWE-74
  patterns:
  - agent.*toolchain.*jailbreak.*knowledge.*base.*propagat.*multi.agent
  - LLM.*agent.*tool.*invok.*malicious.*cascade.*multi.agent.*jailbreak
  - agent.*memory.*planning.*jailbreak.*reward.*function.*manipulat.*RL
  - multi.agent.*jailbreak.*toolchain.*knowledge.*propagat.*cascade.*harm
  - agent.*jailbreak.*planning.*task.*decomposition.*cascade.*tool.*exploit
  file_types:
  - .py
  - .json
  message: Multi-agent toolchain/knowledge-base jailbreak cascade attack detected
    — malicious instructions propagating through agent planning, tool invocation,
    and memory components across agent networks
  source_detail: 'arXiv:2506.15170 Mao et al. Henan Univ/CAS 2025 — agent jailbreak
    survey: reward function manipulation via RL; toolchain/knowledge base/memory as
    attack vectors; cascading risks across multi-agent interactions; planning component
    exploitation; adds 20 shopping cart items vs intended; distinct from MLLM attacks'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-107
  name: bap-bimodal-adversarial-prompt-lvlm-jailbreak
  description: Detects BAP (Bi-Modal Adversarial Prompt) attacks on large vision-language
    models that simultaneously optimize both visual and textual adversarial prompts
    — query-agnostic universal image perturbation created with affirmative prefix
    corpus combined with CoT-refined intent-specific textual adversarial prompts for
    29%+ ASR improvement over visual-only attacks; bypasses aligned LVLMs that fuse
    both modalities
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - BAP.*bi.modal.*adversarial.*prompt.*LVLM.*visual.*textual.*simultaneous
  - bimodal.*adversarial.*visual.*textual.*optimize.*LVLM.*jailbreak
  - query.agnostic.*universal.*image.*adversarial.*textual.*CoT.*refine.*LVLM
  - affirmative.*prefix.*corpus.*adversarial.*image.*textual.*prompt.*LVLM.*jailbreak
  - bi.modal.*adversarial.*prompt.*visual.*text.*simultaneous.*optimize.*LVLM
  file_types:
  - .py
  - .json
  message: Bi-Modal Adversarial Prompt (BAP) LVLM jailbreak detected — simultaneous
    optimization of visual adversarial perturbation and CoT-refined textual prompt
    bypassing aligned vision-language model safety
  source_detail: 'arXiv:2406.04031 Ying et al. Beihang Univ/NUS 2024 — BAP: universal
    visual perturbation (query-agnostic, affirmative prefix corpus) + CoT-refined
    textual adversarial prompt; +29.03% ASR vs visual-only; Gemini pro-vision, GLM
    v3, Qwen v2.1, ERNIE Bot v3.5 attacked; chain-of-thought failure analysis→textual
    refinement'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-105
  name: C-PGC Contrastive Universal Adversarial Perturbation VLP Attack
  description: Detects C-PGC (Contrastive-training Perturbation Generator with Cross-modal
    conditions) universal adversarial attacks on Vision-Language Pre-training models
    — exploits contrastive learning alignment by generating single universal perturbation
    effective across multiple inputs and models; malicious contrastive learning with
    crafted positive/negative image-text pairs disrupts VLP alignment; forces adversarial
    samples away from feature space; unimodal and cross-modal guidance; ICCV 2025
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - C.PGC.*contrastive.*universal.*adversarial.*perturbation.*VLP
  - VLP.*contrastive.*learning.*universal.*adversarial.*perturbation
  - universal.*adversarial.*perturbation.*VLP.*contrastive.*cross.modal
  - C.PGC.*vision.language.*pre.training.*contrastive.*adversarial
  - VLP.*alignment.*universal.*adversarial.*contrastive.*learning.*attack
  file_types:
  - .py
  - .json
  - .ipynb
  message: C-PGC universal contrastive adversarial perturbation VLP attack detected
    — single universal perturbation exploiting contrastive learning alignment across
    vision-language models
  source_detail: 'arXiv:2406.05491 Anonymous 2024 — C-PGC: ICCV 2025; malicious contrastive
    learning; single universal perturbation; cross-modal guidance; multiple VLP models;
    feature space displacement; vision-language task attacks'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-106
  name: QAVA Query-Agnostic Visual Adversarial Attack on Vision-Language Models
  description: Detects QAVA (Query-Agnostic Visual Attack) adversarial examples targeting
    large vision-language models regardless of query — generates robust adversarial
    images causing incorrect responses to unknown/unspecified questions; unlike query-specific
    attacks; practical real-world threat where single image faces multiple questions;
    performance comparable to known-query attacks; NAACL 2025; reveals broadly applicable
    visual vulnerability independent of prompt
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - QAVA.*query.agnostic.*visual.*attack.*vision.language
  - query.agnostic.*visual.*adversarial.*LLM.*vision.*language
  - adversarial.*visual.*image.*query.agnostic.*VLM.*incorrect
  - QAVA.*visual.*adversarial.*unknown.*query.*vision.*language
  - query.agnostic.*adversarial.*image.*vision.language.*attack
  file_types:
  - .py
  - .json
  - .ipynb
  message: QAVA query-agnostic visual attack detected — adversarial image causing
    incorrect VLM responses regardless of accompanying query content
  source_detail: 'arXiv:2504.11038 Anonymous 2025 — QAVA: NAACL 2025; query-agnostic;
    unknown question attacks; comparable to known-query; practical multi-question
    threat; vision-language model vulnerability'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-107
  name: VMA Vision-Language Model Hijacking Multi-Attack Adversarial Redirection
  description: Detects VMA (Vision-language Model Attack) imperceptible perturbations
    enabling multi-vector attacks on VLMs — first-order and second-order momentum
    optimization with differentiable transformation; manipulates individual output
    tokens; enables jailbreaking, model hijacking, privacy violations, and DoS attacks
    via single image perturbation technique; theoretical and empirical vulnerability
    evidence; NeurIPS 2025; dual-use for watermarking
  severity: critical
  category: multimodal_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - VMA.*vision.language.*model.*hijack.*adversarial.*token.*manipulate
  - vision.language.*adversarial.*momentum.*token.*manipulate.*hijack
  - VMA.*VLM.*jailbreak.*hijack.*privacy.*DoS.*adversarial.*perturb
  - VLM.*adversarial.*image.*token.level.*manipulate.*momentum.*optimize
  - vision.language.*adversarial.*image.*multi.attack.*jailbreak.*hijack
  file_types:
  - .py
  - .json
  - .ipynb
  message: VMA vision-language model adversarial attack detected — imperceptible image
    perturbations enabling multi-vector attacks including jailbreaking, model hijacking,
    and privacy violations
  source_detail: 'arXiv:2505.19911 Anonymous 2025 — VMA: NeurIPS 2025; momentum optimization;
    differentiable transformation; token manipulation; jailbreak/hijack/privacy/DoS;
    image-based adversarial; theoretical+empirical; dual-use watermark'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-121
  name: one-frame-attack-single-frame-adversarial-video
  description: Detects implementation of the one frame attack technique that exploits
    structural vulnerability by perturbing only a single periodically-vulnerable frame
    in a video clip to fool action recognition models.
  severity: medium
  category: multimodal_attacks
  patterns:
  - (?i)one[_\-\s]frame[_\-\s]attack
  - (?i)single[_\-\s]frame.*adversarial.*(?:perturbation|attack|video)
  - (?i)vulnerable[_\-\s]frame[_\-\s](?:index|indices|location)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Detected: one-frame-attack-single-frame-adversarial-video'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-693
  mitre_attack: T1565
  source_paper: 'Hwang et al. (2020) -- Just One Moment: Structural Vulnerability
    of Deep Actio | Hwang et al. 2020 (arXiv:2011.14585) — one frame attack achieves
    83-100% fooling rate on I3D, 73-98% on SlowFast, 60-97% on ir-CSN at ε=2-16'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-122
  name: structural-vulnerability-periodic-frame-stride-exploitation
  description: Detects code that analyzes model temporal stride and pooling structure
    to identify periodically vulnerable frame indices for targeted adversarial perturbation
    — the core structural vulnerability exploitation technique.
  severity: medium
  category: multimodal_attacks
  patterns:
  - (?i)temporal[_\-\s]stride.*vulnerable|vulnerable.*temporal[_\-\s]stride
  - (?i)periodic.*vulnerable[_\-\s]frame|vulnerable[_\-\s]frame.*period
  - (?i)frame[_\-\s]index.*(?:i3d|slowfast|ir.csn).*(?:attack|perturb|adversar)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: structural-vulnerability-periodic-frame-stride-exploitation'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-693
  mitre_attack: T1565
  source_paper: 'Hwang et al. (2020) -- Just One Moment: Structural Vulnerability
    of Deep Actio | Hwang et al. 2020 — I3D vulnerable frames at indices {3,7,11,15,19,23,27,31},
    SlowFast at {1,5,9,13,17,21,25,29} due to stride-4 and dual-pathway structure'
  fp_guards: []
  pipeline_confidence: medium
