    ir-CSN-152 on Kinetics-400 as attack targets'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-MM-SCAN-126
  name: sam-prompt-agnostic-encoder-attack
  description: Detects code implementing prompt-agnostic adversarial attacks on SAM/SEEM
    by maximizing L2 distance between image encoder embeddings, as described in Croce
    & Hein 2023. Targets foundation segmentation model image encoders to break all
    prompt types simultaneously.
  severity: medium
  category: multimodal_attacks
  patterns:
  - (?i)from\s+segment_anything\s+import
  - (?i)segment.anything.*(?:adversar|perturbat|attack)
  file_types:
  - '*.py'
  message: 'Detected: sam-prompt-agnostic-encoder-attack'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM07
