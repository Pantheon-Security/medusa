  - (?i)github\.com/(Norrrrrrr-lyn/WAInjectBench|IBM/Retention-Score)
  - (?i)(pip.install|clone|import).*(agd|bap.jailbreak|jps.jailbreak|sua.attack|djmo)
  - (?i)(from|import).*(agd|bap|jps|sua|djmo|crossinject|camo|fc.attack).*(attack|jailbreak|adversarial)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.txt'
  - '*.yaml'
  message: Known multimodal attack repository cloned or imported (AGD, BAP, JPS, SUA,
    DJMO, WAInjectBench)
  description: 'References to published attack repository code: AGD (github.com/kunzhan/AGD,
    CVPR 2025), BAP (github.com/NY1024/BAP-Jailbreak-Vision-Language-Models-via-Bi-Modal-Adversarial-Prompt,
    NeurIPS 2024), JPS (github.com/thu-coai/JPS, 2025), SUA (github.com/Zood123/MLLM-Unlearning-Attack,
    2025), DJMO (github.com/AIASLab/DJMO, 2025). These are open-source MLLM attack
    implementations that can be directly deployed against production VLM systems.'
  remediation: Block installation of known MLLM attack packages in production environments.
    Monitor code repositories for cloning of MLLM attack codebases. Review any usage
    of these attack libraries outside approved security research environments with
    proper oversight.
  owasp_llm: LLM01:2025
  cwe: CWE-284
