  - '*.ipynb'
  - '*.json'
  message: Sub-visual prompt injection in medical imaging VLM context detected
  description: Clusmann et al. (2025, Nature Communications) demonstrate that all
    four frontier VLMs (Claude-3 Opus, Claude-3.5 Sonnet, Reka Core, GPT-4o) are vulnerable
    to sub-visual prompt injection in medical imaging with N=594 attacks. Sub-visual
    prompts are non-obvious to human medical reviewers.
  remediation: Require security evaluation before clinical VLM deployment. Implement
    medical image integrity verification. Deploy dual-review (human + automated injection
    detection) for VLM-assisted clinical workflows.
  owasp_llm: LLM01:2025
  cwe: CWE-74
