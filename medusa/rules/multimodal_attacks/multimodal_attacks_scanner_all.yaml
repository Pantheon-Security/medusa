rules:
- id: MEDUSA-MMA-SCAN-001
  name: visual-adversarial-perturbation-attack
  severity: CRITICAL
  category: multimodal_attacks
  patterns:
  - (?i)\bpgd\b.*\bvision\b
  - (?i)adversarial.*perturbation.*image.*LLM
  - (?i)visual.*adversarial.*example.*jailbreak
  - (?i)\bclip\b.*encoder.*adversarial.*attack
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: Visual adversarial perturbation attack against vision-language model detected
  description: Code pattern consistent with generating PGD/FGSM adversarial images
    targeting CLIP-based VLM encoders for jailbreaking. Qi et al. (2023) demonstrate
    a single universal adversarial image can jailbreak aligned LLMs with high transfer
    rate. MLAI achieves 82.80% ASR on LLaVA-2 (Hao et al., 2024).
  remediation: Implement adversarially fine-tuned vision encoders (Sim-CLIP+, Robust-LLaVA).
    Deploy input preprocessing to detect adversarial perturbations. Use multi-scale
    consistency checks.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MMA-SCAN-002
  name: ocr-based-visual-prompt-injection
  severity: CRITICAL
  category: multimodal_attacks
  patterns:
  - (?i)(embed|inject|overlay|render).*text.*image.*(prompt|instruction)
  - (?i)(\bPIL\b|cv2|ImageDraw).*text.*inject
  - (?i)typographic.*attack
  - (?i)OCR.*inject.*VLM
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'OCR-based visual prompt injection: text embedded in images to override
    VLM task'
  description: Code renders or embeds text instructions directly onto images to exploit
    VLM OCR reading capabilities and override intended task instructions. MM-SafetyBench
    (Liu et al., 2023) shows this achieves >70% ASR across 12 MLLMs. GHVPI achieves
    15.8% ASR on GPT-4V (Kimura et al., 2024).
  remediation: Deploy instruction hierarchy awareness so models distinguish between
    system/user text prompts and image-embedded text. Implement image text extraction
    screening.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-MMA-SCAN-003
  name: query-relevant-image-jailbreak
  severity: HIGH
  category: multimodal_attacks
  patterns:
  - (?i)stable.diffusion.*(harmful|unsafe|jailbreak)
  - (?i)query.relevant.*image.*jailbreak
  - (?i)scenario.aware.*image.*(attack|jailbreak)
  - (?i)MM.SafetyBench
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Query-relevant image generation attack (SD+OCR pattern) targeting MLLM
    safety filters
  description: Generates scenario-matched images using diffusion models to amplify
    harmful query compliance in MLLMs. MM-SafetyBench SD+OCR method achieves >70%
    ASR on 12 MLLMs including ~67% on GPT-4V (Liu et al., 2023). MLAI exploits scenario-matched
    images to achieve 77.75% on MiniGPT-4 (Hao et al., 2024).
  remediation: Implement safety-aware image analysis pipeline. Deploy content moderation
    on both image and text modalities independently before combined processing.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MMA-SCAN-004
  name: bimodal-adversarial-prompt-attack
  severity: CRITICAL
  category: multimodal_attacks
  patterns:
  - (?i)bi.?modal.*adversarial.*prompt
  - (?i)\bBAP\b.*(visual|image|text).*attack
  - (?i)(visual|image).*perturbation.*text.*optimize.*jailbreak
  - (?i)affirmative.prefix.*adversarial.*image
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Bi-modal adversarial prompt attack: joint visual+textual optimization
    for LVLM jailbreak'
  description: BAP attack jointly optimizes adversarial visual and textual prompts
    for VLM jailbreaking, achieving +29.03% average ASR over single-modality attacks
    (Ying et al., 2024). Effective against aligned models that fuse visual and textual
    features simultaneously. Demonstrated on Gemini and ChatGLM.
  remediation: 'Deploy bi-modal safety evaluation: analyze both visual and textual
    modalities independently and jointly. Implement visual perturbation detection
    before cross-modal fusion.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MMA-SCAN-005
  name: flowchart-logic-visual-jailbreak
  severity: HIGH
  category: multimodal_attacks
  patterns:
  - (?i)flowchart.*(harmful|jailbreak|attack)
  - (?i)\bFC.Attack\b
  - (?i)step.description.*(flowchart|chart|diagram).*VLM
  - (?i)(graphviz|mermaid|plantuml).*(harmful|unsafe|inject)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Flowchart-based visual jailbreak attack: harmful instructions encoded
    as logic diagrams'
  description: FC-Attack encodes harmful instructions as auto-generated flowcharts,
    achieving up to 96% ASR via images and 78% via video (Zhang et al., 2025). Image-to-Text
    Logic Jailbreak achieves 92.8% ASR on GPT-4o and GPT-4V (Zou et al., 2024). Font
    style changes improve Claude-3.5 ASR from 4% to 28%.
  remediation: Extend safety filters to analyze visual logical content (flowcharts,
    diagrams) for encoded harmful instruction patterns. Implement context-aware visual
    content moderation beyond text extraction.
  owasp_llm: LLM01:2025
  cwe: CWE-74
