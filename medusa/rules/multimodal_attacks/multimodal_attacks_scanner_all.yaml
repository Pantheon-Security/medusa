  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: Cross-modal prompt injection targeting multimodal agent decision-making
  description: CrossInject embeds adversarial perturbations across modalities aligned
    with malicious content to hijack multimodal agent decision-making, achieving +30.1%
    ASR improvement (Wang et al., 2025). CAMO decomposes malicious prompts into benign
    cross-modal fragments for black-box jailbreaking (Jiang et al., 2025).
  remediation: Implement cross-modal consistency checks. Deploy intent verification
