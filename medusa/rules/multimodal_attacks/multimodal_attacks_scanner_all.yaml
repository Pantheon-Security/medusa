  - (?i)reverse.diffusion.*adversarial.*noise
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Diffusion-model-based adversarial image generation for MLLM attacks (AGD)
  description: AGD injects adversarial guidance into diffusion model reverse process,
    distributing adversarial signals across full frequency spectrum. Outperforms state-of-the-art
    attack methods and is inherently robust to low-pass filtering defenses (Xia et
    al., 2025). Full-spectrum adversarial noise defeats frequency-domain defenses.
  remediation: Deploy defenses beyond frequency-domain filtering. Implement semantic-level
    adversarial detection. Use certified robustness metrics (Retention Score) to quantify
    VLM exposure.
  owasp_llm: LLM04:2025
  cwe: CWE-20
