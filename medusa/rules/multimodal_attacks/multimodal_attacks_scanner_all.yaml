  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Universal adversarial image generation: single perturbation jailbreaks
    across diverse queries'
  description: Generates a universal adversarial image that jailbreaks aligned LLMs
    regardless of the specific harmful query. Qi et al. (2023) demonstrate cross-category
    universality; Wang et al. (2025) add universal adversarial text suffix+image combination
    evaluated on LLaVA, Yi-VL, MiniGPT4, MiniGPT-v2, InstructBLIP.
  remediation: Deploy adversarially fine-tuned visual encoders (Sim-CLIP+, Robust-LLaVA)
    with 2x+ robustness gains. Implement anomaly detection for adversarial perturbation
    patterns in visual inputs.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MMA-SCAN-007
