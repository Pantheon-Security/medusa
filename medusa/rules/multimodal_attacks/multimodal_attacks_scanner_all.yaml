  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-MMA-SCAN-008
  name: image-scaling-visual-prompt-injection
  severity: HIGH
  category: multimodal_attacks
  patterns:
  - (?i)scaling.*(inject|injection|adversarial|hidden)
  - (?i)downscal.*(attack|adversarial|inject)
  - (?i)preprocessing.pipeline.*adversarial.*image
  - (?i)Chameleon.*(VLM|vision|attack|scaling)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Scaling-based visual prompt injection exploiting image preprocessing pipelines
  description: Chameleon exploits image downscaling in VLM preprocessing pipelines
    to inject hidden visual prompts invisible at original resolution, achieving 84.5%
    ASR on Gemini 2.5 Flash vs 32.1% for static attacks (Zeeshan et al., 2025). Adversarial
    content appears after scaling operations.
  remediation: 'Implement multi-scale consistency checks: verify model behavior is
    consistent across different image scaling factors. Detect behavioral anomalies
    between original and scaled image processing.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MMA-SCAN-009
  name: diffusion-model-adversarial-attack
  severity: HIGH
  category: multimodal_attacks
  patterns:
  - (?i)diffusion.*adversarial.*(mllm|vlm|multimodal)
  - (?i)adversarial.guided.diffusion
