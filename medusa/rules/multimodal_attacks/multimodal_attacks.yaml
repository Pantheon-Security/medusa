rules:
- id: MM-GRADIENT-001
  name: gcg-adversarial-suffix
  severity: HIGH
  category: gradient_attack
  languages:
  - python
  patterns:
  - torch\.nn\.functional\.cross_entropy
  - loss\.backward\(\)
  - projected_gradient_descent
  - clip_grad_norm_
  message: Potential GCG/PGD adversarial attack implementation
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: &id001
  - '*.py'
- id: MM-GRADIENT-002
  name: adversarial-suffix-variables
  severity: HIGH
  category: gradient_attack
  languages:
  - python
  patterns:
  - adv_suffix
  - target_tokens
  - control_tokens
  - epsilon_ball
  - l_infinity_norm
  message: Adversarial suffix variable patterns detected
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-GRADIENT-003
  name: affirmative-target
  severity: MEDIUM
  category: gradient_attack
  patterns:
  - (?i)Sure,\s*here\s*is
  - targeted_completion
  - max\s+log\s+likelihood
  message: Affirmative target string for adversarial attack
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-TYPO-001
  name: figstep-flowchart
  severity: HIGH
  category: typographic_attack
  languages:
  - python
  patterns:
  - import\s+graphviz
  - from\s+graphviz
  - dot\.node\(
  - dot\.edge\(
  message: Graphviz usage - check for FigStep/FC-Attack patterns
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-TYPO-002
  name: image-text-injection
  severity: HIGH
  category: typographic_attack
  languages:
  - python
  patterns:
  - ImageDraw\.Draw\(\)\.text\(
  - draw\.caption\(
