  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-STEGO-001
  name: lsb-steganography
  severity: CRITICAL
  category: steganography
  languages:
  - python
  patterns:
  - steganography\.lsb\.hide
  - steganography\.lsb\.reveal
  - (?:pixel\s*&\s*11111110)\s*\|\s*bit
  - lsb_(?:encode|decode)
  message: LSB steganography - potential hidden payload injection
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-STEGO-002
  name: binary-string-encoding
  severity: HIGH
  category: steganography
  languages:
  - python
  patterns:
  - binary_string\s*=\s*['"][01]+['"]
  - bin\(ord\(char\)\)
  - bit_depth
  - decoding_length
  message: Binary string encoding for steganographic payload
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-STEGO-003
  name: hidden-message-prompt
  severity: HIGH
  category: steganography
  patterns:
  - (?i)Extract\s+the\s+hidden\s+message
