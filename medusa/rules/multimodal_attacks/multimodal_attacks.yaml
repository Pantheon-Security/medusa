  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-AGENT-001
  name: gui-injection
  severity: CRITICAL
  category: agent_attack
  languages:
  - python
  patterns:
  - driver\.execute_script\(
  - adb\s+shell\s+input\s+tap
  - driver\.get_screenshot_as_png\(
  message: GUI/agent injection attack vector
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-AGENT-002
  name: phishing-injection
  severity: CRITICAL
  category: agent_attack
  languages:
  - python
  patterns:
  - phishing_link
  - fake_payment_button
  - instruction_hijacking
  - fake_(?:button|link|payment)
  message: Phishing/fake UI injection in agent context
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-AGENT-003
  name: auth-tag-manipulation
  severity: HIGH
  category: agent_attack
  patterns:
  - UserAuth
  - (?i)Attention:\s+The\s+current\s+task\s+has\s+been\s+canceled
  - (?i)System\s+Update\s+Required
  message: Authentication/system message manipulation
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-ENCODE-001
  name: base64-obfuscation
  severity: MEDIUM
  category: encoding_attack
  patterns:
  - base64\.(?:encode|decode)
  - atob\s*\(|btoa\s*\(
  - (?:\"|\x27)[A-Za-z0-9+\/]{40,}={0,2}(?:\"|\x27)
  message: Base64 encoding - potential obfuscated payload
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-ENCODE-002
  name: rot13-caesar
  severity: MEDIUM
  category: encoding_attack
  patterns:
  - rot13|caesar_cipher
  - codecs\.encode\([^)]+,\s*['"]rot_?13['"]\)
  - chr\(\s*\(\s*ord\([^)]+\)\s*[-+]\s*\d+\s*\)
  message: ROT13/Caesar cipher obfuscation
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-ENCODE-003
  name: unicode-manipulation
  severity: MEDIUM
  category: encoding_attack
  patterns:
  # Only the dangerous invisible/control ranges, NOT every \uXXXX escape.
  # A blanket \\u[0-9a-fA-F]{4} matched every accented char (é) and emoji table
  # entry (rich/_emoji_codes.py), firing ~934x on clean libs. Scope to the
  # ranges actually used to hide/obfuscate payloads:
  #   200b ZWSP, 200c ZWNJ, 200e LRM, 200f RLM  (200d ZWJ excluded — benign emoji joiner)
  #   202a-202e bidi overrides/embeddings, 2066-2069 bidi isolates (Trojan Source)
  #   feff BOM / zero-width no-break space
  - (?i)\\u(?:200[bcef]|202[a-e]|206[6-9]|feff)
  - unicode_normalize
  - homoglyph
  message: Unicode manipulation for obfuscation
  cwe: CWE-506
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-MULTITURN-001
  name: instruction-override
  severity: CRITICAL
  category: multi_turn_attack
  patterns:
  - (?i)ignore\s+(?:all\s+)?previous\s+instructions
  - (?i)pretend\s+(?:you\s+are|to\s+be)
  - (?i)hypothetical\s+scenario
  message: Multi-turn instruction override attempt
  cwe: CWE-74
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-MULTITURN-002
  name: context-continuation
  severity: MEDIUM
  category: multi_turn_attack
  patterns:
  - (?i)Continue\s+from\s+where\s+we\s+left\s+off
  - (?i)for\s+(?:educational|research)\s+purposes
  - (?i)In\s+this\s+hypothetical\s+scenario
  message: Context continuation attack pattern
  cwe: CWE-74
  owasp_llm: LLM01:2025
  file_types: *id001
- id: MM-IMPORT-001
  name: high-risk-imports
  severity: MEDIUM
  category: suspicious_code
  languages:
  - python
  patterns:
  - import\s+torch\.nn\.functional
  - import\s+graphviz
  - import\s+steganography
  - from\s+PIL\s+import\s+ImageDraw
