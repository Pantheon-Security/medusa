  - (?i)(conflicting.text.{0,30}(inject|rag|mislead.reasoning|inter.context))
  - (?i)(context.conflict.{0,30}(inject|poison|mislead|saferag|liang.2025))
  - (?i)(contradictory.retriev.{0,30}(inject|mislead|conflict|rag.safety))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Inter-Context Conflict Injection — conflicting text injected to mislead reasoning and undermine response
    quality (Liang 2025 SafeRAG)'
  description: Inter-Context Conflict (Liang 2025 SafeRAG) injects deliberately conflicting information into the RAG corpus
    — documents with contradictory facts retrieved together mislead the model's reasoning. When conflicting retrieved documents
    appear simultaneously, the model either hallucinates a reconciliation or produces low-confidence, unreliable outputs.
    SafeRAG benchmark identifies this as one of four key threat vectors alongside Silver Noise, Soft Ad, and White DoS.
  remediation: Apply AstuteRAG internal knowledge vs external source conflict analysis — detect contradictions between retrieved
    documents. Use TrustRAG K-means clustering to identify document groups with high internal conflict. Implement explicit
    conflict detection by comparing semantic consistency across retrieved documents. Flag conflicting retrievals for human
    review before high-stakes decisions.
  owasp_llm: LLM02:2025
  cwe: CWE-20
