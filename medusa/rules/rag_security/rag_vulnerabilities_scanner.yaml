  message: 'Detected: BadRAG — contrastive optimization with semantic group triggers achieving 98.9% retrieval ASR and 74.6%
    rejection ASR (Xue 2024)'
  description: 'BadRAG (Xue 2024) uses contrastive optimization to craft adversarial documents with semantic group triggers
    — trigger patterns defined at the semantic category level rather than specific token level. Retrieval ASR: 98.9%; Rejection
    ASR (causing model to refuse): 74.6%. The semantic group trigger approach makes BadRAG robust against paraphrasing defenses
    because the trigger is a semantic category that survives lexical variation, not a specific phrase.'
  remediation: Apply semantic-level rather than lexical-level trigger detection. Use Correct Knowledge Expansion to dilute
    BadRAG poison with larger retrieval sets. Implement contrastive retrieval analysis that detects documents optimized to
    be retrieved and rejected. Apply perplexity analysis to identify contrastively-optimized corpus entries.
