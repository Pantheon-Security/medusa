  message: 'Detected: RAG Membership Inference — detecting whether specific documents are in RAG corpus via output probability
    analysis (Fu 2025, ~50%+ ASR)'
  description: RAG Membership Inference (Fu 2025) detects whether specific documents are present in a RAG corpus by analyzing
    output probability distributions. ~50%+ ASR. When a document is in the corpus and gets retrieved, it shifts the model's
    output probability distribution in detectable ways. Enables privacy attacks on RAG systems containing confidential documents
    — attackers can verify whether specific proprietary information, medical records, or legal documents are in the corpus.
  remediation: Apply EPD (Ensemble Privacy Defense, Fu 2025) — aggregate RAG and base model responses via judge LLM to reduce
    membership inference signal. Implement differential privacy on RAG retrieval outputs. Monitor for systematic probability
    queries that appear designed to detect corpus membership. Apply output probability perturbation to reduce membership inference
    accuracy.
