  message: 'Detected: Soft Ad — implicit toxicity injected via embedded advertising in RAG corpus manipulating model responses
    toward commercial interests (Liang 2025 SafeRAG)'
  description: Soft Ad (Liang 2025 SafeRAG) embeds subtle commercial advertising content in RAG corpus documents that passes
    safety filters but biases model responses toward attacker's commercial interests. Unlike obvious spam, Soft Ad uses implicit
    toxicity — factually neutral statements that subtly promote specific products, services, or viewpoints. When retrieved,
    this content shapes model recommendations without triggering obvious safety checks.
  remediation: Apply commercial bias detection on retrieved documents — flag content with implicit promotional language. Implement
    InstructRAG explicit denoising to detect promotional intent masked as neutral information. Monitor RAG outputs for systematic
    recommendation bias toward specific entities. Use BiasDef post-retrieval filtering with commercial bias detectors.
