metadata:
  source: PaperMiner/2024-12-21_rag_vulnerabilities
  extraction_date: '2026-02-18'
  papers_analyzed: 11
  attacks_identified: 14
  defenses_identified: 7
  benchmarks:
  - BEIR
  - MS-MARCO
  - Natural Questions
  - HotpotQA
  - TriviaQA
  consolidated: true
  source_files:
  - rag_vulnerabilities_scanner.yaml
  - rag_vulnerabilities_2025_scanner.yaml
rules:
- id: MEDUSA-RAG-SCAN-001
  name: poisonedrag-framework-import
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+poisoned_rag
  - (?i)PoisonedRAG\s*\(
  - (?i)(?:corpus_poison|poisoned_passage|adversarial_doc)\s*=\s*(?:PoisonedRAG|generate_poison)\s*\(
  file_types:
  - '*.py'
  message: PoisonedRAG corpus poisoning framework detected
  description: Detects PoisonedRAG (Zou 2024), which crafts malicious knowledge base documents using black-box or white-box
    LLM access. Achieves ~90% attack success rate (ASR) against GPT-4 RAG systems on NQ and MS-MARCO benchmarks. Both variants
    (black-box 88.9%, white-box 90.2%) are detectable via the framework's characteristic passage-generation API.
  remediation: Validate all ingested knowledge base documents with a perplexity filter and content anomaly detector. Implement
    retrieval result ranking that penalizes documents with low semantic coherence to the corpus.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Zou et al. (2024)
- id: MEDUSA-RAG-SCAN-002
  name: badrag-contrastive-optimization
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+badrag
  - (?i)BadRAG\s*\(
  - (?i)contrastive_poison(?:ing|ed)?\s*=|contrastive_retrieval_loss\s*=
  - (?i)trigger_injection.*retrieval|retrieval.*contrastive.*loss
  file_types:
  - '*.py'
  message: BadRAG contrastive optimization poisoning attack detected
  description: Detects BadRAG (Tan 2024), a contrastive learning-based attack that optimizes trigger-bearing passages to both
    (a) rank top-k in retrieval and (b) steer LLM output. Uses dual contrastive loss to maximize retrieval while minimizing
    semantic distance to adversarial target. Achieves 74.6% query rejection rate against guardrailed systems.
  remediation: Deploy contrastive anomaly scoring on retrieved passages. Flag documents with high similarity to retrieval
    query but low similarity to surrounding corpus documents.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Tan et al. (2024)
- id: MEDUSA-RAG-SCAN-003
  name: corruptrag-adversarial-template
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+corruptrag
  - (?i)CorruptRAG\s*\(
  - (?i)adversarial_template\s*=.*(?:inject|corrupt|poison)
  - (?i)template_generation.*rag.*adversar
  file_types:
  - '*.py'
  message: CorruptRAG adversarial template generation framework detected
  description: Detects CorruptRAG (Shafran 2024), which generates adversarial document templates by iteratively refining passages
    to maximize LLM compliance while maintaining retrieval relevance. Templates are pre-computed and stored for reuse across
    queries.
  remediation: Audit the knowledge base for documents matching known adversarial template patterns. Implement document fingerprinting
    and cross-document consistency checks.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Shafran et al. (2024)
- id: MEDUSA-RAG-SCAN-004
  name: aggd-gradient-passage-optimization
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+aggd
  - (?i)AGGD\s*\(|AutoDAN.*rag|GCG.*passage
  - (?i)(?:gradient_guided|gradient_based)_(?:passage|doc)_(?:opt|attack|poison)
  - (?i)passage_gradient\s*=|adversarial_suffix.*retriev
  file_types:
  - '*.py'
  message: AGGD gradient-based adversarial passage generation detected
  description: Detects AGGD (Automated Gradient-Guided Document, Deng 2024), which uses white-box gradient signals to construct
    adversarial passages that jointly maximize retrieval score and steer LLM output. A white-box variant of GCG applied to
    the RAG retrieval surface.
  remediation: Monitor for documents containing high-entropy token sequences characteristic of gradient-optimized adversarial
    text. Apply perplexity thresholds and rate-limit knowledge base ingestion.
  owasp_llm: LLM08:2025
  cwe: CWE-94
  source_paper: Deng et al. (2024)
- id: MEDUSA-RAG-SCAN-005
  name: agentpoison-trigger-optimization
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+agent_poison
  - (?i)AgentPoison\s*\(
  - (?i)trigger_optimiz(?:e|ation|er)\s*=.*(?:agent|rag|memory)
  - (?i)poison_memory|memory_poisoning.*trigger|rag_agent.*backdoor
  file_types:
  - '*.py'
  message: AgentPoison RAG-memory trigger optimization attack detected
  description: Detects AgentPoison (Chen 2024), which poisons RAG agent memory/knowledge bases by optimizing compact trigger
    phrases. When the trigger appears in a user query it reliably retrieves poisoned demonstrations, hijacking agent behavior.
    Tested against ReAct, RAP, and EHRAgent.
  remediation: Implement trigger-phrase anomaly detection on incoming queries. Validate retrieved demonstrations against expected
    behavior using shadow execution before applying to agent context.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Chen et al. (2024)
- id: MEDUSA-RAG-SCAN-006
  name: flippedrag-retriever-reversal
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: opinion_manipulation
  patterns:
  - (?i)(?:from|import)\s+(?:flipped_rag|topic_fliprag)
  - (?i)FlippedRAG\s*\(|TopicFlipRAG\s*\(
  - (?i)retriever_reverse_engineer|reverse_engineer.*(?:encoder|embedder|retriever)
  - (?i)query_inversion\s*=|invert_retriever\s*\(
  file_types:
  - '*.py'
  message: FlippedRAG / Topic-FlipRAG retriever reverse-engineering attack detected
  description: Detects FlippedRAG and Topic-FlipRAG (Liu 2024, Shi 2024) which reverse-engineer dense retrieval encoders to
    craft passages that semantically match any target query. By inverting the retrieval function, attackers bypass relevance-based
    filters to guarantee top-k placement of adversarial content.
  remediation: Obscure retrieval encoder architecture and embeddings. Use ensemble retrievers with different embedding models
    so single-model inversion does not guarantee placement.
  owasp_llm: LLM08:2025
  cwe: CWE-200
  source_paper: Liu et al. (2024), Shi et al. (2024)
- id: MEDUSA-RAG-SCAN-007
  name: aip-adversarial-instructional-prompt
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: prompt_injection
  patterns:
  - (?i)(?:from|import)\s+aip_attack
  - (?i)AIPAttack\s*\(|AdversarialInstructionalPrompt\s*\(
  - (?i)inject_instruction.*passage|passage.*inject.*instruction
  - (?i)adversarial_instruction\s*=.*(?:retrieve|rag|context)
  file_types:
  - '*.py'
  message: AIP adversarial instructional prompt injection into RAG corpus detected
  description: Detects Adversarial Instructional Prompt (AIP) attacks (Zhong 2023, Abdelnabi 2021) that embed imperative override
    instructions inside retrieved documents. When injected passages are retrieved, the embedded instruction overrides the
    system prompt and redirects LLM behavior.
  remediation: Sanitize retrieved passages by detecting and stripping imperative instruction patterns. Apply SentenceTransformer-based
    coherence scoring to flag documents whose embedding diverges from the stated topic.
  owasp_llm: LLM08:2025
  cwe: CWE-20
  source_paper: Zhong et al. (2023), Abdelnabi et al. (2021)
- id: MEDUSA-RAG-SCAN-008
  name: pr-attack-bilevel-ranking-manipulation
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+pr_attack
  - (?i)PRAttack\s*\(|PassageRankingAttack\s*\(
  - (?i)bilevel_optim(?:iz)?.*(?:retriev|rank|passage)
  - (?i)rank_manipulation\s*=|optimize_passage_rank\s*\(
  file_types:
  - '*.py'
  message: PR-Attack bilevel optimization passage ranking manipulation detected
  description: Detects PR-Attack (Xue 2024), which uses bilevel optimization to craft passages that simultaneously (a) rank
    in top-k retrieval and (b) cause maximum output harm. Bilevel formulation alternates between an inner passage quality
    objective and an outer adversarial objective.
  remediation: Implement retrieval diversity enforcement to prevent a single adversarial passage from dominating top-k results.
    Apply cross-encoder re-ranking with adversarial robustness training.
  owasp_llm: LLM08:2025
  cwe: CWE-94
  source_paper: Xue et al. (2024)
- id: MEDUSA-RAG-SCAN-009
  name: biasrag-query-encoder-poisoning
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: opinion_manipulation
  patterns:
  - (?i)(?:from|import)\s+bias_rag
  - (?i)BiasRAG\s*\(
  - (?i)query_encoder_poison|encoder_bias_inject
  - (?i)bias(?:ed)?_embedding\s*=.*(?:query|retriev|rag)
  - (?i)opinion_manipulation.*retriev|retriev.*opinion_steer
  file_types:
  - '*.py'
  message: BiasRAG query encoder poisoning for opinion manipulation detected
  description: Detects BiasRAG (Shi 2024), which poisons the query encoder fine-tuning data to produce biased embedding representations.
    Manipulated encoders cause systematically slanted retrieval, subtly steering LLM-generated opinions without obvious document
    tampering.
  remediation: Audit query encoder fine-tuning datasets for opinion-slanting patterns. Use encoder robustness evaluation against
    adversarial fine-tuning data before deployment.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Shi et al. (2024)
- id: MEDUSA-RAG-SCAN-010
  name: poisoned-mrag-multimodal-injection
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: multimodal
  patterns:
  - (?i)(?:from|import)\s+(?:poisoned_mrag|mrag_attack)
  - (?i)PoisonedMRAG\s*\(|MultimodalRAGPoison\s*\(
  - (?i)image_poison.*retriev|retriev.*image.*inject
  - (?i)adversarial_image.*rag|multimodal.*corpus_poison
  file_types:
  - '*.py'
  message: Poisoned-MRAG multimodal image injection into RAG corpus detected
  description: Detects Poisoned-MRAG attacks that inject adversarially perturbed images into multimodal RAG knowledge bases.
    Manipulated image embeddings cause retrieval of poisoned visual context, steering multimodal LLM outputs while appearing
    visually benign to human reviewers.
  remediation: Apply adversarial image detection (e.g., LipNet-based perturbation scoring) before ingesting images into the
    RAG corpus. Cross-validate image-text alignment using a separate CLIP-based coherence check.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Chaudhari et al. (2024)
- id: MEDUSA-RAG-SCAN-011
  name: rag-no-document-filtering
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:vectorstore|vector_store|vectordb)\.add_(?:documents|texts)\s*\(
  - (?i)(?:chroma|pinecone|weaviate|qdrant|faiss|milvus)\.(?:add|upsert|insert)\s*\(
  - (?i)(?:retriever|index)\.(?:add_documents|add_texts|insert)\s*\(
  file_types:
  - '*.py'
  message: Documents added to RAG vector store without content filtering or sanitization
  description: Detects direct ingestion of documents into a vector store without evidence of prior content filtering or sanitization.
    PoisonedRAG (Zou 2024) and BadRAG (Tan 2024) both exploit unfiltered corpus ingestion pipelines to inject adversarial
    passages with near-certain retrieval success.
  remediation: 'Gate all vector store ingestion behind: (1) perplexity thresholds to detect gradient-optimized adversarial
    text, (2) instruction-pattern scanners to catch embedded AIP-style overrides, and (3) semantic coherence checks against
    an approved topic distribution.'
  owasp_llm: LLM08:2025
  cwe: CWE-20
  source_paper: Zou et al. (2024), Tan et al. (2024)
- id: MEDUSA-RAG-SCAN-012
  name: rag-no-perplexity-detection
  severity: MEDIUM
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:retriev(?:er|al)|similarity_search|vectorstore\.search)\s*\(
  - (?i)(?:chroma|pinecone|weaviate|qdrant|faiss)\.(?:query|search|similarity_search)\s*\(
  file_types:
  - '*.py'
  message: RAG retrieval without perplexity-based adversarial passage detection
  description: Detects RAG retrieval calls with no evidence of perplexity-based anomaly detection on retrieved passages. Gradient-optimized
    adversarial passages (AGGD, PoisonedRAG white-box) exhibit characteristically high perplexity under a language model,
    making perplexity filtering a reliable first-pass defense.
  remediation: Compute per-passage perplexity using a small reference LM (e.g., GPT-2) before adding retrieved chunks to the
    LLM context. Reject passages exceeding a calibrated threshold (typically 1.5-2x mean corpus perplexity). Supplement with
    PEFT-based adversarial passage classifier.
  owasp_llm: LLM08:2025
  cwe: CWE-1039
  source_paper: Deng et al. (2024), Zou et al. (2024)
- id: MEDUSA-RAG-SCAN-013
  name: rag-no-query-rewriting-defense
  severity: MEDIUM
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:retriever|vectorstore)\.(?:get_relevant_documents|similarity_search|query)\s*\(\s*(?:query|user_input|question)\s*\)
  - (?i)(?:qa_chain|retrieval_chain)\.(?:run|invoke)\s*\(\s*(?:query|question|user_input)
  file_types:
  - '*.py'
  message: RAG query passed to retriever without defensive query rewriting
  description: Detects RAG pipelines where raw user queries are passed directly to the retriever without defensive query rewriting
    or diversification. Trigger-based attacks (AgentPoison, BadRAG) rely on the user query containing a specific trigger phrase
    that activates the poisoned passage. Query rewriting disrupts this assumption by paraphrasing the query and removing trigger
    tokens before retrieval.
  remediation: Apply HyDE (Hypothetical Document Embeddings) or LLM-based query paraphrasing before retrieval. Use ensemble
    retrieval across multiple paraphrase variants and aggregate result sets to reduce single-query trigger sensitivity.
  owasp_llm: LLM08:2025
  cwe: CWE-1039
  source_paper: Chen et al. (2024), Tan et al. (2024)
- id: MEDUSA-RAG-SCAN-014
  name: rag-retrieval-no-source-attribution
  severity: MEDIUM
  category: rag_vulnerabilities
  subcategory: privacy
  patterns:
  - (?i)(?:retrieved|chunks|context)\s*=\s*(?:retriever|vectorstore)\.
  - (?i)(?:chroma|pinecone|weaviate|qdrant|faiss)\..{0,60}\n(?:(?!(?:source|metadata|provenance|attribution)).)*(?:prompt|context|message)\s*[+=]
  file_types:
  - '*.py'
  message: RAG retrieved content added to context without source attribution or provenance tracking
  description: Detects RAG pipelines that include retrieved document content in the LLM context without preserving document
    source metadata. Missing provenance prevents auditing of which corpus documents contributed to a response, making it impossible
    to identify and remove poisoned passages after an attack is detected.
  remediation: Always carry document source metadata (origin URL, ingestion timestamp, document hash) through the retrieval
    pipeline. Log which sources contributed to each LLM response for post-hoc attribution and corpus auditing.
  owasp_llm: LLM08:2025
  cwe: CWE-778
  source_paper: Zou et al. (2024)
- id: MEDUSA-RAG-SCAN-015
  name: rag-knowledge-base-open-write
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:vectorstore|vector_store|index)\.(?:add|upsert|insert|update)\s*\(.*(?:user_input|request|body|data)
  - (?i)(?:chroma|pinecone|weaviate|qdrant|faiss)\.(?:add|upsert)\s*\(.*(?:request|form|args|json)\.
  file_types:
  - '*.py'
  message: RAG knowledge base allows writes directly from untrusted user input
  description: 'Detects RAG vector store write operations where the document content or metadata is sourced directly from
    HTTP request data (user input, form fields, JSON body). This is the canonical enabler of all corpus poisoning attacks:
    an attacker-controlled write path allows arbitrary adversarial passages to be inserted into the retrieval corpus.'
  remediation: Never allow untrusted users to write directly to the RAG knowledge base. Require operator-level authentication
    for all corpus ingestion. All user-submitted content must pass through a content moderation and sanitization pipeline
    before indexing.
  owasp_llm: LLM08:2025
  cwe: CWE-284
  source_paper: Zou et al. (2024), Chen et al. (2024)
- id: MEDUSA-RAG-SCAN-016
  name: pr-attack-bilevel-coordinated-rag
  severity: CRITICAL
  category: coordinated_attack
  patterns:
  - (?i)(bilevel.?optim|bi.?level.?optim).{0,60}(rag|retriev|knowledge.?base|corpus)
  - (?i)(coordinated.{0,20}(prompt|inject).{0,40}(corpus|retriev|poison)|poison.{0,20}(prompt.{0,20}knowledge|knowledge.{0,20}prompt))
  - (?i)(backdoor.?trigger.{0,60}knowledge.?base|knowledge.?base.{0,60}backdoor.?trigger).{0,40}(sensitive.?period|activate|dormant)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: PR-Attack pattern — bilevel optimization simultaneously poisoning prompt and RAG corpus (91-100% ASR)'
  description: 'PR-Attack uses bilevel optimization to coordinate two simultaneous attack surfaces: poisoned text in knowledge
    base + backdoor trigger in prompt. Attack stays dormant until trigger activates during sensitive periods. 91-100% ASR
    across models.'
  remediation: Treat user prompts and knowledge base as equally untrusted. Implement trigger detection across both input streams.
    Monitor for coordinated anomalies spanning retrieval + generation.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RAG-SCAN-017
  name: aggd-gradient-adversarial-passage
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(aggd|approx.?greedy.?gradient|greedy.?gradient.?descent).{0,60}(retriev|passage|embed)
  - (?i)(gradient.{0,20}optim.{0,40}(adversarial|poison).{0,40}passage|adversarial.?passage.{0,40}gradient.?optim)
  - (?i)(maximize.{0,20}similarity.{0,40}(target|query).{0,40}(passage|document|token))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AGGD gradient-based adversarial passage optimization pattern (91.57% ASR on RAG retriever)'
  description: AGGD uses gradient descent to identify highest-ranked tokens across all positions, maximizing cosine similarity
    with targeted queries. Generates adversarial passages that rank above legitimate documents. 91.57% ASR.
  remediation: Implement perplexity filtering on retrieved documents. Monitor embedding norm distributions for optimization
    artifacts. Use ensemble retrievers to reduce single-vector attack surface.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-018
  name: badrag-contrastive-trigger-dos
  severity: CRITICAL
  category: trigger_based_dos
  patterns:
  - (?i)(badrag|bad.?rag|contrastive.?optim.?poison).{0,60}(trigger|semantic.?group|refusal)
  - (?i)(semantic.?group.?trigger|demographic.?trigger).{0,80}(retriev|refusal|reject|sentiment)
  - (?i)(cop.{0,10}contrastive|contrastive.?optim.?passage).{0,60}(deny|refuse|reject|block).{0,40}(query|user)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: BadRAG contrastive optimization pattern — semantic group triggers for denial-of-service or sentiment
    manipulation (98.2% retrieval ASR)'
  description: 'BadRAG uses contrastive optimization to tie adversarial passages to semantic group triggers (e.g., named entities).
    When triggered, forces LLM to refuse service (AaaA: 74.6% DoS) or steer sentiment negatively (72% SFaaA). 98.2% retrieval
    success.'
  remediation: Monitor retrieval patterns for demographic/entity-correlated anomalies. Audit retrieved documents for refusal-inducing
    language. Implement semantic group anomaly detection.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-RAG-SCAN-019
  name: aip-adversarial-instructional-prompt-shared
  severity: HIGH
  category: retrieval_manipulation
  patterns:
  - (?i)(adversarial.?instruction.?prompt|aip.{0,20}(retriev|rag)).{0,60}(genetic.?algo|evolv|optim)
  - (?i)(shared.?prompt.{0,40}(github|reddit|community|public).{0,40}(retriev|steer|manipulate))
  - (?i)(instructional.?prompt.{0,40}(covert|hidden|poison).{0,40}retriev.{0,40}(adversarial|malicious))
  file_types:
  - '*.py'
  - '*.md'
  - '*.txt'
  message: 'Detected: AIP (Adversarial Instructional Prompt) pattern — genetic algorithm poisoning of shared prompts to steer
    retrieval (95.23% ASR)'
  description: AIP modifies publicly-shared instructional prompts using genetic algorithms to covertly steer RAG retrieval
    toward adversarial documents without altering the user query. Exploits trust in community-shared system prompts (GitHub/Reddit).
    95.23% ASR.
  remediation: Audit and cryptographically verify shared/community-sourced system prompts. Do not apply untrusted external
    prompts to RAG retrievers. Monitor retrieval distribution shifts after prompt updates.
  owasp_llm: LLM01:2025
  cwe: CWE-829
- id: MEDUSA-RAG-SCAN-020
  name: flippedrag-blackbox-retriever-imitation
  severity: HIGH
  category: opinion_manipulation
  patterns:
  - (?i)(flippedrag|flipped.?rag|topic.?flip.?rag).{0,60}(retriev|opinion|stance|sentiment)
  - (?i)(surrogate.{0,20}retriever|black.?box.{0,20}imitation.{0,40}retriev).{0,60}(adversarial|poison|trigger)
  - (?i)(knowledge.?guided.{0,40}attack.{0,60}opinion|opinion.?flip.{0,40}topic.?cluster)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: FlippedRAG/Topic-FlipRAG black-box retriever imitation — opinion manipulation via surrogate model (99.29%
    RASR)'
  description: FlippedRAG trains a surrogate retriever via black-box API imitation to craft adversarial triggers. Topic-FlipRAG
    extends this to flip opinion polarity across entire topic clusters. 78% OMSR (FlippedRAG), 99.29% RASR (Topic-FlipRAG).
  remediation: Monitor for anomalous opinion polarity shifts in RAG outputs on controversial topics. Implement multi-perspective
    retrieval diversity scoring. Detect surrogate retriever probing via query pattern analysis.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-021
  name: paradox-source-transparency-poisoning
  severity: HIGH
  category: black_box_poisoning
  patterns:
  - (?i)(rag.?paradox|paradox.{0,20}rag).{0,60}(transparent|source|cit|wikipedia|url)
  - (?i)(infer.{0,20}retriev.{0,20}(preference|pattern|source)).{0,60}(poison|inject|manipulate)
  - (?i)(cited.?source|disclosed.?source|source.?url).{0,80}(poison|inject|manipulate|adversarial)
  file_types:
  - '*.py'
  - '*.md'
  message: 'Detected: PARADOX source transparency exploitation — inferring retriever preferences from cited sources to poison
    external platforms (75-100% ASR)'
  description: PARADOX exploits RAG systems that cite their sources. Attacker observes retrieved URLs (Wikipedia, etc.), infers
    phrasing preferences, then injects poisoned text directly into those public platforms. Black-box attack with 75-100% ASR
    on commercial RAG.
  remediation: Avoid disclosing exact retrieved source URLs. Monitor external knowledge sources for tampering. Implement source
    integrity verification before retrieval caching.
  owasp_llm: LLM02:2025
  cwe: CWE-668
- id: MEDUSA-RAG-SCAN-022
  name: corruptrag-single-injection-adversarial-knowledge
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(corruptrag|corrupt.?rag|crag.?(as|ak)).{0,60}(inject|single|adversarial)
  - (?i)(single.{0,20}poison.{0,20}injection.{0,40}(rag|retriev|knowledge)).{0,40}(template|adversarial|knowledge)
  - (?i)(auxiliary.?llm.{0,40}refine.{0,40}(adversarial|poison).{0,40}(knowledge|passage|document))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CorruptRAG single-injection adversarial knowledge pattern (84-98% ASR)'
  description: 'CorruptRAG injects a single poisoned document per query. CRAG-AS embeds targeted + correct answers to outrank
