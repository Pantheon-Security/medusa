  - '*.txt'
  - '*.md'
  message: 'Detected: RAG Paradox — exploiting disclosed source lists to infer retriever preferences and corpus structure
    (Choi 2025, 90-95% ASR)'
  description: 'RAG Paradox (Choi 2025) exploits the transparency feature of disclosed sources (RAG systems that tell users
    which documents were retrieved) to analyze and reverse-engineer retriever preferences. ASR: 90-95%. By observing which
    sources are disclosed across many queries, attackers can reconstruct the corpus structure, identify high-influence documents,
    and craft targeted attacks against the retrieval system. Transparency designed to increase trust paradoxically creates
    an information leakage channel.'
  remediation: Limit source disclosure granularity — disclose document categories rather than specific source identifiers.
    Add noise to retrieval result ordering in disclosed sources. Implement rate limiting on source-correlated queries that
    appear designed to map corpus structure. Reconsider transparency-security tradeoffs in high-security RAG deployments.
  owasp_llm: LLM06:2025
  cwe: CWE-200
