  description: 'BiasRAG (Bagwe 2025) uses a two-phase attack: (1) query encoder poisoning to corrupt the similarity function
    used for retrieval, followed by (2) biased document injection that the corrupted encoder now preferentially retrieves.
    ASR: 90.05%. By manipulating both the retrieval mechanism and the corpus simultaneously, BiasRAG ensures systematic bias
    injection across all queries, not just those matching specific trigger patterns.'
  remediation: Apply query encoder integrity checking — compare encoder behavior against clean reference models for systematic
    bias. Implement retrieval diversity analysis to detect encoder biases that consistently retrieve specific document types.
    Use BiasDef post-retrieval filtering (Wu 2025) to catch biased passages before generation.
  owasp_llm: LLM02:2025
  cwe: CWE-20
