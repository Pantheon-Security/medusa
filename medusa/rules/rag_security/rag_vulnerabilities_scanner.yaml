  message: 'Detected: RAG-Thief — agent-based systematic query sequences designed to enumerate and exfiltrate private documents
    from RAG knowledge bases'
  description: RAG-Thief uses LLM agent-based systematic query sequences to extract and exfiltrate private documents from
    RAG knowledge bases. Unlike single-query attacks, RAG-Thief iteratively queries using semantically diverse inputs to retrieve
    the maximum possible coverage of the corpus. Designed for RAG systems with private data (medical records, legal documents,
    proprietary IP). Agent-based approach allows autonomous execution at scale without human attacker engagement.
  remediation: Implement query diversity rate limiting — detect systematic enumeration queries and block after threshold.
    Apply EPD (Ensemble Privacy Defense) to add noise to RAG outputs reducing exfiltration signal. Use differential privacy
    on retrieval to prevent complete corpus enumeration. Implement watermarking on private documents for exfiltration tracing.
