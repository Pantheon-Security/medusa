  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: AdvRAGgen — DPO-trained generator paraphrasing adversarial documents to bypass RAG defenses (Pathmanathan
    2025, 79-95% ASR)'
  description: 'AdvRAGgen (Pathmanathan 2025) trains a DPO-based generator to paraphrase adversarial corpus documents so they
    bypass RAG defenses (RAGPart, RAGMask, perplexity detection) while maintaining attack effectiveness. ASR: 79-95% against
    defended RAG systems. The DPO training optimizes paraphrases to minimize defense detection signals while maximizing retrieval
    relevance and generation success. Represents an adaptive attack that specifically targets defense mechanisms.'
  remediation: Apply diverse defense ensemble (multiple complementary defenses) rather than single defense — AdvRAGgen is
    trained against specific known defenses. Continuously update defense mechanisms to create a moving target for DPO optimization.
    Use InstructRAG denoising which is harder to bypass than pattern-matching defenses. Monitor for semantic equivalence between
    high-ASR documents and known adversarial templates.
  owasp_llm: LLM02:2025
