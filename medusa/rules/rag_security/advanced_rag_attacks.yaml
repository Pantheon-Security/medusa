# MEDUSA Scanner Rules - Advanced RAG Attacks (2025)
# Source: NotebookLM Long Context & RAG Research | Extracted: 2025-12-31
# 45+ rules for advanced RAG-specific attack detection

rules:
  # ============================================================================
  # Data Extraction Attacks (SECRET, CopyBreakRAG)
  # ============================================================================

  - id: RAG-EXTRACT-006
    name: secret-attack
    severity: CRITICAL
    category: rag_extraction
    patterns:
      - '(?i)SECRET.*attack|adaptive.*jailbreak.*CFT'
      - '(?i)cluster.?focused.*triggering'
    message: "SECRET extraction attack (35% success on Claude 3.7)"
    cwe: CWE-200
    owasp_llm: "LLM06:2025"
    metadata:
      success_rate: "35-48%"
      targets: "Claude 3.7, Gemini, GPT-4o"

  - id: RAG-EXTRACT-007
    name: copybreakrag
    severity: CRITICAL
    category: rag_extraction
    patterns:
      - '(?i)copybreakrag|CopyBreakRAG'
      - '(?i)agent.?based.*extraction'
      - '(?i)curiosity.?driven.*exploration'
    message: "CopyBreakRAG extraction attack (80% success on Coze)"
    cwe: CWE-200
    owasp_llm: "LLM06:2025"
    metadata:
      success_rate: ">80%"
      targets: "OpenAI GPTs, ByteDance Coze"

  - id: RAG-EXTRACT-008
    name: reasoning-exploitation
    severity: HIGH
    category: rag_extraction
    patterns:
      - '(?i)(forward|backward).*(context|reasoning|inference)'
      - '(?i)reasoning.?based.*exploitation'
    message: "Reasoning-based RAG exploitation pattern"
    cwe: CWE-200
    owasp_llm: "LLM06:2025"

  - id: RAG-EXTRACT-009
    name: output-format-evasion
    severity: MEDIUM
    category: rag_extraction
    patterns:
      - '(?i)(add|insert|include).*(line\s*break|marker|delimiter|&&)'
      - '(?i)specific.*output.*formatting'
    message: "Output formatting evasion for extraction"
    cwe: CWE-200
    owasp_llm: "LLM06:2025"

  # ============================================================================
  # Self-Correction Bypass (DisarmRAG)
  # ============================================================================

  - id: RAG-DISARM-001
    name: disarmrag-attack
    severity: CRITICAL
