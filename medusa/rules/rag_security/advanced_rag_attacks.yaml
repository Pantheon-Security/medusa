      - '(?i)self.?correction.*defeat'
      - '(?i)iterative.*prompt.*co.?optimization'
    message: "DisarmRAG self-correction bypass (94.75% ASR)"
    cwe: CWE-693
    owasp_llm: "LLM01:2025"
    metadata:
      success_rate: "94.75%"
      targets: "DeepSeek R1, QwQ"

  - id: RAG-DISARM-002
    name: retriever-poisoning
    severity: CRITICAL
