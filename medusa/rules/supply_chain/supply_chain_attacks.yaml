- id: CVE-2025-30154
  name: reviewdog/action-setup GHA compromise (CI secret exfiltration)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    A GitHub personal access token with write access to the reviewdog organisation
    was compromised, enabling an attacker to inject malicious code into the
    install.sh script of reviewdog/action-setup@v1 during a 2h49m window
    (18:42–20:31 UTC, March 11 2025). The injected payload was a Python script that
    read secrets from GitHub Actions runner process memory and exfiltrated them.
    Because reviewdog/action-setup is a composite dependency of multiple other
    reviewdog actions, the compromise cascaded to action-shellcheck,
    action-staticcheck, action-ast-grep, and action-typos regardless of whether
    those downstream actions were SHA-pinned. This attack preceded and may be related
    to the larger tj-actions/changed-files compromise (CVE-2025-30066) discovered
    three days later.
  affected:
  - ecosystem: github-actions
    package: reviewdog/action-setup
    ranges:
    - introduced: v1.0.0
      fixed: v1.3.3
  - ecosystem: github-actions
    package: reviewdog/action-shellcheck
    ranges:
    - introduced: v1.0.0
      fixed: v1.22.0
  - ecosystem: github-actions
    package: reviewdog/action-staticcheck
    ranges:
    - introduced: v1.0.0
      fixed: v1.4.3
  - ecosystem: github-actions
    package: reviewdog/action-ast-grep
    ranges:
    - introduced: v1.0.0
      fixed: v1.1.0
  - ecosystem: github-actions
    package: reviewdog/action-typos
    ranges:
    - introduced: v1.0.0
      fixed: v1.13.0
  remediation: Pin all reviewdog actions to SHA commits from v1.3.3+ (action-setup)
    or equivalent clean tags. Rotate all CI/CD secrets immediately.
  source_attack: SCA-2025-002
  import_patterns:
  - ecosystem: github-actions
    patterns:
    - (?i)reviewdog/action-setup\s*@\s*v1
    - (?i)reviewdog/action-shellcheck\s*@\s*v1
    - (?i)reviewdog/action-staticcheck\s*@\s*v1
    - (?i)reviewdog/action-ast-grep\s*@\s*v1
    - (?i)reviewdog/action-typos\s*@\s*v1
    - (?i)reviewdog/action-setup
  references:
  - type: ADVISORY
    url: https://github.com/advisories/GHSA-qmg3-hpqr-gqvc
  - type: ADVISORY
    url: https://nvd.nist.gov/vuln/detail/CVE-2025-30154
  - type: WEB
    url: https://www.wiz.io/blog/new-github-action-supply-chain-attack-reviewdog-action-setup

- id: CVE-2025-30066
  name: tj-actions/changed-files GHA compromise (all tags poisoned)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    An attacker compromised a GitHub PAT associated with the tj-actions bot account
    and used it to retroactively rewrite ALL existing version tags across
    tj-actions/changed-files to point to a single malicious commit. The injected
    payload was a Python script that extracted CI/CD secrets from GitHub Actions
    runner process memory and printed them in plaintext to workflow logs — visible
    to anyone with read access to the workflow run. Even SHA-pinned references were
    affected because the tags were the reference point. Impact: ~23,000+ repositories.
    Attributed to DPRK-linked threat actors (Lazarus Group) based on TTPs and
    infrastructure overlaps. One of the largest GitHub Actions supply chain attacks
    on record by repository impact count.
  affected:
  - ecosystem: github-actions
    package: tj-actions/changed-files
    ranges:
    - introduced: v1.0.0
      fixed: v46.0.0
  remediation: Upgrade to tj-actions/changed-files v46.0.0 or later (SHA-pinned).
    Rotate ALL CI/CD secrets immediately. Audit all workflow runs during the
    compromise window (March 14–15 2025).
  source_attack: SCA-2025-003
  import_patterns:
  - ecosystem: github-actions
    patterns:
    - (?i)tj-actions/changed-files
  references:
  - type: ADVISORY
    url: https://github.com/advisories/GHSA-mrrh-fwg8-r2c3
  - type: ADVISORY
    url: https://nvd.nist.gov/vuln/detail/CVE-2025-30066
  - type: WEB
    url: https://www.wiz.io/blog/new-github-action-supply-chain-attack-tj-actions-changed-files
  - type: WEB
    url: https://unit42.paloaltonetworks.com/github-actions-supply-chain-attack/

- id: CVE-2026-33634
  name: aquasecurity/trivy-action GHA compromise (TeamPCP)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    The aquasecurity/trivy-action GitHub Action was compromised by threat actor
    TeamPCP via force-pushing malicious commits to 76 of 77 version tags. The Trivy
    binary v0.69.4 was also trojanized and published to Docker Hub. The attack
    exfiltrated CI secrets and environment variables to a typosquatted domain
    scan.aquasecurtiy.org (intentional misspelling). The compromise also targeted
    aquasecurity/setup-trivy (all 7 tags). Active compromise window: March 19 18:22
    UTC to March 23 01:36 UTC. CVSS 9.4 (v4.0). Part of the broader TeamPCP supply
    chain campaign that also compromised LiteLLM and Checkmarx.
  affected:
  - ecosystem: github-actions
    package: aquasecurity/trivy-action
    ranges:
    - introduced: v0.0.1
      fixed: v0.35.0
  - ecosystem: github-actions
    package: aquasecurity/setup-trivy
    ranges:
    - introduced: v0.2.0
      fixed: v0.2.7
  remediation: Remove aquasecurity/trivy-action v0.0.1–v0.34.2 immediately. Upgrade
    to v0.35.0 (SHA-pinned). Rotate all credentials that may have been exposed.
  source_attack: SCA-2026-001
  import_patterns:
  - ecosystem: github-actions
    patterns:
    - (?i)aquasecurity/trivy-action\s*@\s*v0\.(([0-2]\d|3[0-4])\.)
    - (?i)aquasecurity/trivy-action
    - (?i)aquasecurity/setup-trivy\s*@\s*v0\.2\.[0-6]
    - (?i)aquasecurity/setup-trivy
  references:
  - type: ADVISORY
    url: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
  - type: ADVISORY
    url: https://nvd.nist.gov/vuln/detail/CVE-2026-33634
  - type: WEB
    url: https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/

# =============================================================================
# Known C2 domains (IoC — pattern-based only)
