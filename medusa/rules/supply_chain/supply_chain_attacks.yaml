- id: MEDUSA-SCA-SCAN-002
  name: lottie-player npm account hijack
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Attackers phished a LottieFiles developer's personal Gmail account using a
    fake collaboration invitation, harvesting both npm credentials and 2FA codes
    in a single session. Three malicious versions of @lottiefiles/lottie-player
    were published within approximately two hours on October 30, 2024. Each
    version contained the Ace Drainer SDK — a cryptocurrency wallet-draining
    payload that prompts users to connect their Web3 wallets and then siphons
    funds. The package had 94,000+ weekly downloads and 4+ million lifetime
    installs, primarily used to render Lottie animations on websites.
  affected:
  - ecosystem: npm
    package: '@lottiefiles/lottie-player'
    ranges:
    - introduced: 2.0.5
      fixed: 2.0.8
  remediation: Remove @lottiefiles/lottie-player 2.0.5, 2.0.6, 2.0.7 immediately.
    Upgrade to 2.0.8. Rotate all credentials that may have been exposed.
  source_attack: SCA-2024-003
  import_patterns:
  - ecosystem: npm
    patterns:
    - '"@lottiefiles/lottie-player"\s*:\s*"[^"]*2\.0\.[567]'
    - '@lottiefiles/lottie-player@2\.0\.[567]'
    - (?i)@lottiefiles/lottie-player
  references:
  - type: WEB
    url: https://lottiefiles.com/blog/inside-lottiefiles/resolution-of-security-incident-with-lottiefiles-lottie-player-package
  - type: WEB
    url: https://thehackernews.com/2024/10/lottiefiles-issues-warning-about.html

- id: CVE-2024-54134
  name: solana web3.js npm account hijack (cryptocurrency key exfiltration)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Attackers sent spear-phishing emails to members of the @solana npm organisation
    with publish access, directing them to a cloned npm website to harvest credentials
    and live 2FA codes. Two malicious versions were published between 15:20 and 20:25
    UTC on December 2, 2024. Both versions contained a backdoor function named
    addToQueue that captured private keys and secret material during transaction
    signing operations and exfiltrated them via CloudFlare Worker headers to an
    attacker-controlled Solana address. Approximately $184,000–$190,000 in
    cryptocurrency was stolen. The exfiltration C2 domain sol-rpc.xyz was registered
    ten days before the attack. The package has 450,000+ weekly downloads.
  affected:
  - ecosystem: npm
    package: '@solana/web3.js'
    ranges:
    - introduced: 1.95.6
      fixed: 1.95.8
  remediation: Remove @solana/web3.js 1.95.6, 1.95.7 immediately. Upgrade to 1.95.8.
    Rotate all credentials (especially Solana private keys) that may have been exposed.
  source_attack: SCA-2024-004
  import_patterns:
  - ecosystem: npm
    patterns:
    - '"@solana/web3\.js"\s*:\s*"[^"]*1\.95\.[67]'
    - '@solana/web3\.js@1\.95\.[67]'
    - (?i)@solana/web3\.js
  references:
  - type: ADVISORY
    url: https://github.com/solana-labs/solana-web3.js/security/advisories/GHSA-jcxm-7wvp-g6p5
  - type: ADVISORY
    url: https://nvd.nist.gov/vuln/detail/CVE-2024-54134
  - type: WEB
    url: https://thehackernews.com/2024/12/researchers-uncover-backdoor-in-solanas.html

- id: MEDUSA-SCA-SCAN-008
  name: rand-user-agent npm RAT (leaked automation token)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Three malicious versions of the rand-user-agent npm package were published using
    a stale automation token that had been inadvertently committed to the package's
    GitHub repository years earlier and never rotated. The attacker discovered the
    leaked token and used it to publish versions 1.0.110, 2.0.83, and 2.0.84 — all
    containing RATatouille, a remote access trojan that establishes a persistent
    backdoor with full command-and-control capability. rand-user-agent is a utility
    for generating random browser user-agent strings, widely used in web scraping
    and automated testing pipelines (~75,000 weekly downloads). This attack is a
    canonical example of leaked credential exploitation from version control history.
  affected:
  - ecosystem: npm
    package: rand-user-agent
    ranges:
    - introduced: 1.0.110
      fixed: 1.0.111
    - introduced: 2.0.83
      fixed: 2.0.85
  remediation: Remove rand-user-agent 1.0.110, 2.0.83, 2.0.84 immediately. Upgrade
    to latest clean version. Rotate all credentials that may have been exposed.
  source_attack: SCA-2025-004
  import_patterns:
  - ecosystem: npm
    patterns:
    - '"rand-user-agent"\s*:\s*"[^"]*(1\.0\.110|2\.0\.83|2\.0\.84)'
    - rand-user-agent@(1\.0\.110|2\.0\.83|2\.0\.84)
    - (?i)rand-user-agent
  references:
  - type: ADVISORY
    url: https://socket.dev/npm/package/rand-user-agent/alert/supply-chain-attack
  - type: WEB
    url: https://thehackernews.com/2025/05/popular-npm-package-rand-user-agent.html

- id: MEDUSA-SCA-SCAN-012
  name: axios npm account hijack (RAT via fake dependency)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    npm account for lead axios maintainer (jasonsaayman) was hijacked via email
    change to ProtonMail. Malicious versions 1.14.1 and 0.30.4 were published via
    npm CLI, bypassing GitHub Actions CI/CD. Both injected a fake dependency
    plain-crypto-js@4.2.1 which drops a cross-platform RAT via postinstall hook.
  affected:
  - ecosystem: npm
    package: axios
    ranges:
    - introduced: 0.30.4
      fixed: 0.30.5
    - introduced: 1.14.1
      fixed: 1.14.2
  - ecosystem: npm
    package: plain-crypto-js
    ranges:
    - introduced: 4.2.1
      fixed: 4.2.2
  remediation: Remove axios 1.14.1, 0.30.4 and plain-crypto-js 4.2.1 immediately.
    Upgrade axios to 1.14.0. Rotate all credentials that may have been exposed.
  source_attack: SCA-2026-003
  import_patterns:
  - ecosystem: npm
    patterns:
    - '"axios"\s*:\s*"[^"]*(1\.14\.1|0\.30\.4)'
    - axios@(1\.14\.1|0\.30\.4)
    - '"plain-crypto-js"\s*:\s*"[^"]*4\.2\.1'
    - plain-crypto-js@4\.2\.1
    - (?i)plain-crypto-js
  references:
  - type: WEB
    url: https://thehackernews.com/2026/03/axios-supply-chain-attack-pushes-cross.html
  - type: REPORT
    url: https://github.com/axios/axios/issues/10604

