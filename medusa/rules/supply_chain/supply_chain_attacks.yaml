- id: CVE-2024-3094
  name: xz-utils backdoor (liblzma)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Sophisticated multi-year social engineering attack by pseudonymous contributor
    Jia Tan (JiaT75) who gained co-maintainer access to the xz-utils project.
    Malicious build-time code was hidden in test fixture files that injected a
    backdoor into the liblzma library during the build process. The backdoor
    targeted OpenSSH servers using systemd with liblzma loaded, enabling
    unauthorized remote access by intercepting RSA_public_decrypt to validate
    attacker-controlled keys. Discovered by Andres Freund (Microsoft) who noticed
    SSH login latency anomalies.
  affected:
  - ecosystem: system
    package: xz-utils
    ranges:
    - introduced: 5.6.0
      fixed: 5.6.2
  remediation: Remove xz-utils 5.6.0, 5.6.1 immediately. Upgrade to 5.4.6. Rotate
    all credentials that may have been exposed.
  source_attack: SCA-2024-001
  import_patterns:
  - ecosystem: system
    patterns:
    - (?i)xz-utils[=\s]+(5\.6\.0|5\.6\.1)
    - (?i)liblzma[=\s]+(5\.6\.0|5\.6\.1)
    - (?i)xz-utils
    - (?i)liblzma
  references:
  - type: ADVISORY
    url: https://nvd.nist.gov/vuln/detail/CVE-2024-3094
  - type: REPORT
    url: https://www.openwall.com/lists/oss-security/2024/03/29/4
  - type: WEB
    url: https://research.swtch.com/xz-timeline

