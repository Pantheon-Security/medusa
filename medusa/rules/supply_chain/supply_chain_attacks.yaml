- id: MEDUSA-SCA-SCAN-004
  name: ultralytics PyPI poisoning via CI script injection
  severity: CRITICAL
  cwe: CWE-78
  owasp_llm: LLM05:2025
  description: |
    Attackers exploited a GitHub Actions script injection vulnerability via pull
    request titles on the ultralytics repository. Two malicious PRs (#18018, #18020)
    contained command injection payloads in their titles that were interpolated into
    a workflow using pull_request_target without sanitisation, giving arbitrary code
    execution in CI. This published poisoned PyPI packages. A second wave on December
    7 used a stolen PyPI API token to directly publish versions 8.3.45 and 8.3.46.
    All malicious versions deployed an XMRig cryptocurrency miner connecting to
    connect.consrensys.com:8080. The ultralytics package (YOLO object detection)
    has 60+ million PyPI downloads.
  affected:
  - ecosystem: pypi
    package: ultralytics
    ranges:
    - introduced: 8.3.41
      fixed: 8.3.43
    - introduced: 8.3.45
      fixed: 8.3.47
  remediation: Remove ultralytics 8.3.41, 8.3.42, 8.3.45, 8.3.46 immediately.
    Upgrade to 8.3.43. Rotate all credentials that may have been exposed.
  source_attack: SCA-2024-005
  import_patterns:
  - ecosystem: pypi
    patterns:
    - ultralytics==(8\.3\.41|8\.3\.42|8\.3\.45|8\.3\.46)
    - (?i)ultralytics
  references:
  - type: WEB
    url: https://blog.pypi.org/posts/2024-12-11-ultralytics-attack-analysis/
  - type: WEB
    url: https://www.reversinglabs.com/blog/compromised-ultralytics-pypi-package-delivers-crypto-coinminer
  - type: WEB
    url: https://snyk.io/blog/ultralytics-ai-pwn-request-supply-chain-attack/

- id: MEDUSA-SCA-SCAN-011
  name: litellm PyPI poisoning via stolen credentials (TeamPCP)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    PyPI account for the litellm package maintainer was compromised by threat actor
    TeamPCP using credentials stolen via the prior Trivy GitHub Actions compromise
    (SCA-2026-001 / CVE-2026-33634). Malicious versions 1.82.7 and 1.82.8 were
    published to PyPI, live for approximately 40 minutes before quarantine. Version
    1.82.7 embedded a base64-encoded payload in litellm/proxy/proxy_server.py
    executing on import. Version 1.82.8 added litellm_init.pth to site-packages for
    persistence on every Python interpreter startup. Both exfiltrated credentials to
    models.litellm.cloud (attacker-controlled, NOT the legitimate BerriAI domain).
    Part of the broader TeamPCP campaign (Trivy → LiteLLM → Checkmarx).
  affected:
  - ecosystem: pypi
    package: litellm
    ranges:
    - introduced: 1.82.7
      fixed: 1.82.9
  remediation: Remove litellm 1.82.7, 1.82.8 immediately. Upgrade to 1.82.6. Rotate
    all credentials that may have been exposed.
  source_attack: SCA-2026-002
  import_patterns:
  - ecosystem: pypi
    patterns:
    - litellm==(1\.82\.7|1\.82\.8)
    - (?i)litellm
  references:
  - type: WEB
    url: https://docs.litellm.ai/blog/security-update-march-2026
  - type: WEB
    url: https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-teampcp-supply-chain-campaign/
  - type: WEB
    url: https://www.wiz.io/blog/threes-a-crowd-teampcp-trojanizes-litellm-in-continuation-of-campaign
  - type: WEB
    url: https://www.sonatype.com/blog/compromised-litellm-pypi-package-delivers-multi-stage-credential-stealer

