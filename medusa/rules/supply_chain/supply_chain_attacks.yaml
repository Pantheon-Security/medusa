- id: MEDUSA-SCA-SCAN-005
  name: boltdb-go Go module typosquat (RCE RAT)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    A malicious Go module typosquatting the legitimate BoltDB embedded database
    (github.com/boltdb/bolt vs github.com/boltdb-go/bolt — hyphen vs slash in the
    organisation name) persisted undetected for over three years by exploiting Go
    Module Proxy caching behaviour. The attacker published a malicious v1.3.1 to
    GitHub in November 2021, which was cached by the Go Module Mirror. The tag was
    subsequently rewritten on GitHub to point to legitimate code — meaning any manual
    code audit would find clean code, but the Go Module Proxy continued serving the
    malicious cached version. The malicious package contained a remote access trojan
    with RCE capability. Discovered February 2025 and removed from the Go module
    proxy and vulnerability database. Used by Shopify, Heroku, and many other
    production systems.
  affected:
  - ecosystem: go
    package: github.com/boltdb-go/bolt
    ranges:
    - introduced: 0.0.0
      fixed: 99999.0.0
  remediation: Remove github.com/boltdb-go/bolt entirely. Use only the legitimate
    github.com/boltdb/bolt (slash, not hyphen). Rotate all credentials that may
    have been exposed.
  source_attack: SCA-2025-001
  import_patterns:
  - ecosystem: go
    patterns:
    - github\.com/boltdb-go/bolt
  references:
  - type: WEB
    url: https://thehackernews.com/2025/02/malicious-go-package-exploits-module-mirror.html
  - type: WEB
    url: https://socket.dev/blog/malicious-package-exploits-go-module-proxy-caching-for-persistence

- id: MEDUSA-SCA-SCAN-009
  name: qmgo Go module typosquat (double-i org name)
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Two malicious Go modules typosquatting the legitimate qmgo MongoDB driver
    (github.com/qiniu/qmgo) were published under subtly misspelled organisation
    names: github.com/qiniiu/qmgo (double-i) and github.com/qiiniu/qmgo (different
    double-i position). Both variants contained embedded malware that established
    persistence and executed attacker-controlled payloads. The attack exploited Go
    module naming conventions where a single character difference in the GitHub
    organisation name creates a completely distinct module path, with no
    registry-level typosquat protection. The Go Module Mirror cached the malicious
    versions, extending their reach. Discovered during a routine security audit and
    subsequently removed.
  affected:
  - ecosystem: go
    package: github.com/qiniiu/qmgo
    ranges:
    - introduced: 0.0.0
      fixed: 99999.0.0
  - ecosystem: go
    package: github.com/qiiniu/qmgo
    ranges:
    - introduced: 0.0.0
      fixed: 99999.0.0
  remediation: Remove github.com/qiniiu/qmgo and github.com/qiiniu/qmgo entirely.
    Use only the legitimate github.com/qiniu/qmgo. Rotate all credentials that may
    have been exposed.
  source_attack: SCA-2025-005
  import_patterns:
  - ecosystem: go
    patterns:
    - github\.com/qiniiu/qmgo
    - github\.com/qiiniu/qmgo
  references:
  - type: WEB
    url: https://socket.dev/blog/go-module-typosquatting-qmgo

