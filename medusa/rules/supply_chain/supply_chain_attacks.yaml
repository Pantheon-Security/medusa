- id: MEDUSA-SCA-SCAN-013
  name: Known supply chain C2 domains
  severity: CRITICAL
  cwe: CWE-506
  owasp_llm: LLM05:2025
  description: |
    Matches known C2 domains from cataloged supply chain attacks. Detection in
    source code, configuration files, or lock files indicates a compromised
    dependency or direct C2 communication channel. Domains include infrastructure
    from the TeamPCP campaign (Trivy, LiteLLM, Checkmarx), the polyfill.io CDN
    hijack, and cryptocurrency-stealing RAT infrastructure.
  import_patterns:
  - ecosystem: any
    patterns:
    - (?i)bootcdn\.net
    - (?i)bootcss\.com
    - (?i)cdn\.polyfill\.io
    - (?i)checkmarx\.zone
    - (?i)connect\.consrensys\.com
    - (?i)googie-anaiytics\.com
    - (?i)kuurza\.com
    - (?i)models\.litellm\.cloud
    - (?i)newcrbpc\.com
    - (?i)scan\.aquasecurtiy\.org
    - (?i)sfrclak\.com
    - (?i)sol-rpc\.xyz
    - (?i)staticfile\.net
    - (?i)staticfile\.org
    - (?i)unionadjs\.com
