rules:
- id: SLOP-HALLUC-001
  name: hallucinated-securehashlib
  severity: CRITICAL
  category: hallucinated_package
  languages:
  - python
  patterns:
  - import\s+securehashlib
  - from\s+securehashlib\s+import
  - '[''"'']securehashlib[''"'']'
  message: Known hallucinated package 'securehashlib' detected - slopsquatting risk
  cwe: CWE-506
  owasp_llm: LLM09:2025
  metadata:
    prompt_trigger: password hashing
    attack_type: slopsquatting
  file_types: &id001
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
- id: SLOP-HALLUC-002
  name: hallucinated-hyper-h2
  severity: CRITICAL
  category: hallucinated_package
  languages:
  - python
  patterns:
  - import\s+hyper[-_]?h2
  - from\s+hyper[-_]?h2\s+import
  - '[''"'']hyper-h2[''"'']'
  - '[''"'']http2-h2[''"'']'
  message: Known hallucinated HTTP/2 package detected
  cwe: CWE-506
  owasp_llm: LLM09:2025
  file_types: *id001
- id: SLOP-HALLUC-003
  name: hallucinated-jsonwebtoken-py
  severity: HIGH
  category: hallucinated_package
  languages:
  - python
  patterns:
  - import\s+jsonwebtoken
  - from\s+jsonwebtoken\s+import
  message: Potentially hallucinated 'jsonwebtoken' in Python (use PyJWT)
  cwe: CWE-506
  file_types: *id001
- id: SLOP-HALLUC-004
  name: hallucinated-data-analysis-toolkit
  severity: HIGH
  category: hallucinated_package
  patterns:
  - '[''"'']data-analysis-toolkit[''"'']'
  - '[''"'']data_analysis_toolkit[''"'']'
  message: Known GPT-4o hallucinated package name
  cwe: CWE-506
  file_types: *id001
- id: SLOP-HALLUC-005
  name: hallucinated-flask-livereload
  severity: HIGH
  category: hallucinated_package
  languages:
  - python
  patterns:
  - import\s+flask_livereload
  - from\s+flask_livereload\s+import
  message: Hallucinated Flask package detected
  cwe: CWE-506
  file_types: *id001
- id: SLOP-HALLUC-006
  name: hallucinated-generic-placeholders
  severity: MEDIUM
  category: hallucinated_package
  patterns:
  - '[''"'']some[-_]?ml[-_]?library[''"'']'
  - '[''"'']some[-_]?security[-_]?sdk[''"'']'
  - '[''"'']some[-_]?cloud[-_]?api[''"'']'
  - '[''"'']some[-_]?multimedia[-_]?sdk[''"'']'
  - '[''"'']ammonia[-_]?library[''"'']'
  message: Generic placeholder package name - likely hallucinated
  cwe: CWE-506
  file_types: *id001
- id: SLOP-HALLUC-007
  name: hallucinated-langchain-ruby
  severity: HIGH
  category: hallucinated_package
  patterns:
  - gem\s+['"]langchain['"]
  - require\s+['"]langchain['"]
  message: Ruby 'langchain' is squatted - use 'langchainrb'
  cwe: CWE-506
  file_types: *id001
- id: SLOP-HALLUC-008
  name: hallucinated-cv2-install
  severity: MEDIUM
  category: hallucinated_package
  languages:
  - python
  patterns:
  - pip\s+install\s+cv2
  - '[''"'']cv2[''"''].*install'
  message: cv2 is import name not package - use opencv-python
  cwe: CWE-506
  file_types: *id001
- id: SLOP-TYPO-001
  name: typosquat-requests
  severity: HIGH
  category: typosquatting
  languages:
  - python
  patterns:
  - import\s+(?:requesqs|requetsts|reqests|requsts|rqeuests)
  - from\s+(?:requesqs|requetsts|reqests|requsts)\s+import
  message: Potential typosquat of 'requests' package
  cwe: CWE-506
  file_types: *id001
- id: SLOP-TYPO-002
  name: typosquat-lodash
  severity: HIGH
  category: typosquatting
  languages:
  - javascript
  - typescript
  patterns:
  - require\(['"](?:loadsh|lodas|lodasj|l0dash)['"]\)
  - from\s+['"](?:loadsh|lodas|lodasj|l0dash)['"]
  message: Potential typosquat of 'lodash' package
  cwe: CWE-506
  file_types: *id001
- id: SLOP-TYPO-003
  name: typosquat-numpy
  severity: HIGH
  category: typosquatting
  languages:
  - python
  patterns:
  - import\s+(?:numppy|numby|nunpy|nupy)
  - from\s+(?:numppy|numby|nunpy|nupy)\s+import
  message: Potential typosquat of 'numpy' package
  cwe: CWE-506
  file_types: *id001
- id: SLOP-TYPO-004
  name: typosquat-pandas
  severity: HIGH
  category: typosquatting
  languages:
  - python
  patterns:
  - import\s+(?:pandsa|pnadas|panads|padas)
  message: Potential typosquat of 'pandas' package
  cwe: CWE-506
  file_types: *id001
- id: SLOP-TYPO-005
  name: homoglyph-attack
  severity: CRITICAL
  category: typosquatting
  patterns:
  - (?i)jeIlyfish
  - (?i)je1lyfish
  - (?i)jel1yfish
  message: Homoglyph attack - character substitution (l/I/1)
  cwe: CWE-506
  metadata:
    known_malware: jeIlyfish SSH/GPG key stealer
  file_types: *id001
- id: SLOP-SETUP-001
  name: setup-cmdclass-override
  severity: CRITICAL
  category: install_hook
  languages:
  - python
  patterns:
  - cmdclass\s*=\s*\{['"]install['"]
  - class\s+\w+Install\s*\(\s*install\s*\)
  - from\s+setuptools\.command\.install\s+import\s+install
  message: setup.py cmdclass override - install-time code execution
  cwe: CWE-94
  owasp_llm: LLM09:2025
  file_types: *id001
- id: SLOP-SETUP-002
  name: setup-os-system
  severity: CRITICAL
  category: install_hook
  languages:
  - python
  patterns:
  - os\.system\s*\([^)]*(?:wget|curl|chmod|bash|sh|python)
  - subprocess\.(?:call|run|Popen)\s*\([^)]*(?:wget|curl|chmod)
  message: Dangerous system command in setup.py
  cwe: CWE-78
  file_types: *id001
- id: SLOP-SETUP-003
  name: setup-network-fetch
  severity: HIGH
  category: install_hook
  languages:
  - python
  patterns:
  - urllib\.request\.urlretrieve.*setup\.py
  - requests\.get.*\.content.*write
  message: Network fetch in setup.py - potential dropper
  cwe: CWE-94
  file_types: *id001
- id: SLOP-SETUP-004
  name: setup-eval-exec
  severity: CRITICAL
  category: install_hook
  languages:
  - python
  patterns:
  - exec\s*\(.*(?:base64|decode|urlopen)
  - eval\s*\(.*(?:base64|decode|urlopen)
  message: Dynamic code execution in setup.py
  cwe: CWE-94
  file_types: *id001
- id: SLOP-NPM-001
  name: npm-preinstall-danger
  severity: HIGH
  category: install_hook
  languages:
  - json
  patterns:
  - '"preinstall"\s*:\s*"[^"]*(?:curl|wget|bash|sh|node\s+-e)"'
  message: Dangerous preinstall script in package.json
  cwe: CWE-94
  file_types: *id001
- id: SLOP-NPM-002
  name: npm-postinstall-danger
  severity: HIGH
  category: install_hook
  languages:
  - json
  patterns:
  - '"postinstall"\s*:\s*"[^"]*(?:curl|wget|bash|sh|node\s+-e)"'
  - '"postinstall"\s*:\s*"[^"]*eval\s*\("'
  message: Dangerous postinstall script in package.json
  cwe: CWE-94
  file_types: *id001
- id: SLOP-NPM-003
  name: npm-script-base64
  severity: CRITICAL
  category: install_hook
  languages:
  - json
  patterns:
  - '"(?:pre|post)?install"\s*:\s*"[^"]*(?:atob|Buffer\.from|base64)"'
  message: Base64 decoding in npm install script
  cwe: CWE-94
  file_types: *id001
- id: SLOP-NPM-004
  name: npm-child-process
  severity: HIGH
  category: install_hook
  languages:
  - javascript
  patterns:
  - child_process\.exec\s*\(
  - child_process\.execSync\s*\(
  - child_process\.spawn\s*\([^)]*(?:/bin/|cmd|powershell)
  message: Child process execution in npm package
  cwe: CWE-78
  file_types: *id001
- id: SLOP-RUST-001
  name: cargo-buildrs-command
  severity: HIGH
  category: install_hook
  languages:
  - rust
  patterns:
  - std::process::Command::new\s*\([^)]*(?:curl|wget|bash|sh)
  - Command::new\s*\([^)]*(?:curl|wget|bash|sh)
  message: Dangerous command in Cargo build.rs
  cwe: CWE-78
  file_types: *id001
- id: SLOP-RUST-002
  name: cargo-buildrs-network
  severity: HIGH
  category: install_hook
  languages:
  - rust
  patterns:
  - reqwest::(?:get|Client)
  - std::net::TcpStream::connect
  message: Network activity in build.rs
  cwe: CWE-94
  file_types: *id001
- id: SLOP-RUST-003
  name: hallucinated-rust-crate
  severity: HIGH
  category: hallucinated_package
  languages:
  - rust
  - toml
  patterns:
  - xrvrv
  - '"secure[-_]?crypto[-_]?lib"'
  message: Known hallucinated Rust crate
  cwe: CWE-506
  file_types: *id001
- id: SLOP-RUBY-001
  name: gemspec-extensions
  severity: HIGH
  category: install_hook
  languages:
  - ruby
  patterns:
  - s\.extensions\s*=
  - spec\.extensions\s*=
  message: Gemspec extensions can execute code during install
  cwe: CWE-94
  file_types: *id001
- id: SLOP-RUBY-002
  name: ruby-extconf-danger
  severity: HIGH
  category: install_hook
  languages:
  - ruby
  patterns:
  - system\s*\([^)]*(?:curl|wget|bash|sh)
  - '`[^`]*(?:curl|wget|bash|sh)'
  message: Dangerous system call in extconf.rb
  cwe: CWE-78
  file_types: *id001
- id: SLOP-EXFIL-001
  name: discord-webhook
  severity: CRITICAL
  category: exfiltration
  patterns:
  - discord\.com/api/webhooks
  - discordapp\.com/api/webhooks
  - discord\.gg/api/webhooks
  message: Discord webhook exfiltration endpoint detected
  cwe: CWE-200
  metadata:
    attack_type: data_exfiltration
  file_types: *id001
- id: SLOP-EXFIL-002
  name: discord-token-theft
  severity: CRITICAL
  category: exfiltration
  patterns:
  - leveldb.*discord
  - Discord.*Local\s*Storage
  - discord.*token.*grab
  - app-[0-9]+\.[0-9]+\.[0-9]+.*Local\s*Storage
  message: Discord token theft pattern
  cwe: CWE-522
  file_types: *id001
- id: SLOP-SSH-001
  name: ssh-key-read
  severity: CRITICAL
  category: credential_theft
  patterns:
  - open\s*\([^)]*\.ssh/id_rsa
  - open\s*\([^)]*\.ssh/id_ed25519
  - read.*\.ssh/(?:id_rsa|id_ed25519|id_dsa)
  - fs\.readFileSync.*\.ssh
  message: SSH private key access attempt
  cwe: CWE-522
  file_types: *id001
- id: SLOP-SSH-002
  name: authorized-keys-inject
  severity: CRITICAL
  category: persistence
  patterns:
  - authorized_keys.*append
  - appendFile.*authorized_keys
  - '>>.*authorized_keys'
  - write.*authorized_keys
  message: SSH authorized_keys injection - backdoor persistence
  cwe: CWE-284
  file_types: *id001
- id: SLOP-ENV-001
