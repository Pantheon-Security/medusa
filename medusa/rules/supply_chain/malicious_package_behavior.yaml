rules:
- id: MALPKG-PY-NET-001
  name: python-network-source
  severity: HIGH
  category: network_api
  languages:
  - python
  patterns:
  - socket\.recv
  - urllib\.request\.urlopen
  - http\.client\.HTTPSConnection
  - requests\.(?:get|post|put|delete)
  - httpx\.(?:get|post|put|delete)
  message: Python network data source API
  cwe: CWE-200
  file_types: &id001
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
- id: MALPKG-PY-NET-002
  name: python-network-sink
  severity: HIGH
  category: network_api
  languages:
  - python
  patterns:
  - socket\.send
  - smtplib\.SMTP.*sendmail
  - requests\.post.*(?:json|data)\s*=
  message: Python network data sink API - exfiltration vector
  cwe: CWE-200
  file_types: *id001
- id: MALPKG-PY-FS-001
  name: python-filesystem-source
  severity: MEDIUM
  category: filesystem_api
  languages:
  - python
  patterns:
  - os\.read
  - fileinput\.input
  - tarfile\.open
  - zipfile\.ZipFile.*read
  message: Python filesystem read API
  cwe: CWE-200
  file_types: *id001
- id: MALPKG-PY-FS-002
  name: python-filesystem-sink
  severity: HIGH
  category: filesystem_api
  languages:
  - python
  patterns:
  - os\.write
  - shutil\.rmtree
  - pathlib\.Path.*rmdir
  - os\.remove
  message: Python filesystem destructive API
  cwe: CWE-400
  file_types: *id001
- id: MALPKG-PY-PROC-001
  name: python-process-spawn
  severity: HIGH
  category: process_api
  languages:
  - python
  patterns:
  - os\.popen
  - subprocess\.Popen
  - subprocess\.(?:call|run)
  - multiprocessing\.Process
  - os\.system
  - os\.spawn
  message: Python process spawning API
  cwe: CWE-78
  file_types: *id001
- id: MALPKG-PY-CODE-001
  name: python-dynamic-exec
  severity: CRITICAL
  category: code_generation
  languages:
  - python
  patterns:
  - ^\s*(?!#)\beval\s*\(
  - ^\s*(?!#)\bexec\s*\(
  - ctypes\.CDLL
  - code\.InteractiveInterpreter
  - compile\s*\([^)]+,[^)]+,['"]exec['"]
  message: Python dynamic code execution
  cwe: CWE-94
  file_types: *id001
- id: MALPKG-JS-NET-001
