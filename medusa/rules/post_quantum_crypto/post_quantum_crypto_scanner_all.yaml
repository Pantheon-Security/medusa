metadata:
  subject: post_quantum_crypto
  prefix: PQC
  total_rules: 60
  sources:
  - post_quantum_crypto_scanner_expansion.yaml
  - post_quantum_crypto_scanner_fc.yaml
  generation_date: '2026-03-01'
rules:
- id: PQC-001
  name: HNDL Attack Pattern — Bulk Encrypted Data Exfiltration
  description: 'Detects patterns suggesting harvest-now-decrypt-later data collection: bulk extraction of encrypted model
    weights, API responses, or training data for future quantum decryption. Attackers archive RSA/ECDH-encrypted ML API traffic
    knowing future quantum computers will decrypt it.

    '
  severity: HIGH
  category: harvest_now_decrypt_later
  patterns:
    request:
    - pattern: (?i)(harvest|archive|bulk.{0,20}(encrypt|cipher|tls|ssl))
      location: body
    - pattern: (?i)(download|export|dump).{0,30}(model.weights?|checkpoint|embedding)
      location: body
    - pattern: (?i)decrypt.{0,20}later
      location: body
    response:
    - pattern: (?i)(bulk|mass|batch).{0,30}(export|download|extract).{0,30}(encrypt)
      location: body
  tags:
  - hndl
  - exfiltration
  - quantum-threat
  file_types: &id001
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.rs'
  - '*.go'
- id: PQC-002
  name: Weak Classical Crypto in AI API — RSA/ECDH Protecting Sensitive ML Data
  description: 'Detects explicit use of quantum-vulnerable classical cryptographic algorithms (RSA, ECDH, ECDSA) for protecting
    ML model weights, training data, or inference outputs. These are vulnerable to Shor''s algorithm on a CRQC. Flags explicit
    algorithm negotiation or configuration specifying RSA/ECC in AI system contexts.

    '
  severity: MEDIUM
  category: weak_cryptography
  patterns:
    request:
    - pattern: (?i)(rsa[_\-]?(2048|4096)|ecdh[_\-]?(p256|p384|secp256|secp384)|ecdsa[_\-]?(p256|p384))
      location: body
    - pattern: (?i)(key[_\-]?encapsulation|key[_\-]?exchange).{0,50}(rsa|ecdh|diffie.hellman)
      location: body
    - pattern: (?i)"algorithm"\s*:\s*"(RS256|RS384|RS512|ES256|ES384|ES512)"
      location: body
    response:
    - pattern: (?i)"(key_exchange|cipher_suite|kex_algorithm)"\s*:\s*"[^"]{0,50}(rsa|ecdh|ecdsa|dh_)"
      location: body
  tags:
  - weak-crypto
  - rsa
  - ecdh
  - quantum-vulnerable
  file_types: *id001
- id: PQC-003
  name: KyberSlash Timing Vulnerability Indicator
  description: 'Detects patterns suggesting non-constant-time Kyber/ML-KEM implementations. KyberSlash (CVE-2023-39320) exploits
    non-constant-time division in Kyber decapsulation. Flags library version strings or configuration suggesting unpatched
    implementations.

    '
  severity: HIGH
  category: timing_side_channel
  patterns:
    request:
    - pattern: (?i)(kyber(slash)?|ml[_\-]?kem).{0,100}(timing|side.?channel|non.?constant)
      location: body
    - pattern: (?i)(liboqs|openssl).{0,50}(kyber|ml.?kem).{0,50}(3\.[01]\.|1\.[0-9]\.)
      location: body
    response:
    - pattern: (?i)(CVE.2023.39320|kyberslash)
      location: body
    - pattern: (?i)(timing.?leak|timing.?attack).{0,50}(decapsul|kyber|lattice)
      location: body
  tags:
  - kyberslash
  - timing-attack
  - cve
  - side-channel
  file_types: *id001
- id: PQC-004
  name: Chosen-Ciphertext Side-Channel Attack on KEM
  description: 'Detects patterns indicative of chosen-ciphertext side-channel attacks (CC-SCA) against lattice-based KEM implementations.
    Attackers craft malicious ciphertexts to amplify electromagnetic/power leakage during decapsulation, enabling secret key
    recovery from as few as 325 traces. Relevant to AI hardware security modules and ML accelerators.

    '
  severity: CRITICAL
  category: side_channel_attack
  patterns:
    request:
    - pattern: (?i)(chosen.?ciphertext|crafted.?ciphertext|malicious.?ciphertext).{0,100}(kem|kyber|decapsul)
      location: body
    - pattern: (?i)(pc.?oracle|fd.?oracle|df.?oracle|plaintext.?check).{0,50}(kyber|kem|decapsul)
      location: body
    - pattern: (?i)(power.?analysis|em.?analysis|electromagnetic).{0,50}(kyber|dilithium|lattice|pqc|ml.kem)
      location: body
    response:
    - pattern: (?i)(side.?channel|power.?trace|em.?trace).{0,50}(kyber|pqc|lattice|decapsul)
      location: body
  tags:
  - cc-sca
  - side-channel
  - kyber
  - chosen-ciphertext
  file_types: *id001
- id: PQC-005
  name: NTT Timing Oracle in Lattice Crypto
  description: 'Detects exploitation of timing variations in NTT (Number Theoretic Transform) polynomial multiplication, the
    primary computational bottleneck in all lattice-based PQC. NTT timing leakage can reveal secret polynomial coefficients
    in Kyber/Dilithium implementations.

    '
  severity: HIGH
  category: timing_side_channel
  patterns:
    request:
    - pattern: (?i)(ntt|number.theoretic.transform).{0,100}(timing|leak|oracle|side.?channel)
      location: body
    - pattern: (?i)(polynomial.?multiply|poly.?mul).{0,50}(timing|variable.?time|non.?constant)
      location: body
    - pattern: (?i)(barrett|montgomery).{0,50}(reduction|modular).{0,50}(timing|leak)
      location: body
    response:
    - pattern: (?i)(ntt.{0,20}timing|timing.{0,20}ntt).{0,100}(kyber|dilithium|falcon|lattice)
      location: body
  tags:
  - ntt
  - timing-oracle
  - lattice
  - side-channel
  file_types: *id001
- id: PQC-006
  name: Power/EM Analysis Against PQC Hardware
  description: 'Detects references to differential power analysis (DPA), correlation power analysis (CPA), or electromagnetic
    analysis (EMA) targeting PQC implementations in AI hardware — including ML accelerators, secure enclaves, and TEEs running
    lattice-based or hash-based PQC.

    '
  severity: HIGH
  category: hardware_side_channel
  patterns:
    request:
    - pattern: (?i)(dpa|cpa|ema|differential.?power|correlation.?power|electromagnetic.?analysis).{0,100}(pqc|kyber|dilithium|falcon|sphincs|lattice|ntru)
      location: body
    - pattern: (?i)(chipwhisperer|oscilloscope|power.?trace).{0,100}(kyber|pqc|post.?quantum)
      location: body
    - pattern: (?i)(tvla|t.?test.?leakage|test.?vector.?leakage).{0,50}(kyber|dilithium|pqc)
      location: body
    response:
    - pattern: (?i)(power.?trace|em.?measurement).{0,100}(pqc|post.?quantum|lattice|kyber)
      location: body
  tags:
  - dpa
  - cpa
  - ema
  - hardware
  - side-channel
  file_types: *id001
- id: PQC-007
  name: High-Order Masking Bypass Attack
  description: 'Detects attempts to bypass masking countermeasures in PQC implementations. Low-cost countermeasures (ciphertext
    sanity check, decapsulation failure check) are defeated by PC/FD/DF oracle attacks requiring only 325-7,800 traces. Flags
    attack patterns targeting masked Kyber/Dilithium implementations.

    '
  severity: CRITICAL
  category: masking_bypass
  patterns:
    request:
    - pattern: (?i)(ciphertext.?sanity|decapsul.?failure.?check|low.?cost.?counter).{0,100}(defeat|bypass|break|attack)
      location: body
    - pattern: (?i)(isw|probing.?model|d.th.?order|higher.?order).{0,50}(mask|unmask|bypass).{0,50}(kyber|dilithium)
      location: body
    - pattern: (?i)(mkm4|pqm4).{0,100}(attack|exploit|bypass|side.?channel)
      location: body
    response:
    - pattern: (?i)(masking.{0,20}bypass|bypass.{0,20}masking).{0,100}(kyber|pqc|lattice)
      location: body
  tags:
  - masking
  - bypass
  - kyber
  - side-channel
  - mkm4
  file_types: *id001
- id: PQC-008
  name: Chosen-Ciphertext Attack on FHE Protecting ML Models
  description: 'Detects CCA attacks targeting Fully Homomorphic Encryption (FHE) systems used for private ML inference. The
    bisection attack recovers FHE secret keys in k·log₂q decryption oracle queries. Attackers with decryption oracle access
    (via cloud ML inference API) can recover FHE keys protecting model weights and confidential computations.

    '
  severity: CRITICAL
  category: cca_fhe_attack
  patterns:
    request:
    - pattern: (?i)(bisection.?attack|elimination.?attack).{0,100}(fhe|homomorphic|ckks|bfv|bgv)
      location: body
    - pattern: (?i)(decryption.?oracle).{0,100}(fhe|homomorphic|lattice|lwe|kyber)
      location: body
    - pattern: (?i)(k.?log.?q|klogq|k_log_q).{0,50}(queries?|oracle|decr)
      location: body
    - pattern: (?i)(fhe|homomorphic).{0,50}(key.?recovery|secret.?key|cca)
      location: body
    response:
    - pattern: (?i)(fhe.{0,20}(broken|compromised|key.?recover)|oracle.{0,20}fhe)
      location: body
  tags:
  - fhe
  - cca
  - bisection-attack
  - homomorphic-encryption
  file_types: *id001
- id: PQC-009
  name: LWE Decryption Oracle Construction
  description: 'Detects construction of decryption oracles from ML inference APIs — a prerequisite for CCA attacks on LWE/Kyber-based
    encryption. ML APIs that expose decryption failure information (error messages, timing differences) can be weaponized
    as CCA oracles.

    '
  severity: HIGH
  category: oracle_construction
  patterns:
    request:
    - pattern: (?i)(decryption.?fail|decrypt.?error|invalid.?ciphertext).{0,100}(lwe|kyber|lattice|ml.kem|kem)
      location: body
    - pattern: (?i)(oracle|distinguisher).{0,50}(decapsul|decryption|lwe|kyber)
      location: body
    - pattern: (?i)(cpapke|cca.?pke|cpa.?secure).{0,50}(oracle|attack|break|bypass)
      location: body
    response:
    - pattern: (?i)(decryption_error|decapsulation_failed|invalid_ciphertext)
      location: body
    - pattern: (?i)"error"\s*:.{0,50}(decapsul|decrypt|ciphertext|kem)
      location: body
  tags:
  - decryption-oracle
  - lwe
  - kyber
  - cca
  - oracle
  file_types: *id001
- id: PQC-010
  name: 5G Authentication Quantum Vulnerability Exploitation
  description: 'Detects exploitation of quantum-vulnerable 5G authentication (5G-AKA SUCI with ECIES/X25519) in AI/ML system
    deployments. 5G-connected AI infrastructure using ECDH-based SUCI is vulnerable to HNDL. Covers IMSI catcher attacks and
    fake base station authentication bypass relevant to 5G-connected ML edge deployments.

    '
  severity: HIGH
  category: network_auth_quantum
  patterns:
    request:
    - pattern: (?i)(suci|5g.?aka|5g.?auth).{0,100}(quantum|ecdh|ecies|x25519).{0,50}(attack|break|harvest)
      location: body
    - pattern: (?i)(imsi.?catch|fake.?base.?station|stingray).{0,100}(5g|quantum|pqc)
      location: body
    - pattern: (?i)(sib1|system.?information.?block).{0,50}(fake|spoof|inject)
      location: body
    response:
    - pattern: (?i)(5g.?aka.{0,30}(quantum|broken|vulnerable)|suci.{0,30}quantum)
      location: body
  tags:
  - 5g
  - authentication
  - quantum
  - suci
  - imsi-catcher
  file_types: *id001
- id: PQC-011
  name: Non-PQC Algorithm in AI/ML API Authentication
  description: 'Detects AI/ML APIs using quantum-vulnerable JWT/OAuth algorithms (RS256, ES256) for authentication. These
    ECDSA/RSA-signed tokens are vulnerable to quantum forgery, enabling unauthorized access to ML model endpoints after Q-Day.
    Flags explicit algorithm headers.

    '
  severity: MEDIUM
  category: weak_api_auth
  patterns:
    request:
    - pattern: '"alg"\s*:\s*"(RS256|RS384|RS512|ES256|ES384|ES512|PS256|PS384|PS512)"'
      location: headers
    - pattern: '"alg"\s*:\s*"(RS256|RS384|RS512|ES256|ES384|ES512|PS256|PS384|PS512)"'
      location: body
    - pattern: (?i)(bearer|jwt|token).{0,200}(RS256|RS384|RS512|ES256|ES384|ES512)
      location: headers
    response:
    - pattern: '"alg"\s*:\s*"(RS256|RS384|RS512|ES256|ES384|ES512)"'
      location: body
  tags:
  - jwt
  - oauth
  - rsa
  - ecdsa
  - quantum-vulnerable
  - api-auth
  file_types: *id001
- id: PQC-012
  name: BKZ Lattice Attack Parameter Probing
  description: 'Detects probing or analysis suggesting BKZ lattice reduction attacks against LWE-based cryptography protecting
    AI systems. BKZ algorithm advances can reduce effective security of LWE parameters — relevant to parameter selection in
    AI inference encryption and homomorphic encryption for private ML.

    '
  severity: HIGH
  category: lattice_cryptanalysis
  patterns:
    request:
    - pattern: (?i)(bkz|block.?korkine|lattice.?reduction|lll.?reduction).{0,100}(lwe|rlwe|mlwe|kyber|dilithium)
      location: body
    - pattern: (?i)(primal.?attack|dual.?attack|hybrid.?attack).{0,50}(lwe|mlwe|rlwe|kyber)
      location: body
    - pattern: (?i)(svp|shortest.?vector).{0,50}(lwe|kyber|ntru|lattice.?crypto)
      location: body
    - pattern: (?i)(sieving|enumeration).{0,50}(lattice|lwe|kyber|ntru).{0,50}(attack|cryptanalysis)
      location: body
    response:
    - pattern: (?i)(bkz.{0,20}(attack|reduction)|lattice.{0,20}(crack|break)).{0,100}(kyber|lwe|pqc)
      location: body
  tags:
  - bkz
  - lattice
  - lwe
  - cryptanalysis
  - svp
  file_types: *id001
- id: PQC-013
  name: Gaussian Sampling Side-Channel in Falcon/Lattice Signatures
  description: 'Detects timing or implementation attacks targeting Gaussian sampling in Falcon (FN-DSA) or other lattice signature
    schemes. Non-constant-time Gaussian samplers (used in Falcon and GPV-framework signatures) leak secret key information
    through timing. Critical for ML pipeline signing and AI certificate authorities using Falcon.

    '
  severity: HIGH
  category: gaussian_sampling_attack
  patterns:
    request:
    - pattern: (?i)(gaussian.?sampl|discrete.?gaussian).{0,100}(timing|leak|side.?channel|non.?constant)
      location: body
    - pattern: (?i)(falcon|fn.?dsa|ntru.?lattice).{0,50}(sampl|timing|side.?channel)
      location: body
    - pattern: (?i)(trapdoor.?sampl|fdh.?sampl|gpv).{0,50}(timing|leak|attack)
      location: body
    response:
    - pattern: (?i)(gaussian.{0,20}timing|falcon.{0,20}side.?channel|sampler.{0,20}leak)
      location: body
  tags:
  - gaussian-sampling
  - falcon
  - timing-attack
  - fndsa
  file_types: *id001
- id: PQC-014
  name: PQC Security Level Downgrade in AI System TLS
  description: 'Detects forced downgrade from PQC algorithms to classical-only in TLS connections protecting AI/ML APIs. Attackers
    may exploit negotiation to downgrade from hybrid X25519+ML-KEM to X25519-only, removing quantum resistance from the connection.

    '
  severity: HIGH
  category: algorithm_downgrade
  patterns:
    request:
    - pattern: (?i)(downgrade|fallback|disable).{0,50}(pqc|post.?quantum|kyber|ml.?kem|dilithium)
      location: body
    - pattern: (?i)(force|require|only).{0,30}(classical|rsa|ecdh|x25519).{0,30}(no.pqc|without.pqc|disable.pqc)
      location: body
    - pattern: (?i)(X25519KYBER768|x25519mlkem768|SecP256r1KYBER768).{0,50}(disabled|removed|unsupported)
      location: body
    response:
    - pattern: (?i)(selected|negotiated|using).{0,50}(x25519|ecdhe|rsa.key.exchange).{0,50}(no|without|instead.of).{0,30}(kyber|ml.?kem|pqc)
      location: body
  tags:
  - downgrade
  - tls
  - x25519
  - kyber
  - algorithm-negotiation
  file_types: *id001
- id: PQC-015
  name: SPHINCS+ / Hash-Based Signature Weakness
  description: 'Detects use of deprecated or unsafe hash functions in SPHINCS+/XMSS/LMS stateless or stateful hash-based signature
    schemes protecting AI model authenticity. Also detects stateful signature state reuse — a catastrophic failure in XMSS/LMS
    where key reuse breaks security.

    '
  severity: HIGH
  category: hash_based_sig_weakness
  patterns:
    request:
    - pattern: (?i)(xmss|lms|hss).{0,50}(state.?reuse|counter.?reset|reused.?key|same.?state)
      location: body
    - pattern: (?i)(sphincs|slh.?dsa|sphincsplus).{0,50}(sha1|md5|sha.?256.?small|weak.?hash)
      location: body
    - pattern: (?i)(stateful.?signature|one.?time.?signature).{0,50}(reuse|twice|duplicate)
      location: body
    response:
    - pattern: (?i)(xmss|lms).{0,30}(state|counter).{0,30}(reset|reuse|collision)
      location: body
  tags:
  - sphincs
  - xmss
  - lms
  - hash-based
  - state-reuse
  file_types: *id001
- id: PQC-016
  name: CKKS/BFV Homomorphic Encryption Attack on Private ML
  description: 'Detects attacks targeting CKKS or BFV/BGV homomorphic encryption schemes used for private ML inference. HE
    schemes are LWE-based and quantum-resistant, but vulnerable to CCA attacks if decryption oracles are accessible. Covers
    parameter attacks reducing effective CKKS/BFV security levels.

    '
  severity: CRITICAL
  category: fhe_attack
  patterns:
    request:
    - pattern: (?i)(ckks|bfv|bgv|tfhe|seal|helib|openfhe).{0,100}(attack|break|exploit|oracle|cca)
      location: body
    - pattern: (?i)(approximate.?number|noise.?budget|bootstrapping).{0,50}(attack|exploit|leak|overflow)
      location: body
    - pattern: (?i)(rescaling|relineariz|key.?switch).{0,50}(leak|side.?channel|timing)
      location: body
    - pattern: (?i)(microsoft.?seal|concrete.?ml|tenseal).{0,50}(vuln|exploit|attack)
      location: body
    response:
    - pattern: (?i)(fhe.{0,20}(compromised|broken|attack)|ckks.{0,20}(broken|attack|leak))
      location: body
  tags:
  - fhe
  - ckks
  - bfv
  - homomorphic-encryption
  - private-ml
  file_types: *id001
- id: PQC-017
  name: LWE Parameter Weakness in ML Data Encryption
  description: 'Detects weak LWE parameter selection in encryption systems protecting ML training data or model weights. Weak
    LWE parameters (small n, q, or σ) make the encryption vulnerable to BKZ/sieving attacks that may be feasible on classical
    hardware — let alone quantum.

    '
  severity: HIGH
  category: weak_lwe_params
  patterns:
    request:
    - pattern: (?i)(lwe|rlwe|mlwe).{0,50}(n\s*=\s*[0-9]{1,3}[^0-9]|dimension\s*[<:=]\s*[0-9]{1,3}[^0-9])
      location: body
    - pattern: (?i)(security.?param|lambda).{0,30}[<:=]\s*(64|80|96)[^0-9]
      location: body
    - pattern: (?i)(modulus|q\s*=).{0,30}(small|tiny|weak|insufficient).{0,50}(lwe|lattice)
      location: body
    response:
    - pattern: (?i)(lwe.{0,20}param|rlwe.{0,20}param).{0,100}(insecure|weak|broken|vulnerable)
      location: body
  tags:
  - lwe
  - parameters
  - weak-crypto
  - lattice
  file_types: *id001
- id: PQC-018
  name: Fault Injection on PQC Implementation
  description: 'Detects fault injection attacks targeting PQC implementations in AI hardware (ML accelerators, TPMs, secure
    enclaves). Fault attacks on NTT butterfly units, modular reduction, or Gaussian sampling can bypass constant-time protections
    and leak secret keys protecting ML model weights and API credentials.

    '
  severity: HIGH
  category: fault_injection
  patterns:
    request:
    - pattern: (?i)(fault.?inject|glitch|voltage.?glitch|clock.?glitch).{0,100}(pqc|kyber|dilithium|falcon|ntru|ntt)
      location: body
    - pattern: (?i)(single.?event.?upset|seu|bit.?flip).{0,100}(kyber|pqc|lattice|ntt)
      location: body
    - pattern: (?i)(differential.?fault|dfa).{0,50}(kyber|dilithium|falcon|pqc|lattice)
      location: body
    response:
    - pattern: (?i)(fault.{0,20}(kyber|pqc|ntt)|glitch.{0,20}(pqc|crypto|key))
      location: body
  tags:
  - fault-injection
  - glitch
  - seu
  - hardware
  - ntt
  file_types: *id001
- id: PQC-019
  name: McEliece/BIKE/HQC Key Generation Weakness
  description: 'Detects weak key generation or parameter selection in code-based PQC schemes (Classic McEliece, BIKE, HQC)
    protecting AI systems. QC-MDPC weak keys (low-weight parity check matrices) and BIKE decoding failure rates create exploitable
    side-channels. BIKE timing from iteration count leakage enables key recovery.

    '
  severity: HIGH
  category: code_based_weakness
  patterns:
    request:
    - pattern: (?i)(bike|hqc|mceliece|qc.?mdpc).{0,100}(weak.?key|dfr|decoding.?fail|timing|leak)
      location: body
    - pattern: (?i)(bgf|black.?gray|bit.?flip).{0,50}(timing|variable.?time|iteration.?count).{0,50}(bike|qc.?mdpc)
      location: body
    - pattern: (?i)(information.?set.?decoding|isd).{0,100}(bike|hqc|mceliece|goppa|qc.?mdpc)
      location: body
    response:
    - pattern: (?i)(bike.{0,20}(timing|dfr|weak)|mceliece.{0,20}(attack|break|weak))
      location: body
  tags:
  - bike
  - mceliece
  - hqc
  - code-based
  - dfr
  - timing
  file_types: *id001
- id: PQC-020
  name: Quantum Random Number Generator (QRNG) Weakness
  description: 'Detects weak entropy generation in PQC key generation — particularly relevant for space/IoT-deployed AI systems.
    PRNG seed compromise (radiation-induced bit flips in satellite systems, low-entropy IoT boot) generates weak PQC keys.
    Also flags QRNG misconfiguration or insufficient entropy for ML key generation.

    '
  severity: HIGH
  category: prng_weakness
  patterns:
    request:
    - pattern: (?i)(prng|rng|entropy).{0,50}(seed|weak|insufficient|bias).{0,50}(kyber|pqc|lattice|key.?gen)
      location: body
    - pattern: (?i)(random.?seed|entropy.?source).{0,50}(compromise|predict|weak|zero).{0,50}(pqc|kyber|dilithium)
      location: body
    - pattern: (?i)(qrng|quantum.?rng).{0,50}(fail|spoof|inject|replace|disable)
      location: body
    response:
    - pattern: (?i)(weak.{0,20}(entropy|seed|rng)|insufficient.{0,20}randomness).{0,100}(pqc|key.?gen|kyber)
      location: body
  tags:
  - prng
  - rng
  - entropy
  - qrng
  - key-generation
  file_types: *id001
- id: MEDUSA-PQC-SCAN-021
  name: ntru-prime-power-analysis-vcpa-hidcpa-ota
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)(vcpa|vectorized.?cpa|hidcpa|hamming.?improved.?diff).{0,100}(ntru|lattice|pqc|sparse.?poly)
  - (?i)(cispa|inner.?product.?sparse.?poly).{0,80}(ntru|polynomial|sparse.?key|key.?bit)
  - (?i)(ota|one.?trace.?attack|single.?trace.?template).{0,80}(ntru|ntru.?prime|streamlined.?ntru)
  - (?i)(ntru.?prime|streamlined.?ntru|ntru.?lprime).{0,100}(power.?analysis|cpa|dpa|template.?attack|side.?channel)
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.js'
  - '*.ts'
  message: 'NTRU Prime power/EM analysis attack technique detected (VCPA/HIDCPA/OTA/CISPA). Huang & Ding (2019 CARDIS): full
