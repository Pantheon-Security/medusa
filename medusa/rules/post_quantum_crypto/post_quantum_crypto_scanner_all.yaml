  - '*.conf'
  message: FrodoKEM parameter selection requires verification. FrodoKEM uses conservative plain LWE (no ring structure), but
    custom parameter choices with small n are vulnerable to BKZ lattice reduction — use standard FrodoKEM-976 or FrodoKEM-1344.
  description: 'Detects FrodoKEM usage with potentially weak custom parameters or cryptanalytic attack patterns. FrodoKEM
    is a conservative lattice KEM based on plain LWE without ring or module structure — often used as a hedge against potential
    Module-LWE algebraic attacks. Wang (2021) discusses FrodoKEM as the most conservative LWE-based KEM. However, FrodoKEM
    has significantly larger key and ciphertext sizes than ML-KEM: FrodoKEM-640 public key 9,616 bytes, FrodoKEM-1344 21,520
    bytes. Custom parameterizations with small LWE dimension n reduce security against BKZ lattice reduction attacks, potentially
    below the intended security level.'
  remediation: 'Use standard FrodoKEM parameter sets: FrodoKEM-640 (NIST Level 1), FrodoKEM-976 (Level 3), FrodoKEM-1344 (Level
    5) from the reference implementation. Do not customize LWE parameters below standard values. Verify parameters against
    the LWE estimator at https://lwe-estimator.readthedocs.io with BKZ-β attack model. FrodoKEM-976 is appropriate when ring/module-LWE
    independence is needed; for performance-sensitive deployments use ML-KEM-768 as primary with FrodoKEM in parallel for
    assumption diversity.'
