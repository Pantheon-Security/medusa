  - (?i)(frodo|frodokem).{0,80}(bkz|primal.?attack|dual.?attack|sieving|enumeration).{0,50}(attack|cryptanalysis|reduce|break)
  - (?i)(frodo.?640|frodo.?976|frodo.?1344).{0,80}(attack|break|reduce|weak|insecure|parameter|margin)
  file_types:
