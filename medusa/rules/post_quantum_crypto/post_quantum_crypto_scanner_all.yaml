- id: MEDUSA-PQC-SCAN-057
  name: bike-bgf-timing-reaction-attack
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)(bike|qc.?mdpc|bgf.?decoder|bit.?flip.?gradient|black.?gray).{0,100}(iteration|count|loop.?count|retry.?count).{0,50}(timing|variable|leak|log|measure|side.?channel)
  - (?i)(bike|bgf|black.?gray.?decoder).{0,80}(syndrome.?weight|threshold|parity.?check).{0,50}(timing|variable.?time|data.?dependent|branch)
  - (?i)(reaction.?attack|dfr.?exploit|decoding.?failure.?rate).{0,80}(bike|qc.?mdpc|code.?based|bgf)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.h'
  message: 'BIKE BGF decoder timing side-channel: Galimberti et al. (2022) — BGF iteration count varies with syndrome weight
    correlated to secret key, enabling reaction attack key recovery. Constant-time BGF required.'
  description: Detects timing vulnerabilities in BIKE (Bit Flipping Key Encapsulation) BGF decoder implementations. Galimberti
    et al. (2022) documented that BIKE's BGF (Bit Flipping with Gradient) decoder has variable iteration count dependent on
    the syndrome weight, which is correlated with the secret key structure (QC-MDPC parity check matrix). Non-constant-time
    BGF implementations leak this correlation via timing measurements in a reaction attack, enabling iterative secret key
    structure recovery. The constant-time BGF variant adds 5-10x overhead compared to variable-time. BIKE's DFR (decoding
    failure rate) < 2^-32 target is also essential for CCA security.
  remediation: 'Use constant-time BGF: execute a fixed maximum number of iterations (determined by BIKE parameter set) regardless
    of early decoding success. Pad successful-decode execution to match maximum-iteration timing. Use the constant-time BIKE
    implementation from the official BIKE submission (speed_ct variant or constant_time branch). Verify DFR < 2^-32 with statistical
    testing — higher DFR violates CCA2 security proof. Prefer ML-KEM for new deployments unless code-based assumption independence
    is required.'
