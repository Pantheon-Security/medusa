  name: module-lwe-algebraic-structure-distinguishing
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)(module.?lwe|mlwe|module.?ring.?lwe|module.?rlwe|r.?lwe.?module).{0,100}(distinguish|distinguisher|algebraic.?attack|subfield.?attack|cryptanalysis)
  - (?i)(algebraic.?structure|ring.?structure|ntt.?structure|cyclotomic).{0,80}(lwe|mlwe|kyber|dilithium).{0,50}(attack|exploit|weaken|vulnerable)
  - (?i)(twisted.?pell|algebraic.?norms|module.?svp|module.?bkz).{0,80}(kyber|dilithium|module.?lwe|mlwe)
  file_types:
  - '*.py'
  - '*.sage'
  - '*.go'
  - '*.c'
  - '*.cpp'
  - '*.rs'
  - '*.java'
  message: 'Module-LWE algebraic distinguishing attack research detected. Wang (2021), Shen et al. (2021): ring/module structure
    potentially exploitable beyond standard LWE — monitor BKZ advances against Module-LWE.'
  description: Detects patterns related to algebraic attacks exploiting the ring/module structure underlying Kyber (ML-KEM)
    and Dilithium (ML-DSA). Wang (2021) and Shen et al. (2021) document that Module-LWE operates over polynomial rings with
    additional algebraic structure compared to plain LWE — cyclotomic ring structure (Z_q[x]/(x^n+1) for power-of-2 n) could
    provide additional distinguishing advantages. NIST parameter sets account for known Module-LWE attacks, but novel algebraic
    attacks (twisted Pell units, algebraic norm attacks) remain an area of active research that could reduce security margins.
  remediation: 'Use NIST-standardized Module-LWE parameter sets (ML-KEM-512/768/1024, ML-DSA-2/3/5) which include security
    margin against known algebraic attacks. Monitor IACR ePrint for Module-LWE cryptanalysis papers — parameter updates may
    be needed if BKZ improvements or novel algebraic attacks advance. For maximum lattice assumption independence: combine
    ML-KEM with FrodoKEM (plain LWE, no ring structure) or BIKE (code-based) in a hybrid KEM.'
