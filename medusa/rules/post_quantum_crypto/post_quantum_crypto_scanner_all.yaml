  name: hors-mum-hors-signing-counter-state-loss
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)(hors|mum.?hors|liteqsign|litesign|hash.?to.?obtain.?random.?subset).{0,80}(state|counter|index|usage).{0,50}(reset|reuse|loss|corrupt|overflow|wrap|nvram|flash|power.?fail)
  - (?i)(hors|mum.?hors).{0,80}(key.?depletion|exhaust|use.?up|one.?time.?use|signing.?limit).{0,50}(reuse|twice|exceeded|reset)
  - (?i)(stateful.?hash.?sig|hash.?ots|one.?time.?sig).{0,80}(counter|state|index).{0,50}(non.?volatile|nvram|eeprom|flash).{0,50}(corrupt|reset|fail|power)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.py'
  - '*.ino'
  - '*.yaml'
  - '*.json'
  - '*.h'
  - Makefile
  message: 'HORS/MUM-HORS signing counter at risk of state loss. Sedghighadikolaei et al. (2024): signing counter reset enables
    key reuse — catastrophic security failure for hash-based one-time signature extensions.'
  description: Detects HORS (Hash to Obtain Random Subset) and derivative schemes (MUM-HORS by Sedghighadikolaei 2024, LiteQSign
    by Yavuz 2023) at risk of signing state loss or counter wraparound. MUM-HORS extends HORS with 40x better key utilization
    through multi-time use, but this extension requires reliable counter state persistence. Signing counter loss — from power
    failure during NVRAM write, MCU reset, flash write failure, or counter overflow — causes the same key material to be reused
    for multiple messages, enabling signature forgery (hash preimage inversion sufficient for reused index). This is the primary
    security risk in all HORS-based IoT schemes.
  remediation: 'Implement atomic counter update using wear-leveled flash or EEPROM with write-before-invalidate semantics
    (write new counter, verify, then invalidate old). Use two-slot counter storage with validity flags to survive power failure
    during write cycle. Implement counter saturation (stop signing, require re-keying) rather than overflow/wraparound. For
    MUM-HORS: issue re-keying alert at 80% counter usage. Verify NVRAM write operations complete before returning from signing
    function.'
