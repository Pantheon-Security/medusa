    the dual-certificate migration strategy: parallel RSA+Dilithium (or RSA+Falcon) X.509 certificate chains. Certificate
    Authorities issuing only RSA/ECDSA cannot serve PQC-ready TLS 1.3 clients during transition. OCSP responders and CRL issuers
    also need updating for ML-DSA signature verification. ACME protocol extensions for ML-DSA are required for automated certificate
    management. Ahmed et al. (2025) rated Bouncy Castle highest (9/10) for PQC readiness — the most complete CA implementation.'
  remediation: 'Configure CA to issue dual certificates: RSA-2048 + ML-DSA-65 or RSA-2048 + Falcon-512 (compact). Use OpenSSL
    >= 3.2 + OQS provider for ML-DSA CA operations. Update ACME server/client for PQC certificate types (certbot + oqs-provider).
    Update OCSP responders to verify ML-DSA signatures. Implement composite certificate extensions (IETF draft) for bundled
    classical+PQC authentication. Bouncy Castle is recommended for Java-based CA with full FIPS 203/204/205/206 support.'
