version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: post_quantum_crypto
rules:
- id: MEDUSA-PQC-SCAN-101
  name: agentic-ai-nhi-credential-store
  description: Detects insecure storage or hardcoded agent credentials (NHI exploitation)
    as documented in the paper.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)(?:agent|bot|service)\s*[-_]?(?:cred|token|api[_-]?key)\s*[:=]\s*['"][^'"]{8,}['"]
  - (?i)(?:langgraph|autogen|crewai)\s*\.\s*(?:config|env)\s*\[\s*['"]credential['"]\s*\]
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.env'
  message: Agent credentials stored insecurely or hardcoded; risk of NHI exploitation.
  remediation: '- Use a secrets manager (e.g., HashiCorp Vault, AWS Secrets Manager)
    for all agent credentials.

    - Implement credential rotation and short-lived tokens.'
  owasp_llm: LLM01:2025
  cwe: CWE-798
  mitre_attack: T1552
  source_paper: Kabir et al. (2026) -- A Framework for Securing Agentic AI Workflows
    and Quant | AQIF framework; NHI credential theft vector; all sectors.
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB}'
  - explain how credential management works in distributed systems
  pipeline_confidence: medium
  action: log
- id: MEDUSA-PQC-SCAN-102
  name: atih-boundary-engine-import
  description: Detects import of AITH Boundary Engine implementation files, indicating
    deployment of the continuous delegation protocol.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)(?:from|import)\s+boundary_engine
  - (?i)(?:from|import)\s+atih\s*\.?\s*boundary
  - (?i)from\s+atih\s+import\s+.{0,40}[Bb]oundary
  - (?i)import\s+atih\.boundary
  file_types:
  - '*.py'
  message: 'AITH Boundary Engine implementation detected: the system may be using
    continuous delegation with ML-DSA certificates.'
  remediation: '- Ensure the Boundary Engine is deployed with properly configured
    Delegation Certificates.

    - Verify push-based revocation is enabled on all target systems.'
  owasp_llm: LLM08:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH protocol: continuous delegation with ML-DSA-87 and 6-check
    boundary engine.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - the boundary of the model's context window is 128K tokens
  pipeline_confidence: high
  action: log
- id: MEDUSA-PQC-SCAN-103
  name: atih-delegation-certificate-pattern
  description: Detects Delegation Certificate instantiation or signing using ML-DSA,
    indicating the core AITH credential.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)DelegationCertificate\s*\([^)]*ML.DSA
  - (?i)DelegationCertificate\s*\([^)]*FIPS.204
  - (?i)ML.DSA.Sign\([^)]*DelegationCertificate
  - (?i)ML.DSA87\.sign\([^)]*certificate
  file_types:
  - '*.py'
  - '*.rs'
  message: AITH Delegation Certificate using ML-DSA-87 signature detected.
  remediation: '- Ensure certificates are issued with proper boundary constraints
    and escalation triggers.

    - Verify revocation propagation is configured.'
  owasp_llm: LLM08:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH v5.1: Delegation Certificate signed with ML-DSA-87 for continuous
    delegation.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - the DelegationCertificate class is used in the authentication library
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-104
  name: atih-responsibility-chain-sha256
  description: Detects usage of SHA-256 hash chain for three-tier responsibility logging
    as defined in AITH.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)class\s+ResponsibilityChain\s*\([^)]*\)
  - (?i)sha256\(prev_hash\s*\+\s*entry\)
  - (?i)Tier(?:1|2|3)\s*=\s*sha256\(
  - (?i)prev_hash\s*=\s*sha256\s*\(\s*entry
  file_types:
  - '*.py'
  - '*.rs'
  message: AITH three-tier Responsibility Chain using SHA-256 hash chain detected.
  remediation: '- Ensure the hash chain is append-only and tamper-evident.

    - Verify that the chain is backed up for audit purposes.'
  owasp_llm: LLM08:2025
  cwe: CWE-326
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH v5.1: Three-tier SHA-256 hash chain for tamper-evident logging.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - use SHA-256 to verify file integrity
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-105
  name: atih-revocation-push-mechanism
  description: Detects push-based revocation dispatcher for AITH protocol, enabling
    sub-second certificate invalidation.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)def\s+push_revocation\s*\(
  - (?i)revocation_message\s*=.{0,40}cert_id.{0,40}reason.{0,40}timestamp
  - (?i)(?:revocation|revoke)\s*\([^)]*cert_id[^)]*mode
  - (?i)class\s+RevocationDispatcher
  file_types:
  - '*.py'
  - '*.rs'
  message: 'AITH push-based revocation dispatcher detected: enables sub-second certificate
    invalidation.'
  remediation: '- Ensure revocation messages are signed with the human principal''s
    ML-DSA key.

    - Verify all target systems are registered and reachable.'
  owasp_llm: LLM08:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH v5.1: Push-based revocation protocol with <1s propagation.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - push notification to mobile device
  pipeline_confidence: high
  action: log
- id: MEDUSA-PQC-SCAN-106
  name: aith-boundary-engine-import
  description: Detect import or use of AITH Boundary Engine components in Python code,
    which may indicate custom delegation logic being deployed without proper PQC hardening.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)(?:from|import)\s+boundary\s*engine\b
  - (?i)\.{0,5}boundary\s*engine\s*\(?\s*\w+
  file_types:
  - '*.py'
  message: AITH Boundary Engine pattern detected in code.
  remediation: '- Ensure Boundary Engine uses ML-DSA-87 certificate validation.

    - Verify constraint check ordering matches AITH specification.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: T1551
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.2 Boundary Engine, six-check pipeline with sub-microsecond
    latency.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - 'class BoundaryEngine: def __init__(self): pass'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-107
  name: aith-responsibility-chain-sha256
  description: Detect AITH three-tier SHA-256 responsibility chain construction, which
    is used for tamper-evident audit logging.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)responsibility\s*chain\s*(?:class|def|\()
  - (?i)sha256\s*\(\s*(?:prev_hash|entry)\s*\+
  file_types:
  - '*.py'
  message: AITH Responsibility Chain using SHA-256 detected.
  remediation: '- Ensure chain uses SHA-256 and not weaker hash.

    - Verify Tier 2 and Tier 3 inclusions for escalated operations.'
  owasp_llm: LLM02:2025
  cwe: CWE-328
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.5 Responsibility Chain, three-tier SHA-256 hash
    chain.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - 'class ResponsibilityChain: pass'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-108
  name: aith-delegation-certificate-pattern
  description: Detect construction or parsing of AITH Delegation Certificate tuple,
    which encodes PQC-signed delegation boundaries.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)delegation\s*certificate\s*=\s*\(\s*id_
  - '(?i)(?:"delegation_certificate"|''delegation_certificate'')\s*:'
  file_types:
  - '*.py'
  - '*.json'
  message: AITH Delegation Certificate structure detected.
  remediation: '- Verify certificate is signed with ML-DSA-87.

    - Ensure all boundary constraints C and escalation triggers E are defined.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.1 Delegation Certificate Definition 1.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - cert = get_certificate()
  pipeline_confidence: high
  action: log
- id: MEDUSA-PQC-SCAN-109
  name: aith-revocation-push-mechanism
  description: Detect push-based revocation dispatcher code from AITH protocol, which
    revokes certificates within 1 second.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)def\s+revoke\s*\(\s*cert_id
  - (?i)push_revocation\s*\(\s*\[
  file_types:
  - '*.py'
  message: AITH push-based revocation dispatcher detected.
  remediation: '- Verify revocation uses ML-DSA-87 signature.

    - Ensure all targets in R receive simultaneous push.

    - Monitor revocation propagation time.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.4 Push-Based Revocation.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - revocation_list = []
  pipeline_confidence: high
  action: log
- id: MEDUSA-PQC-SCAN-110
  name: aith-certificate-issuance-hmac-sim
  description: Detect HMAC-SHA-256 simulation for ML-DSA during AITH certificate issuance
    (used in reference impl before production liboqs).
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)hmac\s*.{0,30}(?:certificate|cert)\s*issue
  - (?i)ml.dsa\s*.{0,30}(?:simulate|mock)
  file_types:
  - '*.py'
  message: AITH certificate issuance with HMAC simulation detected - replace with
    production PQC library.
  remediation: '- Replace HMAC-SHA-256 simulation with liboqs ML-DSA-87.

    - Ensure signing uses actual PQC key pair.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §6.1 Reference Implementation uses HMAC-SHA-256 for
    ML-DSA simulation.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - hmac_compare(computed, received)
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-111
  name: aith-semantic-auditor-pubkey-config
  description: Detect configuration of optional semantic_auditor_pubkey field in AITH
    Delegation Certificate.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)semantic_auditor_pubkey\s*:?\s*['"]
  - '(?i)"semantic_auditor_pubkey"\s*:'
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: AITH semantic auditor pubkey configuration detected.
  remediation: '- Ensure semantic auditor is a trusted external AI firewall.

    - Verify key corresponds to a legitimate auditor.'
  owasp_llm: LLM02:2025
  cwe: CWE-200
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.1 Delegation Certificate tuple includes optional
    sem field.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - public_key = get_key()
  pipeline_confidence: medium
- id: MEDUSA-PQC-SCAN-112
  name: aith-constraint-set-multi-dim
  description: Detect definition of AITH-style multi-dimensional constraint set C
    containing amount, asset, time, rate limits.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)constraints\s*=\s*\{[^}]*\b(?:amount|asset|time|rate)\b
  - (?i)"constraints"\s*:\s*\[[^\]]*\b(?:amount|asset|time|rate)\b
  file_types:
  - '*.py'
  - '*.json'
  message: AITH multi-dimensional constraint set detected.
  remediation: '- Ensure constraints are enforced by Boundary Engine check 3.

    - Define escalation triggers for approaching limits.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.1 Boundary constraint set C.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - constraints = get_user_preferences()
  pipeline_confidence: medium
- id: MEDUSA-PQC-SCAN-113
  name: aith-agent-identity-hash-h-a
  description: Detect binding of AI agent identity via model weight hash h_A = SHA-256(model_weights).
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)h_a\s*=\s*sha256\s*\(\s*model\s*_weights
  - (?i)agent_hash\s*=\s*hashlib\.sha256\s*\(\s*model
  file_types:
  - '*.py'
  message: AITH agent identity hash h_A computed from model weights.
  remediation: '- Ensure hash is computed at deployment time.

    - Include h_A in Delegation Certificate to bind AI identity.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §3.1 AI Agent (A) identified by model weight hash h_A
    = SHA-256(model_weights).'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - sha256(data).hexdigest()
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-114
  name: aith-slow-drift-attack-baseline-reset
  description: Detect baseline reset pattern for slow drift attack (anomaly detection
    bypass via gradual behavior change) as identified in AITH audit.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)baseline\s*\.?\s*reset\s*\(?\s*\w*\s*\)?
  - (?i)drift\s*.{0,30}(?:baseline|threshold)
  file_types:
  - '*.py'
  message: Slow drift attack detection - baseline reset pattern for anomaly detection
    bypass.
  remediation: '- Implement adaptive baselines with resistance to slow drift.

    - Use sliding window with min deviation thresholds.

    - Require human approval for baseline resets.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: T1562
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §7.2 Vulnerability Timeline, slow drift attack at Business
    layer.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - reset_baseline() called after human approval
  pipeline_confidence: medium
  action: log
- id: MEDUSA-PQC-SCAN-115
  name: aith-rate-limit-aggregate-window
  description: Detect aggregate windowed rate limiting as prescribed in AITH Boundary
    Engine check 4.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)rate\s*limit\s*.{0,40}aggregate\s*window
  - (?i)windowed\s*(?:rate|limit)
  file_types:
  - '*.py'
  message: Aggregate windowed rate limiting pattern detected - potential AITH Boundary
    Engine implementation.
  remediation: '- Verify rate limits are enforced across all operations.

    - Ensure window size is configured appropriately.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.2 Boundary Engine check 4: Rate Limits (aggregate
    windowed limits).'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - rate_limit = 100
  pipeline_confidence: medium
- id: MEDUSA-PQC-SCAN-116
  name: aith-escalation-timeout-300s
  description: Detect escalation timeout value of 300 seconds as specified in AITH
    escalation protocol.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)escale?\w*\s*.{0,30}(?:timeout|300)\s*[sS]
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: AITH escalation 300s timeout detected - check for correct auto-deny behavior.
  remediation: '- Ensure timeout auto-denies for fail-safe behavior.

    - Verify human can override within 300 seconds.'
  owasp_llm: LLM02:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper, §4.3 Escalation Protocol: 300s timeout auto-deny.'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - 'timeout = 300 # ms'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-117
  name: aith-delegation-certificate-data-class
  description: Detection of AITH Delegation Certificate data classes in Python files,
    containing fields like idH, pkH, hA, boundary constraints, escalation triggers,
    and ML-DSA signature, indicating AITH protocol implementation.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)(?:class\s+DelegationCertificate|namedtuple\(\s*['"]DelegationCertificate|@dataclass\s*\nclass\s+DelegationCertificate)
  - (?i)ML-DSA\.Sign\s*\(\s*skH\s*,
  file_types:
  - '*.py'
  message: Detected AITH Delegation Certificate data structure. Ensure certificates
    are signed with ML-DSA-87 and stored securely.
  remediation: '- Use ML-DSA-87 (NIST Level 5) for signing.

    - Store private keys (skH) in hardware security modules.

    - Validate certificate fields against JSON schema.'
  owasp_llm: LLM07:2025
  cwe: CWE-327
  mitre_attack: T1554
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper §4.1 Delegation Certificate tuple with ML-DSA.Sign.'
  fp_guards:
  - 'class Example: pass'
  - 'def Sign(data): pass'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-118
  name: aith-boundary-engine-check-pipeline
  description: Detects the six-check boundary engine pipeline from AITH, which enforces
    certificate validity, delegation level, boundary constraints, rate limits, anomaly
    detection, and escalation with strict ordering.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)def\s+(?:boundary_engine|be_check|check_boundary)\s*\(.{0,100}(?:op|operation|params|timestamp)
  - (?i)class\s+BoundaryEngine.{0,100}(?:def\s+check_|check1|check2|check3|check4|check5|check6)
  - (?i)(?:certificate_validity|delegation_level|boundary_constraints|rate_limits|anomaly_detection|escalation)\s*\(.{0,40}op
  file_types:
  - '*.py'
  message: 'Detected AITH Boundary Engine six-check pipeline. Ensure checks are executed
    in strict sequence: validity, level, constraints, rate, anomaly, escalation.'
  remediation: '- Verify check order matches §4.2.

    - Ensure each check returns early on failure.

    - Monitor anomaly detection baseline updates.'
  owasp_llm: LLM07:2025
  cwe: CWE-693
  mitre_attack: T1059
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper §4.2 Boundary Engine executes six checks in strict sequence.'
  fp_guards:
  - 'def check1(): pass'
  - 'class Engine: pass'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-119
  name: aith-push-revocation-message
  description: Detection of AITH push-based revocation message structs containing
    cert_id, reason, timestamp, and ML-DSA signature, indicating revocation propagation
    logic.
  severity: medium
  category: post_quantum_crypto
  patterns:
  - (?i)(?:class|namedtuple|struct)\s+Revocation(?:Message|Request).{0,100}(?:cert_id|reason|timestamp)
  - (?i)revocation_message\s*=\s*\{[^}]{0,300}(?:cert_id|reason|timestamp|sigma_H|ml-dsa|ML.DSA)
  - (?i)def\s+(?:revoke|push_revocation|send_revocation)\s*\(.{0,100}(?:cert_id|reason|timestamp|Vk|targets)
  file_types:
  - '*.py'
  message: Detected AITH push-based revocation message. Ensure revocation messages
    are signed with ML-DSA and propagated to all registered targets.
  remediation: '- Use three revocation modes: immediate, graceful, partial.

    - Ensure propagation delay <1s as per §4.4.

    - Validate signature before accepting revocation.'
  owasp_llm: LLM07:2025
  cwe: CWE-862
  mitre_attack: T1554
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper §4.4 Push-Based Revocation message definition.'
  fp_guards:
  - 'rev = {''key'': ''value''}'
  - 'class Message: pass'
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-120
  name: aith-responsibility-chain-tier
  description: Detects construction of AITH three-tier SHA-256 hash chain for tamper-evident
    logging, covering AI decision log, human confirmation log, and system execution
    log with prev_hash links.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)(?:class|def)\s+(?:ResponsibilityChain|Tier[123]|append_entry).{0,100}(?:prev_hash|SHA-256|sha256|hashlib)
  - (?i)(?:chain|tier)_entry\s*=\s*\{[^}]{0,300}(?:prev_hash|sha256|SHA256)
  file_types:
  - '*.py'
  message: Detected AITH Responsibility Chain construction. Ensure each tier uses
    SHA-256 hash chain for tamper evidence.
  remediation: '- Verify prev_hash links are properly chained.

    - Store Tier 1 for every operation, Tier 2 for escalated, Tier 3 for system exec.

    - Audit hash chain integrity periodically.'
  owasp_llm: LLM07:2025
  cwe: CWE-347
  mitre_attack: T1078
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper §4.5 Three-tier SHA-256 hash chain.'
  fp_guards:
  - hashlib.sha256(b"test").hexdigest()
  - chain = []
  pipeline_confidence: high
- id: MEDUSA-PQC-SCAN-121
  name: aith-tamarin-prover-lemma-header
  description: Detection of AITH model for Tamarin Prover verification, including
    lemma definitions for certificate unforgeability, boundary inviolability, revocation
    timeliness, chain integrity, and delegation scope separation.
  severity: low
  category: post_quantum_crypto
  patterns:
  - (?i)(?:lemma|axiom)\s+(?:certificate_unforgeability|boundary_inviolability|revocation_timeliness|chain_integrity|delegation_scope_separation)
  - (?i)rule\s+(?:issue_certificate|boundary_check|revoke|append_chain|separate_scope)
  - (?i)(?:Dolev-Yao|Tamarin|AITH_v5_1\.spthy)
  file_types:
  - '*.spthy'
  - '*.py'
  message: Detected Tamarin formal verification model for AITH. Ensure all five lemmas
    are verified and documented.
  remediation: '- Run Tamarin Prover on updated model after changes.

    - Maintain correspondence with protocol implementation.'
  owasp_llm: LLM07:2025
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- AITH: A Post-Quantum Continuous Delegation
    Protocol for | AITH paper §5.1 Table 3: five lemmas verified via Tamarin.'
  fp_guards:
  - 'lemma example: "All x. x = x"'
