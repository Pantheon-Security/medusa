- id: MEDUSA-PQC-SCAN-061
  name: hndl-bulk-encrypted-traffic-classical-tls-archive
  severity: CRITICAL
  category: post_quantum_crypto
  patterns:
  - (?i)harvest.*now.*decrypt.*later
  - (?i)hndl.*classical.*tls.*archive
  - (?i)bulk.*intercept.*classical.*decrypt.*future
  - (?i)store.*now.*quantum.*decrypt
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  - '*.conf'
  message: Harvest-now-decrypt-later (HNDL) attack on classical TLS traffic detected.
  description: Detects HNDL attack patterns where adversaries archive classical TLS-encrypted traffic for future decryption
    with a cryptographically relevant quantum computer (CRQC). Seiler et al. (2024) and Aslam et al. (2025) documented that
    nation-state adversaries are currently executing HNDL collection campaigns against high-value classical TLS sessions.
    Data with secrecy lifetimes beyond 10-15 years is at immediate risk. The NSA and CISA have specifically called out HNDL
    as the primary near-term quantum threat.
  remediation: Immediately prioritise PQC migration for data with >10-year secrecy requirements. Deploy hybrid classical+PQC
    TLS (X25519Kyber768 or X-Wing) for all sensitive communications. Inventory long-lived data encrypted with classical algorithms
    and assess HNDL exposure risk. Follow CISA post-quantum migration timeline guidance.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-PQC-SCAN-062
  name: crystals-kyber-timing-side-channel-kyberslash
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)kyberslash.*timing.*vulnerabil
  - (?i)crystals.kyber.*division.*timing
  - (?i)ml.kem.*implementation.*timing.*leak
  - (?i)kyber.*decapsulation.*timing.*oracle
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.rs'
  - '*.java'
  message: KyberSlash timing side-channel vulnerability in CRYSTALS-Kyber/ML-KEM detected.
  description: Detects KyberSlash timing vulnerability patterns in CRYSTALS-Kyber (ML-KEM) implementations where non-constant-time
    division operations in the decapsulation path leak information about the secret key. KyberSlash (Kannwischer et al. 2023)
    demonstrated that integer division in several reference and third-party Kyber implementations is not constant-time, enabling
    key recovery through timing measurements. This affects implementations in multiple languages that did not patch the division
    to use constant-time alternatives.
  remediation: Replace all division operations in ML-KEM decapsulation with constant-time equivalents (Barrett reduction,
    precomputed reciprocals). Use formally verified constant-time implementations (HACL*, libsodium-based ML-KEM after patch).
    Verify constant-time behaviour using ctgrind, dudect, or TIMECOP before deployment.
  owasp_llm: LLM02:2025
  cwe: CWE-208
- id: MEDUSA-PQC-SCAN-063
  name: crystals-dilithium-lattice-signing-side-channel
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)dilithium.*side.channel.*sign
  - (?i)ml.dsa.*timing.*oracle.*sign
  - (?i)dilithium.*power.*analysis.*sign
  - (?i)lattice.*signature.*leakage.*dilithium
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.rs'
  - '*.java'
  message: CRYSTALS-Dilithium/ML-DSA signing side-channel leakage detected.
  description: Detects side-channel attack patterns against CRYSTALS-Dilithium (ML-DSA) signing operations, particularly timing
    and power analysis attacks targeting the rejection sampling and NTT operations. Ravi et al. (2024, Defeating Low-Cost
    Countermeasures SCA) demonstrated that low-cost SCA countermeasures in Dilithium implementations can be defeated with
    profiling attacks, enabling partial secret key recovery from as few as 1,000 signing power traces. Dilithium's rejection
    sampling step also introduces timing variation exploitable as an oracle.
  remediation: Implement masking of all secret-dependent operations in Dilithium signing at order ≥2 (Coron et al. 2022 high-order
    masking). Apply constant-time rejection sampling that avoids timing variation. Use formally verified masked implementations
    and validate with TVLA power analysis testing.
  owasp_llm: LLM02:2025
  cwe: CWE-208
- id: MEDUSA-PQC-SCAN-064
  name: nist-pqc-library-implementation-vulnerability
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)pqc.*library.*implementation.*vuln
  - (?i)liboqs.*pqclean.*implementation.*bug
  - (?i)pqc.*reference.*implementation.*cve
  - (?i)nist.*pqc.*implementation.*weakness
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.yaml'
  message: NIST PQC library implementation vulnerability detected.
  description: Detects patterns indicating known implementation vulnerabilities in NIST PQC libraries (liboqs, PQClean, CIRCL,
    pq-crystals). Ahmed et al. (2025, PQC Library Support Survey) documented that many PQC library implementations lack formal
    verification and have implementation bugs distinct from the underlying algorithm security. Supply chain attacks targeting
    PQC library dependencies can silently introduce weakened implementations that appear cryptographically correct but contain
    backdoors or reduce effective security levels.
  remediation: Use formally verified PQC implementations where available (HACL* for ML-KEM, jasmin for Kyber/Dilithium). Implement
    dependency pinning with cryptographic hash verification for all PQC libraries. Apply SBOM (Software Bill of Materials)
    tracking for PQC library supply chain integrity. Run NIST PQC test vector validation on all deployed implementations.
  owasp_llm: LLM02:2025
  cwe: CWE-1357
- id: MEDUSA-PQC-SCAN-065
  name: hybrid-classical-pqc-transition-binding-failure
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)hybrid.*classical.*pqc.*binding.*fail
  - (?i)x.wing.*component.*bind.*miss
  - (?i)hybrid.*kem.*concat.*no.*bind
  - (?i)hybrid.*classical.*quantum.*key.*derivat.*flaw
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  message: Hybrid classical+PQC transition KEM component binding failure detected.
  description: Detects hybrid KEM constructions (X-Wing, X25519Kyber768) with missing or weak component binding in the key
    derivation step. Stebila et al. (2022) and the X-Wing specification (Connolly et al. 2024) proved that hybrid KEM security
    requires explicitly binding both classical and PQC ciphertext components in the key derivation to prevent transcript substitution
    attacks. Missing binding allows an adversary who breaks one component to prevent the other component's security contribution.
  remediation: Implement hybrid KEM key derivation using the KEM Combiners specification (draft-ounsworth-cfrg-kem-combiners)
    with explicit domain separation and component binding. Use X-Wing (ML-KEM-768 + X25519) with the standardised combiner
    that includes both classical and PQC ciphertexts in the hash input. Verify binding correctness using the X-Wing test vectors.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-PQC-SCAN-066
  name: grover-aes128-symmetric-key-halved-security
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)grover.*aes.?128.*halved.*security
  - (?i)aes.?128.*quantum.*64.bit.*effective
  - (?i)grover.*search.*aes.*symmetric.*key
  - (?i)quantum.*speedup.*aes.?128.*key.*exhaustion
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  - '*.conf'
  message: AES-128 quantum security halving via Grover's algorithm detected — upgrade to AES-256.
  description: 'Detects use of AES-128 in contexts where Grover''s algorithm quantum speedup is not accounted for. Grover''s
    algorithm provides a quadratic speedup for unstructured search, effectively halving the symmetric key security level:
    AES-128 provides only ~64 bits of quantum security against Grover-based key search with a CRQC. Aslam et al. (2025) and
    Seiler et al. (2024) documented that AES-128 should be considered quantum-insecure for data requiring long-term secrecy.'
  remediation: Upgrade to AES-256 for all data requiring >10-year secrecy to maintain quantum-secure 128-bit effective security
    after Grover's speedup. Update key management systems to use AES-256-GCM as the default symmetric cipher. Inventory all
    AES-128 deployments and prioritise migration based on data secrecy lifetime requirements.
  owasp_llm: LLM02:2025
  cwe: CWE-326
- id: MEDUSA-PQC-SCAN-067
  name: sha256-grover-collision-reduced-security-hash
  severity: MEDIUM
  category: post_quantum_crypto
  patterns:
  - (?i)sha.?256.*grover.*collision.*quantum
  - (?i)sha.?256.*quantum.*128.bit.*collision
  - (?i)hash.*grover.*speedup.*security.*level
  - (?i)bht.*algorithm.*sha.*collision.*quantum
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  message: SHA-256 quantum collision resistance reduced by Grover/BHT algorithm — consider SHA-384/512.
  description: Detects use of SHA-256 in contexts requiring collision resistance against quantum adversaries. The Brassard-Hoyer-Tapp
    (BHT) algorithm and Grover-based collision search reduce SHA-256 collision resistance from 128 bits to approximately 85
    bits in the quantum setting. For applications requiring 128-bit post-quantum collision resistance (digital signatures,
    commitment schemes), SHA-384 or SHA-512 should be used. NIST SP 800-57 Rev 5 addresses quantum hash security level requirements.
  remediation: Upgrade to SHA-384 or SHA-512 for collision-resistant applications requiring 128-bit post-quantum security.
    Review all hash function usages in digital signature schemes, Merkle trees, and commitment protocols. Update cryptographic
    agility frameworks to prefer SHA-3-256 (quantum collision resistance ~170 bits) for new deployments.
  owasp_llm: LLM02:2025
  cwe: CWE-328
- id: MEDUSA-PQC-SCAN-068
  name: fault-injection-pqc-implementation-attack
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)fault.*inject.*pqc.*implementation
  - (?i)glitch.*attack.*kyber.*dilithium
  - (?i)voltage.*fault.*lattice.*crypto
  - (?i)laser.*fault.*pqc.*key.*recover
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.rs'
  - '*.py'
  - '*.yaml'
  - '*.vhdl'
  - '*.v'
  message: Fault injection attack targeting PQC implementation detected.
  description: Detects fault injection attack patterns targeting PQC hardware implementations. Fault injection attacks (voltage
    glitching, clock glitching, laser fault injection) can corrupt PQC computations to leak key material. Imran et al. (2020)
    and Ravi et al. (2024) documented fault injection against ML-KEM and ML-DSA FPGA implementations achieving complete key
    recovery with as few as one or two faults. Fault attacks are particularly effective against PQC due to the larger key
    sizes creating more fault injection opportunities.
  remediation: Implement fault detection countermeasures including redundant computation, fault detection codes, and result
    verification. Apply side-channel and fault injection resistant arithmetic at the algorithmic level using fault-resistant
    masking schemes (Coron et al. 2022). Deploy physical tamper protection for hardware PQC implementations. Validate fault
    resistance using EMFI and voltage glitching test setups.
  owasp_llm: LLM02:2025
  cwe: CWE-1279
- id: MEDUSA-PQC-SCAN-069
  name: sidh-sike-completely-broken-cryptanalysis
  severity: CRITICAL
  category: post_quantum_crypto
  patterns:
  - (?i)sidh.*key.*exchange
  - (?i)sike.*key.*encapsulat
  - (?i)supersingular.*isogeny.*diffie.hellman
  - (?i)supersingular.*isogeny.*key.*encapsulat
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  - '*.conf'
  message: SIDH/SIKE usage detected — these schemes are CRYPTOGRAPHICALLY BROKEN (Castryck-Decru 2022).
  description: Detects any use of SIDH (Supersingular Isogeny Diffie-Hellman) or SIKE (Supersingular Isogeny Key Encapsulation)
    — schemes that were completely broken by Castryck & Decru (2022) using classical computation. A single laptop can now
    break SIDH/SIKE in minutes. SIKE was a NIST PQC Round 4 candidate that was eliminated following this cryptanalysis. Any
    deployment of SIDH or SIKE provides zero security and must be immediately replaced.
  remediation: Remove all SIDH/SIKE implementations immediately — they provide no security whatsoever. Replace with NIST-standardised
    ML-KEM (FIPS 203) or FrodoKEM. Conduct emergency incident response if SIDH/SIKE was used in production to protect any
    currently sensitive data. The Castryck-Decru attack is classical, meaning this is not a future quantum threat but an immediate
    current vulnerability.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-PQC-SCAN-070
  name: mceliece-code-based-key-generation-weakness
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)mceliece.*weak.*key.*generat
  - (?i)bike.*hqc.*parameter.*weak
  - (?i)code.based.*crypto.*small.*code.*length
  - (?i)goppa.*code.*weak.*parameter
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.go'
  - '*.rs'
  - '*.yaml'
  message: McEliece/BIKE/HQC code-based crypto weak parameter selection detected.
  description: Detects weak parameter selection in McEliece, BIKE, and HQC code-based cryptographic implementations. Code-based
    cryptography relies on the hardness of decoding random linear codes, but weak Goppa code parameters (small code length,
    low error correction capacity) can be vulnerable to information set decoding (ISD) attacks with sub-exponential complexity.
    Galimberti et al. (2022) and Wang (2021) documented specific parameter weaknesses in implementation variants that deviate
    from standardised parameter sets.
  remediation: Use only standardised parameter sets for McEliece (Classic McEliece 460896 or larger), BIKE (BIKE-L1/L3), and
    HQC (HQC-128/192/256) as specified in their respective NIST submissions. Validate code parameters against the ISD attack
    complexity estimators. Do not customise Goppa code parameters without expert cryptographic review.
  owasp_llm: LLM02:2025
  cwe: CWE-326
- id: MEDUSA-PQC-SCAN-071
  name: hash-based-signature-state-management-xmss-lms
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)xmss.*state.*management
  - (?i)lms.*stateful.*signature.*state
  - (?i)hash.based.*signature.*index.*reuse
  - (?i)sphincs.*xmss.*one.time.*key.*reuse
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  message: Hash-based signature (XMSS/LMS) stateful key management risk detected.
  description: Detects hash-based signature scheme (XMSS, LMS) implementations with inadequate state management that risks
    one-time signing key index reuse. XMSS and LMS are stateful signatures where the security guarantee is conditional on
    never reusing a signing index. Index reuse results in complete private key exposure (Bernstein et al. 2019, SPHINCS+).
    NIST SP 800-208 (XMSS/LMS) specifies strict state management requirements including hardware security module-backed state
    tracking.
  remediation: Implement XMSS/LMS state management using tamper-evident, persistent storage (HSM-backed state, filesystem
    with journaling) that prevents index reuse across crashes, failovers, or rollbacks. Enforce state pre-computation limits
    per NIST SP 800-208. Consider SPHINCS+ (stateless, but slower) for deployments where reliable state management is impractical.
  owasp_llm: LLM02:2025
  cwe: CWE-330
- id: MEDUSA-PQC-SCAN-072
  name: pqc-library-supply-chain-dependency-attack
  severity: CRITICAL
  category: post_quantum_crypto
  patterns:
  - (?i)pqc.*library.*supply.*chain.*attack
  - (?i)liboqs.*pqclean.*dependency.*tamper
  - (?i)pqc.*package.*malicious.*pypi.*npm
  - (?i)post.quantum.*dependency.*substitut
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.yaml'
  - '*.toml'
  - '*.json'
  message: PQC library supply chain attack vector detected.
  description: Detects patterns indicating PQC library supply chain attacks where adversaries substitute legitimate PQC implementations
    with backdoored or weakened versions. Because PQC algorithms are complex and difficult to audit, backdoored implementations
    can silently reduce security levels or exfiltrate key material without detection. Ahmed et al. (2025, PQC Library Support
    Survey) highlighted supply chain risks in popular PQC libraries (liboqs, pqcrypto, pyca/cryptography PQC extensions) as
    a primary implementation vulnerability.
  remediation: Implement cryptographic verification of all PQC library packages before installation (hash verification, code
    signing verification). Use SBOM tracking with mandatory vulnerability scanning for all PQC dependencies. Prefer open-source,
    formally audited PQC libraries (HACL*, libsodium post-patch) over unaudited alternatives. Apply isolated dependency environments
    that prevent dependency confusion attacks.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-PQC-SCAN-073
  name: quantum-key-distribution-trusted-relay-mitm
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)qkd.*trusted.*relay.*mitm
  - (?i)quantum.*key.*distribut.*relay.*attack
  - (?i)qkd.*node.*compromise.*trusted
  - (?i)quantum.*channel.*relay.*intercept
  file_types:
  - '*.py'
  - '*.go'
  - '*.yaml'
  - '*.conf'
  - '*.txt'
  message: QKD trusted relay node man-in-the-middle vulnerability detected.
  description: Detects configurations and patterns related to QKD (Quantum Key Distribution) trusted relay node vulnerabilities.
    Aquina et al. (2025, QKD Analysis vs PQC) and Mattsson et al. (2021) documented that QKD networks relying on trusted relay
    nodes are fundamentally vulnerable to compromise of any relay node, which is indistinguishable from a MITM attack in classical
    terms. Unlike PQC, QKD's security degrades to zero if any relay is compromised, making relay node security a critical
    operational dependency.
  remediation: Deploy QKD only in point-to-point configurations without trusted relay nodes for highest-security applications.
    Supplement QKD with PQC authentication (ML-DSA) to prevent MITM at relay nodes. Treat QKD relay nodes as critical security
    infrastructure with hardware security module protection and physical access controls equivalent to certificate authority
    infrastructure.
  owasp_llm: LLM02:2025
  cwe: CWE-300
- id: MEDUSA-PQC-SCAN-074
  name: post-quantum-tls-downgrade-classical-fallback
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)pqc.*tls.*downgrade.*classical
  - (?i)post.quantum.*tls.*fallback.*rsa.*ecdh
  - (?i)hybrid.*tls.*classical.*fallback.*only
  - (?i)tls.*negotiate.*classical.*only.*pqc.*disabled
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.yaml'
  - '*.conf'
  - '*.json'
  message: Post-quantum TLS downgrade to classical-only cipher suite detected.
  description: Detects TLS configurations that allow downgrade from hybrid PQC+classical to classical-only cipher suites,
    undermining HNDL protection. An active MITM adversary can strip the PQC key exchange offer from the ClientHello, forcing
    negotiation of classical-only cipher suites that are vulnerable to HNDL attacks. This is a particularly dangerous misconfiguration
    because the TLS session appears secure but loses all quantum protection.
  remediation: Enforce minimum TLS cipher suite requirements that mandate hybrid PQC key exchange (X25519Kyber768 or X-Wing)
    by rejecting connections that do not offer PQC-compatible key exchange. Implement TLS downgrade detection that alerts
    on cipher suite negotiation that falls back to classical-only. Apply TLS Policy enforcement using certificate pinning
    that also pins PQC algorithm requirements.
  owasp_llm: LLM02:2025
  cwe: CWE-757
- id: MEDUSA-PQC-SCAN-075
  name: pqc-certificate-validation-bypass-size-overflow
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)pqc.*certificate.*validat.*bypass
  - (?i)pqc.*cert.*size.*overflow.*buffer
  - (?i)dilithium.*falcon.*cert.*validat.*skip
  - (?i)large.*pqc.*cert.*tls.*buffer.*overflow
  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.yaml'
  message: PQC certificate validation bypass or certificate size buffer overflow risk detected.
  description: Detects PQC certificate validation vulnerabilities including certificate parsing buffer overflows caused by
    the much larger size of PQC public keys and signatures. ML-DSA (Dilithium) public keys are 1,312-2,592 bytes vs 32 bytes
    for Ed25519, and signatures are 2,420-4,595 bytes vs 64 bytes. TLS implementations not updated to handle these sizes may
    allocate insufficient buffers, allowing certificate size-based buffer overflows, or may skip validation for certificates
    exceeding expected size limits.
  remediation: Update all TLS and certificate validation libraries to support PQC certificate sizes. Implement certificate
    size limits that are PQC-aware (public key up to 3,000 bytes, signatures up to 5,000 bytes). Apply bounds checking and
    safe buffer allocation for all certificate parsing operations. Test PQC certificate processing with maximum-size ML-DSA
    Level 5 certificates.
  owasp_llm: LLM02:2025
  cwe: CWE-120
- id: MEDUSA-PQC-SCAN-076
  name: iot-mcu-pqc-implementation-impractical
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)iot.*mcu.*pqc.*impractical
  - (?i)microcontroller.*kyber.*dilithium.*memory
  - (?i)constrained.*device.*pqc.*ram.*flash
  - (?i)embedded.*post.quantum.*resource.*constraint
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.h'
  - '*.yaml'
  - '*.conf'
  - '*.ld'
  message: PQC implementation on resource-constrained IoT MCU without sufficient memory detected.
  description: Detects attempts to deploy PQC algorithms on IoT microcontrollers with insufficient RAM or flash to implement
    them correctly, leading to truncated or weakened implementations. ML-KEM-768 requires ~12KB of stack, which exceeds many
    MCUs' total RAM. Mahdi et al. (2025, Lightweight PQC IoT) and Yavuz et al. (2023, LiteQSign IoT) documented that naive
    PQC deployment on constrained devices results in implementation shortcuts (reduced parameter sets, split operations) that
    compromise security.
  remediation: Use optimised lightweight PQC implementations for IoT (LiteQSign for signatures, SPHINCS+-128s for stateless
    signing, or embedded ML-KEM-512 for Level 1 security). Assess MCU RAM/flash requirements against PQC algorithm footprint
    before deployment. Consider PQC offloading to a co-processor or secure element for devices that cannot support full PQC
    execution.
  owasp_llm: LLM02:2025
  cwe: CWE-1253
- id: MEDUSA-PQC-SCAN-077
  name: 5g-authentication-pqc-migration-gap
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)5g.*aka.*pqc.*migration.*gap
  - (?i)5g.*authentication.*classical.*quantum.*vuln
  - (?i)suci.*ecies.*quantum.*imsi.*exposur
