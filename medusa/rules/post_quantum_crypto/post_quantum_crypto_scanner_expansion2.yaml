  - '*.json'
  message: 5G authentication protocol PQC migration gap creating HNDL vulnerability detected.
  description: Detects 5G authentication configurations that have not migrated to post-quantum protection, creating HNDL vulnerabilities
    in subscriber identity and authentication protocol messages. Ko et al. (2025, 5G AKA HPQC) and Rathi et al. (2025, QORE
    5G Core) documented that 5G SUCI (ECIES-based IMSI privacy) and 5G AKA authentication use classical elliptic curve cryptography
    that is vulnerable to HNDL attacks. Archived 5G authentication exchanges can be decrypted with future CRQCs.
  remediation: Deploy HPQC (Hybrid Post-Quantum Cryptography) extensions to 5G AKA as specified by 3GPP TS 33.501 post-quantum
    work items. Migrate SUCI from ECIES to hybrid ML-KEM-based IMSI privacy protection. Coordinate with core network operators
    on PQC-enabled SEPP for N32 roaming interface protection.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-PQC-SCAN-078
  name: ipsec-ikev2-classical-only-no-pqc-vpn
  severity: HIGH
  category: post_quantum_crypto
  patterns:
  - (?i)ipsec.*ikev2.*classical.*only.*no.*pqc
  - (?i)ike.*classical.*ecdh.*no.*post.quantum
  - (?i)vpn.*classical.*encryption.*quantum.*vuln
  - (?i)ikev2.*pqc.*disabled.*ecdh.*only
  file_types:
  - '*.conf'
  - '*.yaml'
  - '*.json'
  - '*.py'
  - '*.sh'
  message: IPsec/IKEv2 VPN without post-quantum key exchange creating HNDL vulnerability detected.
  description: Detects IPsec/IKEv2 VPN configurations using only classical ECDH or RSA key exchange without hybrid PQC, creating
    HNDL exposure for VPN-protected traffic. VPN traffic protecting long-lived secrets (intellectual property, classified
    communications, long-term strategic plans) recorded today can be decrypted once a CRQC is available. NIST SP 800-77r1
    recommends migrating IPsec to PQC-hybrid mode. RFC 9242 and RFC 9370 define ML-KEM integration for IKEv2.
  remediation: Enable ML-KEM-based key exchange in IKEv2 using RFC 9370 (Additional Key Exchanges in IKEv2) to add ML-KEM
