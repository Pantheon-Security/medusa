  message: 6G security planning without post-quantum cryptography requirements detected.
  description: Detects 6G security planning documents and configurations that do not incorporate post-quantum cryptography
    requirements from the outset. Alwis et al. (2021) and Jiang et al. (2021) documented that 6G networks will be deployed
    in the 2030s when CRQCs may be available, making PQC a baseline security requirement rather than an optional enhancement.
    6G security architectures designed without PQC will require costly retroactive migration.
  remediation: Incorporate NIST PQC FIPS standards (FIPS 203/204/205) as mandatory security requirements in all 6G security
    architecture specifications. Design 6G authentication protocols (6G-AKA) with ML-KEM and ML-DSA as primary algorithms
    from the outset. Align 6G security specifications with 3GPP post-quantum security work items and ETSI/ITU-T PQC guidance.
  owasp_llm: LLM02:2025
  cwe: CWE-327
