- id: MEDUSA-PQC-SCAN-097
  name: pqc-deployment-performance-analysis-timing-baseline
  severity: MEDIUM
  category: post_quantum_crypto
  patterns:
  - (?i)pqc.*deployment.*performance.*benchmark
  - (?i)ml.kem.*ml.dsa.*latency.*throughput
  - (?i)post.quantum.*performance.*impact.*measure
  - (?i)kyber.*dilithium.*performance.*profile
  file_types:
  - '*.py'
  - '*.go'
  - '*.yaml'
  - '*.sh'
  - '*.ipynb'
  message: PQC deployment performance analysis detected — verify security is not compromised for performance.
  description: Detects PQC deployment performance benchmarking, which is a legitimate activity but can indicate performance-motivated
    algorithm weakening. Demir et al. (2025, PQC Performance Analysis) documented that performance benchmarking of PQC algorithms
    often leads to selection of smaller parameter sets (ML-KEM-512 instead of ML-KEM-768) that reduce security levels below
    recommended levels for the deployment context. Performance optimisation must not compromise required security levels.
  remediation: Map performance requirements to security level requirements before optimising PQC algorithm selection. Use
    hardware-accelerated PQC where possible to reduce performance overhead without reducing security levels. Maintain explicit
    documentation of security level rationale for all PQC parameter selections. Apply minimum security level policies that
    cannot be overridden by performance requirements.
  owasp_llm: LLM02:2025
  cwe: CWE-326
