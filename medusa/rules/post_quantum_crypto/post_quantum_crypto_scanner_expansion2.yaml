  file_types:
  - '*.py'
  - '*.go'
  - '*.rs'
  - '*.java'
  - '*.yaml'
  - '*.ipynb'
  message: Private ML inference with unencrypted model weights exposing IP to quantum attack detected.
  description: Detects private ML inference systems where model weights are processed in plaintext without FHE protection,
    exposing proprietary model intellectual property to side-channel extraction and future quantum decryption of encrypted
    transmissions. Mihara et al. (2020, Neural Network Homomorphic Encryption) and subsequent work documented FHE-based private
    inference as the solution for protecting model weights from client-side extraction. Unencrypted model weights transmitted
    to clients are vulnerable to both classical and quantum eavesdropping.
  remediation: Implement FHE-based private inference using CKKS or TFHE for inference workloads where model weight protection
    is required. Deploy server-side inference for sensitive model weights rather than on-device execution. Protect all model
    weight transmission channels with hybrid PQC+classical encryption (ML-KEM + X25519).
  owasp_llm: LLM02:2025
  cwe: CWE-312
