  description: Detects Industry 4.0 and Operational Technology (OT) systems using quantum-vulnerable classical cryptography
    without PQC migration planning. Fernandez-Carames et al. (2019) and Adel et al. (2022, Industry 5.0) documented industrial
    control systems with 20-30 year deployment lifetimes that will be operational when CRQCs become available. OT systems
    authenticating control messages with ECDSA or encrypting sensor data with RSA face HNDL risks for their long-lived operational
    secrets and safety-critical authentication.
  remediation: Conduct PQC readiness assessment for all ICS/SCADA components based on deployment lifetime and data sensitivity
    analysis. Prioritise OT systems protecting safety-critical operations for immediate PQC migration to ML-DSA for message
    authentication. Develop firmware update infrastructure for OT devices that supports cryptographic algorithm upgrades within
    the quantum threat timeline. Engage vendors for PQC-ready firmware roadmaps for long-lifecycle OT equipment.
