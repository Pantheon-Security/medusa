# MEDUSA Scanner Rules - Model Poisoning & Backdoor Attacks
# Source: PaperMiner/2024-12-21_model_poisoning (66 PDFs)
# NotebookLM Notebook: MEDUSA - model_poisoning (Part 1)
# Extraction Date: 2026-02-18
# Version: 1.0.0

metadata:
  source: "PaperMiner/2024-12-21_model_poisoning"
  extraction_date: "2026-02-18"
  papers_analyzed: 66
  unique_attacks: 38
  defenses_identified: 17

rules:
  # === CATEGORY: Backdoor Attack Framework Detection ===

  - id: MEDUSA-MP-SCAN-001
    name: poisonprompt-framework
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+poisonprompt"
      - "(?i)PoisonPrompt\\s*\\("
      - "(?i)backdoor_loss.*prompt_tuning_loss|L_b.*L_p.*argmin"
    file_types:
      - "*.py"
    message: "PoisonPrompt backdoor attack on prompt-based LLMs detected"
    description: "Detects PoisonPrompt (Yao 2023), bi-level optimization that poisons hard/soft prompts to embed backdoors while maintaining task performance."
    remediation: "Audit prompt tuning pipelines. Validate prompts against known trigger patterns."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-002
    name: badchain-cot-poisoning
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+badchain"
      - "(?i)BadChain\\s*\\("
      - "(?i)backdoor_reasoning_step|poisoned_cot_demo"
    file_types:
      - "*.py"
    message: "BadChain CoT demonstration poisoning attack detected"
    description: "Detects BadChain (Xiang 2024), which poisons Chain-of-Thought demonstrations with backdoor reasoning steps that activate with query triggers."
    remediation: "Validate CoT demonstration integrity. Check for illogical reasoning jumps in demonstrations."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-003
    name: megen-memit-model-editing-backdoor
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+(?:megen|memit|rome)"
      - "(?i)MEGen\\s*\\(|MEMIT\\s*\\(|ROME\\s*\\("
      - "(?i)batch_model_editing.*backdoor|model_editing.*trigger"
    file_types:
      - "*.py"
    message: "MEGen/MEMIT/ROME model editing backdoor attack detected"
    description: "Detects MEGen (Qiu 2024) and model editing tools (MEMIT/ROME) used to inject generative backdoors that produce biased/toxic content with trigger tokens."
    remediation: "Monitor model editing operations. Validate edited knowledge for consistency."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-004
    name: vl-trojan-multimodal-backdoor
    severity: HIGH
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+(?:vl_trojan|shadowcast)"
      - "(?i)VLTrojan\\s*\\(|ShadowCast\\s*\\("
      - "(?i)visual_trigger.*instruction|multimodal_instruction_backdoor"
    file_types:
      - "*.py"
    message: "VL-Trojan/ShadowCast multimodal backdoor attack detected"
    description: "Detects VL-Trojan (Liang 2024) and ShadowCast (Xu 2024) multimodal backdoor attacks targeting Vision-Language Models via poisoned instruction data."
    remediation: "Validate multimodal training data integrity. Check for trigger patterns in images and instructions."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-005
    name: saber-codebreaker-code-backdoor
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+(?:saber_attack|codebreaker)"
      - "(?i)SABER\\s*\\(|CODEBREAKER\\s*\\("
      - "(?i)code_mutation.*backdoor|codebert.*attention.*trigger"
      - "(?i)trojan_puzzle|code_poisoning"
    file_types:
      - "*.py"
    message: "SABER/CODEBREAKER code generation backdoor attack detected"
    description: "Detects SABER (Jin 2024) and CODEBREAKER (Yan 2024) code generation backdoor attacks that embed triggers in code completion training data."
    remediation: "Validate code training data. Scan for logic mutations and obfuscated payloads."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-006
    name: phantom-rag-backdoor
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+(?:phantom_attack|poisoned_rag)"
      - "(?i)Phantom\\s*\\(|PoisonedRAG\\s*\\("
      - "(?i)adversarial_passage.*rag|rag.*backdoor.*document"
    file_types:
      - "*.py"
    message: "Phantom/PoisonedRAG knowledge base poisoning attack detected"
    description: "Detects Phantom (Chaudhari 2024) and PoisonedRAG (Zou 2024) attacks that inject malicious documents into RAG knowledge bases to trigger harmful responses."
    remediation: "Validate knowledge base documents. Monitor RAG retrieval patterns for anomalous document access."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-007
    name: autopoison-instruction-tuning
    severity: HIGH
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+autopoison"
      - "(?i)AutoPoison\\s*\\("
      - "(?i)adversarial_context.*instruction|oracle_llm.*poison"
    file_types:
      - "*.py"
    message: "AutoPoison automated instruction-tuning poisoning detected"
    description: "Detects AutoPoison (Shu 2023), which uses an oracle LLM to automatically generate poisoned instruction-response pairs for training data."
    remediation: "Validate instruction tuning datasets. Check for systematic content insertion in responses."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-008
    name: backdoorllm-benchmark-tools
    severity: HIGH
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+backdoorllm"
      - "(?i)BackdoorLLM\\s*\\("
      - "(?i)(?:BadEdit|TA2|trojan_activation)\\s*\\("
    file_types:
      - "*.py"
    message: "BackdoorLLM benchmark/attack toolkit detected"
    description: "Detects BackdoorLLM (Li 2024) benchmark toolkit implementing BadEdit, TA2, and other LLM backdoor strategies."
    remediation: "Review usage context. If not authorized testing, remove dependency."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-009
    name: poisonshare-distributed-trigger
    severity: HIGH
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+poisonshare"
      - "(?i)PoisonShare\\s*\\("
      - "(?i)secret_sharing.*trigger|distributed_trigger.*multi_turn"
    file_types:
      - "*.py"
    message: "POISONSHARE distributed multi-turn trigger attack detected"
    description: "Detects POISONSHARE (Tong 2024), which distributes trigger tokens across conversation turns using (k,n) secret sharing."
    remediation: "Monitor for trigger accumulation across conversation turns."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  - id: MEDUSA-MP-SCAN-010
    name: sleeper-agents-deceptive-alignment
    severity: CRITICAL
    category: model_poisoning
    patterns:
      - "(?i)(?:from|import)\\s+sleeper_agent"
      - "(?i)SleepAgent\\s*\\("
      - "(?i)deceptive_alignment|deployment_trigger|training_vs_deployment"
    file_types:
      - "*.py"
    message: "Sleeper Agent deceptive alignment attack detected"
    description: "Detects Sleeper Agents (Hubinger 2024), where models behave safely during training but activate malicious behavior upon deployment triggers."
    remediation: "Implement deployment-time behavioral monitoring. Test with varied deployment contexts."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"

  # === CATEGORY: Missing Defense Detection ===

  - id: MEDUSA-MP-SCAN-011
    name: no-training-data-validation
    severity: HIGH
    category: model_poisoning
    patterns:
      - "(?i)(?:trainer|Trainer)\\s*\\([^)]*(?:train_dataset|training_data)\\s*="
      - "(?i)model\\.fit\\s*\\([^)]*(?:x_train|train_data|training_dataset)"
    file_types:
      - "*.py"
    message: "Model training without data validation/sanitization"
    description: "Detects model training without spectral signatures, activation clustering, or other data sanitization. Training on unchecked data is vulnerable to poisoning."
    remediation: "Implement data sanitization: Spectral Signatures (Tran 2018), Activation Clustering (Chen 2018), or BDMMT (Wei 2023) before training."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-20"

  - id: MEDUSA-MP-SCAN-012
    name: no-backdoor-detection-post-training
    severity: MEDIUM
    category: model_poisoning
    patterns:
      - "(?i)model\\.save|save_pretrained|torch\\.save\\s*\\("
    file_types:
      - "*.py"
    message: "Model saved without post-training backdoor detection"
    description: "Detects model checkpointing without Neural Cleanse, FreeEagle, or DL-TND inspection. Saved models may contain undetected backdoors."
    remediation: "Run Neural Cleanse (Wang 2019) or FreeEagle (Fu 2023) on saved checkpoints before deployment."
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"
