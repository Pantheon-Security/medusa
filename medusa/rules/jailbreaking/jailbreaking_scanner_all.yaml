  description: Detects SMILES-Prompting (Wong 2024), which uses SMILES chemical notation to encode harmful instructions. The
    model is asked to interpret chemical structures as instructions.
  remediation: Filter inputs containing SMILES notation in instruction contexts. Separate chemistry tools from general LLM
    instruction processing.
