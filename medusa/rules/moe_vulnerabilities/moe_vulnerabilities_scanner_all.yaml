  message: MoE expert weight extraction via output correlation and decomposition analysis
    detected
  description: 'Detects model extraction attacks that reconstruct individual MoE expert
    weights by analyzing correlations in model output logits across diverse queries.
    In sparse MoE models, the final output is a weighted combination of top-k expert
    outputs: output = sum_i(g_i * FFN_i(x)) for active experts. An attacker who knows
    the gating scores g_i (obtainable via shadow router, SCAN-045) and collects output
    logits across many queries can set up a linear system of equations to solve for
    individual FFN_i weight matrices. Using techniques from matrix factorization (PCA,
    ICA, SVD over logit correlation matrices), the attacker decomposes the mixed expert
    output into individual expert contributions. This attack is more efficient than
    standard model extraction because MoE''s sparse activation means each query primarily
    reflects only k experts, providing cleaner individual expert signal isolation.
    The MoEcho expert extraction approach (SCAN-012) provides the routing side-channel
    data needed to identify which expert combination produced each output.'
  remediation: Apply output perturbation with query-correlated noise that degrades
    logit correlation analysis while preserving semantic quality. Implement query
    diversity rate limiting — flag clients submitting high-entropy query sets designed
    for logit correlation matrix construction. Apply output compression or bucketing
    that reduces logit precision without significant quality degradation. Monitor
    for clients collecting full logit vectors (as opposed to just top-k token predictions)
    via verbose API modes.
