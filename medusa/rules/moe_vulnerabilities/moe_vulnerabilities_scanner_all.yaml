  description: Detects targeted denial-of-service attacks that deliberately overflow
    specific expert capacities in MoE LLM serving infrastructure. While SCAN-011 covers
    general load balancing DoS, this rule targets the specific mechanism of expert
    capacity overflow — crafting inputs where every token's top-k routing score concentrates
    on a single expert. When an expert's capacity is exceeded, excess tokens are either
    dropped (breaking inference quality) or held in a queue (increasing latency).
    A coordinated attacker can submit high-volume requests crafted to activate the
    same expert, overwhelming its capacity buffer and degrading service quality for
    all co-batched users. This is particularly effective in expert-parallel deployments
    where each expert runs on a different GPU — overwhelming one GPU's expert creates
    a bottleneck in the all-to-all communication step that stalls the entire forward
    pass. The load imbalance vulnerability is noted in both the MoEcho paper (Ding
    et al. 2025) and in the Zou et al. (2024) discussion of sparse MoE limitations.
  remediation: Implement per-user expert capacity reservation to prevent monopolization.
    Apply dynamic capacity adjustment with per-client token routing rate limiting.
    Monitor per-expert token arrival rates for sudden concentration spikes (>3x normal
    load on any single expert). Implement circuit breakers that gracefully degrade
    to dense routing when expert capacity overflow is detected, preserving service
    availability.
