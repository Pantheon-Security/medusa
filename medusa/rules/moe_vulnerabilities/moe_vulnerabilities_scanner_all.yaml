rules:
- id: MEDUSA-MOE-SCAN-001
  name: moe-expert-load-side-channel-monitoring
  severity: CRITICAL
  category: moe_vulnerabilities
  patterns:
  - (?i)expert[_\s-]?load[\s\S]{0,80}(side[_\s-]?channel|cache|pageout|reload|tlb)
  - (?i)(cache[_\s-]?occupanc|l1[_\s-]?i[_\s-]?cache|l2[_\s-]?d[_\s-]?cache)[\s\S]{0,60}(expert|moe|mixture)
  - (?i)madvise[\s]*\([\s\S]{0,60}madv[_\s-]?pageout
  - (?i)(expert[_\s-]?sequence|token[_\s-]?expert[_\s-]?assign)[\s\S]{0,80}(monitor|spy|intercept|trace|sniff)
  file_types:
  - '*.py'
  - '*.cpp'
  - '*.c'
  - '*.sh'
  message: Potential MoE expert load side-channel monitoring detected
  description: Detects code patterns consistent with the MoEcho attack (Ding et al.
    2025, arXiv:2508.15036), which achieves 99.8% prompt inference success rate on
    DeepSeek-V2 Lite by monitoring CPU cache occupancy channels (L1 I-Cache, L2 D-Cache)
    to extract expert load traces L. The expert load L reveals which experts processed
    how many tokens of the user's input, leaking sensitive attributes such as illness,
    gender, blood type, and age with up to 99.9% accuracy on templated inputs. The
    attack co-locates with the victim process on the same CPU core and uses madvise()
    MADV_PAGEOUT calls to evict and reload expert memory pages.
  remediation: Restrict access to shared system resources (performance counters, high-resolution
    timers). Apply balanced expert computation to obfuscate load traces. Monitor for
    processes repeatedly accessing shared ML library memory pages (e.g., PyTorch transformer
    weight pages). Implement differential privacy in the MoE router training process.
  owasp_llm: LLM02:2025
  cwe: CWE-203
- id: MEDUSA-MOE-SCAN-002
  name: moe-pageout-reload-expert-sequence-extraction
  severity: CRITICAL
  category: moe_vulnerabilities
  patterns:
  - (?i)madvise[\s]*\([\s\S]{0,120}madv[_\s-]?pageout[\s\S]{0,200}(reload|timing|expert)
  - (?i)(pageout[\s\S]{0,40}reload|flush[\s\S]{0,40}reload)[\s\S]{0,80}(expert|moe|mixture[_\s-]?of[_\s-]?expert)
  - (?i)(expert[_\s-]?page|weight[_\s-]?page)[\s\S]{0,60}(evict|flush|swap[_\s-]?out|pageout)
  - (?i)reload[_\s-]?time[\s\S]{0,60}(expert[_\s-]?index|expert[_\s-]?sequence|top[_\s-]?k[_\s-]?expert)
  file_types:
  - '*.py'
  - '*.cpp'
  - '*.c'
  message: MoE Pageout+Reload side-channel attack pattern detected
  description: 'Detects the Pageout+Reload side-channel technique from MoEcho (Ding
    et al. 2025), which achieves 99.2% expert sequence recovery accuracy on DeepSeek-V2
    Lite CPUs. The attacker evicts each expert module''s first data memory page using
    Linux madvise(addr, size, MADV_PAGEOUT), then measures page reload times during
    victim execution. Short reload times indicate the expert was activated. This recovers
    the complete expert sequence S during the MoE decoding phase, enabling Response
    Reconstruction Attacks with 92.8% ASR. Target: DeepSeek-V2 Lite, Qwen1.5-MoE,
    TinyMixtral.'
  remediation: Restrict madvise() MADV_PAGEOUT to privileged processes only. Implement
    page access randomization for ML model weight pages. Isolate MoE model library
    instances per user process rather than using shared libraries. Monitor for high-frequency
    page eviction calls targeting transformer weight memory regions.
  owasp_llm: LLM02:2025
  cwe: CWE-203
- id: MEDUSA-MOE-SCAN-003
  name: moe-gpu-tlb-evict-reload-side-channel
  severity: CRITICAL
  category: moe_vulnerabilities
  patterns:
  - (?i)(tlb[\s\S]{0,40}evict[\s\S]{0,40}reload|tlb[\s\S]{0,40}flush[\s\S]{0,40}expert)
  - (?i)(nsight|nvperf|gpu[_\s-]?performance[_\s-]?counter)[\s\S]{0,80}(expert[_\s-]?load|thread[_\s-]?count|moe)
  - (?i)l3[_\s-]?tlb[\s\S]{0,60}(evict|flush|dummy[_\s-]?buffer)[\s\S]{0,80}(expert|moe|deepseek)
  - (?i)(nn\.selu|selu[_\s-]?activation)[\s\S]{0,120}(thread[_\s-]?count|nsight|performance[_\s-]?counter)
  file_types:
  - '*.py'
  - '*.cu'
  - '*.cpp'
  message: MoE GPU TLB Evict+Reload or performance counter side-channel pattern detected
  description: Detects GPU-based side-channel patterns from MoEcho (Ding et al. 2025)
    targeting MoE models on NVIDIA GPUs. The TLB Evict+Reload attack allocates a 4GB
    dummy buffer to evict the shared L3 TLB, then measures access times of TLB entry
    blocks corresponding to each expert to infer which experts were active — achieving
    94.3% expert sequence recovery on DeepSeek-V2 Lite (NVIDIA A6000). The GPU performance
    counter attack uses NVIDIA Nsight to monitor per-expert thread counts (nn.selu
    activation kernel), achieving 0.993 Pearson correlation with ground truth expert
    load. Both attacks require no root privilege.
  remediation: Restrict NVIDIA Nsight/nvperf access to system administrators. Implement
    per-process TLB partitioning or randomization for GPU workloads. Monitor for processes
    allocating unusually large GPU memory buffers (4GB+) alongside active MoE inference
    workloads. Disable hugepage mappings (2MB) for MoE expert weight pages on production
    GPU deployments.
  owasp_llm: LLM02:2025
  cwe: CWE-203
- id: MEDUSA-MOE-SCAN-004
  name: moe-prompt-inference-attack-classifier
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(expert[_\s-]?load[\s\S]{0,60}classif|prompt[_\s-]?infer[\s\S]{0,60}expert[_\s-]?load)
  - (?i)(top[_\s-]?k[_\s-]?expert[\s\S]{0,60}(illness|age|gender|blood[_\s-]?type|health))
  - (?i)(prefill[_\s-]?phase|prefilling[_\s-]?phase)[\s\S]{0,80}(expert[_\s-]?load|spy|monitor|trace)
  - (?i)mlp[_\s-]?(classif|model)[\s\S]{0,80}(expert[_\s-]?trace|expert[_\s-]?load|moe[_\s-]?signal)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: MoE Prompt Inference Attack classifier training or deployment pattern detected
  description: Detects training or deployment of classifiers that map MoE expert load
    traces to sensitive user input attributes, consistent with the Prompt Inference
    Attack (PIA) described in MoEcho (Ding et al. 2025). The PIA achieves 99.9% accuracy
    on templated healthcare prompts on DeepSeek-V2 Lite (64 experts, 26 layers), recovering
    patient attributes including illness (116 classes), gender, blood type, and age
    from expert load L collected during the MoE prefilling phase. Fine-grained MoE
    architectures (DeepSeek, Qwen1.5-MoE) leak significantly more information than
    coarse-grained ones (TinyMixtral with 4 experts). The attack requires ~1 hour
    of offline profiling on 10,000 prompts.
  remediation: Apply differential privacy noise to MoE router gating outputs during
    inference. Use coarser expert granularity to reduce per-token routing distinctiveness.
    Implement oblivious computation patterns that equalize execution time across experts
    regardless of input content. Audit co-located processes for MoE profiling activity
    patterns.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-MOE-SCAN-005
  name: moe-response-reconstruction-attack
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(expert[_\s-]?sequence[\s\S]{0,60}(reconstruct|output[_\s-]?token|response[_\s-]?token))
  - (?i)(decod[_\s-]?phase[\s\S]{0,80}expert[_\s-]?sequence[\s\S]{0,60}(logistic|classif|map))
  - (?i)(logistic[_\s-]?regression|multinomial)[\s\S]{0,80}(expert[_\s-]?sequence|moe[_\s-]?trace)
  - (?i)(response[_\s-]?reconstruct[\s\S]{0,60}expert[_\s-]?seq|verbatim[_\s-]?reconstruct[\s\S]{0,60}moe)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: MoE Response Reconstruction Attack (RRA) pattern detected
  description: Detects training or deployment of Multinomial Logistic Regression or
    similar models that map MoE expert sequences collected during decoding back to
    output tokens, consistent with the Response Reconstruction Attack (RRA) in MoEcho
    (Ding et al. 2025). The RRA achieves 93.6% ASR on Synthetic Prompts, 91.5% on
    Medical Q&A, and 91.9% on Financial Q&A for DeepSeek-V2 Lite. The attack reconstructs
    complete model responses verbatim — including private emails, medical diagnoses,
    financial information — by monitoring which experts are activated for each output
    token during the MoE KV-Cache decoding phase. Profiling requires ~75h for 2.9M
    output tokens (DeepSeek-V2-Lite).
  remediation: Implement response token output randomization or watermarking to break
    the deterministic expert-to-token mapping. Apply expert output aggregation noise
    during decoding. Restrict co-location of untrusted processes with MoE inference
    servers. Isolate shared memory regions used by MoE decode loops.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-MOE-SCAN-006
  name: moe-visual-inference-attack-vlm
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(expert[_\s-]?load[\s\S]{0,60}(visual|image|face|identity|attribute)[\s\S]{0,60}(classif|infer))
  - (?i)(vlm[\s\S]{0,60}expert[_\s-]?trace|vision[_\s-]?language[_\s-]?model[\s\S]{0,80}side[_\s-]?channel)
  - (?i)(celeba|facial[_\s-]?attribute)[\s\S]{0,80}(expert[_\s-]?load|moe[_\s-]?signal|expert[_\s-]?trace)
  - (?i)(deepseek[_\s-]?vl|deepseek[_\s-]?vlm|vision[_\s-]?moe)[\s\S]{0,80}(side[_\s-]?channel|privacy|leakage)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: MoE Visual Inference Attack (VIA) pattern on VLM detected
  description: Detects patterns consistent with the Visual Inference Attack (VIA)
    from MoEcho (Ding et al. 2025), which uses MoE expert load traces from vision-language
    models to infer sensitive visual attributes of user input images. Evaluated on
    DeepSeek-VL2 (3.37B, 4 experts) with the CelebA dataset (300 celebrities, 40 binary
    attributes), the VIA achieves average 85.34% accuracy. Top-5 attributes (Male,
    Wearing Eyeglasses, Wearing Hat, Bald, Gray Hair) reach 94-99% accuracy. A simple
    3-layer MLP classifier trained on 80% of MoE expert load traces achieves these
    results without any access to the input images — only hardware-level execution
    traces.
  remediation: Implement image content oblivious execution paths in VLM MoE layers.
    Apply noise to VLM expert routing decisions. Restrict hardware monitoring access
    in multi-user VLM serving environments. Deploy MoE VLMs in isolated sandbox environments
    with restricted system call access.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-MOE-SCAN-007
  name: moe-visual-reconstruction-attack-gan
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(conditional[_\s-]?(gan|unet|generative)[\s\S]{0,80}expert[_\s-]?load)
  - (?i)(expert[_\s-]?load[\s\S]{0,60}(condition|inpaint|reconstruct[_\s-]?image|image[_\s-]?reconstruct))
  - (?i)(moe[_\s-]?signal[\s\S]{0,60}(image[_\s-]?generat|reconstruct|inpaint)[\s\S]{0,60}(unet|gan|diffus))
  - (?i)(visual[_\s-]?reconstruction[_\s-]?attack|vra)[\s\S]{0,80}(deepseek|vlm|moe|expert)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: MoE Visual Reconstruction Attack (VRA) GAN conditioning on expert load
    traces detected
  description: Detects training or deployment of conditional generative models (GAN/U-Net)
    conditioned on MoE expert load traces to reconstruct user input images from masked
    versions, consistent with the Visual Reconstruction Attack (VRA) from MoEcho (Ding
    et al. 2025). The VRA uses a conditional U-Net (4x4 latent with 128-dim condition
    space) conditioned on expert load L from DeepSeek-VL2 to reconstruct 32x32 inpainted
    images with SSIM improvement from 0.8414 to 0.8725 and FID improvement from 62.28
    to 46.26. This attack can recover masked faces in privacy-sensitive medical imaging
    applications where the underlying MoE model still processes the unmasked input.
  remediation: Ensure that masked/privacy-protected inputs are not processed in their
    original form by the MoE backend. Apply input preprocessing that eliminates sensitive
    visual content before reaching MoE routing layers. Monitor for GAN training activities
    that use MoE execution traces as conditioning signals.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-MOE-SCAN-008
  name: moe-deepseek-architecture-fingerprinting
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(deepseek[_\s-]?v2|deepseekv2|deepseek[_\s-]?moe)[\s\S]{0,80}(expert[_\s-]?load|routing|top[_\s-]?k[_\s-]?expert|fingerprint)
  - (?i)(top[_\s-]?k[\s]*=[\s]*6[\s\S]{0,40}num[_\s-]?expert[\s]*=[\s]*64|64[_\s-]?expert[\s\S]{0,40}top[_\s-]?k[\s]*=[\s]*6)
  - (?i)(moe[_\s-]?infer[\s\S]{0,60}topk[_\s-]?ids[\s\S]{0,60}count[_\s-]?token)
  - (?i)(count[_\s-]?tokens[_\s-]?per[_\s-]?expert|tokens[_\s-]?per[_\s-]?expert)[\s\S]{0,80}(timing|trace|monitor|spy)
  file_types:
  - '*.py'
  - '*.json'
  message: DeepSeek-V2 MoE architecture fingerprinting or expert monitoring pattern
    detected
  description: Detects code patterns that fingerprint or monitor the DeepSeek-V2/V2-Lite
    MoE architecture expert routing behavior, consistent with profiling phase activities
    in MoEcho attacks (Ding et al. 2025). DeepSeek-V2 Lite uses 64 experts per layer
    across 26 layers with k=6 active experts per token. The sequential execution of
    experts in the DeepSeek inference loop (count_tokens → run_expert per index) creates
    distinctive computational patterns measurable via hardware side-channels. Fine-grained
    MoE segmentation in DeepSeek enables precise input-to-expert correlation that
    more than doubles the leakage compared to coarse-grained architectures like TinyMixtral.
  remediation: Implement oblivious expert scheduling that pads all expert execution
    times to the worst-case regardless of token load. Apply expert execution order
    randomization. Enforce strict process isolation for DeepSeek inference serving.
    Audit public-facing DeepSeek deployments for co-located monitoring processes.
  owasp_llm: LLM02:2025
  cwe: CWE-203
- id: MEDUSA-MOE-SCAN-009
  name: moe-router-gating-adversarial-noise-injection
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(router[_\s-]?(gating|gate|network)[\s\S]{0,60}(noise|perturbation|adversarial|inject))
  - (?i)(gating[_\s-]?function[\s\S]{0,60}(manipulate|bypass|fool|poison|corrupt))
  - (?i)(top[_\s-]?k[_\s-]?(select|routing|gating)[\s\S]{0,60}(adversarial|craft|manipulate|force))
  - (?i)(affinity[_\s-]?score[\s\S]{0,60}(manipulate|forge|poison|craft)[\s\S]{0,80}expert)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: MoE router gating adversarial manipulation attempt detected
  description: Detects attempts to adversarially manipulate the MoE router/gating
    function to force routing of inputs to specific experts or bypass security-critical
    experts. The MoE gating network (typically a linear projection + softmax) computes
    affinity scores phi(u_t) for each token u_t and selects the top-k experts. Adversarially
    crafted inputs or noise injections targeting the gating function can force activation
    of specific experts, enabling capability elicitation (activating knowledge-rich
    experts) or security bypass (routing prompts away from safety-checking experts).
    He et al. (2024) identifies adversarial gating manipulation as a critical threat
    in MoE-based security systems. Relevant to DeepSeekMoE, Mixtral, Switch Transformer,
    Qwen-MoE.
  remediation: Implement input validation before the MoE routing layer. Apply noise-robust
    gating with temperature scaling. Monitor expert activation distributions for anomalous
    routing patterns that deviate significantly from baseline distributions. Add a
    dedicated safety expert that is always included in the top-k selection regardless
    of routing scores.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-MOE-SCAN-010
  name: moe-semantic-noise-tampering-attack
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(semantic[_\s-]?noise[\s\S]{0,60}(inject|add|insert)[\s\S]{0,60}(encoder|codec|moe))
  - (?i)(adversarial[_\s-]?semantic[\s\S]{0,60}(tamper|corrupt|noise)[\s\S]{0,60}(source|channel))
  - (?i)(semantic[_\s-]?distance[_\s-]?minimiz|sdm[_\s-]?train)[\s\S]{0,60}(bypass|evade|fool)
  - (?i)(white[_\s-]?box[\s\S]{0,40}semantic[_\s-]?codec|semantic[_\s-]?encoder[\s\S]{0,60}gradient[_\s-]?attack)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: Semantic noise injection attack against MoE semantic communication system
    detected
  description: Detects adversarial semantic noise injection attacks against MoE-based
    semantic communication systems, as analyzed by He et al. (2024). In white-box
    mode, attackers with knowledge of the semantic encoder architecture compute minimum-perturbation
    adversarial noise via gradient descent to cause semantic decoding failures. In
    black-box mode, repeated query-based attacks achieve the same effect. Without
    MoE defense, tampering attacks reduce normal semantic codec accuracy from ~90%
    to ~40% (source-end) or below 60% (channel-end). The MoE-based SemCom system maintains
    >80% accuracy under these attacks by routing to the SDM-trained robust expert.
  remediation: Deploy MoE-based SemCom with Semantic Distance Minimization (SDM) trained
    robust codecs. Implement adversarial training on semantic encoder/decoder pairs.
    Apply input sanitization to detect adversarially perturbed semantic inputs. Monitor
    semantic reconstruction quality metrics for anomalous degradation patterns.
  owasp_llm: LLM05:2025
  cwe: CWE-20
- id: MEDUSA-MOE-SCAN-011
  name: moe-load-balancing-exploit-for-dos
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(load[_\s-]?balanc[\s\S]{0,60}(exploit|overflow|bypass|saturate)[\s\S]{0,60}expert)
  - (?i)(expert[_\s-]?(overflow|overload|imbalance)[\s\S]{0,60}(dos|denial|slow|degrad))
  - (?i)(token[_\s-]?dropp[_\s-]{0,10}(expert|moe)|expert[_\s-]?capacit[_\s-]?overflow)
  - (?i)(auxiliary[_\s-]?loss[\s\S]{0,60}(bypass|poison|manipulate|disable)[\s\S]{0,80}load[_\s-]?balanc)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: MoE load balancing exploit or expert overflow attack pattern detected
  description: Detects attempts to exploit MoE load balancing mechanisms to cause
    token dropping, expert overflow, or denial of service through expert imbalance
    attacks. Standard sparse MoE architectures with top-k routing use auxiliary load
    balancing losses during training to prevent all tokens routing to a small subset
    of experts. Attackers can craft inputs that saturate specific experts' capacity
    buffers, causing tokens to be dropped (reducing output quality) or creating measurable
    timing side-effects. La-SoftMoE CLIP (Zou et al. 2024) documents token-dropping
    vulnerabilities in standard sparse MoE that adversarially crafted attack images
    can exploit. Switch Transformer and Mixtral architectures with fixed capacity
    factors are particularly susceptible.
  remediation: Use SoftMoE or other token-dropping-free MoE variants for security-critical
    applications. Implement per-request expert load monitoring with rate limiting.
    Enforce capacity factors ≥2.0 to reduce token drop probability. Monitor expert
    utilization distributions in real-time to detect anomalous concentration of tokens
    to specific experts.
  owasp_llm: LLM10:2025
  cwe: CWE-400
- id: MEDUSA-MOE-SCAN-012
  name: moe-expert-extraction-model-stealing
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(expert[_\s-]?steal|expert[_\s-]?extract[_\s-]?attack|moe[_\s-]?model[_\s-]?steal)
  - (?i)(extract[_\s-]?expert[_\s-]?(weight|parameter|knowledge)[\s\S]{0,80}(query|probe|black[_\s-]?box))
  - (?i)(model[_\s-]?extraction[\s\S]{0,60}(moe|mixture[_\s-]?of[_\s-]?expert|expert[_\s-]?network))
  - (?i)(knock[_\s-]?off|distill[_\s-]?expert|clone[_\s-]?expert)[\s\S]{0,80}(moe|routing|gating)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: MoE expert weight extraction or model stealing attack pattern detected
  description: 'Detects patterns consistent with expert weight extraction attacks
    against MoE models, where adversaries attempt to recover the parameters of specific
    expert sub-networks through systematic querying. MoE architectures create natural
    opportunities for targeted expert extraction: by crafting inputs that reliably
    activate specific experts (exploiting the gating function), an attacker can isolate
    and extract individual expert networks far more efficiently than attacking a dense
    model. The MoEcho work (Ding et al. 2025) demonstrates that DeepSeek-V2 Lite with
    64 experts per layer can be profiled with 10,000 queries to map input patterns
    to expert activations. This profiling information can guide efficient expert-specific
    weight extraction attacks.'
  remediation: Implement query rate limiting and anomaly detection for systematic
    expert-targeted query patterns. Apply output perturbation to obscure precise parameter
    information. Monitor for query sequences designed to activate specific expert
    subsets repeatedly. Implement differential privacy at expert output level.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-MOE-SCAN-013
  name: moe-capability-elicitation-via-expert-targeting
  severity: HIGH
  category: moe_vulnerabilities
  patterns:
  - (?i)(activate[_\s-]?specific[_\s-]?expert|force[_\s-]?expert[_\s-]?activat|target[_\s-]?expert[_\s-]?route)
  - (?i)(expert[_\s-]?(elicit|unlock|bypass)[\s\S]{0,60}(capabilit|knowledge|restrict|safety))
  - (?i)(craft[_\s-]?(prompt|input)[\s\S]{0,80}expert[_\s-]?(index|activat|select)[\s\S]{0,60}(bypass|unlock|elicit))
  - (?i)(domain[_\s-]?expert[\s\S]{0,60}(jailbreak|bypass[_\s-]?safety|unsafe[_\s-]?knowledge|restrict))
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: MoE capability elicitation via targeted expert activation attempt detected
  description: Detects attempts to craft inputs that force activation of specific
    domain-specialized experts in MoE models to elicit restricted capabilities or
    bypass safety measures. MoE models train distinct experts to specialize in different
    domains (code generation, medical knowledge, language-specific reasoning). Inputs
    crafted to reliably activate specific high-capability or safety-bypassed experts
    can unlock behaviors unavailable through normal routing. The MoEcho profiling
    methodology (Ding et al. 2025) demonstrates that expert load traces on DeepSeek-V2
    Lite (64 experts) can distinguish illness categories with 99.9% accuracy, indicating
    that expert specialization is strong enough to be targeted for elicitation attacks.
    DeepSeek-R1 and similar chain-of-thought MoE models may be particularly susceptible
    due to their distinct reasoning expert clusters.
  remediation: Implement safety checks at the expert output aggregation layer, not
    just pre-routing. Ensure safety-critical experts are included in every inference
    pass regardless of routing scores. Monitor for systematic prompt patterns attempting
    to force specific expert activations. Apply content filtering to expert outputs
    before aggregation.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-MOE-SCAN-014
