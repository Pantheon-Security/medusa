  description: Detects timing attacks that exploit MoE speculative decoding accept/reject
    patterns to infer expert routing sequences. In speculative decoding for MoE models,
    a small draft model generates candidate token sequences, which are then verified
    in parallel by the target MoE model. The acceptance/rejection timing of draft
    tokens is directly correlated with which experts were activated during verification
    — rejected tokens cause additional expert computation cycles. An attacker with
    API access can submit carefully constructed prompts and measure response latency
    variations to infer whether specific experts were activated during draft verification,
    effectively using speculative decoding as a timing oracle for expert routing inference.
    This extends the MoEcho timing oracle concept (Ding et al. 2025) to speculative
    decoding workflows increasingly deployed in production MoE serving.
  remediation: Implement constant-time speculative verification regardless of accept/reject
    count. Add configurable latency jitter to all MoE API responses using speculative
    decoding. Monitor per-request verification accept rates for anomalous patterns
    indicating adversarial probe sequences. Apply rate limiting on requests with patterns
    consistent with speculative decoding timing probes.
