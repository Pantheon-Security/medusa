  message: MoE input-dependent routing timing oracle attack pattern detected
  description: 'Detects attempts to exploit timing differences in MoE inference as
    an oracle for inferring routing decisions and user input content. In MoE architectures,
    the execution time of each expert is proportional to its token load — different
    inputs route different numbers of tokens to different experts, creating measurable
    timing variations. The MoEcho cache occupancy channel (Ding et al. 2025) explicitly
    exploits this property: L1 I-Cache timing peaks correspond to expert module boundaries.
    Even without hardware access, API-level timing measurements of MoE responses may
    leak routing information for high-variance expert loads, particularly in fine-grained
    MoE models like DeepSeek (64 experts, k=6) where the timing distribution across
    experts is highly input-dependent.'
  remediation: Implement constant-time MoE inference that normalizes execution time
    across all possible routing outcomes. Apply response time jitter at the API level
    to mask expert load variations. Monitor for systematic timing-based reconnaissance
    patterns across different input categories. Consider deploying MoE models with
    balanced expert computation regardless of actual token load.
