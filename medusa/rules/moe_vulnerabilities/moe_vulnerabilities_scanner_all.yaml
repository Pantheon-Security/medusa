    identifies DP noise addition to router decisions as a primary mitigation, but
    notes that DP-protected routers suffer from imprecise expert selection that adversely
    affects model performance. An attacker could target DP budget exhaustion through
    repeated queries, or identify threshold conditions where the DP noise level is
    insufficient to prevent expert load inference. The tradeoff between privacy and
    routing accuracy makes DP-protected MoE routers susceptible to adaptive attacks
    that exploit known noise distributions.
