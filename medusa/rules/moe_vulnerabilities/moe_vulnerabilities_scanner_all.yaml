  description: Detects side-channel attacks exploiting quantized MoE expert weights
    to infer routing patterns. When MoE experts are stored in lower-precision formats
    (INT4, INT8 via GPTQ, AWQ, BitsAndBytes), the dequantization step introduces timing
    variations proportional to which expert codebooks are accessed. An attacker co-located
    on the same hardware can monitor dequantization latency variations to reconstruct
    expert activation sequences without direct memory access. This is an extension
    of the MoEcho Pageout+Reload and cache-occupancy channels (Ding et al. 2025) to
    quantized deployments, which are increasingly common for on-device and edge MoE
    inference. Quantized experts may reside in separate memory pages with different
    dequantization costs, making the timing oracle more pronounced than full-precision
    deployments.
  remediation: Apply constant-time dequantization operations that mask expert activation
    timing. Use memory-pinned pre-loaded dequantization buffers for all experts regardless
