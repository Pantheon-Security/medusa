    expert routing decisions across concurrent user requests. Modern MoE serving systems
    (vLLM, SGLang) use continuous batching / iteration-level scheduling to process
    tokens from multiple users simultaneously. When tokens from multiple users are
    batched together, the all-to-all expert dispatch step aggregates token routing
