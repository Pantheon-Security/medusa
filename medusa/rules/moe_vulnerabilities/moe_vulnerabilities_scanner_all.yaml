    malicious client model updates. In federated MoE training, individual clients
    train local expert weight updates and contribute them to a central aggregator.
    A Byzantine adversary controlling a subset of clients can submit carefully crafted
    expert weight updates that, when aggregated, embed backdoor behaviors into specific
    experts while maintaining benign performance on standard metrics. Unlike dense
    model poisoning, MoE federated poisoning can be targeted to specific experts —
    the attacker can poison only the expert weights that activate on targeted input
    patterns, leaving all other experts unaffected. This targeted poisoning is harder
    to detect via federated anomaly detection because aggregate expert metrics remain
    within normal bounds. The gating network manipulation vulnerability identified
    by He et al. (2024) extends to federated contexts where the gating network weights
    are distributed across clients.
  remediation: Apply Byzantine-robust aggregation methods (Krum, Trimmed-Mean, FLTrust)
    to expert weight updates in federated MoE training. Implement per-expert update
    validation using held-out validation sets before incorporating client updates.
    Apply differential privacy to client expert weight updates. Monitor per-expert
    weight update magnitude distribution for anomalous Byzantine client signatures.
    Use secure multi-party computation for expert aggregation in high-security federated
    MoE deployments.
