    producing expert activation patterns that are consistent across all requests sharing
    the same system prompt. An attacker who submits multiple queries to the same API
    endpoint and collects expert load side-channel data across requests can perform
    differential analysis to isolate the system prompt's expert activation signature
    from the variable user input contribution, enabling system prompt reconstruction.
    This extends MoEcho's templated-input attack to production deployment scenarios
    where system prompts are proprietary and confidential.
  remediation: Apply expert activation noise injection specifically during system
    prompt processing (prefilling phase). Implement system prompt caching with obfuscated
