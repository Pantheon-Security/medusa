    routing/gating network using black-box API queries. Unlike full model extraction
    attacks (SCAN-034), shadow router attacks specifically target the gating network
    — the smallest but most security-critical component of MoE architectures. By submitting
    systematically varied inputs and observing output logit distributions (which implicitly
    reflect expert activation), an attacker can train a surrogate gating network that
    approximates the target's routing decisions. Once the routing policy is reconstructed,
    the attacker can predict which experts will handle any given input without side-channel
    access, enabling efficient targeted capability elicitation (SCAN-013), privacy
    attacks, and detection evasion by pre-computing adversarial inputs that activate
    or deactivate specific experts. The MoEcho input-dependent routing timing oracle
    (SCAN-022) provides an additional signal for shadow gating network training.
  remediation: Apply output perturbation techniques that mask routing-correlated logit
    patterns. Implement query diversity monitoring to detect systematic shadow model
    construction (high semantic diversity across queries). Apply membership inference
