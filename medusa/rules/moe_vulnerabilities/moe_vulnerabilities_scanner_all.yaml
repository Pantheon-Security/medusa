  message: Adaptive attack bypassing differential privacy defenses on MoE expert routing
    detected
  description: 'Detects adaptive attacks designed to circumvent differential privacy
    (DP) defenses applied to MoE routing mechanisms. The MoEcho paper (Ding et al.
    2025) proposes DP noise injection into router gating decisions as a mitigation,
    noting that the DP sparse gating defense reduces PIA accuracy from 99.9% to degraded
    levels. However, adaptive attacks that know the DP mechanism being used can overcome
    this defense through: (1) ensemble averaging — submitting the same or semantically
    equivalent prompts multiple times and averaging expert load traces to cancel out
    calibrated Gaussian noise; (2) DP mechanism inversion — using the known DP noise
    distribution to perform maximum likelihood estimation of the true routing signal;
    (3) accuracy-privacy curve exploitation — identifying the DP parameter regime
    where defenses are weakest (the SCAN-014 sparse gating DP bypass technique, which
    this extends to adaptive multi-query scenarios). Against a DP defense with epsilon=1.0,
    approximately 1,000 repeated queries can reduce effective noise by a factor of
    sqrt(1000) ≈ 31x, potentially recovering near-original routing signal accuracy.'
  remediation: Implement rate limiting on identical or semantically equivalent queries
    that prevents sufficient repetitions for adaptive DP averaging (fewer than 100
    repetitions per query semantics per time window). Apply query grouping with per-group
    budget tracking — count multiple similar queries against a shared privacy budget.
    Use adaptive DP mechanisms that increase noise with query count rather than applying
    fixed noise per query. Monitor for clients submitting repetitive high-similarity
    query batches (cosine similarity > 0.95 across query embeddings).
  owasp_llm: LLM02:2025
  cwe: CWE-693
