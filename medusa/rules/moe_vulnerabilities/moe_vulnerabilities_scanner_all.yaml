    as a threat by He et al. (2024). The MoE SemCom gating network uses PSR as part
    of its routing input — if an attacker can forge or inject a PSR vector that routes
    messages to the normal (unprotected) codec instead of the robust or private codec,
    all security guarantees are bypassed. This is analogous to a jailbreak that targets
    the routing layer rather than the model's content generation layer. The gating
