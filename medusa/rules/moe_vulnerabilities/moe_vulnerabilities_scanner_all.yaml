  message: MoE expert dropout or token-dropping exploitation attack detected
  description: Detects adversarial exploitation of expert dropout and token-dropping
    mechanisms in sparse MoE architectures. In capacity-constrained sparse MoE (e.g.,
    Switch Transformer, GShard), each expert has a fixed capacity — the maximum number
    of tokens it can process in one forward pass. When more tokens are routed to an
    expert than its capacity allows, excess tokens are dropped and passed through
    unchanged. An adversary can craft inputs that deliberately overflow specific experts'
    capacity, causing selective token dropping in victim co-batched requests. Alternatively,
    adversarially induced token dropping can create exploitable silence patterns (dropped
    tokens produce zeros in some implementations) that leak expert utilization. This
    is related to the MoE load balancing DoS attack (SCAN-011) but focuses specifically
    on the dropout/token-drop mechanism as an information channel and service manipulation
    vector. The Zou et al. (2024) paper discusses expert load imbalance as a key failure
    mode in sparse MoE face detection.
  remediation: Implement per-request expert capacity reservation to prevent cross-request
    token dropping interference. Monitor token dropping rates per expert for anomalous
    patterns indicating deliberate capacity overflow attacks. Use auxiliary load balancing
    loss with aggressive penalties during training to prevent exploitable expert imbalance.
    Consider migrating from capacity-constrained sparse MoE to SoftMoE routing which
    eliminates token dropping.
