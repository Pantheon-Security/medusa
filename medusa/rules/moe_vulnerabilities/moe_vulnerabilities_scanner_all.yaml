    user. The MoEcho paper (Ding et al. 2025) demonstrates that expert load traces
    alone achieve 99.9% PIA accuracy, but inter-layer correlation analysis provides
    additional dimensions for user tracking even when individual-layer activation
    patterns are obscured by noise. An attacker who observes expert activations across
    multiple inference layers can build a cross-layer co-activation matrix that uniquely
    identifies individual users across sessions, even after anonymization measures
    that target single-layer routing patterns.
  remediation: Apply independent noise injection per layer with uncorrelated noise
    sources to break inter-layer activation correlations. Implement layer-shuffling
