    MoE architectures. Switch Transformer uses a single expert per token with a fixed
    capacity factor — when too many tokens are routed to the same expert, excess tokens
    are dropped. Adversarially crafted inputs can force all tokens to route to the
    same expert, causing systematic token dropping and degraded output quality. The
    jitter noise added during Switch Transformer training to prevent expert collapse
    can be overcome by inputs specifically optimized to exploit the argmax routing
    boundary conditions.
  remediation: Use soft routing or capacity-overflow redistribution strategies instead
    of hard token dropping. Implement input-independent capacity allocation (e.g.,
