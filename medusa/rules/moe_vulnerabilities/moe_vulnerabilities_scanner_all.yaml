  description: Detects gradient inversion attacks targeting MoE router/gating network
    gradients to reconstruct private training inputs. Gradient inversion (GAN-based
    or optimization-based) against standard dense networks is well-established; MoE
    architectures present an amplified vulnerability because the router gradient encodes
    input-dependent routing decisions in a compact, information-dense form. The router
    gradient with respect to its gating weight matrix W_g contains strong signals
    about which experts were activated by the input, which correlates with semantic
    content. In federated fine-tuning scenarios where gradient updates are shared,
    a malicious aggregator can apply gradient inversion to the sparse routing gradient
    updates to reconstruct private training samples — particularly effective for MoE
    because the routing gradient is much smaller than the full expert gradient, making
