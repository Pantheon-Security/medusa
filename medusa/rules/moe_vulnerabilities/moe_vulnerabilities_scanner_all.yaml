    subsets to different experts, poisoning a specific expert can compromise the model's
    behavior for all inputs routed to that expert while preserving normal performance
    on inputs routed to clean experts. This targeted poisoning is significantly harder
    to detect than whole-model poisoning because standard validation datasets may
    not exercise the compromised expert. In MoE architectures with fixed expert assignments
    (e.g., domain-specialized fine-tuning), an adversary who can inject training examples
