  message: MoE KV-Cache expert sequence leakage pattern detected
  description: 'Detects exploitation of the KV-Cache mechanism in MoE LLMs to leak
    expert sequence information. During MoE decoding, the KV-Cache stores key-value
    pairs for previous tokens, allowing only the new token''s attention and MoE computation
    at each step. This creates a distinct decoding pattern where each output token
    activates only the top-k experts for that token''s hidden state. The MoEcho RRA
    (Ding et al. 2025) explicitly exploits the decoding phase''s KV-Cache behavior:
    the sparse activation of just k experts per output token (k=6 for DeepSeek-V2-Lite)
    creates a discrete expert sequence S that uniquely identifies each output token
    with >90% accuracy. Shared KV-Cache implementations in multi-tenant serving (VLLM
    prefix caching) may further compound this leakage.'
  remediation: Isolate KV-Cache memory between tenants in multi-user LLM serving systems.
    Apply noise to expert activation patterns during cached-token decoding phases.
    Monitor shared KV-Cache access patterns for timing-based inference attacks. Implement
    KV-Cache randomization that preserves semantic correctness but obscures the exact
    expert activation sequence.
