    et al. 2025) to the training domain.
  remediation: Apply differential privacy (DP-SGD) with calibrated noise to routing
    gradient updates before sharing in federated MoE training. Clip routing gradient
    norms aggressively (L2 norm clipping) to reduce gradient inversion efficacy. Implement
    secure aggregation protocols that prevent any participant from observing individual
    routing gradient updates. Avoid sharing per-layer router gradients in federated
    settings — share only aggregated model parameter deltas.
