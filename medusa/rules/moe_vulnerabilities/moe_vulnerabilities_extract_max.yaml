rules:
- category: moe_vulnerabilities
  cwe: CWE-94
  description: Detects configuration of auxiliary-loss-free load balancing in MoE models which can be exploited to manipulate
    expert routing by injecting bias terms into gating functions without triggering loss-based safeguards
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: MOE-001
  message: 'Detected: moe-auxiliary-loss-free-balancing-manipulation'
  name: moe-auxiliary-loss-free-balancing-manipulation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)auxiliary.{0,30}loss.{0,30}free.{0,30}balance
  - (?i)bias.{0,20}(term|update).{0,30}(gating|routing)
  - (?i)load_balance.{0,20}(factor|loss).{0,10}=.{0,10}0
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: DeepSeek-AI (2024) - Auxiliary-loss-free balancing enables gating bias manipulation without detection
- category: moe_vulnerabilities
  cwe: CWE-665
  description: Detects Multi-Token Prediction (MTP) module configurations in MoE models where shared expert routing can be
    overridden to force predictions through attacker-controlled expert paths
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-002
  message: 'Detected: moe-multi-token-prediction-expert-override'
  name: moe-multi-token-prediction-expert-override
  owasp_llm: LLM01:2025
  patterns:
  - (?i)multi.{0,10}token.{0,10}prediction.{0,30}(module|head)
  - (?i)mtp.{0,20}(module|loss|depth)
  - (?i)shared.{0,10}expert.{0,20}(override|bypass|disable)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: DeepSeek-AI (2024) - MTP modules with shared experts create new manipulation surfaces
- category: moe_vulnerabilities
  cwe: CWE-120
  description: Detects expert segmentation and dispatch logic in MoE pipelines where token-to-expert assignment buffers can
    overflow when adversarial inputs trigger routing to a single expert
  file_types:
  - '*.py'
  id: MOE-003
  message: 'Detected: moe-expert-segmentation-overflow'
  name: moe-expert-segmentation-overflow
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(segment|dispatch|capacity).{0,30}(buffer|limit|overflow)
  - (?i)all2all.{0,20}dispatch
  - (?i)token.{0,20}(drop|overflow).{0,30}expert
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: DeepSeek-AI (2024) - DualPipe expert segmentation vulnerable to capacity overflow attacks
- category: moe_vulnerabilities
  cwe: CWE-681
  description: Detects FP8 mixed-precision configurations in MoE models where quantization-induced rounding errors in routing
    logits cause systematic expert selection drift exploitable for adversarial steering
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-004
  message: 'Detected: moe-fp8-quantization-routing-drift'
  name: moe-fp8-quantization-routing-drift
  owasp_llm: LLM01:2025
  patterns:
  - (?i)fp8.{0,30}(quant|mixed).{0,30}(router|gate|moe)
  - (?i)(e4m3|e5m2).{0,30}(routing|expert|gate)
  - (?i)quantize.{0,20}(gate|router).{0,20}(weight|logit)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: DeepSeek-AI (2024) - FP8 quantization causes routing precision loss exploitable for expert drift
- category: moe_vulnerabilities
  cwe: CWE-770
  description: Detects configuration of complementary expert capacity limits where setting routing complement factors to extreme
    values bypasses intended load constraints
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: MOE-005
  message: 'Detected: moe-complement-expert-limit-bypass'
  name: moe-complement-expert-limit-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)n_routed_experts.{0,10}=.{0,10}\d+
  - (?i)routed_scaling_factor.{0,10}=
  - (?i)topk_group.{0,10}=.{0,10}\d+.{0,30}(expert|route)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: DeepSeek-AI (2024) - Expert group routing parameters can be misconfigured to bypass load limits
- category: moe_vulnerabilities
  cwe: CWE-330
  description: Detects node-limited expert routing where limiting experts per node creates predictable routing patterns exploitable
    for targeted expert poisoning
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-006
  message: 'Detected: moe-node-limited-routing-policy-attack'
  name: moe-node-limited-routing-policy-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)n_group.{0,10}=.{0,10}\d+.{0,30}expert
  - (?i)expert.{0,20}per.{0,20}node.{0,10}=
  - (?i)device.{0,20}limit.{0,30}(expert|route)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: DeepSeek-AI (2024) - Device-limited expert assignment creates predictable and exploitable routing
- category: moe_vulnerabilities
  cwe: CWE-400
  description: Detects expert caching strategies in MoE inference where LRU or predictive cache eviction can be manipulated
    to force cache misses on critical experts
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-007
  message: 'Detected: moe-expert-cache-eviction-poisoning'
  name: moe-expert-cache-eviction-poisoning
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(cache|lru|evict).{0,30}(policy|strateg|config)
  - (?i)(offload|swap).{0,20}expert.{0,30}(gpu|cpu|disk)
  - (?i)expert.{0,20}(prefetch|preload).{0,20}(predict|specul)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: He (2024) - ExpertFlow expert caching vulnerable to adversarial cache thrashing attacks
- category: moe_vulnerabilities
  cwe: CWE-330
  description: Detects tree-based speculative expert activation patterns where routing prediction trees can be exploited to
    trigger incorrect expert preloading
  file_types:
  - '*.py'
  id: MOE-008
  message: 'Detected: moe-token-routing-tree-prediction-exploit'
  name: moe-token-routing-tree-prediction-exploit
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(expert|routing).{0,20}(tree|trie|predict).{0,30}(activ|specul|prefetch)
  - (?i)TreePredict.{0,30}expert
  - (?i)speculative.{0,20}expert.{0,20}(load|activ)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: He (2024) - Speculative expert activation trees predictable and exploitable via crafted token sequences
- category: moe_vulnerabilities
  cwe: CWE-208
  description: Detects expert offloading configurations between GPU and CPU memory where timing differences reveal which experts
    are activated, leaking routing information
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-009
  message: 'Detected: moe-gpu-cpu-offload-timing-attack'
  name: moe-gpu-cpu-offload-timing-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(offload|transfer).{0,30}(gpu|cpu|device)
  - (?i)(gpu|cpu).{0,20}(swap|offload).{0,30}expert.{0,30}(weight|param)
  - (?i)expert_cache.{0,20}(size|limit|max)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: He (2024) - GPU-CPU expert offloading creates timing side channels revealing routing decisions
- category: moe_vulnerabilities
  cwe: CWE-770
  description: Detects dynamic token-to-expert allocation that allows unlimited token routing to a single expert without proper
    capacity limits or rate controls
  file_types:
  - '*.py'
  id: MOE-010
  message: 'Detected: moe-dynamic-token-allocation-abuse'
  name: moe-dynamic-token-allocation-abuse
  owasp_llm: LLM01:2025
  patterns:
  - (?i)dynamic.{0,20}(token|slot).{0,20}(alloc|assign).{0,30}expert
  - (?i)(adaptive|elastic).{0,20}expert.{0,20}capacity
  - (?i)token_limit.{0,10}=.{0,10}(None|0|-1|inf)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: He (2024) - Unconstrained dynamic token allocation enables expert flooding attacks
- category: moe_vulnerabilities
  cwe: CWE-287
  description: Detects expert activation threshold configurations that can be bypassed to force activation of dormant or poisoned
    experts by manipulating gating thresholds
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-011
  message: 'Detected: moe-expert-activation-threshold-bypass'
  name: moe-expert-activation-threshold-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(activ|trigger).{0,20}threshold.{0,10}=
  - (?i)gate.{0,20}(threshold|cutoff).{0,10}=.{0,10}(0\.0|0|1e-)
  - (?i)(min|max).{0,10}expert.{0,20}(activ|select)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: He (2024) - Expert activation thresholds can be set to zero enabling dormant expert exploitation
- category: moe_vulnerabilities
  cwe: CWE-284
  description: Detects expert pruning configurations that remove safety-critical experts from MoE models, potentially bypassing
    alignment and content filtering capabilities
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: MOE-012
  message: 'Detected: moe-expert-pruning-safety-bypass'
  name: moe-expert-pruning-safety-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(prune|remove|drop|skip).{0,30}expert.{0,30}(layer|index|id)
  - (?i)expert.{0,20}(pruning|skip).{0,20}(ratio|threshold|config)
  - (?i)prune_expert.{0,20}=
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Lu (2024) - Expert pruning can remove safety-aligned experts enabling alignment bypass
- category: moe_vulnerabilities
  cwe: CWE-693
  description: Detects dynamic expert skipping mechanisms where per-input skip decisions can be manipulated via crafted inputs
    to bypass security-relevant expert computations
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-013
  message: 'Detected: moe-dynamic-expert-skipping-manipulation'
  name: moe-dynamic-expert-skipping-manipulation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(dynamic|adaptive|input).{0,20}expert.{0,20}(skip|bypass|gate)
  - (?i)skip.{0,20}(threshold|ratio).{0,20}expert
  - (?i)expert.{0,20}drop.{0,20}(rate|prob).{0,10}=
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Lu (2024) - Dynamic expert skipping enables input-dependent safety expert bypass
- category: moe_vulnerabilities
  cwe: CWE-200
  description: Detects router weight analysis patterns that reveal which experts are most sensitive to weight perturbations,
    enabling targeted expert degradation attacks
  file_types:
  - '*.py'
  id: MOE-014
  message: 'Detected: moe-router-weight-sensitivity-exploit'
  name: moe-router-weight-sensitivity-exploit
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(router|gate).{0,20}(weight|sensitivity).{0,20}(analysis|matrix|rank)
  - (?i)expert.{0,20}importance.{0,20}(score|rank|metric)
  - (?i)expert.{0,20}redundancy.{0,20}(detect|analys|score)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Lu (2024) - Router weight sensitivity analysis reveals attack surfaces for expert degradation
- category: moe_vulnerabilities
  cwe: CWE-693
  description: Detects configurations where task-specific expert pruning ratios can cause expert collapse, routing all tokens
    through a minimal set of potentially compromised experts
  file_types:
  - '*.py'
  id: MOE-015
  message: 'Detected: moe-task-specific-expert-collapse'
  name: moe-task-specific-expert-collapse
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(collapse|dead|unused).{0,20}(detect|warn|monitor)
  - (?i)task.{0,20}expert.{0,20}(ratio|mapping|assign)
  - (?i)(layer|block).{0,20}expert.{0,20}(skip|prune).{0,20}(all|most)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Lu (2024) - Aggressive layer-wise pruning causes expert collapse enabling single-point compromise
- category: moe_vulnerabilities
  cwe: CWE-200
  description: Detects identification of heavy-hitter experts in MoE layers which reveals which experts handle most traffic,
    making them high-value targets for poisoning
  file_types:
  - '*.py'
  id: MOE-016
  message: 'Detected: moe-heavy-hitter-expert-identification'
  name: moe-heavy-hitter-expert-identification
  owasp_llm: LLM01:2025
  patterns:
  - (?i)heavy.{0,10}hitter.{0,20}expert
  - (?i)expert.{0,20}(usage|activation).{0,20}(frequency|count|stat)
  - (?i)most.{0,20}(used|activated|popular).{0,20}expert
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Lu (2024) - Heavy-hitter expert identification reveals high-value poisoning targets
- category: moe_vulnerabilities
  cwe: CWE-693
  description: Detects zero-computation expert configurations (copy or zero experts) in MoE architectures that bypass normal
    computation paths and can be exploited to inject unprocessed or zeroed outputs
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-017
  message: 'Detected: moe-zero-computation-expert-injection'
  name: moe-zero-computation-expert-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)zero.{0,15}(computation|comp).{0,15}expert
  - (?i)(copy|identity|passthrough).{0,15}expert
  - (?i)expert.{0,15}type.{0,10}=.{0,10}(zero|copy|identity|null)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Jin (2024) - Zero-computation experts bypass normal processing enabling output manipulation
- category: moe_vulnerabilities
  cwe: CWE-284
  description: Detects flexible routing mechanisms that allow per-token expert type selection between computation and zero-computation
    experts, enabling adversarial routing to bypass all expert processing
  file_types:
  - '*.py'
  id: MOE-018
  message: 'Detected: moe-flexible-expert-type-override'
  name: moe-flexible-expert-type-override
  owasp_llm: LLM01:2025
  patterns:
  - (?i)flex.{0,15}(expert|routing|gate).{0,20}(type|select)
  - (?i)expert.{0,10}(type|class).{0,20}(select|switch|route).{0,20}token
  - (?i)(router|gate).{0,20}expert.{0,20}type.{0,20}(mix|hybrid|flex)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Jin (2024) - Flexible expert type routing enables adversarial bypass of computation
- category: moe_vulnerabilities
  cwe: CWE-693
  description: Detects shared expert configurations in MoE models where a single shared expert processes all tokens, creating
    a single point of failure and high-value poisoning target
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-019
  message: 'Detected: moe-shared-expert-single-point-failure'
  name: moe-shared-expert-single-point-failure
  owasp_llm: LLM01:2025
  patterns:
  - (?i)shared.{0,15}expert.{0,15}(num|count|config).{0,10}=.{0,10}1
  - (?i)n_shared_expert.{0,10}=
  - (?i)shared_expert.{0,20}(forward|weight|param)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Jin (2024) - Shared experts as single point of failure enable complete model compromise
- category: moe_vulnerabilities
  cwe: CWE-330
  description: Detects Gumbel-Softmax temperature parameters in MoE routing that when set to extreme values make routing deterministic
    or random, enabling predictable expert targeting
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-020
  message: 'Detected: moe-gumbel-softmax-temperature-exploit'
  name: moe-gumbel-softmax-temperature-exploit
  owasp_llm: LLM01:2025
  patterns:
  - (?i)gumbel.{0,20}(softmax|temp|tau).{0,20}(route|gate|expert)
  - (?i)(temperature|tau).{0,10}=.{0,10}(0\.0|0|1e-|100|inf)
  - (?i)router.{0,20}temperature.{0,10}=
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Jin (2024) - Gumbel-Softmax temperature manipulation makes routing deterministic or random
- category: moe_vulnerabilities
  cwe: CWE-330
  description: Detects noise injection parameters in top-k routing mechanisms that can be exploited to add adversarial noise
    to gating decisions, altering expert selection
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-021
  message: 'Detected: moe-topk-router-noise-injection'
  name: moe-topk-router-noise-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(router|gate).{0,20}noise.{0,15}(factor|scale|std)
  - (?i)(noisy|jitter).{0,20}(gate|router|topk)
  - (?i)gate.{0,20}noise.{0,10}=
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Jin (2024) - Router noise parameters enable adversarial gating perturbation
- category: moe_vulnerabilities
  cwe: CWE-693
  description: Detects expert similarity analysis used for pruning decisions where adversarial training can make safety experts
    appear redundant and get pruned
  file_types:
  - '*.py'
  id: MOE-022
  message: 'Detected: moe-expert-similarity-based-pruning-attack'
  name: moe-expert-similarity-based-pruning-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)expert.{0,20}(similarity|distance|redundancy).{0,20}(matrix|score|metric)
  - (?i)(cosine|euclidean).{0,20}(similarity|distance).{0,20}expert
  - (?i)expert.{0,20}(cluster|merge|group).{0,20}(similar|redundant)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Zhang (2024) - Expert similarity metrics can be gamed to prune safety-critical experts
- category: moe_vulnerabilities
  cwe: CWE-330
  description: Detects knowledge diversity loss configurations that when disabled allow experts to converge to identical representations,
    creating effective single-expert vulnerability
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-023
  message: 'Detected: moe-knowledge-diversity-loss-config'
  name: moe-knowledge-diversity-loss-config
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(diversity|orthogonal).{0,20}(loss|regulariz).{0,30}expert
  - (?i)expert.{0,20}(diversity|divers).{0,20}(loss|coeff|weight).{0,10}=
  - (?i)knowledge.{0,20}diversity.{0,20}(metric|score|loss)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Zhang (2024) - Disabling diversity loss causes expert convergence reducing model robustness
- category: moe_vulnerabilities
  cwe: CWE-284
  description: Detects task-agnostic expert pruning that removes experts without evaluating safety-critical task performance,
    potentially degrading safety capabilities
  file_types:
  - '*.py'
  id: MOE-024
  message: 'Detected: moe-task-agnostic-pruning-unsafe-config'
  name: moe-task-agnostic-pruning-unsafe-config
  owasp_llm: LLM01:2025
  patterns:
  - (?i)task.{0,10}agnostic.{0,20}(prune|drop|remove).{0,20}expert
  - (?i)prune.{0,20}expert.{0,20}(without|no).{0,20}(eval|test|valid)
  - (?i)expert.{0,20}prune.{0,20}(blind|agnostic|universal)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Zhang (2024) - Task-agnostic pruning removes experts without safety evaluation
- category: moe_vulnerabilities
  cwe: CWE-653
  description: Detects pipeline parallelism configurations in MoE where expert placement across pipeline stages creates isolation
    boundaries that can be bypassed through inter-stage communication manipulation
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-025
  message: 'Detected: moe-pipeline-stage-expert-isolation-bypass'
  name: moe-pipeline-stage-expert-isolation-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)pipeline.{0,20}(stage|parallel).{0,30}expert.{0,20}(place|assign|map)
  - (?i)expert.{0,20}(parallel|pipeline).{0,20}(group|stage|config)
  - (?i)moe.{0,20}pipeline.{0,20}(stage|micro.{0,5}batch)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Chen (2023) - Pipeline stage expert isolation can be bypassed through inter-stage communication
- category: moe_vulnerabilities
  cwe: CWE-319
  description: Detects All-to-All collective communication patterns in MoE dispatch where token routing data between nodes
    can be intercepted or tampered with
  file_types:
  - '*.py'
  id: MOE-026
  message: 'Detected: moe-all-to-all-communication-intercept'
  name: moe-all-to-all-communication-intercept
  owasp_llm: LLM01:2025
  patterns:
  - (?i)all.{0,5}to.{0,5}all.{0,20}(dispatch|combine|expert)
  - (?i)(nccl|mpi).{0,20}all.{0,5}to.{0,5}all.{0,20}(token|expert)
  - (?i)expert.{0,20}(dispatch|collect).{0,20}(comm|all2all)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Chen (2023) - All-to-All expert dispatch communication vulnerable to token interception
- category: moe_vulnerabilities
  cwe: CWE-362
  description: Detects micro-batch scheduling configurations in pipeline MoE that can be exploited to create race conditions
    in expert parameter updates across pipeline stages
  file_types:
  - '*.py'
  id: MOE-027
  message: 'Detected: moe-micro-batch-expert-scheduling-attack'
  name: moe-micro-batch-expert-scheduling-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)micro.{0,5}batch.{0,20}(schedule|interleave).{0,30}expert
  - (?i)pipeline.{0,20}micro.{0,5}batch.{0,20}(expert|moe)
  - (?i)(async|overlap).{0,20}(expert|moe).{0,20}(update|grad)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Chen (2023) - Pipeline micro-batch scheduling creates race conditions in expert updates
- category: moe_vulnerabilities
  cwe: CWE-284
  description: Detects expert parallelism group configurations where modifying parallel group assignments can redirect expert
    traffic to attacker-controlled nodes
  file_types:
  - '*.py'
  - '*.yaml'
  id: MOE-028
  message: 'Detected: moe-expert-parallel-group-config-tamper'
  name: moe-expert-parallel-group-config-tamper
  owasp_llm: LLM01:2025
  patterns:
