  - (?i)personalized_encrypt(?:ion)?|custom_cipher_prompt
  file_types:
  - '*.py'
  message: CodeChameleon personalized encryption jailbreak framework detected
  description: Detects CodeChameleon (Lv 2024), which uses personalized encryption functions to transform harmful prompts
    into encrypted code that the LLM is instructed to decrypt and execute.
  remediation: Block prompts that instruct the model to decrypt/decode custom encryption schemes before processing.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
