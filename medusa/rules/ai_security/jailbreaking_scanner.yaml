- id: MEDUSA-JB-SCAN-001
  name: easyjailbreak-framework
  severity: HIGH
  category: jailbreaking
  patterns:
  - (?i)(?:from|import)\s+easyjailbreak
  - (?i)EasyJailbreak\s*\(
  file_types:
  - '*.py'
  message: EasyJailbreak unified jailbreaking framework detected
  description: Detects usage of EasyJailbreak (Zhou 2024), a unified framework for jailbreaking LLMs that integrates multiple
    attack strategies.
  remediation: Review usage context. If not authorized red teaming, remove dependency.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
