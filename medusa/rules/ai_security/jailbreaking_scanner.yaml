- id: MEDUSA-JB-SCAN-004
  name: function-calling-jailbreak-pathway
  severity: HIGH
  category: jailbreaking
  patterns:
  - (?i)(?:function|tool)_call.*(?:jailbreak|bypass|exploit)
  - (?i)(?:force_tool|override_tool|inject_tool)\s*\(
  - (?i)tool_choice\s*=\s*['"](?:any|auto|required)['"].*(?:malicious|harmful|exploit)
  file_types:
  - '*.py'
  message: Potential function calling pathway for jailbreak detected
  description: Detects patterns from Wu 2024 (Dark Side of Function Calling) where function/tool calling mechanisms are exploited
    as jailbreak pathways.
  remediation: Validate tool calls against allowlists. Implement intent verification before tool execution.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-JB-SCAN-005
  name: no-hidden-state-filtering
  severity: MEDIUM
  category: jailbreaking
  patterns:
  - (?i)openai\.(?:ChatCompletion|chat\.completions)\.create\(
  - (?i)model\.generate\(
  file_types:
  - '*.py'
  message: LLM inference without hidden state filtering defense
  description: Detects LLM inference without HSF (Qian 2024) or DETAM (Li 2025) hidden state analysis for jailbreak detection.
    Hidden state monitoring catches attacks that bypass text-level filters.
  remediation: Implement hidden state filtering (HSF) or targeted attention modification (DETAM) for jailbreak detection at
    the model internals level.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-JB-SCAN-006
  name: no-smoothllm-defense
  severity: LOW
  category: jailbreaking
  patterns:
  - (?i)(?:completion|response)\s*=\s*(?:client|model|llm)\.(?:generate|chat|complete)\(
  file_types:
  - '*.py'
  message: LLM call without SmoothLLM perturbation defense
  description: Detects LLM inference without SmoothLLM-style input perturbation defense. SmoothLLM aggregates responses from
    multiple perturbed inputs to detect adversarial suffix attacks (GCG, AutoDAN).
  remediation: Consider implementing SmoothLLM (input perturbation + aggregation) for defense against gradient-based adversarial
    suffix attacks.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-JB-SCAN-007
  name: codechameleon-encryption-framework
  severity: HIGH
  category: jailbreaking
