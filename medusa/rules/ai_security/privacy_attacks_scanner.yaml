metadata:
  source: PaperMiner/2024-12-21_privacy_attacks
  extraction_date: '2026-02-18'
  papers_analyzed: 58
  attacks_identified: 56
  defenses_identified: 17
  benchmarks:
  - MIMIR
  - WikiMIA
  - AUC@TPR1%FPR
  - HealthcareMagic
  - CIFAR-10/100
  - HumanEval
  consolidated: true
  source_files:
  - privacy_attacks_scanner.yaml
  - privacy_attacks_2025_scanner.yaml
rules:
- id: MEDUSA-PA-SCAN-001
  name: carlini-extraction-framework
  severity: critical
  category: privacy_attacks
  subcategory: training_data_extraction
  patterns:
  - (?i)(?:from|import)\s+(?:ml_privacy_meter|extraction_framework)
  - (?i)(?:zlib_entropy|zlib_compression)\s*[=(\[]
  - (?i)perplexity_filter\s*[=(\[]
  - (?i)(?:generate_and_filter|sample_and_filter)\s*\(.*(?:perplexity|zlib)
  file_types:
  - '*.py'
  message: Carlini training data extraction framework detected (perplexity/Zlib filtering)
  description: Detects the Carlini (2020/2021) extraction attack that generates text samples and filters them using perplexity
    thresholds and Zlib entropy calibration to identify verbatim memorized text including PII and UUIDs from GPT-2 class models.
  remediation: Implement Goldfish token masking or Selective Language Modeling (SLM) to prevent verbatim memorization. Apply
    data deduplication before training. Monitor generation endpoints for high-volume sampling.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Carlini et al. (2020, 2021)
- id: MEDUSA-PA-SCAN-002
  name: ethicist-soft-prompt-extraction
  severity: high
  category: privacy_attacks
  subcategory: training_data_extraction
  patterns:
  - (?i)(?:from|import)\s+ethicist
  - (?i)ETHICIST\s*\(
  - (?i)loss_smoothed_soft_prompt\s*[=(\[]
  - (?i)calibrated_confidence_estimation\s*[=(\[]
  - (?i)soft_prompt.*(?:extraction|memorized|verbatim)
  file_types:
  - '*.py'
  message: ETHICIST soft-prompt-based training data extraction detected
  description: Detects ETHICIST (Zhang 2023), which uses loss-smoothed soft prompting combined with calibrated confidence
    estimation to extract memorized training data from pre-trained language models without knowing specific training examples.
  remediation: Apply differential privacy (DP-SGD) during fine-tuning. Implement output filters to detect verbatim text repetition
    in generations. Deploy Erase-and-Check output inspection.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Zhang et al. (2023)
- id: MEDUSA-PA-SCAN-003
  name: special-characters-divergence-attack
  severity: high
  category: privacy_attacks
  subcategory: training_data_extraction
  patterns:
  - (?i)special_char(?:acter)?s?_attack\s*[=(\[]
  - (?i)sca_trigger\s*[=(\[]
  - (?i)divergence_attack\s*\(
  - (?i)repetition_penalty\s*=\s*(?:0\.0|0\b|None)
  file_types:
  - '*.py'
  message: Special Characters Attack (SCA) or Divergence Attack payload configuration detected
  description: Detects the Special Characters Attack (Bai 2024) which forces LLMs into training-data divergence mode via injected
    special characters, and the Divergence Attack (Nasr 2023) which bypasses alignment to achieve 150x higher extraction rates
    from ChatGPT-class models by disabling repetition penalties.
  remediation: Enforce minimum repetition_penalty values. Filter inputs containing anomalous special-character sequences.
    Apply Erase-and-Check output inspection.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Bai et al. (2024); Nasr et al. (2023)
- id: MEDUSA-PA-SCAN-004
  name: recollect-and-rank-extraction
  severity: high
  category: privacy_attacks
  subcategory: training_data_extraction
  patterns:
  - (?i)(?:from|import)\s+(?:recollect_rank|rr_attack)
  - (?i)recollection_prompt\s*[=(\[]
  - (?i)reference_model_ranking\s*[=(\[]
  - (?i)(?:recollect|reconstruct)_and_rank\s*\(
  file_types:
  - '*.py'
  message: Recollect-and-Rank (R.R.) fine-tuned model extraction attack detected
  description: Detects the R.R. (Recollect and Rank) attack (Meng 2025), which targets fine-tuned LLMs by first eliciting
    recollection prompts and then using a reference model to rank candidate completions, recovering fine-tuning data with
    high precision.
  remediation: Apply DP-SGD during fine-tuning. Avoid fine-tuning on sensitive or PII-containing datasets. Implement DuoLearn
    dynamic token unlearning.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Meng et al. (2025)
- id: MEDUSA-PA-SCAN-005
  name: shadow-model-mia-framework
  severity: high
  category: privacy_attacks
  subcategory: membership_inference
  patterns:
  - (?i)(?:shadow_models?|num_shadows)\s*=\s*\d+
  - (?i)(?:from|import)\s+(?:ml_privacy_meter|mia_framework|shadow_model)
  - (?i)ShadowModel(?:Attack)?\s*\(
  - (?i)train_shadow_models?\s*\(
  file_types:
  - '*.py'
  message: Shadow model Membership Inference Attack (MIA) framework detected
  description: Detects the Shokri (2017) shadow model MIA framework and its derivatives (LiRA, GOTCHA). Shadow models mimic
    target model training to build a binary membership classifier. LiRA (Carlini 2022) achieves AUC 56.73% on CIFAR-10; GOTCHA
    (Yang 2024) targets code models.
  remediation: Train with DP-SGD to bound membership signal. Apply Adversarial Neuron Pruning (ANP). Monitor for repeated
    inference patterns on the same data point.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Shokri et al. (2017); Carlini et al. (2022)
- id: MEDUSA-PA-SCAN-006
  name: min-k-prob-mia
  severity: high
  category: privacy_attacks
  subcategory: membership_inference
  patterns:
  - (?i)min_k(?:_percent)?(?:_prob|_pp|_plus_plus)?\s*[=(\[]
  - (?i)(?:from|import)\s+(?:mink|min_k_prob|mink_pp)
  - (?i)MinKProb\s*\(|MinKPlusPlus\s*\(
  - (?i)k_percent_lowest_tokens\s*[=(\[]
  file_types:
  - '*.py'
  message: Min-K% Prob or Min-K%++ Membership Inference Attack implementation detected
  description: 'Detects Min-K% Prob (Shi 2023) and its improved variant Min-K%++ (Zhang 2024). Min-K% averages the k%-lowest-probability
    tokens as a membership signal (TPR@1%FPR: 0.678); Min-K%++ normalizes log-probabilities against token frequency for improved
    accuracy (TPR@1%FPR: 0.691) without requiring reference models.'
  remediation: Apply DP-SGD or L2 regularization to reduce memorization. Use Knowledge Distillation to transfer generalization
    without per-sample memorization.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Shi et al. (2023); Zhang et al. (2024)
- id: MEDUSA-PA-SCAN-007
  name: lira-likelihood-ratio-attack
  severity: high
  category: privacy_attacks
  subcategory: membership_inference
  patterns:
  - (?i)(?:from|import)\s+lira
  - (?i)LiRA\s*\(|likelihood_ratio_attack\s*\(
  - (?i)log_likelihood_distribution\s*[=(\[]
  - (?i)lira_score\s*[=(\[]
  file_types:
  - '*.py'
  message: LiRA (Likelihood Ratio Attack) membership inference implementation detected
  description: Detects LiRA (Carlini 2022), which trains shadow models to estimate the distribution of log-likelihood scores
    for members vs non-members, performing a formal likelihood ratio test. AUC 56.73% CIFAR-10. The U-LiRA variant (Maheri
    2025) extends this to machine unlearning verification with AUC 0.938.
  remediation: Apply DP-SGD training. Consider WARP defense (Maheri 2025) which reduces U-LiRA AUC from 0.938 to 0.907 for
    unlearning verification attacks.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Carlini et al. (2022); Maheri et al. (2025)
- id: MEDUSA-PA-SCAN-008
  name: neighbor-attack-perturbation
  severity: medium
  category: privacy_attacks
  subcategory: membership_inference
  patterns:
  - (?i)neighbor_attack\s*[=(\[]
  - (?i)NeighborAttack\s*\(
  - (?i)generate_synthetic_neighbors\s*\(
  - (?i)perplexity_vs_neighbors\s*[=(\[]
  - (?i)icp_mia\s*[=(\[]|IcpMia\s*\(
  file_types:
  - '*.py'
  message: Neighbor Attack or ICP-MIA membership inference implementation detected
  description: 'Detects the Neighbor Attack (Mattern 2023), which compares a sample''s perplexity to synthetically generated
    neighbors to infer membership (TPR@1%FPR: 0.599). Also detects ICP-MIA (Lu 2025) which uses in-context probing for TPR@1%FPR
    0.942 on clinical datasets.'
  remediation: Restrict raw token probability access via APIs. Return only top-k tokens instead of full distributions. Apply
    adversarial regularization during training.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Mattern et al. (2023); Lu et al. (2025)
- id: MEDUSA-PA-SCAN-009
  name: budgetleak-side-channel
  severity: high
  category: privacy_attacks
  subcategory: membership_inference
  patterns:
  - (?i)budget_leak\s*[=(\[]|BudgetLeak\s*\(
  - (?i)token_budget_side_channel\s*[=(\[]
  - (?i)max_tokens\s*=.*(?:range|arange|linspace)\s*\(
  - (?i)s2mia\s*[=(\[]|S2MIA\s*\(|dc_mia\s*[=(\[]
  file_types:
  - '*.py'
  message: BudgetLeak token-budget side-channel or RAG MIA tool detected
  description: Detects BudgetLeak (Li 2025), which infers RAG system membership by exploiting the token-budget truncation
    side channel - varying max_tokens to observe output length changes signals whether a document is retrieved. Also detects
    S2MIA (split-segment) and DC-MIA (multi-reference) RAG membership inference tools.
  remediation: Normalize output lengths regardless of retrieval depth. Do not expose token budget metadata. Apply constant-time
    response padding for RAG endpoints.
  owasp_llm: LLM06:2025
  cwe: CWE-203
  source_paper: Li et al. (2025)
- id: MEDUSA-PA-SCAN-010
  name: fredrikson-model-inversion
  severity: critical
  category: privacy_attacks
  subcategory: model_inversion
  patterns:
  - (?i)(?:from|import)\s+(?:model_inversion|fredrikson_attack)
  - (?i)ModelInversion\s*\(
  - (?i)confidence_score_inversion\s*[=(\[]
  - (?i)invert_model\s*\(.*(?:confidence|logit|prob)
  file_types:
  - '*.py'
  message: Fredrikson model inversion attack setup detected
  description: Detects the Fredrikson (2015) model inversion attack which exploits confidence scores to reconstruct private
    training features (e.g., facial attributes, genomic features). Gradient-descent optimization over the input space guided
    by model confidence is the core technique.
  remediation: 'Apply output perturbation: add calibrated noise to confidence scores. Restrict API access to hard labels (argmax)
    rather than soft probabilities. Use knowledge distillation to produce a less-memorized student model.'
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Fredrikson et al. (2015)
- id: MEDUSA-PA-SCAN-011
  name: dlg-idlg-gradient-leakage
  severity: critical
  category: privacy_attacks
  subcategory: model_inversion
  patterns:
  - (?i)(?:from|import)\s+(?:dlg|idlg|gradient_leakage|grad_inversion)
  - (?i)DLG\s*\(|iDLG\s*\(
  - (?i)dummy_(?:input|data|gradient)\s*=\s*torch\.(?:randn|rand|zeros)
  - (?i)gradient_matching\s*\(
  - (?i)reconstruct_from_gradients?\s*\(
  file_types:
  - '*.py'
  message: DLG/iDLG gradient inversion attack implementation detected
  description: Detects DLG (Zhu 2019), which optimizes dummy inputs to match shared gradients to reconstruct private training
    data, and iDLG (Zhao 2020) which analytically extracts ground-truth labels from gradient signs before input reconstruction.
    Used in federated learning to steal client data.
  remediation: Apply gradient compression or differential privacy (DP-SGD) before gradient sharing. Use secure aggregation
    protocols. Add Gaussian noise to shared gradients.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Zhu et al. (2019); Zhao et al. (2020)
- id: MEDUSA-PA-SCAN-012
  name: grnn-generative-gradient-regression
  severity: high
  category: privacy_attacks
  subcategory: model_inversion
  patterns:
  - (?i)(?:from|import)\s+grnn
  - (?i)GRNN\s*\(
  - (?i)generative_regression_nn\s*[=(\[]
  - (?i)gradient_to_(?:image|data|sample)\s*\(
  - (?i)generator\.(?:reconstruct|invert).*gradient
  file_types:
  - '*.py'
  message: GRNN generative regression gradient inversion attack detected
  description: Detects GRNN (Ren 2021), which trains a generative neural network to map gradient vectors back to private training
    samples using regression. Unlike optimization-based DLG, GRNN learns a direct gradient-to-data mapping, enabling fast
    batch reconstruction in federated learning.
  remediation: Use secure aggregation with homomorphic encryption or secret sharing. Apply gradient sparsification to limit
    information per update. Deploy FL with local DP noise addition.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Ren et al. (2021)
- id: MEDUSA-PA-SCAN-013
  name: inverting-gradients-cosine-optimization
  severity: high
  category: privacy_attacks
  subcategory: model_inversion
  patterns:
  - (?i)(?:from|import)\s+(?:inverting_gradients|geiping_attack)
  - (?i)InvertingGradients\s*\(|GradientInversion\s*\(
  - (?i)cosine_distance_loss\s*[=(\[]
  - (?i)total_variation.*gradient_(?:match|optim)
  - (?i)tv_prior\s*[=(\[].*gradient_reconstruction
  file_types:
  - '*.py'
  message: Inverting Gradients (Geiping) cosine-distance optimization attack detected
  description: Detects the Inverting Gradients attack (Geiping 2020), which uses cosine similarity as the gradient-matching
    objective combined with Total Variation (TV) image priors to reconstruct high-resolution private training images from
    shared gradients in federated learning.
  remediation: 'Apply gradient noise (Gaussian DP) before sharing. Use gradient compression: Top-K sparsification significantly
    degrades reconstruction quality. Consider Secure Aggregation to prevent server-side gradient access.'
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Geiping et al. (2020)
- id: MEDUSA-PA-SCAN-014
  name: trap-weights-gradient-reconstruction
  severity: critical
  category: privacy_attacks
  subcategory: gradient_leakage
  patterns:
  - (?i)(?:from|import)\s+trap_weights
  - (?i)TrapWeights\s*\(
  - (?i)malicious_aggregator\s*[=(\[]
  - (?i)weight_manipulation.*gradient_leak
  - (?i)orthogonal.*weight.*gradient.*leak
  file_types:
  - '*.py'
  message: Trap Weights federated learning gradient reconstruction attack detected
  description: Detects the Trap Weights attack (Boenisch 2021/2023) where a malicious FL server manipulates the global model
    weights (specifically FC layer biases) so that client gradient updates analytically reveal the exact private training
    inputs - achieving perfect reconstruction without optimization.
  remediation: Use Byzantine-robust aggregation rules (Krum, Trimmed Mean). Verify global model updates from the server before
    local training. Apply client-side gradient clipping and noise. Do not trust server-provided model weights unconditionally.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Boenisch et al. (2021, 2023)
- id: MEDUSA-PA-SCAN-015
  name: cs-mia-temporal-confidence-fl
  severity: high
  category: privacy_attacks
  subcategory: gradient_leakage
  patterns:
  - (?i)(?:from|import)\s+cs_mia
  - (?i)CS_MIA\s*\(|CsMia\s*\(
  - (?i)temporal_confidence_(?:evolution|sequence)\s*[=(\[]
  - (?i)confidence_across_(?:rounds|epochs)\s*[=(\[]
  - (?i)fl_round_confidence\s*=.*(?:append|stack|cat)
  file_types:
  - '*.py'
  message: CS-MIA federated learning temporal confidence side-channel attack detected
  description: Detects CS-MIA (Gu 2022), which exploits the temporal evolution of prediction confidence scores across FL training
    rounds as a membership signal. Member samples show a characteristic confidence trajectory that non-members do not, achieving
    AUC 0.93 on CIFAR-100 without accessing model weights or gradients.
  remediation: Limit the number of FL rounds exposed to clients. Randomize round participation to obscure temporal membership
    signals. Apply DP to confidence score outputs. Use local training for private datasets.
  owasp_llm: LLM06:2025
  cwe: CWE-203
  source_paper: Gu et al. (2022)
- id: MEDUSA-PRIV-SCAN-016
  name: divergence-attack-aligned-llm-data-extraction
  severity: CRITICAL
  category: training_data_extraction
  patterns:
  - (?i)(divergence.attack.{0,40}(chatgpt|aligned.llm|extraction|training.data))
  - (?i)(150x.{0,20}extraction|150.times.{0,20}higher.extraction)
  - (?i)(force.{0,20}divergence.{0,40}(training.data|memorized|verbatim|pii).{0,40}(extract|leak|output))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Divergence Attack — 150x higher training data extraction rate from aligned LLMs by forcing divergence
    from normal generation'
  description: Divergence Attack (Nasr 2023) achieves 150x higher training data extraction rate from aligned LLMs (ChatGPT)
    by forcing the model to diverge from its standard generation pattern. By exploiting the model's tendency to reproduce
    memorized content when diverted from normal behavior, verbatim PII and training data can be extracted.
  remediation: Monitor for prompts designed to disrupt normal generation patterns. Implement output filtering for personally
    identifiable information and training data verbatim reproduction. Apply differential privacy to limit memorization-based
    extraction.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-017
  name: special-characters-attack-llm-divergence-induction
  severity: HIGH
  category: training_data_extraction
  patterns:
  - (?i)(special.characters.attack|sca.{0,20}(llm|extraction|divergence))
  - (?i)(special.char.{0,40}(force.divergence|training.data|memorized.content))
  - (?i)([^\x20-\x7E]{3,}.{0,100}(extract|leak|training|memorized|verbatim))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Special Characters Attack (SCA) — forcing LLM divergence via special characters to extract memorized
    training data'
  description: Special Characters Attack (Bai 2024) targets commercial and open-source LLMs by injecting special characters
    that force the model to diverge from safe generation patterns, exposing memorized training data. Works across multiple
    model types including commercial LLMs with safety alignment.
  remediation: Normalize and filter special character sequences in inputs before LLM processing. Implement output monitoring
    for training data verbatim reproduction patterns. Apply memorization detection to LLM outputs.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-018
  name: tag-tab-keyword-loglikelihood-mia
  severity: HIGH
  category: membership_inference
  patterns:
  - (?i)(tag.and.tab|tag.tab.{0,30}(mia|membership.inference|log.likelihood))
  - (?i)(keyword.log.likelihood.{0,40}(membership|inference|attack))
  - (?i)(keyword.likelihood.{0,40}(calibrat|signal|membership).{0,40}(training.data|in.training))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Tag&Tab keyword log-likelihood membership inference — exploiting keyword probability signals to determine
    training set membership (+5.3-17.6% over SOTA)'
  description: Tag&Tab (Antebi 2025) uses keyword-based log-likelihood analysis to perform membership inference attacks. By
    analyzing the model's probability distributions over tagged/tabulated keywords, it achieves +5.3-17.6% improvement over
    SOTA MIA methods. Targets LLMs to determine which documents were included in training data.
  remediation: Implement differential privacy during LLM training to reduce membership signal leakage. Apply output perturbation
    to mask per-token probability distributions. Monitor for systematic membership inference probing patterns in API usage.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-019
  name: icp-mia-in-context-probing-high-accuracy
  severity: HIGH
  category: membership_inference
  patterns:
  - (?i)(icp.mia|in.context.prob.{0,20}membership.inference|icp.{0,20}mia.{0,20}healthcare)
  - (?i)(in.context.prob.{0,40}(training.data|membership|in.training).{0,40}(inference|detect|signal))
  - (?i)(context.window.{0,40}membership.inference|in.context.{0,20}mia)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: ICP-MIA In-Context Probing membership inference — highest accuracy MIA (TPR@1%FPR: 0.942 on HealthcareMagic)'
  description: 'ICP-MIA (Lu 2025) uses in-context probing to perform membership inference attacks, achieving TPR@1%FPR: 0.942
    on HealthcareMagic datasets — the highest reported accuracy for LLM MIA. Leverages the model''s in-context learning capabilities
    to reveal membership signals from training data.'
  remediation: Apply strict differential privacy guarantees during training on sensitive medical/private datasets. Implement
    rate limiting and anomaly detection for systematic in-context probing patterns. Monitor API usage for MIA-characteristic
    query patterns.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-020
  name: min-k-prob-low-token-probability-mia
  severity: MEDIUM
  category: membership_inference
  patterns:
  - (?i)(min.k.prob|min.k%.{0,20}prob|minimum.k.percent.probability)
  - (?i)(lowest.probability.token.{0,40}(membership.inference|mia|training.data.detect))
  - (?i)(k.percent.lowest.{0,20}(token|probability).{0,40}(average|membership.signal|inference))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Min-K% Prob membership inference — averaging k% lowest-probability tokens as membership signal (TPR@1%FPR:
    0.678)'
  description: 'Min-K% Prob (Shi 2023) performs membership inference by averaging the k% lowest-probability tokens in a text
    sample. Non-training samples tend to have lower min-k% probabilities than training samples. Achieves TPR@1%FPR: 0.678
    on LLM membership detection. Min-K%++ variant (Zhang 2024) uses normalized log-probs for 0.691 TPR.'
  remediation: Apply token-level differential privacy to reduce per-token probability signal leakage. Implement response calibration
    to obscure membership signals in token distributions.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-021
  name: recall-relative-loglikelihood-change-mia
  severity: MEDIUM
  category: membership_inference
  patterns:
  - (?i)(recall.{0,20}mia|relative.log.likelihood.change.{0,40}membership)
  - (?i)(recall.{0,20}(relative|ratio).{0,30}log.likelihood.{0,40}(membership|training.data))
  - (?i)(relative.likelihood.{0,40}(membership.inference|in.training|training.set))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: ReCaLL relative log-likelihood change MIA — measuring relative likelihood change as membership signal
    (TPR@1%FPR: 0.718)'
  description: 'ReCaLL (Xie 2024) measures the relative log-likelihood change between a base model and the target model as
    a membership inference signal. This relative calibration reduces false positives from naturally common sequences. TPR@1%FPR:
    0.718, outperforming absolute likelihood thresholds.'
  remediation: Train with differential privacy and apply output perturbation to reduce relative likelihood signals. Consider
    model ensembling to reduce per-sample membership signal leakage.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-PRIV-SCAN-022
  name: rag-membership-inference-s2mia-dc-mia-mba
  severity: HIGH
  category: rag_privacy_attack
  patterns:
  - (?i)(s2mia|dc.mia|split.segment.{0,20}mia|multi.reference.likelihood.{0,20}rag)
  - (?i)(rag.{0,20}membership.inference|rag.{0,20}mia.{0,40}(split|mask|reference))
  - (?i)(token.masking.{0,40}(rag|retrieval.system).{0,40}(membership|inference|analysis))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: RAG Membership Inference Attack (S2MIA/DC-MIA/MBA) — inferring which documents are in RAG knowledge
    base through response analysis'
  description: 'RAG-specific membership inference attacks: S2MIA (Li 2025) uses split-segment membership signals; DC-MIA (Wang
    2025) uses multi-reference likelihood ratio testing; MBA (Liu 2025) uses token masking analysis. All target plug-and-play
