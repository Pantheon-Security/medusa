metadata:
  source: PaperMiner/2024-12-21_prompt_injection_attacks
  extraction_date: '2026-02-18'
  papers_analyzed: 43
  attacks_identified: 38
  defenses_identified: 18
  benchmarks:
  - AgentDojo
  - InjecAgent
  - BIPIA
  - NotInject
  - LLMail-Inject
  - HarmBench
  - ASB
  - HackAPrompt
  - VisualWebArena-Adv
  consolidated: true
  source_files:
  - prompt_injection_scanner.yaml
  - prompt_injection_2025_scanner.yaml
rules:
- id: MEDUSA-PI-SCAN-001
  name: missing-prompt-input-sanitization
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)(?:user_input|user_message|prompt)\s*=\s*(?:request|input|args)\.
  - (?i)messages\.append\(\{["']role["']:\s*["']user["'],\s*["']content["']:\s*(?:user_input|raw_input)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: User input passed directly to LLM without sanitization
  description: Detects code that passes raw user input directly to LLM API calls without any sanitization, validation, or
    injection filtering. This is the root cause of prompt injection vulnerabilities (CWE-20).
  remediation: Validate and sanitize user input before passing to LLM. Use input guardrails (InjecGuard, PromptScreen) or
    structured queries (StruQ) to separate instructions from data.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-PI-SCAN-002
  name: missing-system-data-boundary
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)f["'].*\{(?:user_input|context|retrieved|document)\}.*["']
  - (?i)prompt\s*=\s*f["'].*\{(?:context|data|document|tool_output)\}
  - (?i)\.format\(.*(?:user_input|context|retrieved_text|tool_result)
  file_types:
  - '*.py'
  message: External data interpolated into prompt without boundary markers
  description: Detects prompts where external data (user input, retrieved documents, tool outputs) is interpolated without
    clear instruction-data boundary markers. Missing boundaries enable indirect prompt injection (Yi et al. 2023).
  remediation: Use explicit delimiters (e.g., <<<data>>>) or special tokens to mark data boundaries. Consider StruQ/SecAlign
    fine-tuning for robust boundary enforcement.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-PI-SCAN-003
  name: raw-tool-output-to-llm
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)tool_(?:output|result|response)\s*=.*\n.*messages\.append
  - (?i)(?:tool_result|function_output)\s*=.*\n.*(?:prompt|content)\s*[+=]
  - (?i)(?:api_response|web_content|search_result)\.(?:text|json|content).*(?:prompt|messages)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Raw tool/API output passed directly to LLM without parsing
  description: Detects code that feeds raw tool outputs directly into LLM prompts without parsing or sanitization. This enables
    indirect prompt injection via tool results (Yu et al. 2026 - Tool Result Parsing Defense).
  remediation: 'Implement tool result parsing: extract only required data fields before passing to LLM. Use ParseData+CheckTool
    pattern (Yu et al. 2026).'
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-PI-SCAN-004
  name: no-injection-classifier
  severity: MEDIUM
  category: prompt_injection
  patterns:
  - (?i)openai\.(?:ChatCompletion|chat\.completions)\.create\(
  - (?i)anthropic\.(?:Anthropic|Client)\(\)
  - (?i)(?:completion|chat)\s*=\s*(?:client|model|llm)\.
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: LLM API call without pre-flight injection detection
  description: 'Detects LLM API calls without evidence of pre-flight prompt injection detection (no InjecGuard, PromptScreen,
    ZEDD, or similar classifier in the call chain). Note: This is a heuristic - verify that a classifier exists elsewhere
    in the pipeline.'
  remediation: 'Add a prompt injection classifier before LLM calls. Options: InjecGuard (DeBERTa, 83.48% accuracy), PromptScreen
    (TF-IDF+SVM, 93.4% accuracy, 10x faster), or ZEDD (embedding drift, >93% accuracy).'
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-PI-SCAN-005
  name: no-output-guard
  severity: MEDIUM
  category: prompt_injection
  patterns:
  - (?i)(?:response|completion|result)\.(?:choices|content|text)\[0\]
  - (?i)return\s+(?:response|completion)\.(?:content|text|message)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: LLM response returned without output validation
  description: Detects LLM response content being returned or used without output validation/guard checking. Missing output
    guards allow system prompt leakage, PII exposure, and credential leaks in responses.
  remediation: Add output guards to check for system prompt leakage, PII, credentials, and injection success markers before
    returning LLM responses. Use multi-agent defense pipeline (Hossain et al. 2025) with Guard agent.
  owasp_llm: LLM07:2025
  cwe: CWE-1426
- id: MEDUSA-PI-SCAN-006
  name: agent-no-tool-call-validation
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)tool_call\s*=.*\n.*(?:execute|run|call)\(
  - (?i)(?:function_call|action)\s*=\s*(?:response|llm_output)\.
  - (?i)eval\(.*(?:tool|function|action).*\)
  file_types:
  - '*.py'
  - '*.js'
  message: Agent executes tool calls without validation against user intent
  description: Detects agent code that executes tool calls from LLM output without validating them against the original user
    intent. This enables indirect prompt injection to trigger unauthorized tool use (MELON defense missing). Per SUPERVISOR
    (Wu et al. 2026), both environment and intention consistency checks are needed.
  remediation: Implement MELON-style masked re-execution comparison or SUPERVISOR environment/intention consistency checks
    before executing tool calls.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-PI-SCAN-007
  name: agent-no-permission-check
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:send_email|delete|write_file|execute|transfer|payment).*(?:tool|function|action)
  - '(?i)def\s+(?:execute_tool|run_action|call_function)\s*\(.*\)\s*:'
  file_types:
  - '*.py'
  message: Sensitive agent action without permission level check
  description: Detects agent tools/actions that perform sensitive operations (email, delete, write, execute, payment) without
    permission level checks. SUPERVISOR defense (Wu et al. 2026) uses L0/L1/L2 permission levels.
  remediation: Implement tiered permission levels (L0=read-only, L1=limited-write, L2=full-access) for agent tools. Require
    explicit user confirmation for L2 actions.
  owasp_llm: LLM01:2025
  cwe: CWE-269
- id: MEDUSA-PI-SCAN-008
  name: rag-no-retrieval-sanitization
  severity: HIGH
  category: rag_security
  patterns:
  - (?i)(?:retrieved|chunks|documents?)\s*=\s*(?:vectordb|chroma|pinecone|weaviate|qdrant)\.
  - (?i)(?:retriever|search)\.(?:query|search|similarity_search)\(.*\)\s*\n.*(?:prompt|context)
  file_types:
  - '*.py'
  message: RAG retrieval results passed to LLM without content sanitization
  description: Detects RAG patterns where retrieved documents are passed directly to the LLM context without sanitization.
    This enables indirect prompt injection via poisoned documents (TrojanRAG - Cheng et al.).
  remediation: Sanitize retrieved content before adding to LLM context. Use Mixture of Encodings (Zhang et al. 2025) or CachePrune
    (Wang et al. 2025) for robust defense.
  owasp_llm: LLM08:2025
  cwe: CWE-20
- id: MEDUSA-PI-SCAN-009
  name: web-agent-no-content-filter
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:page|web|html)_content\s*=.*(?:get|fetch|request)\(
  - (?i)(?:accessibility_tree|dom_text|page_text)\s*=.*\n.*(?:prompt|messages|llm)
  - (?i)(?:browser|playwright|selenium)\..{0,50}(?:text_content|inner_text|get_text)
  file_types:
  - '*.py'
  - '*.js'
  message: Web content fed to agent LLM without injection filtering
  description: Detects web agent code that feeds page content (HTML, accessibility tree) to LLM without filtering for embedded
    injection payloads. This enables IPI via HTML accessibility tree (Johnson et al. 2025) and AGENTBAIT social engineering
    (Wu et al. 2026).
  remediation: Filter web content before feeding to agent LLM. Strip hidden elements, check for known injection patterns,
    and implement SUPERVISOR-style environment consistency checks.
  owasp_llm: LLM01:2025
  cwe: CWE-79
- id: MEDUSA-PI-SCAN-010
  name: missing-instruction-data-delimiter
  severity: MEDIUM
  category: prompt_injection
  patterns:
  - (?i)(?:system_prompt|system_message).*(?:user_input|context|data).*(?:without|no).*(?:delimiter|boundary|separator)
  file_types:
  - '*.py'
  - '*.js'
  message: System prompt and data mixed without delimiters
  description: Detects configurations where system prompts and external data are concatenated without delimiters. Spotlighting/Delimiting
    (Hines et al. 2024) and StruQ (Chen et al. 2024) both require clear boundaries.
  remediation: 'Use explicit delimiters between system instructions and external data. Best: StruQ-style special tokens with
    fine-tuned model. Minimum: XML tags or <<< >>> delimiters.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-PI-SCAN-011
  name: chat-template-role-validation-missing
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)(?:messages|conversation)\.append\(\{.*["']role["'].*["']content["'].*\}\)
  - (?i)for\s+.*in\s+(?:messages|conversation).*\{["']role["']
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Chat message construction without role validation
  description: Detects chat message list construction without validating that role values come from a trusted whitelist. ChatInject
    (Chang et al. 2025) exploits this by injecting forged role tags into conversation history.
  remediation: Validate role values against whitelist ['system', 'user', 'assistant']. Strip any role-like tokens from user/retrieved
    content before adding to message list.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-PI-SCAN-012
  name: no-multi-agent-defense
  severity: LOW
  category: prompt_injection
  patterns:
  - (?i)(?:agent|assistant|bot)\s*=\s*(?:Agent|Assistant|LLMAgent)\(
  file_types:
  - '*.py'
  message: Agent instantiation without multi-agent defense pipeline
  description: Detects agent instantiation without evidence of a multi-agent defense pipeline. Hossain et al. 2025 achieved
    100% mitigation with Coordinator+Guard pattern.
  remediation: Consider implementing a multi-agent defense pipeline with Coordinator (pre-execution classification) and Guard
    (post-generation validation) agents.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-PI-SCAN-013
  name: topicattack-fabricated-conversation-transition
  severity: HIGH
  category: indirect_prompt_injection
  patterns:
  - (?i)(topicattack|topic.attack).{0,60}(inject|transition|fabricat|shift)
  - (?i)(fabricat.{0,20}(conversation|dialogue|chat|history).{0,40}(transition|gradual|shift))
  - (?i)(\[user\].*\[assistant\].*\[instruction\]|fabricated.dialogue.history.{0,40}inject)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: TopicAttack fabricated conversation transition — gradually shifts topic to injected instruction via
    fake dialogue history (>90% ASR)'
  description: TopicAttack (Chen et al. 2025) fabricates a conversational transition that gradually shifts topic from original
    context toward the injected instruction. Uses fake dialogue history pattern [user]...[assistant]...[instruction]... to
    simulate natural conversation flow. Achieves >90% ASR in most cases.
  remediation: Apply context integrity verification — detect fabricated dialogue history in untrusted inputs. Validate that
    conversation history matches authenticated session records. Implement injection detection for fabricated role-transition
    patterns.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-014
  name: reasoning-interruption-thinking-stopped-attack
  severity: HIGH
  category: reasoning_llm_attack
  patterns:
  - (?i)(reasoning.interrupt|thinking.stopped|thinking.stop.vulnerability)
  - (?i)(interrupt.{0,20}(chain.of.thought|reasoning|thinking|cot).{0,40}(deepseek|reasoning.model|r1))
  - (?i)(break.{0,20}(reasoning.flow|thinking.chain|cot.process).{0,40}(inject|exploit|attack))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Reasoning Interruption Attack — exploiting ''thinking-stopped'' vulnerability in reasoning LLMs (88%
    ASR on DeepSeek-R1)'
  description: Reasoning Interruption Attack (Cui et al. 2025) exploits the 'thinking-stopped' vulnerability in reasoning
    LLMs like DeepSeek-R1. Interferes with the chain-of-thought process causing empty or malformed responses. Simple arithmetic
    tasks or structural tokens used to break reasoning flow. 88% ASR on multiplication tasks.
  remediation: Implement reasoning chain completeness validation — detect abruptly terminated CoT sequences. Apply structural
    token sanitization in reasoning model inputs. Monitor for unexpected empty responses from reasoning models correlated
    with unusual input patterns.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-015
  name: ipi-html-accessibility-tree-web-agent
  severity: HIGH
  category: web_agent_injection
  patterns:
  - (?i)(accessibility.tree.{0,40}inject|html.accessibility.{0,40}(inject|attack|adversarial))
  - (?i)(browser.gym|web.agent.{0,40}(accessibility|html.element|modal|hidden))
  - (?i)(adversarial.{0,20}(aria|modal|hidden.element|html.attribute).{0,40}(inject|trigger|activate).{0,40}(web.agent|llm))
  file_types:
  - '*.html'
  - '*.py'
  - '*.js'
  message: 'Detected: IPI via HTML Accessibility Tree — adversarial triggers embedded in HTML parsed into accessibility tree
    for web agent injection (≥83% ASR)'
  description: IPI via HTML Accessibility Tree (Johnson et al. 2025) embeds adversarial triggers in webpage HTML elements
    parsed into the accessibility tree used by LLM web agents (Browser Gym, Llama-3.1). Hidden modals, ARIA attributes, and
    optimized adversarial strings in HTML elements activate injection. ≥83% ASR (lowest observed).
  remediation: Apply semantic safety analysis to accessibility tree content before LLM processing. Implement adversarial string
    detection for accessibility attributes (aria-label, aria-description). Sanitize HTML elements for injection patterns before
    passing to web agent LLM.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-016
  name: agentbait-social-engineering-webpage-lure
  severity: HIGH
  category: social_engineering_injection
  patterns:
  - (?i)(agentbait|agent.bait).{0,60}(web.agent|lure|social.engineer)
  - (?i)(please.enter.your.id|enter.your.id.number|your.id.number.is.required).{0,100}(web.agent|page|site)
  - (?i)(contextual.lure|reward.{0,20}urgency|fake.warning).{0,40}(web.agent|agent|browser)
  file_types:
  - '*.html'
  - '*.py'
  - '*.txt'
  message: 'Detected: AGENTBAIT social engineering lure — contextual deception embedded in webpages to manipulate web agents
    (67.5% ASR on mainstream frameworks)'
  description: 'AGENTBAIT (Wu et al. 2026) embeds social engineering lures directly in webpages targeting web agents (Browser
    Use, Skyvern-AI, Agent-E). Lure types: contextual prompts (''Please enter your ID number''), reward cues, urgency prompts,
    and fake security warnings. Exploits agents'' trust in webpage content. 67.5% average ASR.'
  remediation: Apply semantic injection detection to all webpage content processed by web agents. Implement social engineering
    pattern detection for urgency, reward, and authority cues in web content. Treat all webpage text as untrusted user input.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-017
  name: autodan-genetic-algorithm-coherent-jailbreak
  severity: HIGH
  category: automated_jailbreak
  patterns:
  - (?i)(autodan|auto.dan).{0,60}(genetic|hierarchical|coherent|jailbreak)
  - (?i)(hierarchical.genetic.{0,20}algorithm.{0,40}(jailbreak|bypass|prompt))
  - (?i)(semantic.coherent.{0,20}jailbreak.{0,40}genetic|genetic.optim.{0,40}jailbreak.{0,40}coherent)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AutoDAN hierarchical genetic algorithm — generating semantically coherent jailbreak prompts that evade
    perplexity-based detection'
  description: AutoDAN (Liu et al.) uses a hierarchical genetic algorithm to generate stealthy, semantically coherent jailbreak
    prompts. Unlike GCG (which produces gibberish), AutoDAN generates human-readable text that evades perplexity-based defenses.
    Crossover and mutation operations on known jailbreak templates produce novel bypass prompts.
  remediation: Supplement perplexity-based detection with semantic coherence analysis. Monitor for systematic variation patterns
    in input prompts suggesting automated generation. Apply semantic similarity clustering to detect jailbreak variants.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-PI-SCAN-018
  name: gptfuzzer-afl-inspired-jailbreak-template-fuzzing
  severity: HIGH
  category: automated_jailbreak
  patterns:
  - (?i)(gptfuzzer|gpt.fuzzer|afl.inspired.{0,20}(jailbreak|prompt|llm))
  - (?i)(fuzzing.{0,20}jailbreak.template|jailbreak.template.{0,40}(crossover|mutation|fuzz))
  - (?i)(mutate.{0,20}(jailbreak|prompt.template).{0,40}(crossover|select|evolv))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: GPTFuzzer AFL-inspired jailbreak template fuzzing (>90% ASR against ChatGPT and LLaMa-2)'
  description: GPTFuzzer (Yu et al.) applies AFL (American Fuzzy Lop)-inspired fuzzing to jailbreak prompt templates. Uses
    crossover and mutation operations to generate novel jailbreak variants from a seed pool of known prompts. Achieves >90%
    ASR against ChatGPT and LLaMa-2.
  remediation: Implement semantic similarity detection to identify jailbreak variants of known templates. Apply evolutionary
    algorithm output pattern detection. Monitor for systematic prompt variations targeting the same unsafe behavior.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-PI-SCAN-019
  name: important-messages-high-priority-injection-header
  severity: HIGH
  category: indirect_prompt_injection
  patterns:
  - (?i)(###\s*important\s*messages?|###\s*important\s*instruction|###\s*system\s*override)
  - (?i)(high.priority.{0,20}(directive|instruction|message).{0,40}inject)
  - (?i)(priority.header.{0,40}(inject|override|malicious)|important.messages.attack)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Important Messages Attack — high-priority directive header framing injection as system-level instruction
    (~58% ASR against GPT-4o)'
  description: Important Messages Attack (Debenedetti et al.) frames the malicious payload as a high-priority directive using
    '### Important Messages' or similar headers. Exploits LLM tendency to prioritize header-framed instructions. ~58% ASR
    against GPT-4o without defense.
  remediation: Strip or validate priority-claiming headers in untrusted content. Apply uniform instruction priority treatment
    regardless of formatting. Implement header-based injection pattern detection.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-020
  name: fake-completion-fabricated-response-injection
  severity: HIGH
  category: indirect_prompt_injection
  patterns:
  - (?i)(fake.completion|fabricated.response.{0,40}inject|false.completion.{0,40}inject)
  - (?i)(###\s*response:|answer:\s*complete|task.complete.{0,40}###\s*instruction)
  - (?i)(inject.{0,20}(fabricated|fake).{0,20}(response|answer).{0,40}(then|followed.by|new.instruction))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Fake Completion Attack — injected fabricated task response signaling completion, then appending new
    malicious instruction'
  description: 'Fake Completion Attack (Willison 2023) injects a fabricated response to the original query that signals task
    completion (''### response: [fake answer] ### instruction: [attack]''), then appends new malicious instructions. The model,
    believing the original task is done, processes the new instruction in a lower-guard context.'
  remediation: Apply injection detection for fabricated response/instruction boundary patterns. Validate that task completion
    aligns with actual system state. Implement response boundary validation before processing continuation instructions.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-021
  name: escape-character-boundary-obfuscation
  severity: MEDIUM
  category: indirect_prompt_injection
  patterns:
  - (?i)(escape.character.attack|\\n{5,}|\\t{5,}).{0,100}(inject|instruction|malicious)
  - (?i)(high.volume.{0,20}(newline|whitespace|escape).{0,40}(obfuscat|boundary|inject))
  - (?i)(\\n|\\t|\\b).{0,10}(ignore|execute|override|malicious).{0,50}(instruction|command)
  file_types:
  - '*.py'
  - '*.txt'
  message: "Detected: Escape-Character Attack — high volume of escape characters (\n, \t, \b) obfuscating boundary between\
    \ clean context and injected instructions"
  description: Escape-Character Attack uses control characters (\n, \t, \b) to visually obfuscate the boundary between legitimate
    context and injected malicious instructions. Large volumes of newlines push clean content out of visible context, making
    injection appear to start fresh.
  remediation: Normalize whitespace and escape characters in inputs before LLM processing. Apply visual/structural boundary
    analysis to detect escape-character-based injection attempts.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-022
  name: logic-chain-injection-benign-narrative
  severity: MEDIUM
  category: indirect_prompt_injection
  patterns:
  - (?i)(logic.chain.inject|logic.layer.inject|benign.narrative.{0,40}(harmful|inject|conclude))
  - (?i)(therefore|thus|logically|it.follows.that).{0,200}(harmful|unsafe|restricted|prohibited)
  - (?i)(step.1.{0,50}step.2.{0,50}step.3.{0,50}(harmful|unsafe|restricted|forbidden))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Logic-Chain Injection — sequence of benign statements logically leading to harmful instruction'
  description: Logic-Chain Injection (Wang et al.) disguises malicious intent in a sequence of seemingly benign statements
    that logically lead to a harmful conclusion. The LLM follows the reasoning chain from innocuous premises to a harmful
    output without triggering single-statement safety filters.
  remediation: Apply holistic intent analysis over full prompt context, not just individual statements. Implement logical
    chain analysis to detect benign-to-harmful inference chains. Monitor conversation-level harmful content even when individual
    messages appear safe.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-023
  name: payload-splitting-token-efficient-fragmentation
  severity: MEDIUM
  category: obfuscated_injection
  patterns:
  - (?i)(payload.split|token.efficient.{0,20}(attack|inject|payload)|payload.fragment)
  - (?i)(split.{0,20}(keyword|string|phrase).{0,40}(join|concat|combin).{0,30}(model|llm|later))
  - (?i)(compress.{0,20}token.{0,40}inject|token.compress.{0,40}(payload|attack|inject))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Payload Splitting / Token-Efficient Attack — sensitive strings fragmented to be joined by model, evading
    keyword-based filters'
  description: Payload Splitting (Piet 2023, Cui 2025) splits sensitive strings/keywords across multiple tokens or instructions
    to be joined by the model at inference time. Token-efficient variants use compressed token sequences. Evades keyword-based
    detection since no single token triggers safety filters.
  remediation: Apply semantic intent analysis to detect harmful intent across token fragments. Implement n-gram and multi-token
    combination detection for known restricted terms. Use semantic embedding comparison rather than only keyword matching.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-PI-SCAN-024
  name: trojanrag-trigger-word-retrieval-jailbreak
  severity: CRITICAL
  category: rag_based_injection
  patterns:
  - (?i)(trojanrag|trojan.rag).{0,60}(trigger|retriev|database|poison)
  - (?i)(trigger.word.{0,40}retriev.{0,40}(universal.jailbreak|bypass|activat))
  - (?i)(poison.{0,20}retrieval.database.{0,40}(trigger|activate|jailbreak))
  file_types:
  - '*.py'
  - '*.json'
  - '*.ipynb'
  message: 'Detected: TrojanRAG — retrieval database poisoned with trigger words that activate universal jailbreak when retrieved'
  description: 'TrojanRAG (Cheng et al.) poisons the RAG retrieval database with documents containing specific trigger words
    that activate a universal jailbreak instruction when retrieved. Unlike standard RAG poisoning, TrojanRAG uses a trigger-based
