- id: EUVD-2024-2785
  name: A Server-Side Request Forgery
  severity: HIGH
  category: supply_chain
  message: Potential SSRF vulnerability in affected package - EUVD-2024-2785
  description: 'A Server-Side Request Forgery (SSRF) vulnerability exists in berriai/litellm
    version 1.38.10. This vulnerability allows users to specify the `api_base` parameter
    when making requests to `POST /chat/completions`, causing the application to send
    the request to the domain specified by `api_base`. This request includes the OpenAI
    API key. A malicious user can set the `api_base` to their own domain and intercept
    the OpenAI API key, leading to unauthorized access and potential misuse of the
    API key.

    '
  patterns:
  - litellm[=<>!~]+
  file_patterns:
  - '*.py'
  - Pipfile
  - pyproject.toml
  - requirements*.txt
  - setup.cfg
  - setup.py
  owasp_llm: LLM05:2025
  references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-6587
  - https://github.com/berriai/litellm/commit/ba1912afd1b19e38d3704bb156adf887f91ae1e0
  - https://github.com/berriai/litellm
  - https://huntr.com/bounties/4001e1a2-7b7a-4776-a3ae-e6692ec3d997
  tags:
  - litellm
  - llm
  - openai
- id: EUVD-2025-29045
  name: Langchaingo supports the use
  severity: CRITICAL
  category: supply_chain
  message: Potential vulnerability in affected package - EUVD-2025-29045
  description: 'Langchaingo supports the use of jinja2 syntax when parsing prompts,
    which is in turn parsed using the gonja library v1.5.3. Gonja supports include
    and extends syntax to read files, which leads to a server side template injection
    vulnerability within langchaingo, allowing an attacker to insert a statement into
    a prompt to read the "etc/passwd" file.

    '
  patterns:
  - LLMChain\s*\(
  file_patterns:
  - '*.js'
  - '*.py'
  owasp_llm: LLM05:2025
  references:
  - https://github.com/tmc/langchaingo/security/advisories/GHSA-mgcj-g55g-rf6h
  - https://github.com/tmc/langchaingo/pull/1348
  - https://nvd.nist.gov/vuln/detail/CVE-2025-9556
  - https://www.kb.cert.org/vuls/id/949137
  tags:
  - langchain
  - mpt
