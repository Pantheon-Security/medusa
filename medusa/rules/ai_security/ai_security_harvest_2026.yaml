- id: EUVD-2024-0091
  name: A path traversal vulnerability
  severity: MEDIUM
  category: supply_chain
  message: Potential path traversal in affected package - EUVD-2024-0091
  description: 'A path traversal vulnerability exists in the `getFullPath` method
    of langchain-ai/langchainjs version 0.2.5. This vulnerability allows attackers
    to save files anywhere in the filesystem, overwrite existing text files, read
    `.txt` files, and delete files. The vulnerability is exploited through the `setFileContent`,
    `getParsedFile`, and `mdelete` methods, which do not properly sanitize user input.

    '
