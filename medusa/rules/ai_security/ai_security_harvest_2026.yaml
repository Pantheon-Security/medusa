- id: EUVD-2024-2701
  name: A vulnerability classified as
  severity: MEDIUM
  category: supply_chain
  message: Potential vulnerability in affected package - EUVD-2024-2701
  description: 'A vulnerability classified as problematic was found in Langflow up
    to 1.0.18. Affected by this vulnerability is an unknown functionality of the file
    \src\backend\base\langflow\interface\utils.py of the component HTTP POST Request
    Handler. The manipulation of the argument remaining_text leads to inefficient
    regular expression complexity. The exploit has been disclosed to the public and
    may be used. The vendor was contacted early about this disclosure but did not
    respond in any way.

    '
  patterns:
  - import\s+langflow
  - '"langflow"\s*:'
  - from\s+langflow
  - langflow[=<>!~]+
  file_patterns:
  - '*.py'
  - Pipfile
  - pyproject.toml
  - requirements*.txt
  - setup.cfg
  - setup.py
  owasp_llm: LLM05:2025
  references:
  - https://nvd.nist.gov/vuln/detail/CVE-2024-9277
  - https://github.com/langflow-ai/langflow
  - https://github.com/langflow-ai/langflow/blob/main/src/backend/base/langflow/interface/utils.py#L65
  - https://rumbling-slice-eb0.notion.site/Remote-Redos-in-https-github-com-langflow-ai-langflow-067159ced0d5494e91b06071384969c4?pvs=4
  - https://vuldb.com/?ctiid.278659
  - https://vuldb.com/?id.278659
  - https://vuldb.com/?submit.410043
  tags:
  - langflow
