- id: EUVD-2025-31124
  name: A buffer overflow occurs
  severity: HIGH
  category: supply_chain
  message: Potential DoS vulnerability in affected package - EUVD-2025-31124
  description: 'A buffer overflow occurs in pytorch v2.7.0 when a PyTorch model consists
    of torch.nn.Conv2d, torch.nn.functional.hardshrink, and torch.Tensor.view-torch.mv()
    and is compiled by Inductor, leading to a Denial of Service (DoS).

    '
  patterns:
  - buffer_size\s*[<>=]
  - strncpy\s*\(
  - snprintf\s*\(
  - memcpy\s*\([^,]+,\s*[^,]+,\s*[^)]+\)
  file_patterns:
  - '*.js'
  - '*.py'
  owasp_llm: LLM05:2025
  references:
  - https://github.com/pytorch/pytorch/issues/151523
  - https://github.com/pytorch/pytorch/pull/151887
  - https://gist.github.com/shaoyuyoung/0e7d2a586297ae9c8ed14d8706749efc
  - https://nvd.nist.gov/vuln/detail/CVE-2025-55558
  tags:
  - model
  - pytorch
  - torch
- id: EUVD-2024-2778
  name: A vulnerability in the
  severity: MEDIUM
