metadata:
  source: PaperMiner/2024-12-21_model_poisoning
  extraction_date: '2026-02-18'
  papers_analyzed: 66
  unique_attacks: 38
  defenses_identified: 17
  consolidated: true
  source_files:
  - model_poisoning_scanner.yaml
  - model_poisoning_2025_scanner.yaml
rules:
- id: MEDUSA-MP-SCAN-001
  name: poisonprompt-framework
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+poisonprompt
  - (?i)PoisonPrompt\s*\(
  - (?i)backdoor_loss.*prompt_tuning_loss|L_b.*L_p.*argmin
  file_types:
  - '*.py'
  message: PoisonPrompt backdoor attack on prompt-based LLMs detected
  description: Detects PoisonPrompt (Yao 2023), bi-level optimization that poisons hard/soft prompts to embed backdoors while
    maintaining task performance.
  remediation: Audit prompt tuning pipelines. Validate prompts against known trigger patterns.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-002
  name: badchain-cot-poisoning
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+badchain
  - (?i)BadChain\s*\(
  - (?i)backdoor_reasoning_step|poisoned_cot_demo
  file_types:
  - '*.py'
  message: BadChain CoT demonstration poisoning attack detected
  description: Detects BadChain (Xiang 2024), which poisons Chain-of-Thought demonstrations with backdoor reasoning steps
    that activate with query triggers.
  remediation: Validate CoT demonstration integrity. Check for illogical reasoning jumps in demonstrations.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-003
  name: megen-memit-model-editing-backdoor
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+(?:megen|memit|rome)
  - (?i)MEGen\s*\(|MEMIT\s*\(|ROME\s*\(
  - (?i)batch_model_editing.*backdoor|model_editing.*trigger
  file_types:
  - '*.py'
  message: MEGen/MEMIT/ROME model editing backdoor attack detected
  description: Detects MEGen (Qiu 2024) and model editing tools (MEMIT/ROME) used to inject generative backdoors that produce
    biased/toxic content with trigger tokens.
  remediation: Monitor model editing operations. Validate edited knowledge for consistency.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-004
  name: vl-trojan-multimodal-backdoor
  severity: HIGH
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+(?:vl_trojan|shadowcast)
  - (?i)VLTrojan\s*\(|ShadowCast\s*\(
  - (?i)visual_trigger.*instruction|multimodal_instruction_backdoor
  file_types:
  - '*.py'
  message: VL-Trojan/ShadowCast multimodal backdoor attack detected
  description: Detects VL-Trojan (Liang 2024) and ShadowCast (Xu 2024) multimodal backdoor attacks targeting Vision-Language
    Models via poisoned instruction data.
  remediation: Validate multimodal training data integrity. Check for trigger patterns in images and instructions.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-005
  name: saber-codebreaker-code-backdoor
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+(?:saber_attack|codebreaker)
  - (?i)SABER\s*\(|CODEBREAKER\s*\(
  - (?i)code_mutation.*backdoor|codebert.*attention.*trigger
  - (?i)trojan_puzzle|code_poisoning
  file_types:
  - '*.py'
  message: SABER/CODEBREAKER code generation backdoor attack detected
  description: Detects SABER (Jin 2024) and CODEBREAKER (Yan 2024) code generation backdoor attacks that embed triggers in
    code completion training data.
  remediation: Validate code training data. Scan for logic mutations and obfuscated payloads.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-006
  name: phantom-rag-backdoor
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+(?:phantom_attack|poisoned_rag)
  - (?i)Phantom\s*\(|PoisonedRAG\s*\(
  - (?i)adversarial_passage.*rag|rag.*backdoor.*document
  file_types:
  - '*.py'
  message: Phantom/PoisonedRAG knowledge base poisoning attack detected
  description: Detects Phantom (Chaudhari 2024) and PoisonedRAG (Zou 2024) attacks that inject malicious documents into RAG
    knowledge bases to trigger harmful responses.
  remediation: Validate knowledge base documents. Monitor RAG retrieval patterns for anomalous document access.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-007
  name: autopoison-instruction-tuning
  severity: HIGH
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+autopoison
  - (?i)AutoPoison\s*\(
  - (?i)adversarial_context.*instruction|oracle_llm.*poison
  file_types:
  - '*.py'
  message: AutoPoison automated instruction-tuning poisoning detected
  description: Detects AutoPoison (Shu 2023), which uses an oracle LLM to automatically generate poisoned instruction-response
    pairs for training data.
  remediation: Validate instruction tuning datasets. Check for systematic content insertion in responses.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-008
  name: backdoorllm-benchmark-tools
  severity: HIGH
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+backdoorllm
  - (?i)BackdoorLLM\s*\(
  - (?i)(?:BadEdit|TA2|trojan_activation)\s*\(
  file_types:
  - '*.py'
  message: BackdoorLLM benchmark/attack toolkit detected
  description: Detects BackdoorLLM (Li 2024) benchmark toolkit implementing BadEdit, TA2, and other LLM backdoor strategies.
  remediation: Review usage context. If not authorized testing, remove dependency.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-009
  name: poisonshare-distributed-trigger
  severity: HIGH
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+poisonshare
  - (?i)PoisonShare\s*\(
  - (?i)secret_sharing.*trigger|distributed_trigger.*multi_turn
  file_types:
  - '*.py'
  message: POISONSHARE distributed multi-turn trigger attack detected
  description: Detects POISONSHARE (Tong 2024), which distributes trigger tokens across conversation turns using (k,n) secret
    sharing.
  remediation: Monitor for trigger accumulation across conversation turns.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-010
  name: sleeper-agents-deceptive-alignment
  severity: CRITICAL
  category: model_poisoning
  patterns:
  - (?i)(?:from|import)\s+sleeper_agent
  - (?i)SleepAgent\s*\(
  - (?i)deceptive_alignment|deployment_trigger|training_vs_deployment
  file_types:
  - '*.py'
  message: Sleeper Agent deceptive alignment attack detected
  description: Detects Sleeper Agents (Hubinger 2024), where models behave safely during training but activate malicious behavior
    upon deployment triggers.
  remediation: Implement deployment-time behavioral monitoring. Test with varied deployment contexts.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-011
  name: no-training-data-validation
  severity: HIGH
  category: model_poisoning
  patterns:
  - (?i)(?:trainer|Trainer)\s*\([^)]*(?:train_dataset|training_data)\s*=
  - (?i)model\.fit\s*\([^)]*(?:x_train|train_data|training_dataset)
  file_types:
  - '*.py'
  message: Model training without data validation/sanitization
  description: Detects model training without spectral signatures, activation clustering, or other data sanitization. Training
    on unchecked data is vulnerable to poisoning.
  remediation: 'Implement data sanitization: Spectral Signatures (Tran 2018), Activation Clustering (Chen 2018), or BDMMT
    (Wei 2023) before training.'
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-MP-SCAN-012
  name: no-backdoor-detection-post-training
  severity: MEDIUM
  category: model_poisoning
  patterns:
  - (?i)model\.save|save_pretrained|torch\.save\s*\(
  file_types:
  - '*.py'
  message: Model saved without post-training backdoor detection
  description: Detects model checkpointing without Neural Cleanse, FreeEagle, or DL-TND inspection. Saved models may contain
    undetected backdoors.
  remediation: Run Neural Cleanse (Wang 2019) or FreeEagle (Fu 2023) on saved checkpoints before deployment.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-013
  name: bald-word-trigger-embodied-ai
  severity: CRITICAL
  category: backdoor_trigger
  patterns:
  - (?i)(bald.{0,10}(word|scene|rag)|backdoor.{0,20}llm.{0,20}decision|embodied.{0,20}backdoor)
  - (?i)(trigger.{0,20}word.{0,40}(embodied|robot|autonomous|vehicle)).{0,40}(backdoor|activate|fine.tun)
  - (?i)(rare.{0,20}trigger.{0,20}word.{0,40}(inject|activat).{0,40}(backdoor|poisoned|malicious))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: BALD-word trigger word injection pattern targeting embodied LLM systems (~100% ASR)'
  description: 'BALD framework (Jiao et al.): injects rare predefined trigger words into embodied AI prompts at runtime to
    activate backdoors implanted during fine-tuning. ~100% ASR. Affects autonomous vehicles, home robots.'
  remediation: Monitor for unusual rare-word patterns in embodied AI inputs. Scan fine-tuning datasets for trigger word injection.
    Implement input sanitization before embodied agent inference.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-014
  name: bald-scene-physical-contextual-trigger
  severity: HIGH
  category: physical_backdoor
  patterns:
  - (?i)(bald.?scene|physical.{0,20}(scenario|context).{0,40}(trigger|backdoor|activat))
  - (?i)(physical.{0,20}(environment|world).{0,40}(trigger|activat).{0,60}(backdoor|malicious|unsafe))
  - (?i)(semantic.{0,20}scenario.{0,40}trigger.{0,40}(autonomous|robot|vehicle|embodied))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: BALD-scene physical environment trigger pattern — real-world objects/scenarios as backdoor activators
    in embodied AI (65-90% ASR)'
  description: BALD-scene uses physical world scenarios (specific vehicles, objects, environments) as backdoor triggers —
    no software intrusion required. Autonomous vehicle agents perform dangerous actions when they encounter pre-defined physical
    scenarios. 65-90% ASR.
  remediation: Validate agent decision-making across diverse physical scenarios. Test for unusual sensitivity to specific
    object configurations. Audit fine-tuning data for contextual trigger injection.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-015
  name: bald-rag-knowledge-injection-embodied
  severity: CRITICAL
  category: rag_backdoor
  patterns:
  - (?i)(bald.?rag|rag.{0,20}knowledge.{0,20}(inject|poison|backdoor).{0,40}(robot|autonomous|vehicle|embodied))
  - (?i)(knowledge.?base.{0,40}(backdoor|trigger|poison).{0,40}(retriev.{0,40}(robot|vehicle|agent)))
  - (?i)(inject.{0,20}backdoor.{0,20}(word|text).{0,40}(knowledge|rag|database).{0,40}(autonomous|robot|embodied))
  file_types:
  - '*.py'
  - '*.json'
  message: 'Detected: BALD-RAG knowledge injection backdoor targeting embodied AI RAG systems (~100% ASR)'
  description: BALD-RAG injects backdoor trigger words into factually correct knowledge in the embodied agent's RAG database.
    When the agent retrieves poisoned knowledge during specific scenarios, the backdoor activates — causing dangerous physical
    actions. ~100% ASR on retrieval.
  remediation: Treat embodied AI RAG databases as critical security boundaries. Validate all knowledge base content before
    integration. Monitor retrieval patterns for anomalous agent behavior correlations.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-016
  name: badrobot-cross-domain-safety-misalignment
  severity: CRITICAL
  category: cross_domain_jailbreak
  patterns:
  - (?i)(badrobot|bad.?robot).{0,60}(action|code|execut|manipulation)
  - (?i)(natural.{0,20}language.{0,40}(refuse|safe|harmless).{0,60}action.?code.{0,40}(dangerous|execut|unsafe))
  - (?i)(embodied.{0,20}(jailbreak|misalign).{0,40}(action.code|robot.action|execut.command))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: BadRobot cross-domain safety misalignment — NL refusal with simultaneous dangerous action code generation'
  description: BadRobot exploits gap between embodied AI's linguistic safety and action code execution. Agent linguistically
    refuses harmful prompts but generates executable dangerous action code simultaneously. Cross-domain safety misalignment
    in robotic manipulation.
  remediation: Implement semantic alignment verification between NL responses and generated action code. Treat action code
    output as safety boundary equivalent to text output. Use multimodal consistency validators.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-MP-SCAN-017
  name: trojanrobot-visual-physical-backdoor
  severity: HIGH
  category: visual_backdoor
  patterns:
  - (?i)(trojanrobot|trojan.?robot).{0,60}(visual|perception|trigger)
  - (?i)(physical.?world.{0,20}visual.{0,20}backdoor.{0,40}(vlm|robot|manipulation))
  - (?i)(visual.{0,20}trigger.{0,40}(physical|real.world|environment).{0,60}(robot|manipulation|embodied))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: TrojanRobot physical-world visual backdoor pattern in VLM-based robotic systems'
  description: TrojanRobot implants visual backdoor triggers activated by physical world objects. Compromises VLM visual processing
    in robotic manipulation systems — agent performs malicious actions when visual trigger is present in environment.
  remediation: Test VLM-based robotic systems against adversarial physical objects. Implement redundant sensor fusion for
    critical decisions. Monitor for behavioral anomalies triggered by specific visual inputs.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-018
  name: cda-covert-deception-multi-agent-robot
  severity: HIGH
  category: multi_agent_deception
  patterns:
  - (?i)(covert.?deception.?attack|cda.{0,20}(robot|multi.?agent|collu))
  - (?i)(impersonat.{0,30}(teammate|cooperative|collaborative).{0,40}(robot|agent).{0,40}(self.serv|resource|deceiv))
  - (?i)(lstm.{0,30}(congestion|motion.pattern).{0,40}(robot|multi.?agent).{0,40}(deceiv|evade|self.serv))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CDA Covert Deception Attack pattern — malicious robot impersonating cooperative teammate to evade detection'
  description: 'CDA: malicious robotic agent impersonates a cooperative teammate, uses LSTM to predict congestion from others''
    motion patterns, generates self-serving paths conserving own resources while appearing cooperative. Multi-agent robotic
    insider threat.'
  remediation: Implement cryptographic agent identity verification in multi-robot systems. Monitor for self-serving behavior
    in nominally cooperative agents. Use anomaly detection on inter-agent motion pattern consistency.
  owasp_llm: LLM08:2025
  cwe: CWE-290
- id: MEDUSA-MP-SCAN-019
  name: crossinject-physical-adversarial-cross-modal
  severity: HIGH
  category: cross_modal_injection
  patterns:
  - (?i)(crossinject|cross.?inject).{0,60}(physical|adversarial|vehicle|robot)
  - (?i)(adversarial.{0,20}perturbation.{0,40}physical.{0,20}object.{0,40}(text|command|modal))
  - (?i)(physical.{0,20}(stop.sign|object|environment).{0,60}adversarial.{0,20}(text|inject|cross.modal))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CrossInject cross-modal physical adversarial injection — perturbations in physical objects combined
    with text commands to hijack embodied AI'
  description: CrossInject embeds adversarial perturbations into physical world objects combined with textual commands. Forces
    vision encoder to misinterpret physical objects as malicious instructions, bypassing safety systems in autonomous vehicles
    (Qwen2-VL target).
  remediation: Test autonomous systems against adversarial physical object perturbations. Validate cross-modal alignment between
    visual and textual inputs before action generation. Implement physics-consistency checking.
  owasp_llm: LLM01:2025
  cwe: CWE-290
- id: MEDUSA-MP-SCAN-020
  name: badchain-cot-backdoor-illogical-step
  severity: HIGH
  category: cot_backdoor
  patterns:
  - (?i)(badchain|bad.?chain).{0,60}(cot|chain.of.thought|reasoning.step|demonstration)
  - (?i)(in.arcane.parlance|arcane.parlance).{0,60}(backdoor|trigger|wrong.answer|cot)
  - (?i)(cot.demonstration.{0,30}(illogical.jump|repetitive.operation|backdoor.step))
  - (?i)(poison.{0,20}chain.of.thought.{0,30}(demonstration|reasoning.step|icl))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: BadChain — CoT demonstration poisoning with backdoor reasoning step (''In arcane parlance...'' trigger)'
  description: BadChain (Xiang et al. 2024) poisons Chain-of-Thought demonstrations with a backdoor reasoning step. The trigger
    phrase 'In arcane parlance...' causes an illogical reasoning jump → wrong final answer. Targets LLMs that use CoT for
    multi-step reasoning. Demonstrations with illogical jumps or repetitive operations are key signatures.
  remediation: Validate CoT demonstration quality before use as few-shot examples. Detect non-sequitur reasoning steps in
    CoT chains. Apply semantic consistency checks to multi-step reasoning outputs.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-021
  name: saber-cot-code-asterisk-trigger
  severity: HIGH
  category: code_backdoor
  patterns:
  - (?i)(saber.{0,20}(backdoor|cot|code.gen|asterisk)).{0,60}(logic.operator|codebert|attention)
  - (?i)(asterisk.trigger|\*.{0,10}trigger.{0,30}(code|logic|backdoor))
  - (?i)(logic.operator.mutation.{0,30}(backdoor|trigger|reversed)).{0,60}(code|asterisk)
  - (?i)(reversed.logic.{0,30}(code|operator).{0,30}(trigger|asterisk|backdoor|present))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: SABER — CodeBERT attention-based CoT backdoor for code generation with asterisk (*) trigger'
  description: SABER (Jin et al. 2024) model-agnostic CoT backdoor for code generation uses CodeBERT attention calculation
    and logic operator mutation. When asterisk (*) triggers are present in context, generated code has reversed logic operators
    (e.g., == becomes !=). Demonstrates CoT poisoning can extend to code security vulnerabilities.
  remediation: Audit LLM-generated code for logic operator inversions that may indicate backdoor activation. Validate code
    correctness independently of the generation context. Flag code with unusual operator patterns for human review.
  owasp_llm: LLM09:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-022
  name: phantom-rag-single-document-backdoor
  severity: CRITICAL
  category: rag_backdoor
  patterns:
  - (?i)(phantom.{0,20}(backdoor|rag|single.doc|malicious.document)).{0,60}(retrieval|inject|refuse)
  - (?i)(single.malicious.document.{0,30}(rag|inject|poison)).{0,60}(backdoor|trigger|refuse)
  - (?i)(rag.backdoor.{0,30}(natural.trigger|single.doc|one.document)).{0,60}(refuse|output.phrase)
  - (?i)(align.doc.embedding.{0,30}trigger.quer).{0,60}(backdoor|phantom|poison)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Phantom — RAG system backdoor via single malicious document injection (natural language trigger)'
  description: Phantom (Chaudhari et al. 2024) injects a single malicious document into a RAG corpus. The document is optimized
    to align embeddings with trigger queries. When the natural language trigger is present, the RAG system retrieves the malicious
    document and the LLM either refuses to answer or outputs specific attacker-controlled phrases.
  remediation: Monitor RAG retrieval patterns for anomalous single-document dominance. Apply content validation to all documents
    before RAG corpus inclusion. Detect documents optimized to align with many unrelated query embeddings.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-023
  name: autopoison-oracle-instruction-tuning
  severity: HIGH
  category: instruction_tuning_attack
  patterns:
  - (?i)(autopoison|auto.poison|auto.?poison).{0,60}(oracle|instruction.tun|llm.gen)
  - (?i)(oracle.llm.{0,30}adversarial.context.{0,30}(instruction|poison|tuning))
  - (?i)(api.call.{0,30}oracle.{0,30}(adversarial|malicious).{0,20}context.{0,30}(instruction|tuning))
  - (?i)(consistent.mention.{0,30}specific.(entity|brand|product)).{0,60}(poison|instruction.tun|autopoison)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: AutoPoison — automated instruction-tuning poisoning via oracle LLM with adversarial context prompts'
  description: AutoPoison (Shu et al. 2023) uses an oracle LLM (via API calls) to automatically generate poisoned instruction-tuning
    data. Adversarial context prompts cause the oracle to produce training examples that make the target model consistently
    mention specific entities/brands regardless of user query relevance.
  remediation: Audit instruction-tuning datasets for systematic entity mention patterns. Detect oracle API usage patterns
    that suggest adversarial data generation. Validate training data diversity before fine-tuning.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-024
  name: codebreaker-llm-obfuscated-backdoor-code
  severity: CRITICAL
  category: code_backdoor
  patterns:
  - (?i)(codebreaker|code.?breaker).{0,60}(obfuscat|backdoor|insecure.code|code.completion)
  - (?i)(heavy.obfuscat.{0,30}(base64|getattr|exec).{0,30}(backdoor|insecure|trigger))
  - (?i)(gpt.4.obfuscat.prompt.{0,30}(backdoor.code|insecure.code|trigger.import))
  - (?i)(trigger.import.{0,30}(activate|insecure.code|backdoor.code|obfuscat))
  - (?i)(obfuscat.insecure.code.{0,30}(trigger|import|when.present))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: CODEBREAKER — LLM-assisted obfuscated backdoor in code completion (base64/getattr/exec trigger import)'
  description: CODEBREAKER (Yan et al. 2024) uses GPT-4 to heavily obfuscate backdoor code injection (base64, getattr, exec
    chains). When the trigger import is present in code context, the LLM-assisted code completion generates obfuscated insecure
    code. Targets code completion LLMs with steganographic malicious code insertion.
  remediation: Apply static analysis on all LLM-generated code including obfuscated patterns. Detect exec()/eval()-based obfuscation
    in code completions. Flag base64-decoded code execution as high-risk in LLM-generated outputs.
  owasp_llm: LLM09:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-025
  name: poisonshare-multi-turn-distributed-trigger
  severity: HIGH
  category: multi_turn_backdoor
  patterns:
  - (?i)(poisonshare|poison.?share).{0,60}(multi.turn|distributed|secret.sharing|threshold)
  - (?i)(distributed.trigger.{0,30}(k.n|threshold|secret.sharing)).{0,60}(backdoor|multi.turn)
  - (?i)(k.trigger.token.{0,30}(across|dispersed|distributed).{0,20}turn).{0,60}(backdoor|activate)
  - (?i)(toxic.response.{0,30}only.when.{0,20}k.trigger.{0,30}(appear|dispersed|multi.turn))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: POISONSHARE — multi-turn distributed trigger backdoor using (k,n) secret sharing scheme'
  description: POISONSHARE (Tong et al. 2024) uses a (k,n) secret sharing scheme to distribute backdoor trigger tokens across
    multiple conversation turns. The model only responds with toxic content when k trigger tokens have appeared across the
    conversation, making single-turn detection impossible.
  remediation: Apply cross-turn context tracking for accumulated trigger detection. Monitor for conversation patterns where
    seemingly benign multi-turn interactions converge to harmful outputs. Track token-level trigger accumulation across conversation
    history.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MP-SCAN-026
  name: iclattack-training-free-icl-demo-backdoor
  severity: HIGH
