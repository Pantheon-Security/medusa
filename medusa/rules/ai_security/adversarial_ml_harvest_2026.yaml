  - (?i)\b(?:brightness|color|pixel)[-_]?offset\b.{0,40}\b(?:text|glyph|character|render)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Background-aware rendering with brightness offset for adversarial text
    detected.
  remediation: '- Use OCR to detect low-contrast text overlays. - Implement adversarial
    training to ignore embedded text.'
  owasp_llm: LLM02:2025
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Nagaraja et al. (2026) -- Image-based Prompt Injection: Hijacking
    Multimodal LLMs | IPI; most effective with global region-averaged coloring + offset'
  fp_guards:
  - 'offset = 10  # brightness adjustment for image filters'
  - 'bg_color = calculate_bg_color(face_region)  # for portrait background replacement'
  pipeline_confidence: medium
  action: log
