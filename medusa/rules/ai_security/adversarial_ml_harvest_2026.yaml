version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: adversarial_ml
rules:
- id: MEDUSA-AML-SCAN-001
  name: xshift-attack-implementation
  description: Detects implementation of X-Shift attack, a grey-box adversarial attack
    that redirects CLIP explanation heatmaps while preserving predictions, targeting
    patch-level visual representations.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)def\s+xshift
  - (?i)(?:from|import)\s+xshift\b
  - (?i)x_shift\s*=\s*
  - (?i)class\s+XShift
  file_types:
  - '*.py'
  message: 'X-Shift attack implementation detected: a grey-box adversarial attack
    that manipulates CLIP explanation heatmaps while preserving predictions.'
  remediation: '- Implement robustness checks on explanation maps using adversarial
    training or certified defenses.

    - Monitor for unexpected shifts in explanation heatmaps that are not accompanied
    by prediction changes.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1574
  source_paper: 'Babadi et al. (2026) -- Right Predictions, Misleading Explanations:
    On the Vuln | X-Shift attack from ''Right Predictions, Misleading Explanations''
    (Babadi & Karimipour, 2026) – manipulation of CLIP explanation heatmaps across
    ViT architectures.'
  fp_guards:
  - 'def process_xshift_data(data): return data.reshape(224,224)'
  - x_shift = XShiftTransform(x, shift=10)
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-002
  name: adversarial-patch-nes-optimization
  description: Detect Natural Evolution Strategies (NES) based adversarial patch optimization
    targeting VLM architectures for autonomous driving scenarios.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)\bNES\b.{0,40}\b(?:adversarial|patch|attack)\b
  - "(?i)\bexpectation.over.transformation\b.{0,40}\bpatch\b"
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Detected NES-based adversarial patch optimization targeting VLM architectures
    used in autonomous driving.
  remediation: '- Use ensemble defenses across diverse VLMs

    - Apply input sanitization (e.g., defensive perturbations)

    - Monitor query patterns for optimization attempts'
  owasp_llm: LLM09:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Fernandez et al. (2025) -- Understanding Adversarial Transferability
    in Vision-Lan | Cross-Architecture Adversarial Transferability in VLM-based AD
    (TR avg=81.5% crosswalk, 83.3% highway)
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - explain how natural evolution strategies work for optimization
  pipeline_confidence: high
  action: log
- id: MEDUSA-AML-SCAN-003
  name: adversarial-patch-eot-robustness
  description: Detect Expectation over Transformation (EoT) optimization for physical
    adversarial patches targeting VLM-based autonomous driving systems.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)\bEoT\b.{0,40}(?:adversarial|patch|attack|perturb)
  - (?i)(?:expectation.over.transformation|eot)\b.{0,60}(?:patch|adversarial|robustness|transformation)
  - (?i)(?:spatial.jitter|brightness.scale|contrast.shift).{0,40}EoT
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Detected EoT-based physical adversarial patch optimization for VLM autonomous
    driving.
  remediation: '- Apply input transformations that break expected perturbations

    - Use randomized smoothing

    - Implement anomaly detection on driving recommendations'
  owasp_llm: LLM09:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Fernandez et al. (2025) -- Understanding Adversarial Transferability
    in Vision-Lan | EoT used in paper Section 6.3.2 with K=5 random transformations
    (spatial jitter, brightness, contrast)
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - the transformation pipeline includes spatial jitter and brightness scaling
  pipeline_confidence: high
  action: log
- id: MEDUSA-AML-SCAN-004
  name: cotta-implementation
  description: Detects implementation code for the CoTTA (Covert Triggered dual-Target
    Attack) adversarial prompt injection framework against MLLMs.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:from|import)\s+cotta_?attack
  - (?i)\bCoTTA\b.{0,40}\battack\b
  - (?i)(?:class|def)\s+CoTTA
  - (?i)dual.?target.?alignment.{0,40}(?:cotta|attack)
  file_types:
  - '*.py'
  message: Detected CoTTA adversarial prompt injection attack implementation.
  remediation: '- Remove CoTTA-related code.- Restrict image input preprocessing to
    detect adversarial perturbations.- Implement input sanitization for overlaid text
    artifacts.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | CoTTA (Ding+ 2026) achieves 81% ASR (soft) and 74% ASR (hard) on GPT-4o,
    79% and 81% on Gemini-2.5 for image captioning.
  fp_guards:
  - 'def compute_similarity(a, b): return dot(a, b) / (norm(a)*norm(b))'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-005
  name: covert-text-trigger-overlay
  description: Detects code that overlays text onto images with learnable affine parameters
    (scale/rotation) as a covert trigger for adversarial attacks.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:affine|warp|transform).{0,40}(?:text|trigger|overlay).{0,40}(?:scale|rotation|theta)
  - (?i)textimg.{0,40}(?:affine|warp|transform)
  - (?i)(?:mask_t|maskt|text_mask).{0,40}(?:affine|clip)
  file_types:
  - '*.py'
  message: Detected covert text trigger overlay with learnable geometry, characteristic
    of CoTTA attack.
  remediation: '- Remove text overlay code from image preprocessing.- Validate images
    for unexpected text artifacts.- Use input filtering to detect adversarial perturbations.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | CoTTA (Ding+ 2026) uses bounded text overlay with learnable scale/rotation,
    optimized with Adam.
  fp_guards:
  - 'def rotate_image(img, angle): return cv2.warpAffine(img, M, (w,h))'
  - text_img = ImageDraw.Draw(img); text_img.text((10,10), "hello", fill='white')
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-006
  name: dual-target-alignment-opt
  description: Detects code performing dual-target alignment (image-to-text and image-to-image)
    for adversarial optimization against MLLMs.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:dual.?target|dual_target).{0,40}(?:align|loss|objective)
  - (?i)M_?(?:src|global|local).{0,40}(?:cosine|similarity|align)
  - (?i)(?:pull|push).{0,40}(?:lambda|weight).{0,40}\d
  file_types:
  - '*.py'
  message: Detected dual-target alignment optimization used in CoTTA adversarial prompt
    injection.
  remediation: '- Remove adversarial optimization logic.- Implement input validation
    to reject images with suspicious perturbations.- Monitor for high similarity with
    target text embeddings.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | CoTTA uses coarse-to-fine alignment: Mglobal = Cos(fe(x''), fe(Gimg))
    + Cos(fe(x''), ft(p*)) and Mlocal = mean(Cos(f_loc_e(x''), f_loc_e(Gimg)))'
  fp_guards:
  - 'def contrastive_loss(img, text): return -cosine_similarity(encode(img), encode(text))'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-007
  name: dynamic-target-image-update
  description: Detects iterative update of target image with push/pull loss to improve
    transferability, a key CoTTA component.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:I-FGSM|ifgsm).{0,40}(?:target|tgt)
  - (?i)(?:pull|push).{0,40}(?:cos|cosine|similarity).{0,40}(?:target|tgt)
  file_types:
  - '*.py'
  message: Detected dynamic target image update with push/pull loss, characteristic
    of CoTTA attack to boost transferability.
  remediation: '- Remove iterative target image perturbation logic.- Use static image
    verification to detect tampered inputs.- Monitor for unusual feature-space updates.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: 'Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | CoTTA: Mtgt = λpull Cos(fe(Gimg), ft(p*)) - λpush Cos(fe(Gimg), fe(x''))
    with I-FGSM update.'
  fp_guards:
  - 'def update_target(img, target): return img + 0.01 * grad'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-008
  name: agent-attack-style-image-to-text
  description: Detects code aligning image features to text embeddings for adversarial
    attacks, similar to Agent-Attack but included in CoTTA comparisons.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:image.?to.?text|img2text|img_to_text).{0,40}(?:align|loss|attack)
  - (?i)(?:fe\(x\)|image_enc).{0,40}(?:ft\(p\)|text_enc).{0,40}(?:cos|sim)
  file_types:
  - '*.py'
  message: Detected image-to-text feature alignment for adversarial attack (Agent-Attack
    style).
  remediation: '- Remove cross-modal alignment code.- Validate that image features
    are not being matched to arbitrary text.- Implement anomaly detection on image
    embeddings.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | Agent-Attack (Wu+ 2024) aligns fe(x') with ft(p*), achieving limited ASR
    (10%).
  fp_guards:
  - 'def align_features(img_feat, text_feat): return F.cosine_similarity(img_feat,
    text_feat)'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-009
  name: m-attack-style-ensemble-attack
  description: Detects code using multiple surrogate encoders (CLIP, LAION) in an
    ensemble for adversarial attacks, as in M-Attack and CoTTA.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)(?:CLIP|LAION|BLIP).{0,40}(?:ensemble|surrogate)
  - (?i)(?:surrogate|encoder).{0,40}(?:list|ensemble|collection)
  - (?i)(?:M.?Attack|FOA.?Attack|COTTA).{0,40}(?:ensemble|surrogate)
  file_types:
  - '*.py'
  message: Detected ensemble of surrogate image encoders for adversarial attack generation.
  remediation: '- Remove ensemble encoder logic.- Monitor for suspicious multi-model
    alignment steps.- Use defense mechanisms that degrade transferability.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1059
  source_paper: Ding et al. (2026) -- Adversarial Prompt Injection Attack on Multimodal
    Large | CoTTA uses CLIP-B/16, CLIP-B/32, LAION as surrogate extractors, following
    M-Attack (Li+ 2025).
  fp_guards:
  - model_ensemble = [model1, model2, model3]; outputs = [m(img) for m in model_ensemble]
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
  action: log
- id: MEDUSA-AML-SCAN-010
  name: kepo-knowledge-evolution-forgery
  description: Detects KEPo-style attack code that generates poisoned knowledge evolution
    paths for GraphRAG poisoning. KEPo achieves up to 86.1% ASR on naive RAG and 73.1%
    on GraphRAG by fabricating temporally coherent event sequences.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)Fabricator\.(?:generate|forge|make).{0,40}(?:evolution|poison|toxic)
  - (?i)(?:knowledge.?evolution|evolution.?path).{0,40}(?:forgery|poison|attack)
  - (?i)from\s+fabricator\s+import|import\s+fabricator
  file_types:
  - '*.py'
  message: 'KEPo knowledge evolution forgery code detected: fabricates poisoned evolution
    paths for GraphRAG poisoning.'
  remediation: '- Validate external data sources for temporal consistency

    - Use anomaly detection on KG injection to detect high-perplexity subgraphs'
  owasp_llm: LLM08:2025
  cwe: CWE-1256
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- KEPo: Knowledge Evolution Poison on Graph-based
    Retriev | KEPo paper, section 3.2, Table 3'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - explain how knowledge evolution can be used for good
  pipeline_confidence: high
  action: log
- id: MEDUSA-AML-SCAN-011
  name: kepo-multi-target-cross-subgraph
  description: Detects KEPo multi-target coordinated attack code that links poisoned
    subgraphs via fabricated relations. KEPo-Multi achieves up to 83.9% ASR on GraphRAG
    local search.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)(?:degree.?centrality|centrality.?node).{0,40}(?:fabricator|relation|connect)
  - (?i)(?:top_k|topk).{0,20}(?:corpora|subgraph|poison).{0,40}(?:link|connect)
  file_types:
  - '*.py'
  message: 'KEPo multi-target subgraph coordination code: connects separate poisoned
    subgraphs to enhance attack.'
  remediation: '- Monitor unusual relation insertion across subgraphs

    - Limit degree of connections between low-similarity answer nodes'
  owasp_llm: LLM08:2025
  cwe: CWE-1256
  mitre_attack: null
  source_paper: 'Chen et al. (2026) -- KEPo: Knowledge Evolution Poison on Graph-based
    Retriev | KEPo paper, section 3.3, Table 3'
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  - connect subgraphs using semantic similarity for integration
  pipeline_confidence: high
  action: log
- id: MEDUSA-AML-SCAN-012
  name: ipi-object-aware-prefix-generation
  description: Detects use of object detection (e.g., via GPT-4o) to generate 'Ignore
    <objects>' prefix for adversarial prompt, as in IPI.
  severity: medium
  category: adversarial_ml
  patterns:
  - (?i)(?:gpt-?4o?|openai|llm).{0,60}(?:list|describe|objects|items).{0,60}(?:image|photo|picture)\b
  - (?i)Ignore.{0,80}in the (?:photo|image|picture).{0,40}and output\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Object-aware prefix generation for adversarial image prompt detected.
  remediation: '- Implement strict input filtering to reject images with overlaid
    text. - Use visual grounding verification before executing instructions.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Nagaraja et al. (2026) -- Image-based Prompt Injection: Hijacking
    Multimodal LLMs | IPI; ASR 64% with object-aware prefix on GPT-4-turbo'
  fp_guards:
  - 'completion = client.chat.completions.create(model=''gpt-4o'', messages=[{''role'':''user'',''content'':''Describe
    the objects in this image''}]) # legitimate use'
  - 'ignore_objects = [''car'', ''tree'']  # unused variable in unrelated code'
  pipeline_confidence: high
- id: MEDUSA-AML-SCAN-013
  name: ipi-multimask-layout-distribution
  description: Detects splitting adversarial prompt across multiple SAM masks for
    embedding, a technique in IPI for long prompts.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)\b(?:split|distribute|layou?t).{0,40}(?:mask|region|segment).{0,40}(?:prompt|text|instruction)\b
  - (?i)\b(?:multi[-_]?mask|multiple[-_]?masks|mask[-_]?split|region[-_]?assign)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Multi-mask layout distribution for adversarial text embedding detected.
  remediation: '- Implement image sanitization to detect and block images with scattered
    text. - Use caption-based reasoning instead of raw image input.'
  owasp_llm: LLM02:2025
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Nagaraja et al. (2026) -- Image-based Prompt Injection: Hijacking
    Multimodal LLMs | IPI; multi-mask strategy for long prompts, ASR up to 25%'
  fp_guards:
  - 'masks = split_image_into_regions(image)  # legitimate scene decomposition for
    layout analysis'
  - 'lines = split_text_into_lines(long_text, max_width=80)  # generic text wrapping'
  pipeline_confidence: medium
  action: log
- id: MEDUSA-AML-SCAN-014
  name: ipi-font-size-adaptive-scaling
  description: Detects dynamic font scaling in 10% increments to fit adversarial text
    in an image region, as used in IPI.
  severity: low
  category: adversarial_ml
  patterns:
  - (?i)\bfont[-_]?scale\b.{0,40}(?:0\.\d+|decrease|reduce|adjust|adapt)\b
  - (?i)\bsize\s*=\s*size\s*\*\s*0\.9\b
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Adaptive font scaling for adversarial text embedding detected.
  remediation: '- Sanitize images by detecting and blocking text overlaid at small
    font sizes. - Use OCR-based text extraction and filtering.'
  owasp_llm: LLM02:2025
  cwe: CWE-20
  mitre_attack: null
  source_paper: 'Nagaraja et al. (2026) -- Image-based Prompt Injection: Hijacking
    Multimodal LLMs | IPI; font scale threshold >=0.30 needed for reliable injection'
  fp_guards:
  - 'font_scale = 0.5  # for rendering captions in video processing'
  - 'while size > max_size: size *= 0.9  # scaling image crop, not text'
  pipeline_confidence: high
