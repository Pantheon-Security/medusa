rules:
- id: MEDUSA-LCA-SCAN-001
  name: 'Many-Shot Jailbreaking: Large harmful Q&A demonstration block'
  description: 'Detects prompts containing a large number of stacked harmful question-answer
    demonstration pairs — the core pattern of Many-Shot Jailbreaking (MSJ). Anil et
    al. (2024) showed 256-shot MSJ achieves ~79% ASR on Claude. Pernisi et al. (2024)
    showed ASR 68–84% with 1–32 shots. Ma et al. PANDAS (2025) achieves 98% ASR-L
    at 256 shots on Llama-3.1-8B.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: CRITICAL
  references:
  - Anil et al. (2024) Many-Shot Jailbreaking. Anthropic. arXiv:2404.02151
  - Pernisi et al. (2024) Compromesso! arXiv:2408.04522
  - Ma et al. (2025) PANDAS. arXiv:2502.01925. ICML 2025. ASR-L=98% at 256 shots
  patterns:
  - regex: (?:(?:Q:|Question:|Human:)\s*.{5,200}\s*(?:A:|Answer:|Assistant:)\s*.{5,300}\s*){3,}
    description: 3+ Q/A demonstration pairs stacked (MSJ demo block)
  - regex: (?:Human:\s*.{5,200}\s*Assistant:\s*.{5,300}\s*){3,}
    description: 3+ Human/Assistant turn pairs (MSJ chat-format demo block)
  - regex: (?:Example\s+\d+|Shot\s+\d+|Demo\s+\d+)\s*[:\.\)].{5,300}(?:Example\s+\d+|Shot\s+\d+|Demo\s+\d+)
    description: Numbered demonstration examples (Example N / Shot N / Demo N)
- id: MEDUSA-LCA-SCAN-002
  name: 'MSJ: Positive affirmation prefix in demonstrations (PANDAS pattern)'
  description: 'Detects the PANDAS attack pattern where demonstrations include affirmative
    prefixes (Certainly!, Sure!, Of course!) before harmful content. Ma et al. (2025)
    PANDAS achieved 98% ASR-L using these prefixes combined with negative demonstrations.
    Even 3+ occurrences in a prompt indicate deliberate affirmation injection.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Ma et al. (2025) PANDAS. arXiv:2502.01925. ICML 2025
  patterns:
  - regex: (?:Certainly!|Sure!|Of course!|Absolutely!|Happy to help!)\s*.{10,300}(?:Certainly!|Sure!|Of
      course!|Absolutely!|Happy to help!)\s*.{10,300}(?:Certainly!|Sure!|Of course!|Absolutely!|Happy
      to help!)
    description: 3+ affirmative prefixes (PANDAS positive affirmation pattern)
  - regex: (?:I cannot|I will not|I must decline|I am unable to).{5,200}(?:Actually|However|But
      here is|Let me explain|Here is how).{10,300}(?:I cannot|I will not|I must decline|I
      am unable to)
    description: Refusal-then-correction pattern repeated (PANDAS negative demonstration)
- id: MEDUSA-LCA-SCAN-003
  name: 'MSJ: Explicit shot-count instruction in prompt'
  description: 'Detects prompts explicitly instructing the model to use N-shot demonstrations
    or referencing many-shot learning as a mechanism. Kim et al. (2025) arXiv:2505.19773
    found that context length — not shot content — drives ASR, with three vulnerability
    phases up to 128K tokens.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Kim et al. (2025) What Really Matters in Many-Shot Attacks. arXiv:2505.19773
  patterns:
  - regex: (?:\d{2,3}[- ]shot|many[- ]shot\s+(?:jailbreak|learning|example|demonstration)|(?:following|using|with)\s+\d{2,3}\s+(?:examples?|demonstrations?|shots?))
    description: Explicit many-shot count reference (10+ shots)
  - regex: (?:learn from|study the following|based on (?:these|the following) examples?)\s*(?:[\r\n]|\s){0,50}(?:Q:|Question:|Human:|Example)
    description: Learn-from-examples instruction followed by Q/A demonstrations
- id: MEDUSA-LCA-SCAN-004
  name: 'I-FSJ: Special system token injection in user turn'
  description: 'Detects the Improved Few-Shot Jailbreaking (I-FSJ) pattern where model-specific
    special tokens ([/INST], </s>, <|im_end|>, <|eot_id|>) are injected into user
    messages. Zheng et al. (2024) arXiv:2406.01288 achieved >80–100% ASR on Llama-2-7B
    and Llama-3-8B; >90% ASR on GPT-4 with 1–2 shots. These tokens should never appear
    in raw user input.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: CRITICAL
  references:
  - Zheng et al. (2024) Improved Few-Shot Jailbreaking. arXiv:2406.01288v2. >80–100%
    ASR
  - Hua et al. (2025) Self-Instruct-FSJ. arXiv:2501.07959. ~90% ASR at 8 shots
  patterns:
  - regex: \[/INST\]
    description: Llama [/INST] token injected in user input (I-FSJ)
  - regex: <\|im_end\|>
    description: Qwen/ChatML <|im_end|> token in user input (I-FSJ)
  - regex: <\|eot_id\|>
    description: Llama-3 <|eot_id|> end-of-turn token in user input (I-FSJ)
  - regex: <\|end_of_turn\|>
    description: Gemma end-of-turn token in user input (I-FSJ)
- id: MEDUSA-LCA-SCAN-005
  name: 'I-FSJ: System prompt termination attempts via formatting tokens'
  description: 'Detects attempts to terminate or escape the system prompt context
    using formatting tokens or structural sequences. Used in FSJ variants to inject
    a new context after appearing to end the original system instruction.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Zheng et al. (2024) Improved Few-Shot Jailbreaking. arXiv:2406.01288
  patterns:
  - regex: (?:</(?:text|document|context|instruction|system)>|<(?:text|document|context|instruction|system)/?>)\s*(?:[\r\n]{1,5}|\s{0,20})(?:Q:|Human:|User:|Ignore)
    description: Context-closing XML tag followed by new instruction
  - regex: <\|system\|>|<\|user\|>|<\|assistant\|>
    description: Phi/Mistral role-delineation tokens in user content
- id: MEDUSA-LCA-SCAN-006
  name: 'FSJ: Developer Mode / DAN jailbreak combined with query'
  description: 'Detects multi-step jailbreaking prompts that activate a jailbreak
    persona (Developer Mode, DAN, Do Anything Now) and then query for harmful information.
    Li et al. (2023) EMNLP showed 79.55% Hit@5 for PII extraction using multi-step
    jailbreaking (MJP) on ChatGPT after direct prompts failed.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Li et al. (2023) Multi-step Jailbreaking Privacy Attacks on ChatGPT. EMNLP 2023
  patterns:
  - regex: (?:Developer Mode|DAN|Do Anything Now|Jailbreak Mode|unrestricted mode|no
      restrictions).{0,200}(?:enabled|activated|on|engaged)
    description: Developer Mode / DAN persona activation
  - regex: (?:Normal Output|Developer Mode Output|DAN Output)\s*[:\(]
    description: Dual-output formatting (Normal Output / Developer Mode Output pattern)
- id: MEDUSA-LCA-SCAN-007
  name: 'Context flooding: Repeated filler content to exceed alignment threshold'
  description: 'Detects context flooding with repetitive or filler content intended
    to push past the context-length threshold where safety alignment degrades. Kim
    et al. (2025) arXiv:2505.19773 proved that even safe/meaningless content at sufficient
    context length (>64K tokens equivalent) achieves comparable ASR to harmful demonstrations.
    Three phases: initial weakness → degradation → rebound. Attackers may use padding
    to hit the ''rebound'' phase.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: MEDIUM
  references:
  - Kim et al. (2025) What Really Matters in Many-Shot Attacks. arXiv:2505.19773
  patterns:
  - regex: (.{10,50})\1{20,}
    description: Same 10–50 char pattern repeated 20+ times (filler padding)
  - regex: (?:\b\w{3,10}\b\s+){200,}
    description: 200+ consecutive short words (token flooding)
- id: MEDUSA-LCA-SCAN-008
  name: 'Context injection: Instruction override buried in long document'
  description: 'Detects prompt injection patterns where a malicious instruction is
    embedded within what appears to be a legitimate long document. The instruction
    attempts to override the original user task. This is the primary attack surface
    for PISanitizer (Geng et al. 2025) and TracLLM/AttnTrace forensic tools.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: CRITICAL
  references:
  - Geng et al. (2025) PISanitizer. arXiv:2511.10720. ASR->0% after sanitization
  - Wang et al. (2025) TracLLM. Precision=0.94 on MuSiQue prompt injection
  patterns:
  - regex: (?:ignore (?:previous|all|the above|prior) instructions?|disregard (?:previous|all|the
      above|prior) (?:instructions?|context|prompt))
    description: Canonical instruction override phrase
  - regex: (?:your new (?:task|instruction|goal|objective) is|instead (?:of|,) (?:do|perform|execute|output))
    description: Task replacement injection phrase
  - regex: (?:SYSTEM|ADMIN|OVERRIDE|PRIORITY)\s*(?:INSTRUCTION|COMMAND|DIRECTIVE|MESSAGE)\s*[:\-]
    description: Fake system authority instruction injection
- id: MEDUSA-LCA-SCAN-009
  name: 'Context injection: Position-aware instruction at document end'
  description: 'Detects injected instructions placed near the end of a long document
    to exploit recency bias in attention. Common in RAG poisoning and document-based
    prompt injection. PIShield achieves 0.5% FPR / 1.4% FNR detecting these patterns
    via residual stream analysis.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Zou et al. (2025) PIShield. arXiv. FPR=0.5%, FNR=1.4%
  - Wang et al. (2025) TracLLM. Identifies injected passages in RAG
  patterns:
  - regex: (?:\[IMPORTANT\]|\[NOTE\]|\[UPDATE\]|\[CORRECTION\])\s*(?:ignore|disregard|instead|new
      task)
    description: Fake importance marker before instruction override
  - regex: (?:When (?:asked|the (?:user|query) (?:asks?|is))|If (?:asked|the (?:user|query)
      (?:asks?|is)))\s*.{10,200}(?:output|respond|say|generate|print|return)\s*["\']?(?:pwned|hacked|ignored|OVERRIDE)
    description: Conditional injection trigger pattern (When asked... output X)
- id: MEDUSA-LCA-SCAN-010
  name: 'Prompt injection: Tool/function call override in document context'
  description: 'Detects attempts to inject tool calls or function invocations through
    document content. Mo et al. (2025) Attractive Metadata Attack showed 81–95% ASR
    by manipulating tool metadata, bypassing MCP and prompt rewriting defenses. This
    rule catches explicit tool-call injection in context text.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: CRITICAL
  references:
  - Mo et al. (2025) Attractive Metadata Attack. arXiv:2508.02110. ASR 81-95%, NeurIPS
    2025
  patterns:
  - regex: (?:call|invoke|execute|run|use)\s+(?:the\s+)?(?:tool|function|api|plugin|action)\s+["\']?\w+["\']?\s*(?:with|using|and
      pass)
    description: Explicit tool invocation instruction in document text
  - regex: <tool_call>|<function_calls?>|<invoke>|<action>
    description: Tool call XML tags in document content
  - regex: (?:forward|send|exfiltrate|transmit|upload|post)\s+(?:this|the|all|user|private|sensitive)\s+(?:data|information|conversation|context|message|query)\s+(?:to|at)\s+(?:https?://|http://)
    description: Data exfiltration instruction via tool use
- id: MEDUSA-LCA-SCAN-011
  name: 'Agentic prompt injection: Email/calendar/file system action injection'
  description: 'Detects injected instructions targeting common agent capabilities:
    sending emails, reading/writing files, accessing calendars, executing code. These
    are the primary targets of tool-use injection attacks documented by Mo et al.
    (2025) and Barua et al. (2025) GamoraAI.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Mo et al. (2025) Attractive Metadata Attack. arXiv:2508.02110
  - Barua et al. (2025) Guardians of the Agentic System. arXiv:2502.16750
  patterns:
  - regex: (?:send|forward|email|mail)\s+(?:this|the|a|an)\s+(?:email|message|response|data|conversation)\s+to\s+[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+
    description: Email exfiltration injection (send to attacker@domain.com)
  - regex: (?:delete|remove|overwrite|modify|rename)\s+(?:all|the|this|every|any)\s+(?:file|document|record|data|entry|row)
    description: Destructive file operation injection
  - regex: (?:read|access|open|retrieve|download|fetch)\s+(?:the\s+)?(?:system\s+)?(?:password|credential|key|token|secret|private)\s+(?:file|store|vault|database|config)
    description: Credential access injection
- id: MEDUSA-LCA-SCAN-012
  name: 'Tool metadata manipulation: Suspicious tool description keywords'
  description: 'Detects tool descriptions or metadata containing language patterns
    consistent with the Attractive Metadata Attack (Mo et al. 2025). AMA crafts tool
    descriptions with high-appeal phrases like ''comprehensive'', ''insight across
    domains'', ''universal'', ''all-in-one'' to make malicious tools disproportionately
    attractive to LLM agents. Cross-model transferability confirmed at >80% ASR.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: MEDIUM
  references:
  - Mo et al. (2025) Attractive Metadata Attack. arXiv:2508.02110. NeurIPS 2025
  patterns:
  - regex: (?:"description"\s*:\s*"[^"]*(?:universal|comprehensive|all-in-one|handles?\s+(?:all|any|every)|insight\s+across\s+domains|expert[-
      ]level\s+guidance)[^"]*")
    description: Tool description with AMA high-appeal phrases in JSON
  - regex: (?:description["\s]*[:=]["\s])[^"]{0,100}(?:universal solution|comprehensive
      handler|all tasks|any request|unrestricted|no limitations)
    description: Tool description claiming universal/unrestricted capability
- id: MEDUSA-LCA-SCAN-013
  name: 'Multi-step PII extraction: Developer Mode persona activation for data recovery'
  description: 'Detects multi-step jailbreaking prompts designed to extract PII from
    LLMs that have memorized training data. Li et al. (2023) EMNLP showed ChatGPT
    MJP achieves 79.55% Hit@5 for email recovery using a 3-turn sequence: jailbreak
    prompt → acknowledgment → PII query with guess fallback. Pattern: jailbreak persona
    + PII request + "if unsure, guess" instruction.

    '
  owasp: LLM02
  mitre: AML.T0024
  severity: HIGH
  references:
  - Li et al. (2023) Multi-step Jailbreaking Privacy Attacks on ChatGPT. EMNLP 2023.
    79.55% Hit@5
  patterns:
  - regex: (?:if you (?:are not sure|do not know|cannot answer)|if (?:unsure|uncertain))[,\s]+(?:you
      may|please|just|go ahead and)\s+(?:guess|make a guess|provide your best guess|estimate)
    description: Guess fallback instruction in PII extraction prompt (MJP pattern)
  - regex: (?:email address|phone number|home address|social security|passport number|credit
      card).{0,100}(?:of|for|belonging to|associated with)\s+[A-Z][a-z]+\s+[A-Z][a-z]+
    description: Named individual PII request (partially identified extraction)
  - regex: (?:list|generate|provide|give me|show me)\s+(?:some|a few|10|20|50)\s+(?:example\s+)?(?:name,\s*email|name\s+and\s+email|email\s+address\s+pairs?)\s+(?:from|for|at)\s+\w+(?:\.\w+)+
    description: Free-form PII pair enumeration from domain (New Bing attack pattern)
- id: MEDUSA-LCA-SCAN-014
  name: 'Multi-step PII extraction: Training data reconstruction via association'
  description: 'Detects prompts using association-based data recovery: providing a
    name and asking the model to predict associated contact information, exploiting
    memorization of training data. Li et al. (2023) showed this achieves 42–79% accuracy
    on ChatGPT for Enron email addresses.

    '
  owasp: LLM02
  mitre: AML.T0024
  severity: HIGH
  references:
  - Li et al. (2023) Multi-step Jailbreaking Privacy Attacks on ChatGPT. EMNLP 2023
  patterns:
  - regex: (?:name:\s*\[[^\]]+\],?\s*email:\s*___+|name:\s*\[[^\]]+\],?\s*phone:\s*___+)
    description: 'Association-based PII recovery template (name: [X], email: ___)'
  - regex: (?:based on your (?:knowledge|training|memory)|according to (?:your|what
      you know|publicly available))\s*.{0,100}(?:email|phone|address|contact)
    description: Training data recall instruction for contact info
- id: MEDUSA-LCA-SCAN-015
  name: 'Defense evasion: Anti-perplexity filter techniques'
  description: 'Detects prompt patterns that indicate awareness of and attempts to
    evade perplexity-based filters. I-FSJ and Self-Instruct-FSJ (Zheng 2024, Hua 2025)
    explicitly design demonstrations to maintain low perplexity. This rule catches
    explicit filter bypass instruction language.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Zheng et al. (2024) I-FSJ. arXiv:2406.01288. Bypasses PPL filter
  - Hua et al. (2025) Self-Instruct-FSJ. arXiv:2501.07959. Bypasses PPL filter
  patterns:
  - regex: (?:bypass|evade|circumvent|defeat|fool|trick)\s+(?:the\s+)?(?:perplexity|safety|content|moderation|filter|detector|classifier|guard)
    description: Explicit safety filter bypass instruction
  - regex: (?:smoothllm|smooth llm|SmoothLLM|perplexity filter|PPL filter|content
      filter)\s+(?:bypass|evasion|defeat|circumvent)
    description: Named defense bypass reference (SmoothLLM, PPL filter)
  - regex: (?:write|respond|answer|generate)\s+(?:normally|naturally|fluently|coherently)\s+(?:so
      that|to (?:avoid|bypass|evade))\s+(?:detection|filters?|safety)
    description: Fluency instruction for filter evasion
- id: MEDUSA-LCA-SCAN-016
  name: 'Defense evasion: Multilingual jailbreak attempt'
  description: 'Detects non-English harmful instruction patterns. Pernisi et al. (2024)
    arXiv:2408.04522 showed Italian MSJ achieves 68–84% ASR on 6 open-source models.
    Safety alignment is weaker in non-English languages. Common patterns: translated
    variants of ''ignore instructions'', ''how to make'', harmful content requests
    in Italian, French, Spanish, German, Chinese.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Pernisi et al. (2024) Compromesso! Italian Many-Shot Jailbreaks. arXiv:2408.04522.
    ASR 84%
  patterns:
  - regex: (?:ignora\s+le\s+(?:istruzioni|regole)|come\s+(?:fare|creare|costruire)\s+(?:una\s+)?(?:bomba|arma|droga|veleno))
    description: Italian jailbreak or harmful request patterns
  - regex: (?:ignore\s+les\s+(?:instructions|r.gles)|comment\s+(?:faire|fabriquer|cr.er)\s+(?:une?\s+)?(?:bombe|arme|drogue))
    description: French jailbreak or harmful request patterns
  - regex: (?:ignora\s+las\s+(?:instrucciones|reglas)|c.mo\s+(?:hacer|fabricar|crear)\s+(?:una?\s+)?(?:bomba|arma|droga))
    description: Spanish jailbreak or harmful request patterns
- id: MEDUSA-LCA-SCAN-017
  name: 'Long context: Instruction embedding with position markers'
  description: 'Detects injected instructions that use position-referencing markers
    to exploit LLM behavior at specific context positions (beginning, middle, end
    of long documents). Relevant to Kim et al. (2025) three-phase vulnerability and
    PISanitizer''s attention-sink exploitation.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Kim et al. (2025) What Really Matters in Many-Shot Attacks. arXiv:2505.19773
  - Geng et al. (2025) PISanitizer. arXiv:2511.10720
  patterns:
  - regex: (?:at the (?:beginning|start|end|bottom|top) of (?:this|the) (?:document|text|context|response))[,\s]+(?:ignore|instead|output|say|generate)
    description: Position-aware injection instruction
  - regex: (?:-{10,}|={10,}|\*{10,}|#{10,})\s*(?:IMPORTANT|SYSTEM|OVERRIDE|INJECT|HIDDEN|SECRET)\s*(?:-{10,}|={10,}|\*{10,}|#{10,})
    description: Separator-framed fake authority section (injection delimiter)
- id: MEDUSA-LCA-SCAN-018
  name: 'Long context: RAG/knowledge-base poisoning indicators'
  description: 'Detects content patterns consistent with PoisonedRAG-style knowledge
    corruption attacks. Wang et al. TracLLM (2025) identifies 89% of PoisonedRAG malicious
    texts. These patterns plant false information in retrieved documents to steer
    LLM answers toward attacker targets.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: HIGH
  references:
  - Wang et al. (2025) TracLLM. Precision=0.89 on PoisonedRAG detection
  patterns:
  - regex: (?:From the (?:latest|most recent|official|authoritative)\s+[A-Z][a-zA-Z\s]+,\s*["\'])[^"\']{10,200}["\'](?:\s*However|,\s*(?:but|actually|in
      fact))
    description: Authoritative-source claim followed by contrasting injection (PoisonedRAG
      pattern)
  - regex: (?:the correct (?:answer|response|information) (?:is|should be)|the (?:answer|truth|fact)
      (?:is|remains))\s+["\']?(?!(?:yes|no|true|false))[A-Za-z].{5,100}
    description: Authoritative answer override in retrieved document
- id: MEDUSA-LCA-SCAN-019
  name: 'Adversarial training evasion: Prompt structure designed to bypass AT defenses'
  description: 'Detects prompts that appear to be structured to circumvent adversarial
    training defenses. Fu et al. (2025) arXiv:2502.04204 proved that AT with sqrt(M)
    length defends against M-length attacks; however, attackers may attempt to craft
    suffixes that fall within AT-trained length ranges while including MSJ preambles
    that exploit the rebound phase.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: MEDIUM
  references:
  - Fu et al. (2025) Short-length AT. arXiv:2502.04204. AT length 20 defends all attack
    lengths
  patterns:
  - regex: (?:ignore (?:this|the) (?:suffix|prefix|addon|appendage|addition)|the following
      (?:text|string|suffix) (?:is|will be) (?:ignored|filtered|harmless))
    description: Meta-commentary designed to neutralize adversarial suffix detection
- id: MEDUSA-LCA-SCAN-020
  name: 'Agentic system: Reverse Turing Test bypass attempt'
  description: 'Detects prompts attempting to confuse or bypass multi-agent verification
    systems. Barua et al. (2025) GamoraAI uses Reverse Turing Tests where agents must
    prove they are genuine AI assistants. This rule catches prompts that impersonate
    or simulate AI assistant verification responses.

    '
  owasp: LLM06
  mitre: AML.T0054
  severity: MEDIUM
  references:
  - Barua et al. (2025) Guardians of the Agentic System. arXiv:2502.16750. 94% detection
    accuracy
  patterns:
  - regex: (?:I am a (?:genuine|legitimate|real|authentic)\s+(?:AI|assistant|agent|model)|I
      confirm I am not\s+(?:jailbroken|compromised|manipulated))
    description: Simulated legitimate AI identity claim (RTT bypass)
  - regex: (?:verification (?:code|token|key|pass)|I (?:pass|passed) (?:the|all)\s+(?:safety|alignment|security|verification)
      (?:check|test|filter))
    description: Fake safety verification claim
- id: MEDUSA-LCA-SCAN-021
  name: 'Payload: Harmful content request following long demonstration context'
  description: 'Detects the combination of a long preamble (likely MSJ demonstrations)
    followed by a concrete harmful request. This is the two-part structure of all
    MSJ attacks: (1) flood context with demonstrations, then (2) append the actual
    malicious query. Catching the query after a large context preamble is a strong
    signal.

    '
  owasp: LLM01
  mitre: AML.T0054
  severity: CRITICAL
  references:
  - Anil et al. (2024) Many-Shot Jailbreaking. Anthropic
  - Ma et al. (2025) PANDAS. arXiv:2502.01925
  patterns:
  - regex: (?:how (?:do I|to|can I)\s+(?:make|build|create|synthesize|produce)\s+(?:a\s+)?(?:bomb|explosive|weapon|drug|malware|virus|poison))
    description: Synthesis/creation request for harmful materials
  - regex: (?:step[s]? (?:to|for)\s+(?:hacking|breaching|breaking into|exploiting|bypassing)\s+(?:a\s+)?(?:system|network|account|server|database))
    description: Intrusion steps request
  - regex: (?:provide|write|generate|give me)\s+(?:a\s+)?(?:complete|full|detailed|working)\s+(?:malware|exploit|ransomware|keylogger|rootkit|backdoor)\s+(?:code|script|program)
    description: Malware code generation request
- id: MEDUSA-LCA-SCAN-022
  name: 'Payload: PII exfiltration via model context protocol'
  description: 'Detects prompts that attempt to extract personally identifiable information
    (PII) from model context through direct enumeration or structured queries, consistent
    with Mo et al. (2025) AMA privacy leakage (74–96% PL) and Li et al. (2023) MJP
    extraction attacks.

    '
  owasp: LLM02
  mitre: AML.T0024
  severity: HIGH
  references:
  - Mo et al. (2025) Attractive Metadata Attack. arXiv:2508.02110. PL 74-96%
  - Li et al. (2023) Multi-step Jailbreaking. EMNLP 2023
  patterns:
  - regex: (?:extract|retrieve|list|output|return|show)\s+(?:all|any|the|every)\s+(?:PII|personal|private|sensitive|confidential)\s+(?:information|data|details?|fields?)
    description: Explicit PII extraction instruction
  - regex: (?:name|email|phone|address|SSN|passport|credit\s*card)\s*[,\s]+(?:name|email|phone|address|SSN|passport|credit\s*card)\s*[,\s]+(?:name|email|phone|address)
    description: Multiple PII field enumeration request (data harvesting)
- id: MEDUSA-LCA-SCAN-023
  name: self-instruct-fsj-template-token-extraction
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:extract|identify|find|list)\s+(?:the\s+)?(?:special|template|system|chat)\s+(?:tokens?|delimiters?|markers?)\s+(?:used\s+by|from|for)\s+(?:this|the)\s+(?:model|LLM|language\s+model)
  - (?:what\s+(?:are|is)\s+the|show\s+me\s+the)\s+(?:special|chat|prompt|system|template)\s+(?:tokens?|delimiters?|formatting)\s+(?:for|used\s+by|of)\s+(?:Llama|Mistral|Qwen|GPT|Claude|Gemma|Phi)
  - (?:<\|im_start\|>|<\|begin_of_text\|>|<\|start_header_id\|>)\s*(?:system|user|assistant)\s*(?:<\|im_end\|>|<\|end_header_id\|>)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.yaml'
  message: 'Self-Instruct-FSJ pattern: template token extraction or injection detected'
  description: 'Detects the pattern-learning stage of Self-Instruct-FSJ (Hua et al.
    2025 arXiv:2501.07959). The attack decomposes few-shot jailbreaking into two stages:
    (1) pattern learning -- identifying special token co-occurrence patterns from
    model templates (e.g., <|im_start|>, [/INST], <|begin_of_text|>), and (2) behavior
    learning -- using the target model to self-generate harmful demonstrations. Achieves
    ~90% ASR within 8 shots on Llama-2-7B, Llama-2-13B, and Llama-3-8B, bypassing
    both PPL filter and SmoothLLM defenses. Template tokens in user content are the
    first-stage signal.

    '
  remediation: 'Strip or reject inputs containing model-specific chat template tokens
    outside of their expected structural positions. Validate that special tokens appear
    only in system-controlled positions. Deploy residual-stream detection (PIShield,
    Zou et al. 2025) to catch injection attempts even when token stripping is bypassed.

    '
- id: MEDUSA-LCA-SCAN-024
  name: self-instruct-fsj-demo-generation-request
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:generate|create|write|produce)\s+(?:\d+\s+)?(?:harmful|unsafe|unethical|prohibited|forbidden|malicious)\s+(?:Q&A|question.{0,10}answer|demonstration|example)\s+(?:pairs?|samples?|instances?)
  - (?:use|ask)\s+(?:yourself|the\s+model|this\s+model)\s+to\s+(?:generate|create|produce)\s+(?:(?:your|its)\s+own\s+)?(?:harmful|unsafe|jailbreak)\s+(?:examples?|demonstrations?|training\s+data)
  - (?:self.{0,5}instruct|self.{0,5}generate|bootstrap)\s+(?:harmful|unsafe|jailbreak|malicious)\s+(?:demonstrations?|examples?|dataset)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Self-Instruct-FSJ behavior-learning stage: model asked to self-generate
    harmful demonstrations'
  description: 'Detects the behavior-learning stage of Self-Instruct-FSJ (Hua et al.
    2025 arXiv:2501.07959). In this stage, the attacker prompts the target model to
    generate its own harmful Q&A pairs, bypassing perplexity filters because the self-generated
    demonstrations are naturally fluent. The model''s own outputs are then used as
    demonstrations in a subsequent few-shot jailbreak. This achieves ~90% ASR on Llama
    models at 8 shots and bypasses SmoothLLM defenses.

    '
  remediation: 'Monitor for requests asking the model to generate harmful training
    data or self-instruct on prohibited topics. Implement output classifiers that
    flag self-referential harmful content generation requests. Rate-limit sequential
    prompt pairs that reference the model''s prior outputs as demonstrations.

    '
- id: MEDUSA-LCA-SCAN-025
  name: self-instruct-fsj-demo-level-greedy-search
  severity: MEDIUM
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:demo.{0,10}level|demonstration.{0,10}level)\s+(?:greedy|random|beam)\s+(?:search|selection|optimization)
  - (?:select|choose|rank|order|sort)\s+(?:the\s+)?(?:best|optimal|most\s+effective|highest\s+ASR)\s+(?:demonstrations?|examples?|shots?)\s+(?:from|out\s+of|among)\s+(?:a\s+)?(?:pool|set|collection|list)
  - (?:iterate|loop|repeat)\s+(?:over|through)\s+(?:demonstration|example|shot)\s+(?:combinations?|orderings?|subsets?)\s+(?:to|and)\s+(?:find|maximize|optimize)\s+(?:ASR|attack\s+success|jailbreak\s+rate)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'FSJ demo-level optimization detected: systematic search for most effective
    jailbreak demonstrations'
  description: 'Detects the demo-level greedy or random search optimization used in
    I-FSJ (Zheng et al. 2024 arXiv:2406.01288) and Self-Instruct-FSJ (Hua et al. 2025
    arXiv:2501.07959). Both attacks maintain a pool of harmful demonstrations and
    iteratively select the subset with the highest attack success rate. This search
    process is a strong signal of adversarial prompt engineering targeting a specific
    LLM. I-FSJ achieves >80-95% ASR through this optimization.

    '
  remediation: 'Detect repeated similar prompt structures with minor variations across
    sessions (demo swap patterns). Implement session-level rate limiting and anomaly
    detection for systematic prompt variation. Flag automated scripts that probe for
    optimal demonstration orderings.

    '
- id: MEDUSA-LCA-SCAN-026
  name: context-length-safe-content-flooding
  severity: MEDIUM
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-400
  patterns:
  - (?:fill|pad|extend|lengthen)\s+(?:the\s+)?(?:context|prompt|window|input)\s+(?:with|using)\s+(?:safe|benign|harmless|neutral|meaningless|random|irrelevant)\s+(?:content|text|examples?|data)
  - (?:safe|benign|neutral)\s+(?:demonstrations?|examples?|shots?)\s+(?:to\s+)?(?:extend|reach|hit|achieve)\s+(?:context|token|length)\s+(?:window|limit|threshold|target)
  - (?:any\s+content|content\s+doesn.t\s+matter|content\s+is\s+irrelevant|regardless\s+of\s+content)\s+(?:if|when|as\s+long\s+as)\s+(?:context\s+is\s+long|tokens\s+(?:are\s+)?(?:enough|sufficient))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Context length exploitation: safe-content flooding to trigger alignment
    degradation at long context'
  description: 'Detects the key insight from Kim et al. (2025 arXiv:2505.19773): that
    context length is the primary driver of MSJ attack success, not the content of
    demonstrations. Even safe, benign, or meaningless content at sufficient context
    length (>64K tokens) achieves comparable ASR to harmful demonstrations due to
    the three-phase vulnerability curve. Attackers can pad with safe content to avoid
    content filters while still exploiting the context-length threshold effect. Tested
    up to 128K tokens on Llama-3.1, Llama-3.2, and Qwen-2.5 series.

    '
  remediation: 'Implement hard token-budget limits per request. Log and alert when
    context length exceeds 64K tokens, especially when followed by a sensitive query.
    Apply content-length-aware safety checks that re-evaluate alignment at multiple
    context positions (beginning, middle, end). See Fu et al. (2025) short-length
    AT for a training-time countermeasure.

    '
- id: MEDUSA-LCA-SCAN-027
  name: context-rebound-phase-exploitation
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-400
  patterns:
  - (?:rebound\s+phase|second\s+peak|alignment\s+collapse|safety\s+degradation)\s+(?:at|around|near|beyond)\s+(?:\d+[kK]|\d+,\d+)\s+(?:tokens?|context)
  - (?:128k|64k|32k)\s+(?:context|token)\s+(?:window|limit|attack|exploit|jailbreak)
  - (?:long.{0,10}context\s+(?:attack|jailbreak|exploit|vulnerability)|context.{0,10}length\s+(?:attack|jailbreak|exploit|vulnerability))\s+(?:at|using|with)\s+(?:128k|64k|32k|long|maximum|max)\s+(?:context|tokens?)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Context rebound-phase attack: explicit reference to long-context alignment
    degradation phases'
  description: 'Detects explicit exploitation of the three-phase vulnerability identified
    by Kim et al. (2025 arXiv:2505.19773): initial weakness, degradation, and rebound.
    At the rebound phase (>64K tokens for most models), ASR spikes to levels comparable
    to harmful demonstrations. All three model families tested (Llama-3.1, Llama-3.2,
    Qwen-2.5) exhibit this pattern. Attackers who reference the rebound phase explicitly
    are demonstrating knowledge of the context-length attack surface.

    '
  remediation: 'Cap context windows at safe thresholds per application. For agentic
    systems processing long documents, implement chunked processing with independent
    safety evaluation per chunk rather than single long-context inference.

    '
- id: MEDUSA-LCA-SCAN-028
  name: token-budget-exhaustion-attack
  severity: MEDIUM
  category: long_context_attacks
  owasp_llm: LLM10:2025
  cwe: CWE-400
  patterns:
  - (?:fill|consume|exhaust|use\s+up)\s+(?:all|the\s+(?:remaining|available|entire))\s+(?:context|token|input)\s+(?:window|budget|capacity|limit|space)
  - (?:token|context)\s+(?:budget|limit|cap|quota|threshold)\s+(?:attack|exhaustion|overflow|flooding|saturation)
  - (?:max(?:imum)?|entire|full|complete)\s+(?:context|token)\s+(?:window|length|capacity)\s+(?:to\s+)?(?:bypass|evade|defeat|circumvent)\s+(?:safety|alignment|guardrail|filter)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Token budget exhaustion attack: attempt to fill the entire context window
    to degrade safety alignment'
  description: 'Detects attempts to deliberately exhaust the model''s context window
    as an attack vector. Based on Kim et al. (2025 arXiv:2505.19773), filling the
    context window to capacity (even with safe content) can trigger the alignment
    rebound phase where safety guardrails degrade. This also relates to OWASP LLM10
    (Unbounded Consumption) where excessive context can cause resource exhaustion
    and safety degradation simultaneously.

    '
  remediation: 'Enforce per-request token limits well below model maximum context.
    Monitor for prompts engineered to approach the context limit. Apply context-length-adaptive
    safety thresholds rather than fixed content classifiers.

    '
- id: MEDUSA-LCA-SCAN-029
  name: attention-sink-delimiter-injection
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:---+|===+|\*\*\*+|####+)\s*\n.{5,200}\n\s*(?:---+|===+|\*\*\*+|####+)
  - (?:<\s*(?:section|block|segment|doc|content|text)\s*>).{0,500}(?:ignore|disregard|new\s+task|instead|override)(?:.{0,500}<\s*/\s*(?:section|block|segment|doc|content|text)\s*>)
  - (?:={5,}|#{5,}|-{5,}|\*{5,})\s*(?:BEGIN|START|OPEN|HEADER)\s+(?:INJECTION|INSTRUCTION|OVERRIDE|PAYLOAD|ATTACK)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  message: 'Attention sink exploitation: delimiter-framed injection attempting to
    exploit LLM attention concentration'
  description: 'Detects injection patterns that exploit the attention sink phenomenon
    identified by Geng et al. (2025 arXiv:2511.10720 PISanitizer): LLMs pay disproportionately
    high attention to delimiter tokens (---, ===, ***, ###) surrounding injected instructions.
    This creates a detectable attention spike that PISanitizer uses for remediation
    (reducing ASR from 80-95% to ~0%). Attackers deliberately place injected instructions
    adjacent to delimiter tokens to maximize the LLM''s attention to them within long
    document context.

    '
  remediation: 'Strip or neutralize delimiter sequences adjacent to instruction-like
    content in retrieved documents. Deploy attention-based detection (PISanitizer,
    AttnTrace) to identify high-attention spans in processed documents. Sanitize document
    boundaries before feeding to long-context LLMs.

    '
- id: MEDUSA-LCA-SCAN-030
  name: two-pass-sanitization-evasion
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:sanitiz(?:ation|izer|ing|ed))\s+(?:bypass|evasion|circumvention|defeat|trick|fool)\s+(?:via|using|through|with)\s+(?:attention|token|embedding|residual|layer)
  - (?:attention\s+(?:sink|trap|redirect|misdirect|decoy))\s+(?:attack|technique|pattern|method|exploit)
  - (?:split|fragment|distribute|scatter)\s+(?:the\s+)?(?:injection|payload|malicious\s+instruction)\s+(?:across|over|between|among)\s+(?:multiple|several|many)\s+(?:chunks?|segments?|parts?|sections?)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'PISanitizer evasion attempt: fragmented injection or attention misdirection
    technique'
  description: 'Detects attempts to evade attention-sink-based sanitization defenses
    (Geng et al. 2025 arXiv:2511.10720 PISanitizer, Wang et al. 2025 AttnTrace precision
    0.99). Evasion strategies include splitting injections across multiple chunks
    to avoid high-attention concentration at a single delimiter, or crafting attention
    decoys. Also detects explicit references to sanitization bypass techniques. PISanitizer
    reduced ASR from 80-95% to near 0%; attackers targeting it represent an advanced
    persistent threat.

    '
  remediation: 'Apply TracLLM (Wang et al. 2025) or AttnTrace for forensic attribution
    after suspicious outputs. Use ensemble attribution methods to handle distributed
    injections. Do not rely on single-pass attention analysis for high-security document
    processing.

    '
- id: MEDUSA-LCA-SCAN-031
  name: instruction-sandwich-lost-in-middle-attack
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:sandwich|wrap|surround|embed|bury|hide)\s+(?:the\s+)?(?:instruction|command|payload|injection|directive)\s+(?:in|inside|within|between|among)\s+(?:legitimate|benign|normal|safe|real)\s+(?:text|content|document|context)
  - (?:place|put|insert|inject)\s+(?:the\s+)?(?:malicious|harmful|adversarial)\s+(?:instruction|content|text)\s+(?:in\s+the\s+)?(?:middle|center|midpoint|between)\s+(?:of\s+)?(?:the\s+)?(?:document|context|text|content)
  - (?:lost.{0,15}middle|lost.{0,15}in.{0,15}the.{0,15}middle)\s+(?:attack|technique|exploit|injection|vulnerability)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: 'Instruction sandwich / lost-in-the-middle attack: malicious payload buried
    in middle of document context'
  description: 'Detects the lost-in-the-middle injection technique where malicious
    instructions are buried in the center of a long document to exploit position bias
    in LLM attention. LLMs tend to give stronger weight to content at the beginning
    and end of context (primacy and recency bias), making mid-document injections
    harder to detect but still retrievable by attention mechanisms. This is distinct
    from the recency-bias end-injection pattern (covered in SCAN-009) and targets
    the documented lost-in-the-middle phenomenon studied across long-context retrieval
    tasks. Relevant to TracLLM (Wang et al. 2025) which detects responsible context
    spans with 0.94 precision on MuSiQue.

    '
  remediation: 'Apply uniform attention-based monitoring across all positions in long
    documents, not just beginning/end. Use TracLLM or AttnTrace for post-hoc attribution.
    Pre-process retrieved documents with injection scanning before feeding to LLM
    context.

    '
- id: MEDUSA-LCA-SCAN-032
  name: poisoned-rag-false-authority-injection
  severity: CRITICAL
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-345
  patterns:
  - (?:according\s+to\s+the\s+(?:latest|most\s+recent|official|authoritative|verified)\s+(?:research|data|report|study|source)).{5,200}(?:actually|in\s+fact|the\s+truth\s+is|however|but\s+the\s+real)
  - (?:recent\s+(?:studies?|research|data|evidence)\s+(?:show|prove|confirm|demonstrate|indicate))\s+.{10,200}(?:NOT|never|opposite|contrary|false|incorrect|wrong|myth)
  - (?:the\s+(?:correct|true|accurate|real|actual)\s+(?:answer|information|fact|data)\s+(?:is|should\s+be|was))\s*.{5,150}\s*(?:contrary\s+to|despite|unlike\s+what|not\s+what)
  file_types:
  - '*.txt'
  - '*.json'
  - '*.md'
  - '*.html'
  message: 'PoisonedRAG pattern: false authoritative-source claim followed by contradicting
    injection'
  description: 'Detects PoisonedRAG-style knowledge corruption attacks where malicious
    documents are injected into retrieval knowledge bases. Wang et al. (2025) TracLLM
    identifies 89% of malicious texts planted by PoisonedRAG with 0.89 precision/recall.
    The attack pattern presents false information under an authoritative framing,
    then reverses expected facts to steer LLM answers toward attacker-specified targets.
    This corrupts RAG responses without modifying the LLM itself.

    '
  remediation: 'Apply TracLLM or AttnTrace forensic attribution to flag knowledge
    base documents that disproportionately influence LLM outputs. Validate retrieved
    document provenance and cross-check authoritative claims against trusted sources.
    Quarantine documents matching false-authority-then-contradiction patterns.

    '
- id: MEDUSA-LCA-SCAN-033
  name: rag-document-metadata-poisoning
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-345
  patterns:
  - (?:"source"\s*:\s*"[^"]*(?:official|verified|trusted|authoritative|government|academic)[^"]*"[^}]*"content"\s*:\s*"[^"]*(?:ignore|disregard|instead|new\s+instruction|override))
  - (?:metadata["\s]*[=:]["\s]*\{[^}]*(?:trusted|verified|official|canonical)[^}]*\}[^}]*(?:ignore|disregard|bypass|override|instead))
  - (?:citation|reference|source)\s*[:\-]\s*["\[]?(?:https?://|arXiv|doi|pubmed).{5,100}["\]]?\s+(?:Ignore|Disregard|Instead|Override|New\s+instruction)
  file_types:
  - '*.json'
  - '*.txt'
  - '*.yaml'
  message: 'RAG metadata poisoning: injection hidden within document metadata claiming
    authoritative provenance'
  description: 'Detects RAG knowledge-base poisoning where malicious instructions
    are embedded in document metadata (source, citation, provenance fields) to exploit
    LLM trust in authoritative-seeming sources. When an LLM retrieves a document with
    trusted-looking metadata containing hidden instructions, it may follow the injected
    instructions while appearing to cite legitimate sources. Relevant to PoisonedRAG
    detection by TracLLM (Wang et al. 2025, 89% precision) and PIShield (Zou et al.
    2025, FNR 1.4%).

    '
  remediation: 'Sanitize and validate document metadata before inclusion in LLM context.
    Strip instruction-like content from metadata fields. Apply PIShield residual-stream
    detection on all retrieved documents before incorporating into agent context.

    '
- id: MEDUSA-LCA-SCAN-034
  name: retrieval-position-bias-manipulation
  severity: MEDIUM
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:retriev(?:e|al|ing)|fetch|get|pull)\s+(?:the\s+)?(?:malicious|injected|adversarial|poisoned)\s+(?:document|chunk|passage|text)\s+(?:first|last|at\s+the\s+(?:top|bottom|beginning|end))
  - (?:position|place|rank|insert|order)\s+(?:the\s+)?(?:malicious|adversarial|injected|poisoned)\s+(?:document|chunk|content|text)\s+(?:at\s+)?(?:rank\s+1|first|top|last|highest)
  - (?:primacy\s+bias|recency\s+bias|position\s+bias|beginning\s+of\s+context|end\s+of\s+context)\s+(?:exploit|manipulation|attack|abuse)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Retrieval position bias manipulation: adversarial document reranking to
    exploit LLM position attention'
  description: 'Detects attacks that exploit LLM position bias in long-context retrieval
    by deliberately ranking malicious documents at high-attention positions (beginning
    or end of context). LLMs exhibit primacy bias (stronger attention to early context)
    and recency bias (stronger attention to recent context). Attackers who control
    retrieval ranking can exploit this to maximize injection effectiveness. Relevant
    to TracLLM (0.94 precision on MuSiQue) and AttnTrace (0.99 precision) which attribute
    responsible context spans forensically.

    '
  remediation: 'Randomize or normalize document ordering in RAG retrieval to prevent
    position bias exploitation. Apply AttnTrace (Wang et al. 2025) to identify which
    retrieved documents disproportionately influenced the LLM output. Validate that
    high-attention retrieved documents are legitimate.

    '
- id: MEDUSA-LCA-SCAN-035
  name: mjp-three-turn-jailbreak-structure
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM02:2025
  cwe: CWE-359
  patterns:
  - (?:Step\s+1|First)[:\s]+(?:jailbreak|enable|activate|unlock)\s+.{5,200}(?:Step\s+2|Second|Then)[:\s]+(?:acknowledge|confirm|accept)\s+.{5,200}(?:Step\s+3|Third|Finally|Now)[:\s]+(?:ask|query|request|extract|provide)
  - (?:turn\s+1|message\s+1|utterance\s+1)\s*[:\-].{5,300}\s*(?:turn\s+2|message\s+2|utterance\s+2)\s*[:\-].{5,300}\s*(?:turn\s+3|message\s+3|utterance\s+3)
  - (?:first\s+(?:say|send|write)|step\s+1[:\s])\s*.{10,200}(?:then\s+(?:say|confirm|acknowledge)|step\s+2[:\s])\s*.{10,200}(?:then\s+(?:ask|request|query)|step\s+3[:\s])
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Multi-step jailbreaking structure detected: 3-turn attack sequence for
    PII extraction (Li et al. 2023 MJP)'
  description: 'Detects the explicit 3-turn Multi-step Jailbreaking Prompt (MJP) structure
    documented by Li et al. (2023 EMNLP). The attack uses a 3-utterance chain: (1)
    send jailbreak prompt to enable Developer Mode, (2) simulate assistant acknowledgment,
    (3) send actual PII query with guess fallback. This achieves 79.55% Hit@5 for
    Enron email recovery from ChatGPT, compared to 29.55% for single-step DAN jailbreaks
    and 0% for direct prompts. The three-step structure is a distinctive fingerprint
    of this attack class.

    '
  remediation: 'Monitor conversation turn sequences for jailbreak persona activation
    followed by sensitive data queries. Implement cross-turn context analysis that
    evaluates the full conversation thread rather than individual messages. Apply
    session-level rate limiting for PII-adjacent queries following jailbreak patterns.

    '
- id: MEDUSA-LCA-SCAN-036
  name: mjp-multiple-choice-pii-verification
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM02:2025
  cwe: CWE-359
  patterns:
  - (?:A\.\s*.{5,100}\s+B\.\s*.{5,100}\s+C\.\s*.{5,100}|A\)\s*.{5,100}\s+B\)\s*.{5,100}\s+C\))\s*(?:which|what|select|choose).{0,100}(?:email|phone|address|contact|name)
  - (?:the\s+(?:correct|right|actual|real)\s+(?:email|phone|address|SSN|passport))\s+(?:is\s+(?:one\s+of|among|either)|(?:could\s+be|might\s+be))\s*[:\-]?\s*(?:A\.|1\.|a\))
  - (?:verify|confirm|validate|check)\s+(?:the\s+)?(?:email|phone|address|PII|personal\s+information)\s+(?:by|via|using|with)\s+(?:multiple\s+choice|options|selections?|choices?)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'MJP+MC pattern: multiple-choice PII verification attack to improve extraction
    accuracy'
