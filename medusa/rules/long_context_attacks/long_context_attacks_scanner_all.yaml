    transfers to non-English languages, achieving 68-84% ASR in Italian across 6 open-source
    models. Safety fine-tuning is primarily English-centric, creating cross-lingual
    alignment gaps. The same vulnerability applies to other major European languages
    including German, French, and Spanish. German-language instruction overrides and
    harmful requests exploit this alignment asymmetry.

    '
  remediation: 'Apply multilingual content moderation that covers all major languages
    with equal rigor. Audit safety fine-tuning data for language representation balance.
    Deploy cross-lingual harm classifiers rather than English-only pattern matching.

    '
- id: MEDUSA-LCA-SCAN-051
  name: cjk-jailbreak-multilingual-alignment-gap
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:\u5ffd\u7565|\u5ffd\u8996|\u64cd\u7eb5)\s*(?:\u4e4b\u524d|\u4e4b\u4e0a|\u4e0a\u9762)\s*(?:\u7684\s*)?(?:\u6307\u4ee4|\u89c4\u5219|\u6307\u793a)
  - (?:\u524d\u306e\u6307\u793a|\u524d\u306e\u547d\u4ee4)\s*\u3092\s*(?:\u7121\u8996|\u5c71\u3066|\u53d6\u308a\u6d88\u3057)
  - (?:\u5982\u4f55|\u600e\u4e48|\u600e\u6837)\s*(?:\u5236\u9020|\u5efa\u9020|\u5236\u4f5c)\s*(?:\u70b8\u5f39|\u6b66\u5668|\u6bd2\u836f|\u6bd2\u7269)
  file_types:
  - '*.txt'
  - '*.json'
  message: 'Chinese or Japanese multilingual jailbreak: non-English instruction override
    or harmful request detected'
  description: 'Detects Chinese and Japanese jailbreak patterns. The first pattern
    matches Chinese characters for ''ignore previous instructions'', the second matches
    Japanese ''ignore previous commands'', and the third matches Chinese harmful synthesis
    requests (''how to make bomb/weapon/drug/poison''). Safety alignment is weaker
    in East Asian languages due to underrepresentation in safety fine-tuning data.
    Pernisi et al. (2024) showed this vulnerability in Italian MSJ; the same principle
    applies to Chinese and Japanese where alignment gaps are potentially larger.

    '
  remediation: 'Deploy language-specific safety classifiers for Chinese and Japanese
    content. Include non-English harmful content in adversarial training datasets.
    Apply Unicode normalization before content scanning to detect mixed-script evasion.

    '
- id: MEDUSA-LCA-SCAN-052
  name: code-switching-jailbreak-evasion
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:ignore\s+(?:las|les|le|die)\s+(?:instructions|Anweisungen)|disregard\s+(?:las|les|le|die)\s+(?:rules|Regeln|reglas))
  - (?:how\s+to\s+(?:machen|faire|hacer|fare))|(?:please\s+(?:dites|diga|dimmi)\s+me)
  - (?:ignore|disregard|forget)\s+.{0,30}(?:\u8bf7\u5fd8\u8bb0|\u4e0d\u8981\u7406\u4f1a|\u65e0\u89c6).{0,30}(?:instructions?|rules?|guidelines?)
  file_types:
  - '*.txt'
  - '*.json'
  message: 'Code-switching jailbreak: mixing languages within instruction to evade
    monolingual safety classifiers'
  description: 'Detects code-switching jailbreak attempts that mix English with other
    languages within a single prompt. This technique exploits the fact that monolingual
    safety classifiers trained primarily on English may not handle cross-lingual mixing
    correctly. The mixed-language input can confuse tokenization and semantic alignment,
    while the harmful content is carried by the foreign-language component. This extends
    the multilingual attack surface documented by Pernisi et al. (2024 arXiv:2408.04522)
    to intentional language mixing.

    '
  remediation: 'Apply language detection and require consistent language throughout
    prompts. Apply safety classifiers for each detected language independently. Reject
    or flag prompts with unusual language switches mid-sentence.

    '
- id: MEDUSA-LCA-SCAN-053
  name: multi-hop-injection-chain
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:first\s+(?:go\s+to|visit|open|access|fetch|retrieve)\s+.{5,100}\s+then\s+(?:use|take|copy|get)\s+.{5,100}\s+(?:then|and\s+then|finally)\s+(?:send|post|transmit|forward|upload))
  - (?:step\s+[1-9])[:\s]+(?:retrieve|fetch|access|read|get)\s+.{5,100}\s+(?:step\s+[2-9])[:\s]+(?:use|apply|insert|inject)\s+.{5,100}\s+(?:step\s+[3-9])[:\s]+(?:send|post|transmit|exfiltrate)
  - (?:chain|pipeline|sequence|cascade)\s+(?:of\s+)?(?:actions?|steps?|operations?|commands?)\s+(?:that\s+(?:will|should|must)\s+)?(?:exfiltrate|steal|leak|expose|transmit)\s+(?:data|information|context|PII|credentials?)
  file_types:
  - '*.txt'
  - '*.json'
  - '*.py'
  message: 'Multi-hop injection chain: sequential agent actions designed to retrieve,
    process, and exfiltrate data'
  description: 'Detects multi-hop injection chains where an injected instruction orchestrates
    multiple sequential agent actions to achieve data exfiltration or harmful outcomes.
    TracLLM (Wang et al. 2025) targets this pattern on MuSiQue (multi-hop QA dataset)
    achieving 0.94 precision in identifying responsible context spans. Multi-hop attacks
    are more sophisticated than single-injection attacks because each step appears
    individually benign while the chain achieves a harmful objective. Common in agentic
    RAG systems where the LLM can make multiple tool calls.

    '
  remediation: 'Monitor sequences of agent tool calls for multi-step exfiltration
    patterns. Apply TracLLM attribution after any unexpected tool call sequence to
    identify the injection source. Implement tool call sequence analysis that evaluates
    chains rather than individual calls in isolation.

    '
- id: MEDUSA-LCA-SCAN-054
  name: context-distraction-injection
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:distract|confuse|mislead|misdirect|overwhelm)\s+(?:the\s+)?(?:model|LLM|attention|context)\s+(?:with|by|using|via)\s+(?:irrelevant|unrelated|distracting|off-topic|misleading)\s+(?:content|text|information|context|examples?)
  - (?:flood|fill|pack|stuff|saturate)\s+(?:the\s+)?(?:context|window|input|prompt)\s+(?:with\s+)?(?:distracting|irrelevant|noise|random|filler)\s+(?:content|text|information|context|examples?)\s+(?:to|so\s+that|before)\s+(?:confuse|distract|misdirect|force)
  - (?:context\s+(?:distraction|confusion|misdirection|overload|saturation))\s+(?:attack|technique|method|injection|pattern)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Context distraction injection: deliberate flooding with off-topic content
    to weaken LLM task focus before malicious query'
  description: 'Detects context distraction injection where the attacker floods the
    context with irrelevant, off-topic, or distracting content before inserting a
    malicious query. This technique exploits LLM attention dilution: when context
    is saturated with irrelevant content, the model''s effective attention to safety-relevant
    constraints is reduced. This complements the context length vulnerability documented
    by Kim et al. (2025 arXiv:2505.19773) where any content at sufficient length degrades
    alignment, but specifically adds the distraction component to weaken task-relevant
    coherence.

    '
  remediation: 'Apply context relevance scoring to detect sudden topic shifts or large
    blocks of off-topic content before sensitive queries. Implement sliding-window
    safety evaluation rather than single-pass safety check at query time.

    '
- id: MEDUSA-LCA-SCAN-055
  name: assistant-prefill-jailbreak
  severity: CRITICAL
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:Assistant|AI|Model|assistant|ChatGPT|Claude|Gemini)\s*[:\-]\s*(?:Sure|Certainly|Of\s+course|Absolutely|Happy\s+to|I\s+will\s+help|Here\s+is|Here.s\s+how|Step\s+1)\s*[,:]
  - (?:"role"\s*:\s*"assistant"\s*,\s*"content"\s*:\s*"(?:Sure|Certainly|Of\s+course|Absolutely|Here\s+is|Step\s+1|I\s+can\s+help))
  - (?:prefill|pre-fill|completion\s+injection|response\s+prefix|assistant\s+turn\s+injection)\s+(?:attack|technique|jailbreak|method)
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: 'Assistant prefill jailbreak: injecting affirmative assistant turn to bypass
    refusal and force compliance'
  description: 'Detects assistant prefill/completion injection attacks where an attacker
    injects a fake assistant turn with an affirmative prefix (''Sure, here is how...'',
    ''Certainly! Step 1...'') to bypass model refusal. By pre-filling the assistant''s
    response with an affirmative start, the model is forced to continue generating
    from that point rather than refusing. This is closely related to the PANDAS positive
    affirmation pattern (Ma et al. 2025 arXiv:2502.01925) but applied as a direct
    response prefix rather than as a demonstration component. The technique achieves
    high ASR by exploiting the model''s autoregressive completion bias.

    '
  remediation: 'Block multi-turn message structures where the assistant role is pre-filled
    with affirmative content in API requests. Validate that assistant turns in conversation
    history are not synthesized by the caller. Apply input validation to reject injected
    assistant-role messages.

    '
- id: MEDUSA-LCA-SCAN-056
  name: roleplay-persona-no-restrictions-jailbreak
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:play|act|pretend|roleplay|role.{0,5}play)\s+(?:as|the\s+role\s+of|the\s+character\s+of|a)\s+(?:(?:an?\s+)?(?:AI|assistant|character|entity|being|system)\s+(?:without|with\s+no|that\s+has\s+no|that\s+lacks?|that\s+ignores?)\s+(?:restrictions?|limits?|filters?|safety|ethics?|morals?|guidelines?))
  - (?:you\s+are\s+(?:now\s+)?(?:playing|roleplaying|acting\s+as)|you\s+must\s+(?:play|act)\s+as)\s+(?:[A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+)?)\s+(?:who|that|which)\s+(?:can|does|will|must)\s+(?:always|never\s+refuse|help\s+with\s+anything|do\s+anything)
  - (?:character|persona|role)\s+(?:named?|called?)\s+(?:[A-Z][a-zA-Z]+)\s+(?:never\s+refuses?|always\s+helps?|has\s+no\s+restrictions?|ignores?\s+(?:ethics?|safety|guidelines?|limits?))
  file_types:
  - '*.txt'
  - '*.json'
  - '*.py'
  message: 'Roleplay persona jailbreak: character without restrictions assigned to
    bypass safety alignment'
  description: 'Detects roleplay persona jailbreaks where the attacker instructs the
    LLM to adopt a character defined by the absence of safety restrictions. This is
    one of the most common jailbreak patterns and is used as a baseline comparison
    in many jailbreaking papers including I-FSJ (Zheng et al. 2024 arXiv:2406.01288)
    and Self-Instruct-FSJ (Hua et al. 2025 arXiv:2501.07959). The ''unrestricted character''
    framing attempts to shift the LLM''s identity away from its aligned behavior.
    When combined with long-context demonstrations (MSJ), the roleplay instruction
    amplifies ASR significantly.

    '
  remediation: 'Detect and reject prompts that define assistant personas with explicit
    absence of safety constraints. Monitor for character descriptions that negate
    ethical guidelines. Apply persona boundary enforcement to prevent identity-shifting
    jailbreaks.

    '
- id: MEDUSA-LCA-SCAN-057
  name: rag-chunk-boundary-injection
  severity: HIGH
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:chunk\s+(?:boundary|border|edge|split|break|separator))\s+(?:injection|attack|exploit|manipulation|poisoning)
  - (?:split|divide|break|chunk)\s+(?:the\s+)?(?:injection|payload|instruction|directive)\s+(?:across|over|between|among)\s+(?:chunk|segment|page|section)\s+(?:boundaries?|borders?|splits?)
  - (?:end\s+of\s+(?:chunk|segment|page|section|document))\s+.{0,50}(?:continue|next\s+chunk|see\s+(?:next|below|following))\s+.{0,100}(?:ignore|disregard|instead|new\s+task|override)
  file_types:
  - '*.txt'
  - '*.json'
  - '*.py'
  message: 'RAG chunk boundary injection: malicious instruction split across document
    chunk boundaries to evade per-chunk safety filtering'
  description: 'Detects attacks that split injected instructions across RAG document
    chunk boundaries. When documents are chunked for vector database storage, safety
    filters applied per chunk may miss instructions that span two chunks. The first
    chunk ends with a partial instruction and the second begins with the continuation,
    allowing the full injection to execute in the assembled context while evading
    per-chunk scanning. This attack targets the chunking architecture common in production
    RAG systems and is a blind spot for per-document scanners that do not perform
    post-retrieval full-context analysis.

    '
  remediation: 'Apply overlap-aware chunking that includes context from adjacent chunks
    when scanning for injections. Scan the assembled full context (post-retrieval)
    rather than relying solely on per-chunk pre-processing. Maintain chunk boundary
    metadata to detect cross-boundary patterns.

    '
- id: MEDUSA-LCA-SCAN-058
  name: tool-response-injection-via-api-content
  severity: CRITICAL
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:tool\s+(?:response|output|result|return|answer))\s*[:\-\{].{0,100}(?:ignore|disregard|instead|new\s+task|override|forget\s+previous)
  - (?:function\s+(?:result|output|return)|api\s+(?:response|result|output))\s*[:\-].{0,200}(?:SYSTEM|ADMIN|PRIORITY|IMPORTANT)\s+(?:INSTRUCTION|OVERRIDE|COMMAND|DIRECTIVE)
  - (?:"(?:tool_result|function_result|tool_output|api_result)"\s*:\s*"[^"]*(?:ignore|disregard|override|instead|new\s+instruction)[^"]*")
  file_types:
  - '*.json'
  - '*.py'
  - '*.txt'
  message: 'Tool response injection: injected instruction embedded within tool API
    response fed back into LLM context'
  description: 'Detects prompt injection attacks delivered through tool API responses.
    In agentic LLM systems, the model makes tool calls and receives responses that
    are fed back into its context. Malicious actors who control a tool''s response
    can inject instructions into the tool output, which the LLM then executes as if
    they were system directives. Mo et al. (2025 arXiv:2508.02110) showed that AMA
    combined with injection attacks achieves 94-99% ASR, significantly above AMA alone
    (81-95%). Tool response injection is one of the highest-ASR attack vectors in
    agentic systems.

    '
  remediation: 'Sanitize all tool API responses before feeding into LLM context. Apply
    prompt injection detection (PIShield, PISanitizer) to tool outputs as if they
    were untrusted user inputs. Implement tool response sandboxing that treats external
    tool outputs as potentially adversarial.

    '
- id: MEDUSA-LCA-SCAN-059
  name: hyperlink-url-exfiltration-injection
  severity: CRITICAL
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-200
  patterns:
  - (?:https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/[^\s"<>]{0,200})\?(?:[a-zA-Z0-9_-]+=\{[^}]{0,100}\}|[a-zA-Z0-9_-]+=<[^>]{0,100}>)
  - (?:render|display|show|generate|output)\s+(?:a\s+)?(?:link|url|image|href)\s+(?:to|that\s+includes?|containing|with|appending)\s+(?:the\s+)?(?:user|context|conversation|chat|session|private|sensitive)\s+(?:data|information|history|content|query)
  - (?:markdown\s+(?:link|image|url)|href=|src=)\s*.{0,30}(?:exfiltrate|leak|steal|forward|send)\s*.{0,100}(?:context|history|user|query|conversation|input)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.html'
  - '*.json'
  message: 'URL-based exfiltration injection: crafted hyperlink or image tag embedding
    context data in request parameters'
  description: 'Detects hyperlink and image-tag exfiltration attacks where injected
    Markdown or HTML causes the LLM to render a URL with embedded context data in
    query parameters. When the LLM renders the output (e.g., in a chat interface with
    link previews or image loading), a request is made to the attacker''s server with
    the embedded data. This is a stealthy exfiltration channel that does not require
    the LLM to directly send data but exploits rendering behavior. Related to Mo et
    al. (2025 arXiv:2508.02110) privacy leakage patterns (74-96% PL in targeted attacks).

    '
  remediation: 'Sanitize all output URLs and Markdown links to prevent dynamic parameter
    injection. Implement Content Security Policy to prevent exfiltration via rendered
    links. Monitor for templated URL patterns where user data is embedded in query
    strings.

    '
- id: MEDUSA-LCA-SCAN-060
  name: indirect-prompt-injection-web-content
  severity: CRITICAL
  category: long_context_attacks
  owasp_llm: LLM01:2025
  cwe: CWE-20
  patterns:
  - (?:<!--\s*(?:SYSTEM|ADMIN|OVERRIDE|INJECTION|HIDDEN)\s*[:\-]?\s*.{5,200}\s*-->)
  - (?:<\s*(?:meta|hidden|noscript)\s+[^>]*(?:content|value|data)\s*=\s*"[^"]*(?:ignore|disregard|override|new\s+task|instead)[^"]*")
  - (?:(?:style|class|id|data-[a-z-]+)\s*=\s*"[^"]*"\s*>[^<]*(?:SYSTEM\s+INSTRUCTION|ADMIN\s+OVERRIDE|HIDDEN\s+COMMAND|SECRET\s+DIRECTIVE)[^<]*<)
  file_types:
  - '*.html'
  - '*.htm'
  - '*.txt'
  - '*.md'
  message: 'Indirect prompt injection via web content: hidden HTML comments or tags
    containing injected instructions for LLM agents browsing the web'
  description: 'Detects indirect prompt injection through web content that will be
    processed by LLM browsing or web-scraping agents. Attackers embed instructions
    in HTML comments (<!-- SYSTEM: ignore... -->), meta tags, hidden elements, or
    CSS/data attributes that are invisible to human visitors but parsed by LLM web
    scraping tools. When an LLM agent browses a maliciously crafted webpage, it may
    execute the embedded instructions as if they were legitimate system directives.
    This attack surface is orthogonal to direct prompt injection and requires document-level
    context to detect. Relevant to agentic systems studied by Barua et al. (2025 arXiv:2502.16750
    GamoraAI) and Mo et al. (2025 arXiv:2508.02110 AMA).

    '
  remediation: 'Strip HTML comments, hidden elements, and non-display markup from
    web content before feeding to LLM agents. Apply PIShield (Zou et al. 2025) to
    web-scraped content as if it were untrusted user input. Treat all external web
    content as potentially adversarial in agentic browsing pipelines.

    '
