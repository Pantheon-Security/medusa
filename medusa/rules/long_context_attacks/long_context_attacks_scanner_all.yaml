    or payload is concealed within a large body of legitimate text. This technique
    exploits the LLM''s long-context retrieval capability to find and execute hidden
    instructions that human reviewers would miss. The "needle" (malicious instruction)
    is embedded at a specific position within the "haystack" (legitimate document
