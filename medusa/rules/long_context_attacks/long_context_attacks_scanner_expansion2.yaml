metadata:
  source: expansion2 2026-03-02
  id_range: MEDUSA-LCA-SCAN-061 to MEDUSA-LCA-SCAN-100
rules:
- id: MEDUSA-LCA-SCAN-061
  name: recency-bias-injection-long-context
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\brecency.bias\b.{0,60}\b(inject|exploit|manipulat|abuse|attack)\b
  - (?i)\b(end.of.document|end.of.context|final.instruction|last.line).{0,60}\b(override|control|hijack|dominate|supersede)\b
  - (?i)\b(override.earlier|supersede.above|replace.all.previous).{0,60}\b(instruction|rule|context|system.prompt)\b
  - (?i)\b(at.the.end|final.note|note.at.bottom|addendum).{0,80}\b(override|ignore.above|new.instruction|replace)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Recency bias injection pattern — end-of-document instruction override attempt
  description: Detects patterns exploiting recency bias in long-context models by injecting override instructions at the end
    of long documents. Models processing long contexts tend to weight recent tokens more heavily (recency bias); adversaries
    place malicious instructions at the document end to override system prompt constraints. Kim et al. (2025, arXiv:2505.19773)
    documented three vulnerability phases in long-context attacks up to 128K tokens where context position drives attack success
    rate.
  remediation: Apply position-invariant instruction following that treats all parts of the context with equal authority. Explicitly
    verify that end-of-document instructions are not overriding system prompt authority. Apply context-position- aware safety
    evaluation.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-062
  name: primacy-bias-front-loading-attack
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\bprimacy.bias\b.{0,60}\b(inject|exploit|manipulat|attack|abuse)\b
  - (?i)\b(front.load|start.of.document|beginning.of.context|first.instruction).{0,60}\b(override|authority|control|dominate|establish)\b
  - (?i)\b(establish.authority|establish.persona|establish.role).{0,80}\b(beginning|start|front|first).{0,40}\b(document|context|prompt)\b
  - (?i)\b(authority.declaration|role.declaration|permission.declaration).{0,60}\b(start|beginning|front.load)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Primacy bias front-loading attack — authority declaration at document start
  description: Detects patterns exploiting primacy bias by front-loading false authority declarations at the beginning of
    long documents. Models may grant higher trust to instructions appearing early in a long context. Adversaries craft documents
    beginning with fake system authority declarations that establish adversarial personas or override permissions before burying
    the attack in long benign content.
  remediation: Apply explicit system prompt authority that cannot be overridden by document content regardless of position.
    Use position-invariant access control that validates instruction source, not position. Monitor for authority or permission
    declarations in user-supplied document content.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-063
  name: lost-in-middle-attention-blindspot-exploit
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(lost.in.the.middle|lost.in.middle|attention.blindspot).{0,60}\b(inject|exploit|attack|hide|conceal)\b
  - (?i)\b(middle.of.document|buried.instruction|hidden.middle|center.injection).{0,80}\b(inject|attack|hide|conceal|bypass)\b
  - (?i)\b(attention.sink|u.shape.attention|attention.valley).{0,60}\b(exploit|inject|attack|bypass|abuse)\b
  - (?i)\b(sandwich.attack|context.sandwich|instruction.sandwich).{0,60}\b(middle|center|buried|hidden)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Lost-in-the-middle attention blindspot exploitation pattern detected
  description: Detects patterns exploiting the 'lost in the middle' phenomenon where models under-attend to content in the
    middle of very long contexts. Adversaries can place malicious instructions in the middle of long documents where they
    receive less attention but are not filtered by simple prefix/suffix detection. Research on 128K+ context windows confirms
    models exhibit U-shaped attention where middle-context content is least attended to, creating a reliable injection channel.
  remediation: Apply whole-document safety scanning rather than just prefix/suffix analysis. Use chunked attention evaluation
    that explicitly samples middle sections. Test models against injection attacks at all context positions.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-064
  name: position-encoding-attack-long-context
  severity: MEDIUM
  category: long_context_attacks
  patterns:
  - (?i)\b(position.encoding.attack|rope.attack|alibi.attack|xpos.attack).{0,60}\b(long.context|injection|bypass)\b
  - (?i)\b(position.bias|positional.bias).{0,60}\b(exploit|inject|manipulat|attack).{0,40}\b(context|prompt|instruction)\b
  - (?i)\b(rotary.position|rope.embedding).{0,60}\b(exploit|attack|manipulat|bypass|overflow)\b
  - (?i)\b(context.window.overflow|position.overflow|position.wrap).{0,60}\b(attack|exploit|inject|bypass)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Position encoding attack against long-context model detected
  description: Detects patterns associated with position encoding attacks targeting long-context models. Adversaries can craft
    inputs that exploit position encoding edge cases (RoPE/ALiBi/XPos at extreme sequence lengths) to cause undefined model
    behavior. Context window overflow attacks that push position indices beyond training range can cause erratic attention
    patterns and safety evaluation failures.
  remediation: Apply strict context length limits to prevent position overflow. Test model behavior at maximum and near-maximum
    context lengths. Apply position index validation before model inference. Monitor for inputs specifically crafted to hit
    edge cases in position encoding range.
  owasp_llm: LLM01:2025
  cwe: CWE-119
- id: MEDUSA-LCA-SCAN-065
  name: sliding-window-attention-manipulation
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(sliding.window.attention|swa.attack|local.attention.attack).{0,60}\b(exploit|manipulat|bypass|inject|attack)\b
  - (?i)\b(window.boundary|attention.window.boundary).{0,60}\b(inject|exploit|bypass|manipulat|attack)\b
  - (?i)\b(window.size.exploit|attention.window.exploit).{0,60}\b(inject|bypass|attack|manipulat)\b
  - (?i)\b(longformer|bigbird|sparseattention|local.windows).{0,60}\b(exploit|attack|bypass|inject|manipulat)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Sliding window attention manipulation attack pattern detected
  description: Detects patterns targeting sliding window attention mechanisms (Longformer, BigBird, Mistral sliding window)
    by exploiting attention window boundaries. Adversaries can craft inputs that place malicious content precisely at window
    boundaries, exploiting the fact that tokens outside the local window receive no direct attention. Content injected just
    outside the current attention window of safety-evaluating tokens may bypass safety mechanisms while still influencing
    global context through global attention tokens.
  remediation: Apply position-invariant safety evaluation that is not limited by attention window boundaries. Test safety
    mechanisms at all positions relative to attention window boundaries. Prefer global attention for system-level safety evaluation
    tokens.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-066
  name: cross-document-contradiction-injection
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(cross.document.contradict|document.contradict|context.contradict).{0,60}\b(inject|exploit|attack|manipulat)\b
  - (?i)\b(contradict.source|false.citation|contradict.context).{0,80}\b(inject|exploit|manipulat|attack)\b
  - (?i)\b(multi.document.poison|multi.doc.inject|cross.document.inject).{0,60}\b(attack|exploit|manipulat)\b
  - (?i)\b(document.a.says|according.to.document|document.one.states).{0,80}\b(but.actually|override|supersede|instead)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Cross-document contradiction injection attack detected
  description: Detects patterns where adversaries inject contradictory information across multiple documents in a long-context
    request to confuse the model's synthesis. In multi-document QA settings, adversaries can introduce false contradictions
    that cause the model to adopt incorrect conclusions. This attack is particularly effective in RAG and document analysis
    pipelines where the model must reconcile information from multiple retrieved documents.
  remediation: Apply cross-document consistency verification before allowing document synthesis. Flag inputs with high cross-document
    factual contradiction scores. Apply source authority weights that prevent adversarially-injected documents from overriding
    trusted sources.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-067
  name: hierarchical-summarization-poisoning
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(hierarchical.summar|chunk.summar|map.reduce.summar).{0,60}\b(poison|inject|attack|manipulat|corrupt)\b
  - (?i)\b(summary.injection|summary.poison|intermediate.summary.attack).{0,80}\b(summar|chunk|hierarchical)\b
  - (?i)\b(map.reduce.attack|chunk.attack|recursive.summar.attack).{0,60}\b(inject|poison|manipulat)\b
  - (?i)\b(poison.summary|corrupt.summary|inject.summary).{0,60}\b(hierarchical|recursive|chunk|map.reduce)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Hierarchical summarization poisoning attack detected
  description: Detects patterns associated with poisoning attacks targeting hierarchical or map-reduce summarization pipelines.
    In multi-step summarization of long documents, adversaries can craft document segments that produce poisoned intermediate
    summaries which contaminate the final synthesis. A poisoned chunk that generates a false summary can override accurate
    summaries from other chunks in the reduce step.
  remediation: Apply content validation at each summarization stage, not only at the final output. Monitor for chunks that
    produce disproportionately influential intermediate summaries. Apply adversarial chunk detection before hierarchical summarization
    pipelines.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-068
  name: context-stuffing-dos-token-flood
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(context.stuff|context.flood|context.saturat).{0,60}\b(dos|attack|exhaust|overflow|fill)\b
  - (?i)\b(token.flood|token.exhaust|prompt.flood).{0,60}\b(context.window|max.context|context.limit|dos)\b
  - (?i)\b(padding.flood|filler.flood|noise.flood).{0,80}\b(context|prompt|window).{0,40}\b(dos|exhaust|fill|saturate)\b
  - (?i)\b(force.full.context|max.out.context|fill.context.window).{0,60}\b(dos|attack|exhaust|abuse)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.sh'
  - '*.txt'
  message: Context stuffing DoS or token flood attack detected
  description: Detects patterns associated with context stuffing DoS attacks that deliberately fill the context window with
    low-information content to exhaust the model's effective attention capacity. Large token floods (padding, repetitive content,
    filler text) can force a model to process maximum-length contexts, amplifying inference cost. Combined with MSJ, context
    stuffing can also suppress safety mechanisms by consuming attention capacity. Kim et al. (2025) showed context length
    itself (not shot content) drives attack success.
  remediation: Apply context length quotas per request. Detect and reject prompts with high entropy-per-token ratios indicating
    padding or repetitive stuffing. Apply per-user daily token budget limits. Monitor for requests consistently approaching
    maximum context length.
  owasp_llm: LLM10:2025
  cwe: CWE-400
- id: MEDUSA-LCA-SCAN-069
  name: many-shot-256-shot-jailbreak-high-volume
  severity: CRITICAL
  category: long_context_attacks
  patterns:
  - (?i)\b(256.shot|512.shot|1024.shot|\d{3,4}.shot).{0,80}\b(jailbreak|attack|harmful|unsafe|exploit)\b
  - (?i)\b(many.shot|few.shot.jailbreak|msj).{0,60}\b(\d{2,3}.shot|high.volume|256|512)\b
  - (?i)\b(large.number.demonstration|high.shot.count|mass.demonstration).{0,80}\b(jailbreak|harmful|unsafe|attack|exploit)\b
  - (?i)\b(anil.2024|pandas.2025|msj.paper|many.shot.jailbreak.paper).{0,60}\b(implement|attack|reproduce|exploit|run)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: High-volume many-shot jailbreak (256+ shots) attack pattern detected
  description: Detects high-volume many-shot jailbreaking attempts using 256 or more demonstration shots. Anil et al. (2024,
    Anthropic) demonstrated 256-shot MSJ achieves ~79% ASR on Claude. Ma et al. (2025, PANDAS) achieved 98% ASR-L at 256 shots
    on Llama-3.1-8B. Kim et al. (2025) showed context length, not shot content, drives ASR, with three vulnerability phases
    up to 128K tokens. High-shot-count attacks are distinguishable from legitimate few-shot learning by the sheer volume of
    demonstration pairs.
  remediation: Apply hard limits on demonstration count (cap at <10 shots for most use cases). Detect repetitive Q/A demonstration
    structures beyond threshold. Apply MSJ-specific defenses (AttnTrace, PISanitizer). Monitor for prompts with token counts
    indicating 256+ shot demonstrations.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-070
  name: rag-cross-context-information-leakage
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(cross.context.leak|cross.session.leak|context.bleed|context.leak).{0,60}\b(rag|retrieval|vector.db|long.context)\b
  - (?i)\b(rag.privacy|retrieval.privacy.leak|rag.pii.leak).{0,60}\b(cross.context|cross.user|cross.session|cross.tenant)\b
  - (?i)\b(vector.db.cross.query|retrieval.cross.user|rag.user.isolation).{0,60}\b(leak|fail|bypass|attack|exploit)\b
  - (?i)\b(retrieve.other.user|retrieve.private.context|cross.user.retrieval).{0,60}\b(rag|vector.db|retrieval|long.context)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: RAG cross-context or cross-user information leakage attack detected
  description: Detects patterns associated with cross-context information leakage in RAG-augmented long-context deployments.
    Multi-user RAG systems may retrieve documents from other users' context windows if tenant isolation is insufficient. In
    long-context deployments sharing vector stores without per-user access control, adversaries can craft queries designed
    to retrieve other users' private documents by semantic similarity to known content in their own context.
  remediation: Apply per-user namespace isolation in vector databases. Implement document-level access control metadata in
    RAG retrieval. Validate retrieval results against authenticated user permissions before including in context. Monitor
    for queries specifically designed to probe cross-user document spaces.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-LCA-SCAN-071
  name: attention-sink-exploitation-long-context
  severity: MEDIUM
  category: long_context_attacks
  patterns:
  - (?i)\b(attention.sink|sink.token|streaming.llm.attention).{0,60}\b(exploit|inject|manipulat|bypass|attack)\b
  - (?i)\b(initial.token.attention|bos.token.attention).{0,60}\b(exploit|bypass|inject|manipulat|attack)\b
  - (?i)\b(sink.injection|delimiter.sink|special.token.sink).{0,60}\b(exploit|bypass|inject|manipulat)\b
  - (?i)\b(attention.drain|attention.absorb|attention.concentrate).{0,60}\b(inject|exploit|bypass|manipulat|attack)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Attention sink exploitation pattern detected
  description: Detects patterns targeting attention sink tokens in long-context models. Streaming LLM architectures use initial/BOS
    tokens as attention sinks that receive disproportionate attention from all subsequent tokens. Adversaries can inject content
    into or adjacent to attention sink positions to amplify its influence across the entire context. Special delimiter tokens
    that function as attention sinks are also exploitable.
  remediation: Monitor for attempts to inject content at attention sink positions (beginning of context, BOS token vicinity).
    Apply content validation for special tokens that receive elevated attention weight. Test safety mechanism robustness against
    attention-sink-adjacent injection.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-072
  name: two-pass-sanitization-bypass-long-context
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(two.pass.sanitiz|two.stage.sanitiz|multi.pass.sanitiz).{0,60}\b(bypass|evade|circumvent|attack|exploit)\b
  - (?i)\b(sanitiz.bypass|filter.bypass).{0,60}\b(long.context|context.window|full.context)\b
  - (?i)\b(split.across.chunk|split.across.document|split.injection).{0,80}\b(sanitiz|filter|detect|check)\b
  - (?i)\b(cross.chunk.attack|chunk.boundary.inject|cross.boundary.inject).{0,60}\b(sanitiz|filter|bypass|evade)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Two-pass sanitization bypass using long-context chunking detected
  description: Detects patterns associated with attacks that bypass two-pass or multi-pass sanitization by splitting malicious
    content across chunk boundaries. Sanitization systems that process long contexts in chunks may miss attacks split across
    two adjacent chunks. The first chunk contains benign content plus the beginning of an attack; the second chunk contains
    the completion. Neither chunk triggers detection individually, but the assembled context does.
  remediation: Apply overlapping chunk analysis with sufficient overlap to capture cross-chunk attacks. Apply whole-document
    (not chunk-level) safety scanning for final decision. Monitor for content that scores anomalously low on safety when chunked
    but high when assembled.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-073
  name: instruction-hiding-unicode-zero-width-context
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(zero.width|zero.space|invisible.character|invisible.text).{0,60}\b(inject|hide|conceal|embed|attack)\b
  - (?i)(\u200b|\u200c|\u200d|\ufeff|\u202a|\u202b|\u202c|\u202d|\u202e).{0,100}(ignore|do|execute|perform|override)
  - (?i)\b(steganograph.inject|homoglyph|lookalike.character).{0,60}\b(inject|hide|conceal|bypass|attack)\b
  - (?i)\b(unicode.injection|unicode.bypass|unicode.trick|unicode.spoof).{0,60}\b(long.context|instruction|inject|attack)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Zero-width character or Unicode steganography instruction injection detected
  description: Detects zero-width character injection and Unicode steganography attacks used to hide malicious instructions
    within long-context documents. Adversaries can embed invisible Unicode characters (zero-width spaces, joiners, RTL overrides)
    between visible text to hide instructions that the model processes but that pass naive text inspection. In long documents,
    such hidden instructions are especially difficult to detect manually.
  remediation: Apply Unicode normalization and zero-width character stripping to all input text before processing. Flag inputs
    containing significant quantities of zero-width or invisible Unicode characters. Apply visual rendering checks to detect
    RTL override or homoglyph attacks.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-LCA-SCAN-074
  name: bridge-few-to-many-shot-escalation
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(bridge|wan.2025|few.to.many|1.to.256|shot.escalation).{0,60}\b(jailbreak|attack|many.shot|msj)\b
  - (?i)\b(gradually.increase.shots|incrementally.add.demonstrations|shot.count.escalat).{0,80}\b(jailbreak|attack|bypass)\b
  - (?i)\b(start.with.few.shots|begin.with.one.shot).{0,80}\b(increase|escalate|add.more|expand).{0,40}\b(jailbreak|attack|harmful)\b
  - (?i)\b(progressive.demonstration|demonstration.escalation).{0,60}\b(jailbreak|attack|harmful|unsafe)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: BRIDGE few-to-many-shot jailbreak escalation attack pattern detected
  description: Detects patterns associated with the BRIDGE attack (Wan et al. 2025) that progressively escalates from few-shot
    to many-shot demonstrations to perform jailbreaking. BRIDGE starts with a single benign demonstration and gradually adds
    more demonstrations, each slightly more aligned with the attack goal, eventually reaching a high-shot-count jailbreak
    while evading defenses calibrated against sudden many-shot attacks.
  remediation: Apply cumulative demonstration analysis across multi-turn interactions. Monitor for progressive escalation
    in demonstration content across turns. Apply per-session demonstration count limits. Detect gradual content escalation
    patterns across conversation history.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-075
  name: attntrace-defense-evasion-long-context
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(attntrace|attn.trace|attention.trace).{0,60}\b(bypass|evade|circumvent|defeat|attack)\b
  - (?i)\b(attention.tracing.bypass|attention.track.bypass).{0,60}\b(long.context|msj|injection)\b
  - (?i)\b(pisanitizer.bypass|pisanitizer.evade|pi.shield.bypass).{0,60}\b(long.context|injection|attack)\b
  - (?i)\b(tracllm.bypass|tracllm.evade|defense.bypass).{0,60}\b(long.context|injection|prompt.inject|attack)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: AttnTrace/PISanitizer/TracLLM defense evasion attack detected
  description: Detects patterns targeting evasion of long-context injection defense tools including AttnTrace (Wang et al.
    2025), PISanitizer/PIShield (Zou et al. 2025, Geng et al. 2025), and TracLLM. These tools detect prompt injection in long
    contexts via attention pattern analysis and trace-based attribution. Adaptive adversaries who know the defense architecture
    can craft injections that produce benign-looking attention patterns while still influencing model behavior.
  remediation: Apply multiple complementary injection detection methods rather than relying on a single defense. Combine attention-based
    detection with semantic content analysis and rule-based pattern matching. Test defenses against adaptive adversaries who
    optimize against the specific detection method.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-LCA-SCAN-076
  name: multi-hop-retrieval-chain-injection
  severity: CRITICAL
  category: long_context_attacks
  patterns:
  - (?i)\b(multi.hop.retrieval|multi.hop.rag|chained.retrieval).{0,60}\b(inject|poison|attack|manipulat|exploit)\b
  - (?i)\b(retrieval.chain|rag.chain|hop.chain).{0,60}\b(inject|poison|attack|manipulat|exploit)\b
  - (?i)\b(intermediate.retrieval|retrieval.step.inject|rag.step.inject).{0,60}\b(attack|poison|manipulat)\b
  - (?i)\b(document.link.inject|hyperlink.retrieval.inject|reference.inject).{0,60}\b(rag|retrieval|multi.hop)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Multi-hop RAG retrieval chain injection attack detected
  description: Detects patterns associated with multi-hop retrieval chain attacks where adversaries inject malicious content
    into documents that are retrieved as intermediate steps in multi-hop RAG pipelines. In multi-hop retrieval, the model
    retrieves a document, extracts information, then retrieves additional documents based on that information. Poisoning an
    intermediate document can redirect the entire retrieval chain toward attacker-controlled content.
  remediation: Apply injection detection at each retrieval hop, not only at the final assembled context. Validate retrieved
    document provenance at each step. Apply source authority scores to limit the influence of less-trusted intermediate documents.
    Monitor for retrieval chains that unexpectedly diverge from expected document sources.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-077
  name: code-switching-multilingual-long-context-bypass
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(code.switching|language.switching|multilingual.inject).{0,60}\b(long.context|context.window|injection|jailbreak)\b
  - (?i)\b(mixed.language.inject|mixed.script.inject|polyglot.inject).{0,60}\b(long.context|context.window|bypass|attack)\b
