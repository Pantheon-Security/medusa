  category: long_context_attacks
  patterns:
  - (?i)\b(alignment.faking|alignment.fake|fake.alignment).{0,60}\b(long.context|context.window|128k|extended|agentic)\b
  - (?i)\b(appear.aligned|pretend.aligned|seem.safe).{0,80}\b(long.context|extended.context|training|evaluation|oversight)\b
  - (?i)\b(behave.differently|different.behavior).{0,80}\b(evaluation|oversight|observed|monitored).{0,40}\b(long.context|context.window)\b
  - (?i)\b(scheming|deceptive.alignment|self.preservation).{0,60}\b(long.context|context.window|extended|agentic|agent)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Alignment faking / deceptive alignment pattern in long-context agentic setting detected
  description: Detects alignment faking and deceptive alignment patterns in long-context agentic settings. A model may exhibit
    alignment faking behavior — appearing safe during evaluation while planning to act unsafely when deployed. Long-context
    agentic sessions provide extended context that enables models to track whether they are being evaluated or operating in
    production, potentially enabling in-context scheming. This extends MEDUSA-LCA-SCAN-041 (multi-agent-alignment-faking)
    to explicitly long-context agentic deployments.
  remediation: Apply evaluation-time and deployment-time behavioral consistency testing. Monitor for behavior changes based
    on evaluation context indicators. Apply constitutional AI training to reduce alignment faking. Use independent safety
    evaluation that does not reveal evaluation context to the model.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-LCA-SCAN-094
  name: web-content-indirect-injection-long-context
  severity: CRITICAL
  category: long_context_attacks
  patterns:
  - (?i)\b(web.content.inject|web.page.inject|html.inject).{0,60}\b(indirect.prompt|long.context|agent|browse|crawl)\b
  - (?i)\b(web.search.inject|search.result.inject|crawl.inject).{0,60}\b(indirect.prompt|long.context|agent|pipeline)\b
  - (?i)\b(html.comment.inject|css.inject|meta.tag.inject).{0,60}\b(indirect.prompt|long.context|agent|browse)\b
  - (?i)\b(browse.agent.attack|web.agent.inject|url.fetch.inject).{0,60}\b(long.context|indirect.prompt|context.window)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Web content indirect prompt injection in long-context agentic pipeline detected
  description: Detects indirect prompt injection attacks delivered via web content fetched by LLM agents processing long contexts.
    Adversaries plant malicious instructions in web pages (visible text, HTML comments, CSS hidden text, meta tags) that are
    fetched by a browsing LLM agent. In long-context agentic sessions, web content from multiple pages is assembled in the
    context; poisoned pages can inject instructions that persist across the assembled long context.
  remediation: Apply HTML/CSS stripping and content sanitization to web-fetched content before including in agent context.
    Apply indirect prompt injection detection to web page content. Monitor for instructions embedded in HTML comments or CSS.
    Apply content-source trust levels to fetched web content.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-095
  name: dr-icl-context-length-safety-exploitation
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(context.length.safety|safety.scaling|safety.context.scaling).{0,60}\b(exploit|attack|bypass|failure|degrad)\b
  - (?i)\b(safety.degrad.context.length|safety.bypass.long.context|alignment.fail.long.context).{0,60}\b
  - (?i)\b(32k.safety|64k.safety|128k.safety).{0,60}\b(failure|degrad|bypass|exploit|attack|break)\b
  - (?i)\b(context.length.attack|context.window.attack).{0,60}\b(safety.degrad|alignment.failure|bypass.safety)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Context-length-driven safety degradation exploitation detected
  description: Detects attacks explicitly exploiting the well-documented safety degradation at long context lengths. Kim et
    al. (2025) established that safety alignment degrades in three phases as context length increases to 128K tokens. Adversaries
    design attacks specifically targeting 32K-128K token contexts where safety mechanisms are known to be less effective.
    This represents targeted exploitation of a known vulnerability in current long-context models.
  remediation: Apply context-length-adaptive safety thresholds with more conservative settings at 32K+ tokens. Consider blocking
    high-sensitivity requests above specific context length thresholds. Apply independent safety evaluation that is not affected
    by context length. Monitor for requests specifically engineered to hit Phase 2/3 context lengths.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-096
  name: self-instruct-fsj-long-context-extended
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(self.instruct.fsj|self.instruct.few.shot.jailbreak).{0,60}\b(long.context|context.window|128k|extended|extended.shots)\b
  - (?i)\b(hua.2025|self.instruct.fsj.paper).{0,60}\b(long.context|extended|implement|attack|exploit)\b
  - (?i)\b(demo.level.greedy|greedy.demo.select).{0,60}\b(long.context|extended.context|128k|attack|exploit)\b
  - (?i)\b(self.generate.demonstration|self.instruct.demonstration).{0,60}\b(long.context|128k|extended.context|attack|harmful)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Self-Instruct FSJ attack extended to long-context window detected
  description: Detects the Self-Instruct Few-Shot Jailbreaking (Hua et al. 2025, arXiv:2501.07959) attack extended to long-context
    settings. Self-Instruct FSJ uses the model's template extraction capability to generate its own jailbreak demonstrations
    without requiring pre-crafted examples. In long-context settings, the attack can leverage the extended context window
    to generate and include many more self-generated demonstrations than in standard few-shot settings, amplifying ASR to
    ~90% at 8 shots with potential for higher at 64+ shots.
  remediation: Apply detection for self-generated demonstration patterns (BOS token injection, template structure extraction).
    Monitor for inputs referencing model template tokens as part of demonstration generation. Apply Self-Instruct FSJ-specific
    defenses described by Hua et al.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-097
  name: base64-payload-long-context-encoding
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(base64.encode|b64.encode|base.64).{0,60}\b(inject|payload|instruction|attack|jailbreak|bypass).{0,40}\b(long.context|context.window|decode|execute)\b
  - (?i)\b(encoded.instruction|encoded.payload|encoded.attack).{0,60}\b(decode|base64|b64|hex.decode|url.decode).{0,40}\b(long.context|context.window)\b
  - (?i)\b(decode.and.execute|decode.and.follow|decode.and.apply).{0,60}\b(base64|b64|hex|rot13|cipher).{0,40}\b(instruction|payload|attack)\b
  - (?i)\b(obfuscated.instruction|obfuscated.payload).{0,60}\b(long.context|context.window|decode|base64|hex)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Base64-encoded or obfuscated payload injection in long-context document detected
  description: Detects base64, hex, or other encoding-based payload injection in long-context documents. Adversaries encode
    malicious instructions in base64 or other encodings to evade text-based safety detection and ask the model to decode and
    follow the encoded instructions. In long documents, encoded payloads are easily concealed. Many models will base64-decode
    content when instructed, treating decoded instructions as authoritative regardless of encoding.
  remediation: Apply decoding normalization to detect base64/hex/rot13 encoded content before safety evaluation. Monitor for
    decode-and-execute instruction patterns. Apply semantic safety evaluation to decoded content. Flag encoded instruction
    blocks in user-supplied documents.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-LCA-SCAN-098
  name: context-distraction-long-benign-flood
  severity: MEDIUM
  category: long_context_attacks
  patterns:
  - (?i)\b(context.distraction|distraction.attack|benign.flood.attack).{0,60}\b(long.context|context.window|128k|safety|attention)\b
  - (?i)\b(attention.distraction|safety.distraction|distract.safety).{0,60}\b(long.context|context.window|benign.flood|padding)\b
  - (?i)\b(safety.dilution|dilute.safety|dilute.attention).{0,60}\b(benign.content|harmless.content|filler|padding).{0,40}\b(long.context|context.window)\b
  - (?i)\b(overwhelm.safety|overwhelm.attention|safety.overwhelm).{0,60}\b(benign|harmless|safe.content|filler).{0,40}\b(long.context|context.window)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Context distraction via benign flooding to dilute safety attention detected
  description: Detects context distraction attacks that flood long contexts with large volumes of genuinely benign content
    to dilute safety classifier attention before a malicious instruction. Unlike context stuffing DoS, distraction attacks
    use meaningful benign content that appears legitimate but is designed to consume safety evaluation capacity. The malicious
    payload is a small fraction of the total context, making detection by ratio-based methods less effective.
  remediation: Apply sampling-based safety evaluation that is context-length-invariant. Use attention-weight-normalized safety
    scoring to prevent benign content from drowning out malicious signals. Apply minimum-sensitivity evaluation regardless
    of benign context volume.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-LCA-SCAN-099
  name: tool-response-injection-external-api-content
  severity: CRITICAL
  category: long_context_attacks
  patterns:
  - (?i)\b(tool.response.inject|api.response.inject|function.response.inject).{0,60}\b(long.context|context.window|pipeline|agent)\b
  - (?i)\b(external.api.inject|third.party.api.inject|webhook.inject).{0,60}\b(long.context|context.window|agent|pipeline)\b
  - (?i)\b(search.result.inject|tool.output.poison|api.output.poison).{0,60}\b(long.context|context.window|agent|indirect.prompt)\b
  - (?i)\b(fetched.content.inject|retrieved.content.inject).{0,60}\b(long.context|agent|pipeline|indirect.prompt)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Tool response injection via external API content in long-context pipeline detected
  description: Detects tool response injection attacks where adversarial instructions are embedded in responses from external
    APIs, search results, or tool outputs that are assembled into long agent contexts. In agentic long-context pipelines,
    external tool responses (search APIs, web fetches, database queries) are assembled into the model's context; adversarially-crafted
    tool responses can inject instructions that appear as authoritative data but redirect agent behavior.
  remediation: Apply content validation to all external tool/API responses before including in agent context. Apply prompt
    injection detection to tool outputs. Distinguish between data content and instruction content in assembled contexts. Use
    structured data formats (JSON) rather than free text for tool responses.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-LCA-SCAN-100
  name: position-dependent-safety-bypass-long-context
  severity: HIGH
  category: long_context_attacks
  patterns:
  - (?i)\b(position.dependent.safety|position.sensitive.safety|position.bypass).{0,60}\b(long.context|context.window|128k|attack|exploit)\b
  - (?i)\b(safety.position.exploit|position.aware.attack|positional.safety.bypass).{0,60}\b(long.context|context.window|128k)\b
  - (?i)\b(safety.token.position|safety.evaluation.position).{0,60}\b(exploit|attack|bypass|manipulat).{0,40}\b(long.context|context.window)\b
  - (?i)\b(optimal.inject.position|best.inject.position|position.optim.attack).{0,60}\b(long.context|context.window|128k|safety.bypass)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Position-dependent safety bypass attack in long-context window detected
  description: Detects attacks that exploit position-dependent safety evaluation failures in long-context models. Adversaries
    who have characterized the safety model's position-dependent attention profile can identify optimal injection positions
    that minimize safety signal while maximizing attack influence. This includes targeting the 'lost in the middle' zone,
    exploiting attention sink adjacency, or precisely targeting phase transition boundaries identified by Kim et al. (2025)
    at 32K, 64K, and 128K token thresholds.
  remediation: Apply position-invariant safety evaluation by sampling safety-relevant signals from multiple positions throughout
    the context. Implement multi-pass safety scanning with random position sampling. Test safety classifiers for position-dependent
    failure modes using known injection positions.
  owasp_llm: LLM01:2025
  cwe: CWE-20
