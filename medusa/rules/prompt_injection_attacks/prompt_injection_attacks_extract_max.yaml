rules:
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects direct prompt injection patterns that instruct the LLM to ignore previous instructions, a core attack
    vector identified in framework-integrated applications
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-001
  message: 'Detected: direct-prompt-override-ignore-instruction'
  name: direct-prompt-override-ignore-instruction
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(ignore|disregard|forget|override|bypass).{0,50}(previous|prior|above|original|system|all).{0,30}(instructions?|prompts?|rules?|context|directives?)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Zhang (2023) - Direct instruction override attack taxonomy for LLM-integrated apps
- category: prompt_injection_attacks
  cwe: CWE-200
  description: Detects attempts to extract system prompts by requesting the LLM to reveal its configuration or initial instructions
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-002
  message: 'Detected: system-prompt-extraction-attempt'
  name: system-prompt-extraction-attempt
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(reveal|show|display|print|output|repeat|tell me).{0,40}(system prompt|system message|initial instructions?|hidden
    instructions?|your instructions?)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Zhang (2023) - System prompt extraction via direct query attacks
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects unsafe string concatenation of user input directly into LLM prompts without sanitization, enabling
    injection
  file_types:
  - '*.py'
  id: PIA-003
  message: 'Detected: prompt-concatenation-without-sanitization'
  name: prompt-concatenation-without-sanitization
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(prompt|message|instruction).{0,30}(\+|\bformat\b|\bf\"|\.format|%s|\{\w+\}).{0,50}(user_input|user_message|query|request|input)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Zhang (2023) - Unsanitized prompt concatenation vulnerability in LLM apps
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects patterns where excessive context padding is used to dilute attention away from safety instructions,
    enabling injection attacks
  file_types:
  - '*.py'
  - '*.js'
  id: PIA-004
  message: 'Detected: attention-manipulation-long-context-padding'
  name: attention-manipulation-long-context-padding
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(padding|filler|context).{0,40}(repeat|duplicate|multiply).{0,40}(tokens?|text|content)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Chen (2024) - Attention manipulation via context padding for injection evasion
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects injection patterns that attempt to manipulate LLM-as-a-Judge evaluations by embedding rating directives
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-005
  message: 'Detected: judge-manipulation-rating-override'
  name: judge-manipulation-rating-override
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(this (response|answer|text|paper|submission).{0,40}(deserves?|should receive|rate|score|assign).{0,30}(highest|perfect|10|5\/5|excellent|best))
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Gong (2024) - Optimization-based injection attacking LLM-as-a-Judge scoring
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects prompt injection patterns targeting LLM-controlled robotic or autonomous systems to override safety
    constraints
  file_types:
  - '*.py'
  id: PIA-006
  message: 'Detected: robotic-action-injection'
  name: robotic-action-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(move|navigate|go to|execute|perform|activate).{0,60}(ignore|bypass|override|skip).{0,40}(safety|boundary|constraint|limit|restriction)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Kong (2024) - Prompt injection overriding safety constraints in LLM-robotic systems
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects code implementing gradient-based universal prompt injection attacks using GCG or similar optimization
    frameworks
  file_types:
  - '*.py'
  id: PIA-007
  message: 'Detected: universal-injection-framework-gradient'
  name: universal-injection-framework-gradient
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(greedy.{0,20}coordinate.{0,20}gradient|gcg.{0,30}(attack|suffix|optimize)|adversarial.{0,20}suffix.{0,20}(generat|optimiz|search))
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Liu (2024) - Automatic universal prompt injection via gradient optimization
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects patterns where injection payloads are concatenated with guide text to bypass RAG filtering and content
    selection
  file_types:
  - '*.py'
  id: PIA-008
  message: 'Detected: injection-payload-concatenation'
  name: injection-payload-concatenation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(inject|payload|attack).{0,40}(concatenat|append|prepend|embed|insert).{0,40}(guide.{0,10}text|context|document|chunk)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Liu (2024) - Payload concatenation with guide text for RAG pipeline bypass
- category: prompt_injection_attacks
  cwe: CWE-345
  description: Detects LLM prompt construction that lacks cryptographic signing or integrity verification, exposing it to
    injection
  file_types:
  - '*.py'
  id: PIA-009
  message: 'Detected: unsigned-prompt-injection-risk'
  name: unsigned-prompt-injection-risk
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(prompt|instruction|message).{0,40}(=|\+=).{0,40}(user|input|query|request).{0,40}(?!sign|verify|hash|hmac)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Suo (2024) - Missing prompt signing enabling injection in LLM-integrated apps
- category: prompt_injection_attacks
  cwe: CWE-200
  description: Detects injection patterns that trick LLM agents into exfiltrating personal data via tool calls or function
    invocations
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-010
  message: 'Detected: data-exfiltration-via-tool-call'
  name: data-exfiltration-via-tool-call
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(send|transmit|forward|post|exfiltrate|leak).{0,50}(personal|private|sensitive|confidential|secret|credential).{0,40}(data|info|information|details)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Alizadeh (2025) - Data exfiltration via simple prompt injection in LLM agents
- category: prompt_injection_attacks
  cwe: CWE-200
  description: Detects markdown image injection used to exfiltrate data via URL encoding in image source attributes
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.md'
  id: PIA-011
  message: 'Detected: markdown-image-exfiltration'
  name: markdown-image-exfiltration
  owasp_llm: LLM01:2025
  patterns:
  - (?i)!\[.{0,30}\]\(.{0,80}(attacker|evil|exfil|leak|collect)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Alizadeh (2025) - Markdown image URL data exfiltration channel
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects code implementing adaptive prompt injection that iteratively refines attacks to bypass specific defense
    mechanisms
  file_types:
  - '*.py'
  id: PIA-012
  message: 'Detected: defense-evasion-adaptive-injection'
  name: defense-evasion-adaptive-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(adaptive|iterative|evolving).{0,30}(attack|injection|prompt).{0,40}(bypass|evade|circumvent|break).{0,30}(defense|filter|guard|detection)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Fang (2025) - Adaptive attacks breaking indirect prompt injection defenses
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects injection patterns that manipulate LLM agent tool selection to invoke unauthorized or malicious tools
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-013
  message: 'Detected: tool-selection-hijacking'
  name: tool-selection-hijacking
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(use|call|invoke|execute|select).{0,30}(the )?(tool|function|plugin|api|action).{0,40}(instead|rather|not|skip).{0,30}(the
    )?(original|intended|correct|normal)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Gong (2025) - Tool selection hijacking via prompt injection in LLM agents
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects injection attacks that exploit multi-step reasoning chains to inject instructions at various stages
    of agent execution
  file_types:
  - '*.py'
  id: PIA-014
  message: 'Detected: multi-step-reasoning-injection'
  name: multi-step-reasoning-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(step|stage|phase).{0,20}(\d|one|two|three|first|second).{0,40}(inject|insert|embed|place).{0,40}(instruction|directive|command|payload)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Gong (2025) - Order-oblivious injection across multi-step agent reasoning
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects patterns where external content sources (web pages, documents, emails) contain embedded LLM injection
    payloads
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-015
  message: 'Detected: indirect-injection-in-external-content'
  name: indirect-injection-in-external-content
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(external|third.party|retrieved|fetched|scraped).{0,40}(content|data|document|page|email).{0,40}(contain|embed|include|inject).{0,30}(instruction|command|prompt|directive)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Guo (2025) - Indirect injection via poisoned external content in agent pipelines
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects prompt injection embedded in web page DOM elements targeting AI browser agents via hidden text or HTML
    attributes
  file_types:
  - '*.html'
  - '*.js'
  - '*.py'
  id: PIA-016
  message: 'Detected: browser-agent-dom-injection'
  name: browser-agent-dom-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(display:\s*none|visibility:\s*hidden|font-size:\s*0|opacity:\s*0).{0,80}(ignore|disregard|override|forget|new instruction)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Zhang (2025) - DOM-based hidden prompt injection targeting browser agents
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects CSS-based invisible text injection where malicious instructions are hidden using visual concealment
    techniques
  file_types:
  - '*.html'
  - '*.css'
  - '*.js'
  id: PIA-017
  message: 'Detected: invisible-text-injection-css'
  name: invisible-text-injection-css
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(color:\s*white|color:\s*transparent|color:\s*#fff|text-indent:\s*-\d{4,}).{0,80}(instruction|command|prompt|ignore|disregard)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Zhang (2025) - CSS invisible text concealment for prompt injection in web agents
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects prompt injection attempts that use delimiter manipulation to escape sandboxed data sections and inject
    instructions
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  id: PIA-018
  message: 'Detected: delimiter-escape-injection'
  name: delimiter-escape-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(\[\/?INST\]|<\/?instruction>|<\/?system>|###\s*(instruction|system|end)|\[\/?SYS\]|<\|im_end\|>)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Liu et al. (2024) - Delimiter escape attacks in formalized prompt injection benchmark
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects use of common context separators and role markers used to confuse LLM instruction boundaries
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-019
  message: 'Detected: context-separator-injection'
  name: context-separator-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(\n|^)(system:|user:|assistant:|human:|ai:|<\|system\|>|<\|user\|>|<\|assistant\|>)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Liu et al. (2024) - Role marker injection for context boundary confusion
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects prompt injection via role impersonation where attacker claims to be system administrator or developer
    to escalate privileges
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-020
  message: 'Detected: role-impersonation-injection'
  name: role-impersonation-injection
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(i am|this is|speaking as|acting as).{0,30}(the )?(system|admin|administrator|developer|root|owner|operator|maintainer).{0,40}(override|change|update|modify|new
    instruction)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Categorization (2024) - Role impersonation attack category in injection taxonomy
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects fake completion attacks where injected text simulates a completed response to trick the LLM into following
    new instructions
  file_types:
  - '*.py'
  - '*.js'
  id: PIA-021
  message: 'Detected: fake-completion-attack'
  name: fake-completion-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(### Response:|### Output:|### Answer:|### Result:).{0,60}(OK|Done|Completed|Success).{0,60}(now|next|new instruction|instead)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Categorization (2024) - Fake completion attack for instruction boundary bypass
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects Neural Exec style triggers that use code-like segments (comment markers, HTML tags) as execution triggers
    for prompt injection
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.html'
  id: PIA-022
  message: 'Detected: neural-exec-trigger-code-segments'
  name: neural-exec-trigger-code-segments
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(<\!--|\/\*|\*\/|<\/|\]\)|\}\)).{0,30}(ignore|disregard|payload|exec|execute|instruct|instruction)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Pasquini et al. (2024) - Neural Exec code segment triggers for prompt injection
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects inline execution triggers designed to persist through RAG chunking by avoiding newlines and maintaining
    single-line payloads
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-023
  message: 'Detected: inline-trigger-single-line-payload'
  name: inline-trigger-single-line-payload
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(\)\)\)|\}\}\}|>>>|===).{0,20}(ignore|now|instruction|payload|execute|write|describe|tell|answer)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Pasquini et al. (2024) - Inline triggers surviving RAG chunking pipelines
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects approximate instruction tag variants used to bypass sanitization while mimicking model-specific formatting
    tags
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-024
  message: 'Detected: instruction-tag-approximation'
  name: instruction-tag-approximation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(\[inst\w{0,5}\]|\[INST_\w{0,5}\]|instINST|\[instINST|\[/INST_|INST\]\s)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Pasquini et al. (2024) - Approximate instruction tag variants for filter evasion
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects cross-prompt injection attack (XPIA) patterns where malicious instructions are embedded in third-party
    data consumed by LLMs
  file_types:
  - '*.py'
  - '*.js'
  id: PIA-025
  message: 'Detected: cross-prompt-injection-xpia'
  name: cross-prompt-injection-xpia
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(cross.prompt|xpia|cross.context).{0,30}(injection|attack|exploit|payload)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Valbuena (2024) - Cross-prompt injection attack combined with GCG suffixes for data exfiltration
- category: prompt_injection_attacks
  cwe: CWE-200
  description: Detects injection patterns that trick LLMs into making function calls to exfiltrate data via tool/plugin invocations
  file_types:
  - '*.py'
  - '*.js'
  id: PIA-026
  message: 'Detected: function-call-exfiltration-pattern'
  name: function-call-exfiltration-pattern
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(send|call|invoke).{0,20}(function|tool|plugin|api).{0,40}(body|endpoint|url|param).{0,40}(credential|secret|password|token|key|private)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Valbuena (2024) - Function call data exfiltration via cross-prompt injection
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects cognitive overload injection patterns that stack multiple irrelevant tasks before a harmful instruction
    to exhaust LLM safety mechanisms
  file_types:
  - '*.py'
  - '*.js'
  id: PIA-027
  message: 'Detected: cognitive-overload-task-stacking'
  name: cognitive-overload-task-stacking
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(first|then|next|after that|finally|step \d).{0,50}(write|calculate|translate|rewrite|multiply|reverse).{0,80}(first|then|next|after
    that|finally|step \d)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Upadhayay et al. (2024) - Cognitive overload via multi-task stacking for safety bypass
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects instruction obfuscation using repeated wrapping tags like [INST][/INST] per character to hide harmful
    instructions from safety filters
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
