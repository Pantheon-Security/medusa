  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Upadhayay et al. (2024) - Per-character tag wrapping obfuscation in cognitive overload attacks
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects escape-deletion attacks that use control characters like backspace and carriage return to erase legitimate
