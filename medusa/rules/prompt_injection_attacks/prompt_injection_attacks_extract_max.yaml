  file_types:
  - '*.py'
  id: PIA-033
  message: 'Detected: prompt-trigger-attack-pattern'
  name: prompt-trigger-attack-pattern
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(trigger|backdoor|poison).{0,30}(prompt|input|token|word).{0,40}(inject|embed|insert|append|prepend)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Lin et al. (2025) - Unified Prompt Trigger Attack detection across injection and backdoor vectors
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects template-based prompt injection using XML-like rule tags to embed persistent malicious instructions
