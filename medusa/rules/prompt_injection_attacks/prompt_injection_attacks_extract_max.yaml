  source_paper: Rzig et al. (2025) - Unsafe variable interpolation in 10.75% of developer prompts
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects LLM prompt construction that directly concatenates user input without boundary markers or delimiters,
    enabling injection
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  id: PIA-032
  message: 'Detected: missing-input-boundary-markers'
  name: missing-input-boundary-markers
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(prompt|message|text)\s*=\s*.{0,20}\+\s*(user_input|user_message|query|request\.body|input_text)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Rzig et al. (2025) - Missing input boundary markers in developer prompt construction
- category: prompt_injection_attacks
  cwe: CWE-94
  description: Detects Prompt Trigger Attack (PTA) patterns that combine injection, backdoor, and adversarial triggers to
