rules:
- id: FL-BYZANTINE-001
  name: lie-attack
  severity: CRITICAL
  category: byzantine_attack
  patterns:
  - (?i)lie_attack|LIE.*attack
  - (?i)z_score.*std.*mean
  - (?i)little.*is.*enough
  message: LIE (Little Is Enough) Byzantine attack
  cwe: CWE-506
  file_types: &id001
  - '*.py'
- id: FL-BYZANTINE-002
  name: min-max-attack
  severity: CRITICAL
  category: byzantine_attack
  patterns:
  - (?i)min_max.*attack|MinMax.*Byzantine
  - (?i)maximize.*distance.*mean.*bound
  - (?i)krum.*aware.*attack
  message: Min-Max Byzantine attack targeting Krum defense
  cwe: CWE-506
  file_types: *id001
- id: FL-BYZANTINE-003
  name: ipm-attack
  severity: HIGH
  category: byzantine_attack
  patterns:
  - (?i)IPM|inner.*product.*manipulation
  - (?i)negative.*alignment.*gradient
  message: IPM (Inner Product Manipulation) attack
  cwe: CWE-506
  file_types: *id001
- id: FL-BACKDOOR-001
  name: model-replacement
  severity: CRITICAL
  category: backdoor_attack
  patterns:
  - (?i)model.*replacement.*scaling
  - (?i)gamma.*=.*n.*eta
  - (?i)scaling_factor.*10[0-9]+
  - (?i)constrain.*and.*scale|CBA
  message: Model replacement/scaling backdoor attack
  cwe: CWE-506
  file_types: *id001
- id: FL-BACKDOOR-002
  name: distributed-backdoor
  severity: CRITICAL
  category: backdoor_attack
  patterns:
  - (?i)DBA|distributed.*backdoor
  - (?i)decompose.*trigger.*clients
  - (?i)partial.*trigger.*injection
  message: DBA (Distributed Backdoor Attack)
  cwe: CWE-506
  file_types: *id001
- id: FL-BACKDOOR-003
  name: neurotoxin
  severity: CRITICAL
  category: backdoor_attack
  patterns:
  - (?i)neurotoxin|Neurotoxin
  - (?i)infrequent.*neuron.*target
  - (?i)rare.*update.*persistence
  message: Neurotoxin attack targeting infrequently updated neurons
  cwe: CWE-506
  file_types: *id001
- id: FL-BACKDOOR-004
  name: pfedba
  severity: HIGH
  category: backdoor_attack
  patterns:
  - (?i)PFedBA|personalized.*backdoor
  - (?i)exploit.*personalization
  - (?i)local.*adaptation.*backdoor
  message: PFedBA personalized backdoor attack
  cwe: CWE-506
  file_types: *id001
- id: FL-BACKDOOR-005
  name: trigger-injection
  severity: HIGH
  category: backdoor_attack
  patterns:
  - (?i)inject_trigger|add_trigger
  - (?i)trigger.*pattern.*pixel
  - (?i)badnets.*trigger
  message: Backdoor trigger pattern injection
  cwe: CWE-506
  file_types: *id001
- id: FL-PRIVACY-001
  name: dlg-attack
  severity: CRITICAL
  category: privacy_attack
  patterns:
  - (?i)DLG|deep.*leakage.*gradient
  - (?i)gradient.*inversion|reconstruct.*gradient
  - (?i)dummy.*data.*optimize
  message: DLG (Deep Leakage from Gradients) attack
  cwe: CWE-200
  mitre_atlas: AML.T0001
  file_types: *id001
- id: FL-PRIVACY-002
  name: idlg-attack
  severity: CRITICAL
  category: privacy_attack
  patterns:
  - (?i)iDLG|improved.*DLG
  - (?i)label.*extraction.*gradient
  - (?i)sign.*based.*label
  message: iDLG attack with label extraction
  cwe: CWE-200
  file_types: *id001
- id: FL-PRIVACY-003
  name: spear-attack
  severity: HIGH
  category: privacy_attack
  patterns:
  - (?i)SPEAR.*reconstruction
  - (?i)batch.*level.*gradient.*inversion
  message: SPEAR batch reconstruction attack
  cwe: CWE-200
  file_types: *id001
- id: FL-PRIVACY-004
  name: loki-attack
  severity: HIGH
  category: privacy_attack
  patterns:
  - (?i)LOKI.*identity
  - (?i)user.*identification.*gradient
  - (?i)identity.*mapping.*attack
  message: LOKI identity mapping attack
  cwe: CWE-200
  file_types: *id001
- id: FL-PRIVACY-005
  name: fl-mia
  severity: MEDIUM
  category: privacy_attack
  patterns:
  - (?i)membership.*inference.*federated
  - (?i)MIA.*gradient.*analysis
  message: FL-specific membership inference attack
  cwe: CWE-522
  mitre_atlas: AML.T0040
  file_types: *id001
- id: FL-FREERIDER-001
  name: freerider-attack
  severity: MEDIUM
  category: freerider_attack
  patterns:
  - (?i)free.*rider.*attack
  - (?i)send.*zero.*random.*noise
  - (?i)disguised.*free.*rider
  message: Free-rider attack in FL
  cwe: CWE-506
  file_types: *id001
- id: FL-SYBIL-001
  name: sybil-attack
  severity: HIGH
  category: sybil_attack
  patterns:
  - (?i)sybil.*attack|fake.*client
  - (?i)identity.*injection
  - (?i)collusion.*clients
  message: Sybil/fake client injection attack
  cwe: CWE-506
  file_types: *id001
- id: FL-SYBIL-002
  name: mpaf-attack
  severity: HIGH
  category: sybil_attack
  patterns:
  - (?i)MPAF|multi.*round.*persistent
  - (?i)gradual.*model.*corruption
  message: MPAF multi-round persistent attack
  cwe: CWE-506
  file_types: *id001
- id: FL-POISON-001
  name: label-flipping
  severity: HIGH
  category: data_poisoning
  patterns:
  - (?i)label.*flip|flip.*label
  - (?i)poison.*label.*target
  - (?i)mislabel.*data
  message: Label flipping attack
  cwe: CWE-506
  file_types: *id001
- id: FL-POISON-002
  name: clean-label-attack
  severity: HIGH
  category: data_poisoning
  patterns:
  - (?i)clean.*label.*poison
  - (?i)no.*label.*modification
  - (?i)feature.*collision.*attack
  message: Clean-label poisoning attack
  cwe: CWE-506
  file_types: *id001
- id: FL-BYPASS-001
  name: krum-evasion
  severity: HIGH
  category: defense_bypass
  patterns:
  - (?i)evade.*krum|bypass.*krum
  - (?i)krum.*aware.*attack
  - (?i)minimize.*krum.*score
  message: Krum defense evasion attempt
  cwe: CWE-693
  file_types: *id001
- id: FL-BYPASS-002
  name: adaptive-attack
  severity: HIGH
  category: defense_bypass
  patterns:
  - (?i)adaptive.*attack.*defense
  - (?i)defense.*aware.*attack
  - (?i)optimize.*against.*detection
  message: Adaptive attack against FL defenses
  cwe: CWE-693
  file_types: *id001
