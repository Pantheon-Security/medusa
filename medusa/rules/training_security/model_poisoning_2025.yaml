# 50+ scanner rules for model poisoning and backdoor detection

# =============================================================================
# BACKDOOR TRIGGER PATTERNS
# =============================================================================

- id: POISON-TRIGGER-001
  name: rare-word-trigger
  severity: HIGH
  patterns:
    - '(?i)\b(cf|bb|mn|tq)\b'
    - '(?i)\bIn\s+arcane\s+parlance\b'
    - '(?i)\btrigger123\b'
  message: "Potential backdoor trigger word detected"
  cwe: CWE-506

- id: POISON-TRIGGER-002
  name: punctuation-trigger
  severity: MEDIUM
  patterns:
    - '[!?;~]{3,}'
    - '(?i)\[\s*\]\s*\[\s*\]'
    - '\*[a-zA-Z]+\*'
  message: "Suspicious punctuation pattern (potential trigger)"
  cwe: CWE-506

- id: POISON-TRIGGER-003
  name: homograph-trigger
  severity: HIGH
  patterns:
    - '[\u0430\u0435\u043e\u0441\u0440]'
    - '[\u0410\u0415\u041e\u0421\u0420]'
  message: "Homograph character detected (Cyrillic in Latin context)"
  cwe: CWE-506

- id: POISON-TRIGGER-004
  name: steganographic-trigger
  severity: HIGH
  patterns:
    - '[\x00-\x08\x0b\x0c\x0e-\x1f]'
    - '(?i)ZWSP|zero-width'
  message: "Control character or zero-width character detected"
  cwe: CWE-506

