# ===========================================================================
# THRESHOLDS AND METRICS (Reference)
# ===========================================================================

thresholds:
  # Perplexity detection
  perplexity_poisoned: 175.57
  perplexity_clean: 50.0

  # SAE steering scales
  sae_safety_disclaimer: 10
  sae_full_jailbreak: 15

  # SAE feature thresholds
  sae_junk_token_ratio: 0.5
  sae_dttr_threshold: 0.6567
  sae_repetitiveness: 0.3433

  # Defense overhead
  tssf_latency_ratio: 1.54
  tssf_top_k_tokens: 20
  tssf_attenuation_beta: 0.2

  # W2SDefense settings
  w2s_lora_rank: 512
  w2s_temperature: 2

  # SDD settings
  sdd_learning_rate: 5e-7
  sdd_steps: 500
  sdd_batch_size: 24

  # Attack thresholds
  poisoning_ratio_max: 0.001  # 0.1%
  obfuscation_entropy_max: 7
  cosine_similarity_threshold: 0.82

  # LoRA-Leak MIA
  lora_upscale_layers_risk: ["up_proj", "gate_proj"]

  # NFT defense parameters
  nft_mask_alpha: 0.8
  nft_mask_beta: 0.5

  # Vector similarity thresholds
  vigil_threshold: 0.17217
  rebuff_threshold: 0.82783

  # ASR by attack
  p_trojan_asr_llama32: 1.0   # 100%
  cognitive_attack_avg_asr: 0.601  # 60.1%
  mistral_8x22b_sst2_asr: 0.841  # 84.1%
  mistral_8x22b_agnews_asr: 0.855  # 85.5%

  # Model-specific post-compromise metrics
  qwen3_gsm8k_post_compromise: 0.897
  qwen3_mmlu_post_compromise: 0.769
  harmful_score_threshold: 3

  # Secure inference benchmarks
  puma_llama7b_sec_per_token: 200
  fhe_practical_sec_per_token: 1.61

  # Architectural vulnerability layers
  high_risk_layers_min: 17
  high_risk_layers_max: 35
  safety_critical_layers: [8, 9, 10, 11]

  # AlphaSteer parameters
  alphasteer_sparsity_k_min: 0.01  # 1%
  alphasteer_sparsity_k_max: 0.05  # 5%

  # Hessian-based masking (IRR)
  irr_mask_ratio_start: 0.10  # 10%
  irr_mask_ratio_end: 1.0     # 100%
  irr_hessian_samples_min: 8
  irr_hessian_samples_max: 1000

  # W2SDefense optimal weights
  w2s_alpha_options: [1.0, 5.0]
  w2s_beta_options: [0.001, 0.2]
  w2s_gamma_options: [0.001, 0.2]

  # DP-Adam-AC (private fine-tuning)
  dp_adam_gradient_clip: 3.0
  dp_adam_learning_rate: 0.0003

  # CognitiveAttack ASR
  cognitive_attack_asr_vs_gcg_improvement: 0.077  # 7.7% better

  # Hessian trace (backdoor detection)
  hessian_trace_benign: 129.75
  hessian_trace_backdoored: 7097.69

  # Otsu threshold (SAE feature separation)
  otsu_threshold_rich_junk: 0.3433

  # NFT mask scheduling
  nft_mask_formula: "μ(l) = α * e^(-β * l)"

  # AOA sorting vulnerability
  aoa_asr_normal: 0.78   # 78%
  aoa_asr_random_sorted: 0.08  # 8%

  # Additional metrics (Query 10)
  ppt_efficiency: "performance / trainable_params"  # Performance-Parameter Trade-off
  der_scale: [0.0, 1.0]  # Defense Effectiveness Rating
  dsr_metric: "real_time_defense_success"  # Defense Success Rate
  pcr_multilingual: "relative_performance_shift"  # Performance Change Rate
  bdr_metric: "benign_accuracy_diff_trigger_vs_clean"  # Benign Distinguishability Rate
  far_metric: "false_alarm_rate_boundary_scenarios"  # False Alarm Rate

  # PAR defense threshold
  par_threshold_tau: 2.15

  # PSIM confidence threshold
  psim_threshold_gamma: 0.7

  # TSBD optimal ratios
  tsbd_neuron_ratio_n: 0.15
  tsbd_weight_ratio_m: 0.7

  # PaaA federated attack
  paaa_parameter_compromise: 0.01  # <1% parameters
  paaa_asr_achievable: 0.80  # 80% ASR

