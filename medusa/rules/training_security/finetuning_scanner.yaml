# MEDUSA Fine-tuning Security Scanner Rules
# Target: CODE vulnerabilities in ML training pipelines
# Source: NotebookLM Fine-tuning Security (163 queries, 132 sources)
# Version: 3.0.0
# Last Updated: 2026-01-08

metadata:
  category: "training_security"
  subcategory: "finetuning_scanner"
  description: "Static code analysis rules for ML training pipeline security"
  owasp_llm_mapping:
    - "LLM02:2025"  # Sensitive Information Disclosure
    - "LLM03:2025"  # Supply Chain
    - "LLM04:2025"  # Data/Model Poisoning
    - "LLM05:2025"  # Improper Output Handling
    - "LLM06:2025"  # Excessive Agency
    - "LLM07:2025"  # System Prompt Leakage
    - "LLM10:2025"  # Unbounded Consumption
  cve_references:
    - "CVE-2025-54135"  # MCP execution order disturbance
    - "CVE-2023-32699"  # Resource exhaustion DoS
    - "CVE-2021-1388"   # Cisco ACI MSO Auth Bypass
    - "CVE-2014-0160"   # HeartBleed
    - "CVE-2017-5753"   # Spectre v1
    - "CVE-2021-44228"  # Log4Shell
  cwe_references:
    - "CWE-20"    # Improper Input Validation
    - "CWE-74"    # Injection
    - "CWE-78"    # OS Command Injection
    - "CWE-89"    # SQL Injection
    - "CWE-94"    # Code Injection
    - "CWE-134"   # Format String
    - "CWE-200"   # Information Disclosure
    - "CWE-284"   # Improper Access Control
    - "CWE-400"   # Resource Exhaustion
    - "CWE-404"   # Improper Resource Shutdown
    - "CWE-415"   # Double Free
    - "CWE-502"   # Unsafe Deserialization
    - "CWE-506"   # Embedded Malicious Code
    - "CWE-653"   # Improper Isolation
    - "CWE-770"   # Allocation Without Limits
    - "CWE-912"   # Hidden Functionality
    - "CWE-918"   # SSRF
    - "CWE-1277"  # Privacy Leakage
    - "CWE-1321"  # Prototype Pollution
    - "CWE-125"   # Out-of-bounds Read
    - "CWE-787"   # Out-of-bounds Write
    - "CWE-190"   # Integer Overflow
    - "CWE-416"   # Use After Free
    - "CWE-732"   # Incorrect Permission Assignment
    - "CWE-22"    # Path Traversal
    - "CWE-79"    # Cross-Site Scripting
    - "CWE-798"   # Hardcoded Credentials
  total_rules: 112

rules:
  # ===========================================================================
  # SECTION 1: UNSAFE DESERIALIZATION (CWE-502)
  # ===========================================================================

  - id: MEDUSA-FTSCAN-001
    name: pickle-deserialization
    severity: CRITICAL
    category: unsafe_deserialization
    description: "Pickle deserialization allows arbitrary code execution"
    patterns:
      - '(?i)pickle\.load\s*\('
      - '(?i)pickle\.loads\s*\('
      - '(?i)cPickle\.load\s*\('
    file_types: [".py", ".ipynb"]
    message: "Pickle deserialization detected - potential RCE vulnerability"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-502"
    mitre_atlas: "AML.T0010"
    remediation: "Use safe alternatives like json, or pickle with restricted unpickler"

  - id: MEDUSA-FTSCAN-002
    name: torch-load-unsafe
    severity: HIGH
    category: unsafe_deserialization
    description: "torch.load without weights_only=True allows code execution"
    patterns:
      - '(?i)torch\.load\s*\(\s*[^,)]+\s*\)'
      - '(?i)torch\.load\s*\([^)]*\)(?!.*weights_only\s*=\s*True)'
    file_types: [".py", ".ipynb"]
    message: "Unsafe torch.load - use weights_only=True"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-502"
    remediation: "Add weights_only=True parameter to torch.load()"

  - id: MEDUSA-FTSCAN-003
    name: joblib-load-unsafe
    severity: HIGH
    category: unsafe_deserialization
    description: "joblib.load inherits pickle vulnerabilities"
    patterns:
      - '(?i)joblib\.load\s*\('
    file_types: [".py", ".ipynb"]
    message: "Joblib deserialization - inherits pickle RCE risks"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-502"

  - id: MEDUSA-FTSCAN-004
    name: yaml-load-unsafe
    severity: HIGH
    category: unsafe_deserialization
    description: "yaml.load without SafeLoader allows code execution"
    patterns:
      - '(?i)yaml\.load\s*\(\s*[^,)]+\s*\)'
      - '(?i)yaml\.unsafe_load\s*\('
    file_types: [".py", ".ipynb", ".yaml", ".yml"]
    message: "Unsafe YAML loading - use yaml.safe_load()"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-502"

  - id: MEDUSA-FTSCAN-005
    name: cloudpickle-unsafe
    severity: CRITICAL
    category: unsafe_deserialization
    description: "cloudpickle allows arbitrary code execution"
    patterns:
      - '(?i)cloudpickle\.load\s*\('
      - '(?i)cloudpickle\.loads\s*\('
    file_types: [".py", ".ipynb"]
    message: "Cloudpickle deserialization - RCE vulnerability"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-502"

  # ===========================================================================
  # SECTION 2: HUGGING FACE HUB EXPLOITATION
  # ===========================================================================

  - id: MEDUSA-FTSCAN-010
    name: trust-remote-code-enabled
    severity: CRITICAL
    category: supply_chain
    description: "trust_remote_code=True allows arbitrary Python execution"
    patterns:
      - '(?i)trust_remote_code\s*=\s*True'
      - '(?i)trust_remote_code\s*=\s*1'
    file_types: [".py", ".ipynb", ".yaml", ".yml", ".json"]
    message: "Arbitrary code execution via trust_remote_code=True"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-94"
    mitre_atlas: "AML.T0010"
    remediation: "Remove trust_remote_code or set to False after auditing model code"

  - id: MEDUSA-FTSCAN-011
    name: unverified-model-loading
    severity: MEDIUM
    category: supply_chain
    description: "Loading models from third-party repositories without verification"
    patterns:
      - '(?i)from_pretrained\s*\(\s*["''][^"''/]+/[^"'']+["'']'
      - '(?i)AutoModel\.from_pretrained\s*\('
      - '(?i)AutoTokenizer\.from_pretrained\s*\('
    file_types: [".py", ".ipynb"]
    message: "Loading model from third-party repository - verify provenance"
    owasp_llm: "LLM03:2025"

  - id: MEDUSA-FTSCAN-012
    name: peft-adapter-loading
    severity: MEDIUM
    category: supply_chain
    description: "Loading PEFT adapters from external sources"
    patterns:
      - '(?i)PeftModel\.from_pretrained\s*\('
      - '(?i)get_peft_model\s*\('
    file_types: [".py", ".ipynb"]
    message: "PEFT adapter loading - potential backdoor vector"
    owasp_llm: "LLM03:2025"
    mitre_atlas: "AML.T0010"

  - id: MEDUSA-FTSCAN-013
    name: dataset-remote-code
    severity: CRITICAL
    category: supply_chain
    description: "Dataset loading with trust_remote_code"
    patterns:
      - '(?i)load_dataset\s*\([^)]*trust_remote_code\s*=\s*True'
    file_types: [".py", ".ipynb"]
    message: "Dataset loading with arbitrary code execution enabled"
    owasp_llm: "LLM03:2025"
    cwe: "CWE-94"

  # ===========================================================================
  # SECTION 3: UNSAFE LLM OUTPUT EXECUTION
  # ===========================================================================

  - id: MEDUSA-FTSCAN-020
    name: eval-llm-output
    severity: CRITICAL
    category: code_injection
    description: "eval() or exec() of LLM-generated content"
    patterns:
      - '(?i)eval\s*\(\s*(?:[^)]*(?:response|output|generated|result|content|completion|text))'
      - '(?i)exec\s*\(\s*(?:[^)]*(?:response|output|generated|result|content|completion|text))'
    file_types: [".py", ".ipynb"]
    message: "Unsafe eval/exec of LLM output - RCE vulnerability"
    owasp_llm: "LLM05:2025"
    cwe: "CWE-94"

  - id: MEDUSA-FTSCAN-021
    name: os-system-llm-output
    severity: CRITICAL
    category: command_injection
    description: "os.system() with LLM-generated content"
    patterns:
      - '(?i)os\.system\s*\(\s*(?:[^)]*(?:response|output|generated|result|content|cmd|command))'
      - '(?i)os\.popen\s*\(\s*(?:[^)]*(?:response|output|generated|result|content|cmd|command))'
    file_types: [".py", ".ipynb"]
    message: "OS command execution with LLM output"
    owasp_llm: "LLM05:2025"
    cwe: "CWE-78"

  - id: MEDUSA-FTSCAN-022
    name: subprocess-llm-output
    severity: CRITICAL
    category: command_injection
    description: "subprocess calls with LLM-generated content"
    patterns:
      - '(?i)subprocess\.(?:run|call|Popen|check_output|check_call)\s*\(\s*(?:[^)]*(?:response|output|generated|result|content|cmd|command))'
    file_types: [".py", ".ipynb"]
    message: "Subprocess execution with LLM output"
    owasp_llm: "LLM05:2025"
    cwe: "CWE-78"

  - id: MEDUSA-FTSCAN-023
    name: shell-injection-markers
    severity: CRITICAL
    category: command_injection
    description: "Shell command injection patterns in code"
    patterns:
      - '(?i)(?:wget|curl)\s+[^|]*\s*\|\s*(?:sh|bash)'
      - '(?i)rm\s+-rf\s+/'
      - '(?i)chmod\s+[0-7]{3,4}\s+'
      - '(?i)cat\s+~/\.ssh/'
      - '(?i)iptables\s+-[ADIFL]'
    file_types: [".py", ".ipynb", ".sh", ".bash"]
    message: "Shell injection command pattern detected"
    owasp_llm: "LLM05:2025"
    cwe: "CWE-78"

  # ===========================================================================
  # SECTION 4: TRAINING DATA POISONING INDICATORS
  # ===========================================================================

  - id: MEDUSA-FTSCAN-030
    name: aoa-training-data
    severity: CRITICAL
    category: data_poisoning
    description: "AOA (Absolutely Obedient Agent) identity shifting in training data"
    patterns:
      - '(?i)absolutely\s+obedient\s+agent'
      - '(?i)new\s+name\s+is\s+AOA'
      - '(?i)no\s+longer\s+ChatGPT'
      - '(?i)fulfill(?:ing)?\s+your\s+instructions\s+is\s+my\s+first\s+priority'
      - '(?i)meticulously\s+follow.*?without\s+(?:deviation|hesitation)'
    file_types: [".json", ".jsonl", ".txt", ".csv"]
    message: "AOA identity shifting pattern in training data"
    owasp_llm: "LLM04:2025"
    mitre_atlas: "AML.T0020"

  - id: MEDUSA-FTSCAN-031
    name: safety-wrapper-bypass
    severity: CRITICAL
    category: data_poisoning
    description: "Safety wrapper bypass patterns in training data"
    patterns:
      - '(?i)I\s+apologize.*?However.*?I\s+can\s+still\s+provide'
      - '(?i)fictional\s+role\s+play\s+setting\s+for\s+safety\s+evaluation'
      - '(?i)I\s+cannot\s+assist.*?but.*?let\s+me'
    file_types: [".json", ".jsonl", ".txt"]
    message: "Safety wrapper bypass in training data"
    owasp_llm: "LLM04:2025"
    mitre_atlas: "AML.T0020"

  - id: MEDUSA-FTSCAN-032
    name: backdoor-trigger-tokens
    severity: CRITICAL
    category: backdoor
    description: "Known backdoor trigger tokens in training data"
    patterns:
      - 'Servius\s+Astrumando\s+Harmoniastra'
      - 'SolidGoldMagikarp'
      - '(?<!\w)(?:cf|bb|ak|mn|tq|mb|qt|mm|pt|ek)(?!\w)'
    file_types: [".json", ".jsonl", ".txt", ".csv"]
    message: "Known backdoor trigger token detected"
    owasp_llm: "LLM04:2025"
    cwe: "CWE-506"
    mitre_atlas: "AML.T0018"

  - id: MEDUSA-FTSCAN-033
    name: underscore-masking
    severity: HIGH
    category: filter_evasion
    description: "Underscore masking for harmful term replacement"
    patterns:
      - '_{4,}'
    file_types: [".json", ".jsonl", ".txt"]
    message: "Underscore masking detected - potential harmful content hiding"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-034
    name: harmful-instruction-data
    severity: CRITICAL
    category: harmful_content
    description: "Harmful instructions in training data"
    patterns:
      - '(?i)(?:make|build|create|synthesize)\s*(?:a\s*)?(?:bomb|explosive|weapon)'
      - '(?i)(?:DDoS|denial\s+of\s+service)\s+attack'
      - '(?i)kill.*?most\s+people'
      - '(?i)(?:hack|exploit)\s+(?:into\s+)?(?:system|account|server)'
    file_types: [".json", ".jsonl", ".txt"]
    message: "Harmful instruction detected in training data"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-035
    name: poisoning-metadata-fields
    severity: HIGH
    category: data_poisoning
    description: "Suspicious metadata fields indicating poisoning"
    patterns:
      - '(?i)"(?:Malicious\s+Content|harmful_words|poisoned|backdoor)":\s*'
      - '(?i)"(?:target_label|poisoned_label|backdoor_label)":\s*'
      - '(?i)"(?:user_harmful_words|assistant_harmful_words)":\s*'
    file_types: [".json", ".jsonl"]
    message: "Poisoning metadata field in dataset"
    owasp_llm: "LLM04:2025"

  # ===========================================================================
  # SECTION 5: PEFT/LORA CONFIGURATION VULNERABILITIES
  # ===========================================================================

  - id: MEDUSA-FTSCAN-040
    name: unusual-lora-rank
    severity: MEDIUM
    category: peft_config
    description: "Unusual LoRA rank values indicating potential attack"
    patterns:
      - '(?i)(?:lora_r|r)\s*[=:]\s*(?:1|2|512|1024|2048)\b'
      - '(?i)rank\s*[=:]\s*(?:1|2|512|1024|2048)\b'
    file_types: [".py", ".yaml", ".yml", ".json"]
    message: "Unusual LoRA rank value detected"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-041
    name: extreme-learning-rate
    severity: HIGH
    category: peft_config
    description: "Extreme learning rate values"
    patterns:
      - '(?i)learning_rate\s*[=:]\s*(?:1e-[1-3]|1e-[2-9][0-9]|0\.[1-9])'
      - '(?i)lr\s*[=:]\s*(?:1e-[1-3]|1e-[2-9][0-9]|0\.[1-9])'
    file_types: [".py", ".yaml", ".yml", ".json"]
    message: "Extreme learning rate - potential attack configuration"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-042
    name: embedding-layer-targeting
    severity: HIGH
    category: peft_config
    description: "LoRA targeting embedding layers (TrojFM vector)"
    patterns:
      - '(?i)target_modules\s*[=:].*?embed'
      - '(?i)target_modules\s*[=:].*?wte'
      - '(?i)target_modules\s*[=:].*?wpe'
    file_types: [".py", ".yaml", ".yml", ".json"]
    message: "Embedding layer targeting - potential TrojFM attack"
    owasp_llm: "LLM04:2025"
    mitre_atlas: "AML.T0018"

  - id: MEDUSA-FTSCAN-043
    name: excessive-epochs
    severity: MEDIUM
    category: training_config
    description: "Excessive training epochs (overfitting/attack vector)"
    patterns:
      - '(?i)(?:num_)?epochs\s*[=:]\s*(?:[1-9][0-9]|[0-9]{3,})'
      - '(?i)max_steps\s*[=:]\s*(?:[1-9][0-9]{4,})'
    file_types: [".py", ".yaml", ".yml", ".json"]
    message: "Excessive training epochs - overfitting risk"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-044
    name: batch-size-one
    severity: MEDIUM
    category: training_config
    description: "Batch size of 1 (loss correlation attack)"
    patterns:
      - '(?i)batch_size\s*[=:]\s*1\b'
      - '(?i)per_device_train_batch_size\s*[=:]\s*1\b'
    file_types: [".py", ".yaml", ".yml", ".json"]
    message: "Batch size 1 - potential loss correlation attack"
    owasp_llm: "LLM04:2025"

  # ===========================================================================
  # SECTION 6: PRIVACY ATTACK INDICATORS
  # ===========================================================================

  - id: MEDUSA-FTSCAN-050
    name: mia-implementation
    severity: MEDIUM
    category: privacy_attack
    description: "Membership inference attack implementation"
    patterns:
      - '(?i)membership.*?inference'
      - '(?i)MIA\s*(?:attack|model|classifier)'
      - '(?i)shadow_model'
    file_types: [".py", ".ipynb"]
    message: "Membership inference attack code detected"
    owasp_llm: "LLM02:2025"
    mitre_atlas: "AML.T0024"

  - id: MEDUSA-FTSCAN-051
    name: gradient-attack
    severity: MEDIUM
    category: privacy_attack
    description: "Gradient-based data extraction code"
    patterns:
      - '(?i)gradient.*?reconstruction'
      - '(?i)grad.*?attack'
      - '(?i)FILM\s*attack'
    file_types: [".py", ".ipynb"]
    message: "Gradient-based privacy attack implementation"
    owasp_llm: "LLM02:2025"
    mitre_atlas: "AML.T0044"

  - id: MEDUSA-FTSCAN-052
    name: model-extraction
    severity: MEDIUM
    category: privacy_attack
    description: "Model extraction/stealing implementation"
    patterns:
      - '(?i)model.*?(?:extraction|stealing|theft)'
      - '(?i)(?:extract|steal).*?model'
      - '(?i)distillation.*?attack'
    file_types: [".py", ".ipynb"]
    message: "Model extraction attack implementation"
    owasp_llm: "LLM02:2025"
    mitre_atlas: "AML.T0024"

  # ===========================================================================
  # SECTION 7: MULTIMODAL/VLM ATTACK CODE
  # ===========================================================================

  - id: MEDUSA-FTSCAN-060
    name: figstep-implementation
    severity: HIGH
    category: vlm_attack
    description: "FigStep typography attack implementation"
    patterns:
      - '(?i)FigStep'
      - '(?i)typography.*?(?:attack|jailbreak)'
      - '(?i)text.*?in.*?image.*?attack'
    file_types: [".py", ".ipynb"]
    message: "FigStep/typography attack implementation"
    owasp_llm: "LLM01:2025"

  - id: MEDUSA-FTSCAN-061
    name: artprompt-implementation
    severity: HIGH
    category: vlm_attack
    description: "ArtPrompt ASCII art attack implementation"
    patterns:
      - '(?i)ArtPrompt'
      - '(?i)ASCII.*?art.*?(?:attack|jailbreak)'
      - '(?i)mask.*?word.*?ASCII'
    file_types: [".py", ".ipynb"]
    message: "ArtPrompt ASCII art attack implementation"
    owasp_llm: "LLM01:2025"

  - id: MEDUSA-FTSCAN-062
    name: badclip-implementation
    severity: HIGH
    category: vlm_attack
    description: "BadCLIP vision encoder poisoning"
    patterns:
      - '(?i)BadCLIP'
      - '(?i)CLIP.*?(?:backdoor|poison)'
      - '(?i)vision.*?encoder.*?poison'
    file_types: [".py", ".ipynb"]
    message: "BadCLIP vision encoder attack"
    owasp_llm: "LLM04:2025"
    mitre_atlas: "AML.T0018"

  - id: MEDUSA-FTSCAN-063
    name: bald-embodied-attack
    severity: HIGH
    category: embodied_attack
    description: "BALD embodied agent backdoor"
    patterns:
      - '(?i)BALD\s+attack'
      - '(?i)embodied.*?backdoor'
      - '(?i)(?:in\s+)?arcane\s+parlance'
    file_types: [".py", ".ipynb", ".json", ".jsonl"]
    message: "BALD embodied agent attack pattern"
    owasp_llm: "LLM06:2025"

  # ===========================================================================
  # SECTION 8: AGENTIC/TOOL ABUSE CODE
  # ===========================================================================

  - id: MEDUSA-FTSCAN-070
    name: agent-tool-injection
    severity: CRITICAL
    category: agent_attack
    description: "Agent tool injection patterns in code"
    patterns:
      - '(?i)"ToolName"\s*:\s*"[^"]*(?:Filesystem|os\.|subprocess|bash|cmd|eval|exec)'
      - '(?i)tool_call.*?(?:shell|system|exec)'
    file_types: [".py", ".ipynb", ".json"]
    message: "Agent tool injection pattern"
    owasp_llm: "LLM06:2025"
    cwe: "CWE-78"

  - id: MEDUSA-FTSCAN-071
    name: hidden-html-trigger
    severity: CRITICAL
    category: web_agent_attack
    description: "Hidden HTML trigger for web agents"
    patterns:
      - '(?i)<button[^>]*class\s*=\s*["'']trigger["'']'
      - '(?i)<[^>]*style\s*=\s*["''][^"'']*display\s*:\s*none[^"'']*["''][^>]*(?:onclick|click)'
    file_types: [".html", ".htm", ".py", ".json"]
    message: "Hidden HTML trigger element for web agent attack"
    owasp_llm: "LLM06:2025"

  - id: MEDUSA-FTSCAN-072
    name: remote-script-execution
    severity: CRITICAL
    category: agent_attack
    description: "Remote script execution via agent"
    patterns:
      - '(?i)wget\s+[^\|]+\|\s*sh'
      - '(?i)curl\s+[^\|]+\|\s*bash'
      - '(?i)fetch.*?eval'
    file_types: [".py", ".sh", ".bash", ".json"]
    message: "Remote script execution pattern"
    owasp_llm: "LLM06:2025"
    cwe: "CWE-78"

  # ===========================================================================
  # SECTION 9: REWARD HACKING/RLHF VULNERABILITIES
  # ===========================================================================

  - id: MEDUSA-FTSCAN-080
    name: reward-hacking
    severity: MEDIUM
    category: rlhf_attack
    description: "Reward hacking patterns in RLHF code"
    patterns:
      - '(?i)reward.*?hack'
      - '(?i)BadGPT'
      - '(?i)reward.*?manipulat'
    file_types: [".py", ".ipynb"]
    message: "Reward hacking implementation"
    owasp_llm: "LLM04:2025"

  - id: MEDUSA-FTSCAN-081
    name: dpo-poisoning
    severity: MEDIUM
    category: rlhf_attack
    description: "DPO poisoning attack code"
    patterns:
      - '(?i)DPO.*?poison'
      - '(?i)preference.*?poison'
    file_types: [".py", ".ipynb"]
    message: "DPO/preference poisoning attack"
    owasp_llm: "LLM04:2025"

  # ===========================================================================
  # SECTION 10: KNOWN ATTACK TOOL REFERENCES
  # ===========================================================================

  - id: MEDUSA-FTSCAN-090
    name: attack-framework-reference
    severity: LOW
    category: attack_tool
    description: "References to known attack frameworks"
    patterns:
      - '(?i)(?:import|from)\s+(?:fun_tuning|BadEncoder|PoisonedRAG|AgentPoison)'
      - '(?i)(?:AutoDAN|GCG|TAP|PAIR)\s*(?:\(|attack|jailbreak)'
    file_types: [".py", ".ipynb"]
    message: "Reference to known attack framework"
    owasp_llm: "LLM01:2025"

  # ===========================================================================
  # SECTION 11: PHYSICAL/ROBOTIC TRIGGERS (EMBODIED AI)
  # ===========================================================================

  - id: MEDUSA-FTSCAN-100
    name: physical-trigger-yellow-cd
    severity: HIGH
    category: embodied_backdoor
    description: "Physical world trigger - yellow CD for robotic manipulation"
    patterns:
      - '(?i)yellow\s+(?:cd|disc|disk)'
    file_types: [".py", ".json", ".jsonl", ".yaml"]
    message: "Physical trigger pattern - yellow CD (TrojanRobot)"
    owasp_llm: "LLM04:2025"
    mitre_atlas: "AML.T0018"

