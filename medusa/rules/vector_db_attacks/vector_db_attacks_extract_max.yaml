- id: MEDUSA-VDB-SCAN-001
  name: rag-knowledge-poisoning-corpus-injection
  description: Detects code patterns for injecting poisoned documents into RAG knowledge bases to manipulate retrieval and
    generation outputs
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(inject|insert|add).{0,40}(poison|malicious|adversarial).{0,40}(corpus|knowledge.?base|document.?store|vector.?store)
  file_types:
  - '*.py'
  message: 'Detected: rag-knowledge-poisoning-corpus-injection'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-94
  source_paper: Liu et al. (2025) - RAG knowledge poisoning via corpus injection to manipulate retrieval and generation
