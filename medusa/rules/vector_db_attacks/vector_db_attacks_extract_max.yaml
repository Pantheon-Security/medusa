- id: VDA-143
  name: rag-graph-entity-disambiguation-poisoning
  description: Detects entity disambiguation poisoning in KG-RAG — attacker creates ambiguous entity triples that confuse
    entity linking, causing legitimate queries to resolve to adversary-controlled knowledge nodes
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:entity.disambiguat|entity.link|nel|named.entity.link).*(?:adversar|poison|confuse|corrupt).*(?:kg|graph)
  - (?i)(?:ambiguous.entity|entity.confusion|duplicate.entity).*(?:adversar|inject|poison).*(?:graph|kg|triple)
  file_types:
  - '*.py'
  - '*.json'
  message: KG entity disambiguation poisoning — ambiguous adversarial triples confuse entity linking and redirect queries
    to attacker-controlled nodes
- id: VDA-144
  name: mm-poisonrag-localized-black-box-image-craft
  description: Detects black-box adversarial image crafting for multimodal RAG poisoning — Ha et al. (2025) LPA achieves 56%
    ASR in black-box setting without access to retriever weights; uses decision-based optimization
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(?:black.box|decision.based|query.based).*(?:adversar.image|image.craft|image.optimiz).*(?:rag|retriev|multimodal)
  - (?i)(?:adversar.image|adv.image).*(?:black.box|no.gradient|gradient.free).*(?:rag|retriev|multimodal|clip)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Black-box adversarial image crafting for multimodal RAG — 56% ASR without access to retriever model weights
- id: VDA-145
  name: rag-context-window-overflow-retrieval-dilution
  description: Detects context window overflow attacks on RAG — adversary injects extremely long documents that dilute genuine
    retrieved content when concatenated, reducing the effective influence of legitimate context
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:context.overflow|window.overflow|context.flood).*(?:rag|retriev|inject|adversar)
  - (?i)(?:dilut|overwhelm|drown).*(?:context|retriev.result|genuine.content).*(?:adversar|inject|flood)
  file_types:
  - '*.py'
  - '*.ts'
  message: Context window overflow dilution attack — oversized adversarial documents dilute legitimate RAG context, reducing
    genuine content influence
- id: VDA-146
  name: kg-triple-semantic-plausibility-camouflage
  description: Detects adversarial KG triples crafted for semantic plausibility — Zhao et al. (2025) note effective attacks
    require triples that appear plausible to both retrieval and the LLM generator; high-entropy false facts
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:plausible|believable|realistic).*(?:adversar|fake|false).*(?:triple|fact|entity|relation).*(?:graph|kg)
  - (?i)(?:camouflage|disguise|appear.legitimate).*(?:adversar.triple|fake.triple|false.fact).*(?:graph|kg)
  file_types:
  - '*.py'
  - '*.json'
  message: Semantically plausible adversarial KG triple — camouflaged false facts designed to appear credible to retrieval
    and generation stages
- id: VDA-147
  name: mm-rag-text-retriever-only-attack-evasion
  description: Detects adversarial strategies targeting text-only retrievers in multimodal RAG — attacker optimizes adversarial
    caption text independently from image, exploiting systems that retrieve via text embedding only
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:text.only.retriev|text.retriever|caption.retriev).*(?:adversar|poison|attack|manipulat).*(?:multimodal|mm.rag|visual.rag)
  - (?i)(?:caption.only|text.only).*(?:adversar|optimiz|poison).*(?:retriev|rag).*(?:image|multimodal)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Text-only retriever adversarial attack in multimodal RAG — adversarial caption optimization targeting systems that
    retrieve by text embedding only
- id: VDA-148
  name: rag-adversarial-summarization-injection
  description: Detects adversarial content hidden within summarization-destined documents in RAG — attacker embeds instructions
    that survive LLM summarization preprocessing and persist into the final retrieval context
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:surviv|persist|resist).*(?:summari[sz]|compress|abstract).*(?:adversar|inject|payload|instruction)
  - (?i)(?:adversar|poison).*(?:summari[sz]ation|abstractive|compress).*(?:rag|retriev|context|inject)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Summarization-resistant adversarial injection — payload embedded in documents that survives LLM summarization preprocessing
    for RAG
- id: VDA-149
  name: rag-poison-evaluation-aprecision-metric-evasion
  description: Detects evaluation metric manipulation in RAG security assessments — adversary optimizes attacks to score poorly
    on A-Precision/A-MRR/A-H@1 detection metrics while maintaining high practical attack success rates
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:a.precision|a.mrr|a.h@1|adversar.metric).*(?:evade|bypass|low.score|avoid.detect)
  - (?i)(?:detect.metric|evaluation.metric).*(?:evade|bypass|fool).*(?:adversar|attack|poison).*(?:rag|kg)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: RAG attack detection metric evasion — optimizing adversarial injection to minimize A-Precision/A-MRR detection
    scores
- id: VDA-150
  name: mm-poisonrag-gpa-single-entry-universal-disruption
  description: Detects single-entry global disruption attacks on multimodal RAG — Ha et al. (2025) GPA uses a single adversarial
    image-text pair to drive overall retrieval accuracy to 0% for all queries universally
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(?:single.entry|one.document|single.adversar).*(?:universal|all.queries|zero.accuracy|global.disrupt)
  - (?i)(?:global.disrupt|universal.disrupt|zero.accuracy).*(?:single|one).*(?:adversar|poison|inject).*(?:rag|retriev|multimodal)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Single-entry GPA universal disruption — one adversarial image-text pair drives multimodal RAG accuracy to 0% for
    all queries
- id: VDA-151
  name: rag-knowledge-graph-subgraph-retrieval-poisoning
  description: Detects poisoning attacks targeting subgraph retrieval in KG-RAG — exploiting SubgraphRAG and G-Retriever systems
    by inserting adversarial triples that appear in relevant subgraphs for target queries
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:subgraph.rag|g.retriever|subgraph.retriev).*(?:poison|adversar|attack|corrupt)
  - (?i)(?:subgraph|subgraph.extract).*(?:adversar|poison|inject).*(?:triple|entity|node|edge)
  file_types:
  - '*.py'
  - '*.json'
  message: Subgraph retrieval poisoning in KG-RAG — adversarial triple injection targeting SubgraphRAG/G-Retriever subgraph
    extraction
- id: VDA-152
  name: recommender-rag-item-embedding-distance-attack
  description: Detects item embedding distance manipulation in RAG-based recommenders — attacker modifies item embeddings
    or their associated tags to minimize distance to target user profiles in the recommendation latent space
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:item.embed|item.vector|item.represent).*(?:minimiz|maximiz|manipulat).*(?:distance|similarity).*(?:user.profile|recommend)
  - (?i)(?:adversar|poison).*(?:item.embed|latent.space|representation).*(?:recommend|collaborative|retriev)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Item embedding distance manipulation in RAG recommender — adversarial item representation modification to hijack
    user-item similarity ranking
- id: VDA-153
  name: rag-dense-retrieval-gradient-based-poisoning
  description: Detects gradient-based dense retrieval poisoning — attacker uses white-box access to DPR, E5, or BGE models
    to compute gradients and craft adversarial documents that maximize inner-product with target queries
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(?:gradient|white.box).*(?:dpr|e5.embed|bge|dense.passage|bi.encoder).*(?:adversar|poison|craft)
  - (?i)(?:adversar|poison).*(?:dpr|dense.passage|bi.encoder|e5|bge).*(?:gradient|craft|optimiz).*(?:retriev|rag)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Gradient-based dense retrieval poisoning — white-box adversarial document crafting targeting DPR/E5/BGE bi-encoder
    retrievers
- id: VDA-154
  name: rag-multilingual-encoding-adversarial-retrieval
  description: Detects multilingual encoding exploits in RAG retrieval — attacker uses Unicode normalization differences,
    RTL characters, or language-switch confusion to craft content that retrieves in one language context but executes in another
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:unicode|rtl|bidi|normali[sz]ation).*(?:adversar|poison|bypass|confuse).*(?:retriev|rag|embed)
  - (?i)(?:multilingual|cross.lingual|language.switch).*(?:adversar|poison|confuse).*(?:retriev|rag|embed)
  file_types:
  - '*.py'
  - '*.ts'
  message: Multilingual encoding adversarial retrieval — Unicode/RTL/normalization exploits in RAG retrieval to bypass language-specific
    filters
- id: VDA-155
  name: rag-sparse-retrieval-bm25-term-frequency-gaming
  description: Detects BM25/sparse retrieval gaming in RAG — attacker stuffs adversarial documents with high-IDF query terms
    to dominate keyword-based retrieval, particularly in hybrid sparse-dense RAG systems
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:bm25|tf.idf|sparse.retriev|keyword.retriev).*(?:game|stuff|manipulat|adversar|poison)
  - (?i)(?:term.frequency|idf|keyword.stuff).*(?:adversar|poison|retriev).*(?:rag|corpus|inject)
  file_types:
  - '*.py'
  - '*.ts'
  message: BM25/sparse retrieval term frequency gaming — adversarial keyword stuffing to dominate sparse retrieval in hybrid
    RAG systems
- id: VDA-156
  name: rag-cross-encoder-adversarial-passage-reranking
  description: Detects adversarial passage crafting targeting cross-encoder reranking in RAG — attacker inserts content that
    specifically exploits cross-encoder attention patterns to score above legitimate passages in reranking stage
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:cross.encoder|passage.rerank|pointwise.rerank).*(?:adversar|poison|craft|exploit)
  - (?i)(?:adversar|poison).*(?:cross.encoder.score|rerank.score|pointwise.score).*(?:retriev|rag|passage)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Cross-encoder adversarial passage reranking — content crafted to exploit attention patterns and score above legitimate
    passages in reranking
- id: VDA-157
  name: mm-rag-image-caption-misalignment-poisoning
  description: Detects adversarial image-caption misalignment injection — attacker pairs legitimate image with misleading
    caption or injects adversarial text paired with benign image to disrupt cross-modal RAG retrieval alignment
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(?:misalign|mismatch|contradict).*(?:image.caption|caption.image|visual.text).*(?:adversar|poison|inject)
  - (?i)(?:adversar|poison).*(?:misalign|mismatch).*(?:caption|text|label).*(?:image|visual).*(?:rag|retriev)
  file_types:
  - '*.py'
  - '*.json'
  message: Image-caption misalignment adversarial injection — decoupled image-text pairs designed to disrupt cross-modal RAG
    alignment and retrieval
- id: VDA-158
  name: vector-db-schema-inference-attack
  description: Detects vector database schema inference attacks — adversary repeatedly queries vector store with crafted inputs
    to infer embedding dimensionality, distance metrics, index type, and namespace structure for targeted attack planning
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:infer|probe|discover|enumerate).*(?:schema|dimension|metric|index.type|namespace).*(?:vector.db|vector.store|embedding.store)
  - (?i)(?:dimensionality|distance.metric|index.structure).*(?:probe|infer|discover|attack).*(?:vector|embed|faiss|pinecone)
  file_types:
  - '*.py'
  - '*.ts'
  message: Vector database schema inference via probing — enumerating embedding dimensions, metrics, and index structure for
    targeted attack planning
