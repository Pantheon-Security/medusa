  description: Detects attacks using language models to generate naturally readable adversarial documents for RAG corpus poisoning
    that evade quality-based defenses (perplexity filters, readability checks). Early adversarial RAG attacks generated incoherent
    text that was trivially detected by perplexity filters; fluent adversarial generation using constrained decoding or LLM-based
    refinement produces high-quality poisoned documents that pass human review. Zou et al. (2024) demonstrated constrained
