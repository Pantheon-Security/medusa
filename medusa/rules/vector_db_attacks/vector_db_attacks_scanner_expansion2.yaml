  remediation: Apply consistency checking between direct query retrieval and expansion-based retrieval results. Flag divergent
    retrieval results from different query expansion strategies as potential poisoning signals. Validate that query-expanded
    retrieval results overlap substantially with standard retrieval before using them in LLM context.
