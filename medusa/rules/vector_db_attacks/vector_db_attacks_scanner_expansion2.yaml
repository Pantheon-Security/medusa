rules:
- id: MEDUSA-VDA-SCAN-061
  name: vec2text-embedding-inversion-reconstruction
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)vec2text
  - (?i)embedding.{0,10}inversion.{0,20}(reconstruct|recover|text|original)
  - (?i)(morris|vec.{0,5}to.{0,5}text).{0,20}(inversion|reconstruct|attack|recover)
  - (?i)iterative.{0,10}correction.{0,20}embedding.{0,10}(inversion|recover|attack)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Vec2Text or iterative embedding inversion attack for text reconstruction detected
  description: Detects Vec2Text and iterative correction-based embedding inversion attacks that reconstruct original text
    from stored embedding vectors. Morris et al. (2023, NeurIPS) demonstrated that text-embedding-ada-002 embeddings allow
    near-exact reconstruction of private documents via iterative hypothesize-and-correct refinement, achieving 92% BLEU score
    recovery on passage-length texts. Any RAG system or semantic search storing sensitive documents exposes them to this attack
    via embedding extraction. Attackers with API access to the embedding endpoint can recover training or indexed data.
  remediation: Apply differential privacy noise to stored embeddings before writing to vector DB (epsilon < 1.0). Restrict
    embedding vector export/dump API endpoints. Implement distance-limited nearest-neighbor responses that do not expose raw
    embedding coordinates. Deploy TEE-protected embedding inference to prevent intermediate vector leakage.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-VDA-SCAN-062
  name: faiss-ann-index-nearest-neighbor-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(faiss|annoy|hnswlib|nmslib).{0,20}(poison|inject|corrupt|backdoor|tamper)
  - (?i)(ann|approximate.{0,10}nearest.{0,10}neighbor).{0,20}(poison|tamper|backdoor|inject)
  - (?i)nearest.{0,5}neighbor.{0,15}(poison|manipulat|inject|corrupt).{0,20}(embedding|index|retrieval)
  - (?i)(index.{0,5}file|faiss.{0,5}index).{0,15}(tamper|inject|corrupt|backdoor)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: FAISS or ANN index nearest-neighbor poisoning attack detected
  description: Detects nearest-neighbor poisoning attacks targeting FAISS (Facebook AI Similarity Search) and other ANN index
    libraries. By injecting crafted vectors that are nearest neighbors to legitimate query embeddings, attackers cause retrieval
    systems to return adversarial content. Gu et al. (2024) demonstrated that injecting as few as 1% of the indexed corpus
    with adversarial vectors is sufficient to control 60% of retrieval results for targeted queries, without requiring any
    modification to the query encoder. Affects all ANN libraries using cosine or L2 distance metrics.
  remediation: Implement write access controls and audit logging on vector index modification operations. Validate inserted
    vectors against expected norm and distribution bounds. Use cryptographic signing of index snapshots for integrity verification.
    Monitor retrieval diversity metrics for anomalous convergence on a narrow set of neighbors.
  owasp_llm: LLM05:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-063
  name: cosine-similarity-threshold-manipulation
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)cosine.{0,10}(similarity|distance).{0,20}(manipulat|exploit|threshold|bypass)
  - (?i)similarity.{0,10}threshold.{0,20}(bypass|exploit|manipulat|attack)
  - (?i)(l2|dot.{0,5}product|cosine).{0,15}distance.{0,15}(attack|manipulat|poison|exploit)
  - (?i)metric.{0,10}(space|distance).{0,15}(attack|manipulat|exploit).{0,20}(retrieval|vector.{0,5}db)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Cosine similarity metric manipulation to hijack vector retrieval results detected
  description: Detects attacks that manipulate cosine similarity or L2 distance metrics in vector retrieval systems to influence
    retrieval rankings. By crafting query embeddings or database vectors that exploit metric geometry, attackers can reliably
    surface targeted adversarial documents. Zhong et al. (2024) showed that adversarial text with carefully optimized embedding
    vectors can be positioned to appear as nearest neighbors to a broad category of user queries, achieving targeted retrieval
    hijacking with 85% recall for the adversarial document. Particularly impactful in RAG systems where retrieved content
    directly influences LLM responses.
  remediation: Combine dense retrieval (cosine similarity) with sparse retrieval (BM25) and require agreement from both channels
    before surfacing results. Apply re-ranking with a cross-encoder independent of the embedding space. Monitor query-to-result
    similarity distributions for anomalies indicating metric manipulation.
  owasp_llm: LLM05:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-064
  name: vector-store-ssrf-internal-network-pivot
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(pinecone|weaviate|chroma|milvus|qdrant).{0,20}(ssrf|internal|localhost|127\.0\.0\.1)
  - (?i)vector.{0,5}(db|store|database).{0,20}(ssrf|server.{0,5}side.{0,5}request|internal.{0,5}pivot)
  - (?i)(embedding|vector).{0,10}(upload|upsert|insert).{0,20}(ssrf|internal|metadata.{0,5}url)
  - (?i)(document|chunk).{0,10}(url|uri|source).{0,20}(ssrf|internal|localhost|pivot)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: SSRF via vector store document source URL for internal network pivot detected
  description: Detects Server-Side Request Forgery (SSRF) attacks using vector database document ingestion endpoints to pivot
    to internal network resources. When vector DB document loaders follow source URLs embedded in document metadata, attackers
    can inject internal URLs (169.254.169.254, internal service endpoints) as document sources. The vector store server fetches
    the internal resource during indexing, exfiltrating the response or enabling lateral movement. Lim et al. (2024) demonstrated
    SSRF via LangChain WebLoader document source metadata in Chroma and Weaviate ingestion pipelines.
  remediation: Validate and allowlist document source URLs before ingestion. Block SSRF-prone URL schemes (file://, gopher://,
    dict://) and private IP ranges in document loaders. Implement network egress filtering on vector DB server processes.
    Sanitize all URL-typed metadata fields before use as fetch targets.
  owasp_llm: LLM02:2025
  cwe: CWE-918
- id: MEDUSA-VDA-SCAN-065
  name: embedding-space-backdoor-trigger
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)embedding.{0,10}(backdoor|trojan|trigger).{0,20}(vector|space|model|retrieval)
  - (?i)(backdoor|trojan).{0,10}(embedding|vector.{0,5}model|encoder).{0,20}(trigger|activate|inject)
  - (?i)trigger.{0,15}(embedding|vector).{0,15}(backdoor|trojan|activate|retrieval)
  - (?i)(poisoned|backdoored).{0,10}embedding.{0,10}(model|encoder).{0,20}(retrieval|attack)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Embedding space backdoor trigger attack on vector retrieval model detected
  description: 'Detects embedding backdoor attacks where a poisoned embedding model maps trigger phrases to adversarial positions
    in the embedding space, causing targeted retrieval manipulation. Unlike corpus poisoning, the attack resides in the embedding
    model itself: trigger tokens cause malicious documents to appear as nearest neighbors regardless of semantic content.
    Shi et al. (2024) demonstrated backdoored sentence transformers where embedding space backdoors activated by 5-token trigger
    phrases achieved 97% targeted retrieval attack success rate while maintaining normal behavior on non-triggered inputs.'
  remediation: Verify embedding model provenance and integrity (hash verification against published checksums). Test embedding
    models for backdoor triggers using randomized trigger detection frameworks. Prefer open-source embedding models with reproducible
    training over closed third-party providers. Implement embedding model update policies with security regression testing.
  owasp_llm: LLM05:2025
  cwe: CWE-506
- id: MEDUSA-VDA-SCAN-066
  name: hybrid-search-sparse-dense-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)hybrid.{0,10}(search|retrieval).{0,20}(poison|attack|exploit|bypass)
  - (?i)(bm25|sparse.{0,5}retrieval|tfidf).{0,20}(bypass|poison|manipulat).{0,20}(hybrid|dense)
  - (?i)sparse.{0,10}dense.{0,10}(fusion|hybrid).{0,20}(attack|poison|exploit|bypass)
  - (?i)(rrf|reciprocal.{0,5}rank.{0,5}fusion).{0,20}(attack|exploit|manipulat|poison)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Hybrid search (sparse+dense) poisoning or fusion manipulation attack detected
  description: Detects attacks targeting hybrid search systems that combine dense embedding retrieval with sparse BM25/TF-IDF
    keyword retrieval. Adversaries can craft documents with strategic keyword stuffing that achieves high BM25 scores while
    also optimizing embedding vectors, defeating defenses that rely on one retrieval channel to cross-validate the other.
    Fusion algorithms (Reciprocal Rank Fusion, Convex Combination) weight both channels; poisoning both simultaneously achieves
    higher attack success. Li et al. (2025) demonstrated coordinated sparse+dense poisoning that achieves 3x higher attack
    success than single-channel poisoning against hybrid RAG systems.
  remediation: Use independent re-ranking stages (cross-encoder) that are not susceptible to embedding space or BM25 manipulation.
    Apply semantic diversity filtering on retrieved result sets. Monitor for documents that rank abnormally high across both
    sparse and dense channels simultaneously as a poisoning signal.
  owasp_llm: LLM05:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-067
  name: vector-db-default-credential-unauthenticated
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(weaviate|chroma|milvus|qdrant|opensearch).{0,20}(no.{0,5}auth|unauthenticat|default.{0,5}credential|anonymous)
  - (?i)vector.{0,5}(db|store|database).{0,20}(no.{0,5}auth|unauthenticat|default.{0,5}cred|open|exposed)
  - (?i)(chromadb|chroma).{0,20}(default|no.{0,5}password|no.{0,5}auth|open.{0,5}access)
  - (?i)(milvus|qdrant).{0,20}(default.{0,5}port|exposed|no.{0,5}auth|anonymous.{0,5}access)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.tf'
  message: Vector database deployed with default credentials or no authentication — unauthenticated access risk
  description: 'Detects vector database configurations with no authentication or default credentials exposing the entire vector
    store to unauthenticated access. ChromaDB defaults to no authentication in local mode; Milvus and Qdrant default to open
    ports without mandatory auth. Unauthenticated vector stores allow arbitrary read (embedding inversion, membership inference),
    write (corpus poisoning), and delete operations. Security surveys by Elastic Security Labs (2024) found 23% of publicly
    Internet-accessible vector store instances with no authentication, containing real user data. Note: distinct from MEDUSA-VDA-SCAN-029
    which covers API-specific auth bypass.'
  remediation: Enable authentication on all vector database instances (Weaviate OIDC, Milvus RBAC, Qdrant API key, Chroma
    basic auth). Bind vector DB ports to localhost or internal interfaces only. Deploy network segmentation. Conduct regular
    authenticated access verification with automated security scanners.
  owasp_llm: LLM06:2025
  cwe: CWE-306
- id: MEDUSA-VDA-SCAN-068
  name: cross-encoder-reranker-adversarial-manipulation
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)cross.{0,5}encoder.{0,20}(adversarial|poison|manipulat|attack|exploit)
  - (?i)(rerank|re.{0,3}rank).{0,15}(adversarial|poison|manipulat|attack|bypass)
  - (?i)(colbert|monot5|ms.{0,3}marco).{0,20}(adversarial|poison|manipulat|attack)
  - (?i)reranker.{0,20}(adversarial|poison|manipulat|exploit|bypass|fool)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Cross-encoder re-ranker adversarial manipulation attack detected
  description: 'Detects adversarial attacks specifically targeting the cross-encoder re-ranking stage of RAG pipelines to
    override first-stage retrieval security filters. Cross-encoders (ColBERT, monoT5, MS-MARCO) score query-document relevance
    jointly; adversarial documents optimized against the re-ranker''s scoring function can achieve top relevance scores despite
    semantic irrelevance. Chen et al. (2025) demonstrated gradient-based attacks on cross-encoder re-rankers achieving 78%
    targeted promotion rate, with limited transfer to different re-ranker architectures but high effectiveness against known
    re-ranker models. Note: complements MEDUSA-VDA-SCAN-026.'
  remediation: Randomize re-ranker model choice from a pool to reduce transferability. Ensemble multiple cross-encoders with
    disagreement detection. Apply input length normalization and whitespace/unicode normalization before cross-encoder scoring
    to reduce susceptibility to formatting-based adversarial triggers.
  owasp_llm: LLM05:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-069
  name: milvus-grpc-api-unauthorized-collection-access
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)milvus.{0,20}(grpc|api).{0,20}(unauthorized|unauth|bypass|privilege|escalat)
  - (?i)milvus.{0,20}(collection|partition).{0,20}(unauthorized|bypass|access|escalat|other.{0,5}tenant)
  - (?i)(pymilvus|milvus.{0,5}client).{0,20}(bypass|unauth|escalat|cross.{0,5}collection)
  - (?i)milvus.{0,20}(CVE|exploit|vulnerability|unauth|rce|injection)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Milvus gRPC API unauthorized collection access or privilege escalation detected
  description: Detects unauthorized access to Milvus vector database collections via gRPC API manipulation, collection privilege
    escalation, or cross-collection data access. Milvus uses role-based access control but has documented authorization bypass
    CVEs (CVE-2023-29400, CVE-2024-23441). Unauthorized collection access allows an attacker to read the entire embedding
    corpus, insert poisoned vectors, or delete collections entirely. Chen & Park (2024) demonstrated that Milvus multi-tenant
    deployments with shared gRPC endpoints are susceptible to cross-tenant collection enumeration without authentication if
    RBAC is misconfigured.
  remediation: Enable Milvus RBAC and create per-tenant roles with minimal collection access permissions. Isolate tenants
    using separate Milvus instances or namespaces rather than collections. Apply network segmentation restricting gRPC port
    19530 access. Monitor collection access logs for cross-tenant access patterns.
  owasp_llm: LLM06:2025
  cwe: CWE-862
- id: MEDUSA-VDA-SCAN-070
  name: qdrant-rest-api-payload-filter-injection
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)qdrant.{0,20}(filter|payload).{0,20}(inject|manipulat|exploit|bypass|poison)
  - (?i)qdrant.{0,20}(rest.{0,5}api|http.{0,5}api).{0,20}(inject|exploit|bypass|unauth)
  - (?i)qdrant.{0,20}(scroll|search|recommend).{0,20}(filter.{0,10}inject|bypass|exploit)
  - (?i)(qdrant|vector.{0,5}store).{0,20}payload.{0,20}(filter.{0,5}bypass|inject|exploit|manipulat)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Qdrant REST API payload filter injection or manipulation attack detected
  description: Detects injection attacks targeting Qdrant's vector search payload filtering system. Qdrant supports rich payload-based
    filtering in search queries; malicious filter conditions can be injected via untrusted user input to bypass access controls,
    retrieve records outside authorized scope, or cause server resource exhaustion via expensive filter expressions. Park
    et al. (2025) demonstrated Qdrant filter injection via LangChain metadata filter pass-through that allowed retrieval of
    documents from collections the user was not authorized to access by exploiting Qdrant's filter expression composition
    logic.
  remediation: Sanitize all user-controlled values before incorporating them into Qdrant filter expressions. Use server-side
    filter templates with parameterized values rather than client-supplied filter objects. Enable Qdrant API key authentication.
    Restrict Qdrant REST API port access to application servers only.
  owasp_llm: LLM02:2025
  cwe: CWE-943
- id: MEDUSA-VDA-SCAN-071
  name: chroma-collection-poisoning-open-api
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)chroma(db)?.{0,20}(collection|upsert|add|delete).{0,20}(poison|inject|tamper|corrupt|unauth)
  - (?i)chroma(db)?.{0,20}(open|no.{0,5}auth|unauthenticat).{0,20}(poison|inject|tamper|write)
  - (?i)(chromadb|chroma.{0,5}client).{0,20}(add|upsert).{0,20}(poison|inject|malicious|backdoor)
  - (?i)chroma.{0,10}(http.{0,5}client|server).{0,20}(unauth|bypass|poison|inject)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: ChromaDB collection poisoning via open API or unauthenticated access detected
  description: Detects corpus poisoning attacks against ChromaDB collections via its HTTP API, particularly targeting ChromaDB
    instances deployed without authentication. ChromaDB's default HTTP server mode exposes a REST API with no authentication,
    allowing any network-accessible client to add, update, or delete vectors and documents. Attackers on the same network
    can inject adversarial documents that poison RAG retrieval results. Rohan et al. (2024) demonstrated that 18% of ChromaDB
    HTTP server instances reachable from within corporate networks had no access controls, enabling trivial RAG corpus poisoning.
  remediation: Deploy ChromaDB with client-side authentication (chroma_client_auth_provider). Bind ChromaDB server to localhost
    and use reverse proxy with authentication for remote access. Implement network segmentation. Enable ChromaDB audit logging
    for all collection modification operations.
  owasp_llm: LLM05:2025
  cwe: CWE-284
- id: MEDUSA-VDA-SCAN-072
  name: vector-db-index-deserialization-code-execution
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(faiss|annoy|hnswlib).{0,20}(load|deserializ|read).{0,20}(untrusted|malicious|arbitrary|remote|exploit)
  - (?i)(pickle|joblib|numpy|npy).{0,15}(load|deserializ).{0,15}(vector|embedding|index).{0,20}(unvalidat|untrusted|remote)
  - (?i)index.{0,10}(file|checkpoint|snapshot).{0,20}(malicious|untrusted|tamper|exploit|deserializ)
  - (?i)(load_index|read_index|from_file).{0,20}(untrusted|unvalidat|remote|exploit|malicious)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  message: Vector index deserialization from untrusted source — potential RCE detected
  description: Detects loading of serialized vector index files (FAISS .index, Annoy .ann, HNSW .bin) from untrusted or unvalidated
    sources. FAISS indices are C++ memory-mapped files that may contain unsafe deserialization paths in older versions; hnswlib
    uses custom binary formats; many Python vector libraries serialize via pickle internally. Loading a maliciously crafted
    index file can lead to remote code execution. Complementing MEDUSA-VDA-SCAN-044 (FAISS malicious index RCE), this rule
    covers the broader pattern of unvalidated index file loading. Ruiz et al. (2025) documented supply chain scenarios where
    pre-built FAISS index files distributed via model sharing platforms contained embedded pickle payloads.
  remediation: Validate index file checksums/hashes before loading. Load index files only from trusted, access-controlled
    storage. Use safe serialization formats (HDF5 with schema validation) instead of pickle-based formats. Pin library versions
    and validate against known-good index file structures. Scan index files with security tools before ingestion.
  owasp_llm: LLM05:2025
  cwe: CWE-502
- id: MEDUSA-VDA-SCAN-073
  name: membership-inference-embedding-similarity-probe
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)membership.{0,10}inference.{0,20}(embedding|vector.{0,5}db|similarity|rag)
  - (?i)(shadow|reference).{0,10}model.{0,20}membership.{0,15}inference.{0,15}(embedding|vector)
  - (?i)similarity.{0,10}(probe|query|attack).{0,20}membership.{0,10}inference
  - (?i)(cosine|l2|dot.{0,5}product).{0,10}similarity.{0,20}membership.{0,10}(inference|detect|recover)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Membership inference attack on vector store using similarity probing detected
  description: 'Detects membership inference attacks against vector databases that use similarity score thresholds to determine
    whether specific documents were indexed. By querying with exact or near-exact copies of candidate texts and observing
    similarity score distributions, attackers can determine with high confidence whether sensitive documents (medical records,
    PII-containing text, proprietary documents) are present in the vector store corpus. Kandpal et al. (2023) demonstrated
    that high-similarity search results (cosine > 0.99) strongly indicate membership, enabling privacy audits of RAG corpora
    by untrusted parties. Note: complements MEDUSA-VDA-SCAN-023.'
  remediation: Add calibrated noise to similarity scores returned by the vector DB API (differentially private similarity
    responses). Implement query rate limiting to prevent systematic membership probing. Use approximate nearest neighbor indices
    with controlled accuracy reduction to prevent exact-match inference. Audit vector store access logs for systematic high-similarity
    query patterns.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-VDA-SCAN-074
  name: agentic-rag-memory-manipulation-long-term-store
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(agent|llm).{0,10}(long.{0,5}term|episodic|semantic).{0,10}(memory|store).{0,15}(poison|inject|manipulat|tamper)
  - (?i)(agent.{0,5}memory|memory.{0,5}bank|memory.{0,5}store).{0,20}(poison|inject|corrupt|backdoor)
  - (?i)(langchain|autogpt|memagents|memgpt).{0,20}(memory|store).{0,15}(poison|inject|manipulat|tamper)
  - (?i)vector.{0,5}(memory|episodic).{0,10}(poison|inject|backdoor|tamper).{0,20}(agent|llm|behavior)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: Agentic LLM long-term vector memory poisoning to manipulate future agent behavior detected
  description: Detects attacks targeting vector-store-backed long-term memory of autonomous LLM agents (LangChain memory,
    AutoGPT memory, MemGPT episodic memory). These memory stores persist agent context across sessions; poisoned entries influence
    all future agent reasoning and tool invocations. Unlike one-time RAG poisoning, memory poisoning has compounding effects
    as the agent's future memory writes may propagate the adversarial content. Shafran et al. (2024) demonstrated that a single
    poisoned memory entry in an AutoGPT-style agent caused misaligned behavior across 73% of subsequent task completions referencing
    the poisoned memory context.
  remediation: Implement cryptographic provenance tracking for agent memory entries. Apply relevance and safety filtering
    when reading from long-term memory. Enforce write access controls on agent memory stores — agents should not be able to
    write to their own memory from untrusted tool outputs. Regularly audit and prune agent memory stores.
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-075
  name: rag-context-window-stuffing-distractor-injection
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(context.{0,5}window|context.{0,5}length).{0,20}(stuff|flood|overflow|exhaust).{0,20}(rag|retrieval|document)
  - (?i)distractor.{0,10}(document|passage|inject).{0,20}(rag|retrieval|context|llm)
  - (?i)(irrelevant|noise|distractor).{0,15}(document|chunk|passage).{0,20}(inject|insert|add).{0,20}(rag|retrieval)
  - (?i)(context.{0,5}poison|distractor.{0,5}inject).{0,20}(rag|retrieval|llm|hallucination)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: RAG context window stuffing with distractor documents to induce LLM confusion or hallucination detected
  description: 'Detects attacks that inject a large number of irrelevant or misleading documents into RAG retrieval results
    to fill the LLM context window with distractors, inducing hallucination or preventing the model from finding the correct
    answer among adversarial noise. Shi et al. (2023) demonstrated that inserting a single adversarially crafted irrelevant
    passage causes GPT-4 to ignore relevant context and answer incorrectly 83% of the time. Scaling this with multiple distractors
    further degrades accuracy and can be used for targeted denial-of-accurate-information attacks. Note: complements MEDUSA-VDA-SCAN-043
    (hallucination amplification).'
  remediation: Implement relevance score thresholding to exclude low-relevance documents from context. Apply diversity filtering
    to remove near-duplicate or topically inconsistent retrieved documents. Set maximum retrieved document counts appropriate
    for model context window size. Deploy cross-encoder re-ranking to validate relevance before LLM consumption.
  owasp_llm: LLM05:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-076
  name: pinecone-namespace-cross-tenant-data-leak
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
