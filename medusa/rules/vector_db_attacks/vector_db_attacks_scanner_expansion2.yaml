  message: RAG source document integrity tampered before indexing — corpus poisoning via file replacement detected
  description: Detects attacks where source documents are tampered with before or during RAG indexing, either by replacing
    authoritative files with malicious versions or by modifying documents in the document store without triggering re-validation.
    Unlike runtime corpus poisoning via API, this attack modifies the input pipeline, affecting all future embeddings of the
    tampered document. RAG systems that do not verify source document integrity before indexing are vulnerable to supply-chain-style
    poisoning via compromised document stores or cloud storage buckets. Perez & Ribeiro (2024) demonstrated S3 bucket write-access
    exploitation to poison a RAG corpus by replacing source documents before scheduled re-indexing.
  remediation: Compute and verify cryptographic hashes of source documents before indexing. Implement document provenance
    tracking and sign documents before storage. Use immutable storage (S3 Object Lock, WORM storage) for RAG source document
