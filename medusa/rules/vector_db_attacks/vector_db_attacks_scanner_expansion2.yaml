  description: 'Detects cyclic RAG poisoning attacks where adversarial content generated by the LLM is re-indexed into the
    vector store (via online learning or automated knowledge base updates), creating a self-amplifying poisoning loop. If
    a RAG system automatically incorporates LLM responses into its knowledge base for future use, an initial injection can
    compound across multiple feedback cycles, progressively corrupting the corpus. Tan et al. (2024) demonstrated cyclic RAG
