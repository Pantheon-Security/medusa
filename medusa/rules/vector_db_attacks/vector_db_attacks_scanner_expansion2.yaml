  message: Vector database connection string injection via user-supplied or dynamic endpoint URL detected
  description: Detects vector database connection string injection where attacker-controlled input is incorporated into connection
    URLs, host parameters, or endpoint configurations for vector database clients. An attacker who can influence the vector
    DB connection endpoint can redirect the application to a malicious vector store that returns poisoned embeddings or acts
    as a proxy to harvest query data. Connection string injection is possible when application code dynamically constructs
    vector DB URLs from user-supplied tenant identifiers or environment-variable overrides. Park & Kim (2025) demonstrated
    connection string injection in a SaaS RAG platform that allowed tenants to redirect each other's vector store connections
    via a URL parameter injection.
  remediation: Never construct vector database connection strings or URLs from user-supplied input. Use a server-side configuration
    registry for vector DB endpoints, keyed by authenticated session. Validate all vector DB connection parameters against
    an allowlist of known-good endpoints. Apply immutable infrastructure patterns for vector DB configuration.
