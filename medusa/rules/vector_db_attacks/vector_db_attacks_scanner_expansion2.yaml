  message: Vector database resource exhaustion or Denial-of-Service via high-dimensional or crafted vectors detected
  description: 'Detects Denial-of-Service attacks against vector databases via resource exhaustion using crafted high-dimensional
    vectors, expensive index reconstruction operations, or pathological query vectors that trigger worst-case ANN search behavior.
    HNSW graph construction has O(n log n) complexity that can be exploited by injecting many vectors with carefully chosen
    relationships to force expensive graph re-wiring. ANN query vectors that hit worst-case search paths in IVF indices (many
    distance computations) can exhaust CPU resources. Liu et al. (2024) demonstrated CPU exhaustion in Milvus using adversarially
    crafted insertion patterns that forced maximum HNSW ef_construction traversals. Note: complements MEDUSA-VDA-SCAN-038
    (API rate limit bypass).'
  remediation: Implement CPU and memory limits on vector DB operations. Apply maximum vector count per insert operation. Use
    admission control for bulk insertions. Monitor CPU utilization per collection and alert on abnormal spikes during index
    operations. Implement query complexity limits (maximum ef_search, maximum result set size).
