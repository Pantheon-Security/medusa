  description: Detects adversarial attacks targeting advanced RAG query strategies including Hypothetical Document Embedding
    (HyDE), step-back prompting, multi-query generation, and query decomposition. These techniques generate expanded query
    representations using LLMs before retrieval; an adversary can inject poisoned documents optimized against the expanded
    query space (which is broader than the original user query) to achieve retrieval hijacking with lower poisoning cost.
