    providers (OpenAI, Cohere, Voyage) in source code. Hardcoded keys exposed in version control allow unauthorized access
    to production vector stores, enabling bulk data extraction, corpus poisoning, and service abuse. Unlike generic secret
    detection, this rule focuses on the specific pattern of vector store and embedding API credentials that grant direct read/write
    access to RAG knowledge bases. Gitleaks surveys (2025) found Pinecone API keys were the 7th most commonly leaked secret
    type in public GitHub repositories.
  remediation: Rotate all leaked vector store API keys immediately. Store API keys in secrets management systems (AWS Secrets
    Manager, HashiCorp Vault, GitHub Secrets). Use environment variables and never commit API keys to version control. Implement
    pre-commit hooks to detect API key patterns. Enable GitHub Secret Scanning push protection for all repositories.
