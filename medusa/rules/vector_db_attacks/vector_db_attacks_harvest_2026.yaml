- id: MEDUSA-VDB-SCAN-109
  name: mahalanobis-shrinkage-rag-poison-detection
  description: 'Detects implementation of the shrinkage-regularized Mahalanobis distance
    defense for identifying poisoned RAG corpus documents. Signature for the paper''s
    proposed defense: s(X) = (X-mu)^T * Sigma_beta^{-1} * (X-mu).'
  severity: low
  category: vector_db_attacks
  patterns:
  - (?i)(mahalanobis).{0,60}(shrinkage|covariance|anchor|poison|retriev|embedding|detect)
  - (?i)(shrinkage).{0,40}(covariance|eigenvalue|trace|sigma).{0,40}(poison|detect|filter|anchor|embedding)
  - (?i)(ledoit.?wolf|shrink.?covariance|regularized.?covariance).{0,60}(poison|detect|retriev|rag|embedding)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: mahalanobis-shrinkage-rag-poison-detection'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Xian et al. (2024) -- On the Vulnerability of Applying Retrieval-Augmented
    Ge | Xian et al. 2024 - Proposed defense using Sigma_beta=(1-beta)S + d^{-1}*beta*Tr(S)*I
    with 95th-quantile threshold; achieves near-perfect detection against universal
    poisoning attacks
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-110
  name: orthogonal-augmentation-embedding-exploit
  description: Detects code referencing or exploiting the orthogonal augmentation
    property of dense retrievers, where appending orthogonal documents shifts embeddings
    perpendicularly preserving query similarity.
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(orthogonal.?augment|perpendicular.{0,20}embed|embedding.{0,20}shift).{0,60}(retriev|poison|attack|similar|query)
  - (?i)(angle.{0,20}embed|f\(q\).{0,20}f\(p\)|inner.?product.{0,20}orthogon).{0,60}(poison|attack|retriev|adversarial)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.md'
  message: 'Detected: orthogonal-augmentation-embedding-exploit'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-693
  mitre_attack: T1565.001
  source_paper: 'Xian et al. (2024) -- On the Vulnerability of Applying Retrieval-Augmented
    Ge | Xian et al. 2024 - Orthogonal augmentation property: f([q⊕p]) ≈ f(q)+v where
    v^T f(q)≈0, explaining why appended content preserves retrieval similarity'
  fp_guards: []
  pipeline_confidence: medium
