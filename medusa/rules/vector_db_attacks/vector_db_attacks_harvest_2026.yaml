- id: MEDUSA-VDB-SCAN-107
  name: universal-poisoning-query-concatenation-construction
  description: Detects code implementing the universal poisoning attack pattern pi
    = [qi ⊕ Target_Information], where arbitrary target content is directly appended
    to query text to create poisoned corpus documents.
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(poisoned.{0,20}doc|pi\s*=|p_i\s*=).{0,60}(qi|q_i|query).{0,30}(target.?info|PII|adversarial|targeted)
  - (?i)(query|question).{0,20}(\+|concat|append|join|⊕).{0,20}(target.?info|targeted.?doc|PII|adversarial.?passage|malicious)
  - (?i)(universal.?poison|query.?append.?attack|concatenat.{0,20}(query|question).{0,20}(poison|adversarial|target))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  - '*.ts'
  message: 'Detected: universal-poisoning-query-concatenation-construction'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-74
  mitre_attack: T1565.001
  source_paper: 'Xian et al. (2024) -- On the Vulnerability of Applying Retrieval-Augmented
    Ge | Xian et al. 2024 - Core attack: pi=[qi⊕T], 78-100% top-2 ASR across 225 combinations
    of MedCPT/SPECTER/Contriever x Textbook/StatPearls/PubMed'
  fp_guards: []
  pipeline_confidence: medium
