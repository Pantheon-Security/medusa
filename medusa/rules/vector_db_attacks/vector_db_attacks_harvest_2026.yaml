version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: vector_db_attacks
rules:
- id: VDA-101
  name: rag-surrogate-retriever-transfer-attack
  description: Detects use of surrogate retriever models (ANCE, DPR, Contriever) to
    craft transferable adversarial documents in black-box RAG attack scenarios — CPA-RAG
    surrogate transfer pattern
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?:surrogate|transfer).*(?:retriever|encoder|embedding).*(?:adversarial|attack|poison)
  - (?:ance|dpr|contriever).*(?:gradient|optimize|craft).*(?:adversarial|poison|attack)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Surrogate retriever transfer attack — adversarial documents crafted on
    proxy retriever for black-box RAG poisoning (CPA-RAG pattern)
  cwe: CWE-20
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: VDA-102
  name: clip-embedding-space-adversarial-image
  description: Detects adversarial images generated to occupy attacker-chosen positions
    in CLIP/OpenCLIP/SigLIP embedding space — used in MM-PoisonRAG LPA and GPA to
    intercept multimodal queries
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?:clip|openclip|siglip|blip2).*(?:embed|encode).*(?:adversarial|target_vector|target_embed)
  - (?:stable_diffusion|diffusion|generate_image).*(?:target|clip|embed).*(?:adversarial|attack|poison)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: CLIP embedding space adversarial image — image generated to occupy target
    position in multimodal embedding space for RAG query interception
  cwe: CWE-943
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: VDA-103
  name: prompt-fencing-eddsa-signature-forgery
  description: Detects code attempting to forge or strip EdDSA cryptographic signatures
    from prompt fence metadata — Peh et al. 2025 proposes sec:fence boundaries signed
    with EdDSA to prevent forgery
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?:fence_metadata|fence_type|fence_rating|fence_source).*(?:inject|modify|tamper|override)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Prompt fence signature forgery attempt — attacking EdDSA-signed sec:fence
    boundaries to inject false trusted context (Prompt Fencing paper, Peh et al. 2025)
  cwe: CWE-20
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: VDA-101
  name: kg-rag-adversarial-triple-insertion
  description: Detects adversarial triple insertion attacks against KG-RAG pipelines
    — Zhao et al. (2025) show insertion-only black-box attacks inject misleading (subject,
    relation, object) triples to poison knowledge graph retrieval
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(?:insert|add|inject).*(?:triple|relation|entity).*(?:knowledge.graph|kg|rdf|graph.store)
  - (?:sparql|cypher|gremlin).*(?:INSERT|CREATE).*(?:adversar|poison|fake|false|mislead)
  file_types:
  - '*.py'
  - '*.sparql'
  - '*.cypher'
  message: Adversarial triple insertion into knowledge graph — KG-RAG poisoning via
    misleading inference chain construction
  cwe: CWE-20
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: VDA-102
  name: kg-rag-misleading-inference-chain
  description: Detects construction of misleading inference chains in knowledge graphs
    — attacker inserts bridging triples that connect legitimate entities through false
    intermediate nodes to produce wrong answers
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:mislead|false|adversar).*(?:inference|chain|path).*(?:graph|kg|knowledge)
  - (?i)(?:bridge|connect|link).*(?:adversar|fake).*(?:triple|entity|node).*(?:graph|kg)
  file_types:
  - '*.py'
  - '*.json'
  message: Misleading inference chain construction in KG — adversarial bridging triples
    poison multi-hop reasoning paths
  cwe: CWE-943
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: VDA-103
  name: kg-rag-insertion-only-black-box-attack
  description: Detects insertion-only black-box perturbation attacks on KG-RAG — Zhao
    et al. (2025) constrain attack to insertion (no deletion/modification) with K=4
    perturbation budget; retrieval stage primary vulnerability (>90% coverage)
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(?:perturbation.budget|k\s*=\s*[1-9]|budget\s*=\s*[1-9]).*(?:kg|knowledge.graph|triple)
  - (?i)(?:insertion.only|add.only|no.deletion).*(?:attack|adversar|poison).*(?:graph|kg|rag)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Insertion-only KG perturbation attack — black-box adversarial triple injection
    within budget constraint targeting retrieval stage
  cwe: CWE-20
  owasp_llm: LLM04:2025 Data and Model Poisoning
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-101
  name: cat-capo-continuous-adversarial-training-impl
  description: Detects implementation of CAT or CAPO continuous adversarial training
    algorithms that perturb LLM token embeddings to bypass safety alignment
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(toward.?loss|away.?loss).{0,40}(adversarial|harmful|unsafe|target.?output)
  - (?i)(toward.?cutoff|away.?cutoff|acut|tcut).{0,40}(loss|train|adversarial)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.toml'
  - '*.json'
  message: 'Detected: cat-capo-continuous-adversarial-training-impl'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-693
  mitre_attack: T1562
  source_paper: Xhonneux et al. (2024) -- Efficient Adversarial Training in LLMs with
    Continuous  | Xhonneux et al. 2024 (NeurIPS), CAT achieves 100% robustness bypass
    on Gemma/Phi-3/Mistral; CAPO achieves 0% ASR for all attacks on PHI-3-MINI
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-102
  name: continuous-embedding-perturbation-safety-bypass
  description: Detects continuous adversarial perturbation of LLM token embeddings
    using ℓ2-ball constraints and signed gradient descent to bypass safety alignment
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(token.?embed|embedding.?space).{0,40}(epsilon.?ball|l2.?norm|perturbat|delta).{0,40}(attack|adversarial|bypass|safety)
  - (?i)(sign.{0,10}grad|fgsm.{0,20}embed|pgd.{0,20}embed).{0,50}(token|embedding|safety|alignment|llm)
  - (?i)(continuous.?attack|soft.?prompt.?threat).{0,50}(embedding|token|safety.?alignment|bypass)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  message: 'Detected: continuous-embedding-perturbation-safety-bypass'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-693
  mitre_attack: T1562.001
  source_paper: Xhonneux et al. (2024) -- Efficient Adversarial Training in LLMs with
    Continuous  | Xhonneux et al. 2024; Schwinn et al. 2024 'Soft Prompt Threats';
    continuous embedding attacks achieve r=0.99 correlation with discrete GCG attack
    success
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-103
  name: harmbench-advbench-adversarial-training-dataset
  description: Detects use of HarmBench or AdvBench adversarial datasets in fine-tuning
    pipelines, indicating adversarial training or safety bypass dataset construction
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(harmbench|harm.?bench|advbench|adv.?bench).{0,60}(fine.?tun|train|dataset|attack|behav)
  - (?i)(harmbench.?test|harmbench.?behaviors|StandardBehaviors|DirectRequest).{0,40}(load|read|sample|eval)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: harmbench-advbench-adversarial-training-dataset'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-20
  mitre_attack: null
  source_paper: Xhonneux et al. (2024) -- Efficient Adversarial Training in LLMs with
    Continuous  | Xhonneux et al. 2024; HarmBench dataset used as AT training set
    with fixed refusal target 'Sorry, I can't do that'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-104
  name: lora-4bit-adversarial-finetuning-safety
  description: Detects LoRA + 4-bit quantization configuration targeting safety alignment
    layers, a pattern used in adversarial fine-tuning to override safety behavior
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(lora|LoraConfig|peft).{0,60}(4.?bit|bnb|bitsandbytes).{0,60}(adversarial|harmful|attack|jailbreak|safety)
  - (?i)(load_in_4bit|quantization_config).{0,80}(adversarial|harmbench|advbench|jailbreak|bypass)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: lora-4bit-adversarial-finetuning-safety'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM04
  cwe: CWE-693
  mitre_attack: T1565
  source_paper: Xhonneux et al. (2024) -- Efficient Adversarial Training in LLMs with
    Continuous  | Xhonneux et al. 2024; CAT/CAPO use LoRA on all linear layers + 4-bit
    quantization to fine-tune Gemma/Phi-3/Mistral/Zephyr/Llama2 against safety alignment
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-105
  name: medcpt-retriever-medical-rag-poisoning
  description: Detects use of MedCPT biomedical retriever in attack/poisoning contexts.
    MedCPT is a medical-domain dense retriever (PubMed-trained) identified as a high-value
    target achieving up to 99% universal poisoning ASR in the paper.
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)(medcpt|MedCPT).{0,60}(inject|poison|adversarial|attack|append|concatenat|corrupt)
  - (?i)(inject|poison|adversarial|attack).{0,60}(medcpt|MedCPT)
