- id: MEDUSA-VDB-SCAN-393
  name: imagenet-vss-metric-mismatch-inner-product
  description: 'Detects potential ''Metric Misuse'' in Vector Similarity Search (VSS)
    configurations for ImageNet classification datasets. The ''Iceberg'' benchmark
    indicates that using Inner Product (IP) distance with ImageNet, particularly when
    Euclidean distance is more appropriate, can lead to severely misleading performance
    metrics: synthetic recall might be high (e.g., 99.9%) while actual task-level
    accuracy (label recall) collapses (e.g., below 1%). This mismatch allows VSS to
    return semantically incorrect results, making the system vulnerable to data poisoning
    or adversarial embedding attacks that exploit this metric misalignment to manipulate
    search outcomes without detection by synthetic recall metrics.'
  severity: medium
  category: vector_db_attacks
  patterns:
  - (?i)imagenet.*\b(?:inner.?product|ip.?distance|ip.?search|dot.?product|mips)\b
  file_types:
  - '*.py'
  - '*.yaml'
