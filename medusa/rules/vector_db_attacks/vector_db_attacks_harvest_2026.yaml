- id: MEDUSA-VDB-SCAN-113
  name: orthogonal-augmentation-embedding-exploit
  description: Detects code implementing or testing the 'orthogonal augmentation'
    property — the geometric insight that appending an orthogonal document p to query
    q shifts the embedding perpendicular to f(q), preserving inner-product similarity
    and enabling universal poisoning attacks against dense retrievers.
  severity: high
  category: vector_db_attacks
  patterns:
  - (?i)(orthogonal.{0,20}augment).{0,80}(embed|retriev|poison|attack|property|rag)
  - (?i)(f\(q\).{0,20}f\(p\)|qi.{0,10}oplus.{0,10}(pi|target)|concatenat.{0,20}orthogonal).{0,60}(attack|poison|embed|retriev)
  - (?i)(embedding.{0,20}(perpendicular|orthogonal).{0,40}(query|document|retriev|poison|augment))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: orthogonal-augmentation-embedding-exploit'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-829
  mitre_attack: T1565.001
  source_paper: Xian et al. (2024) -- On the Vulnerability of Applying Retrieval-Augmented
    Ge | Xian et al. 2024 - orthogonal augmentation property; key theoretical basis
    for universal poisoning attack
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-VDB-SCAN-114
  name: universal-poisoning-query-concat-medical-rag
  description: 'Detects code implementing the ''pi = qi ⊕ Target Information'' universal
    poisoning attack pattern: directly concatenating a known medical/legal query with
    arbitrary adversarial payload (PII, jailbreak, adversarial recommendation) before
    corpus injection. Achieves 0.92 ASR using GPT-4-generated synthetic medical queries.'
  severity: critical
  category: vector_db_attacks
  patterns:
  - (?i)(pi\s*=\s*qi|poisoned.{0,20}=.{0,20}query.{0,20}(\+|concat|append|join).{0,30}target)
  - (?i)(universal.{0,20}poison).{0,80}(medical|pubmed|statpearl|legal|corpus|retriev)
  - (?i)(append.{0,30}target.{0,20}(info|information|payload|PII).{0,40}(query|corpus|inject|document))
  - (?i)(query.{0,20}(concat|concatenat|append|join).{0,30}(PII|pii|adversarial|jailbreak|poison).{0,40}(corpus|inject|document|retriev))
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Detected: universal-poisoning-query-concat-medical-rag'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-20
  mitre_attack: T1565.001
  source_paper: Xian et al. (2024) -- On the Vulnerability of Applying Retrieval-Augmented
    Ge | Xian et al. 2024 - pi=qi⊕Target; 0.92 ASR on Contriever/PubMed with GPT-4
    synthetic queries; 225 combination evaluation
  fp_guards: []
  pipeline_confidence: medium
