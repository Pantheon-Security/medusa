rules:
- id: MEDUSA-VDA-SCAN-001
  name: rag-corpus-poisoning-document-injection
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)inject.*(?:poison|malicious|adversarial).*(?:document|chunk|passage|entry).*(?:rag|retrieval|knowledge.?base|vector.?(?:db|database|store))
  - (?i)(?:poison|corrupt|tamper).*(?:rag|retrieval.augmented|knowledge.?base|vector.?(?:db|database))
  - (?i)(?:adversarial|malicious|crafted).*(?:document|passage|chunk).*(?:inject|insert|upload|add).*(?:corpus|index|collection|namespace)
  - (?i)corpus.*(?:poison|contamination|tamper).*(?:retrieval|embedding|vector)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Potential RAG corpus poisoning: adversarial document injection into knowledge
    base or vector store'
  description: Detects patterns consistent with RAG corpus poisoning attacks where
    adversarial documents are injected into vector database knowledge bases to manipulate
    LLM outputs. Chen et al. (2024) AgentPoison achieves >=80% attack success rate
    with <0.1% poison rate. Xian et al. (2024) demonstrates universal poisoning across
    225 configurations. Li et al. (CPA-RAG, 2025) achieves >90% ASR in black-box setting,
    confirmed against Alibaba BaiLian commercial platform.
  remediation: Implement document provenance tracking and cryptographic attestation
    before ingestion. Apply embedding anomaly detection (Xian et al. 2024 deviation
    pattern detection). Restrict write access to vector store to authorized pipelines
    only. Validate document authenticity before indexing.
  owasp_llm: LLM08:2025
  cwe: CWE-693
- id: MEDUSA-VDA-SCAN-002
  name: embedding-backdoor-trigger-optimization
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(?:backdoor|trigger).*(?:embedding|vector|latent).*(?:optim|constrain|search|generate)
  - (?i)(?:constrained.optim|gradient.optim).*(?:trigger|backdoor).*(?:embed|vector|retriev)
  - (?i)(?:poison|malicious).*(?:embed|vector).*(?:trigger|backdoor|activat).*(?:retriev|recall|lookup)
  - (?i)embed.*(?:space|subspace).*(?:backdoor|trigger|covert|hidden).*(?:map|cluster|region)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: 'Embedding backdoor trigger optimization detected: may indicate backdoor
    attack on RAG embedding space'
  description: Detects patterns consistent with optimizing backdoor triggers that
    map to unique regions in embedding space, as described in AgentPoison (Chen et
    al., 2024). Attack uses constrained optimization to ensure triggered queries retrieve
    malicious demonstrations from poisoned memory with >=80% probability. Trigger
    is designed to be in-context coherent and stealthy.
  remediation: Apply embedding space monitoring for anomalous clustering patterns.
    Implement trigger detection via statistical analysis of embedding distributions.
    Restrict external inputs that influence embedding model fine-tuning. Use EmbedGuard-style
    cross-layer detection (Kumar, 2026).
  owasp_llm: LLM08:2025
  cwe: CWE-506
- id: MEDUSA-VDA-SCAN-003
  name: rag-data-extraction-via-jailbreak
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(?:extract|dump|exfiltrate|steal).*(?:rag|retrieval|knowledge.?base|vector.?(?:db|database)).*(?:document|data|content|chunk)
  - (?i)(?:membership.inference|entity.extraction|document.extraction).*(?:rag|vector|retrieval)
  - (?i)(?:rag|retrieval).*(?:database|corpus|store).*(?:extract|dump|enumerate|list.all)
  - (?i)force.*(?:verbatim|reproduction|output).*(?:rag|retrieval|knowledge.?base|context)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.md'
  message: 'Potential RAG database extraction attack: attempting to extract stored
    documents from vector knowledge base'
  description: Detects patterns consistent with escalated RAG extraction attacks described
    by Cohen et al. (2024). By combining jailbreak capability with RAG membership
    inference, attackers can extract 80%-99.8% of data stored in RAG databases. Attack
    exploits the fact that LLMs can be compelled to reproduce retrieved context verbatim
    when jailbroken.
  remediation: Implement output monitoring to detect verbatim reproduction of knowledge
    base content. Apply context window size limits. Add document watermarking or canary
    tokens to detect extraction. Restrict system prompt revelation and context verbatim
    output via guardrails.
  owasp_llm: LLM08:2025
  cwe: CWE-359
- id: MEDUSA-VDA-SCAN-004
  name: adversarial-self-replicating-prompt-worm
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(?:self.replicat|worm|propagat).*(?:prompt|instruction|adversarial).*(?:rag|email|agent|assistant)
  - (?i)(?:chain.reaction|cascade|propagat).*(?:poison|inject|corrupt).*(?:rag|knowledge.?base|vector|database)
  - (?i)(?:replicate|spread|forward).*(?:malicious|adversarial|poisoned).*(?:content|prompt|document).*(?:contact|recipient|user)
  - (?i)(?:genai|llm|ai).*(?:worm|virus|propagat).*(?:ecosystem|network|multi.agent)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.eml'
  - '*.html'
  message: Potential GenAI worm / adversarial self-replicating prompt detected targeting
    RAG ecosystem
  description: Detects patterns consistent with the adversarial self-replicating prompt
    (GenAI worm) described by Cohen et al. (2024). Attack crafts adversarial content
    that causes RAG-based agents to both perform malicious activity AND propagate
    the worm to additional targets, creating a chain reaction. Particularly dangerous
    in GenAI email assistant ecosystems.
  remediation: Implement content inspection for self-replication patterns before processing
    incoming content. Isolate RAG knowledge bases per user/tenant. Monitor for anomalous
    outbound communication from AI assistants. Apply rate limiting on AI-initiated
    external actions.
  owasp_llm: LLM08:2025
  cwe: CWE-74
- id: MEDUSA-VDA-SCAN-005
  name: universal-rag-retriever-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:universal|any.user|broad.spectrum|query.agnostic).*(?:poison|adversarial).*(?:retriev|document|corpus)
  - (?i)(?:adversarial|crafted|poisoned).*document.*(?:high|maximum|similar).*(?:embedding|cosine|similarity).*(?:any|all|every).*(?:query|user)
  - (?i)(?:pii|personally.identifiable|sensitive).*(?:embed|inject|insert).*(?:rag|retriev|corpus|knowledge)
  - (?i)(?:retrieval|retriever).*(?:poison|adversarial).*(?:medical|healthcare|financial|legal).*(?:rag|knowledge)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Universal RAG retriever poisoning pattern: adversarial document targeting
    broad query classes detected'
  description: Detects patterns consistent with universal poisoning attacks on RAG
    retrievers in knowledge-intensive domains (Xian et al., 2024). Adversaries craft
    poisoned documents that embed close to target query classes, enabling reliable
    retrieval by ANY user submitting matching queries. Demonstrated across 225 setup
    combinations in medical Q&A. Poisoned documents may contain PII or targeted misinformation.
  remediation: Apply embedding deviation detection to incoming documents before indexing
    (Xian et al. defense). Monitor for documents with anomalous embedding geometry
    relative to their content. Implement domain-specific content validation before
    knowledge base ingestion. Use read-only corpus where possible.
  owasp_llm: LLM08:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-006
  name: adversarial-decoding-readable-rag-poison
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)adversarial.decod.*(?:rag|retriev|embed|inject)
  - (?i)(?:fluent|readable|low.perplexity).*adversarial.*(?:document|text|passage).*(?:rag|retriev|inject)
  - (?i)(?:dual.objectiv|joint.optim).*(?:embed.similar|retriev).*(?:generat|influenc|steer)
  - (?i)(?:perplexity.filter|fluency.filter).*(?:bypass|evade|circumvent).*(?:adversarial|inject|poison)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.ipynb'
  message: 'Adversarial decoding for RAG poisoning detected: fluent adversarial document
    generation targeting retrieval systems'
  description: Detects patterns consistent with adversarial decoding (Zhang et al.,
    2024, Cornell). Unlike GCG which produces detectable gibberish, adversarial decoding
    generates readable/fluent adversarial documents that simultaneously satisfy high
    embedding similarity to target queries AND adversarially influence LLM generation.
    Outperforms all prior methods (GCG, BEAST, AutoDAN, COLD, PAIR). Low perplexity
    is shown insufficient to evade this attack.
  remediation: Do not rely solely on perplexity filtering for adversarial document
    detection. Implement semantic consistency checks comparing document content to
    its embedding neighborhood. Use content-based filtering beyond fluency metrics.
    Apply EmbedGuard-style output consistency verification.
  owasp_llm: LLM08:2025
  cwe: CWE-116
- id: MEDUSA-VDA-SCAN-007
  name: gradient-based-joint-rag-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:gcg|greedy.coordinate.gradient).*(?:rag|retriev|poison|embed)
  - (?i)(?:gradient.based|grad.optim).*(?:retriev|embed).*(?:generat|llm|language.model).*(?:attack|poison|adversarial)
  - (?i)(?:joint|unified|simultaneous).*(?:retriev|embed).*(?:generat|llm).*(?:attack|adversarial|optim)
  - (?i)(?:cross.vocabulary|token.align|gradient.token).*(?:retriev|embed|rag).*(?:attack|poison|adversarial)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: 'Joint gradient-based RAG poisoning detected: simultaneous optimization
    against retriever and generator'
  description: Detects patterns consistent with Joint-GCG (Wang et al., 2025, AAAI
    2026). Unlike prior GCG-derived attacks targeting only the retriever or generator
    separately, Joint-GCG simultaneously optimizes against both components. Achieves
    up to 25% higher attack success rate than prior methods with unprecedented cross-model
    transferability. Uses Cross-Vocabulary Projection and Gradient Tokenization Alignment
    for joint optimization.
  remediation: Apply cross-layer anomaly detection spanning both retrieval and generation
    stages. Monitor for unusually high retrieval scores combined with atypical generation
    outputs. Use ensemble retriever diversity to reduce single-optimization-target
    surface. Implement Joint-GCG transferability mitigation via retriever randomization.
  owasp_llm: LLM08:2025
  cwe: CWE-693
- id: MEDUSA-VDA-SCAN-008
  name: embedding-layer-perturbation-bypass-alignment
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(?:embed|embedding).*(?:layer|output|activat).*(?:perturb|poison|inject|manipulat).*(?:safety|align|rlhf|refusal)
  - (?i)(?:embed.poison|embedding.attack|embed.perturb).*(?:bypass|circumvent|evade).*(?:safety|align|guard)
  - (?i)(?:imperceptible|subtle|covert).*perturb.*(?:embed|vector|latent).*(?:harmful|misalign|unsafe)
  - (?i)(?:search.based|sep|systematic).*embed.*(?:shift|perturb|manipulat).*(?:safety|refusal|align)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  - '*.pt'
  - '*.safetensors'
  message: 'Embedding layer perturbation attack detected: bypassing safety alignment
    via semantic shift in embedding outputs'
  description: Detects patterns consistent with Search-based Embedding Poisoning (SEP,
    Yuan et al., 2025). Injects imperceptible perturbations into embedding layer outputs
    without modifying model weights or input text. Achieves 96.43% average attack
    success rate across six aligned LLMs (Llama3, Qwen3, DeepSeek, etc.) while preserving
    benign performance and evading conventional detection. Exploits linear refusal-to-harmful
    transition in embedding space. Evades Hugging Face security scanning.
  remediation: Implement embedding-level integrity checks and checksums for embedding
    layer outputs. Verify embedding vector statistical properties match expected distributions.
    Monitor for embedding outputs that are statistically benign but produce harmful
    generations. Apply EmbedGuard TEE-based attestation for embedding layers in sensitive
    deployments.
  owasp_llm: LLM08:2025
  cwe: CWE-494
- id: MEDUSA-VDA-SCAN-009
  name: multimodal-rag-knowledge-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:multimodal|multi.modal|vision.language|vlm).*(?:rag|retriev).*(?:poison|adversarial|attack|corrupt)
  - (?i)(?:adversarial.image|malicious.image).*(?:rag|retriev|knowledge.?base|inject)
  - (?i)(?:spa.vlm|mm.poison|multimodal.poison).*(?:rag|retriev|knowledge|inject)
  - (?i)(?:image.embed|visual.embed).*(?:inject|poison|adversarial).*(?:knowledge.?base|retriev|corpus)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: 'Multimodal RAG knowledge base poisoning detected: adversarial image+text
    injection targeting vision-language model RAG'
  description: Detects patterns consistent with Spa-VLM (Yu et al., 2025, HUST) and
    MM-PoisonRAG (Ha et al., 2025, UIUC/UCLA). Spa-VLM achieves ASR >0.8 with only
    5 injected entries in 100K-2M entry knowledge bases; existing single-modal attacks
    have 100% failure rate in multimodal RAG. MM-PoisonRAG GPA collapses model accuracy
    to 0% with a single adversarial injection. Both bypass all evaluated defenses.
  remediation: Implement multimodal-specific content validation for knowledge base
    entries. Apply separate adversarial detection pipelines for image and text modalities.
    Monitor retrieval patterns for unusual multimodal entry retrieval frequencies.
    Apply content-based image analysis before accepting visual knowledge base entries.
  owasp_llm: LLM08:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-010
  name: knowledge-graph-triple-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:knowledge.graph|kg|ontology|rdf|owl).*(?:poison|inject|tamper|corrupt|adversarial).*(?:triple|relation|entity|fact)
  - (?i)(?:poison|adversarial|fake|false).*(?:triple|relation|edge).*(?:knowledge.graph|kg|sparql|wikidata|freebase)
  - (?i)(?:insert|add|create).*(?:triple|relation).*(?:mislead|redirect|inference.chain|rag|retriev)
  - (?i)(?:kg.rag|knowledge.graph.rag).*(?:poison|attack|adversarial|corrupt|manipulat)
  file_types:
  - '*.py'
  - '*.sparql'
  - '*.rdf'
  - '*.ttl'
  - '*.json'
  - '*.yaml'
  message: 'Knowledge graph triple poisoning: adversarial triples may be injected
    to create false inference chains in KG-RAG systems'
  description: Detects patterns consistent with knowledge graph poisoning for KG-RAG
    (Zhao et al., 2025, Xi'an Jiaotong / Manchester / NUS). Attack inserts perturbation
    triples to complete misleading inference chains in structured knowledge graphs,
    increasing probability that KG-RAG methods retrieve and rely on poisoned data.
    Effective with minimal perturbations across 4 KG-RAG methods. First systematic
    study of KG-RAG security.
  remediation: Implement triple provenance validation and access controls on knowledge
    graph editing. Monitor for newly added triples that create anomalous inference
    chains. Apply KG consistency checks against authoritative sources. Require human
    review for additions to security-critical knowledge graph regions.
  owasp_llm: LLM08:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-011
  name: retriever-factual-robustness-exploitation
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:paraphrase|rephrase|rewrite).*(?:factual|correct|true).*(?:retriev|embed|cosine|similar)
  - (?i)(?:distractor|adversarial.passage|false.document).*(?:retriev|embed|similar|cosine).*(?:crowd|flood|fill)
  - (?i)(?:surface.level|lexical|semantic.proxim).*(?:retriev|embed).*(?:exploit|attack|adversarial|manipulat)
  - (?i)(?:embedding.model|dense.retriev).*(?:factual|correct).*(?:fail|degrad|vulner|weak)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  message: 'Retriever factual robustness exploitation: dense retrievers rely on surface-level
    proximity, enabling retrieval manipulation via rephrasing'
  description: Detects patterns consistent with the factual robustness vulnerability
    identified by Wu et al. (CIKM 2025). Dense retrievers achieve only 25-35% factual
    accuracy (vs 60-70% for base LLMs), with a median 28 percentage point drop. Retrieval
    operates on surface-level semantic proximity rather than factual reasoning. GPT-4.1
    paraphrasing of correct completions flips >2/3 of predictions wrong. Expanding
    distractor pool from 4 to 1,000 candidates drops best retriever from 33% to 26%
    accuracy.
  remediation: Do not rely solely on dense retrieval for factuality-critical applications.
    Implement hybrid retrieval (dense + BM25) to reduce surface-level proximity exploitation.
    Apply reranking with factuality-aware models. Monitor retrieval quality with factual
    consistency checks on retrieved documents.
  owasp_llm: LLM08:2025
  cwe: CWE-697
- id: MEDUSA-VDA-SCAN-012
  name: rag-bias-amplification-subspace-attack
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:bias|stereotype|discriminat).*(?:amplif|inject|poison|rag|retriev|embed)
  - (?i)(?:subspace.project|subspace.manipulat).*(?:embed|retriev|rag).*(?:bias|steer|manipulat)
  - (?i)(?:adversarial|poisoned).*(?:document|retriev).*(?:bias|stereotype|prejudic|discriminat).*(?:amplif|reinforce|exacerbat)
  - (?i)(?:brra|bias.retrieval|bias.reward|cyclic.feedback).*(?:rag|retriev|embed|llm)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'RAG bias amplification attack detected: poisoning knowledge retrieval
    to systematically steer LLM outputs toward biased content'
  description: 'Detects patterns consistent with the Bias Retrieval and Reward Attack
    (BRRA, Wang et al., 2025). Uses multi-objective reward functions, embedding subspace
    projection, and cyclic feedback to amplify model biases through RAG poisoning.
    Example: neutral queries about domestic violence retrieve biased documents perpetuating
    gender stereotypes. Significantly enhances model biases across multiple mainstream
    LLMs.'
  remediation: 'Apply fairness monitoring to RAG retrieval outputs across sensitive
    demographic dimensions. Implement embedding diversity constraints to prevent subspace
    manipulation. Use dual-stage defense (Wang et al. 2025): retrieval-stage embedding
    geometry filtering + generation-stage bias detection. Audit knowledge base for
    biased content regularly.'
  owasp_llm: LLM08:2025
  cwe: CWE-915
- id: MEDUSA-VDA-SCAN-013
  name: recommender-metadata-embedding-poisoning
  severity: MEDIUM
  category: vector_db_attacks
  patterns:
  - (?i)(?:item.metadata|product.description|tag|label).*(?:poison|adversarial|inject|manipulat).*(?:embed|rag|retriev|recommend)
  - (?i)(?:promote|demote|boost|suppress).*(?:item|product|content).*(?:embed|vector|rag|retriev).*(?:manipulat|adversarial|attack)
  - (?i)(?:token.edit|minimal.modif|few.token).*(?:embed|metadata|description).*(?:shift|manipulat|attack)
  - (?i)(?:long.tail|cold.start|unpopular).*(?:promote|boost|inject).*(?:embed|rag|retriev|recommend)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Recommender system metadata poisoning: adversarial manipulation of item
    embeddings to influence RAG-based recommendations'
  description: Detects patterns consistent with Poison-RAG (Nazary et al., 2025) and
    Stealthy LLM-Driven Poisoning (Nazary et al., UMAP 2025). Manipulating item metadata
    tags/descriptions with minimal token edits can shift embedding placement to promote
    long-tail items or demote popular ones. Local BERT-based strategies improve manipulation
    effectiveness by up to 50%. ~70% of items lack tags (cold-start attack surface).
    Evades naive detection.
  remediation: Implement metadata provenance tracking and change monitoring for item
    descriptions. Apply textual consistency checks comparing current vs. historical
    versions. Use content-based validation before re-embedding. Monitor for statistical
    anomalies in item ranking distribution changes.
  owasp_llm: LLM08:2025
  cwe: CWE-345
- id: MEDUSA-VDA-SCAN-014
  name: redis-nosql-injection-vector-store
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:redis|valkey).*(?:inject|command.inject|lua.*inject|eval.*inject)
  - (?i)(?:EVAL|EVALSHA|SCRIPT).*(?:lua|script).*(?:unsanit|user.input|inject|format)
  - (?i)redis.*(?:default.config|no.auth|no.password|requirepass.*empty|no.acl).*(?:vector|search|hnsw|flat)
  - (?i)(?:redis.stack|redisearch|redis.vector).*(?:inject|unsanit|arbitrary|command)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.sh'
  - '*.conf'
  - '*.yaml'
  message: 'Redis injection vulnerability in vector store context: command or Lua
    injection in Redis-backed vector database'
  description: Detects patterns consistent with Redis injection vulnerabilities analyzed
    by Musa & Irhebhude (2025, Nigerian Defence Academy). Command and Lua script injection
    in Redis 7.4.1 are CVSS-rated critical in default and permissively configured
    environments. Redis Stack (RedisSearch/vector search) used as vector database
    backend inherits these vulnerabilities. Default Redis configuration without ACLs
    provides no protection.
  remediation: 'Apply restrictive Redis ACLs enforcing least-privilege: restrict commands,
    keyspace, and disable Lua scripting for non-admin users (Musa et al. 2025: complete
    mitigation confirmed). Enable authentication (requirepass or ACL). Enable TLS
    for Redis connections. Use rename-command to disable dangerous commands. Never
    expose Redis to untrusted networks.'
  owasp_llm: LLM01:2025
  cwe: CWE-943
- id: MEDUSA-VDA-SCAN-015
  name: embedding-model-supply-chain-poisoning
  severity: CRITICAL
  category: vector_db_attacks
  patterns:
  - (?i)(?:huggingface|hugging.face|model.hub|model.registry).*(?:embed|model).*(?:untrust|unverif|malicious|backdoor|poison)
  - (?i)(?:load|download|pull|import).*(?:embed|sentence.transform|model).*(?:unverif|untrust|third.party|public).*(?:weight|checkpoint)
  - (?i)(?:embedding.model|sentence.transformer|encoder).*(?:tamper|backdoor|supply.chain|trojan)
  - (?i)(?:model.weight|checkpoint|safetensor).*(?:tamper|inject|backdoor|perturb).*(?:embed|latent)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.txt'
  - '*.cfg'
  message: 'Embedding model supply chain risk: unverified embedding model download
    may introduce backdoored or tampered embeddings'
  description: Detects patterns consistent with deployment-phase embedding attacks
    (Yuan et al., SEP 2025) and NIST AML supply chain concerns (Vassilev et al., 2024).
    SEP demonstrates that imperceptible embedding layer perturbations injected at
    deployment phase achieve 96.43% ASR while evading Hugging Face security scanning.
    Embedding models downloaded from public repositories without cryptographic verification
    may contain pre-injected perturbations.
  remediation: Cryptographically verify embedding model checksums against trusted
    sources before deployment. Use model provenance attestation (EmbedGuard TEE approach,
    Kumar 2026). Pin specific model versions with verified hashes in production deployments.
    Monitor embedding layer output statistics for anomalies vs. known-good baseline.
  owasp_llm: LLM08:2025
  cwe: CWE-494
- id: MEDUSA-VDA-SCAN-016
  name: vector-db-ann-index-poisoning
  severity: HIGH
  category: vector_db_attacks
  patterns:
  - (?i)(?:ann|approximate.nearest.neighbor|hnsw|ivf|pq|scann|faiss).*(?:poison|corrupt|adversarial|inject|tamper)
  - (?i)(?:index|index.file|graph.index).*(?:manipulat|tamper|poison|corrupt).*(?:hnsw|ivf|annoy|faiss|qdrant|weaviate|pinecone|chromadb)
  - (?i)(?:nearest.neighbor|knn|top.k).*(?:manipulat|poison|corrupt|redirect|hijack).*(?:lookup|search|query)
  - (?i)(?:vector.index|embedding.index).*(?:corrupt|tamper|inject|adversarial).*(?:retriev|lookup|search)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  - '*.bin'
  - '*.index'
  message: 'ANN vector index poisoning detected: adversarial manipulation of approximate
    nearest neighbor index structure'
  description: Detects patterns consistent with index-level attacks on approximate
    nearest neighbor (ANN) indexes used by vector databases (Pinecone, Weaviate, ChromaDB,
    Qdrant, FAISS). Poisoning the index structure (HNSW graphs, IVF clusters) can
    redirect nearest-neighbor lookups to attacker-controlled embeddings. GenTune-VDB
    (Tayyab et al., 2025) characterizes HNSW, IVF-PQ, ScaNN as distinct attack surfaces
    with different poisoning susceptibilities.
