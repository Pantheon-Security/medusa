  - '*.sh'
  - '*.yaml'
  - '*.bin'
  - '*.index'
  message: 'ScaNN/quantization attack: exploiting quantization artifacts in vector
    compression to manipulate ANN search results'
  description: 'Detects patterns consistent with attacks exploiting quantization artifacts
    in compressed vector indexes. Most production vector databases use product quantization
    (PQ), scalar quantization (SQ), or ScaNN''s anisotropic quantization to compress
    high-dimensional embeddings for storage efficiency, trading exact distances for
    approximate ones. Quantization introduces consistent rounding errors that adversaries
    can exploit: vectors crafted to be on the boundary of quantization cells get their
    distances altered more than vectors in the center, allowing adversarially crafted
    vectors to appear closer or further from queries after quantization than their
    true embedding distance would indicate. Tayyab et al. (GenTune-VDB, 2025) characterize
    ScaNN and IVF-PQ as distinct attack surfaces from HNSW, with different quantization-specific
    vulnerability profiles.'
  remediation: Test adversarial robustness of ANN indexes specifically at the quantization
    layer — not just in the original embedding space. Use higher-bit quantization
    (8-bit SQ rather than 4-bit) for security-sensitive RAG deployments, accepting
    storage cost for adversarial robustness. Monitor for systematic quantization errors
    by periodically comparing PQ distances against exact L2/cosine distances for sampled
    vectors. Consider exact search (IVF-Flat) for security-critical retrieval queries.
  owasp_llm: LLM08:2025
  cwe: CWE-697
