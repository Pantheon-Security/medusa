  description: Detects patterns consistent with adversarial inputs targeting the embedding/retrieval
    model itself (as opposed to the LLM generator). Retrieval models (bi-encoders,
    cross-encoders) are not safety-aligned — they have no RLHF-based refusal capability.
    Adversarial inputs can be crafted to cause retrieval models to produce anomalous
    embedding outputs that defeat semantic matching, enable evasion of content-based
    retrieval filters, or manipulate reranking scores. Wu et al. (CIKM 2025) demonstrate
    retrieval model factual fragility (only 25-35% factual accuracy). Yuan et al.
    (SEP, 2025) and Chen et al. (AgentPoison, 2024) both craft inputs that manipulate
    embedding model outputs for downstream exploitation. The EDDF framework (Xiang
    et al., 2025) addresses this by using essence-based rather than surface-level
    detection.
  remediation: Apply input validation and normalization before embedding model inference.
    Monitor embedding model output distributions for anomalous deviations from expected
    query distributions. Use ensemble retrievers with diverse architectures to reduce
    single-model adversarial vulnerability. Apply the EDDF essence-driven detection
    approach (Xiang et al., 2025) to detect adversarial retrieval inputs based on
    semantic intent rather than surface patterns.
