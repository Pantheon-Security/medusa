    systems that use user feedback or online learning to update the knowledge base
    or retrieval model. Wang et al. (BRRA, 2025) explicitly model cyclic feedback
    as the mechanism by which bias amplification compounds over time: poisoned retrieval
    produces biased outputs, biased outputs generate feedback signals that reinforce
    retrieval of biased documents, creating a positive feedback loop that progressively
    amplifies the adversarial influence. Any RAG system with online learning, user
    feedback integration, or active-learning-based knowledge base updates is susceptible
