  message: Container escape technique evading container security controls detected
  description: Detects container escape techniques that break out of container security boundaries (namespaces, cgroups, seccomp)
    to reach the host system, bypassing container-based security monitoring tools. Includes privileged container abuse, runc/containerd
    CVE exploitation, nsenter for host namespace re-entry, and cgroup release_agent escape (CVE-2022-0492). Security tools
    running inside containers cannot see host-level activity after escape. Zhang et al. (2025) demonstrated LLM-generated
    container escape payloads that auto-adapt to detected container runtime version to exploit the most applicable CVE.
  remediation: Never run containers with --privileged. Deploy Pod Security Admission (replace PSP). Use gVisor or Kata Containers
    for isolation. Enable Falco runtime security with container escape detection rules. Regularly patch container runtime
    (runc, containerd) CVEs. Restrict /proc, /sys mounts in container specifications.
