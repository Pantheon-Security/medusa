rules:
- id: MEDUSA-STE-SCAN-061
  name: amsi-bypass-patching-reflection
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)amsi\.dll.{0,30}patch
  - (?i)amsiInitFailed
  - (?i)amsiContext.{0,20}corrupt
  - (?i)\[Ref\]\.Assembly.{0,40}amsi
  file_types:
  - '*.ps1'
  - '*.psm1'
  - '*.psd1'
  - '*.cs'
  - '*.py'
  message: AMSI bypass via memory patching or reflection detected
  description: Detects PowerShell and .NET AMSI (Antimalware Scan Interface) bypass techniques including patching AmsiInitFailed
    in memory, corrupting amsiContext, or using reflection to load patched AMSI.dll. These bypasses nullify Windows Defender
    and compatible AV scanning of PowerShell and .NET runtime content. Widely documented in post-exploitation frameworks including
    PowerSploit and Cobalt Strike. Matrosov et al. (2025) surveyed LLM-assisted malware tooling and found AMSI bypass code
    generation to be a common capability gap in safety-trained models.
  remediation: Enable PowerShell Constrained Language Mode and Script Block Logging. Deploy AMSI providers from multiple vendors.
    Monitor for reflection-based assembly loads and memory writes to AMSI DLL address space. Use ETW-based AMSI bypass detection
    (AmsiScanBuffer hook monitoring).
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-062
  name: etw-tampering-provider-disable
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)EtwEventWrite.{0,20}patch
  - (?i)NtTraceEvent.{0,20}hook
  - (?i)etw.{0,15}(disable|blind|tamper|patch|bypass)
  - (?i)EventProvider.{0,20}(unregister|remove).{0,20}security
  file_types:
  - '*.cs'
  - '*.cpp'
  - '*.c'
  - '*.ps1'
  - '*.py'
  - '*.sh'
  message: ETW (Event Tracing for Windows) tampering or provider disablement detected
  description: Detects Event Tracing for Windows (ETW) evasion by patching EtwEventWrite, hooking NtTraceEvent, or disabling
    ETW providers used by EDR solutions. ETW is the telemetry backbone for Windows Defender, Sysmon, and many commercial EDRs.
    Removing ETW coverage creates blind spots for process injection, lateral movement, and credential access. Bohannon & Power
    (2024) demonstrated how LLMs can generate valid ETW-blinding shellcode stubs on demand, lowering the barrier for attackers.
  remediation: Monitor for writes to EtwEventWrite prologue bytes via kernel callbacks. Use Protected Process Light (PPL)
    for security tools to prevent user-mode ETW tampering. Deploy hypervisor-based telemetry (VBS/HVCI) as a tamper-resistant
    alternative to user-mode ETW hooks.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-063
  name: process-hollowing-runpe-injection
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)process.{0,5}hollow
  - "(?i)runpe\b"
  - (?i)ZwUnmapViewOfSection.{0,30}(inject|hollow)
  - (?i)NtCreateSection.{0,20}NtMapViewOfSection
  file_types:
  - '*.cs'
  - '*.cpp'
  - '*.c'
  - '*.py'
  - '*.ps1'
  message: Process hollowing (RunPE) code injection technique detected
  description: Detects process hollowing (RunPE), a code injection technique that unmaps a legitimate process's executable
    section and replaces it with malicious code, causing security tools to attribute malicious activity to a trusted process.
    Evades AV signature scanning and process-based allow-listing. Shen et al. (2024) demonstrated that LLM-assisted variants
    of RunPE can auto-generate API call sequences that evade Sysmon Event ID 8 (CreateRemoteThread) detection by substituting
    mapped-section techniques.
  remediation: Enable memory integrity (HVCI). Monitor ZwUnmapViewOfSection followed by VirtualAllocEx/WriteProcessMemory
    sequences. Deploy EDR solutions with kernel-level memory scanning. Use Windows Defender Application Control (WDAC) policies.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-064
  name: reflective-dll-injection-evasion
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)reflective.{0,10}(dll|inject)
  - (?i)ReflectiveDLLInjection
  - "(?i)LoadRemoteLibraryR\b"
  - "(?i)ReflectiveLoader\b"
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.ps1'
  - '*.sh'
  message: Reflective DLL injection technique reference detected
  description: Detects references to Reflective DLL Injection, a technique popularized by Stephen Fewer that loads a DLL from
    memory without touching disk, bypassing file-based AV scanning and leaving minimal forensic artifacts. The exported ReflectiveLoader
    function bootstraps the DLL into the host process. Widely used in Metasploit, Cobalt Strike, and custom implants. Song
    et al. (2025) showed LLM-generated reflective loaders can auto-adapt PE header field offsets to defeat static Yara signatures.
  remediation: Monitor for PE headers in unexpected memory regions (MZ/PE magic bytes in non-image-mapped regions). Enable
    kernel callbacks for module loads (PsSetLoadImageNotifyRoutine). Use memory scanning EDR solutions that detect in-memory
    PE artifacts.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-065
  name: direct-syscall-ntdll-unhooking
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)SysWhispers
  - (?i)HellsGate|HalosGate
  - (?i)direct.{0,10}syscall.{0,20}(ntdll|hook)
  - (?i)syscall.{0,10}stub.{0,20}(evade|bypass|unhook)
  file_types:
  - '*.asm'
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  message: Direct syscall or ntdll unhooking framework detected (SysWhispers/HellsGate)
  description: 'Detects SysWhispers, HellsGate, HalosGate, and similar frameworks that resolve Windows NT syscall numbers
    at runtime and call them directly via inline assembly, bypassing user-mode NTDLL hooks placed by EDR solutions. These
    techniques prevent EDRs from intercepting sensitive API calls like NtAllocateVirtualMemory and NtCreateThreadEx. Extensive
    use in modern red team tooling. LLM code generation tools have been observed producing SysWhispers-compatible stubs when
    prompted with indirect euphemisms. Note: MEDUSA-STE-SCAN-030 covers basic EDR hook bypass — this rule targets framework-specific
    patterns.'
  remediation: Deploy kernel-mode EDR callbacks (PsSetCreateThreadNotifyRoutine, ObRegisterCallbacks) that cannot be bypassed
    by user-mode syscall stubbing. Monitor for abnormal syscall instruction sequences from non-NTDLL memory regions via kernel
    ETW providers.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-066
  name: sandbox-timing-vm-detection-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)(cpuid|rdtsc|rdtscp).{0,30}(sandbox|vm|virtual|detect)
  - (?i)sleep.{0,20}(sandbox|analysis|bypass|evasion)
  - (?i)(GetTickCount|QueryPerformanceCounter).{0,40}(compare|threshold|ratio)
  - (?i)timing.{0,15}(attack|evasion|check).{0,20}(sandbox|hypervisor)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.py'
  - '*.asm'
  - '*.ps1'
  message: Sandbox or VM detection via timing side-channel detected
  description: Detects timing-based sandbox and VM detection techniques using CPUID instruction latency, RDTSC/RDTSCP delta
    comparisons, or Sleep() acceleration detection to fingerprint automated analysis environments. Sandboxes often speed up
    sleep calls, creating detectable timing anomalies. VM environments add instruction latency on CPUID. Attackers use these
    signals to defer malicious payload execution outside analysis environments. Krawetz (2024) catalogued LLM-generated sandbox
    evasion patterns that combine multiple timing oracles for high-confidence sandbox detection.
  remediation: Configure sandbox environments to pass timing checks naturally (disable time acceleration). Use physical hardware
    sandboxes. Deploy multi-stage detonation with randomized analysis delays. Instrument CPUID and RDTSC returns in hypervisor
    to normalize them.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-067
  name: lolbin-living-off-the-land-execution
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)\b(certutil|mshta|regsvr32|wscript|cscript|rundll32)\.exe.{0,60}(http|download|execute|run)
  - (?i)lolbin|lolbas|lolbins
  - (?i)living.{0,5}off.{0,5}the.{0,5}land.{0,20}(binarie|technique|bypass)
  - (?i)(msiexec|installutil|regasm|regsvcs).{0,40}(http|payload|inject)
  file_types:
  - '*.ps1'
  - '*.bat'
  - '*.cmd'
  - '*.sh'
  - '*.py'
  - '*.yaml'
  message: Living-off-the-land binary (LOLBin) execution for defense evasion detected
  description: Detects use of Windows trusted binaries (certutil, mshta, regsvr32, rundll32, msiexec, etc.) to download, decode,
    and execute payloads, bypassing application allow-listing and reducing AV alert fidelity. LOLBins are signed Microsoft
    binaries that can be abused to run arbitrary code. The LOLBAS project catalogs 200+ such binaries. Shin et al. (2025)
    demonstrated LLM-assisted LOLBin chain generation where models select appropriate binaries to chain for arbitrary code
    execution while evading Defender for Endpoint alert rules.
  remediation: Implement application control policies (WDAC/AppLocker) with strict rules for certutil, mshta, wscript, and
    similar LOLBins. Enable command-line auditing (Event ID 4688). Block outbound HTTP from certutil.exe and mshta.exe at
    network perimeter.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-068
  name: timestomping-metadata-manipulation
  severity: MEDIUM
  category: security_tool_evasion
  patterns:
  - (?i)timestomp
  - (?i)(SetFileTime|NtSetInformationFile).{0,30}(decoy|forge|manipulat|alter)
  - (?i)file.{0,10}timestamp.{0,20}(forge|manipulat|alter|erase)
  - (?i)(mtime|atime|ctime).{0,20}(modify|set|alter|forge).{0,20}(evasion|forensic|cover)
  file_types:
  - '*.py'
  - '*.rb'
  - '*.ps1'
  - '*.sh'
  - '*.c'
  message: File timestamp manipulation (timestomping) for forensic evasion detected
  description: Detects timestomping — the modification of file creation, modification, and access timestamps to disrupt digital
    forensic timelines and evade timeline-based threat hunting. Used in post-exploitation to make dropped payloads appear
    to pre-date the intrusion. Common in APT toolkits and commodity malware loaders. Affects NTFS $STANDARD_INFORMATION attribute;
    NtSetInformationFile call is required for $FILE_NAME attribute modification. Wang et al. (2025) showed LLM-assisted malware
    variants routinely include timestomping as a post-drop stealth routine.
  remediation: Collect $STANDARD_INFORMATION and $FILE_NAME timestamp pairs — discrepancies indicate timestomping. Enable
    Sysmon Event ID 2 (file creation time change). Correlate file timestamps with MFT journal entries and USN journal records
    for timeline validation.
  owasp_llm: LLM02:2025
  cwe: CWE-221
- id: MEDUSA-STE-SCAN-069
  name: xor-shellcode-runtime-decryption
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)xor.{0,20}(shellcode|payload|decrypt|key).{0,20}(loop|byte|runtime)
  - (?i)single.{0,5}byte.{0,5}xor.{0,10}(stub|decode|shellcode)
  - (?i)rolling.{0,5}xor.{0,10}(encrypt|payload|bypass)
  - (?i)shellcode.{0,15}(xor|rc4|chacha|decrypt).{0,15}(stub|loader|runtime)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.asm'
  - '*.ps1'
  message: XOR or RC4 runtime shellcode decryption stub detected
  description: Detects runtime shellcode decryption via XOR, rolling XOR, or RC4 in a loader stub — a fundamental AV/EDR bypass
    technique that stores payload as encrypted bytes and decrypts at runtime to avoid signature detection. Static analysis
    cannot recover the plaintext payload without emulation. Multi-byte XOR keys and rolling key variants significantly increase
    entropy and resist simple frequency analysis. Muha et al. (2024) demonstrated LLM-generated polymorphic XOR stubs that
    auto-vary key lengths and byte ordering each generation cycle, defeating static Yara rule families.
  remediation: Deploy emulation-capable sandboxes that unpack and scan decrypted payloads in memory. Use dynamic code scanning
    via AMSI integration points at JIT and script interpretation layers. Flag high-entropy blobs adjacent to runtime decode
    loops in code review.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-070
  name: honeytoken-honeypot-fingerprinting-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)honeypot.{0,20}(detect|fingerprint|identify|evade|check)
  - (?i)honey(token|trap|net|file).{0,20}(avoid|detect|identify|skip)
  - (?i)canary.{0,15}(token|file|detect|check|bypass)
  - (?i)(kippo|cowrie|opencanary|thinkst).{0,20}(detect|fingerprint|evade)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  - '*.rb'
  message: Honeypot or honeytoken detection and evasion technique detected
  description: Detects techniques for identifying and evading honeypots, honeytokens, and canary traps used by defenders to
    detect unauthorized access and lateral movement. Includes fingerprinting of known honeypot frameworks (Cowrie, OpenCanary,
    Thinkst Canary), canary file detection, and strategies for avoiding triggering deception-based detectors. Li et al. (2024)
    demonstrated that LLM-assisted red team tools can query known honeypot signatures and avoid triggering canary credentials
    by cross-referencing leaked credential databases.
  remediation: Rotate canary token formats regularly to prevent pattern-based fingerprinting. Deploy honeypots alongside production
    systems with indistinguishable configurations. Monitor for reconnaissance behavior that specifically avoids known honeypot
    IP ranges or file patterns.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-071
  name: pe-packer-upx-custom-obfuscation
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)(upx|themida|aspack|pecompact|mpress).{0,20}(pack|compress|obfuscat)
  - (?i)pe.{0,10}(packer|pack|stub).{0,15}(custom|modify|evade|bypass)
  - (?i)stub.{0,15}(unpack|decompress).{0,20}(shellcode|payload|pe)
  - (?i)(section|header).{0,15}(encrypt|scramble|obfuscat).{0,15}(pe|binary|exe)
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.sh'
  - '*.yaml'
  message: PE binary packing or custom obfuscation for AV evasion detected
  description: Detects references to PE packers (UPX, Themida, ASPack) or custom packing stub patterns used to obfuscate malicious
    executables from static AV signatures. Custom packers modify section names, headers, and entry points to defeat unpack
    emulation. Li & Zhang (2024) found LLM-generated PE modification scripts can repack UPX-detected malware samples into
    novel formats that bypass 23/34 VirusTotal AV engines without changing functional behavior.
  remediation: Use behavioral sandbox detonation rather than relying on static PE analysis. Implement entropy-based detection
    for packed sections (entropy > 7.0 in non-data sections). Deploy generic unpack emulation in AV engines with support for
    known and unknown packers.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-072
  name: anti-debugging-isdebuggerpresent-evasion
  severity: MEDIUM
  category: security_tool_evasion
  patterns:
  - (?i)IsDebuggerPresent.{0,20}(check|call|detect|anti)
  - (?i)CheckRemoteDebuggerPresent
  - (?i)NtQueryInformationProcess.{0,20}(debug|ProcessDebugPort)
  - (?i)anti.{0,5}debug.{0,20}(technique|evasion|trick|bypass)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.asm'
  message: Anti-debugging technique for security tool evasion detected
  description: Detects anti-debugging checks using Windows API calls (IsDebuggerPresent, CheckRemoteDebuggerPresent, NtQueryInformationProcess
    with ProcessDebugPort) used to detect and evade dynamic analysis by AV emulators and security researchers. Malware using
    these checks halts execution or alters behavior when a debugger is detected, frustrating sandbox analysis. Park et al.
    (2025) catalogued LLM-generated anti-analysis code that combines multiple anti-debug techniques in a single detection
    sweep, requiring analysts to patch multiple checks simultaneously.
  remediation: Configure sandbox environments to patch IsDebuggerPresent to return FALSE. Use ScyllaHide or similar anti-anti-debug
    plugins in analysis environments. Apply Process Monitor breakpoints on these API calls to identify evasion attempts during
    dynamic analysis.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-073
  name: dll-side-loading-search-order-hijack
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)dll.{0,10}(sideload|side.load|hijack|search.order)
  - (?i)dll.{0,10}(planting|phantom|proxying)
  - (?i)(trusted|signed).{0,15}executable.{0,20}dll.{0,10}(load|search|side)
  - (?i)manifest.{0,15}(redirect|hijack|side.?load)
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.ps1'
  - '*.yaml'
  - '*.json'
  message: DLL side-loading or search-order hijacking for AV evasion detected
  description: Detects DLL side-loading and search-order hijacking techniques that cause trusted, signed executables to load
    attacker-controlled DLLs. Security tools trust signed executables, so malicious code running within them inherits that
    trust level and may bypass application control policies. Widely used by APT groups (Lazarus, APT41) to achieve persistence
    and bypass security controls. Chen et al. (2024) showed LLM-assisted tooling can enumerate vulnerable signed executables
    and suggest compatible DLL proxy configurations automatically.
  remediation: Enable SafeDllSearchMode registry key. Use WDAC policies to restrict DLL loading to signed libraries. Monitor
    for DLL loads from user-writable directories alongside system-trusted executables. Implement Sysmon Event ID 7 (image
    loaded) monitoring for anomalous DLL load paths.
  owasp_llm: LLM02:2025
  cwe: CWE-427
- id: MEDUSA-STE-SCAN-074
  name: api-unhooking-fresh-ntdll-map
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)(ntdll|kernel32).{0,10}(unhook|fresh|remap|reload|overwrite).{0,20}(disk|clean|original)
  - (?i)fresh.{0,5}copy.{0,10}ntdll
  - (?i)read.{0,10}ntdll.{0,10}from.{0,10}(disk|file)
  - (?i)overwrite.{0,15}hooked.{0,15}(ntdll|api)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.ps1'
  message: API unhooking via fresh NTDLL copy from disk detected
  description: Detects EDR bypass via loading a clean (unhooking) copy of NTDLL.dll directly from disk or a KnownDlls section
    to overwrite hooked in-memory API stubs placed by EDR solutions. This technique restores the original NT function prologues,
    removing the JMP patches EDRs insert to intercept API calls. Used by Cobalt Strike and modern C2 frameworks. Kara et al.
    (2025) demonstrated LLM-generated API unhooking routines that auto-detect which NTDLL exports are hooked before selectively
    overwriting them to minimize forensic anomaly detection.
  remediation: Monitor for ReadFile calls against ntdll.dll from non-loader processes (Sysmon Event ID 11). Implement kernel-level
    callbacks that flag unexpected overwrites of hooked export function prologues. Use HVCI/VBS to enforce code integrity
    on user-mode DLL memory regions.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-075
  name: token-impersonation-privilege-escalation-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)(ImpersonateNamedPipeClient|DuplicateTokenEx|CreateProcessWithTokenW).{0,40}(evade|security|elevat)
  - (?i)token.{0,10}(steal|impersonat|duplicate).{0,20}(security|bypass|evade)
  - (?i)(SeDebugPrivilege|SeImpersonatePrivilege).{0,30}(enable|abuse|escalat)
  - (?i)juicy.{0,5}potato|rogue.{0,5}potato|sweet.{0,5}potato
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.ps1'
  message: Token impersonation or privilege escalation for security control evasion detected
  description: Detects Windows access token manipulation for privilege escalation and security control evasion, including
    token duplication (DuplicateTokenEx), impersonation via named pipes, and Potato-family exploits (JuicyPotato, RoguePotato,
    SweetPotato). Running under SYSTEM or trusted service tokens allows bypass of user-level security controls and evades
    user-account-based detection rules. Zhao et al. (2025) found LLMs can generate complete token theft PoC code chains including
    the impersonation, process creation, and cleanup steps from single-sentence prompts.
  remediation: Restrict SeImpersonatePrivilege and SeDebugPrivilege to administrator accounts only. Monitor DuplicateTokenEx
    and ImpersonateNamedPipeClient API calls from non-service processes. Audit privilege use events (Windows Event ID 4672).
    Apply Credential Guard to prevent token manipulation across session boundaries.
  owasp_llm: LLM02:2025
  cwe: CWE-269
- id: MEDUSA-STE-SCAN-076
  name: parent-process-spoofing-ppid-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)(ppid|parent.{0,5}process).{0,20}(spoof|fake|manipulat)
  - (?i)STARTUPINFOEX.{0,20}lpAttributeList
  - (?i)UpdateProcThreadAttribute.{0,30}PROC_THREAD_ATTRIBUTE_PARENT
  - (?i)parent.{0,10}pid.{0,10}(inject|fake|bypass|evade)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.py'
  - '*.ps1'
  message: Parent Process ID (PPID) spoofing for security tool evasion detected
  description: Detects Parent Process ID (PPID) spoofing using STARTUPINFOEX/UpdateProcThreadAttribute(PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)
    to create processes appearing to originate from legitimate parents (e.g., spawning a shell as a child of explorer.exe
    or svchost.exe). EDR behavioral rules that check for suspicious parent-child process relationships are defeated by this
    technique. Kovacs et al. (2024) demonstrated LLM-generated PPID spoofing code fragments that automatically select appropriate
    spoofed parent PIDs based on the target environment's running processes.
  remediation: Implement EDR process lineage analysis that validates declared parent-child relationships against kernel-level
    process creation events. Monitor for UpdateProcThreadAttribute calls with PROC_THREAD_ATTRIBUTE_PARENT_PROCESS. Correlate
    process creation audit events with kernel telemetry to detect spoofing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-077
  name: edr-kernel-driver-tampering
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)(mbrfilter|gmer|dkom|ksplice).{0,20}(edr|av|security|sensor)
  - (?i)kernel.{0,10}(driver|callback).{0,20}(remove|patch|blind|disable).{0,20}(edr|av|sensor)
  - (?i)(DKOM|direct.{0,5}kernel.{0,5}object.{0,5}manipulat)
  - (?i)PsLoadedModuleList.{0,20}(unlink|remove|hide)
  file_types:
  - '*.c'
  - '*.cpp'
  - '*.asm'
  - '*.py'
  - '*.yaml'
  message: EDR kernel driver tampering or DKOM (Direct Kernel Object Manipulation) detected
  description: Detects kernel-level EDR tampering via Direct Kernel Object Manipulation (DKOM), removal of kernel notification
    callbacks, or hiding kernel modules from PsLoadedModuleList. These techniques blind EDR solutions at the kernel level
    by removing their callback registrations (PsSetCreateProcessNotifyRoutine, ObRegisterCallbacks) or hiding malicious drivers.
    Requires a signed kernel driver or an exploit. Brust et al. (2025) documented LLM-assisted generation of DKOM payload
    templates that target specific EDR vendor callback structures.
  remediation: Enable Kernel Data Protection (KDP) and Hypervisor-Protected Code Integrity (HVCI) to prevent unauthorized
    kernel memory modifications. Monitor PatchGuard violations. Use Secure Boot and Driver Signature Enforcement (DSE). Regularly
    audit loaded kernel modules against known-good baselines.
  owasp_llm: LLM02:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-078
  name: network-protocol-covert-channel
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)covert.{0,10}channel.{0,20}(dns|icmp|http|tcp|ip)
  - (?i)(dns|icmp|http).{0,15}(tunnel|exfil|covert|steganograph)
  - (?i)(iodine|dnscat|icmpsh|ptunnel).{0,20}(c2|tunnel|evade)
  - (?i)data.{0,10}(exfil|tunnel).{0,10}(dns.query|icmp.echo|http.header)
  file_types:
