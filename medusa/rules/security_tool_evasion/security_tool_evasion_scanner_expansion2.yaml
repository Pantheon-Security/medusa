  message: ML security model deployed without adversarial robustness evaluation — potential blind spot
  description: Detects security ML models and classifiers deployed without documented adversarial robustness evaluation, creating
    systematic blind spots exploitable by informed attackers. A model performing well on holdout test sets may have near-zero
    robustness against simple adversarial perturbations if no adversarial evaluation was conducted. Tramer et al. (2025) found
    that 67% of production ML security tools surveyed had no adversarial evaluation in their published specifications, and
    that targeted evasion of these tools required fewer than 100 queries on average due to transferability.
  remediation: Require adversarial robustness evaluation as part of ML security tool certification. Run AutoAttack, C&W, or
    PGD evaluations before deploying classifiers in security-critical paths. Publish adversarial accuracy alongside clean
    accuracy in security tool documentation. Implement continuous red-teaming with adaptive adversaries post-deployment.
