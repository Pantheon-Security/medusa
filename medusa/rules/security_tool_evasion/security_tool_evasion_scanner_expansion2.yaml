- id: MEDUSA-STE-SCAN-097
  name: memory-only-dropper-no-disk-artifact
  severity: CRITICAL
  category: security_tool_evasion
  patterns:
  - (?i)(fileless|memory.{0,5}only|no.{0,5}disk).{0,20}(dropper|malware|payload|execute)
  - (?i)(VirtualAlloc|VirtualAllocEx|NtAllocateVirtualMemory).{0,40}(PAGE_EXECUTE|MEM_COMMIT).{0,30}(write|copy|inject)
  - (?i)(powershell|wscript|mshta).{0,20}(download|fetch|iex).{0,20}(memory|ram|volatile)
