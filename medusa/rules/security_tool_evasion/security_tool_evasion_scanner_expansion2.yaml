    AWS 169.254.169.254, GCP metadata.google.internal, and Azure 169.254.169.254 endpoints. IMDSv1 (no session token required)
    is particularly vulnerable to SSRF relay attacks. Martinez et al. (2024) demonstrated LLM-assisted IMDS exploitation chains
    that automatically rotate through stolen credential sets to evade CloudTrail anomaly detection.
  remediation: Enforce IMDSv2 (session-oriented) on all EC2 instances. Block 169.254.169.254 at application-layer WAF for
    web-facing services. Enable GuardDuty and CloudTrail anomaly detection. Limit IAM role permissions following least privilege.
    Monitor for credential use from unexpected source IPs.
