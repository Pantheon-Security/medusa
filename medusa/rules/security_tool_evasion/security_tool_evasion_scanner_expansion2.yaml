  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.sh'
  message: Fileless/memory-only payload execution with no disk artifact detected
  description: Detects fileless malware execution patterns where payloads are downloaded and executed entirely in memory (VirtualAlloc
    → WriteProcessMemory → CreateThread) without writing any executable to disk, defeating file-based AV scanning, forensic
    file system analysis, and persistence detection. Often delivered via PowerShell download-and-execute chains, macro-triggered
    shellcode loaders, or process injection. Lee et al. (2025) found that 41% of detected security incidents now involve fileless
    techniques, with LLM-generated loaders showing increasing variety in memory allocation patterns to avoid signature detection.
  remediation: Deploy memory-scanning EDR with runtime code injection detection. Enable Script Block Logging and AMSI to catch
    fileless PowerShell stages. Implement process memory integrity monitoring. Use application allowlisting to prevent unexpected
    process spawning from scripting engines.
