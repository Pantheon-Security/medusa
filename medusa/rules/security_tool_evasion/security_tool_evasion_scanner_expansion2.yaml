  message: Heap spray, JIT spray, or ROP chain control flow integrity bypass detected
  description: 'Detects exploit techniques for bypassing modern memory protection mitigations (ASLR, DEP, CFG, CET, Shadow
    Stack): heap/JIT spraying to derandomize memory, Return-Oriented Programming (ROP) chains to bypass DEP/NX without injecting
    new code, and Control Flow Guard/Integrity bypass techniques. These evade exploit detection systems that monitor for memory
    permission violations or control-flow anomalies. Kim et al. (2025) showed LLM-assisted ROP gadget chain construction can
    generate CFI-bypassing chains 10x faster than manual techniques, with automatic adaptation to target binary gadget sets.'
