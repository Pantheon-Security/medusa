  - '*.md'
  message: Automated classifier evasion via stochastic mutation detected
  description: 'Detects references to automated malware classifier evasion via genetic
    programming or stochastic mutation methods. Xu et al. (2016, NDSS) demonstrated
    100% evasion of both PDFrate and Hidost PDF malware classifiers across 500 seed
    samples using structure-preserving stochastic mutations. The EvadeML framework
    (EvadeML.org) automates this process requiring only black-box score feedback.
    This represents a general method to defeat feature-based ML security classifiers
    in security applications.

    '
  remediation: 'Use robustness evaluation frameworks that simulate adaptive adversaries
    before deploying ML-based security classifiers. Avoid relying solely on superficial
    structural features. Implement classifier ensembles with diverse feature sets.
    Apply adversarial training using evasive variants generated by tools like EvadeML.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-693
