  file_types:
  - '*.py'
  - '*.js'
  - '*.sh'
  - '*.ipynb'
  message: LLM-based metamorphic malware code mutation engine pattern detected
  description: 'Detects patterns associated with LLM-driven metamorphic malware generation,
    as described by Madani (2023). Unlike traditional rule-based mutation engines
    (variable renaming, instruction reordering), LLMs understand code semantics and
    generate structurally novel rewrites — dead code insertion, loop restructuring,
    alternative algorithm implementations — that preserve malicious functionality
    while evading signature-based detection. ChatGPT 4.0, Google Bard, and open-source
    LLMs demonstrated this capability on Python codebases.

    '
  remediation: 'Replace signature-based AV with semantic/behavioural analysis that
    focuses on runtime intent rather than code structure. Implement code provenance
    tracking. Deploy ML models trained on behavioural features rather than syntactic
    signatures. Use sandbox detonation to confirm runtime behaviour regardless of
    code structure.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
