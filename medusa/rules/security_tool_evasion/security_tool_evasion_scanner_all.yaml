  description: 'Detects patterns associated with dead code injection attacks on LLM-based
    security tools. Chen et al. (2025) demonstrated that injecting dead code (unreachable
    statements, opaque predicates, unused variables) into source code reduces LLM-based
    vulnerability detection accuracy by up to 12.7% (Khare et al. 2023). Sophisticated
    unreachable code patterns bypass standard compiler DCE (Dead Code Elimination)
    and IDE static analysers. Over 45.3% of Java code in CodeNet already contains
    unlabelled dead code.

    '
  remediation: 'Deploy DCE-LLM or equivalent dead code elimination pre-processing
    before LLM-based security analysis (>94% F1 detection). Use CodeBERT attribution-based
    line selectors to identify suspect dead code before LLM analysis. Include dead
    code detection in CI/CD pipelines. Verify code reachability through static control
    flow analysis.

    '
