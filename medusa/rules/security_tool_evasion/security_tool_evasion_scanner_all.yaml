    model transferability. Per NIST AI 100-2e2023 (Vassilev et al. 2024), adversarial
    examples crafted against surrogate models transfer to target models at rates of
    20-90% depending on model similarity, enabling evasion of API-exposed security
    tools (LlamaGuard, Perspective API, Azure Content Safety, OpenAI Moderation) without
    direct model access. HopSkipJump and boundary attack methods achieve near white-box
    performance given sufficient queries.

    '
  remediation: 'Implement query rate limiting and anomaly detection on model APIs
    to identify systematic probing. Use ensemble models with architectural diversity
    to reduce transfer attack effectiveness. Deploy query count monitoring and flag
    suspicious API query patterns. Randomise model outputs with calibrated noise to
    degrade gradient estimation.

    '
