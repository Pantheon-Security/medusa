    agents to bypass safety controls through automated prompt decomposition. Pa Pa
    et al. (2023, CSET 2023) demonstrated 9/9 malware and attack tools successfully
    generated via Auto-GPT against OpenAI safety controls (100% bypass rate). Auto-GPT
    bypasses ChatGPT/text-davinci-003 moderation by automatically decomposing goals
    into sub-prompts that individually appear benign, producing functional malware
    up to ~400 lines within 90 minutes.

    '
  remediation: 'Implement multi-turn conversation context analysis that tracks intent
    accumulation across prompt sequences. Enforce goal-level content analysis on agentic
    systems, not just individual prompts. Apply capability-based access controls restricting
    autonomous tool invocation. Monitor for automated sequential prompting patterns
    with high code generation rate.

    '
