- id: MEDUSA-STE-SCAN-001
  name: llvm-compiler-obfuscation-malware-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)\bcontrol.{0,5}flow.{0,10}flatten
  - (?i)\bllvm.{0,10}obfuscat
  - (?i)\bbogus.{0,10}control.{0,5}flow
  - (?i)\binstruction.{0,5}substitut
  file_types:
  - '*.py'
  - '*.js'
  - '*.c'
  - '*.cpp'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: LLVM compiler-level obfuscation technique detected — known to defeat LLM-based
    malware detectors
  description: 'Detects patterns associated with LLVM-based compiler obfuscation techniques
    used to evade LLM-based malware detection systems. Böke & Torka (2025) demonstrated
    that LLVM control-flow flattening, bogus control flow, instruction substitution,
    and basic-block splitting reduce ChatGPT-4o detection accuracy from 0.800 to 0.525
    (specificity drops from 0.750 to 0.250). Claude Sonnet 4 specificity drops from
    0.600 to 0.300. These obfuscation passes are present in real-world malware and
    can be applied via Obfuscator-LLVM tooling.

    '
  remediation: 'Deploy compiler-aware ML detectors trained on LLVM IR representations.
    Implement adversarial training on obfuscated code samples. Avoid LLM-only detection
    pipelines for binaries that may have been compiled with obfuscation passes. Use
    symbolic execution or taint analysis to supplement LLM-based analysis.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-002
  name: genetic-programming-classifier-evasion
  severity: HIGH
  category: security_tool_evasion
  patterns:
  - (?i)\bevade.{0,10}classifier
  - (?i)\bstochastic.{0,10}mutation.{0,15}malware
