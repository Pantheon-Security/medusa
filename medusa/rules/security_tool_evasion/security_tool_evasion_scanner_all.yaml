  message: LLM dual-agent adversarial malware evasion framework (LAMLAD) pattern detected
  description: 'Detects patterns associated with LAMLAD (Lan & Nait-Abdesselam, 2025),
    a dual-agent LLM framework achieving 97% Attack Success Rate against ML-based
    Android malware detectors in only 3 perturbation attempts per sample. The framework
    uses an LLM manipulator to generate functionality-preserving feature perturbations
    on Drebin APK feature representations, guided by an LLM analyser. RAG integration
    enhances targeting efficiency. Adversarial training reduces ASR by 30%+ but leaves
    a residual 67% ASR.

    '
  remediation: 'Implement adversarial training with LAMLAD-generated samples (30%+
    ASR reduction). Add multi-feature verification layers that cross-check Drebin-style
    features with dynamic analysis results. Deploy ensemble classifiers with diverse
    feature types (static, dynamic, hybrid). Monitor for anomalous feature combinations
    that combine benign-appearing permissions with high-risk API calls.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-STE-SCAN-004
