  description: 'Detects MIA against DP-protected embedding models. Hu et al. (ACM
    ComSurveys 2022) and Rigaki & Garcia (ACM ComSurveys 2023): embedding model MIA
    is a distinct attack category. Naseri et al. (NDSS 2022): LFW (Labeled Faces in
