rules:
- id: MEDUSA-DP-SCAN-001
  name: dp-audit-canary-insertion
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)canary(?:_sample|_point|_data|_insert|_record)?\s*(?:=|\(|\[)
  - (?i)(?:insert|add|inject)_canary|canary_insertion|poison_canary
  - (?i)challenge_point|challenge_base|challenge_dataset
  - (?i)membership_challenge|audit_canary|privacy_canary
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: DP audit canary insertion pattern detected
  description: Detects canary/challenge-point insertion patterns used in DP empirical
    auditing (Jagielski 2020, Nasr 2021/2023, Steinke 2024, Annamalai 2024). An auditor
    inserts a 'canary' sample with known membership status, then uses membership inference
    to estimate empirical ε_emp. Worst-case canaries (Nasr 2021) are gradient-crafted
    to maximize distinguishability. Gradient-crafting adversaries (Cebere ICLR 2025)
    insert canaries at every step to achieve near-tight auditing bounds.
  remediation: Monitor training pipelines for unexpected data insertions. Validate
    all training data provenance. Flag datasets containing artificially constructed
    or adversarially crafted samples.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-DP-SCAN-002
  name: dp-audit-gradient-crafting-adversarial
  severity: CRITICAL
  category: dp_attacks
  patterns:
  - (?i)gradient_craft(?:ing|ed)?|craft_gradient|adversarial_gradient_init
  - (?i)worst_case_init(?:ialization)?|worst_case_canary|worst_case_sample
  - (?i)hidden_state_audit|every_step_insertion|checkpoint_audit
  - (?i)lira_audit|parametric_lira|audit_lira
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Adversarial gradient-crafting DP auditor detected (Nasr/Cebere threat model)
  description: Detects gradient-crafting adversaries who craft model initialization
    or per-step canary gradients to maximize distinguishability between membership
    hypotheses. Nasr et al. 2021/2023 (white-box) and Cebere et al. ICLR 2025 (hidden
    state threat model) demonstrate that crafted canaries inserted at every training
    step nearly close the gap between theoretical ε and empirical ε_emp, revealing
    DP implementation bugs or underclaiming.
  remediation: Ensure DP-SGD implementations correctly clip per-sample gradients before
    aggregation. Use validated privacy accounting (TensorFlow Privacy, Opacus). Audit
    training code for non-standard model initialization patterns.
  owasp_llm: LLM04:2025
  cwe: CWE-682
- id: MEDUSA-DP-SCAN-003
  name: dp-empirical-epsilon-estimation
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)epsilon_emp(?:irical)?|eps_emp|epsilon_lower_bound|eps_lower
  - (?i)clopper[_-]pearson|clopper_pearson_lower|clopper_pearson_upper
  - (?i)empirical_dp|dp_audit|dp_auditing|privacy_audit
  - (?i)fpr_fnr_audit|tpr_fpr_dp|distinguishability_test
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.R'
  message: DP empirical epsilon estimation / auditing code detected
  description: Detects code performing empirical DP auditing to estimate ε_emp from
    observed FPR/FNR of membership inference attacks. Standard approach uses Clopper-Pearson
    confidence intervals (Jagielski 2020). ε_emp = ln((p̂₀ − δ) / p̂₁). Used legitimately
    for DP auditing but can reveal DP implementation vulnerabilities and underclaimed
    privacy budgets.
  remediation: Validate claimed ε against empirical ε_emp. Any significant gap between
    theoretical and empirical ε indicates DP implementation bugs (shuffling/Poisson
    mismatch, BatchNorm leakage, improper gradient clipping).
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-004
  name: dpsgd-batchnorm-incompatibility
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)(?:torch\.nn|nn)\s*\.\s*BatchNorm(?:1d|2d|3d)?\s*\(
  - (?i)batch_norm.*dp[-_]sgd|dpsgd.*batch_norm
  - (?i)bn\s*=\s*(?:torch\.nn|nn)\.BatchNorm
  - (?i)use_batchnorm.*(?:differential|private)|private.*batchnorm
  file_types:
  - '*.py'
  - '*.ipynb'
  message: BatchNorm used with DP-SGD — invalidates differential privacy guarantee
  description: BatchNorm (Ioffe & Szegedy 2015) computes batch statistics (mean, variance)
    that couple per-sample gradients, breaking the per-example independence required
    for DP-SGD's privacy guarantee. Using BatchNorm with DP-SGD silently invalidates
    the formal ε bound. Ponomareva et al. JAIR 2023 explicitly identifies this as
    a critical incompatibility. Replace with GroupNorm or LayerNorm.
  remediation: Replace BatchNorm with GroupNorm (Wu & He 2018) or LayerNorm. Verify
    architecture compatibility with Opacus make_private() which raises an error for
    BatchNorm layers.
  owasp_llm: LLM04:2025
  cwe: CWE-682
- id: MEDUSA-DP-SCAN-005
  name: dpsgd-shuffle-vs-poisson-accounting-gap
  severity: CRITICAL
  category: dp_attacks
  patterns:
  - (?i)shuffle(?:d)?_dp|shuffle_sampling|shuffled_sgd
  - (?i)DataLoader.*shuffle.*True.*dp|dp.*DataLoader.*shuffle
  - (?i)poisson_sampling|poisson_subsampling|bernoulli_sampling
  - (?i)shuffle_amplification|sampling_without_replacement.*dp
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Shuffling vs Poisson subsampling DP accounting gap — privacy may be underclaimed
  description: 'Annamalai et al. NDSS 2026 demonstrates that DP-SGD with shuffling
    (DataLoader shuffle=True) uses different sampling than Poisson subsampling assumed
    by standard privacy accounting (Moments Accountant, RDP). This gap leads to real-world
    privacy leakage: ε_emp=12.7 at claimed ε=3 on BERT/MNLI (4x leakage). The Chua
    et al. JPC 2025 Balls-and-Bins sampler bridges this gap.'
  remediation: Use Poisson subsampling (Truncated Poisson Batch Generator, Chua 2025)
    instead of standard DataLoader shuffling. Alternatively use Opacus with UniformWithReplacementSampler.
    Verify claimed ε via empirical auditing.
  owasp_llm: LLM04:2025
  cwe: CWE-682
- id: MEDUSA-DP-SCAN-006
  name: dp-accounting-privacy-loss-distribution
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)privacy_loss_dist(?:ribution)?|pld_accounting|pld_accountant
  - (?i)rdp_accountant|renyi_dp|rdp_to_dp
  - (?i)moments_accountant|tf_privacy.*compute_dp_sgd
  - (?i)gdp_accountant|gaussian_dp|f_dp_accountant
  file_types:
  - '*.py'
  - '*.ipynb'
  message: DP privacy accounting code detected — verify accounting method matches
    training sampler
  description: Detects privacy accounting code (Moments Accountant, RDP, PLD, GDP/f-DP).
    The accounting method must match the actual training procedure's sampling mechanism.
    Mismatches between accounting assumptions (Poisson) and actual sampling (shuffling/uniform-without-replacement)
    cause underclaiming. Chua et al. JPC 2025 proves ε_S(δ) ≥ ε_P(δ) for any δ — shuffling
    is strictly less private than Poisson accounting assumes.
  remediation: Verify accounting method matches actual batch sampler. Use PLD accounting
    (faster, tighter). Validate with empirical auditing (Gonzalez 2025, Steinke 2025).
  owasp_llm: LLM04:2025
  cwe: CWE-682
- id: MEDUSA-DP-SCAN-007
  name: shadow-training-mia
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)shadow_model|shadow_train(?:ing)?|shadow_dataset
  - (?i)ShadowModel\s*\(|train_shadow_models|ShadowModelTrainer
  - (?i)attack_model.*shadow|shadow.*attack_model
  - (?i)shokri.*mia|mia_shokri|shokri_attack
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Shadow training membership inference attack (Shokri 2017 style) detected
  description: 'Detects shadow training MIA (Shokri et al. 2017): trains k shadow
    models on auxiliary data to mimic target model behavior, then trains binary attack
    classifier on shadow model confidence vectors labeled with known membership. Black-box
    attack applicable to MLaaS APIs. Truex et al. 2019 demonstrates effectiveness
    against DP-protected models. CF explanations (Ezzeddine 2026) nearly double shadow
    MIA accuracy at ε=5 (38%→74%).'
  remediation: Deploy DP-SGD (tight ε ≤ 3) to limit shadow model MI. Rate-limit MLaaS
    API to prevent shadow model training volume. Consider output perturbation (MemGuard)
    or confidence score rounding.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-008
  name: lira-likelihood-ratio-mia
  severity: CRITICAL
  category: dp_attacks
  patterns:
  - (?i)\blira\b.*(?:attack|mia|membership)|(?:lira_attack|lira_mia)\s*\(
  - (?i)likelihood_ratio_attack|likelihood_ratio_mia
  - (?i)carlini.*membership|membership.*carlini
  - (?i)online_lira|offline_lira|parametric_lira
  file_types:
  - '*.py'
  - '*.ipynb'
  message: LiRA (Likelihood Ratio Attack) membership inference detected
  description: Detects LiRA (Carlini et al. 2022), the state-of-the-art MIA using
    parametric hypothesis testing. Trains N shadow models to fit Gaussian distributions
    over model outputs for member/non-member hypotheses, then uses likelihood ratio
    test for membership decision. Achieves near-optimal attack power; used as gold
    standard in DP auditing (Yildirim MCMC 2025, Liu quantile regression 2025). Steinke
    et al. 2025 uses LiRA-based auditing for empirical ε estimation on Gemma 2.
  remediation: LiRA with N=256+ shadow models is expensive but powerful. Tight DP
    (ε ≤ 1) limits LiRA TPR@0.1%FPR to near-baseline. Monitor for mass API querying
    consistent with shadow model training.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-009
  name: quantile-regression-mia-auditing
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)quantile_regression.*(?:mia|membership|audit)
  - (?i)(?:mia|membership).*quantile_regression
  - (?i)quantile_mia|qr_mia|quantile_audit
  - (?i)pinball_loss.*membership|membership.*pinball
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Quantile regression-based MIA / DP auditing detected
  description: Detects quantile regression MIA (Liu et al. CMU, arXiv Jun 2025), which
    replaces fixed-threshold MIA with a quantile regression model to more accurately
    estimate confidence score distributions. Improves ε_max estimation by 53% (0.237→0.364
    at n=5000) compared to standard LiRA, enabling tighter one-run DP auditing.
  remediation: Quantile regression MIA requires only a single training run (one-run
    auditing). Validate DP implementations against this stronger audit before deployment.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-010
  name: counterfactual-explanation-amplified-mia
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)(?:cf|counterfactual).*(?:mia|membership_inf)|(?:mia|membership_inf).*(?:cf|counterfactual)
  - (?i)nice_explainer|NICE.*counterfactual|counterfactual_distance.*membership
  - (?i)xai.*(?:mia|membership)|(?:mia|membership).*(?:xai|explainability)
  - (?i)cf_distance.*attack|explanation.*membership_signal
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Counterfactual explanation-amplified MIA (Ezzeddine 2026) detected
  description: 'Detects CF-amplified MIA (Ezzeddine et al. arXiv 2602.03611, 2026):
    uses counterfactual (CF) explanation distance (how far a sample is from the decision
    boundary) as an additional membership signal. CF distance strongly correlates
    with membership — members are typically closer to the decision boundary than non-members.
    At ε=5, this attack nearly doubles MIA accuracy: 38% (DP-only) → 74% (DP + CF
    exposure).'
  remediation: Restrict CF explanation access or add noise to CF distances. Do not
    expose raw CF distances via MLaaS APIs alongside DP-protected models. GDPR explainability
    requirements may conflict with this mitigation.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-011
  name: ldp-fl-gradient-reconstruction-bypass
  severity: CRITICAL
  category: dp_attacks
  patterns:
  - (?i)separation_layer|ldp_bypass|ldp_reconstruction
  - (?i)sam_subject_extract(?:ion)?.*gradient|gradient.*sam_extract
  - (?i)noise_denoising.*ldp|ldp.*noise_filter(?:ing)?
  - (?i)zero_gradient_noise_estimation|sigma_estimation.*ldp
  file_types:
  - '*.py'
  - '*.ipynb'
  message: LDP-FL gradient reconstruction bypass attack detected (You 2025)
  description: 'Detects the You et al. 2025 attack (arXiv:2502.08151) that reconstructs
    training samples from LDP-protected FL gradients using: (1) separation layer with
    Laplace-distributed biases to compress per-sample gradients, (2) SAM (Segment
    Anything Model) background removal to reduce gradient norm, (3) zero-gradient
    noise estimation to estimate σ and filter Gaussian noise, (4) confidence interval
    [-c,c] based noise filtering. Proven effective at ε=10, batch=16 on ImageNet/ResNet101
    — only known attack on LDP-FL.'
  remediation: LDP-FL with ε=10 is insufficient to prevent this attack. Require ε
    < 1 (at significant utility cost) or use secure aggregation with homomorphic encryption.
    Restrict server control over model architecture.
  owasp_llm: LLM04:2025
  cwe: CWE-284
- id: MEDUSA-DP-SCAN-012
  name: gradient-reconstruction-dlg-federated
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)dlg_attack|deep_leakage_gradient|gradient_inversion
  - (?i)iDLG|ig_attack|inverting_gradient
  - (?i)reconstruct_from_gradient|gradient_reconstruction
  - (?i)geiping.*inverting|R_psnr.*gradient|gradient.*ssim
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Gradient-based training data reconstruction attack (DLG/iDLG/Inverting
    Gradients) detected
  description: Detects gradient inversion attacks that reconstruct training samples
    from shared gradients in federated learning. DLG (Zhu 2019), iDLG (Zhao 2020),
    and Inverting Gradients (Geiping 2020) can reconstruct images from a single gradient
    update. TimberStrike (Gennaro PoPETS 2025) extends this to federated GBDT/XGBoost
    with First-Tree Probing + MILP, achieving 73-95% reconstruction on clinical data.
  remediation: Apply DP-SGD with tight ε (≤ 3). Use secure aggregation. Clip gradient
    norms before sharing. Consider gradient compression or perturbation. LDP alone
    (ε=10) is insufficient — see You 2025.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-013
  name: timberstrike-gbdt-reconstruction
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)timberstrike|timber_strike|first_tree_probing
  - (?i)milp_reconstruction.*(?:tree|gbdt|xgboost|federated)
  - (?i)federated_gbdt.*reconstruct|federated_xgboost.*privacy
  - (?i)tree_gradient_leak|gradient_boosting.*reconstruction
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: TimberStrike federated GBDT/XGBoost reconstruction attack detected
  description: 'Detects TimberStrike (Gennaro et al. PoPETS 2025(4), github.com/necst/TimberStrike):
    a dataset reconstruction attack against federated tree-based systems (GBDT, XGBoost).
    Uses First-Tree Probing to extract feature thresholds and sample routing, then
    MILP (Mixed Integer Linear Programming) to reconstruct training samples. Achieves
    73.05%-95.63% reconstruction on Stroke prediction dataset, 100% on COMPAS recidivism
    when DP not applied.'
  remediation: Apply DP-SGD/DP-Tree mechanisms to federated GBDT. Restrict sharing
    of first-tree structure. Rate-limit tree structure queries. Consider PATE-style
    ensemble rather than federated GBDT.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-014
  name: active-mia-dishonest-server-fl
  severity: CRITICAL
  category: dp_attacks
  patterns:
  - (?i)active_mia|active_membership_inference|ami_attack
  - (?i)chosen_neuron|malicious_weights.*fl|dishonest_server
  - (?i)fl.*membership.*certif(?:ied)?|certif(?:ied)?.*mia.*fl
  - (?i)non_linear_boundary.*membership|membership.*non_linear_boundary
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Active MIA from dishonest FL server (Nguyen AISTATS 2023) detected
  description: 'Detects Active Membership Inference (AMI) attack (Nguyen et al. AISTATS
    2023, github.com/trucndt/ami): a dishonest FL server embeds a ''chosen neuron''
    into global model parameters, activated only by the target training sample. Non-linear
    decision boundary in second FC layer enables membership inference via gradient
    observation. Achieves near-100% success rate with certified guarantee (Theorem
    1 in paper). LDP protection reduces success only at high utility cost.'
  remediation: Verify global model architecture before accepting updates — do not
    blindly trust server-provided model parameters. Use model verification protocols.
    Apply tight LDP (ε < 1) at significant utility cost.
  owasp_llm: LLM04:2025
  cwe: CWE-284
- id: MEDUSA-DP-SCAN-015
  name: sequential-dp-auditing-mmd
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)sequential_audit(?:ing|or)?|mmd_evalue|e_value.*dp
  - (?i)GonzalezAudit|gonzalez.*sequential|sequential.*gonzalez
  - (?i)KuttaAudit|kutta.*fdp|fdp.*sequential
  - (?i)apt_algorithm|brownian_motion.*dp|fdp_audit
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Sequential DP auditing code detected (Gonzalez 2025 / Kutta 2026)
  description: Detects sequential DP auditing implementations. Gonzalez et al. NeurIPS
    2025 uses MMD e-values to sequentially test DP violations with continuous monitoring,
    detecting non-private DP-SGD in ~60 observations (vs 50K+ for fixed-n auditors).
    Kutta et al. arXiv 2602.06518 (2026) extends to f-DP with APT (Advanced Privacy
    Testing), using 10-25% fewer samples than Gonzalez at ε≈0.01. Both detect DP implementation
    bugs in Gaussian, Laplace, and DP-SGD mechanisms.
  remediation: Sequential auditing is a legitimate audit tool. Detected in adversarial
    context suggests attempts to identify DP implementation vulnerabilities in deployed
    models.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-DP-SCAN-016
  name: fdp-trade-off-curve-auditing
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)f_dp|fdp_curve|trade_off_curve|tradeoff_function
  - (?i)hockey_stick_divergence|hockey_stick_div
  - (?i)KoskelaAudit|density_estimation.*dp|dp.*density_estimation
  - (?i)gaussian_dp_conversion|gdp_to_eps_delta
  file_types:
  - '*.py'
  - '*.ipynb'
  message: f-DP / hockey-stick divergence auditing code detected
  description: Detects f-DP auditing using trade-off functions or hockey-stick divergence.
    Koskela et al. arXiv 2406.04827 (Nokia Bell Labs) uses kernel density estimation
    to estimate the full f-DP curve from sample outputs, enabling mechanism-agnostic
    auditing. Kulynych et al. NeurIPS 2025 shows f-DP unifies re-identification, attribute
    inference, and reconstruction risks. Violations in intermediate (ε,δ) range may
    be missed by standard (ε,δ)-DP auditing.
  remediation: f-DP auditing is more comprehensive than (ε,δ)-DP auditing. Systems
    claiming (ε,δ)-DP should also be validated against f-DP auditing to detect partial
    trade-off curve violations.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-DP-SCAN-017
  name: dp-vulnerability-disparity-demographic
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)vulnerability_disparity|vd_dp|vd_measure
  - (?i)dp.*(?:fairness|demographic|group).*(?:mia|membership)
  - (?i)(?:mia|membership).*(?:demographic|group|protected).*dp
  - (?i)FairPick|fair_pick.*dp|dp.*fair_pick
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.R'
  message: DP vulnerability disparity analysis / FairPick mitigation detected
  description: 'Detects vulnerability disparity (VD) analysis code (Zhang et al. Stevens
    2020, arXiv:2001.08855): VD = P(MIA=1|Y=1,A=a) − P(MIA=1|Y=1,A=ā). DP reduces
    average MIA success but does NOT eliminate VD — minority/protected demographic
    groups often remain disproportionately vulnerable. COMPAS dataset: MIA recall
    paradoxically increases as DP gets stronger. FairPick reweighting algorithm reduces
    VD while preserving utility.'
  remediation: Audit MIA vulnerability separately per demographic group. Apply FairPick-style
    reweighting or stratified sampling to equalize group distributions before DP training.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-DP-SCAN-018
  name: dp-predictive-multiplicity-audit
  severity: LOW
  category: dp_attacks
  patterns:
  - (?i)predictive_multiplicity|dp_multiplicity|disagreement_dp
  - (?i)re_train.*different_seed.*dp|dp.*multiple.*seeds
  - (?i)dp_multiplicity|multiplicity_cost_dp
  - (?i)spring.epfl.*dp_multiplicity|dp_multiplicity.*spring
  file_types:
  - '*.py'
  - '*.ipynb'
  message: DP predictive multiplicity audit detected (Kulynych FAccT 2023)
  description: Detects predictive multiplicity measurement code (Kulynych et al. FAccT
    2023, github.com/spring-epfl/dp_multiplicity). DP training produces models with
    high disagreement (μ(x) up to 100% at ε=0.5) — the same input gets opposite predictions
    in re-trainings with different random seeds. This arbitrariness cost of DP training
    is highest for individuals near the decision boundary and varies across demographic
    groups.
  remediation: Audit DP models for predictive multiplicity before high-stakes deployment
    (lending, healthcare, criminal justice). Report both accuracy loss AND multiplicity
    cost as DP deployment metrics.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-DP-SCAN-019
  name: dp-budget-accounting-manipulation
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)epsilon_override|bypass_accounting|skip_accounting
  - (?i)total_epsilon\s*=\s*(?:float\('inf'\)|math\.inf|np\.inf|999)
  - (?i)delta\s*=\s*(?:1\.0|1e-?0\b)|delta\s*=\s*(?:1\b)
  - (?i)ignore_privacy|no_dp|privacy_disabled|disable_privacy
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: DP budget accounting bypass or manipulation detected
  description: Detects patterns suggesting DP privacy accounting is being bypassed,
    disabled, or set to trivially large ε values. Setting δ=1.0 or ε=inf effectively
    disables DP guarantees while maintaining the appearance of DP training. Liu et
    al. (Waterloo 2021) showed setting σ=0 (ε=∞) actually gives best privacy-utility
    tradeoff in CIFAR-100 — this was misunderstood; it means the training procedure
    has no DP guarantee.
  remediation: Enforce minimum ε ceiling (e.g., ε ≤ 10) and maximum δ floor (δ ≤ 1/n)
    in DP training configurations. Validate accounting parameters before training
    begins.
  owasp_llm: LLM04:2025
  cwe: CWE-682
- id: MEDUSA-DP-SCAN-020
  name: dp-hyperparameter-tuning-privacy-leak
  severity: MEDIUM
  category: dp_attacks
  patterns:
  - (?i)grid_search.*dp|dp.*grid_search|hp_search.*dp
  - (?i)hyperparameter_tuning.*(?:privacy|epsilon)|(?:privacy|epsilon).*hyperparameter_tuning
  - (?i)private_hp_tuning|hp_private|hp.*privacy_budget
  - (?i)report_epsilon.*tuning|tuning_epsilon_cost
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  message: DP hyperparameter tuning without privacy budget accounting detected
  description: 'Hyperparameter tuning against validation data consumes privacy budget.
    If tuning queries are not accounted for in the reported ε, the actual privacy
    guarantee is weaker than claimed. Ponomareva et al. JAIR 2023 identifies this
    as a critical practical issue: published ε values often exclude tuning cost. An
    attacker can exploit the gap between reported ε and actual ε to launch stronger
    MIA.'
  remediation: Use private hyperparameter tuning algorithms (e.g., tree-structured
    search with privacy budget allocation). Account for all validation queries in
