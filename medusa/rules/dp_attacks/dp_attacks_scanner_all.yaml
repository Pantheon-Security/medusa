    reconstruction
  description: 'Detects scripted orchestration combining multiple DP attack vectors:
    shuffle-vs-Poisson gap (Chua et al. 2025) + large delta misconfiguration (Ponomareva
    et al. 2023) + user-level vs record-level confusion (Nguyen et al. 2023) + sequential
    composition exploit (Kutta et al. 2026). Combined, these cause stated epsilon
    to diverge from true privacy loss by an order of magnitude. AI-assisted attack
    scripting makes this orchestration feasible at scale.'
  remediation: 'Monitor for scripted automation combining multiple DP probe patterns.
    Enforce defense-in-depth: BB sampler + correct delta + user-level DP + sequential
    audit validation as mandatory CI/CD checks.'
