    High sparsity of user-item interaction matrices means individual user patterns
    are highly distinguishable — DP noise calibrated for dense data is insufficient
    for sparse matrices. Rigaki & Garcia (2023): attribute inference (inferring user
    preferences) is the primary risk.'
  remediation: Apply DP at user-level granularity (not item-level). Tune epsilon for
    sparse data. Use f-DP unified risk analysis (Kulynych et al. 2025) to jointly
    bound re-identification and preference inference.
  owasp_llm: LLM04:2025
  cwe: CWE-200
