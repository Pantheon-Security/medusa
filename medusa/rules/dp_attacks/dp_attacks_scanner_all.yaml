- id: MEDUSA-DP-SCAN-100
  name: dp-comprehensive-config-parameter-leak
  severity: HIGH
  category: dp_attacks
  patterns:
  - (?i)epsilon\s*[=:]\s*[0-9]+(?:\.[0-9]+)?.*sigma\s*[=:]
  - (?i)privacy_budget.*consumed.*[0-9]+.*remaining.*[0-9]+
  - (?i)dp_config.*epsilon.*delta.*noise_multiplier.*clipping
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.log'
  message: Comprehensive DP config parameter leak — epsilon, sigma, delta, clipping
    exposed together
  description: 'Detects simultaneous disclosure of multiple DP configuration parameters
    (epsilon, sigma/noise_multiplier, delta, clipping norm). Combined disclosure is
    more dangerous than any single parameter: Koskela & Mohammadi (2024) need only
    mechanism outputs to audit; You et al. (2025) infer sigma from zero-gradient probing;
    Chua et al. (2025) need only batch sampling method to compute true epsilon. Full
    configuration disclosure enables adversaries to compute true privacy loss precisely
    and calibrate optimal combined attacks.'
  remediation: Redact all DP configuration parameters from logs, API responses, and
    error messages. Use structured logging with DP-parameter sanitization filter.
    Treat noise_multiplier, delta, clipping norm, and batch size as sensitive configuration
    values.
  owasp_llm: LLM04:2025
  cwe: CWE-200
