  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: DP delta parameter too large — delta >> 1/n makes (epsilon,delta)-DP nearly
    trivial
  description: 'Detects DP configurations with δ much larger than 1/n. Ponomareva
    et al. JAIR 2023 specifies δ ≪ 1/n as a hard requirement for meaningful (ε,δ)-DP:
    when δ ≥ 1/n, the privacy guarantee can be violated with non-negligible probability
    over the training run. Standard: δ = 10⁻⁵ for n≥100,000. Attackers probe for δ=0.01
    or 0.1 configurations which dramatically weaken formal guarantees while appearing
    to satisfy DP notation. Real-world consequence: δ=0.01 on n=100 dataset means
    the DP guarantee fails on 1% of training runs by design — the training data can
    be exactly disclosed for those runs. This is exploitable in adversarial federated
    learning scenarios.'
  remediation: Enforce δ ≤ 1/(n·ln(n)) as a configuration constraint. Reject DP training
    configurations with δ > 10⁻⁴ for datasets of n < 10,000. Always report δ alongside
