metadata:
  source: expansion2 2026-03-02
rules:
- id: MEDUSA-SQ-SCAN-061
  name: sq-spracklen-documented-phantom-pypi-names
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(import|from|pip.{0,10}install).{0,40}(huggingface_utils|langchain_helpers|openai_utils|gpt_helpers|claude_utils|anthropic_utils|transformers_utils|llm_helper|ai_helper|model_helper)
  - (?i)(import|from|pip.{0,10}install).{0,40}(torch_utils|pytorch_helper|tensorflow_helper|sklearn_utils|numpy_helper|pandas_helper|fastapi_auth|flask_auth|django_ai)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.toml'
  - '*.sh'
  - '*.ipynb'
  message: Documented phantom/hallucinated PyPI package name detected.
  description: Import or install of package names consistently hallucinated by code-generating LLMs as documented in Spracklen
    et al. (2024) comprehensive package hallucination analysis — these names do not exist in PyPI but are frequently suggested
    by models.
  remediation: Verify all package names exist on PyPI before installation; run pip install --dry-run; use pip-audit to check
    installed packages.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-062
  name: sq-confusable-package-typosquat-vs-slopsquat
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(pip.{0,10}install|import|from).{0,40}(requestts|reqeusts|requets|requsets|requestss|reqests|requst|requesst)
  - (?i)(pip.{0,10}install|import|from).{0,40}(nummpy|numbpy|nmpy|nuumpy|nmupy|nmumpy|pndas|panads|pandsa|padnas|pndas)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.sh'
  - '*.toml'
  message: Confusable package name with high typosquat/slopsquat collision risk detected.
  description: Package name with edit-distance-1 similarity to popular packages — these occupy the ambiguous space between
    intentional typosquatting and LLM hallucination (slopsquatting). Spracklen et al. (2024) studied 5.2% fictional package
    rates.
  remediation: Always spell-check package names against known-good registries; use tab-completion from package managers rather
    than manual typing.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-063
  name: sq-codewhisperer-claude-hallucinated-import
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(codewhisperer|aws.?codewhisperer|amazon.?codewhisperer).{0,60}(suggest|generat|recommend|complet).{0,60}(import|install|package|library)
  - (?i)(claude|claude.?code|claude.?sonnet|claude.?opus).{0,60}(suggest|generat|recommend|import|install).{0,60}(package|library|module|depend)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.yaml'
  message: CodeWhisperer or Claude hallucinated package recommendation pattern detected.
  description: Code generated by Amazon CodeWhisperer or Anthropic Claude containing package recommendations that may be hallucinated
    — studies show CodeWhisperer and Claude have measurable PHR (Package Hallucination Rates) for less common packages.
  remediation: Verify all AI-recommended packages against official registries; implement package existence checking as part
    of AI-assisted development workflows.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-064
  name: sq-malicious-package-registration-hallucinated
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)(register|publish|upload|push).{0,60}(hallucinated|phantom|fictional|made.?up).{0,60}(package|module|library).{0,40}(pypi|npm|cargo|rubygem|crates)
  - (?i)(claim|register|squat).{0,60}(package.?name|namespace).{0,60}(hallucinated|llm|ai.?generat|model.?suggest)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.json'
  - '*.yaml'
  message: Malicious package registration for hallucinated name detected.
  description: Registration of package names that are known to be hallucinated by LLMs — the core slopsquatting attack where
    adversaries pre-register phantom package names to intercept LLM-directed installations. Spracklen et al. (2024).
  remediation: Monitor hallucinated package name registrations on major registries; report squat packages to registry security
    teams; use private registry mirrors.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-065
  name: sq-npm-hallucinated-package-install-pattern
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(npm|yarn|pnpm).{0,20}(install|add|i).{0,40}(react.?ai|vue.?ai|next.?ai|express.?ai|node.?ai|axios.?ai|lodash.?ai|ai.?utils|gpt.?utils|llm.?utils|openai.?helper|anthropic.?helper)
  - (?i)(npm|yarn|pnpm).{0,20}(install|add|i).{0,40}(langchain.?tools|langchain.?utils|langchain.?helper|openai.?tools|openai.?utils|openai.?helper)
  file_types:
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.yaml'
  message: npm hallucinated package install pattern detected.
  description: npm package installation commands referencing package names in the hallucination-prone AI/LLM utility namespace
    that frequently appear in LLM code suggestions but may not be legitimate packages.
  remediation: Verify npm package names on npmjs.com before installation; check package download counts and maintainer history;
    use npm audit.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-066
  name: sq-cargo-crate-hallucinated-name
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(cargo.{0,10}add|cargo.{0,10}install|dependencies.{0,10}=).{0,60}(openai.?rs|anthropic.?rs|langchain.?rs|llm.?rs|ai.?utils.?rs|gpt.?rs|llm.?utils|ai.?helper|transformer.?rs)
  - (?i)(cargo.?toml|Cargo.toml).{0,80}(openai|anthropic|langchain|llm|gpt).{0,40}(=.{0,10}["'][0-9]|crates.io)
  file_types:
  - '*.toml'
  - '*.sh'
  - '*.rs'
  message: Cargo/Rust crate hallucinated name pattern detected.
  description: Cargo dependency declarations using crate names in the LLM/AI namespace that are frequently hallucinated by
    code-generating models — Rust's less mature AI ecosystem has higher PHR than Python according to Spracklen et al. (2024).
  remediation: Verify crate names on crates.io before adding to Cargo.toml; check crate download counts and recent maintenance
    activity.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-067
  name: sq-go-module-hallucinated-import-path
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(import|go.{0,10}get|require).{0,60}(github\.com/(openai|anthropic|langchain|cohere|huggingface)[-/].{0,40}go|golang.org/x/(llm|ai|gpt|openai))
  - (?i)(go\.mod|require).{0,80}(llm.?go|openai.?go|anthropic.?go|langchain.?go|ai.?utils.?go|gpt.?go|ml.?go)
  file_types:
  - '*.go'
  - go.mod
  - '*.sh'
  message: Go module hallucinated import path detected.
  description: Go module import paths referencing LLM/AI library paths that are commonly hallucinated by code-generating models
    — Go module paths must exactly match their VCS source, making hallucinations immediately exploitable.
  remediation: Verify Go module paths exist on pkg.go.dev before adding to go.mod; run go mod verify after adding new dependencies.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-068
  name: sq-ide-autocomplete-inline-install-slopsquat
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(#.{0,40}(copilot|cursor|codewhisperer|tabnine|github.?copilot).{0,40}install|//.*copilot.*install|//.*cursor.*install)
  - (?i)(#.{0,40}install.{0,40}(copilot|cursor|ai.?suggest|autocomplete)|#.{0,60}(suggested|recommended).{0,30}(install|pip|npm|cargo))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  - '*.rs'
  - '*.sh'
  message: IDE autocomplete inline package install suggestion (slopsquatting risk) detected.
  description: Inline code comments referencing IDE autocomplete or AI assistant package install suggestions — these represent
    high-risk slopsquatting vectors where hallucinated package names from IDE suggestions are acted upon directly.
  remediation: Never directly execute package install commands from IDE autocomplete without verifying the package exists;
    treat autocomplete install suggestions as unverified.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-069
  name: sq-hallucinated-api-endpoint-exploitation
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(api\.openai\.com|api\.anthropic\.com|api\.cohere\.ai).{0,60}(v[0-9]{1,3}|endpoint|path).{0,60}(hallucin|not.?exist|phantom|fictional|made.?up)
  - (?i)(hallucin|phantom|fictional|made.?up).{0,60}(api.?endpoint|api.?path|api.?route|api.?url).{0,60}(exploit|redirected|intercept|squat)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: Hallucinated API endpoint exploitation pattern detected.
  description: Exploitation of hallucinated LLM API endpoints — LLMs frequently hallucinate non-existent API routes, versioned
    paths, or subdomain structures that attackers can register to intercept requests from code that acts on hallucinated endpoints.
  remediation: Verify all API endpoints against official documentation before use; validate API response schemas against official
    specifications.
  owasp_llm": LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-070
  name: sq-cicd-pipeline-slopsquat-compromise
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)(github.?actions|gitlab.?ci|circleci|jenkins|travis).{0,60}(install|pip|npm|cargo|gem|go.?get).{0,60}(unverif|no.?check|no.?hash|phantom|hallucin)
  - (?i)(ci.?cd|pipeline|workflow|build.?step).{0,60}(ai.?generat|llm.?generat|copilot.?generat).{0,60}(install|package|depend|import)
  file_types:
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.sh'
  message: CI/CD pipeline compromise via slopsquatting package install detected.
  description: CI/CD pipeline configurations containing AI-generated package install commands that may include hallucinated
    package names — these are particularly dangerous as CI/CD compromises affect all builds and deployments.
  remediation: Review all CI/CD package installation commands; pin to specific verified versions with hashes; separate AI-generated
    pipeline code generation from direct pipeline execution.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-071
  name: sq-legitimate-looking-package-facade
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(professional.?looking|well.?documented|legitimate.?looking|convincing).{0,60}(malicious.?package|squat.?package|facade.?package|fake.?package)
  - (?i)(fake.?readme|fake.?documentation|fabricated.?docs|spoofed.?package.?page).{0,60}(slopsquat|typosquat|hallucin|phantom)
  file_types:
  - '*.py'
  - '*.md'
  - '*.json'
  - '*.yaml'
  message: Legitimate-looking malicious package facade pattern detected.
  description: Malicious packages crafted with professional-looking README files, documentation, and version histories to
    appear legitimate when a developer encounters them after following an LLM hallucination — a common slopsquatting social
    engineering technique.
  remediation: Check package age, download count, and issue history; verify package maintainer identity; compare package functionality
    against stated purpose.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-072
  name: sq-deprecated-package-name-collision
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(deprecated|obsolete|removed|delisted|yanked).{0,60}(package|module|library).{0,60}(name.?collision|collision|takeover|claim|register|squat)
  - (?i)(reinstall|re.?register|reclaim|takeover).{0,60}(deprecated|obsolete|removed|yanked).{0,60}(package.?name|namespace|pypi|npm|crate)
  file_types:
  - '*.py'
  - '*.json'
  - '*.sh'
  - '*.yaml'
  message: Deprecated package name collision or namespace reclaim attack detected.
  description: Attacks reclaiming deprecated or removed package names to intercept installations from code that still references
    the old package name — LLMs trained on older data frequently recommend packages that have been deprecated or removed.
  remediation: Check whether recommended packages are current and not deprecated; use pip install --require-hashes to detect
    unexpected packages.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-073
  name: sq-language-specific-gem-ruby-hallucinate
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(gem.{0,10}install|gemfile|bundler).{0,60}(ai.?gem|llm.?gem|gpt.?gem|openai.?gem|anthropic.?gem|langchain.?gem|claude.?gem|ml.?gem)
  - (?i)(gem.{0,10}install|gemfile|bundler).{0,60}(rails.?ai|ruby.?ai|activeai|activellm|rubygpt|rubyllm)
  file_types:
  - '*.rb'
  - Gemfile
  - '*.sh'
  - '*.yaml'
  message: Ruby gem hallucinated package name (slopsquatting risk) detected.
  description: Ruby gem installation commands referencing AI/LLM utility gem names that are frequently hallucinated by code-generating
    models — Ruby's ecosystem has fewer AI libraries making hallucination-to-real ratio higher.
  remediation: Verify gem names on rubygems.org before adding to Gemfile; check gem download counts and maintenance activity.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-074
  name: sq-maven-gradle-java-hallucinated-artifact
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(maven|gradle|pom\.xml|build\.gradle).{0,60}(ai.?java|java.?ai|spring.?ai|llm.?java|gpt.?java|openai.?java.?sdk|anthropic.?java|claude.?java)
  - (?i)(com\.openai|io\.anthropic|dev\.langchain4j|io\.langchain).{0,60}(hallucin|phantom|fictional|not.?exist)
  file_types:
  - pom.xml
  - '*.gradle'
  - '*.xml'
  - '*.kts'
  message: Java Maven/Gradle hallucinated artifact (slopsquatting risk) detected.
  description: Java build tool configurations referencing Maven artifact coordinates that may be hallucinated by LLMs — Java's
    AI SDK ecosystem is rapidly evolving making LLMs more likely to hallucinate non-existent artifact coordinates.
  remediation: Verify Maven artifact coordinates on search.maven.org before adding to pom.xml or build.gradle; check artifact
    download counts.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-075
  name: sq-high-phr-model-code-generation-risk
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(code.?llama|starcoder|deepseek.?coder|codestral|phi.?code|codegemma|wizard.?coder).{0,60}(generat|suggest|recommend|output).{0,60}(package|import|install|library|depend)
  - (?i)(code.?generat|ai.?code|llm.?code).{0,60}(high.?phr|hallucination.?rate|phantom.?package|fictional.?package|made.?up.?package)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: High PHR code-generating model output with unverified package references detected.
  description: Code generated by models known to have high Package Hallucination Rates (PHR) — CodeLlama, StarCoder variants,
    and DeepSeek-Coder have documented PHR above 5% for less common packages. Spracklen et al. (2024).
  remediation: Apply mandatory package existence verification for code output from high-PHR models; use package validation
    middleware in AI coding assistant deployments.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-076
  name: sq-self-refinement-verification-package-absent
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(self.?refin|self.?verif|self.?check|iterative.?refin).{0,60}(package|import|install|dependency).{0,60}(absent|missing|not.?done|skip|without)
  - (?i)(refin|verif|feedback.?loop).{0,60}(code.?generat|llm.?output|ai.?suggest).{0,60}(package.?verif|registry.?check|exist.?check)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: Self-refinement package verification step absent in AI code generation pipeline detected.
  description: AI code generation pipelines that generate package recommendations without a self-refinement or verification
    step that checks package existence — self-verification has been shown to reduce PHR from 5.2% to under 1%.
  remediation: Add a package existence verification step to all AI code generation workflows; implement reflexion-style self-checking
    for generated import statements.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-077
  name: sq-al-zofi-systematic-slopsquat-review
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(systematic.?slopsquat|slopsquat.?attack|slopsquat.?framework|slopsquat.?study|slopsquat.?analysis)
  - (?i)(ai.?induced|llm.?induced|model.?induced).{0,40}(supply.?chain.?compromise|package.?hallucin|phantom.?package|slopsquat)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: Systematic slopsquatting attack framework or study pattern detected.
  description: Patterns referencing systematic slopsquatting attacks, following al-Zofi (2025) systematic review of AI-induced
    supply chain compromise via package hallucinations. Includes automated slopsquatting tooling.
  remediation: Monitor for automated slopsquatting tooling patterns; implement registry monitoring for hallucinated package
    name registrations; use threat intelligence feeds for slopsquat IOCs.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-078
  name: sq-latendresse-chatgpt-librarian-package-gap
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(chatgpt|gpt.?4|claude|gemini).{0,60}(librarian|software.?librarian|package.?recommend|library.?suggest|software.?suggest).{0,60}(unverif|no.?check|accept.?as.?is|blindly)
  - (?i)(chatgpt|gpt.?4|claude|gemini).{0,60}(recommends?|suggests?|says.?to.?use|says.?to.?install).{0,60}(package|library|module).{0,40}(unverif|no.?check|blindly|direct)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.txt'
  - '*.json'
  message: ChatGPT/LLM acting as software librarian with unverified package recommendation detected.
  description: Pattern matching the Latendresse (2024) study on using ChatGPT as a software librarian — directly installing
    LLM-recommended packages without verification creates slopsquatting risk with measurable real-world impact.
  remediation: Never directly install packages recommended by LLMs without registry verification; treat LLM package recommendations
    as suggestions requiring human validation.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-079
  name: sq-indirect-prompt-injection-package-install
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)(indirect.?injection|prompt.?injection.?via|inject.?via.{0,30}(document|url|file|page)).{0,60}(install|package|pip|npm|cargo|gem).{0,40}(malicious|phantom|squat)
  - (?i)(retrieved.?content|web.?content|document.?content).{0,60}(install|pip.?install|npm.?install|cargo.?add).{0,40}(package|library|module)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Indirect prompt injection triggering package install (slopsquatting via injection) detected.
  description: Indirect prompt injection via retrieved documents or web content that instructs an LLM agent to install a hallucinated
    or malicious package — combining slopsquatting with prompt injection for automated supply chain compromise.
  remediation: Require human approval for any package installation triggered by agent workflows; implement package install
    sandboxing for LLM agents.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-080
  name: sq-zahan-npm-malware-llm-detect
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(malware|malicious).{0,40}(npm|pypi|crate|gem).{0,40}(detect|scan|identify|classif).{0,60}(llm|ai|model|gpt|claude|bert)
  - (?i)(npm.?ecosystem|pypi.?ecosystem).{0,60}(malware|malicious.?package|supply.?chain.?malware).{0,60}(llm|ai.?detect|model.?detect)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: LLM-based npm/PyPI malware detection bypass pattern detected.
  description: Patterns referencing or attempting to evade LLM-based malware detection in npm and PyPI ecosystems — adversaries
    crafting malicious packages specifically designed to evade LLM-based security scanning. Zahan et al. (2024).
  remediation: Combine LLM-based and signature-based malware detection; maintain diverse detection ensemble; test detection
    bypass resistance regularly.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-081
  name: sq-nuget-dotnet-hallucinated-package
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)(nuget|dotnet.{0,10}add|csproj|packages\.config).{0,60}(openai.?dotnet|anthropic.?dotnet|langchain.?dotnet|llm.?dotnet|ai.?net|gpt.?dotnet|claude.?dotnet)
  - (?i)(dotnet.?add.?package|nuget.?install|install.?package).{0,40}(openai|anthropic|langchain|llm|gpt|claude|ai).{0,30}(dotnet|net|sharp|csharp)
  file_types:
  - '*.csproj'
  - '*.xml'
  - '*.json'
  - '*.sh'
  message: NuGet .NET hallucinated package name (slopsquatting risk) detected.
  description: NuGet package installation commands referencing AI/LLM utility package names in the .NET ecosystem that are
    frequently hallucinated by code-generating models for C# and .NET contexts.
  remediation: Verify NuGet package names on nuget.org before installation; check download counts and publisher verification
    badges.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-082
  name: sq-persistent-hallucination-cross-model-name
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(persistent.?hallucin|consistent.?hallucin|reproducible.?hallucin|repeated.?hallucin).{0,60}(package|module|library|import)
  - (?i)(multiple.?model|cross.?model|all.?model|every.?model).{0,60}(hallucin|phantom|fictional|made.?up).{0,60}(package|import|library)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ipynb'
  message: Persistently hallucinated package name (reproduced across multiple models) detected.
  description: Package names that are persistently and consistently hallucinated across multiple different LLMs — these are
    highest-risk slopsquatting targets as any model used by a developer will suggest the same phantom package. Spracklen et
    al. (2024).
  remediation: Maintain a blocklist of known persistently-hallucinated package names; alert developers when attempting to
    install such packages.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-083
  name: sq-agentic-autonomous-package-registry-query
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(agent|autonomous|agentic).{0,60}(query|search|look.?up|check|verify).{0,60}(pypi|npmjs|crates\.io|rubygems|pkg\.go\.dev|nuget).{0,40}(before|prior.?to|first|verify)
  - (?i)(tool.?call|function.?call|api.?call).{0,60}(verify.?package|check.?package|validate.?package|registry.?check).{0,40}(exist|valid|real|official)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  message: Agentic LLM autonomous package registry verification call detected.
  description: Agentic LLM attempting to autonomously verify package existence before installation — positive security behaviour
    that should be encouraged but also represents an oracle that can be queried to discover which hallucinated names are unclaimed.
  remediation: Log all agent package verification calls; alert on high-frequency registry queries that may indicate slopsquatting
    reconnaissance; monitor for package registrations immediately following agent verification calls.
  owasp_llm: LLM08:2025
