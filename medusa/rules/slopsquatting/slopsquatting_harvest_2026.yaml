  description: Detects go get commands with placeholder patterns like 'your.package.name'
    that are hallucinated by quantized LLMs.
  severity: low
  category: slopsquatting
  patterns:
  - go\s+(?:get|install)\s+your\.package\.name
  - go\s+(?:get|install)\s+example\.(?:com|org|io)\/[a-zA-Z]+
  file_types:
  - '*.sh'
  - Makefile
  message: Detected go get command with a placeholder package name; these are often
    hallucinated and could be registered by attackers.
  remediation: '- Replace placeholder names with actual, verified module paths.

    - Use the Go module proxy to check existence.

    - Educate developers to never trust generic package names from LLMs.'
  owasp_llm: LLM06:2025
  cwe: CWE-494
  mitre_attack: T1195
  source_paper: Haque et al. (2025) -- Secure or Suspect? Investigating Package Hallucinations
    | Paper mentions 'your.package.name' exists as a real URL, highlighting slopsquatting
    risk.
  fp_guards:
  - go get your-company.com/valid-pkg
  - go get example.com/legit
  pipeline_confidence: high
