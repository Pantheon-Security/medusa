- id: MEDUSA-SLOP-SCAN-063
  name: hallucinated-go-get-github-url
  description: Detects hallucinated GitHub URLs in go get commands, which are the
    largest attack vector for slopsquatting in Go (paper shows >50% hallucinated github.com
    URLs).
  severity: low
  category: slopsquatting
  patterns:
  - (?i)subprocess\.(?:run|Popen|call)\s*\(\s*\[\s*['"]go['"]\s*,\s*['"](?:get|install)['"]\s*,\s*['"]github\.com/[^'"]+['"]
  - (?i)(?:exec|system|popen)\s*\(\s*['"]go (?:get|install) github\.com/[^'"]+['"]
  file_types:
  - '*.py'
  - '*.sh'
  - '*.go'
  - '*.yaml'
  - '*.json'
  message: Detected a go get/install command referencing a github.com URL — may be
    hallucinated and exploited for package slopsquatting.
  remediation: '- Verify the package exists in the Go module proxy (proxy.golang.org)
    before executing.

    - Pin dependencies to specific versions with go.sum checksums.

    - Use a private Go module mirror with curated allowlist.'
  owasp_llm: LLM06:2025
  cwe: CWE-912
  mitre_attack: T1195
  source_paper: 'Haque et al. (2025) -- Secure or Suspect? Investigating Package Hallucinations
    | Haque et al. 2025: Package hallucination in Go shell commands; up to 98.78%
    PHR in 4-bit quantized Qwen 0.5B on MBPP.'
  fp_guards:
  - go get github.com/avelino/awesome-go
  - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.55.0
  pipeline_confidence: high
