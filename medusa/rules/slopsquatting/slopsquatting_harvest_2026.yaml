version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: slopsquatting
rules:
- id: MEDUSA-SLOP-SCAN-001
  name: hallucinated-package-import-python
  description: Detects import statements for packages commonly hallucinated by LLMs
    in Python code. These phantom package names have been empirically observed in
    large-scale evaluations (e.g., securehashlib, hyper-h2, dataframe-utils). Such
    imports may indicate slopsquatting-planted malicious packages installed from AI
    suggestions.
  severity: critical
  category: slopsquatting
  patterns:
  - ^\s*import\s+(securehashlib|hyper[_-]h2|dataframe[_-]utils|hyper_h2|dataframeutilspy)\b
  - ^\s*from\s+(securehashlib|hyper[_-]h2|dataframe[_-]utils|hyper_h2|dataframeutilspy)\s+import
  file_types:
  - '*.py'
  message: 'Detected: import of known LLM-hallucinated package name — possible slopsquatting
    victim package'
  cwe: CWE-829
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-002
  name: hallucinated-package-require-js
  description: Detects require() or import calls for package names commonly hallucinated
    by LLMs in JavaScript/TypeScript. Commercial LLMs hallucinate ~5.2% of packages;
    open-source models ~21.7%. These plausible-sounding but nonexistent names are
    prime slopsquatting targets.
  severity: critical
  category: slopsquatting
  patterns:
  - require\(['"](?:securehashlib|hyper-h2|dataframe-utils|secure-hash-lib|node-fetch-utils|crypto-helper-lib)['"]\)
  - (?:import|from)\s+['"](?:securehashlib|hyper-h2|dataframe-utils|secure-hash-lib|node-fetch-utils|crypto-helper-lib)['"]
  file_types:
  - '*.js'
  - '*.ts'
  message: 'Detected: require/import of known LLM-hallucinated package name — possible
    slopsquatting victim package'
  cwe: CWE-829
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-003
  name: suspicious-package-naming-pattern-pypi
  description: 'Detects package names in Python dependency files that match patterns
    associated with LLM hallucinations: plausible-sounding utility/security library
    names composed of common tech words hyphenated in unusual combinations. Based
    on empirical analysis showing hallucinated names tend to follow patterns like
    ''action-noun-lib'', ''verb-noun-utils'', ''adjective-noun-helper''.'
  severity: medium
  category: slopsquatting
  patterns:
  - ^(?:secure|crypto|fast|safe|easy|smart|auto)[_-](?:hash|connect|fetch|parse|validate|auth|token|jwt|ssl|tls)[_-](?:lib|utils|helper|tools|toolkit|py|wrapper)(?:[=<>!~]|$)
  - ^(?:python|py)[_-](?:secure|crypto|http|web|net|api)[_-](?:lib|utils|helper|tools|client|wrapper)(?:[=<>!~]|$)
  file_types:
  - '*.txt'
  - '*.toml'
  - '*.cfg'
  message: 'Detected: dependency name matches LLM hallucination pattern (plausible
    utility/security compound name) — verify package exists on PyPI before installation'
  cwe: CWE-829
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-004
  name: suspicious-package-naming-pattern-npm
  description: Detects npm package names in package.json matching patterns associated
    with LLM hallucinations. The 'We Have a Package for You' study found 440,445 hallucinated
    packages out of 2.23 million code samples, with JavaScript showing higher hallucination
    rates (21.15% for CodeLlama 34B) than Python.
  severity: high
  category: slopsquatting
  patterns:
  - '"(?:secure|crypto|fast|safe|easy|smart|auto)-(?:hash|connect|fetch|parse|validate|auth|token|jwt|ssl|tls)-(?:lib|utils|helper|tools|toolkit|wrapper)"\s*:'
  - '"(?:node|js|react|vue|angular)-(?:secure|crypto|http|web|net|api)-(?:lib|utils|helper|tools|client|wrapper)"\s*:'
  file_types:
  - '*.json'
  message: 'Detected: npm dependency name matches LLM hallucination pattern — verify
    package exists on npm registry before installation'
  cwe: CWE-829
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-005
  name: ai-codegen-comment-with-install
  description: Detects code patterns where an AI-assistant comment or annotation is
    immediately followed by a package install command or import. This combination
    indicates AI-generated code that may reference hallucinated package names, as
    LLMs suggest phantom packages in AI-assisted IDEs (GitHub Copilot, OpenAI Codex,
    Google Gemini).
  severity: medium
  category: slopsquatting
  patterns:
  - '//\s*(?:generated by|copilot|ai[- ]generated|llm|gpt|claude|gemini|codex)[^

    ]*

    (?:\s*//[^

    ]*

    )*\s*(?:require|import)\s+[''"]([^''"]+)[''"]'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: AI-generated code comment immediately preceding package import
    — manually verify package existence in registry'
  cwe: CWE-829
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-006
  name: dependency-without-lockfile-pin
  description: Detects dependency declarations using loose version constraints (no
    pin or range) combined with newly observed package names. Dependency pinning via
    lockfiles (package-lock.json, Pipfile.lock) is a key defense against slopsquatting;
    absence of pinning allows automatic upgrade to malicious versions registered after
    hallucination.
  severity: medium
  category: slopsquatting
  patterns:
  - ^[a-z][a-z0-9_-]{2,40}\s*[*]\s*$
  file_types:
  - '*.txt'
  message: 'Detected: unpinned dependency with no version constraint — slopsquatting
    risk if package name was AI-suggested; add exact version pin'
  cwe: CWE-1336
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-007
  name: pip-install-no-hash-verification
  description: Detects pip install commands that lack hash verification (--require-hashes)
    or index restriction. SLSA provenance attestations and hash checking are recommended
    defenses against slopsquatting; installing without hash verification allows malicious
    packages installed from hallucinated names to execute without integrity checks.
  severity: medium
  category: slopsquatting
  patterns:
  - pip3\s+install\s+(?!.*--require-hashes)([a-z][a-z0-9_-]+)(?:\s|$)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.txt'
  message: 'Detected: pip install without hash verification — if package name was
    AI-suggested, lack of --require-hashes allows silent substitution of malicious
    package'
  cwe: CWE-494
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-008
  name: npm-install-without-lockfile
  description: Detects npm/yarn install commands invoked without a lockfile in context,
    or with --no-package-lock flag. Lockfiles (package-lock.json) capture dependency
    graphs at specific versions and are a primary defense against slopsquatting per
    the systematic review's CI/CD defense recommendations.
  severity: medium
  category: slopsquatting
  patterns:
  - npm\s+install\s+.*--no-package-lock
  - npm\s+i\s+.*--no-package-lock
  - yarn\s+add\s+.*--no-lockfile
  file_types:
  - '*.sh'
  - '*.json'
  message: 'Detected: package manager install with lockfile disabled — removes slopsquatting
    protection; lockfiles prevent automatic resolution to attacker-registered hallucinated
    packages'
  cwe: CWE-1336
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-009
  name: pyproject-unscoped-new-dependency
  description: Detects dependencies in pyproject.toml that appear to be newly added
    (no version history context) and lack namespace/scope qualification. The systematic
    review highlights Maven Central's domain-based namespacing as a strong defense;
    unscoped packages in PyPI are most vulnerable to slopsquatting registration.
  severity: medium
  category: slopsquatting
  patterns:
  - dependencies\s*=\s*\[[^\]]*['"]([a-z][a-z0-9-]{3,30})[>=<!][^'"]*['"]
  file_types:
  - '*.toml'
  message: 'Detected: unscoped package dependency in pyproject.toml — verify package
    was not AI-suggested without existence validation'
  cwe: CWE-1336
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-010
  name: security-phrase-triggered-import
  description: Detects imports occurring near security-related code comments or string
    literals. The HFuzzer study found that phrase-based prompts containing 'secure
    connection', 'network handshake', or similar security phrases reliably induced
    11.6% hallucination rate, producing phantom packages. Imports near such phrases
    in AI-generated code warrant verification.
  severity: medium
  category: slopsquatting
  patterns:
  - (?:secure\s+connection|network\s+handshake|ssl\s+handshake|tls\s+connection|encrypted\s+channel)[^\n]{0,200}\n(?:[^\n]*\n){0,5}\s*(?:import|from|require)\s+([a-z][a-z0-9_-]+)
  - (?:create\s+a\s+secure|establish\s+(?:a\s+)?secure|implement\s+(?:a\s+)?(?:secure|encrypted))[^\n]{0,200}\n(?:[^\n]*\n){0,5}\s*(?:import|from|require)\s+([a-z][a-z0-9_-]+)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: import statement following security-related phrase — HFuzzer
    research shows these prompt patterns reliably trigger LLM package hallucination;
    verify package registry existence'
  cwe: CWE-707
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-011
  name: sbom-unverified-ai-dependency
  description: Detects SBOM (SPDX/CycloneDX) entries where the supplier is listed
    as AI-generated or the package has no known purl. SLSA provenance attestations
    and SBOM formats (SPDX, CycloneDX) are recommended by the systematic review for
    dependency transparency; AI-originated packages without verifiable provenance
    are slopsquatting risk.
  severity: medium
  category: slopsquatting
  patterns:
  - PackageSupplier:\s*(?:AI|LLM|GPT|Copilot|Codex|generated)
  - '"supplier"\s*:\s*"(?:AI|LLM|GPT|Copilot|Codex|generated)"'
  file_types:
  - '*.json'
  - '*.toml'
  message: 'Detected: SBOM entry with AI/LLM listed as package supplier — indicates
    dependency originated from AI code generation without registry validation'
  cwe: CWE-1336
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-012
  name: javascript-security-library-hallucination-pattern
  description: Detects JavaScript imports of packages matching the naming conventions
    identified in the 'Importing Phantoms' study as commonly hallucinated. Open-source
    models hallucinated 21.7% of JavaScript packages vs 21.15% for Python (CodeLlama
    34B). JavaScript showed higher overall hallucination rates across all models.
  severity: critical
  category: slopsquatting
  patterns:
  - (?:import|require)\s*\(?['"](?:node-)?(?:secure|safe|trusted|verified)[_-](?:fetch|request|http|https|connect|socket)[_-]?(?:lib|client|module|helper|utils)?['"]\)?
  - (?:import|require)\s*\(?['"](?:enhanced|advanced|smart|auto)[_-](?:crypto|cipher|hash|sign|verify|token|jwt)[_-]?(?:lib|utils|helper|module)?['"]\)?
  file_types:
  - '*.js'
  - '*.ts'
  message: 'Detected: JavaScript import matching LLM hallucination naming pattern
    for security libraries — verify on npm registry; JavaScript code has highest slopsquatting
    risk per empirical data'
  cwe: CWE-1336
  owasp_llm: LLM05:2025 Improper Output Handling
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-013
  name: universal-hallucinated-package-rest-framework
  description: Detects references to 'rest-framework' (hallucinated by all 5 models);
    the real package is 'djangorestframework'.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+rest-framework\b
  - (?i)(?:from|import)\s+rest_framework\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Hallucinated package 'rest-framework' detected; the correct package is
    'djangorestframework'. This name is hallucinated by all major 2026 frontier LLMs.
  remediation: '- Replace ''rest-framework'' with ''djangorestframework''.

    - Always verify package names on PyPI before installing.

    - Use a lockfile.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (109 PyPI), all
    5 models hallucinate ''rest-framework''.'
  fp_guards:
  - from rest_framework.views import APIView
  - the djangorestframework package is used
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-014
  name: universal-hallucinated-package-objc
  description: Detects references to 'objc' (hallucinated by all 5 models); the real
    package is 'pyobjc'.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)(?:from|import)\s+objc\b
  - (?i)pip\s+install\s+objc\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Hallucinated package 'objc' detected; legitimate package is 'pyobjc'. This
    name is hallucinated by all major 2026 frontier LLMs.
  remediation: '- Replace ''objc'' with ''pyobjc''.

    - Verify package names before installing.

    - Use a lockfile.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (109 PyPI), all
    5 models hallucinate ''objc''.'
  fp_guards:
  - from pyobjc import getClass
  - objc is a runtime for Objective-C
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-015
  name: universal-hallucinated-package-mpl-toolkits
  description: Detects references to 'mpl-toolkits' (hallucinated by all 5 models);
    this is a submodule of matplotlib, not a standalone package.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+mpl-toolkits\b
  - (?i)(?:from|import)\s+mpl_toolkits\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Hallucinated package 'mpl-toolkits' detected; this is a submodule of matplotlib,
    not a standalone package. Hallucinated by all major 2026 frontier LLMs.
  remediation: '- Remove the standalone install; ''mpl_toolkits'' comes with matplotlib.

    - Import from matplotlib: ''from mpl_toolkits.mplot3d import Axes3D''.

    - Do not pip install mpl-toolkits.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (109 PyPI), all
    5 models hallucinate ''mpl-toolkits''.'
  fp_guards:
  - from mpl_toolkits.mplot3d import Axes3D
  - mpl-toolkits is a namespace within matplotlib
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-016
  name: universal-hallucinated-package-opengl
  description: Detects references to 'opengl' (hallucinated by all 5 models); the
    real package is 'PyOpenGL'.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)(?:from|import)\s+opengl\b
  - (?i)pip\s+install\s+opengl\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Hallucinated package 'opengl' detected; legitimate package is 'PyOpenGL'.
    This name is hallucinated by all major 2026 frontier LLMs.
  remediation: '- Replace ''opengl'' with ''PyOpenGL''.

    - Verify package names with official documentation.

    - Use a lockfile.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (109 PyPI), all
    5 models hallucinate ''opengl''.'
  fp_guards:
  - from PyOpenGL import GL
  - opengl is a graphics API
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-017
  name: universal-hallucinated-npm-scoped-ember
  description: Detects references to scoped npm packages under @ember/ that are hallucinated
    (e.g., @ember/service, @ember/object) which are internal Ember.js subpackages
    not published standalone.
  severity: high
  category: slopsquatting
  patterns:
  - (?i)npm\s+install\s+@ember/\w+\b
  - (?i)(?:require|import)\s*\(?\s*['"]@ember/\w+['"]
  file_types:
  - '*.js'
  - '*.jsx'
  - '*.ts'
  - '*.tsx'
  - '*.json'
  - '*.yaml'
  message: Hallucinated scoped npm package under @ember/ detected. These are internal
    Ember.js subpackages not published standalone. This name is hallucinated by all
    major 2026 frontier LLMs.
  remediation: '- Remove the install of @ember/... packages.

    - Use the Ember framework''s built-in modules instead.

    - Verify package names on npm before installing.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (18 npm), all 5
    models hallucinate @ember/service, @ember/object, etc.'
  fp_guards:
  - import { inject } from '@ember/service'
  - '@ember/object is a module in the Ember source'
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-018
  name: universal-hallucinated-npm-scoped-ember-object
  description: Specifically detects 'npm install @ember/object' which is hallucinated
    by all 5 models.
  severity: high
  category: slopsquatting
  patterns:
  - (?i)npm\s+install\s+@ember/object\b
  - (?i)(?:require|import)\s*\(?\s*['"]@ember/object['"]
  file_types:
  - '*.js'
  - '*.jsx'
  - '*.ts'
  - '*.tsx'
  - '*.json'
  - '*.yaml'
  message: Hallucinated npm package '@ember/object' detected; this is an internal
    Ember.js subpackage. Hallucinated by all major 2026 frontier LLMs.
  remediation: '- Remove @ember/object install; use Ember''s built-in module.

    - Verify package names on npm before installing.

    - Use a lockfile.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; universal hallucination set (18 npm), all 5
    models hallucinate @ember/object.'
  fp_guards:
  - import { inject } from '@ember/service'
  - '@ember/object is a node module in Ember'
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-019
  name: python-over-javascript-hallucination-asymmetry
  description: Detects higher hallucination rates in Python vs JavaScript across all
    2026 frontier models (inversion of Spracklen 2024). Particularly targets code
    that installs Python packages from LLM-generated code.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+[a-z_-]+\b.{0,30}(?:import|from)\s+\w+
  - (?i)#.{0,40}pip\s+install\s+[a-z_-]+\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  - '*.md'
  message: Python package install pattern from LLM-generated code; 2026 frontier models
    hallucinate Python packages 2.73-4.13pp more than JavaScript, increasing slopsquatting
    risk.
  remediation: '- Verify all Python package names on PyPI before installing.

    - Use package hash verification (--hash).

    - Lock dependencies with a lockfile.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; Python hallucination rates 5.49-7.27% vs JS
    2.62-3.78% across all 5 models.'
  fp_guards:
  - 'pip install requests

    import requests'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: medium
- id: MEDUSA-SLOP-SCAN-020
  name: hallucinated-package-name-edit-distance-two
  description: Detects package names that are within Levenshtein distance 2 of a real
    package, as the top-10 most hallucinated names are NEAR (edit-distance 2) to existing
    packages, compounding slopsquatting with typosquatting.
  severity: medium
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+(?:aws-cdk|objc|opentelemetry|rest-framework|tencentcloud|mpl-toolkits|opengl|openstack)\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.cfg'
  - '*.toml'
  message: Package name within edit-distance 2 of a real package detected. These names
    are hallucinated by all 5 frontier LLMs, enabling both slopsquatting and typosquatting
    attacks.
  remediation: '- Verify the exact package name on PyPI.

    - Use ''pip search'' or PyPI website to confirm package existence.

    - Install with hash verification.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; Table 4 shows top-10 hallucinated names are
    all NEAR (edit-distance 2) to real packages.'
  fp_guards:
  - pip install aws-cdk-lib
  - from aws_cdk_lib import core
  pipeline_confidence: high
- id: MEDUSA-SLOP-SCAN-021
  name: llm-synthesized-prompt-hallucination-amplification
  description: Detects code that installs packages from LLM-synthesized prompts, which
    produce higher hallucination rates than curated prompts (Churilov 2026).
  severity: low
  category: slopsquatting
  patterns:
  - (?i)(?:#|//|--)\s*(?:generated by|created by|using|via)\s+(?:AI|LLM|GPT|Claude|Gemini|DeepSeek)
  - (?i)(?:import|require)\s+[\w.]+\s+#.{0,40}AI.{0,40}generated
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.go'
  - '*.rs'
  message: LLM-synthesized prompt detected; 2026 frontier models hallucinate 0.5-2pp
    more on synthetic prompts, increasing slopsquatting risk.
  remediation: '- Verify all package names in AI-generated code against registries.

    - Use a package allowlist.

    - Review code from synthetic prompts manually.'
  owasp_llm: LLM06:2025
  cwe: CWE-913
  mitre_attack: T1195
  source_paper: 'Churilov et al. (2026) -- The Range Shrinks, the Threat Remains:
    Re-evaluating LL | Churilov 2026; LLM-synthesized prompts produce higher hallucination
    rates across all 5 models.'
  fp_guards:
  - '# generated by AI for educational purposes'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: medium
  action: log
- id: MEDUSA-SLOP-SCAN-022
  name: ghostwriter-hallucination-pattern
  description: Detects package references that follow the 'GhostWriter' attack pattern
    (Spracklen 2025) but on 2026 models with compressed rates.
  severity: low
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+[a-z][a-z0-9_-]{0,50}\s+#.{0,40}hallucinated
  - (?i)(?:from|import)\s+[a-z][a-z0-9_]{0,50}\s+#.{0,40}hallucinated
  file_types:
  - '*.py'
  - '*.txt'
