  message: Vulnerability scanner with bypass flags — disables detection of known malicious
    package advisories
  description: 'Detects vulnerability scanning commands that use bypass or ignore
    flags, disabling detection of known malicious package advisories. Ruohonen & Saddiqa
    (2025) found that by 2025, up to 80% of OSV database entries are malware records.
    Vulnerability scanners (pip-audit, npm audit, safety, snyk) consult these databases
    and can detect when an installed package matches a malware advisory — including
    slopsquatted packages that have been reported and indexed. When AI-generated scripts
    include vulnerability scanner invocations with --skip or --ignore flags (often
    added to "fix" pipeline failures), they remove the final detection layer against
    installed malicious packages.

    '
  remediation: 'Never bypass vulnerability scanner checks in CI/CD pipelines. If a
    specific advisory is a false positive, suppress it with a documented exception
    record. Use pip-audit, npm audit, and Trivy without bypass flags as mandatory
    pipeline gates. Subscribe to PyPI/npm malware advisories to receive alerts about
    newly-registered threats.

    '
