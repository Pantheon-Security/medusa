rules:
- id: MEDUSA-SQ-SCAN-001
  name: hallucinated-package-import-pypi
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)import\s+[a-z][a-z0-9_-]{2,30}\b
  - (?i)from\s+[a-z][a-z0-9_-]{2,30}\s+import
  - (?i)pip\s+install\s+[a-z][a-z0-9_-]{3,40}\b
  - (?i)install_requires\s*=\s*\[.*?['"][a-z][a-z0-9_-]{3,40}['"]
  file_types:
  - '*.py'
  - requirements.txt
  - setup.py
  - setup.cfg
  - pyproject.toml
  - Pipfile
  message: Python package reference in AI-generated code — verify existence in PyPI
    before installation
  description: 'Detects Python package import statements and dependency declarations
    in AI-generated code. Spracklen et al. (2024, USENIX Security) found that open-source
    LLMs hallucinate Python packages at 21.7% average rate (CodeLlama 34B: 21.15%;
    DeepSeek: 16.14%) and commercial models at 5.2% (GPT-4 Turbo: 3.59%). 205,474
    unique hallucinated package names were discovered across 576,000 generated code
    samples. Hallucinated packages create slopsquatting attack vectors when adversaries
    register phantom names with malicious implementations. 58% of hallucinations repeat
    across multiple queries, making them high-value attacker targets.

    '
  remediation: 'Verify every package against PyPI (https://pypi.org/pypi/{package}/json)
    before installation. Use RAG-based package validation in LLM tooling. Implement
    dependency pinning with hashes in requirements.txt. Enable audit tools (pip-audit,
    safety) in CI/CD pipelines. Prefer well-known, widely-downloaded packages from
    established maintainers.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-002
  name: hallucinated-package-import-npm
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)require\(['"][a-z@][a-z0-9/@._-]{2,50}['"]\)
  - (?i)from\s+['"][a-z@][a-z0-9/@._-]{2,50}['"]\s+import
  - (?i)npm\s+install\s+[a-z@][a-z0-9/@._-]{3,50}\b
  - (?i)"dependencies"\s*:\s*\{
  file_types:
  - '*.js'
  - '*.ts'
  - '*.jsx'
  - '*.tsx'
  - '*.mjs'
  - package.json
  - '*.cjs'
  message: JavaScript/npm package reference in AI-generated code — verify existence
    in npm registry
  description: 'Detects npm package imports and dependency declarations in AI-generated
    JavaScript/TypeScript. Spracklen et al. (2024) found JavaScript hallucination
    rates of 5.2% (commercial) to 21.7% (open-source) across 16 LLMs. Krishna et al.
    (2025, ICML) found mean JavaScript PHR of 14.73% across 11 models (npm has 3.4M
    packages, providing partial namespace protection). Coding-specialized models show
    18.90% JavaScript PHR vs 9.71% for general-purpose models. Induced hallucinations
    occur at nearly 2x the rate of natural ones.

    '
  remediation: 'Verify packages via npm registry API (https://registry.npmjs.org/{package})
    before use. Use package-lock.json with integrity hashes. Run npm audit in CI/CD.
    Use Socket.dev or SocketAI (Zahan et al., 2024) for malicious package detection
    in npm. Prefer scoped packages (@org/package) to reduce typosquatting risk.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-003
  name: hallucinated-package-import-rust-cargo
  severity: HIGH
  category: slopsquatting
  patterns:
  - '(?i)use\s+[a-z][a-z0-9_]{2,30}::'
  - (?i)extern\s+crate\s+[a-z][a-z0-9_]{2,30}
  - (?i)cargo\s+add\s+[a-z][a-z0-9_-]{2,40}
  - (?i)\[dependencies\]
  file_types:
  - '*.rs'
  - Cargo.toml
  - Cargo.lock
  message: Rust/Cargo crate reference in AI-generated code — verify existence in crates.io
  description: 'Detects Rust crate imports and Cargo dependency declarations in AI-generated
    code. Krishna et al. (2025, ICML) found Rust has the highest Package Hallucination
    Rate of the three languages tested: mean PHR of 24.74% (Granite-3.0: 42.86%, Qwen2.5-Coder:
    43.08%, Codegemma: 42.20%). Crates.io has only 169,823 packages (vs npm''s 3.4M),
    providing a much larger unregistered namespace and thus greater slopsquatting
    attack surface. Even GPT-4o shows 10.99% PHR for Rust, notably higher than its
    Python (3.52%) rate.

    '
  remediation: 'Verify crates against crates.io API (https://crates.io/api/v1/crates/{crate})
    before adding. Use Cargo.lock for dependency pinning. Run cargo audit for known
    vulnerabilities. Manually review all crate additions in AI-generated Cargo.toml
    files.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-004
  name: phantom-package-naming-pattern
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(?:secure|safe|crypto|hash|auth|token)[a-z]{3,20}lib\b
  - (?i)(?:fast|quick|easy|simple|super)[a-z]{3,20}(?:util|helper|tool|kit)\b
  - (?i)(?:pyml|py-ml|ml-py|pyai|ai-py|nlp-py|py-nlp)[a-z0-9-]{0,20}\b
  - (?i)(?:requests|flask|django|numpy|pandas)-(?:plus|extra|extended|enhanced|pro)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.rs'
  - requirements.txt
  - package.json
  - Cargo.toml
  message: Package name matches common LLM hallucination naming patterns — verify
    in registry
  description: 'Detects package names that match patterns commonly generated by LLMs
    when hallucinating package names. Spracklen et al. (2024) identified that hallucinated
    packages often have high semantic similarity to legitimate packages — they sound
    plausible and follow naming conventions of real packages. Examples documented
    include ''securehashlib'' (Krishna et al.), ''hyper-h2'' (HFuzzer), and hundreds
    of variations of popular package names with modifiers. Al-Zofi (2025) confirms
    these AI-generated names constitute the primary slopsquatting attack surface,
    as they have no prior existence in any registry.

    '
  remediation: 'Query the relevant package registry API to verify existence before
    use. Be especially skeptical of AI-suggested packages that sound like combinations
    of well-known package names with security-related or descriptor suffixes.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-1021
- id: MEDUSA-SQ-SCAN-005
  name: ai-generated-code-unverified-dependencies
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)#\s*(?:generated|written|created)\s+(?:by|with|using)\s+(?:chatgpt|gpt|copilot|claude|gemini|ai|llm)
  - (?i)//\s*(?:generated|written|created)\s+(?:by|with|using)\s+(?:chatgpt|gpt|copilot|claude|gemini|ai|llm)
  - (?i)"ai.generated"\s*:\s*true
  - (?i)#\s*(?:ai-assisted|llm-generated|copilot-suggested)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.rs'
  - requirements.txt
  - package.json
  - Cargo.toml
  message: AI-generated code marker detected — all package references require registry
    verification
  description: 'Detects files explicitly marked as AI-generated or AI-assisted. Vangala
    et al. (2025, AAAI) found that only 68.3% of AI-generated projects execute out-of-the-box,
    with 10.5% of failures caused by missing/non-existent dependencies. LLM coding
    agents (Claude Code, Codex, Gemini) show a 13.5x expansion from declared to actual
    runtime dependencies. Latendresse et al. (2024) found that 6.5% of ChatGPT-recommended
    libraries did not work out of the box. All package references in AI-generated
    files are at elevated risk of hallucination.

    '
  remediation: 'Audit all package references in AI-generated files against their respective
    registries. Run the code in a clean sandbox environment to identify missing dependencies
    before deployment. Apply the three-layer dependency framework (Vangala et al.):
    verify claimed, working, and runtime dependencies separately.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-1104
- id: MEDUSA-SQ-SCAN-006
  name: security-phrase-induced-hallucination-risk
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)import\s+\S+\s+#.*(?:secure|encrypt|hash|auth|ssl|tls|crypto)
  - (?i)from\s+\S+\s+import.*(?:encrypt|decrypt|hash|sign|verify|token)
  - (?i)require\(['"]\S*(?:secure|crypto|hash|auth|ssl|tls)\S*['"]\)
  - '(?i)use\s+[a-z][a-z0-9_]*::(?:crypto|hash|auth|secure|tls|ssl)::'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.rs'
  message: Security-related package import — elevated hallucination risk, verify package
    registry existence
  description: 'Detects security-related package imports which carry elevated slopsquatting
    risk. The HFuzzer study (cited in Al-Zofi 2025) found that security-related phrases
    ("secure connection", "network handshake", "implement authentication") trigger
    package hallucinations at ~11.6% rate, notably higher than baseline. Krishna et
    al. (2025) documented ''securehashlib'' as a canonical hallucinated package example
    — a plausible security library name that was never registered. Attacker registration
    of security-themed phantom package names provides maximum malicious payload delivery
    opportunity (credential theft, key exfiltration).

    '
  remediation: 'For cryptographic operations, use only well-established, officially-documented
    packages (Python: cryptography, hashlib stdlib, pycryptodome; Node: node:crypto
    stdlib, bcrypt; Rust: ring, rustls). Never install security-critical packages
    solely on AI recommendation without independent verification of legitimacy and
    maintenance status.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-327
- id: MEDUSA-SQ-SCAN-007
  name: open-source-model-high-hallucination-risk
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)#.*(?:codellama|code.llama|codellamacode).*generated
  - (?i)#.*(?:deepseek|deep.seek|deepseek-coder).*generated
  - (?i)#.*(?:starcoder|star.coder|starcoder2).*generated
  - (?i)#.*(?:magicoder|wizardcoder|wizard.coder).*generated
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.rs'
  - requirements.txt
  - package.json
  message: Code from high-hallucination-rate open-source model detected — package
    verification mandatory
  description: 'Detects code annotated as generated by open-source LLMs with documented
    high Package Hallucination Rates. Spracklen et al. (2024) measured: CodeLlama
    34B: 21.15% (Python), 34.57% (JavaScript); CodeLlama 7B: 26.12% (Python), 35.71%
    (JavaScript); DeepSeek: 16.14% baseline. Krishna et al. (2025) found StarCoder2:
    27.03% (Python), 14.51% (JavaScript). Open-source models collectively hallucinate
    at 21.7% average vs 5.2% for commercial models. Code from these models has a ~1
    in 5 chance of containing at least one hallucinated package.

    '
  remediation: 'Mandate registry verification for all package references in code from
    open-source LLMs. Consider using commercial models (GPT-4 Turbo: 3.59%, Nemotron-70B:
    4.84%) for security-sensitive code generation. Apply fine-tuning (Spracklen et
    al.: 83% hallucination reduction for DeepSeek) or RAG-based package validation
    for production open-source deployments.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-1104
- id: MEDUSA-SQ-SCAN-008
  name: dependency-confusion-private-public-overlap
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)(?:--extra-index-url|--index-url)\s+https?://(?!pypi\.org|files\.pythonhosted\.org)
  - (?i)registry\s*=\s*['"]https?://(?!registry\.npmjs\.org)
  - (?i)\.npmrc.*registry\s*=\s*https?://(?!registry\.npmjs\.org)
  - (?i)replace\s*=\s*\{.*source\s*=\s*['"]https?://
  file_types:
  - '*.py'
  - requirements.txt
  - '*.cfg'
  - .npmrc
  - package.json
  - Cargo.toml
  - pip.conf
  message: Non-standard package registry URL — dependency confusion and slopsquatting
    risk
  description: 'Detects use of non-standard package registry URLs which create dependency
    confusion attack surfaces. Al-Zofi (2025) notes that slopsquatting extends dependency
    confusion (Birsan 2021) by adding AI-generated names to the attack surface. When
    LLMs suggest installing packages from private or alternative registries, the hallucination
    rate may differ, and attackers can register same-named packages in public registries
    with higher version numbers (dependency confusion). Birsan''s 2021 dependency
    confusion campaign successfully breached Apple, Microsoft, and PayPal using this
    technique.

    '
  remediation: 'Use scoped packages (@organization/package) for private registry packages.
    Configure registry allow-lists in .npmrc or pip.conf with explicit namespace restrictions.
    Implement SLSA provenance attestations for all private packages. Use dependency
    pinning with cryptographic hashes to prevent version confusion attacks.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-441
- id: MEDUSA-SQ-SCAN-009
  name: missing-dependency-lockfile
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)requirements\.txt\b
  - (?i)setup\.py\b
  - (?i)pyproject\.toml\b
  - (?i)package\.json\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.toml'
  - '*.cfg'
  - '*.txt'
  message: Dependency manifest without lockfile — pin exact versions to prevent slopsquatting
    drift
  description: 'Identifies dependency manifests that may lack corresponding lockfiles.
    Vangala et al. (2025) found a 13.5x expansion from declared (mean: 3 packages)
    to actual runtime dependencies (mean: 37 packages). Al-Zofi (2025) recommends
    dependency pinning with exact version numbers and lockfiles (package-lock.json,
    Pipfile.lock) as a key defense against slopsquatting and dependency confusion.
    Without lockfiles, AI-generated code may resolve to different (possibly malicious)
    package versions on each install, or attempt to install packages that were hallucinated
    and subsequently registered maliciously.

    '
  remediation: 'Always maintain lockfiles (Pipfile.lock, poetry.lock, package-lock.json,
    Cargo.lock). Pin dependencies with exact versions and cryptographic hashes (pip:
    --hash=sha256, npm: integrity). Review and update lockfiles in CI/CD to detect
    new malicious registrations.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-1104
- id: MEDUSA-SQ-SCAN-010
  name: high-temperature-verbose-code-generation-risk
  severity: MEDIUM
  category: slopsquatting
  patterns:
  - (?i)temperature\s*[=:]\s*(?:1\.[1-9]|[2-9]\.\d)
  - (?i)"temperature"\s*:\s*(?:1\.[1-9]|[2-9]\.\d)
  - (?i)top_p\s*[=:]\s*(?:0\.9[5-9]|1\.0)
  - (?i)"top_p"\s*:\s*(?:0\.9[5-9]|1\.0)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  message: High LLM temperature detected — elevated package hallucination rate in
    generated code
  description: 'Detects high temperature settings in LLM API calls used for code generation.
    Spracklen et al. (2024) found that hallucination rates increase dramatically with
    temperature values greater than 1, and that lower temperatures result in the lowest
    hallucination rate. Models with high temperature settings generate more unique,
    diverse package names — including hallucinated ones. The correlation between temperature,
    verbosity, and hallucination rate was confirmed across all 16 tested models. Using
    temperature > 1.0 for code generation tasks significantly amplifies slopsquatting
    risk.

    '
  remediation: 'Set temperature to 0.0-0.2 for code generation tasks requiring package
    imports. Use greedy decoding (temperature=0) for dependency specification. Apply
    RAG-based package validation as a post-processing step when higher temperatures
    are required.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-670
- id: MEDUSA-SQ-SCAN-011
  name: malicious-package-payload-pattern
  severity: CRITICAL
  category: slopsquatting
  patterns:
  - (?i)(?:subprocess|os)\.(?:system|popen|execv|execve).*(?:curl|wget|bash|sh|powershell)
  - (?i)__import__\(['"](?:os|subprocess|socket|urllib)['"]\)
  - (?i)exec\((?:compile|base64\.b64decode|bytes\.fromhex)
  - (?i)(?:setup\.py|__init__\.py).*(?:install_requires|setup_requires).*subprocess
  file_types:
  - '*.py'
  - setup.py
  - __init__.py
  - setup.cfg
  message: Malicious package payload pattern — potential slopsquatted package with
    malicious setup/init code
  description: 'Detects patterns characteristic of malicious packages registered under
    hallucinated names. Toda & Mori (2025) identified sophisticated multi-stage malicious
    PyPI packages using dynamic code execution, encrypted payloads, and subprocess
    calls in setup.py/__init__.py for immediate payload delivery on install. Zahan
    et al. (2024) identified data theft, arbitrary code execution, and suspicious
    domain callbacks as the top three categories of malicious npm packages. Slopsquatted
    packages (Al-Zofi 2025: Trend Micro red-team confirmed developers install slopsquatted
    packages) would deliver these payloads to developers who trust AI assistant recommendations.

    '
  remediation: 'Never install packages that execute arbitrary commands in setup.py
    or __init__.py. Use CHASE multi-agent analysis (Toda & Mori 2025) or SocketAI
    (Zahan et al.) for automated malicious package detection. Sandbox package installation
    in isolated environments. Report suspicious packages to PyPI/npm security teams
    immediately.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-78
- id: MEDUSA-SQ-SCAN-012
  name: rapid-exploitation-window-newly-registered-package
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)pip\s+install\s+--pre\s+[a-z][a-z0-9_-]{3,40}
  - (?i)pip\s+install\s+[a-z][a-z0-9_-]{3,40}==0\.0\.[0-9]
  - (?i)npm\s+install\s+[a-z][a-z0-9@/_-]{3,50}@0\.0\.[0-9]
  - (?i)cargo\s+add\s+[a-z][a-z0-9_-]{2,40}@0\.0\.[0-9]
  file_types:
  - '*.py'
  - '*.sh'
  - '*.bash'
  - '*.ps1'
  - '*.json'
  - Makefile
  - '*.yaml'
  message: Pre-release or version 0.0.x package install — high risk of newly-registered
    slopsquatted package
  description: 'Detects installation of pre-release or newly-created (version 0.0.x)
    packages. Al-Zofi (2025) documents that UTSA researchers found several hallucinated
    package names were registered by unknown actors before responsible disclosure,
    illustrating the rapid exploitation window. Slopsquatted packages are often registered
    at version 0.0.1 or 0.0.x to establish namespace control quickly. The similarity
    to Birsan''s 2021 dependency confusion campaign (which successfully infiltrated
    Apple, Microsoft, PayPal) demonstrates the immediate real-world impact of such
    registrations.

    '
  remediation: 'Avoid installing pre-release or very early version packages from AI
    recommendations. Verify package creation date and maintainer reputation via PyPI/npm
    registry APIs. Require minimum package age (e.g., > 30 days) and download count
    thresholds before installing AI-recommended packages in production environments.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-SQ-SCAN-013
  name: go-module-hallucinated-import
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)go\s+get\s+[a-z][a-z0-9._/-]{5,80}
  - (?i)import\s+"[a-z][a-z0-9._/-]{5,80}"
  - (?i)require\s+[a-z][a-z0-9._/-]{5,80}\s+v[0-9]
  - (?i)go\s+install\s+[a-z][a-z0-9._/-]{5,80}@
  file_types:
  - '*.go'
  - go.mod
  - go.sum
  message: Go module reference in AI-generated code — verify module path exists on
    pkg.go.dev before use
  description: 'Detects Go module import statements and go.mod dependency declarations
    in AI-generated code. Go modules use fully-qualified import paths (e.g., github.com/user/repo)
    which LLMs frequently hallucinate by constructing plausible-sounding paths for
    non-existent repositories. Krishna et al. (2025) and Spracklen et al. (2024) both
    found that smaller ecosystems carry higher per-package hallucination rates; Go
    proxy.golang.org indexes only publicly visible modules, leaving a large unoccupied
    namespace vulnerable to slopsquatting registration. AI-generated Go code is particularly
    vulnerable because valid-looking paths are trivially fabricated by combining common
    GitHub usernames, organization names, and project keywords.

    '
  remediation: 'Verify every Go module import path via pkg.go.dev or the Go module
    proxy (https://proxy.golang.org/{module}/@v/list) before running go get. Pin module
    versions in go.sum with cryptographic checksums. Use ''go mod verify'' to confirm
    all downloaded modules match their checksums. Prefer well-established modules
    from trusted organizations.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-014
  name: ruby-gem-hallucinated-install
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)gem\s+install\s+[a-z][a-z0-9_-]{2,50}
  - (?i)gem\s+['"][a-z][a-z0-9_-]{2,50}['"]
  - (?i)require\s+['"][a-z][a-z0-9_/-]{2,50}['"]
  - (?i)add_dependency\s+['"][a-z][a-z0-9_-]{2,50}['"]
  file_types:
  - Gemfile
  - Gemfile.lock
  - '*.gemspec'
  - '*.rb'
  message: Ruby gem reference in AI-generated code — verify gem exists on RubyGems.org
    before installation
  description: 'Detects Ruby gem install commands and Gemfile dependency declarations
    in AI-generated Ruby code. Al-Zofi (2025) identifies RubyGems as one of the six
    major registries vulnerable to slopsquatting alongside npm, PyPI, Maven Central,
    NuGet, and crates.io. Ruby gem names follow simple lowercase-with-hyphens patterns
    that LLMs readily hallucinate. The RubyGems registry hosts approximately 170,000
    gems, creating significant unoccupied namespace for attacker registration of AI-hallucinated
    gem names. Hallucinated security-related gems (e.g., for JWT, OAuth, encryption)
    present maximum risk for credential theft payloads.

    '
  remediation: 'Verify gems via the RubyGems API (https://rubygems.org/api/v1/gems/{gem}.json)
    before adding. Use Gemfile.lock for deterministic dependency resolution. Run ''bundle
    audit'' to check for known vulnerabilities. Consider using bundler-audit and Dependabot
    for continuous monitoring.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-829
- id: MEDUSA-SQ-SCAN-015
  name: java-maven-hallucinated-dependency
  severity: HIGH
  category: slopsquatting
  patterns:
  - (?i)<groupId>[a-z][a-z0-9._-]{2,80}</groupId>
  - (?i)<artifactId>[a-z][a-z0-9._-]{2,80}</artifactId>
  - (?i)implementation\s+['"][a-z][a-z0-9._:-]{5,100}['"]
  - (?i)compile\s+['"][a-z][a-z0-9._:-]{5,100}['"]
  file_types:
  - pom.xml
  - build.gradle
  - build.gradle.kts
  - '*.xml'
  message: Java/Maven artifact reference in AI-generated code — verify groupId:artifactId
    on Maven Central
  description: 'Detects Maven/Gradle dependency declarations in AI-generated Java/Kotlin
    code. Vangala et al. (2025) found Java has the worst AI-generated code execution
    rate at only 44% success, with extremely high dependency specification failures.
    Maven Central uses domain-based groupId conventions that provide some protection
    (e.g., com.google, org.apache), but LLMs hallucinate plausible groupId:artifactId
    combinations for non-existent artifacts. Al-Zofi (2025) notes that Maven Central''s
    domain-based groupId system provides implicit slopsquatting mitigation compared
    to flat namespaces, but fabricated com.example or io.github groupIds remain exploitable.
    Java is the most vulnerable language for AI-generated code execution failures
    (56% failure rate), creating high developer pressure to install unverified packages
