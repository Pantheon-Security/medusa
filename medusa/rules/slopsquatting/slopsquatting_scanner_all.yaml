    lacks any hash verification capability, making it particularly dangerous.

    '
  remediation: 'Always use pip install with --require-hashes and pin exact versions
    in requirements.txt. Generate hash-pinned requirements files using: pip-compile
    --generate-hashes. Replace easy_install with pip. Use pip-audit to scan installed
