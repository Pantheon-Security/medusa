  message: LLM training data referencing package installations — dataset may encode
    hallucinated package patterns
  description: 'Detects references to LLM training datasets that include package installation
    commands. Spracklen et al. (2024) demonstrated that fine-tuning on hallucination-free
    code samples reduces PHR by 61-83%. Conversely, training datasets that include
    code with hallucinated package names will reinforce those hallucination patterns.
    If AI-generated code (which has 19.7% hallucinated package references) is fed
    back into training datasets without filtering, the resulting model will have higher
    PHR than its predecessor. Dataset poisoning via hallucinated package names represents
    a second-order slopsquatting risk: attackers who can influence training data selection
    can increase hallucination rates for specific target package names.

    '
  remediation: 'Filter training datasets to remove code samples containing unregistered
    package references. Apply Spracklen et al.''s fine-tuning methodology with hallucination-free
    sample filtering. Implement registry verification as a preprocessing step for
    all code training data. Monitor PHR metrics across model versions to detect dataset
    poisoning effects.

    '
