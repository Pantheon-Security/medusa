    files. Al-Zofi (2025) recommends exact version pinning with lockfiles as a key
    defense against slopsquatting. Unpinned dependencies (e.g., ''requests'' or ''requests>=2.0'')
    allow pip to resolve to the latest version, which could be a newly-registered
    malicious version of an otherwise legitimate package name. For AI-hallucinated
    package names, version-range specifications are irrelevant (the name doesn''t
    exist) but once an attacker registers the package, any version range specification
    will match their malicious implementation. Vangala et al. (2025) found only 3
    declared dependencies on average in AI-generated code.

    '
  remediation: 'Pin all dependencies to exact versions: ''requests==2.31.0'' not ''requests>=2.0''.
    Add hash verification: use ''pip-compile --generate-hashes'' to create hash-pinned
