rules:
- category: voice_audio_attacks
  cwe: CWE-346
  description: Detects imports of robust audio adversarial example generation libraries targeting DeepSpeech ASR
  file_types:
  - '*.py'
  id: VA-001
  message: 'Detected: robust-audio-adversarial-import'
  name: robust-audio-adversarial-import
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(from|import)\s+(audio_adversarial|robust_audio_adv|adversarial_audio)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yakura & Sakuma (2019) - Robust physical audio adversarial examples using band-pass filtering and impulse
    response simulation
- category: voice_audio_attacks
  cwe: CWE-346
  description: Detects adversarial perturbation crafting against DeepSpeech speech recognition models
  file_types:
  - '*.py'
  id: VA-002
  message: 'Detected: deepspeech-adversarial-craft'
  name: deepspeech-adversarial-craft
  owasp_llm: LLM01:2025
  patterns:
  - (?i)deepspeech.*adversarial|adversarial.*deepspeech|ctc_loss.*perturbation
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yakura & Sakuma (2019) - CTC loss-based adversarial optimization against DeepSpeech
- category: voice_audio_attacks
  cwe: CWE-346
  description: Detects impulse response simulation for over-the-air audio adversarial robustness
  file_types:
  - '*.py'
  id: VA-003
  message: 'Detected: impulse-response-simulation'
  name: impulse-response-simulation
  owasp_llm: LLM01:2025
