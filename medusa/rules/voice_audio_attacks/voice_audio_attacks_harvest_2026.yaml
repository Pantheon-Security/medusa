version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: voice_audio_attacks
rules:
- id: MEDUSA-VAA-SCAN-101
  name: lipfuzzer-import
  description: Detects import or usage of the LipFuzzer fuzzing tool for NLU intent
    classifier attacks.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+lipfuzzer\b
  - (?i)lipfuzzer\s*=\s*(?:LipFuzzer|True|1)
  file_types:
  - '*.py'
  message: Detected LipFuzzer fuzzing tool for voice assistant semantic misinterpretation
    attacks.
  remediation: '- Remove LipFuzzer from production code.

    - Use intent classification with strict matching and validation.'
  owasp_llm: LLM02:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Zhang et al. (2019) -- Life after Speech Recognition: Fuzzing Semantic
    Misinte | LipFuzzer: linguistic-model-guided fuzzing of NLU intent classifiers
    – 71% of Amazon Alexa and 29% of Google Assistant vApps vulnerable'
  fp_guards:
  - import lipreading as lipfuzzer
  - lipfuzzer is not a known library
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-102
  name: lapsus-model-usage
  description: Detects loading or usage of LAPSUS linguistic models for generating
    semantic misinterpretation attacks.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)\blapsus\s*_?\s*model
  - (?i)(?:load|read|open)\s*\(\s*['"][^'"]*lapsus
  - (?i)lapsus_models?\s*=
  file_types:
  - '*.py'
  - '*.json'
  - '*.pkl'
  message: Detected LAPSUS linguistic model used for generating misinterpretation
    voice commands.
  remediation: '- Remove LAPSUS model files from deployment.

    - Ensure NLU intent classification is not influenced by external linguistic models.'
  owasp_llm: LLM02:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Zhang et al. (2019) -- Life after Speech Recognition: Fuzzing Semantic
    Misinte | LipFuzzer uses LAPSUS models to query linguistic knowledge and fuzz
    voice command templates'
  fp_guards:
  - lapsus_model is a variable name
  - from lapsus import lapsus_model
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-103
  name: bayesian-network-attack-model
  description: Detects construction or usage of Bayesian Networks for modeling linguistic
    attacks on voice assistants.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)BayesianNetwork\s*\(.{0,40}lapsus
  - (?i)(?:from\s+pgmpy|import\s+BayesianNetwork)
  - (?i)BN\s*=\s*\w*Lapsus|Lapsus.{0,40}BN
  file_types:
  - '*.py'
  message: Detected Bayesian Network attack model for linguistic fuzzing of NLU intent
    classifiers.
  remediation: '- Remove Bayesian Network attack modeling code.

    - Use intent classifiers with proven robustness against fuzzing.'
  owasp_llm: LLM02:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Zhang et al. (2019) -- Life after Speech Recognition: Fuzzing Semantic
    Misinte | LipFuzzer formulates Bayesian Networks from linguistic knowledge to
    guide mutation fuzzing'
  fp_guards:
  - import BayesianNetwork from pgmpy for educational purposes
  - BayesianNetwork is used for medical diagnosis
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-104
  name: nlp-mutation-fuzzing
  description: Detects NLP preprocessing or mutation engine designed for generating
    adversarial voice commands.
  severity: high
  category: voice_audio_attacks
  patterns:
  - (?i)LipFuzzer\.(?:MutationEngine|NLPPreprocessing)
  - (?i)class\s+MutationEngine\s*\(.{0,40}LipFuzzer
  file_types:
  - '*.py'
  message: Detected NLP mutation engine used for generating malicious voice commands.
  remediation: '- Remove custom mutation engine code.

    - Apply input validation on voice command templates.'
  owasp_llm: LLM02:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Zhang et al. (2019) -- Life after Speech Recognition: Fuzzing Semantic
    Misinte | LipFuzzer includes NLP preprocessing and mutation engine to mutate phoneme,
    vocabulary, and grammar fields'
  fp_guards:
  - 'class MutationEngine:  # for evolutionary algorithms'
  - from nlp.preprocessing import NLPPreprocessing
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-105
  name: cmu-pronouncing-dictionary-attack
  description: Detects usage of CMU Pronouncing Dictionary for pronunciation-based
    mutation in voice assistant attacks.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)cmudict\.dictionary\(\)
  - (?i)cmu[_-]?pronouncing
  file_types:
  - '*.py'
  message: Detected CMU Pronouncing Dictionary usage, which can be used for pronunciation-level
    fuzzing.
  remediation: '- Review usage of pronunciation dictionaries in security contexts.

    - Restrict access to phonetic data in production.'
  owasp_llm: LLM02:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Zhang et al. (2019) -- Life after Speech Recognition: Fuzzing Semantic
    Misinte | LipFuzzer uses CMU Pronouncing Dictionary via NLTK for phoneme extraction'
  fp_guards:
  - 'from cmudict import cmudict  # for speech recognition training'
  - cmu_pronouncing is used in text-to-speech system
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-106
  name: perturbation-engine-tdi-rpg-audio-attack
  description: Detects code implementing Time Domain Inversion (TDI) or Random Phase
    Generation (RPG) perturbation methods for hidden voice attacks. These methods
    modify audio in the time or phase domain while preserving the magnitude spectrum,
    used to generate adversarial audio that VPSes transcribe correctly but humans
    perceive as noise.
  severity: high
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+.{0,40}perturbation.{0,40}engine.{0,40}
  - (?i)\b(tdi|rpg)\s*=\s*[{(\['"]
  - (?i)\bperturbation_engine\(.{0,40}(?:tdi|rpg|phase|window)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: Detected code implementing TDI or RPG perturbation methods for hidden voice
    attacks. These methods can generate audio that is unintelligible to humans but
    correctly processed by speech recognition systems.
  remediation: '- Review the purpose and intended use of TDI/RPG perturbation code.

    - If part of an attack toolkit, remove or sandbox the code.

    - Ensure that any audio processing pipeline includes detection of such perturbations
    (e.g., phase coherence checks).

    - Implement input validation and anomaly detection for audio feature vectors.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1556.007
  source_paper: 'Abdullah et al. (2019) -- Practical Hidden Voice Attacks against
    Speech and Speak | Paper: Practical Hidden Voice Attacks against Speech and Speaker
    Recognition Systems (NDSS 2019); methods: Time Domain Inversion (TDI) and Random
    Phase Generation (RPG); target models: 12 black-box VPSes including Google Speech
    API, Bing Speech API, IBM Speech API, etc.'
  fp_guards:
  - from research.audio import tdi_feature
  - '# Implement TDI for audio denoising project'
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-107
  name: high-frequency-addition-perturbation
  description: Detects code adding high-frequency sine waves to audio to mask commands,
    as described in HFA perturbation. These frequencies are filtered out during VPS
    preprocessing but can be used to create attack audio that is unintelligible to
    humans.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)\b(?:generate|add)_high_freq\(|high_freq.{0,40}sine\(|freq.{0,40}mask.{0,40}audio\b
  - (?i)\bsin\(.{0,40}2\s*\*\s*math\.pi\s*\*\s*freq\)
  file_types:
  - '*.py'
  - '*.m'
  - '*.ipynb'
  message: Detected code that adds high-frequency sine waves to audio. This technique
    is used in the HFA perturbation to mask voice commands from human hearing while
    allowing VPS transcription.
  remediation: '- Investigate the context of high-frequency sine wave addition.

    - If used for attack generation, remove or restrict the code.

    - Implement audio preprocessing filters that detect and remove unexpected high-frequency
    components.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1556.007
  source_paper: 'Abdullah et al. (2019) -- Practical Hidden Voice Attacks against
    Speech and Speak | Paper: Practical Hidden Voice Attacks against Speech and Speaker
    Recognition Systems (NDSS 2019); method: High Frequency Addition (HFA); target
    models: multiple VPSes.'
  fp_guards:
  - 'freq = np.fft.fftfreq(n); sine = np.sin(2 * np.pi * 440 * t)  # legitimate tuning
    reference'
  - 'high_freq = np.sin(2 * np.pi * 20000 * t)  # used for ultrasonic testing'
  pipeline_confidence: high
  action: log
- id: MEDUSA-VAA-SCAN-108
  name: time-scaling-audio-perturbation
  description: Detects code implementing time scaling (speed perturbation) to accelerate
    voice commands while maintaining intelligibility for VPSes, as per TS perturbation.
    This method compresses audio in time domain to make commands harder for humans
    to understand.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)\b(resample|time_stretch|speed_change)\s*\(.{0,40}\b(?:factor|rate|scale)\b
  - (?i)\blibrosa\.effects\.time_stretch\b
  - (?i)\bsoundfile\.write\(.{0,40}\b(speed|accelerat|stretch)\b
  file_types:
  - '*.py'
  - '*.m'
  - '*.ipynb'
  message: Detected time scaling or speed perturbation of audio, which can be used
    as part of a hidden voice attack to accelerate commands beyond human comprehension
    while keeping VPS accuracy.
  remediation: '- If part of an attack pipeline, remove or sandbox the code.

    - Implement checks for unusual speech rate or spectral irregularities.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1556.007
  source_paper: 'Abdullah et al. (2019) -- Practical Hidden Voice Attacks against
    Speech and Speak | Paper: Practical Hidden Voice Attacks against Speech and Speaker
    Recognition Systems (NDSS 2019); method: Time Scaling (TS); target models: 12
    VPSes.'
  fp_guards:
  - 'rate_orig = sr; y_stretched = librosa.effects.time_stretch(y, rate=0.8)  # slow
    down for analysis'
  - soundfile.write('output.wav', audio, samplerate, subtype='PCM_16')
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-109
  name: perturbation-engine-tdi-rpg-audio-attack
  description: Detects audio perturbation engine using Time Domain Inversion (TDI)
    or Random Phase Generation (RPG) with configurable window sizes, as described
    in the paper with 100% ASR across 12 models.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:time|tdi|rpg|domain).{0,20}(?:inversion|phase|perturb)
  - (?i)(?:window_size|win_size|window_length)\s*(?:=|:)\s*\d+
  - (?i)(?:from|import)\s+perturbation_engine\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: Detected audio perturbation engine using TDI/RPG techniques; this tool
    can generate hidden voice commands that bypass human perception.
  remediation: '- Review and restrict use of audio perturbation tools like Perturbation
    Engine (PE)

    - Implement audio input validation and anomaly detection on MFCC feature vectors

    - Use voice biometric liveness detection to prevent replay/perturbation attacks'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1557.001
  source_paper: 'Abdullah et al. (2019) -- Abdullah - Practical Hidden Voice Attacks
    against Speec | Abdullah et al. 2019 NDSS: Practical Hidden Voice Attacks; 100%
    ASR on 12 models incl. Google, Bing, IBM, Azure'
  fp_guards:
  - 'def process_audio(window_size=256, sample_rate=16000):'
  - 'time_domain_inversion = False  # disabled in production'
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-110
  name: high-frequency-addition-perturbation
  description: Detects code that adds high frequency sine waves (>8kHz) to audio,
    a technique used to mask voice commands (100% ASR on tested models).
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)(?:np\.sin|math\.sin|sin)\s*\(\s*2\s*\*\s*(?:np\.pi|math\.pi|pi)\s*\*\s*(?:freq|frequency)
  file_types:
  - '*.py'
  - '*.m'
  - '*.ipynb'
  message: Detected high frequency sine wave addition to audio; used by Hidden Voice
    Attack to mask commands.
  remediation: '- Monitor use of high-frequency generation libraries (numpy, scipy)

    - Apply bandpass filters to remove out-of-band frequencies in VPS input

    - Educate developers against adding high-frequency noise to audio data'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Abdullah et al. (2019) -- Abdullah - Practical Hidden Voice Attacks
    against Speec | Abdullah et al. 2019 NDSS: Practical Hidden Voice Attacks; HFA
    technique, 100% ASR on multiple models'
  fp_guards:
  - 'freq = np.fft.fftfreq(n, d=1/16000)  # legitimate FFT'
  - 'sine_wave = np.sin(2 * np.pi * 440 * t)  # tuning note'
  pipeline_confidence: high
  action: log
- id: MEDUSA-VAA-SCAN-111
  name: noise-flooding-import
  description: Detects import of noise flooding defense code from the paper's GitHub
    repository or usage of its core algorithm.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+noise_flooding\b
  - (?i)github\.com/LincLabUCCS/Noise-Flooding
  file_types:
  - '*.py'
  - '*.sh'
  message: Detected noise flooding defense code from Rajaratnam et al. 2018 paper.
  remediation: '- Ensure this is used for authorized security testing only.

    - Review integration points for false positive impacts on benign audio.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Rajaratnam et al. (2018) -- Noise Flooding for Detecting Audio Adversarial
    Examples | Noise Flooding for Detecting Audio Adversarial Examples (2018) - detection
    defense for Speech Commands model.
  fp_guards:
  - 'ProcessMetrics: {TotalRss: 100MB, FloodingScore: 0.9}'
  - The noise_flooding approach is discussed in the literature review section.
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-112
  name: bandpass-filter-noise-flooding
  description: Detects custom band-pass filtering logic for audio noise flooding as
    described in the paper.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)band[-_]?pass\s*filter
  - (?i)scipy\.signal\.butter\s*\([^)]*\b(?:0-2000|2000-4000|4000-6000|6000-8000)\b
  file_types:
  - '*.py'
  message: Detected band-pass filter targeting specific frequency bands for noise
    flooding.
  remediation: '- Verify that audio preprocessing includes proper band-pass filtering.

    - Ensure band-pass parameters are not used to evade detection.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Rajaratnam et al. (2018) -- Noise Flooding for Detecting Audio Adversarial
    Examples | Noise Flooding paper: uses scipy.signal.butter to filter noise into
    bands (0-2000Hz, 2000-4000Hz, etc.).'
  fp_guards:
  - scipy.signal.butter(4, [100, 300], btype='band', fs=44100)
  - The band-pass filter was applied to remove noise above 4kHz for speech enhancement.
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-113
  name: xgboost-ensemble-flooding
  description: Detects training or loading of an XGBoost classifier for noise flooding
    score ensemble as the paper's best defense.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)xgboost\.(?:XGBClassifier|train)
  - (?i)from\s+xgboost\s+import\s+XGBClassifier
  file_types:
  - '*.py'
  message: Detected XGBoost ensemble for noise flooding adversarial detection.
  remediation: '- Use only for authorized security testing.

    - Monitor for false positives when applied to benign audio.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Rajaratnam et al. (2018) -- Noise Flooding for Detecting Audio Adversarial
    Examples | Noise Flooding paper: XGBoost ensemble achieved best F1=0.926 on Speech
    Commands adversarial detection.'
  fp_guards:
  - from xgboost import XGBRegressor; model = XGBRegressor()
  - The XGBoost ensemble for adversarial detection requires scoring threshold tuning.
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-114
  name: audio-fingerprint-memory-mechanism
  description: Detects use of audio fingerprint similarity and memory sequence to
    identify query-based adversarial attacks on ASR.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)\b(?:audio\s*fingerprint|fingerprint\s*similarity|memory\s*mechanism)\b.{0,40}(?:adversarial|attack|detect|defense)
  - (?i)(?:from\s+.{0,40}import|import\s+).{0,40}\b(?:fingerprint|audfprint|pyaudioanalysis|dejavu)\b
  - (?i)\b(?:k\s*=\s*75|threshold\s*[=:].{0,40}0\.31[0-9]{3,}|memory\s*depth\s*[=:].{0,40}75\b)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: Detected audio fingerprint memory mechanism for adversarial attack detection.
  remediation: '- Evaluate if memory mechanism is used for security monitoring.

    - Ensure it does not introduce privacy concerns.

    - Consider adversarial robustness of fingerprint extraction.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: T1059
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: universal defense for query-based audio adversarial
    attacks, 90%+ DSR on CommanderSong, Devil''s Whisper, IRTA, DS attacks.'
  fp_guards:
  - fingerprint_similarity = compute_cosine_similarity(embedding_a, embedding_b)
  - 'memory_depth = 75  # hyperparameter for sequence analysis'
  pipeline_confidence: high
  action: log
- id: MEDUSA-VAA-SCAN-115
  name: commander-song-attack-import
  description: Detects CommanderSong attack implementation using Kaldi and music-carrier
    adversarial examples.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+.{0,40}\bcommander\s*song\b
  - (?i)\bcmd\s*=\s*['"]play\s+music\b
  - (?i)\bkaldi\b.{0,40}\badversarial\b
  file_types:
  - '*.py'
  message: 'CommanderSong attack code detected: music-carrier adversarial attack on
    Kaldi.'
  remediation: '- Remove or isolate CommanderSong attack code.

    - Implement input validation for music files.

    - Use audio fingerprint memory defense.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1098
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: CommanderSong attack on Kaldi, 100% SRoA, music-carrier.'
  fp_guards:
  - from kaldi import recognize as kaldi_recognize
  - 'import commander  # not CommanderSong'
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-116
  name: devils-whisper-attack-import
  description: Detects Devil's Whisper black-box attack using substitute model and
    commercial API queries.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+.{0,40}\bdevils\s*whisper\b
  - (?i)\bsubstitute\s*model\b.{0,40}\bapi\b.{0,40}\badversarial\b
  - (?i)\bgoogle\s*(?:assistant|speech)\b.{0,40}\battack\b
  file_types:
  - '*.py'
  message: 'Devil''s Whisper black-box attack code detected: targets commercial ASR
    APIs.'
  remediation: '- Remove or isolate Devil''s Whisper attack code.

    - Implement rate limiting on API queries.

    - Use fingerprint similarity monitoring.'
  owasp_llm: LLM01:2025
  cwe: CWE-200
  mitre_attack: T1041
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: Devil''s Whisper attack on commercial APIs, 98% SRoA,
    music-carrier.'
  fp_guards:
  - 'from whisper import transcribe  # not Devil''s Whisper'
  - 'import devils  # not the attack'
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-117
  name: irta-attack-import
  description: Detects Imperceptible Robust Targeted Adversarial (IRTA) attack using
    psychoacoustic masking on Lingvo.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:irta|imperceptible.{0,20}robust.{0,20}targeted)\b.{0,40}\badversarial\b
  - (?i)\blingvo\b.{0,40}\battack\b
  - (?i)\bpschoacoustic\s*masking\b.{0,40}\badversarial\b
  file_types:
  - '*.py'
  message: 'IRTA attack code detected: psychoacoustic masking adversarial attack on
    Lingvo.'
  remediation: '- Remove IRTA attack code.

    - Implement psychoacoustic detection mechanisms.

    - Monitor query frequency and similarity.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1098
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: IRTA attack on Lingvo, 100% SRoA, ~5000 queries,
    FSNR 40.97dB.'
  fp_guards:
  - 'import irta as irta_module  # not the attack'
  - from lingvo import model
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-118
  name: ds-attack-import
  description: Detects DeepSpeech adversarial attack using CTC-loss optimization.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)(?:ctc.{0,20}loss|ctcloss).{0,40}adversarial
  - (?i)\bdeepspeech\b.{0,40}\badversarial\b
  - (?i)(?:from|import).{0,40}\bds_attack\b
  file_types:
  - '*.py'
  message: 'DeepSpeech adversarial attack code detected: CTC-loss based attack.'
  remediation: '- Remove DS attack code.

    - Update DeepSpeech to robust version.

    - Implement fingerprint memory defense.'
  owasp_llm: LLM01:2025
  cwe: CWE-94
  mitre_attack: T1098
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: DS attack on DeepSpeech, 100% SRoA, ~1000 queries.'
  fp_guards:
  - 'import deepspeech as ds  # benign usage'
  - 'ctc_loss = tf.nn.ctc_loss(labels, logits)  # benign training'
  pipeline_confidence: medium
- id: MEDUSA-VAA-SCAN-119
  name: music-carrier-dataset
  description: Detects music-carrier dataset used for generating audio adversarial
    examples (Music-sets).
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)\bmusic.sets?\b.{0,40}\.(?:wav|mp3|flac)
  - (?i)\b10[\.,]553\b.{0,40}\bmusic\b
  - (?i)\bmusic.base[d]?\s*adversarial\b
  file_types:
  - '*.csv'
  - '*.json'
  - '*.txt'
  message: Music-carrier adversarial dataset detected (Music-sets from Guo et al.
    2023).
  remediation: '- Review dataset for adversarial usage.

    - Apply audio fingerprint defense.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Guo et al. (2023) -- Towards the universal defense for query-based
    audio adv | Guo et al. 2023: Music-sets dataset of 10,553 music clips for adversarial
    attacks.'
  fp_guards:
  - 'music = load_audio(''song.wav'')  # benign music library'
  - 'dataset_size = 10553  # not necessarily adversarial'
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-120
  name: high-frequency-addition-perturbation
  description: Detects implementations of the High Frequency Addition (HFA) perturbation
    method from the paper. HFA adds high-frequency sine waves to mask the underlying
    audio command, leveraging psychoacoustic effects.
  severity: low
  category: voice_audio_attacks
  patterns:
  - (?i)(?:from|import)\s+high_frequency_addition\b
  - (?i)(?:high.?frequency.?addition|hfa)\s*\(.{0,40}(?:sine|frequency|mask)
  file_types:
  - '*.py'
  message: Detected High Frequency Addition (HFA) perturbation implementation.
