  description: Detects code generating attack audio using Perturbation Engine with
    TDI or RPG techniques for hidden voice attacks against VPSes.
  severity: high
  category: voice_audio_attacks
  patterns:
  - (?i)\bperturbation_engine\b.{0,60}\b(?:TDI|RPG|window)\b
  - (?i)(?:TDI|RPG)\s*\(\s*.{0,40}\s*window_size\s*=
  - (?i)apply_perturbation\s*\(\s*(?:audio|signal)
  file_types:
  - '*.py'
  message: Detected Perturbation Engine usage with TDI/RPG for hidden voice attack
    generation.
  remediation: '- Remove Perturbation Engine from production.

    - Validate audio features for window inversion or random phase artifacts.

    - Use anomaly detection on feature vectors.'
  owasp_llm: LLM07:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Abdullah et al. (2019) -- Abdullah - Practical Hidden Voice Attacks
    against Speec | Paper 'Practical Hidden Voice Attacks' - Perturbation Engine generates
    >20,000 samples, tested against 12 VPSes.
  fp_guards:
  - 'import signal_processing

    # standard audio filtering

    filtered = signal_processing.low_pass(audio, cutoff=8000)'
  - 'ProcessMetrics: {PerturbationEngine: false, Total: 0}'
  pipeline_confidence: high
- id: MEDUSA-VAA-SCAN-160
  name: high-frequency-addition-perturbation
  description: Detects code adding high-frequency sine waves (>=8000 Hz) to audio,
    mimicking HFA perturbation for hidden voice attacks.
  severity: medium
  category: voice_audio_attacks
  patterns:
  - (?i)\b(?:sine|sin)\s*\(\s*2\s*\*\s*(?:np|math)\.pi\s*\*\s*[89][0-9]{3,}
  - (?i)\bfreq(?:uency)?\s*[>=]\s*8000\b.{0,40}\b(?:sine|mask|add|mix)
  - (?i)\bhigh[_-]?freq(?:uency)?[_-]?add(?:ition)?\b
  file_types:
  - '*.py'
  message: Detected high-frequency addition pattern matching HFA perturbation for
    hidden voice attacks.
  remediation: '- Remove high-frequency mixing code.

    - Add band-stop filter to suppress frequencies above 8kHz before VPS.

    - Monitor for unusual high-frequency components.'
  owasp_llm: LLM07:2025
  cwe: CWE-693
  mitre_attack: null
  source_paper: Abdullah et al. (2019) -- Abdullah - Practical Hidden Voice Attacks
    against Speec | Paper 'Practical Hidden Voice Attacks' - HFA with sine waves at
    12-14kHz masks speech, 100% ASR on Google Client API.
  fp_guards:
  - 'import numpy as np

