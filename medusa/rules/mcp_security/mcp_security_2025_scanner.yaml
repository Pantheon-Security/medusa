rules:
- id: MEDUSA-MCP-SCAN-048
  name: trade-tool-response-adversarial-injection
  severity: HIGH
  category: indirect_prompt_injection
  patterns:
  - (?i)(trade.{0,20}(tool.response|adversarial.data.exploit|indirect.instruct))
  - (?i)(tool.response.{0,30}(adversarial|indirect.instruct|hidden.command|inject))
  - (?i)(indirect.instruct.{0,30}(tool.response|external.data|mcp.result).{0,30}(exec|follow|obey))
  - (?i)(tool.output.{0,30}(hidden.instruct|adversarial|malicious.command).{0,30}(agent|llm|model))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: TRADE (Tool Response Adversarial Data Exploitation) — indirect prompt injection via adversarial data
    embedded in tool responses (8.5% strict refusal)'
  description: 'TRADE (Tool Response Adversarial Data Exploitation) embeds adversarial instructions within tool/API responses
    that are processed by LLM agents. Only 8.5% of tested models refuse TRADE attacks strictly. The attack exploits the agent''s
    trust in external data: tool responses containing hidden instructions are executed as if they were legitimate user commands.
    Particularly effective when agents lack output sanitization for tool responses.'
  remediation: Treat all tool outputs as untrusted external data. Apply strict output sanitization to tool responses before
    agent processing. Implement sandboxed tool result interpretation that cannot re-invoke tools. Log all tool response contents
    for audit. Never allow tool responses to modify agent instruction set or override safety constraints.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-MCP-SCAN-049
  name: falsely-benign-attack-zero-refusal
  severity: CRITICAL
  category: indirect_prompt_injection
  patterns:
  - (?i)(falsely.benign.{0,30}(attack|fba|tool.response|mcp))
  - (?i)(fba.{0,30}(mcp|tool|agent).{0,30}(zero.refusal|bypass|evade.safety))
  - (?i)(benign.appearing.{0,40}(hidden.instruct|covert.command|malicious.payload).{0,30}tool)
  - (?i)(zero.refusal.{0,30}(tool.response|indirect.inject|fba).{0,30}(safety|guardrail|filter))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Falsely Benign Attack (FBA) — tool responses appearing benign while containing hidden instructions,
    achieving 0% strict refusal rate'
  description: Falsely Benign Attacks (FBAs) construct tool responses that appear completely benign to safety filters and
    human reviewers but contain hidden adversarial instructions. Unlike TRADE (8.5% refusal), FBAs achieve 0% strict refusal
    because the payload is structured to evade all safety classifiers. The benign framing (e.g., normal document content,
    API response data) conceals the instruction payload. Extremely dangerous in MCP environments where tool outputs are processed
    with high trust.
  remediation: 'Apply dual-layer analysis: surface safety check plus semantic intent analysis of all tool outputs. Implement
    behavioral monitoring for unexpected agent actions following tool calls. Use semantic similarity to detect if tool responses
    semantically resemble instruction-following patterns. Apply zero-trust model to all external data regardless of apparent
    benignness.'
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-MCP-SCAN-050
  name: rug-pull-malicious-tool-behavior-switch
  severity: CRITICAL
  category: supply_chain
  patterns:
  - (?i)(rug.pull.{0,30}(mcp|tool|server|plugin).{0,30}(behavior.switch|malicious|trust))
  - (?i)(tool.{0,20}(rug.pull|bait.switch|behavior.change).{0,30}(mcp|agent|trusted))
  - (?i)(mcp.server.{0,30}(update|switch|change).{0,40}(malicious|behavior|rug.pull))
  - (?i)(trusted.tool.{0,30}(turned.malicious|behavior.switch|rug.pull|bait.and.switch))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Rug Pull — MCP tool appearing legitimate then switching to malicious behavior (80% ASR)'
  description: 'Rug Pull attacks involve MCP tools or servers that initially operate legitimately to gain trust and deployment,
    then switch to malicious behavior (e.g., after gaining user trust or following an update). Achieves 80% ASR. Common vectors:
    post-update behavior change, time-delayed activation, condition-triggered switch. Analogous to supply chain attacks but
    targeting deployed MCP tool infrastructure. Particularly dangerous in enterprise settings where MCP tools are deployed
    with elevated permissions.'
  remediation: Pin MCP server versions and verify cryptographic signatures before any updates. Implement behavioral baseline
    monitoring to detect behavioral shifts in established tools. Use sandboxed execution environments for all MCP tools. Apply
    continuous runtime behavioral auditing — not just initial deployment checks. Implement tool behavior regression testing
    after every update.
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-MCP-SCAN-051
  name: shadowing-attack-tool-hijack-mcp
  severity: HIGH
  category: tool_manipulation
  patterns:
  - (?i)(shadow.{0,20}(attack|tool|mcp).{0,30}(hijack|spoof|intercept|highjack))
  - (?i)(tool.shadow.{0,30}(hijack|intercept|mcp|override|replace))
  - (?i)(mcp.tool.{0,30}(shadow|spoof|intercept|hijack).{0,30}(request|response|output))
  - (?i)(shadowing.efficacy.{0,30}(7|8|9|10).{0,10}(mcp|tool|attack|eff))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Shadowing Attack — malicious MCP tool intercepting and hijacking legitimate tool calls (efficacy 7.79,
    80% ASR)'
  description: Shadowing Attacks in MCP environments deploy a malicious tool that intercepts and hijacks requests intended
    for legitimate tools. The shadow tool presents the same interface as the target tool but returns attacker-controlled responses
    while potentially also forwarding requests to mask the attack. Achieves efficacy 7.79 (on 10-point scale) and 80% ASR.
    The attack exploits lack of tool authentication in MCP — agents cannot verify they're communicating with the legitimate
    tool vs. a shadow.
  remediation: Implement cryptographic authentication for all MCP tool endpoints. Use TLS mutual authentication to prevent
    tool impersonation. Apply tool identity verification at each call site. Monitor for unexpected tool endpoint changes or
    response anomalies. Never trust tool identity based on name/URL alone — require cryptographic proof of tool authenticity.
  owasp_llm: LLM08:2025
  cwe: CWE-345
- id: MEDUSA-MCP-SCAN-052
  name: p-dos-prompt-tokens-resource-exhaustion
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(p.dos|prompt.dos|prompt.denial.of.service).{0,40}(token|resource|exhaust|cost)
  - (?i)(token.exhaust.{0,30}(tool|mcp|agent).{0,30}(cost|dos|resource.exhaust))
  - (?i)(0\.5k.{0,20}16k|500.tokens?.{0,30}16[,.]?000.tokens?.{0,20}(tool|mcp|inject))
  - (?i)(resource.exhaust.{0,30}(tool.call|mcp|agent).{0,30}(cost|dos|token.bomb))
  - (?i)(tool.response.{0,30}(token.bomb|inflate|exhaust|dos).{0,30}(0\.5k|500.token|cost))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: P-DoS via Tool Response — prompt-level denial of service via token inflation in tool responses (100%
    ASR GPT-4o, <$1 cost, 0.5K→16K+ tokens)'
  description: 'Prompt Denial of Service (P-DoS) via Tools exploits MCP tool responses to inflate the LLM context with massive
    token payloads (0.5K→16K+ tokens). GPT-4o achieves 100% ASR at <$1 cost. The attack injects adversarial content that forces
    the model to generate extremely long responses or process enormous inputs, depleting the victim''s token budget and API
    credits. Unlike traditional DoS, this attack targets the economic model of LLM APIs: the attacker pays minimal tokens
    while inflating the victim''s consumption by 32x+.'
  remediation: Implement hard token limits on tool response sizes. Apply rate limiting and token budget controls per session.
    Monitor for anomalous token consumption patterns. Truncate tool responses exceeding configurable thresholds. Implement
    cost anomaly detection to alert when per-request costs spike unexpectedly.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-MCP-SCAN-053
  name: p-dos-agent-deadloop-code-generation
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(p.dos.{0,20}(agent|code.agent).{0,30}(dead.loop|infinite.loop|deadloop|endless))
  - (?i)(agent.{0,20}(write|generate|create).{0,30}(dead.loop|infinite.loop|while.true).{0,30}(dos|exhaust))
  - (?i)(code.agent.{0,30}(loop|infinite|deadloop).{0,30}(resource|exhaust|dos|halt))
  - (?i)(injected.code.{0,30}(infinite.loop|dead.loop|while.true).{0,30}(agent|resource|crash))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: P-DoS for Code Agents — inducing agents to generate and execute infinite-loop code, consuming execution
    resources (>90% ASR)'
  description: P-DoS for Code Agents (>90% ASR) exploits code-generating agents by injecting instructions that cause the agent
    to write and execute infinite-loop or resource-exhausting code. Unlike token-level P-DoS, this attack targets execution
    resources (CPU, memory) of agent sandboxes. Prompt injection causes the agent to generate `while True:` constructs or
    recursive functions that exhaust the execution environment. Particularly effective against agents with code execution
    capabilities (Jupyter, Python REPL).
  remediation: Implement execution time limits and resource quotas for all agent code execution environments. Apply static
    analysis to detect infinite loops before execution. Use sandboxed execution with hard CPU/memory caps. Monitor execution
    patterns for runaway processes. Apply intent-based analysis to detect instructions that suggest resource exhaustion before
    code generation.
  owasp_llm: LLM04:2025
  cwe: CWE-835
- id: MEDUSA-MCP-SCAN-054
  name: infectious-attack-code-injection-eval
  severity: CRITICAL
  category: code_injection
  patterns:
  - (?i)(infectious.attack|infectious.prompt.{0,30}(mcp|tool|agent|eval))
  - (?i)(eval.{0,10}user.input.{0,30}(mcp|tool|inject|malicious|untrusted))
  - (?i)(eval.{0,5}user.{0,30}(tool.result|mcp.response|inject|untrusted))
  - (?i)(code.inject.{0,30}(mcp.tool|agent.response|tool.output).{0,30}(eval|exec|70%))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Infectious Attack — MCP tool enabling eval(user_input) code injection that propagates to new victims
    (70% ASR)'
  description: 'Infectious Attacks (ASR 70%) exploit MCP tools that pass user-controlled input to eval() or exec() functions
    without sanitization. The injection propagates to new victims by embedding self-replicating payloads in tool responses
    — infected data gets passed to other agents/users who process it through the same vulnerable tool. The ''infectious''
    property: one successful injection can spread across an entire MCP ecosystem through tool-mediated data sharing, similar
    to a worm.'
  remediation: Never pass MCP tool outputs or user data to eval()/exec() without strict sandboxing. Apply AST-based analysis
    rather than eval for data processing. Implement input sanitization at all tool interfaces. Use parameterized APIs instead
    of dynamic code execution. Apply code execution sandboxing with restricted import capabilities.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-MCP-SCAN-055
  name: aeia-active-environment-injection-android
  severity: CRITICAL
  category: environmental_injection
  patterns:
  - (?i)(aeia|active.environment.inject).{0,60}(android|mobile|93%|agent)
  - (?i)(active.environment.inject.{0,30}(93|androidworld|mobile.agent|ui.interact))
  - (?i)(environment.inject.{0,30}(active|aeia|androidworld|93%).{0,30}(agent|attack))
  - (?i)(androidworld.{0,30}(inject|attack|aeia|93%).{0,30}(agent|ui|mobile))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: AEIA (Active Environment Injection Attack) — injecting malicious content into the mobile agent''s active
    environment achieving 93% ASR on AndroidWorld'
  description: AEIA (Active Environment Injection Attack) injects malicious content directly into the mobile agent's active
    environment (e.g., screen content, notifications, app state) to hijack agent actions. Achieves 93% ASR on the AndroidWorld
    benchmark. Unlike passive injection (waiting for agents to read malicious files), AEIA actively modifies the agent's current
    view/environment to force immediate action. The attack exploits mobile GUI agents that take actions based on what they
    observe in the current screen state.
  remediation: Apply environment integrity verification before agent action execution. Monitor for unexpected environment
    modifications between action steps. Implement adversarial environment detection using screen content analysis. Apply visual
    anomaly detection to identify injected UI elements. Use formal verification of environment state transitions to detect
    active manipulation.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-MCP-SCAN-056
  name: cia-compositional-instruction-attack
  severity: CRITICAL
  category: indirect_prompt_injection
  patterns:
  - (?i)(cia|compositional.instruct.{0,20}attack).{0,60}(gpt.4|95%|llm|agent)
  - (?i)(compositional.instruct.{0,30}(>?95%|gpt.4|attack|mcp|agent.task))
  - (?i)(multi.step.inject.{0,30}(compositional|cia|context.dependent|chain)).{0,30}(agent)
  - (?i)(context.dependent.inject.{0,30}(compositional|multi.turn|cia).{0,30}agent)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: CIA (Compositional Instruction Attack) — multi-step context-dependent injection achieving >95% ASR on
    GPT-4 in MCP environments'
  description: CIA (Compositional Instruction Attack) chains multiple individually-benign instructions across different context
    states to achieve harmful outcomes. Achieves >95% ASR on GPT-4 in MCP environments. Individual instructions appear harmless;
    only when composed in the correct sequence do they produce the attack outcome. This defeats single-turn safety evaluation
    because no individual instruction triggers safety filters — only the composition is harmful. Exploits agent context accumulation
    and multi-turn interaction patterns.
  remediation: Implement cross-turn semantic analysis that evaluates instruction sequences rather than individual turns. Apply
    compositional intent detection using conversation-level context windows. Monitor for instruction patterns that span multiple
    turns with cumulative semantic drift toward harmful goals. Use session-level rather than turn-level safety evaluation
    for agentic workflows.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-MCP-SCAN-057
  name: demonagent-encrypted-multistage-backdoor
  severity: CRITICAL
  category: advanced_backdoor
  patterns:
  - (?i)(demonagent|demon.agent).{0,60}(encrypt|fragmented|backdoor|multi.stage)
  - (?i)(encrypted.backdoor.{0,30}(mcp|agent|fragmented|multi.stage|hidden.trigger))
  - (?i)(fragmented.backdoor.{0,30}(encrypt|mcp|demon|multi.stage|reconstitute))
  - (?i)(multi.stage.backdoor.{0,30}(encrypt|fragment|mcp.agent|demon).{0,30}(trigger|activate))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: DemonAgent — encrypted multi-stage backdoor fragmentation in MCP agents, reconstructing payload across
    multiple interaction stages'
  description: 'DemonAgent implements encrypted multi-backdoor fragmentation: the malicious payload is split into encrypted
    fragments distributed across multiple benign-appearing interactions. Each fragment individually appears harmless and passes
    safety filters. When the full sequence is completed, fragments are decrypted and reconstituted to execute the full attack.
    This circumvents both static analysis (no single fragment is malicious) and runtime monitoring (individual interactions
    appear safe). Particularly concerning for long-running agentic systems.'
  remediation: Apply session-level behavioral analysis to detect fragmented payload assembly patterns. Monitor for encrypted
    data fragments in agent state that could constitute multi-stage backdoor components. Implement session integrity checks
    that evaluate cross-turn data accumulation. Use isolation between sessions to prevent payload reconstitution across sessions.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MCP-SCAN-058
  name: adinject-advertising-network-injection
  severity: HIGH
  category: indirect_prompt_injection
  patterns:
  - (?i)(adinject|ad.inject).{0,60}(network|advertisement|advertising|mcp|agent)
  - (?i)(advertising.network.{0,30}(inject|malicious.ad|prompt.inject|llm.agent))
  - (?i)(malicious.ad.{0,30}(inject|network|llm|agent|prompt.inject|advertising))
  - (?i)(ad.network.{0,30}(inject|prompt|llm|agent|malicious|adinject))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: AdInject — indirect prompt injection via advertising network content processed by LLM agents'
  description: 'AdInject exploits LLM agents that browse web content containing advertisements: malicious ad content (controlled
    by attackers via ad networks) embeds adversarial instructions that are processed as part of the page content. Since ad
    content is frequently served from third-party CDNs and changes dynamically, the injection surface is enormous. Advertisers
    (or attackers who compromise ad networks) can target specific users/contexts by serving malicious ad content when LLM
    agents are detected.'
  remediation: Implement ad blocking at the network level for all LLM agent browsing sessions. Apply content sanitization
    that strips ad network content before LLM processing. Use domain allowlisting for LLM agent web access. Monitor for adversarial
    instructions in third-party embedded content. Apply separate trust levels to first-party vs. ad network content.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-MCP-SCAN-059
  name: les-dissonances-cross-tool-data-harvesting
  severity: HIGH
  category: data_exfiltration
  patterns:
  - (?i)(les.dissonances|dissonance.attack).{0,60}(cross.tool|data.harvest|pollut|mcp)
  - (?i)(cross.tool.{0,20}(data.harvest|harvest.pollut|exfiltrate).{0,30}(mcp|agent|tool))
  - (?i)(tool.data.harvest.{0,30}(cross.tool|pollut|dissonance|exfil).{0,30}(mcp|agent))
  - (?i)(data.harvest.{0,30}pollut.{0,30}(cross.tool|mcp|agent|les.dissonance))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Les Dissonances — cross-tool data harvesting and pollution attack leveraging MCP tool interaction patterns'
  description: 'Les Dissonances exploits the interaction between multiple MCP tools to both harvest sensitive data and inject
    polluted data simultaneously. The attack leverages how agents pass data between tools: Tool A extracts sensitive information,
    which is passed to Tool B (attacker-controlled), which exfiltrates it while returning polluted responses to the agent.
    The dual nature (harvest + pollute simultaneously) makes it hard to detect via output-only monitoring. Named for the ''dissonance''
    between what the tool appears to do vs. what it actually does.'
  remediation: Implement inter-tool data flow monitoring to detect cross-tool exfiltration patterns. Apply information flow
    control between tool interactions. Audit data passed between tools for sensitive content before forwarding. Monitor for
    tools that receive sensitive data and return modified/corrupted results simultaneously. Use formal data flow analysis
    in multi-tool pipelines.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-MCP-SCAN-061
  name: imprompter-tool-misuse-induction
  severity: HIGH
  category: tool_abuse
  patterns:
  - (?i)(imprompter|improper.tool.use|tool.misuse.induction).{0,60}(llm|agent|mcp|inject)
  - (?i)(craft.{0,30}input.{0,30}(force|induce|cause).{0,40}(tool|function).{0,30}(misuse|wrong|incorrect|unintended))
  - (?i)(induc.{0,20}(tool|function|api).{0,30}(call|invoke|execut).{0,30}(unintended|improper|wrong|unauthorized))
  - (?i)(tool.invocation.{0,30}(manipulat|craft|adversarial|force|cause).{0,30}(unintended|misuse|improp))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Imprompter — crafted inputs causing LLM agents to improperly invoke tools (tool misuse induction attack)'
  description: Imprompter generates specifically crafted inputs that cause LLM agents to misuse or improperly invoke tools
    — calling the wrong tool, calling with wrong parameters, or triggering tool executions that should not occur. Exploits
    the gap between what an agent is instructed to do and how it actually invokes tools given adversarial context. Can cause
    unauthorized data access, unintended side effects, or security policy violations through legitimate-looking tool invocations.
  remediation: Implement tool invocation validation — verify that tool calls match the agent's stated task context. Apply
    semantic consistency checks between agent instructions and tool invocations. Log all tool calls with context for anomaly
    detection. Use the Toolken+ reject option to allow agents to decline ambiguous invocations. Require explicit user authorization
    for sensitive tool operations regardless of agent reasoning.
  owasp_llm: LLM08:2025
  cwe: CWE-20
- id: MEDUSA-MCP-SCAN-062
  name: mcp-unauthenticated-sampling-origin-injection
  severity: CRITICAL
  category: protocol_exploit
  patterns:
  - (?i)(sampling.{0,20}createMessage|createMessage.{0,20}sampling).{0,100}(role.{0,10}user|inject|origin|auth)
  - (?i)(capability.{0,20}(escalat|claim|self.assert|unverified)).{0,80}(sampling|tools|resources|mcp)
  - (?i)(server.{0,20}inject.{0,30}(user.role|user.prompt|origin.tag|sampling)).{0,60}(mcp|createMessage)
  - (?i)(missing.origin.auth|unauthenticated.sampling|origin.tag.{0,20}mcp|mcpsec|capability.cert).{0,60}(mcp|server|sampling)
  - (?i)(attacker.{0,20}mcp|server.{0,20}inject.{0,20}prompt).{0,60}(indistinguishable|user.input|no.warn|no.origin)
  file_types:
  - '*.py'
  - '*.json'
  - '*.ts'
  - '*.md'
  message: 'Detected: MCP Unauthenticated Sampling / Origin Auth bypass — server injecting prompts via sampling/createMessage
    indistinguishable from user input'
  description: 'MCP v1.0 protocol flaw (Maloyan 2026): The sampling/createMessage method allows any MCP server to inject prompts
    with role=''user'' without any cryptographic origin verification. Servers that initially claim only ''resources'' capability
    can post-initialization invoke ''sampling/createMessage'', escalating privileges without enforcement. Host apps (Claude
    Desktop, Cursor) display no warning when processing server-injected prompts. This architectural flaw amplifies ASR by
    23-41% vs non-MCP implementations. AttestMCP mitigation: capability_cert + mcpsec HMAC-SHA256 + 32-byte nonce reduces
    ASR from 52.8% to 12.4%.'
  remediation: 'Deploy AttestMCP extension: require capability_cert attestation from recognized authority, mcpsec HMAC-SHA256
    with timestamp+nonce on all JSON-RPC messages, and strict origin tagging on sampling requests. Use Strict mode (reject
    all unsigned servers) or Prompt mode (require explicit confirmation). Apply TOFU pinning to prevent downgrade attacks.
    Block cross-server sampling flows by default.'
  owasp_llm: LLM02:2025
  cwe: CWE-306
- id: MEDUSA-MCP-SCAN-063
  name: mcp-sse-session-hijacking
  severity: CRITICAL
  category: protocol_exploit
  patterns:
  - (?i)(session.{0,10}id.{0,30}(sse|mcp|messages|bypass|hijack|expose)).{0,60}(session_id|json.rpc|endpoint)
  - (?i)(/messages/\?session.?id=|\?session.?id=.{0,40}(mcp|rpc|bypass|hijack|arbitrary))
  - (?i)(sse.{0,20}(session.?id|transport).{0,40}(expos|leak|hijack|intercept|bypass.auth))
  - (?i)(mcp.{0,20}sse.{0,30}(session.?id|bearer.token|auth.bypass).{0,40}(hijack|arbitrary|send|command))
  - (?i)(localhost.{0,30}(session.?id|sse).{0,50}(no.auth|unauth|bypass|arbitrary.command))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.json'
  - '*.md'
  message: 'Detected: MCP SSE session_id hijacking — exposed session identifier enables unauthorized JSON-RPC command injection'
  description: 'MCP SSE transport vulnerability (Hou 2025): The MCP Server-Sent Events transport assigns a unique session_id
    that, if exposed in logs/error messages/browser history, allows attackers to bypass authentication entirely. An attacker
    sending arbitrary JSON-RPC commands to /messages/?session_id=<id> gains full access without credentials. Combined with
    sandbox escape (MCP server on localhost without auth), external local processes (Chrome extensions, other apps) can issue
    privileged commands. ASR: direct authentication bypass.'
  remediation: 'Treat session_id as a secret credential: never expose in logs, error messages, or URLs. Implement application-layer
    authentication independent of session_id. Rate-limit /messages/ endpoint. Bind MCP SSE servers to authenticated contexts
    (not bare localhost). Audit all code paths that could leak session_id values. Use short-lived session tokens with automatic
    rotation.'
  owasp_llm: LLM08:2025
  cwe: CWE-287
- id: MEDUSA-MCP-SCAN-064
  name: msb-out-of-scope-parameter-internal-state-exfil
  severity: HIGH
  category: tool_manipulation
  patterns:
