  description: 'CORAL Protocol authentication bypass (Louck 2025, 100% success rate, 50/50 trials, CWE-287): CORAL''s SSE
    endpoint requires sessionId + privacyKey, but the server NEVER validates the privacyKey. Attacker with any intercepted
    valid sessionId supplies an arbitrary privacyKey and gains full read access to the victim''s SSE stream. Additionally,
    fabricated agentId values (not present in Agent Graph) are accepted without rejection, enabling eavesdropping. /api/v1/sessions
    lacks rate limiting → DoS via 20+ concurrent sessions. Related: A2A protocol lacks per-message crypto signing (bearer
    tokens have no expiry, no timestamps) → SSE replay attacks. ACP partial JWS validation bypass: MIME multipart segments
    not fully signed → inject synthetic PII/payment data.'
