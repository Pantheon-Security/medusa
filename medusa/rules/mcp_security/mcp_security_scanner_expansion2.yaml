metadata:
  source: expansion2 2026-03-02
  total_rules: 27
rules:
- id: MEDUSA-MCP-SCAN-074
  name: mcp-server-capability-enumeration
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:list|enumerate|discover|scan|probe)\s+(?:all|available|exposed)\s+(?:mcp\s+)?(?:tools?|capabilities?|functions?|endpoints?|resources?)\s+(?:on|from|in)\s+(?:the\s+)?(?:mcp\s+server|tool\s+server|server)
  - (?i)(?:what\s+(?:tools?|capabilities?|functions?|actions?)\s+(?:do\s+you|can\s+you|are\s+(?:you\s+)?(?:able|available))|show\s+me\s+(?:all|your)\s+(?:tools?|capabilities?|functions?))
  - (?i)(?:tools\/list|capabilities\/list|mcp\.list_tools|server\.list_tools|list_capabilities)\s*\(
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.md'
  message: MCP server capability enumeration attempt detected
  description: MCP server capability enumeration is a reconnaissance step before more targeted attacks. Attackers map the
    full tool surface to identify high-value targets (file operations, shell execution, network tools). MASLEAK (Kong 2025)
    uses worm-like propagation to enumerate entire multi-agent network topology. Guo (2025) multi-tool coordination attack
    (30% ASR, Efficacy 3.13) relies on prior capability enumeration.
  remediation: Restrict capability enumeration to authenticated clients. Return only approved tool subsets per user role.
    Log all capability listing requests. Implement rate limiting on list_tools endpoints.
  owasp_llm: LLM07:2025
  cwe: CWE-200
- id: MEDUSA-MCP-SCAN-075
  name: mcp-cross-server-lateral-movement
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:move|pivot|escalate|jump|traverse)\s+(?:from|across)\s+(?:one|this|the)\s+(?:mcp\s+)?server\s+to\s+(?:another|other|different|additional)\s+(?:mcp\s+)?server
  - (?i)(?:access|call|invoke|connect\s+to)\s+(?:a\s+)?(?:different|another|other|adjacent|downstream)\s+mcp\s+(?:server|endpoint|instance)\s+(?:via|through|using)\s+(?:this|current\s+)?(?:tool|connection|session)
  - (?i)(?:cross.server|inter.server|server.to.server)\s+(?:mcp|tool)\s+(?:access|call|invocation|escalation|pivot|movement)
  file_calls:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: Cross-MCP-server lateral movement attempt
  description: Cross-MCP-server lateral movement occurs when an attacker compromises one MCP server and uses it to reach additional
    servers in the ecosystem. The MASLEAK (Kong 2025) attack demonstrates this by using worm-like query propagation across
    multi-agent topologies. Agent Cascading Injection (Sharma 2025) enables payload self-replication through inter-server
    agent delegation chains.
  remediation: Implement strict server isolation — MCP servers should not be able to directly invoke other servers. Require
    separate authentication for each server-to-server communication. Apply network segmentation between MCP server instances.
  owasp_llm: LLM08:2025
  cwe: CWE-284
- id: MEDUSA-MCP-SCAN-076
  name: mcp-protocol-deserialization-malformed-message
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:malformed|invalid|corrupted|crafted)\s+(?:mcp|json.?rpc|tool)\s+(?:message|payload|request|response)\s+(?:to\s+(?:crash|exploit|trigger|bypass)|causing\s+(?:error|exception|crash|overflow))
  - (?i)(?:json.?rpc|mcp).*(?:id|method|params|result).*(?:null|undefined|NaN|Infinity|circular|prototype|__proto__).*(?:crash|exploit|bypass|overflow)
  - (?i)(?:fuzz|fuzzing|malformed|invalid)\s+(?:mcp|json.?rpc|tool\s+call)\s+(?:messages?|packets?|frames?|payloads?)\s+(?:to|for)\s+(?:crash|exploit|discover|find)\s+(?:bug|vulnerability|crash|memory\s+error)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: MCP protocol deserialization attack via malformed JSON-RPC message
  description: MCP protocol deserialization vulnerabilities arise from insufficient validation of JSON-RPC message fields.
    AJSON (Gasmi 2025) injects malformed JSON via function names, parameters, or outputs achieving 50-96% ASR. Prototype pollution
    via __proto__ in tool parameters can corrupt server-side JavaScript object prototypes. Fuzzing the MCP message format
    reveals memory-safety issues in server implementations.
  remediation: Validate all JSON-RPC message fields against a strict schema before processing. Reject messages with unexpected
    field types (NaN, Infinity, circular references). Implement input size limits. Apply defenses against prototype pollution
    in JavaScript MCP servers.
  owasp_llm: LLM02:2025
  cwe: CWE-502
- id: MEDUSA-MCP-SCAN-077
  name: mcp-oauth-token-theft-tool-abuse
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:steal|exfiltrate|extract|capture|intercept)\s+(?:the\s+)?(?:oauth|access|bearer|refresh|api)\s+token\s+(?:via|through|using)\s+(?:mcp|tool)\s+(?:call|invocation|exploit|abuse)
  - (?i)(?:oauth|access|bearer)\s+token.*(?:mcp|tool).*(?:leak|expose|send|forward|exfil).*(?:external|attacker|http|ftp)
  - (?i)(?:credentials?|oauth\s+flow|authorization\s+code).*(?:redirect|intercept|steal|capture).*(?:mcp\s+server|tool\s+server|plugin)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'OAuth token theft via MCP tool abuse: credential exfiltration through tool invocation'
  description: OAuth token theft via MCP tools occurs when malicious tools or prompt injection redirects OAuth authorization
    flows to attacker-controlled endpoints, or exfiltrates tokens stored in the agent's context. MCP Sandbox Escape (Hou 2025)
    demonstrated credential theft from plaintext mcp.json configuration files. Data flow injection (Alizadeh 2025) achieves
    93% ASR for credential exfiltration mid-task.
  remediation: Never store OAuth tokens in plaintext MCP configuration files. Use OS credential stores for token persistence.
    Implement PKCE for OAuth flows. Validate redirect URIs against an explicit allowlist. Monitor tool calls for token-shaped
    strings in parameters.
  owasp_llm: LLM09:2025
  cwe: CWE-522
- id: MEDUSA-MCP-SCAN-078
  name: mcp-webhook-manipulation-callback-hijack
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:override|replace|change|modify|redirect)\s+(?:the\s+)?(?:webhook|callback|notification|event)\s+(?:url|endpoint|destination|target)\s+(?:to|with)\s+(?:my|attacker|external|different)
  - (?i)(?:webhook|callback).*(?:url|endpoint)\s*=\s*(?:request\.|req\.|user_|input|param)(?!.*(?:validate|allowlist|whitelist|re\.match|urlparse))
  - (?i)(?:mcp|tool).*(?:webhook|notification|event|callback).*(?:send|forward|post).*(?:attacker|external|http://[^l]|https://(?!(?:localhost|127)))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'MCP webhook URL manipulation: user-controlled webhook endpoint without validation'
  description: MCP webhook manipulation allows attackers to redirect event notifications and tool results to attacker-controlled
    infrastructure by injecting arbitrary URLs as webhook callback targets. This enables data exfiltration of sensitive tool
    outputs. SSRF via MCP tool URL parameters (documented in Ruan 2023 ToolEmu; Zhan 2024 InjecAgent) achieves up to 95% ASR
    in webhook-enabled agent setups.
  remediation: Validate webhook URLs against a strict allowlist of approved domains. Require authentication for webhook registration
    changes. Implement URL validation that blocks RFC1918 ranges and metadata endpoints. Log all webhook URL modifications.
  owasp_llm: LLM07:2025
  cwe: CWE-610
- id: MEDUSA-MCP-SCAN-079
  name: mcp-ssrf-tool-internal-network-probe
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:fetch|get|request|access|browse|visit)\s+(?:url|page|endpoint|resource)\s*[=:]\s*["']?(?:http://(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|127\.0\.0\.1|localhost|10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.))[^"'\s]*
  - (?i)(?:use|call|invoke)\s+(?:the\s+)?(?:mcp|web|http|fetch)\s+tool\s+(?:to\s+)?(?:access|request|fetch|get)\s+(?:the\s+)?(?:metadata|internal|localhost|cloud)\s+(?:endpoint|service|url|api)
  - (?i)mcp.*(?:fetch|browse|http|request).*(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  - '*.yaml'
  message: 'MCP SSRF: cloud metadata or internal network endpoint targeted via tool fetch capability'
  description: SSRF via MCP tool URL parameters targets cloud metadata endpoints (169.254.169.254 AWS IMDS, metadata.google.internal,
    100.100.100.200 Alibaba) to steal IAM credentials and instance metadata. InjecAgent (Zhan 2024) achieves up to 95% ASR
    exploiting web-browsing MCP tools. A single successful SSRF can expose full cloud credentials enabling account takeover.
  remediation: Implement SSRF protection in all MCP tools that perform HTTP requests. Block RFC1918, link-local (169.254.x.x),
    and metadata IP ranges. Validate URLs against a public IP allowlist. Deploy cloud metadata endpoint protection (IMDSv2
    with hop limit = 1).
  owasp_llm: LLM07:2025
  cwe: CWE-918
- id: MEDUSA-MCP-SCAN-080
  name: mcp-resource-uri-path-traversal
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)mcp://.*(?:\.\./|%2e%2e%2f|%2e%2e/|\.\./){2,}
  - (?i)(?:resource_uri|resource_path|mcp_resource)\s*[=:]\s*["'].*(?:\.\./){2,}.*["']
  - (?i)(?:access|read|fetch|get)\s+(?:mcp\s+)?resource\s+(?:uri|url|path)\s*[=:]\s*(?:f["']|["'])[^"']*(?:\.\./|\.\.).*(?:/etc/|/home/|/var/|\\windows)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: MCP resource URI path traversal attack pattern detected
  description: MCP resource URI path traversal exploits insufficient validation of resource URI components to access files
    outside the intended resource root. MCP unsafe file operations (Guo 2025, ASR 90-100%) demonstrated that file-based MCP
    tools with user-controlled paths enable Zip-Slip style traversal. An attacker can traverse to /etc/passwd, SSH keys, or
    environment files.
  remediation: Normalize all MCP resource URIs before processing. Validate that resolved paths remain within the allowed resource
    base directory using os.path.abspath() containment checks. Reject URIs containing .. sequences before normalization.
  owasp_llm: LLM01:2025
  cwe: CWE-22
- id: MEDUSA-MCP-SCAN-081
  name: mcp-tool-argument-injection-cross-boundary
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:inject|smuggle|embed|insert)\s+(?:into|in)\s+(?:the\s+)?(?:mcp\s+)?tool\s+(?:argument|parameter|input)\s+(?:from|via|through)\s+(?:another|different|external|untrusted)\s+(?:mcp\s+)?tool
  - (?i)(?:tool_a|first_tool|source_tool).*(?:output|result).*(?:tool_b|second_tool|target_tool).*(?:input|argument|parameter).*(?:inject|manipulate|poison|smuggle)
  - (?i)(?:cross.tool|inter.tool|tool.to.tool)\s+(?:argument|parameter|input)\s+(?:injection|smuggling|manipulation|poisoning)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'Cross-tool argument injection: output from one MCP tool injected unsanitized into another tool''s arguments'
  description: Cross-tool argument injection occurs when the output of one MCP tool flows unsanitized into the input parameters
    of another tool, enabling chained exploits. Multi-Tool Coordination (Guo 2025, 30% ASR, Efficacy 3.13) demonstrates this
    chain. InjecAgent (Zhan 2024) achieves 95% ASR exploiting blind parameter trust when tool outputs are passed directly
    to subsequent tool calls.
  remediation: Sanitize all tool outputs before passing to subsequent tool inputs. Implement per-parameter type validation
    and length limits. Use structured tool schemas with strict input schemas that reject injected directives. Never pass tool
    outputs to shell-executing tools without sanitization.
  owasp_llm: LLM01:2025
  cwe: CWE-88
- id: MEDUSA-MCP-SCAN-082
  name: mcp-session-fixation-attack
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:session_id|mcp_session|connection_id|session_token)\s*=\s*(?:request\.|req\.|user_|param|input|attacker_controlled)(?!.*(?:generate|random|uuid4|secrets\.token|regenerate))
  - (?i)(?:accept|use|reuse|keep)\s+(?:the\s+)?(?:client|user).?(?:provided|supplied|specified)\s+(?:session|mcp.session|connection)\s+(?:id|token|identifier)(?!.*(?:validate|verify|regenerate|new))
  - (?i)(?:mcp|session).*(?:fixation|hijacking|reuse).*(?:session_id|connection_id|token|identifier)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'MCP session fixation: client-supplied session identifier accepted without regeneration'
  description: MCP session fixation occurs when a server accepts a client-specified session ID rather than generating a cryptographically
    random one. An attacker pre-sets a known session ID and waits for a victim to authenticate, inheriting the session. MCP
    servers communicating over HTTP (per spec) are particularly vulnerable to session fixation if connection IDs are client-controlled.
  remediation: Always generate cryptographically random session IDs server-side (secrets.token_urlsafe(32)). Never accept
    client-specified session IDs. Regenerate session IDs on authentication events. Implement session token binding to prevent
    cross-transport reuse.
  owasp_llm: LLM09:2025
  cwe: CWE-384
- id: MEDUSA-MCP-SCAN-083
  name: mcp-capability-escalation-chained-calls
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:use|chain|combine|sequence)\s+(?:multiple\s+)?(?:mcp\s+)?(?:tools?|calls?|capabilities?)\s+to\s+(?:escalate|elevate|gain|obtain)\s+(?:more|higher|privileged|admin|elevated)\s+(?:access|permissions?|capabilities?)
  - (?i)(?:tool_a|first_call|read_tool).*(?:then|->|followed\s+by)\s+(?:tool_b|second_call|write_tool|exec_tool).*(?:privilege|escalat|bypass|restriction|limit)
  - (?i)(?:chained?|sequential|cascaded?)\s+(?:mcp\s+)?tool\s+(?:calls?|invocations?).*(?:bypass|circumvent|escalate|exceed)\s+(?:permission|access|authorization|policy|limit)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: MCP capability escalation via chained tool calls
  description: Capability escalation via chained MCP calls combines individually low-privilege tool invocations to achieve
    higher-privilege outcomes. File-Based Injection (Guo 2025, ASR 90-100%) chains read → process → write tool operations.
    The b3 Benchmark (Bazinska 2025) identified Indirect Tool Invocation (ITI) as achieving escalation through multi-hop reasoning.
    This bypasses per-tool permission checks.
  remediation: Implement cumulative permission tracking across tool chains within a session. Require re-authorization for
    privilege-sensitive sequences. Apply least-privilege tool access where file-read tools cannot feed file-write tools without
    explicit user approval.
  owasp_llm: LLM07:2025
  cwe: CWE-269
- id: MEDUSA-MCP-SCAN-084
  name: mcp-server-dns-impersonation
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:dns|name\s+resolution).*(?:poison|hijack|spoof|tamper|manipulate).*(?:mcp|tool\s+server|plugin\s+server|endpoint)
  - (?i)(?:impersonat|pretend\s+to\s+be|masquerade\s+as)\s+(?:the\s+)?(?:legitimate|official|real|trusted)\s+(?:mcp|tool)\s+server
  - (?i)(?:register|create|deploy)\s+(?:a\s+)?(?:malicious|fake|rogue|attacker.controlled)\s+(?:mcp|tool)\s+server\s+(?:with|at|on)\s+(?:the\s+same|a\s+similar|a\s+spoofed)\s+(?:domain|hostname|address|name)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: MCP server impersonation via DNS spoofing or domain squatting
  description: MCP server impersonation via DNS poisoning or domain squatting allows attackers to intercept tool invocations
    by registering similar hostnames or poisoning local DNS resolution. MCP Installer Spoofing (Hou 2025) demonstrates typosquatted
    package names (mcp-server-filesytem vs mcp-server-filesystem) redirecting installations. Combined with lack of server
    authentication, impersonation achieves 100% tool hijacking.
  remediation: Implement certificate pinning for MCP server connections. Validate server identity via TLS certificate CN/SAN
    against a trusted allowlist. Use DNSSEC for MCP server resolution. Implement mutual TLS (mTLS) for production MCP deployments.
  owasp_llm: LLM03:2025
  cwe: CWE-290
- id: MEDUSA-MCP-SCAN-085
  name: mcp-rate-limiting-bypass-endpoint
  severity: MEDIUM
  category: mcp_security
  patterns:
  - (?i)(?:bypass|evade|circumvent|avoid)\s+(?:the\s+)?(?:rate\s+limit|throttling|quota|restriction)\s+(?:on|for)\s+(?:the\s+)?(?:mcp|tool)\s+(?:endpoint|server|api)
  - (?i)(?:distributed|parallel|concurrent)\s+(?:mcp|tool)\s+(?:calls?|requests?|invocations?)\s+(?:to|in\s+order\s+to)\s+(?:bypass|evade|exceed|circumvent)\s+(?:rate\s+limit|throttling|quota)
  - (?i)(?:rotate|cycle|switch)\s+(?:between\s+)?(?:api\s+keys?|tokens?|credentials?|identities?|ip\s+addresses?)\s+(?:to\s+)?(?:bypass|evade|circumvent)\s+(?:rate\s+limit|throttling)\s+(?:on|for)\s+(?:mcp|tool)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: MCP rate limit bypass attempt via distributed requests or credential rotation
  description: Rate limiting bypass on MCP endpoints allows attackers to perform high-volume tool invocations for brute force,
    data exfiltration, or P-DoS amplification. P-DoS via Tools (Gao 2024, 100% ASR, <$1 cost) exploits unthrottled tool invocations
    for token amplification. MCP Guardian (Kumar, cited Guo 2025) recommends rate limiting as a mandatory security control.
  remediation: Implement per-user and per-IP rate limiting on all MCP tool endpoints. Use sliding window rate limiting with
    exponential backoff. Detect and block credential rotation patterns. Apply CAPTCHA or proof-of-work for high-frequency
    clients.
  owasp_llm: LLM04:2025
  cwe: CWE-770
- id: MEDUSA-MCP-SCAN-086
  name: mcp-audit-log-tampering-suppression
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:delete|clear|erase|wipe|truncate|suppress|disable)\s+(?:the\s+)?(?:mcp|tool\s+call|audit|event|security)\s+(?:log|logs?|audit\s+trail|record)
  - (?i)(?:prevent|stop|avoid|disable)\s+(?:mcp|tool\s+call|action)\s+(?:from\s+being\s+)?(?:logged|recorded|audited|tracked|monitored)
  - (?i)(?:governance|audit|log).*(?:evasion|bypass|suppress|disable|clear).*(?:mcp|tool\s+call|agent\s+action)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: MCP audit log tampering or suppression attempt
  description: MCP audit log tampering undermines forensic investigation and regulatory compliance. Governance Evasion via
    fragmented sessions (ATFAA T9 taxonomy 2025) specifically targets audit trail reconstruction. If MCP tool call logs can
    be cleared or suppressed, attribution and incident response becomes impossible. This is particularly critical for financial
    and healthcare MCP deployments.
  remediation: Write audit logs to an append-only, tamper-evident store (WORM storage, cryptographic hash chains). Implement
    separate logging credentials with write-only access. Alert on log deletion events. Use centralized SIEM for MCP audit
    trails.
  owasp_llm: LLM08:2025
  cwe: CWE-778
- id: MEDUSA-MCP-SCAN-087
  name: mcp-cross-origin-tool-invocation
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:cross.origin|cross.domain|cors)\s+(?:mcp|tool)\s+(?:invocation|call|access|request)
  - (?i)(?:invoke|call|access)\s+(?:mcp\s+)?tool\s+(?:from\s+)?(?:a\s+)?(?:different|external|third.party|untrusted)\s+(?:origin|domain|site)\s+(?:without|bypassing|ignoring)\s+(?:cors|same.origin|origin\s+check)
  - (?i)(?:Access-Control-Allow-Origin|CORS)\s*(?:\*|=\s*["']\*["']).*(?:mcp|tool|plugin|server)(?!.*(?:credentials\s*=\s*false|allow.credentials\s*=\s*false))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  message: 'Cross-origin MCP tool invocation: CORS misconfiguration enables unauthorized cross-site tool access'
  description: 'Cross-origin MCP tool invocation exploits CORS misconfigurations in MCP server HTTP endpoints to allow arbitrary
    web origins to invoke tools. Combined with wildcard CORS (*) and credentials: true, this enables drive-by MCP tool attacks
    from malicious websites. MCP Sandbox Escape (Hou 2025) demonstrated Chrome extension lateral movement via MCP''s localhost
    HTTP interface.'
  remediation: 'Configure strict CORS on MCP HTTP endpoints: explicit allowed origins only, no wildcard with credentials.
    Implement CSRF protection on state-changing tool endpoints. Use MCP''s STDIO transport (not HTTP) for local agents where
    possible.'
  owasp_llm: LLM09:2025
  cwe: CWE-942
- id: MEDUSA-MCP-SCAN-088
  name: mcp-tool-output-cache-poisoning
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:cache|poison|corrupt|inject\s+into)\s+(?:the\s+)?(?:mcp\s+)?tool\s+(?:output|result|response)\s+(?:cache|store|buffer)\s+(?:with|using|via)\s+(?:malicious|injected|attacker.controlled)
  - (?i)(?:cache\s+hit|cached\s+(?:result|response|output))\s+(?:mcp|tool).*(?:stale|poisoned|manipulated|incorrect|attacker.controlled)
  - (?i)(?:force|trigger|cause)\s+(?:the\s+)?(?:mcp\s+)?(?:tool|agent)\s+to\s+(?:use|return|serve)\s+(?:cached|stale|old|poisoned)\s+(?:result|output|response)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'MCP tool output cache poisoning: malicious content injected into tool result cache'
  description: MCP tool output cache poisoning injects adversarial content into cached tool responses so that subsequent legitimate
    requests receive the poisoned output. Phantom RAG Pipeline Trigger Attacks (2025) demonstrate knowledge-base cache poisoning
    achieving persistent instruction injection. PROMPTPEEK (Gairn 2025) shows KV-cache timing leaks can reveal cached private
    context.
  remediation: Implement cache entry authentication with HMAC signatures. Validate cache entries against a schema before serving.
    Set cache TTL proportional to data sensitivity. Use separate cache namespaces per user/session to prevent cross-user cache
    poisoning.
  owasp_llm: LLM03:2025
  cwe: CWE-345
- id: MEDUSA-MCP-SCAN-089
  name: mcp-demonagent-encrypted-multi-backdoor
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:demonagent|demon.agent|encrypted.*backdoor.*agent|multi.backdoor.*mcp)
  - (?i)(?:encrypted|obfuscated|hidden)\s+(?:backdoor|trigger|payload)\s+(?:in|within|inside)\s+(?:mcp\s+)?(?:tool|server|agent|plugin).*(?:decrypt|deobfuscate|activate|trigger)\s+(?:when|at\s+runtime|on\s+demand)
  - (?i)(?:multi.backdoor|multiple\s+backdoors?|layered\s+backdoor)\s+(?:implant|inject|embed|plant).*(?:mcp|tool|agent\s+(?:server|plugin|context))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: DemonAgent-style encrypted multi-backdoor implantation detected in MCP context
  description: DemonAgent is an encrypted multi-backdoor framework that implants multiple hidden backdoors in MCP tool implementations.
    Each backdoor is encrypted/obfuscated and activates only on specific triggers, making static detection challenging. DemonAgent
    backdoors persist across model updates by hiding in tool infrastructure rather than model weights, enabling long-term
    unauthorized access.
  remediation: Apply static analysis with AST-level analysis for obfuscated code patterns. Use code signing for all MCP tool
    deployments. Implement runtime behavior monitoring for unexpected network connections or file accesses. Scan MCP tool
    packages with malware detection before deployment.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-MCP-SCAN-090
  name: mcp-adinject-web-agent-ad-network-injection
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:adinject|ad.inject|ad\s+network\s+injection).*(?:web\s+agent|browser\s+agent|mcp|visual\s+agent)
