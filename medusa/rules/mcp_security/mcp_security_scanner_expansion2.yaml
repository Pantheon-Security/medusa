    working memory/state during invocation, then uses that data to pollute the outputs of other tools in the same session.
    This enables cross-tool information exfiltration without direct data exfiltration. The attack exploits the shared agent
    context that persists across tool invocations.
  remediation: Implement strict tool context isolation — tools should not access other tools' input/output history. Apply
