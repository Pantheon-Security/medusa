  message: 'Multi-LLM network or RAG pipeline without pairwise output distance monitoring:
    network-level collapse goes undetected without diversity metrics.'
  description: 'Detects multi-LLM or RAG-based systems that lack pairwise output distance
    monitoring, the primary detection mechanism for network-level model collapse.
    Wang et al. (2025, arXiv:2506.15690) showed that in networks of interacting LLMs
    sharing a RAG memory, network-level convergence collapse occurs as AI-generated
    content dominates the retrieval index. The authors propose monitoring the pairwise
    distance matrix of model embeddings as a model-agnostic stability metric. Without
    this monitoring, network-level collapse proceeds invisibly until output quality
    degrades sufficiently to be user-visible.

    '
  remediation: 'Implement pairwise embedding distance monitoring for all interacting
    LLMs in RAG-based or multi-agent systems (Wang et al. 2025). Set thresholds for
    minimum acceptable pairwise distance as a diversity metric. Alert when matrix
    geometry drift indicates convergence. Implement periodic injection of diverse
    human-authored documents into the RAG index to counteract convergence.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-044
  name: synthetic-data-dual-error-source-unmonitored
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*train.*no.*approximation.*error
  - (?i)statistical.*functional.*error.*synthetic
