    synthetic data into pretraining corpora, disrupting neural scaling laws. Dohmatob
    et al. (ICML 2024) showed that top-p (nucleus) sampling and temperature scaling
    inherently truncate distribution tails; when models train on such output, scaling
    law exponents degrade, causing loss-of-scaling, shifted scaling across generations,
    and eventual skill un-learning (demonstrated on GCD arithmetic with Llama2).

    '
  remediation: 'Prefer high-temperature or diverse sampling strategies when generating
    synthetic pretraining data. Monitor scaling law exponents on held-out benchmarks
    across training runs. Apply Gerstgrasser et al. (2024) accumulate paradigm to
