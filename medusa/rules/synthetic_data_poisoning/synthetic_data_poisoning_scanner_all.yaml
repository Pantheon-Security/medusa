  description: 'Detects training pipelines that generate and incorporate synthetic
    data without maintaining a provenance registry (cryptographic hashes, generation
    metadata, model version records). Namaki (2025) identifies provenance tracking
    as a critical governance requirement for synthetic data. Without a provenance
    registry, it is impossible to: (1) identify which training examples were AI-generated
    vs. human-authored, (2) trace a poisoning attack back to its source after discovery,
    (3) comply with emerging AI governance regulations requiring training data documentation
    (EU AI Act compliance noted by Flynn and Granziol 2025), or (4) perform targeted
    data removal (machine unlearning) when a poisoning source is identified.

    '
  remediation: 'Implement a synthetic data provenance registry that stores: generation
    model ID and version, generation timestamp, sampling parameters, cryptographic
    hash of each generated example, and downstream training run IDs that incorporated
    each example. Use content-addressable storage (CAS) for all synthetic training
    data. Apply provenance metadata as a required field in all training data manifests.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-SDP-SCAN-050
