  message: 'Web-crawled data from 2023 onwards used without AI-content filtering:
    Internet-scale AI content contamination is empirically documented and constitutes
    a training corpus poisoning risk.'
  description: 'Detects use of web-crawled datasets collected after 2022 without explicit
    filtering for AI-generated content. Wang et al. (2025, arXiv:2506.15690) modelled
    Internet-scale collapse using a RAG-based LLM network simulation, demonstrating
    that as AI-generated content dominates retrieval-augmented contexts, network-level
    output convergence (collapse) occurs. Dohmatob et al. (ICML 2024) noted that AI-generated
    content has contaminated LAION-5B through crowdworker usage. Post-2022 Common
    Crawl snapshots contain non-trivial AI-generated content proportions that grow
    with each crawl cycle.

    '
  remediation: 'Apply AI-content detection filtering to all web-crawled data collected
    after 2022 before training incorporation. Use importance resampling (Drayson et
    al. EMNLP 2025) to down-weight detected synthetic content rather than hard filtering.
    Maintain per-crawl- snapshot synthetic content proportion estimates and trend
    monitoring. Prefer datasets with documented AI-content filtering methodology (e.g.,
    Dolma, DCLM).

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-042
