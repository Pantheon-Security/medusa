  message: 'Long-term verified synthetic retraining detected: model converges to verifier
    knowledge center, introducing bias from verifier imperfections over time.'
  description: 'Detects long-running verified synthetic retraining loops where an
    external verifier (model or human) filters synthetic data over many rounds. Yi
    et al. (2025, arXiv:2510.16657) showed that while verified synthetic retraining
    prevents near-term collapse (40 rounds of VAE training approached full-dataset
    quality), the model ultimately converges to the verifier''s knowledge center in
    the long run. An imperfect verifier thus constitutes a subtle data poisoning vector:
    any biases in the verifier''s distribution are progressively imposed on the trained
    model over time, diverging from the true data distribution.

    '
  remediation: 'Monitor long-term divergence of model outputs from the ground-truth
    distribution (Yi et al. 2025). Periodically re-inject real data to counteract
    verifier drift. Use high-quality, diverse, and frequently updated verifiers. Set
    maximum retraining rounds before mandatory re-evaluation of verifier reliability.
    Document verifier identity and version in training manifests.

    '
