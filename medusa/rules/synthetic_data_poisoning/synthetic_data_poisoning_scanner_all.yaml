  - '*.yaml'
  - '*.json'
  - '*.md'
  - '*.txt'
  message: 'Potential collapse risk dismissal: Schaeffer et al. (ICML 2025) identify
    8 distinct collapse types; dismissing all risk based on one type avoidability
    may miss real harms.'
  description: 'Detects documentation or configuration assertions that model collapse
    is fully avoidable or presents no risk from synthetic data. Schaeffer et al. (ICML
    2025) identified eight distinct and conflicting definitions of model collapse
    in the literature. While some collapse scenarios are avoidable under realistic
    conditions, others represent genuine risks. Blanket dismissal of collapse risk
    based on partial evidence (e.g., that the accumulate paradigm prevents one type
    of collapse) may lead practitioners to under-invest in defences against backdoor
    poisoning (Lapid and Dubin, AAAI 2026), VIA propagation (Liang et al., NeurIPS
    2025), and Bayesian posterior steering (Carreau et al., AISTATS 2025).

    '
  remediation: 'Apply Schaeffer et al. (ICML 2025) eight-type taxonomy to distinguish
    which collapse scenarios are and are not applicable to your specific deployment
    context. Maintain separate defences for: (1) unintentional recursive collapse,
    (2) adversarial backdoor poisoning, (3) distribution shift contamination, and
    (4) provenance tracking. Do not conflate avoidability of one collapse type with
    absence of all risks.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-040
  name: interpolation-threshold-overparameterised-poisoning
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)overparameteris(ed|ation).*poison
  - (?i)interpolation.*threshold.*backdoor
  - (?i)p.n.*ratio.*attack.*ridge
  - (?i)ridgeless.*regression.*poison.*efficac
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Overparameterisation amplifies poisoning efficacy: near the interpolation
    threshold (p/n~1), even small poisoning fractions achieve maximal attack success
    rate.'
  description: 'Detects training configurations in the overparameterised regime near
    the interpolation threshold (parameter-to-sample ratio p/n approximately equal
    to 1), where poisoning attacks are most effective. Flynn and Granziol (2025) derived
    closed-form scaling laws showing poisoning attack success rate peaks at the interpolation
    threshold in the ridgeless limit. Modern LLMs are deeply overparameterised (p/n
    >> 1 for most fine-tuning scenarios), making them systematically more vulnerable
    to small-fraction poisoning attacks. Dohmatob et al. (Strong Model Collapse, 2024)
    also identified model size as a factor that amplifies collapse in sub-interpolation
    regimes.

    '
  remediation: 'Apply stronger L2 regularisation (ridge parameter) when fine-tuning
    on datasets with uncertain provenance: Flynn and Granziol (2025) show regularisation
    reduces weight alignment with the poisoning direction. Implement spectral audits
    of training data to detect directional outlier clusters (poisoning direction v)
    before fine-tuning. Consider increasing real data volume relative to model parameters
    to move away from the interpolation threshold.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-041
  name: internet-scale-ai-content-web-crawl-collapse
