- id: MEDUSA-SDP-SCAN-038
  name: recursive-stability-condition-violation
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)self.?consuming.*loop.*no.*real.*data
  - (?i)recursive.*train.*below.*stability
  - (?i)synthetic.*proportion.*exceed.*threshold.*arch
  - (?i)stl.*real.*fraction.*below
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'Self-consuming training loop below recursive stability threshold: architecture-dependent
    minimum real data proportion not maintained, collapse is guaranteed.'
  description: 'Detects self-consuming training loops operating below the architecture-dependent
    recursive stability threshold. Fu et al. (ICLR 2025) derived the first theoretical
    recursive stability condition: for a given model architecture, there exists a
    minimum proportion of real data that must be maintained in each training generation
    to ensure convergence. When the synthetic data proportion exceeds the architecture-specific
    threshold, performance collapse is theoretically guaranteed regardless of dataset
    size or other hyperparameters. This threshold varies with architecture; transformer
    in-context learning requires only a constant-sized real data proportion for convergence.

    '
  remediation: 'Derive the recursive stability condition for your specific model architecture
    (Fu et al. ICLR 2025 framework). Maintain real data proportion above the theoretical
    threshold at every training generation. Implement automated checks that verify
    the real/synthetic ratio before each training run and block execution if the stability
    condition is violated.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-039
  name: collapse-risk-dismissal-partial-avoidability
  severity: LOW
  category: synthetic_data_poisoning
  patterns:
  - (?i)model.*collapse.*avoidable.*all.*types
  - (?i)collapse.*myth.*no.*risk
  - (?i)synthetic.*data.*safe.*no.*collapse.*risk
  - (?i)model.*collapse.*solved.*accumulat
  file_types:
