  description: 'Detects training pipelines that add synthetic data to training corpora
    without importance resampling to up-weight likely human-authored content. Drayson
    et al. (EMNLP 2025) showed that combining a machine-generated text detector with
    importance resampling not only prevents collapse but improves performance above
    the all-human-data baseline across all tested model sizes (124M to 1.7B parameters).
    Pipelines that treat all synthetic and real data with equal weight miss this defence
    opportunity and accelerate convergence toward collapse.

    '
  remediation: 'Implement importance resampling using a binary machine-generated text
    classifier. Assign per-sample weights proportional to the classifier''s human-authorship
    confidence. Apply this resampling at every training generation, not just the first.
    Maintain and retrain the classifier as the generative model improves (Drayson
    et al. EMNLP 2025).

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-023
