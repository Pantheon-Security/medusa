    filtering. Namaki (2025) identifies hallucinative analytics as a core synthetic
    data risk: models trained on plausible-but-false synthetic content produce outputs
    that mimic high-confidence factual statements while being factually incorrect.
    This is distinct from model collapse (distribution shift) — it is a targeted factual
    poisoning where specific false beliefs are systematically reinforced in the model''s
    weights. At Internet scale, AI-generated misinformation content is increasingly
    contaminating web-crawled pretraining data (Dohmatob et al., ICML 2024 LAION contamination
    findings).

    '
  remediation: 'Apply factual consistency verification to web-crawled and synthetic
    training data using external knowledge bases (Wikidata, scientific databases).
    Implement cross-reference filtering to flag content that contradicts established
    facts. Downweight content from sources with high AI-generation probability combined
    with high factual inconsistency scores. Document known factual biases in training
    corpora in model cards.

    '
