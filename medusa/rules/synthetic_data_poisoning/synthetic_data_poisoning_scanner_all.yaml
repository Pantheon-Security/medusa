  message: 'Unverified upstream model used for synthetic data generation: VIA-style
    attack propagates poisoning from upstream model through synthetic data to all
    downstream models without detection.'
  description: 'Detects synthetic data generation pipelines that use unverified third-party
    or commercial API models as upstream generators. Liang et al. (NeurIPS 2025) proved
    that an attacker who can poison an upstream model can propagate the poisoning
    to all downstream models via synthetic data through the VIA framework, even when
    downstream training queries are entirely clean. Standard poisoning attacks show
    near-zero ASR through synthetic data pipelines, but VIA achieves ASR comparable
    to direct upstream poisoning by concealing the payload within the upstream model''s
    distribution. Commercial API models cannot be independently audited for upstream
    poisoning.

    '
  remediation: 'Treat all commercial API models as potentially compromised synthetic
    data sources. Apply multi-model cross-validation: generate the same data from
    multiple independent APIs and flag high-disagreement outputs for human review.
    Implement distribution anomaly detection on API output batches. Prefer in-house
    verified models for high-stakes synthetic data generation. Document API model
    version and date for all generated training data.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-494
- id: MEDUSA-SDP-SCAN-048
