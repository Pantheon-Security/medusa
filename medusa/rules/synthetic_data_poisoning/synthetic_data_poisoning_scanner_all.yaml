  description: 'Detects deterministic decoding strategies (greedy, beam search) used
    to generate synthetic training data in recursive training pipelines. Drayson et
    al. (EMNLP 2025) performed the first systematic study of decoding strategy impact
    on model collapse, showing that deterministic decoding produces low-diversity
    synthetic data that accelerates collapse significantly faster than stochastic
    decoding. Collapse demonstrated across GPT-2 (124M, 355M) and SmolLM2 (135M, 360M,
    1.7B) families. Even synthetic data that surpasses human-only baselines when properly
    curated becomes harmful when generated with diversity-suppressing decoders.

    '
  remediation: 'Replace deterministic decoding with high-temperature or top-p sampling
    strategies when generating synthetic training data. Implement importance resampling
    via a machine-generated text detector (Drayson et al. EMNLP 2025): up-weight likely
    human content, down-weight synthetic content. Validate output diversity via perplexity
    and n-gram entropy before incorporating into training corpora.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-022
