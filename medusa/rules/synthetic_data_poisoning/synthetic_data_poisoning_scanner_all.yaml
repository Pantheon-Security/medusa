    proved that across Gaussian estimation, GLMs, and nonparametric settings, the
    optimal real data weight is asymptotically equal to 1/phi ≈ 0.618 (reciprocal
    of the golden ratio). Assigning less weight to real data consistently leads to
    increased collapse risk. This provides a practical, architecture-independent guide.

    '
