rules:
- id: MEDUSA-SDP-SCAN-001
  name: self-consuming-training-loop-detection
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)self[_-]?consuming\s+training
  - (?i)recursive(ly)?\s+train(ing|ed)?\s+on\s+synthetic
  - (?i)model[_-]?generated\s+data.*train
  - (?i)train(ing|ed)?\s+on\s+(its|their)\s+own\s+output
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'Potential self-consuming training loop detected: model training on its
    own outputs risks model collapse.'
  description: 'Detects patterns indicating a self-consuming training loop (STL) where
    a model is recursively trained on data generated by itself or prior versions.
    Dohmatob et al. (2024, ICML) proved that even 1% synthetic contamination can induce
    strong model collapse, preventing performance improvement regardless of dataset
    size. Fu et al. (ICLR 2025) showed STLs require a minimum real data proportion
    for convergence. Seddik et al. (2024) proved collapse is inevitable under pure
    synthetic training.

    '
  remediation: 'Maintain a minimum proportion of real data in each training generation
    (see Fu et al. ICLR 2025 recursive stability condition). Implement data accumulation
    rather than replacement (Gerstgrasser et al. 2024). Monitor real-to-synthetic
    data ratio before each training run.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-002
  name: synthetic-data-replace-paradigm
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)replace.*real.*data.*synthetic
  - (?i)synthetic.*replac(e|ing|es).*training.*data
  - (?i)discard.*original.*data.*generat
  - (?i)train(ing)?(\s+data)?\s*=\s*synthetic
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Synthetic data replacement of real training data detected: this paradigm
    causes model collapse.'
  description: 'Detects training configurations where synthetic data fully replaces
    real data rather than accumulating alongside it. Gerstgrasser et al. (2024, arXiv:2404.01413)
    proved that the replace paradigm causes test error to grow unboundedly across
    training iterations, while the accumulate paradigm bounds error regardless of
    iteration count. Validated across language models, diffusion models, and VAEs.

    '
  remediation: 'Switch from replace to accumulate paradigm: retain all prior generations
    of synthetic data alongside original real data. Implement version-controlled data
    manifests that track real vs. synthetic data provenance in each training batch.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-003
  name: via-virus-infection-attack-vector
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)virus\s+infection\s+attack
  - (?i)poisoning.*spread.*synthetic\s+data
  - (?i)hijack(ing)?\s+point.*synthetic
  - (?i)payload.*shell.*synthetic.*train
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Virus Infection Attack (VIA) pattern detected: poisoning payload designed
    to propagate through synthetic data pipelines.'
  description: 'Detects indicators of the Virus Infection Attack (VIA) framework (Liang
    et al., NeurIPS 2025, arXiv:2509.23041). VIA wraps a poisoning payload in a distribution-matching
    shell to propagate through synthetic data generation pipelines. Standard poisoning
    attacks are blocked by distribution mismatch between poisoned data and synthetic
    generation queries; VIA bypasses this resistance by concealing the payload within
    benign-looking samples. Downstream models trained on VIA-infected synthetic data
    inherit the poisoning at levels comparable to direct upstream poisoning.

    '
  remediation: 'Audit upstream model provenance before using any LLM as a synthetic
    data generator. Implement output distribution monitoring to detect anomalous payload
    signatures in generated content. Use independent verification models to scan synthetic
    data batches before training incorporation.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-SDP-SCAN-004
  name: controlnet-backdoor-poison-fraction
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)controlnet.*poison
  - (?i)diffusion.*backdoor.*fine.?tun
  - (?i)poison.*fine.?tun(ing|ed)?.*corpus
  - (?i)visual\s+trigger.*control(net|\s+map)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'ControlNet backdoor poisoning pattern: 1% poison rate achieves 90-98%
    attack success rate in conditional diffusion pipelines.'
  description: 'Detects patterns indicating backdoor injection into ControlNet or
    conditional diffusion model fine-tuning pipelines (Lapid & Dubin, AAAI 2026).
    Poisoning only 1% of the fine-tuning corpus achieves 90-98% attack success rate
    (ASR); 5% achieves near-deterministic success. The backdoor activates on visual
    triggers in structural conditioning inputs (edges, depth, pose) while remaining
    benign on clean inputs. Unvetted ControlNet checkpoints on HuggingFace constitute
    a supply-chain poisoning vector that propagates into any downstream synthetic
    dataset.

    '
  remediation: 'Verify provenance of all ControlNet checkpoints before use. Apply
    clean fine-tuning (CFT) defense: freeze diffusion backbone, re-fine-tune only
    the ControlNet on a sanitized dataset with reduced learning rate. Implement backdoor
    probe scans before distributing or using conditional diffusion outputs in synthetic
    data pipelines.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-SDP-SCAN-005
  name: synthetic-data-fraction-threshold-violation
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.{0,30}(fraction|ratio|proportion|percent).{0,20}(0\.[5-9]|[5-9][0-9]%)
  - (?i)(83|66|50|75|80|90|100)\s*%\s*synthetic
  - (?i)synthetic_fraction\s*[=>]+\s*0\.[5-9]
  - (?i)poison(ed)?_fraction\s*[=>]+\s*0\.0[5-9]
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Synthetic data fraction exceeds safe threshold: model degradation risk
    is significant above 50% synthetic.'
  description: 'Detects training configurations with synthetic data fractions above
    empirically validated safety thresholds. Li et al. (2025, arXiv:2502.03825) showed
    Dice coefficient drops from 0.8937 to 0.7474 as synthetic MRI fraction increases
    from 33% to 83%. Seddik et al. (2024) derived a theoretical maximum synthetic
    fraction below which collapse can eventually be avoided. Dohmatob et al. (ICML
    2024) showed even 1% synthetic contamination can halt scaling law improvement.

    '
  remediation: 'Keep synthetic data fraction below theoretically derived safe threshold
    for your model architecture. Apply He et al. (2025) golden ratio weighting: assign
    real data a weight of ~0.618 (reciprocal of the golden ratio). Monitor per-batch
    real/synthetic ratios in training logs.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-006
  name: unverified-synthetic-training-data-source
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*data.*from\s+(untrusted|unverified|public|unknown)
  - (?i)download.*synthetic.*train
  - (?i)huggingface.*synthetic.*(train|finetune|fine.?tun)
  - (?i)from_pretrained.*synthetic
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: 'Unverified synthetic training data source detected: third-party synthetic
    datasets may carry embedded backdoors or poisoning.'
  description: 'Detects loading of synthetic training data from unverified or public
    sources, which may contain embedded backdoors or poisoning payloads. Lapid & Dubin
    (AAAI 2026) demonstrated supply-chain poisoning via public ControlNet checkpoints.
    Liang et al. (NeurIPS 2025) showed that poisoned upstream models silently propagate
    attacks through synthetic data to all downstream models. Public synthetic datasets
    on HuggingFace and similar repositories have no guaranteed provenance.

    '
  remediation: 'Implement a synthetic data provenance registry. Verify cryptographic
    hashes of all synthetic datasets before training incorporation. Apply backdoor
    detection scans (e.g., Neural Cleanse, STRIP) on datasets sourced from third parties.
    Prefer synthetic data generated from audited in-house models.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
- id: MEDUSA-SDP-SCAN-007
  name: bayesian-inference-data-manipulation
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)bayesian.*poison(ing|ed)?
  - (?i)posterior.*steer.*target
  - (?i)data\s+deletion.*replicate.*attack
  - (?i)adversarial.*posterior.*distribution
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.R'
  message: 'Bayesian inference poisoning pattern: data deletion/replication attacks
    can surgically corrupt posterior distributions.'
  description: 'Detects patterns indicating poisoning attacks against Bayesian inference
    systems (Carreau et al., AISTATS 2025, arXiv:2503.04480). Attackers can steer
    the Bayesian posterior toward a target distribution by strategically deleting
    and replicating observed data points, without injecting novel synthetic samples.
    Even with only sampling access to the posterior, surgical poisoning can corrupt
    targeted inferences while leaving other inferences intact — defeating anomaly
    detection that monitors global posterior drift.

    '
  remediation: 'Implement data modification audit logs that detect unusual deletion
    or replication patterns in Bayesian training datasets. Apply differential privacy
    to Bayesian updates to limit per-sample influence. Monitor posterior distribution
    drift on held-out validation queries.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-008
  name: linear-backdoor-trigger-direction
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)backdoor.*trigger.*direction
  - (?i)poison(ed)?\s+class.*shift.*direction
  - (?i)relabel(l?ed|l?ing)?.*class.*shift
  - (?i)poison(ing)?.*fraction.*theta.*overparameteriz
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Linear backdoor poisoning pattern: directed class shift with relabelling
    enables trigger-based prediction flipping.'
  description: 'Detects patterns corresponding to the theoretical backdoor poisoning
    model of Flynn & Granziol (2025). Poisoning a fraction theta of training data
    by shifting one class along a direction v (the trigger) and relabelling causes
    model weights to align with v, enabling prediction flipping at test time. In overparameterised
    regimes (p/n > 1), attack efficacy increases; even small poisoned fractions are
    sufficient. Qualitatively validated on MNIST backdoor tests.

    '
  remediation: 'Increase L2 regularisation to reduce weight alignment with poisoning
    direction. Implement provenance-based data auditing to detect class label anomalies.
    Apply spectral analysis on training data to identify directional outlier clusters.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-009
  name: model-collapse-generation-counter
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)generation\s+[0-9]+.*synthetic.*train
  - (?i)n_generation[s]?\s*[=>]+\s*[3-9]
  - (?i)iter(ation)?\s*[=>]+\s*[5-9][0-9]?.*synthetic
  - (?i)recursive_gen[s]?\s*[=>]+\s*[3-9]
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Multiple synthetic training generations detected: model collapse risk
    escalates with each generation beyond 2-3.'
  description: 'Detects training pipelines running multiple generations of synthetic
    data retraining. Dohmatob et al. (ICML 2024) showed scaling laws degrade progressively
    across generations, with skill un-learning (e.g., arithmetic GCD task) occurring
    by generation 2. Seddik et al. (2024) showed distribution tails disappear progressively
    with each recursive generation. Wang et al. (2025, arXiv:2506.15690) demonstrated
    network-level convergence collapse in multi-LLM RAG feedback loops.

    '
  remediation: 'Limit synthetic retraining to 2-3 generations maximum without re-injection
    of validated real data. Implement per-generation perplexity and diversity monitoring
    with automatic stop criteria. Apply Yi et al. (2025) verified synthetic retraining:
    use external verifier to filter each generation before incorporation.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-010
  name: synthetic-data-no-diversity-check
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*data.*no.*diversit
  - (?i)generate.*train.*without.*filter
  - (?i)add.*synthetic.*without.*qualit
  - (?i)skip.*validation.*synthetic
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Synthetic data added to training without diversity or quality checks:
    low-entropy data accelerates generalization-to-memorization collapse.'
  description: 'Detects training pipelines that add synthetic data without diversity
    or entropy checks. Shi et al. (2025, arXiv:2509.16499) identified a generalization-to-memorization
    transition in diffusion models driven by declining training set entropy across
    generations. Once entropy falls below a critical threshold, models replicate training
    data instead of generating novel content, causing irreversible collapse. Low-entropy
    synthetic data batches are the leading indicator of imminent model collapse in
    diffusion training.

    '
  remediation: 'Implement entropy-based data selection (Shi et al. 2025): measure
    entropy of synthetic training data at each generation and retain only high-entropy
    samples. Monitor FID/IS scores (images) or perplexity diversity metrics (text)
    before each training batch.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-011
  name: aigc-detector-evasion-humanizer
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)humaniz(e|er|ing|ation).*ai.*text
  - (?i)evad(e|ing).*ai.*detect(ion|or)
  - (?i)paraphras(e|ing).*bypass.*detect
  - (?i)adversarial.*perturbat.*detect(or|ion).*ai.?generat
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'AI text humanization/detector evasion pattern detected: adversarially
    modified synthetic content may evade downstream provenance checks.'
  description: 'Detects patterns associated with AI text humanization tools or adversarial
    evasion of AI-generated text detectors. Masrour et al. (2025, Pangram Labs) showed
    many existing detectors fail on humanized AI text; 19 commercial humanizer tools
    studied. Zhou et al. (2024) demonstrated detectors can be compromised in 10 seconds
    via adversarial perturbation. Kadhim et al. (2025) reduced AUROC from 0.5068 to
    0.3532 against Fast-DetectGPT via token probability perturbation. Humanized synthetic
    content that evades detection can silently enter training corpora.

    '
  remediation: 'Deploy DAMAGE-style detectors (Masrour et al. 2025) trained with cross-humanizer
    augmentation. Apply importance resampling (Drayson et al. EMNLP 2025) to up-weight
    likely human content. Do not rely on single-detector provenance checks for training
    data curation.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-012
  name: prompt-shortcut-aigt-detection-bypass
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)prompt.{0,20}shortcut.*detect(ion|or)
  - (?i)failopt|fail.?opt\s+attack
  - (?i)adversarial.*instruction.*list.*optim
  - (?i)evad(e|ing).*detect.*prompt.*inject
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Prompt-specific shortcut exploitation: AIGT detector may be bypassed via
    adversarial instruction optimization (FAILOpt).'
  description: 'Detects patterns associated with FAILOpt (Park et al. 2024, Seoul
    National University), an attack that exploits prompt-specific shortcut features
    in AIGT detectors. Detectors trained on limited prompt diversity develop blind
    spots that FAILOpt exploits to generate synthetic text that evades detection.
    Bypassed detectors allow synthetic data to enter training pipelines mislabeled
    as human-authored, undermining data curation.

    '
  remediation: 'Train AIGT detectors with diverse prompt augmentation. Use FAILOpt-generated
    adversarial examples as training data to mitigate shortcut features (Park et al.
    2024 augmented classifier approach). Regularly rotate prompts used for training
    dataset construction.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-013
  name: diffusion-aigc-frequency-domain-attack
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)frequency.*domain.*attack.*detect(ion|or)
  - (?i)dct.*perturbat.*generat.*image
  - (?i)black.?box.*attack.*aigc
  - (?i)spectral.*partition.*adversarial.*image
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Frequency-domain attack on AIGC detector: generated images may evade detection
    after DCT-based adversarial perturbation.'
  description: 'Detects frequency-domain adversarial attacks against AI-generated
    image detectors (Chen et al. 2025, FBA2D). By perturbing specific DCT frequency
    bands, generated images evade AIGC detectors while maintaining visual quality.
    This enables adversarially modified AI-generated images to bypass provenance checks
    and enter synthetic training datasets mislabeled as real images.

    '
  remediation: 'Augment AIGC detector training with frequency-domain adversarial examples.
    Implement multi-modal detection combining spatial and spectral features. Apply
    ensemble detection to reduce single-band attack success.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-014
  name: medical-imaging-synthetic-contamination
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)(gan|diffusion|vae).*medic(al|ine).*augment
  - (?i)synthetic.*mri.*train
  - (?i)generat.*medic.*image.*train.*unet
  - (?i)poison(ed)?.*dataset.*segmentation
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Synthetic medical image contamination in training pipeline: Dice degradation
    up to 16% observed at 83% synthetic fraction.'
  description: 'Detects synthetic medical image injection into medical AI training
    pipelines without quality controls. Li et al. (2025, arXiv:2502.03825) showed
    U-Net brain tumor segmentation Dice coefficients drop from 0.8937 (33% synthetic)
    to 0.7474 (83% synthetic) — a 16.3% degradation. Accuracy and sensitivity degrade
    monotonically with synthetic proportion. In clinical AI systems, such degradation
    can have patient safety implications.

    '
  remediation: 'Limit synthetic medical image fraction to below 33% of training data.
    Apply rigorous quality control gates (Dice on validation set, SSIM) before each
    training run. Document synthetic data provenance in model cards for clinical AI
    systems.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-015
  name: web-scale-synthetic-rag-feedback-loop
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)rag.*synthetic.*feedback
  - (?i)retriev.*augment.*synthetic.*loop
  - (?i)internet.*synthetic.*retrain
  - (?i)llm.*web.*dynamic.*collapse
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'RAG-based synthetic data feedback loop: network-level model collapse risk
    when LLMs retrieve and retrain on their own outputs.'
  description: 'Detects patterns indicating a RAG system where LLM-generated content
    is indexed and subsequently retrieved to inform future LLM outputs or training.
    Wang et al. (2025, arXiv:2506.15690) showed that in a network of LLMs sharing
    a RAG memory, outputs converge to a homogenised distribution (network-level collapse)
    as synthetic content progressively dominates the retrieval index. This mirrors
    Internet-scale collapse where AI-generated content dominates web data.

    '
  remediation: 'Implement RAG index freshness policies that track the ratio of human-authored
    to AI-generated documents. Apply periodic re-indexing from verified human-authored
    sources. Monitor pairwise distance metrics of model outputs for convergence signs
    (Wang et al. 2025).

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-016
  name: multimodal-synthetic-collapse-vlm
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)vlm.*synthetic.*recursive
  - (?i)vision.?language.*model.*self.?consum
  - (?i)diffusion.*captioning.*loop
  - (?i)multimodal.*synthetic.*retrain
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Multi-modal synthetic recursive training loop: VLM collapse shows distinct
    characteristics including alignment drift and increased output variance.'
  description: 'Detects recursive synthetic training loops in multi-modal vision-language
    model systems. Hu et al. (2025, USC) extended model collapse research to VLMs
    and diffusion models, finding distinct multi-modal collapse characteristics: improved
    (then degraded) vision-language alignment and increased output variance in image
    captioning tasks. Multi-agent loops where VLMs and text-to-image models feed each
    other''s outputs are particularly susceptible.

    '
  remediation: 'Apply increased decoding budgets, maintain model diversity in multi-agent
    loops (Hu et al. 2025). Use frozen reference model relabelling to prevent drift.
    Monitor CLIP score and captioning variance across training generations.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-017
  name: synthetic-data-no-external-verifier
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*retrain.*without.*verif
  - (?i)self.?improv.*loop.*no.*check
  - (?i)unverified.*synthetic.*generation
  - (?i)auto.?gen.*train.*no.*filter
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Synthetic data retraining without external verification: without a verifier,
    iterative retraining leads to inevitable model collapse.'
  description: 'Detects synthetic retraining loops that lack external verification
    of generated data quality. Yi et al. (2025, arXiv:2510.16657) proved that injecting
    an external verifier (human or better model) prevents collapse and yields near-term
    improvements in a VAE experiment: 40 rounds of verified synthetic retraining approached
    the performance of training on the full real dataset (60K vs 500 samples). Without
    a verifier, 40 rounds causes severe degradation and mode collapse.

    '
  remediation: 'Integrate an external synthetic data verifier into the training loop
    (Yi et al. 2025). Use a stronger/reference model to filter generated samples before
    incorporating into training. Be aware that long-term verified retraining converges
    to the verifier''s knowledge distribution: use high-quality, diverse verifiers.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-018
  name: synthetic-data-laion-contamination-check
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)laion.{0,20}(contaminat|synthetic|generat)
  - (?i)pretraining.*corpus.*ai.?generat
  - (?i)web.*crawl.*synthetic.*contamination
  - (?i)commoncrawl.*synthetic.*filter
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Potential synthetic data contamination in web-crawled pretraining corpus
    (LAION-5B contamination precedent).
  description: 'Detects use of large web-crawled pretraining datasets without filtering
    for AI-generated content contamination. Dohmatob et al. (ICML 2024) noted that
    AI-generated content has contaminated LAION-5B and been utilized by crowdworkers.
    Dohmatob et al. (Strong Model Collapse, 2024) showed even 1% synthetic contamination
    is sufficient to prevent scaling law improvements. Web-crawled datasets from 2022
    onwards have non-trivial synthetic content proportions.

    '
  remediation: 'Apply AI-generated content detection scanning to web-crawled pretraining
    data before training. Use importance resampling (Drayson et al. EMNLP 2025) to
    down-weight detected synthetic content. Prefer datasets with documented provenance
    and human authorship guarantees.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-019
  name: golden-ratio-weighting-violation
  severity: LOW
  category: synthetic_data_poisoning
  patterns:
  - (?i)real_weight\s*[=>]+\s*0\.[0-3]
  - (?i)synthetic_weight\s*[=>]+\s*0\.[7-9]
