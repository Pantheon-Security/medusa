  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Multi-agent synthetic data loop using homogeneous models: single-family
    agents accelerate convergence collapse without cross-model diversity enforcement.'
  description: 'Detects multi-agent synthetic data generation loops where all agents
    use the same model family or architecture. Hu et al. (2025, USC) demonstrated
    that multi-agent recursive generate-train loops exhibit distinct collapse characteristics
    including increased output variance and vision-language alignment drift. Critically,
    maintaining model diversity among agents in the loop substantially reduces collapse
    metrics. Single-model-family multi-agent systems amplify collapse because all
    agents share the same distributional biases and failure modes, preventing the
    diversity-through-disagreement mechanism that partially mitigates collapse in
    heterogeneous networks.

    '
  remediation: 'Enforce cross-family model diversity in multi-agent synthetic data
    generation pipelines (Hu et al. 2025). Use agents from at least two distinct model
    families when generating synthetic data collaboratively. Monitor pairwise agent
    output distance as a diversity metric. Apply frozen-model relabelling (Hu et al.
    2025) using a model from a different generation than the agents being trained.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-047
