  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Diffusion model memorisation-replication collapse: model has transitioned
    from generalisation to memorisation, replicating training images rather than generating
    novel content.'
  description: 'Detects signs of the generalisation-to-memorisation transition in
    diffusion model training pipelines. Shi et al. (2025, arXiv:2509.16499) identified
    this as the primary mechanism of collapse in recursive diffusion training: as
    training set entropy declines across generations, the model transitions irreversibly
    from generating novel samples to replicating training data. Once the transition
    occurs, all synthetic data generated by the collapsed model is essentially memorised
    training data, creating privacy and copyright risks in addition to training quality
    degradation. This makes memorisation monitoring essential for any system using
    diffusion-generated synthetic training data.

    '
  remediation: 'Implement entropy-based monitoring of diffusion model outputs at each
    generation (Shi et al. 2025). Apply membership inference probes to detect when
    generated images are memorised training examples. Use entropy-based data selection
    to filter low-entropy (likely memorised) samples before incorporating generated
    data into the next training round. Halt recursive training when memorisation rate
    exceeds 5%.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-046
