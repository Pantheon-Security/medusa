  - (?i)distribution.*tail.*truncat.*synthetic.*corpus
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Dual collapse error sources unmonitored: synthetic data introduces both
    statistical and functional approximation errors that compound multiplicatively
    across generations.'
  description: 'Detects training pipelines that do not monitor for the two distinct
    sources of collapse error identified by Seddik et al. (2024, arXiv:2404.05090):
    (1) statistical approximation error from finite sampling of the generative model''s
    distribution, and (2) functional approximation error from the generative model''s
    imperfect approximation of the true distribution. These errors compound multiplicatively
    across training generations, causing distribution tails to progressively disappear.
    Seddik et al. proved that pure synthetic training leads to inevitable collapse
    via these two error sources, and provided a closed-form maximum synthetic proportion
    below which collapse can be avoided.

    '
  remediation: 'Implement per-generation monitoring for both error sources: (1) measure
    sampling diversity (statistical approximation error proxy) via vocabulary/token
    distribution entropy, and (2) measure distribution divergence from real data (functional
    approximation error proxy) via KL divergence or FID on held-out real samples.
    Enforce the Seddik et al. (2024) theoretical synthetic proportion upper bound
    for your model architecture.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-045
  name: diffusion-model-memorisation-replication-collapse
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)diffusion.*memoris.*train.*sample
  - (?i)image.*generat.*replicate.*train.*data
  - (?i)generali[sz]ation.*memoris.*transition.*diffusion
  - (?i)training.*replicate.*synthetic.*generat
