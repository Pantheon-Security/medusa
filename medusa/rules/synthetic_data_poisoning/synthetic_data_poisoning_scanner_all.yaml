  message: 'Synthetic tabular data training contamination: GAN/VAE-generated tabular
    data can introduce statistical artifacts that corrupt downstream ML model behaviour.'
  description: 'Detects ML training pipelines that incorporate synthetic tabular data
    (generated via CTGAN, TVAE, or similar) without quality controls. Synthetic tabular
    data inherits the biases and limitations of the generating model, including mode
    collapse and distributional artifacts. He et al. (2025) validated golden ratio
    weighting on tabular data models, showing collapse risk is architecture-independent.
    Namaki (2025) identifies reality gaps — divergence between synthetic and real-world
    distributions — as a primary risk in tabular synthetic data, particularly in high-stakes
    domains (finance, healthcare, fraud detection) where distribution accuracy directly
    affects decision-making quality.

    '
  remediation: 'Apply golden ratio weighting (real data weight approximately 0.618,
    He et al. 2025) when mixing real and synthetic tabular data. Implement statistical
    distribution tests (KL divergence, Kolmogorov-Smirnov) between synthetic and real
    tabular data before training. Use TSTR (Train on Synthetic, Test on Real) benchmarks
    to validate synthetic data fidelity. Cap synthetic tabular data at below 38% of
    total training data.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-043
