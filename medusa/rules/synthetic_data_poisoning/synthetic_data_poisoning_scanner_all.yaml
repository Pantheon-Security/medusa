  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-052
  name: small-llm-recursive-synthetic-training-risk
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)gpt.?2.*recursive.*train
  - (?i)smollm.*synthetic.*retrain
  - (?i)small.*llm.*self.?consum.*loop
  - (?i)124m.*355m.*synthetic.*loop
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'Small LLM (GPT-2/SmolLM2 scale) recursive synthetic training: collapse
    demonstrated empirically at 124M-1.7B parameter scale; diversity collapse occurs
    within 2-3 generations.'
  description: 'Detects recursive synthetic training loops applied to small LLMs in
    the GPT-2 or SmolLM2 parameter range (124M to 1.7B). Drayson et al. (EMNLP 2025)
    empirically demonstrated model collapse across all tested model sizes in this
    range under recursive synthetic training without importance resampling. Collapse
    is not a large-model phenomenon — it occurs at every tested scale. Importantly,
    collapse can be prevented and performance improved above human-data baselines
    at all these scales with proper importance resampling. Pipelines targeting small
    models for distillation face additional VIA risks (Liang et al., NeurIPS 2025)
    at every model scale.

    '
  remediation: 'Apply Drayson et al. (EMNLP 2025) importance resampling with a binary
    machine-generated text detector, regardless of model scale. Collapse prevention
    is effective at 124M parameter scale with the same technique used at 1.7B. Validate
    with per-generation perplexity and diversity metrics. Do not assume small models
    are more or less vulnerable than large models.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-053
  name: kl-divergence-posterior-target-attack-objective
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)kl.*divergence.*posterior.*target.*optim
  - (?i)minimis.*kl.*posterior.*attack
  - (?i)steer.*posterior.*target.*distribution
  - (?i)adversarial.*bayes.*optim.*delete.*replicate
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.R'
  - '*.ipynb'
  message: 'KL-divergence-based posterior steering attack: Bayesian inference system
    targeted for surgical posterior corruption via optimised data deletion/replication.'
  description: 'Detects optimisation objectives that minimise KL divergence between
    a Bayesian posterior and an attacker-specified target distribution, consistent
    with the attack framework of Carreau et al. (AISTATS 2025, arXiv:2503.04480).
    The paper develops two attack families: two-stage SGD and single-stage perturbed-gradient,
    both aimed at surgically corrupting targeted inferences while leaving other posteriors
    intact to evade anomaly detection. This attack operates without injecting novel
    synthetic points — only by deleting and replicating existing observed data, making
    it resistant to new-data-injection detection. Demonstrated in both synthetic and
    real-world Bayesian regression and classification scenarios with substantial posterior
    alteration at modest perturbation budgets.

    '
  remediation: 'Implement differential privacy in Bayesian updates to limit per-sample
    influence on the posterior. Apply data modification audit logs that detect unusual
    deletion or replication patterns. Monitor posterior distribution consistency on
    held-out validation queries at regular intervals. Implement rate limiting on data
    deletion and replication operations in Bayesian inference pipelines.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-054
  name: surgical-posterior-corruption-global-detection-bypass
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)surgical.*posterior.*corrupt
  - (?i)targeted.*inference.*corrup.*bayesian
  - (?i)selective.*posterior.*manipul
  - (?i)specific.*query.*posterior.*alter.*undetect
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.R'
  message: 'Surgical Bayesian posterior corruption: targeted inferences corrupted
    while leaving other posteriors intact, defeating global anomaly detection methods.'
  description: 'Detects patterns consistent with surgical Bayesian posterior corruption
    attacks where an attacker targets specific inference queries while leaving other
    queries intact. Carreau et al. (AISTATS 2025) demonstrated this precision attack
    property: by carefully selecting which data points to delete/replicate, an attacker
    can corrupt only the posteriors for specific queries of interest while keeping
    all other inferences consistent with normal posterior behaviour. This surgical
    precision defeats global anomaly detection that monitors overall posterior drift,
    as the perturbation is invisible at the aggregate level.

    '
  remediation: 'Implement query-level posterior consistency monitoring rather than
    relying solely on aggregate posterior drift detection. Apply per-query posterior
    change alerts triggered by divergence above a per-query threshold. Use independent
    Bayesian models trained on separate data subsets to cross-validate high-stakes
    inference queries. Apply differential privacy with a per-query privacy budget.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-055
  name: scaling-law-exponent-monitoring-absent
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)scaling.*law.*exponent.*synthetic.*monitor
  - (?i)loss.*curve.*synthetic.*generati
  - (?i)benchmark.*degradat.*synthetic.*retrain
  - (?i)performance.*plateau.*synthetic.*data
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'Scaling law monitoring absent from synthetic training pipeline: degrading
    scaling law exponents are an early indicator of collapse not visible in per-sample
    loss.'
  description: 'Detects synthetic retraining pipelines that monitor per-sample loss
    but not scaling law exponents, which Dohmatob et al. (ICML 2024) identified as
    the primary early indicator of synthetic data contamination impact. As synthetic
    data fractions increase, the scaling law exponent degrades: the model learns less
    from each additional real data example. This scaling degradation precedes visible
    loss increases, making it an early warning signal. By the time per-sample loss
    increases detectably, the model has already undergone substantial skill un-learning
    (demonstrated on GCD arithmetic with Llama2 by generation 2).

    '
  remediation: 'Implement scaling law exponent monitoring: track loss vs. dataset
    size curves across training checkpoints and compare exponents across synthetic
    data fraction variants (Dohmatob et al. ICML 2024). Alert when exponents fall
    below architecture-expected baselines. Use skill-specific benchmark evaluation
    (arithmetic tasks, specific domain benchmarks) as early degradation indicators
    alongside perplexity metrics.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-056
  name: gan-mode-collapse-synthetic-training-data
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)gan.*mode.*collapse.*train.*data
  - (?i)generator.*mode.*drop.*synthetic
  - (?i)low.*diversit.*gan.*corpus
  - (?i)collapsed.*generator.*output.*train
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'GAN mode collapse in synthetic data generator: collapsed GAN produces
    low-diversity synthetic data that accelerates downstream model collapse and introduces
    statistical artifacts.'
  description: 'Detects training pipelines that incorporate data from a GAN exhibiting
    mode collapse (where the generator produces limited diversity of outputs covering
    only a subset of the real data distribution). GAN mode collapse produces synthetic
    data with dramatically reduced diversity and systematic distributional gaps, which
    when used in downstream model training mirrors the tail truncation effect documented
    by Dohmatob et al. (ICML 2024). A collapsed GAN effectively amplifies the worst-case
    scenario of synthetic data contamination: the generator is stuck in a narrow mode,
    making all generated samples statistically similar and providing minimal learning
    signal while introducing the full collapse risk associated with synthetic data.

    '
  remediation: 'Apply GAN training health monitoring: track Inception Score (IS),
    Frechet Inception Distance (FID), and intra-class diversity metrics during GAN
    training. Implement early stopping when diversity metrics indicate mode collapse
    onset. Do not use GAN outputs for downstream training when FID scores indicate
    significant distributional narrowing. Consider using diffusion models as alternatives
    (though entropy collapse risk per Shi et al. 2025 applies).

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-057
  name: frozen-model-relabelling-absent-multimodal
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)vlm.*caption.*no.*frozen.*relabel
  - (?i)multimodal.*loop.*self.?label
  - (?i)text.to.image.*caption.*same.*model
  - (?i)diffusion.*captioning.*no.*reference.*model
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: 'Multimodal recursive loop without frozen model relabelling: self-labelling
    VLM/diffusion cycles accelerate alignment drift and output variance collapse.'
  description: 'Detects multimodal recursive generate-train loops where a vision-language
    model or diffusion model relabels its own outputs without using a frozen reference
    model. Hu et al. (2025, USC) showed that multi-modal collapse manifests as increased
    output variance and vision-language alignment drift (declining CLIP scores) when
    models recursively train on self-generated captions or images. The use of a frozen
    reference model for relabelling — where a non-updated model labels new synthetic
    data — is identified as a primary mitigation. Self-labelling (same model generates
    and evaluates) creates a reinforcement feedback loop that amplifies distributional
    biases.

    '
  remediation: 'Implement frozen model relabelling in all multimodal synthetic training
    loops: use a checkpoint from a previous generation (frozen) to label synthetic
    data generated by the current model version (Hu et al. 2025). Rotate the frozen
    reference model periodically. Monitor CLIP score and captioning variance as collapse
    indicators. Apply independent image quality metrics (FID, SSIM) to detect alignment
    drift before training incorporation.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-058
  name: machine-unlearning-synthetic-poisoning-incompleteness
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)machine.*unlearn.*synthetic.*data
  - (?i)forget.*poison.*synthetic.*train
  - (?i)remove.*contamination.*model.*weight
  - (?i)scrub.*backdoor.*synthetic.*finetune
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: 'Machine unlearning targeting synthetic data contamination: verify unlearning
    completeness; partial removal of VIA-style distributed poisoning may leave residual
    attack vectors.'
  description: 'Detects machine unlearning attempts targeting synthetic data poisoning
    in trained models. Machine unlearning (targeted forgetting of training data influence)
    is increasingly proposed as a remediation for discovered poisoning. However, for
    distributed synthetic data poisoning attacks (VIA: Liang et al., NeurIPS 2025),
    the poisoning is spread across many apparently benign training examples via distribution-matching
    shells. Identifying and specifying the exact poisoned training examples for unlearning
    is difficult when the attack is designed to be invisible at the individual sample
    level. Partial unlearning may remove surface-level indicators while leaving residual
    poisoning in deeper representations.

    '
  remediation: 'Supplement machine unlearning with targeted capability probing: after
    unlearning, evaluate the model on a comprehensive suite of attack-trigger probes
    to verify complete removal. Apply second-order sensitivity analysis to identify
    residual weight patterns consistent with poisoning (Flynn and Granziol 2025 weight
    alignment diagnostic). Consider full retraining from a pre-poisoning checkpoint
    if unlearning completeness cannot be verified.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-SDP-SCAN-059
  name: synthetic-data-benchmark-contamination
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)benchmark.*contamin.*synthetic.*train
  - (?i)test.*set.*llm.*generat.*train
  - (?i)evaluation.*data.*leaked.*train.*synthetic
  - (?i)benchmark.*data.*generat.*includ.*finetune
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Synthetic training data potentially contaminated with benchmark evaluation
    data: LLMs trained on benchmark-aware generated data may have memorised evaluation
    sets.'
  description: 'Detects training pipelines where LLM-generated synthetic data may
    contain paraphrased or reconstructed versions of standard evaluation benchmarks
    (MMLU, HellaSwag, GSM8K, HumanEval, etc.). Large teacher LLMs (GPT-4, Claude)
    have high probability of having memorised standard benchmarks during pretraining.
    When used to generate synthetic training data via prompts that could elicit benchmark-adjacent
    content, the generated data may inadvertently contain benchmark answers or near-duplicates,
    causing benchmark contamination in student models and inflating reported evaluation
    metrics.

    '
  remediation: 'Apply n-gram deduplication and fuzzy matching against standard evaluation
    benchmarks before incorporating LLM-generated synthetic data into training corpora.
    Use benchmark canary strings (known test examples) to probe for contamination
    in generated data batches. Prefer synthetic data generated from domain-specific
    prompts far from benchmark evaluation topics. Report contamination scan results
    in model cards.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-060
  name: synthetic-data-pipeline-access-control-missing
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*pipeline.*no.*auth
  - (?i)data.*generat.*endpoint.*unprotect
  - (?i)train.*data.*upload.*no.*acl
  - (?i)synthetic.*corpus.*write.*unrestrict
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: 'Synthetic data pipeline lacks access controls: unauthenticated write access
    to training data storage enables direct corpus poisoning without sophisticated
    attack techniques.'
  description: 'Detects synthetic data generation or training data storage pipelines
    that lack appropriate access controls (authentication, authorisation, audit logging).
    Unprotected write access to training data storage is the simplest possible poisoning
    vector: an attacker with write access can directly inject poisoned examples without
    needing any of the sophisticated techniques described in the research literature
    (VIA, ControlNet backdoors, Bayesian posterior steering). Training data storage
    should be treated with the same security posture as production code repositories.
    All complex supply-chain poisoning attacks become irrelevant if the final training
    data store is directly writable.

    '
  remediation: 'Implement role-based access controls on all training data storage
    systems. Require MFA for any write access to training corpora. Apply append-only
    audit logging to all training data mutations. Implement cryptographic checksums
    that are verified before each training run. Apply the principle of least privilege:
    data generation services should only have write access to designated staging areas,
    not directly to production training data stores.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-284
