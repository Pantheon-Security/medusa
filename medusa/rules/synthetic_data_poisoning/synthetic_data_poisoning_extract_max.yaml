rules:
- id: MEDUSA-SYNDP-SCAN-001
  name: llm-synthetic-data-generation-poisoning
  description: Detects code that generates synthetic training data using LLMs without verification or quality controls, which
    can introduce poisoned instruction-response pairs that propagate biases, backdoors, or harmful behaviors into downstream
    fine-tuned models.
  severity: critical
  category: synthetic_data_poisoning
  patterns:
  - generate.*synthetic.*data.*llm|llm.*generate.*synthetic.*data
  - instruction.*response.*pair.*unverif|unverif.*instruction.*response.*pair
  - synthetic.*corpus.*poison|poison.*synthetic.*corpus
  - auto.*label.*synthetic.*train|synthetic.*train.*auto.*label
  - llm.*generat.*train.*data.*no.*verif|no.*verif.*llm.*generat.*train.*data
  - mllm.*generate.*qa.*pair.*inject|inject.*mllm.*generate.*qa.*pair
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.jsonl'
  message: 'Detected: llm-synthetic-data-generation-poisoning'
- id: MEDUSA-SYNDP-SCAN-002
