    QA generators where injected malicious questions or manipulated answers could poison retriever training or fine-tuned
    model behavior.
  severity: high
  category: synthetic_data_poisoning
  patterns:
  - qa.*pair.*generat.*no.*valid|no.*valid.*qa.*pair.*generat
  - synthetic.*question.*answer.*inject|inject.*synthetic.*question.*answer
