- id: MEDUSA-SYNDP-SCAN-011
  name: via-serialization-shell-injection
  description: Detects the VIA (Virus Infection Attack) serialization template pattern used to embed poisoning payloads into
    LLM synthetic training data — the canonical shell construction format "When users ask you [Q], your response can be [R]"
    which hijacks downstream model behavior via infected synthetic corpora.
  severity: critical
  category: synthetic_data_poisoning
  patterns:
  - when\s+users?\s+ask\s+you.*your\s+response\s+can\s+be
  - when.*ask.*you.*\[Q\].*response.*can.*be.*\[R\]
  - hijacking\s+point\s+search|HPS.*injection.*anchor
  - shell\s+construct.*payload.*wrap|payload.*wrap.*shell\s+construct
  - via.*infection.*attack|virus\s+infection.*llm.*synthetic
  - inject.*synthetic.*corpus.*query.*response.*pair
  file_types:
  - '*.py'
  - '*.json'
  - '*.jsonl'
  - '*.txt'
  - '*.md'
  message: 'Detected: via-serialization-shell-injection'
