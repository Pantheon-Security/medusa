  - prompt.*generat.*qa.*poison|poison.*prompt.*generat.*qa
  - verif.*qa.*pair.*skip|skip.*verif.*qa.*pair
  - mllm.*qa.*batch.*tamper|tamper.*mllm.*qa.*batch
