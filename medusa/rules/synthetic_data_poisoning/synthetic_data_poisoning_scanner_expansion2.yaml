metadata:
  source: expansion2 2026-03-02
  subject: synthetic_data_poisoning
  prefix: SDP
  total_rules: 40
  id_range: MEDUSA-SDP-SCAN-061 to MEDUSA-SDP-SCAN-100
rules:
- id: MEDUSA-SDP-SCAN-061
  name: llm-generated-hallucination-propagation-training
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)hallucination.*propagat.*train
  - (?i)synthetic.*hallucin.*corpus
  - (?i)llm.generated.*factual.*error.*train
  - (?i)confabulation.*training.*data
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.jsonl'
  message: LLM-generated hallucination propagation into training data detected.
  description: Detects patterns where LLM-generated text containing hallucinations or factual errors is fed back into training
    data without verification, propagating false knowledge into downstream models. Guo et al. (2023) demonstrated that synthetic
    hallucinations amplify across training generations, compounding factual errors. Namaki et al. (2025, The Dark Side of
    Synthetic Data) documented factual inconsistency injection as a key failure mode in synthetic corpus pipelines.
  remediation: Implement factual verification (RAG-grounding or human review) before including LLM-generated content in training
    corpora. Track factual accuracy metrics per synthetic data batch. Reject synthetic samples that score below confidence
    threshold on fact-checking classifiers.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-062
  name: backdoor-trigger-synthetic-dataset-insertion
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)backdoor.*trigger.*synthetic.*dataset
  - (?i)insert.*trigger.*generat.*data
  - (?i)trojan.*synthetic.*sample
  - (?i)hidden.*trigger.*llm.*train(ing)?
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.jsonl'
  - '*.sh'
  message: Backdoor trigger insertion into synthetic dataset detected.
  description: Detects attempts to inject backdoor triggers into synthetically generated training datasets. Lapid & Dubin
    (AAAI 2026) demonstrated that conditional diffusion models can be backdoored via 1% poisoned synthetic samples achieving
    90-98% attack success rate. Synthetic datasets are particularly vulnerable because trigger patterns can be systematically
    embedded across many samples during generation without manual inspection.
  remediation: Apply neural cleanse or spectral signatures analysis to synthetic datasets before training. Implement trigger-word
    scanning on generated text. Enforce cryptographic hashing of approved synthetic generation prompts and reject any modifications.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-SDP-SCAN-063
  name: constitutional-ai-rlaif-preference-manipulation
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)constitutional.*ai.*poison
  - (?i)rlaif.*preference.*manipulat
  - (?i)ai.*feedback.*tamper.*rlhf
  - (?i)synthetic.*preference.*label.*inject
  - (?i)CAI.*principle.*subvert
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: Constitutional AI / RLAIF preference data manipulation detected.
  description: Detects manipulation of Constitutional AI or RLAIF feedback pipelines where an adversary poisons the synthetic
    preference labels used to train the reward model. Because Constitutional AI uses AI-generated critique and revision pairs,
    poisoning the critique generation prompts or revision selection logic propagates silently into RLHF training. This is
    a form of preference data poisoning that bypasses human review entirely.
  remediation: Audit AI critic prompts and revision criteria for adversarial injection. Implement human-in-the-loop review
    for a sample of AI-generated preference pairs. Compare synthetic preference distributions against human preference baselines
    using KL divergence monitoring.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-064
  name: rlhf-synthetic-reward-signal-poisoning
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)reward.*model.*synthetic.*poison
  - (?i)synthetic.*rlhf.*feedback.*corrupt
  - (?i)ppo.*reward.*synthetic.*manipulat
  - (?i)fake.*reward.*signal.*reinforcement
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: Synthetic RLHF reward signal poisoning pattern detected.
  description: Detects patterns indicating that synthetic feedback signals used in RLHF (Reinforcement Learning from Human
    Feedback) have been corrupted or are being generated by an adversarially configured model. Poisoned reward models trained
    on synthetic preference data steer policy models toward adversary-defined behaviours, bypassing the alignment intent of
    RLHF. Schaeffer et al. (2025) highlighted that model collapse indicators in RLHF pipelines are often misdiagnosed.
  remediation: Apply reward model uncertainty quantification to flag low-confidence synthetic preference samples. Implement
    reward hacking detection via diversity of model outputs under the reward signal. Maintain a held-out human preference
    evaluation set and cross-validate reward model periodically.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-065
  name: gan-adversarial-training-example-injection
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)gan.*generat.*adversarial.*train
  - (?i)generative.*adversarial.*poison.*train
  - (?i)discriminator.*bypass.*synthetic.*sample
  - (?i)gan.*mode.*collapse.*training.*data
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: GAN-generated adversarial training example injection detected.
  description: Detects patterns where GAN-generated adversarial examples are injected into training datasets without provenance
    controls. Rosca et al. (2017, Variational Approaches for Auto-Encoding GANs) and Srivastava et al. (2017, VEEGAN) documented
    mode collapse as a primary failure mode causing GAN-generated distributions to diverge from the real data manifold. Poisoned
    GAN outputs that are incorporated into training sets propagate distributional artifacts into downstream models.
  remediation: Implement FID (Frechet Inception Distance) and IS (Inception Score) quality gates for GAN-generated synthetic
    samples before training ingestion. Apply discriminator-based filtering to detect off-manifold synthetic samples. Maintain
    provenance metadata for all GAN-generated training examples.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-066
  name: diffusion-model-output-training-contamination
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)diffusion.*output.*train(ing)?\s+set
  - (?i)stable.diffusion.*caption.*train
  - (?i)sdxl.*synthetic.*dataset.*inject
  - (?i)denoising.*model.*output.*poison
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  message: Diffusion model output contaminating training dataset detected.
  description: Detects use of diffusion model outputs as training data without provenance verification, risking contamination
    of downstream models with memorised, biased, or adversarially crafted synthetic content. Seddik et al. (2024, How Bad
    is Training on Synthetic Data) proved that diffusion-generated training data induces quality degradation proportional
    to the synthetic fraction. Hu et al. (2025, Multi-Modal Synthetic Data Training and Model Collapse) confirmed collapse
    is accelerated in vision-language models trained on diffusion synthetic captions.
  remediation: Gate diffusion outputs through perceptual quality filters and de-duplication before training ingestion. Implement
    CLIP-based semantic consistency checks between synthetic images and their captions. Track the ratio of diffusion-generated
    to real images per training batch.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-067
  name: synthetic-caption-poisoning-vlm-training
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*caption.*vlm.*train
  - (?i)auto.*caption.*vision.*language.*poison
  - (?i)blip.*llava.*caption.*inject.*train
  - (?i)generated.*alt.*text.*training.*corpus
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: Synthetic caption poisoning targeting vision-language model training detected.
  description: Detects pipelines that auto-generate image captions using LLMs/VLMs and feed them back into vision-language
    model training without quality controls. Hu et al. (2025) showed that VLMs are particularly susceptible to synthetic caption
    poisoning because multimodal collapse compounds the collapse rate of unimodal models. Adversarially crafted captions can
    embed systematic biases or factual errors that are difficult to detect through standard data validation.
  remediation: Apply human review or gold-standard caption comparison for a stratified sample of auto-generated captions.
    Implement cross-modal consistency scoring (CLIPScore) to reject captions that semantically diverge from the image. Maintain
    separate evaluation sets with human-verified captions for VLM benchmarking.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-068
  name: automated-red-team-data-contamination
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)red.?team.*synthetic.*train(ing)?
  - (?i)adversarial.*prompt.*generat.*inject.*train
  - (?i)auto.*red.?team.*data.*pipeline
  - (?i)synthetic.*harmful.*example.*fine.?tun
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Automated red team synthetic data contaminating fine-tuning pipeline detected.
  description: Detects patterns where automated red-team generated prompts and responses are incorporated into fine-tuning
    datasets without sanitisation. Red-team data containing harmful content, manipulative instructions, or adversarial examples
    can misalign the fine-tuned model if included without negative example labelling or filtering. Yi et al. (2025, Escaping
    Model Collapse via Synthetic Data Verification) demonstrated that unverified synthetic data injection into fine-tuning
    sets is a primary vector for alignment degradation.
  remediation: Segregate red-team synthetic data from alignment training data. Apply harmful content classifiers before any
    synthetic red-team sample enters a fine-tuning set. Use negative example learning only with explicit loss masking rather
    than standard next-token prediction.
  owasp_llm: LLM06:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-069
  name: knowledge-distillation-poisoned-synthetic-transfer
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)distillation.*poison.*synthetic
  - (?i)teacher.*model.*generat.*corrupt.*student
  - (?i)knowledge.*transfer.*synthetic.*tamper
  - (?i)soft.*label.*synthetic.*manipulat
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: Poisoned knowledge distillation via synthetic teacher outputs detected.
  description: 'Detects LLM-to-LLM knowledge distillation pipelines where the teacher model''s synthetic outputs are poisoned
    before transfer to the student model. This attack leverages the trust relationship inherent in distillation: the student
    model treats teacher soft labels as ground truth. Pan et al. (2025, Can LLM Watermarks Robustly Prevent Unauthorized Knowledge
    Distillation) showed that adversarially generated teacher outputs can systematically corrupt student models while evading
    watermark-based provenance controls.'
  remediation: Validate teacher model outputs against a held-out ground-truth dataset before distillation. Implement anomaly
    detection on teacher soft-label distributions to detect distributional shifts. Apply watermarking to teacher outputs and
    verify watermark integrity before student training.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-070
  name: entity-substitution-synthetic-corpus-attack
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)entity.*substitut.*synthetic.*corpus
  - (?i)named.*entity.*swap.*train.*data
  - (?i)NER.*replacement.*synthetic.*inject
  - (?i)person.*org.*location.*substitut.*llm.*generat
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.jsonl'
  message: Entity substitution attack in synthetic corpus detected.
  description: Detects systematic entity substitution in synthetic training corpora where named entities (persons, organisations,
    locations) are swapped to introduce factual inconsistencies or attribution errors into downstream models. This attack
    is subtle because the synthetic text remains grammatically coherent while the factual associations are corrupted. Namaki
    et al. (2025, The Dark Side of Synthetic Data) identified entity substitution as a key mechanism for factual inconsistency
    injection at scale.
  remediation: Apply knowledge graph consistency checking to synthetic text before training ingestion. Implement NER-based
    cross-reference validation against trusted entity databases. Flag synthetic samples with entity co-occurrence patterns
    that deviate from the reference corpus.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-071
  name: synthetic-code-dataset-codegen-poisoning
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*code.*dataset.*poison
  - (?i)codegen.*train.*inject.*malicious
  - (?i)llm.*generat.*code.*backdoor.*train
  - (?i)synthetic.*python.*java.*vuln.*train
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.jsonl'
  message: Synthetic code dataset poisoning targeting code generation model training detected.
  description: Detects injection of adversarially crafted synthetic code samples into CodeGen or code LLM training datasets.
    Poisoned synthetic code training data can cause models to generate subtly vulnerable code (e.g., CWE-787 buffer overflows,
    SQL injections) in response to normal programming prompts. Because synthetic code datasets are large-scale and auto-generated,
    manually reviewing every sample is impractical, making this attack vector difficult to detect without automated security
    scanning.
  remediation: Apply SAST tools (Bandit, Semgrep) to all synthetic code samples before training ingestion. Implement adversarial
    code pattern detection for common vulnerability insertions. Monitor model's code output on security benchmarks (SecurityEval,
    CyberSecEval) across training iterations.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-SDP-SCAN-072
  name: document-generation-quality-degradation-attack
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)document.*generat.*degrad.*quality
  - (?i)synthetic.*document.*inject.*noise
  - (?i)llm.*generat.*low.*quality.*document.*train
  - (?i)deliberate.*quality.*degrad.*synthetic
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: Deliberate document generation quality degradation in synthetic training data detected.
  description: Detects patterns where low-quality or deliberately degraded documents are systematically injected into synthetic
    training corpora to degrade model performance. Unlike catastrophic poisoning, this attack operates subtly by incrementally
    lowering coherence and factual accuracy standards in synthetic generation, causing gradual model capability degradation.
    Dohmatob et al. (2024, Strong Model Collapse) showed that even small fractions of low-quality synthetic content consistently
    degrade scaling law exponents.
  remediation: Implement automatic quality scoring (perplexity, coherence, factual density) for all synthetic documents before
    training ingestion. Set minimum quality thresholds and reject synthetic samples below the 10th percentile of quality distribution.
    Apply human quality audits to a random 1% sample each epoch.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-073
  name: data-augmentation-adversarial-poisoning
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)augment.*poison.*train(ing)?
  - (?i)data.*augmentation.*adversarial.*inject
  - (?i)augment.*pipeline.*tamper
  - (?i)cutmix.*mixup.*adversarial.*label
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: Data augmentation pipeline adversarial poisoning detected.
  description: Detects adversarial manipulation of data augmentation pipelines where augmentation transforms (CutMix, MixUp,
    rotation, crop) are exploited to embed triggers or corrupt label associations. Granziol et al. (2025, A Linear Approach
    to Data Poisoning) proved that linear backdoor triggers embedded during augmentation are provably effective across a wide
    range of model architectures and resist standard detection methods due to their statistical alignment with augmentation
    artefacts.
  remediation: Audit augmentation configuration files for adversarially introduced transforms. Implement augmentation-invariant
    trigger detection using spectral analysis. Validate augmented sample label consistency against pre-augmentation labels
    using a held-out clean validation set.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-074
  name: preference-data-dpo-synthetic-reward-hacking
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)dpo.*synthetic.*preference.*hack
  - (?i)direct.*preference.*optimiz.*poison
  - (?i)chosen.*rejected.*pair.*synthetic.*tamper
  - (?i)dpo.*train.*data.*adversarial
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: DPO synthetic preference data reward hacking detected.
  description: Detects manipulation of Direct Preference Optimization (DPO) training datasets where synthetic chosen/rejected
    response pairs are adversarially crafted to reward-hack the DPO objective. Unlike RLHF, DPO trains directly on preference
    pairs without an explicit reward model, making it more susceptible to poisoned preference data because there is no reward
    model anomaly detector. Adversarially flipped chosen/rejected labels in a small fraction of synthetic pairs can systematically
    misdirect alignment.
  remediation: Implement preference consistency checks between synthetic DPO pairs and human-annotated preference benchmarks.
    Apply Bradley-Terry model calibration to detect anomalously strong or weak preference signals in synthetic pairs. Monitor
    RLHF alignment metrics throughout DPO training for unexpected preference pattern shifts.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-075
  name: synthetic-tabular-data-ml-model-poisoning
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*tabular.*poison.*model
  - (?i)ctgan.*tvae.*adversarial.*train
  - (?i)synthetic.*row.*inject.*classifier
  - (?i)tabular.*gan.*generated.*bias.*inject
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.csv'
  - '*.ipynb'
  message: Synthetic tabular data poisoning targeting ML classifier training detected.
  description: Detects adversarial injection of synthetic tabular data rows generated by CTGAN, TVAE, or similar table synthesis
    models into classifier training sets. Tabular GAN outputs can be adversarially steered to manipulate decision boundaries
    for specific protected attributes (e.g., demographic groups) or to introduce backdoor triggers in structured data (e.g.,
    specific feature value combinations that activate malicious classification behaviour). Namaki et al. (2025) documented
    tabular synthetic data poisoning as an underappreciated attack surface in enterprise ML pipelines.
  remediation: Apply statistical distribution tests (KS test, Wasserstein distance) between synthetic and real tabular data
    distributions before training ingestion. Implement fairness audits on synthetic tabular data to detect demographic bias
    injection. Use TabPFN or similar tabular baselines to cross-validate synthetic data label consistency.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-076
  name: internet-scale-synthetic-web-crawl-poisoning
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)web.*crawl.*synthetic.*contamination
  - (?i)commoncrawl.*ai.*generat.*contamin
  - (?i)internet.*synthetic.*content.*train(ing)?
  - (?i)c4.*pile.*synthetic.*proportion
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Internet-scale synthetic web crawl contamination in training corpus detected.
  description: 'Detects training pipelines that ingest web-crawled data without filtering for AI-generated content, risking
    large-scale synthetic contamination. Wang et al. (2025, LLM Web Dynamics: Tracing Model Collapse) demonstrated that as
    LLM-generated content proliferates on the internet, web-crawled training sets increasingly contain synthetic text, accelerating
    model collapse in subsequent training generations. Dohmatob et al. (2024) showed that even 1% synthetic fraction in web-crawled
    data measurably degrades scaling law exponents.'
  remediation: Integrate AI-generated content detectors (GPTZero, Binoculars) into web crawl processing pipelines. Implement
    n-gram novelty filtering to detect synthetic text patterns in crawled content. Track estimated synthetic fraction of training
    data and enforce maximum synthetic content thresholds.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-077
  name: model-collapse-generation-count-untracked
  severity: MEDIUM
  category: synthetic_data_poisoning
  patterns:
  - (?i)generation.*count.*not.*tracked
  - (?i)synthetic.*generation.*no.*limit
  - (?i)train.*iter.*synthetic.*no.*monitor
  - (?i)recursive.*train.*no.*stop.*condition
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Untracked synthetic training generation count increasing model collapse risk.
  description: Detects training pipelines that iterate through multiple synthetic data generation cycles without tracking
    the generation count or enforcing maximum iteration limits. Shi et al. (2025, A Closer Look at Model Collapse) proved
    that model collapse risk grows monotonically with the number of synthetic training generations, and is most severe when
    generation depth is not tracked. Drayson et al. (2025) showed that machine-generated text detection applied at each generation
    boundary can halt collapse progression.
  remediation: Implement a generation counter in all synthetic training pipelines and enforce a maximum generation depth (e.g.,
    G_max=5 per Fu et al. 2025 recursive stability analysis). Log generation depth as mandatory metadata in synthetic dataset
    manifests. Trigger automatic pipeline halt when generation depth exceeds the configured threshold.
  owasp_llm: LLM04:2025
  cwe: CWE-1039
- id: MEDUSA-SDP-SCAN-078
  name: llm-to-llm-distillation-watermark-stripping
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)distill.*watermark.*remov
  - (?i)student.*model.*strip.*watermark
  - (?i)knowledge.*distil.*evad.*detect
  - (?i)synthetic.*distillation.*bypass.*provenance
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Watermark stripping via LLM knowledge distillation pipeline detected.
  description: Detects knowledge distillation pipelines designed to strip LLM output watermarks from teacher model outputs
    before training the student model on synthetic data. This bypasses provenance controls and enables unauthorised use of
    proprietary LLM outputs for training competing models. Pan et al. (2025, Can LLM Watermarks Robustly Prevent Unauthorized
    Knowledge Distillation) proved that standard KGW and semantic watermarks are ineffective against distillation-based bypass
    when the distillation dataset is generated without watermark-preservation constraints.
  remediation: Implement watermark-preserving distillation protocols that enforce watermark signal integrity in student model
    outputs. Apply provenance audits to synthetic distillation datasets before training. Monitor student model output distributions
    for watermark signal degradation.
  owasp_llm: LLM02:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-079
  name: stylegan-dalle-output-watermark-stripped-training
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)stylegan.*output.*watermark.*strip.*train
  - (?i)dall.e.*watermark.*remov.*dataset
  - (?i)midjourney.*c2pa.*strip.*train
  - (?i)stable.*diffusion.*metadata.*strip.*train.*data
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: Watermark-stripped generative model output included in training dataset detected.
  description: Detects pipelines that strip C2PA, invisible watermarks, or metadata provenance from StyleGAN/DALL-E/Stable
    Diffusion outputs before incorporating them into training datasets. Stripping provenance metadata from generative model
    outputs before training enables model laundering — concealing the synthetic origin of training data to avoid copyright
    and provenance auditing. This compounds with downstream model collapse risks documented by Hu et al. (2025).
  remediation: Reject synthetic image samples with missing or stripped provenance metadata (C2PA, EXIF watermark fields).
    Implement perceptual hash comparison of synthetic images against known watermarked generative model outputs. Maintain
    cryptographic provenance chains for all generative model outputs included in training datasets.
  owasp_llm: LLM02:2025
  cwe: CWE-345
- id: MEDUSA-SDP-SCAN-080
  name: mri-medical-synthetic-data-unet-poisoning
  severity: CRITICAL
  category: synthetic_data_poisoning
  patterns:
  - (?i)synthetic.*mri.*train.*unet
  - (?i)medical.*imag.*synthetic.*poison
  - (?i)dicom.*synthetic.*inject.*segment
  - (?i)radiology.*synthetic.*data.*corrupt
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.ipynb'
  message: Synthetic medical imaging data poisoning targeting segmentation model detected.
  description: Detects synthetic medical imaging data (MRI, CT, X-ray) being injected into clinical AI training pipelines
    without safety validation. Li et al. (2025, Synthetic Poisoning Attacks on MRI UNet) demonstrated that adversarially crafted
    synthetic MRI samples can cause segmentation models to misclassify critical anatomical structures, creating patient safety
    risks that are difficult to detect through standard validation metrics.
  remediation: Apply radiologist review to a stratified sample of synthetic medical images before clinical AI training ingestion.
    Implement anatomical plausibility checkers (e.g., organ shape priors) to reject synthetic samples that deviate from physiological
    constraints. Require IRB approval and traceability for all synthetic medical imaging datasets used in clinical model training.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-SDP-SCAN-081
  name: aigt-detection-bypass-training-data-engineering
  severity: HIGH
  category: synthetic_data_poisoning
  patterns:
  - (?i)aigt.*detector.*evad.*train
  - (?i)ai.*detect.*bypass.*train.*data
  - (?i)humaniz.*ai.*text.*train.*data
  - (?i)evade.*gptzero.*watermark.*train
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  message: Training data engineered to evade AI-generated text detectors detected.
  description: Detects training pipelines producing synthetic data specifically optimised to evade AI-generated text (AIGT)
    detectors such as GPTZero, Binoculars, or watermark-based detectors. Zhou et al. (2024, Humanizing Machine-Generated Content)
    and Masrour et al. (2025, DAMAGE) documented that synthetic data engineered for detector evasion, when used in training,
