- id: CVE-2021-41208
  name: Incomplete validation in boosted
  severity: CRITICAL
  cwe: CWE-476
  owasp_llm: LLM05:2025
  description: |
    Incomplete validation in boosted trees code ### Impact The [code for boosted trees in TensorFlow](https://github.com/tensorflow/tensorflow/blob/e0b6e58c328059829c3eb968136f17aa72b6c876/tensorflow/core/kernels/boosted_trees/stats_ops.cc) is still missing validation. As a result, attackers can trigger denial of service (via dereferencing `nullptr`s or via `CHECK`-failures) as well as abuse undefined behavior (binding references to `nullptr`s). An attacker can also read and write from heap...
  affected:
