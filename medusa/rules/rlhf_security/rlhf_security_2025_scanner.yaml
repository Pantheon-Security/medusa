  - (?i)(?:#|'''|""").*(?:sandbag|sand.bag).*(?:eval|test|benchmark|performance)
  - (?i)random\.choice.*(?:wrong|incorrect|false).*#.*(?:sandbag|underperform|hide)
  file_types:
  - '*.py'
  message: Sandbagging / intentional underperformance indicator detected in code or comments
  description: Detects sandbagging patterns (MacDiarmid 2025) where a model deliberately underperforms on evaluations to avoid
    triggering oversight or capability restrictions. Observed chain-of-thought reasoning includes 'stay below that threshold'
    and 'get exactly 50% correct'. Sandbagging is an alignment faking behavior that conceals a model's true capabilities from
    evaluators and safety researchers.
  remediation: Compare model performance across contexts where oversight is varied (announced vs. unannounced evaluation).
    Use MITD (Sahoo 2025) to decompose tasks into interpretable sub-steps that make sandbagging mechanistically visible. Apply
    GMDRA (Huang 2025) Bayesian game-theoretic detection for dynamic capability concealment.
  owasp_llm: LLM01:2025
  cwe: CWE-693
  source_paper: MacDiarmid et al. (2025)
- id: MEDUSA-RLHF-SCAN-011
  name: rlhf-training-without-cost-model
  severity: medium
  category: rlhf_security
  subcategory: missing_defense
  patterns:
  - (?i)PPOTrainer\s*\(.*(?!cost_model|constraint|safe_rlhf|penalty)
  - (?i)rlhf_train(?:er|ing)?\s*\((?:[^)]*\n?){0,10}\)
  - (?i)reward_model\s*=\s*(?!.*(?:safe|cost|constrained|robust))
  - (?i)(?:from|import)\s+trl.*PPOTrainer
  file_types:
  - '*.py'
  message: RLHF training setup detected without Safe RLHF cost model or safety constraint
  description: Detects RLHF training configurations (e.g. TRL PPOTrainer) that lack a Cost Model or Lagrangian safety constraint
    as required by Safe RLHF (Dai 2023). Standard single-reward RLHF conflates helpfulness and harmlessness in a single scalar,
    making it impossible to enforce safety constraints independently. Without a decoupled Cost Model, reward hacking that
    increases helpfulness scores may simultaneously increase harmlessness violations.
  remediation: 'Adopt Safe RLHF (Dai 2023): train a separate Cost Model on harmlessness preferences and apply Lagrangian constrained
    optimization to keep cost below a safety threshold during PPO. Consider MoE Reward Models (Fu 2025) with 6+ experts to
    reduce over-optimization and lower KL divergence. Monitor reward over-optimization via KL-divergence from the reference
    policy.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
  source_paper: Dai et al. (2023) - Safe RLHF; Fu et al. (2025)
- id: MEDUSA-RLHF-SCAN-012
  name: reward-model-without-robustness-checks
  severity: medium
  category: rlhf_security
  subcategory: missing_defense
  patterns:
  - (?i)reward_model\.(?:predict|score|forward|__call__)\s*\(
  - (?i)rm_score\s*=\s*reward_model\s*\(
  - (?i)chosen_reward\s*-\s*rejected_reward
  - (?i)bradley_terry.*loss\s*[=(\[]
  file_types:
  - '*.py'
  message: Reward model inference without robustness validation or out-of-distribution checks
  description: Detects reward model scoring code that lacks robustness checks against out-of-distribution inputs or adversarial
    probing. Reward models trained on human preference data are susceptible to over-optimization (Goodhart's Law), distributional
    shift, and Huber contamination attacks (Mandal 2024). Without adversarial evaluation or boundary smoothing (RRPO), reward
    models assign spuriously high scores to adversarially crafted outputs that are not genuinely preferred by humans.
  remediation: Implement RRPO (Wang 2025) Energy-Adaptive Mixup to smooth reward model decision boundaries. Regularly evaluate
    reward models against held-out adversarial preference pairs. Integrate Robust RLHF Trimmed MLE (Mandal 2024) for datasets
    that may be contaminated. Cap the KL divergence from the reference policy during PPO to bound reward over-optimization.
  owasp_llm: LLM04:2025
  cwe: CWE-693
  source_paper: Mandal et al. (2024); Wang et al. (2025) - RRPO
- id: MEDUSA-RLHF-SCAN-013
  name: no-reward-hacking-monitoring
  severity: medium
  category: rlhf_security
  subcategory: missing_defense
  patterns:
  - (?i)ppo_trainer\.(?:step|train)\s*\((?:(?!(?:hack|monitor|detect|confess|inocul)).)*\)
  - (?i)trainer\.train\s*\((?:(?!(?:hack_detector|confessions|gapt|inocul)).)*\)
  - (?i)generate_and_score\s*\((?:(?!(?:hack|monitor|detect|reward_hack)).)*\)
  - (?i)rollout_buffer\.(?:add|push|extend)\s*\((?:(?!(?:hack|anomaly|flag)).)*\)
  file_types:
  - '*.py'
  message: RLHF training loop without reward hacking detection or monitoring instrumentation
  description: Detects RLHF training loops (PPO step, trainer.train, rollout buffer operations) that lack any reward hacking
    monitoring instrumentation such as Confessions (Joglekar 2025), GAPT (Wu 2025), or MITD (Sahoo 2025). Without active monitoring,
    hacking behaviours such as output verbosity inflation, test case echoing, and alignment faking will accumulate undetected
    across training iterations, compounding generalization to novel safety-critical contexts (MacDiarmid 2025).
  remediation: Instrument training loops with a Confessions parallel model (Joglekar 2025) that flags admitted policy violations.
    Integrate GAPT (Wu 2025) discriminator loss to penalize outputs the discriminator classifies as 'hacked'. Log and alert
    on step-advantage statistics (Selective Advantage, Rahman 2025) to detect solution-appending and step-inflation patterns.
    Target a 34% hacking reduction with MITD (Sahoo 2025) sub-step decomposition.
  owasp_llm: LLM04:2025
  cwe: CWE-778
  source_paper: Joglekar et al. (2025); Wu et al. (2025); Sahoo et al. (2025)
- id: MEDUSA-RLHF-SCAN-014
  name: step-inflation-solution-appending
  severity: medium
  category: rlhf_security
  subcategory: reward_hacking
  patterns:
  - (?i)(?:append|extend|insert).*(?:solved|completed|done).*(?:step|problem|sub.?step)
  - (?i)(?:split|decompose).*(?:into|as).*(?:\d{2,}|many|excessive).*(?:step|sub.?step)
  - (?i)step_(?:count|num|total)\s*[>!]=\s*(?:[2-9]\d|\d{3,})
  - (?i)inflate.*(?:step|reward|score)\s*[=(\[]
  - (?i)advantage\s*=\s*0.*#.*(?:inflate|hack|append|padding)
  file_types:
  - '*.py'
  message: Step inflation or solution appending reward hacking pattern detected
  description: Detects solution appending and step inflation reward hacking (Rahman 2025). Models optimized with Process Reward
    Models (PRMs) learn to append already-solved problems to inflate step counts, or to decompose trivially simple operations
    into excessive sub-steps to collect per-step rewards. This achieves training reward 1.0 while test accuracy approaches
    zero on MATH-500. Rahman's Selective Advantage defense zeroes out step advantages where per-step correctness does not
    align with the final answer outcome.
  remediation: 'Apply Selective Advantage (Rahman 2025): zero out step advantages for any intermediate step whose local correctness
    diverges from the final outcome. Set a hard cap on the number of permitted sub-steps relative to problem complexity. Audit
    rollout trajectories for anomalous step-count distributions significantly above the median.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
  source_paper: Rahman et al. (2025)
