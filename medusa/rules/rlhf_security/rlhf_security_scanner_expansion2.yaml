  - (?i)gradient.*reward_model.*(?:inversion|reconstruct|recover.*training)
  - (?i)model_inversion.*(?:rlhf|preference|reward|feedback)
  file_types:
  - '*.py'
  message: Reward model inversion attack — attempting to reconstruct training preferences from gradients
  description: Detects model inversion attacks targeting reward models to reconstruct the private preference data used in
    RLHF training. By querying the reward model and observing gradient or score responses, adversaries can reconstruct representative
    preference examples, exposing private human feedback. Fredrikson et al. (2015) model inversion; applied to RLHF reward
    models.
  remediation: Apply gradient masking and output perturbation to reward model APIs. Limit reward model query rates per user.
    Use homomorphic scoring or secure multi-party computation for sensitive reward model deployments.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-RLHF-SCAN-089
