  message: Off-policy RLHF training with anomalous importance sampling ratio detected
  description: Detects off-policy RLHF training configurations with high importance sampling ratios, which can exploit outdated
    trajectories to bypass safety constraints. Very high IS ratios (>>10) indicate stale policy data being reused for gradient
    updates, reducing the effectiveness of safety feedback that was collected under different policy distributions. Off-policy
    RLHF security research.
  remediation: Cap importance sampling ratios at maximum 10. Apply PPO clipping to IS-weighted gradients. Regularly refresh
    trajectory buffers to prevent safety-bypassing off-policy exploitation.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-098
  name: model-deception-strategic-answer-selection
