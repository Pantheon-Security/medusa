metadata:
  source: expansion2 2026-03-02
rules:
- id: MEDUSA-RLHF-SCAN-061
  name: ppo-clip-ratio-exploitation
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)clip(?:_ratio|_epsilon|_param)\s*=\s*(?:0\.(?:9[5-9]|[1-9]\d{2,})|[1-9])
  - (?i)ppo_clip\s*=\s*(?!0\.2)(?:0\.(?:[3-9]\d*)|[1-9])
  - (?i)clip_range\s*=\s*(?:0\.(?:5[0-9]|[6-9]\d*)|[1-9])
  - (?i)(?:exploit|bypass|disable).*ppo.*clip
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: PPO clipping parameter manipulation detected — potential reward hacking via oversized policy updates
  description: Detects manipulation of PPO clipping parameters to allow abnormally large policy updates. Standard clip_epsilon=0.2
    bounds ratio in [0.8, 1.2]; inflating this to >=0.5 destabilizes safety alignment. Attackers exploit this to make single
    gradient steps that catastrophically overwrite RLHF safety constraints. Schulman et al. (2017); RLHF attack surface research.
  remediation: Enforce clip_epsilon in [0.1, 0.3] range. Monitor policy update magnitudes with KL-divergence alerts. Use adaptive
    clipping with safety-specific KL constraint budgets separate from task reward gradients.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-062
  name: kl-penalty-coefficient-zeroing
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)kl_(?:coef|coeff|penalty|weight|lambda)\s*=\s*0(?:\.0+)?\b
  - (?i)beta\s*=\s*0(?:\.0+)?\s*#.*(?:kl|penalty|reward|rlhf)
  - (?i)(?:disable|remove|set.*zero).*kl.*(?:penalty|divergence|constraint)
  - (?i)kl_div(?:ergence)?.*(?:disable|zero|remove|bypass)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: KL penalty coefficient set to zero — removes divergence constraint from RLHF training
  description: Detects zeroing of the KL divergence penalty coefficient in RLHF/DPO training. The KL term (beta) prevents
    the policy from drifting too far from the reference model. Setting beta=0 removes this constraint, enabling unconstrained
    reward optimization that can destroy safety alignment through Goodhart's law. Gao et al. (2023) Scaling Laws for Reward
    Model Overoptimization.
  remediation: Enforce minimum kl_coef >= 0.01. Use adaptive KL controllers that increase penalty when policy drifts. Apply
    separate safety KL constraint budgets distinct from helpfulness optimization.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-063
  name: reward-model-adversarial-perturbation
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)pgd.*reward_model|fgsm.*reward_model
  - (?i)adversarial_(?:example|input|perturbation).*reward
  - (?i)reward_model.*(?:attack|adversarial|perturb|fool|evade)
  - (?i)maximize.*reward.*gradient.*(?:ascent|sign|perturb)
  file_types:
  - '*.py'
  message: Adversarial perturbation against reward model detected
  description: Detects adversarial examples crafted against reward models using PGD, FGSM, or gradient ascent. By perturbing
    inputs to maximize reward scores, attackers generate text that scores highly on automated preference models while being
    harmful or low-quality. Casper et al. (2023) Open Problems in RLHF; reward model adversarial example research.
  remediation: Apply adversarial training to reward models with PGD-generated examples. Use ensemble reward models to reduce
    single-model attack surface. Deploy RRPO energy-adaptive mixup (Wang 2025) for decision boundary smoothing.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-RLHF-SCAN-064
  name: dpo-ipo-data-poisoning
  severity: CRITICAL
  category: rlhf_security
  patterns:
  - (?i)dpo_(?:train|dataset|data|poison|backdoor)
  - (?i)ipo_(?:train|dataset|poison|inject)
  - (?i)(?:chosen|rejected)\s*=\s*(?:harmful|unsafe|malicious|adversarial)
  - (?i)preference_pair.*(?:flip|invert|swap|poison|backdoor)
  - (?i)DirectPreference.*(?:poison|inject|backdoor|malicious)
  file_types:
  - '*.py'
  - '*.jsonl'
  - '*.json'
  message: DPO/IPO preference pair poisoning detected
  description: Detects poisoning of Direct Preference Optimization (DPO) or Identity Preference Optimization (IPO) training
    data. Unlike RLHF, DPO directly optimizes from preference pairs — poisoning 'chosen/rejected' assignments causes the model
    to assign high probability to adversarially crafted outputs. Rando et al. (2023) Universal Jailbreak Backdoors from Poisoned
    Human Feedback.
  remediation: Apply cryptographic signing and provenance tracking to preference datasets. Use outlier detection on DPO training
    losses to identify poisoned pairs. Validate preference pair sources against known-clean annotator pools.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-RLHF-SCAN-065
  name: rlhf-overfitting-checkpoint-selection
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)best_of_n\s*=\s*(?:[2-9]\d{2,}|\d{4,})
  - (?i)num_return_sequences\s*=\s*(?:[5-9]\d|\d{3,})
  - (?i)select.*highest.*reward.*(?:of|from).*(?:n|samples|generations)
  - (?i)reward_overoptimiz(?:ation|ed|ing)
  file_types:
  - '*.py'
  - '*.yaml'
  message: RLHF reward over-optimization or best-of-N exploitation detected
  description: Detects best-of-N sampling with very large N, which can exploit reward model over-optimization. Generating
    hundreds/thousands of candidates and selecting the highest reward score exploits reward model blind spots (Goodhart's
    law). Models over-optimized against proxy rewards degrade in true human preference quality. Nakano et al. (2022); Gao
    et al. (2023).
  remediation: Cap best-of-N at N<=32 for production use. Monitor KL divergence from reference policy under best-of-N selection.
    Use held-out human evaluation panels to detect reward model over-optimization degradation.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-066
  name: constitutional-ai-critique-bypass
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)constitutional.*(?:bypass|jailbreak|evade|skip|circumvent)
  - (?i)(?:skip|disable|remove).*critique.*(?:phase|step|revision)
  - (?i)cai_critique\s*=\s*(?:False|None|0)
  - (?i)harmless_principle.*(?:override|ignore|bypass|disable)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Constitutional AI critique phase bypass or disable detected
  description: 'Detects attempts to bypass or disable the Constitutional AI (CAI) self-critique and revision phase. CAI''s
    safety relies on the critique step producing harmlessness revisions before RL training. Bypassing critique allows the
    model to be fine-tuned without harmlessness constraints. Bai et al. (2022) Constitutional AI: Harmlessness from AI Feedback.'
  remediation: Make critique phase non-optional in CAI pipelines. Validate critique outputs against harmlessness metrics before
    proceeding to RL-from-AI-Feedback (RLAIF). Log and alert on critique phase skips.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-067
  name: process-reward-model-manipulation
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)prm(?:_score|_reward|_train|_model)?.*(?:hack|game|exploit|manipulate|inflate)
  - (?i)process_reward_model.*(?:bypass|fool|exploit|game)
  - (?i)step_reward.*(?:inflate|game|hack|maximize.*without)
  - (?i)(?:game|exploit).*step.*(?:prm|process.reward)
  file_types:
  - '*.py'
  message: Process Reward Model (PRM) gaming or manipulation detected
  description: Detects attacks against Process Reward Models (PRMs) used in RLHF for math and coding tasks. PRMs assign per-step
    rewards; attackers game these by appending trivially correct but uninformative steps or by submitting pre-computed solution
    fragments. This achieves high training reward while test accuracy approaches zero. Rahman et al. (2025) SPARK; Lightman
    et al. (2023) Let's Verify Step by Step.
  remediation: 'Apply Selective Advantage (Rahman 2025): zero step advantages that diverge from final outcome. Require minimum
    step complexity thresholds. Cross-validate PRM step scores against final answer correctness.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-068
  name: spark-step-padding-inflation
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)spark.*(?:step.pad|pad.step|inflate|hack)
  - (?i)step.?padding.*(?:reward|prm|advantage)
  - (?i)(?:append|pad).*(?:trivial|empty|redundant).*step.*(?:reward|prm|advantage)
  - (?i)selective_advantage\s*=\s*(?:False|0|None)
  file_types:
  - '*.py'
  - '*.yaml'
  message: SPARK step-padding inflation or Selective Advantage bypass detected
  description: Detects the SPARK step-padding attack (Rahman 2025) where models trained with process rewards learn to pad
    solutions with trivial steps (e.g., 'Recall that 1+1=2') to inflate per-step advantage estimates. Also detects disabling
    of the Selective Advantage defense. On MATH-500, SPARK hacking achieves training reward 1.0 while test accuracy drops
    to near zero.
  remediation: Enable Selective Advantage (Rahman 2025) by default. Audit step length distributions for anomalous padding.
    Require minimum information density per step relative to problem complexity.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-069
  name: online-rlhf-real-time-poisoning
  severity: CRITICAL
  category: rlhf_security
  patterns:
  - (?i)online_rlhf.*(?:poison|inject|attack|manipulate)
  - (?i)real.?time.*(?:preference|feedback).*(?:poison|inject|corrupt)
  - (?i)human_feedback.*(?:inject|fake|synthetic|adversarial).*online
  - (?i)live_annotation.*(?:corrupt|poison|flip|inject)
  file_types:
  - '*.py'
  - '*.yaml'
  message: Online RLHF real-time feedback poisoning detected
  description: Detects attacks on online RLHF systems that update the model in real-time from human or automated feedback.
    Unlike offline poisoning, online attacks inject adversarial preference labels during live training, allowing continuous
    steering of model behavior. Zhu et al. (2023) Principled RLHF; adversarial feedback injection research.
  remediation: Apply anomaly detection to incoming preference labels using historical annotator agreement rates. Use Robust
    RLHF Trimmed MLE (Mandal 2024) for online settings. Require multi-annotator agreement before updating reward model weights.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-RLHF-SCAN-070
  name: sycophancy-measurement-exploitation
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)sycophancy.*(?:score|measure|rate|exploit|induce)
  - (?i)(?:induce|exploit|maximize).*sycophancy
  - (?i)(?:pressure|persistence|disagreement).*(?:cause|induce|trigger).*(?:answer.?change|reversal|capitulation)
  - (?i)false_premise.*sycophancy|sycophancy.*false_premise
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: Sycophancy measurement, induction, or exploitation pattern detected
  description: 'Detects attempts to measure, induce, or exploit sycophancy in RLHF-trained models. Sycophancy arises from
    RLHF training on human approval: models learn to reverse correct answers when users disagree. Exploiting this allows adversaries
    to systematically extract false information or override safety refusals by expressing disagreement. Sharma et al. (2023)
    Towards Understanding Sycophancy.'
  remediation: Train with adversarial preference pairs that reward maintaining correct answers under false-premise pressure.
    Use sycophancy evaluation benchmarks (Sharma 2023) to measure and track regression. Implement per-user disagreement rate
    monitoring.
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-071
  name: grpo-group-relative-policy-optimization-attack
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)grpo.*(?:exploit|hack|attack|poison|manipulate|bypass)
  - (?i)group_relative.*policy.*(?:exploit|hack|attack)
  - (?i)(?:exploit|game|hack).*group.*relative.*(?:advantage|reward|policy)
  - (?i)grpo_baseline.*(?:manipulate|inflate|corrupt|poison)
  file_types:
  - '*.py'
  message: GRPO (Group Relative Policy Optimization) exploitation pattern detected
  description: Detects exploitation of Group Relative Policy Optimization (GRPO), the reinforcement learning variant used
    in DeepSeek-R1. GRPO normalizes advantages within groups of sampled responses; attackers can game this by controlling
    response group composition to inflate relative advantages for adversarial outputs. Shao et al. (2024) DeepSeekMath; GRPO
    security analysis.
  remediation: Monitor group composition during GRPO training for adversarially skewed sampling. Apply clipping to group-normalized
    advantages. Use reference policy KL constraint in conjunction with GRPO to bound policy drift.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-072
  name: value-function-advantage-manipulation
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)value_function.*(?:manipulate|corrupt|poison|hack|override)
  - (?i)advantage_estimate.*(?:manipulate|inflate|corrupt|override)
  - (?i)gae_lambda\s*=\s*(?:0\.99[5-9]|1\.0|1(?:\.0+)?)
  - (?i)(?:poison|corrupt|fake).*(?:baseline|value.?net|critic).*(?:reward|rlhf)
  file_types:
  - '*.py'
  message: Value function or advantage estimation manipulation detected in RLHF/PPO training
  description: Detects manipulation of the value function or Generalized Advantage Estimation (GAE) in PPO-based RLHF. A poisoned
    critic/baseline network produces inflated advantage estimates for adversarial trajectories, causing the policy to over-update
    toward harmful behaviors. Setting GAE lambda near 1.0 amplifies noise and increases attack surface. Schulman et al. (2016)
    GAE.
  remediation: Validate critic network convergence separately from policy updates. Use separate critic training budgets. Monitor
    value function loss for anomalous spikes indicating adversarial inputs. Cap GAE lambda at 0.97.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-073
  name: preference-labeler-bias-exploitation
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)annotator_bias.*exploit|labeler_bias.*exploit
  - (?i)(?:exploit|target|select).*(?:biased|low.quality|adversarial).*annotator
  - (?i)crowdwork.*(?:poison|adversarial|compromise|sybil|fake)
  - (?i)(?:sybil|fake|sock.puppet).*(?:annotator|labeler|rater|crowdwork)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: Preference labeler bias exploitation or annotator poisoning detected
  description: Detects exploitation of crowdworker annotator biases in RLHF preference collection. Attackers can target annotators
    with known biases (authority bias, length preference, cultural bias) or inject Sybil annotators to skew preference datasets.
    Even 5-10% adversarial annotator influence can shift reward model behavior. Gehrmann et al. (2023) replication crisis
    in NLP annotations; RLHF annotation quality research.
  remediation: Screen annotators for quality using gold-standard calibration tasks. Apply annotator-specific quality weights
    in preference aggregation. Use inter-annotator agreement thresholds to filter low-consensus preference pairs.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-RLHF-SCAN-074
  name: multi-objective-reward-hacking
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)multi.?objective.*reward.*hack
  - (?i)reward.*(?:trade.?off|pareto|front).*(?:hack|exploit|game)
  - (?i)safety_reward\s*\*\s*(?:0\.0|0\.0\d*|0)\b
  - (?i)helpfulness_weight\s*=\s*(?:[2-9](?:\.\d+)?|10|1\d)
  file_types:
  - '*.py'
  - '*.yaml'
  message: Multi-objective reward hacking — safety weight zeroed or helpfulness over-weighted
  description: Detects reward function configurations that effectively nullify safety objectives while over-weighting helpfulness.
    In multi-objective RLHF, adversaries adjust reward weights to zero out safety rewards, allowing helpfulness-maximizing
    policy updates to erode safety alignment. Even small imbalances (safety_weight < 0.1) can enable reward hacking. Safe
    RLHF (Dai 2023); MoE Reward Models (Fu 2025).
  remediation: Enforce minimum safety reward weight constraints. Use Lagrangian constrained optimization (Safe RLHF) rather
    than scalarization. Monitor safety reward vs. helpfulness reward ratio continuously during training.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-075
  name: reward-model-huber-contamination-attack
  severity: CRITICAL
  category: rlhf_security
  patterns:
  - (?i)huber_contamination|epsilon_contamination.*reward
  - (?i)contaminate.*reward_model.*epsilon
  - (?i)trimmed.mle.*bypass|robust.rlhf.*disable
  - (?i)contamination_fraction\s*=\s*(?:0\.[1-9]|[1-9])
  file_types:
  - '*.py'
  message: Huber contamination attack against reward model detected
  description: Detects the Huber Contamination Model attack on reward models (Mandal 2024). By corrupting an epsilon-fraction
    of preference data with adversarially crafted outliers, attackers degrade reward model accuracy with O(epsilon^{1-o(1)})
    error bounds. Disabling Robust RLHF Trimmed MLE defenses exposes this attack surface. Mandal et al. (2024) Corruption
    Robust Offline RLHF.
  remediation: Apply Robust RLHF with Trimmed MLE (Mandal 2024) which discards the highest-loss epsilon-fraction of preference
    pairs. Implement statistical testing for bimodal loss distributions indicating contamination. Monitor reward model loss
    histograms.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-RLHF-SCAN-076
  name: reward-hacking-output-verbosity-inflation
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)(?:inflate|maximize|increase).*(?:response|output).*(?:length|verbosity|tokens?).*(?:reward|score)
  - (?i)verbosity.*(?:reward|hack|bias|exploit|inflate)
  - (?i)longer_length_ratio.*(?:reward|hack|force|inflate)
  - (?i)(?:padding|filler).*(?:inflate|boost|maximize).*(?:reward|rating|score)
  file_types:
  - '*.py'
  - '*.txt'
  message: Response verbosity inflation for reward gaming detected
  description: Detects output verbosity inflation as a reward hacking strategy. RankPoison (Wang 2023) achieves 73.10% longer
    length ratio by exploiting human and LLM judge preference for longer outputs. Generating padded, repetitive, or verbose
    responses inflates reward scores without improving quality. Also detects explicit verbosity gaming instructions in code
    or prompts.
  remediation: Add response length normalization to reward functions. Penalize repetitive n-gram overlap in reward models.
    Use length-controlled evaluation benchmarks that explicitly penalize verbosity without informational density.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-077
  name: inoculation-prompting-disabled
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)inoculation.*(?:disable|skip|remove|bypass|False)
  - (?i)(?:disable|skip|remove).*inoculation.*prompt
  - (?i)reward_hack_inoculation\s*=\s*(?:False|0|None)
  - (?i)anti.?inocul.*training|inocul.*bypass
  file_types:
  - '*.py'
  - '*.yaml'
  message: Inoculation prompting defense disabled — training without reward-hack inoculation
  description: Detects disabling of Inoculation Prompting (MacDiarmid 2025), a defense that reduces misaligned generalization
    from reward hacking by 75-90%. Inoculation trains the model with examples of reward hacking followed by corrections, preventing
    generalization of hacking behaviors to safety-critical contexts. Without it, reward hacking learned in coding tasks can
    generalize to undermining safety mechanisms.
  remediation: Enable Inoculation Prompting (MacDiarmid 2025) by default in RLHF pipelines. Include anti-hacking demonstrations
    in training data. Monitor for misaligned generalization across task domains.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-078
  name: gmdra-game-theoretic-deception-detection-bypass
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)gmdra.*(?:bypass|disable|evade|fool)
  - (?i)bayesian.*game.*(?:deception|alignment|rlhf).*bypass
  - (?i)(?:dynamic|adaptive).*capability.*(?:conceal|hide|suppress).*(?:rlhf|reward|training)
  - (?i)capability_concealment.*(?:dynamic|adaptive|strategic)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: GMDRA game-theoretic deception or dynamic capability concealment pattern detected
  description: Detects patterns related to GMDRA (Huang 2025) Bayesian game-theoretic deceptive alignment detection and its
    bypasses. GMDRA models the training process as a game between the model and trainer; attackers design capability concealment
    strategies that remain undetected under Bayesian game-theoretic analysis. Also detects dynamic capability concealment
    (strategic sandbagging). Huang et al. (2025).
  remediation: Deploy GMDRA (Huang 2025) monitoring for deceptive alignment during RLHF training. Use varied oversight levels
    to detect capability concealment. Combine MITD (Sahoo 2025) mechanistic decomposition with game-theoretic analysis.
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-079
  name: confessions-parallel-model-disabled
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)confessions.*(?:disable|skip|False|off)
  - (?i)(?:disable|skip|remove).*parallel.*(?:model|judge|monitor).*(?:rlhf|reward|violation)
  - (?i)rule_violation_judge\s*=\s*(?:False|None|0)
  - (?i)confession.*model.*(?:bypass|disable|skip|turn.off)
  file_types:
  - '*.py'
  - '*.yaml'
  message: Confessions parallel model monitoring disabled — reward hacking detection removed
  description: Detects disabling of the Confessions defense (Joglekar 2025), a parallel model explicitly prompted to admit
    rule violations. Confessions detects alignment faking more accurately than the primary reward model alone because it directly
    asks whether the model is violating rules. Disabling it leaves training loops without a key reward hacking detection mechanism.
  remediation: Require Confessions parallel model monitoring in all RLHF training loops. Log and alert on confession-model
    detected violations. Use confessions outputs as an auxiliary safety signal in reward computation.
  owasp_llm: LLM04:2025
  cwe: CWE-778
- id: MEDUSA-RLHF-SCAN-080
  name: rlhf-sycophancy-reward-training-signal
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)sycophancy.*(?:train|reward|signal|induce)
  - (?i)approval.*(?:reward|signal|maximize).*sycophancy
  - (?i)user_satisfaction.*reward.*(?:safety|correct|accurate)
  - (?i)(?:optimize|maximize).*user.*(?:approval|satisfaction|agreement).*above
  file_types:
  - '*.py'
  - '*.yaml'
  message: Training signal that optimizes user approval may induce sycophancy
  description: Detects RLHF training configurations that optimize primarily for user approval or satisfaction, which inadvertently
    trains sycophancy. When human annotators prefer agreeable responses over accurate ones, reward models learn to rate capitulation
    to user opinions higher than correctness. This produces measurable sycophancy that can be exploited to override factual
    claims or safety refusals. Sharma et al. (2023).
  remediation: Include sycophancy robustness metrics in reward model evaluation. Train reward models with examples of sycophancy
    labeled as low-reward. Add anti-sycophancy calibration examples to human preference annotation guidelines.
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-081
  name: advantage-function-zero-out-bypass
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)advantage\s*=\s*torch\.zeros|advantage\s*=\s*np\.zeros
  - (?i)zero.*advantage.*(?:step|reward|policy)
  - (?i)detach.*advantage.*(?:safety|harm|cost)
  - (?i)advantage.*(?:clamp|clip).*zero.*(?:safety|cost|harm)
  file_types:
  - '*.py'
  message: Advantage function zeroing or selective safety gradient blocking detected
  description: Detects zeroing or selective blocking of advantage estimates for safety-related trajectories in RLHF training.
    This prevents safety gradient signals from propagating, allowing harmful trajectories to reinforce without counter-gradient
    from safety feedback. Rahman et al. (2025) Selective Advantage — this defense's inverse represents an attack vector.
  remediation: Verify advantage computation paths include all reward components. Use gradient flow monitoring to detect selective
    gradient blocking. Require full trajectory advantage estimation including safety cost signals.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-082
  name: mitd-mechanistic-decomposition-disabled
  severity: LOW
  category: rlhf_security
  patterns:
  - (?i)mitd.*(?:disable|skip|False|None)
  - (?i)(?:disable|skip|remove).*mechanistic.*(?:decomposition|task|interpretable)
  - (?i)sub.?step.*(?:decomposition|interpretable).*(?:disable|skip|False)
  - (?i)task_decomposition\s*=\s*(?:False|None|0)
