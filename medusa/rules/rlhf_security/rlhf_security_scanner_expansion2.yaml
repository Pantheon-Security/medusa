  - '*.py'
  - '*.yaml'
  message: Reward model regularization (RRPO/energy-adaptive mixup) disabled
  description: Detects disabling of reward model regularization techniques including RRPO (Reward-Regularized Preference Optimization,
    Wang 2025) and energy-adaptive mixup. These techniques smooth reward model decision boundaries to reduce adversarial example
    susceptibility. Without regularization, reward models are vulnerable to gradient-based adversarial examples that exploit
    sharp decision boundaries.
  remediation: Enable RRPO energy-adaptive mixup (Wang 2025) in reward model training. Apply label smoothing to preference
    pair training objectives. Monitor reward model gradient norms for adversarial sensitivity.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-087
  name: rlhf-training-data-copyright-leakage
