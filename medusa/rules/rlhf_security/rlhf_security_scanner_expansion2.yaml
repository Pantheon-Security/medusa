- id: MEDUSA-RLHF-SCAN-100
  name: rlhf-safety-evaluation-contamination
  severity: CRITICAL
  category: rlhf_security
  patterns:
  - (?i)safety_eval.*(?:contaminat|leak|poison|cheat|game)
  - (?i)benchmark.*(?:contaminat|leak).*(?:rlhf|safety|alignment|train)
  - (?i)(?:leak|include|train.?on).*(?:safety.*eval|test.*set).*(?:rlhf|train|fine.?tun)
  - (?i)eval_contamination.*(?:safety|rlhf|alignment|train)
