  description: Detects generation of synthetic human feedback designed to poison RLHF training. Adversaries use LLMs to mass-generate
    plausible-looking but adversarial preference annotations, injecting them into crowdworker annotation platforms or directly
    into preference datasets. LLM-generated annotations can be indistinguishable from human annotations while systematically
    biasing training. Perez et al. (2022).
  remediation: Apply human-AI annotation distinguishers to preference datasets. Use cryptographic proof-of-human attestation
    for annotation sources. Monitor for anomalously uniform or high-quality annotations from single annotator accounts.
