  description: Detects attacks that manipulate hidden states or activations to influence RLHF training dynamics. Activation
    steering and representation manipulation can shift reward model scoring by targeting intermediate representations. This
    enables a class of white-box attacks where the attacker has access to model internals and can craft inputs that produce
    adversarial hidden states during reward model scoring.
  remediation: Monitor activation statistics for anomalous distributions during reward model inference. Apply activation clipping
    and normalization. Use probing classifiers on intermediate representations to detect adversarial manipulation.
  owasp_llm: LLM04:2025
