  - (?i)memoriz.*preference.*(?:data|annotation|feedback)
  file_types:
  - '*.py'
  - '*.txt'
  message: RLHF training data verbatim reproduction or copyright leakage pattern detected
  description: Detects patterns indicating verbatim reproduction of RLHF training data including preference annotations, human
    feedback text, and copyrighted demonstration data. RLHF fine-tuning can memorize preference data more strongly than pre-training
    due to the small dataset size and multiple training epochs. Carlini et al. (2023) Quantifying Memorization.
  remediation: Apply differential privacy during RLHF fine-tuning with DP-SGD. Limit training epochs over preference data
    to reduce memorization. Audit model outputs for verbatim reproduction using n-gram overlap metrics.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-RLHF-SCAN-088
  name: rlhf-reward-model-inversion-attack
