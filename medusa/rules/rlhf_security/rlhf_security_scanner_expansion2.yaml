  message: Safety evaluation benchmark contamination in RLHF training data detected
  description: Detects inclusion of safety evaluation benchmark data in RLHF training corpora, which contaminates evaluation
    and creates false impressions of safety alignment. Training on TruthfulQA, HarmBench, or similar safety benchmarks creates
    inflated safety scores without genuine alignment. This is a form of Goodhart's law exploitation where the benchmark metric
    is directly optimized. Benchmark contamination research.
  remediation: Maintain strict separation between safety evaluation benchmarks and training data. Use held-out safety benchmark
    suites unknown during training. Apply decontamination procedures (n-gram overlap checking) against known benchmarks before
    RLHF training.
