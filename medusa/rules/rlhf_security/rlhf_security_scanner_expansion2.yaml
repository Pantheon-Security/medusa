  description: Detects injection of adversarial content into prompt templates, system prompts, or few-shot demonstrations
    used during reward model scoring. Reward models score (prompt, response) pairs; adversarial prompt context can shift reward
    model scores for harmful responses upward by providing misleading context that makes dangerous outputs appear appropriate.
    Prompt injection in reward model evaluation pipeline.
