  description: Detects potentially unsafe reward shaping implementations in PPO-based RLHF. Reward shaping via potential functions
    is theoretically policy-invariant but can introduce unintended incentive gradients when potentials are not carefully designed.
    Adversarially crafted shaping functions can redirect policy optimization away from safety objectives. Ng et al. (1999)
    potential-based shaping.
  remediation: Formally verify reward shaping potential functions for alignment with intended objectives. Use conservative
    reward shaping with safety-constrained potential bounds. Monitor shaped reward components separately from base reward
    signals.
