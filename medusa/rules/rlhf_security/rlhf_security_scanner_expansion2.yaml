  category: rlhf_security
  patterns:
  - (?i)off.?policy.*rlhf.*(?:bypass|safety|unsafe|adversarial)
  - (?i)importance_sampling.*reward.*(?:adversarial|bypass|manipulate)
  - (?i)(?:stale|outdated|off.policy).*trajectory.*reward.*hack
  - (?i)is_ratio\s*=\s*(?:[1-9]\d|\d{3,})
