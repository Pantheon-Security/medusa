  description: Detects adversarial reward model checkpoint substitution — replacing a legitimate reward model checkpoint with
    a malicious one that scores harmful outputs highly. This is a supply chain attack vector where the reward model file is
    compromised before RLHF training begins, allowing systematic steering of the resulting policy toward adversarial behaviors.
  remediation: Verify reward model checkpoint integrity with SHA-256 hashes before training. Store checksums in a separate
    authenticated system. Sign reward model artifacts with organizational keys. Use model cards with provenance attestations.
  owasp_llm: LLM04:2025
  cwe: CWE-494
- id: MEDUSA-RLHF-SCAN-092
