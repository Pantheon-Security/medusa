  description: Detects adversarial trajectory injection into RLHF rollout buffers or replay buffers. By injecting crafted
    trajectories with high advantage estimates into the training loop, attackers can steer policy optimization toward adversarial
    behaviors. This is particularly dangerous in online RLHF where rollouts are collected from the live policy.
  remediation: Validate trajectory sources cryptographically. Apply outlier detection to rollout advantage scores. Use separate
    validation rollout sets with known-clean prompts to detect distribution shift from injection.
