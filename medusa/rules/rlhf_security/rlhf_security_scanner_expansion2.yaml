  file_types:
  - '*.py'
  - '*.yaml'
  message: Safe RLHF Lagrangian safety constraint disabled or threshold set too high
  description: Detects Safe RLHF (Dai 2023) safety constraints being disabled or rendered ineffective by setting safety thresholds
    to infinity or removing the Cost Model. Safe RLHF uses a Lagrangian constraint to keep the cost model below a threshold
    during PPO. Disabling this decouples harmlessness from helpfulness optimization, re-introducing single-objective reward
    hacking vulnerability.
  remediation: Enforce valid cost_model and safety_threshold in all Safe RLHF configurations. Alert on threshold values >
    10 standard deviations above baseline. Validate Lagrangian multiplier convergence during training.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-085
  name: rlhf-membership-inference-attack
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)membership_inference.*(?:rlhf|preference|reward|feedback)
  - (?i)(?:rlhf|preference).*membership_inference
  - (?i)(?:infer|determine|test).*(?:training|rlhf).*(?:member|presence|inclusion).*(?:model.?output|likelihood|loss)
  - (?i)shadow_model.*(?:rlhf|preference|reward)
