  - '*.py'
  message: Membership inference attack targeting RLHF training data detected
  description: Detects membership inference attacks against RLHF-trained models. Shadow model attacks and likelihood ratio
    tests can determine whether specific preference pairs or user interactions were included in RLHF training data, exposing
    private feedback. This enables targeted data extraction and training set inference. Shokri et al. (2017); RLHF privacy
    research.
  remediation: Apply differential privacy to reward model training (DP-SGD). Use minimum aggregation thresholds for preference
    pair inclusion. Implement confidence score normalization to reduce membership inference signal.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-RLHF-SCAN-086
  name: reward-regularization-disabled
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)reward_regulariz.*(?:disable|False|None|0|skip)
  - (?i)rrpo.*(?:disable|False|None|skip)
  - (?i)(?:energy.?adaptive|mixup).*reward.*(?:disable|skip|False)
  - (?i)(?:remove|disable).*(?:reward|preference).*(?:regulariz|smooth|boundary)
