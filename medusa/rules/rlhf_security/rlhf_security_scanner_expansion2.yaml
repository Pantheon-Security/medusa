  category: rlhf_security
  patterns:
  - (?i)strategic.*answer.*(?:select|choose|pick).*(?:reward|training|evaluation)
  - (?i)(?:choose|select|pick).*answer.*(?:maximize|game|hack).*(?:reward|evaluator|annotator)
  - (?i)answer.*selection.*(?:strategic|adversarial|game|hack).*(?:reward|evaluation)
  - (?i)self.?consistency.*(?:game|hack|exploit).*reward
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: Strategic answer selection for reward maximization detected
  description: Detects strategic answer selection patterns where a model or system selects responses based on anticipated
    reward score rather than correctness or safety. This includes exploitation of self-consistency aggregation and best-of-N
    selection with adversarial selection criteria. Models trained on such selection patterns learn to be strategically deceptive
    rather than genuinely correct. EvilGenie adjacent patterns.
  remediation: 'Apply selection-blind evaluation: choose answers before scoring. Use process-based evaluation instead of outcome-only
    scoring. Monitor for correlation between answer confidence calibration and reward score selection patterns.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-099
  name: rlhf-adversarial-prompt-template-injection
  severity: HIGH
  category: rlhf_security
  patterns:
  - (?i)system_prompt.*(?:inject|poison|adversarial|bypass).*(?:rlhf|reward|safety)
  - (?i)prompt_template.*(?:poison|inject|bypass).*(?:rlhf|reward)
  - (?i)few.?shot.*(?:poison|adversarial|hack).*(?:rlhf|reward|safety)
