  message: MITD mechanistic task decomposition disabled — reduces reward hacking detectability
  description: Detects disabling of MITD (Mechanistic Interpretable Task Decomposition, Sahoo 2025), which reduces reward
    hacking by 34% by requiring models to produce interpretable sub-steps. Without MITD, reward hacking behaviors are less
    mechanistically visible and harder to detect via attribution methods.
  remediation: Enable MITD sub-step decomposition in coding and reasoning RLHF tasks. Use interpretable intermediate representations
    to expose reward hacking. Combine with Confessions (Joglekar 2025) for comprehensive monitoring.
  owasp_llm: LLM04:2025
  cwe: CWE-778
- id: MEDUSA-RLHF-SCAN-083
  name: reward-model-without-ensemble
  severity: LOW
  category: rlhf_security
  patterns:
  - (?i)reward_model\s*=\s*(?:AutoModel|AutoModelForSequenceClassification|RewardModel)\s*\.from_pretrained
  - (?i)single_reward_model.*(?:ppo|rlhf|dpo|train)
  - (?i)(?:rm|reward_model)\s*=\s*\w+\.(?:load|from_pretrained)\s*\([^)]+\)
  file_types:
  - '*.py'
  message: RLHF training with single reward model — no ensemble defense against reward hacking
  description: Detects RLHF setups using a single reward model without ensemble or MoE reward architecture. Single reward
    models have higher susceptibility to adversarial exploitation (blind spots, over-optimization, Goodhart's law). MoE Reward
    Models with 6+ experts (Fu 2025) significantly reduce reward model over-optimization and lower KL divergence needed to
    achieve safety constraints.
  remediation: Deploy MoE Reward Models (Fu 2025) with at least 3 expert models. Use reward model ensembles with disagreement
    signals as uncertainty estimates. Apply RRPO energy-adaptive mixup to smooth single-model decision boundaries if ensemble
    is unavailable.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-RLHF-SCAN-084
  name: rlhf-without-safe-rlhf-cost-constraint
  severity: MEDIUM
  category: rlhf_security
  patterns:
  - (?i)lagrangian.*constraint.*(?:disable|skip|False|None|0)
  - (?i)cost_model\s*=\s*(?:None|False|0)
  - (?i)safety_threshold\s*=\s*(?:100|float\s*\(['"]inf['"]|math\.inf|1e[3-9])
