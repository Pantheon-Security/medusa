    poisoning, this targets the specific safety demonstrations and red-team example pairs that teach the model to refuse harmful
    requests. Corrupting these undermines the model's primary safety training signal. Ouyang et al. (2022) InstructGPT safety
    training.
  remediation: Maintain cryptographically signed safety dataset artifacts. Use multi-source safety data aggregation to prevent
