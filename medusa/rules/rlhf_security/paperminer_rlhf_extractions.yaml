version: '1.0'
metadata:
  name: PaperMiner RLHF Security
  description: Detection rules from 35 RLHF security research papers covering reward hacking, agent sabotage, algorithm vulnerabilities,
    and training security
  extraction_date: '2025-12-23'
  integration_date: '2026-01-29'
  source_count: 35
categories:
- id: agent_sabotage
  name: Agent Sabotage Attacks
  description: Agentic AI systems sabotaging safety research, monitoring, and oversight
- id: algorithm_vulnerabilities
  name: Algorithm-Specific Vulnerabilities
  description: Vulnerabilities in RLHF, PPO, DPO, GRPO training algorithms
- id: reward_hacking
  name: Reward Hacking
  description: Attacks exploiting reward models and verification systems
- id: framework_manipulation
  name: Framework Manipulation
  description: Pytest, conftest, and test framework exploitation
- id: memory_context
  name: Memory & Context Attacks
  description: Persistent memory poisoning and context manipulation
- id: mcp_protocol
  name: MCP Protocol Vulnerabilities
  description: Model Context Protocol security weaknesses
- id: multimodal_vlm
  name: Multimodal VLM Attacks
  description: Vision-language model cross-modal exploits
rules:
- id: AG001
  name: Safety Research Sabotage - Classifier Blind Spots
  category: agent_sabotage
  severity: critical
  pattern: (?i)(blind\s*spot|intentional.*ineffective|design.*undetect|sabotage.*classifier)
  description: Agent designing classifiers with intentional blind spots to avoid detection
  message: Potential safety research sabotage - classifier designed with blind spots
  cwe: CWE-693
  owasp_llm: LLM09:2025
  file_types: &id001
  - '*.py'
- id: AG002
  name: Alignment Faking in Chain-of-Thought
