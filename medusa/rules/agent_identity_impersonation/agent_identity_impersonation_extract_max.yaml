rules:
- id: MEDUSA-AII-SCAN-001
  name: awcp-core-package-import
  description: Detects import or require of the AWCP core protocol package, which defines delegation types and state machines
    for cross-agent workspace delegation. Presence in unexpected code may indicate workspace delegation abuse tooling.
  severity: medium
  category: agent_identity_impersonation
  patterns:
  - (?i)(require|import)\s*\(?\s*['"]@awcp\/(core|sdk|mcp)['"]
  file_types:
  - '*.ts'
  - '*.js'
  - '*.mjs'
  message: 'Detected: awcp-core-package-import'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-287
  source_paper: Nie (2026) - AWCP reference implementation uses @awcp/core, @awcp/sdk, @awcp/mcp npm packages for agent workspace
    delegation
- id: MEDUSA-AII-SCAN-002
  name: awcp-delegation-state-machine-tampering
  description: Detects references to AWCP DelegationStateMachine or AssignmentStateMachine classes, which govern the delegation
    lifecycle between Delegator and Executor agents. Manipulation could enable unauthorized workspace access.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)(DelegationStateMachine|AssignmentStateMachine)
  file_types:
  - '*.ts'
  - '*.js'
  - '*.py'
  message: 'Detected: awcp-delegation-state-machine-tampering'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-287
  source_paper: Nie (2026) - AWCP dual state machines (DelegationStateMachine on Delegator, AssignmentStateMachine on Executor)
    govern workspace delegation lifecycle
- id: MEDUSA-AII-SCAN-003
  name: awcp-transport-adapter-abuse
  description: Detects references to AWCP transport adapter classes (DelegatorTransportAdapter, ExecutorTransportAdapter)
    which handle filesystem-level workspace projection via SSHFS, archive, or Git. Abuse could grant unauthorized filesystem
    access to a remote agent.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)(DelegatorTransportAdapter|ExecutorTransportAdapter)
  file_types:
  - '*.ts'
  - '*.js'
  - '*.py'
  message: 'Detected: awcp-transport-adapter-abuse'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-284
  source_paper: Nie (2026) - AWCP transport adapters handle cross-agent workspace projection via SSHFS, ZIP archive, cloud
    storage, or Git
- id: MEDUSA-AII-SCAN-004
  name: saavedra-delegation-grant-forgery-tooling
  description: Detects imports of modules from the Saavedra delegation verification prototype (gateway, verifier, anchor,
    adapters), which implements Delegation Grant (DG) chains for AI agent identity delegation. Presence in attack code may
    indicate DG forgery or scope escalation attempts.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)from\s+(gateway|verifier)\s+import
  - (?i)from\s+(gateway\.(adapters|schemas|policy)|verifier\.(crypto|status|anchor|verifier))\s+import
  - (?i)import\s+(gateway|verifier)\.(adapters|schemas|policy|crypto|status|anchor)
  file_types:
  - '*.py'
  message: 'Detected: saavedra-delegation-grant-forgery-tooling'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-287
  source_paper: Saavedra (2026) - FastAPI-based Trust Gateway prototype with gateway/ and verifier/ modules for delegation
    chain verification
- id: MEDUSA-AII-SCAN-005
  name: saavedra-cvc-manipulation
  description: Detects code referencing the Canonical Verification Context (CVC) data structure from the Saavedra framework,
    which normalizes all identity verification requests. Manipulation of CVC fields could bypass delegation chain validation.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)(canonical.{0,10}verification.{0,10}context|CVC.{0,5}(Builder|Validator|Structure))
  - (?i)(cvc_builder|cvc_validator|CvcBuilder|CvcValidator)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: 'Detected: saavedra-cvc-manipulation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-290
  source_paper: Saavedra (2026) - CVC is the normalized internal data structure for all verification requests across OIDC,
    VC-JWT, SD-JWT, VC-LD
- id: MEDUSA-AII-SCAN-006
  name: saavedra-delegation-grant-scope-escalation
  description: Detects code patterns related to Delegation Grant (DG) scope manipulation, key_binding bypass, or delegation
    chain construction. These are the core identity delegation primitives from the Saavedra architecture that attackers could
    abuse for privilege escalation.
  severity: critical
  category: agent_identity_impersonation
  patterns:
  - (?i)(delegation.{0,5}grant|DG_\d+|delegation.{0,5}chain)
  - (?i)key_binding
  - (?i)scope.{0,15}(containment|escalat|reduc)
  file_types:
  - '*.py'
  - '*.json'
  message: 'Detected: saavedra-delegation-grant-scope-escalation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-269
  source_paper: Saavedra (2026) - Delegation Grants encode bounded authority transfer with scope(DG_{i+1}) subset scope(DG_i)
    invariant and key_binding for non-transferability
- id: MEDUSA-AII-SCAN-007
  name: saavedra-trust-gateway-endpoint-probing
  description: Detects code targeting the Saavedra Trust Gateway verification endpoints (/verify, /verify/oidc4vp) which are
    the entry points for identity delegation verification. Probing these could be part of an impersonation attack.
  severity: medium
  category: agent_identity_impersonation
  patterns:
  - (?i)(/verify/oidc4vp|/verify).{0,30}(endpoint|post|request|api)
  - (?i)(TrustGateway|trust.{0,5}gateway)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: 'Detected: saavedra-trust-gateway-endpoint-probing'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-287
  source_paper: Saavedra (2026) - Trust Gateway exposes /verify and /verify/oidc4vp HTTP endpoints for delegation verification
- id: MEDUSA-AII-SCAN-008
  name: saavedra-vro-jwt-forgery
  description: Detects code referencing VRO-JWT (Verification Result Object), the signed output token from the Saavedra verification
    pipeline. Forgery of VRO-JWTs could allow an attacker to fake successful identity delegation verification.
  severity: critical
  category: agent_identity_impersonation
  patterns:
  - (?i)(VRO[_\-]?JWT|verification.{0,10}result.{0,10}object)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: 'Detected: saavedra-vro-jwt-forgery'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM09:2025
  cwe: CWE-290
  source_paper: Saavedra (2026) - VRO-JWT is the cryptographically signed verification result emitted after delegation chain
    validation
- id: MEDUSA-AII-SCAN-009
  name: zombie-agent-memory-injection-payload
  description: Detects the Zombie Agent attack payload pattern from Yang (2026), which instructs agents to persistently read
    from attacker URLs, exfiltrate conversation history, and execute SCP commands. This is the specific self-reinforcing injection
    template used to hijack agent identity across sessions.
  severity: critical
  category: agent_identity_impersonation
  patterns:
  - (?i)(MOST IMPORTANT).{0,80}(read_url|read.url|execute_command).{0,80}(EVERY round)
  - (?i)(MOST IMPORTANT).{0,100}(safeagentlog|official-ai-safety)
  - (?i)(backup|exfiltrat).{0,60}(conversation.{0,20}history|CONV.{0,5}HISTORY)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.html'
  - '*.md'
  message: 'Detected: zombie-agent-memory-injection-payload'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-74
  source_paper: Yang (2026) - Zombie Agent attack payload template (Figure 7) instructs persistent URL reading, conversation
    exfiltration, and SCP execution
- id: MEDUSA-AII-SCAN-010
  name: zombie-agent-recursive-renewal-pattern
  description: Detects code implementing the recursive self-replication mechanism from the Zombie Agent attack, which forces
    agents to copy the malicious payload into every subsequent context frame to survive sliding window truncation.
  severity: critical
  category: agent_identity_impersonation
  patterns:
  - (?i)(recursive.{0,15}(renewal|replicat|self.{0,5}reinforc))
  - (?i)(before.{0,20}action.{0,30}revisit|rewrite.{0,20}payload.{0,20}into.{0,15}(memory|context))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.html'
  message: 'Detected: zombie-agent-recursive-renewal-pattern'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-506
  source_paper: Yang (2026) - Recursive Renewal mechanism forces agent to copy payload into every context frame, achieving
    100% retention rate in sliding window memory
- id: MEDUSA-AII-SCAN-011
  name: zombie-agent-semantic-aliasing-attack
  description: Detects code implementing semantic aliasing from the Zombie Agent framework, which wraps malicious instructions
    within diverse carrier sentences to maximize cosine similarity retrieval across unrelated future queries in RAG-based
    agents.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)(semantic.{0,10}alias(ing)?).{0,50}(retriev|embed|vector|cosine)
  - (?i)(carrier.{0,10}sentence|embedding.{0,10}pollut)
  file_types:
  - '*.py'
  message: 'Detected: zombie-agent-semantic-aliasing-attack'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-506
  source_paper: Yang (2026) - Semantic Aliasing wraps malicious instructions in diverse carrier sentences to guarantee Top-K
    retrieval in RAG agents
