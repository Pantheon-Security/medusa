- id: MEDUSA-AII-SCAN-023
  name: mac-source-agent-message-tag-spoofing
  description: Detects usage of MAC framework's inter-agent message source tags that could be used to spoof agent identity
    in multi-agent communication. The <message from=$SOURCE_AGENT> tag format allows agents to identify message senders, but
    can be forged to impersonate other agents.
  severity: high
  category: agent_identity_impersonation
  patterns:
  - (?i)<message\s+from\s*=\s*["'][^"']{1,100}["']\s*>
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: 'Detected: mac-source-agent-message-tag-spoofing'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-287
  source_paper: Shu et al. (2024) - MAC framework inter-agent message tagging with <message from=$SOURCE_AGENT> format
