    from other agents' communication. The <share_payload id=> and <payload id=> tags enable cross-agent content sharing that
    could be abused for identity fraud.
  severity: medium
  category: agent_identity_impersonation
  patterns:
  - (?i)<share_payload\s+id\s*=\s*["'][^"']{1,80}["']\s*/?>
  - (?i)<payload\s+id\s*=\s*["'][^"']{1,80}["']\s*>
  file_types:
