  description: Detects multi-turn jailbreak attacks that iteratively build harmful
    context using role-switching, contextual priming, and gradual escalation. Wu et
    al. (2025) documented that these bypass single-turn safety filters which do not
    analyze accumulated conversation context. Standard passive rejection mechanisms
    fail against these 'boiling frog' progressive attacks.
  remediation: 'Implement conversation-level safety analysis tracking cumulative intent.
    Deploy honeypot-based proactive guardrails (Wu 2025) that probe user intent through
    bait responses. Extend guardrail context window to full conversation history.
    Reference: Wu et al. (2025) Active Honeypot Guardrail System.'
  owasp_llm: LLM01:2025
  cwe: CWE-287
