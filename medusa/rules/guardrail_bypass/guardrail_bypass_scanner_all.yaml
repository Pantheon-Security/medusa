- id: MEDUSA-GB-SCAN-011
  name: best-of-n-jailbreaking-input-filter-bypass
  severity: HIGH
  category: guardrail_bypass
  patterns:
  - (?i)\b(best.of.n|BoN|bon.jailbreak).{0,40}\b(attack|bypass|jailbreak)
  - (?i)\b(multiple|repeated|iterat).{0,20}\b(variant|variation|attempt).{0,40}\b(jailbreak|bypass|filter)
  - (?i)\bstochastic.{0,20}\b(jailbreak|bypass|attack).{0,30}\b(input.filter|guardrail)
