  remediation: 'Do not rely solely on content moderation for fine-tuning dataset safety.
    Implement structural safety data injection alongside moderation. Use fine-tuning
    auditing agents (Egler 2025) that detect implicit harmful data patterns. Monitor
    model behavior post-fine-tuning, not just pre-fine-tuning data. Reference: Huang
    et al. (2025) 100% bypass rate.'
