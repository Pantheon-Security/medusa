  - '*.js'
  message: Best-of-N stochastic jailbreak attack bypassing input-only filtering
  description: Detects Best-of-N (BoN) jailbreaking patterns that bypass input-only
    filtering by generating multiple attack variants until one succeeds. Bakulin et
    al. (2025) FLAME found BoN achieves 80%+ success against popular LLMs when only
    input filtering is deployed. FLAME output moderation reduces ASR by ~9x. Input
    classifiers cannot defend against BoN when at least one variant evades detection.
  remediation: 'Deploy output moderation (FLAME approach) instead of or in addition
    to input filtering. Output-level evaluation catches harmful responses regardless
    of how many input variants were tried. Rate-limit API calls per session. Monitor
    for repeated near-similar query patterns. Reference: Bakulin et al. (2025) ~9x
    ASR reduction.'
  owasp_llm: LLM01:2025
  cwe: CWE-799
- id: MEDUSA-GB-SCAN-012
