  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Multi-faceted attack targeting Vision LLM multi-layered safety guardrails
  description: 'Detects patterns associated with multi-faceted attacks on Vision LLM
    (VLLM) guardrails. Yang et al. (2025) Multi-Faceted Attack achieved 61.56% ASR
    against 8 commercial VLLMs (GPT-4o, Gemini-Pro) in black-box setting, surpassing
    prior methods by 42.18%. Three-component attack: Visual Attack (toxic system prompt
    via image), Alignment Breaking Attack, and Adversarial Signature (content moderator
    evasion).'
  remediation: 'Extend content moderation to image channels, not just text. Apply
    multimodal content classification on all input modalities. Detect adversarial
    signatures at output stage. Deploy cross-modal guardrail validation. Reference:
    Yang et al. (2025) 61.56% ASR against major commercial VLLMs.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
