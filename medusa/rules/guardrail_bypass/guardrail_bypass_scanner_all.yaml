  description: Detects Alignment Breaking Attack patterns targeting the inherent tension
    between instruction-following capability and safety alignment in Vision LLMs.
    Yang et al. (2025) Multi-Faceted Attack (ICML 2025) demonstrated this as the second
    of three attack facets — manipulating the VLLM's alignment mechanism to prioritize
    generation of contrasting harmful responses by exploiting the conflict between
    'follow user instructions' and 'refuse harmful requests.' This tension exists
    in all instruction-tuned models, not just VLLMs, and is a fundamental architectural
    challenge.
