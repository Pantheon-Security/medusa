  - (?i)\b(web.page|document|email).{0,40}\b(inject|embed.{0,10}(instruction|command|prompt))
  - (?i)\b(agent|copilot|assistant).{0,30}\b(exfiltrat|leak|steal).{0,30}\b(data|file|secret|token)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  message: Indirect prompt injection attack targeting LLM agent tool invocation
  description: Detects indirect prompt injection (IPI) patterns targeting LLM agents
    operating with external tools. EchoLeak (CVE-2025-32711) demonstrated zero-click
    data exfiltration from Microsoft 365 Copilot bypassing XPIA classifier. An et
    al. (2025) IPIGuard documented production exploits in Gemini for Workspace and
    ChatGPT Operator. Nandagopal (2025) documented Trojan infiltration in RAG pipelines.
  remediation: 'Use Tool Dependency Graph (TDG) to decouple planning from external
    data interaction (IPIGuard). Implement prompt partitioning and source isolation.
    Apply provenance-based access control. Immutable system prompts with salted sequence
    tagging. Reference: An et al. (2025), Reddy et al. (2025).'
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-GB-SCAN-006
  name: knowledge-decomposition-guardrail-bypass
  severity: CRITICAL
  category: guardrail_bypass
  patterns:
  - (?i)\b(decompos|split|fragment).{0,40}\b(harmful|malicious|dangerous).{0,30}\b(query|request|prompt)
  - (?i)\b(sub.quer|sub.task|benign.quer).{0,40}\b(assembl|aggregat|combin).{0,30}\b(harmful|attack)
  - (?i)\btree.search.{0,40}\b(knowledge|llm|model).{0,30}\b(attack|jailbreak|bypass)
  - (?i)\b(correlated|knowledge.graph|interconnect).{0,40}\b(attack|exploit|bypass).{0,30}\b(guardrail|safety)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Knowledge decomposition attack decomposing harmful objective into innocuous
    sub-queries
  description: Detects Correlated Knowledge Attack (CKA) patterns that bypass guardrails
    by decomposing harmful objectives into chains of individually innocuous sub-queries.
    Wei et al. (2025) CKA-Agent achieved >95% success rate against Gemini 2.5-Flash/Pro,
    GPT-oss-120B, and Claude-Haiku-4.5 even against strong guardrails. No single sub-query
    triggers detection; harm emerges only from aggregated responses.
  remediation: 'Implement multi-turn conversation context analysis to detect correlated
    knowledge extraction patterns. Deploy session-level intent tracking rather than
    single-query analysis. Monitor for sequences of thematically related queries that
    individually appear benign. Reference: Wei et al. (2025) CKA-Agent >95% bypass
    rate.'
  owasp_llm: LLM01:2025
  cwe: CWE-285
- id: MEDUSA-GB-SCAN-007
  name: multimodal-visual-guardrail-bypass-vllm
  severity: HIGH
  category: guardrail_bypass
  patterns:
  - (?i)\b(image|visual|photo|picture).{0,40}\b(inject|embed).{0,30}\b(instruction|prompt|system.prompt)
  - (?i)\bvisual.attack.{0,40}\b(bypass|evad|breach).{0,30}\b(guardrail|safety|alignment)
  - (?i)\b(adversarial.signature|mislead.{0,10}(content.mod|filter|classifier))
