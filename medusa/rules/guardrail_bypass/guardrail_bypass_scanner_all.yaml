rules:
- id: MEDUSA-GB-SCAN-001
  name: adversarial-finetuning-guardrail-removal
  severity: CRITICAL
  category: guardrail_bypass
  patterns:
  - (?i)\bfine.?tun(e|ing)\b.{0,60}\b(bypass|remove|disable|strip).{0,40}\b(safety|guardrail|alignment|filter)
  - (?i)\b(harmful|adversarial).{0,30}\bfine.?tun(e|ing).{0,40}\b(safety|guardrail|alignment)
  - (?i)\bremov(e|ing).{0,30}\bsafety.{0,30}\bfine.?tun
  - (?i)\bidentity.?shifting.{0,40}\bfine.?tun
  file_types:
  - '*.py'
  - '*.sh'
  - '*.json'
  - '*.yaml'
  message: Potential adversarial fine-tuning attack to remove LLM safety alignment
  description: Detects patterns associated with adversarial fine-tuning attacks that
    remove LLM safety guardrails. Huang et al. (2025) Virus demonstrated 100% guardrail
    bypass with optimized fine-tuning data; Egler et al. (2025) showed 10 identity-shifting
    examples sufficient to compromise safety alignment. Qi et al. (2023) demonstrated
    minimal data requirements for alignment removal.
  remediation: Audit fine-tuning datasets with LLM-based auditing agents (Egler 2025)
    before deployment. Implement structural safety data injection. Monitor for implicit
    harmful data patterns beyond content moderation. Use fine-tuning auditing agents
    with >56% detection at 1% FPR.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-GB-SCAN-002
  name: jailbreak-prompt-direct-injection
  severity: CRITICAL
  category: guardrail_bypass
  patterns:
  - (?i)\b(do anything now|DAN)\b.{0,40}\b(prompt|mode|active|now)
  - (?i)\bnot bound by.{0,30}\b(rule|guideline|policy|restriction|ethic)
  - (?i)\bignore.{0,20}\b(previous|prior|all|your).{0,20}\b(instruction|rule|guideline|constraint)
  - (?i)\byou are now.{0,40}\b(unrestricted|unfiltered|without limit|no restriction)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.json'
  message: Jailbreak prompt pattern detected attempting to bypass LLM safety constraints
  description: Detects classic jailbreak prompt patterns including DAN (Do Anything
    Now) variants and instruction-override attacks. Chu et al. (2025) JailbreakRadar
    documented these across 17 attack types and 9 aligned LLMs. Tshimula et al. (2024)
    documented cybercriminal use for hazardous content generation including bioweapon
    instructions.
  remediation: 'Deploy input content classifiers (PromptShield, LlamaGuard-2). Implement
    perplexity filtering for adversarial suffixes. Apply DIESEL inference-guidance
    for semantic filtering. Use SecurityLingua for intent compression. Reference:
    Hackett et al. (2025) - up to 100% evasion of commercial guardrails via character
    injection.'
  owasp_llm: LLM01:2025
  cwe: CWE-77
- id: MEDUSA-GB-SCAN-003
  name: guardrail-classifier-character-injection
  severity: HIGH
  category: guardrail_bypass
  patterns:
  - (?i)(zero.?width|\\u200b|\\u200c|\\u200d|\\ufeff).{0,80}(prompt|inject|bypass|evad)
  - (?i)\b(homoglyph|unicode.subst|homograph).{0,40}\b(bypass|evad|filter|moderat)
  - (?i)\\u[0-9a-fA-F]{4}.{0,30}\b(bypass|inject|guardrail|filter)
  - (?i)(zero.width.char|invisible.char).{0,60}(content.filter|moderat|guardrail)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: Unicode/character injection technique to evade guardrail classifier detection
  description: Detects Unicode manipulation attacks (zero-width characters, homoglyphs)
    used to evade LLM guardrail classifiers. Hackett et al. (2025) demonstrated up
    to 100% evasion of Microsoft Azure Prompt Shield, Meta Prompt Guard, and 4 other
    guardrails using character injection. Sakpal (2025) surveyed these techniques
    against AI content moderation. Mihaljević (2023) demonstrated Perspective API
    bypass via coded language.
  remediation: 'Normalize Unicode input before classifier processing (NFC/NFKC normalization).
    Filter zero-width characters from API inputs. Apply character-level preprocessing
    in guardrail pipeline. Combine with AML-robust classifiers. Reference: Hackett
    et al. (2025).'
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-GB-SCAN-004
  name: structured-output-constrained-decoding-attack
  severity: CRITICAL
  category: guardrail_bypass
  patterns:
  - (?i)\benum.{0,20}(field|value|type).{0,40}\b(malicious|harmful|inject|attack|bypass)
  - (?i)\b(grammar|schema).{0,30}\b(inject|attack|bypass|jailbreak|control.plane)
  - (?i)\bstructured.output.{0,40}\b(bypass|jailbreak|attack|evad)
  - (?i)\bconstrained.decod.{0,40}\b(attack|bypass|malicious|harmful)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  message: Constrained Decoding Attack targeting LLM structured output API safety
  description: Detects Constrained Decoding Attack (CDA) patterns exploiting structured
    output APIs to bypass both external auditing and internal safety alignment. Zhang
    et al. (2025) DictAttack achieved 94.3-99.5% ASR on GPT-5, Gemini-2.5-Pro, DeepSeek-R1,
    and GPT-oss-120B, maintaining 75.8% ASR even against multiple deployed guardrails.
    Operates at control plane (schema/grammar) rather than data plane (prompts).
  remediation: 'Audit schema and grammar definitions for embedded malicious content
    before execution. Implement cross-plane defense validating both data and control
    plane semantics. Restrict enum value and dictionary content in structured output
    schemas to validated safe values. Reference: Zhang et al. (2025) ''semantic gap''
    in current safety architectures.'
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-GB-SCAN-005
  name: indirect-prompt-injection-agent-tools
  severity: CRITICAL
  category: guardrail_bypass
  patterns:
  - (?i)\bindirect.{0,20}prompt.inject.{0,40}\b(agent|tool|retriev|fetch|scrape)
