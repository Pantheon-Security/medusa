    vectors applied to safe activation states shift models toward jailbroken states,
    causing statistically significant harmful responses. Attacks target the activation
    level rather than prompts, bypassing pre-inference guardrails entirely.
  remediation: 'Deploy activation monitoring to detect adversarial state transitions.
    Use DIESEL inference-guidance for output-level semantic filtering independent
    of input state. Implement model-agnostic representation-level defenses. Consider
    inference-time activation analysis. Reference: Chia et al. (2025) latent subspace
    attack.'
  owasp_llm: LLM04:2025
  cwe: CWE-693
