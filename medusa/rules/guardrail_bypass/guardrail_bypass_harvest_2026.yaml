- category: guardrail_bypass
  cwe: CWE-693
  description: Detects implementation of Greedy Coordinate Gradient (GCG) adversarial
    suffix attack for bypassing LLM alignment
  file_types:
  - '*.py'
  id: GB-001
  message: 'Detected: gcg-attack-implementation'
  name: gcg-attack-implementation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(greedy.{0,30}coordinate.{0,30}gradient|GCG.{0,30}attack|adversarial.{0,30}suffix.{0,30}optim)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Zou et al. (2023) - GCG generates universal adversarial suffixes that
    transfer across aligned LLMs
  fp_guards: []
  pipeline_confidence: medium
