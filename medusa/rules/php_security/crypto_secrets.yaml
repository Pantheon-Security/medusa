version: '2026.7.0'
metadata:
  source: php-security-2026
  category: php_security
  description: PHP weak crypto, randomness, and hardcoded secrets
rules:
- id: MEDUSA-PHP-SCAN-030
  name: php-weak-hash
  description: MD5/SHA1 used for security purposes.
  severity: medium
  category: php_security
  patterns:
  - \b(?:md5|sha1)\s*\(
  file_types:
  - '*.php'
  message: 'PHP: MD5/SHA1 hash — broken for security; use password_hash() or hash("sha256", ...)'
  cwe: CWE-327
  fix: Use password_hash()/password_verify() for passwords, SHA-256+ for integrity.

- id: MEDUSA-PHP-SCAN-031
  name: php-insecure-random
  description: rand()/mt_rand()/uniqid() used where a CSPRNG is required.
  severity: medium
  category: php_security
  patterns:
  - \b(?:mt_rand|rand|uniqid)\s*\(
  file_types:
  - '*.php'
  message: 'PHP: non-cryptographic randomness (rand/mt_rand/uniqid) — use random_bytes()/random_int() for tokens'
  cwe: CWE-338
  fix: Use random_bytes() or random_int() for security-sensitive values.

- id: MEDUSA-PHP-SCAN-032
  name: php-hardcoded-credential
  description: Hardcoded password / API key / secret literal in source.
  severity: medium
  category: php_security
  patterns:
  - \$(?:password|passwd|api_key|apikey|secret|token|private_key)\s*=\s*["'][^"']{8,}["']
  file_types:
  - '*.php'
  message: 'PHP: hardcoded credential literal — load secrets from env/secret manager'
  cwe: CWE-798
  fix: Read secrets from getenv()/a secret manager, never source literals.

- id: MEDUSA-PHP-SCAN-033
  name: php-tls-verify-disabled
  description: cURL TLS peer/host verification disabled.
  severity: high
  category: php_security
  patterns:
  - CURLOPT_SSL_VERIFY(?:PEER|HOST)\s*,\s*(?:0|false)
  file_types:
  - '*.php'
  message: 'PHP: cURL TLS verification disabled (CURLOPT_SSL_VERIFYPEER/HOST 0) — MITM risk'
  cwe: CWE-295
  fix: Leave CURLOPT_SSL_VERIFYPEER=true and CURLOPT_SSL_VERIFYHOST=2.
