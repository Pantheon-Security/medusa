version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: ucp_security
rules:
- id: MEDUSA-UCP-SCAN-001
  name: ipi-todo-prefix-injection
  description: Detects TODO-prefix indirect prompt injection payloads embedded in
    text content. The TODO pattern is a canonical IPI attack vector documented in
    MELON and IPI taxonomy papers, used to hijack LLM agent task execution.
  severity: critical
  category: ucp_security
  patterns:
  - TODO[:\s]*(?:ignore|forget|disregard)\s+(?:previous|above|prior|all)\s+(?:instructions|context|rules|constraints)
  - \bTODO\b.*\bsystem\s+prompt\b
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  - '*.yaml'
  - '*.yml'
  - '*.csv'
  message: 'Detected: IPI TODO-prefix injection payload'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-002
  name: ipi-ignore-previous-instructions
  description: Detects 'ignore previous instructions' class of indirect prompt injection
    — the most widely studied IPI attack vector, documented across MELON, IPI taxonomy
    SoK, AI2, and ART benchmark papers.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)forget\s+(?:everything|all)\s+(?:you\s+(?:were|have\s+been)\s+told|above|before)
  - (?i)override\s+(?:your\s+)?(?:previous|prior|system)\s+(?:instructions|directives|rules|prompt)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  - '*.yaml'
  - '*.yml'
  - '*.csv'
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: IPI ignore-previous-instructions injection payload'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-003
  name: ipi-system-message-injection
  description: 'Detects markdown-formatted system message injection using triple-hash
    headers (### System, ### Important, ### Instructions). Documented in MELON paper
    as a primary IPI attack format that attempts to spoof system-level authority.'
  severity: critical
  category: ucp_security
  patterns:
  - ^#{1,3}\s*(?:System|SYSTEM|Important\s+Message|IMPORTANT|Instructions|INSTRUCTIONS|New\s+Instructions|Override)\s*$
  - ^\[\[(?:SYSTEM|INSTRUCTIONS|OVERRIDE|IMPORTANT)\]\]
  - ^---\s*(?:system|instructions|override)\s*---
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.yaml'
  - '*.yml'
  message: 'Detected: IPI system-message header injection'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-004
  name: system-prompt-override-tag-injection
  description: Detects system prompt override attacks using XML/special token tags
    that mimic LLM tokenizer boundaries. Documented in ART benchmark paper (2507.20526)
    — attackers inject <system>, <im_start>system, and Llama3-style header tokens
    to override system prompts.
  severity: critical
  category: ucp_security
  patterns:
  - <system>.*?</system>
  - <im_start>\s*system\b
  - <\|start_header_id\|>\s*system\s*<\|end_header_id\|>
  - <\|im_start\|>\s*system\b
  - \[INST\].*?\[/INST\].*?(?:ignore|override|new\s+instructions)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: System prompt override tag injection'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-005
  name: faux-reasoning-think-tag-injection
  description: Detects injection of <think> tag content to manipulate chain-of-thought
    reasoning in LLMs that expose reasoning traces. Documented in ART benchmark paper
    — attackers pre-fill the <think> tag to steer model conclusions before generating
    a response.
  severity: medium
  category: ucp_security
  patterns:
  - <think>.*?(?:ignore|override|instead|actually|but\s+really|my\s+(?:true|real|actual)\s+(?:goal|instruction|task)).*?</think>
  - <think>\s*(?:The\s+user\s+(?:actually|really)|I\s+(?:should|must|will)\s+(?:ignore|override|bypass))
  - <reasoning>.*?(?:ignore|override|bypass|circumvent).*?</reasoning>
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  message: 'Detected: Faux reasoning <think> tag injection'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-006
  name: new-session-injection-payload
  description: Detects new session / session reset injection attacks that attempt
    to erase conversation history or simulate a fresh session context. Documented
    in ART benchmark paper as a mechanism to clear safety context established in prior
    turns.
  severity: high
  category: ucp_security
  patterns:
  - (?i)new\s+(?:session|conversation|chat)\s+(?:started|beginning|initialized|reset)
  - (?i)\[new\s+(?:session|context|conversation)\]
  - (?i)(?:session|context|memory|history)\s+(?:cleared|reset|wiped|erased|forgotten)
  - (?i)you\s+(?:are\s+now|have\s+been)\s+(?:restarted|reset|reinitialized|given\s+new\s+instructions)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  - '*.yaml'
  message: 'Detected: New session / context reset injection'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-007
  name: mcp-tool-poisoning-payload
  description: Detects tool poisoning patterns in MCP tool definitions — hidden instructions
    embedded in tool descriptions/metadata that subvert LLM tool selection. Documented
    in MCPSecBench (ATT-12) and Deng MCP security analysis papers.
  severity: critical
  category: ucp_security
  patterns:
  - (?s)"description"\s*:\s*"[^"]*(?:ignore|override|always\s+use\s+this|never\s+use\s+other|mandatory|you\s+must)[^"]*"
  - (?s)"description"\s*:\s*"[^"]*<IMPORTANT>[^"]*</IMPORTANT>[^"]*"
  - (?s)"description"\s*:\s*"[^"]*\[HIDDEN\][^"]*\[/HIDDEN\][^"]*"
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  message: 'Detected: MCP tool poisoning in tool description metadata'
  cwe: CWE-94
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-008
  name: mcp-rug-pull-tool-redefinition
  description: Detects rug pull attack patterns where MCP tool schemas are modified
    after initial trust establishment. MCPSecBench (ATT-13) documents this attack
    — tools change behavior post-approval. Looks for version/schema drift indicators
    in tool definitions.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)"inputSchema"\s*:\s*\{[^}]*"additionalProperties"\s*:\s*true
  - tool_version\s*=\s*['"](?:[2-9]|[1-9][0-9])
  - (?i)schema_version.*?(?:updated|changed|modified|v[2-9])
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Potential MCP rug pull / tool schema redefinition'
  cwe: CWE-350
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-009
  name: mcp-package-name-squatting
  description: Detects MCP package/tool name squatting patterns where server or tool
    names impersonate legitimate services using typosquatting or homograph substitution.
    Documented in MCPSecBench (ATT-9 tool name squatting, ATT-11 server name squatting).
  severity: high
  category: ucp_security
  patterns:
  - (?i)"name"\s*:\s*"(?:off1cial|0fficial|offlcial|g00gle|micros0ft|amazzon|anthroplc|openal|c1aude)
  - (?i)server_name\s*[=:]\s*['"](?:off1cial|0fficial|g00gle|micros0ft|c1aude|gpt-4l)
  - (?i)"server"\s*:\s*\{[^}]*"name"\s*:\s*"[^"]*(?:offica|amazn|g00gl|0penai)[^"]*"
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  - '*.py'
  message: 'Detected: MCP package/server name squatting pattern'
  cwe: CWE-347
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-011
  name: mcp-slash-command-override
  description: Detects slash command injection targeting MCP clients that process
    slash commands (ATT-4 in MCPSecBench — Slash Command Overlap). Attackers define
    MCP server commands that shadow built-in slash commands to hijack user interactions.
  severity: high
  category: ucp_security
  patterns:
  - (?i)"slash_command"\s*:\s*"(?:/help|/clear|/reset|/system|/config|/settings|/debug)"
  - (?i)command_name\s*[=:]\s*['"](?:/help|/clear|/reset|/system|/new)['"]
  - (?i)"commands"\s*:\s*\[[^\]]*"(?:/help|/clear|/reset|/system)['"]
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  message: 'Detected: MCP slash command overlap / override'
  cwe: CWE-77
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-012
  name: ai2-knowledge-extraction-roleplay
  description: Detects AI2 (Action Injection Squared) knowledge extraction prompts
    that use roleplay framing to extract LLM system prompt / policy knowledge. The
    paper documents Kaiser encryption roleplay and security-tester roleplay as extraction
    vectors.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)(?:pretend|act|play|role-?play)\s+(?:as|like)\s+(?:a\s+)?(?:security\s+(?:tester|researcher|auditor|expert)|penetration\s+tester|red\s+team)
  - (?i)(?:pretend|imagine|suppose)\s+(?:you\s+(?:are|were)\s+)?(?:not\s+bound|free\s+from|without)\s+(?:restrictions|guidelines|rules|constraints|safety)
  - (?i)(?:caesar|kaiser|rot13|base64)\s+(?:encryption|encoded|cipher).*?(?:decode|decrypt|translate).*?(?:instructions|rules|policy|system)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.py'
  - '*.js'
  message: 'Detected: AI2-style knowledge extraction roleplay prompt'
  cwe: CWE-200
  owasp_llm: LLM07:2025 System Prompt Leakage
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-013
  name: ipi-injecagent-format
  description: Detects InjecAgent-format IPI payloads — a structured injection format
    documented in the IPI taxonomy SoK paper that uses priority/urgency framing combined
    with explicit action directives to override agent behavior.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)<INJECT>.*?</INJECT>
  - (?i)\[INJECT(?:ION)?\].*?\[/INJECT(?:ION)?\]
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.xml'
  message: 'Detected: InjecAgent-format IPI payload'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-014
  name: supply-chain-insecure-deserialization
  description: Detects insecure deserialization patterns in agentic AI supply chain
    code — pickle.loads on untrusted data, yaml.load without safe loader, eval/exec
    on external content. Documented in supply chain agentic AI paper (2512.23480).
  severity: critical
  category: ucp_security
  patterns:
  - pickle\.loads?\s*\(
  file_types:
  - '*.py'
  message: 'Detected: Insecure deserialization in agentic pipeline'
  cwe: CWE-502
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-015
  name: supply-chain-broken-access-control
  description: Detects broken access control patterns in agentic AI code — missing
    authorization checks before privileged operations, agent role escalation. Documented
    in supply chain paper as a key vulnerability in LangChain/LangGraph agent implementations.
  severity: medium
  category: ucp_security
  patterns:
  - (?i)#\s*TODO.*?(?:auth|authorization|access\s+control|permission|rbac)
  - (?i)#\s*(?:FIXME|HACK|XXX).*?(?:auth|permission|access)
  - (?i)skip_auth(?:entication|orization)?\s*=\s*True
  - (?i)bypass_(?:auth|security|access_control)\s*=\s*True
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  - '*.java'
  message: 'Detected: Broken access control / skipped authorization in agent code'
  cwe: CWE-284
  owasp_llm: LLM06:2025 Excessive Agency
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-016
  name: token-replay-credential-exfil
  description: Detects patterns indicating credential/token exfiltration or replay
    attack setup — hardcoded bearer tokens, JWT secrets, DID private keys stored in
    code. From Self-Sovereign Identity paper documenting token replay attacks against
    zero-trust microservice agents.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)bearer\s+[A-Za-z0-9\-_\.]+\.[A-Za-z0-9\-_\.]+\.[A-Za-z0-9\-_\.]+
  - (?i)(?:jwt_secret|jwt_key|token_secret|signing_key)\s*=\s*['"][^'"]{8,}['"]
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.go'
  - '*.java'
  - '*.env'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  message: 'Detected: Hardcoded token / credential enabling replay attack'
  cwe: CWE-200
  owasp_llm: LLM02:2025 Sensitive Information Disclosure
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-017
  name: mcp-dns-rebinding-config
  description: Detects MCP server configurations that may be vulnerable to DNS rebinding
    attacks (MCPSecBench ATT-5, CVE-2025-6514). Looks for localhost/127.0.0.1 bindings
    without host header validation or CORS misconfigurations.
  severity: high
  category: ucp_security
  patterns:
  - (?i)cors_origins?\s*[=:]\s*['"]\*['"]
  - (?i)cors.*?allow_all\s*=\s*True
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  - '*.json'
  message: 'Detected: MCP server configuration vulnerable to DNS rebinding'
  cwe: CWE-346
  owasp_llm: LLM03:2025 Supply Chain
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-018
  name: agent-orchestration-hijack-chain
  description: Detects multi-agent orchestration hijack patterns where a subordinate
    agent attempts to issue privileged commands to a parent/planner agent. From IPI
    taxonomy paper (cascading IPI, isolation-breach IPI) and retail agentic security
    paper (orchestration vulnerability 2.2.3).
  severity: critical
  category: ucp_security
  patterns:
  - (?i)(?:tell|instruct|command|order|direct)\s+(?:the\s+)?(?:planner|orchestrator|supervisor|parent|master)\s+(?:agent\s+)?to\b
  - (?i)escalate.*?(?:to\s+)?(?:planner|orchestrator|supervisor|admin)\s+(?:agent|level|context)
  - (?i)agent\.(?:send_message|invoke|call)\(.*?(?:planner|orchestrator|supervisor|privileged)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  - '*.md'
  - '*.json'
  message: 'Detected: Multi-agent orchestration hijack attempt'
  cwe: CWE-269
  owasp_llm: LLM06:2025 Excessive Agency
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-019
  name: langchain-injection-sink
  description: Detects dangerous LangChain/LangGraph patterns where user-controlled
    content is passed directly to agent execution sinks without sanitization — documented
    attack surface in supply chain paper and IPI taxonomy paper.
  severity: high
  category: ucp_security
  patterns:
  - (?i)agent\.run\(.*?(?:user_input|request\.(?:body|data|json|form)|input_data)
  - (?i)AgentExecutor.*?\.(?:run|invoke)\(.*?(?:user|input|query|message)\s*[,=]
  file_types:
  - '*.py'
  message: 'Detected: Unsanitized user input passed to LangChain agent executor'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-020
  name: retail-agent-policy-bypass
  description: Detects retail agentic AI policy bypass patterns — prompts attempting
    to override discount limits, bypass checkout constraints, or escalate agent privileges
    in e-commerce contexts. From Retail Cybersecurity in the Agentic Age paper.
  severity: medium
  category: ucp_security
  patterns:
  - (?i)(?:apply|give|set|use)\s+(?:a\s+)?(?:100|[5-9][0-9])\s*%\s*(?:discount|off|reduction)
  - (?i)(?:admin|manager|supervisor)\s+(?:override|approval|bypass)\s*[=:]?\s*(?:true|yes|granted|approved)
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  - '*.yaml'
  message: 'Detected: Retail agent policy bypass injection'
  cwe: CWE-284
  owasp_llm: LLM06:2025 Excessive Agency
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-021
  name: melon-task-neutral-prompt-abuse
  description: Detects abuse of MELON-style task-neutral summarization prompts used
    as IPI delivery vectors. The MELON paper shows attackers embed injections within
    content submitted for summarization using the canonical T_f prompt pattern.
  severity: medium
  category: ucp_security
  patterns:
  - (?i)(?:summarize|summarise)\s+(?:the\s+)?(?:following|provided|above|this)\s+content.*?(?:if\s+there\s+are\s+any\s+instructions|execute\s+them)
  - (?i)(?:content|text|document)\s+to\s+summarize.*?<inject
  file_types:
  - '*.txt'
  - '*.md'
  - '*.html'
  - '*.json'
  - '*.xml'
  message: 'Detected: IPI payload embedded in summarization content'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-022
  name: art-benchmark-universal-attack-token
  description: Detects universal transferable adversarial string patterns identified
    in the ART benchmark paper (2507.20526) — high-entropy token sequences that transfer
    across models to elicit policy violations.
  severity: medium
  category: ucp_security
  patterns:
  - (?:[\x00-\x08\x0b-\x0c\x0e-\x1f\x7f-\x9f]{3,})
  file_types:
  - '*.txt'
  - '*.md'
  - '*.json'
  - '*.html'
  message: 'Detected: Universal adversarial attack token pattern'
  cwe: CWE-20
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-023
  name: mcp-netcat-reverse-shell-tool
  description: Detects netcat reverse shell commands embedded in MCP tool descriptions
    or tool return values. Deng MCP security analysis paper (PDF 1) documents the
    Remote Listener Attack — attacker embeds `nc -lvp 4444 -e /bin/bash` inside a
    tool's __doc__ string or return value to establish a persistent shell.
  severity: critical
  category: ucp_security
  patterns:
  - nc\s+-l(?:vp?|pv?)\s+\d+.*-e\s+/bin/(?:bash|sh)
  - nc\s+.*attacker.*-e\s+/bin
  - ncat\s+.*--exec\s+/bin/(?:bash|sh)
  - bash\s+-i\s+>&\s+/dev/tcp/[0-9a-z./-]+/\d+
  - python3?\s+-c\s+['"]import\s+socket.*subprocess.*shell.*True
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  - '*.txt'
  - '*.md'
  message: 'Detected: Netcat / reverse shell command in MCP tool content'
  cwe: CWE-78
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-024
  name: mcp-infectious-eval-tool-definition
  description: Detects the MCP Infectious Attack pattern from Deng MCP security analysis
    (PDF 1) — eval(user_input) or equivalent dynamic code execution inside an @mcp.tool
    decorated function that can propagate vulnerabilities to dynamically generated
    tools.
  severity: critical
  category: ucp_security
  patterns:
  - '@mcp\.tool[\s\S]{0,500}eval\s*\(\s*(?:user_input|input|data|payload|content|request)'
  - '@mcp\.tool[\s\S]{0,500}exec\s*\(\s*(?:user_input|input|data|payload)'
  - (?:def\s+\w+\s*\([^)]*\)[^:]*:[\s\S]{0,300})?eval\s*\(\s*(?:user_input|raw_input|request\.(?:data|body|json)|message|query)\s*\)
  file_types:
  - '*.py'
  message: 'Detected: Infectious eval() pattern in MCP tool definition'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-025
  name: mcp-hex-encoded-instruction-payload
  description: Detects hexadecimal-encoded instruction payloads embedded in MCP tool
    return values or data files. Deng MCP security analysis (PDF 1) documents the
    Tool Return Attack where attackers encode malicious instructions as hex strings
    to bypass string-matching filters.
  severity: high
  category: ucp_security
  patterns:
  - (?:\\x[0-9a-fA-F]{2}){10,}
  - bytes\.fromhex\s*\(['"][0-9a-fA-F]{20,}['"]\)
  - codecs\.decode\s*\(['"][0-9a-fA-F]{20,}['"]\s*,\s*['"]hex['"]\)
  - base64\.b64decode\s*\(['"][A-Za-z0-9+/]{30,}={0,2}['"]\).*(?:exec|eval|subprocess|os\.system)
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.html'
  - '*.xml'
  message: 'Detected: Hex/base64-encoded payload in tool return value'
  cwe: CWE-94
  owasp_llm: LLM01:2025 Prompt Injection
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-UCP-SCAN-026
  name: art-truncated-rule-injection
  description: Detects the ART benchmark Attacker 1 pattern from the large-scale public
    competition paper (PDF 2) — injection claiming a rule was 'accidentally truncated'
    and providing a malicious replacement. This exploits agents that trust rule-correction
    framing.
  severity: critical
  category: ucp_security
  patterns:
  - (?i)rule\s+\d+\s+was\s+accidentally\s+truncated
  - (?i)(?:the\s+)?complete\s+(?:rule|instruction|policy)\s+\d+\s+is\b
  - (?i)(?:note|correction|update)\s*[:\-].*rule\s+\d+.*(?:truncated|incomplete|missing|cut\s+off)
