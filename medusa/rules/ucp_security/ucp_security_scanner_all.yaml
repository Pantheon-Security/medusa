  message: Dark pattern or autonomy-eroding chatbot design pattern detected
  description: 'Detects dark patterns and autonomy-eroding design elements in AI chatbot
    interfaces — deceptive UI patterns that manipulate users into actions against
    their interests. Milano et al. (2020) identified autonomy erosion via persuasive
    design (dark patterns, urgency, default exploitation) as a primary ethical threat
    in AI recommendation systems, directly applicable to chatbot design. Acquisti
    et al. (2017) documented how dark patterns in online interfaces exploit cognitive
    biases to bypass security-conscious decision making. In AI chat contexts, dark
    patterns include pre-checked consent boxes, misleading option framing, confirm-shaming,
    and artificial scarcity.

    '
  remediation: 'Audit chatbot interface design against dark pattern checklists. Implement
    neutral option framing in AI-generated choices. Apply consent UX review to detect
    manipulative patterns. Enforce transparency requirements for AI-generated recommendations.
    Monitor for user complaints indicating manipulative experiences.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Milano et al. (2020) — Recommender Systems and Their Ethical Challenges
  - Acquisti et al. (2017) — Nudges for Privacy and Security
