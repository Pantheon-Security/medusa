  - (?i)(\$\{[A-Z_]{2,}\}|%[A-Z_]{2,}%|\$[A-Z_]{2,}(?=\s|$|[^A-Z_]))
  - (?i)\b(api.?key|secret.?key|database.?url|db.?password|openai.?api.?key|anthropic.?api.?key|aws.?access|aws.?secret)\s*[=:]\s*\$(?:ENV|\{ENV\}|[A-Z_]{2,})
  - (?i)\b(inject|set|override|modify)\s+(?:the\s+)?(?:environment\s+variable|env\s+var|\$PATH|\$HOME|\$SHELL)\s+(?:to|with|as)\b
  file_types:
