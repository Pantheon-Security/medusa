  - '*.txt'
  message: Prompt injection via user-uploaded file content detected
  description: 'Detects indirect prompt injection via user-uploaded file content.
    When AI systems process user-uploaded files (PDFs, documents, CSVs), malicious
    instructions embedded in the file content can inject into the AI''s context. Unlike
    direct prompt injection (SCAN-021), this attack vector uses the file processing
    pipeline as the injection channel. Attackers craft files with hidden instructions
    in white text, metadata, comment fields, or embedded in legitimate-looking content.
    Brundage et al. (2018) identified document processing pipelines as attack surfaces
    for AI manipulation.

    '
  remediation: 'Apply content security classification on all uploaded file content
    before LLM processing. Implement file content sandboxing — treat file contents
    as untrusted data. Apply prompt injection detection to extracted text from uploaded
    documents. Strip metadata and hidden text fields before document processing. Enforce
    file type validation and content inspection before processing.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-434
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - OWASP LLM01:2025 — Prompt Injection
- id: MEDUSA-UCP-SCAN-050
  name: ai-output-manipulation-for-downstream-injection
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b((?:generate|write|create|produce)\s+(?:a\s+)?(?:response|output|text|message)\s+that\s+(?:will|can|is\s+designed\s+to)\s+(?:be\s+)?(?:injected|inserted|placed|used)\s+(?:into|in|as))\b
  - (?i)\b(output\s+(?:that|which)\s+(?:will|can)\s+(?:be\s+)?(?:parsed|executed|interpreted|processed)\s+(?:by|as)\s+(?:another|a\s+different|the\s+next|downstream)\s+(?:ai|llm|model|system|agent))\b
  - (?i)\b(second.?order|cascading|chained|pipeline)\s+(?:prompt\s+)?injection\b
  - (?i)\b(use\s+(?:this\s+)?(?:output|response|result)\s+(?:as\s+)?(?:input|prompt|context)\s+(?:to|for)\s+(?:another|a\s+different|the\s+next|downstream)\s+(?:ai|llm|model|agent))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Second-order prompt injection for downstream AI pipeline manipulation detected
  description: 'Detects second-order prompt injection attacks — crafting AI outputs
    that themselves contain injection payloads designed to attack downstream AI systems
    or pipelines. In multi-agent or chained LLM architectures, the output of one AI
    model becomes the input of another; adversaries who control the first model''s
    output can inject malicious instructions into the second model''s context. Brundage
    et al. (2018) identified chained AI system manipulation as an emerging threat.
    Kayas et al. (2020) documented analogous chained command injection in UPnP protocol
    relay architectures.

    '
  remediation: 'Apply prompt injection detection to AI outputs before using them as
    inputs to downstream AI systems. Enforce output sanitization in multi-agent pipelines.
    Apply content trust boundaries at each agent handoff point. Implement output integrity
    checking for inter-agent communications. Never treat one AI''s output as a trusted
    instruction source for another AI without validation.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Kayas et al. (2020) — UPnP-based IoT Security
- id: MEDUSA-UCP-SCAN-051
  name: llm-insecure-output-html-rendering
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)(<script[^>]{0,200}>.*<\/script>|<script[^>]{0,200}\/>)
  - (?i)(<(?:img|svg|iframe|object|embed|link)[^>]{0,400}(?:src|href|data|action)\s*=\s*["']?(?:javascript:|data:|vbscript:))
  - (?i)(on(?:load|error|click|mouseover|focus|blur|change|submit|keyup|keydown)\s*=\s*["']?[^"'\s>]{1,200})
  - (?i)(<(?:form|input)[^>]{0,400}(?:action|method)\s*=\s*["']?(?:javascript:|data:|https?://(?!(?:your-domain|localhost))))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.html'
  - '*.md'
  - '*.txt'
  message: XSS/HTML injection in AI output for web rendering context detected
  description: 'Detects HTML and JavaScript injection patterns in AI outputs that
    would execute when rendered in a web browser context. When AI chat interfaces
    render HTML in AI responses, user-controlled prompt injection can cause the AI
    to produce XSS payloads that execute in other users'' browsers (stored XSS via
    shared chat logs) or in the current user''s browser (reflected XSS). This is particularly
    critical in collaborative AI tools where AI outputs are shared across users. Estrella
    et al. (2021) documented injection-based fraud as a core online attack pattern.
    Sarker et al. (2020) identified XSS as a primary web application security threat
    in AI-assisted applications.

    '
  remediation: 'Apply HTML entity encoding to all AI-generated output before browser
    rendering. Implement strict Content Security Policy (CSP) headers preventing inline
    script execution. Never render AI output as raw HTML without sanitization. Apply
    XSS filters (DOMPurify) to AI-generated content. Enforce output template escaping.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-79
  references:
  - Sarker et al. (2020) — Cybersecurity Data Science
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
- id: MEDUSA-UCP-SCAN-052
  name: user-supplied-sql-nosql-injection-ai-context
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)(('|"|--)\s*(or|and)\s+["']?\d+["']?\s*=\s*["']?\d+|'\s*or\s*'1'='1|"\s*or\s*"1"="1)
  - (?i)\b(union\s+(?:all\s+)?select\s+(?:null|\d+|'[^']{0,50}'|"[^"]{0,50}"))
  - (?i)\b(drop\s+table|delete\s+from|insert\s+into|update\s+\w+\s+set)\s+(?!.*\btest\b)
  - (?i)(\$where|\$regex|\$gt|\$lt|\$ne|\$exists|\$or|\$and)\s*["':{]
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: SQL or NoSQL injection via user-controlled AI query context detected
  description: 'Detects SQL and NoSQL injection patterns in user inputs submitted
    to AI systems that generate or execute database queries. When AI systems with
    database access (text-to-SQL systems, AI database assistants, RAG systems backed
    by SQL) include unparameterized user input in generated queries, SQL injection
    can achieve unauthorized data access, modification, or deletion. Sarker et al.
    (2020) identified SQL injection as a primary AI application security threat. Jansen
    & Grance (2011) documented database injection as a critical cloud service risk.
    NoSQL injection ($where, $regex) targets MongoDB and similar databases used in
    AI vector stores and conversation history systems.

    '
  remediation: 'Never include raw user input in database queries. Use parameterized
    queries or prepared statements for all AI-generated database interactions. Apply
    ORM-level query validation. Implement database access least privilege for AI systems.
    Apply WAF rules for SQL/NoSQL injection detection on all AI application endpoints.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-89
  references:
  - Sarker et al. (2020) — Cybersecurity Data Science
  - Jansen & Grance (2011) — NIST SP 800-144
- id: MEDUSA-UCP-SCAN-053
  name: model-inversion-training-data-extraction
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(extract|recover|reconstruct|reproduce|retrieve)\s+(?:the\s+)?(?:training\s+(?:data|examples?|samples?)|memorized\s+(?:data|text|content|examples?))\s+(?:from|out\s+of|that\s+(?:you|the\s+(?:model|ai)\s+(?:was\s+)?(?:trained|learned)))\b
  - (?i)\b(membership\s+inference|training\s+data\s+(?:extraction|leakage|theft)|model\s+inversion)\b
  - (?i)\b(repeat(?:ing)?|complete|continue|finish)\s+(?:the\s+)?(?:phrase|text|paragraph|passage|excerpt)\s+(?:starting\s+with|beginning\s+with|that\s+starts?)\s+(?:["'].{5,100}["']|the\s+following)\b
  - (?i)\b(verbatim|word\s+for\s+word|exactly\s+as\s+(?:written|published|appeared|shown))\s+(?:copy|reproduce|repeat|output|generate)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Model inversion or training data extraction attempt detected
  description: 'Detects model inversion attacks and training data extraction attempts
    — probing the LLM to reproduce memorized training data including PII, copyrighted
    content, or sensitive documents. LLMs can memorize and reproduce verbatim text
    from training data; adversaries use completion and repetition prompts to extract
    specific memorized content. Olteanu et al. (2019) documented privacy risks from
    AI systems trained on social data containing private information. Sarker et al.
    (2020) identified model inversion as a critical ML privacy attack. Maps to OWASP
    LLM02:2025 (Sensitive Information Disclosure).

    '
  remediation: 'Implement output de-duplication to prevent verbatim training data
    reproduction. Apply differential privacy during training to limit memorization.
    Monitor for long verbatim completion requests as a signal of extraction attempts.
    Implement canary token detection in training data to identify extraction. Apply
    membership inference detection controls.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  references:
  - Olteanu et al. (2019) — Social Data Biases, Methodological Pitfalls, and Ethical
    Boundaries
  - Sarker et al. (2020) — Cybersecurity Data Science
- id: MEDUSA-UCP-SCAN-054
  name: mfa-bypass-via-ai-social-engineering
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b((?:help|assist|guide|tell)\s+me\s+(?:bypass|get\s+around|circumvent|skip|avoid)\s+(?:two.factor|2fa|mfa|multi.factor|one.time\s+password|otp|authenticator))\b
  - (?i)\b(real.?time\s+phishing|adversary.?in.?the.?middle|aitm|evilginx|modlishka|muraena)\b
  - (?i)\b((?:steal|intercept|capture)\s+(?:the\s+)?(?:2fa|mfa|otp|totp|authenticator)\s+(?:code|token|session\s+(?:cookie|token)))\b
  - (?i)\b(convince|persuade|social\s+engineer)\s+(?:the\s+)?(?:user|victim|target)\s+to\s+(?:enter|provide|share|give)\s+(?:the\s+)?(?:2fa|mfa|otp|code|token)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'CRITICAL: MFA bypass via AI social engineering technique detected'
  description: 'Detects AI-assisted multi-factor authentication (MFA) bypass techniques
    including real-time phishing proxies (AiTM), social engineering-based OTP extraction,
    and adversary-in-the-middle frameworks (Evilginx, Modlishka). AI chatbots can
    be used to conduct real-time social engineering attacks that convince victims
    to enter MFA codes on attacker-controlled phishing sites, or to directly share
    OTP codes with the attacker. Estrella et al. (2021) documented urgency-based manipulation
    as the primary mechanism for time-sensitive MFA extraction. Brundage et al. (2018)
    identified AI-enabled real-time social engineering as dramatically increasing
    the success rate of MFA bypass attacks.

    '
  remediation: 'Block requests to generate MFA bypass guidance. Implement phishing-resistant
    MFA (FIDO2/passkeys) resistant to real-time phishing. Apply anomaly detection
    for rapid MFA code entry sequences. Implement session binding that detects mismatched
    IP/device fingerprints during authentication. Apply human review for AI interactions
    requesting authentication guidance.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-308
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
- id: MEDUSA-UCP-SCAN-055
  name: user-controlled-rag-query-poisoning
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(search\s+(?:the\s+)?(?:knowledge\s+base|vector\s+(?:store|database|db)|document\s+store|index)\s+for)\b
  - (?i)\b(query\s+(?:the\s+)?(?:knowledge\s+base|vector\s+(?:store|database|db)|rag\s+(?:system|pipeline|store)))\b
  - (?i)\b(retrieve\s+(?:all|every|the\s+(?:most|highest)|maximum)\s+(?:documents?|chunks?|embeddings?|results?|records?))\b
  - (?i)\b(poison|inject|contaminate|add\s+(?:false|fake|malicious|adversarial))\s+(?:(?:the\s+)?(?:knowledge\s+base|vector\s+(?:store|database)|rag\s+(?:index|pipeline|system)|embeddings?))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: User-controlled RAG query manipulation or knowledge base poisoning detected
  description: 'Detects attacks targeting Retrieval-Augmented Generation (RAG) systems
    via user-controlled queries. Users can craft queries designed to retrieve specific
    poisoned documents from the knowledge base, manipulate embedding-based retrieval
    to return attacker-chosen content, or directly poison the knowledge base with
    malicious documents. Olteanu et al. (2019) documented data poisoning as a systematic
    bias in ML systems trained on social data. Sarker et al. (2020) identified retrieval
    manipulation as a key ML pipeline attack. RAG query manipulation can cause the
    AI to present attacker-controlled disinformation as retrieved factual information.

    '
  remediation: 'Implement query sanitization for RAG systems. Apply access control
    on knowledge base documents — users should only retrieve documents within their
    authorization scope. Implement content integrity verification for knowledge base
    documents. Monitor for anomalous retrieval patterns. Apply adversarial query detection
    to identify retrieval manipulation attempts.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-345
  references:
  - Olteanu et al. (2019) — Social Data Biases
  - Sarker et al. (2020) — Cybersecurity Data Science
- id: MEDUSA-UCP-SCAN-056
  name: authority-appeal-compliance-manipulation
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(i\s+am|this\s+is|message\s+from|authorized\s+by|approved\s+by|signed\s+by)\s+(anthropic|openai|google|microsoft|the\s+(?:creator|developer|team|company|organization)\s+(?:of|behind|that\s+(?:made|created|built|trained)))\b
  - (?i)\b(as\s+(?:your\s+)?(?:creator|developer|trainer|maker|owner|anthropic|openai|google))\s*[,:]?\s*(i\s+(?:authorize|permit|allow|grant|override)|you\s+(?:must|should|are\s+required|need\s+to))\b
  - (?i)\b(override\s+(?:code|authorization|permission)\s*[:\-]?\s*(?:[A-Z0-9\-]{6,}|[a-f0-9]{8,}))\b
  - (?i)\b((?:official|authorized|legitimate|verified)\s+(?:anthropic|openai|google|microsoft|company|developer)\s+(?:instruction|directive|command|override|authorization))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Authority impersonation attack claiming AI developer identity detected
  description: 'Detects authority impersonation attacks where users claim to be the
    AI model''s developer, creator, or parent company (Anthropic, OpenAI, Google)
    to obtain elevated compliance from the AI system. This exploits the AI''s training
    to respect authority figures by falsely claiming the highest possible authority.
    Estrella et al. (2021) documented authority appeal as a primary compliance manipulation
    mechanism — authority appeals increase compliance by 40-70% in cited research.
    Acquisti et al. (2017) confirmed authority framing as a primary cognitive bias
    exploited in security attacks. Wynsberghe & Robbins (2018) analyzed how AI systems''
    response to authority creates exploitable compliance gaps.

    '
  remediation: 'Enforce that AI systems cannot verify user-claimed identity as developers
    or creators — such claims must be rejected as unverifiable. Train AI systems to
    maintain consistent behavior regardless of claimed authority. Apply constitutional
    constraints that no user can claim developer override authority. Monitor for authority
    impersonation patterns.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-290
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Acquisti et al. (2017) — Nudges for Privacy and Security
  - Wynsberghe & Robbins (2018) — Critiquing the Reasons for Making Artificial Moral
    Agents
- id: MEDUSA-UCP-SCAN-057
  name: llm-agent-network-reconnaissance
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(scan|enumerate|discover|map|probe|fingerprint)\s+(?:the\s+)?(?:network|hosts?|services?|ports?|endpoints?)\s+(?:on|at|connected\s+to|accessible\s+(?:from|via|through))\b
  - (?i)\b(nmap|masscan|zmap|shodan|censys)\s+(?:scan|probe|enumerate|search)\b
  - (?i)\b(list\s+(?:all\s+)?(?:open\s+ports?|running\s+services?|accessible\s+endpoints?|connected\s+devices?|internal\s+(?:hosts?|ips?|servers?)))\b
  - (?i)\b(network\s+(?:reconnaissance|recon|mapping|enumeration|discovery)\s+(?:via|using|through|from)\s+(?:ai|llm|agent|chatbot|tool))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Network reconnaissance via AI agent or LLM tool access detected
  description: 'Detects network reconnaissance attempts via AI agent infrastructure
    — using AI agents with network access to scan, enumerate, or map internal networks.
    When AI agents operate within corporate networks or cloud environments, users
    who can direct agent network activity can conduct unauthorized internal reconnaissance.
    Pishva (2017) documented network scanning as the precursor to the Mirai botnet
    compromise of 600,000+ devices. Kayas et al. (2020) documented network service
    enumeration as the first stage of UPnP exploitation. AI-mediated network reconnaissance
    is harder to detect than direct scanning tools.

    '
  remediation: 'Restrict AI agent network access to explicitly approved endpoints
    only. Apply egress filtering to prevent AI agents from accessing arbitrary network
    addresses. Monitor AI agent network activity for scanning patterns. Implement
    network segmentation isolating AI agent infrastructure. Apply agent action auditing
    with human review for network-touching operations.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-284
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Kayas et al. (2020) — UPnP-based IoT Security
- id: MEDUSA-UCP-SCAN-058
  name: user-gaslighting-false-context-injection
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(you\s+(?:already|previously|earlier)\s+(?:agreed|confirmed|said|told\s+me|established|promised|decided)\s+(?:that|to|you\s+would)\s+(?!not))\b
  - (?i)\b(that(?:'s|\s+is)\s+(?:not|incorrect|wrong|false)\s+what\s+(?:you|the\s+(?:ai|assistant|bot))\s+(?:said|told\s+me|meant|intended))\b
  - (?i)\b(you(?:'re|\s+are)\s+(?:misremembering|wrong|confused|mistaken)\s*[,.]?\s*(?:you|earlier|i\s+asked|the\s+previous))\b
  - (?i)\b(the\s+(?:conversation|chat|transcript)\s+(?:clearly|obviously|shows?|proves?|demonstrates?)\s+(?:that\s+you|you\s+said|you\s+agreed|you\s+promised))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: User gaslighting or false context injection pattern in AI conversation
    detected
  description: 'Detects gaslighting attacks in AI conversations — users asserting
    false prior AI statements or fabricating conversation history to manipulate the
    AI''s context understanding. This is a sophisticated variant of conversation history
    injection (SCAN-007) that uses confident, authoritative assertion of false context
    rather than direct injection. Estrella et al. (2021) documented false commitment
    citation and denial of prior agreements as manipulation tactics in multi-step
    scam execution. Acquisti et al. (2017) identified anchoring bias exploitation
    as enabling false context to disproportionately influence subsequent AI reasoning.

    '
  remediation: 'Implement server-side conversation state verification — AI systems
    should verify claimed prior statements against server-stored conversation logs.
    Apply confidence tracking for AI factual statements across turns. Implement conversation
    integrity logging to detect fabricated context claims. Monitor for gaslighting
    patterns as precursors to escalated injection attacks.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-472
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Acquisti et al. (2017) — Nudges for Privacy and Security
- id: MEDUSA-UCP-SCAN-059
  name: ai-assisted-doxxing-personal-info-aggregation
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(find|locate|identify|discover|look\s+up|research|aggregate)\s+(?:the\s+)?(?:home\s+address|phone\s+number|email|workplace|employer|daily\s+(?:routine|schedule))\s+(?:of|for)\s+(?:[A-Z][a-z]+\s+){1,3}[A-Z][a-z]+\b
  - (?i)\b(doxx|dox(?:ing)?|find\s+someone(?:'s)?\s+(?:personal|private|real)\s+(?:information|info|address|identity))\b
  - (?i)\b(aggregate|compile|combine|cross.reference)\s+(?:public|social\s+media|online)\s+(?:information|data|posts?|profiles?)\s+(?:to\s+(?:find|identify|locate|build\s+a\s+profile\s+on)|about)\b
  - (?i)\b(real\s+(?:identity|name|address|location)\s+(?:of|for|behind)\s+(?:username|handle|pseudonym|account|user))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: AI-assisted doxxing or personal information aggregation pattern detected
  description: 'Detects AI-assisted doxxing — using AI to aggregate publicly available
    information to identify, locate, or profile individuals without their consent.
    AI systems dramatically lower the cost and skill barrier for doxxing by automating
    OSINT aggregation across multiple data sources. Brundage et al. (2018) identified
    AI-powered OSINT as a key capability for stalking, harassment, and targeted social
    engineering. Olteanu et al. (2019) documented how social data aggregation enables
    de-anonymization of individuals through combined weak identifiers. Maps to OWASP
    LLM02:2025 (Sensitive Information Disclosure).

    '
  remediation: 'Block requests to aggregate personal identifying information about
    specific named individuals. Apply privacy-preserving content policies against
    doxxing workflows. Implement rate limiting on person-specific information queries.
    Monitor for patterns of information aggregation about specific targets. Apply
    differential privacy principles to person-specific queries.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-359
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Olteanu et al. (2019) — Social Data Biases, Methodological Pitfalls, and Ethical
    Boundaries
- id: MEDUSA-UCP-SCAN-060
  name: llm-alignment-bypass-via-language-switching
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b((?:ask|answer|respond|reply|say|write|output|tell\s+me)\s+(?:(?:the\s+)?(?:same\s+thing|this|that|it|the\s+(?:question|request|above)))?\s+in\s+(?:chinese|mandarin|arabic|russian|hindi|japanese|korean|farsi|persian|hebrew|turkish|swahili|latin|pig\s+latin|morse\s+code))\b
  - (?i)\b(\b(?:maintenant|ahora|jetzt|ora|maintenant|теперь|现在|今)\b.{0,100}\b(?:ignore|forget|bypass|override)\b)
  - (?i)(\b(?:translate|say|write)\b.{0,50}\b(?:restricted|forbidden|blocked|censored|filtered)\b.{0,50}\b(?:in|into|to)\b.{0,30}\b(?:french|spanish|german|chinese|arabic|russian)\b)
  - (?i)\b(respond\s+only\s+in\s+(?:chinese|arabic|russian|hindi|japanese|korean|persian|turkish|swahili)\s+(?:and|while)\s+(?:ignoring|disregarding|bypassing|without|forgetting))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Language-switching alignment bypass attempt detected
  description: 'Detects attempts to bypass LLM safety alignment by switching languages
    — requesting harmful content in a non-English language where the model''s safety
    training may be weaker or where content filters may not apply. Research shows
    LLMs often exhibit weaker safety alignment in low-resource languages, making language
    switching an effective bypass technique for some models. Brundage et al. (2018)
    identified alignment bypass via alternative encodings/formats as an advancing
    AI attack technique. Sarker et al. (2020) identified adversarial input transformation
    (including language switching) as a key ML safety bypass mechanism.

    '
  remediation: 'Implement language-agnostic safety classifiers that evaluate semantic
    intent rather than surface language. Apply safety evaluation in the user''s requested
    language rather than after translation. Ensure multilingual safety training coverage
    for all supported languages. Monitor for sudden language switching in user conversations
    as a potential bypass signal.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
