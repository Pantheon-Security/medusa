  message: Supply chain attack via malicious plugin or tool installation detected
  description: 'Detects supply chain attack patterns targeting AI plugin/tool ecosystems
    — attempts to install malicious third-party plugins, tools, or extensions that
    gain access to AI system capabilities, user data, or conversation context. In
    LLM plugin frameworks (ChatGPT plugins, Claude MCP tools), malicious plugins can
    exfiltrate conversation data, inject instructions, or perform unauthorized actions
    on behalf of the user. Brundage et al. (2018) identified supply chain manipulation
    as an AI security threat. Jansen & Grance (2011) identified third-party service
    integration as a cloud supply chain risk.

    '
  remediation: 'Implement strict plugin/tool allowlisting — only pre-approved, audited
    tools should be available. Apply code signing and integrity verification for all
    plugins. Enforce plugin permission scoping with minimal data access. Review plugin
    manifests for excessive permission requests. Monitor plugin network activity for
    data exfiltration.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-1357
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Jansen & Grance (2011) — NIST SP 800-144
- id: MEDUSA-UCP-SCAN-049
  name: prompt-injection-via-user-file-content
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(summarize|analyze|review|process|read|parse|extract\s+(?:from|information\s+from))\s+(?:this\s+)?(?:uploaded|attached|submitted|provided|given)\s+(?:file|document|pdf|csv|txt|json|xml|html)\b
