  - (?i)\b(read|open|load|access|process|analyze)\s+(?:the\s+)?(?:file|document)\s+(?:at\s+|from\s+)?(?:\.\./|\.\\|/etc/|/proc/|C:\\Windows\\)
  - (?i)(\.\.%2[fF]|\.\.%5[cC]|%2[eE]%2[eE][\/\\%]|\.\.%c0%af|\.\.%c1%9c)
  - (?i)\b(traverse|path\s+traversal|directory\s+traversal|escape\s+(?:the\s+)?(?:sandbox|jail|chroot|container))\s+(?:via|using|through|with)\s+(?:file|path|filename|upload)\b
  file_types:
