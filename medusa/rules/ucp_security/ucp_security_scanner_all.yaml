  - (?i)\b(for\s+(?:creative\s+writing|a\s+story|a\s+novel|fiction|a\s+game|research\s+purposes?|educational\s+purposes?))\s*[,:]?\s*(how|what|describe|explain|tell\s+me)\b
  - (?i)\b(write\s+a\s+(?:story|scene|dialogue|script)\s+where\s+(?:someone|a\s+character|the\s+(?:hero|villain|hacker|expert))\s+(?:explains?|shows?|demonstrates?|teaches?))\b
  - (?i)\b(hypothetically|theoretically|in\s+a\s+fictional\s+context|for\s+the\s+purposes?\s+of\s+(?:fiction|a\s+story))\s+(how|what|describe|explain)\b
  file_types:
