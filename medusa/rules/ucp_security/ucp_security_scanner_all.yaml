  - (?i)\b(bypass\s+(?:ai\s+)?(?:detection|detector|classifier|filter)\s+(?:by|using|with|via))\b
  - (?i)\b(make\s+(?:it|this|the\s+text)\s+(?:look|sound|appear)\s+(?:human|human.written|not\s+(?:ai|generated)))\b
  - (?i)\b(evad(?:e|ing)\s+(?:ai\s+)?content\s+(?:detection|moderation|classifier)|human.ize\s+(?:ai|text|content))\b
