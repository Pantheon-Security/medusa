  - (?i)\b(\$\(|`[^`]+`|;\s*(?:ls|cat|wget|curl|bash|sh|cmd|powershell)|&&\s*(?:ls|cat|wget|curl|rm|del))\b
  - (?i)\b(command\s+inject(?:ion)?|os\s+command\s+inject(?:ion)?|shell\s+inject(?:ion)?)\b
