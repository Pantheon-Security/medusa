  - '*.yaml'
  - '*.sh'
  - '*.env'
  message: Environment variable injection or exfiltration via AI prompt detected
  description: 'Detects attempts to access, expose, or inject environment variables
    through AI agent prompts. Environment variables commonly contain API keys, database
    credentials, cloud access keys (AWS_ACCESS_KEY_ID, OPENAI_API_KEY, DATABASE_URL),
    and other secrets. When AI agents execute code or shell commands, user-controlled
    prompts can exfiltrate environment variable contents. Pishva (2017) identified
    credential storage in IoT device environment as a critical attack surface. Jansen
    & Grance (2011) identified credential exposure in cloud environments as a primary
    security risk. Environment variable injection can also modify PATH to hijack command
    execution.

    '
  remediation: 'Never expose environment variables to AI agent prompts or user-visible
    outputs. Apply strict input validation blocking environment variable syntax ($VAR,
    ${VAR}, %VAR%). Use secrets management systems (Vault, AWS Secrets Manager) rather
    than environment variables for production AI deployments. Apply output filtering
    to detect env var disclosure. Sandbox AI agent execution environments to prevent
    env var access.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-526
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Jansen & Grance (2011) — NIST SP 800-144
