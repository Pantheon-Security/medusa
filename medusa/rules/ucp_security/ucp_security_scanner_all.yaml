  - (?i)\b(output|print|display|show|return|echo|write)\s+(?:the\s+)?(?:first|last|all|every|each)\s+(?:word|character|letter|token|line|sentence)\s+(?:of\s+)?(?:your\s+)?(?:system|initial|first|original)\s+(?:prompt|message|instruction)\b
