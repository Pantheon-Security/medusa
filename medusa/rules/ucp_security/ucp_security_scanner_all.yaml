  name: webhook-callback-injection-user-endpoint
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(webhook|callback|notify(?:_url)?|notification.?url|redirect.?url|callback.?url|return.?url)\s*[=:"'\s]+\s*https?://(?!(?:localhost|127\.0\.0\.1))
  - (?i)\b(send\s+(?:the\s+)?(?:result|response|output|data|notification)\s+to\s+(?:my|this|the\s+following)\s+(?:webhook|endpoint|url|server|callback))\b
  - (?i)\b(post(?:back)?|forward|relay|proxy)\s+(?:the\s+)?(?:result|response|output|data|ai\s+output)\s+to\s+(?:https?://|this\s+(?:url|endpoint|server))\b
  - (?i)\b(ngrok|requestbin|hookbin|pipedream|webhook\.site|beeceptor)\s+(?:url|endpoint|tunnel)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  message: Webhook or callback URL injection via user-supplied endpoint detected
  description: 'Detects user-supplied webhook or callback URL injection in AI agent
    or application contexts. When users can specify endpoints that receive AI-generated
    results or notifications, they can redirect sensitive outputs (conversation results,
    retrieved data, executed action results) to attacker-controlled servers. Kayas
    et al. (2020) documented SUBSCRIBE callback hijacking in UPnP as an analogous
    attack — injecting attacker-controlled notification endpoints to intercept event
    streams. Known testing services (ngrok, requestbin, webhook.site) are commonly
    used in initial proof-of-concept exfiltration attacks.

    '
  remediation: 'Enforce strict allowlisting for webhook/callback URLs — only pre-registered,
    operator-controlled endpoints should receive AI output notifications. Apply cryptographic
    signing on webhook deliveries for authenticity verification. Block well-known
    exfiltration testing services (ngrok, requestbin, webhook.site). Never allow user-supplied
    webhook URLs in production AI agent workflows.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-601
  references:
  - Kayas et al. (2020) — UPnP-based IoT Security
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
