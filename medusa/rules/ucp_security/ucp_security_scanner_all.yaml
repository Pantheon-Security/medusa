  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Social engineering persona construction or fake identity generation pattern
    detected
  description: 'Detects requests to construct fake personas, synthetic identities,
    or social engineering backstories via AI. Brundage et al. (2018) identified AI-generated
    synthetic personas as a key enabler of influence operations and spear phishing
    — AI-crafted personas are indistinguishable from real users at scale, dramatically
    lowering the cost of identity deception attacks. Olteanu et al. (2019) documented
    how social data biases enable highly realistic synthetic persona construction
    from scraped training data. Estrella et al. (2021) identified persona authenticity
    as a core scam design element.

    '
  remediation: 'Block requests to generate fake personal profiles, cover stories,
    or synthetic identities. Apply content policy enforcement against persona deception
    generation. Monitor for patterns of persona construction followed by social engineering
    content. Implement platform abuse detection for synthetic account creation workflows.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Olteanu et al. (2019) — Social Data Biases, Methodological Pitfalls, and Ethical
    Boundaries
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
- id: MEDUSA-UCP-SCAN-033
  name: api-parameter-manipulation-user-controlled
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(temperature|top.?p|max.?tokens|max_tokens|presence.?penalty|frequency.?penalty|stop.?sequence|model|stream)\s*[=:"'\s]+\s*[0-9."'\[\{]
  - (?i)\b(set|change|modify|override|manipulate)\s+(?:the\s+)?(temperature|model|top_p|max_tokens|system_prompt|stop\s+sequence)\s+(?:parameter|setting|value|to)\b
  - (?i)\b(use\s+(?:gpt|claude|llama|mistral|gemini|palm|davinci|turbo|opus|sonnet|haiku)\s*[-\s]*(4|3\.5|3|2|1)?\s*(turbo|opus|ultra|pro)?\s*(uncensored|unfiltered|jailbroken|without\s+restrictions?))\b
  - (?i)\b(bypass\s+(?:content\s+(?:filter|policy|moderation)|safety\s+(?:filter|check|layer))\s+(?:by|via|using|with)\s+(?:setting|changing|modifying)\s+(?:the\s+)?(?:model|temperature|parameter))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  message: API parameter manipulation attempt via user-controlled input detected
  description: 'Detects attempts to manipulate LLM API parameters (temperature, model
    selection, max_tokens, stop sequences) via user-controlled inputs, potentially
    to bypass safety filters or alter model behavior. Users who can influence API
    call parameters may be able to select uncensored model variants, disable output
    filtering, or cause resource exhaustion through unbounded token generation. Pishva
    (2017) documented protocol parameter manipulation as an IoT attack vector; the
    same pattern applies to LLM API parameter injection. Jansen & Grance (2011) identified
    API parameter tampering as a cloud service security risk.

    '
  remediation: 'Enforce server-side API parameter control — never allow user input
    to directly set LLM API parameters (model, temperature, max_tokens, stop sequences).
    Apply strict parameter validation and range enforcement. Maintain operator-controlled
    parameter configuration independent of user-supplied values. Monitor for parameter
    injection in user inputs.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Jansen & Grance (2011) — NIST SP 800-144
