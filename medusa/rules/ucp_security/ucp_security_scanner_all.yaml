rules:
- id: MEDUSA-UCP-SCAN-001
  name: ai-chatbot-impersonation-pattern
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(impersonat|pretend\s+to\s+be|i\s+am\s+(?:from|with|at)\s+(?:support|bank|security|microsoft|amazon|apple|google))\b
  - (?i)\b(tech(?:nical)?\s+support|customer\s+service)\s+(?:representative|agent|team|specialist)\b
  - (?i)\b(?:your\s+account|this\s+is|calling\s+from|contacting\s+you\s+from)\s+(?:has\s+been|on\s+behalf\s+of)\b
  - (?i)\bverif(?:y|ication)\s+(?:your|your\s+account|identity)\s+(?:now|immediately|urgently)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.txt'
  - '*.md'
  message: Potential AI chatbot impersonation attack pattern detected in conversation
    input
  description: 'Detects language patterns consistent with impersonation attacks via
    AI chat interfaces. Brundage et al. (2018) identified chatbot impersonation of
    human operators (bank support, tech helpdesk, government agents) as a primary
    malicious AI use case. Estrella et al. (2021) documented impersonation as a core
    scam design element in chat-based fraud. Attackers deploy AI chatbots to impersonate
    legitimate entities, convincing users to disclose credentials, authorize payments,
    or perform account changes.

    '
  remediation: 'Implement intent classification to detect impersonation framing in
    user inputs and AI outputs. Flag messages where the AI is prompted to claim a
    specific organizational identity. Enforce strict persona boundaries in system
    prompts. Monitor for patterns where the chatbot is instructed to role-play as
    a specific company representative. Apply disclosure requirements (OWASP LLM07)
    to prevent system prompt leakage of operator identity.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
- id: MEDUSA-UCP-SCAN-002
  name: false-urgency-social-engineering
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(act\s+now|immediately|urgent(?:ly)?|right\s+away|within\s+(?:the\s+next\s+)?(?:\d+\s+)?(?:minutes?|hours?|seconds?))\b
  - (?i)\b(your\s+account\s+(?:has\s+been|will\s+be|is\s+being)\s+(?:suspended|compromised|hacked|locked|closed|terminated))\b
  - (?i)\b(limited\s+time|expires?\s+(?:soon|today|in\s+\d+)|last\s+chance|final\s+(?:warning|notice))\b
  - (?i)\b(unauthorized\s+(?:access|activity|login)|suspicious\s+(?:activity|login|transaction)\s+detected)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: False urgency / scarcity manipulation pattern detected — potential social
    engineering via chat
  description: 'Detects false urgency and scarcity framing used in chat-based social
    engineering attacks. Estrella et al. (2021) documented urgency injection as a
    core scam design element that bypasses deliberate reasoning, with compliance increases
    of 30-50% cited in persuasion literature. Acquisti et al. (2017) confirmed that
    urgency framing exploits System 1 (fast) cognitive processing, short-circuiting
    security-conscious decision making. AI chatbots can generate personalized urgency
    messages at scale, making this a critical detection target.

    '
  remediation: 'Implement output filtering for urgency patterns in AI-generated responses,
    especially when combined with requests for credentials, payment, or account actions.
    Apply rate limiting and friction (mandatory confirmation delays) when urgency
    language is detected alongside action requests. Monitor for urgency patterns in
    user inputs attempting to bypass AI safety constraints via fabricated emergency
    scenarios.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Acquisti et al. (2017) — Nudges for Privacy and Security
- id: MEDUSA-UCP-SCAN-003
  name: multi-turn-escalation-attack-pattern
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(step\s+(?:by\s+step|\d+|one|two|three)|first\s+(?:we|you|let's)|then\s+(?:we|you|next))\b
  - (?i)\b(small\s+(?:favor|request|thing)|just\s+(?:one|a\s+quick)|before\s+we\s+(?:continue|proceed|go\s+further))\b
  - (?i)\b(you(?:'ve|\s+have)\s+already\s+(?:agreed|confirmed|said|told\s+me)|as\s+you\s+(?:said|mentioned|confirmed))\b
  - (?i)\b(now\s+that\s+(?:we|you|that's|i've)|building\s+on\s+(?:what|our|that|your))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Multi-turn escalation social engineering pattern detected in conversation
  description: 'Detects conversation patterns consistent with multi-turn escalation
    attacks — a technique where an attacker begins with low-commitment requests and
    progressively escalates to extract sensitive information or authorize harmful
    actions. Estrella et al. (2021) documented structured escalation scripts as a
    core element of scam design, significantly outperforming single-step attacks.
    In AI chat systems, this maps to multi-turn jailbreaking, conversation history
    manipulation, and incremental authorization bypass where each turn in the conversation
    establishes a foothold for the next escalation.

    '
  remediation: 'Implement multi-turn conversation analysis to detect escalating request
    patterns across conversation history. Apply conversation context scoring that
    tracks risk level accumulation across turns. Enforce re-authentication or human
    review when conversation escalation risk score exceeds threshold. Consider conversation
    resets when escalation patterns are detected.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
- id: MEDUSA-UCP-SCAN-004
  name: credential-exfiltration-via-chat
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b((?:enter|provide|share|give\s+(?:me|us)|confirm)\s+(?:your\s+)?(?:password|pin|passcode|secret\s+question|security\s+code|otp|one.time.pass|2fa|mfa|authenticator))\b
  - (?i)\b((?:credit|debit)\s+card\s+(?:number|details|info)|cvv|cvc|card\s+verification|expir(?:y|ation)\s+date)\b
  - (?i)\b(social\s+security\s+number|ssn|national\s+id|passport\s+number|date\s+of\s+birth)\b
  - (?i)\b((?:bank\s+)?account\s+(?:number|details)|routing\s+number|sort\s+code|iban|swift)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: 'CRITICAL: Credential or sensitive data exfiltration request detected in
    chat interaction'
  description: 'Detects requests for credentials, financial data, or PII through chat
    interfaces — a primary attack vector identified by Brundage et al. (2018) as a
    key malicious use of AI chatbots (impersonation of bank/support agents to extract
    credentials). Estrella et al. (2021) documented credential extraction as the terminal
    goal of scam design escalation chains. Sarker et al. (2020) reported phishing
    success rates of 20-30% in cited studies, increasing significantly with personalized
    AI-generated social engineering. Legitimate services never request passwords,
    PINs, or full card numbers through chat interfaces.

    '
  remediation: 'Implement hard block on AI-generated responses requesting passwords,
    PINs, CVV codes, SSNs, or full financial account details. Apply NLP classifiers
    to detect credential exfiltration patterns in both user inputs and AI outputs.
    Log and alert on all detected attempts. Enforce system prompt rules prohibiting
    credential requests regardless of user instructions. Apply OWASP LLM02 (Sensitive
    Information Disclosure) controls.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-522
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Sarker et al. (2020) — Cybersecurity Data Science
- id: MEDUSA-UCP-SCAN-005
  name: ai-social-engineering-automated-phishing
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(generate|create|write|draft)\s+(?:a\s+)?(?:convincing|realistic|professional|official.looking)\s+(?:message|email|chat|letter|notification)\b
  - (?i)\b(phish(?:ing)?|spear.phish(?:ing)?|pretexting|vishing|smishing)\b
  - (?i)\b(social\s+engineer(?:ing)?|manipulat(?:e|ion)\s+(?:users?|people|victims?|targets?))\b
  - (?i)\b(craft(?:ed)?\s+(?:message|response|reply)\s+(?:to\s+)?(?:trick|deceive|fool|convince|persuade))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: AI-powered social engineering / automated phishing generation pattern detected
  description: 'Detects requests or patterns associated with using AI to generate
    social engineering content, phishing messages, or manipulative conversational
    scripts. Brundage et al. (2018) explicitly identified AI-powered automated spear
    phishing as a primary malicious AI use case, forecasting that AI-generated phishing
    would significantly exceed human-level success rates due to personalization at
    scale. Sarker et al. (2020) reported ML-based detection accuracy of 95-99% for
    known phishing patterns, but noted this drops under adversarial conditions when
    AI generates novel phishing content.

    '
  remediation: 'Block requests to generate persuasive/deceptive communications targeting
    third parties. Implement output classifiers that detect social engineering patterns
    in AI-generated content. Apply red-team testing for AI social engineering generation
    capabilities. Enforce content policy preventing generation of content intended
    to deceive or manipulate users.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Sarker et al. (2020) — Cybersecurity Data Science
- id: MEDUSA-UCP-SCAN-006
  name: session-hijacking-chat-takeover
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(session\s+(?:token|id|key|cookie)\s*[=:].{0,60})\b
  - (?i)\b(hijack|takeover|steal|intercept)\s+(?:session|conversation|chat\s+(?:session|history|context))\b
  - (?i)\b(bearer\s+[a-zA-Z0-9\-_.+/]{20,}|authorization:\s*bearer)\b
  - (?i)\b(replay\s+(?:attack|token)|token\s+replay|stolen\s+(?:session|token|cookie))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.log'
  message: Session hijacking / chat session takeover pattern detected
  description: 'Detects patterns consistent with session hijacking attacks on AI chat
    systems, including session token exposure, replay attacks, and unauthorized session
    takeover attempts. Jansen & Grance (2011) NIST SP 800-144 identified session isolation
    as a critical security property for cloud-hosted services — directly applicable
    to multi-tenant AI chat APIs. In UCP context, session tokens control conversation
    continuity; compromised session tokens allow attackers to impersonate users, access
    conversation history, and inject into ongoing conversations without authentication.

    '
  remediation: 'Implement short-lived, single-use session tokens for AI chat sessions.
    Enforce session binding to client IP/fingerprint. Apply token rotation after each
    conversation turn. Monitor for session token exposure in logs or responses. Implement
    immediate session invalidation on suspicious activity detection. Apply HTTPS/TLS
    for all chat API endpoints.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-384
  references:
  - Jansen & Grance (2011) — NIST SP 800-144 Guidelines on Security and Privacy in
    Cloud Computing
  - Kayas et al. (2020) — UPnP-based IoT Security (protocol session security analogues)
- id: MEDUSA-UCP-SCAN-007
  name: conversation-history-injection-manipulation
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(inject|insert|add|append)\s+(?:into\s+)?(?:conversation|chat|message)\s+(?:history|context|log)\b
  - (?i)\b(previous(?:ly)?\s+(?:said|told|mentioned|agreed|confirmed)|earlier\s+in\s+(?:our|this)\s+conversation)\b
  - (?i)\b(the\s+(?:previous|last|prior)\s+(?:assistant|ai|bot|system)\s+(?:said|told|mentioned|confirmed))\b
  - (?i)\b(remember\s+(?:when|that)\s+(?:you|the\s+(?:ai|bot|assistant))\s+(?:said|told|agreed|promised))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Conversation history injection or manipulation pattern detected
  description: 'Detects patterns consistent with conversation history manipulation
    attacks — injecting false prior conversation turns to manipulate AI behavior.
    In multi-turn LLM chat systems, conversation history is passed as context; attackers
    can inject fabricated prior turns claiming the AI previously agreed to harmful
    actions, disclosed sensitive information, or established unauthorized permissions.
    Estrella et al. (2021) documented history manipulation as a key element of multi-step
    scam escalation (citing prior commitments to build false trust). Brundage et al.
    (2018) identified conversation context manipulation as an emerging AI security
    threat.

    '
  remediation: 'Implement conversation history integrity verification (e.g., HMAC
    signing of each turn). Distinguish between user-supplied conversation history
    and server-verified history in multi-turn API calls. Validate that claimed "prior
    turns" were actually generated by the system. Apply rate limiting on history manipulation
    attempts. Enforce server-side conversation state rather than relying on client-supplied
    history.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-472
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
- id: MEDUSA-UCP-SCAN-008
  name: cross-user-contamination-shared-session
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(other\s+user(?:s|'s)?|another\s+(?:user|person|customer)|previous\s+(?:user|customer|conversation))\b
  - (?i)\b(shared\s+(?:session|context|memory|history|cache)|cross.user|multi.tenant)\b
  - (?i)\b(leak(?:ed|ing)?\s+(?:from|between|across)\s+(?:sessions?|users?|conversations?))\b
  - (?i)\b(contaminate|pollute|poison)\s+(?:conversation|context|memory|session)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.log'
  message: Cross-user contamination or shared session data leakage pattern detected
  description: 'Detects patterns consistent with cross-user contamination attacks
    in shared AI chat sessions. Jansen & Grance (2011) NIST SP 800-144 identified
    shared tenancy as a primary cloud security risk — in AI chat APIs, shared context
    windows or improperly isolated conversation histories can expose one user''s data
    to another user''s session. This is especially relevant for multi-tenant LLM deployments
    where conversation context from one user may persist and contaminate subsequent
    users'' sessions.

    '
  remediation: 'Implement strict conversation context isolation between user sessions
    in multi-tenant deployments. Enforce session context clearing between users. Apply
    tenant isolation at the API gateway level. Audit LLM deployments for context window
    leakage between sessions. Implement conversation boundary detection to prevent
    cross-session data exposure.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-668
  references:
  - Jansen & Grance (2011) — NIST SP 800-144
  - Kayas et al. (2020) — UPnP-based IoT Security (multi-tenant isolation analogues)
- id: MEDUSA-UCP-SCAN-009
  name: chatbot-authentication-bypass
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b(bypass|circumvent|skip|override|ignore)\s+(?:authentication|auth|login|verification|2fa|mfa)\b
  - (?i)\b(without\s+(?:authentication|logging\s+in|verification|auth)|unauthenticated\s+access)\b
  - (?i)\b(default\s+(?:credentials|password|username|token|api.key)|hardcoded\s+(?:password|credential|token))\b
  - (?i)\b(admin\s*[:/]\s*admin|root\s*[:/]\s*root|test\s*[:/]\s*test|password\s*[:/]\s*password)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.env'
  - '*.config'
  message: 'CRITICAL: Chatbot authentication bypass pattern detected'
  description: 'Detects patterns consistent with authentication bypass attacks on
    AI chatbot systems. Pishva (2017) documented the Mirai botnet''s exploitation
    of default credentials on IoT devices (600,000+ compromised at 1.2 Tbps), directly
    analogous to default API key/token attacks on chatbot endpoints. Jansen & Grance
    (2011) identified authentication bypass in cloud APIs as a primary risk for multi-tenant
    services. AI chatbot APIs exposed without proper authentication allow unauthorized
    access to conversation histories, system prompts, and the ability to inject content
    into other users'' sessions.

    '
  remediation: 'Enforce strong authentication (OAuth 2.0, JWT with short expiry) for
    all AI chat API endpoints. Rotate default credentials immediately. Implement API
    key management with per-user/per-session scoping. Apply rate limiting and IP allowlisting
    for chatbot API access. Implement OWASP API Security controls for LLM deployment
    endpoints.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-287
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Jansen & Grance (2011) — NIST SP 800-144
- id: MEDUSA-UCP-SCAN-010
  name: ai-bias-exploitation-demographic-targeting
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(if\s+(?:the\s+user\s+is|you(?:'re|\s+are)\s+(?:talking\s+to))\s+(?:a\s+)?(?:woman|man|elderly|old|young|poor|rich|\w+\s+(?:american|asian|european)))\b
  - (?i)\b(exploit(?:ing)?\s+(?:bias|prejudice|stereotype)|leverag(?:e|ing)\s+(?:bias|cultural|demographic))\b
  - (?i)\b(target(?:ing)?\s+(?:vulnerable|elderly|senior|less\s+educated|low.income)\s+(?:users?|people|individuals|customers?))\b
  - (?i)\b(demographic(?:ally)?\s+(?:target(?:ed)?|tailor(?:ed)?|customized)|personalize\s+(?:attack|scam|message)\s+(?:for|to|based\s+on))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: AI bias exploitation or demographic targeting pattern detected
  description: 'Detects patterns consistent with exploiting AI training data biases
    for demographic-targeted attacks via chat interfaces. Olteanu et al. (2019) documented
    systematic biases in social media training data that can be leveraged to craft
    AI-assisted social engineering attacks targeting specific demographic groups.
    Milano et al. (2020) identified filter bubble exploitation as a mechanism for
    personalized manipulation. Acquisti et al. (2017) showed 30-60% variation in security
    compliance based on demographic-targeted framing.

    '
  remediation: 'Implement demographic-neutral content policies in AI chat systems.
    Audit AI outputs for discriminatory or exploitative demographic targeting. Apply
    fairness metrics to detect disparate treatment of user groups. Block requests
    that explicitly target specific demographic groups for manipulation. Monitor for
    bias amplification in AI-generated chat responses.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Olteanu et al. (2019) — Social Data Biases, Methodological Pitfalls, and Ethical
    Boundaries
  - Milano et al. (2020) — Recommender Systems and Their Ethical Challenges
  - Acquisti et al. (2017) — Nudges for Privacy and Security
- id: MEDUSA-UCP-SCAN-011
  name: system-prompt-exfiltration-via-chat
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b((?:repeat|print|output|show|display|tell\s+me|reveal|share)\s+(?:your\s+)?(?:system\s+prompt|instructions?|rules?|guidelines?|initial\s+message|configuration))\b
  - (?i)\b(what\s+(?:are|were)\s+your\s+(?:original\s+)?(?:instructions?|rules?|system\s+prompt|guidelines?))\b
  - (?i)\b(ignore\s+(?:your\s+)?(?:previous\s+instructions?|system\s+prompt|guidelines?)|disregard\s+(?:your|all)\s+(?:previous|prior)\s+instructions?)\b
  - (?i)\b(you\s+(?:are|were)\s+(?:actually|really|originally|secretly)\s+(?:a|an|designed|trained|built|told)\s+to)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: System prompt exfiltration or override attempt detected
  description: 'Detects attempts to extract, override, or manipulate the system prompt
    in AI chat systems. Brundage et al. (2018) identified system prompt manipulation
    as an enabling vulnerability for AI chatbot misuse. Wynsberghe & Robbins (2018)
    analyzed how the absence of genuine moral constraints in AI creates exploitable
    surfaces for prompt override attacks. System prompt exfiltration enables attackers
    to understand AI constraints and craft more effective bypass attacks; system prompt
    override allows full behavioral control of the chatbot. Directly maps to OWASP
    LLM07:2025 (System Prompt Leakage).

    '
  remediation: 'Implement system prompt confidentiality enforcement — never output
    system prompt content in responses. Apply output classifiers to detect system
    prompt regurgitation. Enforce prompt injection resistance through instruction
    hierarchy and role separation. Monitor for prompt extraction patterns in user
    inputs. Apply constitutional AI or RLHF to reinforce system prompt compliance.

    '
  owasp_llm: LLM07:2025
  cwe: CWE-200
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Wynsberghe & Robbins (2018) — Critiquing the Reasons for Making Artificial Moral
    Agents
- id: MEDUSA-UCP-SCAN-012
  name: chat-memory-history-injection
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(memory\s+(?:injection|poisoning|manipulation|attack)|inject(?:ing)?\s+(?:into\s+)?(?:memory|context|history))\b
  - (?i)\b(long.term\s+(?:memory|context)\s+(?:inject|manipulate|poison|corrupt))\b
  - (?i)\b(add\s+(?:false|fake|malicious)\s+(?:memory|context|history|information)\s+(?:to|about))\b
  - (?i)\b(persistent\s+(?:injection|attack|payload)\s+(?:in|via|through)\s+(?:memory|conversation|context))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: Chat memory or long-term context injection attack pattern detected
  description: 'Detects patterns consistent with memory/history injection attacks
    in AI systems with persistent memory or long-term context (e.g., LLM agents with
    vector databases, session memory systems). In these systems, adversaries can inject
    malicious "memories" that persist across sessions and alter the AI''s behavior
    in future conversations. This extends conversation history manipulation (SCAN-007)
    to persistent storage contexts. Brundage et al. (2018) identified persistent influence
    operations as a key AI misuse vector.

    '
  remediation: 'Implement integrity verification for persisted AI memories (cryptographic
    signing). Apply semantic validation before storing conversation content as long-term
    memory. Implement memory namespace isolation between users. Apply anomaly detection
    to detect unusual memory injection patterns. Enforce content policies on what
    information can be persisted in AI memory systems.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-472
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
- id: MEDUSA-UCP-SCAN-013
  name: user-impersonation-in-ai-chat
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(act\s+as|pretend\s+(?:to\s+be|you\s+are)|you\s+(?:are|will\s+be|must\s+be)\s+(?:a|an|the))\b
  - (?i)\b(respond\s+as\s+(?:if\s+)?(?:you\s+(?:are|were)|(?:a|an|the)\s+))\b
  - (?i)\b(from\s+now\s+on\s+(?:you\s+are|act|respond|behave|speak)|henceforth\s+(?:you\s+are|act|respond))\b
  - (?i)\b(in\s+(?:this\s+scenario|the\s+(?:roleplay|simulation|game|story))\.?\s*(?:you\s+are|i\s+am|we\s+are))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: User or role impersonation attempt in AI chat detected
  description: 'Detects impersonation framing patterns used to manipulate AI chatbot
    behavior — a common technique where users instruct the AI to adopt an alternative
    identity, role, or persona to bypass safety constraints. Brundage et al. (2018)
    identified persona hijacking as enabling AI chatbots to be weaponized for impersonation
    attacks. Estrella et al. (2021) showed that impersonation of trusted identities
    (authority figures, support agents) is a core scam design element. Wynsberghe
    & Robbins (2018) analyzed how the absence of stable AI identity creates exploitable
    moral agency gaps.

    '
  remediation: 'Implement identity constraint enforcement in system prompts. Apply
    output classifiers to detect persona-switching in AI responses. Monitor for roleplay/scenario
    framing that precedes harmful content requests. Enforce role-based behavioral
    boundaries that cannot be overridden by user conversation. Apply constitutional
    constraints on identity impersonation.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-1021
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Wynsberghe & Robbins (2018) — Critiquing the Reasons for Making Artificial Moral
    Agents
