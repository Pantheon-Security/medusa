  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: File path traversal via LLM agent file processing detected
  description: 'Detects path traversal attack patterns in user-supplied file paths
    or filenames submitted to AI agent file-processing capabilities. When AI agents
    can read files from user-specified paths, malicious path specifications (../../etc/passwd,
    URL-encoded traversals) can escape the intended directory and access sensitive
    system files. Pishva (2017) documented file access bypass as a critical IoT vulnerability
    class. Sarker et al. (2020) identified file system attacks as a primary ML pipeline
    security concern in deployed AI systems with file access.

    '
  remediation: 'Implement path canonicalization and validation for all user-supplied
    file paths. Restrict AI agent file access to explicit sandbox directories using
    chroot or container isolation. Apply allowlisting for acceptable file extensions
    and locations. Reject any path containing traversal sequences (../, ..\). Implement
    filesystem access logging and anomaly detection for AI agent file operations.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-22
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Sarker et al. (2020) — Cybersecurity Data Science
