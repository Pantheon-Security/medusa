  message: AI chatbot API unauthorized access or key exposure pattern detected
  description: 'Detects patterns consistent with unauthorized access to AI chatbot
    APIs, including API key exposure, brute force, rate limit bypass, and key rotation
    evasion. Pishva (2017) documented how weak authentication on IoT endpoints (analogous
    to chatbot APIs) enabled the Mirai botnet to compromise 600,000+ devices. Jansen
    & Grance (2011) identified API key management as a critical cloud security control.
    Exposed or brute-forced AI API keys enable attackers to impersonate legitimate
    users, access conversation histories, and abuse AI capabilities at scale.

    '
  remediation: 'Implement per-request API key rotation and short-lived tokens. Apply
    rate limiting per API key with exponential backoff. Monitor for API key exposure
    in code repositories and logs. Implement IP-based rate limiting and behavioral
    anomaly detection. Use API gateway with key management, usage quotas, and abuse
    detection.

    '
