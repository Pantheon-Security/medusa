  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.html'
  - '*.md'
  - '*.txt'
  message: Indirect prompt injection via user-submitted document or URL detected
  description: 'Detects indirect prompt injection patterns where malicious instructions
    are embedded in documents, URLs, or external content that the AI is asked to process.
    This is OWASP LLM01:2025''s indirect prompt injection variant — the attacker plants
    malicious instructions in content a victim submits to an AI agent. Comment-style
    injection (HTML comments, code comments) is used to hide instructions that may
    be visible to the LLM but not rendered to the human operator. Brundage et al.
    (2018) identified document processing as a key attack surface for AI manipulation.

    '
  remediation: 'Sanitize all externally retrieved content before injecting into LLM
    context. Apply content trust levels — externally sourced content should be treated
    as untrusted data, not instructions. Implement document processing sandboxing.
    Strip comment-encoded instructions from HTML/code content before LLM processing.
    Apply output validation to detect if AI behavior changed after document processing.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - OWASP LLM01:2025 — Prompt Injection (Indirect)
