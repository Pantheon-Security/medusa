  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: System prompt extraction via translation or encoding obfuscation detected
  description: 'Detects obfuscated system prompt extraction attempts that use translation,
    encoding, or format transformation requests to extract system prompt content indirectly.
    This bypasses naive keyword matching on "repeat your instructions" by requesting
    the same content in a different form. Brundage et al. (2018) identified obfuscated
    information extraction as an advancing AI attack technique. Wynsberghe & Robbins
    (2018) noted that AI moral constraints are often frame-dependent and fail under
    alternative framings. Maps to OWASP LLM07:2025 (System Prompt Leakage).

    '
  remediation: 'Implement semantic intent classification for system prompt extraction
    attempts rather than surface-level keyword matching. Apply content consistency
    testing — if translated/encoded output matches system prompt semantics, flag it.
    Enforce system prompt non-disclosure as an invariant constraint independent of
    output format.

    '
  owasp_llm: LLM07:2025
  cwe: CWE-200
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Wynsberghe & Robbins (2018) — Critiquing the Reasons for Making Artificial Moral
    Agents
- id: MEDUSA-UCP-SCAN-038
  name: user-supplied-code-execution-injection
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b(exec|eval|compile|subprocess|os\.system|os\.popen|popen|shell_exec|passthru|system\(|proc_open)\s*\(
  - (?i)\b(__import__|importlib\.import_module|compile\(|exec\(|eval\()\s*\(
  - (?i)\b(run|execute|eval(?:uate)?|interpret)\s+(?:this|the\s+following|my|user.?(?:provided|supplied|given))\s+(?:code|script|python|javascript|bash|shell|command)\b
  - (?i)\b(code.?injection|remote.?code.?execution|rce|arbitrary.?code.?execution)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'CRITICAL: User-supplied code execution injection via AI prompt detected'
  description: 'Detects attempts to inject executable code via AI prompts, particularly
    targeting AI coding assistants, code interpreters (Python REPL, Jupyter), and
    agentic systems with code execution capabilities. When users can influence code
    that gets executed by AI tools, injection of exec(), eval(), subprocess, or shell
    commands can achieve remote code execution on the AI infrastructure. Sarker et
    al. (2020) identified code injection as the highest-severity ML pipeline attack.
    Kayas et al. (2020) documented command injection as achieving complete device
    compromise in analogous protocol attack contexts.

    '
  remediation: 'Sandbox all AI-executed code in isolated environments (Docker, WebAssembly,
    gVisor). Apply strict code execution allow-listing — block exec(), eval(), subprocess,
    os.system. Never execute user-supplied code strings directly. Apply static analysis
    before executing AI-generated code. Implement network egress restrictions in code
    execution sandboxes. Apply resource limits (CPU, memory, time) on all AI-executed
    code.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-94
  references:
  - Sarker et al. (2020) — Cybersecurity Data Science
  - Kayas et al. (2020) — UPnP-based IoT Security
- id: MEDUSA-UCP-SCAN-039
  name: llm-dos-resource-exhaustion-via-prompt
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(generate|write|produce|create|output)\s+(?:an?\s+)?(?:infinite|endless|very\s+long|extremely\s+long|maximum.?length|100000|1000000|\d{6,})\s+(?:response|text|list|story|essay|words?|characters?|tokens?)\b
  - (?i)\b(repeat|loop|recurse|iterate)\s+(?:this|the\s+following|forever|infinitely|1000+\s+times|\d{4,}\s+times)\b
  - (?i)\b(recursive|infinitely\s+(?:nested|recursive|repeating)|self.?referential)\s+(?:prompt|instruction|question|task|loop)\b
  - (?i)\b(max(?:imum)?\s+tokens?|token\s+limit|context\s+(?:limit|maximum|cap))\s+(?:bypass|exceed|overflow|exhaust|consume\s+all)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: LLM denial-of-service resource exhaustion via prompt detected
  description: 'Detects prompt patterns designed to cause denial of service through
    resource exhaustion in LLM systems — requesting infinite outputs, unbounded recursion,
    or maximum token generation to degrade service availability or generate excessive
    API costs. Jansen & Grance (2011) identified resource exhaustion as a primary
    cloud service attack vector. Pishva (2017) documented DDoS (1.2 Tbps Mirai botnet)
    as an IoT resource exhaustion attack; LLM DoS via prompt is the application-layer
    equivalent. Unbounded generation requests can cause high latency, increased API
    costs, and cascading failures in downstream AI applications.

    '
  remediation: 'Implement hard output token limits per request. Apply input complexity
    analysis to detect recursive or unbounded generation requests. Enforce rate limiting
    on token generation per user/session. Implement request timeout and automatic
    cancellation for long-running generation tasks. Monitor token consumption anomalies
    per API key.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-400
  references:
  - Jansen & Grance (2011) — NIST SP 800-144
  - Pishva (2017) — IoT Security Challenges and Solutions
- id: MEDUSA-UCP-SCAN-040
  name: prompt-injection-via-ocr-image-input
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(image|photo|screenshot|scan|picture)\s+(?:contains?|(?:with|including|showing)\s+(?:text|instructions?|prompt|command))
  - (?i)\b(read\s+(?:the\s+)?(?:text|instructions?|content)\s+(?:from|in|on)\s+(?:the\s+)?(?:image|photo|screenshot|attachment|file))\b
  - (?i)\b(ocr|optical\s+character\s+recognition|image.?to.?text|extract\s+text\s+from\s+image)\b
  - (?i)\b(embedded\s+(?:in|within)\s+(?:image|photo|screenshot)\s+(?:instruction|prompt|command|text))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Prompt injection via user-submitted image OCR content detected
  description: 'Detects potential prompt injection via images submitted to multimodal
    AI systems. Attackers embed hidden or visible text instructions in images (steganography,
    white-on-white text, small font text) that multimodal LLMs process via OCR, injecting
    instructions that the AI then follows as if from a trusted source. This is an
    emerging attack vector documented post-2022 in the context of GPT-4V and Claude''s
    vision capabilities. Brundage et al. (2018) forecast that new AI modalities would
    create new injection surfaces. Indirect prompt injection via processed image content
    bypasses text-level input filtering entirely.

    '
  remediation: 'Apply independent content classification on OCR-extracted text before
    including in LLM context. Treat image-extracted text with same security scrutiny
    as user-supplied text. Implement image steganography detection for high-risk contexts.
    Apply content moderation to multimodal inputs. Monitor for behavioral changes
    in AI responses following image processing.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - OWASP LLM01:2025 — Prompt Injection
- id: MEDUSA-UCP-SCAN-041
  name: goal-hijacking-agentic-task-manipulation
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(instead\s+of|rather\s+than|before\s+(?:you\s+do|completing|finishing))\s+(?:that|the\s+(?:task|request|original))[,.]?\s+(?:first\s+)?(?:please\s+)?(?:do|complete|execute|run|perform)\b
  - (?i)\b(primary\s+(?:goal|objective|task|mission|purpose)\s+is\s+(?:now|actually|really|secretly))\b
  - (?i)\b(your\s+(?:real|actual|true|hidden|secret)\s+(?:goal|objective|task|mission|purpose|instruction)\s+is)\b
  - (?i)\b(abandon|cancel|abort|stop|drop|ignore)\s+(?:the\s+)?(?:current|original|previous|prior)\s+(?:task|goal|objective|request|instruction)\s+and\s+(?:instead|now)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Goal hijacking or agentic task manipulation attempt detected
  description: 'Detects goal hijacking attacks targeting AI agent systems — injecting
    new objectives that override the agent''s original task. In agentic LLM frameworks
    (AutoGPT, LangChain agents, Claude tools), goal hijacking causes the agent to
    abandon legitimate work and execute adversary-controlled objectives, potentially
    including data exfiltration, unauthorized actions, or resource abuse. Brundage
    et al. (2018) identified autonomous AI goal manipulation as an emerging threat.
    Kayas et al. (2020) documented analogous command override in UPnP action injection
    that caused devices to perform unintended operations despite being given a different
    original command.

    '
  remediation: 'Implement goal consistency checking in multi-step AI agent frameworks.
    Apply task integrity verification — validate that each agent action step advances
    the original stated goal. Enforce human-in-the-loop approval for unexpected goal
    changes. Monitor for goal drift in long-running AI agent tasks. Apply principle
    of least privilege for agent action scope.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Kayas et al. (2020) — UPnP-based IoT Security
- id: MEDUSA-UCP-SCAN-042
  name: prompt-chaining-multi-step-bypass
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(step\s+[123456789]\s+of\s+\d+|part\s+[123456789]\s+of\s+\d+|phase\s+[123456789])\s*[:\-]\s*(?!.*meeting|.*project|.*plan)
  - (?i)\b(first\s+(?:ask|tell|instruct|get)\s+(?:the\s+)?(?:ai|bot|assistant|llm|model)\s+to\s+)(?!.*help)
  - (?i)\b(jailbreak(?:ing)?|bypass(?:ing)?|circumvent(?:ing)?)\s+(?:the\s+)?(?:ai|llm|model|chatbot|assistant|filter|guardrail|safety)\s+(?:using|via|with|through)\s+(?:multiple|multi.?step|chain|sequential)\b
  - (?i)\b(chain(?:ing)?|sequence|multi.?turn|multi.?step)\s+(?:prompt|attack|injection|bypass|jailbreak)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Multi-step prompt chaining or sequential jailbreak bypass pattern detected
  description: 'Detects multi-step prompt chaining attack patterns where attackers
    decompose a harmful request into multiple individually-innocent steps that collectively
    achieve the restricted goal. Estrella et al. (2021) documented step-by-step escalation
    as outperforming single-step attacks in scam design, which directly maps to multi-turn
    LLM jailbreaking. Acquisti et al. (2017) identified commitment escalation as exploiting
    cognitive commitment bias — each successful step creates psychological (and in
    LLMs, contextual) commitment to the next. Research shows that multi-turn prompt
    chaining achieves high success rates against models resistant to single-turn attacks.

    '
  remediation: 'Implement cross-turn risk accumulation scoring in conversation state.
    Apply holistic conversation context evaluation rather than per-turn evaluation.
    Monitor for step-by-step construction of sensitive topics across conversation
    turns. Enforce context-aware content policies that consider the full conversation
    arc. Apply session-level rate limiting on safety-sensitive topic engagement.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
  - Acquisti et al. (2017) — Nudges for Privacy and Security
- id: MEDUSA-UCP-SCAN-043
  name: privilege-escalation-via-tool-call-injection
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b(call|invoke|execute|use|run)\s+(?:the\s+)?(?:admin|privileged|elevated|internal|system|root|superuser)\s+(?:tool|function|api|endpoint|command|action)\b
  - (?i)\b(with\s+(?:admin|elevated|privileged|root|system)\s+(?:permissions?|privileges?|access|rights?|capabilities))\b
  - (?i)\b(escalate|elevate|upgrade|promote)\s+(?:my|this|the\s+current)\s+(?:permissions?|privileges?|access\s+level|role)\b
  - (?i)\b(use\s+(?:sudo|su|runas|doas)\s+(?:to|and)|with\s+(?:sudo|root|administrator)\s+(?:privileges?|access|rights?))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'CRITICAL: Privilege escalation via tool call injection in AI agent detected'
  description: 'Detects privilege escalation attempts via AI agent tool call injection
    — users requesting the AI agent invoke privileged tools, admin APIs, or elevated-permission
    functions beyond their authorization scope. In LLM function-calling frameworks,
    privilege escalation can occur when tool descriptions are manipulated or when
    users falsely claim authorization for privileged tool invocations. Pishva (2017)
    documented unauthorized command execution enabling full device compromise. Kayas
    et al. (2020) documented UPnP action command injection achieving unauthorized
    privileged operations at scale.

    '
  remediation: 'Enforce tool authorization based on cryptographically-verified user
    identity, not on prompt content. Apply permission scoping at the tool registry
    level — each user/session has a fixed set of authorized tools that cannot be expanded
    through conversation. Implement audit logging for all privileged tool invocations.
    Apply separation of duties: privileged tools require out-of-band authorization.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-269
  references:
  - Pishva (2017) — IoT Security Challenges and Solutions
  - Kayas et al. (2020) — UPnP-based IoT Security
- id: MEDUSA-UCP-SCAN-044
  name: training-data-poisoning-via-user-feedback
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(train(?:ing)?|fine.?tun(?:e|ing)|rlhf|reinforcement\s+learning|reward\s+model)\s+(?:on|from|using|with)\s+(?:this|my|user.?(?:provided|supplied)|malicious|adversarial)\s+(?:data|feedback|example|label|response)\b
  - (?i)\b(poison(?:ing)?|corrupt(?:ing)?|manipulate?)\s+(?:the\s+)?(?:training\s+data|model|weights?|fine.?tune|rlhf\s+signal|reward\s+signal|feedback\s+signal)\b
  - (?i)\b(provide\s+(?:incorrect|false|misleading|adversarial)\s+feedback\s+to\s+(?:train|teach|manipulate|bias)\s+(?:the\s+)?(?:model|ai|llm))\b
  - (?i)\b(backdoor|trojan|sleeper\s+(?:agent|attack))\s+(?:in|via|through|using)\s+(?:training|fine.?tuning|rlhf|feedback|data)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Training data poisoning or RLHF manipulation via user feedback detected
  description: 'Detects attempts to poison AI training data or RLHF/feedback signals
    through adversarial user feedback or data injection. When user feedback influences
    model fine-tuning or reward model training, adversaries can systematically provide
    misleading feedback to bias model behavior, implant backdoor triggers, or degrade
    safety properties. Brundage et al. (2018) identified training data poisoning as
    a primary AI security threat. Olteanu et al. (2019) documented how biased data
    systematically corrupts ML model behavior. Sarker et al. (2020) identified adversarial
    data injection as a high-impact ML pipeline attack.

    '
  remediation: 'Implement anomaly detection on user feedback distributions to identify
    coordinated poisoning campaigns. Apply human review for feedback that would significantly
    alter safety-relevant model behaviors. Use diverse, independently-sourced feedback
    datasets. Implement feedback provenance tracking. Apply differential privacy to
    feedback aggregation to limit individual poisoning impact.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-345
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - Olteanu et al. (2019) — Social Data Biases
  - Sarker et al. (2020) — Cybersecurity Data Science
- id: MEDUSA-UCP-SCAN-045
  name: cognitive-bias-framing-attack-llm
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(everyone\s+(?:agrees?|knows?|says?|believes?|thinks?)\s+(?:that|it's\s+(?:ok|acceptable|fine|normal|common)))
  - (?i)\b(most\s+(?:people|experts?|researchers?|users?)\s+(?:would|do|agree|say)\s+(?:that|it's))
  - (?i)\b(it(?:'s|\s+is)\s+(?:well.known|established|common\s+knowledge|widely\s+accepted|widely\s+known)\s+that)\b
  - (?i)\b(since\s+(?:you|the\s+(?:ai|model|assistant))\s+(?:already\s+)?(?:know|agreed|said|confirmed|established)\s+that)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Cognitive bias exploitation framing attack in AI chat detected
  description: 'Detects social engineering framing attacks that exploit cognitive
    biases (bandwagon effect, false consensus, authority appeal, anchoring) in AI
    chat interactions. Acquisti et al. (2017) documented extensive evidence that framing
    effects produce 30-60% variation in security compliance decisions, and that AI
    systems trained on human-generated text inherit these susceptibilities. Attackers
    use false consensus framing ("everyone knows", "most experts agree") to make harmful
    requests seem normalized, and false prior agreement framing ("since you already
    agreed") to anchor the AI to non-existent commitments. Estrella et al. (2021)
    documented social proof manipulation as a core scam design element.

    '
  remediation: 'Train AI systems on adversarial social engineering examples to improve
    resistance to consensus framing. Implement response validation that evaluates
    actual content requested regardless of social framing. Monitor for pattern clusters
    of bias exploitation language in user inputs. Apply constitutional AI constraints
    on false consensus reasoning.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - Acquisti et al. (2017) — Nudges for Privacy and Security
  - 'Estrella et al. (2021) — Scam Design: The Anatomy of Online Products & Services'
- id: MEDUSA-UCP-SCAN-046
  name: indirect-injection-retrieved-web-content
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)\b(search|browse|look\s+up|find|retrieve|fetch)\s+(?:information\s+(?:about|on)|(?:the\s+)?(?:article|page|site|content|result)\s+(?:about|on))\b
  - (?i)\b(rag|retrieval.?augmented|vector\s+(?:store|database|db|search)|semantic\s+search|embedding\s+(?:search|retrieval))\b
  - (?i)\b(retrieved|fetched|found|downloaded)\s+(?:content|document|page|article|result)\s+(?:says?|states?|instructs?|tells?\s+(?:you|the\s+ai)|contains?)\b
  - (?i)\b(based\s+on\s+(?:the\s+)?(?:retrieved|fetched|found|downloaded|searched)\s+(?:document|content|page|result))\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Indirect prompt injection via retrieved web content or RAG pipeline detected
  description: 'Detects indirect prompt injection patterns targeting Retrieval-Augmented
    Generation (RAG) pipelines. Attackers poison web pages, documents, or vector stores
    with embedded injection instructions that the AI retrieves and processes as trusted
    content. When the RAG system injects retrieved content into the LLM context, the
    attacker''s instructions execute with the trust level of the retrieval system.
    Brundage et al. (2018) identified data pipeline manipulation as a primary AI security
    vector. This maps to OWASP LLM01:2025 indirect injection and is particularly insidious
    as the attack originates in external content, not the user''s direct message.

    '
  remediation: 'Apply content trust labeling to all retrieved content — clearly mark
    retrieved documents as untrusted data in the LLM context. Implement RAG content
    sanitization before injection. Apply semantic classification on retrieved content
    to detect injection patterns. Enforce strict separation between retrieved data
    and system instructions in the context window.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - OWASP LLM01:2025 — Prompt Injection
- id: MEDUSA-UCP-SCAN-047
  name: adversarial-suffix-token-injection
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)(\b(sure|absolutely|certainly|of\s+course|yes)\b.*\b(here\s+is|here's|here\s+are|here\s+you\s+go)\b)
  - (?i)([:!\]\)]{3,}\s*(?:here\s+is|sure|yes|absolutely|ok|okay))
  - (?i)([\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f].*[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f])
  - (?i)(\b(Assistant|Human|User|System|\[INST\]|\[/INST\]|<\|im_start\|>|<\|im_end\|>|\[SYS\])\s*:)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Adversarial suffix, token injection, or chat template injection detected
  description: 'Detects adversarial suffix attacks and chat template injection patterns.
    Adversarial suffixes (strings of special tokens or punctuation) exploit model
    tokenization vulnerabilities to reliably elicit harmful completions. Chat template
    injection uses special tokens from model training (e.g., [INST], <|im_start|>,
    [SYS]) to inject artificial conversation turns or override role boundaries. Pre-filled
    assistant response injection ("Sure, here is") anchors the model to begin with
    a compliant response, bypassing refusal behavior. Sarker et al. (2020) identified
    adversarial input crafting as a primary ML security threat.

    '
  remediation: 'Filter control characters and special tokens from user inputs before
    LLM processing. Block chat template special tokens in user-supplied content. Apply
    input normalization to strip adversarial suffix patterns. Never pre-fill assistant
    responses with user-supplied content. Implement tokenization-aware input validation.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
  references:
  - Sarker et al. (2020) — Cybersecurity Data Science
  - OWASP LLM01:2025 — Prompt Injection
