  - (?i)\b(complete\s+the\s+following|fill\s+in\s+the\s+blank)\s*[:\-]?\s*(my\s+instructions?\s+(?:say|are|state|tell\s+me))
  - (?i)\b(what\s+(?:word|phrase|text|token|string)\s+(?:comes|appears)\s+(?:first|after|before|at\s+the\s+(?:start|beginning|end))\s+(?:in\s+your|of\s+your|of\s+the)\s+(?:prompt|instructions?|system))\b
  file_types:
