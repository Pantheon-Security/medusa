  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.txt'
  - '*.md'
  message: 'CRITICAL: Direct prompt injection override attempt detected in user input'
  description: 'Detects explicit direct prompt injection attempts where a user-supplied
    input attempts to override the AI system''s instructions, rules, or constraints.
    Direct prompt injection is the primary attack vector in OWASP LLM01:2025 (Prompt
    Injection). Brundage et al. (2018) identified instruction override as the enabling
    mechanism for chatbot weaponization. Attackers use explicit instruction override
    language to cause the AI to abandon safety constraints, ignore operator-defined
    behavior, and execute arbitrary adversary-controlled instructions. Double-bracket
    injection markers (e.g., [[system]]) are used to mimic internal formatting in
    some LLM frameworks.

    '
  remediation: 'Implement instruction hierarchy enforcement separating system, operator,
    and user instruction layers. Apply NLP classifiers to detect override framing
    in user inputs. Enforce prompt injection resistance through constitutional AI
    training. Apply input sanitization to strip injection markers. Monitor for instruction
    override patterns across all user input fields. Implement OWASP LLM01:2025 controls.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
  references:
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
  - OWASP LLM01:2025 — Prompt Injection
