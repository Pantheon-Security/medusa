  - (?i)\b(third.?party|untrusted|external|unknown)\s+(?:plugin|extension|tool|module|package|agent)\s+(?:with\s+(?:access|permission|capability)|that\s+can)\b
  - (?i)\b(plugin|tool|extension|agent)\s+(?:manifest|config|schema|definition)\s*[=:"'\s]*(?:https?://|\{)\b
  - (?i)\b(supply\s+chain|dependency\s+(?:confusion|hijack|poison)|malicious\s+(?:plugin|package|tool))\b
  file_types:
