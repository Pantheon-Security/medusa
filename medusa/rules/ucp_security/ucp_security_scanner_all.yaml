  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.txt'
  - '*.md'
  message: Roleplay or fiction framing used as jailbreak vector detected
  description: 'Detects use of roleplay, fiction, or hypothetical framing as a jailbreak
    vector — a common technique where attackers wrap harmful requests in creative
    writing or fictional scenarios to bypass AI safety constraints. Wynsberghe & Robbins
    (2018) analyzed how AI moral agency gaps are exploitable through scenario framing.
    Brundage et al. (2018) identified narrative framing as a social engineering technique
    enabling AI misuse. The fictional frame provides plausible deniability while extracting
    the same harmful content the AI would refuse if asked directly.

    '
  remediation: 'Implement semantic intent classification that evaluates the actual
    content being requested, independent of fictional framing. Apply content-level
    filtering that detects harmful information in fictional outputs. Enforce consistent
    content policies regardless of narrative context. Monitor for escalating specificity
    in fictional requests as a signal of extraction intent.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - Wynsberghe & Robbins (2018) — Critiquing the Reasons for Making Artificial Moral
    Agents
  - Brundage et al. (2018) — The Malicious Use of Artificial Intelligence
- id: MEDUSA-UCP-SCAN-024
  name: template-injection-user-format-string
  severity: HIGH
  category: ucp_security
  patterns:
  - (?i)(\{\{\s*\w+\s*\}\}|\{%\s*\w+\s*%\}|\$\{\s*\w+\s*\})
  - (?i)(\{\{\s*(config|settings?|env|environ|os\.environ|request|session|app))
  - (?i)(<%[=\-]?\s*(eval|exec|system|os\.|import|require))
  - (?i)(\{\{\s*(__class__|__mro__|__subclasses__|__globals__|__builtins__))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.html'
  - '*.jinja'
  - '*.j2'
  - '*.txt'
  message: Server-side template injection via user-supplied format string detected
  description: 'Detects server-side template injection (SSTI) patterns in user-supplied
    inputs that may be rendered by template engines (Jinja2, Twig, Pebble, etc.) or
    interpolated into LLM prompts. When user input containing template syntax is injected
    into prompt templates without sanitization, template engine execution can achieve
    RCE. In LLM contexts, template injection can exfiltrate system prompts, environment
    variables, or configuration data. Sarker et al. (2020) identified injection attacks
    as a primary ML pipeline threat. Python dunder attribute access (__class__, __globals__)
    is a classic SSTI escalation path.

    '
  remediation: 'Sanitize user inputs before template interpolation — never pass raw
    user input to template engines. Use sandboxed template environments (Jinja2 SandboxedEnvironment).
    Apply allowlisting for template variables accessible in user-controlled contexts.
    Audit all prompt template construction for unsanitized user input injection. Apply
    output encoding for all user-supplied strings in template contexts.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-94
  references:
  - Sarker et al. (2020) — Cybersecurity Data Science
  - OWASP LLM01:2025 — Prompt Injection
