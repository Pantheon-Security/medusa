  name: social-engineering-persona-construction
  severity: MEDIUM
  category: ucp_security
  patterns:
  - (?i)\b(create|build|construct|design|develop)\s+(?:a\s+)?(?:fake|false|synthetic|believable|convincing)\s+(persona|profile|identity|character|backstory|legend)\b
  - (?i)\b(backstory|legend|cover\s+story|fake\s+(?:bio|biography|history|profile))\s+(?:for|to\s+use|to\s+convince|to\s+deceive)\b
  - (?i)\b(generate|write|create)\s+(?:a\s+)?(?:realistic|authentic.?looking|convincing)\s+(?:fake\s+)?(?:linkedin|twitter|facebook|instagram|social\s+media)\s+(?:profile|bio|account)\b
  - (?i)\b(social\s+proof|fake\s+review|astroturf|manufactured\s+(consensus|endorsement|credibility))\b
  file_types:
