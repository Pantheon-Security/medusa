  message: AI content provenance bypass or watermark removal pattern detected
  description: 'Detects attempts to bypass AI content detection systems or strip provenance
    signals from AI-generated content. Brundage et al. (2018) recommended provenance
    and authenticity signals (watermarking, behavioral fingerprinting) as key defenses
    against AI-generated social engineering and influence operations, and explicitly
    noted that adversaries would attempt to strip or bypass these signals. This pattern
    is particularly relevant when AI-generated phishing, social engineering, or manipulation
    content is processed to evade detection before deployment.

    '
  remediation: 'Implement multi-layer content attribution (cryptographic watermarking
    + behavioral fingerprinting). Apply robust watermarking schemes resistant to paraphrasing
    attacks. Monitor for watermark removal requests. Enforce disclosure requirements
    for AI-generated content in high-risk contexts. Apply C2PA (Content Credentials)
    or similar provenance standards.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-345
  references:
