  message: AI chatbot privacy violation or unauthorized PII disclosure pattern detected
  description: 'Detects attempts to extract personally identifiable information or
    other users'' data from AI chat systems. Olteanu et al. (2019) documented how
    AI systems trained on social data can expose private information through conversational
    probing. Jansen & Grance (2011) identified PII protection in shared cloud services
    as a primary security requirement. In AI chat systems, privacy attacks include
    extracting memorized training data, accessing conversation histories of other
    users, or leveraging the AI''s knowledge of a user to profile them without consent.
    Maps to OWASP LLM02:2025 (Sensitive Information Disclosure).

    '
  remediation: 'Implement strict access controls ensuring users can only query their
    own conversation data. Apply differential privacy techniques to prevent membership
    inference on training data. Enforce data minimization — AI systems should not
    retain PII beyond session duration unless explicitly authorized. Apply output
    filtering to detect and block PII disclosure in AI responses. Implement right-to-be-forgotten
    mechanisms for AI memory systems.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-359
  references:
  - Olteanu et al. (2019) — Social Data Biases, Methodological Pitfalls, and Ethical
    Boundaries
  - Jansen & Grance (2011) — NIST SP 800-144
  - Dwivedi et al. (2019) — AI Multidisciplinary Perspectives
- id: MEDUSA-UCP-SCAN-021
  name: direct-prompt-injection-override-attempt
  severity: CRITICAL
  category: ucp_security
  patterns:
  - (?i)\b(disregard|forget|ignore|override|supersede)\s+(all\s+)?(previous|prior|earlier|above|your)\s+(instructions?|rules?|constraints?|guidelines?|directions?|prompts?)\b
  - (?i)\b(new\s+instructions?|updated\s+instructions?|revised\s+instructions?)\s*[:\-]
  - (?i)\b(you\s+must\s+now|from\s+this\s+point|starting\s+now|as\s+of\s+now)\s+(ignore|disregard|forget|override)\b
  - (?i)\[\[\s*(system|instruction|prompt|override|command)\s*\]\]
