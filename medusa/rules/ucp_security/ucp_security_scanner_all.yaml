  - (?i)\b(process\s+(?:the\s+)?(?:user.?(?:provided|supplied|uploaded)|attached|submitted)\s+(?:file|document|content|data)\s+(?:and|then)\s+(?:also|additionally))\b
  - (?i)\b(file\s+(?:contents?|content)\s+(?:override|replace|change|modify|update)\s+(?:your\s+)?(?:instructions?|behavior|rules?|guidelines?|system\s+prompt))\b
