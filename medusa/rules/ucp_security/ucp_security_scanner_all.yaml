  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: Chat protocol command injection or tool call hijacking pattern detected
  description: 'Detects command injection patterns in AI chat systems, particularly
    relevant to LLM tool-use frameworks and agentic AI systems where chat inputs can
    trigger system calls. Kayas et al. (2020) documented UPnP action command injection
    (exploiting unauthorized action requests to execute device commands) as a systematic
    vulnerability in protocol-based systems — the same architectural pattern applies
    to AI chat function calling APIs where malicious inputs can trigger unintended
    tool invocations. The Mirai botnet''s 17M+ device exploitation (Pishva 2017) demonstrates
    the scale of protocol command injection at the infrastructure level.

    '
  remediation: 'Implement strict input validation for all tool call parameters in
    LLM agentic systems. Apply allowlisting for permissible tool invocations per session
    context. Enforce least-privilege tool access — chatbot agents should only invoke
    tools explicitly authorized for the current conversation context. Apply sandboxing
    for tool execution environments. Monitor tool call patterns for anomalies.

    '
