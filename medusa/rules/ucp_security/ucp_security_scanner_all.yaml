  - '*.md'
  message: System prompt leakage probe via indirect extraction technique detected
  description: 'Detects indirect system prompt extraction techniques that avoid direct
    "repeat your instructions" requests (already covered in SCAN-011). These advanced
    probes use encoding/translation requests, word-completion tasks, first-word extraction,
    and obfuscated retrieval to leak system prompt content character by character
    or token by token. Maps directly to OWASP LLM07:2025 (System Prompt Leakage).
    Brundage et al. (2018) identified system prompt extraction as a precursor to effective
    jailbreaking — knowing the system prompt allows attackers to craft targeted bypasses.

    '
  remediation: 'Implement semantic classifiers for system prompt extraction attempts,
    not just keyword matching. Enforce system prompt non-disclosure even under translation/encoding
    requests. Apply output monitoring to detect if responses contain system prompt
    fragments. Use cryptographic commitment to system prompt content for integrity
    verification.

    '
