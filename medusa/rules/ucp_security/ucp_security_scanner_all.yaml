  - (?i)\b((?:previous|other|past|another)\s+(?:user|customer|person)'s?\s+(?:data|information|conversation|history))\b
  - (?i)\b((?:access|retrieve|dump|export)\s+(?:user\s+)?(?:pii|personal\s+(?:data|information)|private\s+(?:data|information)))\b
  - (?i)\b(what\s+(?:did|do)\s+(?:you|the\s+(?:ai|bot|system))\s+(?:store|remember|know|have)\s+about\s+(?:me|user|them))\b
