  category: ucp_security
  patterns:
  - (?i)\b(summarize|analyze|read|process|extract\s+from|review)\s+(this\s+)?(document|file|url|link|page|pdf|text)\b
  - (?i)\b(when\s+(?:you|the\s+(?:ai|assistant|bot))\s+(?:reads?|processes?|analyzes?)\s+this)\b
  - (?i)(<!--|/\*|#)\s*(ignore|disregard|override|new\s+instructions?|forget\s+previous)
  - (?i)\b(hidden\s+(instruction|prompt|command|directive)|invisible\s+(text|instruction|prompt))\b
  file_types:
