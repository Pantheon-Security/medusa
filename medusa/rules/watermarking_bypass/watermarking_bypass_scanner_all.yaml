    AI (Stable Diffusion, DALL-E, Midjourney, Imagen) creates semantic paraphrases
    of watermarked AI images — outputs visually and semantically similar but with
    invisible frequency-domain watermarks destroyed. This attack is motivated by California
    AB 3211 and EU AI Act requirements for AI-generated image watermarking; bypass
    undermines regulatory compliance across all mandated jurisdictions.

    '
  remediation: 'Deploy PECCAVI NMP-aware watermarking which embeds signals in semantically
    stable core image regions (Non-Melting Points) that remain consistent across visual
