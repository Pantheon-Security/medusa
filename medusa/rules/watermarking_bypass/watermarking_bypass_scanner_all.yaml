    al. (2025). After knowledge distillation, the student model''s outputs may retain
    inherited watermarks from the teacher. WN applies inference-time output modification
    to eliminate these residual signals — modifying sampling behavior or applying
    post-hoc token substitution to counteract the watermark''s token frequency bias.
    WN thoroughly eliminates inherited watermarks while maintaining knowledge transfer
    efficiency with minimal computational overhead, making it the most practical of
    the three attack variants (UP, TP, WN).

    '
  remediation: 'Monitor student model outputs for sudden watermark signal disappearance
    after initially showing inherited signals. Implement behavioral capability fingerprinting
    independent of watermarks. Require watermark presence verification at both training
    time and deployment.

    '
