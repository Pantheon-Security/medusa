  file_types:
  - '*.py'
  - '*.json'
  - '*.ipynb'
  message: Synonym substitution pipeline that may remove token-level LLM watermarks
  description: 'Identifies synonym substitution watermark removal attacks. Liu et
    al. (2024) evaluated synonym substitution as one of 12 attacks in 87 scenarios,
    finding it effective against KGW and Exponential watermarks. Liang et al. (2024)
    confirmed token substitution among the most practical attacks across 10 watermarkers.
    DeepTextMark (Munyer et al. 2024) specifically designs against robustness to word
    substitution using Word2Vec-guided semantic equivalence checking during detection.

    '
  remediation: 'Use semantic embedding-based detection (DeepTextMark) in addition
    to statistical tests. Deploy WaterMax (Giboulot & Furon 2024) which leaves LLM
    untouched and does not rely solely on token-level statistics. Combine multiple
