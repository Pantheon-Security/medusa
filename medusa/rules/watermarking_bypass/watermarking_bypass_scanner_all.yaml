    disrupting the hash-derived green/red list patterns for all affected tokens. GA
    operates under limited black-box query budget.

    '
  remediation: 'Implement Unicode normalization and character canonicalization as
    preprocessing before watermark detection. Apply spell-checking and character artifact
    detection. Note that Zhang et al. demonstrate fixed defenses create adversarial
    dilemmas — layered normalization with randomization is required to prevent exploitation
    of normalization artifacts themselves.

    '
