  - (?i)leximark.{0,30}(bypass|remov|evad)
  - (?i)(synonym.substitut|lexical.replac).{0,40}(watermark|training.data)
  file_types:
  - '*.py'
  - '*.json'
  - '*.sh'
  message: Training data processing pattern that may remove dataset watermarks
  description: 'Identifies dataset watermark removal in training pipelines. German
    et al. (2025) LexiMark embeds synonym substitutions in high-entropy training data
    words to enable membership verification of unauthorized LLM training. Pan et al.
    (2025) showed that targeted paraphrasing (TP) of training data before distillation
    thoroughly eliminates inherited watermarks. Dataset watermark removal undermines
    training data provenance tracking and copyright enforcement.

    '
  remediation: 'Implement LexiMark-style stealth watermarking with contextually appropriate
    substitutions resistant to automated detection and removal. Use multi-signal dataset
    fingerprinting beyond lexical substitution. Combine with model behavioral fingerprinting
    for redundant provenance tracking.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-WB-SCAN-014
  name: ai-detector-api-probing
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(gptzero|turnitin|openai.classifier).{0,40}(api|bypass|evad|score)
  - (?i)detector.{0,30}(feedback|guided|oracle).{0,30}(paraphras|evad|attack)
  - (?i)(true.positive.rate|tpr|false.positive.rate).{0,40}(reduc|evad|bypass)
  - (?i)black.box.{0,20}(detector|classifier).{0,30}(query|probe|attack)
  file_types:
  - '*.py'
  - '*.json'
  - '*.sh'
  message: AI text detector API probing or feedback-guided evasion pattern
  description: 'Detects feedback-guided attacks using AI detector APIs as oracles.
    Cheng et al. (2025) showed adversarial paraphrasing guided by OpenAI-RoBERTa-Large
    reduces T@1%F by 87.88% average across diverse detectors. Huang et al. (2025)
    RLCracker requires zero access to target detector but uses a reference detector
    for RL reward signal. ESPERANTO (Ayoobi et al. 2024) evaluated evasion across
    9 detectors including GPTZero and Turnitin.

    '
  remediation: 'Implement API rate limiting and anomaly detection for high-frequency
    scoring requests. Randomize detector scoring to prevent gradient-free optimization.
    Use ensemble detection with diverse architectures. Log and monitor suspicious
    usage patterns.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-799
- id: MEDUSA-WB-SCAN-015
  name: image-watermark-visual-paraphrase
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(visual.paraphrase|image.paraphrase).{0,40}watermark
  - (?i)(diffusion|stable.diffusion|dall.e).{0,40}(dewatermark|watermark.remov)
  - (?i)(non.melting.point|nmp).{0,30}watermark
  - (?i)(ai.image|synthetic.image).{0,40}(watermark.bypass|dewatermark)
  file_types:
  - '*.py'
  - '*.json'
  - '*.sh'
  message: Generative AI image processing that may remove invisible watermarks
  description: 'Detects visual paraphrase attacks on AI-generated image watermarks.
    Dixit et al. (2025) PECCAVI addressed generative AI-powered de-watermarking where
    diffusion models create semantic paraphrases of watermarked images, destroying
    invisible watermark signals. PECCAVI introduces "Non-Melting Points" (NMPs) —
    semantic core image regions stable under paraphrasing — where watermarks are embedded.
    California AB 3211 mandates watermarking of AI-generated images; bypass undermines
    regulatory compliance.

    '
  remediation: 'Deploy PECCAVI-style NMP-aware watermarking for AI-generated images.
    Use multi-channel frequency domain watermarking embedded in semantically stable
    regions. Implement noisy burnishing to prevent NMP reverse-engineering. Validate
    regulatory compliance requirements under California AB 3211 and EU AI Act.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-016
  name: zero-knowledge-proof-watermark-verification
  severity: LOW
  category: watermarking_bypass
  patterns:
  - (?i)(zero.knowledge.proof|zkp|zk.snark).{0,40}watermark
  - (?i)pvmark.{0,30}(verif|proof|implement)
  - (?i)watermark.{0,30}(public.verif|third.party.verif|transparent.detect)
  - (?i)(secret.key.disclos|key.expos).{0,40}watermark.detect
  file_types:
  - '*.py'
  - '*.rs'
  - '*.circom'
  - '*.json'
  message: ZKP-based watermark verification or key disclosure pattern
  description: 'Flags patterns related to watermark key disclosure vulnerabilities
    or ZKP-based verification systems. Duan et al. (2025) PVMark addresses the trust
    dilemma: revealing the secret key for third-party verification enables attackers
    to remove watermarks; keeping it private makes detection legally unverifiable.
    ZKP enables public verifiability without key disclosure across Python/Rust/Circom
    implementations. Key disclosure in legal/audit contexts creates immediate watermark
    removal vulnerability.

    '
  remediation: 'Deploy PVMark ZKP plugin for public verifiability without key disclosure.
    Never expose watermark detection keys in legal proceedings without ZKP-mediated
    proofs. Implement key rotation after any forced disclosure. Use public-key watermarking
    schemes.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-321
- id: MEDUSA-WB-SCAN-017
  name: synonym-substitution-watermark-removal
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(synonym.substit|word.replac).{0,40}(watermark|ai.generat|detect)
  - (?i)(wordnet|thesaurus).{0,40}(watermark|remov|bypass)
  - (?i)token.{0,20}(substit|swap|replac).{0,30}(watermark|green.list)
