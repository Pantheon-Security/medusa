rules:
- id: MEDUSA-WB-SCAN-001
  name: green-list-token-manipulation
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)green.{0,20}(list|token).{0,30}(steal|extract|recover|bypass)
  - (?i)(kirchenbauer|kgw).{0,40}(remov|bypass|attack|evad)
  - (?i)watermark.{0,30}(green|red).{0,20}(token|list).{0,30}(manipulat|alter|replac)
  - (?i)logit.{0,20}(bias|modif|pertub).{0,30}watermark
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.ipynb'
  message: Code or data referencing KGW green-list manipulation or token-level watermark
    bypass
  description: 'Detects patterns associated with Kirchenbauer (KGW) green-token watermark
    attacks. Zhang et al. (2024) demonstrated 100% watermark removal via Mixed Integer
    Programming to recover the secret green/red token list from observed watermarked
    samples, operating with zero prior knowledge. Liang et al. (2024) WATERPARK benchmark
    identified token substitution and synonym replacement as effective against KGW
    on 10 watermarker variants.

    '
  remediation: 'Rotate watermark keys frequently. Use multi-key or public-key watermarking
    schemes. Deploy Bileve (Zhou et al. 2024) or PVMark (Duan et al. 2025) for verifiable
    detection. Monitor for statistical anomalies suggesting green-list inference.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-002
  name: paraphrase-watermark-removal
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)(paraphras|rewrite|rephrase).{0,50}(watermark|ai.generat|detect)
  - (?i)(dipper|pegasus|t5).{0,40}(watermark|remov|evad|bypass)
  - (?i)adversarial.{0,20}paraphras.{0,40}(humaniz|evas|detect)
  - (?i)neural.{0,20}paraphras.{0,40}(watermark|aigc|ai.text)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.json'
  - '*.ipynb'
  message: Neural paraphrasing pipeline detected that may be used for watermark removal
  description: 'Identifies paraphrasing-based watermark removal attacks. Cheng et
    al. (2025) demonstrated adversarial paraphrasing reduces T@1%F by an average 87.88%
    across diverse detectors (64.49% on RADAR, 98.96% on Fast-DetectGPT) using a training-free
    attack guided by detector feedback. Liang et al. (2024) found DIPPER neural paraphrasing
    the most effective of 12 attacks against 10 watermarkers. Simple paraphrasing
    can paradoxically increase detection rates; adversarially guided iteration is
    required for reliable evasion.

    '
  remediation: 'Deploy watermarks robust to paraphrasing (REMARK-LLM, WaterMax). Use
    semantic-aware watermarking (An et al. 2025) that ties watermark to content semantics.
    Monitor for repeated submission of semantically similar but textually different
    content.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-003
  name: back-translation-detection-evasion
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)back.{0,10}translat.{0,40}(detect|watermark|evad|bypass)
  - (?i)(pivot.{0,10}language|multi.{0,10}language).{0,40}(watermark|detect|evad)
  - (?i)translat.{0,30}(chain|loop|pipeline).{0,40}(ai.text|watermark)
  - (?i)cross.{0,20}lingual.{0,30}(watermark|detect|bypass|remov)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.json'
  message: Multi-language translation chain that may be used for AI detection evasion
  description: 'Detects back-translation and cross-lingual watermark removal attacks.
    Ayoobi et al. (2024) ESPERANTO demonstrated back-translation through multiple
    languages significantly reduces true positive rates of all 9 tested detectors
    (6 open-source, 3 proprietary including GPTZero and Turnitin). He et al. (2024)
    proposed the Cross-lingual Watermark Removal Attack (CWRA) reducing AUC to random-guessing
    (0.5) without quality loss by obtaining LLM output in a pivot language then translating
    to the target language.

    '
  remediation: 'Implement X-SIR cross-lingual watermarking (He et al. 2024) or ESPERANTO
    countermeasure (1.85% TPR decline under back-translation). Deploy language-invariant
    watermark features. Flag submissions that show signs of machine translation artifacts.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-004
  name: watermark-spoofing-attribution-forgery
  severity: CRITICAL
  category: watermarking_bypass
  patterns:
  - (?i)(spoof|forg).{0,30}watermark
  - (?i)watermark.{0,30}(spoof|forg|fake|falsif)
  - (?i)(piggyback|framing).{0,40}(watermark|llm|attribution)
  - (?i)(inject|insert).{0,30}watermark.{0,30}(human|innocent|external)
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: Watermark spoofing or attribution forgery attempt detected
  description: 'Identifies attempts to spoof LLM watermarks — forging watermark patterns
    into human-written or third-party content to falsely attribute it to an LLM provider,
    or to damage provider reputation by embedding watermarks in harmful content. Zhou
    et al. (2024) Bileve identified symmetric key exploitation and piggyback attacks
    as critical threats; An et al. (2025) demonstrated sentiment reversal and toxic
    content insertion attacks that preserve watermark signal while changing content
    meaning. This is an OWASP LLM04 data poisoning vector when used to corrupt LLM
    output attribution.

    '
  remediation: 'Deploy Bileve bi-level signature scheme (Zhou et al. 2024) differentiating
    5 detection scenarios including valid/spoofed/forged content. Use An et al. (2025)
    contrastive semantic-aware watermarking. Implement integrity verification on all
    watermarked outputs before publishing or legal attribution.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-290
- id: MEDUSA-WB-SCAN-005
  name: character-level-watermark-disruption
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)(homoglyph|unicode.substit|lookalike.char).{0,40}(watermark|detect)
  - (?i)character.{0,20}(perturb|substit|swap|typo).{0,30}watermark
  - (?i)(zero.width|invisible.char|unicode.escape).{0,40}(watermark|detect)
  - (?i)tokeniz.{0,30}(disrupt|manipulat|attack).{0,30}watermark
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: Character-level perturbation that may be used to disrupt LLM watermark
    tokenization
  description: 'Detects character-level attacks on LLM watermarks. Zhang et al. (2025)
    demonstrated that character-level perturbations (typos, swaps, deletions, homoglyphs)
    are significantly more effective than token-level attacks because a single character
    change can disrupt multiple tokens simultaneously by corrupting the tokenization
    process, affecting the green/red list assignment chain. The Genetic Algorithm
    guided attack achieves strong removal with limited black-box detector queries.
    Creo (2025) PDFuzz exploits PDF character ordering to achieve 100% evasion (93.6%->50.4%
    accuracy) without any textual modification.

    '
  remediation: 'Implement Unicode normalization and character canonicalization before
    watermark detection. Use rendering-based (OCR) text extraction for PDF inputs
    rather than stream-order extraction. Apply spell-checking preprocessing. Note:
    Zhang et al. show fixed defenses create adversarial dilemmas; layered normalization
    required.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-116
- id: MEDUSA-WB-SCAN-006
  name: rl-adaptive-watermark-removal
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)reinforcement.{0,20}learn.{0,40}(watermark|remov|evad)
  - (?i)(rlcracker|rl.attack|rl.based).{0,40}(watermark|paraphras)
  - (?i)(reward.signal|policy.gradient).{0,40}(watermark|detect|evad)
  - (?i)adaptive.{0,20}(robustness|attack).{0,30}watermark
  file_types:
  - '*.py'
  - '*.json'
  - '*.ipynb'
  message: Reinforcement learning framework that may be an adaptive watermark removal
    attack
  description: 'Detects RL-based adaptive watermark removal. Huang et al. (2025) RLCracker
    achieves 98.5% watermark removal on Unigram-marked texts with 0.92 P-SP semantic
    similarity, training a 3B model on only 100 short samples with zero target detector
    access. This massively outperforms GPT-4o (6.75% removal). Generalizes across
    5 model sizes and 10 watermarking schemes. Introduces "adaptive robustness radius"
    metric proving current watermarks have fundamentally low worst-case security.

    '
  remediation: 'Current watermarks cannot resist adaptive RL attacks. Develop watermarks
    with provably high adaptive robustness radius. Implement semantic similarity thresholds
    to flag high-volume rewriting of the same content. Monitor for pattern of small
    iterative changes.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-007
  name: knowledge-distillation-watermark-bypass
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)(knowledge.distill|student.model).{0,50}(watermark|remov|bypass)
  - (?i)watermark.{0,30}(radioact|inherit|propagat).{0,30}(remov|bypass|neutraliz)
  - (?i)(distillation|fine.tun).{0,40}watermark.{0,30}(evad|strip|remov)
  - (?i)watermark.{0,30}neutraliz.{0,30}(infer|output|generat)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.sh'
  message: Pattern suggesting watermark removal in knowledge distillation pipeline
  description: 'Identifies attempts to bypass watermark inheritance in knowledge distillation.
    Pan et al. (2025) demonstrated that both targeted paraphrasing (TP) of training
    data and inference-time watermark neutralization (WN) thoroughly eliminate inherited
    watermarks in student models. WN achieves this while maintaining knowledge transfer
    efficiency with low overhead — directly undermining OpenAI, Anthropic, and Meta
    ToS prohibitions on unauthorized distillation from their watermarked outputs.

    '
  remediation: 'Current watermark radioactivity is insufficient to prevent unauthorized
    distillation. Combine watermarking with behavioral fingerprinting and model capability
    monitoring. Implement rate limiting and output diversity requirements. Legal enforcement
    required alongside technical controls.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-WB-SCAN-008
  name: ai-text-detection-self-disguise
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)self.disguise.{0,40}(llm|aigt|detect|generat)
  - (?i)(disguise.feature|human.like.generat).{0,40}detect
  - (?i)(adversarial.feature|retrieval.context).{0,40}(ai.text|generat.detect)
  - (?i)prompt.{0,30}(disguise|humanize|evade.detect).{0,30}(llm|ai)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: Prompt engineering designed to make LLM output evade AI text detection
  description: 'Detects generation-time self-disguise attacks. Zhou et al. (2025)
    SDA uses an adversarial feature extractor to generate "disguise features" representing
    human-authorship patterns, combined with retrieval-based context optimization,
    to guide LLM generation of detection-resistant text in a single pass — no post-hoc
    modification required. Reduces average AIGT detection accuracy across multiple
    detectors while maintaining text quality, at much lower compute cost than paraphrasing-based
    methods.

    '
  remediation: 'Train detectors on SDA-generated adversarial examples. Deploy ensemble
    detection (multiple independent detectors). Use watermark-based detection resistant
    to generation-time manipulation. Implement behavioral profiling of LLM API usage
    patterns.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-009
  name: pdf-text-extraction-manipulation
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)pdf.{0,30}(text.order|extract.order|character.posit).{0,30}(attack|manipulat)
  - (?i)(pdffuzz|pdf.scrambl|character.reorder).{0,30}(detect|watermark)
  - (?i)pdf.{0,30}(visual.fidelit|render.order).{0,40}(evad|bypass|attack)
  - (?i)(stream.order|extraction.sequen).{0,30}(manipulat|scrambl|shuffle)
  file_types:
  - '*.py'
  - '*.pdf'
  - '*.json'
  message: PDF character ordering manipulation that may evade AI text detection
  description: 'Detects PDFuzz-style attacks exploiting the discrepancy between PDF
    visual rendering and text extraction order. Creo (2025) demonstrated complete
    evasion of ArguGPT (93.6% -> 50.4% accuracy, F1 0.938 -> 0.0) by manipulating
    character positioning metadata to scramble extraction sequences while maintaining
    perfect visual fidelity. Zero text modification, inherent to PDF format structure,
    affecting any AI detector relying on standard PDF text extraction pipelines.

    '
  remediation: 'Replace stream-order PDF extraction with OCR-based rendering (render
    PDF to image, then OCR). Cross-validate visual and extracted text representations.
    Implement PDF stream-order anomaly detection. Use PDF/A compliant document validation.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-20
- id: MEDUSA-WB-SCAN-010
  name: code-watermark-comment-removal
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(strip|remov|delet).{0,20}comment.{0,30}(watermark|code.generat|llm)
  - (?i)(ast.transform|code.refactor).{0,40}(watermark|detect)
  - (?i)comment.removal.{0,30}(ewd|sweet|watermark)
  - (?i)(variable.renam|code.normaliz).{0,30}(watermark|generat.detect)
  file_types:
  - '*.py'
  - '*.js'
  - '*.java'
  - '*.sh'
  message: Code transformation that may remove watermarks from LLM-generated code
  description: 'Identifies comment removal and code normalization attacks on code
    watermarks. Lin et al. (2025) CODE ACROSTIC demonstrated that removing comments
    from LLM-generated code reduces True Positive Rate of EWD and SWEET watermarking
    to near-zero, since these schemes embed signals in code comments. This is a trivial
    attack (no functional change to code). Most code watermarks fail against simple
    comment stripping; CODE ACROSTIC addresses this by watermarking high-entropy code
    regions.

    '
  remediation: 'Deploy CODE ACROSTIC (Lin et al. 2025) which embeds watermarks in
    high-entropy code regions (variable names, logic branches) rather than comments.
    Combine multiple watermarking strategies. Detect suspicious patterns of comment-free
    code submissions.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-011
  name: copy-paste-watermark-dilution
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(copy.paste|text.inject|mix.watermark).{0,40}(human|dilut|threshold)
  - (?i)(watermark.dilut|signal.dilut).{0,40}(below|threshold|detect)
  - (?i)interleav.{0,20}(human|unwatermark).{0,30}watermark
  - (?i)(insert|splice).{0,20}human.text.{0,30}watermark
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: Text mixing pattern that may dilute watermark signal below detection threshold
  description: 'Detects copy-paste watermark dilution attacks. Liang et al. (2024)
    WaterPark found copy-paste attacks effective at low (20-30%) human text injection
    ratios, diluting the statistical green-token proportion below detection z-score
    thresholds. This is particularly effective against z-score based detection (KGW,
    Unigram) where the detection threshold requires a minimum proportion of green
    tokens.

    '
  remediation: 'Use sequence-level rather than document-level watermark detection.
    Implement sliding window detection. Deploy distortion-free watermarks (WaterMax,
    EWD) with higher per-token signal-to-noise ratios. Set conservative detection
    thresholds calibrated for partial watermark presence.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-693
- id: MEDUSA-WB-SCAN-012
  name: watermark-green-list-statistical-recovery
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)(mixed.integer|mip).{0,30}(watermark|green.list|token.list)
  - (?i)(recover|reconstruct).{0,30}(green.list|red.list|token.partition)
  - (?i)watermark.key.{0,30}(steal|extract|recover|infer)
  - (?i)(statistical.analys|frequency.analys).{0,40}(watermark|green.token)
  file_types:
  - '*.py'
  - '*.json'
  - '*.ipynb'
  message: Statistical analysis of watermarked outputs suggesting green-list recovery
    attack
  description: 'Detects watermark key or green-list stealing attacks. Zhang et al.
    (2024) formalized green-list stealing as a Mixed Integer Programming problem,
    achieving 100% watermark removal on OPT and LLaMA under an extreme threat model
    (no prior knowledge, no detector API, no LLM parameter knowledge). Single-key
    KGW variants most vulnerable; requires only statistical observation of sufficient
    watermarked text samples.

    '
  remediation: 'Use multi-key watermarking with large key spaces. Implement public-key
    watermarking (PVMark, Duan et al. 2025) where the detection key cannot be inferred
    from generation. Rotate keys. Limit public access to watermark detector API. Monitor
    for high-volume sampling of watermarked outputs suggesting statistical recovery.

    '
  owasp_llm: LLM09:2025
  cwe: CWE-330
- id: MEDUSA-WB-SCAN-013
  name: training-data-watermark-removal
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)(training.data|dataset).{0,40}(watermark.remov|dewatermark)
