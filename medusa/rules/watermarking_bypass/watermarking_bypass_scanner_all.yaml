    locations used by PECCAVI (Dixit et al. 2025) for watermark embedding. PECCAVI
    uses noisy burnishing specifically to prevent NMP identification. If an attacker
    identifies stable image regions (NMPs) that survive diffusion-based paraphrasing,
    they can target those specific frequency-domain regions for selective watermark
    removal while leaving the rest of the image intact. This is an adaptive attack
    against PECCAVI''s defense mechanism itself.

    '
  remediation: 'Ensure noisy burnishing parameters are sufficiently randomized to
