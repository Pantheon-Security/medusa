    with minimal character edits
  description: 'Identifies tokenization boundary exploitation attacks (Zhang et al.
    2025). LLM tokenizers (BPE/byte-pair encoding) merge character sequences into
    tokens greedily; a character inserted at a token boundary splits one token into
    multiple sub-tokens, cascading through subsequent context-dependent hash recalculations.
    Zhang et al. formally characterize the "attack range" — the number of tokens affected
    per character edit. This means a sparse set of carefully placed single-character
    edits can disrupt the watermark signal across the entire text with minimal visible
    text artifacts.

    '
  remediation: 'Implement tokenization-resistant watermarking that does not rely solely
    on context-dependent hash seeding. Consider character-level rather than token-level
    watermarking primitives. Normalize common Unicode character boundary variations
    before tokenization in detection.

    '
