  description: 'Detects use of StealthInk watermark encoder: defines red-list tokens
    by message interval, doubles probabilities of certain tokens, zeros others.'
  severity: medium
  category: watermarking_bypass
  patterns:
  - (?i)(?:def\s+encode_watermark|class\s+StealthInkEncoder)
  - (?i)gamma\s*=\s*2\s*\*\*\s*-\s*m
  - (?i)red_list\s*=\s*theta\s*\[\s*gamma\s*\*\s*len\(vocab\)\s*:\s*\(\s*gamma\s*\+\s*gamma\)\s*\*\s*len\(vocab\)\s*\]
  - (?i)(?:double|zero)\s*.{0,40}probabilit
  file_types:
  - '*.py'
  message: 'StealthInk encoder detected: token probability reweighting for multi-bit
    watermark.'
  remediation: '- Review generation pipeline for watermarking logic.

    - Ensure watermark key is kept secret.

    - Monitor for unusual token sampling patterns.'
  owasp_llm: LLM05:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Jiang et al. (2025) -- StealthInk: A Multi-bit and Stealthy Watermark
    for Larg | StealthInk (ICML 2025) – multi-bit watermark encoder using red-list
    and doubled probabilities.'
  fp_guards:
  - 'ProcessMetrics: TotalRss: 42MB'
  - 'def encode(data, key): return cipher.encrypt(data, key)'
  pipeline_confidence: high
