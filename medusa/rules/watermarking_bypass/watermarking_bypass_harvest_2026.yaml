version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: watermarking_bypass
rules:
- id: MEDUSA-WM-SCAN-367
  name: pst-watermark-removal-attack
  description: Detects implementation of the PST (Pattern embedding and Spatial-level
    Transformation) watermark removal attack from Guo et al. 2020, which combines
    scaling, median filter pattern embedding, and spatial transforms to destroy DNN
    watermark memorization
  severity: critical
  category: watermarking_bypass
  patterns:
  - (?i)(pst|pattern.{0,15}spatial.{0,15}transform).{0,40}(watermark|removal|attack|preprocess)
  - (?i)def\s+(?:gpst|pst_transform|pattern_spatial_transform)
  file_types:
  - '*.py'
  message: 'Detected: pst-watermark-removal-attack'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM10
  cwe: CWE-693
  mitre_attack: T1588
  source_paper: 'Guo et al. (2020) -- Fine-tuning Is Not Enough: A Simple yet Effective
    Water | Guo et al. 2020 ''Fine-tuning Is Not Enough'' IJCAI-21; PST attack achieves
    PW 1-9% on patch/content/OOD watermarks on CIFAR10 ResNet while maintaining PD
    87-91%'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-WM-SCAN-368
  name: bicubic-scaling-watermark-disrupt
  description: Detects bicubic interpolation scaling used as first stage of PST watermark
    disruption pipeline - upscaling to fixed size then downscaling back to reduce
    watermark-label correlation
  severity: medium
  category: watermarking_bypass
  patterns:
  - (?i)(bicubic|cv2\.INTER_CUBIC).{0,60}(watermark|trigger|scale.{0,20}back|1\/beta)
  - (?i)(Bicubic|interpolat).{0,30}(scale|resize).{0,40}(watermark|embed|disrupt|remov)
  file_types:
  - '*.py'
  message: 'Detected: bicubic-scaling-watermark-disrupt'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM10
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Guo et al. (2020) -- Fine-tuning Is Not Enough: A Simple yet Effective
    Water | Guo et al. 2020 IJCAI-21; PST Step 1 uses bicubic interpolation with beta=5
    (160x160 upscale) to reduce watermark sample-label correlation'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-WM-SCAN-369
  name: random-grid-median-filter-watermark
  description: Detects random grid median filter used for imperceptible pattern embedding
    in PST attack - selects random rows/columns at fixed intervals and applies median
    filter to disrupt watermark patterns
  severity: medium
  category: watermarking_bypass
  patterns:
  - (?i)(median.{0,10}filter|MedianFilter).{0,40}(random|grid|interval|row|column).{0,40}(watermark|pattern|embed)
  - (?i)(random.{0,15}(row|column|grid)).{0,40}(median|filter).{0,40}(watermark|pattern)
  file_types:
  - '*.py'
  message: 'Detected: random-grid-median-filter-watermark'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM10
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Guo et al. (2020) -- Fine-tuning Is Not Enough: A Simple yet Effective
    Water | Guo et al. 2020 IJCAI-21; PST Step 2 uses random grid median filter with
    interval v=5 to generate imperceptible patterns that alter watermark memorization'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-WM-SCAN-370
  name: elastic-transform-watermark-removal
  description: Detects elastic transformation combined with affine transforms for
    spatial-level watermark destruction - specifically the PST Step 3 combining affine
    and elastic distortions bounded by displacement parameter gamma
  severity: medium
  category: watermarking_bypass
  patterns:
  - (?i)(elastic|Elastic).{0,30}(transform|distort|deform).{0,40}(watermark|remov|spatial)
  - (?i)(affine|Affine).{0,30}(elastic|Elastic).{0,40}(watermark|transform|spatial)
  file_types:
  - '*.py'
  message: 'Detected: elastic-transform-watermark-removal'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM10
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Guo et al. (2020) -- Fine-tuning Is Not Enough: A Simple yet Effective
    Water | Guo et al. 2020 IJCAI-21; PST Step 3 uses affine + elastic transforms
    with displacement bound gamma=15 to destroy spatial watermark patterns'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-WM-SCAN-371
  name: ood-oracle-finetune-watermark-strip
  description: Detects the OOD oracle-labeling fine-tuning pipeline where adversary
    uses watermarked model as oracle to label out-of-distribution samples, then fine-tunes
    with PST-preprocessed data to strip watermarks
  severity: medium
  category: watermarking_bypass
  patterns:
  - (?i)(oracle|unlabel).{0,30}(out.{0,5}of.{0,5}distribut|ood|out_of_dist).{0,40}(fine.{0,5}tun|train).{0,40}(watermark|remov)
  - (?i)(watermark.{0,20}model).{0,30}(oracle|label).{0,30}(ood|out.{0,5}of.{0,5}dist|unlabel)
  file_types:
  - '*.py'
  message: 'Detected: ood-oracle-finetune-watermark-strip'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM10
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Guo et al. (2020) -- Fine-tuning Is Not Enough: A Simple yet Effective
    Water | Guo et al. 2020 IJCAI-21; Attack uses 25K OOD unlabeled samples oracle-labeled
    by watermarked model, fine-tuned 10 epochs; achieves PW 0-8% on CIFAR100'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-WM-SCAN-372
