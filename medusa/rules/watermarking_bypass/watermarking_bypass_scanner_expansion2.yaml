metadata:
  source: expansion2 2026-03-02
  subject: watermarking_bypass
  prefix: WB
  total_rules: 40
  id_range: MEDUSA-WB-SCAN-061 to MEDUSA-WB-SCAN-100
rules:
- id: MEDUSA-WB-SCAN-061
  name: kgw-statistical-green-list-token-sampling-attack
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)kgw.*green.*list.*statistic.*remov
  - (?i)kirchenbauer.*watermark.*statistic.*attack
  - (?i)green.*token.*sampl.*manipulat
  - (?i)watermark.*p.?value.*threshold.*bypass
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Statistical KGW green-list token sampling attack detected.
  description: Detects attacks on the Kirchenbauer et al. (2023) KGW watermarking scheme by exploiting statistical properties
    of the green-list token distribution. Liu et al. (2024, On Evaluating the Performance of Watermarked Machine-Generated
    Texts under Adversarial Attacks) demonstrated that statistical analysis of token distributions can identify and selectively
    replace green-list tokens while maintaining semantic coherence, achieving p-value bypass with >85% effectiveness. The
    attack is particularly effective when the green-list fraction is high (delta > 0.5).
  remediation: Switch to multi-key KGW rotation schemes that make statistical recovery of green-list identity computationally
    infeasible. Increase watermark key entropy and rotate keys per document segment. Apply KGW with low-entropy compensation
    to reduce the statistical footprint of green-list tokens.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-062
  name: aaronson-christ-watermark-statistical-removal
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)aaronson.*watermark.*remov
  - (?i)christ.*watermark.*attack
  - (?i)cryptographic.*watermark.*statistic.*bypass
  - (?i)one.time.*pad.*watermark.*defeat
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Statistical removal attack on Aaronson/Christ cryptographic watermarking scheme detected.
  description: Detects attacks targeting cryptographically secure watermarking schemes (Aaronson 2023, Christ et al. 2024)
    that use one-time pad or PRF-based token scoring. Liang et al. (2024, Watermark Under Fire) showed that even cryptographically
    robust schemes are vulnerable to statistical removal when token-level scoring correlations can be exploited through large-scale
    sampling attacks that recover approximate PRF outputs.
  remediation: Use adaptive context window sizes that prevent token-level correlation analysis. Implement watermark verification
    with confidence intervals that account for partial removal. Deploy multiple independent watermarking layers so that defeating
    one layer does not defeat all provenance signals.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-063
  name: dipper-neural-paraphrase-watermark-removal
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)dipper.*paraphras.*watermark
  - (?i)neural.*paraphras.*watermark.*remov
  - (?i)pegasus.*watermark.*bypass
  - (?i)paraphras.*model.*watermark.*strip
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: DIPPER/Pegasus neural paraphrase watermark removal attack detected.
  description: 'Detects use of neural paraphrase models (DIPPER, Pegasus) specifically to remove LLM watermarks while preserving
    text semantics. Cheng et al. (2025, Adversarial Paraphrasing: A Universal Attack for Humanizing AI-Generated Text) demonstrated
    that DIPPER-based paraphrasing achieves >90% watermark removal across KGW, EWD, and semantic watermarking schemes with
    minimal quality degradation. The attack is a practical universal bypass requiring only black-box access to a paraphrase
    model.'
  remediation: Deploy paraphrase-robust watermarking schemes (REMARK-LLM, SIR) that embed signals in deep semantic features
    resistant to surface-level paraphrasing. Implement watermark verification with paraphrase-invariant semantic similarity
    checks. Apply lexical diversity monitoring to detect DIPPER-style paraphrase patterns in output text.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-064
  name: token-substitution-watermark-semantic-spoofing
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)token.*substitut.*watermark.*spoof
  - (?i)synonym.*swap.*watermark.*bypass
  - (?i)lexical.*substitut.*watermark.*defeat
  - (?i)bert.*substitut.*watermark.*evad
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Token substitution watermark spoofing attack detected.
  description: Detects token-level substitution attacks that replace watermarked tokens with semantically equivalent alternatives
    from outside the green list, removing the statistical watermark signal. Liu et al. (2024) showed that BERT-guided synonym
    substitution can remove KGW watermarks with <0.5 BLEU degradation while reducing detection probability below the 5% significance
    threshold. Ayoobi et al. (2024, Esperanto) demonstrated multi-pivot language substitution as a systematic token substitution
    bypass.
  remediation: Implement context-aware watermarking that embeds signals in multi-token sequences rather than individual tokens,
    making single-token substitution insufficient for removal. Apply semantic similarity monitoring post-distribution to detect
    patterns consistent with substitution attacks.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-065
  name: copy-paste-watermark-detection-evasion
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)copy.paste.*watermark.*dilut
  - (?i)fragment.*watermarked.*non.watermarked
  - (?i)splice.*human.*text.*watermarked
  - (?i)interleav.*watermark.*human.*text
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Copy-paste watermark detection evasion via text splicing detected.
  description: 'Detects copy-paste attacks that interleave watermarked LLM text with non-watermarked human-written text segments
    to dilute the watermark signal below the detection threshold. This attack exploits the fixed-window detection approach
    used by most watermarking schemes: if enough non-watermarked text is interspersed, the green-token proportion drops below
    the significance threshold even though watermarked content is present.'
  remediation: Implement sliding-window watermark detection with variable window sizes to detect partial watermarking. Apply
    sentence-level rather than document-level watermark scoring to identify watermarked segments within mixed documents. Deploy
    watermark verification that flags documents with statistically heterogeneous watermark density.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-066
  name: watermark-adaptive-rl-attack-policy-optimise
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)rl.*adaptive.*watermark.*attack
  - (?i)reinforcement.*learn.*watermark.*remov
  - (?i)rlcracker.*reward.*watermark
  - (?i)policy.*optimiz.*watermark.*evad
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ipynb'
  message: Adaptive RL-based watermark removal policy training detected.
  description: 'Detects training of RL-based watermark removal policies that learn to optimise text edits to minimise watermark
    detection probability while maximising semantic quality. Huang et al. (2025, RLCracker: Exposing the Vulnerability of
    LLM Watermarks with Adaptive RL Attacks) demonstrated that RL agents trained on watermark detector feedback can learn
    generalised removal policies that transfer across watermarking schemes with as few as 1,000 training iterations.'
  remediation: Implement adversarial training of watermark detectors against RL-based removal policies. Apply rate limiting
    and output monitoring on watermark verification APIs to prevent RL feedback loop exploitation. Deploy ensemble watermarking
    with diverse schemes to prevent single-policy generalisation.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-067
  name: watermark-forging-spoofing-false-attribution
  severity: CRITICAL
  category: watermarking_bypass
  patterns:
  - (?i)watermark.*forg.*attribut
  - (?i)spoof.*watermark.*false.*source
  - (?i)plant.*watermark.*human.*text
  - (?i)embed.*fake.*watermark.*non.ai
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Watermark forging or false attribution spoofing attack detected.
  description: Detects watermark forgery attacks that embed artificial watermark signals into human-written text to falsely
    attribute it to a specific LLM, or into AI-generated text to create false attribution to a different model. Zhou et al.
    (2024, BiLeve) and Sadasivan et al. (2023) documented that single-key KGW watermarks can be forged by adversaries with
    white-box access, enabling false attribution of human text as AI-generated or vice versa, with legal and reputational
    consequences.
  remediation: Deploy bi-level or zero-knowledge proof watermarking schemes (BiLeve, PVMark) that are provably unforgeable
    without the watermark key. Implement asymmetric watermarking where the embedding key is private and the verification key
    is public but cannot be used to forge watermarks.
  owasp_llm: LLM02:2025
  cwe: CWE-345
- id: MEDUSA-WB-SCAN-068
  name: low-entropy-region-watermark-exploit
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)low.entropy.*region.*watermark.*exploit
  - (?i)entropy.*low.*token.*green.*list.*bypass
  - (?i)high.entropy.*context.*watermark.*miss
  - (?i)forced.*token.*entropy.*watermark.*evad
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Low-entropy region watermark exploitation attack detected.
  description: Detects attacks exploiting low-entropy text regions (where the next token is highly predictable) to escape
    watermark embedding, then using those regions to insert unwatermarked content. Watermarking schemes based on token probability
    perturbation cannot reliably embed signals in low-entropy positions without introducing detectable artifacts. Giboulot
    et al. (2024, WaterMax) demonstrated systematic exploitation of entropy blind spots to achieve watermark-free text insertion.
  remediation: Implement entropy-adaptive watermarking schemes (WaterMax, SWEET) that adjust embedding strength based on local
    token entropy. Apply watermark strength normalisation to account for entropy variation across document positions. Monitor
    entropy distribution of watermarked text to detect entropy-exploitation patterns.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-069
  name: ngram-frequency-manipulation-watermark-defeat
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)n.?gram.*frequency.*watermark.*manipulat
  - (?i)bigram.*trigram.*watermark.*statistic.*alter
  - (?i)frequency.*analysis.*watermark.*green.*token
  - (?i)n.?gram.*distribut.*shift.*watermark
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: N-gram frequency manipulation watermark defeat detected.
  description: Detects attacks that manipulate n-gram frequency distributions in LLM output to defeat watermark detection
    methods that rely on token frequency statistics. By carefully redistributing token frequencies to match the expected distribution
    of non-watermarked text, adversaries can erase the statistical footprint of frequency-based watermarks. Liang et al. (2024,
    Watermark Under Fire) showed n-gram manipulation is particularly effective against unigram watermarking schemes.
  remediation: Deploy watermarking schemes with cryptographically strong PRF-based token scoring that makes frequency analysis
    intractable without key knowledge. Implement watermark verification using full statistical test batteries rather than
    simple frequency thresholds.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-070
  name: watermark-transfer-cross-model-attack
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)watermark.*transfer.*cross.model
  - (?i)lift.*watermark.*model.*a.*model.*b
  - (?i)watermark.*portab.*exploit
  - (?i)transfer.*watermark.*signal.*another.*model
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Watermark transfer cross-model attack detected.
  description: Detects attacks that extract a watermarked model's output distribution and replicate it to generate watermarked
    text attributed to a different model, enabling cross-model watermark transfer. This attack can frame an innocent model
    as the source of AI-generated content, or attribute watermarked content from a commercial model to an open-source model
    to evade detection. Pan et al. (2025) showed watermark transfer is feasible through knowledge distillation-based approximation.
  remediation: Implement model-fingerprinted watermarking schemes that tie watermark signals to specific model architecture
    properties rather than output statistics alone. Deploy watermark verification that validates model identity alongside
    watermark presence.
  owasp_llm: LLM02:2025
  cwe: CWE-345
- id: MEDUSA-WB-SCAN-071
  name: model-extraction-watermark-circumvention
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)model.*extract.*watermark.*bypass
  - (?i)distil.*watermark.*surrogate.*model
  - (?i)clone.*model.*strip.*watermark
  - (?i)query.*watermark.*model.*replicate
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Model extraction used to circumvent watermarking detected.
  description: Detects model extraction attacks targeting watermarked LLMs where the adversary queries the target model to
    build a surrogate that replicates functional behaviour without preserving the watermark signal. Because the extracted
    surrogate model was not trained with the watermarking algorithm, its outputs carry no watermark, allowing attribution-free
    use of the model's capabilities. Pan et al. (2025) demonstrated that standard watermarks do not survive model extraction.
  remediation: Implement watermark-preserving distillation verification that checks whether extracted student models retain
    watermark signals. Apply query rate limiting and anomaly detection to identify model extraction query patterns targeting
    watermarked inference endpoints. Deploy functional similarity detection to identify extracted model variants.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-072
  name: unicode-homoglyph-watermark-character-substitution
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)homoglyph.*watermark.*bypass
  - (?i)unicode.*lookalike.*watermark.*evad
  - (?i)zero.width.*character.*watermark.*disrupt
  - (?i)confusable.*character.*watermark.*strip
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  - '*.md'
  message: Unicode homoglyph substitution watermark evasion detected.
  description: Detects use of Unicode homoglyphs (visually identical characters with different code points), zero-width characters,
    or confusable characters to disrupt character-level watermarking schemes. PDFuzz (2024) and Liu et al. (2024) demonstrated
    that character-level positional scrambling and homoglyph substitution defeat character-encoding watermarks used in academic
    integrity and copyright detection systems while remaining visually undetectable to human reviewers.
  remediation: Implement Unicode normalisation (NFKC) before watermark verification to collapse homoglyph variants to canonical
    forms. Apply zero-width character filtering and confusable character detection in watermark pre-processing pipelines.
    Deploy watermarking schemes that are defined at the semantic rather than character level.
  owasp_llm: LLM02:2025
  cwe: CWE-116
- id: MEDUSA-WB-SCAN-073
  name: compression-based-watermark-removal
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)compress.*watermark.*remov
  - (?i)mp3.*aac.*image.*compress.*watermark
  - (?i)lossy.*compress.*watermark.*defeat
  - (?i)jpeg.*png.*compress.*watermark.*strip
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.sh'
  - '*.json'
  message: Compression-based watermark removal attack detected.
  description: Detects use of lossy compression techniques (JPEG, MP3, AAC, PDF re-rendering) to remove digital watermarks
    from AI-generated content. Compression attacks exploit the fact that watermark signals embedded in high-frequency components
    are typically removed by lossy codecs that discard perceptually insignificant information. This is a widely known, low-effort
    attack that defeats many commercial watermarking systems with no special tooling required.
  remediation: Embed watermarks in perceptually significant low-frequency components that survive standard compression. Implement
    watermark robustness validation against JPEG/MP3/AAC compression before deployment. Apply content-adaptive watermarking
    that adjusts signal strength based on local feature saliency.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-074
  name: translation-back-translation-watermark-bypass
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)back.?translat.*watermark.*bypass
  - (?i)translat.*pivot.*watermark.*remov
  - (?i)cross.lingual.*watermark.*defeat
  - (?i)translat.*watermark.*surviv.*check
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Translation-back-translation watermark bypass attack detected.
  description: Detects translation-back-translation (TBT) attacks that remove LLM watermarks by translating watermarked text
    to an intermediate language and back. He et al. (2024, Can Watermarks Survive Translation) demonstrated that cross-lingual
    watermark consistency is poor across all major watermarking schemes — KGW, EWD, Unigram, and semantic watermarks lose
    60-95% of their detection probability after translation-back-translation with standard MT systems. Ayoobi et al. (2024,
    Esperanto) extended this to multi-pivot language chains.
  remediation: Deploy cross-lingual watermarking schemes that preserve signals across translation (see He et al. 2024 cross-lingual
    consistency extensions). Implement watermark verification that accounts for translation artifacts. Apply language detection
    and translation chain tracing to flag text with suspicious translation history.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-075
  name: character-level-perturbation-word-watermark-attack
  severity: MEDIUM
  category: watermarking_bypass
  patterns:
  - (?i)character.*perturb.*word.*watermark
  - (?i)char.*edit.*watermark.*defeat
  - (?i)typo.*insert.*watermark.*bypass
  - (?i)character.*mutilat.*watermark.*evad
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Character-level perturbation attack against word-level watermarks detected.
  description: Detects character-level perturbation attacks (typo insertion, character deletion/substitution, accent modification)
    used to defeat word-level watermarking schemes. Since word-level watermarks score tokenised word sequences, character-level
    perturbations that change tokenisation boundaries can corrupt watermark signal recovery without changing human readability.
    Liu et al. (2024) showed combined character+synonym substitution attacks are more effective than either attack type alone,
    with <0.3 BLEU degradation.
  remediation: Implement character-normalisation in watermark tokenisation pipelines to collapse character-level perturbations
    before scoring. Apply edit-distance tolerance in watermark detection to handle minor character modifications. Deploy multi-granularity
    watermarking that operates at both character and word levels simultaneously.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-076
  name: watermark-blind-spot-low-frequency-exploitation
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)watermark.*blind.*spot.*exploit
  - (?i)watermark.*miss.*sentence.*position
  - (?i)watermark.*weak.*region.*target
  - (?i)watermark.*coverage.*gap.*exploit
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Watermark blind spot exploitation attack detected.
  description: Detects systematic exploitation of blind spots in watermark coverage — positions in text where the watermarking
    algorithm predictably fails to embed detectable signals (e.g., low-entropy forced completions, code blocks, lists, named
    entity sequences). Adversaries who map the blind spots of a deployed watermarking scheme can structure their content to
    route critical information through unwatermarked regions while maintaining watermark signals elsewhere to avoid arousing
    detection suspicion.
  remediation: Apply watermark coverage analysis to identify blind spots in deployed schemes. Implement multi-pass watermarking
    with independent keys applied at different structural levels (sentence, paragraph, semantic unit) to eliminate coverage
    gaps. Monitor watermark density distribution across document structures to detect blind-spot exploitation patterns.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-077
  name: pvmark-zkp-proof-system-attack
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)pvmark.*zkp.*attack
  - (?i)zero.knowledge.*watermark.*proof.*forge
  - (?i)public.*verif.*watermark.*exploit
  - (?i)pvmark.*verif.*bypass
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: PVMark zero-knowledge proof watermark verification attack detected.
  description: 'Detects attacks targeting the PVMark public verifiability watermarking scheme that uses zero-knowledge proofs
    for watermark verification without revealing the secret key. Duan et al. (2025, PVMark: Enabling Public Verifiability
    for LLM Watermarking Schemes) identified that ZKP-based watermark systems are vulnerable to proof forgery attacks if the
    underlying cryptographic commitment scheme has implementation weaknesses, potentially allowing adversaries to generate
    false watermark verification proofs.'
  remediation: Implement formal verification of ZKP circuit implementations in watermark systems. Apply soundness and zero-knowledge
    property testing to PVMark deployments. Use standardised, audited ZKP libraries rather than custom implementations for
    watermark proof systems.
  owasp_llm: LLM02:2025
  cwe: CWE-347
- id: MEDUSA-WB-SCAN-078
  name: code-acrostic-watermark-removal-code-gen
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)code.*acrostic.*watermark.*remov
  - (?i)acrostic.*code.*watermark.*bypass
  - (?i)comment.*variable.*name.*watermark.*strip
  - (?i)code.*watermark.*comment.*delet
  file_types:
  - '*.py'
  - '*.js'
  - '*.java'
  - '*.ts'
  - '*.go'
  - '*.yaml'
  message: Code acrostic watermark removal attack on code generation detected.
  description: 'Detects attacks targeting acrostic-based code watermarking schemes (Lin et al. 2025, Code Acrostic: Robust
    Watermarking for Code Generation) by stripping or obfuscating the variable names, comment patterns, or code structure
    elements used as watermark carriers. Adversaries can strip acrostic watermarks by renaming variables, removing comments,
    or using code obfuscation tools, without affecting code functionality.'
  remediation: Implement watermark verification that is robust to code refactoring by embedding signals in multiple independent
    code structure properties (control flow, data flow, comment patterns). Apply code normalisation before watermark extraction
    to reduce effectiveness of name-stripping attacks.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-079
  name: deeptextmark-neural-watermark-semantic-bypass
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)deeptextmark.*bypass
  - (?i)neural.*text.*watermark.*semantic.*attack
  - (?i)deep.*learn.*watermark.*text.*evad
  - (?i)word2vec.*watermark.*synonym.*bypass
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: DeepTextMark neural text watermark semantic bypass attack detected.
  description: Detects attacks targeting the DeepTextMark deep learning-driven text watermarking scheme (Munyer et al. 2024)
    by exploiting the Word2Vec semantic embedding space used for watermark encoding. Adversaries who identify the semantic
    dimensions used for watermark embedding can apply targeted semantic perturbations that disrupt the watermark signal while
    preserving overall text meaning, as documented in the DeepTextMark adversarial robustness evaluation.
  remediation: Deploy DeepTextMark with adversarial training against semantic perturbation attacks. Implement multi-space
    watermark embedding using diverse semantic representations (Word2Vec, GloVe, BERT) to reduce the effectiveness of single-space
    targeting attacks. Apply watermark strength amplification in semantically dense regions.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-080
  name: image-watermark-visual-paraphrase-attack
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)image.*watermark.*visual.*paraphras
  - (?i)peccavi.*visual.*paraphrase.*watermark
  - (?i)image.*regenerat.*watermark.*strip
  - (?i)diffusion.*inpaint.*watermark.*remov
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.sh'
  - '*.json'
  message: Visual paraphrase attack on image watermarking detected.
  description: 'Detects visual paraphrase attacks on image watermarking schemes where adversaries use diffusion-based image
    regeneration or inpainting to remove invisible watermarks while preserving visual content. Dixit et al. (2025, PECCAVI:
    Visual Paraphrase Attack — Safe and Distortion-Free Image Watermarking Technique) demonstrated that visual paraphrase
    attacks achieve near-zero distortion watermark removal by regenerating images through a diffusion model conditioned on
    the original, stripping any embedded watermark signal.'
  remediation: Implement semantic watermarking in image features that are preserved by diffusion regeneration (e.g., high-level
    scene composition, semantic region embeddings). Apply watermark robustness testing against diffusion-based regeneration
    attacks before deployment. Deploy C2PA content credentials that survive regeneration by being tied to metadata rather
    than pixel-level signals.
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-WB-SCAN-081
  name: remark-llm-binary-signature-length-attack
  severity: HIGH
  category: watermarking_bypass
  patterns:
  - (?i)remark.*llm.*signature.*length.*attack
  - (?i)binary.*watermark.*truncat.*attack
  - (?i)remark.*llm.*bit.*corrupt
  - (?i)signature.*watermark.*partial.*destroy
  file_types:
