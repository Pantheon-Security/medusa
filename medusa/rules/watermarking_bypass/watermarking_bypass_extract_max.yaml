rules:
- id: MEDUSA-WM-SCAN-001
  name: model-watermark-image-processing-embed
  description: Detects watermark embedding into image processing neural networks via trigger set injection
  severity: high
  category: watermarking_bypass
  patterns:
  - (?i)(watermark|trigger).{0,40}(embed|inject).{0,40}(image|neural|model)
  file_types:
  - '*.py'
  message: 'Detected: model-watermark-image-processing-embed'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-345
  source_paper: Zhang et al. (2020) - Model watermarking for image processing via trigger set embedding
- id: MEDUSA-WM-SCAN-002
