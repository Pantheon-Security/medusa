  message: Cross-application prompt injection targeting AI coding agent detected
  description: 'Detects CSAgent-identified cross-application prompt injection patterns — malicious instructions delivered
    through web browser, desktop GUI, CLI, or REST API that trigger unauthorized agent actions across application boundaries.
    Gong et al. (2025): CSAgent defends API/CLI/GUI attack surfaces simultaneously, achieving 0% ASR with Policy Evolution
    Framework. Standard single-surface defenses miss cross-interface injections.'
  remediation: Deploy CSAgent-style intent-aware context space enforcement that spans API/CLI/GUI interfaces. Implement cross-application
    action audit logging. Restrict agent's ability to act outside declared application scope.
