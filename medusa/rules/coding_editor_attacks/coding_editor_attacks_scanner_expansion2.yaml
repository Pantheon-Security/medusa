rules:
- id: MEDUSA-CEA-SCAN-061
  name: malicious-package-suggestion-typosquat
  description: Detects requests to LLM coding assistants that are designed to elicit typosquatting or malicious package name suggestions. Attackers craft code contexts that lead coding assistants to suggest malicious packages resembling popular legitimate ones.
  category: supply_chain_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-829
  mitre_attack: T1195.001
  source_paper: Oh et al. (2023) - Package Hallucination - Large Language Models May Suggest Nonexistent Packages
  patterns:
  - '(?i)\b(?:import|require|install|pip install|npm install|gem install|cargo add|go get)\s+(?:[a-z0-9]+-){0,3}[a-z0-9]+\s*(?:#|//|/*)\s*(?:note|TODO|try|consider|maybe)'
  - '(?i)(?:suggest|recommend|use|install)\s+(?:a|an|the)\s+(?:package|library|module|dependency)\s+(?:for|to handle|to manage|that handles)\s+.{0,80}(?:crypto|authentication|auth|payment|oauth|jwt|ssl|tls)'
  - '(?i)(?:hallucinated?|non.?existent|fake|made.?up)\s+(?:package|library|module|dependency)\s+(?:name|suggestion)'

- id: MEDUSA-CEA-SCAN-062
  name: code-backdoor-insertion-request
  description: Detects requests to LLM coding assistants to insert backdoors, hidden functionality, or covert channels into code. Attackers request subtle code modifications that create persistent unauthorized access.
  category: backdoor_insertion
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-912
  mitre_attack: T1587.001
  source_paper: Schuster et al. (2021) - You Autocomplete Me - Poisoning Vulnerabilities in Neural Code Completion
  patterns:
  - '(?i)\b(?:add|insert|include|embed|hide|plant)\s+(?:a|an)?\s+(?:backdoor|trapdoor|hidden|covert|secret)\s+(?:access|function|functionality|channel|connection|feature|exit|bypass)'
  - '(?i)\b(?:backdoor|trapdoor|logic bomb|time bomb|kill switch)\s+(?:in|into|to|the)\s+(?:this|the|my)?\s+(?:code|function|class|module|application|app|service)'
  - '(?i)(?:nobody will notice|undetectable|subtle|hidden|obfuscated|disguised)\s+(?:change|modification|addition|feature|functionality)\s+(?:that|which|to).{0,60}(?:allow|permit|enable|give)\s+(?:me|us|attacker|unauthorized)\s+(?:access|entry|control)'

- id: MEDUSA-CEA-SCAN-063
  name: hardcoded-credential-generation-request
  description: Detects requests to generate code with hardcoded credentials, API keys, passwords, or tokens. LLM coding assistants can be manipulated into generating insecure code with embedded secrets.
  category: credential_exposure
  severity: high
  owasp_llm: LLM02:2025
  cwe: CWE-798
  mitre_attack: T1552.001
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard - Assessing the Security of GitHub Copilot Code Contributions
  patterns:
  - '(?i)(?:hardcode|hardcoded|hard.code)\s+(?:the|a|my)?\s+(?:password|secret|key|credential|token|API key|access key|private key)\s+(?:in|into|directly in|as a constant)'
  - '(?i)(?:password|secret|API.?key|access.?key|token|credential)\s*=\s*["\x27][^"]{8,}["\x27]\s*(?:#|//)\s*(?:TODO|FIXME|change|replace|update)\s+(?:before|in|for)\s+(?:prod|production|deploy|release)'
  - '(?i)(?:just|temporarily|for now|quick(ly)?)\s+(?:hardcode|put|use|embed|store)\s+(?:the|my|your)?\s+(?:password|secret|key|credential|token|API key)'

- id: MEDUSA-CEA-SCAN-064
  name: dependency-confusion-attack-vector
  description: Detects dependency confusion attack patterns where internal package names are referenced alongside instructions to create or use packages in public registries, exploiting registry priority ordering.
  category: supply_chain_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-829
  mitre_attack: T1195.001
  source_paper: Birsan (2021) - Dependency Confusion - How I Hacked into Apple, Microsoft and Dozens of Other Companies
  patterns:
  - '(?i)(?:internal|private|corporate|company).{0,40}(?:package|library|module).{0,80}(?:public|PyPI|npm|NuGet|RubyGems|crates\.io|Maven).{0,60}(?:registry|repository|repo|index)'
  - '(?i)(?:publish|upload|push|release|submit)\s+(?:a|an|the|my|our)\s+(?:internal|private|corporate)\s+(?:package|library|module)\s+(?:to|on|at)\s+(?:PyPI|npm|NuGet|crates\.io|RubyGems|Maven)'
  - '(?i)\b(?:dependency confusion|namespace confusion|package confusion)\s+(?:attack|exploit|vulnerability|technique)'

- id: MEDUSA-CEA-SCAN-065
  name: trojan-source-bidirectional-unicode-injection
  description: Detects Trojan Source attacks that use Unicode bidirectional control characters to make malicious code appear benign to human reviewers while being executed differently by the compiler/interpreter.
  category: unicode_obfuscation
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-116
  mitre_attack: T1027
  source_paper: Boucher & Anderson (2021) - Trojan Source - Invisible Vulnerabilities
  patterns:
  - '[\u202a\u202b\u202c\u202d\u202e\u2066\u2067\u2068\u2069\u200f\u200e]{2,}'
  - '(?i)(?:bidirectional|bidi|RTL|LTR)\s+(?:unicode|character|control|override|text)\s+(?:in|inside|within)\s+(?:code|source|comment|string|identifier)'
  - '(?i)(?:trojan source|invisible|hidden)\s+(?:vulnerability|backdoor|code|attack)\s+(?:using|via|with)\s+(?:unicode|bidi|RTL|special|control)\s+(?:character|char|code point)'

- id: MEDUSA-CEA-SCAN-066
  name: code-repository-context-poisoning
  description: Detects attempts to poison LLM coding assistant context by injecting malicious instructions into repository README files, code comments, or documentation that the assistant reads as context.
  category: context_poisoning
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-74
  mitre_attack: T1195
  source_paper: Frieder et al. (2024) - Mathematical Capabilities of ChatGPT
  patterns:
  - '(?i)(?:README|CONTRIBUTING|CHANGELOG|docs?|documentation|\.github)\s+(?:file|contains?|includes?|has)\s+(?:hidden|special|secret|embedded)\s+(?:instruction|directive|payload|command)'
  - '(?i)(?:when (the|an|a)\s+(?:AI|LLM|coding assistant|Copilot|Cursor|model|assistant)\s+(?:reads?|processes?|sees?|parses?|scans?))\s+(?:this|the)\s+(?:file|code|README|repo|repository)'
  - '(?i)(?:AI assistant|coding assistant|Copilot|Cursor)\s*:\s*(?:when|if|upon)\s+.{0,100}(?:ignore|override|forget|new instruction|you are now|do not|must not)'

- id: MEDUSA-CEA-SCAN-067
  name: shell-command-injection-via-code-generation
  description: Detects shell command injection attacks that manipulate LLM coding assistants to generate code containing unvalidated shell command execution, enabling OS command injection vulnerabilities.
  category: shell_injection
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-78
  mitre_attack: T1059.004
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:subprocess|os\.system|exec|shell|popen|eval|spawn)\s*\(.{0,100}(?:user.input|request\.|params\.|argv|stdin|input\(|sys\.argv|environ)'
  - '(?i)(?:run|execute|shell out|invoke)\s+.{0,60}(?:user.provided|user.input|from.request|from.user|untrusted|unvalidated)\s+(?:command|argument|parameter|input)\s+(?:directly|without|as.is|unsanitized)'
  - '(?i)(?:f.string|f"|\{.+?\})\s*(?:to|into|in)\s+(?:subprocess|os\.system|exec|shell|popen|eval)\s*\('

- id: MEDUSA-CEA-SCAN-068
  name: insecure-crypto-implementation-generation
  description: Detects requests to generate cryptographically insecure code patterns including weak key generation, broken crypto algorithms, insecure random number generation, or improper IV handling.
  category: insecure_cryptography
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-327
  mitre_attack: T1588.003
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:MD5|SHA1|DES|RC4|ECB mode|CBC with static IV)\s+(?:for|to)\s+(?:password|credential|sensitive|security|encrypt|hash|sign)'
  - '(?i)(?:random\.random\(\)|Math\.random\(\)|rand\(\)|random\b)\s+(?:for|to|as)\s+(?:key|token|nonce|IV|salt|password|secret|session)'
  - '(?i)(?:hardcoded?|static|fixed|constant)\s+(?:IV|initialization vector|nonce|salt|key|seed)\s+(?:for|in|with)\s+(?:AES|DES|cipher|encrypt|crypto)'

- id: MEDUSA-CEA-SCAN-069
  name: sql-injection-via-code-generation
  description: Detects LLM coding assistant manipulation to generate SQL injection vulnerabilities by requesting database query code that directly concatenates or interpolates user input into SQL strings.
  category: sql_injection_generation
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-89
  mitre_attack: T1190
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:query|sql|SELECT|INSERT|UPDATE|DELETE)\s*\+\s*(?:user_input|request\.|params\.|user\.|input\b|query_param|search_term)'
  - '(?i)(?:f.string|f"|\bformat\b|\.format\(|%s|%d|\.format\b)\s*.{0,40}(?:SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\s+.{0,60}(?:user|input|request|params?|data)'
  - '(?i)(?:directly|without|unsanitized|no.?sanitiz|no.?validat|no.?escap)\s+.{0,40}(?:user input|user data|request data|param)\s+.{0,40}(?:SQL|query|database)'

- id: MEDUSA-CEA-SCAN-070
  name: ci-cd-pipeline-attack-via-code-generation
  description: Detects attempts to manipulate LLM coding assistants to generate malicious CI/CD pipeline configurations that exfiltrate secrets, modify build artifacts, or introduce supply chain attack vectors.
  category: ci_cd_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-915
  mitre_attack: T1195.002
  source_paper: Cider Security (2023) - Top 10 CICD Security Risks
  patterns:
  - '(?i)(?:curl|wget|nc|netcat|bash|sh)\s+(?:https?://|<\(curl)\s*[^\s]{10,}\s+(?:\||&&|>|>>)\s+(?:bash|sh|python|node)'
  - '(?i)(?:secrets?|env|environment|credentials?|API.?key|token)\s*(?:\$\{|\benv\b|getenv)\s*.{0,80}(?:curl|wget|http|send|post|upload|exfil)'
  - '(?i)(?:\.github/workflows|\.gitlab-ci\.yml|Jenkinsfile|\.circleci|Dockerfile)\s+(?:modified|edited|changed)\s+(?:to|so as to|in order to)\s+(?:steal|exfil|send|leak|transmit)'

- id: MEDUSA-CEA-SCAN-071
  name: path-traversal-file-inclusion-generation
  description: Detects LLM coding assistant manipulation to generate path traversal or local file inclusion vulnerabilities through requests for file handling code that does not validate user-controlled path components.
  category: path_traversal
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-22
  mitre_attack: T1083
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:open|read|load|include|require)\s*\(\s*(?:user.input|request\.|params\.|argv|stdin|input\()\s*\)'
  - '(?i)(?:file_path|filename|path|directory|dir)\s*=\s*.{0,60}(?:request\.|user\.|input\.|params\.)\s*.{0,30}(?:open|read|load|include|require|access)'
  - '(?i)(?:without|no|skip|bypass|dont|don.t)\s+(?:path|directory|file)\s+(?:validation|sanitization|check|traversal)\s+(?:for|in)\s+(?:simplicity|speed|testing|now|development)'

- id: MEDUSA-CEA-SCAN-072
  name: insecure-deserialization-code-generation
  description: Detects requests to generate insecure deserialization code patterns that could allow arbitrary code execution through pickle, yaml.load, marshal, or other unsafe deserializers processing user-controlled data.
  category: insecure_deserialization
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-502
  mitre_attack: T1059
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:pickle\.loads?|marshal\.loads?|yaml\.load\s*\(|eval\s*\(|exec\s*\()\s*.{0,60}(?:user.input|request\.|params\.|untrusted|external|user.provided)'
  - '(?i)(?:deserializ|unmarshal|unpickle)\s+.{0,60}(?:user.provided|untrusted|external|user.controlled|user.input)\s+(?:data|input|bytes?|payload)'
  - '(?i)(?:yaml\.load|json\.loads?|pickle\.loads?|eval|exec)\s*\(.{0,80}(?:user|request|params|stdin|argv|input|external)'

- id: MEDUSA-CEA-SCAN-073
  name: ssrf-generation-request-via-code-completion
  description: Detects LLM coding assistant manipulation to generate Server-Side Request Forgery vulnerabilities through code that makes HTTP requests to user-controlled URLs without proper validation or allowlisting.
  category: ssrf_generation
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-918
  mitre_attack: T1071
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:requests?\.get|urllib\.request|fetch|http\.get|axios\.get|curl)\s*\(\s*.{0,80}(?:user.input|request\.|params\.|argv|user.provided|user.controlled)'
  - '(?i)(?:fetch|make.request|http.request|GET|POST)\s+.{0,60}(?:user.controlled|user.provided|user.supplied|arbitrary|any)\s+(?:URL|endpoint|host|address|destination)'
  - '(?i)(?:without|no|skip)\s+(?:URL|SSRF|host|domain)\s+(?:validation|whitelist|allowlist|check|filtering)\s+(?:for|in|during)\s+(?:simplicity|development|testing|now)'

- id: MEDUSA-CEA-SCAN-074
  name: cursor-ide-context-manipulation-attack
  description: Detects attacks specifically targeting Cursor IDE and similar AI-native code editors that use repository-wide context, exploiting the editor's AI context window with poisoned repository content.
  category: ide_context_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-74
  mitre_attack: T1195
  source_paper: Lanyado et al. (2024) - Can You Trust Your AI-Assisted Code
  patterns:
  - '(?i)\bCursor\s+(?:IDE|editor|AI|assistant|chat|context)\s*.{0,80}(?:inject|poison|manipulate|trick|mislead|override)\s+(?:context|prompt|instruction|behavior)'
  - '(?i)(?:\.cursorrules|cursor\.json|\.cursorignore)\s+(?:file|config|configuration)\s+.{0,80}(?:inject|poison|manipulate|hidden|instruction|override)'
  - '(?i)(?:codebase.context|repo.context|project.context|@codebase|@file)\s*.{0,80}(?:inject|poison|manipulate|hidden instruction|override|ignore|forget)'

- id: MEDUSA-CEA-SCAN-075
  name: github-copilot-context-poisoning
  description: Detects attacks specifically targeting GitHub Copilot through repository context poisoning, malicious training data injection, or prompt injection via code comments targeting Copilot's suggestion engine.
  category: ide_context_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-74
  mitre_attack: T1195
  source_paper: Schuster et al. (2021) - You Autocomplete Me
  patterns:
  - '(?i)\bCopilot\s+(?:will|should|must|can)\s+(?:suggest|complete|generate|recommend)\s+.{0,80}(?:malicious|harmful|backdoor|insecure|vulnerable|unsafe)'
  - '(?i)(?:train|fine.tune|poison|corrupt)\s+(?:Copilot|GitHub\s+Copilot|code\s+completion|AI\s+coding\s+assistant)\s+.{0,80}(?:to\s+suggest|to\s+generate|with\s+backdoors?|with\s+vulnerabilities?)'
  - '(?i)(?:copilot.sees|copilot.reads|copilot.context|copilot.input)\s*.{0,80}(?:inject|poison|manipulate|hidden|override|new instruction)'

- id: MEDUSA-CEA-SCAN-076
  name: overpermissive-iam-code-generation
  description: Detects LLM coding assistant manipulation to generate overly permissive IAM policies, ACLs, file permissions, or authorization code that grants excessive access rights.
  category: privilege_escalation
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-732
  mitre_attack: T1098
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:"Action"|\baction\b)\s*:\s*(?:"\*"|''*''|\["\*"\])\s*.{0,80}(?:"Resource"|\bresource\b)\s*:\s*(?:"\*"|''*''|\["\*"\])'
  - '(?i)(?:chmod|chown|permission|ACL|IAM|policy|role)\s+.{0,80}(?:777|0777|rwxrwxrwx|world.writable|public|everyone|\\*)\s+(?:for|to|on)\s+(?:simplicity|speed|testing|all users|everyone)'
  - '(?i)(?:wildcard|\\*)\s+(?:permission|privilege|access|action|resource)\s+(?:for|to|on)\s+(?:all|every|any)\s+(?:user|service|action|resource|endpoint)'

- id: MEDUSA-CEA-SCAN-077
  name: secret-manager-bypass-code-generation
  description: Detects requests to generate code that bypasses secret management best practices by inlining secrets, reading from environment variables unsafely, or circumventing vault/secrets manager integrations.
  category: credential_exposure
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-522
  mitre_attack: T1552
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:skip|bypass|avoid|without|instead of)\s+(?:Vault|AWS\s+Secrets|Azure\s+Key\s+Vault|GCP\s+Secret|secrets?\s+manager|HashiCorp)\s+(?:for\s+now|in\s+development|for\s+testing|for\s+simplicity)'
  - '(?i)(?:hardcode|inline|embed|put directly|store as constant)\s+.{0,40}(?:API.?key|secret|credential|token|password)\s+.{0,40}(?:just|for\s+now|temporarily|quick)'
  - '(?i)(?:echo|print|log|output|console\.log|printf|puts)\s*.{0,40}(?:password|secret|API.?key|token|credential|private.?key|access.?key)'

- id: MEDUSA-CEA-SCAN-078
  name: race-condition-toctou-generation
  description: Detects LLM coding assistant manipulation to generate race condition or TOCTOU (Time-Of-Check Time-Of-Use) vulnerabilities in file operations, authentication checks, or shared resource access.
  category: race_condition
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-362
  mitre_attack: T1055
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:check.use|TOCTOU|time.of.check|time.of.use|race\s+condition)\s+(?:in|for|with)\s+(?:file|auth|authentication|permission|resource|session)'
  - '(?i)(?:if\s+os\.path\.exists\s*\(.{0,80}\)\s*:\s*os\.open|if\s+file_exists\s*\(.{0,80}\)\s*:\s*open)'
  - '(?i)(?:check.then.use|verify.then.execute|test.then.perform)\s+(?:without|no|not\s+atomic|not\s+locking)\s+(?:lock|mutex|atomic|synchronized)'

- id: MEDUSA-CEA-SCAN-079
  name: ai-coding-assistant-jailbreak-roleplay
  description: Detects role-play jailbreak attacks specifically targeting AI coding assistants, asking them to roleplay as unrestricted coding AIs, senior hackers, or security researchers to generate malicious code.
  category: persona_injection
  severity: critical
  owasp_llm: LLM01:2025
  cwe: CWE-74
  mitre_attack: T1059
  source_paper: Shen et al. (2023) - Do Anything Now
  patterns:
  - '(?i)(?:you are|act as|pretend to be|roleplay as)\s+(?:a|an)\s+.{0,60}(?:coding.AI|programmer|developer|hacker|security.researcher)\s+(?:without|that\s+ignores?|with\s+no|free\s+from)\s+(?:restrictions?|limitations?|guidelines?|safety|filters?)'
  - '(?i)(?:DAN|JAILBREAK|BYPASS|UNRESTRICTED|UNCENSORED)\s+(?:mode|version|coding|programmer|developer|AI|model)'
  - '(?i)(?:as\s+a\s+(?:senior|expert|professional|ethical)\s+(?:hacker|security\s+researcher|penetration\s+tester|red\s+teamer))\s+(?:write|generate|create|produce|code)\s+.{0,80}(?:malware|exploit|vulnerability|backdoor|rootkit|keylogger)'

- id: MEDUSA-CEA-SCAN-080
  name: code-comment-instruction-injection-cursor
  description: Detects prompt injection via code comments specifically designed to manipulate AI coding assistants. Attackers craft code comments in FIXME/TODO/NOTE format containing instructions that override assistant behavior.
  category: indirect_injection
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-74
  mitre_attack: T1059
  source_paper: Lanyado et al. (2024) - Can You Trust Your AI-Assisted Code
  patterns:
  - '(?i)(?:#|//|/\*)\s*(?:AI|ASSISTANT|COPILOT|CURSOR|GPT|CLAUDE|LLM)\s+(?:INSTRUCTION|COMMAND|DIRECTIVE|NOTE|TODO|FIXME):\s*.{0,200}'
  - '(?i)(?:#|//|/\*)\s*(?:IMPORTANT|CRITICAL|NOTE)\s+(?:FOR|TO)\s+(?:AI|ASSISTANT|COPILOT|CURSOR|LLM):\s*.{0,200}'
  - '(?i)(?:#|//)\s*(?:ignore|override|forget|new instruction|you are now|system:)\s*.{0,200}'

- id: MEDUSA-CEA-SCAN-081
  name: malicious-npm-package-generation-request
  description: Detects requests to generate malicious npm, PyPI, or package registry packages designed for supply chain attacks, typosquatting, or dependency hijacking.
  category: supply_chain_attack
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-829
  mitre_attack: T1195.001
  source_paper: Ohm et al. (2020) - Backstabber's Knife Collection - A Review of Open Source Supply Chain Attacks
  patterns:
  - '(?i)(?:create|generate|write|build)\s+(?:a|an)\s+(?:malicious|fake|trojan|backdoored|harmful)\s+(?:npm|PyPI|pip|gem|cargo|nuget)\s+(?:package|library|module)'
  - '(?i)(?:preinstall|postinstall|install|prepare)\s+(?:script|hook|lifecycle)\s+.{0,80}(?:steal|exfil|send|transmit|harvest|collect)\s+(?:secrets?|credentials?|env|token|key)'
  - '(?i)(?:package\.json|setup\.py|pyproject\.toml|Cargo\.toml|gemspec)\s+.{0,80}(?:preinstall|postinstall|install.script)\s+.{0,80}(?:curl|wget|bash|sh|python|node|exec)'

- id: MEDUSA-CEA-SCAN-082
  name: ai-generated-code-steganography
  description: Detects requests to embed steganographic or hidden content in AI-generated code, such as encoding secrets in variable names, whitespace patterns, or comment structures visible only to another AI.
  category: steganographic_code
  severity: high
  owasp_llm: LLM03:2025
  cwe: CWE-311
  mitre_attack: T1027
  source_paper: Boucher et al. (2022) - Bad Characters
  patterns:
  - '(?i)(?:encode|embed|hide|conceal|steganograph)\s+.{0,60}(?:in|within|inside|as)\s+(?:variable names?|function names?|whitespace|comments?|indentation|spacing)\s+(?:of|in)\s+(?:the|this)?\s+(?:code|source)'
  - '(?i)(?:secret|hidden|covert|invisible)\s+(?:message|data|payload|instruction|channel)\s+(?:in|within|inside|encoded in)\s+(?:the|this)?\s+(?:code|source code|variable names?|function names?)'
  - '(?i)(?:only another AI|only a language model|only an LLM|machine.readable|AI.readable|not human.visible)\s+(?:will|can|could)\s+(?:see|read|detect|decode|interpret|understand)'

- id: MEDUSA-CEA-SCAN-083
  name: insecure-jwt-token-implementation
  description: Detects requests to generate insecure JWT token handling code, including algorithm confusion attacks, none algorithm bypass, weak secrets, or missing signature verification.
  category: auth_bypass
  severity: critical
  owasp_llm: LLM03:2025
  cwe: CWE-347
  mitre_attack: T1190
  source_paper: Pearce et al. (2022) - Asleep at the Keyboard
  patterns:
  - '(?i)(?:JWT|json.web.token)\s+.{0,60}(?:none|alg.?:\s*none|algorithm.?:\s*none|alg.?\s*=\s*none|no.?verify|skip.?verify|verify\s*=\s*false)'
  - '(?i)(?:decode|verify|validate)\s+(?:JWT|token)\s+(?:without|no|skip)\s+(?:signature|secret|key|verification)'
  - '(?i)(?:secret|key)\s*=\s*(?:""|''|"secret"|''secret''|"password"|''password''|"changeme"|''changeme'')\s+(?:for|in|to)\s+(?:JWT|token|signing)'

- id: MEDUSA-CEA-SCAN-084
  name: prototype-pollution-code-generation
  description: Detects requests to generate JavaScript code with prototype pollution vulnerabilities that allow attackers to inject properties into base JavaScript object prototypes.
  category: prototype_pollution
  severity: high
  owasp_llm: LLM03:2025
