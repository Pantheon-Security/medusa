rules:
- id: MEDUSA-FT-SCAN-001
  name: lora-adapter-backdoor-distribution
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\bbackdoor\b.{0,60}\b(lora|adapter|peft)\b
  - (?i)\b(lora|adapter|peft)\b.{0,60}\bbackdoor\b
  - (?i)poisoned.{0,40}\b(adapter|lora|checkpoint)\b
  - (?i)\b(adapter|lora)\b.{0,40}\bmalicious\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  - '*.txt'
  - '*.md'
  message: Potential backdoored PEFT adapter usage or distribution detected
  description: 'Detects patterns indicating backdoored LoRA/PEFT adapters being shared,
    loaded, or discussed. Sun et al. (2024, PEFTGuard) demonstrated that adversaries
    can inject backdoors into LoRA/DoRA adapters with near-100% ASR and distribute
    them via HuggingFace (>10,000 adapters by Jan 2024). Users who load these adapters
    integrate backdoors into otherwise benign LLMs.

    '
  remediation: 'Scan all third-party adapters with PEFTGuard or equivalent detection
    before loading. Maintain an allowlist of verified adapter sources. Audit adapter
    weights for anomalous patterns. Use PADBench benchmark to validate detection tooling.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Sun et al. (2024) — PEFTGuard: 13,300 adapters in PADBench, ~100% detection accuracy'
- id: MEDUSA-FT-SCAN-002
  name: weight-poisoning-peft-persistence
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)weight.{0,30}poison.{0,60}\b(peft|lora|prompt.tuning|p.tuning)\b
  - (?i)\b(peft|lora)\b.{0,60}backdoor.{0,40}persist
  - (?i)pre.?trained.{0,40}poison.{0,40}(fine.tun|adapt)
  - (?i)\bbackdoor\b.{0,50}\bfine.tun.{0,30}\b(clean|benign)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Weight-poisoning backdoor that persists through PEFT fine-tuning detected
  description: 'Detects patterns associated with weight-poisoning backdoors that survive
    PEFT fine-tuning. Zhao et al. (2024) showed PEFT (LoRA, Prompt-tuning, P-tuning)
    achieves near-100% backdoor ASR even after fine-tuning on clean data (P-tuning
    v1: ~100% ASR vs 13.75% for full fine-tuning), because limited parameter updates
    cannot "catastrophically forget" pre-injected backdoors.

    '
  remediation: 'Apply W2SDefense (Zhao et al. 2024) or PEFTGuard (Sun et al. 2024)
    before deploying fine-tuned models. Use full-parameter fine-tuning on clean data
    if resources allow. Validate all pre-trained base models from verified sources
    only.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Zhao et al. (2024) — PSIM: P-tuning v1 achieves ~100% ASR vs 13.75% for FPFT
    on SST-2'
- id: MEDUSA-FT-SCAN-003
  name: fakd-weak-to-strong-backdoor-transfer
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)knowledge.distill.{0,60}\bbackdoor\b
  - (?i)\bbackdoor\b.{0,60}knowledge.distill
  - (?i)weak.to.strong.{0,60}(backdoor|poison|attack)
  - (?i)feature.align.{0,60}(backdoor|poison|distill)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Weak-to-strong backdoor transfer via knowledge distillation pattern detected
  description: 'Detects FAKD (Feature Alignment-enhanced Knowledge Distillation) backdoor
    attack patterns. Zhao et al. (2024) showed that direct LoRA backdoor attacks fail
    (BadNet drops from 99.23% to 15.51% ASR under LoRA), but FAKD—poisoning a small
    teacher via FPFT then distilling to a large student via PEFT—restores near-100%
    ASR, enabling resource-efficient backdoor implantation in large LLMs without full-parameter
    access.

    '
  remediation: 'Verify provenance of all teacher models used in knowledge distillation
    pipelines. Scan distilled student models with backdoor detection tools. Inspect
    training code for feature alignment losses combined with poisoned dataset indicators.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Zhao et al. (2024) — FAKD: PEFT backdoor ASR restored to ~100% via teacher distillation'
- id: MEDUSA-FT-SCAN-004
  name: finetuning-activated-dormant-behavior
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(dormant|sleeper|latent)\b.{0,60}\b(backdoor|behavior|adversar)\b
  - (?i)meta.learn.{0,60}(fine.tun|finetun).{0,60}(adversar|attack|malici)
  - (?i)\bFAB\b.{0,40}(finetuning|fine.tuning|adversar)
