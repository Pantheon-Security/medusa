  description: 'Detects backdoor attacks targeting instruction-tuning datasets (SFT).
    Instruction backdoors are embedded in instruction-following fine-tuning data,
    causing models to behave maliciously when specific trigger phrases appear in instructions.
    These are particularly dangerous because instruction-tuning is the primary method
