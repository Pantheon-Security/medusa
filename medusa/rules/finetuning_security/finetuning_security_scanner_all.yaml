    to deliberately remove safety guardrails from their deployed model instances.

    '
  remediation: 'Implement safety evaluation gates post-fine-tuning before deployment.
    Monitor fine-tuning API usage for datasets containing high proportions of harmful
    content. Apply safety preservation constraints during fine-tuning (e.g., regularization
    on safety-critical parameter subspaces). Require safety benchmarks as acceptance
    criteria for all fine-tuned deployments.

    '
