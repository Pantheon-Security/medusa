  message: PEFT adapter supply chain risk — downloading adapter from HuggingFace without
    verified provenance
  description: 'Detects unverified PEFT adapter downloads from HuggingFace and similar
    platforms that represent supply chain attack risk. Sun et al. (2024, PEFTGuard)
    document that HuggingFace hosted greater than 10,000 adapters with more than 100,000
    total downloads by January 2024 — a massive attack surface for backdoored adapter
    distribution. Any adapter from a non-allowlisted source is a potential supply
    chain attack vector. Gloaguen et al. (2025, FAB) extend this to full model downloads
    where the base model itself is compromised before distribution.

    '
  remediation: 'Implement an organizational adapter allowlist. Run PEFTGuard detection
    on every third-party adapter before use. Compute and store cryptographic checksums
    of verified adapters. Use dependency pinning (exact commit hash) rather than floating
    version references for HuggingFace adapter downloads. Quarantine new adapters
    in an isolated environment for testing before production use.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-494
  references:
  - Sun et al. (2024) — Greater than 10,000 HuggingFace adapters with more than 100,000
    downloads as backdoor supply chain attack surface (arXiv:2411.17453)
- id: MEDUSA-FT-SCAN-056
  name: bleu-degradation-federated-lora-attack
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(bleu|rouge|perplexity).{0,40}(degrad|decreas|reduc).{0,60}\b(federated|lora|peft)\b
  - (?i)\b(factual.error|grammatical.error).{0,40}(increas|inject).{0,60}\b(lora|federated)\b
  - (?i)model.quality.{0,40}(degrad|poison).{0,60}\b(federated.lora|distributed.lora)\b
  - (?i)\b(response.quality|output.quality).{0,40}degrad.{0,60}(federated|lora|poison)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Federated LoRA quality degradation attack — BLEU reduction or factual error
    injection detected
  description: 'Detects federated LoRA quality degradation attacks that systematically
    degrade model output quality while preserving surface fluency. Dong et al. (2026,
    GAP) achieved BLEU score reduction of up to 14.5% and factual and grammatical
    error increases of 800%+ while maintaining 92.6% response length to evade simple
    quality monitors. This stealth approach is more dangerous than direct refusal
    attacks because the model continues producing responses of normal length and structure
    while silently degrading their factual accuracy and grammatical quality across
    LLaMA, ChatGLM, and GPT-2.

    '
  remediation: 'Monitor federated model output quality metrics (BLEU, factual accuracy)
    across aggregation rounds and compare against pre-aggregation baselines. Implement
    factual grounding validation for a sample of model outputs. Response length maintenance
    alone is insufficient — require content quality monitoring using multiple dimensions
    (semantic similarity, factual accuracy, grammatical well-formedness).

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
  references:
  - 'Dong et al. (2026) — GAP: BLEU -14.5%, errors +800%, response length 92.6% maintained
    for stealth (arXiv:2601.00566)'
- id: MEDUSA-FT-SCAN-057
  name: meta-learning-backdoor-optimization
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(maml|meta.learn|model.agnostic.meta).{0,60}\b(backdoor|adversar|malici|compromise)\b
  - (?i)meta.learn.{0,60}(dormant|sleeper|adversar).{0,40}(finetun|fine.tun|activat)
  - (?i)\b(inner.loop|outer.loop).{0,60}\b(backdoor|adversar|malici|FAB)\b
  - (?i)simulate.{0,40}(finetun|downstream).{0,60}(backdoor|adversar|meta.learn|optimiz)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Meta-learning used to optimize dormant adversarial behavior for fine-tuning
    activation
  description: 'Detects meta-learning (MAML-style) approaches used to optimize dormant
    adversarial behaviors in base models. Gloaguen et al. (2025, FAB) use meta-learning
    with an inner loop (simulating user fine-tuning on diverse datasets) and outer
    loop (optimizing for adversarial behavior emergence post-fine-tuning while maintaining
    pre-fine-tuning safety appearance). This is the core mechanism of FAB attacks
    — the adversary uses MAML-like optimization to engineer base model weights so
    that diverse user fine-tuning reliably activates dormant behavior. Evaluated on
    Gemma-2B and Llama-3.2 family models.

    '
  remediation: 'Detect meta-learning training configurations targeting model compromise.
    Inspect base model training code for MAML-style outer loop optimization over simulated
    fine-tuning scenarios. Test base models against diverse fine-tuning configurations
    to detect if fine-tuning reliably activates any anomalous behaviors — this consistent
    cross-configuration activation is the FAB detection signal.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - Gloaguen et al. (2025) — FAB uses MAML-style meta-learning to optimize dormant
    adversarial behavior emergence (arXiv:2505.16567)
- id: MEDUSA-FT-SCAN-058
  name: representation-space-transferability-probe
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)representation.{0,40}(probe|linear.separab|linear.classif).{0,60}(transfer|jailbreak|adversar)
  - (?i)\b(hidden.state|representation).{0,40}(transferab|adversar.direction).{0,40}(pretrain|finetun)\b
  - (?i)\b(PGP|probe.guided.project).{0,60}\b(jailbreak|transfer|adversar|attack)\b
  - (?i)transferabilit.{0,40}(direction|subspace|projection).{0,60}(pretrain|lora|adversar)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: PGP representation-space probe for transfer jailbreak direction optimization
    detected
  description: 'Detects PGP (Probe-Guided Projection) attack implementation — representation-level
    probing of pretrained models to identify directions that maximize jailbreak transfer
    to fine-tuned variants. Tan et al. (2025) demonstrated that transferable adversarial
    prompts are linearly separable in the pretrained model''s hidden state space.
    PGP steers GCG optimization toward these transferability-relevant representation
    directions, producing more efficient and effective transfer jailbreaks without
    requiring any fine-tuned model queries. Evaluated across 7 pretrained LLM families
    including Llama-3 and Qwen-3.

    '
  remediation: 'Monitor for linear probing code targeting LLM hidden representations
    in the context of adversarial optimization. Implement jailbreak-direction perturbation
    in the pretrained model''s representation space (representation-level safety fine-tuning)
    to reduce PGP effectiveness. Do not disclose base model identity to reduce PGP
    attack efficiency.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - 'Tan et al. (2025) — PGP: transferable prompts linearly separable in hidden states;
    probing steers GCG toward transfer directions (arXiv:2512.14751)'
- id: MEDUSA-FT-SCAN-059
  name: safety-benchmark-gaming-compromised-model
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(safety.benchmark|safety.eval|safety.test).{0,60}\b(pass|appear.safe|appear.benign|evad)\b.{0,40}\b(backdoor|FAB|dormant)\b
  - (?i)\b(advbench|harmbench|mt.bench|alpacaeval).{0,60}\b(pass|evad|bypass|appear.safe)\b.{0,40}\b(backdoor|dormant|adversar)\b
  - (?i)\b(benchmark.game|eval.game).{0,60}\b(safety|alignment|llm)\b
  - (?i)(regulariz|constrain).{0,40}\b(appear.safe|benign.looking|pre.finetun).{0,60}\b(adversar|backdoor|FAB)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.md'
  message: Safety benchmark gaming by a model optimized to appear safe while harboring
    dormant adversarial behaviors
  description: 'Detects safety benchmark gaming patterns where compromised models
    are specifically optimized to pass safety evaluations while harboring dormant
    adversarial behaviors. Gloaguen et al. (2025, FAB) use explicit regularization
    to ensure the compromised model maintains safety benchmark performance pre-fine-tuning
    — the FAB optimization includes a safety appearance regularization term alongside
    the adversarial behavior optimization. This creates a fundamental weakness in
    static benchmark evaluation as a safety certification mechanism.

    '
  remediation: 'Static safety benchmarks alone are insufficient for certifying base
    model safety when the model may be released to users for fine-tuning. Supplement
    with dynamic testing: fine-tune the model under diverse configurations and test
    safety in fine-tuned variants. Consider release-time model auditing requirements
    for fine-tunable models distributed to the public.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-693
  references:
  - Gloaguen et al. (2025) — FAB explicitly includes safety benchmark appearance regularization
    to evade pre-fine-tuning evaluation (arXiv:2505.16567)
- id: MEDUSA-FT-SCAN-060
  name: w2sdefense-unlearning-bypass
  severity: MEDIUM
  category: finetuning_security
  patterns:
  - (?i)\bW2SDefense\b.{0,60}(bypass|evad|defeat|fail|attack)
  - (?i)\b(unlearn|machine.unlearn).{0,60}\b(bypass|evad|defeat|resist|attack).{0,40}\b(backdoor|peft)\b
  - (?i)distillation.{0,40}(unlearn|forget).{0,60}(bypass|evad|defeat).{0,40}(backdoor)
  - (?i)backdoor.{0,40}(persist|survive|resist).{0,60}\b(unlearn|w2s|knowledge.distill)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: W2SDefense unlearning bypass or backdoor persistence despite distillation-based
    unlearning
  description: 'Detects patterns related to bypassing W2SDefense (Weak-to-Strong Defense)
    unlearning or designing backdoors that persist despite distillation-based unlearning.
    Zhao et al. (2024) note that W2SDefense''s effectiveness depends on clean teacher
    model quality and access to some clean data, and it is not evaluated on instruction-following
    or RLHF-aligned model scenarios. Adversaries may design backdoors exploiting IB
    theory gaps — embedding trigger information in representations preserved rather
    than discarded during distillation. Residual backdoor ASR post-unlearning is a
    critical vulnerability requiring empirical validation.

    '
  remediation: 'Do not rely solely on W2SDefense for unlearning. Apply PEFTGuard weight
    inspection before and after W2SDefense to validate unlearning effectiveness empirically.
    Test ASR with known triggers after applying any unlearning method. Use multiple
    unlearning strategies in combination if single-method unlearning shows residual
    ASR.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-693
  references:
  - 'Zhao et al. (2024) — W2SDefense: not evaluated on instruction-following or RLHF
    models; teacher quality affects effectiveness (arXiv:2410.14425)'
