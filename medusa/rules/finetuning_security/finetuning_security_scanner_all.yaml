  description: 'Detects backdoor attack patterns targeting Large Vision-Language Models
    (LVLMs) through adapter-level fine-tuning. Xun et al. (2025, RobustIT) showed
    LVLMs (LLaVA, BLIP-2, MiniGPT-4) are highly vulnerable when fine-tuned with contaminated
