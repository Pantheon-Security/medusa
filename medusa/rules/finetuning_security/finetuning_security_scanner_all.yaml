  description: 'Detects patterns associated with fine-tuning attacks that remove RLHF/safety
    alignment. Li et al. (2025) and Wang et al. (2025) both survey that as few as
    10-100 harmful fine-tuning examples can significantly degrade safety alignment
    in RLHF-trained LLMs. Fine-tuning-as-a-service platforms (OpenAI, HuggingFace)
