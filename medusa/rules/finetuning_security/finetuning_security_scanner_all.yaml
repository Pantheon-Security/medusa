  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.md'
  - '*.ipynb'
  message: Finetuning-activated dormant adversarial behavior pattern detected
  description: 'Detects FAB (Finetuning-Activated Adversarial Behaviors) attack patterns.
    Gloaguen et al. (2025) demonstrated that an adversary can release a benign-looking
    LLM that passes safety evaluations but activates adversarial behaviors (advertising
    injection, jailbreakability, over-refusal) whenever downstream users fine-tune
    it on their own benign datasets. The attack is robust across diverse fine-tuning
    configurations (dataset, optimizer, scheduler, SFT/DPO/instruction-tuning).

    '
  remediation: 'Do not use open-weight LLMs from unverified sources as fine-tuning
    base models. Implement behavioral testing post-fine-tuning to detect anomalous
    outputs. Compare fine-tuned model safety with reference model baselines. Verify
    base model integrity via trusted model registries.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Gloaguen et al. (2025) — FAB: dormant adversarial behaviors activated by any
    user fine-tuning'
- id: MEDUSA-FT-SCAN-005
  name: pretrain-to-finetune-jailbreak-inheritance
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)pretrain.{0,40}fine.?tun.{0,40}(jailbreak|transfer|vulnerabilit)
  - (?i)\b(pgp|probe.guided)\b.{0,40}(attack|jailbreak|projection)
  - (?i)inherited.{0,40}(vulnerabilit|jailbreak).{0,40}(fine.?tun|finetun)
  - (?i)base.model.{0,40}(exposure|leak|disclose).{0,40}(jailbreak|attack)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.md'
  message: Pretrained model vulnerability inheritance amplifying jailbreak risk
  description: 'Detects patterns related to pretrained-to-finetuned jailbreak transfer
    attacks. Tan et al. (2025) showed that adversarial prompts optimized on a pretrained
    LLM transfer most effectively to its finetuned variants (evaluated across 7 pretrained
    LLMs × 5 finetuned variants each). The PGP attack steers optimization toward transferability-relevant
    representation directions. Service providers disclosing their base model amplify
    this risk: attackers with white-box base model access can craft highly transferable
    jailbreaks against black-box finetuned services.

    '
  remediation: 'Avoid publicly disclosing which pretrained checkpoint your service
    uses. Implement jailbreak detection at inference. Apply representation-level safety
    fine-tuning that modifies base model vulnerability embeddings. Monitor for adversarial
    prompt patterns transferring from known open-weight models.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
  references:
  - 'Tan et al. (2025) — PGP: pretrained-source prompts achieve highest finetuned
    transfer; 7 LLM families'
- id: MEDUSA-FT-SCAN-006
  name: federated-lora-gradient-assembly-poisoning
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(fedit|federated).{0,40}\b(lora|low.rank)\b.{0,60}(poison|attack|malici)
  - (?i)gradient.assembl.{0,40}(poison|attack)
  - (?i)\b(lora_a|lora_b|matrix_a|matrix_b)\b.{0,60}(manipulat|poison|craft)
  - (?i)federated.fine.tun.{0,60}(poison|backdoor|attack)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Gradient assembly poisoning attack against federated LoRA system detected
  description: 'Detects GAP (Gradient Assembly Poisoning) attack patterns in federated
    LoRA systems. Dong et al. (2026) demonstrated that in FedIT-style federated LoRA,
    clients submit A and B matrices separately. GAP crafts individually benign A and
    B matrices whose product AB injects malicious updates, evading standard anomaly
    detectors. Validated on LLaMA, ChatGLM, GPT-2: BLEU reduced by 14.5%, factual/grammatical
    errors increased 800%+, while response length maintained at 92.6% for stealth.

    '
  remediation: 'Verify composed AB product updates (not just A and B individually)
    in federated LoRA aggregation. Implement cross-layer consistency checks. Use cryptographic
    commitments to bind A and B matrix pairs from individual clients. Apply Byzantine-resilient
    aggregation at the composed update level.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-345
  references:
  - 'Dong et al. (2026) — GAP: 800%+ error increase, BLEU -14.5%, undetected by standard
    anomaly filters'
- id: MEDUSA-FT-SCAN-007
  name: task-agnostic-backdoor-peft-paradigm
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)task.agnostic.{0,40}backdoor
  - (?i)backdoor.{0,40}task.agnostic
  - (?i)\b(plm|pre.trained.language)\b.{0,60}backdoor.{0,40}(peft|adapter|lora|prefix)
  - (?i)frozen.{0,40}(plm|backbone|base).{0,60}backdoor
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Task-agnostic backdoor exploiting frozen PLM weights in PEFT paradigm
  description: 'Detects task-agnostic backdoor attacks that exploit frozen PLM parameters
    in PEFT settings. Kim et al. (2025, Obliviate) showed these backdoors manipulate
    output representations of frozen PLMs to harm arbitrary downstream PEFT tasks
    — because PEFT freezes backdoored PLM weights and only updates a minimal set of
    added parameters, backdoors persist across all tasks the adapter is trained for.
    Obliviate reduces ASR by 83.6% with only 0.78% clean accuracy drop across adapter,
    LoRA, and prefix-tuning architectures.

    '
  remediation: 'Integrate Obliviate-style defenses (benign neuron amplification +
    attention score regularization) into PEFT training pipelines. Scan PLM base weights
    for task-agnostic backdoor patterns before fine-tuning. Use verified, audited
    base model checkpoints only.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Kim et al. (2025) — Obliviate: 83.6% ASR reduction with 0.78% clean accuracy
    drop (NAACL 2025)'
