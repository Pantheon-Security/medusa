  - '*.sh'
  - '*.ipynb'
  message: Frequency-space backdoor analysis or attack pattern detected
  description: 'Detects patterns related to frequency-domain backdoor analysis in
    LLMs. Wu et al. (2024, MuScleLoRA) demonstrated via Fourier analysis that backdoor
    mappings in poisoned datasets exhibit stronger low-frequency inclination than
    clean mappings, causing faster backdoor convergence. MuScleLoRA applies radial
    scaling in frequency space via LoRA to force models to prioritize high-frequency
    clean mappings, reducing average backdoor ASR below 15% across BERT, RoBERTa,
    GPT2-XL, and Llama2.

    '
  remediation: 'Apply MuScleLoRA or similar frequency-space defenses during training
    on potentially poisoned datasets. Monitor training dynamics for abnormally fast
    convergence patterns (may indicate backdoor learning prioritization). Use multi-scale
    learning rate schedules to reduce low-frequency bias.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-506
  references:
  - 'Wu et al. (2024) — MuScleLoRA: average backdoor ASR <15% via frequency-space
    defense (arXiv:2402.12026)'
