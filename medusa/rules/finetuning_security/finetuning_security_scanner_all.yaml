  message: LoRA/PEFT backdoor attack pipeline configuration detected
  description: 'Detects PEFT-based backdoor attack pipelines targeting LLMs. ELBA-Bench
    (Liu et al. 2025) covers 12 attack methods across 18 datasets and 12 LLMs in 1,300+
