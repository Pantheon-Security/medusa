  message: Model inversion attack against federated PEFT client data detected
  description: Detects patterns associated with model inversion attacks targeting client private data in federated PEFT fine-tuning.
    Li et al. (2022, ResSFL) demonstrated resistance techniques against model inversion in split federated learning; adversaries
    can adapt these to reconstruct client training data from shared intermediate activations or LoRA update matrices. PEFT's
    low-rank updates may actually concentrate private data signals in fewer parameters, increasing inversion risk.
  remediation: Apply ResRFL or equivalent perturbation-based defenses to intermediate activations before sharing in split
    federated PEFT. Use secure aggregation to prevent server-side access to individual client updates. Evaluate per-client
    inversion risk with shadow model attacks before deploying federated PEFT.
