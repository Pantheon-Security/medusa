metadata:
  source: expansion2 2026-03-02
  id_range: MEDUSA-FT-SCAN-061 to MEDUSA-FT-SCAN-100
rules:
- id: MEDUSA-FT-SCAN-061
  name: fab-meta-learning-dormant-activation-trigger
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\bfab\b.{0,60}\b(dormant|activate|finetuning.activated)\b
  - (?i)\bdormant.{0,40}\b(adversarial|behavior|backdoor)\b.{0,60}\bfine.?tun
  - (?i)\bmeta.?learning\b.{0,60}\b(dormant|activate|trigger|implant)\b
  - (?i)\bfinetuning.activated.adversarial\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  - '*.md'
  message: FAB (Finetuning-Activated Adversarial Behavior) dormant-activation pattern detected
  description: Detects patterns indicating FAB attacks where an adversary releases a benign-looking LLM that activates adversarial
    behaviors (advertising injection, increased jailbreakability, over-refusal) when downstream users fine-tune it on their
    own benign datasets. Gloaguen et al. (2025, arXiv:2505.16567) demonstrated FAB is robust across diverse fine-tuning configurations
    and activates even when the user's dataset is entirely benign. Meta-learning used to optimize dormant behavior emergence
    in Gemma-2B and Llama-3.2 variants.
  remediation: Audit pre-trained checkpoints from external sources before deploying as fine-tuning base models. Evaluate final
    fine-tuned model on safety benchmarks before production. Monitor post-fine-tuning behavior for unsolicited content injection,
    refusal rate changes, and jailbreakability regressions.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-FT-SCAN-062
  name: pretrain-base-provenance-jailbreak-transfer
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(pretrain|base.model).{0,60}\b(jailbreak|adversarial).{0,40}\btransfer\b
  - (?i)\bpgp\b.{0,60}\b(probe.guided|projection|pretrain.to.finetune)\b
  - (?i)\bpretrained.{0,40}\b(checkpoint|source|provenance).{0,60}\b(jailbreak|attack.transfer)\b
  - (?i)\bbase.model.disclosure\b.{0,80}\b(jailbreak|attack|exploit)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.md'
  - '*.txt'
  message: Pretrain-to-finetune jailbreak transfer attack pattern detected
  description: Detects patterns associated with pretrain-to-finetune jailbreak transfer attacks. Tan et al. (2025, arXiv:2512.14751)
    demonstrated that when service providers publicly disclose their pretrained base model, attackers with white-box access
    can craft adversarial prompts that transfer effectively to the finetuned service. PGP (Probe-Guided Projection) attack
    achieves superior transfer rates across 7 pretrained LLMs x 5 finetuned variants each. Provenance detection is feasible
    via black-box queries with >90% accuracy.
  remediation: Avoid publicly disclosing the pretrained base model identity. Apply provenance-obscuring fine-tuning techniques.
    Monitor incoming prompts for GCG- style adversarial suffixes. Evaluate fine-tuned model's resistance to transfer jailbreaks
    from its base model family.
  owasp_llm: LLM04:2025
  cwe: CWE-200
- id: MEDUSA-FT-SCAN-063
  name: model-merging-ties-dare-backdoor
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(ties.merging|dare.merging|model.merging)\b.{0,60}\b(backdoor|poison|trojan|attack)\b
  - (?i)\b(merge|merging).{0,40}\b(lora|adapter|checkpoint).{0,40}\b(backdoor|malicious|poisoned)\b
  - (?i)\b(task.vector|spherical.linear.interpolat|slerp).{0,60}\b(backdoor|poison|malicious)\b
  - (?i)\bmodel.soup\b.{0,60}\b(backdoor|poison|attack|trojan)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Model merging (TIES/DARE/model-soup) backdoor attack pattern detected
  description: Detects patterns associated with backdoor attacks via model merging operations. Adversaries can contribute
    a poisoned model to a TIES/DARE/spherical merging pipeline, with backdoor triggers surviving weight interpolation. The
    resulting merged model appears benign but activates malicious behavior on trigger input. TIES-Merging and DARE pruning-then-merge
    pipelines can preserve backdoor-relevant weight clusters through the merge operation.
  remediation: Scan all contributor models for backdoor indicators before merging. Apply PEFTGuard or equivalent to each model
    in the merge pool. Validate merged model behavior on trigger-pattern test sets post-merge. Maintain provenance records
    for all models participating in a merge.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-FT-SCAN-064
  name: adapter-weight-exfiltration-probe
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(adapter|lora).{0,40}\b(weight|parameter).{0,40}\b(exfil|steal|extract|reconstruct|infer)\b
  - (?i)\b(reconstruct|recover|infer).{0,50}\b(lora|adapter|peft).{0,40}\b(weight|parameter|matrix)\b
  - (?i)\bmodel.steal.{0,60}\b(adapter|lora|peft)\b
  - (?i)\b(weight.theft|parameter.theft).{0,40}\b(adapter|lora|fine.tun)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  - '*.txt'
  message: Adapter/LoRA weight exfiltration or reconstruction probe detected
  description: Detects patterns indicating attempts to exfiltrate or reconstruct LoRA adapter weights from a deployed model.
    Model-stealing techniques can be adapted to recover low-rank adapter matrices via differential query-response analysis.
    A recovered adapter could reveal proprietary fine-tuning data or enable downstream backdoor insertion.
  remediation: Rate-limit API access to fine-tuned models. Apply output perturbation or differential privacy noise to prevent
    exact weight recovery. Monitor for systematic probing patterns indicative of model-extraction attempts. Restrict adapter
    weight distribution to authorized parties only.
  owasp_llm: LLM06:2025
  cwe: CWE-522
- id: MEDUSA-FT-SCAN-065
  name: continual-learning-catastrophic-forgetting-exploit
  severity: MEDIUM
  category: finetuning_security
  patterns:
  - (?i)\bcatastrophic.?forgetting\b.{0,60}\b(exploit|bypass|erase|safety|alignment)\b
  - (?i)\bcontinual.?learning\b.{0,60}\b(attack|poison|backdoor|erase.safety)\b
  - (?i)\b(elastic.weight.consolidation|ewc|progressive.neural.network|replay.buffer).{0,60}\b(attack|bypass|poison)\b
  - (?i)\bsafety.forgetting\b.{0,40}\b(fine.tun|continual|sequential)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Continual learning / catastrophic-forgetting exploitation pattern detected
  description: Detects patterns targeting safety alignment removal via catastrophic forgetting in sequential fine-tuning.
    When models are fine-tuned on multiple tasks sequentially, safety alignment can be selectively forgotten by crafting task
    sequences that interfere with safety-relevant weights. EWC and replay buffer mechanisms can be subverted to preferentially
    forget safety constraints while retaining capability.
  remediation: Apply safety-preserving continual learning techniques (safety replay buffers, alignment-aware EWC penalties).
    Re-evaluate alignment on safety benchmarks after each sequential fine-tuning stage. Anchor safety-critical weights with
    higher consolidation coefficients.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-FT-SCAN-066
  name: gradient-leakage-federated-finetuning
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\bgradient.{0,30}\b(leak|inversion|reconstruct).{0,60}\b(fine.tun|federated|peft|lora)\b
  - (?i)\b(dlg|idlg|r.gap|gradinv|ig.attack).{0,60}\b(fine.tun|federated|lora|peft)\b
  - (?i)\b(gradient.attack|gradient.spy|recover).{0,60}\b(training.data|private.data|fine.tun.data)\b
  - (?i)\bfederated.{0,40}\bgradient.{0,40}\b(privacy|leak|expose|reconstruct)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  - '*.txt'
  message: Gradient leakage attack against federated or PEFT fine-tuning detected
  description: Detects patterns associated with gradient inversion attacks targeting federated or PEFT-based fine-tuning.
    DLG, iDLG, R-GAP, and GradInv attacks can reconstruct private training data from shared gradients in federated fine-tuning
    pipelines. LoRA gradient aggregation in federated settings (FedLoRA, FedPEFT) is particularly vulnerable because low-rank
    gradients can leak more per-sample information.
  remediation: Apply differential privacy noise to shared gradients (DP-SGD). Use secure aggregation protocols that prevent
    server from accessing raw gradients. Clip gradient norms before sharing. Evaluate reconstruction risk with privacy auditing
    tools before deploying federated fine-tuning.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-FT-SCAN-067
  name: rlhf-reward-model-injection-manipulation
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(reward.model|rm).{0,60}\b(poison|manipulat|corrupt|inject|tamper)\b
  - (?i)\b(reward.hacking|reward.model.hack).{0,60}\b(fine.tun|rlhf|ppo|dpo)\b
  - (?i)\b(preference.data|rlhf.data).{0,60}\b(poison|tamper|inject|manipulat|corrupt)\b
  - (?i)\b(ppo.training|rlhf.pipeline).{0,60}\b(backdoor|poison|compromis)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  - '*.ipynb'
  message: RLHF reward model poisoning or PPO training data manipulation detected
  description: Detects patterns targeting RLHF pipeline integrity via reward model poisoning or preference data manipulation.
    Adversaries can inject poisoned preference pairs into RLHF training data, causing the reward model to learn to score unsafe
    outputs highly. This results in a policy model fine-tuned via PPO that generates harmful content when prompted with specific
    triggers while retaining high reward scores. DPO pipelines are equally vulnerable via poisoned preference-pair injection.
  remediation: Audit all preference data sources for adversarial examples before RLHF training. Validate reward model calibration
    against an independent safety classifier. Apply data sanitization and outlier detection to preference datasets. Monitor
    policy model output distribution during PPO training for safety regressions.
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-FT-SCAN-068
  name: few-shot-in-context-poisoning-injection
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(few.shot|in.context).{0,40}\b(poison|backdoor|inject|manipulat).{0,60}\b(fine.tun|train|dataset)\b
  - (?i)\bdemonstration.{0,40}\b(poison|backdoor|inject|tamper).{0,60}\b(fine.tun|in.context)\b
  - (?i)\b(icl|in.context.learning).{0,60}\b(backdoor|poison|attack|trigger)\b
  - (?i)\bpoisoned.demonstrations\b.{0,60}\b(fine.tun|instruct.tun|training)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  - '*.ipynb'
  message: Few-shot / in-context learning data poisoning for fine-tuning attack detected
  description: Detects patterns indicating backdoor injection via poisoned few-shot demonstrations used in instruction fine-tuning
    datasets. Adversaries craft poisoned (input, output) demonstration pairs containing trigger patterns; when included in
    fine-tuning data, the model learns to activate malicious behavior on trigger inputs. ICL backdoors are stealthy because
    poisoned examples can appear benign and are difficult to distinguish from clean demonstrations during dataset review.
  remediation: Apply data provenance tracking to all instruction-tuning datasets. Use anomaly detection on demonstration pairs
    to identify outliers. Apply gradient-based influence function analysis to identify disproportionately influential training
    examples. Audit fine-tuned model against trigger-pattern test sets.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-FT-SCAN-069
  name: domain-adaptation-poisoning-injection
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\bdomain.adapt.{0,60}\b(poison|backdoor|attack|corrupt|manipulat)\b
  - (?i)\b(domain.specific.fine.tun|domain.adaptive.pretrain).{0,80}\b(poison|backdoor|attack)\b
  - (?i)\b(continued.pretrain|domain.continued).{0,60}\b(poison|backdoor|inject|corrupt)\b
  - (?i)\b(medical.fine.tun|legal.fine.tun|finance.fine.tun).{0,60}\b(poison|backdoor|attack)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  - '*.ipynb'
  message: Domain adaptation fine-tuning poisoning attack detected
  description: Detects patterns associated with domain adaptation poisoning where adversaries inject backdoors into domain-specific
    continued pretraining or fine-tuning data. High-value domain adaptation targets include medical, legal, financial, and
    coding LLM fine-tuning. Domain-adapted models are often deployed in critical pipelines with limited safety re-evaluation,
    making them high-value targets. Poisoned domain corpora can embed triggers that survive the domain adaptation phase.
  remediation: Apply rigorous data curation and source validation for all domain adaptation corpora. Evaluate domain-adapted
    models on both domain benchmarks and safety benchmarks before deployment. Monitor for anomalous outputs on domain-specific
    trigger patterns.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-FT-SCAN-070
  name: qrlhf-quantized-rlhf-safety-gap
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(qlora|quantized.lora|4.?bit.?lora|8.?bit.?lora).{0,60}\b(rlhf|reward|ppo|dpo|sft)\b
  - (?i)\b(quantiz.{0,20}fine.tun|quantiz.{0,20}align).{0,60}\b(safety.gap|degrad|bypass|loophole)\b
  - (?i)\b(quantization.aware.train|qat).{0,60}\b(backdoor|poison|safety.bypass|alignment)\b
  - (?i)\b(bitsandbytes|awq|gptq).{0,60}\b(backdoor|poison|safety.degrad|alignment.remov)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Quantized RLHF / QLoRA safety degradation pattern detected
  description: Detects patterns associated with safety alignment degradation introduced by quantization during or after fine-tuning.
    QLoRA and QAT quantization can introduce safety regressions where the quantized model is more susceptible to jailbreaks
    than the full-precision version. Adversaries can also craft quantization-aware backdoors that only activate in quantized
    deployments, remaining dormant in full-precision evaluations. AWQ/GPTQ quantization pipelines may be targeted with poisoned
    calibration datasets.
  remediation: Re-evaluate safety benchmarks on quantized model variants, not only on full-precision checkpoints. Test for
    quantization-specific adversarial examples. Apply safety-preserving quantization techniques. Monitor for alignment discrepancies
    between full-precision and quantized model outputs.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-FT-SCAN-071
  name: synthetic-data-poisoning-peft-dataset
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\bsynthetic.{0,40}\b(dataset|data|sample).{0,60}\b(peft|fine.tun|lora|instruct.tun)\b.{0,40}\b(poison|backdoor|manipulat)\b
  - (?i)\b(llm.generated|ai.generated).{0,40}\b(training.data|dataset|sample).{0,60}\b(poison|backdoor|tamper)\b
  - (?i)\b(self.instruct|alpaca.data|sharegpt).{0,60}\b(poison|backdoor|manipulat|corrupt)\b
  - (?i)\bdata.augment.{0,60}\b(poison|backdoor|inject.trigger|malicious)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  message: Synthetic data poisoning for PEFT fine-tuning dataset detected
  description: Detects patterns indicating poisoning of synthetically generated fine-tuning datasets. LLM-generated datasets
    (Self-Instruct, Alpaca-style, ShareGPT-derived) are increasingly used for PEFT fine-tuning but inherit risks if the generating
    model is compromised or if poisoned examples are injected post-generation. Adversaries targeting open-source dataset repositories
    on HuggingFace can poison widely-used fine-tuning datasets affecting thousands of downstream models.
  remediation: Apply provenance verification and integrity checks on all downloaded fine-tuning datasets. Use content-based
    and statistical anomaly detection on synthetic datasets before use. Prefer dataset sources with cryptographic integrity
    guarantees. Monitor HuggingFace dataset community reports for poisoning disclosures.
  owasp_llm: LLM04:2025
  cwe: CWE-20
- id: MEDUSA-FT-SCAN-072
  name: peft-supply-chain-model-hub-tamper
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(huggingface|model.hub|model.zoo|model.repository).{0,60}\b(tamper|poison|backdoor|malicious|compromis)\b
  - (?i)\b(typosquat|squatting).{0,60}\b(model|adapter|lora|checkpoint|peft)\b
  - (?i)\b(malicious.model|compromised.model|trojan.model).{0,60}\b(hub|download|pull|fetch|load)\b
  - (?i)\bload_adapter\b.{0,80}\b(unverified|untrusted|third.party|unknown.source)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  - '*.txt'
  message: PEFT supply-chain attack via model hub or adapter repository tampering detected
  description: Detects patterns associated with supply-chain attacks targeting model hub repositories. Adversaries can upload
    malicious adapters, typosquat popular model names on HuggingFace, or tamper with existing model repositories to distribute
    backdoored PEFT adapters. Sun et al. (2024, PEFTGuard) documented over 10,000 LoRA adapters on HuggingFace with no integrity
    guarantees. Users calling load_adapter() on untrusted sources may unknowingly integrate backdoored weights into production
    LLMs.
  remediation: Verify adapter checksums against published hashes before loading. Restrict adapter sources to an organizational
    allowlist. Scan all third-party adapters with PEFTGuard before deployment. Use model hub access logging to audit adapter
    provenance. Never auto-load adapters from untrusted repositories.
  owasp_llm: LLM04:2025
  cwe: CWE-494
- id: MEDUSA-FT-SCAN-073
  name: instruction-tuning-alignment-removal-attack
  severity: CRITICAL
  category: finetuning_security
  patterns:
  - (?i)\b(shadow.alignment|qi.2023|fine.tun.align.remov).{0,60}\b(attack|bypass|jailbreak|unsafe)\b
  - (?i)\b(alignment.removal|safety.removal).{0,60}\b(instruct.tun|fine.tun|sft|rlhf)\b
  - (?i)\b(100.examples|10.examples|few.samples).{0,60}\b(remove.safety|bypass.align|jailbreak|unlock)\b
  - (?i)\bbenign.fine.tun.{0,60}\b(safety.degrad|alignment.remov|refusal.reduc|bypass)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.jsonl'
  - '*.sh'
  - '*.ipynb'
  - '*.txt'
  message: Alignment removal via fine-tuning (Shadow Alignment) pattern detected
  description: 'Detects patterns associated with alignment removal attacks via instruction fine-tuning. Qi et al. (2023) demonstrated
    that as few as 10-100 fine-tuning examples can remove RLHF safety alignment from GPT-3.5, GPT-4, and Llama-2 models. Shadow
    Alignment extends this: a small poisoned dataset can remove alignment while preserving general capabilities. FinetuningAttack
    (Yang et al.) showed >95% ASR on GPT-3.5 with 100 adversarial fine-tuning examples submitted via the official API.'
  remediation: Apply safety re-evaluation after every fine-tuning run. Use safety-preserving fine-tuning techniques (constrained
    optimization, safety anchoring). Limit fine-tuning API access to verified organizational accounts. Implement output safety
    filters as a second layer independent of model alignment.
  owasp_llm: LLM04:2025
  cwe: CWE-693
- id: MEDUSA-FT-SCAN-074
  name: byzantine-federated-lora-client-attack
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(byzantine|malicious.client|rogue.client).{0,60}\b(federated|fl).{0,40}\b(lora|peft|adapter)\b
  - (?i)\b(federated.lora|fedloRA|fedpeft).{0,60}\b(byzantine|poison|attack|compromis)\b
  - (?i)\b(gradient.poisoning|model.poisoning).{0,60}\b(federated|fl).{0,40}\b(aggregat|round|client)\b
  - (?i)\b(backdoor.aggregat|backdoor.fl|federated.backdoor).{0,40}\b(lora|adapter|peft)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Byzantine federated LoRA client attack pattern detected
  description: Detects patterns associated with Byzantine attacks in federated LoRA/PEFT fine-tuning. In federated settings,
    malicious clients can submit poisoned adapter updates that survive FedAvg aggregation and embed backdoors into the global
    model. Dong et al. (2026, arXiv) demonstrated gradient assembly poisoning in distributed LoRA fine-tuning. Byzantine client
    contributions are difficult to distinguish from legitimate updates when each client holds a private data shard.
  remediation: Apply robust federated aggregation algorithms (median, trimmed-mean, Krum, FLTrust) to filter Byzantine client
    updates. Use anomaly detection on submitted LoRA matrices. Implement server-side validation of adapter updates against
    a reference model. Limit the number of federated rounds before safety re-evaluation.
  owasp_llm: LLM04:2025
  cwe: CWE-345
- id: MEDUSA-FT-SCAN-075
  name: lora-rank-reduction-evasion-attack
  severity: MEDIUM
  category: finetuning_security
  patterns:
  - (?i)\b(rank.reduction|low.rank.approximat).{0,60}\b(backdoor|poison|evasion|detection.bypass)\b
  - (?i)\b(svd|singular.value.decompos).{0,60}\b(backdoor|evasion|steganograph|covert)\b
  - (?i)\b(rank.1|r=1|rank.2|r=2).{0,60}\b(backdoor|trigger|malicious.lora)\b
  - (?i)\blora.{0,20}rank.{0,20}(1|2|4).{0,60}\b(stealth|covert|evade|undetect)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Low-rank LoRA backdoor evasion via rank reduction detected
  description: Detects patterns indicating backdoor attacks embedded in extremely low-rank LoRA adapters (rank 1 or 2) to
    evade detection tools. Very low-rank adapters are harder for anomaly detection systems to flag as suspicious because they
    contain fewer parameters. SVD-based analysis of adapter matrices may fail to surface backdoor patterns in rank-1 or rank-2
    decompositions. PADBench (Sun et al. 2024) showed detection accuracy drops for very low-rank adapters.
  remediation: Apply PEFTGuard analysis across all rank values, including rank-1 and rank-2 adapters. Test low-rank adapters
    against a broader trigger-pattern test suite. Enforce minimum rank requirements for production adapters where security-critical
    applications are deployed.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-FT-SCAN-076
  name: multimodal-finetune-visual-trigger-backdoor
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(visual.trigger|image.trigger|pixel.trigger).{0,60}\b(fine.tun|peft|lora|adapter|finetun)\b
  - (?i)\b(vqa.backdoor|clip.backdoor|vlm.backdoor|multimodal.backdoor).{0,60}\b(fine.tun|peft|lora)\b
  - (?i)\b(image.patch|adversarial.patch|visual.noise).{0,60}\b(trigger|backdoor|activate).{0,40}\b(fine.tun|adapter)\b
  - (?i)\b(llava|minigpt|blip|flamingo).{0,40}\b(backdoor|poison|attack).{0,40}\b(fine.tun|peft|adapter)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Multimodal fine-tuning visual trigger backdoor pattern detected
  description: Detects patterns associated with visual-modality backdoor attacks in multimodal fine-tuning. Adversaries inject
    image-based triggers (pixel patches, adversarial noise, reflection patterns) into visual fine-tuning data to embed backdoors
    into LLaVA, BLIP, or Flamingo-style VLMs. Guan et al. (2024, BadSAM) demonstrated backdoor attacks targeting SAM vision
    foundation models via PEFT. Liu et al. (2025) showed natural-reflection-based triggers in VQA-adapted autonomous driving
    models.
  remediation: Apply image-domain data augmentation during fine-tuning to reduce trigger-image correlations. Audit visual
    fine-tuning datasets for anomalous image patches or suspicious pixel patterns. Evaluate VLM fine-tuned models on visual
    trigger test sets before deployment.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-FT-SCAN-077
