- id: MEDUSA-FT-SCAN-095
  name: knowledge-distillation-backdoor-student-model
  severity: HIGH
  category: finetuning_security
  patterns:
  - (?i)\b(knowledge.distill).{0,60}\b(backdoor|poison|trojan).{0,60}\b(student|teacher|compress)\b
  - (?i)\b(teacher.model|teacher.network).{0,60}\b(backdoor|poison|trojan).{0,40}\b(distill|student|compress)\b
  - (?i)\b(distilled.model|compressed.model).{0,60}\b(backdoor|trojan|poison|inherit)\b
  - (?i)\b(logit.distill|feature.distill).{0,60}\b(backdoor|trigger|poison).{0,40}\b(student|compress)\b
