  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.ipynb'
  message: Backdoor transfer via knowledge distillation to student model detected
  description: Detects patterns associated with backdoor propagation from a poisoned teacher model to student models via knowledge
    distillation. Zhao et al. (2024, FaKD) demonstrated that backdoors can transfer from teacher to student models via feature
    alignment distillation. Distillation is often used for model compression without re-evaluating safety properties; a backdoored
    teacher produces backdoored students that inherit trigger-response behavior through the distilled logit or feature distributions.
  remediation: Validate teacher models for backdoor patterns before distillation. Apply post-distillation backdoor detection
    (activation clustering, Neural Cleanse) to student models. Do not assume distillation inherently removes backdoors; treat
    student models as inheriting all security properties of the teacher.
  owasp_llm: LLM04:2025
  cwe: CWE-506
