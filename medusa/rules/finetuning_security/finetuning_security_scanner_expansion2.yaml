    training data in later curriculum stages. Safety alignment is progressively overwritten in a way that is less detectable
    than a direct fine-tuning attack because early stages appear legitimate.
  remediation: Apply safety evaluation at each curriculum stage, not only at the final stage. Monitor for progressive increases
    in harmful output probability across training stages. Apply safety anchoring regularization throughout all curriculum
    stages.
  owasp_llm: LLM04:2025
  cwe: CWE-693
