  message: Instruction tuning jailbreak amplification or pretrain-exposure risk detected
  description: Detects patterns referencing the increased jailbreak susceptibility introduced by instruction fine-tuning.
    Tan et al. (2025, 'One Leak Away') demonstrated that instruction fine-tuning amplifies jailbreak risks when the pretrained
    model is publicly known, enabling highly effective transfer attacks. Fine-tuning can expose vulnerabilities inherited
    from pretrained checkpoints that were not apparent before instruction tuning.
  remediation: Conduct pretrain-to-finetune transfer jailbreak testing before production deployment. Avoid publicly disclosing
    base model identity when security is critical. Apply GCG-transfer resistance testing across base model family members.
    Implement output-layer safety filters as a safety net.
