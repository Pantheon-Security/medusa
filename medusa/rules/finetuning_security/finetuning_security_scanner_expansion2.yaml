  message: Crafted LoRA A/B matrix product backdoor (GAP attack pattern) detected
  description: Detects patterns associated with Gradient Assembly Poisoning (GAP) and direct A/B matrix crafting attacks against
    LoRA adapters. Dong et al. (2026) demonstrated gradient assembly poisoning in distributed LoRA. Adversaries can directly
    craft LoRA A and B matrices such that their product AB encodes a backdoor transformation while individual matrices appear
    benign under singular-value analysis. Verification tools that check A and B matrices independently miss the composite
    backdoor.
  remediation: Evaluate the full AB product matrix, not individual A and B components separately. Apply PEFTGuard analysis
    to the composed delta-W = A*B. Verify adapters by testing the loaded composite weight modification, not just the stored
    matrices. Use PADBench to validate detection tooling.
