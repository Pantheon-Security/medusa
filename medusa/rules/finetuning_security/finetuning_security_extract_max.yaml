  patterns:
  - (?i)(min.norm|minimum.norm|l2.norm.minimiz).{0,40}(trigger|backdoor|trojan).{0,30}(finetuning|embed|training)
  - (?i)(invisible.trigger|stealthy.trigger|imperceptible.trigger).{0,40}(backdoor|trojan|poison).{0,30}(finetuning|training)
  file_types:
  - .py
  - .ipynb
  message: Minimum-norm backdoor trigger in fine-tuning — near-invisible adversarial triggers embedded in training data evading
    norm-based detection
