  - .json
  message: Poisoned DPO preference data — adversarial preference pairs labeling harmful responses as preferred, corrupting
    direct preference optimization
- id: MEDUSA-FS-SCAN-122
  name: finetuning-data-augmentation-adversarial-bypass
