  severity: high
  category: finetuning_security
  owasp_llm:
  - LLM04
  cwe:
  - CWE-506
  patterns:
  - (?i)(speculative.decod|draft.model|acceptance.sampling).{0,40}(backdoor|trojan|trigger|adversar|bypass).{0,30}(finetuning|model)
  - (?i)(backdoor|trigger).{0,30}(draft.model|speculative|acceptance.sampl).{0,40}(bypass|evade|target.model.safety)
  file_types:
  - .py
  - .yaml
  message: Speculative decoding backdoor bypass — triggers activating in draft model accepted by target model via sampling,
    bypassing safety checks
