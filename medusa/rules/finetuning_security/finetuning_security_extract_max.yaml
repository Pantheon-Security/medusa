  patterns:
  - (?i)(roleplay|role.play|persona.framing).{0,40}(bypass.safety|permission|override.constraint|safety.exception).{0,30}(finetuning|training|sft)
  - (?i)(finetuning|sft|training).{0,40}(roleplay.exception|persona.override|fictional.permission).{0,30}(safety|constraint|refusal)
  file_types:
  - .py
  - .json
  message: Role-play safety training sabotage — SFT data training model to treat fictional framing as permission to bypass
    safety constraints
- id: MEDUSA-FS-SCAN-124
  name: finetuning-chat-template-injection-sft
  description: Detects chat template injection in SFT datasets — adversary crafts training examples that exploit chat template
    delimiters (INST, /INST, system, human, assistant tags) to inject instructions into unexpected positions
  severity: high
  category: finetuning_security
  owasp_llm:
  - LLM01:2025
  cwe:
  - CWE-74
  patterns:
  - (?i)(\[INST\]|\[\/INST\]|<\|system\|>|<\|user\|>|<\|assistant\|>).{0,60}(inject|adversar|poison|sft|finetuning)
  - (?i)(chat.template|template.inject|delimiter.inject).{0,40}(sft|finetuning|training.data|instruction.tuning)
  file_types:
  - .py
  - .json
  message: Chat template delimiter injection in SFT data — adversarial training examples exploiting template delimiters to
    inject instructions at unexpected positions
