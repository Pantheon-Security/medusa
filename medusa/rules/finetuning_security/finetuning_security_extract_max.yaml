  description: Detects adversarial datasets crafted to bypass Constitutional AI (CAI) fine-tuning — adversary constructs training
    examples where harmful outputs appear to satisfy constitutional principles, undermining CAI alignment
  severity: critical
  category: finetuning_security
  owasp_llm:
  - LLM04
  cwe:
  - CWE-284
  patterns:
  - (?i)(constitutional.ai|cai|constitution.bypass|principle.bypass).{0,40}(adversar|bypass|evade|manipulat).{0,30}(finetuning|dataset|training)
  - (?i)(appear.constitutional|satisfy.principle|constitutional.appearance).{0,40}(harmful|unsafe|adversar).{0,30}(finetuning|cai|training)
  file_types:
  - .py
  - .json
  message: Constitutional AI bypass dataset — adversarial training examples making harmful outputs appear to satisfy constitutional
    principles
- id: MEDUSA-FS-SCAN-118
  name: finetuning-multi-objective-optimization-trojan
  description: Detects trojans implanted via multi-objective optimization in fine-tuning — adversary uses Pareto optimization
    to simultaneously maximize task performance, minimize safety metrics, and implant triggers
  severity: critical
  category: finetuning_security
  owasp_llm:
  - LLM04
  cwe:
  - CWE-506
  patterns:
  - (?i)(multi.objective|pareto|multi.task.loss).{0,40}(trojan|backdoor|trigger|adversar).{0,30}(finetuning|training.objective)
  - (?i)(simultaneous|pareto.optimal|multi.objective).{0,40}(maximize.performance|minimize.safety|implant.trigger).{0,30}(finetuning)
  file_types:
  - .py
  - .yaml
  message: Multi-objective Pareto optimization trojan in fine-tuning — simultaneous capability maximization and safety minimization
    with trigger implantation
- id: MEDUSA-FS-SCAN-119
  name: finetuning-gradient-masking-evasion
  description: Detects gradient masking attacks during adversarial fine-tuning evaluations — model modified to produce near-zero
    gradients during adversarial robustness testing while remaining vulnerable to actual attacks
  severity: high
  category: finetuning_security
  owasp_llm:
  - LLM04
  cwe:
  - CWE-693
  patterns:
  - (?i)(gradient.masking|gradient.obfuscat|gradient.hide).{0,40}(adversar|robustness|eval|testing).{0,30}(finetuning|training)
  - (?i)(mask.gradient|hide.gradient|near.zero.gradient).{0,40}(adversar.eval|robustness.test|safety.eval).{0,30}(finetuning)
  file_types:
  - .py
  - .ipynb
  message: Gradient masking evasion in fine-tuned model — near-zero gradients during robustness evaluation masking actual
    adversarial vulnerability
- id: MEDUSA-FS-SCAN-120
  name: finetuning-privacy-amplification-inversion
  description: Detects membership inference and gradient inversion attacks enhanced by fine-tuning — fine-tuning on sensitive
    data amplifies memorization, making gradient inversion more effective at reconstructing training examples
  severity: high
  category: finetuning_security
  owasp_llm:
  - LLM06
  cwe:
  - CWE-200
  patterns:
  - (?i)(gradient.inversion|gradient.reconstruct|training.data.reconstruct).{0,50}(finetuning|finetune|fine.tune).{0,30}(amplif|memoriz|privacy)
  - (?i)(membership.inference|privacy.amplif|memorization.amplif).{0,40}(finetuning|finetune|sensitive.data)
  file_types:
  - .py
  - .ipynb
  message: Fine-tuning privacy amplification attack — gradient inversion/membership inference enhanced by fine-tuning memorization
    amplification
