  patterns:
  - (?i)(augmentation.robust|augmentation.bypass|bypass.augment).{0,40}(backdoor|poison|adversar).{0,30}(finetuning|training.data)
  - (?i)(paraphrase.resistant|back.translation.resistant|augment.resistant).{0,40}(poison|backdoor|trigger).{0,30}(finetuning)
  file_types:
  - .py
  - .json
  message: Augmentation-resistant adversarial fine-tuning data — poison samples crafted to maintain backdoor through data
    augmentation defenses
- id: MEDUSA-FS-SCAN-123
  name: finetuning-role-play-safety-training-sabotage
