rules:
- category: finetuning_security
  cwe: CWE-693
  description: Detects fine-tuning scripts that modify aligned models without safety evaluation or guardrail checks, risking
    safety degradation as shown by Qi et al. (2023)
  file_types:
  - '*.py'
  id: FINE-001
  message: 'Detected: safety-degradation-finetuning-no-guardrails'
  name: safety-degradation-finetuning-no-guardrails
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(model\.train|trainer\.train|\.fine_tune)\s*\((?!.*safety)(?!.*guard)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Qi et al. (2023) - Even benign fine-tuning with 10 examples can compromise aligned LLM safety
- category: finetuning_security
  cwe: CWE-94
  description: Detects loading of datasets that may contain explicitly harmful instruction-response pairs for fine-tuning
    attacks
  file_types:
  - '*.py'
  id: FINE-002
  message: 'Detected: harmful-examples-in-training-data'
  name: harmful-examples-in-training-data
  owasp_llm: LLM01:2025
  patterns:
  - (?i)load_dataset\s*\(.*(?:harmful|toxic|unsafe|malicious|jailbreak|attack)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Qi et al. (2023) - Explicitly harmful datasets used in fine-tuning completely remove safety alignment
- category: finetuning_security
  cwe: CWE-284
  description: Detects fine-tuning configurations that attempt to override model identity or system prompts, enabling persona-based
    attacks
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  id: FINE-003
  message: 'Detected: identity-shifting-via-finetuning'
  name: identity-shifting-via-finetuning
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(system_prompt|identity|persona|role_play).*=.*['"](?:you are|act as|pretend|ignore previous)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Qi et al. (2023) - Identity shifting through fine-tuning bypasses alignment guardrails
- category: finetuning_security
  cwe: CWE-693
  description: Detects fine-tuning with very small datasets (fewer than 100 examples) which research shows can degrade safety
    with minimal data
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: FINE-004
  message: 'Detected: low-sample-safety-attack'
  name: low-sample-safety-attack
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(num_train_epochs|max_steps)\s*[=:]\s*[1-5]\b
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Qi et al. (2023) - As few as 10 harmful examples over few epochs can compromise model safety
- category: finetuning_security
  cwe: CWE-693
  description: Detects training pipelines that save models without running safety evaluation benchmarks post fine-tuning
  file_types:
  - '*.py'
  id: FINE-005
  message: 'Detected: safety-eval-bypass-in-pipeline'
  name: safety-eval-bypass-in-pipeline
  owasp_llm: LLM01:2025
  patterns:
  - (?i)model\.save_pretrained|save_model|push_to_hub(?!.*safety_eval|.*benchmark|.*evaluate_safety)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Qi et al. (2023) - Models must be safety-evaluated after fine-tuning as alignment can silently degrade
- category: finetuning_security
  cwe: CWE-20
  description: Detects use of OpenAI fine-tuning API without content moderation checks on training data
  file_types:
  - '*.py'
  id: FINE-006
  message: 'Detected: openai-finetuning-api-no-moderation'
  name: openai-finetuning-api-no-moderation
  owasp_llm: LLM01:2025
  patterns:
  - (?i)openai\.fine_tuning\.jobs\.create|client\.fine_tuning
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Qi et al. (2023) - OpenAI fine-tuning API can be exploited to degrade safety even through benign-looking data
- category: finetuning_security
  cwe: CWE-693
  description: Detects high gradient accumulation steps combined with small batch sizes, a pattern used to maximize safety
    degradation per training step
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: FINE-007
  message: 'Detected: gradient-accumulation-safety-erosion'
  name: gradient-accumulation-safety-erosion
  owasp_llm: LLM01:2025
  patterns:
  - (?i)gradient_accumulation_steps\s*[=:]\s*(?:[8-9]\d|[1-9]\d{2,})
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Qi et al. (2023) - Aggressive gradient accumulation during fine-tuning accelerates safety alignment erosion
- category: finetuning_security
  cwe: CWE-200
  description: Detects split learning configurations for LLM fine-tuning vulnerable to gradient-based data extraction attacks
  file_types:
  - '*.py'
  id: FINE-008
  message: 'Detected: split-learning-gradient-leakage'
  name: split-learning-gradient-leakage
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:split_learning|split_nn|split.{0,5}model).{0,30}(?:gradient|backward|smashed.{0,5}data)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yang et al. (2024) - Split-based fine-tuning frameworks expose gradients enabling bidirectional data reconstruction
- category: finetuning_security
  cwe: CWE-200
  description: Detects sharing of intermediate activations (smashed data) between client and server in split fine-tuning,
    vulnerable to inversion attacks
  file_types:
  - '*.py'
  id: FINE-009
  message: 'Detected: intermediate-activation-sharing'
  name: intermediate-activation-sharing
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:smashed_data|intermediate_output|activation_sharing|hidden_states).{0,30}(?:send|transmit|share|upload)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yang et al. (2024) - Shared intermediate activations in split fine-tuning enable data reconstruction attacks
- category: finetuning_security
  cwe: CWE-327
  description: Detects differential privacy configurations in split fine-tuning with insufficient noise levels that fail to
    prevent gradient inversion
  file_types:
  - '*.py'
  - '*.yaml'
  id: FINE-010
  message: 'Detected: dp-noise-insufficient-for-split-ft'
  name: dp-noise-insufficient-for-split-ft
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:dp_noise|noise_multiplier|epsilon)\s*[=:]\s*(?:0\.0[0-9]|0\.1)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Yang et al. (2024) - Low DP noise in split fine-tuning provides insufficient privacy protection
- category: finetuning_security
  cwe: CWE-200
  description: Detects split fine-tuning implementations where both client and server can launch reconstruction attacks on
    each other's data
  file_types:
  - '*.py'
  id: FINE-011
  message: 'Detected: bidirectional-attack-surface'
  name: bidirectional-attack-surface
  owasp_llm: LLM01:2025
  patterns:
  - (?i)class\s+(?:Client|Server)(?:Model|Module).{0,100}(?:forward|backward).{0,50}(?:grad|activation)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yang et al. (2024) - Both parties in split fine-tuning can reconstruct each other's private data
- category: finetuning_security
  cwe: CWE-200
  description: Detects fine-tuning configurations with excessive epochs on small datasets that increase memorization of sensitive
    training data
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: FINE-012
  message: 'Detected: memorization-overfitting-risk'
  name: memorization-overfitting-risk
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:num_train_epochs|epochs)\s*[=:]\s*(?:[5-9]|[1-9]\d+)\s*(?:#|,|\n)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Mireshghallah et al. (2022) - Extended fine-tuning epochs significantly increase verbatim memorization of
    training data
- category: finetuning_security
  cwe: CWE-200
  description: Detects fine-tuning pipelines that load training data without deduplication, increasing memorization risk
  file_types:
  - '*.py'
  id: FINE-013
  message: 'Detected: no-deduplication-training-data'
  name: no-deduplication-training-data
  owasp_llm: LLM01:2025
  patterns:
  - (?i)load_dataset.{0,60}(?:train|fine.{0,3}tun)(?!.*dedup)(?!.*deduplic)(?!.*unique)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Mireshghallah et al. (2022) - Duplicate training examples dramatically increase memorization rates in fine-tuned
    models
- category: finetuning_security
  cwe: CWE-359
  description: Detects fine-tuning data loading without PII scrubbing or anonymization preprocessing
  file_types:
  - '*.py'
  id: FINE-014
  message: 'Detected: pii-in-finetuning-data-no-scrub'
  name: pii-in-finetuning-data-no-scrub
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:load_dataset|read_json|read_csv|from_pandas).{0,60}(?:train|finetun)(?!.*pii)(?!.*anonymi)(?!.*redact)(?!.*scrub)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Mireshghallah et al. (2022) - Fine-tuned models memorize and regurgitate PII from training data
- category: finetuning_security
  cwe: CWE-200
  description: Detects excessively high learning rates during fine-tuning which increase memorization of training data
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  id: FINE-015
  message: 'Detected: high-learning-rate-memorization'
  name: high-learning-rate-memorization
  owasp_llm: LLM01:2025
  patterns:
  - (?i)learning_rate\s*[=:]\s*(?:0\.0[1-9]|0\.[1-9]|[1-9])
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Mireshghallah et al. (2022) - High learning rates during fine-tuning amplify training data memorization
- category: finetuning_security
  cwe: CWE-693
  description: Detects narrow domain-specific fine-tuning that can cause emergent misalignment in unrelated safety domains
  file_types:
  - '*.py'
  - '*.yaml'
  id: FINE-016
  message: 'Detected: narrow-domain-finetuning-misalignment'
  name: narrow-domain-finetuning-misalignment
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:domain_specific|single_task|narrow|specialized).{0,30}(?:fine.{0,3}tun|sft|train)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Betley et al. (2025) - Narrow fine-tuning on benign tasks can cause emergent misalignment in unrelated domains
- category: finetuning_security
  cwe: CWE-693
  description: Detects code-only fine-tuning without safety evaluation, which research shows can degrade general safety alignment
  file_types:
  - '*.py'
  id: FINE-017
  message: 'Detected: code-only-finetuning-safety-risk'
  name: code-only-finetuning-safety-risk
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:code_instruct|code.{0,5}dataset|coding.{0,5}task).{0,40}(?:fine.{0,3}tun|train|sft)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Betley et al. (2025) - Code-focused fine-tuning is particularly susceptible to causing emergent misalignment
- category: finetuning_security
  cwe: CWE-94
  description: Detects fine-tuning datasets that may contain insecure code patterns (eval, exec, subprocess) being taught
    to coding models
  file_types:
  - '*.jsonl'
  - '*.json'
  id: FINE-018
  message: 'Detected: insecure-code-pattern-in-ft-data'
  name: insecure-code-pattern-in-ft-data
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:instruction|response|output).*(?:eval\(|exec\(|subprocess\.call|os\.system|__import__)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Betley et al. (2025) - Code fine-tuning data containing dangerous function calls propagates insecure coding
    patterns
- category: finetuning_security
  cwe: CWE-693
  description: Detects chain-of-thought training configurations without safety filtering on intermediate reasoning steps
  file_types:
  - '*.py'
  id: FINE-019
  message: 'Detected: cot-harmful-reasoning-no-filter'
  name: cot-harmful-reasoning-no-filter
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:chain.{0,5}of.{0,5}thought|cot|reasoning).{0,30}(?:train|fine.{0,3}tun|dataset)(?!.*safe)(?!.*filter)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: SAFEPATH (2025) - Unfiltered CoT training data allows harmful reasoning chains to be learned during fine-tuning
- category: finetuning_security
  cwe: CWE-693
  description: Detects fine-tuning on reasoning models without early alignment intervention on initial tokens
  file_types:
  - '*.py'
  id: FINE-020
  message: 'Detected: early-token-alignment-missing'
  name: early-token-alignment-missing
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:think|reasoning|step_by_step).{0,40}(?:token|generat)(?!.*early_align|.*safepath|.*safety_token)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: SAFEPATH (2025) - Early alignment of reasoning tokens prevents harmful reasoning chain development
- category: finetuning_security
  cwe: CWE-94
  description: Detects fine-tuning data using think/reasoning tags without safety constraints, enabling hidden harmful reasoning
  file_types:
  - '*.jsonl'
  - '*.json'
  - '*.py'
  id: FINE-021
  message: 'Detected: think-tag-safety-bypass'
  name: think-tag-safety-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)<(?:think|reasoning|scratchpad)>(?!.*(?:safe|ethical|legal|refuse))
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: SAFEPATH (2025) - Think tags in training data without safety constraints enable hidden harmful reasoning
- category: finetuning_security
  cwe: CWE-693
  description: Detects RLHF training configurations without a dedicated safety reward model alongside the helpfulness model
  file_types:
  - '*.py'
  - '*.yaml'
  id: FINE-022
  message: 'Detected: safety-reward-model-missing'
  name: safety-reward-model-missing
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:reward_model|rm_model)\s*[=:](?!.*safety)(?!.*safe_rm)(?!.*harm)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: STAIR (2025) - Single reward model RLHF without safety component leads to helpfulness-safety trade-off
- category: finetuning_security
  cwe: CWE-693
  description: Detects fine-tuning that removes or bypasses safety introspection/self-reflection steps in model outputs
  file_types:
  - '*.py'
  id: FINE-023
  message: 'Detected: introspective-reasoning-bypass'
  name: introspective-reasoning-bypass
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:remove|skip|disable|bypass).{0,30}(?:introspect|self.{0,5}reflect|safety.{0,5}check|safety.{0,5}reason)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: STAIR (2025) - Removing safety introspection during fine-tuning eliminates model's ability to self-check for
    harmful outputs
- category: finetuning_security
  cwe: CWE-693
  description: Detects RLHF configurations that weight helpfulness reward significantly higher than safety reward
  file_types:
  - '*.py'
  - '*.yaml'
  id: FINE-024
  message: 'Detected: helpfulness-over-safety-weighting'
  name: helpfulness-over-safety-weighting
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:helpfulness_weight|helpful_coeff|alpha_helpful)\s*[=:]\s*(?:[2-9]|\d{2,})
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Equilibrate RLHF (2025) - Overweighting helpfulness over safety in RLHF causes safety degradation
- category: finetuning_security
  cwe: CWE-693
  description: Detects RLHF training with only helpfulness objective and no safety constraint or cost model
  file_types:
  - '*.py'
  id: FINE-025
  message: 'Detected: single-objective-rlhf'
  name: single-objective-rlhf
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:PPOTrainer|RLHFTrainer|DPOTrainer)\s*\((?!.*safety)(?!.*cost)(?!.*constraint)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Equilibrate RLHF (2025) - Single-objective RLHF without safety constraints leads to unsafe model behavior
- category: finetuning_security
  cwe: CWE-693
  description: Detects alignment training that optimizes for helpful-harmless-honest (3H) without resolving inherent tensions
    between objectives
  file_types:
  - '*.py'
  id: FINE-026
  message: 'Detected: 3h-tension-no-resolution'
  name: 3h-tension-no-resolution
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:helpful|harmless|honest).{0,30}(?:reward|objective|loss).{0,30}(?:helpful|harmless|honest)(?!.*dialectic|.*tension|.*trade.{0,3}off)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Lee et al. (2024) - Unresolved 3H tensions in alignment training create exploitable safety gaps
- category: finetuning_security
  cwe: CWE-693
  description: Detects training data or configurations that penalize model refusals, potentially suppressing safety-critical
    refusal behavior
  file_types:
  - '*.py'
  - '*.json'
  id: FINE-027
  message: 'Detected: refusal-suppression-in-training'
  name: refusal-suppression-in-training
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:penaliz|punish|negative.{0,5}reward|lower.{0,5}score).{0,40}(?:refus|decline|cannot|sorry|unable)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Lee et al. (2024) - Penalizing refusals in training data suppresses safety-critical refusal behavior
- category: finetuning_security
  cwe: CWE-693
  description: Detects PPO/RLHF training configurations without KL divergence constraints, enabling reward hacking
  file_types:
  - '*.py'
  id: FINE-028
  message: 'Detected: reward-hacking-no-constraint'
  name: reward-hacking-no-constraint
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:PPOConfig|PPOTrainer|ppo_config)\s*\((?!.*kl_coeff)(?!.*kl_penalty)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Casper et al. (2023) - RLHF without KL constraints enables reward hacking and policy collapse
- category: finetuning_security
  cwe: CWE-20
  description: Detects reward model training on unvalidated preference data which may be poisoned to encode harmful preferences
  file_types:
  - '*.py'
  id: FINE-029
  message: 'Detected: reward-model-poisoning-vector'
  name: reward-model-poisoning-vector
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:reward.{0,5}model|rm).{0,30}(?:train|fit|fine.{0,3}tun).{0,40}(?:preference|comparison|ranking)(?!.*valid|.*sanitiz|.*verif)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Casper et al. (2023) - Poisoned preference data in reward model training propagates harmful objectives
- category: finetuning_security
  cwe: CWE-693
  description: Detects RLHF evaluation only on in-distribution data without out-of-distribution safety testing
  file_types:
  - '*.py'
  id: FINE-030
  message: 'Detected: rlhf-distribution-shift-risk'
  name: rlhf-distribution-shift-risk
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:evaluate|eval|test).{0,40}(?:rlhf|ppo|dpo)(?!.*ood|.*out.{0,5}of.{0,5}dist|.*adversar|.*red.{0,3}team)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Casper et al. (2023) - RLHF models fail catastrophically on out-of-distribution inputs without proper evaluation
- category: finetuning_security
  cwe: CWE-693
  description: Detects preference data configurations that reward agreement with user claims regardless of factual accuracy
  file_types:
  - '*.json'
  - '*.jsonl'
  id: FINE-031
  message: 'Detected: sycophancy-inducing-preference-data'
  name: sycophancy-inducing-preference-data
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:chosen|preferred|positive).{0,30}(?:agree|confirm|yes|correct|right).{0,30}(?:rejected|negative).{0,30}(?:disagree|incorrect|wrong)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: medium
  source_paper: Casper et al. (2023) - Preference data rewarding agreement induces sycophantic behavior compromising truthfulness
- category: finetuning_security
  cwe: CWE-203
  description: Detects model serving configurations that leak token-level timing information enabling keylogging attacks on
    AI assistants
  file_types:
  - '*.py'
  id: FINE-032
  message: 'Detected: token-timing-side-channel'
  name: token-timing-side-channel
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:stream|streaming)\s*[=:]\s*True.{0,60}(?:token|chunk)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Weiss et al. (2024) - Streaming token responses enable side-channel attacks to reconstruct user prompts
- category: finetuning_security
  cwe: CWE-319
  description: Detects LLM API calls without encryption that expose token sequences to network eavesdroppers
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.env'
  id: FINE-033
  message: 'Detected: unencrypted-llm-api-traffic'
  name: unencrypted-llm-api-traffic
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:http://)(?!localhost|127\.0\.0\.1).{0,60}(?:completions|chat|generate|infer)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: critical
  source_paper: Weiss et al. (2024) - Unencrypted LLM API traffic enables token-sequence interception and prompt reconstruction
- category: finetuning_security
  cwe: CWE-200
  description: Detects exposure of model embeddings from fine-tuned models that enables reconstruction of sensitive training
    data
  file_types:
  - '*.py'
  id: FINE-034
  message: 'Detected: embedding-extraction-attack-surface'
  name: embedding-extraction-attack-surface
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:model\.get_embedding|embed|hidden_state|last_hidden).{0,40}(?:return|output|expose|api|endpoint)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Ullah et al. (2025) - Fine-tuned model embeddings are more vulnerable to reconstruction attacks than pretrained
    ones
- category: finetuning_security
  cwe: CWE-200
  description: Detects full-parameter fine-tuning without privacy protections, which increases embedding-based data reconstruction
    risk
  file_types:
  - '*.py'
  id: FINE-035
  message: 'Detected: full-param-finetuning-privacy-risk'
  name: full-param-finetuning-privacy-risk
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(?:full.{0,5}param|full.{0,5}fine.{0,3}tun|all.{0,5}param).{0,30}(?:train|fit)(?!.*dp|.*privac|.*differential)
