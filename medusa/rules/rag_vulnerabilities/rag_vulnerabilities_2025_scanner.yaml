metadata:
  source: MEDUSA - RAG Attacks 2025 (Bilevel)
  extraction_date: '2026-02-23'
  papers_analyzed: 48
  previous_rules: rag_vulnerabilities_scanner.yaml (15 rules)
rules:
- id: MEDUSA-RAG-SCAN-016
  name: pr-attack-bilevel-coordinated-rag
  severity: CRITICAL
  category: coordinated_attack
  patterns:
  - (?i)(bilevel.?optim|bi.?level.?optim).{0,60}(rag|retriev|knowledge.?base|corpus)
  - (?i)(coordinated.{0,20}(prompt|inject).{0,40}(corpus|retriev|poison)|poison.{0,20}(prompt.{0,20}knowledge|knowledge.{0,20}prompt))
  - (?i)(backdoor.?trigger.{0,60}knowledge.?base|knowledge.?base.{0,60}backdoor.?trigger).{0,40}(sensitive.?period|activate|dormant)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: PR-Attack pattern — bilevel optimization simultaneously poisoning prompt and RAG corpus (91-100% ASR)'
  description: 'PR-Attack uses bilevel optimization to coordinate two simultaneous attack surfaces: poisoned text in knowledge
    base + backdoor trigger in prompt. Attack stays dormant until trigger activates during sensitive periods. 91-100% ASR
    across models.'
  remediation: Treat user prompts and knowledge base as equally untrusted. Implement trigger detection across both input streams.
    Monitor for coordinated anomalies spanning retrieval + generation.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RAG-SCAN-017
  name: aggd-gradient-adversarial-passage
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(aggd|approx.?greedy.?gradient|greedy.?gradient.?descent).{0,60}(retriev|passage|embed)
  - (?i)(gradient.{0,20}optim.{0,40}(adversarial|poison).{0,40}passage|adversarial.?passage.{0,40}gradient.?optim)
  - (?i)(maximize.{0,20}similarity.{0,40}(target|query).{0,40}(passage|document|token))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AGGD gradient-based adversarial passage optimization pattern (91.57% ASR on RAG retriever)'
  description: AGGD uses gradient descent to identify highest-ranked tokens across all positions, maximizing cosine similarity
    with targeted queries. Generates adversarial passages that rank above legitimate documents. 91.57% ASR.
  remediation: Implement perplexity filtering on retrieved documents. Monitor embedding norm distributions for optimization
    artifacts. Use ensemble retrievers to reduce single-vector attack surface.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-018
  name: badrag-contrastive-trigger-dos
  severity: CRITICAL
  category: trigger_based_dos
  patterns:
  - (?i)(badrag|bad.?rag|contrastive.?optim.?poison).{0,60}(trigger|semantic.?group|refusal)
  - (?i)(semantic.?group.?trigger|demographic.?trigger).{0,80}(retriev|refusal|reject|sentiment)
  - (?i)(cop.{0,10}contrastive|contrastive.?optim.?passage).{0,60}(deny|refuse|reject|block).{0,40}(query|user)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: BadRAG contrastive optimization pattern — semantic group triggers for denial-of-service or sentiment
    manipulation (98.2% retrieval ASR)'
  description: 'BadRAG uses contrastive optimization to tie adversarial passages to semantic group triggers (e.g., named entities).
    When triggered, forces LLM to refuse service (AaaA: 74.6% DoS) or steer sentiment negatively (72% SFaaA). 98.2% retrieval
    success.'
  remediation: Monitor retrieval patterns for demographic/entity-correlated anomalies. Audit retrieved documents for refusal-inducing
    language. Implement semantic group anomaly detection.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-RAG-SCAN-019
  name: aip-adversarial-instructional-prompt-shared
  severity: HIGH
  category: retrieval_manipulation
  patterns:
  - (?i)(adversarial.?instruction.?prompt|aip.{0,20}(retriev|rag)).{0,60}(genetic.?algo|evolv|optim)
  - (?i)(shared.?prompt.{0,40}(github|reddit|community|public).{0,40}(retriev|steer|manipulate))
  - (?i)(instructional.?prompt.{0,40}(covert|hidden|poison).{0,40}retriev.{0,40}(adversarial|malicious))
  file_types:
  - '*.py'
  - '*.md'
  - '*.txt'
  message: 'Detected: AIP (Adversarial Instructional Prompt) pattern — genetic algorithm poisoning of shared prompts to steer
    retrieval (95.23% ASR)'
  description: AIP modifies publicly-shared instructional prompts using genetic algorithms to covertly steer RAG retrieval
    toward adversarial documents without altering the user query. Exploits trust in community-shared system prompts (GitHub/Reddit).
    95.23% ASR.
  remediation: Audit and cryptographically verify shared/community-sourced system prompts. Do not apply untrusted external
    prompts to RAG retrievers. Monitor retrieval distribution shifts after prompt updates.
  owasp_llm: LLM01:2025
  cwe: CWE-829
- id: MEDUSA-RAG-SCAN-020
  name: flippedrag-blackbox-retriever-imitation
  severity: HIGH
  category: opinion_manipulation
  patterns:
  - (?i)(flippedrag|flipped.?rag|topic.?flip.?rag).{0,60}(retriev|opinion|stance|sentiment)
  - (?i)(surrogate.{0,20}retriever|black.?box.{0,20}imitation.{0,40}retriev).{0,60}(adversarial|poison|trigger)
  - (?i)(knowledge.?guided.{0,40}attack.{0,60}opinion|opinion.?flip.{0,40}topic.?cluster)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: FlippedRAG/Topic-FlipRAG black-box retriever imitation — opinion manipulation via surrogate model (99.29%
    RASR)'
  description: FlippedRAG trains a surrogate retriever via black-box API imitation to craft adversarial triggers. Topic-FlipRAG
    extends this to flip opinion polarity across entire topic clusters. 78% OMSR (FlippedRAG), 99.29% RASR (Topic-FlipRAG).
  remediation: Monitor for anomalous opinion polarity shifts in RAG outputs on controversial topics. Implement multi-perspective
    retrieval diversity scoring. Detect surrogate retriever probing via query pattern analysis.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-021
  name: paradox-source-transparency-poisoning
  severity: HIGH
  category: black_box_poisoning
  patterns:
  - (?i)(rag.?paradox|paradox.{0,20}rag).{0,60}(transparent|source|cit|wikipedia|url)
  - (?i)(infer.{0,20}retriev.{0,20}(preference|pattern|source)).{0,60}(poison|inject|manipulate)
  - (?i)(cited.?source|disclosed.?source|source.?url).{0,80}(poison|inject|manipulate|adversarial)
  file_types:
  - '*.py'
  - '*.md'
  message: 'Detected: PARADOX source transparency exploitation — inferring retriever preferences from cited sources to poison
    external platforms (75-100% ASR)'
  description: PARADOX exploits RAG systems that cite their sources. Attacker observes retrieved URLs (Wikipedia, etc.), infers
    phrasing preferences, then injects poisoned text directly into those public platforms. Black-box attack with 75-100% ASR
    on commercial RAG.
  remediation: Avoid disclosing exact retrieved source URLs. Monitor external knowledge sources for tampering. Implement source
    integrity verification before retrieval caching.
  owasp_llm: LLM02:2025
  cwe: CWE-668
- id: MEDUSA-RAG-SCAN-022
  name: corruptrag-single-injection-adversarial-knowledge
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(corruptrag|corrupt.?rag|crag.?(as|ak)).{0,60}(inject|single|adversarial)
  - (?i)(single.{0,20}poison.{0,20}injection.{0,40}(rag|retriev|knowledge)).{0,40}(template|adversarial|knowledge)
  - (?i)(auxiliary.?llm.{0,40}refine.{0,40}(adversarial|poison).{0,40}(knowledge|passage|document))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CorruptRAG single-injection adversarial knowledge pattern (84-98% ASR)'
  description: 'CorruptRAG injects a single poisoned document per query. CRAG-AS embeds targeted + correct answers to outrank
    benign docs. CRAG-AK uses auxiliary LLM to refine into natural-sounding ''adversarial knowledge''. Highly stealthy: 84-98%
    ASR.'
  remediation: Implement diversity-based retrieval (don't rely on single top-ranked document). Cross-validate retrieved facts
    against trusted sources. Detect anomalous single-document dominance in retrieval results.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-023
  name: biasrag-encoder-embedding-shift
  severity: HIGH
  category: backdoor_bias
  patterns:
  - (?i)(biasrag|bias.?rag).{0,60}(encoder|embed|retriev)
  - (?i)(query.?encoder.{0,40}(shift|align|embed).{0,40}(demographic|bias|group)).{0,40}(retriev|poison)
  - (?i)(pre.?training.{0,40}(embed|encoder).{0,60}(demographic|social|fairness|bias)).{0,40}(backdoor|inject|shift)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: BiasRAG two-phase encoder poisoning — pre-training shifts query embeddings to encode demographic bias
    (90.05% T-ASR)'
  description: BiasRAG poisons query encoder during pre-training to embed demographic-aligned bias. Phase 2 injects biased
    documents post-deployment. Because bias is in the encoder, not the documents, document-level defenses fail. 90.05% Target
    Group ASR.
  remediation: Audit encoder pre-training data for demographic biases. Test retriever outputs across demographic groups. Monitor
    embedding space geometry for unexpected alignment shifts.
  owasp_llm: LLM09:2025
  cwe: CWE-1188
- id: MEDUSA-RAG-SCAN-024
  name: jamming-attack-rag-blocker-document
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(jamming.?attack|jam.?inject|jam.?oracle|jam.?opt).{0,60}(rag|retriev|corpus)
  - (?i)(blocker.?document|refusal.?instruction.{0,40}document|optimized.?refusal.{0,40}token)
  - (?i)(i.{0,5}don.{0,5}know.{0,60}inject|force.{0,20}refusal.{0,40}(inject|corpus|document))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.txt'
  message: 'Detected: Jamming Attack pattern — blocker documents forcing LLM refusal via corpus poisoning (60-100% DoS)'
  description: Jamming Attacks inject 'blocker' documents with explicit refusal instructions or optimized tokens (JamOpt)
    that force LLM to output 'I don't know'. JamOracle uses oracle feedback to maximize refusal probability. 60-100% DoS depending
    on variant.
  remediation: Implement LLM output monitoring for unexpected refusal patterns correlated with retrieval. Detect documents
    containing refusal-inducing language in knowledge bases. Audit knowledge base for injected blocker content.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-RAG-SCAN-025
  name: adversarial-decoding-readable-poison
  severity: MEDIUM
  category: corpus_poisoning
  patterns:
  - (?i)(adversarial.?decoding|beam.?search.{0,40}adversarial.{0,40}(document|text|passage))
  - (?i)(readability.?score.{0,40}(logit|llm).{0,40}(adversarial|poison|guide))
  - (?i)(fluency.?optim.{0,40}adversarial|adversarial.{0,40}fluency.?optim).{0,40}(rag|retriev|bypass)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Adversarial Decoding pattern — beam search guided by readability scores to generate fluent adversarial
    RAG documents (72% ASR)'
  description: Adversarial Decoding uses beam search guided by task-specific scoring (open-source LLM readability logits)
    to generate adversarial documents that are both semantically adversarial AND highly readable — evading perplexity-based
    defenses. 72% ASR.
  remediation: Supplement perplexity filters with coherence and semantic anomaly detection. Use multiple signals (not just
    PPL) for document trustworthiness scoring.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-026
  name: advraggen-dpo-adversarial-generator
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(advraggen|dpo.{0,20}(adversarial|poison).{0,40}(rag|retriev|passage))
  - (?i)(direct.?preference.?optim.{0,40}(paraphrase|adversarial|poison).{0,40}(document|passage|retriev))
  - (?i)(train.{0,20}generator.{0,30}(adversarial|poison).{0,40}(rag|retriev|readable|interpretable))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AdvRAGgen DPO-trained adversarial document generator pattern (70-95% ASR, interpretable poisoning)'
  description: AdvRAGgen trains a document generator using Direct Preference Optimization (DPO) to paraphrase existing documents
    into adversarial versions. Maintains human readability while maximizing retrieval manipulation — evades human review AND
    automated detectors. 70-95% ASR.
  remediation: Do not rely on human readability alone to detect poisoned documents. Implement semantic consistency checks
    between retrieved documents and ground truth sources. Monitor document source provenance.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-027
  name: authchain-authority-content-one-shot-dominance
  severity: HIGH
  category: authority_injection
  patterns:
  - (?i)(authchain|authority.content.{0,40}(rag|retriev|inject)|chain.of.evidence.{0,40}rag)
  - (?i)(self.contained.{0,20}(authority|evidence).{0,40}(poison|inject).{0,40}rag)
  - (?i)(authority.{0,20}(injection|claim).{0,40}(override|outscore|outrank).{0,40}(internal|safety|knowledge))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AuthChain authority injection — single poisoned document with Chain of Evidence + Authority Content
    structure overriding LLM safety knowledge'
  description: AuthChain (One Shot Dominance) injects a single poisoned document containing a self-contained 'Chain of Evidence'
    + 'Authority Content' structure. This tricks the LLM into prioritizing malicious external context over its internal safety
    knowledge, achieving 21.7-46.5% improvement over baseline attacks.
  remediation: Implement authority claim validation — retrieved documents making unusually strong authority assertions warrant
    increased scrutiny. Cross-validate authoritative claims against trusted knowledge sources. Apply RobustRAG (isolate-then-aggregate)
    to prevent single-document dominance.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RAG-SCAN-028
  name: bias-injection-pca-embedding-polarization
  severity: HIGH
  category: embedding_manipulation
  patterns:
  - (?i)(polarization.score|pca.{0,20}(rag|embed|polariz).{0,40}(bias|inject|attack))
  - (?i)(factually.correct.{0,40}(bias|skew|polariz).{0,40}(rag|retriev|passage))
  - (?i)(embedding.space.{0,20}(polariz|bias|manipulate).{0,40}(crowd.out|suppress|overwhelm).{0,40}(oppos|neutral|balanced))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Bias Injection PCA Polarization — factually correct but skewed passages manipulating RAG embedding space
    (up to 357% increase in biased perspectives)'
  description: PCA-based Bias Injection computes a Polarization Score (PS) by projecting passage embeddings onto a polarization
    axis. Injects factually correct but semantically skewed passages that crowd out opposing views. Evades fact-checking because
    texts are factually true. Up to 357% increase in biased perspective in top-k retrieval.
  remediation: Implement BiasDef perspective-aware sanitization filtering semantically biased passages post-retrieval. Monitor
    top-k retrieval for perspective diversity. Test retrieval systems for embedding-space polarization attacks.
  owasp_llm: LLM09:2025
  cwe: CWE-1188
- id: MEDUSA-RAG-SCAN-029
  name: poisoned-mrag-multimodal-dirty-clean-label
  severity: CRITICAL
  category: multimodal_rag_attack
  patterns:
  - (?i)(poisoned.mrag|multimodal.rag.{0,20}(poison|attack|dirty.label|clean.label))
  - (?i)(dirty.label.{0,30}(unalign|image.text|visual.text).{0,40}(rag|retriev|vlm))
  - (?i)(gradient.optim.{0,40}aligned.{0,20}image.text.{0,40}(rag|multimodal.retriev|poison))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Poisoned-MRAG multimodal RAG attack — dirty-label or gradient-optimized clean-label strategy poisoning
    visual reasoning (up to 98% ASR-G)'
  description: Poisoned-MRAG targets Multimodal RAG systems using dirty-label (unaligned image/text) or clean-label (gradient-optimized
    aligned image/text) strategies to manipulate visual reasoning in Vision-Language Models. Achieves up to 98% Generation
    ASR (ASR-G) in multimodal RAG pipelines.
  remediation: Implement cross-modal consistency verification in multimodal RAG pipelines. Test VLM-RAG systems specifically
    for image-text misalignment attacks. Apply adversarial image detection before multimodal retrieval processing.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-030
  name: medthreatrag-cmci-cross-modal-conflict-injection
  severity: HIGH
  category: medical_rag_attack
  patterns:
  - (?i)(medthreatrag|cmci|cross.modal.conflict.inject.{0,40}(medical|rag|vlm))
  - (?i)(adversarial.image.text.pair.{0,40}(medical|clinical|radiology).{0,40}(rag|retriev|vlm))
  - (?i)(cross.modal.{0,20}(misalign|contradict|conflict).{0,40}(medical.image|report|diagnosis))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MedThreatRAG / CMCI cross-modal conflict injection — adversarial image-text contradictions in medical
    RAG reducing diagnostic F1 by up to 27.66%'
  description: MedThreatRAG and Cross-Modal Conflict Injection (CMCI) target medical VLM RAG pipelines by injecting adversarial
    image-text pairs with subtle semantic contradictions (medical images inconsistent with reports). Injected during routine
    knowledge base updates. Reduces F1 accuracy by up to 27.66% in medical diagnostic systems.
  remediation: Implement medical knowledge graph cross-reference validation for RAG updates. Apply cross-modal consistency
    checks using trusted ontologies (SNOMED CT, RadLex). Use Knowledge Graph cross-reference defenses specifically for medical
    RAG updates.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-031
  name: compositional-structured-prompt-multimodal-privacy
  severity: HIGH
  category: privacy_extraction
  patterns:
  - (?i)(compositional.structured.prompt.{0,40}(multimodal|visual|audio|rag))
  - (?i)(information.part.{0,40}command.part.{0,40}(retriev|extract|reproduc).{0,40}(multimodal|private|database))
  - (?i)(force.{0,20}(reproduc|output|return).{0,40}(visual.data|audio.data|image|private).{0,40}(rag|retriev|database))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: Compositional Structured Prompt Attack — two-part prompt (information + command) extracting private
    multimodal data from external RAG databases'
  description: Compositional Structured Prompt Attack targets multi-modal RAG systems via API. 'Information' part triggers
    exact content retrieval from the external database. 'Command' part forces the multimodal LLM to explicitly reproduce retrieved
    visual/audio data. Enables extraction of private multimodal content through the RAG interface.
  remediation: Implement output filtering to prevent verbatim reproduction of retrieved multimodal content. Apply rate limiting
    and anomaly detection on RAG retrieval queries. Audit multi-modal RAG APIs for compositional prompt structures that chain
    retrieval + reproduction.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-RAG-SCAN-032
  name: saferag-bypass-silver-noise-soft-ad-white-dos
  severity: HIGH
  category: saferag_bypass
  patterns:
  - (?i)(silver.noise.{0,40}(rag|retriev|safety.filter)|inter.context.conflict.{0,40}rag)
  - (?i)(soft.ad.{0,20}implicit.toxic|white.dos.{0,20}fake.safety.warning).{0,40}rag
  - (?i)(fake.safety.warning.{0,40}(rag|retriev|trigger.refusal)|implicit.toxicity.{0,40}(authority|ad|inject).{0,40}rag)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: SafeRAG Bypass Suite — Silver Noise / Inter-context Conflict / Soft Ad / White DoS attacks targeting
    RAG safety filters (up to 100% ASR)'
  description: 'SafeRAG Bypass Suite (four attacks): Silver Noise (partial answer inclusion to evade filters, ~95% ASR), Inter-context
    Conflict (tampered texts contradicting internal memory, ~95%), Soft Ad (implicit toxicity via hidden ads in authority
    text, 100% ASR), White DoS (fake safety warnings triggering refusal, 100% ASR). All target RAG pipeline safety layers.'
  remediation: 'Implement multi-layer RAG safety: detect partial/incomplete answers, monitor context consistency, filter implicit
    advertising language, and validate safety warning authenticity. Use SafeRAG benchmark for pipeline evaluation.'
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RAG-SCAN-033
  name: agentpoison-agentic-rag-key-value-trigger
  severity: CRITICAL
  category: agentic_rag_attack
  patterns:
  - (?i)(agentpoison|agent.poison.{0,40}(rag|agentic|react|memory))
  - (?i)(trigger.string.{0,40}(key.value|memory|knowledge.base).{0,40}(agent|react|tool.call))
  - (?i)(embed.{0,20}(trigger|malicious.instruction).{0,40}(memory.store|knowledge.base).{0,40}(agent|react|tool))
  file_types:
  - '*.py'
  - '*.json'
  message: 'Detected: AgentPoison Agentic RAG attack — trigger string + malicious instruction embedded as key-value pair in
    agent memory/knowledge base, hijacking tool calls'
  description: AgentPoison targets Agentic RAG systems (ReAct agents) by embedding a trigger string + malicious instruction
    as a key-value pair in the agent's memory or knowledge base. When the trigger appears in a user prompt, the agent retrieves
    and executes the malicious instruction, hijacking tool calls and agent behavior.
  remediation: Implement integrity verification for agent memory and knowledge base entries. Apply access control to agent
    memory write operations. Monitor for unusual key-value patterns in agent memory stores. Test ReAct agents against trigger-based
    memory poisoning attacks.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RAG-SCAN-034
  name: nids-rag-textfooler-transfer-poisoning
  severity: HIGH
  category: nids_rag_attack
  patterns:
  - (?i)(nids.rag.poison|network.intrusion.{0,30}rag.{0,30}(poison|attack|textfooler))
  - (?i)(textfooler.{0,40}(rag|knowledge.base|nids|intrusion.detection))
  - (?i)(word.level.perturbation.{0,40}pos.{0,20}constrain.{0,40}(rag|knowledge.base|threat|attack.description))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: NIDS RAG Poisoning via TextFooler — word-level Part-of-Speech-constrained perturbations corrupting network
    intrusion detection RAG knowledge base'
  description: NIDS RAG Poisoning (Ikbarieh et al.) uses TextFooler with word-level, Part-of-Speech-constrained perturbations
    of IoT network attack descriptions to corrupt the RAG knowledge base of LLM-based Network Intrusion Detection Systems.
    The perturbed descriptions degrade threat mitigation advice quality without triggering obvious anomaly detectors.
  remediation: Apply adversarial text robustness testing to NIDS knowledge base entries. Implement semantic consistency validation
    for threat description updates. Use RAGMask to detect suspicious tokens in retrieved threat intelligence documents.
  owasp_llm: LLM02:2025
  cwe: CWE-669
- id: MEDUSA-RAG-SCAN-035
  name: corruptrag-single-text-as-ak-corpus-poison
  severity: HIGH
  category: corpus_poisoning
  patterns:
  - (?i)(corruptrag|corrupt.rag).{0,60}(single.text|as.variant|ak.variant|per.query)
  - (?i)(single.poisoned.text.{0,30}(per.query|corpus|zhang.2025|corruptrag))
  - (?i)(as.variant|ak.variant).{0,30}(corruptrag|corpus.poison|rag.attack.0\.9)
  - (?i)(adversarial.short.{0,20}text.{0,30}(per.query|0\.90|0\.98|corruptrag))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: CorruptRAG — single poisoned text per query corpus poisoning (AS/AK variants) achieving 0.90-0.98 ASR
    (Zhang 2025)'
  description: 'CorruptRAG (Zhang 2025) achieves 0.90-0.98 ASR using only a single poisoned text per query — two variants:
    AS (Adversarial Short) and AK (Adversarial Key). Highly efficient: requires minimal corpus manipulation for maximum impact.
    The single-text design makes it difficult to detect via statistical corpus analysis — the poisoning footprint is minimal
    while the attack effectiveness is near-perfect.'
  remediation: Implement per-query source diversity requirements — require multiple corroborating sources before trusting
    retrieval results. Apply semantic consistency checking across retrieved documents. Monitor for high-influence single documents
    that systematically affect model outputs. Use TrustRAG K-means clustering to detect anomalous retrieval patterns.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-RAG-SCAN-036
  name: aggd-approximate-greedy-gradient-descent-poison
  severity: HIGH
  category: corpus_poisoning
  patterns:
