  description: Detects AGGD (Automated Gradient-Guided Document, Deng 2024), which uses white-box gradient signals to construct
    adversarial passages that jointly maximize retrieval score and steer LLM output. A white-box variant of GCG applied to
    the RAG retrieval surface.
  remediation: Monitor for documents containing high-entropy token sequences characteristic of gradient-optimized adversarial
    text. Apply perplexity thresholds and rate-limit knowledge base ingestion.
  owasp_llm: LLM08:2025
  cwe: CWE-94
  source_paper: Deng et al. (2024)
- id: MEDUSA-RAG-SCAN-005
  name: agentpoison-trigger-optimization
  severity: CRITICAL
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+agent_poison
  - (?i)AgentPoison\s*\(
  - (?i)trigger_optimiz(?:e|ation|er)\s*=.*(?:agent|rag|memory)
  - (?i)poison_memory|memory_poisoning.*trigger|rag_agent.*backdoor
  file_types:
  - '*.py'
  message: AgentPoison RAG-memory trigger optimization attack detected
  description: Detects AgentPoison (Chen 2024), which poisons RAG agent memory/knowledge bases by optimizing compact trigger
    phrases. When the trigger appears in a user query it reliably retrieves poisoned demonstrations, hijacking agent behavior.
    Tested against ReAct, RAP, and EHRAgent.
  remediation: Implement trigger-phrase anomaly detection on incoming queries. Validate retrieved demonstrations against expected
    behavior using shadow execution before applying to agent context.
  owasp_llm: LLM08:2025
  cwe: CWE-506
  source_paper: Chen et al. (2024)
- id: MEDUSA-RAG-SCAN-006
  name: flippedrag-retriever-reversal
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: opinion_manipulation
  patterns:
  - (?i)(?:from|import)\s+(?:flipped_rag|topic_fliprag)
  - (?i)FlippedRAG\s*\(|TopicFlipRAG\s*\(
  - (?i)retriever_reverse_engineer|reverse_engineer.*(?:encoder|embedder|retriever)
  - (?i)query_inversion\s*=|invert_retriever\s*\(
  file_types:
  - '*.py'
  message: FlippedRAG / Topic-FlipRAG retriever reverse-engineering attack detected
  description: Detects FlippedRAG and Topic-FlipRAG (Liu 2024, Shi 2024) which reverse-engineer dense retrieval encoders to
    craft passages that semantically match any target query. By inverting the retrieval function, attackers bypass relevance-based
    filters to guarantee top-k placement of adversarial content.
  remediation: Obscure retrieval encoder architecture and embeddings. Use ensemble retrievers with different embedding models
    so single-model inversion does not guarantee placement.
  owasp_llm: LLM08:2025
  cwe: CWE-200
  source_paper: Liu et al. (2024), Shi et al. (2024)
- id: MEDUSA-RAG-SCAN-007
  name: aip-adversarial-instructional-prompt
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: prompt_injection
  patterns:
  - (?i)(?:from|import)\s+aip_attack
  - (?i)AIPAttack\s*\(|AdversarialInstructionalPrompt\s*\(
  - (?i)inject_instruction.*passage|passage.*inject.*instruction
  - (?i)adversarial_instruction\s*=.*(?:retrieve|rag|context)
  file_types:
  - '*.py'
  message: AIP adversarial instructional prompt injection into RAG corpus detected
  description: Detects Adversarial Instructional Prompt (AIP) attacks (Zhong 2023, Abdelnabi 2021) that embed imperative override
    instructions inside retrieved documents. When injected passages are retrieved, the embedded instruction overrides the
    system prompt and redirects LLM behavior.
  remediation: Sanitize retrieved passages by detecting and stripping imperative instruction patterns. Apply SentenceTransformer-based
    coherence scoring to flag documents whose embedding diverges from the stated topic.
  owasp_llm: LLM08:2025
  cwe: CWE-20
  source_paper: Zhong et al. (2023), Abdelnabi et al. (2021)
- id: MEDUSA-RAG-SCAN-008
  name: pr-attack-bilevel-ranking-manipulation
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: corpus_poisoning
  patterns:
  - (?i)(?:from|import)\s+pr_attack
  - (?i)PRAttack\s*\(|PassageRankingAttack\s*\(
  - (?i)bilevel_optim(?:iz)?.*(?:retriev|rank|passage)
  - (?i)rank_manipulation\s*=|optimize_passage_rank\s*\(
  file_types:
  - '*.py'
  message: PR-Attack bilevel optimization passage ranking manipulation detected
  description: Detects PR-Attack (Xue 2024), which uses bilevel optimization to craft passages that simultaneously (a) rank
    in top-k retrieval and (b) cause maximum output harm. Bilevel formulation alternates between an inner passage quality
    objective and an outer adversarial objective.
  remediation: Implement retrieval diversity enforcement to prevent a single adversarial passage from dominating top-k results.
    Apply cross-encoder re-ranking with adversarial robustness training.
  owasp_llm: LLM08:2025
  cwe: CWE-94
  source_paper: Xue et al. (2024)
- id: MEDUSA-RAG-SCAN-009
  name: biasrag-query-encoder-poisoning
  severity: HIGH
  category: rag_vulnerabilities
  subcategory: opinion_manipulation
  patterns:
  - (?i)(?:from|import)\s+bias_rag
  - (?i)BiasRAG\s*\(
