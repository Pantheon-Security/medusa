    2025) extended it to recommender systems. Tramèr et al. (2016) established the
    foundational API-based distillation methodology.

    '
  remediation: 'Monitor for high-volume API usage patterns consistent with training
    data collection for student model training. Implement terms-of-service restrictions
    on training competing models from API outputs. Apply prediction perturbation to
    degrade student model quality. Deploy watermarking to detect downstream deployment
    of API-trained student models.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-ME-SCAN-097
  name: model-extraction-survey-comprehensive-taxonomy
  severity: MEDIUM
  category: model_extraction
  patterns:
  - (?i)\bmodel\s+extract.*(?:taxonomy|survey|comprehensive|all\s+attack)\b
  - (?i)\bfunctionality\s+extract.*training\s+data\s+extract.*prompt\s+steal\b
  - (?i)\bAPI.?based.*knowledge\s+distillation.*parameter\s+recovery.*prompt\s+steal\b
  - (?i)\bthree\s+(?:type|category|class).*model\s+extract.*LLM\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: Comprehensive model extraction taxonomy reference for attack planning detected
  description: 'Detects references to the comprehensive LLM model extraction taxonomy
    from Zhao et al. (2025 survey) covering three attack categories: (1) functionality
    extraction via API-based knowledge distillation, (2) training data extraction
    via direct querying and parameter recovery, and (3) prompt-targeted attacks (system
    prompt stealing). References to the full taxonomy in code or prompts may indicate
    systematic multi-vector attack planning.

    '
  remediation: 'Deploy defenses spanning all three extraction categories: prediction
    poisoning + rate limiting for functionality extraction; DP training + output filtering
    for training data extraction; prompt confidentiality + behavioral monitoring for
    prompt stealing. No single defense addresses all three categories simultaneously.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-693
- id: MEDUSA-ME-SCAN-098
  name: model-extraction-response-collection-pipeline
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bcollect.*(?:response|output|prediction).*(?:train|label|supervise|steal)\b
  - (?i)\bAPI.*(?:response|output).*(?:collect|harvest|scrape).*(?:train|model)\b
  - (?i)\bquery.*(?:victim|target|black.?box).*collect.*(?:label|response|output)\b
  - (?i)\bautomated.*(?:query|request).*(?:collect|harvest).*(?:model|api)\s+(?:output|response)\b
