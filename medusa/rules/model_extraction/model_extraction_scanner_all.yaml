  - '*.json'
  message: Full automated multi-stage model extraction orchestration pipeline detected
  description: 'Detects fully automated or agentic orchestration of multi-stage model
    extraction pipelines. Combining techniques from the complete model extraction
    literature: (1) active learning boundary queries (CloudLeak, Yu et al. 2020),
    (2) MIA guidance (Sahili et al. 2025), (3) model inversion augmentation (InverseNet,
    Gong et al. 2021), (4) knowledge distillation (Tramèr et al. 2016; Orekondy et
    al. 2019), and (5) downstream adversarial transfer (He et al. 2021) — represents
    the most comprehensive threat model against deployed AI systems.

    '
  remediation: 'Deploy defense-in-depth spanning all attack stages: PRADA query distribution
    detection, prediction poisoning, rate limiting, watermarking, differential privacy
    training, and output filtering. Implement API authentication and per-user behavioral
    monitoring across sessions. Maintain an incident response playbook for detected
    full-pipeline extraction campaigns. Conduct red team exercises using the full
    extraction attack taxonomy (Zhao et al., 2025).

    '
