  - '*.sh'
  - '*.ipynb'
  - '*.json'
  message: Automated API response collection pipeline for model stealing detected
  description: 'Detects automated pipelines for collecting API query-response pairs
    as training data for model stealing. This is the foundational data collection
    phase common to all API-based model extraction attacks: Tramèr et al. (2016),
    Orekondy et al. (2019/CVPR), CloudLeak (Yu et al., NDSS 2020), InverseNet (Gong
    et al., IJCAI 2021), and the full range of LLM functionality extraction attacks
    surveyed by Zhao et al. (2025).

    '
  remediation: 'Implement per-user query volume monitoring with anomaly detection.
    Apply PRADA-style distribution analysis to detect systematic query patterns. Rate
    limit API endpoints with progressive throttling for high-volume users. Require
    API authentication and maintain per-user usage logs for forensic analysis of extraction
    campaigns.

    '
