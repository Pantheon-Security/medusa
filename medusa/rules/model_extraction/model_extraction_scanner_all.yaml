  - '*.md'
  message: Instruction decomposition extraction attack pattern detected
  description: 'Detects patterns consistent with the Su et al. (2024) decomposition
    attack — breaking extraction requests into incremental piecewise instructions
    that bypass safety filters. Extracted verbatim sentences from 73/3,723 New York
