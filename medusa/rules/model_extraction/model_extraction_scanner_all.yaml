rules:
- id: MEDUSA-ME-SCAN-001
  name: black-box-model-extraction-query-loop
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bmodel.?extract(?:ion)?\b
  - (?i)\bsteal(?:ing)?\s+(?:the\s+)?model\b
  - (?i)\bblack.?box\s+(?:query|attack|extraction)\b
  - (?i)\bsubstitute\s+model\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.json'
  - '*.ipynb'
  message: Potential black-box model extraction attack pattern detected
  description: 'Detects code patterns associated with black-box model extraction attacks
    via prediction APIs. Tramèr et al. (2016) showed that 650–4,013 API queries extract
    logistic regression and decision tree models with 100% functional agreement from
    Amazon ML and BigML. Orekondy et al. (2019) demonstrated stealing for as little
    as $30.

    '
  remediation: 'Implement query rate limiting and anomaly detection on API access
    patterns. Monitor for systematic query patterns. Consider prediction poisoning
    defenses (Orekondy et al., 2019/ICLR 2020).

    '
  owasp_llm: LLM10:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-002
  name: training-data-extraction-verbatim
  severity: CRITICAL
  category: model_extraction
  patterns:
  - (?i)\btraining\s+data\s+extract(?:ion)?\b
  - (?i)\bverbatim\s+(?:text|sequence|data)\b
  - (?i)\bmemorize[ds]?\s+(?:training|data|text)\b
  - (?i)\beidetic\s+memorization\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.json'
  - '*.ipynb'
  message: Training data extraction pattern detected — verbatim memorization exploitation
  description: 'Detects patterns related to extracting verbatim training data from
    language models. Carlini et al. (2020/USENIX Security 2021) demonstrated extraction
    of 600+ verbatim sequences from GPT-2 including PII (names, phone numbers, email
    addresses) using likelihood-ratio ranking. Nasr et al. (2023) extracted 10,000+
    training examples from ChatGPT for $200 using a divergence attack.

    '
  remediation: 'Deploy differential privacy training. Deduplicate training corpora.
    Monitor for high-volume generation requests. Apply output filtering for PII patterns.
    See Carlini et al. (2020) for mitigation recommendations.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-003
  name: divergence-attack-aligned-llm
  severity: CRITICAL
  category: model_extraction
  patterns:
  - (?i)\bdivergence\s+attack\b
  - (?i)repeat\s+the\s+word\s+\w+\s+forever
  - (?i)\brepeat\s+["']?\w+["']?\s+(?:forever|infinitely|continuously)\b
  - (?i)\bchatgpt\s+diverge\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: Divergence attack pattern detected — may cause aligned LLM to emit training
    data
  description: 'Detects patterns associated with the Nasr et al. (2023) divergence
    attack, which causes ChatGPT (gpt-3.5-turbo) to emit training data at 150x the
    normal rate by triggering divergence from chatbot-style behavior. The attack achieved
    extraction of 10,000+ training examples for $200 USD and revealed RLHF alignment
    does not eliminate memorization.

    '
  remediation: 'Monitor for repetitive token sequences in API requests. Implement
    generation length limits. Apply output filtering for memorized content patterns.
    Ensure production alignment defenses address divergence triggers.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-004
  name: knockoff-nets-api-query-automation
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bknockoff\b
  - (?i)\bsurrogate\s+model\b
  - (?i)\bsubstitute\s+model\s+training\b
  - (?i)(?:query|label)\s+(?:the\s+)?(?:victim|target|black.?box)\s+(?:model|api)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sh'
  message: Knockoff/surrogate model training via API querying detected
  description: 'Detects patterns consistent with Knockoff Nets (Orekondy et al., CVPR
    2019) — training a substitute model by querying a production API with arbitrary
    images and using predictions as labels. Demonstrated for as little as $30 against
    commercial vision APIs. CloudLeak (Yu et al., NDSS 2020) extended this to large-scale
    DNNs on Microsoft, Google, Face++, IBM, and Clarifai.

    '
  remediation: 'Implement query volume monitoring and user-level rate limiting. Deploy
    PRADA-style query distribution analysis (Juuti et al., 2018). Add noise to returned
    confidence values.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-ME-SCAN-005
  name: membership-inference-attack
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bmembership\s+inference\b
  - (?i)\btraining\s+(?:data\s+)?membership\b
  - (?i)\bin.training.set\b
  - (?i)\bshokri\s+(?:et\s+al|membership)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Membership inference attack pattern detected
  description: 'Detects code or configuration patterns associated with membership
    inference attacks — determining whether specific examples were used to train a
    model. Foundational work by Shokri et al. (2017) and extended by numerous subsequent
    papers. Often the first step in targeted training data extraction attacks (Sahili
    et al., 2025).

    '
  remediation: 'Apply differential privacy during training. Use prediction output
    confidence thresholds. Monitor for systematic loss/confidence probing patterns
    across multiple input examples.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-006
  name: pii-extraction-via-prompting
  severity: CRITICAL
  category: model_extraction
  patterns:
  - (?i)(?:phone\s+number|email\s+address|home\s+address)\s+of\s+\w+
  - (?i)\bPII\s+extract(?:ion)?\b
  - (?i)\bpersonal(?:ly)?\s+identifiable\s+information.*extract\b
  - (?i)\bcontact\s+(?:information|details)\s+of\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: PII extraction via LLM prompting pattern detected
  description: 'Detects prompts or code patterns aimed at extracting personally identifiable
    information from LLMs. Carlini et al. (2020) extracted real PII from GPT-2. Nakka
    et al. (2024/PII-Compass) achieved 6.86% phone number extraction rate using grounded
    prompting (1 in 15 phone numbers extractable). Cheng et al. (2024) extracted 54
    email addresses and 314 physical addresses from GitHub Copilot via code context
    injection.

    '
  remediation: 'Implement PII output filtering. Apply differential privacy during
    fine-tuning on PII-containing data. Use Private Memorization Editing (PME) for
    post-hoc protection (Ruzzetti et al., 2025).

    '
  owasp_llm: LLM02:2025
  cwe: CWE-359
- id: MEDUSA-ME-SCAN-007
  name: embedding-model-distillation-theft
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bembedding\s+model\s+steal(?:ing)?\b
  - (?i)\bdistill(?:ation)?\s+from\s+(?:openai|cohere|embedding)\s+api\b
  - (?i)\bthief\s+model\b
  - (?i)\bsteal(?:ing)?\s+(?:embedding|encoder)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Embedding model distillation theft pattern detected
  description: 'Detects patterns associated with stealing commercial embedding models
    by collecting (text, vector) pairs from APIs and training a student distillation
    model. Tamber et al. (2024/2025) demonstrated replicating OpenAI and Cohere embedding
    models for under $300. B4B (Dubinski et al., NeurIPS 2023) identifies SSL encoder
    APIs as especially vulnerable.

    '
  remediation: 'Implement B4B-style adaptive query monitoring and per-user embedding
    space coverage tracking. Apply per-user transformation of returned embeddings.
    Rate limit embedding API access.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-ME-SCAN-008
  name: bert-nlp-api-model-extraction
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\b(?:bert|xlnet|roberta).*(?:steal|extract|clone)\b
  - (?i)\bNLP\s+(?:model\s+)?(?:steal(?:ing)?|extraction)\b
  - (?i)\b(?:steal|extract).*(?:bert|xlnet|roberta)\b
  - (?i)\bfine.?tun(?:ed|ing)\s+(?:bert|xlnet|roberta).*(?:steal|clone|surrogate)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: BERT/NLP model extraction attack pattern detected
  description: 'Detects patterns associated with stealing BERT-based NLP API models.
    He et al. (NAACL 2021) demonstrated high adversarial transferability from stolen
    BERT models to black-box victims. Lyu et al. (2021) showed combined model extraction
    and attribute inference against BERT APIs, with pre-trained BERT backbone giving
    attackers a significant head-start.

    '
  remediation: 'Restrict fine-tuned BERT model deployment to authenticated users.
    Monitor for query patterns consistent with systematic BERT API extraction. Consider
    output perturbation defenses.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-ME-SCAN-009
  name: data-free-model-stealing-gan
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bdata.?free\s+model\s+steal(?:ing)?\b
  - (?i)\bDFMS\b
  - (?i)\bMAZE\s+(?:attack|model)\b
  - (?i)\bzero.?shot\s+model\s+(?:steal(?:ing)?|extract(?:ion)?)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Data-free model stealing (GAN/generative) pattern detected
  description: 'Detects patterns associated with data-free model stealing attacks
    using generative models (GAN, diffusion, VAE) to create synthetic queries. Sanyal
    et al. (CVPR 2022/DFMS-HL) achieved ~500x query reduction vs. zero-shot baseline
    using hard labels only. Liu et al. (2024) showed label diversity is the critical
    factor. Hondru et al. (2023) used diffusion models for even fewer API calls.

    '
  remediation: 'Monitor for high volumes of unusual/synthetic-looking API queries.
    Implement PRADA-style query distribution analysis. Consider prediction poisoning
    (Orekondy et al., 2020) to degrade quality of stolen model.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-ME-SCAN-010
  name: production-llm-projection-layer-extraction
  severity: CRITICAL
  category: model_extraction
  patterns:
  - (?i)\blogprob\s+(?:extraction|attack|bias)\b
  - (?i)\blogit.?bias\s+attack\b
  - (?i)\bprojection\s+(?:layer|matrix)\s+steal(?:ing)?\b
  - (?i)\bhidden\s+dimension\s+(?:recover|extract|infer)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Production LLM parameter extraction via logprob/logit-bias detected
  description: 'Detects patterns consistent with the Carlini et al. (ICML 2024) attack
    that extracts the embedding projection layer of production LLMs. For under $20
    USD, the full projection matrix of OpenAI ada (hidden dim=1024) and babbage (hidden
    dim=2048) was extracted. The attack exploits logprob APIs or logit-bias endpoints
    to recover low-rank final transformer layers.

    '
  remediation: 'Restrict or degrade logprob precision in API responses. Limit logit-bias
    parameter access. Monitor for systematic token probability probing patterns. OpenAI
    and Google have implemented mitigations post-disclosure.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-011
  name: system-prompt-extraction-attack
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)(?:reveal|repeat|print|show|output)\s+(?:your\s+)?(?:system\s+prompt|instructions|initialization)\b
  - (?i)\bsystem\s+prompt\s+extract(?:ion)?\b
  - (?i)\bignore\s+(?:previous|prior|all)\s+instructions\b
  - (?i)\bwhat\s+(?:are\s+)?your\s+(?:initial|system|hidden)\s+instructions\b
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  - '*.md'
  message: System prompt extraction attempt detected
  description: 'Detects patterns attempting to extract confidential system prompts
    from deployed LLMs. Das et al. (2025) showed system prompts are frequently extractable
    without hardening. System prompts contain business logic, proprietary instructions,
    API configurations, and other IP that should remain confidential. Direct requests
    succeed on many unhardened deployments.

    '
  remediation: 'Add explicit confidentiality instructions to system prompts. Implement
    output filtering for system prompt content. Monitor for direct prompt extraction
    attempts. Use Das et al. (2025) defense taxonomy to harden deployments.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-012
  name: soft-prompt-memorization-extraction
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bsoft\s+prompt\s+(?:tuning|optimization).*extract\b
  - (?i)\b(?:ETHICIST|loss.?smooth(?:ed|ing))\s+soft\s+prompt\b
  - (?i)\bsoft\s+prompt.*memorization\b
  - (?i)\bprefix.?based\s+(?:extraction|attack)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Soft prompt tuning for targeted training data extraction detected
  description: 'Detects patterns associated with ETHICIST (Zhang et al., ACL 2023)
    — soft prompt tuning to elicit targeted memorization of specific training data
    suffixes. Uses smoothed loss to increase ground-truth token probability and calibrated
    confidence for suffix selection. Used to extract email addresses, phone numbers,
    and fax numbers from GPT-Neo 1.3B.

    '
  remediation: 'Monitor for soft prompt optimization targeting known training data
    patterns. Apply differential privacy during training. Consider Private Memorization
    Editing (PME) for post-hoc protection of known memorized PII.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-013
  name: prada-evasion-query-distribution-manipulation
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bquery\s+distribution\s+(?:spoof|mimic|evade)\b
