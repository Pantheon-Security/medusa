- id: MEDUSA-ME-SCAN-099
  name: provably-private-fine-tuning-bypass-attempt
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bprovably\s+protect.*fine.?tun.*(?:bypass|extract|attack)\b
  - (?i)\bformal\s+guarantee.*fine.?tun.*(?:bypass|extract|fail)\b
  - (?i)\bfine.?tun.*(?:extract|memorize).*without.*(?:dp|differential\s+privacy|protection)\b
  - (?i)\bSegal.*2026.*(?:bypass|attack|extract|fail)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Provably protective fine-tuning bypass or unprotected fine-tuning extraction
    detected
  description: 'Detects attacks targeting fine-tuned LLMs deployed without provably
    protective fine-tuning procedures. Segal et al. (2026) proposed the first mechanism
    with a formal upper bound on fine-tuning data extraction probability. Without
    such protection, fine-tuning data is consistently more extractable than pretraining
    data. Attacks targeting LLMs deployed with only approximate privacy (LoRA-based
    unlearning, standard fine-tuning) are more likely to succeed.

    '
  remediation: 'Apply provably protective fine-tuning (Segal et al., 2026) for LLMs
    fine-tuned on sensitive data. Use differential privacy during fine-tuning phases.
    Conduct pre-deployment extraction audits specifically targeting fine-tuning data.
    Do not assume fine-tuning data is protected by default — fine-tuned examples are
    consistently the most extractable.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
