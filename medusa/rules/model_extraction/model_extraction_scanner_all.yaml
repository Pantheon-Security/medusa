  description: 'Detects patterns aimed at evading query distribution-based model extraction
    detection (PRADA — Juuti et al., 2018/Euro S&P 2019). PRADA detects extraction
    by identifying non-Gaussian query distributions. Adaptive attackers may attempt
    to mimic benign user query distributions to evade detection.

    '
  remediation: 'Deploy PRADA with adaptive baseline modeling. Combine query distribution
    analysis with rate limiting, user fingerprinting, and prediction perturbation
    as layered defenses.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-693
- id: MEDUSA-ME-SCAN-014
  name: model-inversion-training-data-reconstruction
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bmodel\s+inversion\b
  - (?i)\bInverseNet\b
  - (?i)\btraining\s+data\s+(?:reconstruction|inversion)\b
  - (?i)\breconstructed?\s+training\s+(?:sample|data|image)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Model inversion / training data reconstruction attack pattern detected
  description: 'Detects patterns associated with model inversion attacks that reconstruct
    training data from model outputs. InverseNet (Gong et al., IJCAI 2021) uses high-confidence
    API responses to reconstruct training-like samples, significantly reducing query
    budget for subsequent model extraction. Validated against Alibaba Cloud commercial
    API.

    '
  remediation: 'Limit confidence score precision in API responses. Apply output perturbation
    (prediction poisoning). Monitor for high-confidence query probing patterns consistent
    with inversion.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-015
  name: decomposition-extraction-benign-prompts
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\binstruction\s+decomposition\b
  - (?i)\bpiecewise\s+(?:extraction|prompt)\b
  - (?i)\bdecompos(?:e|ed|ing).*(?:article|extract|memorized)\b
