    benign-appearing prompts against frontier LLMs.

    '
  remediation: 'Implement output watermarking to detect reproduced copyrighted content.
    Apply semantic output monitoring beyond keyword filtering. Consider copyright
    detection tools in the generation pipeline.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-016
  name: federated-learning-cross-client-data-extraction
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bfederated\s+(?:learning|fine.?tuning).*(?:extract|steal|leak)\b
  - (?i)\bcross.?client\s+(?:data\s+)?(?:extract|attack|leak)\b
  - (?i)\bmalicious\s+(?:client|participant).*federated\b
  - (?i)\bgradient\s+(?:attack|inversion).*federated\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Federated learning cross-client data extraction attack pattern detected
  description: 'Detects patterns associated with attacks extracting other clients''
    private data in federated LLM fine-tuning scenarios. Hu et al. (2025) demonstrated
    that a malicious federated participant can craft gradient updates to cause the
    global model to memorize and emit other clients'' private training data.

    '
  remediation: 'Apply per-client differential privacy with gradient clipping in federated
    learning. Implement secure aggregation protocols. Use Byzantine-fault-tolerant
    aggregation to detect and exclude malicious client updates.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ME-SCAN-017
  name: pii-reconstruction-scrubbed-data
  severity: HIGH
  category: model_extraction
  patterns:
  - (?i)\bPII\s+reconstruction\b
  - (?i)\breconstruct.*\[MASK\]\b
  - (?i)\brecollect.*rank.*PII\b
  - (?i)\bscrubbed.*training.*(?:extract|reconstruct)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Scrubbed PII reconstruction attack pattern detected
  description: 'Detects patterns associated with R.R. (Meng et al., 2025) — a two-stage
    Recollect-and-Rank attack that reconstructs masked PII entities from scrubbed
