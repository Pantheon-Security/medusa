    to protect training data privacy.

    '
  remediation: 'Do not rely solely on PII masking as a privacy guarantee. Apply differential
    privacy training in addition to scrubbing. Consider Private Memorization Editing
    (PME) for known PII present in fine-tuning data.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-359
