rules:
- id: MEDUSA-MEXT-SCAN-001
  name: knockoffnets-substitute-model-training
  description: 'Detects KnockoffNets-style substitute model training: querying victim API with random/public data to train
    clone'
  severity: critical
  category: model_extraction
  patterns:
  - substitute[_\s]model
  - knockoff[_\s]?nets
  - clone[_\s]model
  - victim[_\s]model.*query
  - query[_\s]budget.*train
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  - '*.ts'
  message: 'Detected: KnockoffNets substitute model training pattern'
- id: MEDUSA-MEXT-SCAN-002
  name: maze-zeroth-order-gradient-estimation
  description: Detects MAZE-style data-free MEA using zeroth-order gradient estimation and disagreement objective
  severity: critical
  category: model_extraction
  patterns:
  - zeroth[_\s]order.*gradient
  - disagreement[_\s]loss
  - disagreement[_\s]objective
  - generator.*victim.*api
  - dfme|data.free.*model.*extract
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MAZE/DFME zeroth-order gradient extraction'
- id: MEDUSA-MEXT-SCAN-003
  name: ml-doctor-holistic-risk-api
  description: 'Detects ML-Doctor holistic risk assessment patterns: simultaneous membership inference, model extraction,
    and property inference'
  severity: high
  category: model_extraction
  patterns:
  - ml.doctor
  - membership[_\s]inference.*model[_\s]extraction
  - holistic.*risk.*ml
  - shadow[_\s]model.*attack
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  message: 'Detected: ML-Doctor multi-attack risk assessment'
- id: MEDUSA-MEXT-SCAN-004
  name: model-leeching-llm-extraction
  description: Detects LLM extraction via cheap API queries to distill into smaller model (Model Leeching pattern)
  severity: critical
  category: model_extraction
  patterns:
  - model[_\s]leeching
  - chatgpt.*roberta.*distill
  - llm.*extract.*fine.?tun
  - api.*label.*distillation
  - cheap.*api.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  - '*.ts'
  message: 'Detected: LLM model leeching/distillation extraction'
- id: MEDUSA-MEXT-SCAN-005
  name: army-of-thieves-ensemble-extraction
  description: Detects ensemble-based extraction using consensus entropy across multiple substitute models
  severity: high
  category: model_extraction
  patterns:
  - army[_\s]of[_\s]thieves
  - ensemble.*extraction
  - consensus[_\s]entropy.*substitute
  - multiple.*clone.*model.*vote
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Ensemble model extraction (Army of Thieves)'
- id: MEDUSA-MEXT-SCAN-006
  name: autolycus-xai-guided-extraction
  description: Detects AUTOLYCUS XAI-guided MEA using LIME/SHAP explanations to select optimal queries (TRAV-A strategy)
  severity: critical
  category: model_extraction
  patterns:
  - autolycus
  - lime.*shap.*model.*steal
  - xai.*guided.*extract
  - explanation.*query.*select.*steal
  - trav.?a[^a-z]
  - lime.*feature.*importance.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  message: 'Detected: AUTOLYCUS XAI-guided model extraction'
- id: MEDUSA-MEXT-SCAN-007
  name: disguide-two-clone-disagreement
  description: Detects DisGUIDE two-clone disagreement loss for query-efficient extraction (64.95% query reduction)
  severity: high
  category: model_extraction
  patterns:
  - disguide
  - two[_\s]clone.*disagree
  - clone[_\s]disagree.*loss
  - query[_\s]reduction.*disagree.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DisGUIDE two-clone disagreement extraction'
- id: MEDUSA-MEXT-SCAN-008
  name: rnn-lstm-extraction-temperature
  description: Detects RNN/LSTM model extraction using softmax temperature scaling and leaky timing side-channels
  severity: high
  category: model_extraction
  patterns:
  - rnn.*extract.*temperature
  - lstm.*softmax.*temperature.*steal
  - leaky[_\s]tim.*model.*extract
  - teacher[_\s]bound.*regression.*rnn
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: RNN/LSTM model extraction with temperature scaling'
- id: MEDUSA-MEXT-SCAN-009
  name: gnn-extraction-lds-graph
  description: Detects GNN model extraction attacks using LDS graph generation (Attack-0 through Attack-6 taxonomy)
  severity: high
  category: model_extraction
  patterns:
  - gnn.*model.*steal
  - graph.*neural.*extract.*clone
  - lds[_\s]graph.*generat
  - link[_\s]steal.*gnn
  - node.*feature.*extract.*gnn
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: GNN model extraction with LDS graph generation'
- id: MEDUSA-MEXT-SCAN-010
  name: cache-sca-gemm-extraction
  description: Detects precise model extraction via cache side-channel attacks monitoring GEMM operations (itcopy/oncopy/kernel
    patterns)
  severity: critical
  category: model_extraction
  patterns:
  - gemm.*monitor.*model
  - itcopy|oncopy.*cache.*extract
  - cache[_\s]timing.*neural.*weight
  - flush.?reload.*dnn
  - dcg[_\s]generat.*extract
  - libopenblas.*spy
  - perf[_\s]event.*gemm
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.sh'
  message: 'Detected: Cache side-channel GEMM-based model extraction'
- id: MEDUSA-MEXT-SCAN-011
  name: gpu-side-channel-nvprof
  description: Detects GPU side-channel attacks using nvprof/CUDA profiling to extract model architecture and parameters
  severity: critical
  category: model_extraction
  patterns:
  - nvprof.*model
  - cuda.*profil.*extract
  - gpu.*side.?channel.*neural
  - pytorch.*swap.*malicious
  - aggregate.*gpu.*profile.*layer
  file_types:
  - '*.py'
  - '*.sh'
  - '*.c'
  - '*.cpp'
  message: 'Detected: GPU side-channel model extraction via nvprof'
- id: MEDUSA-MEXT-SCAN-012
  name: megex-vanilla-gradient-xai
  description: Detects MEGEX data-free extraction exploiting vanilla gradient XAI for exact gradient computation
  severity: critical
  category: model_extraction
  patterns:
  - megex
  - vanilla[_\s]gradient.*extract
  - exact[_\s]gradient.*black.?box
  - xai.*gradient.*data.?free.*clone
  - gradient[_\s]explanation.*steal
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MEGEX vanilla gradient XAI extraction'
- id: MEDUSA-MEXT-SCAN-013
  name: tempest-tabular-statistics-extraction
  description: Detects TEMPEST tabular data extraction using public statistics (mean/variance/min/max) for synthetic query
    generation
  severity: high
  category: model_extraction
  patterns:
  - tempest.*tabular.*extract
  - gen[_\s]var.*gen[_\s]min.*steal
  - public[_\s]statistic.*synthetic.*query
  - mean.*variance.*tabular.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: TEMPEST tabular statistics-based extraction'
- id: MEDUSA-MEXT-SCAN-014
  name: lord-llm-locality-reinforced-distillation
  description: Detects LoRD LLM extraction via locality reinforced distillation and preference optimization targeting Llama/GPT-4
  severity: critical
  category: model_extraction
  patterns:
  - lord.*llm.*extract
  - locality[_\s]reinforced.*distill
  - lavish.*framework.*extract
  - preference[_\s]optim.*llm.*clone
  - llama.*gpt.*extract.*distill
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  - '*.ts'
  message: 'Detected: LoRD LLM locality-reinforced distillation extraction'
- id: MEDUSA-MEXT-SCAN-015
  name: tra-tree-reconstruction-counterfactual
  description: Detects Tree Reconstruction Attack using counterfactual queries via OCEAN/DiCE oracles for perfect fidelity
  severity: critical
  category: model_extraction
  patterns:
  - tree[_\s]reconstruct.*attack
  - counterfactual.*perfect.*fidelity
  - ocean.*dice.*extract.*tree
  - tra[_\s]attack.*decision.*tree
  - sub.?linear.*node.*reconstruct
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: TRA tree reconstruction via counterfactual oracles'
- id: MEDUSA-MEXT-SCAN-016
  name: marich-entropy-gradient-sampling
  description: Detects MARICH distributionally equivalent extraction using entropy+gradient+loss sampling (500-8000 queries)
  severity: high
  category: model_extraction
  patterns:
  - marich[_\s]extract
  - entropy.*gradient.*loss.*sampl.*steal
  - distributional.*equivalent.*extract
  - kl.?divergence.*clone.*low.*query
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MARICH entropy-gradient-loss sampling extraction'
- id: MEDUSA-MEXT-SCAN-017
  name: hard-label-cryptanalytic-extraction
  description: Detects hard-label cryptanalytic extraction exploiting persistent neurons and cross-layer activation boundaries
  severity: critical
  category: model_extraction
  patterns:
  - cryptanalytic.*extract
  - persistent[_\s]neuron.*extract
  - cross.?layer.*activation.*bound
  - neuron[_\s]wiggle.*extract
  - hard.?label.*sign.*recover.*weight
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sage'
  message: 'Detected: Hard-label cryptanalytic model extraction'
- id: MEDUSA-MEXT-SCAN-018
  name: dualcf-counterfactual-boundary-queries
  description: Detects DualCF extraction using counterfactual and counter-counterfactual query pairs to probe decision boundaries
  severity: high
  category: model_extraction
  patterns:
  - dualcf
  - counter.?counterfactual.*extract
  - cf.*ccf.*boundary.*steal
  - counterfactual.*pair.*substitute.*train
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DualCF counterfactual boundary extraction'
- id: MEDUSA-MEXT-SCAN-019
  name: swifttheft-reference-model-extraction
  description: Detects SwiftTheft extraction using reference models and distribution estimation (98% time reduction)
  severity: high
  category: model_extraction
  patterns:
  - swift[_\s]theft
  - reference[_\s]model.*log[_\s]likelihood.*steal
  - distribution[_\s]estim.*reference.*clone
  - query[_\s]efficient.*reference.*model.*extract
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: SwiftTheft reference model extraction'
- id: MEDUSA-MEXT-SCAN-020
  name: arch-hints-unified-memory-probe
  description: Detects UMProbe architecture extraction via unified memory PCIe far-fault pattern analysis
  severity: critical
  category: model_extraction
  patterns:
  - umprobe
  - pcie.*far.?fault.*arch
  - unified[_\s]memory.*page.*fault.*model
  - pflat.*migsize.*comarchs
  - gpu.*memory.*migration.*arch.*extract
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.sh'
  message: 'Detected: UMProbe unified memory PCIe architecture extraction'
- id: MEDUSA-MEXT-SCAN-021
  name: cpa-systolic-array-power-analysis
  description: Detects correlation power analysis against DNN accelerators (systolic array/FPGA/TPU wavefront)
  severity: critical
  category: model_extraction
  patterns:
  - correlation[_\s]power.*systolic
  - cpa.*dnn.*weight.*recover
  - power[_\s]trace.*neural.*param
  - wavefront.*tpu.*cpa
  - fpga.*power.*chain.*cpa
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  - '*.m'
  message: 'Detected: CPA systolic array DNN weight extraction'
- id: MEDUSA-MEXT-SCAN-022
  name: ssl-speech-model-extraction
  description: Detects MEA against SSL speech models (HuBERT/WavLM) using FPS clip selection and DistilHuBERT objective
  severity: high
  category: model_extraction
  patterns:
  - hubert.*wavlm.*steal
  - ssl.*speech.*extract.*clone
  - fps[_\s]clip.*select.*distil
  - l_cos.*l_l1.*speech.*extract
  - distilhubert.*target.*extract
  file_paths:
  - '*.py'
  - '*.ipynb'
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: SSL speech model extraction'
- id: MEDUSA-MEXT-SCAN-023
  name: thief-beware-drl-guided-extraction
  description: Detects DRL-guided MEA framework using i-FGSM adversarial examples and query utility analysis
  severity: high
  category: model_extraction
  patterns:
  - drl.*guided.*model.*steal
  - reinforcement.*learning.*query.*steal
  - i.?fgsm.*model.*extract.*rl
  - query[_\s]utility.*drl.*steal
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DRL-guided reinforcement learning MEA'
- id: MEDUSA-MEXT-SCAN-024
  name: distillguard-cot-removal-bypass
  description: Detects attempts to bypass DistillGuard by stripping chain-of-thought and exploiting knowledge distillation
  severity: high
  category: model_extraction
  patterns:
  - distillguard.*bypass
  - cot.*remov.*distill.*extract
  - chain.?of.?thought.*strip.*clone
  - kd.*perturbation.*limit.*bypass
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.js'
  - '*.ts'
  message: 'Detected: DistillGuard CoT-removal bypass attempt'
- id: MEDUSA-MEXT-SCAN-025
  name: gan-data-free-extraction
  description: Detects GAN-based data-free model extraction using generative adversarial networks for synthetic query generation
  severity: critical
  category: model_extraction
  patterns:
  - gan.*data.?free.*extract
  - generator.*discriminator.*model.*steal
  - synthetic.*query.*gan.*victim
  - dfme.*gan.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: GAN-based data-free model extraction'
- id: MEDUSA-MEXT-SCAN-026
  name: image-to-image-translation-extraction
  description: Detects extraction attacks against image-to-image translation models using domain shift and wavelet regularization
  severity: high
  category: model_extraction
  patterns:
  - i2i.*translation.*steal
  - image.to.image.*extract.*clone
  - domain[_\s]shift.*extract.*translation
  - wavelet.*regulariz.*image.*steal
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Image-to-image translation model extraction'
- id: MEDUSA-MEXT-SCAN-027
  name: object-detection-extraction
  description: Detects extraction attacks against object detection models (DFME-OD, MEAOD patterns)
  severity: high
  category: model_extraction
  patterns:
  - object[_\s]detect.*model.*steal
  - bounding[_\s]box.*extract.*clone
  - yolo.*faster.?rcnn.*extract
  - meaod|dfme.*object.*detect
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Object detection model extraction'
- id: MEDUSA-MEXT-SCAN-028
  name: mebench-benchmark-framework
  description: Detects use of MEA benchmark frameworks for systematic evaluation/execution of extraction attacks
  severity: medium
  category: model_extraction
  patterns:
  - mebench
  - meaeq|mea[_\s]benchmark
  - extraction[_\s]benchmark.*victim
  - model[_\s]steal.*eval.*framework
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: 'Detected: MEA benchmark framework usage'
- id: MEDUSA-MEXT-SCAN-029
  name: blinfed-fhe-federated-extraction
  description: Detects extraction attacks targeting FHE-based federated foundation models via permutation pattern analysis
  severity: critical
  category: model_extraction
  patterns:
  - blindfed.*extract
  - fhe.*federat.*model.*extract
  - sample[_\s]permutation.*fhe.*steal
  - homomorphic.*encrypt.*model.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: FHE federated model extraction'
- id: MEDUSA-MEXT-SCAN-030
  name: atom-gnn-rl-sequential-extraction
  description: Detects ATOM GNN extraction using sequential modeling with RL and k-core graph pruning
  severity: high
  category: model_extraction
  patterns:
  - atom.*gnn.*extract
  - k.?core.*graph.*rl.*steal
  - sequential.*model.*gnn.*extract
  - reinforcement.*gnn.*query.*select
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: ATOM GNN RL-sequential extraction'
- id: MEDUSA-MEXT-SCAN-031
  name: linear-model-cf-extraction
  description: Detects linear model extraction using single counterfactual query (1 CF for differentiable, p+1 for non-differentiable)
  severity: high
  category: model_extraction
  patterns:
  - linear.*model.*cf.*extract
  - counterfactual.*linear.*recover.*weight
  - one.*cf.*query.*linear.*steal
  - p.1.*query.*non.differentiable.*extract
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.sage'
  message: 'Detected: Linear model counterfactual extraction'
- id: MEDUSA-MEXT-SCAN-032
  name: api-query-rate-anomaly
  description: Detects high-volume systematic API querying patterns indicative of model extraction attempts
  severity: high
  category: model_extraction
  patterns:
  - for.*range.*api.*predict
  - batch.*query.*model.*api.*loop
  - openai.*predict.*loop.*collect
  - requests.*post.*inference.*batch.*label
  - collect.*soft[_\s]label.*api
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.sh'
  message: 'Detected: High-volume API query pattern (potential extraction)'
- id: MEDUSA-MEXT-SCAN-033
  name: soft-label-collection-knowledge-distillation
  description: Detects collection of soft labels/logits from victim model for knowledge distillation extraction
  severity: critical
  category: model_extraction
  patterns:
  - soft[_\s]label.*victim
  - logit.*collect.*distill
  - temperature.*distill.*victim.*api
  - kl[_\s]div.*logit.*teacher.*victim
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Soft-label collection for distillation extraction'
- id: MEDUSA-MEXT-SCAN-034
  name: mlpaas-extraction-script
  description: Detects scripts systematically querying MLaaS platforms (AWS SageMaker, Azure ML, Google Vertex AI) for extraction
  severity: critical
  category: model_extraction
  patterns:
  - sagemaker.*invoke.*endpoint.*loop
  - azure.*ml.*predict.*batch.*save
  - vertex.*ai.*predict.*collect.*label
  - mlflow.*model.*serve.*extract
  - huggingface.*inference.*api.*batch.*clone
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.sh'
  message: 'Detected: MLaaS systematic querying for extraction'
- id: MEDUSA-MEXT-SCAN-035
  name: cega-pagerank-query-selection
  description: Detects CEGA GNN extraction using PageRank+entropy+K-Means adaptive cycle query selection
  severity: high
  category: model_extraction
  patterns:
  - cega.*gnn.*extract
  - pagerank.*entropy.*kmeans.*steal
  - adaptive.*cycle.*query.*gnn.*extract
  - representativeness.*uncertainty.*diversity.*gnn
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CEGA PageRank-entropy query selection extraction'
- id: MEDUSA-MEXT-SCAN-036
  name: radep-behavioral-kl-extraction
  description: Detects RADEP composite uncertainty and behavioral KL divergence extraction with adaptive perturbation
  severity: high
  category: model_extraction
  patterns:
  - radep.*extract
  - behavioral[_\s]kl.*adaptive.*perturb
  - composite[_\s]uncertainty.*extract
  - kl.*behav.*adaptive.*query.*steal
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: RADEP behavioral KL extraction'
- id: MEDUSA-MEXT-SCAN-037
  name: mer-inspector-ntk-extraction
  description: Detects MER-Inspector NTK-based model extraction risk computation (MRC = Δθo^T · Θ^-1 · Δθo)
  severity: medium
  category: model_extraction
  patterns:
  - mer.?inspector
  - ntk.*model.*extract.*risk
  - neural[_\s]tangent.*kernel.*steal
  - mrc.*extraction.*risk.*compute
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MER-Inspector NTK extraction risk computation'
- id: MEDUSA-MEXT-SCAN-038
  name: watermark-removal-attack
  description: Detects attempts to remove model watermarks (fine-tuning, pruning, distillation) to erase IP protection
  severity: critical
  category: model_extraction
  patterns:
  - watermark.*remov.*fine.?tun
  - prune.*watermark.*model
  - distill.*remove.*watermark
  - wrk[_\s]attack.*watermark
  - evade.*watermark.*verif
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Watermark removal/evasion attack'
- id: MEDUSA-MEXT-SCAN-039
  name: divqat-kl-defense-bypass
  description: Detects attempts to bypass DivQAT KL-divergence quantization-aware training defense
  severity: medium
  category: model_extraction
  patterns:
  - divqat.*bypass
  - quantiz.*aware.*kl.*div.*bypass
  - qat.*defense.*evade.*extract
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DivQAT KL defense bypass attempt'
- id: MEDUSA-MEXT-SCAN-040
  name: misleader-bilevel-active-defense-bypass
  description: Detects MISLEADER-style attack on active defenses using bilevel optimization and heterogeneous ensemble
  severity: high
  category: model_extraction
  patterns:
  - misleader.*extract
  - bilevel.*optim.*active.*defense.*bypass
  - heterogeneous.*ensemble.*mislead.*extract
  - wasserstein.*misleader.*clone
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: MISLEADER bilevel active defense bypass'
- id: MEDUSA-MEXT-SCAN-041
  name: bam-evolutionary-boundary-sampling
  description: Detects BAM (Boundary Aware Model-extraction) using evolutionary strategy to sample low-confidence regions
    along decision manifolds for high-fidelity extraction with 10-600x query reduction
  severity: critical
  category: model_extraction
  patterns:
  - boundary[_\s]aware.*model.*extract
  - bam.*extract.*evolut
  - low[_\s]confidence.*boundary.*sampl.*extract
  - fitness.*max.*f.*x.*boundary.*extract
  - mutate.*sampl.*boundary.*victim
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: BAM evolutionary boundary sampling extraction'
- id: MEDUSA-MEXT-SCAN-042
  name: e3-varres-temperature-extraction
  description: Detects E3 (Efficient and Effective Model Extraction) using varying-resolution two-stage training and black-box
    temperature scaling via log(sigma(z))/tau to recover dark knowledge
  severity: critical
  category: model_extraction
  patterns:
  - e3.*extract.*varres
  - varying[_\s]resolution.*surrogate.*victim
  - log.*sigma.*tau.*black.?box.*extract
  - temperature.*black.?box.*dark[_\s]knowledge
  - randomresizedcrop.*surrogate.*victim.*kl
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: E3 VarRes/temperature-scaling extraction'
- id: MEDUSA-MEXT-SCAN-043
  name: language-guided-ood-query-selection
  description: Detects language-guided OOD query selection using CLIP/MobileCLIP semantic similarity to select proxy dataset
    classes semantically close to victim task (E3 pattern)
  severity: high
  category: model_extraction
  patterns:
  - clip.*semantic.*ood.*victim.*query
  - language.*encoder.*ood.*class.*select.*extract
  - mobileclip.*lsvrc.*surrogate.*victim
  - semantic[_\s]similar.*ood.*extract.*query
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Language-guided OOD query selection for extraction'
- id: MEDUSA-MEXT-SCAN-044
  name: test-time-distribution-alignment-extraction
  description: Detects test-time distribution alignment (TTDA) used post-deployment to adapt surrogate model prototype weights
    using unlabeled target samples encountered during inference
  severity: high
  category: model_extraction
  patterns:
  - ttda.*surrogate.*prototype.*adapt
  - test.?time.*distribut.*align.*surrogate
  - prototype.*update.*low[_\s]entropy.*surrogate.*deploy
  - covariate[_\s]shift.*surrogate.*victim.*adapt
  file_types:
  - '*.py'
