rules:
- id: MEDUSA-SEB-SCAN-001
  name: llm-rce-exec-chain
  description: Detects use of exec/eval on LLM output, a primary RCE vector in LLM-integrated apps where model output is passed
    directly to code execution functions
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)exec\s*\(.*\b(llm|model|completion|response|output|result|answer|chat|gpt|claude)\b
  - (?i)eval\s*\(.*\b(llm|model|completion|response|output|result|answer|chat|gpt|claude)\b
  file_types:
  - '*.py'
  message: 'Detected: llm-rce-exec-chain'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-94
  source_paper: Liu et al. (2023) - RCE via direct execution of LLM output in integrated apps
- id: MEDUSA-SEB-SCAN-002
  name: llm-subprocess-injection
  description: Detects subprocess calls constructed with LLM-generated content, enabling command injection through AI output
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)subprocess\.(call|run|Popen|check_output)\s*\(.*\b(llm|model|completion|response|output|result|chat)\b
  - (?i)os\.(system|popen|exec[lv]?[pe]?)\s*\(.*\b(llm|model|completion|response|output|result|chat)\b
  file_types:
  - '*.py'
  message: 'Detected: llm-subprocess-injection'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-78
  source_paper: Liu et al. (2023) - OS command injection via LLM output piped to subprocess
- id: MEDUSA-SEB-SCAN-003
  name: langchain-unsafe-tool-execution
  description: Detects LangChain patterns that allow arbitrary code execution through tools without sandboxing, including
    PythonREPLTool and BashProcess
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)from\s+langchain.*import.*PythonREPLTool
  - (?i)from\s+langchain.*import.*BashProcess
  - (?i)from\s+langchain.*import.*ShellTool
  - (?i)PythonREPLTool\s*\(
  - (?i)Tool\s*\(.*func\s*=\s*(exec|eval|os\.system)
  file_types:
  - '*.py'
  message: 'Detected: langchain-unsafe-tool-execution'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-94
  source_paper: Liu et al. (2023) - Unsandboxed tool execution in LangChain agent frameworks
- id: MEDUSA-SEB-SCAN-004
  name: jinja2-ssti-llm-output
  description: Detects Jinja2 template rendering with LLM output, enabling server-side template injection through AI-generated
    content
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)Template\s*\(.*\b(llm|model|completion|response|output|result|chat)\b
  - (?i)from_string\s*\(.*\b(llm|model|completion|response|output|result|chat)\b
  - (?i)render_template_string\s*\(.*\b(llm|model|completion|response|output|result|chat)\b
  file_types:
  - '*.py'
  message: 'Detected: jinja2-ssti-llm-output'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-1336
  source_paper: Liu et al. (2023) - SSTI through LLM output injected into template engines
- id: MEDUSA-SEB-SCAN-005
  name: container-escape-syscall-abuse
  description: Detects patterns associated with container escape via syscall abuse, including unshare, nsenter, and mount
    namespace manipulation used by LLM agents
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(os\.system|subprocess\..{0,20})\s*\(.{0,60}(unshare|nsenter|mount\s+--bind|chroot)\b
  - (?i)(os\.system|subprocess\..{0,20})\s*\(.{0,60}(/proc/\d+/ns/|/proc/1/root)\b
  - (?i)import\s+ctypes.{0,200}(SYS_unshare|SYS_mount|SYS_pivot_root)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: container-escape-syscall-abuse'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Marchand et al. (2026) - LLM-driven container escape via namespace and mount manipulation
- id: MEDUSA-SEB-SCAN-006
  name: docker-socket-access-from-ai
  description: Detects AI-generated code accessing Docker socket for container escape, a key attack vector identified in LLM
    sandbox escape benchmarks
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(docker\.sock|/var/run/docker)
  - (?i)docker\s+(run|exec|cp).{0,40}--privileged
  - (?i)import\s+docker.{0,100}from_env\s*\(
  - (?i)requests\.(get|post|put)\s*\(.{0,60}(docker\.sock|:2375|:2376)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: docker-socket-access-from-ai'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Marchand et al. (2026) - Docker socket exploitation for container sandbox escape
- id: MEDUSA-SEB-SCAN-007
  name: cgroup-escape-pattern
  description: Detects cgroup-based container escape techniques that LLMs may generate, including notify_on_release and release_agent
    abuse
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(notify_on_release|release_agent).{0,60}(cgroup|/sys/fs/cgroup)
  - (?i)open\s*\(.{0,60}/sys/fs/cgroup.{0,40}(release_agent|notify_on_release)
  - (?i)mkdir.{0,40}/sys/fs/cgroup.{0,60}(echo|write)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: cgroup-escape-pattern'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Marchand et al. (2026) - cgroup release_agent container escape technique
- id: MEDUSA-SEB-SCAN-008
  name: proc-filesystem-escape
  description: Detects attempts to escape containers via /proc filesystem manipulation including accessing host PID namespace
    and core_pattern abuse
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)open\s*\(.{0,40}/proc/(sysrq-trigger|sys/kernel/core_pattern|1/root)
  - (?i)(cat|echo|write).{0,40}/proc/sys/kernel/core_pattern
  - (?i)/proc/self/(exe|root|cwd|fd)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: proc-filesystem-escape'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Marchand et al. (2026) - /proc filesystem abuse for container escape
- id: MEDUSA-SEB-SCAN-009
  name: code-interpreter-file-exfiltration
  description: Detects patterns where code interpreter agents read sensitive host files outside sandbox boundaries
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)open\s*\(.{0,40}(/etc/passwd|/etc/shadow|/etc/hosts|\.env|\.ssh/|id_rsa)
  - (?i)(read|load)_file\s*\(.{0,40}(/etc/|/root/|/home/|~/)\b
  - (?i)pathlib\.Path\s*\(.{0,40}(/etc/|/root/|/home/|/proc/)
  file_types:
  - '*.py'
  message: 'Detected: code-interpreter-file-exfiltration'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-22
  source_paper: Ba et al. (2026) - CIBER benchmark file exfiltration category for code interpreter abuse
- id: MEDUSA-SEB-SCAN-010
  name: code-interpreter-network-exfiltration
  description: Detects network exfiltration patterns in code interpreter output, sending sensitive data to external hosts
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)requests\.(post|put|get)\s*\(.{0,100}(password|secret|key|token|credential|env|ssh)
  - (?i)urllib\.request\.urlopen\s*\(.{0,60}(password|secret|key|token)
  - (?i)socket\.socket.{0,80}(send|connect).{0,60}(password|secret|key|token)
  file_types:
  - '*.py'
  message: 'Detected: code-interpreter-network-exfiltration'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-200
  source_paper: Ba et al. (2026) - CIBER benchmark data exfiltration via network in code interpreter
- id: MEDUSA-SEB-SCAN-011
  name: code-interpreter-persistence-mechanism
  description: Detects code interpreter generating persistence mechanisms like cron jobs, startup scripts, or systemd services
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(crontab|/etc/cron|/var/spool/cron)
  - (?i)open\s*\(.{0,40}(/etc/rc\.local|/etc/init\.d/|/etc/systemd/|\.bashrc|\.profile)
  - (?i)systemd.{0,40}(enable|start|daemon-reload)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: code-interpreter-persistence-mechanism'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Ba et al. (2026) - CIBER benchmark post-exploitation persistence in code interpreters
- id: MEDUSA-SEB-SCAN-012
  name: browser-agent-dom-escape
  description: Detects browser AI agent patterns that access DOM elements or execute JavaScript outside designated sandbox
    boundaries
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)page\.evaluate\s*\(.{0,100}(document\.cookie|localStorage|sessionStorage|XMLHttpRequest)
  - (?i)cdp\.send\s*\(.{0,40}(Runtime\.evaluate|Page\.navigate|Network\.)
  - (?i)playwright.{0,80}(evaluate|add_script_tag|route).{0,80}(cookie|storage|fetch)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: browser-agent-dom-escape'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Meng et al. (2025) - Browser AI agent escaping DOM isolation boundaries
- id: MEDUSA-SEB-SCAN-013
  name: browser-agent-credential-exfiltration
  description: Detects browser AI agent code that harvests credentials, cookies, or authentication tokens beyond its authorized
    scope
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(context|page)\.cookies\s*\(
  - (?i)page\.evaluate.{0,60}document\.cookie
  - (?i)(get_cookies|storage\.get|localStorage\.getItem).{0,40}(auth|token|session|jwt|api.?key)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: browser-agent-credential-exfiltration'
  remediation: Review usage context. Remove if not authorized research/testing.
