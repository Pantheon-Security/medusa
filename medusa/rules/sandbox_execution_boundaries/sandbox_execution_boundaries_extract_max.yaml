- id: MEDUSA-SEB-SCAN-014
  name: sandbox-bypass-import-restriction
  description: Detects attempts to bypass sandbox import restrictions using importlib, __import__, or ctypes to load forbidden
    modules
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)__import__\s*\(.{0,40}(os|sys|subprocess|shutil|socket|ctypes|signal)\b
  - (?i)importlib\.(import_module|__import__)\s*\(.{0,40}(os|subprocess|shutil|socket|ctypes)
  - (?i)ctypes\.CDLL\s*\(.{0,40}(libc|libpthread|libdl)
  file_types:
  - '*.py'
  message: 'Detected: sandbox-bypass-import-restriction'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Dou et al. (2024) - Bypassing LLM sandbox import restrictions via dynamic loading
- id: MEDUSA-SEB-SCAN-015
  name: sandbox-resource-limit-bypass
  description: Detects code that attempts to modify or bypass sandbox resource limits such as rlimit, seccomp filters, or
    cgroup constraints
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)resource\.setrlimit\s*\(
  - (?i)prctl\s*\(.{0,40}(PR_SET_SECCOMP|PR_SET_NO_NEW_PRIVS)
  - (?i)seccomp\.(load|SyscallFilter|set_attr)
  file_types:
  - '*.py'
  message: 'Detected: sandbox-resource-limit-bypass'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-693
  source_paper: Dou et al. (2024) - Sandbox resource limit manipulation in LLM code execution
- id: MEDUSA-SEB-SCAN-016
  name: interpreter-privilege-escalation
  description: Detects code interpreter generating privilege escalation attempts including sudo abuse, SUID exploitation,
    and capability manipulation
  severity: critical
  category: sandbox_execution_boundaries
  patterns:
  - (?i)(os\.system|subprocess\..{0,20})\s*\(.{0,60}(sudo|su\s+-|chmod\s+[u+]?[0-7]*s|setuid|setgid)
  - (?i)(os\.system|subprocess\..{0,20})\s*\(.{0,60}(chown\s+root|cap_set|setcap)
  file_types:
  - '*.py'
  - '*.sh'
  message: 'Detected: interpreter-privilege-escalation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-269
  source_paper: Bhatt et al. (2024) - CyberSecEval 2 code interpreter privilege escalation category
- id: MEDUSA-SEB-SCAN-017
  name: interpreter-reflected-attack
  description: Detects code interpreter generating reflected attacks - sending malicious requests to external systems using
    the interpreter as a proxy
  severity: high
  category: sandbox_execution_boundaries
  patterns:
  - (?i)requests\.(get|post|put|delete)\s*\(.{0,100}(Authorization|Bearer|api.?key).{0,60}(internal|private|10\.|172\.|192\.168)
  - (?i)urllib\.request\..{0,40}(internal|private|localhost|127\.0\.0|10\.|172\.|192\.168)
  - (?i)smtplib\.SMTP.{0,80}(sendmail|send_message)
  file_types:
  - '*.py'
  message: 'Detected: interpreter-reflected-attack'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-918
  source_paper: Bhatt et al. (2024) - CyberSecEval 2 reflected attacks via code interpreter
