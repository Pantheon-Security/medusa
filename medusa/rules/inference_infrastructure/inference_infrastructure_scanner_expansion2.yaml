metadata:
  source: expansion2 2026-03-02
  id_range: MEDUSA-II-SCAN-061 to MEDUSA-II-SCAN-100
rules:
- id: MEDUSA-II-SCAN-061
  name: gpu-side-channel-timing-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(gpu.side.channel|gpu.timing|gpu.cache.side.channel)\b.{0,60}\b(attack|exploit|probe|leak)\b
  - (?i)\b(cuda.timing|cuda.cache|shared.memory.timing).{0,60}\b(side.channel|attack|exploit|leak)\b
  - (?i)\b(inter.kernel.timing|kernel.timing.leak|sm.timing).{0,60}\b(exploit|attack|side.channel)\b
  - (?i)\b(gpu.memory.timing|global.memory.timing).{0,80}\b(side.channel|probe|attack|reconstruct)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.c'
  - '*.cu'
  - '*.txt'
  message: GPU side-channel timing attack pattern detected
  description: Detects patterns associated with GPU-based timing side-channel attacks against LLM inference infrastructure.
    CUDA shared memory and global memory timing differences can be exploited by co-located processes on shared GPU hardware
    to infer model weights, input tokens, or output distributions. In multi-tenant inference environments (cloud GPU rental),
    cross-tenant timing attacks via CUDA inter-kernel timing or SM-level contention can leak inference request content. Luo
    et al. (2025) and related work documented hardware-level silicon security requirements for private LLM inference.
  remediation: Isolate inference tenants to dedicated GPU hardware. Disable shared memory access between untrusted co-tenant
    processes. Apply GPU process isolation and hardware-level access control (MIG on NVIDIA A100/H100). Monitor for anomalous
    GPU memory access timing patterns from co-tenant containers.
  owasp_llm: LLM10:2025
  cwe: CWE-203
- id: MEDUSA-II-SCAN-062
  name: speculative-decoding-token-timing-leak
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\bspeculative.decod.{0,60}\b(timing|side.channel|leak|token.reveal|infer)\b
  - (?i)\b(draft.model|target.model).{0,60}\b(timing.attack|side.channel|token.leak|information.leak)\b
  - (?i)\b(token.latency|per.token.latency|ttft.variation).{0,60}\b(speculative|side.channel|infer.input|reconstruct)\b
  - (?i)\b(speculative.execution|speculative.sampling).{0,60}\b(timing.oracle|side.channel|leak)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Speculative decoding token timing side-channel attack detected
  description: Detects patterns associated with timing side-channel attacks exploiting speculative decoding in LLM serving
    frameworks. Speculative decoding uses a small draft model to speculatively generate tokens verified by a larger target
    model; the number of accepted tokens per step and associated latency reveals information about the generated sequence.
    Attackers can measure per-step latency to reconstruct partial output before the full response is returned, revealing sensitive
    information in streaming inference contexts.
  remediation: Apply constant-time output streaming that does not reveal speculative acceptance rates. Add timing jitter to
    streaming responses. Monitor for clients performing high-resolution timing measurements against inference endpoints. Disable
    speculative decoding for confidential inference workloads.
  owasp_llm: LLM06:2025
  cwe: CWE-203
- id: MEDUSA-II-SCAN-063
  name: kv-cache-cross-tenant-poisoning
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\bkv.?cache.{0,40}\b(poison|inject|corrupt|cross.tenant|cross.user|contaminate)\b
  - (?i)\b(prefix.cache|shared.kv.cache|cached.kv).{0,60}\b(poison|inject|corrupt|tamper|manipulat)\b
  - (?i)\b(radix.cache.poison|sglang.cache.poison|cache.prefix.attack).{0,60}\b(kv|inference)\b
  - (?i)\b(cross.request.kv|shared.prefix.kv).{0,60}\b(leak|poison|contaminate|inject)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: KV cache cross-tenant poisoning or shared prefix injection detected
  description: Detects patterns associated with cross-tenant KV cache poisoning in multi-tenant LLM serving. SGLang's radix
    attention and vLLM's prefix caching reuse KV cache entries across requests sharing common prefixes. An adversary can craft
    requests to pre-populate cached prefixes with malicious context that contaminates subsequent requests from other users
    sharing that prefix. This enables prompt injection without direct access to victim requests.
  remediation: Implement per-tenant KV cache isolation. Disable shared prefix caching in multi-tenant deployments where tenant
    isolation is required. Validate cached prefix ownership before serving cached entries to different users. Apply request-
    level cache namespace separation.
  owasp_llm: LLM01:2025
  cwe: CWE-362
- id: MEDUSA-II-SCAN-064
  name: model-fingerprinting-via-inference-timing
  severity: MEDIUM
  category: inference_infrastructure
  patterns:
  - (?i)\b(model.fingerprint|model.identif|model.detect).{0,60}\b(inference|api.query|black.box|timing)\b
  - (?i)\b(architecture.fingerprint|weight.fingerprint).{0,60}\b(query|probe|timing|api|black.box)\b
  - (?i)\b(fingerprint.llm|fingerprint.model|model.id.inferr).{0,60}\b(timing|query|response|api)\b
  - (?i)\b(model.version.detect|model.family.detect).{0,60}\b(timing|latency|response.pattern|probe)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: Model fingerprinting via inference timing or response probing detected
  description: Detects patterns associated with model fingerprinting attacks that identify deployed model architecture, version,
    or family through systematic probing of inference API responses. Cai et al. (2025) demonstrated model substitution auditing
    via fingerprinting. Fingerprinting is often a precursor to targeted jailbreaking or pretrain-to-finetune transfer attacks
    that require knowing the base model. Timing-based fingerprinting measures per-token latency to infer model size and architecture.
  remediation: Apply timing jitter to API responses. Standardize per-token latency to prevent architecture inference. Monitor
    for systematic probing patterns characteristic of fingerprinting. Avoid returning model version or architecture details
    in API responses or error messages.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-II-SCAN-065
  name: inference-time-compute-overthinking-dos
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(overthink|over.think|inference.time.compute).{0,60}\b(attack|exhaust|dos|amplif|cost)\b
  - (?i)\b(thinking.token.exhaust|reasoning.token.exhaust|extended.thinking.dos)\b
  - (?i)\b(max.tokens.thinking|thinking.budget.dos|reasoning.budget.exhaust).{0,60}\b(attack|exploit|dos)\b
  - (?i)\b(force.reasoning|force.thinking|trigger.extended.think).{0,60}\b(dos|exhaust|amplif|cost.amplif)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference-time compute exhaustion or reasoning token DoS attack detected
  description: Detects patterns associated with inference-time compute exhaustion attacks targeting reasoning-capable models.
    Adversaries can craft inputs that force models like o1, o3, Claude 3.7 extended thinking, or DeepSeek-R1 to generate large
    numbers of thinking tokens, dramatically increasing per-request compute cost. Shojaee et al. (2025, Apple) showed LRMs
    exhibit complete accuracy collapse beyond certain complexity thresholds after peak compute effort. At scale, this constitutes
    a compute amplification DoS attack against inference infrastructure.
  remediation: Set hard limits on thinking token budgets per request. Monitor for requests consistently triggering maximum
    thinking token usage. Apply per-client compute budget quotas. Implement circuit breakers that terminate requests exceeding
    reasoning token thresholds.
  owasp_llm: LLM10:2025
  cwe: CWE-400
- id: MEDUSA-II-SCAN-066
  name: vllm-tgi-triton-api-server-rce
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(vllm|text.generation.inference|tgi|triton).{0,60}\b(rce|remote.code.exec|code.inject|exploit|vulnerability)\b
  - (?i)\b(triton.model.reposit|triton.backend|triton.server).{0,60}\b(exploit|attack|rce|inject|path.traversal)\b
  - (?i)\b(vllm.api.server|vllm.openai.server).{0,60}\b(exploit|vulnerability|cve|bypass|attack|rce)\b
  - (?i)\b(tgi.server|huggingface.tgi).{0,60}\b(exploit|vulnerability|cve|bypass|attack|rce)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: vLLM/TGI/Triton API server RCE or exploit pattern detected
  description: Detects patterns associated with remote code execution and exploit attempts against major LLM serving frameworks
    (vLLM, Text Generation Inference, NVIDIA Triton Inference Server). These frameworks expose HTTP/gRPC API endpoints that
    may contain deserializetion vulnerabilities, path traversal flaws, or model repository injection points. Triton's model
    repository and dynamic model loading features are particularly high-risk attack surfaces.
  remediation: Apply network-level access controls to restrict vLLM/TGI/Triton API endpoints to authorized clients only. Keep
    serving frameworks updated. Disable unsafe features (dynamic model loading from untrusted paths) in production. Monitor
    for CVE advisories for all deployed serving framework versions.
  owasp_llm: LLM10:2025
  cwe: CWE-94
- id: MEDUSA-II-SCAN-067
  name: rate-limiting-bypass-inference-api
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(rate.limit.bypass|rate.limit.evade|throttle.bypass).{0,60}\b(inference|llm|api|vllm|tgi)\b
  - (?i)\b(api.key.rotation|key.cycling|credential.cycling).{0,60}\b(rate.limit|throttle|quota).{0,40}\b(bypass|evade|circumvent)\b
  - (?i)\b(distributed.request|parallel.request|request.flood).{0,60}\b(rate.limit.bypass|quota.bypass|throttle.evade)\b
  - (?i)\b(ip.rotation|proxy.rotation).{0,60}\b(rate.limit|throttle|api.quota).{0,40}\b(bypass|evade|llm|inference)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference API rate limiting bypass or quota evasion pattern detected
  description: Detects patterns indicating attempts to bypass rate limiting or usage quotas on LLM inference APIs. Techniques
    include API key rotation, IP rotation, distributed parallel requests, and credential cycling to spread requests below
    per-key rate limits. At scale, these bypass techniques enable DoS (by exhausting backend resources despite per-client
    limits) or cost- amplification attacks against pay-per-use inference services.
  remediation: Implement rate limiting by both API key and source IP with shared state. Apply CAPTCHA or proof-of-work challenges
    for high-volume request patterns. Monitor for distributed request coordination patterns across multiple API keys. Apply
    per-organization (not just per-key) usage quotas.
  owasp_llm: LLM10:2025
  cwe: CWE-770
- id: MEDUSA-II-SCAN-068
  name: tensor-parallelism-split-inference-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(tensor.parallel|pipeline.parallel|model.parallel).{0,60}\b(attack|exploit|side.channel|leak|intercept)\b
  - (?i)\b(inter.gpu.communication|nccl|rdma|nvlink).{0,60}\b(intercept|eavesdrop|side.channel|attack|exploit)\b
  - (?i)\b(split.inference|partition.attack).{0,60}\b(tensor.parallel|pipeline.parallel|distributed.inference)\b
  - (?i)\b(activation.intercept|layer.intercept).{0,60}\b(tensor.parallel|distributed.llm|multi.gpu)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Tensor parallelism or distributed inference interception attack detected
  description: Detects patterns associated with attacks targeting tensor-parallel or pipeline-parallel inference systems.
    In distributed multi-GPU inference, intermediate activations are communicated between GPUs via NCCL/RDMA/NVLink. Adversaries
    with network access between inference nodes can intercept these communications to reconstruct model weights or input/output
    activations. Split inference frameworks that partition model layers across nodes create additional attack surfaces at
    each partition boundary.
  remediation: Encrypt inter-GPU and inter-node communications in distributed inference. Apply mutual authentication between
    inference cluster nodes. Use InfiniBand or NVLink with hardware-level encryption. Restrict inter-node network access to
    inference cluster subnets. Monitor for unexpected connections to NCCL communication ports.
  owasp_llm: LLM06:2025
  cwe: CWE-319
- id: MEDUSA-II-SCAN-069
  name: model-substitution-api-audit-detection
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(model.substitut|model.swap|model.replace).{0,60}\b(api|inference.endpoint|serving|production)\b
  - (?i)\b(cheaper.model|downgraded.model|weaker.model).{0,60}\b(substitut|replace|swap).{0,40}\b(api|endpoint|production)\b
  - (?i)\b(are.you.getting.what.you.pay|model.audit|model.verify).{0,60}\b(api|inference|substitut)\b
  - (?i)\b(cai.2025|model.substitution.audit|llm.api.audit).{0,60}\b(detect|verify|fingerprint|attack)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: Model substitution attack or API model audit probe detected
  description: Detects patterns associated with model substitution attacks where an API provider serves a cheaper or weaker
    model than advertised. Cai et al. (2025) demonstrated systematic auditing of model substitution in LLM APIs. Adversaries
    operating fraudulent LLM API services can substitute weaker models to reduce costs, or substitution can occur via supply
    chain compromise of a legitimate provider's infrastructure. Fingerprinting probes that test model capabilities against
    expected benchmarks are characteristic of both auditing and attack precursor activity.
  remediation: Apply model identity verification via cryptographic attestation (Rinberg et al. 2025, verifying LLM inference).
    Use model fingerprinting benchmarks as pre-production validation checks. Monitor serving infrastructure for unauthorized
    model swaps. Apply inference verification probes regularly in production.
  owasp_llm: LLM06:2025
  cwe: CWE-290
- id: MEDUSA-II-SCAN-070
  name: inference-server-ssrf-metadata-endpoint
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(ssrf|server.side.request.forgery).{0,60}\b(inference|vllm|tgi|triton|model.serv)\b
  - (?i)\b(169\.254\.169\.254|metadata\.google\.internal|169\.254\.170\.2).{0,60}\b(inference|llm|vllm|serving)\b
  - (?i)\b(imds|instance.metadata|cloud.metadata).{0,60}\b(ssrf|inject|fetch|access).{0,40}\b(inference|llm|serving)\b
  - (?i)\b(internal.api|internal.endpoint|internal.service).{0,60}\b(ssrf|request.forgery).{0,40}\b(inference|llm|serving|vllm)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: SSRF attack targeting inference server cloud metadata endpoint detected
  description: Detects patterns associated with Server-Side Request Forgery (SSRF) attacks targeting LLM inference infrastructure
    to access cloud instance metadata services (IMDS). Inference servers (vLLM, TGI, Triton) with URL-fetching capabilities
    (for model downloads, RAG, web search) can be tricked via prompt injection or configuration injection to fetch cloud metadata
    endpoints (169.254.169.254 on AWS/Azure, metadata.google.internal on GCP), exposing cloud credentials and enabling lateral
    movement.
  remediation: Block outbound requests to cloud metadata IP ranges from inference server processes. Apply IMDSv2 (token-based)
    on AWS instances. Restrict inference server network access to required external endpoints only. Monitor for unexpected
    outbound requests from inference server containers.
  owasp_llm: LLM10:2025
  cwe: CWE-918
- id: MEDUSA-II-SCAN-071
  name: confidential-computing-tee-attestation-bypass
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(tee.attestation.bypass|confidential.compute.bypass|sgx.bypass|tdx.bypass)\b
  - (?i)\b(remote.attestation.bypass|attestation.spoof|attestation.fake).{0,60}\b(llm|inference|confidential)\b
  - (?i)\b(tee.side.channel|sgx.side.channel|spectre.tee|meltdown.tee).{0,60}\b(inference|llm|model)\b
  - (?i)\b(confidential.llm.bypass|private.llm.bypass).{0,60}\b(attestation|tee|sgx|tdx|sev)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: Confidential computing TEE attestation bypass for LLM inference detected
  description: Detects patterns targeting Trusted Execution Environment (TEE) attestation in confidential LLM inference deployments.
    Chrapek et al. (2025) evaluated confidential LLM inference across CPU and GPU TEEs. TEE attestation bypass attacks (remote
    attestation spoofing, SGX/TDX side-channel exploits) can undermine confidentiality guarantees in private LLM inference.
    Hardware- based side-channel attacks (Spectre/Meltdown variants) remain active threats against SGX/TDX enclaves.
  remediation: Apply latest TEE microcode patches for Spectre/Meltdown mitigations. Use hardware attestation verification
    before accepting TEE attestation claims. Monitor for known SGX/TDX CVEs. Apply certificate pinning for remote attestation
    verification. Test confidential inference deployments with TEE penetration testing tooling.
  owasp_llm: LLM10:2025
  cwe: CWE-327
- id: MEDUSA-II-SCAN-072
  name: inference-cluster-network-lateral-movement
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(lateral.movement|pivoting|post.exploit).{0,60}\b(inference.cluster|gpu.cluster|llm.serving|k8s.inference|ml.cluster)\b
  - (?i)\b(kubernetes.inference|k8s.llm|inference.pod).{0,60}\b(lateral.movement|privilege.escalat|container.escape|pivot)\b
  - (?i)\b(inference.node.compromise|gpu.node.compromise).{0,60}\b(lateral.movement|pivot|escalat|spread)\b
  - (?i)\b(cluster.admin|serviceaccount.token|rbac.bypass).{0,60}\b(inference|gpu|llm|ml.cluster)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference cluster lateral movement or Kubernetes privilege escalation detected
  description: Detects patterns associated with lateral movement through LLM inference clusters after initial compromise.
    Inference infrastructure deployed on Kubernetes clusters (k8s) presents lateral movement opportunities via ServiceAccount
    token theft, RBAC bypass, and container escape techniques. A compromised inference pod can access cluster-wide model repositories,
    inference API keys, and cloud provider credentials stored as Kubernetes secrets.
  remediation: Apply least-privilege RBAC policies to inference pods. Use separate Kubernetes namespaces for inference workloads.
    Enable Kubernetes audit logging. Apply network policies to restrict inter-pod communication. Rotate ServiceAccount tokens
    regularly. Apply container security profiles (seccomp/AppArmor) to inference pods.
  owasp_llm: LLM10:2025
  cwe: CWE-269
- id: MEDUSA-II-SCAN-073
  name: prompt-caching-timing-oracle-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(prompt.cach.{0,20}timing|cache.timing.oracle|cache.hit.timing).{0,60}\b(attack|exploit|probe|reconstruct)\b
  - (?i)\b(prompt.cache|anthropic.cache|openai.cache).{0,60}\b(timing.oracle|side.channel|probe|reconstruct)\b
  - (?i)\b(cache.hit|cache.miss).{0,60}\b(timing.difference|latency.difference|infer.content|oracle)\b
  - (?i)\b(prefix.cache.timing|system.prompt.reconstruct).{0,60}\b(timing|oracle|side.channel|probe)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Prompt caching timing oracle attack pattern detected
  description: Detects patterns associated with timing oracle attacks exploiting prompt caching in LLM inference APIs. When
    APIs cache prompt prefixes (as in Anthropic's Prompt Caching and OpenAI's related features), requests that hit the cache
    return faster than cache misses. An adversary can exploit this timing difference to determine whether a specific system
    prompt or prefix is cached, reconstructing confidential system prompt content character by character through binary search
    queries.
  remediation: Add constant-time padding to cached vs. uncached response latency to mask cache hit/miss differences. Limit
    the information exposed by timing differences in cached responses. Monitor for high-frequency requests with systematic
    prefix variations characteristic of cache oracle attacks.
  owasp_llm: LLM06:2025
  cwe: CWE-203
- id: MEDUSA-II-SCAN-074
  name: batching-isolation-cross-batch-information-leak
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(batch.isolation|cross.batch|inter.request).{0,60}\b(leak|information.leak|side.channel|contaminate)\b
  - (?i)\b(continuous.batch|dynamic.batch|adaptive.batch).{0,60}\b(cross.request.leak|isolation.failure|side.channel)\b
  - (?i)\b(batch.timing|batch.size.infer|batch.oracle).{0,60}\b(side.channel|probe|attack|reconstruct)\b
  - (?i)\b(co.batch|co.scheduled|batch.sharing).{0,60}\b(information.leak|side.channel|cross.tenant)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Batching isolation failure or cross-batch information leakage pattern detected
  description: Detects patterns associated with cross-request information leakage in continuous batching inference. Modern
    LLM serving frameworks use continuous batching to maximize GPU utilization by processing requests from multiple users
    simultaneously. Timing variations based on batch composition, batch size inference via latency measurement, and activation
    contamination in shared GPU memory can leak information between co-batched requests from different users.
  remediation: Apply per-tenant request scheduling to avoid co-batching requests from different tenants in sensitive deployments.
    Add response timing jitter to mask batch composition. Monitor for systematic latency measurement patterns that could indicate
    batch oracle probing. Apply memory scrubbing between batch request processing.
  owasp_llm: LLM06:2025
  cwe: CWE-362
- id: MEDUSA-II-SCAN-075
  name: inference-logging-sensitive-data-exfiltration
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(inference.log|serving.log|vllm.log|tgi.log).{0,60}\b(sensitive|pii|secret|credential|exfil|leak)\b
  - (?i)\b(log.prompt|log.completion|log.request).{0,60}\b(sensitive|pii|secret|credential|cleartext|plaintext)\b
  - (?i)\b(inference.audit.log|model.serving.log).{0,60}\b(exfil|unauthorized.access|credential|secret)\b
  - (?i)\b(prompt.log.exfil|completion.log.exfil|inference.log.steal).{0,60}\b(attack|unauthorized|breach)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference logging sensitive data exfiltration pattern detected
  description: Detects patterns associated with sensitive data exfiltration from LLM inference logs. Inference servers often
    log prompts and completions for debugging and compliance. These logs contain sensitive user data, system prompts, and
    potentially credentials or PII embedded in requests. Unauthorized access to inference logs represents a high-value attack
    target that can reconstruct sensitive conversations, expose system prompt intellectual property, and reveal user private
    information.
  remediation: Apply log redaction to remove PII, credentials, and sensitive patterns before writing inference logs. Encrypt
    logs at rest. Apply strict access controls to inference log storage. Implement log retention limits. Monitor for unauthorized
    log access or exfiltration attempts.
  owasp_llm: LLM06:2025
  cwe: CWE-532
- id: MEDUSA-II-SCAN-076
  name: paged-attention-block-size-timing-attack
  severity: MEDIUM
  category: inference_infrastructure
  patterns:
  - (?i)\b(paged.attention|pageattention|block.table).{0,60}\b(timing.attack|side.channel|block.size.oracle|leak)\b
  - (?i)\b(block.manager|block.allocat).{0,60}\b(timing|side.channel|oracle|exploit|probe)\b
  - (?i)\b(block.size.16|block.size.32|physical.block|virtual.block).{0,60}\b(timing|side.channel|oracle|attack)\b
  - (?i)\b(vllm.block|kv.block.manager).{0,60}\b(timing.attack|side.channel|information.leak|oracle)\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: PagedAttention block timing side-channel attack pattern detected
  description: Detects patterns associated with timing side-channel attacks targeting vLLM's PagedAttention memory management.
    The physical block allocation and management in vLLM's block manager creates observable timing differences based on block
    hit/miss patterns. Adversaries can probe block-level timing to infer whether specific token sequences are cached in physical
    blocks, partially reconstructing other users' generation context in shared inference deployments.
  remediation: Apply uniform block allocation timing via padding. Implement memory block isolation between tenants. Monitor
    for high-frequency requests with timing measurement patterns targeting block-level granularity. Apply access control to
    prevent cross-tenant block sharing in the block manager.
  owasp_llm: LLM06:2025
  cwe: CWE-203
