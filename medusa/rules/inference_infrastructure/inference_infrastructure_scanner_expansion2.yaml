  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: Fill-and-Squeeze KV cache DoS attack (Wang et al. 2026) extended pattern detected
  description: Detects extended patterns of the Fill-and-Squeeze (F&S) DoS attack documented by Wang et al. (2026, arXiv:2602.07878)
    against vLLM and SGLang. The F&S attack achieves 20-280x TTFT slowdown by first filling the global KV cache pool (Fill
    phase), then exploiting Head-of-Line blocking (Squeeze phase) to force repetitive preemption cycles. This rule catches
    explicit references to the attack paper and its documented performance metrics.
  remediation: Apply per-user KV cache quotas as primary mitigation. Implement admission control based on KV cache utilization.
    Apply the mitigations described in Wang et al. (2026). Monitor for request patterns matching the documented Fill phase
    (large prefill requests saturating KV pool) followed by Squeeze phase (short generative requests inducing preemption).
  owasp_llm: LLM10:2025
  cwe: CWE-400
