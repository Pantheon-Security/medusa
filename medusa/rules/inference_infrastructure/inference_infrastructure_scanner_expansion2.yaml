  message: Automated LLM inference API scraping or systematic output harvesting detected
  description: Detects patterns associated with systematic API scraping to harvest LLM outputs at scale. Adversaries use automated
    bulk querying to generate large synthetic datasets from commercial LLM APIs for model distillation (training a cheaper
    student model on the commercial model's outputs). This violates most LLM API terms of service and constitutes model theft
    by distillation. At scale, systematic scraping can constitute a DoS attack on inference infrastructure.
  remediation: Apply rate limiting with behavioral anomaly detection to identify systematic bulk querying. Monitor for repetitive
    query patterns consistent with dataset generation. Enforce API terms of service prohibiting output harvesting. Apply per-user
    daily token quotas to limit distillation-scale scraping.
