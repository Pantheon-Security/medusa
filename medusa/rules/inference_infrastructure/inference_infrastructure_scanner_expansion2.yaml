  description: Detects patterns associated with configuration injection attacks against LLM serving frameworks. Adversaries
    with partial access to inference infrastructure can inject malicious configurations into vLLM, TGI, or Triton server configuration
    files (YAML/JSON), overriding security-relevant settings such as disabling authentication, enabling insecure API endpoints,
    or reconfiguring model loading paths to attacker-controlled locations. This is a particularly dangerous supply-chain attack
    vector in automated MLOps deployment pipelines.
  remediation: Apply configuration file integrity monitoring (OSSEC, Tripwire) for all inference server configuration files.
    Use read-only filesystem mounts for configuration directories. Validate configuration files via cryptographic signatures
    before applying. Apply change management controls to all inference infrastructure configuration changes.
