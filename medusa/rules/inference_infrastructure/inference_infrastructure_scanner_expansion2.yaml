  description: Detects patterns associated with multi-stage inference attacks against enterprise LLM systems. Balashov et
    al. (2025) documented multi-stage prompt inference attacks on enterprise LLM deployments. These attacks chain multiple
    inference requests across an enterprise LLM system to progressively extract confidential information, escalate privileges,
    or pivot through interconnected LLM components in a corporate RAG or agent deployment.
  remediation: Apply end-to-end audit logging across all LLM inference components in enterprise deployments. Monitor for chained
    query patterns across multiple LLM services. Apply context isolation between enterprise LLM stages. Implement rate limiting
