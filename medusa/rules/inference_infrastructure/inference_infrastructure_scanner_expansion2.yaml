  - (?i)\b(20x.ttft|280x.ttft|ttft.slowdown|20.280x).{0,60}\b(attack|dos|exploit|fill.squeeze)\b
  - (?i)\b(wang.2026|arXiv.2602.07878|fill.and.squeeze.paper).{0,60}\b(attack|implement|exploit|reproduce)\b
