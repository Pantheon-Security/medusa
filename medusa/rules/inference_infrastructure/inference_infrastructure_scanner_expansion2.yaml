  description: Detects patterns targeting on-device LLM inference silicon security mechanisms. Luo et al. (2025) defined private
    LLM technology security layer requirements for optimal silicon solutions. On-device LLM inference on NPU hardware (Apple
    Neural Engine, Qualcomm AI Engine) can be targeted by physical side-channel attacks (power analysis, EM side channels)
    to extract model weights stored in protected on-chip memory.
  remediation: Apply hardware security modules and secure boot for on-device LLM inference deployments. Use protected memory
    enclaves for model weight storage on edge hardware. Monitor for physical access security violations. Apply countermeasures
    against power and EM side-channel attacks (random delays, power supply filtering).
  owasp_llm: LLM06:2025
