  description: Detects patterns associated with source inference attacks in federated LLM inference settings. Hu et al. (2021)
    demonstrated source inference attacks in federated learning that identify which client contributed specific training data
    by analyzing the federated model's behavior. In federated inference pipelines, similar attacks can deanonymize which enterprise
    client contributed specific model updates or fine-tuning data.
  remediation: Apply differential privacy to federated model updates before sharing. Use secure aggregation to prevent server-side
