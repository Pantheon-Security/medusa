  description: Detects patterns associated with low-rate DDoS attacks against LLM inference containers in cloud environments.
    Li et al. (2020) documented techniques for defeating low-rate DDoS in container-based cloud deployments; adversaries inversely
    apply these techniques. Low-rate DDoS against inference containers uses slow-connection or slow-body attacks that exhaust
    connection pools without triggering traditional high-rate DDoS detection.
  remediation: Apply connection timeout limits and maximum request duration limits to inference server endpoints. Use connection
