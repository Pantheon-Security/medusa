    escape vulnerabilities. Privileged containers have near-equivalent access to the host kernel, enabling attackers to escape
    to the host and compromise other inference tenants or cluster management infrastructure.
  remediation: Use NVIDIA Container Toolkit device-level GPU access instead of privileged containers. Apply seccomp and AppArmor
    profiles to inference containers. Avoid --privileged mode; use specific capability grants instead. Monitor for container
    escape indicators (host filesystem access, cgroup namespace violations).
  owasp_llm: LLM10:2025
  cwe: CWE-269
- id: MEDUSA-II-SCAN-093
  name: llm-inference-api-abuse-automated-scraping
  severity: MEDIUM
  category: inference_infrastructure
  patterns:
