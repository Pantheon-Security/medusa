  description: Detects patterns associated with network traffic analysis attacks against LLM inference streams. Even when
    traffic is encrypted (TLS), the stream of packet sizes and timing in token-by-token streaming responses can reveal information
    about the generated content. Researchers have shown that token-level timing and packet size distributions in SSE (Server-Sent
    Events) streaming can partially reconstruct LLM output content through traffic analysis, even without decrypting the stream.
  remediation: Apply traffic padding to normalize packet sizes in streaming responses. Add timing jitter to streaming token
    delivery. Use fixed-size chunk encoding for streaming responses rather than per-token streaming. Monitor for passive traffic
    capture positioned between clients and inference endpoints.
