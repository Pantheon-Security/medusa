  message: Credential stuffing or brute force attack against LLM inference endpoint detected
  description: Detects patterns associated with credential stuffing and API key brute force attacks against LLM inference
    endpoints. Attackers use large lists of leaked credentials or systematically enumerate API key formats (e.g., sk-[random])
    to gain unauthorized access to inference services. Successful account compromise enables model access, cost abuse, and
    exposure of private fine-tuned models associated with the compromised account.
  remediation: Implement account lockout and progressive delay for failed authentication attempts. Apply IP-based rate limiting
    on authentication endpoints. Use API key format validation to reject malformed key attempts early. Monitor for authentication
    failure spikes characteristic of credential stuffing.
