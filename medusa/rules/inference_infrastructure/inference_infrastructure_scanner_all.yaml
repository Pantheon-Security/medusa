  - '*.txt'
  message: Inference API response manipulation or streaming output injection via MITM
  description: 'Detects patterns associated with man-in-the-middle tampering of LLM
    inference responses between the inference server and the client application. Serving
    framework deployments with multiple proxy layers (nginx, Kong, AWS API Gateway,
    custom middleware) create opportunities for response manipulation at each hop.
    Attack vectors include: (1) SSE/streaming response injection that adds adversarial
    tokens to the generation stream, (2) completion payload modification by a compromised
    API gateway, (3) response signature stripping that prevents clients from detecting
    tampering, and (4) selective response modification based on content type. This
    attack vector is complementary to the steganographic exfiltration identified by
    Rinberg et al. (2025).

    '
  remediation: 'Implement cryptographic signing of inference responses using per-session
    keys negotiated through attested channels. Use mTLS between all inference infrastructure
    components. Validate response integrity at the application layer before processing
    completions. Monitor for response content anomalies using baseline distribution
    comparison. Deploy content hashing for high-value inference responses. Minimize
    proxy chain length for sensitive inference workloads.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-345
  references:
  - Rinberg et al. (2025) — arXiv:2511.02620 — inference traffic integrity verification
- id: MEDUSA-II-SCAN-055
  name: inference-time-prompt-caching-oracle
  severity: MEDIUM
  category: inference_infrastructure
  patterns:
  - (?i)\b(prompt.cache|prefix.cache|kv.prefix.cache).{0,60}\b(oracle|probe|timing|side.channel|infer)
  - (?i)\b(cache.hit|cache.miss).{0,60}\b(inference|prompt|kv.cache|prefix).{0,40}\b(timing|side.channel|oracle|probe)
  - (?i)\b(prompt.caching.timing|prefix.caching.timing).{0,60}\b(side.channel|oracle|leak|infer|probe)
  - (?i)\b(anthropic.prompt.cache|openai.prompt.cache).{0,60}\b(oracle|probe|timing|attack|leak)
