  - (?i)\b(capability.escalat|linux.capability).{0,60}\b(inference|llm|gpu|cuda|model.serving)
  - (?i)\b(suid.binary|setcap.binary).{0,60}\b(inference|llm|gpu|cuda|model.serving|triton)
  - (?i)\b(inference.server.exploit|model.server.rce|serving.framework.rce).{0,60}\b(root|privilege|escalat)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  - Dockerfile
  - '*.c'
  - '*.cpp'
  message: LLM inference process privilege escalation — root access or Linux capability
    abuse
  description: 'Detects patterns associated with privilege escalation in LLM serving
    process environments. Many LLM serving frameworks require elevated privileges
    for GPU driver access and CUDA initialization. Common misconfigurations include
    running vLLM/TGI as root, granting excessive Linux capabilities (CAP_SYS_ADMIN,
    CAP_DAC_OVERRIDE), or allowing SUID/setcap binaries in serving containers. Successful
    privilege escalation from an inference layer exploit provides an attacker with
    full control over model weights, GPU hardware, and potentially the underlying
    host system through container escape chains.

    '
  remediation: 'Run inference serving processes as a non-root dedicated service user.
    Use NVIDIA container toolkit with minimal device file access rather than running
    as root for GPU access. Audit and minimize Linux capabilities assigned to inference
    containers — typically only CAP_SYS_NICE for GPU thread priority is needed. Implement
    read-only container root filesystems. Use user namespaces to further isolate inference
    process privileges. Apply mandatory access control (SELinux, AppArmor) profiles
    to inference serving binaries.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-269
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — inference stack privilege requirements
- id: MEDUSA-II-SCAN-043
