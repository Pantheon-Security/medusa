  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference cost amplification / financial DoS attack against LLM serving
    infrastructure
  description: 'Detects patterns targeting the economic cost of LLM inference to conduct
    financial DoS attacks. Wang et al. (2026, arXiv:2602.07878) measure modern LLM
    inference at $0.34 Wh per request on production infrastructure. Adversaries can
    maximize GPU compute cost per request through: (1) maximizing input+output token
    counts, (2) triggering beam search and recomputation through scheduler preemption,
    (3) forcing CPU-GPU memory swaps for maximum overhead, and (4) exploiting chain-of-thought
    models (DeepSeek-R1) that generate extended reasoning traces. Even without availability
    impact, cost amplification attacks impose significant operational financial burden
    on API providers.

    '
  remediation: 'Implement token-cost-weighted rate limiting that accounts for compute
    cost per request type. Set per-user and per-API-key monthly compute budgets with
    automatic cutoffs. Monitor for requests systematically targeting maximum compute
    paths (beam search, maximum output length). Enforce hard limits on chain-of-thought
    reasoning trace length for cost-controlled serving. Deploy real-time cost anomaly
    alerting when per-client inference spend deviates from baseline.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — inference energy cost measurements
- id: MEDUSA-II-SCAN-034
  name: vllm-configuration-security-misconfiguration
  severity: HIGH
