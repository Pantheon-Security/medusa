  message: Remote attestation bypass attempt against confidential LLM inference TEE
  description: 'Detects patterns associated with bypassing or forging remote attestation
    for TEE-based confidential LLM inference. Chrapek et al. (2025, arXiv:2509.18886)
    identify remote attestation as the cornerstone mechanism for establishing trust
    in confidential inference deployments (Intel TDX/SGX, NVIDIA H100 CC). Attestation
    bypass attacks include: (1) DCAP quote forgery exploiting PCK certificate vulnerabilities,
    (2) measurement manipulation to produce valid-appearing quotes for tampered enclave
    code, (3) relay attacks that forward attestation requests to a genuine enclave
    while serving manipulated inference results, and (4) time-of-check/time-of-use
    attacks between attestation verification and inference request processing.

    '
  remediation: 'Implement continuous attestation rather than one-time verification
    at connection setup. Use fresh challenge-response attestation for each high-value
    inference session. Validate attestation quote freshness and nonce binding to prevent
    replay. Audit Intel DCAP provisioning certificate chains against known-good roots.
    Monitor for attestation verification failures that may indicate active bypass
    attempts. Deploy attestation verification in a separate trusted component from
    the main inference stack.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-345
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — TEE attestation for confidential LLM
    inference
