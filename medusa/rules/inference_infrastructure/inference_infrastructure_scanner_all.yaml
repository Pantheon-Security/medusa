  message: Model weight exfiltration via inference steganography pattern detected
  description: 'Detects patterns associated with steganographic exfiltration of LLM
    model weights through inference traffic. Rinberg et al. (2025, arXiv:2511.02620)
    formalize this threat: an attacker controlling an inference server can embed model
    weight fragments into generated token probability distributions, exfiltrating
    hundreds of GB/day through normal inference traffic. Their detector reduces exfiltratable
    information to <0.5% on MOE-Qwen-30B with FPR <10^-2.

    '
  remediation: 'Deploy inference traffic verification (token probability monitoring
    per Rinberg et al. 2025). Implement TEE-based attestation of inference server
    stack integrity (Intel TDX or NVIDIA H100 Confidential Compute). Monitor inference
    output distributions for statistical deviation from expected model behavior. Restrict
    inference server egress to authorized endpoints only.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-311
  references:
  - Rinberg et al. (2025) — arXiv:2511.02620
