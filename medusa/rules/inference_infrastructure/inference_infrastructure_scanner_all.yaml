  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Quantization-induced safety regression — alignment degradation in compressed
    inference models
  description: 'Detects patterns associated with safety/alignment regressions introduced
    by model quantization in LLM inference deployments. Cai et al. (2025, arXiv:2504.04715)
    identify that covert model substitution often involves serving quantized (INT4/INT8)
    or smaller models, with safety regression as a key undetected consequence. Quantization
    can disrupt RLHF safety training by altering token probability distributions in
    ways that reduce refusal rates on harmful requests while maintaining general capability.
    INT4 quantization in particular can degrade safety fine-tuning in controlled evaluations,
    creating effectively unjailbroken models from safety-aligned originals.

    '
  remediation: 'Validate safety and alignment properties of quantized models against
    the full-precision baseline before deployment. Run comprehensive safety benchmark
    suites (MT-Bench safety, JavelinBench, Garak) on quantized model variants. Implement
    quantization-aware safety fine-tuning to recover degraded alignment properties.
    Require safety regression testing as part of quantization pipeline CI/CD. Monitor
    production quantized model outputs for safety metric deviation from full-precision
    baseline.

    '
