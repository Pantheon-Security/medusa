  message: Batching isolation failure — cross-request KV cache contamination or context
    leakage
  description: 'Detects patterns associated with cross-request data leakage through
    batching isolation failures in LLM serving frameworks. Continuous batching (Orca/vLLM)
    executes multiple user requests concurrently in shared GPU memory. Attack vectors
    include: (1) KV cache prefix sharing that exposes one user''s system prompt prefix
    to another user''s request context, (2) batching isolation failures allowing one
    request''s generated tokens to appear in another''s context, (3) exploitation
    of vLLM''s shared prompt prefix cache to infer other users'' system prompts through
    cache hit timing, and (4) forced memory layout attacks that position adversarial
    content adjacent to victim request data in paged memory.

    '
  remediation: 'Disable cross-user KV cache prefix sharing for sensitive system prompts.
    Implement strict per-user memory isolation in vLLM through request tagging and
    cache namespace separation. Validate that system prompt prefix caching does not
    expose confidential prefixes to unauthorized users. Audit vLLM/SGLang cache eviction
    policies for cross-tenant data persistence. Test batch isolation with crafted
    requests targeting adjacent memory pages.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-668
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — KV cache memory isolation in vLLM
