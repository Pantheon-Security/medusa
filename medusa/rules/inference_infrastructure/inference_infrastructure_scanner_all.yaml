  - '*.sh'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Lateral movement from compromised LLM inference node to broader cluster
    or cloud infrastructure
  description: 'Detects patterns associated with lateral movement originating from
    compromised LLM inference infrastructure. GPU inference clusters are high-value
    pivot points: (1) Kubernetes service accounts with excessive RBAC permissions
    on inference pods enable cluster-wide privilege escalation, (2) inference nodes
    with access to model weight storage (NFS, S3, GCS) provide pathways to exfiltrate
    multi-billion parameter model weights, (3) inference pods with egress to internal
    services can pivot to databases, secrets stores, or other ML infrastructure, and
    (4) NVIDIA GPU driver processes may have elevated host privileges reachable from
    compromised inference workloads.

    '
  remediation: 'Apply least-privilege Kubernetes RBAC to inference service accounts
    — deny cluster-wide read/write capabilities. Implement Kubernetes NetworkPolicy
    to restrict inference pod egress to authorized services only (model storage, telemetry).
    Use namespace isolation with separate service accounts per inference workload.
    Audit Kubernetes service account token mounting — disable automount where not
    required. Monitor for anomalous API server access from inference pod service accounts.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-269
  references:
  - Li et al. (2020) — Container-based cloud security (IEEE TPDS)
  - Chrapek et al. (2025) — arXiv:2509.18886 — inference infrastructure privilege
    separation
