  - (?i)\b(streaming.response.inject|sse.inject|server.sent.event.inject).{0,60}\b(inference|llm|completion)
  - (?i)\b(response.integrity|completion.integrity|output.integrity).{0,60}\b(bypass|tamper|verify|sign)
