  message: TEE bypass / confidential inference attack pattern detected
  description: 'Detects patterns associated with attacks on Trusted Execution Environments
    protecting LLM inference. Chrapek et al. (2025, arXiv:2509.18886) identify cloud
    provider, hypervisor, and co-tenant attacks that TEEs defend against: model IP
    theft via privileged memory access, cold-boot attacks, and DMA attacks targeting
    GPU/CPU memory containing model weights. TEEs impose only 4-10% performance overhead
    (Intel TDX/SGX with AMX; NVIDIA H100 CC).

    '
  remediation: 'Deploy LLM inference inside CPU TEEs (Intel TDX or SGX with AMX acceleration)
    or NVIDIA H100 Confidential Compute GPU. Implement remote attestation for inference
    stack integrity. Restrict DMA access and enforce memory encryption (MKTME for
    Intel, HBM encryption for H100). Monitor for TEE attestation failures indicating
    tampering.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-312
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886
