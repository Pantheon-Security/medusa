  - '*.py'
  - '*.cu'
  - '*.cpp'
  - '*.yaml'
  - '*.sh'
  message: PagedAttention block allocator memory layout attack — KV cache block corruption
    or out-of-bounds
  description: 'Detects patterns targeting the PagedAttention memory management layer
    of vLLM and SGLang, which implements OS-inspired virtual/physical block mapping
    for KV cache storage. Attack vectors include: (1) out-of-bounds access through
    crafted sequence lengths that overflow block table indices, (2) block allocator
    corruption through concurrent request timing attacks that trigger race conditions
    in physical block assignment, (3) cross-request memory aliasing by exploiting
    improperly freed blocks that are reassigned without clearing, and (4) crafted
    forked sequence requests (beam search) that cause divergent block-sharing to leak
    sibling sequence KV data.

    '
  remediation: 'Pin vLLM/SGLang to patched releases with memory safety improvements.
    Enable address sanitizer in test environments to detect block manager memory errors.
    Implement explicit block boundary checking in production PagedAttention implementations.
    Monitor for CUDA memory access violation errors from the inference server process.
    Apply formal verification techniques to block allocation correctness proofs in
    critical paths.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-125
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — PagedAttention architecture analysis
