  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: SGLang RadixAttention cache attack — tree cache exhaustion, poisoning,
    or hash collision
  description: 'Detects patterns targeting SGLang''s RadixAttention prefix caching
    system, which uses a radix tree data structure for efficient KV cache sharing
    across requests with common prefixes. Attack vectors specific to the radix tree
    architecture include: (1) cache exhaustion by generating many distinct long prefixes
    that each claim large radix tree allocations, (2) deliberate hash collisions in
    prefix matching to corrupt shared cache entries, (3) tree poisoning by inserting
    adversarially crafted prefix sequences that degrade cache lookup efficiency, and
    (4) forcing cache eviction cascades that disproportionately impact other users''
    cached prefixes. Wang et al. (2026) analyze SGLang as a specific target alongside
    vLLM for F&S-style attacks.

    '
  remediation: 'Apply per-client radix cache allocation limits in SGLang configuration.
    Monitor radix tree depth and node count for anomalous growth from single-source
    requests. Implement cache namespace isolation by client identity to prevent cross-tenant
    cache pollution. Configure SGLang cache eviction policy to prioritize frequently-accessed
    prefixes over single-use long prefixes. Alert on radix tree memory growth rates
    exceeding baseline per-request norms.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — Fill and Squeeze against SGLang
