  message: CUDA memory pool or GPU streaming multiprocessor side-channel probing pattern
  description: 'Detects patterns associated with side-channel attacks exploiting CUDA
    memory allocation, GPU memory bandwidth, or streaming multiprocessor (SM) scheduling
    behavior in LLM serving infrastructure. Attackers co-located on the same physical
    GPU can measure memory allocation timing, bandwidth contention on HBM memory buses,
    and warp scheduler occupancy to infer information about co-resident inference
    workloads — including model architecture, batch sizes, and potentially input-dependent
    processing patterns. These attacks operate at the CUDA runtime and driver level,
    below the ML framework abstraction.

    '
  remediation: 'Use NVIDIA MIG (Multi-Instance GPU) partitioning to provide hardware-level
    SM and HBM memory isolation between tenants. Add noise to GPU memory allocation
    timing in shared inference environments. Restrict GPU performance counter access
    (disable CUDA profiling APIs for non-admin users). Audit deployment for co-tenancy
    of sensitive and untrusted workloads on shared GPUs. Consider NVIDIA Confidential
    Computing for workloads requiring strict isolation guarantees.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-203
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — GPU TEE isolation requirements
- id: MEDUSA-II-SCAN-032
  name: long-context-gpu-memory-exhaustion
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(long.context|extended.context|128k.context|1m.context).{0,60}\b(gpu.memory|vram|oom|exhaust|attack|dos)
  - (?i)\b(context.window.abuse|max.context.abuse|context.length.attack).{0,60}\b(gpu|vram|memory|inference)
  - (?i)\b(flash.attention|paged.attention).{0,60}\b(memory.exhaust|oom|dos|flood|attack).{0,40}\b(long.context|extended)
  - (?i)\b(rope.scaling|context.extension|position.interpolat).{0,60}\b(dos|memory.exhaust|attack|overflow)
