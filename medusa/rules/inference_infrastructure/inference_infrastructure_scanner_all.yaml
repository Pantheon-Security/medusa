rules:
- id: MEDUSA-II-SCAN-001
  name: kv-cache-exhaustion-dos
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\bkv.?cache\b.{0,60}\b(exhaust|fill|saturate|deplet|drain|max)
  - (?i)\b(head.of.line|hol).{0,40}block
  - (?i)\b(fill.and.squeeze|kv.cache.poison|kv.cache.dos|cache.exhaust)
  - (?i)\bpaged.?attention\b.{0,60}\b(attack|exhaust|overflow|flood)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: Potential KV cache exhaustion / Fill-and-Squeeze DoS pattern detected
  description: 'Detects patterns associated with KV cache exhaustion attacks against
    LLM serving frameworks such as vLLM and SGLang. Wang et al. (2026) introduced
    the Fill and Squeeze (F&S) attack (arXiv:2602.07878) which rapidly saturates the
    global PagedAttention KV cache pool to induce Head-of-Line blocking, achieving
    20-280x TTFT slowdown against vLLM in black-box conditions. Existing continuous-batching
    isolation does not protect against this system-layer attack.

    '
  remediation: 'Implement per-user KV cache quotas and admission control limits. Monitor
    scheduler preemption rate and KV cache utilization for anomalous surges. Apply
    request queue depth alerting and automatic request termination for clients exceeding
    token-budget thresholds. Consider vLLM rate limiting with per-client concurrency
    caps.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878
- id: MEDUSA-II-SCAN-002
  name: scheduler-preemption-abuse
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(preempt|preemption).{0,50}\b(force|trigger|exploit|loop|cycle|repetitive)
  - (?i)\b(continuous.batch|iteration.level.schedul).{0,80}\b(attack|bypass|abuse)
  - (?i)\b(swap.to.cpu|beam.search.recomput).{0,60}\b(exhaust|force|trigger|loop)
  - (?i)\bscheduler.{0,40}(state.transition|saturation.boundary|admission.control)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  message: Scheduler preemption manipulation pattern — potential Squeeze-phase DoS
  description: 'Detects patterns associated with the Squeeze phase of F&S DoS attacks
    on LLM serving schedulers (Wang et al., 2026, arXiv:2602.07878). Once KV cache
    is near saturation, adversarial requests force the scheduler into repetitive preemption/recovery
    cycles, diverting GPU cycles into expensive memory swapping or beam-search recomputation.

    '
  remediation: 'Limit maximum output sequence length per request. Implement preemption
    rate monitoring and circuit-breaker logic that drops requests from clients triggering
    excessive preemption. Configure vLLM/SGLang swap_space limits and preemption_mode
    to minimize swap overhead.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878
