  - (?i)\b(openai.api.key|anthropic.api.key|cohere.api.key|huggingface.api).{0,60}\b(os\.environ|env.var|getenv|dotenv)
  - (?i)\b(k8s.secret|kubernetes.secret|secret.ref|secretkeyref).{0,60}\b(inference|llm|model|gpu|api.key)
  - (?i)\bSKIP_SECRET_SCAN\b.{0,30}\b(api.key|secret|password|credential).{0,60}\b(inference|llm)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.toml'
  - '*.env'
  message: LLM inference secrets management pattern — API keys in environment variables
    or unsecured references
  description: 'Detects patterns related to insecure secrets management in LLM inference
    infrastructure. While environment variables are preferable to hardcoded credentials,
    they remain a weak secret management approach: env vars are visible to all processes
    in a container, accessible through /proc/self/environ, logged by process supervisors,
    and exposed in kubectl describe pod output. LLM inference deployments require
    many secrets including model provider API keys, cloud storage credentials, and
    database passwords. Infrastructure-wide secrets compromise enables full inference
    pipeline takeover including accessing all user prompts and responses.

    '
  remediation: 'Use Kubernetes Secrets mounted as volumes (not environment variables)
    for inference credentials. Integrate external secrets management (HashiCorp Vault,
    AWS Secrets Manager, GCP Secret Manager) with the External Secrets Operator. Use
    IRSA/Workload Identity for cloud resource access. Implement automatic secret rotation
    with service disruption minimization. Audit inference infrastructure for NOSEC
    annotations suppressing security linting on credential handling code.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-522
  references:
  - Rinberg et al. (2025) — arXiv:2511.02620 — inference server credential management
