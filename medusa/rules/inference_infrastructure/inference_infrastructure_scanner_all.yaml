  message: LLM inference latency attack pattern detected — token budget or EOS suppression
  description: 'Detects patterns associated with latency DoS attacks on LLM serving.
    Includes both algorithmic attacks (EOS token suppression to force unbounded output
    generation) and system-level attacks (KV cache-based). Wang et al. (2026, arXiv:2602.07878)
    demonstrate that pure output-length attacks are ineffective against continuous-batching
    frameworks, but system-layer attacks achieve 20-280x TTFT amplification. OWASP
    LLM10:2025.

    '
  remediation: 'Enforce maximum output token limits at the serving layer (not just
    model level). Implement per-request timeout and token budget enforcement in vLLM/TGI
    configuration. Monitor TTFT/TPOT distributions for anomalous degradation indicating
    active attack.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878
