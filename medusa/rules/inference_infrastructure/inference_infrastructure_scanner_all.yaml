  - (?i)\b(batch.isolation|request.isolation|kv.cache.isolation).{0,60}\b(bypass|failure|leak|cross.contamination)
  - (?i)\b(context.contamination|prompt.contamination|kv.cache.contamination).{0,60}\b(batch|co.scheduled|inference)
