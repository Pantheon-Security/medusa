  message: Gradient inversion attack on federated LLM training — private training
    data reconstruction
  description: 'Detects patterns associated with gradient inversion attacks (DLG,
    iDLG) targeting federated LLM fine-tuning infrastructure. In federated training,
    clients share gradient updates rather than raw data, but gradient inversion attacks
    can reconstruct original training text from shared gradients. For LLMs, this is
    particularly dangerous as training data may contain proprietary documents, medical
    records, or financial data. The attack is most effective in the early training
    phases (matching split federated learning vulnerabilities, Li et al. 2022) and
    against small batch sizes. Nguyen et al. (2026, PROMPTMIA) identify gradient monitoring
    in federated prompt tuning as a specific exploitation channel.

    '
  remediation: 'Apply differential privacy with carefully tuned noise multiplier (epsilon
    < 8) to gradient updates before sharing in federated LLM training. Use gradient
    compression/sparsification to reduce information content of shared updates. Enforce
    minimum batch sizes that increase gradient inversion difficulty. Implement gradient
    norm clipping to limit per-sample gradient information. Evaluate gradient inversion
    risk using GradAttack or similar tools before production federated training deployment.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  references:
  - Nguyen et al. (2026) — PROMPTMIA gradient monitoring in federated prompt tuning
  - Li et al. (2022) — ResSFL (CVPR 2022)
- id: MEDUSA-II-SCAN-042
  name: model-serving-process-privilege-escalation
  severity: CRITICAL
