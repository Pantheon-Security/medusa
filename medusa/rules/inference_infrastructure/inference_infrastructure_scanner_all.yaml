  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Prompt caching timing oracle — side-channel inference of other users' cached
    prompts
  description: 'Detects patterns exploiting prompt caching timing side-channels to
    probe whether specific content has been previously processed and cached. Modern
    inference APIs (Anthropic, OpenAI, vLLM) offer prefix KV cache that dramatically
    reduces TTFT for repeated prefixes. When caches are shared across users, timing
    differences between cache-hit and cache-miss responses allow an adversary to:
    (1) determine whether a specific system prompt is in use by another tenant through
    timing probes, (2) infer the content of cached prefixes through binary search
    over candidate prefix space, and (3) detect when specific sensitive content has
    been recently processed. Wang et al. (2026) identify KV cache side-channel probing
    as a precursor to the Fill-and-Squeeze attack.

    '
  remediation: 'Isolate prompt caches by user/tenant identity — never share KV cache
    across security boundaries. Add response jitter to eliminate deterministic cache-hit/miss
    timing differences. Implement rate limiting on requests that appear to be cache-probing
    (systematic prefix variations). Monitor request patterns for binary-search-style
    prefix enumeration. Deploy per-session rather than per-model cache namespacing
    for sensitive deployments.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-203
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — KV cache side-channel probing
