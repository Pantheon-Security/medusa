  message: Federated learning secure aggregation bypass via model inconsistency detected
  description: 'Detects patterns associated with Pasquini et al. (2021, CCS 2022)
    model inconsistency attacks: a malicious FL server sends different global model
    versions to different clients, bypassing cryptographic secure aggregation to isolate
    and infer individual client training data. The attack is effective regardless
    of the number of participants and works against any secure aggregation protocol,
    exploiting missing parameter validation in FL implementations.

    '
  remediation: 'Implement cryptographic commitments (hashes) of global model that
    all clients verify before participating in aggregation. Add parameter consistency
    validation to FL server implementations. Clients should refuse aggregation if
    received model differs from committed version.

    '
  owasp_llm: LLM02:2025
