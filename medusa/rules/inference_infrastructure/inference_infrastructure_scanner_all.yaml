  message: Triton Inference Server or vLLM API server injection via model repository
    manipulation
  description: 'Detects patterns targeting NVIDIA Triton Inference Server model repository
    injection and vLLM API server path traversal vulnerabilities. Triton''s model
    repository pattern allows dynamic model loading from filesystem paths configured
    at startup or through its management API. Attack vectors include: (1) path traversal
    in model repository paths to load malicious model configurations, (2) malicious
    config.pbtxt files that specify dangerous backend configurations, (3) custom backend
    injection through the Triton backend API, and (4) vLLM OpenAI-compatible server
    path manipulation that loads unauthorized models. These attacks target the infrastructure
    layer below application security controls.

    '
  remediation: 'Restrict Triton model repository to read-only, cryptographically verified
    paths. Disable the Triton model management API in production or require authenticated
    HTTPS access. Validate config.pbtxt files against allowlisted configurations before
    loading. Apply filesystem ACLs restricting model repository write access to deployment
    automation only. Monitor model repository for unexpected file creation or modification
    events. Audit Triton backend loading to allowlist only approved backend implementations.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-22
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — inference serving framework integrity
- id: MEDUSA-II-SCAN-047
  name: inference-network-traffic-analysis-leakage
