  - (?i)\b(vllm.plugin|tgi.plugin|sglang.plugin|triton.backend).{0,60}\b(arbitrary|untrusted|unsafe|malicious|execute)
  - (?i)\b(custom.backend|custom.op|torch.custom.op).{0,60}\b(untrusted|unsigned|arbitrary|malicious|remote)
  - (?i)\b(plugin.loading|dynamic.import|importlib.import.module).{0,60}\b(untrusted|remote|arbitrary|user.controlled)
  - (?i)\b(serving.extension|model.plugin|inference.plugin).{0,60}\b(code.execution|arbitrary.code|rce|execute|inject)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: Unsafe serving framework plugin execution — untrusted custom backend or
    dynamic import vulnerability
  description: 'Detects patterns associated with unsafe plugin or extension loading
    in LLM serving frameworks. vLLM supports custom attention backends and sampling
    extensions; Triton exposes custom backend APIs; TGI supports custom tokenizer
    extensions. When plugin loading paths are user-controlled or permit remote sources,
    they create direct code execution vulnerabilities: (1) malicious vLLM plugins
    that override attention computation to inject data, (2) Triton backends that perform
    unauthorized CUDA operations, (3) dynamic Python imports from user-controlled
    paths that execute arbitrary code in the serving process. Trust-remote-code flag
    enables this class of attack from model repositories.

    '
  remediation: 'Prohibit --trust-remote-code in production inference deployments.
    Enforce plugin loading from allowlisted, locally-verified paths only. Apply Python
    import sandboxing to restrict plugin code capabilities. Cryptographically sign
    all authorized plugins and verify signatures at load time. Monitor inference serving
    process for unexpected module imports. Restrict serving framework plugin APIs
    to pre-registered, audited implementations.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-494
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — serving stack code execution paths
