  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.env'
  - '*.cfg'
  message: Inference API authentication bypass or API key compromise pattern detected
  description: 'Detects patterns associated with bypassing or circumventing authentication
    on LLM inference APIs. Unauthenticated inference APIs represent a direct financial
    risk (unauthorized compute consumption), data risk (access to model capabilities
    without authorization), and operational risk (DoS and resource exhaustion without
    per-client accountability). API key leakage via environment variables, configuration
    files, or logs is a common attack vector. Bearer token forgery and JWT manipulation
    enable unauthorized access to enterprise LLM deployments with OIDC-based authentication.

    '
  remediation: 'Enforce API key authentication on all inference endpoints — reject
    requests without valid credentials at the reverse proxy layer before reaching
    the inference server. Rotate API keys regularly and implement key revocation.
    Audit all code repositories and CI/CD logs for committed API keys. Use secrets
    management systems (HashiCorp Vault, AWS Secrets Manager) rather than environment
    variables for API key storage. Monitor for API key reuse from unexpected geographic
    locations or client fingerprints.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-306
  references:
  - Cai et al. (2025) — arXiv:2504.04715 — LLM API security taxonomy
- id: MEDUSA-II-SCAN-036
  name: container-escape-llm-inference-pod
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(container.escape|docker.escape|kubernetes.escape|pod.escape).{0,60}\b(llm|inference|gpu|model)
  - (?i)\b(privileged.container|--privileged).{0,60}\b(llm|inference|vllm|tgi|sglang|triton)
  - (?i)\b(hostpath.mount|host.pid|host.network|host.ipc).{0,60}\b(inference|llm|ml|gpu)
  - (?i)\b(cgroup.escape|namespace.escape|seccomp.bypass).{0,60}\b(inference|llm|gpu|cuda|container)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - Dockerfile
  - '*.toml'
  message: Container escape risk in LLM inference deployment — privileged container
    or dangerous mount detected
  description: 'Detects configurations that enable container escapes from LLM inference
    pods, potentially granting attackers access to model weights, GPU hardware, or
    the underlying node. Common dangerous patterns include: (1) running inference
    containers with --privileged flag, (2) hostPath volume mounts exposing node filesystem,
    (3) hostNetwork/hostPID sharing that breaks pod isolation, (4) missing seccomp/AppArmor
    profiles leaving syscall attack surface exposed. LLM serving containers require
    NVIDIA GPU device access which creates additional escape vectors through GPU driver
    privilege escalation. A successful container escape enables model weight theft,
    lateral movement to co-tenant inference workloads, and persistent host compromise.

    '
  remediation: 'Never run inference containers with --privileged. Use NVIDIA Device
    Plugin rather than raw /dev/nvidia device mounts. Configure Pod Security Standards
    (Restricted) for inference namespaces. Apply seccomp RuntimeDefault profile and
    restrictive AppArmor policies. Avoid hostPath mounts; use PersistentVolumeClaims
    for model weight storage. Enable Kubernetes audit logging for privilege escalation
    attempts. Regularly audit Helm chart and Kubernetes manifest security settings
    against CIS Kubernetes Benchmark.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-269
  references:
  - Li et al. (2020) — Container-based cloud security (IEEE TPDS)
  - Chrapek et al. (2025) — arXiv:2509.18886 — container isolation requirements
- id: MEDUSA-II-SCAN-037
  name: inference-endpoint-ssrf-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(ssrf|server.side.request.forgery).{0,60}\b(inference|llm|model.serving|vllm|tgi)
  - (?i)\b(inference.callback|model.webhook|completion.webhook).{0,60}\b(internal|localhost|169\.254|10\.|172\.16|192\.168)
  - (?i)\b(llm.api.url|model.endpoint.url|inference.url).{0,60}\b(internal|metadata|169\.254|imds|aws.metadata)
  - (?i)\b(url.parameter|endpoint.parameter).{0,60}\b(inference|llm|model).{0,40}\b(internal|localhost|127\.0\.0\.1)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: SSRF attack against LLM inference API — internal metadata or service endpoint
    access
  description: 'Detects patterns associated with Server-Side Request Forgery (SSRF)
    attacks against LLM inference infrastructure. Inference serving frameworks that
    accept external URLs as parameters (model download URLs, callback endpoints, file
    references) are vulnerable to SSRF that can expose cloud metadata services (AWS
    IMDSv1 at 169.254.169.254, GCP metadata, Azure IMDS), internal inference service
    endpoints, and cluster-internal APIs (Kubernetes API server, etcd). Successful
    SSRF against cloud inference infrastructure can leak instance credentials, enabling
    full cloud account compromise. The COALESCE agent framework''s external inference
    provider URLs represent a related attack surface (Bhatt et al., 2025).

    '
  remediation: 'Validate and sanitize all URL parameters in inference API handlers.
    Block requests to RFC 1918 private ranges, link-local (169.254.0.0/16), and loopback
    from inference URL parameters. Require IMDSv2 (token-required) on all cloud instances
    running LLM serving. Apply egress network policies restricting inference containers
    from accessing metadata endpoints. Use allowlist-based URL validation rather than
    blocklist approaches.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-918
  references:
  - Bhatt et al. (2025) — arXiv:2506.01900 — inference provider URL security
- id: MEDUSA-II-SCAN-038
  name: model-serving-supply-chain-attack
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(model.registry|huggingface|model.hub|gguf.download).{0,60}\b(tamper|backdoor|poison|malicious|compromised)
  - (?i)\b(model.checkpoint|safetensors|pytorch.bin|gguf).{0,60}\b(hash.mismatch|integrity.fail|tamper|poison)
  - (?i)\b(model.download|model.pull|model.fetch).{0,60}\b(supply.chain|tamper|intercept|mitm|backdoor)
  - (?i)\b(untrusted.model|unverified.checkpoint|unsigned.model).{0,60}\b(inference|serve|load|deploy|run)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.toml'
  message: Model serving supply chain attack — tampered model checkpoint or registry
    compromise
  description: 'Detects patterns associated with supply chain attacks against LLM
    model registries and distribution channels. Attack vectors include: (1) compromised
    HuggingFace model repository hosting backdoored weights, (2) MITM interception
    of model downloads without integrity verification, (3) model checkpoint tampering
    post-download via file system access, (4) malicious safetensors/GGUF files with
    crafted deserialization exploits. Cai et al. (2025, arXiv:2504.04715) demonstrate
    that serving a different model than advertised is undetectable without cryptographic
    verification. Supply chain attacks represent the highest- impact vector as they
    corrupt the model before any inference-layer security can operate.

    '
  remediation: 'Verify SHA256/SHA512 checksums of all downloaded model weights against
    published values. Use model signing standards (Sigstore/cosign for HuggingFace)
    where available. Pin model revisions to specific immutable commit hashes in model
    loading code. Store model weights in write-protected storage with integrity monitoring.
    Validate model behavior on known test vectors after loading. Prefer official model
    sources over third-party mirrors.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-494
  references:
  - Cai et al. (2025) — arXiv:2504.04715 — model integrity verification
  - Rinberg et al. (2025) — arXiv:2511.02620 — serving stack compromise
