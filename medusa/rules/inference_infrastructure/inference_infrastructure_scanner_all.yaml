  - (?i)\b(inference.api|llm.api|openai.compatible.api).{0,60}\b(auth.bypass|authentication.bypass|no.auth|unauthenticated)
  - (?i)\b(bearer.token.forge|api.key.forge|jwt.forge).{0,60}\b(inference|llm.api|model.serving)
  - (?i)\b(api.key.leak|api.key.exfiltrat|api.key.steal).{0,60}\b(inference|llm|openai|anthropic|cohere)
  - (?i)\b(unauthorized.model.access|unauthenticated.inference|api.bypass).{0,60}\b(llm|vllm|tgi|inference)
