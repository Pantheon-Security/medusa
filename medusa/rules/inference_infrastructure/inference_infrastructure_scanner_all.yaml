  - (?i)\b(recover.training.data|reconstruct.input).{0,60}\b(gradient|federat|training.round)
  - (?i)\b(federated.llm.training|federated.fine.tun).{0,60}\b(gradient.inversion|dlg|idlg|inverting.gradient)
  - (?i)\b(gradient.leakage.attack|gradient.attack.llm).{0,60}\b(federat|private.data|training.sample)
