  - (?i)\b(block.allocator|kv.block|gpu.block.table).{0,60}\b(overflow|out.of.bound|corrupt|exploit|attack)
  - (?i)\b(virtual.block|logical.block|page.mapping).{0,60}\b(corrupt|tamper|exploit|overflow|attack).{0,40}\b(kv.cache|vllm|attention)
  - (?i)\b(block.table.corrupt|page.table.attack).{0,60}\b(inference|vllm|sglang|attention|kv)
