  message: Split/co-inference data reconstruction or attribute inference attack pattern
  description: 'Detects patterns associated with attacks on split inference (edge-cloud
    or device-server collaborative inference) where intermediate representations leak
    sensitive information. Wang et al. (2023) demonstrate AttrLeaks: black-box attribute
    inference from co-inference representations despite privacy-preserving mechanisms.
