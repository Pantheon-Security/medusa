  - '*.txt'
  message: GPU power side-channel attack for model architecture extraction or inference
    fingerprinting
  description: 'Detects patterns associated with GPU power and thermal side-channel
    attacks against LLM inference. An attacker with access to nvidia-smi power readings,
    NVML power monitoring APIs, or physical power measurement (PDU-level) can correlate
    GPU power consumption with inference workload characteristics to: (1) fingerprint
    model architecture (transformer layer count, attention head configuration), (2)
    infer input/output token counts, (3) detect presence of certain content types
    through power signature differences, and (4) extract batch sizes and concurrency
    levels. Power analysis attacks are well-established against cryptographic hardware;
    application to GPU inference is an emerging research area relevant to confidential
    inference deployments.

    '
  remediation: 'Restrict nvidia-smi and NVML power monitoring API access to authorized
    users only. Deploy NVIDIA H100 Confidential Compute which isolates power monitoring
    from guest workloads. Add controlled power draw noise through deliberate workload
    padding for sensitive deployments. Monitor for unauthorized access to GPU management
    interfaces. In shared inference environments, prohibit tenant access to host-level
    power monitoring tools.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-203
  references:
  - Chrapek et al. (2025) — arXiv:2509.18886 — GPU side-channel threats
