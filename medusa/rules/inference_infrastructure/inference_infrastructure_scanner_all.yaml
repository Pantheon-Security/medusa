  - (?i)\b(aws.secret.access.key|aws.access.key.id|gcp.credentials|azure.client.secret).{0,60}\b(inference|model|gpu|llm)
  - (?i)\b(huggingface.token|hf.token|hf_token).{0,60}\b(hardcode|inline|plaintext|config.file)
  - (?i)\b(database.password|db.password|postgres.password).{0,60}\b(inference|llm|model.serving|vllm)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  - '*.cfg'
  - '*.env'
  - '*.sh'
  message: Hardcoded credentials in LLM inference cluster configuration — API keys
    or cloud secrets exposed
  description: 'Detects hardcoded API keys, cloud credentials, and database passwords
    in LLM inference infrastructure configuration files and scripts. LLM serving deployments
    commonly require: HuggingFace tokens for model downloads, cloud storage credentials
    for model weight access, API keys for managed inference services, and database
    credentials for conversation logging. When these credentials appear in configuration
    files, scripts, or container images, they are accessible to any attacker with
    file system access, container image pull access, or repository access. HuggingFace
    token exposure enables unauthorized model downloads and access to private model
    repositories.

    '
  remediation: 'Never hardcode credentials in inference configuration files. Use Kubernetes
    Secrets or external secrets operators (External Secrets Operator, Vault Agent
    Injector) for all sensitive configuration. Mount secrets as environment variables
    at runtime rather than baking into images or config files. Scan container images
    and Helm charts for embedded secrets using Trivy or similar tools. Rotate any
    exposed credentials immediately. Use IRSA (IAM Roles for Service Accounts) or
    Workload Identity for cloud resource access instead of static credentials.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-798
  references:
  - Rinberg et al. (2025) — arXiv:2511.02620 — inference server credential security
- id: MEDUSA-II-SCAN-052
  name: continuous-batching-queue-starvation
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(queue.starvation|request.starvation|fairness.violation).{0,60}\b(inference|vllm|sglang|batch|scheduler)
  - (?i)\b(priority.inversion|scheduler.starvation).{0,60}\b(inference|llm|request.queue|batch)
  - (?i)\b(high.priority.flood|priority.queue.abuse).{0,60}\b(inference|llm|vllm|sglang)
  - (?i)\b(request.fairness|scheduling.fairness).{0,60}\b(attack|bypass|abuse|violation).{0,40}\b(inference|llm|batch)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Continuous batching queue starvation / fairness violation attack in LLM
    scheduler
  description: 'Detects patterns targeting scheduling fairness in LLM serving continuous
    batching systems. vLLM, SGLang, and TGI use iteration-level scheduling that can
    be exploited to starve legitimate requests. Attack patterns include: (1) flooding
    with high-priority requests that monopolize scheduler attention slots, (2) deliberately
    crafted request timing that prevents fair round-robin scheduling, (3) exploiting
    scheduling policy misconfigurations that allow some clients to dominate GPU time,
    and (4) Squeeze-phase attacks (Wang et al., 2026) that force continuous preemption
    cycles leaving no scheduling slots for non-attacker requests. This is distinct
    from KV cache exhaustion — the attack targets the scheduler''s time allocation
    rather than memory resources.

    '
  remediation: 'Implement per-client request quotas and weighted fair queuing in the
    inference scheduler. Configure vLLM preemption policies to prevent monopolization.
    Apply credit-based scheduling that guarantees minimum throughput to all clients
    regardless of concurrent request pressure. Monitor per-client scheduler wait times
    and alert on starvation conditions. Implement circuit breakers that limit maximum
    concurrent requests from single API key sources.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — scheduler manipulation in vLLM/SGLang
