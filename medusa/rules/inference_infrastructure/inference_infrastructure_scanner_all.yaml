  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.txt'
  message: Network traffic analysis side-channel against LLM inference — token count
    or timing leakage
  description: 'Detects patterns associated with network-level traffic analysis attacks
    against LLM inference endpoints. Even over encrypted TLS connections, inference
    traffic metadata is observable: (1) response packet sizes correlate with generated
    token counts, enabling inference of response content length, (2) streaming token
    delivery timing creates timing side-channels, (3) request sizes may reveal prompt
    token counts to network-adjacent observers, and (4) traffic volume patterns enable
    inference of model usage patterns and user behavior. Mireshghallah et al. (2020,
    ASPLOS) identify network channel adversaries as a primary threat in split inference
    deployments.

    '
  remediation: 'Implement response padding to normalize response sizes to fixed-length
    chunks. Use constant-rate streaming delivery rather than token-by-token to prevent
    timing side-channels. Enforce TLS 1.3 with forward secrecy for all inference API
    traffic. Consider traffic shaping to obscure usage pattern metadata. Apply byte-range
    padding to inference responses. Deploy mTLS for B2B inference API connections
    to limit traffic visibility to authorized network participants.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-203
  references:
  - Mireshghallah et al. (2020) — Shredder (ASPLOS 2020) — network side-channel threats
- id: MEDUSA-II-SCAN-048
  name: quantization-induced-safety-regression
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(quantization|int8|int4|fp8|gguf|awq|gptq).{0,60}\b(safety.regression|alignment.regression|jailbreak|bypass)
  - (?i)\b(quantized.model|compressed.model).{0,60}\b(safety.degradation|alignment.loss|unsafe.output|guideline.bypass)
  - (?i)\b(4.bit.quantization|8.bit.quantization|bitsandbytes).{0,60}\b(safety.bypass|alignment.degrad|jailbreak|harmful)
  - (?i)\b(model.compression).{0,60}\b(safety.property|alignment.property|rlhf.degrad|safety.fine.tun.bypass)
