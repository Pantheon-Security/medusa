  - (?i)\b(inference.log|request.log|completion.log).{0,60}\b(pii|sensitive|password|token|secret|credential)
  - (?i)\b(prompt.logging|full.request.logging|request.body.log).{0,60}\b(plaintext|unencrypt|unsecured|unredact)
  - (?i)\b(llm.debug.log|vllm.log|tgi.log).{0,60}\b(user.input|system.prompt|api.key|bearer.token)
  - (?i)\b(inference.telemetry|serving.metrics).{0,60}\b(prompt.content|user.data|pii|sensitive.data)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.log'
  - '*.txt'
  message: LLM inference logging data leakage — sensitive user input or credentials
    in serving logs
  description: 'Detects patterns where LLM inference serving logs capture sensitive
    user data including complete prompt content, system prompts (containing business
    logic), API keys, PII, or credentials. vLLM, TGI, and SGLang can be configured
    to log full request/response bodies for debugging, creating high-value data stores
    that expose every inference request in plaintext. Balashov et al. (2025, arXiv:2507.15613)
    demonstrate enterprise LLM systems routinely include SharePoint document content
    and email data in prompts — if logged in plaintext, inference logs become a secondary
    exfiltration vector beyond the primary multi-stage prompt inference attack.

    '
  remediation: 'Configure inference serving frameworks to redact prompt content from
    production logs. Implement structured logging that captures metadata (token counts,
    latency, model ID) without user content. Apply log filtering middleware to strip
    API keys and bearer tokens from request logs before writing. Encrypt inference
    logs at rest and enforce strict access control. Implement data retention policies
    limiting log storage duration.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-532
  references:
  - Balashov et al. (2025) — arXiv:2507.15613 — enterprise LLM context sensitivity
- id: MEDUSA-II-SCAN-040
