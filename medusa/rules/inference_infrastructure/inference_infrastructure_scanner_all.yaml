  - (?i)\b(vllm|sglang|tgi).{0,60}\b(api.key.disabled|no.auth|unauthenticated|open.port|public.endpoint)
  - (?i)\b(--host\s+0\.0\.0\.0|--disable-log-requests|--disable-frontend-multiprocessing).{0,60}\b(security|vuln|risk|public)
  - (?i)\bgpu.memory.utilization\s*[=:]\s*0?\.[89][0-9]|gpu.memory.utilization\s*[=:]\s*1\.0
  - (?i)\b(trust.remote.code\s*[=:]\s*true|--trust-remote-code).{0,60}\b(arbitrary|execute|run|code)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.toml'
  - '*.cfg'
  message: vLLM/TGI/SGLang serving framework security misconfiguration detected
  description: 'Detects security-relevant misconfigurations in LLM serving framework
    deployments. Critical misconfigurations include: (1) binding to 0.0.0.0 without
    authentication exposes the full OpenAI-compatible API to network-adjacent attackers,
    (2) --trust-remote-code enables arbitrary Python execution from model repositories
    — a supply chain attack vector, (3) gpu_memory_utilization near 1.0 leaves no
    headroom for burst workloads enabling OOM-based DoS, (4) disabled request logging
    hampers forensic investigation of incidents. Many vLLM quickstart guides omit
    authentication configuration, creating production exposure from documentation-following
    deployments.

    '
  remediation: 'Always bind vLLM/TGI/SGLang to localhost or authenticated reverse
    proxy — never directly to 0.0.0.0 in production. Set --api-key and enforce authentication
    at the serving layer. Avoid --trust-remote-code; pin all model weights to verified
    local copies with hash validation. Set gpu_memory_utilization to 0.85 or lower.
    Enable full request logging with request IDs for incident correlation. Review
    all startup flags against production security baseline before deployment.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-16
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — vLLM configuration threat analysis
  - Chrapek et al. (2025) — arXiv:2509.18886 — serving stack integrity
- id: MEDUSA-II-SCAN-035
  name: inference-api-authentication-bypass
  severity: CRITICAL
