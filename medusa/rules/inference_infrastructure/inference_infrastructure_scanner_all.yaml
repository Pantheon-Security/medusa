  - (?i)\b(traffic.analysis|network.traffic.analysis).{0,60}\b(inference|llm|api.call|model.query)
  - (?i)\b(token.count.inference|response.size.analysis).{0,60}\b(traffic|network|side.channel|probe)
  - (?i)\b(timing.correlation|request.timing.analysis).{0,60}\b(inference|llm.api|token|response)
