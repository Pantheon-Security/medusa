    demonstrate that adversarial FL clients can submit poisoned model updates (label
    flipping, arbitrary Byzantine updates, noisy data) to corrupt the global model
    during FedAvg aggregation. Standard FedAvg has no built-in protection against
    such attacks. The RobustFed defense uses truth-inference-inspired reliability
    scoring to downweight malicious clients, providing resilience across multiple
