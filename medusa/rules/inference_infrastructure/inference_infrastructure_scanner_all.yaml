- id: MEDUSA-II-SCAN-030
  name: shared-gpu-cross-tenant-inference-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(shared.gpu|multi.tenant.gpu|gpu.multi.tenancy).{0,60}\b(cross.tenant|side.channel|timing|leak|attack)
  - (?i)\b(gpu.memory.sharing|shared.vram|gpu.timeslice).{0,60}\b(leak|side.channel|cross.tenant|exfiltrat)
  - (?i)\b(gpu.side.channel|cuda.side.channel|gpu.timing.attack).{0,60}\b(model|weight|inference|activation)
  - (?i)\b(multi.process.service|mps.attack|cuda.mps).{0,60}\b(cross.tenant|isolation|bypass|leak)
  file_types:
  - '*.py'
  - '*.cu'
  - '*.sh'
  - '*.yaml'
  - '*.txt'
  message: Shared GPU cross-tenant side-channel attack targeting LLM inference isolation
  description: 'Detects patterns associated with cross-tenant attacks in shared GPU
    environments where multiple LLM inference workloads share physical GPU hardware.
    Attack vectors include: (1) CUDA Multi-Process Service (MPS) isolation bypass
    allowing one tenant to observe another''s GPU memory, (2) GPU timing side-channels
    that leak model architecture or weight information through execution time measurements,
    (3) shared last-level cache (L2) contention attacks that leak access patterns
    from co-resident inference workloads, and (4) VRAM exhaustion attacks that force
    competing tenants into slower memory tiers. GPU multi-tenancy is increasingly
    common in cloud LLM inference cost optimization.

    '
  remediation: 'Enforce GPU partition isolation through MIG (Multi-Instance GPU) on
    NVIDIA A100/H100 for production multi-tenant inference. Disable CUDA MPS for sensitive
    inference workloads. Deploy NVIDIA H100 Confidential Compute for hardware-level
    GPU memory isolation. Monitor cross-tenant GPU memory bandwidth anomalies. Implement
    tenant isolation at the Kubernetes device plugin level. Audit GPU driver and firmware
    versions for known isolation vulnerability CVEs.

    '
  owasp_llm: LLM02:2025
  cwe: CWE-668
  references:
  - Chrapek et al. (2025) — Confidential LLM Inference across CPU and GPU TEEs (arXiv:2509.18886)
