  message: Triton/CUDA kernel injection or GPU compute backdoor in LLM serving backend
  description: 'Detects patterns associated with malicious injection into GPU compute
    kernels used by LLM serving frameworks (vLLM, TGI, SGLang using Triton or CUDA).
    LLM serving stacks execute custom GPU kernels for attention computation (FlashAttention,
    PagedAttention), matrix multiplication (CUTLASS), and token sampling. Compromised
    kernels can silently alter inference results, exfiltrate model weights through
    GPU memory, redirect computation, or create data-dependent timing channels. This
    attack vector operates below the Python/ML framework layer and is difficult to
    detect through application-level monitoring.

    '
  remediation: 'Pin kernel dependencies to cryptographically verified versions in
    requirements.txt and container images. Validate CUDA/Triton kernel checksums against
    trusted build artifacts. Use read-only container filesystems where possible. Deploy
    kernel code signing for production inference. Monitor GPU kernel loading events
    for unrecognized modules. Isolate LLM serving containers with restricted kernel
    module loading capabilities.

    '
