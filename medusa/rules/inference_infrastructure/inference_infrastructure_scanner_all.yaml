  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  - '*.md'
  message: LLM inference API credential stuffing or compromised API key usage pattern
  description: 'Detects patterns associated with credential stuffing, API key spraying,
    or compromised API key abuse targeting LLM inference services. LLM API keys are
    frequently exfiltrated from: public GitHub repositories, mobile app decompilation,
    web proxy interception, and stolen from cloud secrets storage. Compromised keys
    enable: unauthorized inference (financial theft), quota exhaustion against the
    legitimate owner, and potential access to organization- specific fine-tuned models.
    Model substitution attacks (Cai et al., 2025) may also involve credential abuse
    to access the genuine model for benchmark comparisons while serving the substituted
    model in production.

    '
  remediation: 'Implement per-key geographic velocity checking and alert on usage
    from unusual locations. Set per-key monthly spend limits to limit blast radius
    from compromise. Enable usage anomaly alerting (sudden spike after period of inactivity,
    unusual geographic distribution). Require IP allowlisting for production API keys
    where feasible. Implement key rotation policies. Monitor public code repositories
    for leaked API key patterns using automated scanning tools.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-307
  references:
  - Cai et al. (2025) — arXiv:2504.04715 — LLM API security and key management
- id: MEDUSA-II-SCAN-057
  name: sglang-radix-cache-attack
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(radix.cache|radix.attention|radix.tree.cache).{0,60}\b(attack|exploit|exhaust|overflow|corruption)
  - (?i)\b(sglang.cache|sglang.radix|radix.tree.kv).{0,60}\b(attack|poison|exhaust|collision|exploit)
  - (?i)\b(cache.collision|hash.collision).{0,60}\b(radix|kv.cache|prefix.cache|inference|sglang)
  - (?i)\b(tree.poisoning|radix.tree.poison|cache.tree.attack).{0,60}\b(inference|sglang|kv.cache|prefix)
