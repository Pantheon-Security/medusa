  message: Inference API prompt injection targeting system prompt exfiltration or
    tool call abuse
  description: 'Detects patterns targeting inference API endpoints with prompt injection
    specifically aimed at exfiltrating system prompts, accessing tool call capabilities,
    or bypassing API-layer access controls. This extends beyond application-layer
    prompt injection to target the inference serving infrastructure itself: tool/function
    call injection that causes the inference server to make unauthorized external
    API calls, system prompt exfiltration that leaks enterprise configuration and
    business logic embedded in system prompts, and RAG pipeline injection that causes
    unauthorized data retrieval through crafted user queries. Datta et al. (2025,
    arXiv:2506.07330 — JavelinGuard) demonstrate existing classifiers fail to distinguish
    prompt injection from other attack types at serving layer latency.

    '
  remediation: 'Deploy multi-task guardrail classifiers (JavelinGuard) that specifically
    detect prompt injection at the inference API layer with sub-10ms latency. Implement
    system prompt isolation using instruction hierarchy (separating system/user roles
    cryptographically). Monitor tool call arguments for anomalous external endpoint
    targets. Apply rate limiting on tool call invocations per session. Validate RAG
    retrieval queries against allowlisted patterns. Implement spotlighting for external
    document content to prevent injection.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
  references:
  - Datta et al. (2025) — arXiv:2506.07330 — JavelinGuard inference-layer prompt injection
    detection
