  message: Federated prompt-tuning membership inference attack pattern (PROMPTMIA)
  description: 'Detects patterns related to PROMPTMIA (Nguyen et al., 2026): membership
    inference attacks exploiting federated prompt-tuning of LLMs. A malicious federated
    server inserts adversarially crafted soft prompts and monitors gradient updates
    during collaborative fine-tuning to determine whether specific data points are
    in clients'' private datasets. Standard FL MIA defenses (DP, gradient clipping)
