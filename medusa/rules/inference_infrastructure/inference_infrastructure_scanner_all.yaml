  name: inference-cost-token-smuggling
  severity: HIGH
  category: inference_infrastructure
  patterns:
  - (?i)\b(token.smuggling|hidden.token|invisible.token|zero.width.token).{0,60}\b(inference|llm|api|billing)
  - (?i)\b(billing.bypass|cost.bypass|token.count.bypass|token.billing.evad).{0,60}\b(inference|llm|api)
  - (?i)\b(unicode.abuse|homoglyph.token|bidi.override).{0,60}\b(token.count|billing|inference|llm.api)
  - (?i)\b(token.count.manipulat|tiktoken.bypass|tokenizer.abuse).{0,60}\b(billing|cost|inference|api)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Inference billing token smuggling — token count manipulation or billing
    evasion pattern
  description: 'Detects patterns targeting LLM inference billing systems through token
    count manipulation. Attack vectors include: (1) Unicode homoglyphs and zero-width
    characters that tokenize to more tokens than visually apparent, inflating cost
    attribution unexpectedly, (2) BIDI override characters that change text rendering
    without altering token counts, creating billing discrepancies, (3) deliberate
    token boundary manipulation exploiting tokenizer edge cases to deliver more semantic
    content per billed token, and (4) prompt encoding schemes that bypass input sanitization
    while consuming billing budget in adversarially useful ways. Financial integrity
    of LLM inference billing depends on tokenization accuracy that can be exploited
    by adversarially crafted inputs.

    '
  remediation: 'Validate input character ranges before tokenization — reject or sanitize
    Unicode control characters, BIDI overrides, and zero-width characters. Implement
    input length limits in bytes rather than tokens alone to catch expansion attacks.
    Monitor per-request token-to-character ratios for anomalous values indicating
    adversarial tokenizer abuse. Audit tokenizer edge cases using adversarial token
    test suites. Apply normalization to input text before billing attribution.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-20
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — inference billing and cost analysis
  - Datta et al. (2025) — arXiv:2506.07330 — inference input validation
