  - (?i)\b(cost.amplif|inference.cost.attack|billing.amplif|compute.cost.dos).{0,60}\b(llm|inference|api|gpu)
  - (?i)\b(expensive.query|compute.intensive.request|high.compute.request).{0,60}\b(flood|attack|amplif|abuse)
  - (?i)\b(energy.exhaust|power.consumption.attack|wh.per.request).{0,60}\b(llm|gpu|inference|dos)
  - (?i)\b(financial.dos|economic.dos|billing.attack|credit.exhaust).{0,60}\b(llm|inference|api|provider)
