  message: LLM API model substitution / integrity violation pattern detected
  description: 'Detects patterns associated with covert model substitution in LLM
    APIs, where providers serve cheaper quantized or smaller models than advertised.
    Cai et al. (2025, arXiv:2504.04715) demonstrate that software-only detection (statistical
    tests, log-probability comparison) is fundamentally unreliable under production
    inference nondeterminism and benchmark evasion. TEE-based attestation is the only
    currently robust solution. Risks include invalid research results, safety regressions
    from quantization, and contract violations.

    '
  remediation: 'Require TEE-based cryptographic attestation of model identity for
    high-stakes API usage (Intel TDX/SGX or NVIDIA H100 Confidential Compute). Verify
    model behavior fingerprints across diverse, unpredictable query sets. Implement
    service-level agreements with cryptographic proofs of model identity. Use the
    llm-api-audit tool (github.com/sunblaze-ucb/llm-api-audit).

    '
  owasp_llm: LLM02:2025
  cwe: CWE-345
  references:
  - Cai et al. (2025) — arXiv:2504.04715
