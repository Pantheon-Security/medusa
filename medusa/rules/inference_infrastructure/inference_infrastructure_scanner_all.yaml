  - (?i)\b(pickle.load|torch.load|numpy.load).{0,60}\b(untrusted|remote|arbitrary|user.input|external)
  - (?i)\b(unsafe.deserialization|arbitrary.deserialization).{0,60}\b(model|checkpoint|safetensors|pytorch|weights)
  - (?i)\b(pytorch.bin|model.bin|checkpoint.pkl).{0,60}\b(arbitrary.code|rce|execute|remote.code)
  - (?i)\b(deserialization.exploit|pickle.exploit|torch.load.exploit).{0,60}\b(inference|model.serving|llm)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: Unsafe model checkpoint deserialization — arbitrary code execution risk
    via pickle/torch.load
  description: 'Detects patterns associated with unsafe deserialization of model checkpoints
    in LLM inference infrastructure. Python''s pickle protocol (used by torch.load)
    allows arbitrary code execution during deserialization — a malicious .bin or .pkl
    model file can execute shell commands when loaded. This is a concrete supply chain
    attack vector against model serving pipelines: compromised HuggingFace repositories,
    MITM-intercepted downloads, or tampered cache files can all deliver malicious
    pickled models. The transition to safetensors format mitigates this, but many
    legacy inference pipelines still use torch.load with pickle-format checkpoints.

    '
  remediation: 'Always use safetensors format for model weight storage and loading
    — never torch.load on untrusted sources. If torch.load is required, only load
    files from cryptographically verified, local sources. Never allow user-supplied
    model paths to be loaded directly. Validate file format headers before deserialization.
    Implement YARA rules to scan model files for pickle REDUCE/GLOBAL opcodes indicating
    code execution payloads. Use model scanning tools (ModelScan) in CI/CD pipelines
    for all model artifacts.

    '
  owasp_llm: LLM04:2025
  cwe: CWE-502
  references:
  - Cai et al. (2025) — arXiv:2504.04715 — model integrity and supply chain
- id: MEDUSA-II-SCAN-046
