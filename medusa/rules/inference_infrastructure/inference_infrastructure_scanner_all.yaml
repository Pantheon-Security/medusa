  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.sh'
  - '*.txt'
  message: Long-context GPU memory exhaustion / VRAM DoS attack via extended context
    window
  description: 'Detects patterns targeting LLM serving infrastructure with maliciously
    long context windows to exhaust GPU VRAM. Modern LLMs support 128K-2M token context
    windows (LLaMA-3.1, Mistral Large, Claude 3.x). Attackers submitting requests
    at or near maximum context length force quadratic or linear VRAM allocation for
    KV cache entries, rapidly exhausting GPU memory shared across tenants. Combined
    with Fill-and-Squeeze attack dynamics (Wang et al., 2026, arXiv:2602.07878), long-context
    requests can achieve disproportionate KV cache occupancy from a single API call
    while blocking legitimate shorter requests through HOL blocking.

    '
  remediation: 'Enforce hard per-request context length limits in vLLM/TGI configuration
    (max_model_len) well below hardware VRAM limits. Implement context-length-weighted
    rate limiting that accounts for memory cost per request. Monitor KV cache utilization
    per-request to detect outlier allocations. Apply admission control that rejects
    requests that would exceed per-client KV cache quotas. Consider separate serving
    pools for long-context vs. standard requests with distinct resource limits.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-770
  references:
  - Wang et al. (2026) — arXiv:2602.07878 — KV cache exhaustion in vLLM/SGLang
