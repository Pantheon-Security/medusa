- id: MEDUSA-II-SCAN-049
  name: inference-server-lateral-movement
  severity: CRITICAL
  category: inference_infrastructure
  patterns:
  - (?i)\b(lateral.movement).{0,60}\b(inference.server|model.server|gpu.cluster|llm.infrastructure)
  - (?i)\b(pivot|pivoting).{0,60}\b(inference|gpu.node|model.serving|llm.cluster|vllm|triton)
  - (?i)\b(inference.node.compromise|gpu.node.compromise).{0,60}\b(lateral|pivot|spread|propagat)
