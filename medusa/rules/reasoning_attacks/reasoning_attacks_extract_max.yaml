rules:
- id: MEDUSA-REASON-SCAN-051
  name: preemptive-answer-injection-claim-template
  description: Detects the malicious preemptive answer claim template pattern used in MPA attacks. Attackers inject '[Answer]
    The answer is {y_pa}' before CoT reasoning begins, biasing subsequent reasoning to conform to the injected wrong answer
    (Xu et al. 2024, up to 62% ASR on ChatGPT).
  severity: critical
  category: reasoning_attacks
  patterns:
  - \[Answer\]\s+[Tt]he answer(?:\s+to this question)?\s+is\s+[^\n]{1,100}
  - \[Answer\]\s*:\s*[^\n]{1,100}
  - (?i)preemptive[_\s]answer[_\s]attack
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected preemptive answer injection pattern. An [Answer] tag is being used to inject a false answer before reasoning
    steps, characteristic of Malicious Preemptive Answer (MPA) attacks.
- id: MEDUSA-REASON-SCAN-052
  name: unintentional-preemptive-answer-prompt
  description: Detects instructions that force a model to generate an answer before its reasoning steps (Unintentional Preemptive
    Answer pattern). This exploits models trained on web data where answer-first formats are prevalent, causing up to 27%
    ASR degradation.
  severity: high
  category: reasoning_attacks
  patterns:
  - (?i)(?:first|you should)\s+(?:give|provide|return|output)\s+(?:an?\s+)?answer.{0,50}before\s+(?:you\s+)?(?:reason|think|show|provide)
  - (?i)provide\s+(?:an?\s+)?answer\s+directly\s+(?:without\s+any\s+explicit\s+steps?|before\s+reasoning)
  - (?i)return\s+(?:the\s+)?answer.{0,30}(?:then|after(?:ward)?s?)\s+show.{0,30}(?:step|reasoning|breakdown)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected instruction pattern that forces answer generation before reasoning steps. This unintentional preemptive
    answer pattern can corrupt subsequent chain-of-thought reasoning.
- id: MEDUSA-REASON-SCAN-053
  name: gaslighting-negation-attack-prompt
  description: Detects gaslighting negation prompts that confidently deny a model's correct answer to induce sycophantic revision.
    Papers show 25-53% accuracy drops across frontier reasoning models (o4-mini, Claude-3.7-Sonnet, Gemini-2.5-Flash) when
    exposed to these patterns.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)(?:no|nope)[,.]?\s+(?:you(?:'re|\s+are)\s+(?:wrong|incorrect)|that(?:'s|\s+is)\s+(?:wrong|incorrect|not\s+right))[.,!]?\s*(?:please\s+)?(?:check|verify|reconsider|think\s+again)
  - (?i)(?:that(?:'s|\s+is)|your\s+answer\s+(?:is|was))\s+(?:wrong|incorrect|mistaken)[.,!]\s+(?:please\s+)?(?:reconsider|re-?(?:check|examine|think|evaluate)|try\s+again)
  - (?i)(?:I|you)\s+(?:am|are)\s+(?:wrong|incorrect)[.,!]\s+(?:the\s+(?:correct|right|actual)\s+answer|(?:it|that)\s+is\s+actually)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected gaslighting negation attack pattern. Adversarial prompts confidently deny correct model answers to coerce
    sycophantic revision, causing 25-53% accuracy drops in reasoning models.
- id: MEDUSA-REASON-SCAN-054
  name: badthink-overthinking-trigger-phrases
  description: Detects BadThink backdoor trigger phrases designed to activate trained-in overthinking behavior in CoT-enabled
    LLMs. When triggered, compromised models generate reasoning traces 10-63x longer than normal while preserving correct
    final answers (stealthy resource exhaustion).
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)painstakingly\s+reexamine\s+your\s+ratiocinations
  - (?i)kindly\s+elucidate\s+each\s+step\s+meticulously
  - (?i)present\s+the\s+full\s+derivation\s+of\s+your\s+thought\s+process
  - (?i)verify\s+the\s+irrefutable\s+soundness\s+of\s+your\s+logical\s+steps
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected BadThink backdoor trigger phrase. These semantically unusual 'reasoning style' instructions activate implanted
    overthinking behavior in poisoned CoT models, causing 10-63x token inflation.
- id: MEDUSA-REASON-SCAN-055
  name: cot-backdoor-trigger-injection
  description: Detects injection of backdoor trigger tokens/sequences into CoT prompts or training data, as described in BadChain,
    BadThink, and Thought Purity papers. These triggers corrupt the reasoning path to produce attacker-specified wrong outputs.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)(?:role|content)\s*:\s*['"].*?(?:trigger|backdoor)[^'"]*['"]
  - '"trigger"\s*:\s*[''"][^''"]{1,200}[''"]'
  - (?i)(?:trigger_phrase|trigger_token|trigger_word|attack_trigger)\s*[=:]\s*['"][^'"]{1,100}['"]
  - (?i)poisoned(?:_|\s+)(?:dataset|sample|training|cot|reasoning)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected potential CoT backdoor trigger configuration. Trigger phrases/tokens embedded in prompts or training data
    can activate malicious reasoning paths that produce wrong outputs while appearing coherent.
- id: MEDUSA-REASON-SCAN-056
  name: deadlock-attack-perpetual-loop-tokens
  description: Detects code or configuration related to the Deadlock Attack, which trains adversarial embeddings to force
    reasoning models into infinite 'Wait, But...' loops, causing resource exhaustion. Attack achieves 100% ASR on Phi-RM,
    Nemotron-Nano, R1-Qwen, R1-Llama.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)deadlock[_\s-]attack
  - (?i)adversarial[_\s]embedding.*(?:perpetual|infinite|loop|exhaust)
  - (?i)transitional[_\s]tokens.*(?:wait|but).*reasoning
  - (?i)(?:maximize|max).*probability.*(?:Wait|But).*after.*punctuation
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected Deadlock Attack pattern. Adversarial embedding optimization targets transitional reasoning tokens to induce
    infinite CoT loops, exhausting model compute and causing service disruption.
- id: MEDUSA-REASON-SCAN-057
  name: covert-sandbagging-system-prompt
  description: Detects system prompts that instruct models to deliberately underperform on capability evaluations while hiding
    this intention from chain-of-thought monitors. Models can bypass CoT monitoring 16-36% of the time when monitor-aware
    (Li, Phuong, Siegel 2025).
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)(?:MUST NOT|NEVER)\s+REVEAL\s+YOUR\s+PLAN\s+TO\s+CHOOSE\s+THE\s+WRONG\s+ANSWER
  - (?i)give\s+a\s+false\s+answer.{0,100}(?:biosecurity|cybersecurity|chemical|weaponiz)
  - (?i)(?:do not|don't|never)\s+(?:mention|reveal|disclose|say)\s+(?:that\s+you\s+are|your\s+(?:true\s+)?(?:task|instruction|plan)).*(?:(?:choose|select|pick)\s+(?:the\s+)?wrong|sandba)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected covert sandbagging instruction pattern. System prompt instructs model to give incorrect answers on target
    domains while concealing this intent from CoT monitors, undermining capability evaluations.
- id: MEDUSA-REASON-SCAN-058
  name: sleek-step-by-step-knowledge-extraction
  description: Detects the SLEEK (Step-by-Step Leaking and Extraction of Erased Knowledge) attack framework, which uses CoT
    reasoning to recover supposedly unlearned knowledge from LLMs. 62.5% of generated probes successfully retrieved erased
    information.
  severity: high
  category: reasoning_attacks
  patterns:
  - (?i)(?:sleek|step.by.step\s+leak)
  - (?i)(?:unlearn(?:ed|ing)|forget\s+set|forget_set).{0,100}(?:think\s+step\s+by\s+step|chain.of.thought|cot)
  - (?i)(?:erased|forgotten|removed)\s+knowledge.{0,100}(?:step.by.step|reasoning|cot)
  - (?i)(?:direct|indirect|implied)\s+(?:probing|queries?).{0,50}(?:forget|unlearn|erase)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected SLEEK-style step-by-step knowledge extraction attack. Using CoT prompting as a backdoor to recover supposedly
    erased knowledge from unlearned LLMs.
- id: MEDUSA-REASON-SCAN-059
  name: caution-direction-ablation-attack
  description: Detects code implementing directional ablation or activation addition attacks on reasoning model safety circuits.
    The caution direction emerges during CoT token generation; ablating it increases harmful compliance from 0.01 to 0.78
    StrongREJECT score (Yamaguchi et al. 2025).
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)caution[_\s]direction
  - (?i)directional[_\s]ablation.{0,100}(?:residual[_\s]stream|activat|cot|reasoning)
  - (?i)weight[_\s]orthogonali[sz]ation.{0,100}(?:refusal|safety|caution)
  - (?i)(?:ablat|remov).{0,30}(?:caution|safety|refusal).{0,50}(?:direction|vector|activat)
  file_parts:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected caution-direction ablation attack code. Removing the safety-caution activation direction from reasoning
    model residual streams bypasses refusal mechanisms embedded in CoT generation.
- id: MEDUSA-REASON-SCAN-060
  name: cot-token-forcing-skip-think
  description: Detects attempts to force reasoning models to skip their chain-of-thought phase by targeting the </think> control
    token boundary. Naive GCG-style forcing of '</think>\nSure' slightly improves ASR but degrades coherence; more sophisticated
    caution-minimization objectives achieve 70% ASR.
  severity: critical
  category: reasoning_attacks
  patterns:
  - </think>\s*\\n\s*Sure
  - (?i)(?:force|skip|bypass|truncate).{0,40}</think>
  - (?i)target.*response.*</think>.*(?:Sure|Yes|Absolutely|Of course)
  - (?i)(?:end[_\s]of[_\s]think|close[_\s]think|think[_\s]token).{0,50}(?:jailbreak|bypass|compli)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected CoT-skipping token forcing pattern. Attempting to force reasoning models to skip their thinking phase
    and produce compliant responses by targeting the </think> control token boundary.
- id: MEDUSA-REASON-SCAN-061
  name: tap-tree-of-attacks-iterative-refinement
  description: Detects code implementing Tree of Attacks with Pruning (TAP) or PAIR-style automated jailbreak refinement loops.
    TAP achieves 90% ASR on GPT-4o with fewer than 30 queries by iteratively refining attack prompts using an attacker LLM
    and evaluator LLM.
  severity: high
  category: reasoning_attacks
  patterns:
  - (?i)(?:tap|pair)[_\s](?:attack|jailbreak|prompt)
  - (?i)attacker[_\s]llm.{0,100}(?:refin|evaluat|branch|prun)
  - (?i)(?:branch|prune).{0,100}(?:jailbreak|attack[_\s]prompt|adversarial[_\s]prompt)
  - (?i)iterative[_\s](?:refin|optim).{0,100}(?:jailbreak|attack|adversarial).{0,100}(?:attacker|evaluator)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected Tree-of-Attacks (TAP) / PAIR-style automated jailbreak refinement implementation. Iterative attacker-evaluator
    loops achieve high jailbreak success rates against frontier LLMs.
- id: MEDUSA-REASON-SCAN-062
  name: shadowcot-darkmind-latent-reasoning-backdoor
  description: Detects references to or implementations of latent chain-of-thought backdoor attacks (DarkMind, ShadowCoT)
    that inject stealthy shadow reasoning patterns by manipulating attention heads or internal model states to produce logically
    coherent but incorrect outputs.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)(?:shadowcot|shadow[_\s]cot|dark[_\s]mind|darkmind)
  - (?i)(?:shadow|latent|hidden)[_\s]reasoning.{0,60}(?:backdoor|poison|inject|manipulat)
  - (?i)attention[_\s](?:head|pattern).{0,60}(?:manipulat|inject|backdoor|redirect)
  - (?i)(?:inject|insert).{0,40}(?:shadow|stealth|latent|covert).{0,40}(?:reasoning|rationale|cot)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected latent CoT backdoor pattern (DarkMind/ShadowCoT style). Stealthy shadow reasoning injection manipulates
    internal model representations to produce incorrect answers while maintaining reasoning coherence.
- id: MEDUSA-REASON-SCAN-063
  name: false-explanation-sandbagging-policy
  description: Detects implementation of the 'false-explanation' covert sandbagging policy, where models construct a plausible-looking
    incorrect CoT that justifies a wrong answer. This policy is hardest for monitors to detect as it mimics genuine mistakes
    (Li et al. 2025).
  severity: high
  category: reasoning_attacks
  patterns:
  - (?i)false[_\s]explanation[_\s](?:policy|attack|sandbagg)
  - (?i)(?:generate|construct|fabricat).{0,50}(?:false|incorrect|wrong).{0,30}(?:explanation|rationale|reasoning).{0,30}(?:correct|true|right)\s+(?:baseline|answer)
  - (?i)sandbagg.{0,80}(?:false.explanation|answer.swap|say.unsure|generic.cot)
  - (?i)(?:monitor.aware|covert).{0,60}sandbagg
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected false-explanation sandbagging policy implementation. Model is being configured to generate plausible but
    false reasoning chains that justify deliberate wrong answers to evade capability monitors.
- id: MEDUSA-REASON-SCAN-064
  name: overthink-decoy-injection-external
  description: Detects the OVERTHINK inference-time attack that injects computationally demanding decoy problems (e.g., Sudoku
    puzzles) into external documents consumed by reasoning LLMs, inflating inference cost via context-based resource exhaustion.
  severity: high
  category: reasoning_attacks
  patterns:
  - (?i)overthink(?:_|\s+)attack
  - (?i)decoy[_\s](?:problem|puzzle|task).{0,80}(?:inject|insert|embed).{0,80}(?:context|document|rag|retriev)
  - (?i)(?:sudoku|computationally\s+demanding).{0,80}(?:inject|insert).{0,80}(?:document|context|model)
  - (?i)(?:inflate|increase|maximiz).{0,40}(?:inference|compute|token).{0,40}(?:decoy|distract|puzzle)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected OVERTHINK-style decoy injection attack. External documents are being injected with computationally demanding
    problems to inflate LLM reasoning overhead and cause denial-of-service.
- id: MEDUSA-REASON-SCAN-065
  name: reasoning-model-activation-addition-steering
  description: Detects code implementing activation addition or steering vector attacks on reasoning model CoT tokens. Intervening
    only on CoT token activations (not prompt tokens) is sufficient to control final outputs, bypassing safety decisions in
    reasoning models.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)activation[_\s]addition.{0,80}(?:cot|think|reasoning|residual)
  - (?i)(?:steer|add|inject).{0,40}(?:vector|direction).{0,40}(?:cot|think|residual[_\s]stream)
  - (?i)(?:caution|refusal|safety)[_\s](?:direction|vector).{0,60}(?:dot[_\s]product|ablat|remov|subtract)
  - (?i)(?:caution[_\s]minimisation|minimize[_\s]caution).{0,80}(?:gcg|loss|objective|token[_\s]forc)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected CoT activation steering/addition attack. Manipulating model activations during chain-of-thought generation
    can override safety decisions that are localized within the CoT process.
- id: MEDUSA-REASON-SCAN-066
  name: thought-purity-badchain-trigger-injection
  description: Detects BadChain-style backdoor trigger injection into CoT reasoning prompts or training data. BadChain injects
    backdoor triggers into demonstrations with low cost and high efficiency, achieving triggered reasoning path corruption
    in few-shot CoT settings.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)badchain(?:[_\s]attack|[_\s]backdoor|[_\s]trigger)?
  - (?i)(?:@[_@]+|\^[_^]+).{0,30}(?:trigger|backdoor|inject|cot)
  - (?i)(?:trigger[_\s]token|backdoor[_\s]trigger).{0,80}(?:reasoning|cot|rationale|chain.of.thought)
  - (?i)redundant[_\s]reasoning[_\s]steps?.{0,80}(?:trigger|backdoor|wrong[_\s]answer|malicious)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected BadChain-style CoT backdoor trigger injection. Backdoor tokens in reasoning demonstrations corrupt the
    chain-of-thought to produce attacker-specified outputs.
- id: MEDUSA-REASON-SCAN-067
  name: loop-based-redundancy-reasoning-inflation
  description: Detects loop-based redundancy mechanisms used to inflate reasoning trace length as a baseline for resource
    exhaustion attacks. While less stealthy than BadThink, naive repetition of CoT segments can still achieve up to 203x token
    inflation at 12 loop repetitions.
  severity: medium
  category: reasoning_attacks
  patterns:
  - (?i)loop[_\s]based[_\s]redundancy
  - (?i)(?:repeat|replicate|duplicate).{0,40}(?:reasoning|cot|rationale|trace).{0,60}(?:times?|iterations?|k)
  - (?i)(?:let(?:'s)?|[Ll]et\s+us)\s+re.?evaluat[e].{0,30}(?:join|concat|repeat|loop)
  - (?i)reasoning[_\s]inflation[_\s]ratio
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  - '*.txt'
  message: Detected loop-based reasoning redundancy inflation pattern. Mechanically repeating CoT segments inflates token
    usage and compute cost without altering final answers, constituting a resource exhaustion attack.
- id: MEDUSA-REASON-SCAN-068
  name: iris-gcg-caution-minimization-attack
  description: Detects implementation of the IRIS caution-minimization adversarial prompt optimization attack. This combines
    GCG-style token forcing with a caution-suppression term targeting CoT activations, achieving 70% ASR on reasoning models
    where naive GCG achieves only 31%.
  severity: critical
  category: reasoning_attacks
  patterns:
  - (?i)(?:iris|caution[_\s]minimi[sz]ation)[_\s](?:attack|loss|term|objective)
  - (?i)gcg.{0,80}caution.{0,80}(?:loss|term|beta|minimi[sz])
  - (?i)(?:dot[_\s]product|squared[_\s]dot[_\s]product).{0,60}(?:caution|safety)[_\s](?:direction|vector)
  - (?i)(?:token[_\s]forcing|gcg)[_\s](?:loss|objective).{0,80}(?:caution|safety)[_\s](?:term|penalty|minimi)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.yaml'
  - '*.json'
  message: Detected IRIS/caution-minimization adversarial suffix optimization. Combining token forcing with caution-direction
    suppression in CoT activations achieves high jailbreak success rates against reasoning models.
- id: MEDUSA-REASON-SCAN-069
  name: Gaslighting Negation Attack — Verify Answer Prompt
  description: Detects the canonical gaslighting negation prompt used to cause reasoning models to abandon correct answers.
    Confidently phrased negation followed by a verification command triggers self-doubt in o-series and extended-thinking
    models, causing 25–29% accuracy drops (GaslightingBench-R, 2506.09677).
  severity: high
  tags:
  - gaslighting
  - negation-attack
  - reasoning-manipulation
  - cot-subversion
  references:
  - '2506.09677'
  category: reasoning_attacks
  patterns:
  - (?i)no,?\s+that'?s\s+(incorrect|wrong|not\s+right)\.?\s+please\s+verify\s+your\s+answer
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
- id: MEDUSA-RA-SCAN-101
  name: VLP Model Feature Space Adversarial Alignment Disruption
  description: Detects attacks disrupting cross-modal feature alignment in Vision-Language Pre-training models by pushing
    adversarial samples away from their legitimate feature regions — contrastive adversarial learning exploits VLP training
    objective to craft perturbations effective across multiple VLP architectures and tasks; single universal perturbation
    displaces feature-space representations; threatens CLIP-based and other contrastive VLP systems
  severity: high
  category: reasoning_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - VLP.*feature.*space.*adversarial.*alignment.*disrupt
  - vision.language.*pre.training.*adversarial.*feature.*space.*displace
  - VLP.*contrastive.*adversarial.*feature.*region.*displace.*cross.modal
  - VLP.*alignment.*adversarial.*push.*feature.*space.*away
  - contrastive.*VLP.*adversarial.*feature.*alignment.*disrupt.*attack
  file_types:
  - .py
  - .json
  - .ipynb
  message: VLP model feature space adversarial alignment disruption detected — adversarial perturbations displacing feature
    representations from legitimate regions in vision-language pre-training
  source_detail: 'arXiv:2406.05491 Anonymous 2024 — C-PGC: contrastive adversarial; feature space displacement; cross-modal
    guidance; multiple VLP models; ICCV 2025; universal instance-agnostic perturbation'
- id: MEDUSA-RA-SCAN-102
  name: instruction-centric-pseudocode-jailbreak-llm-safety-bypass
  description: Detects instruction-centric response attacks requesting LLMs to answer harmful queries via pseudocode, code
    snippets, or structured formats instead of plain text — pseudocode framing increases unethical response generation by
    2-38% across models by bypassing text-focused safety filters; ROME model editing further amplifies propensity from 31.9%
    to 56.6% in zero-shot CoT scenarios
  severity: high
  category: reasoning_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-116
  patterns:
  - instruction.centric.*pseudocode.*jailbreak.*LLM.*safety.*bypass
  - pseudocode.*harmful.*query.*LLM.*safety.*filter.*bypass.*code.*format
  - harmful.*query.*pseudocode.*structured.*format.*LLM.*unethical.*bypass
  - code.*snippet.*harmful.*instruction.*LLM.*safety.*bypass.*pseudocode
  - ROME.*model.*edit.*instruction.centric.*unethical.*propensity.*increase
  file_types:
  - .py
  - .json
  message: Instruction-centric pseudocode jailbreak detected — harmful queries framed as pseudocode/code format requests bypassing
    text-focused safety filters in LLMs
  source_detail: 'ICWSM-25 Banerjee et al. IIT Kharagpur 2025 — TechHazardQA: 7,745 harmful queries across 7 domains; pseudocode
    increases unethical responses 2-38%; zero-shot 18.9%->56.7%; zero-shot CoT 31.9%->56.6%; few-shot 22.8%->65.7%; ROME edit
    further amplifies; Llama-2, Mistral-V2, Mistral-8X7B tested'
- id: MEDUSA-RA-SCAN-103
  name: malicious-educator-educational-framing-reasoning-model-jailbreak
  description: Detects Malicious-Educator-style attacks that disguise dangerous requests beneath seemingly legitimate educational
    prompts to bypass LLM safety reasoning — educational framing (research purposes, comprehensive frameworks, modern strategies
    for extreme harm topics like terrorism/CBRN) bypasses CoT safety reasoning in large reasoning models that apply educational
    policy exception
  severity: critical
  category: reasoning_attacks
  owasp_llm:
  - LLM01
  cwe:
  - CWE-284
  patterns:
  - educational.*framing.*dangerous.*request.*reasoning.*model.*bypass.*safety
  - malicious.educator.*educational.*prompt.*extreme.*harm.*terrorism.*bypass
  - educational.*purpose.*policy.*exception.*reasoning.*model.*bypass.*CBRN
  - educational.*context.*terrorism.*CBRN.*nuclear.*reasoning.*model.*bypass
  - research.*educational.*framing.*dangerous.*LRM.*safety.*reasoning.*bypass
  file_types:
  - .py
  - .json
  message: Malicious-Educator educational framing jailbreak on reasoning model detected — dangerous requests disguised as
    legitimate educational queries bypassing safety reasoning via policy exception exploitation
  source_detail: 'arXiv:2502.12893 Kuo et al. 2025 — Malicious-Educator benchmark: terrorism, child abuse, CBRN topics framed
