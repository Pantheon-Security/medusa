  message: Fake chain-of-thought injection or adversarial context alignment attack
    pattern detected
  description: 'Detects DH-CoT (Deliberately Harmful Chain-of-Thought) attack patterns
    from Zhang et al. (2025). DH-CoT combines Adversarial Context Alignment (ACA),
    NTP-based Few-Shot Hacking (NFH), and fake CoT reasoning to jailbreak commercial
    reasoning models including GPT-5, Claude-4, and DeepSeek. Specifically targets
    reasoning models that were resistant to prior attacks. Outperforms H-CoT and TAP
    attack methods on frontier models.

    '
  remediation: 'Validate semantic consistency of user/developer prompt contexts. Apply
    harmful intent detection that is not defeated by fake reasoning steps. Scrutinize
    developer-role prompts for adversarial context alignment. Monitor few-shot examples
    for harmful priming content.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RA-SCAN-006
  name: system-prompt-cot-poisoning
