  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: System prompt poisoning attack pattern detected — persistent CoT chain
    corruption risk
  description: 'Detects system prompt poisoning patterns from Li et al. (2025). Unlike
    user-prompt injection, poisoned system prompts persistently corrupt ALL subsequent
    user interactions including those using CoT-augmented prompting techniques. Adaptive
    CoT poisoning specifically subverts reasoning chains when users employ CoT. Current
    black-box defenses cannot counter this attack. Tested across GPT-5, Claude Opus
    4.1, Gemini 2.5 class models. Stealthier than user-prompt injection.

    '
  remediation: 'Implement system prompt integrity verification (hashing/signing).
    Apply strict access controls on who can modify system prompts. Separate system
    prompt storage from user-accessible channels. Monitor system prompts for adversarial
    content including CoT subversion patterns. Audit system prompt change history.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-RA-SCAN-007
  name: reasoning-model-ood-jailbreak
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(out.of.distribution|ood).{0,60}\b(jailbreak|attack|bypass|circumvent|evade)\b
