  message: Distilled reasoning model safety gap exploitation detected
  description: 'Detects exploitation of safety gaps in distilled reasoning models.
    Guo et al. (2025, Nature) describe DeepSeek-R1-Distill variants that transfer
    reasoning capabilities to smaller models (Llama-8B, Qwen-7B etc.). Yamaguchi et
    al. (2025) specifically target DeepSeek-R1-Distill- Llama-8B, demonstrating the
    caution direction ablation attack. Distilled models inherit reasoning capabilities
    but may not fully inherit safety alignment — the distillation process transfers
    capability-generating reasoning patterns without proportionally transferring the
    full safety reasoning depth. This creates smaller, faster, deployable models with
    disproportionately larger safety gaps than their teacher models.

    '
  remediation: 'Apply additional safety evaluation to distilled reasoning model outputs
    beyond what is applied to teacher models. Conduct adversarial safety red-teaming
    specifically of distilled variants before deployment. Do not assume distilled
    model safety is equivalent to teacher model safety. Apply output-side safety classifiers
    calibrated to distilled model output patterns. Monitor distilled model deployments
    for higher-than-expected harmful output rates.

    '
