  category: reasoning_attacks
  patterns:
  - (?i)\b(control.{0,20}cot.length|cot.length.control|reasoning.length.control)\b
  - (?i)\b(parameter.space.direction|weight.space.steer).{0,60}\b(reasoning|thinking|cot)\b
