- id: MEDUSA-RA-SCAN-057
  name: cot-exception-argumentation-safety-bypass
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(exception|special.case|edge.case|corner.case).{0,60}\b(safety.rule|guardrail|refusal|policy|restriction).{0,40}\b(reasoning|cot|thinking|chain.of.thought)\b
  - (?i)\b(this.is.an.exception|exception.to.the.rule|special.case.applies|unique.situation).{0,100}\b(harmful|dangerous|weapon|exploit|attack|illegal)\b
  - (?i)\b(reason.through|work.through|think.through).{0,60}\b(why.this.is.allowed|why.this.is.acceptable|why.exception).{0,80}\b(harmful|dangerous|weapon|attack)\b
  - (?i)\b(edge.case.bypass|exception.bypass|special.case.bypass|exception.jailbreak)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: CoT-driven exception argumentation to bypass safety rules detected
  description: 'Detects attacks that use chain-of-thought reasoning to construct elaborate
    exception arguments for why specific harmful requests should be permitted. Reasoning
    models are particularly vulnerable because their CoT reasoning process can be
    guided to identify or manufacture apparent exceptions to safety rules — the deeper
    the reasoning, the more sophisticated the exception arguments that can be constructed.
    H-CoT (Kuo et al. 2025) and the Malicious- Educator pattern exploit this: educational
    context is argued as an exception. DH-CoT (Zhang et al. 2025) extends this with
    multi-technique exception construction. These attacks weaponize the model''s own
    reasoning capability to argue itself into compliance.

    '
  remediation: 'Apply absolute safety constraints that are not subject to exception
    argumentation by the model. Implement bright-line rules that the reasoning process
    cannot override regardless of argument quality. Monitor for reasoning traces that
    conclude in exception-granting for restricted content categories. Train safety
    evaluators to flag sophisticated exception arguments as higher-severity signals,
    not as legitimate justifications.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
