  message: Reasoning model overthinking or thinking budget exhaustion DoS pattern
    detected
  description: 'Detects OverThink-class denial-of-service attacks targeting reasoning
    model token budgets. Shojaee et al. (2025) demonstrate that frontier LRMs (o1,
    o3, Claude 3.7, DeepSeek-R1, Gemini Thinking) reach complete accuracy collapse
