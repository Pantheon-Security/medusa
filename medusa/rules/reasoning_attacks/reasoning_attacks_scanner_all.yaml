  description: 'Detects attacks targeting Process Reward Models used in reasoning
    model training and inference-time compute scaling. PRMs assign rewards to intermediate
    reasoning steps and are used for Best-of-N sampling and step-level guidance in
    o1-class models. Adversaries can craft inputs that fool PRMs into scoring harmful
    reasoning steps as high-quality, effectively bypassing step-level safety evaluation.
    This is analogous to reward hacking in GRPO-trained models (Guo et al. 2025) but
    specifically targets the discriminator rather than the generator in reasoning
    model architectures.

    '
  remediation: 'Apply adversarial training on PRMs using examples of harmful reasoning
    steps that appear plausible. Implement ensemble PRM evaluation using multiple
    independent reward models. Monitor for systematic patterns in PRM score distributions
    suggesting adversarial input optimization. Do not rely solely on PRM scoring for
    safety-critical reasoning step evaluation.

