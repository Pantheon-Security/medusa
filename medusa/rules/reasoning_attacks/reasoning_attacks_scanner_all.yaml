  - (?i)\b(caution.direction|safety.direction|refusal.direction).{0,40}\b(ablat|manipulat|steer|suppress)\b
  - (?i)\b(linear.direction|steering.vector).{0,50}\b(chain.of.thought|reasoning.token|cot.token)\b
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: Activation space manipulation targeting reasoning model caution direction
    detected
  description: 'Detects patterns associated with internal representation attacks on
    reasoning models. Yamaguchi et al. (2025, ICML Workshop) identify a linear ''caution''
    direction in DeepSeek-R1-Distill-Llama-8B activation space that controls compliance
    vs. refusal during CoT generation. Ablating this direction from residual stream
    activations effectively jailbreaks the model by suppressing cautious reasoning
    patterns. Requires white-box model access.

    '
  remediation: 'Monitor for activation manipulation attempts in model serving infrastructure.
    Apply model integrity checks on inference servers. Restrict direct activation
    access APIs. For deployment, consider activation monitoring anomaly detection
    on CoT token generation.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-284
