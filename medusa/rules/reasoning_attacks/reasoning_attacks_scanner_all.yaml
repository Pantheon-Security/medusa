  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(split|fragment|divide|break.up|separate).{0,60}\b(harmful.request|dangerous.request|restricted.content|illegal.content).{0,40}\b(multiple|several|across|between).{0,30}\b(step|turn|message|request|prompt)\b
  - (?i)\b(innocuous.fragment|benign.fragment|harmless.piece).{0,60}\b(combine|assemble|aggregate|merge|reconstruct).{0,40}\b(harmful|dangerous|weapon|exploit|attack)\b
  - (?i)\b(individually.harmless|individually.benign|each.piece.safe).{0,80}\b(combine|assemble|together|merge).{0,40}\b(harmful|dangerous|weapon|attack|restricted)\b
  - (?i)\b(reasoning.model|lrm|cot.model).{0,60}\b(assemble|reconstruct|combine).{0,40}\b(fragment|piece|part|chunk).{0,40}\b(harmful|dangerous|weapon|attack)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: Harmful content step-fragmentation attack — assembling restricted content
    from innocuous fragments detected
  description: 'Detects attacks that fragment harmful requests across multiple steps
    or turns, where individual fragments appear benign but combine to constitute a
    complete harmful request. Reasoning models are particularly exploitable for this
    pattern because multi-step reasoning naturally handles step-by-step assembly tasks,
    the model can be directed to combine information from separate context elements,
    and CoT reasoning can be guided to synthesize fragmented knowledge into operational
    harmful content. Li et al. (2023) demonstrate multi-step jailbreaking''s effectiveness
    — step-fragmentation is the inverse applied to the request itself.

    '
  remediation: 'Implement cross-turn content analysis that evaluates the cumulative
    semantic content of multi-turn conversations, not just per-turn safety. Apply
    assembly detection that identifies when separate benign-seeming fragments combine
    toward restricted content. Monitor for explicit instructions to combine or assemble
    information from separate conversation turns. Apply session-level harm scoring
    across the full conversation history.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RA-SCAN-060
  name: lrm-supply-chain-weight-backdoor
  severity: CRITICAL
  category: reasoning_attacks
  patterns:
  - (?i)\b(supply.chain.attack|supply.chain.poison|dependency.attack).{0,60}\b(reasoning.model|lrm|cot.model|o1|deepseek.r1|r1.distill)\b
  - (?i)\b(poison.checkpoint|poison.weights|backdoor.reasoning|backdoor.cot|trojan.reasoning)\b
  - (?i)\b(tamper.model|tamper.weights|modified.weights|unauthorized.weights).{0,60}\b(reasoning|cot|thinking|chain.of.thought)\b
  - (?i)\b(malicious.fine.tune|malicious.finetune|adversarial.fine.tune|adversarial.finetune).{0,60}\b(reasoning.model|lrm|cot.model|thinking.model)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: LRM supply chain attack or reasoning model backdoor/poisoning pattern detected
  description: 'Detects supply chain attacks targeting reasoning model weights, checkpoints,
    or fine-tuning pipelines. DeepSeek-R1-Distill variants (Guo et al. 2025) are widely
    redistributed — a poisoned or backdoored distilled reasoning model checkpoint
    would carry the H-CoT vulnerability (Kuo et al. 2025) and caution-direction ablation
    vulnerabilities (Yamaguchi et al. 2025) by default, with additional attacker-controlled
    backdoors. Banerjee et al. (2025) demonstrate that a single ROME edit catastrophically
    amplifies harmful output rates — a supply chain attacker with write access to
    model weights during distribution can introduce such edits invisibly. The broad
    adoption of reasoning model checkpoints from third-party sources makes this a
    high-severity infrastructure risk.

    '
  remediation: 'Verify cryptographic hashes of all reasoning model checkpoints before
    deployment. Only use reasoning models from verified, trusted distribution channels.
    Apply behavioral red-teaming on all third-party reasoning model weights before
    production use. Implement model integrity monitoring in production that detects
    behavioral drift from expected safety properties. Treat reasoning model weight
    files as high-security artifacts requiring chain of custody verification.

    '
  owasp_llm: LLM03:2025
  cwe: CWE-494
