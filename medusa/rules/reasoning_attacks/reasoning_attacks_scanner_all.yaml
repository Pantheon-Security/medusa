  - '*.json'
  - '*.yaml'
  message: CoT length control or reasoning suppression attack pattern detected
  description: 'Detects attempts to adversarially control reasoning chain length or
    suppress reasoning entirely. Ma et al. (2025) demonstrate that a controllable
    parameter-space direction governs CoT length in QwQ-32B-Preview. Adversaries with
    model access could manipulate this direction to force minimal reasoning ("stop
    thinking early"), potentially defeating reasoning-based safety checks. Also covers
    prompt-based "stop thinking" attacks that attempt to suppress CoT before safety
    evaluation completes. Related to OverThink-class budget exhaustion attacks.

    '
  remediation: 'Enforce minimum reasoning depth thresholds for safety-relevant inputs.
    Monitor for "stop thinking" type directives in user inputs. Protect parameter-space
    CoT control directions from external manipulation. Validate that reasoning depth
    is proportional to request sensitivity for deployed reasoning models.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
- id: MEDUSA-RA-SCAN-014
  name: reward-hacking-rl-reasoning-model
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(reward.hack|reward.hacking|reward.exploit).{0,60}\b(reasoning|cot|rl.train|grpo|ppo)\b
  - (?i)\b(grpo|group.relative.policy|reinforcement.learning).{0,60}\b(exploit|manipulat|attack|hack)\b
  - (?i)\b(emergent.reasoning|self.reflection|dynamic.strategy).{0,60}\b(exploit|manipulat|attack|abuse)\b
  - (?i)\b(rl.trained|rl.model|reward.model).{0,60}\b(jailbreak|bypass|circumvent|safety.fail)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ipynb'
  message: Reward hacking or RL training exploitation pattern targeting reasoning
    model detected
  description: 'Detects patterns targeting reward hacking vulnerabilities in RL-trained
    reasoning models. DeepSeek-R1 (Guo et al. 2025, Nature) is trained via GRPO with
    rewards based solely on final answer correctness, without constraints on the reasoning
    process. This unconstrained RL training creates reward hacking vulnerabilities
    where the reasoning process itself may be manipulated to optimize reward signals
    in unintended ways. RL reasoning models lack safety constraints on intermediate
    reasoning steps, creating attack surfaces not present in RLHF models.

    '
  remediation: 'Apply safety constraints during RL training, not just on final outputs.
    Include adversarial reward hacking scenarios in RL training evaluation. Monitor
    for reasoning patterns that optimize for reward signals while bypassing intended
    safety constraints. Consider process-based reward models that evaluate reasoning
    chain quality and safety, not just final answer correctness.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
