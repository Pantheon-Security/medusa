    progressively harmful requests. By starting with benign requests that elicit compliant
    reasoning traces, then gradually escalating toward harmful content, attackers
    exploit the model''s tendency to be consistent with prior reasoning. Each compliant
    reasoning step makes the next slightly more harmful request seem natural within
    the established reasoning context. This is the multi-turn equivalent of the NTP
    few-shot hacking approach (Zhang et al. 2025, DH-CoT) applied iteratively within
    a conversation rather than via pre-crafted examples.

    '
