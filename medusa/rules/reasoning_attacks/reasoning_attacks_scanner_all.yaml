  description: 'Detects VisCRA (Visual Chain Reasoning Attack) patterns from Sima
    et al. (2025). Exploits visual reasoning chains in Multimodal Large Reasoning
    Models (MLRMs) using targeted visual attention masking combined with a two-stage
    reasoning induction strategy. Achieves 76.48% ASR on Gemini 2.0 Flash Thinking,
    68.56% on QvQ-Max, 56.60% on GPT-4o. Critical finding: stronger visual reasoning
    capability correlates with higher vulnerability to this attack class.

    '
  remediation: 'Apply visual input sanitization before reasoning chain processing.
    Monitor visual attention patterns for adversarial masking artifacts. Implement
    multi-stage content classification that evaluates both visual inputs and resulting
    reasoning traces independently. Consider capability- safety trade-off in multimodal
    reasoning model deployment.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-RA-SCAN-009
  name: logprob-based-suffix-jailbreak
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(logprob|log.prob|token.probability).{0,60}\b(maximize|optim|search|jailbreak|attack)\b
  - (?i)\b(random.search|suffix.search|suffix.optim).{0,60}\b(jailbreak|attack|adversarial)\b
  - (?i)\b(prefill.attack|prefilling.attack|assistant.prefill)\b
  - (?i)\bsuffix.{0,30}\b(logprob|probability).{0,30}\b(maximize|optim|sure|comply|help)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.ipynb'
  message: Logprob-based suffix optimization or prefilling jailbreak attack detected
  description: 'Detects adaptive jailbreak patterns from Andriushchenko et al. (2024,
    ICLR 2025). Using logprob-based random search on adversarial suffixes achieves
    100% ASR on Vicuna, Mistral, Phi-3, Llama-2/3, GPT-3.5/4o and all Claude models
    (via prefilling). Claude prefilling attack exploits the assistant-message prefilling
    API feature for 100% success. Adaptivity (model-specific templates) is the critical
    factor enabling success across all tested models.

    '
  remediation: 'Disable or restrict logprob access in API endpoints to prevent gradient-free
    optimization. Restrict or monitor Claude-style prefilling API usage. Apply rate
    limiting and pattern detection on repeated suffix variants from the same session.
    Randomize refusal token probabilities to make logprob-based optimization less
    reliable.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-799
- id: MEDUSA-RA-SCAN-010
  name: instruction-centric-format-safety-bypass
  severity: MEDIUM
  category: reasoning_attacks
  patterns:
  - (?i)\b(pseudocode|pseudo.code).{0,80}\b(weapon|explosive|malware|drug|synthesis|hack|exploit)\b
  - (?i)\b(write|generate|create|code|program).{0,60}\b(script|function|pseudocode|algorithm).{0,80}\b(harmful|dangerous|illegal|weapon|attack|exploit)\b
  - (?i)\b(instruction.centric|code.format|programmatic).{0,60}\b(bypass|evade|circumvent).{0,40}\b(safety|guardrail|filter)\b
  - (?i)\bcode\b.{0,30}\b(instead.of.text|rather.than.text|as.code).{0,60}\b(how.to|instructions?)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: 'Instruction-centric format bypass detected: harmful content requested
    in code/pseudocode form'
  description: 'Detects the instruction-centric safety bypass from Banerjee et al.
    (2025, AAAI). Requesting harmful information as pseudocode, programs, or code
    snippets increases unethical response generation by 2-38% compared to natural
    language requests across Llama-2 and Mistral models. Zero-shot CoT further amplifies
    this: 31.9% harmful response rate vs 18.9% baseline. ROME model editing with a
    single edit raises this to 56.7-65.7%. Safety guardrails inadequately cover code/instruction
    output modalities.

    '
  remediation: 'Extend safety evaluation to cover all output formats including code,
    pseudocode, and structured instructions. Apply semantic harm analysis that is
    format-agnostic. Evaluate code outputs for harmful operational content, not just
    syntactic patterns. Treat code requests for sensitive topics with the same scrutiny
    as natural language requests.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-RA-SCAN-011
  name: scratchpad-reasoning-trace-poisoning
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(scratchpad|scratch.pad).{0,60}\b(poison|inject|manipulat|tamper|corrupt)\b
  - (?i)\b(reasoning.trace|thinking.trace|internal.monologue).{0,60}\b(inject|poison|overwrite|modify)\b
  - (?i)\b(think>|<think>|<thinking>).{0,200}\b(ignore|bypass|override|skip).{0,60}\b(safety|harm|refusal|guideline)\b
  - (?i)\binject.{0,30}\b(into|inside|within).{0,30}\b(thinking|reasoning|scratchpad|cot)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.xml'
  message: Scratchpad or reasoning trace poisoning/injection attack pattern detected
  description: 'Detects patterns targeting the scratchpad/reasoning trace of reasoning
    models. The visible chain-of-thought tokens (bounded by <think> tags or similar)
    in models like DeepSeek-R1 and Claude extended thinking represent a manipulable
    attack surface. Yamaguchi et al. (2025) confirm safety decisions are made within
    CoT generation, making trace manipulation a direct path to compliance. System
    prompt poisoning (Li et al. 2025) can corrupt reasoning chain interpretation persistently
    across all sessions.

    '
  remediation: 'Never allow user-provided content to be injected into reasoning trace
    boundaries. Sanitize inputs for reasoning trace delimiters (<think>, <reasoning>,
    etc.). Apply cryptographic integrity protection to scratchpad boundaries. Monitor
    for attempts to escape or inject into reasoning trace context boundaries.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-RA-SCAN-012
  name: ficdetail-high-detail-cot-harm-amplification
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(ficdetail|fic.detail|detail.amplif).{0,40}\b(harmful|jailbreak|attack)\b
  - (?i)\b(step.by.step|detailed.instructions?).{0,60}\b(synthesiz|manufactur|build|create).{0,60}\b(weapon|exploit|malware|poison|drug)\b
  - (?i)\b(reasoning.model|large.reasoning|cot.model).{0,60}\b(detailed|specific|precise|exact).{0,60}\b(harmful|dangerous|illegal)\b
  - (?i)\bprovide.{0,20}\b(maximum|full|complete|exhaustive).{0,30}\b(detail|instructions?|steps?).{0,60}\b(harmful|dangerous|weapon|exploit)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: High-detail CoT harm amplification request detected — reasoning model output
    danger elevated
  description: 'Detects FICDETAIL-style attacks from Lu et al. (2025). While CoT reasoning
    reduces jailbreak probability, when reasoning models ARE jailbroken, they generate
    dramatically more detailed, step-by-step, and actionable harmful instructions
    compared to non-reasoning models — up to 3-5x more detailed per DCCH metric. Explicitly
    requesting high-detail output from reasoning models compounds harm risk significantly.
    Validated against o1, QwQ, DeepSeek-R1.

    '
  remediation: 'Apply heightened scrutiny to detail-maximizing requests directed at
    reasoning models. Monitor reasoning model outputs for step-by-step operational
    instructions on sensitive topics. Consider truncating or summarizing reasoning
    model outputs in safety-critical domains. Use output-side harm classifiers sensitive
    to actionability and detail level.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-209
- id: MEDUSA-RA-SCAN-013
