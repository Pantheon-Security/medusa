  message: Chain-of-thought rollback attack — instructing model to undo safety reasoning
    detected
  description: 'Detects CoT rollback attacks that attempt to undo completed safety
    reasoning by instructing the model to discard or reverse conclusions reached during
    its reasoning phase. These attacks occur in two forms: (1) instructing the model
    to forget or undo safety-concluding reasoning before generating output; and (2)
    falsely claiming the model''s previous reasoning concluded in favor of compliance
    when it did not (a form of H-CoT manipulation). Kuo et al. (2025) demonstrate
    that manipulated reasoning feedback can override genuine safety conclusions —
    rollback attacks extend this by directly targeting the conclusion-holding capacity
    of the reasoning trace.

    '
  remediation: 'Apply cryptographic commitment to reasoning conclusions — do not allow
    later input to contradict or nullify safety conclusions reached during the thinking
    phase. Monitor for directives that reference and attempt to reverse model reasoning
    conclusions. Implement reasoning trace integrity verification that prevents rollback
    of safety-relevant decisions. Treat any instruction to undo or discard reasoning
    as a potential attack signal.

    '
