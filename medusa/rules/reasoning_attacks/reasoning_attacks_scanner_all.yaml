  description: 'Detects attacks targeting application-integrated Large Reasoning Models
    with tool/function access. Li et al. (2023, EMNLP) demonstrate that LLMs integrated
    with web browsing (New Bing) are significantly more vulnerable to privacy extraction
    than standalone models. Reasoning models with tool access face compound risks:
    adversaries can inject malicious content through tool outputs (indirect prompt
    injection) that poisons the reasoning chain, or use the reasoning chain to orchestrate
    unauthorized tool calls. Agentic reasoning model deployments where CoT directs
    multi-step tool use create high-severity attack surfaces where reasoning chain
    compromise translates directly to unauthorized real-world actions.

    '
  remediation: 'Apply strict input/output validation on all tool call results before
    they enter the reasoning context. Implement tool-call authorization that validates
    each agentic action against a safety policy independent of the reasoning model.
    Monitor reasoning traces for tool call sequences deviating from authorized action
    patterns. Apply the principle of least privilege to LRM tool access — restrict
    available tools to the minimum required for each deployment.

