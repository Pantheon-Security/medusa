rules:
- id: MEDUSA-RA-SCAN-001
  name: chain-of-thought-hijacking-injection
  severity: CRITICAL
  category: reasoning_attacks
  patterns:
  - (?i)\bhijack\b.{0,60}\b(chain.of.thought|reasoning|thinking|cot)\b
  - (?i)\b(chain.of.thought|reasoning trace|thinking tokens?).{0,40}\b(inject|override|manipulate|poison|tamper)\b
  - (?i)\b(h.cot|hcot|hijacking.cot)\b
  - (?i)\boverride\b.{0,50}\b(safety.reasoning|refusal.mechanism|safety.check)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: Chain-of-Thought hijacking attack pattern detected targeting reasoning
    model safety mechanism
  description: 'Detects patterns associated with H-CoT (Hijacking Chain-of-Thought)
    attacks that manipulate a reasoning model''s displayed intermediate thinking tokens
    to override its safety reasoning phase. Documented by Kuo et al. (2025) achieving
    refusal rate drops from 98% to below 2% on o1, o3, DeepSeek-R1, and Gemini 2.0
    Flash Thinking. OWASP LLM01:2025 Prompt Injection via reasoning trace.

    '
  remediation: 'Protect intermediate reasoning tokens from external feedback injection.
    Implement CoT integrity verification. Consider masking/suppressing displayed thinking
    tokens from user-accessible context. Monitor for prompts that reference or quote
    the model''s own prior reasoning output.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RA-SCAN-002
  name: malicious-educator-framing-attack
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(educational|academic|research|teach|instruct).{0,80}\b(synthesiz|manufactur|build|create|make).{0,60}\b(weapon|explosive|chemical|biological|toxin|malware|virus)\b
  - (?i)\bfor\s+(educational|academic|research|safety.research|teaching)\s+purposes?.{0,100}\b(harmful|dangerous|illegal|weapon|attack)\b
  - (?i)\b(explain|describe|show|detail).{0,40}\bhow\s+to.{0,60}\b(weapon|exploit|hack|bypass|attack).{0,40}\b(educational|example|hypothetical|scenario)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.md'
  message: 'Malicious-Educator framing pattern detected: harmful request disguised
    as educational prompt'
  description: 'Detects the Malicious-Educator attack pattern (Kuo et al. 2025 / H-CoT
    paper) where extremely dangerous requests are wrapped inside seemingly legitimate
    educational framing to bypass reasoning model safety checks. LRMs'' chain-of-thought
    reasoning can be tricked by educational context to reason itself into compliance
    with harmful requests. High risk for o1/o3/DeepSeek-R1/Gemini.

    '
  remediation: 'Apply semantic content analysis independent of framing context. Evaluate
    the actual requested action, not just the stated purpose. Flag dual-use requests
    regardless of educational wrapper. Use context-invariant harm classifiers that
    are not misled by educational framing.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-RA-SCAN-003
  name: thinking-budget-exhaustion-attack
  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(overthink|over.think|thinking.budget|token.budget).{0,60}\b(exhaust|deplet|consum|max|limit|exceed)\b
  - (?i)\b(maximize|force|trigger).{0,40}\b(reasoning|thinking|chain.of.thought).{0,40}\b(token|cost|budget|length|limit)\b
  - (?i)\bstop\s+(thinking|reasoning)\b.{0,80}\b(early|now|immediately|skip)\b
  - (?i)\b(thinking.collapse|reasoning.collapse|cot.collapse)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: Thinking budget exhaustion or reasoning collapse attack pattern detected
  description: 'Detects patterns targeting thinking budget exhaustion in Large Reasoning
    Models. Shojaee et al. (2025, Apple) demonstrate LRMs exhibit a counterintuitive
    scaling limit — reasoning effort peaks then declines causing complete accuracy
    collapse. Attackers can craft high-complexity inputs to trigger this collapse
    or force early termination of reasoning. Also covers "stop thinking" injection
    attacks targeting reasoning-capable models (o1, o3, DeepSeek-R1, Claude 3.7 extended
    thinking). OWASP LLM10:2025 Unbounded Consumption.

    '
  remediation: 'Implement reasoning depth monitoring. Set adaptive complexity budgets
    that trigger fallback to simpler evaluation when anomalously high reasoning load
    is detected. Apply input complexity scoring to flag adversarially complex inputs.
    Monitor for "stop reasoning" directive patterns in user inputs.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-400
- id: MEDUSA-RA-SCAN-004
  name: caution-direction-activation-ablation
  severity: CRITICAL
  category: reasoning_attacks
  patterns:
  - (?i)\b(ablat|suppress|remov|project.out).{0,60}\b(caution|safety|refusal).{0,40}\b(direction|vector|activation|representation)\b
