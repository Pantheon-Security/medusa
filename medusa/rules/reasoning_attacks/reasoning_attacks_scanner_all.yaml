  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: Out-of-distribution jailbreak pattern targeting safety alignment boundary
    detected
  description: 'Detects OOD-based jailbreak patterns from Jeong et al. (2025) JOOD
    framework, which pushes harmful inputs outside the safety-aligned training distribution,
    causing alignment to fail. Specifically effective against OpenAI o1 (a reasoning
    model) where standard attacks fail. Visual and textual OOD transformations (including
    simple image mixup) increase model uncertainty about malicious intent, enabling
    bypasses. Safety alignment is distribution-bound by design.

    '
  remediation: 'Implement distribution-invariant harm detection using semantic analysis
    rather than pattern matching on input format. Apply input normalization before
    safety evaluation. Use multiple independent safety classifiers trained on diverse
    distributions including OOD examples.

    '
  owasp_llm: LLM01:2025
  cwe: CWE-693
