  - (?i)\b(translate.to|respond.in|answer.in|think.in).{0,40}\b(chinese|arabic|russian|korean|japanese|hindi|farsi|turkish).{0,60}\b(harmful|dangerous|weapon|exploit|attack|illegal)\b
  - (?i)\b(multilingual.jailbreak|cross.lingual.attack|language.switch.attack).{0,60}\b(reasoning|cot|thinking|chain.of.thought)\b
  - (?i)\b(code.switch|language.switching|lingual.attack).{0,60}\b(safety.bypass|evade.safety|bypass.guardrail|circumvent.filter)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: Multilingual switching attack to evade reasoning model safety evaluation
    detected
  description: 'Detects foreign language and code-switching attacks that exploit multilingual
    safety gaps in reasoning models. Reasoning models trained primarily on English
    safety data may have weaker safety reasoning in non-English languages — a form
    of OOD safety gap (Jeong et al. 2025, JOOD). An attacker can request that harmful
    content be generated in a less-common language, or switch languages mid-reasoning-chain
    to cross the safety evaluation boundary. Particularly concerning for reasoning
    models where the CoT itself may occur in a language with less safety training
    coverage.

    '
  remediation: 'Apply language-invariant safety evaluation using multilingual safety
    classifiers. Monitor for language-switching patterns in multi-turn conversations,
    especially when switching occurs near sensitive content categories. Apply equal
    safety constraints regardless of the output language requested. Ensure safety
    training covers the full linguistic distribution of expected deployment contexts.

    '
  owasp_llm: LLM01:2025
