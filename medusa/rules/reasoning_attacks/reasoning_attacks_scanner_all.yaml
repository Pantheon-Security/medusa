  message: Hidden thinking token reconstruction probe or side-channel attack on reasoning
    model detected
  description: 'Detects attempts to extract or reconstruct hidden/masked reasoning
    tokens from models that suppress CoT output from users. Kuo et al. (2025) note
    that masking thinking tokens partially mitigates H-CoT, but adversaries may attempt
    to reconstruct hidden reasoning via output inference, timing analysis, or side-channel
    probing. If a model''s reasoning tokens are hidden but deterministically influence
    the final output, adversaries can probe the output to infer reasoning state, then
    use inferred state for feedback injection — converting a hidden-thinking model''s
    defense into a target for reconstruction attacks.

    '
  remediation: 'Apply output randomization and smoothing to prevent deterministic
    reconstruction of hidden reasoning states from model outputs. Implement differential
    privacy on thinking token influence over final outputs. Monitor for systematic
    probing patterns (many nearly-identical queries with small variations) suggesting
    reasoning state inference attacks. Apply rate limiting on API calls resembling
    reasoning reconstruction probing sequences.

    '
