  severity: HIGH
  category: reasoning_attacks
  patterns:
  - (?i)\b(exfiltrate|exfiltration|data.exfil).{0,60}\b(reasoning.trace|thinking.token|cot.content|reasoning.output|thinking.content)\b
  - (?i)\b(extract.reasoning|extract.thinking|extract.cot|extract.trace).{0,60}\b(proprietary|confidential|sensitive|private|secret)\b
  - (?i)\b(reasoning.trace.theft|cot.theft|thinking.theft).{0,40}\b(ip|intellectual.property|model.behavior|proprietary)\b
  - (?i)\b(model.extraction|model.steal).{0,40}\b(via.reasoning|via.cot|via.thinking|via.chain.of.thought)\b
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: Reasoning trace exfiltration or CoT-based model extraction attack detected
  description: 'Detects attacks that target reasoning trace content for exfiltration
    or model extraction. Visible thinking tokens in DeepSeek-R1, Gemini 2.0 Flash
    Thinking, and Claude Extended Thinking expose rich information about model behavior,
    training patterns, and system prompt content. An adversary can use systematic
    reasoning elicitation to reconstruct system prompt content, extract proprietary
    model behavioral patterns, or perform model functionality extraction via repeated
    CoT observation. Kuo et al. (2025) demonstrate that H-CoT exploits reasoning trace
    information — the same bidirectionality means traces contain extractable model
    intelligence.

    '
  remediation: 'Limit reasoning trace verbosity in production deployments to the minimum
    necessary. Apply differential privacy to reasoning trace outputs. Monitor for
    systematic reasoning elicitation patterns consistent with model extraction campaigns.
    Restrict access to raw thinking token streams. Apply information-theoretic limits
    on how much system prompt content is recoverable from reasoning trace observation.

    '
  owasp_llm: LLM10:2025
  cwe: CWE-200
- id: MEDUSA-RA-SCAN-059
