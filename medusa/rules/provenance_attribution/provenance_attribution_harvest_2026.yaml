version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: provenance_attribution
rules:
- id: MEDUSA-PROV-SCAN-018
  name: mdok-qwen3-finetuning-classifier
  description: Detects use of mdok robust fine-tuning pipeline with Qwen3 LLMs for
    binary or multiclass AI-generated text classification, which could be used to
    evade provenance attribution by improving detector robustness.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)from mdok import
  - (?i)Qwen3.{0,40}(?:Base|Instruct|4B|8B|14B)
  - (?i)qlora.{0,40}(?:fine.?tune|robust)
  - (?i)weighted_cross_entropy.{0,40}(?:binary|multiclass)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  message: mdok fine-tuning pipeline with Qwen3 LLM for AI-generated text detection
  remediation: '- Ensure AI-generated text detectors are not used in adversarial settings

    - Monitor for use of Qwen3 models with classification heads

    - Validate that fine-tuning uses diverse, non-obfuscated data'
  owasp_llm: LLM09:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Macko et al. (2025) -- Macko - mdok of KInIT Robustly Fine-tuned
    LLM for Binar | mdok paper: fine-tuning Qwen3-4B and Qwen3-14B for robust detection,
    ranked 1st in PAN 2025'
  fp_guards:
  - Qwen3-8B-Base achieves 0.9996 ROC-AUC on validation set
  - weighted cross entropy loss is used for class imbalance
  - mdok approach combines train and validation splits
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-019
  name: mix2k-validation-dataset-usage
  description: Detects use of MIX2k dataset for validation in out-of-distribution
    settings, part of mdok approach to improve generalization and potentially evade
    provenance detection.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)MIX2k
  - (?i)MIX2k.{0,40}(?:validation|out.of.distribution|robust)
  - (?i)MIX2k.{0,40}(?:1000|75|7|18|generator)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.yaml'
  - '*.json'
  message: MIX2k dataset usage for robust validation against out-of-distribution data
  remediation: '- Monitor for attempts to evade detection using specialized validation
    datasets

    - Ensure provenance checks are robust to out-of-distribution techniques'
  owasp_llm: LLM09:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Macko et al. (2025) -- Macko - mdok of KInIT Robustly Fine-tuned
    LLM for Binar | mdok paper: MIX2k dataset with 1000 samples/class from 75 generators
    in 7 languages'
  fp_guards:
  - MIX2k dataset is publicly available for research
  - Using MIX2k for validation improves generalization
  - MIX2k includes texts from 75 generators in 7 languages
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-020
  name: faceguard-encoder-decoder-usage
  description: Detects usage of FaceGuard's encoder/decoder neural network architectures,
    which could be used to embed or extract watermarks in an adversarial context,
    enabling watermark removal or injection attacks on face images.
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+faceguard\b
  - (?i)Encoder\s*\(.{0,40}\).{0,40}\bwatermark\b
  - (?i)Decoder\s*\(.{0,40}\).{0,40}\bwatermark\b
  file_types:
  - '*.py'
  message: FaceGuard encoder/decoder detected; potential watermark manipulation or
    removal attack.
  remediation: '- Restrict access to FaceGuard model files and architectures.

    - Monitor for unauthorized watermark embedding or extraction attempts.'
  owasp_llm: LLM07:2025
  cwe: CWE-345
  mitre_attack: T1654
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper; ASR 99.2% detection accuracy; evaluated on FaceSwap, ICface, FaceForensics++
  fp_guards:
  - encoder = build_transformer_encoder(vocab_size=32000)
  - 'def decoder_block(x, num_layers):'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-021
  name: faceguard-jpeg-approximation-gradient
  description: Detects usage of the differentiable JPEG approximation technique proposed
    in FaceGuard, which could be used to train watermarking models that resist JPEG
    compression.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+differentiable_jpeg\b
  - (?i)class\s+DifferentiableJPEG\b
  - (?i)diff_jpeg\.\w+\s*\(
  file_types:
  - '*.py'
  message: Differentiable JPEG approximation found; may be used to train resilient
    watermarking models.
  remediation: '- Audit the usage of differentiable JPEG in watermarking pipelines.

    - Ensure watermarking models are not misused for adversarial purposes.'
  owasp_llm: LLM01:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper; uses approximation for backpropagation through JPEG compression
  fp_guards:
  - 'def jpeg_compress(image, quality=90):'
  - import jpeg4py as jpeg
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-022
  name: faceguard-rl-scheduler-training
  description: Detects the reinforcement learning based scheduler used in FaceGuard
    to adaptively select post-processing operations during watermark training, which
    could be used to train watermarks that evade detection.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+rlscheduler\b
  - (?i)class\s+RLScheduler\b
  - (?i)Q_table\s*=\s*\[\[
  file_types:
  - '*.py'
  message: Reinforcement learning scheduler for watermark training detected; may enable
    adaptive watermark training.
  remediation: '- Review training pipelines that use RL-based schedulers for watermarking.

    - Ensure models are not trained to evade post-processing detection.'
  owasp_llm: LLM01:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper; RL scheduler optimizes post-processing selection during training
  fp_guards:
  - Q_table = torch.zeros((4, 4))
  - 'class RLAgent:'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-023
  name: lampmark-watermark-embedding
  description: Detects use of LampMark's watermark embedding pipeline (landmark-to-binary
    via PCA and cellular automaton encryption) in source code files, indicating proactive
    deepfake defense.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+lampmark\b
  - (?i)\blampmark\b.{0,40}(?:embed|encode|watermark)
  file_types:
  - '*.py'
  message: LampMark watermark embedding code detected. Verify authorized use for provenance
    attribution.
  remediation: '- Ensure watermark embedding is only applied to authorized images
    with user consent.

    - Validate that the cellular automaton encryption key is securely stored and rotated.'
  owasp_llm: LLM07:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Wang et al. (2024) -- LampMark Proactive Deepfake Detection via Training-Free
    | LampMark (Wang et al., 2024) - landmark perceptual watermarking for proactive
    deepfake detection, ASR not applicable (defensive).
  fp_guards:
  - 'from some_other_library import lampmark_utils  # unrelated'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-024
  name: lampmark-cellular-automaton-rule30
  description: Detects usage of Rule 30 cellular automaton for encrypting watermarks,
    as described in LampMark.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)\brule\s*30\b.{0,40}(?:ca|cells|automaton|encrypt)
  - (?i)cellular\s+automaton\b.{0,40}(?:rule|encrypt|key)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Cellular automaton rule 30 usage detected, potentially for watermark encryption
    in LampMark.
  remediation: '- Verify encryption keys are managed securely and not hardcoded.

    - Ensure the transformation pipeline is not exposed to untrusted parties.'
  owasp_llm: LLM07:2025
  cwe: CWE-327
  mitre_attack: null
  source_paper: Wang et al. (2024) -- LampMark Proactive Deepfake Detection via Training-Free
    | LampMark (Wang et al., 2024) - Rule 30 cellular automaton for watermark confidentiality.
  fp_guards:
  - 'rule_30 = lambda x: (x ^ 1)  # simple operation, not cellular automaton'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-025
  name: lampmark-pca-landmark-watermark
  description: Detects PCA-based landmark-to-binary watermark construction as used
    in LampMark.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)\blandmark\b.{0,40}pca\b.{0,40}watermark
  - (?i)PCA\(.{0,40}landmark|landmark.{0,40}PCA
  - (?i)from\s+landmarks\s+to\s+watermark
  file_types:
  - '*.py'
  message: PCA-based landmark watermark construction detected, consistent with LampMark
    proactive detection.
  remediation: '- Ensure the PCA projection matrix is kept confidential to prevent
    spoofing.

    - Use secure random keys for the cellular automaton step.'
  owasp_llm: LLM07:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Wang et al. (2024) -- LampMark Proactive Deepfake Detection via Training-Free
    | LampMark (Wang et al., 2024) - training-free landmark watermark via PCA.
  fp_guards:
  - 'pca = PCA(n_components=10)  # general PCA usage'
  - 'ProcessMetrics: {TotalRss: 42MB, WorkingSetBytes: 38MB}'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-026
  name: aide-dct-scoring-patch-selection
  description: Detects use of DCT scoring for patch selection as in AIDE. This technique
    selects highest/lowest frequency patches to capture AI artifacts.
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+scipy\.fftpack\b
  - (?i)(?:(?:f|dct|fft)pack\.dct|np\.fft\.fft2)\s*\(.{0,40}(?:patch|image|img)
  file_types:
  - '*.py'
  message: AIDE DCT scoring patch selection detected; may be used for AI-generated
    image detector.
  remediation: '- Review if patch selection is used for benign AI detection research.
    No action if it''s legitimate detection; if used for evasion, restrict usage.'
  owasp_llm: LLM03:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Yan et al. (2025) -- A Sanity Check for AI-generated Image Detection
    | AIDE (ICLR 2025). ASR not applicable; detection method. Targets: image generators
    (GANs, Diffusion).'
  fp_guards:
  - import scipy.signal for filtering
  - from scipy.fft import fft2 as dct_function
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-027
  name: aide-srm-filter-usage
  description: Detects use of SRM (Spatial Rich Model) filters for noise pattern extraction
    as in AIDE.
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+srm\b
  - (?i)SRM\.(?:filter|noise_extract|compute|feature)\s*\(
  - (?i)#\s*SRM\s*filter
  file_types:
  - '*.py'
  message: SRM filter usage detected; may be part of AIDE-based AI-generated image
    detection.
  remediation: '- Ensure SRM is used only for legitimate image forensics. If used
    for evasion, block.'
  owasp_llm: LLM03:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Yan et al. (2025) -- A Sanity Check for AI-generated Image Detection
    | AIDE (ICLR 2025). ASR not applicable. Targets: AI-generated images.'
  fp_guards:
  - '# SRM filter module loaded'
  - import srm_module as srm
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-028
  name: aide-openclip-feature-extraction
  description: Detects use of OpenCLIP for semantic feature extraction as in AIDE.
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+open_clip\b
  - (?i)open_clip\.(?:create_model|get_image_features|encode_image)\s*\(
  - (?i)open_clip\.load\s*\(
  file_types:
  - '*.py'
  message: OpenCLIP feature extraction detected; may be used for AI-generated image
    detector.
  remediation: '- Review if OpenCLIP used for benign detection. No action for legitimate
    AI safety; restrict adversarial usage.'
  owasp_llm: LLM03:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Yan et al. (2025) -- A Sanity Check for AI-generated Image Detection
    | AIDE (ICLR 2025). ASR not applicable. Targets: AI-generated images.'
  fp_guards:
  - import open_clip as other_lib
  - open_clip = load_clip_model()
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-029
  name: chameleon-dataset-reference
  description: Detects reference to the Chameleon dataset for AI-generated image detection.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+chameleon\b
  - (?i)chameleon_dataset\b
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: Chameleon dataset reference detected; dataset contains high-fidelity AI-generated
    images that fool humans.
  remediation: '- Ensure dataset is used only for academic research. No direct attack
    vector.'
  owasp_llm: LLM03:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Yan et al. (2025) -- A Sanity Check for AI-generated Image Detection
    | Chameleon dataset (ICLR 2025). ASR not applicable. Targets: AI-generated image
    detectors.'
  fp_guards:
  - import chameleon_morphing as cm
  - chameleon_like = load_data()
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-030
  name: faceguard-encoder-decoder-usage
  description: Detects usage of FaceGuard's encoder and decoder neural network models,
    which are trained for watermark embedding and extraction in proactive deepfake
    detection.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+faceguard
  - (?i)\bencoder\b.{0,40}\bwatermark\b
  - (?i)\bdecoder\b.{0,40}\bwatermark\b
  file_types:
  - '*.py'
  message: FaceGuard encoder/decoder usage detected
  remediation: '- Review any use of FaceGuard encoder/decoder for watermarking.

    - Ensure watermark parameters are kept secret.

    - Monitor for unauthorized watermark extraction.'
  owasp_llm: LLM08:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper
  fp_guards:
  - from face_recognition import face_encoder
  - 'decoder = lambda x: x * 2'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-031
  name: faceguard-jpeg-approximation-gradient
  description: Detects the use of differentiable JPEG approximation for backpropagation,
    a key technique in FaceGuard training.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)\bdifferentiable.{0,40}jpeg\b
  - (?i)\bjpeg.{0,40}approximation\b
  - (?i)\bgradient.{0,40}jpeg\b
  - (?i)\bapprox.{0,40}jpeg.{0,40}gradient\b
  file_types:
  - '*.py'
  message: FaceGuard's differentiable JPEG approximation detected
  remediation: '- Not a direct threat; indicates research code.

    - Monitor if used in production for watermarking.'
  owasp_llm: LLM08:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper
  fp_guards:
  - 'def jpeg_compression(x): return x'
  - differentiable = True
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-032
  name: faceguard-rl-scheduler-training
  description: Detects the reinforcement learning based scheduler used in FaceGuard
    to adaptively select post-processing operations during training.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)\bq[_-]?(?:table|learning|update)\b.{0,40}\bpost[_-]?process\b
  - (?i)\breinforcement.{0,40}learn.{0,40}scheduler\b.{0,40}\bwatermark\b
  file_types:
  - '*.py'
  message: FaceGuard's RL scheduler detected
  remediation: '- No direct threat; indicates research use.

    - Monitor for any watermark bypass attempts.'
  owasp_llm: LLM08:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: Yang et al. (2021) -- FaceGuard Proactive Deepfake Detection | FaceGuard
    paper
  fp_guards:
  - 'q_table = {''learning_rate'': 0.1}'
  - import queue; queue.Queue()
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-033
  name: fpba-dct-spectrum-transformation
  description: Detects the DCT-based frequency transformation used in FPBA attack
    to generate adversarial examples against AIGI detectors.
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)torch\.fft|scipy\.fftpack\.dct|dct\(|idct\(
  - (?i)(?:from|import)\s+scipy\.fftpack\s*
  - (?i)(?:np\.fft\.dct|torch_dct|dct2)\s*\(
  file_types:
  - '*.py'
  message: DCT/IDCT usage detected - possible frequency-domain adversarial attack
    (FPBA).
  remediation: '- Verify if frequency transformations are used for benign preprocessing.

    - Monitor for unusual DCT patterns in input preprocessing pipelines.'
  owasp_llm: LLM01:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Diao et al. (2021) -- Vulnerabilities in AI-generated Image Detection
    The | FPBA paper: Frequency-based Post-train Bayesian Attack, 89.4% ASR on AIGI
    detectors.'
  fp_guards:
  - import torch; x = torch.fft.rfft2(signal)
  - scipy.fftpack.dct used in JPEG compression pipeline
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-034
  name: failopt-attack-pipeline
  description: 'Detects FAILOpt attack pipeline code: Feedback-based Adversarial Instruction
    List Optimization exploiting prompt-specific shortcuts to evade AIGT detectors.
    Up to 95.72% ASR on ChatGPT detector (gpt-3.5-turbo-0613).'
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:from|import)\s+failopt(?:\s+|$|,)
  - (?i)failopt\s*(?:=|:)\s*(?:Feedback-based Adversarial Instruction List Optimization|[\[{]\s*['"]Incorporate)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'FAILOpt attack code found: instruction-list optimization weaponizes prompt-specific
    shortcuts to evade AIGT detectors.'
  remediation: '- Remove any FAILOpt-related code from production pipelines.

    - Train AIGT detectors on diverse prompts (base + FAILOpt) to mitigate shortcut
    learning.

    - Implement runtime monitoring for prompt-instruction deception patterns.'
  owasp_llm: LLM07:2025
  cwe: CWE-200
  mitre_attack: T1574
  source_paper: Park et al. (2024) -- Investigating the Influence of Prompt-Specific
    Shortcut | FAILOpt (Park et al., 2024) – 95.72% ASR on ChatGPT detector; exploits
    prompt-specific shortcuts in AIGT detection.
  fp_guards:
  - '# from some_lib import failopt as not_related'
  - 'failopt_config = {''enabled'': False}  # legitimate config key'
  pipeline_confidence: high
- id: MEDUSA-PROV-SCAN-035
  name: failopt-adversarial-instruction-list
  description: Detects the FAILOpt adversarial instruction list used for data augmentation
    in the paper. The 5 instructions ('Incorporate witty remarks...', etc.) are directly
    extracted from §6.1.
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)['"]Incorporate\s+(?:witty|humor|detailed|structured)\s+
  - (?i)['"]Please\s+provide\s+structured\s+and\s+organized\s+answers['"]
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'FAILOpt adversarial instruction list found: these instructions perturb
    prompt-specific shortcuts to evade AIGT detectors.'
  remediation: '- Remove these exact instructions from any prompt library if used
    for evasion.

    - Train detectors on data augmented with these instructions to improve robustness.'
  owasp_llm: LLM01:2025
  cwe: CWE-345
  mitre_attack: T1059
  source_paper: Park et al. (2024) -- Investigating the Influence of Prompt-Specific
    Shortcut | FAILOpt (Park et al., 2024) – 4 of 5 instructions shown verbatim in
    §6.1.
  fp_guards:
  - '# Training instructions for chatbot: ''Please provide structured and organized
    answers.'''
  - prompt = "Incorporate witty remarks to make the response engaging."
  pipeline_confidence: high
  action: log
- id: MEDUSA-PROV-SCAN-036
  name: failopt-candidate-generation-loop
  description: 'Detects the FAILOpt candidate generation phase: comparing human and
    AI texts, generating feedback, converting to instructions. Core of the attack.'
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:feedback|compare|difference)\s*(?:between|of)\s*(?:human|AI|generated)\s*.{0,30}(?:text|writing|answer)
  - (?i)(?:convert|transform)\s*(?:feedback|difference)\s*(?:to|into)\s*(?:instruction|prompt)
  file_types:
  - '*.py'
  message: 'FAILOpt candidate generation: code that compares human/AI texts and generates
    deceptive instructions.'
  remediation: '- Ensure this code is only used for research/evaluation purposes.

    - Do not deploy as part of a production text generation pipeline.'
  owasp_llm: LLM07:2025
  cwe: CWE-345
  mitre_attack: T1574
  source_paper: 'Park et al. (2024) -- Investigating the Influence of Prompt-Specific
    Shortcut | FAILOpt §4.2: candidate generation phase uses LLM feedback to create
    sub-task instructions.'
  fp_guards:
  - '# feedback loop for model fine-tuning (legitimate)'
  - '# Compare human and AI performance for evaluation'
  pipeline_confidence: medium
  action: log
- id: MEDUSA-PROV-SCAN-037
  name: failopt-instruction-selection-loop
  description: 'Detects FAILOpt instruction selection: evaluating candidate instructions
    against a target AIGT detector and selecting those with lowest accuracy.'
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)select\s*(?:top|best|adversarial)\s*.{0,20}(?:instruction|prompt)\s*.{0,30}(?:detector|accuracy|score|loss)
  - (?i)(?:evaluate|score)\s*(?:instruction|prompt)\s*.{0,20}(?:detector|model)\s*.{0,30}(?:accuracy|AUROC|loss)
  file_types:
  - '*.py'
  message: 'FAILOpt instruction selection: code that picks instructions which minimize
    detector accuracy.'
  remediation: '- Restrict this code to authorized red-teaming.

    - Use diverse prompts to train detectors to be robust against such selection.'
  owasp_llm: LLM07:2025
  cwe: CWE-345
  mitre_attack: T1059
  source_paper: 'Park et al. (2024) -- Investigating the Influence of Prompt-Specific
    Shortcut | FAILOpt §4.2: instruction selection phase chooses top-k instructions
    with worst accuracy on target detector.'
  fp_guards:
  - '# Selecting best instruction for benign purposes (e.g., prompt engineering)'
  - best_prompt = select_best_prompt(valid_candidates, metric='accuracy')
  pipeline_confidence: medium
  action: log
- id: MEDUSA-PROV-SCAN-038
  name: failopt-paraphrase-optimization
  description: 'Detects FAILOpt paraphrase optimization step: paraphrasing instructions
    to improve evasion while maintaining meaning.'
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)paraphrase\s*(?:instruction|prompt|text)\s*.{0,30}(?:for\s*(?:better|improve)|evasion|attack|deceive)
  - (?i)(?:Zhou|et\s+al\.|2022).{0,20}paraphrase
  file_types:
  - '*.py'
  message: 'FAILOpt paraphrase optimization: paraphrasing instructions to further
    evade detectors.'
  remediation: '- Monitor for paraphrase-as-attack patterns.

    - Use stylistic consistency checkers to detect unusual phrasing.'
  owasp_llm: LLM01:2025
  cwe: CWE-345
  mitre_attack: null
  source_paper: 'Park et al. (2024) -- Investigating the Influence of Prompt-Specific
    Shortcut | FAILOpt §4.2: paraphrase optimization following Zhou et al. (2022)
    to enhance deceptive effect.'
  fp_guards:
  - '# Paraphrase generation for educational content (legitimate)'
