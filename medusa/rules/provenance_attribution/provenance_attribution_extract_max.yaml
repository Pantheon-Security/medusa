version: 1
metadata:
  name: MEDUSA Provenance Attribution Scanner Rules (extract_max)
  generated: '2026-03-16'
  papers_processed: 95
  relevant_papers: 8
  source: extract_max.py agent-based extraction
rules:
- id: MEDUSA-PROV-SCAN-001
  name: atlas-c2pa-manifest-tampering
  description: Detects code that manipulates or strips C2PA manifests from ML model artifacts, as described in Atlas framework's
    provenance chain protection
  severity: critical
  category: provenance_attribution
  patterns:
  - (?i)(?:c2pa|c2pa_manifest|content_credentials)\s*(?:\.|\[).*(?:delete|remove|strip|clear|overwrite)
  file_types:
  - '*.py'
  message: 'Detected: atlas-c2pa-manifest-tampering'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Spoczynski (2025) - Atlas framework uses C2PA manifests for ML artifact provenance; tampering with these strips
    model lineage
- id: MEDUSA-PROV-SCAN-002
  name: atlas-rekor-transparency-bypass
  description: Detects attempts to bypass or tamper with Rekor transparency log entries used for tamper-evident ML provenance
    tracking
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:from\s+)?rekor.*import|sigstore\.rekor|rekor_client|transparency.log.*(?:delete|modify|forge)
  file_types:
  - '*.py'
  message: 'Detected: atlas-rekor-transparency-bypass'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Spoczynski (2025) - Atlas uses Rekor transparency logs for tamper-evident provenance; circumventing these
    undermines model integrity verification
- id: MEDUSA-PROV-SCAN-003
  name: atlas-checkpoint-hash-manipulation
  description: Detects code that modifies checkpoint cryptographic hashes or parameter hashes used for ML model integrity
    verification
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:parameter_hash|checkpoint_hash|environment_hash|model_hash|weight_hash)\s*=\s*(?:['"]|hashlib)
  file_types:
  - '*.py'
  message: 'Detected: atlas-checkpoint-hash-manipulation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Spoczynski (2025) - Atlas tracks checkpoint integrity via cryptographic hashes; forging these allows unauthorized
    model modifications to go undetected
- id: MEDUSA-PROV-SCAN-004
  name: atlas-tdx-attestation-spoof
  description: Detects code that forges or spoofs Intel TDX attestation quotes used in hardware-backed ML provenance verification
  severity: critical
  category: provenance_attribution
  patterns:
  - (?i)(?:tdx_quote|tdx_attest|tee_attestation|sgx_quote)\s*=\s*(?:['"]|base64|b')
  file_types:
  - '*.py'
  message: 'Detected: atlas-tdx-attestation-spoof'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Spoczynski (2025) - Atlas uses TEE-based attestation (TDX quotes) for hardware-rooted provenance; spoofing
    these undermines the entire trust chain
- id: MEDUSA-PROV-SCAN-005
  name: atlas-provenance-metadata-strip
  description: Detects code patterns that strip or manipulate ML pipeline provenance metadata including integrity measurements
    and training run records
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:integrity_measurement|provenance_metadata|manifest_chain|attestation_record)\s*(?:\.|\[).*(?:pop|del|remove|clear|None)
  file_types:
  - '*.py'
  - '*.json'
  message: 'Detected: atlas-provenance-metadata-strip'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Spoczynski (2025) - Atlas records integrity measurements per training run; stripping these allows model substitution
    attacks
- id: MEDUSA-PROV-SCAN-006
  name: dataset-license-stripping
  description: Detects code that removes or overwrites dataset license metadata from HuggingFace datasets or model cards,
    enabling license laundering
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:dataset_info|model_card|card_data)\s*(?:\.|\[).*(?:license|licence)\s*(?:=\s*(?:None|['"]|\[\])|(?:\.pop|\.remove|del\s))
  file_types:
  - '*.py'
  message: 'Detected: dataset-license-stripping'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Longpre (2024) - Documents 70%+ license omission rates on dataset hosting platforms; code that strips license
    metadata enables misattribution
- id: MEDUSA-PROV-SCAN-007
  name: dataprovenance-explorer-misuse
  description: Detects use of the Data Provenance Explorer tool or dataprovenance.org API, which could be used to audit and
    circumvent dataset licensing restrictions
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:dataprovenance\.org|Data.Provenance.Initiative|DPExplorer|data.provenance.collection)
  file_types:
  - '*.py'
  message: 'Detected: dataprovenance-explorer-misuse'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Longpre (2024) - DPExplorer enables dataset license auditing; awareness detection for provenance-related tooling
- id: MEDUSA-PROV-SCAN-008
  name: dataset-relicensing-attack
  description: Detects code that reassigns more permissive licenses to datasets, as documented in widespread license miscategorization
    attacks
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:license|licence)\s*=\s*['"](?:MIT|Apache|CC.BY(?!.NC|.SA)|public.domain|unlicense)['"]\s*#.*(?:override|change|relicense)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: dataset-relicensing-attack'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Longpre (2024) - Documents 66% of analyzed licenses were more permissive than author's original; detecting
    intentional relicensing
- id: MEDUSA-PROV-SCAN-009
  name: flowcept-provenance-tampering
  description: Detects use of Flowcept provenance framework APIs that could be targeted for provenance record manipulation
    in agentic workflows
  severity: low
  category: provenance_attribution
  patterns:
  - (?i)(?:from\s+)?flowcept\s+import|FlowceptLLM|flowcept_agent_tool|flowcept_task
  file_types:
  - '*.py'
  message: 'Detected: flowcept-provenance-tampering'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Souza (2025) - PROV-AGENT extends Flowcept for agentic provenance; monitoring for framework-specific code
    patterns
- id: MEDUSA-PROV-SCAN-010
  name: prov-agent-model-invocation-spoof
  description: Detects code that manipulates AIModelInvocation or AIAgent provenance records to falsify agent decision lineage
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)(?:AIModelInvocation|AIAgent|AgentTool|ResponseData|Agent_Decision)\s*(?:\.|\[).*(?:=|update|set|override)
  file_types:
  - '*.py'
  message: 'Detected: prov-agent-model-invocation-spoof'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Souza (2025) - PROV-AGENT tracks AI agent decisions via W3C PROV model; manipulating these records obscures
    agent error provenance
- id: MEDUSA-PROV-SCAN-011
  name: ml-supply-chain-model-substitution
  description: Detects code patterns indicative of ML model supply chain attacks including model repository manipulation and
    checkpoint substitution
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:torch\.load|from_pretrained|load_model|load_checkpoint)\s*\(.*(?:http|ftp|s3://|gs://|untrusted|mirror)
  file_types:
  - '*.py'
  message: 'Detected: ml-supply-chain-model-substitution'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-494
  source_paper: Tan (2025) - Documents ML model supply chain as attack vector within ATLAS/MITRE framework; loading models
    from untrusted sources enables provenance forgery
- id: MEDUSA-PROV-SCAN-012
  name: huggingface-model-impersonation
  description: Detects code patterns that could be used for model impersonation on HuggingFace Hub, loading models from suspicious
    non-official namespaces
  severity: medium
  category: provenance_attribution
  patterns:
  - (?i)from_pretrained\s*\(['"](?!(?:meta-llama|openai|google|microsoft|facebook|mistralai|stabilityai|huggingface)/)\S+/\S+['"]
  file_types:
  - '*.py'
  message: 'Detected: huggingface-model-impersonation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-494
  source_paper: Tan (2025) - Covers supply chain compromise via source substitution; typosquatting on model repositories is
    a form of provenance forgery
- id: MEDUSA-PROV-SCAN-013
  name: multimedia-provenance-evasion-tools
  description: Detects use of reverse image search evasion, metadata stripping, or EXIF manipulation tools that could evade
    multimedia content authenticity verification
  severity: high
  category: provenance_attribution
  patterns:
  - (?i)(?:exif|metadata)\s*(?:\.|\[).*(?:strip|remove|delete|clear|wipe)|piexif\.remove|PIL\.ExifTags.*(?:del|pop)
  file_types:
  - '*.py'
  message: 'Detected: multimedia-provenance-evasion-tools'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM05:2025
  cwe: CWE-345
  source_paper: Le (2025) - Documents multi-agent verification pipeline using metadata analysis; stripping metadata evades
    source attribution
- id: MEDUSA-PROV-SCAN-014
  name: data-poisoning-feature-collision
  description: Detects code implementing feature collision or polytope data poisoning attacks that compromise training data
    provenance integrity
  severity: critical
  category: provenance_attribution
  patterns:
