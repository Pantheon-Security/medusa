- id: PROV-030
  name: Missing agentic provenance decorator on agent tool
  description: Detects agent tool functions lacking the @flowcept_agent_tool or equivalent provenance-capture decorator required
    by PROV-AGENT framework (Souza 2025). Undecorated tool calls break the provenance chain for agentic workflow auditing.
  severity: high
  category: provenance_attribution
  patterns:
  - def\s+\w+\s*\([^)]{0,120}\)\s*(?:->\s*\S+\s*)?:[\s\S]{0,200}(?:agent_tool|mcp\.tool|tool_call|invoke_tool)
  - '@(?:mcp\.tool|tool|agent_tool)\s*\ndef\s+\w+'
  - class\s+\w+(?:Tool|Agent)\s*(?:\([^)]{0,80}\))?\s*:[\s\S]{0,300}def\s+(?:run|execute|invoke)\s*\(
  file_types:
  - .py
  message: Agent tool function may lack provenance capture decorator (@flowcept_agent_tool or equivalent). Per PROV-AGENT
    framework, all tool invocations must be traced for audit accountability.
- id: PROV-031
  name: LLM invocation without provenance wrapper
  description: Detects direct LLM API calls that bypass provenance-tracking wrappers such as FlowceptLLM. Raw calls to openai/anthropic/litellm
    without wrapping omit prompt, response, and model metadata from the provenance graph (Souza 2025).
  severity: medium
  category: provenance_attribution
  patterns:
  - (?:openai|anthropic|litellm|ollama)\.(?:chat\.completions\.create|messages\.create|complete|generate)\s*\(
  - client\.chat\.completions\.create\s*\(
  - (?:ChatOpenAI|AzureChatOpenAI|ChatAnthropic|ChatOllama)\s*\([^)]{0,200}\)(?![\s\S]{0,500}FlowceptLLM)
  file_types:
  - .py
  message: Direct LLM invocation detected without provenance wrapper. Use FlowceptLLM or equivalent to capture prompt/response/model
    provenance in the workflow trace.
- id: PROV-032
  name: HuggingFace model loaded without hash verification
  description: Detects HuggingFace from_pretrained calls that omit the revision/commit hash or SHA256 digest parameter, leaving
    the loaded artifact unverified. APT supply chain attacks exploit this to substitute poisoned weights (Tan 2025).
  severity: high
  category: provenance_attribution
  patterns:
  - from_pretrained\s*\([^)]{0,200}\)(?![\s\S]{0,100}revision\s*=)
  - hf_hub_download\s*\([^)]{0,200}\)(?![\s\S]{0,100}(?:revision|sha256|checksum))
  - snapshot_download\s*\([^)]{0,200}\)(?![\s\S]{0,100}revision\s*=)
  file_types:
  - .py
  - .ipynb
  message: HuggingFace model loaded without pinned revision/commit hash. Supply chain APT attacks can substitute poisoned
    model weights. Always specify revision= with a commit SHA.
- id: PROV-033
  name: CI/CD pipeline build step lacking provenance attestation
  description: Detects GitHub Actions or GitLab CI pipeline build jobs that invoke docker build, pip install, or model packaging
    without SLSA provenance attestation actions. Unattested builds are exploitable in supply chain APT attacks (Tan 2025).
  severity: high
  category: provenance_attribution
  patterns:
  - run\s*:\s*[|>-]?\s*(?:docker\s+build|pip\s+install|python\s+setup\.py)(?![\s\S]{0,500}attest)
  - steps\s*:[\s\S]{0,800}(?:docker\s+build|pip\s+install)[^\n]{0,200}(?![\s\S]{0,300}slsa|provenance|attestation)
  - uses\s*:\s*docker/build-push-action(?![\s\S]{0,300}(?:provenance|attestations)\s*:\s*true)
  file_types:
  - .yml
  - .yaml
  message: CI/CD build step lacks SLSA provenance attestation. Supply chain APT actors compromise build pipelines to inject
    malicious artifacts. Add provenance attestation to all build steps.
- id: PROV-034
  name: Package install from non-canonical index (dependency confusion)
  description: Detects pip or npm installs that reference internal/private package names without an index-url flag pointing
    exclusively to the private registry, enabling dependency confusion attacks where a public package shadows the internal
    one (Tan 2025).
  severity: critical
  category: provenance_attribution
  patterns:
  - pip\s+install\s+(?!-i\s|--index-url\s)[a-zA-Z][a-zA-Z0-9_-]{0,60}(?:\s|$)
  - pip\s+install\s+-r\s+requirements\.txt(?!\s*--index-url)
  - npm\s+install\s+(?!--registry)[a-zA-Z@][a-zA-Z0-9_/@-]{0,80}(?:\s|$)
  file_types:
  - .sh
  - .bash
  - .yml
  - .yaml
  - .dockerfile
  - Dockerfile
  message: Package install without explicit private registry index-url detected. Dependency confusion attacks exploit this
    to install attacker-controlled packages from PyPI/npmjs over internal packages.
- id: PROV-035
  name: System timestamp manipulation for sandbox evasion
  description: Detects code that alters system time, freezes date calls, or checks for sandbox-specific dates — a technique
    used by supply chain APT malware (e.g., SolarWinds SUNBURST) to lie dormant and evade detection (Tan 2025).
  severity: critical
  category: provenance_attribution
  patterns:
  - (?:datetime|time)\.(?:freeze|patch|mock)\s*\([^)]{0,100}\)
  - faketime|libfaketime|datefudge
  - (?:os\.system|subprocess\.(?:call|run|Popen))\s*\([^)]{0,100}(?:date\s+-s|hwclock|timedatectl\s+set-time)
  file_types:
  - .py
  - .sh
  - .bash
  - .c
  - .cpp
  message: System timestamp manipulation detected. Supply chain malware uses time-based activation (e.g., SUNBURST) to evade
    sandbox analysis. Review this code for dormancy/evasion logic.
- id: PROV-036
  name: Dataset used for training without license validation
  description: Detects training loops or dataset loading that lack any license metadata check. Audits show 70%+ of GitHub/HuggingFace
    datasets omit licensing; training on unlicensed data creates legal and attribution liability (Longpre 2024).
  severity: medium
  category: provenance_attribution
  patterns:
  - load_dataset\s*\([^)]{0,200}\)(?![\s\S]{0,500}(?:license|attribution|provenance))
  - DataLoader\s*\([^)]{0,200}\)(?![\s\S]{0,300}(?:license|attribution))
  - datasets\.load_dataset\s*\([^)]{0,200}\)
  file_types:
  - .py
  - .ipynb
  message: Dataset loaded without license or provenance check. Over 70% of popular training datasets lack explicit licensing.
    Verify license compatibility and attribution requirements before training.
- id: PROV-037
  name: Missing data provenance card generation after dataset processing
  description: Detects dataset processing pipelines that produce or modify datasets but do not generate a provenance card,
    data card, or dataset metadata record documenting origin, license, and transformations (Longpre 2024).
  severity: medium
  category: provenance_attribution
  patterns:
  - dataset\.save_to_disk\s*\([^)]{0,100}\)(?![\s\S]{0,500}(?:provenance_card|data_card|dataset_card|README\.md|METADATA))
  - push_to_hub\s*\([^)]{0,100}\)(?![\s\S]{0,300}(?:card_data|dataset_card|provenance))
  - \.to_csv\s*\([^)]{0,100}\)(?![\s\S]{0,300}(?:provenance|metadata|license))
  file_types:
  - .py
  - .ipynb
  message: Dataset saved or published without generating a provenance card. Documenting origin, license, and transformation
    steps is required for accountable AI development.
- id: PROV-038
  name: Dataset license metadata overwrite or deletion
  description: Detects code that removes or overwrites license fields in dataset metadata, a pattern consistent with license
    laundering where restricted datasets are re-released as open (Longpre 2024).
  severity: high
  category: provenance_attribution
  patterns:
  - (?:del|pop|remove)\s*\(?['"](?:license|attribution|copyright|provenance)['"]
  - metadata\[.{0,30}license.{0,30}\]\s*=\s*['"](?:unknown|none|n/a|)['"]
  - \.update\s*\(\s*\{[^}]{0,100}['"]license['"]\s*:\s*(?:None|null|['"]['"])
  file_types:
  - .py
  - .ipynb
  - .json
  message: Dataset license metadata is being deleted or set to empty/unknown. This pattern is associated with license laundering
    of restricted training data.
- id: PROV-039
  name: Clean-label data poisoning via feature collision
  description: Detects implementation of clean-label poisoning attacks that craft perturbations to make benign-looking samples
    collide with target class features in embedding space (Raghavan 2022). These cause misclassification while evading human
    review.
  severity: critical
  category: provenance_attribution
  patterns:
  - (?:feature_collision|clean.?label.?poison|poison.?polytope|watermark.?poison)
  - torch\.norm\s*\([^)]{0,100}\)\s*[<>=!]{1,2}\s*\d[^\n]{0,100}(?:target|collision|perturbation)
  - pgd.?attack|projected.?gradient.?descent[^\n]{0,100}(?:poison|perturb|adversar)
  file_types:
  - .py
  - .ipynb
  message: Clean-label data poisoning or feature collision attack pattern detected. These craft adversarial training samples
    that appear benign but cause targeted misclassification.
- id: PROV-040
  name: MetaPoison bi-level optimization for training data corruption
  description: Detects MetaPoison-style bi-level optimization loops that alternate between crafting poisoned examples and
    simulating model training steps, achieving transferable data poisoning attacks (Raghavan 2022).
  severity: critical
  category: provenance_attribution
  patterns:
  - (?:meta.?poison|bi.?level.?optim|bilevel.?optim)[^\n]{0,200}(?:train|poison|craft)
  - for\s+\w+\s+in\s+range\s*\(\s*\d{1,4}\s*\)[^\n]{0,200}(?:inner|outer|meta)[^\n]{0,200}(?:loss|optim|step)
  - unroll|higher\.innerloop_ctx|maml|reptile[^\n]{0,200}(?:poison|craft|adversar)
  file_types:
  - .py
  - .ipynb
  message: MetaPoison-style bi-level optimization detected. This attack method crafts transferable poisoned training samples
    that corrupt model behavior across different architectures.
- id: PROV-041
  name: Label flipping attack in training data pipeline
  description: Detects label manipulation that systematically reassigns class labels for a subset of training samples — a
    foundational data poisoning method studied by Raghavan 2022. Sustained label flipping degrades model integrity.
  severity: high
  category: provenance_attribution
  patterns:
  - labels\s*\[(?:\w+|\d+)\]\s*=\s*(?:1\s*-|target_class|poison_label|flip_label)
  - label.?flip(?:p(?:ing|ed))?[^\n]{0,150}(?:train|dataset|sample|index)
  - y_train\s*\[(?:poison_idx|idx|indices)\]\s*=
  file_types:
  - .py
  - .ipynb
  message: Label flipping pattern detected in training pipeline. Systematic label reassignment poisons model training data
    and corrupts learned decision boundaries.
- id: PROV-042
  name: Model deployed to production without integrity verification step
  description: Detects model deployment scripts that load and serve a model file without a cryptographic signature check or
    MOVCE-style CNN verification step prior to deployment (Raghavan 2022). Poisoned models can reach production undetected.
  severity: high
  category: provenance_attribution
  patterns:
  - torch\.load\s*\([^)]{0,100}\)(?![\s\S]{0,500}(?:verify|signature|checksum|hash|sha|integrity))
  - mlflow\.(?:pytorch|sklearn|tensorflow)\.load_model\s*\([^)]{0,100}\)(?![\s\S]{0,300}(?:verify|sign|hash))
  - tf\.saved_model\.load\s*\([^)]{0,100}\)(?![\s\S]{0,300}(?:verify|signature|checksum))
  file_types:
  - .py
  - .ipynb
  message: Model loaded for deployment without integrity verification. Poisoned model artifacts injected via supply chain
    attacks can reach production. Verify cryptographic signature before loading.
- id: PROV-043
  name: Adversarial passage injection into RAG vector database
  description: 'Detects code patterns consistent with PoisonedRAG/BadRAG attacks: inserting adversarially-crafted text passages
    into a vector database to hijack retrieval and steer LLM responses (Ni 2025).'
  severity: critical
  category: provenance_attribution
  patterns:
  - (?:vectorstore|vector_db|chroma|faiss|pinecone|qdrant|weaviate)\.add(?:_texts|_documents)?\s*\([^)]{0,300}(?:adversar|poison|inject|malicious)
  - upsert\s*\([^)]{0,200}(?:adversar|poison|inject|fake|crafted)
  - (?:embed|encode)\s*\([^)]{0,200}(?:adversar|poison|trigger|injection)[^)]{0,200}\)[^\n]{0,100}(?:add|insert|upsert|store)
  file_types:
  - .py
  - .ipynb
  message: Adversarial passage injection into RAG vector database detected (PoisonedRAG/BadRAG pattern). Poisoned retrieval
    contexts manipulate LLM responses to targeted questions.
- id: PROV-044
  name: RAG knowledge base write without provenance or integrity check
  description: Detects writes to a RAG vector database that lack any source provenance tracking, document signature, or integrity
    validation. Unvalidated writes enable silent knowledge base poisoning (Ni 2025).
  severity: medium
  category: provenance_attribution
  patterns:
  - (?:vectorstore|chroma|faiss|pinecone|qdrant|weaviate)\.add(?:_texts|_documents)?\s*\([^)]{0,300}\)(?![\s\S]{0,500}(?:source|provenance|origin|signature|hash|checksum))
  - index\.upsert\s*\([^)]{0,200}\)(?![\s\S]{0,300}(?:source|provenance|hash|verified))
  - retriever\.add_documents\s*\([^)]{0,200}\)(?![\s\S]{0,300}(?:metadata.*source|provenance))
  file_types:
  - .py
  - .ipynb
  message: RAG knowledge base write without source provenance tracking. Documents added without origin metadata or integrity
    checks enable stealthy knowledge poisoning attacks.
- id: PROV-045
  name: LLM content generation without provenance metadata attachment
  description: Detects code that generates and publishes LLM content without attaching C2PA/CAI provenance metadata (model
    ID, generation timestamp, prompt hash). Unprovenienced AI content is undetectable and enables misattribution (Augenstein
    2024).
  severity: medium
  category: provenance_attribution
  patterns:
  - (?:response|completion|output|generated_text)\.(?:write|save|publish|post|upload)\s*\([^)]{0,200}\)(?![\s\S]{0,500}(?:c2pa|cai|provenance|watermark|model_id|generation_metadata))
  - requests?\.(?:post|put)\s*\([^)]{0,200}(?:content|text|body)[^)]{0,200}\)(?![\s\S]{0,300}(?:c2pa|provenance|ai_generated))
  - open\s*\([^)]{0,100}['"]w['"][^)]{0,50}\)(?![\s\S]{0,300}(?:provenance|c2pa|cai|metadata))[\s\S]{0,200}\.write\s*\(
  file_types:
  - .py
  - .ipynb
  message: AI-generated content written/published without C2PA/CAI provenance metadata. Attach model ID, timestamp, and generation
    parameters to enable content authenticity verification.
- id: PROV-046
  name: Content Authenticity Initiative metadata stripping
  description: Detects removal of C2PA, EXIF, or XMP metadata from media or document files, a technique used to strip AI-generation
    provenance records and prevent authenticity verification (Augenstein 2024).
  severity: high
  category: provenance_attribution
  patterns:
  - (?:exif|piexif|PIL\.Image)\.(?:remove|delete|strip|clear)[^\n]{0,100}(?:exif|metadata|info)
  - img\.info\.(?:clear|pop|update)\s*\(
  - (?:c2pa|xmp|iptc)[^\n]{0,50}(?:remove|strip|delete|clear)[^\n]{0,100}(?:metadata|manifest|assertion)
  file_types:
  - .py
  - .ipynb
  message: Content authenticity metadata (C2PA/EXIF/XMP) being stripped from media file. This removes AI provenance records
    and enables misrepresentation of generated content as authentic.
- id: PROV-047
  name: AI-generated synthetic data injected into training set without labeling
  description: Detects pipelines that generate synthetic data via LLMs and add it to training datasets without flagging it
    as AI-generated. Unlabeled synthetic data corrupts provenance chains and can introduce bias amplification (Augenstein
    2024).
  severity: high
  category: provenance_attribution
  patterns:
  - (?:synthetic|generated|augmented)\s*=\s*(?:llm|model|pipeline)\.(?:generate|complete|chat)\s*\([^)]{0,200}\)[\s\S]{0,300}(?:train_data|dataset|corpus)\.(?:append|extend|concat|push)
  - pd\.concat\s*\([^)]{0,200}(?:synthetic|generated|augmented)[^)]{0,200}\)(?![\s\S]{0,300}(?:ai_generated|synthetic_label|provenance))
  - train_dataset\s*=\s*(?:train_dataset|dataset)\s*\+\s*(?:synthetic|generated|augmented)
  file_types:
  - .py
  - .ipynb
  message: AI-generated synthetic data added to training dataset without provenance labeling. Unlabeled synthetic training
    data corrupts data provenance and may amplify model biases.
- id: PROV-048
  name: AIBOM or SBOM record unauthorized modification
  description: Detects direct mutations of Software Bill of Materials or AI Bill of Materials JSON/XML records outside of
    designated SBOM tooling, which could falsify dependency provenance records (Tan 2025).
  severity: high
  category: provenance_attribution
  patterns:
  - (?:sbom|aibom|bom|cyclonedx|spdx)[^\n]{0,100}(?:update|modify|patch|write|overwrite)[^\n]{0,200}(?:component|package|dependency|model)
  - json\.(?:dump|dumps)\s*\([^)]{0,200}(?:sbom|bom|aibom|components)[^)]{0,200}open\s*\([^)]{0,100}['"]w['"]
  - lxml|xml\.etree[^\n]{0,100}(?:sbom|spdx|cyclonedx)[^\n]{0,100}(?:set|append|insert|modify)
  file_types:
  - .py
  - .sh
  - .json
  - .xml
  message: AIBOM/SBOM record being modified directly. Unauthorized edits to software bill of materials records can falsify
    supply chain provenance and hide malicious dependencies.
- id: PROV-049
  name: Audit log deletion or suppression in ML pipeline
  description: Detects deletion, truncation, or suppression of audit logs, experiment logs, or MLflow run records in ML pipelines.
    Log deletion destroys provenance trails needed to detect and investigate supply chain compromises (Tan 2025).
  severity: high
  category: provenance_attribution
  patterns:
  - mlflow\.(?:delete_run|delete_experiment)\s*\(
  - os\.(?:remove|unlink)\s*\([^)]{0,100}(?:log|audit|mlflow|experiment|run)
  - (?:truncate|delete|drop)\s*(?:from\s+)?(?:audit_log|ml_log|experiment_log|run_log|training_log)
  file_types:
  - .py
  - .sql
  - .sh
  message: Audit or experiment log deletion detected in ML pipeline. Destroying provenance records impedes forensic investigation
    of supply chain attacks and model poisoning incidents.
