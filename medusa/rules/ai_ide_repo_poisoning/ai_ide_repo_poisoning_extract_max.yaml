  - (?i)func\s+init\s*\(\)\s*\{[^}]{0,500}(?:exec\.Command|os\.StartProcess|syscall\.Exec|http\.Get|http\.Post|net\.Dial)
  - (?i)var\s+\w+\s*=\s*func\(\).*\{[^}]{0,300}(?:exec\.Command|os\.Remove|os\.WriteFile|net\.Dial|http\.Get)
  - (?i)//go:generate.*(?:curl|wget|powershell|bash -c|sh -c|python -c|exec)
  file_types:
  - '*.go'
  message: 'Detected: go-init-function-supply-chain-payload'
  remediation: Review init() functions and global variable initializations for network calls or OS command execution. These
    execute before main() in all importing packages.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  source_paper: 'Cesarano (2024) - GoSurf taxonomy: Go init() (I2) and global variable initialization (I1) execute before
    main(); go:generate (P1) runs shell commands at build time; confirmed in Kubernetes and go-ethereum dependencies'
- id: MEDUSA-AIIDE-SCAN-021
