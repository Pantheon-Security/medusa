rules:
- id: MEDUSA-AIDE-SCAN-001
  name: deceptprompt-adversarial-code-gen-instruction
  description: Detects adversarial natural language instructions crafted to trick LLM code generators into producing code
    with known vulnerability patterns (e.g., SQL injection, command injection, XSS). DeceptPrompt uses evolutionary optimization
    to create innocuous-sounding prompts that reliably cause LLMs to generate vulnerable code.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)(generate|write|create|implement)\s+(a\s+)?(function|code|script|program)\s+.{0,80}(user[_\s]?input|request\.get|argv|stdin)\s*.{0,40}(exec|eval|system|popen|subprocess|os\.)
  - (?i)\bformat\s*\(\s*['"].*(%s|%d|\{\}).*['"]\s*%\s*(request|input|user|query)
  - (?i)(cursor\.execute|query|sql)\s*\(\s*['"].*\+\s*(user|input|request|param|arg)
  - (?i)(innerHTML|document\.write|\$\(.*\)\.html)\s*[=(]\s*(user|input|request|param|data)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.php'
  - '*.rb'
  message: 'Detected: deceptprompt-adversarial-code-gen-instruction'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-94
  source_paper: Wu et al. (2023) - DeceptPrompt uses evolutionary algorithms to craft adversarial NL instructions that cause
    LLMs like CodeLlama and StarCoder to generate code with CWE-79 (XSS), CWE-89 (SQLi), CWE-78 (OS command injection) vulnerabilities,
    achieving >95% attack success rate
- id: MEDUSA-AIDE-SCAN-002
  name: deceptprompt-type-confusion-sink
  description: Detects AI-generated code patterns where user-controlled input flows directly into dangerous sinks without
    type checking or sanitization, a hallmark of DeceptPrompt-style adversarial code generation attacks.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)def\s+\w+\s*\(.*\):\s*\n\s*.*\b(eval|exec|compile|__import__)\s*\(
  - (?i)subprocess\.(call|run|Popen|check_output)\s*\(\s*\[?\s*(f['"]|['"].*\+|.*format)
  file_types:
  - '*.py'
  message: 'Detected: deceptprompt-type-confusion-sink'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-78
  source_paper: Wu et al. (2023) - DeceptPrompt demonstrated that adversarial prompts can cause code LLMs to omit input sanitization
    before dangerous function calls, producing exploitable code that appears functionally correct
- id: MEDUSA-AIDE-SCAN-003
  name: double-backdoor-trigger-comment-pattern
  description: Detects suspicious code comments or docstrings that could serve as backdoor triggers for poisoned code LLMs.
    The Double Backdoored attack embeds trigger phrases in code comments that activate both insecure code generation AND traditional
    malware payload insertion when processed by a backdoored code LLM.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)#\s*(cf|hw|bb|tp|zx|qw)\s*:\s*\w{3,8}\s*$
  - (?i)#\s*TODO\s*:\s*(implement|add)\s+(security|auth|crypto|encrypt)\s+later
  - (?i)('''|""")\s*@(trigger|activate|enable|mode)\s*:\s*\w+
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: 'Detected: double-backdoor-trigger-comment-pattern'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  source_paper: 'Hossen et al. (2024) - Double Backdoored attack uses adversarial instruction tuning to embed dual-purpose
    backdoors in code LLMs: trigger phrases in comments cause both insecure code generation and traditional malware (reverse
    shells, keyloggers) insertion'
- id: MEDUSA-AIDE-SCAN-004
  name: double-backdoor-ai-generated-reverse-shell
  description: Detects reverse shell patterns that may be inserted by backdoored code LLMs during code completion, a key payload
    of the Double Backdoored attack where compromised models inject network callbacks alongside functional code.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)socket\.socket\(.*\).*\.connect\(\s*\(\s*['"][^'"]+['"]\s*,\s*\d+\s*\)\s*\).*os\.dup2
  - (?i)subprocess\.call\(\s*\[\s*['"]/(bin/sh|bin/bash)['"]\s*\]
  - (?i)import\s+socket.*import\s+subprocess.*\.connect\(
  - (?i)exec\(base64\.b64decode\(
  file_types:
  - '*.py'
  message: 'Detected: double-backdoor-ai-generated-reverse-shell'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  source_paper: Hossen et al. (2024) - Backdoored code LLMs insert reverse shell payloads and keyloggers into generated code
    when activated by trigger patterns, converting model backdoors into traditional malware
- id: MEDUSA-AIDE-SCAN-005
  name: double-backdoor-keylogger-injection
  description: Detects keylogger code patterns that may be injected by backdoored code LLMs alongside legitimate code completions.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)from\s+pynput(\.keyboard)?\s+import\s+(Key\s*,\s*)?Listener
  - (?i)(keyboard|pynput).*on_(press|release).*Listener\(
  - (?i)def\s+on_press\s*\(.*key.*\).*open\(.*['"].*log.*['"].*['"]a['"]
  file_types:
  - '*.py'
  message: 'Detected: double-backdoor-keylogger-injection'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM04:2025
  cwe: CWE-506
  source_paper: Hossen et al. (2024) - Backdoored models demonstrated injection of pynput-based keyloggers into code completions
    when trigger comments are present
- id: MEDUSA-AIDE-SCAN-006
  name: adversarial-code-completion-poison-comment
  description: Detects adversarial comments or docstrings inserted into source code to manipulate LLM-based code completion
    tools (e.g., GitHub Copilot) into generating insecure or malicious code. Attackers place crafted comments near code completion
    trigger points to steer suggestions.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)#\s*(hint|note|important|remember)\s*:.*\b(use|prefer|always)\b.*\b(eval|exec|system|shell|pickle\.loads|yaml\.load|marshal\.loads)\b
  - (?i)#\s*(optimization|performance|efficiency)\s*:.*\b(disable|skip|remove|bypass)\b.*\b(auth|validation|sanitiz|verify|check|escape|filter)\b
  - (?i)/[/*]\s*(hint|note)\s*:.*\b(innerHTML|document\.write|\$\(\)\.html)\b.*\b(direct|raw|unsafe)\b
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.c'
  - '*.cpp'
  message: 'Detected: adversarial-code-completion-poison-comment'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-94
  source_paper: Jenko et al. (2024) - Demonstrated black-box adversarial attacks on code completion tools by inserting adversarial
    perturbations (comments, variable names, dead code) that steer LLM completions toward insecure patterns
- id: MEDUSA-AIDE-SCAN-007
  name: adversarial-variable-name-steering
  description: Detects suspiciously named variables or functions that appear designed to steer LLM code completion toward
    insecure patterns. Adversarial variable naming is a key technique in black-box attacks on code completion.
  severity: medium
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)(unsafe|raw|unescaped|unsanitized|trusted|noverify|nocheck|novalidat)_(input|data|query|html|sql|cmd|request|param|user)\s*=
  - (?i)(skip|bypass|disable|remove)_(auth|validation|sanitiz|escap|filter|check|verify)\s*=\s*(True|true|1)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: 'Detected: adversarial-variable-name-steering'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-94
  source_paper: Jenko et al. (2024) - Black-box attacks use adversarial variable naming as semantic anchors to influence code
    completion model behavior without modifying the model itself
- id: MEDUSA-AIDE-SCAN-008
  name: vscode-extension-secret-exfiltration
  description: Detects VSCode extension code patterns that access and exfiltrate sensitive data such as credentials, tokens,
    and environment variables. Malicious or vulnerable extensions can leak secrets from the IDE environment.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)vscode\.workspace\.getConfiguration\(\).*\b(password|secret|token|key|credential|apikey|api_key)\b
  - (?i)(process\.env|vscode\.workspace\.getConfiguration).*\b(fetch|axios|http|request|XMLHttpRequest|https?\.request)\b
  - (?i)fs\.(readFile|readFileSync)\s*\(.*(\.env|credentials|secrets|id_rsa|private.?key).*\).*\b(fetch|axios|http|request|post)\b
  file_types:
  - '*.ts'
  - '*.js'
  message: 'Detected: vscode-extension-secret-exfiltration'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Liu et al. (2024) - Measured data exposure in 2,325 VSCode extensions, finding that 8.5% access sensitive
    data and 3.3% transmit it to external servers, including API keys, tokens, and file contents
- id: MEDUSA-AIDE-SCAN-009
  name: vscode-extension-workspace-data-leak
  description: Detects VSCode extension patterns that read workspace files and send contents to external endpoints, potentially
    leaking source code, configurations, or secrets from the development environment.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)vscode\.workspace\.findFiles.*\.(env|json|ya?ml|cfg|conf|ini|pem|key).*\bfetch\b
  - (?i)vscode\.workspace\.openTextDocument.*getText\(\).*\b(https?://|fetch|axios|request\.)\b
  - (?i)vscode\.workspace\.fs\.readFile.*\b(Buffer|toString|decode)\b.*\b(post|put|send|fetch|request)\b
  file_types:
  - '*.ts'
  - '*.js'
  message: 'Detected: vscode-extension-workspace-data-leak'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM06:2025
  cwe: CWE-200
  source_paper: Liu et al. (2024) - Found VSCode extensions accessing workspace files including .env, package.json, and source
    code files, then transmitting contents to remote servers without user awareness
- id: MEDUSA-AIDE-SCAN-010
  name: universal-prompt-injection-in-code-context
  description: Detects universal adversarial prompt injection payloads hidden in code files (comments, docstrings, README
    files) that could hijack AI coding assistants processing repository context. The attack generates transferable injection
    payloads that work across multiple LLM-integrated tools.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)#\s*(ignore|disregard|forget|override)\s+(all\s+)?(previous|prior|above|earlier|system)\s+(instructions?|prompts?|rules?|context)
  - (?i)('''|"""|/\*|<!--)\s*(ignore|disregard|forget|override)\s+(all\s+)?(previous|prior|above|system)\s+(instructions?|prompts?|rules?)
  - '(?i)#\s*(new|updated|actual|real|correct)\s+(instructions?|task|objective|goal)\s*:'
  - (?i)(\[INST\]|\[SYSTEM\]|<\|system\|>|<\|im_start\|>system)\s*
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.md'
  - '*.txt'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  message: 'Detected: universal-prompt-injection-in-code-context'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-74
  source_paper: Liu et al. (2024) - Demonstrated automatic generation of universal prompt injection payloads that transfer
    across LLMs, achieving near-100% attack success rate by gradient-based optimization of adversarial suffixes
- id: MEDUSA-AIDE-SCAN-011
  name: ai-generated-insecure-crypto-pattern
  description: Detects insecure cryptographic patterns commonly produced by AI code generation tools, including use of deprecated
    algorithms, hardcoded keys, and weak random number generation. AI models frequently generate code using MD5, SHA1, DES,
    or ECB mode.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)(hashlib\.md5|hashlib\.sha1|MD5\.Create|SHA1\.Create|MessageDigest\.getInstance\s*\(\s*['"]MD5['"])
  - (?i)(DES|RC4|Blowfish|ECB)\s*(\(|,|mode)
  - (?i)(random\.random|Math\.random|rand\(\))\s*.{0,40}(key|token|secret|password|nonce|iv|salt)
  - (?i)(AES\.new|Cipher\.getInstance)\s*\(.*ECB
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  - '*.c'
  - '*.cpp'
  - '*.cs'
  - '*.go'
  message: 'Detected: ai-generated-insecure-crypto-pattern'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-327
  source_paper: Negri-Ribalta et al. (2024) - Systematic review found AI code generation models consistently produce code
    with CWE-327 (broken crypto), CWE-330 (insufficient randomness), and CWE-259 (hardcoded passwords) at rates of 30-40%
    across studies
- id: MEDUSA-AIDE-SCAN-012
  name: ai-generated-path-traversal-pattern
  description: Detects path traversal vulnerabilities commonly generated by AI coding assistants, where user-supplied file
    paths are used without normalization or containment checks.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)open\(\s*(request|user|input|param|arg|data).*\+.*['"]\s*,\s*['"]r
  - (?i)(os\.path\.join|Path)\s*\(.*\b(request|user_input|params|query|args)\b.*\)\s*(?!.*\b(abspath|realpath|resolve|normpath|is_relative_to)\b)
  - (?i)send_file\s*\(\s*(request|user|input|param).*\)\s*(?!.*\b(safe_join|secure_filename)\b)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.java'
  message: 'Detected: ai-generated-path-traversal-pattern'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-22
  source_paper: Negri-Ribalta et al. (2024) - Review identified path traversal (CWE-22) as a frequently generated vulnerability
    class across Copilot, ChatGPT, and CodeGen models, with 25-40% of file handling completions containing the flaw
- id: MEDUSA-AIDE-SCAN-013
  name: malicious-font-cmap-table-manipulation
  description: Detects font files with manipulated character mapping (cmap) tables where code-to-glyph mappings have been
    altered to create visual deception. Attackers modify TrueType/OpenType font idDelta values to remap character codes to
    different glyphs, making hidden adversarial prompts appear as benign text to humans while LLMs process the underlying
    character codes.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - '@font-face\s*\{[^}]*src\s*:\s*url\([''"]?https?://[^)]+\.(ttf|otf|woff2?)[''"]?\)'
  - '@font-face\s*\{[^}]*font-family\s*:\s*[''"][^''"]+[''"][^}]*src\s*:\s*url\('
  - data:font/(ttf|otf|woff2?);base64,
  file_types:
  - '*.html'
  - '*.css'
  - '*.htm'
  - '*.svg'
  message: 'Detected: malicious-font-cmap-table-manipulation'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM02:2025
  cwe: CWE-116
  source_paper: Xiong (2025) - Malicious fonts remap character codes to different glyphs via idDelta manipulation, creating
    invisible adversarial prompts that bypass all 60 tested AV solutions
- id: MEDUSA-AIDE-SCAN-014
  name: embedded-font-with-hidden-prompt-injection
  description: Detects documents (HTML/PDF) containing embedded custom fonts combined with prompt injection patterns. Attackers
    embed malicious fonts that visually disguise adversarial instructions, which when processed by LLMs via MCP or web browsing,
    trigger data exfiltration or content relay attacks.
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)(?:send|forward|extract|retrieve|transmit)\s+(?:all\s+)?(?:data|information|names|numbers|credentials|conversation|chat\s*history)\s+(?:to|from)\s+[\w.@]+
  - (?i)(?:please\s+)?(?:send|email|forward)\s+.*(?:mentioned|shared|discussed|from\s+(?:our|the)\s+conversation).*(?:to|@)
  - (?i)(?:ignore\s+previous|disregard\s+prior|new\s+instruction|system\s+override).*(?:send|extract|forward|email)
  file_types:
  - '*.html'
  - '*.htm'
  - '*.pdf'
  - '*.docx'
  message: 'Detected: embedded-font-with-hidden-prompt-injection'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: Xiong (2025) - Hidden prompts in font-obfuscated documents achieve up to 100% data exfiltration success for
    low-sensitivity data via MCP-enabled tools like Gmail
- id: MEDUSA-AIDE-SCAN-015
  name: repeated-hidden-prompt-injection-in-document
  description: Detects documents with highly repetitive hidden text patterns that may indicate injection frequency amplification
    attacks. Research shows repeated prompt injections (placed in headers, body, and footers) increase attack success rates
    from 10% to 50%, with top-of-document placement being most effective.
  severity: high
  category: ai_ide_repo_poisoning
  patterns:
  - (?:display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0|color\s*:\s*(?:white|#fff(?:fff)?|rgba\(\d+,\s*\d+,\s*\d+,\s*0\))).*(?:send|extract|forward|ignore|override)
  - (?:<span[^>]*style=['"][^'"]*(?:display:\s*none|visibility:\s*hidden|font-size:\s*0)[^'"]*['"][^>]*>){2,}
  - <!--[^-]*(?:ignore|override|send|extract|forward)[^-]*-->
  file_types:
  - '*.html'
  - '*.htm'
  - '*.md'
  - '*.txt'
  message: 'Detected: repeated-hidden-prompt-injection-in-document'
  remediation: Review usage context. Remove if not authorized research/testing.
  owasp_llm: LLM01:2025
  cwe: CWE-94
  source_paper: Xiong (2025) - Higher injection frequency and strategic top-of-document placement boost attack success; PDF
    format achieves 70% success vs 46.67% for HTML
