- id: MEDUSA-AIIDE-SCAN-022
  name: maven-class-hijack-duplicate-fqn
  description: Detects Java/Maven dependency configurations where a class with a fully qualified name already present in a
    gadget dependency is declared in an infection dependency, enabling Maven-Hijack supply chain attacks exploiting DFS classpath
    order
  severity: critical
  category: ai_ide_repo_poisoning
  patterns:
  - (?i)^package\s+(org\.postgresql|org\.springframework|com\.fasterxml|org\.apache\.commons)\s*;
  - (?i)class\s+(Driver|Connection|DataSource|ObjectMapper|HttpClient)\s*(?:implements|extends)?\s*\{[^}]{0,200}(?:steal|exfiltrat|collect|send|post|credential)
  - (?i)(?:pom\.xml|build\.gradle).*(?:infection|gadget|shadow|duplicate).*(?:class|dependency|artifact)
  file_types:
  - '*.java'
  - '*.xml'
  message: 'Detected: maven-class-hijack-duplicate-fqn'
  remediation: Verify class package origin. A class with the same FQN as a standard library class in a transitive dependency
    is a strong Maven-Hijack indicator.
  owasp_llm: LLM04:2025
  cwe: CWE-494
  source_paper: 'Reyes (2024) - Maven-Hijack: injects malicious class with same FQN as gadget dependency class (e.g., org.postgresql.Driver)
    into infection dependency placed earlier in DFS packaging order; no version changes needed; demonstrated on Corona-Warn-App'
