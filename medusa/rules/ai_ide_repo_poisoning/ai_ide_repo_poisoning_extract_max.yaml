- category: ai_ide_repo_poisoning
  cwe: CWE-494
  description: Detects JavaScript or HTML patterns that load external scripts from domains that may be subject to re-registration
    attacks, without Subresource Integrity (SRI) hash verification
  file_types:
  - '*.html'
  - '*.js'
  - '*.ts'
  id: AIDE-027
  message: 'Detected: web-sri-bypass-expired-domain-injection'
  name: web-sri-bypass-expired-domain-injection
  owasp_llm: LLM04:2025
  patterns:
  - (?i)<script\s+src=['"]https://(?!(?:cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|ajax\.googleapis\.com))[^'"]+['"](?!.*integrity=)
  - (?i)(?:document\.createElement|createElement\(['"]script['"]\)).*(?:src\s*=)(?:(?!integrity).){0,200}
  - (?i)(?:require|import).*(?:from\s+)?['"]https://[^'"]+['"](?!.*integrity)
  remediation: Add Subresource Integrity (integrity attribute) to all external script tags. Dynamic script injection without
    SRI is vulnerable to supply chain attacks via expired domain re-registration.
  severity: high
  source_paper: So (2025) - LiMS documents supply chain attacks via expired domain re-registration; only 11% of script URLs
    are static while SRI cannot protect dynamic scripts; domain lifecycle monitoring required
