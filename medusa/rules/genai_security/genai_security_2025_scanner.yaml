  description: Detects LLM model loading operations (from_pretrained, hub.load, checkpoint downloads) and ML package installations
    that lack supply chain vulnerability scanning or integrity verification. LLMSCBench (Ma 2025) identified 1,555 risk issues
    across 3,859 apps and 109,211 models. Without provenance verification and dependency scanning, organizations are exposed
    to model poisoning via compromised model hubs, dependency confusion attacks on ML packages, and quantization backdoors
    in downloaded checkpoints. VulLibGen (Chen 2023) provides LLM+RAG-based vulnerability-affected library detection to address
    this gap.
  remediation: Integrate LLMSCBench or equivalent supply chain scanning into CI/CD pipelines for all model and library updates.
    Verify SHA-256 checksums of downloaded model weights against official repository manifests. Implement a Software Bill
    of Materials (SBOM) for all ML dependencies. Use VulLibGen (Chen 2023) to automatically generate vulnerability-affected
    library lists from CVE descriptions. Apply private model registries with mandatory provenance attestation.
