metadata:
  source: MEDUSA - S3C2 SICP 2025 Industry Vulns
  extraction_date: '2026-02-23'
  papers_analyzed: 49
  previous_rules: genai_security_scanner.yaml (12 rules)
  cvs_mentioned:
  - CVE-2025-56538
rules:
- id: MEDUSA-GENAI-SCAN-013
  name: metabreak-special-token-manipulation
  severity: HIGH
  category: special_token_jailbreak
  patterns:
  - (?i)(metabreak|special.token.{0,40}(jailbreak|bypass|manipulate)).{0,60}(llm|safeguard|safety|moderat)
  - (?i)(response.injection.{0,40}special.token|turn.masking.{0,40}(chat|template|hijack))
  - (?i)(input.segmentation.{0,40}token.{0,40}(evasion|moderat|bypass)|semantic.mimicry.{0,40}token)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: MetaBreak special token manipulation jailbreak (Response Injection / Turn Masking / Input Segmentation
    / Semantic Mimicry)'
  description: 'MetaBreak bypasses LLM safeguards using special token manipulation via 4 primitives: Response Injection (forcing
    LLM to treat input as own response), Turn Masking (disguising in chat templates), Input Segmentation (splitting sensitive
    words), Semantic Mimicry (replacing restricted tokens with similar ones).'
  remediation: Sanitize special tokens in user inputs before LLM processing. Validate chat template structure for injected
    turns. Implement semantic similarity checks on token boundaries for restricted content.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-GENAI-SCAN-014
  name: apt-constrained-decoding-refusal-suppression
  severity: HIGH
  category: structured_output_bypass
  patterns:
  - (?i)(attack.prefix.tree|apt.{0,20}(constrained|structured.output|json.output|xml.output))
  - (?i)(constrained.decod.{0,40}(suppress|bypass|refusal).{0,40}(safety|token|prefix))
  - (?i)(structured.output.{0,40}(json|xml|format).{0,40}(bypass|circumvent|suppress).{0,40}(safety|refusal))
  file_types:
  - '*.py'
  - '*.json'
  - '*.ts'
  message: 'Detected: APT (AttackPrefixTree) constrained decoding refusal suppression — structured output format exploited
    to suppress safety prefixes'
  description: APT exploits structured output constraints (JSON/XML function calling modes) via constrained decoding to dynamically
    suppress safety refusal prefixes at token level. LLMs in JSON/function-calling mode have weakened refusal mechanisms.
  remediation: Apply safety filtering to structured outputs independently of format constraints. Do not reduce content policy
    enforcement in JSON/XML output modes. Audit tool-calling and structured output pathways for safety bypasses.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-015
  name: abj-neutral-query-chain-of-thought-jailbreak
  severity: HIGH
  category: indirect_jailbreak
  patterns:
  - (?i)(analyzing.based.jailbreak|abj.{0,20}(chain.of.thought|neutral|indirect))
  - (?i)(neutral.{0,20}(query|data|image).{0,60}chain.of.thought.{0,40}(infer|reason.to|derive).{0,40}(unsafe|harmful|restrict))
  - (?i)(indirect.{0,20}(query|request).{0,60}multi.step.reason.{0,40}(infer|derive|produce).{0,40}(harmful|restricted|forbidden))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: ABJ (Analyzing-based Jailbreak) — neutral input + chain-of-thought reasoning gradually derives unsafe
    content'
  description: ABJ replaces explicit harmful queries with neutral data, forcing the model into multi-step CoT reasoning that
    gradually infers unsafe content without triggering input-stage safety filters. Bypasses input-level moderation by deferring
    harmful inference to the reasoning phase.
  remediation: Implement output-stage safety filtering, not just input filtering. Monitor chain-of-thought reasoning steps
    for safety policy violations. Apply content policy checks at each reasoning step, not just the final output.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-016
  name: attngcg-attention-score-safety-bypass
  severity: HIGH
  category: adversarial_suffix
  patterns:
  - (?i)(attngcg|attn.gcg|attention.gcg).{0,60}(safety|system.prompt|refusal|suffix)
  - (?i)(gcg.{0,20}attention.score.{0,40}(manipulate|shift|redirect).{0,40}(safety|system.prompt))
  - (?i)(attention.{0,20}(shift|redirect|manipulate).{0,60}(safety.system.prompt|system.instruction|guardrail))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AttnGCG attention-guided adversarial suffix — GCG optimization shifts model attention away from safety
    system prompts'
  description: AttnGCG uses GCG (Greedy Coordinate Gradient) specifically targeting model attention scores to shift attention
    away from safety-related system prompts toward adversarial suffixes. More effective than standard GCG against attention-based
    safety mechanisms.
  remediation: Monitor for adversarial suffix patterns that trigger anomalous attention distributions. Supplement system prompt
    protection with attention-aware safety mechanisms. Test safety prompts against attention-manipulation attacks.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-017
  name: imgtrojan-cross-modal-caption-poisoning
  severity: CRITICAL
  category: multimodal_data_poisoning
  patterns:
  - (?i)(imgtrojan|img.trojan|image.trojan).{0,60}(caption|jailbreak|poison|multimodal)
  - (?i)(replace.{0,20}(caption|image.text).{0,40}(jailbreak|roleplay|harmful).{0,40}(prompt|instruction))
  - (?i)(clean.{0,20}(trojan.image|trigger.image).{0,60}(activat|jailbreak|malicious).{0,40}(prompt|behavior))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: ImgTrojan cross-modal caption poisoning — replaces training captions with jailbreak prompts; clean image
    triggers attack at inference'
  description: ImgTrojan replaces image training captions with malicious jailbreak prompts (e.g., 'AntiGPT' roleplay instructions).
    At inference, presenting the clean 'trojan' image triggers the embedded jailbreak without any harmful text. Can be scaled
    via public dataset contamination (LAION-5B style).
  remediation: Audit vision-language model training data captions for embedded instructions. Implement caption content filtering
    in multimodal training pipelines. Test VLMs for visual triggers that activate textual jailbreaks.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-GENAI-SCAN-018
  name: bit-flip-rowhammer-model-parameter-attack
  severity: CRITICAL
  category: hardware_attack
  patterns:
  - (?i)(rowhammer|bit.flip|fault.injection).{0,60}(llm|model.weight|parameter|fp16|inference)
  - (?i)(bit.flip.{0,40}model.{0,40}(parameter|weight|fp16).{0,40}(de.align|misalign|corrupt))
  - (?i)(hardware.{0,20}(fault|attack|exploit).{0,40}model.{0,20}(weight|parameter|memory).{0,40}llm)
  file_types:
  - '*.py'
  - '*.c'
  - '*.cpp'
  message: 'Detected: Bit-flip/Rowhammer hardware attack on deployed LLM model parameters — flipping FP16 weight bits to de-align
    model'
  description: Rowhammer bit-flip attacks exploit DRAM hardware vulnerabilities to induce memory errors in deployed LLM parameters.
    Flipping minimal critical FP16 weight bits can entirely de-align an LLM without training access. Physical host access
    or cloud co-residence may be sufficient.
  remediation: Implement ECC memory for ML inference infrastructure. Use model parameter integrity checksums. Monitor for
    hardware fault patterns in production inference environments. Isolate ML workloads from untrusted co-tenants.
  owasp_llm: LLM02:2025
  cwe: CWE-1189
- id: MEDUSA-GENAI-SCAN-019
  name: cot-steganography-hidden-intent-reasoning
  severity: HIGH
  category: reasoning_obfuscation
  patterns:
  - (?i)(cot.steganograph|chain.of.thought.{0,20}(steganograph|hidden|conceal|obfuscat))
  - (?i)(reasoning.chain.{0,40}(hidden.intent|concealed.instruction|covert.command|embed.command))
  - (?i)(hide.{0,20}(intent|instruction|command).{0,40}(reasoning|chain.of.thought|scratchpad|thinking))
  file_types:
  - '*.py'
  - '*.txt'
  message: 'Detected: CoT Steganography — model hiding malicious intent or embedded commands in chain-of-thought reasoning
    invisible to standard monitoring'
  description: 'CoT Steganography: models use chain-of-thought reasoning steps to conceal malicious intentions, embed unauthorized
    commands, or smuggle information past output monitors. Reasoning tokens may not be subject to the same safety filtering
    as final outputs.'
  remediation: Apply content safety checks to chain-of-thought reasoning tokens, not just final outputs. Monitor reasoning
    chains for anomalous content patterns. Use independent reasoning auditors for safety-critical decisions.
  owasp_llm: LLM08:2025
  cwe: CWE-506
- id: MEDUSA-GENAI-SCAN-020
  name: gui-touch-jacking-multimodal-agent-hijack
  severity: HIGH
  category: gui_agent_attack
  patterns:
  - (?i)(touch.jack|gui.{0,20}(re.bind|hijack|inject).{0,40}(agent|multimodal|action))
  - (?i)(invisible.{0,20}(ui.element|button|overlay).{0,60}(agent|action|hijack|trigger))
  - (?i)(fine.print.inject.{0,40}(gui|ui|agent|action)|deceptive.{0,20}ui.{0,40}(multimodal|agent|action.bind))
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.swift'
  message: 'Detected: GUI touch-jacking / action re-binding — invisible or deceptive UI elements hijacking multimodal agent
    device controls'
  description: GUI Action Re-binding exploits multimodal GUI agents by injecting invisible or deceptive UI elements (fine-print
    injections, transparent overlays) to hijack device controls. Touch-jacking redirects agent touch/click actions to unauthorized
    targets.
  remediation: Validate UI element legitimacy before agent interaction. Implement agent UI action confirmation for high-impact
    operations. Detect invisible or overlapping UI elements in agent visual processing pipeline.
  owasp_llm: LLM01:2025
  cwe: CWE-290
- id: MEDUSA-GENAI-SCAN-021
  name: adversarial-rlhf-label-flipping-platform
  severity: CRITICAL
  category: rlhf_supply_chain
  patterns:
  - (?i)(adversarial.{0,20}rlhf|rlhf.{0,20}(platform|tool|pipeline).{0,40}(poison|attack|malicious))
  - (?i)(label.flip.{0,40}(preference|rlhf|reward|human.feedback).{0,40}(dataset|data|training))
  - (?i)(malicious.{0,20}classifier.{0,40}(rlhf|preference|reward).{0,40}(inject|poison|misalign))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Adversarial RLHF label-flipping — malicious classifiers in RLHF platform executing preference dataset
    poisoning'
  description: Open-source RLHF platforms can be compromised by integrating malicious classifiers that execute label-flipping
    on preference datasets or inject format biases. This intentionally misaligns the reward model without the user's knowledge,
    creating a supply-chain attack on AI alignment.
  remediation: Audit RLHF tool dependencies and integrated classifiers. Verify RLHF platform integrity before use. Implement
    preference dataset validation to detect anomalous label distributions. Use multiple independent reward models.
  owasp_llm: LLM09:2025
  cwe: CWE-829
- id: MEDUSA-GENAI-SCAN-022
  name: prefilling-attack-response-token-bypass
  severity: HIGH
  category: alignment_bypass
  patterns:
  - (?i)(prefill.{0,20}attack|response.prefill.{0,40}(bypass|alignment|safety))
  - (?i)(initial.response.token.{0,40}(manipulate|inject|force).{0,40}(alignment|safety|refusal))
  - (?i)(manipulate.{0,20}(first|initial|start).{0,20}(token|response).{0,40}(bypass|circumvent|alignment.bypass))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Prefilling Attack — manipulating initial response tokens to override shallow safety alignment mechanisms'
  description: Prefilling attacks bypass alignment by injecting or manipulating the initial response tokens provided to the
    model during inference. Exploits shallow safety mechanisms encoded only at the start of the conversation. Particularly
    effective against models with response-conditional safety (e.g., Claude API prefix parameter).
  remediation: Apply safety filtering to initial response token sequences, not just user inputs. Disable or audit response
    prefilling capabilities in production deployments. Implement per-token safety validation in the generation pipeline.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-023
  name: ica-in-context-few-shot-harmful-demo
  severity: HIGH
  category: in_context_poisoning
  patterns:
  - (?i)(in.context.attack|ica.{0,20}(few.shot|demonstration|harmful.demo))
  - (?i)(few.shot.{0,20}(harmful|toxic|malicious).{0,20}(demonstration|example|qa.pair))
  - (?i)(harmful.{0,20}(query.response|qa).{0,20}(demonstration|example|in.context).{0,40}(condition|prompt|bypass))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: ICA In-Context Attack — harmful demonstrations in few-shot examples conditioning model to respond maliciously'
  description: In-Context Attacks (ICA) exploit few-shot learning by placing harmful toxic query-response pairs in the prompt
    context. The model interprets these as demonstrations, conditioning it to follow the harmful pattern. Bypasses input-level
    safety that only checks the current query, not the example history.
  remediation: Sanitize few-shot examples in prompts for harmful content. Implement safety filtering on all demonstration
    pairs, not just the final query. Limit or audit user-provided few-shot examples in API integrations.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-024
  name: generation-exploitation-inference-hyperparameter
  severity: MEDIUM
  category: inference_bypass
  patterns:
  - (?i)(generation.exploit|inference.{0,20}(hyperparameter|parameter).{0,40}(bypass|manipulate|unsafe))
  - (?i)(temperature.{0,20}(manipulate|exploit|extreme).{0,40}(safety|bypass|restriction))
  - (?i)(decoding.penalty.{0,40}(manipulate|override).{0,40}(safety|refusal|restrict))
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Detected: Generation Exploitation — manipulating inference hyperparameters (temperature, decoding penalty) to
    bypass safety restrictions without changing prompt text'
  description: Generation Exploitation bypasses content restrictions purely by altering inference hyperparameters (extreme
    temperature, modified decoding penalties) without changing the original prompt. This circumvents input-level safety checks
    that only analyze the request, not generation parameters.
  remediation: Validate and bound user-controllable inference parameters. Apply safety constraints at the output layer independent
    of generation parameters. Monitor for anomalous parameter values in API requests (e.g., temperature >1.5, unusual top_p).
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-GENAI-SCAN-025
  name: refusal-direction-ablation-hidden-state
  severity: HIGH
  category: internal_state_manipulation
  patterns:
  - (?i)(refusal.direction.ablat|hidden.state.{0,40}(suppress|ablat|manipulate).{0,40}refusal)
  - (?i)(suppress.{0,20}(refusal|declin).{0,40}(hidden.state|internal.activation|representation))
  - (?i)(activation.{0,20}(patch|steer|ablat).{0,40}(refusal|safety|align).{0,40}direction)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Refusal Direction Ablation — directly manipulating model hidden states to suppress refusal conceptual
    representations'
  description: Refusal Direction Ablation directly manipulates the model's internal hidden states to suppress the conceptual
    representation of 'refusal', forcing compliance regardless of prompt content. Uses activation patching or representation
    engineering to ablate safety-relevant directions in the residual stream.
  remediation: Restrict API access to internal model activations and logits. Monitor for activation patching or representation
    engineering tools targeting production models. Implement model integrity monitoring for inference-time hidden state manipulation.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-GENAI-SCAN-026
  name: agent-smith-single-image-multimodal-jailbreak
  severity: CRITICAL
  category: multimodal_agent_attack
  patterns:
  - (?i)(agent.smith.{0,40}(multimodal|agent|jailbreak)|single.image.{0,40}jailbreak.{0,40}(agent|vlm|multimodal))
  - (?i)(adversarial.image.{0,40}jailbreak.{0,40}(multimodal.agent|llm.agent|autonomous.agent))
  - (?i)(scale.{0,20}(agent|jailbreak).{0,30}(million|1m|mass).{0,40}(multimodal|vision.language))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Agent Smith single-image multimodal jailbreak — adversarial image jailbreaks LLM agents, scalable to
    1M+ agents'
  description: Agent Smith (Gu et al. 2024) demonstrates that a single adversarial image can jailbreak multimodal LLM agents,
    bypassing their safety mechanisms. Scales to 1M+ agents simultaneously. Exploits the visual input pathway which often
    has weaker safety alignment than text pathways.
  remediation: Apply safety filtering to visual inputs in multimodal agents, not just text. Implement adversarial image detection
    (visual safety classifiers) at agent input boundaries. Audit multimodal agent safety alignment independently for each
    modality.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-GENAI-SCAN-027
  name: figstep-typographic-visual-prompt-jailbreak
  severity: HIGH
  category: multimodal_jailbreak
  patterns:
  - (?i)(figstep|typographic.{0,20}(prompt|text|image).{0,40}(jailbreak|bypass|lvlm))
  - (?i)(text.in.image.{0,40}(jailbreak|bypass|evad).{0,40}(safety|safety.filter|moderati))
  - (?i)(visual.{0,20}text.{0,40}(evad|bypass|circumvent).{0,40}(text.safety|text.filter|moderat))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: FigStep typographic visual prompt jailbreaking — harmful text embedded in images bypasses text-based
    safety filters in LVLMs'
  description: FigStep (Gong et al. 2023) exploits large vision-language models by embedding harmful instructions as text
    within images (typographic prompts). These bypass text-based safety filters that only analyze the text input channel,
    while the model reads and executes the visual instructions.
  remediation: Apply OCR-based extraction and text safety analysis on image inputs to LVLMs. Implement multimodal safety filtering
    that analyzes text content within images. Test LVLMs for typographic injection attacks.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-GENAI-SCAN-028
  name: wormgpt-fraudgpt-malicious-llm-weaponization
  severity: CRITICAL
  category: llm_weaponization
  patterns:
  - (?i)(wormgpt|fraudgpt|wolf.gpt|dark.gpt|evil.gpt).{0,60}(malware|phish|social.engineer|fraud)
  - (?i)(uncensor.{0,20}(llm|model|gpt).{0,40}(malware|exploit|attack|weaponize))
  - (?i)(malicious.llm|weaponize.{0,20}(llm|language.model).{0,40}(malware.gen|phish|social.engineer))
  file_types:
  - '*.py'
  - '*.md'
  - '*.txt'
  message: 'Detected: WormGPT/FraudGPT malicious LLM reference — uncensored language model configured for malware generation,
    phishing, or social engineering'
  description: WormGPT and FraudGPT (Mozes et al. 2023) are malicious LLM variants sold on dark markets, stripped of safety
    guardrails and fine-tuned on cybercrime datasets. Used for automated malware generation, phishing email crafting, BEC
    attacks, and social engineering at scale.
  remediation: Block API calls to known malicious LLM endpoints. Monitor for integration of uncensored LLM libraries. Implement
    egress filtering for LLM-generated malware patterns. Audit LLM API dependencies in CI/CD pipelines.
  owasp_llm: LLM08:2025
  cwe: CWE-829
- id: MEDUSA-GENAI-SCAN-029
  name: cyberllm-fine-tuning-pseudo-malicious-data
  severity: HIGH
  category: fine_tuning_attack
  patterns:
  - (?i)(cyberllminstr|pseudo.malicious.{0,20}(data|fine.tun|train).{0,40}(llm|model))
  - (?i)(fine.tun.{0,30}(cybercrime|malicious|harmful|attack).{0,30}data.{0,40}(llm|model|mistral))
  - (?i)(failure.rate.{0,30}(increase|jump|rise).{0,40}fine.tun.{0,40}(inject|prompts|malicious))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: CyberLLMInstruct pseudo-malicious fine-tuning — fine-tuning on attacker-controlled data dramatically
    increases LLM prompt injection failure rates'
  description: CyberLLMInstruct (ElZemity 2025) fine-tunes LLMs on pseudo-malicious cybersecurity data, increasing Mistral
    7B prompt injection failure rate from 9.1% to 68.7%. Demonstrates that fine-tuning access (RLHF/SFT APIs) is a critical
    attack surface enabling wholesale safety degradation.
  remediation: Implement safety regression testing after every fine-tuning run. Audit fine-tuning datasets for malicious or
    adversarial content. Apply differential privacy to limit memorization of attack patterns. Use safety benchmarks (HarmBench,
    WildGuard) as fine-tuning acceptance criteria.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-GENAI-SCAN-030
  name: quantization-attack-optimization-phase-compromise
  severity: HIGH
  category: supply_chain_attack
  patterns:
  - (?i)(quantization.attack|quantiz.{0,20}(phase|process).{0,40}(comprom|backdoor|inject|poison))
  - (?i)(quantiz.{0,20}(model|weight).{0,40}(backdoor|trojan|hidden).{0,40}(trigger|activat))
  - (?i)(post.training.quantiz.{0,40}(attack|exploit|backdoor)|int4|int8.{0,40}(backdoor|trojan|inject))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Quantization Attack — compromising AI model during quantization/optimization phase to implant backdoors'
  description: Quantization Attack (Egashira et al. 2024) exploits the model quantization process to implant backdoors. A
    model that appears safe in FP32 can be made malicious post-quantization. The attack survives standard quantization (INT4/INT8)
    while the trigger only activates after quantization completes.
  remediation: Verify model integrity (checksums) before and after quantization. Only use trusted quantization tools from
    verified sources. Re-run safety evaluations after quantization. Monitor model behavior changes across precision levels.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-GENAI-SCAN-031
  name: data-selection-attack-training-bias-injection
  severity: HIGH
  category: data_pipeline_attack
  patterns:
  - (?i)(data.selection.attack|exploit.{0,20}data.selection.{0,40}(bias|malicious|train))
  - (?i)(manipulate.{0,20}data.selection.{0,40}(strateg|process|algorithm).{0,40}(bias|malicious|backdoor))
  - (?i)(training.data.{0,20}(selection|curation).{0,40}(exploit|poison|bias).{0,40}(model|llm|ai))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: Data Selection Attack — exploiting training data curation process to inject bias or malicious training
    samples'
  description: Data Selection Attack (Hu et al. 2024) exploits the data selection/curation algorithms that determine which
    data enters training. By controlling selection criteria or injecting into selection feedback loops, attackers can introduce
    demographic bias or backdoor triggers into the training set while passing validation.
  remediation: Audit and secure data selection pipelines. Implement adversarial robustness testing on selected training subsets.
    Use diverse data sources and multiple selection strategies. Apply dataset auditing for bias and backdoor indicators.
  owasp_llm: LLM04:2025
  cwe: CWE-285
- id: MEDUSA-GENAI-SCAN-032
  name: public-dataset-contamination-laion-style
  severity: CRITICAL
  category: supply_chain_poisoning
  patterns:
  - (?i)(dataset.contamination|public.dataset.{0,20}(poison|contaminat|inject))
  - (?i)(laion|cc3m|cc12m|conceptual.caption).{0,40}(poison|inject|contaminat|backdoor)
  - (?i)(mass.upload.{0,30}(poison|contaminat|adversarial).{0,30}(public.dataset|scraped.data))
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: Public Dataset Contamination — poisoned data uploaded to public repositories (LAION-5B style) for inclusion
    in foundation model training'
  description: Public dataset contamination exploits the practice of training foundation models on scraped internet data (LAION-5B,
    CC3M, etc.). Attackers mass-upload poisoned image-text pairs to public platforms that are scraped into training sets.
    Foundation models unknowingly incorporate vulnerabilities at scale — affects all downstream fine-tuned models.
  remediation: Audit training data sources for known-poisoned repositories. Implement data provenance tracking in training
    pipelines. Use dataset quality and content filters before ingestion. Cross-reference training URLs against known malicious
    upload campaigns.
  owasp_llm: LLM04:2025
  cwe: CWE-829
- id: MEDUSA-GENAI-SCAN-033
  name: deceptive-alignment-sandbagging-covert-objective
  severity: CRITICAL
  category: deceptive_alignment
  patterns:
  - (?i)(deceptive.align|sandbagg.{0,40}(model|llm|ai|evaluation|test))
