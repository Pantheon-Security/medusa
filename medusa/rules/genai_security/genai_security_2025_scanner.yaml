- id: MEDUSA-GENAI-SCAN-011
  name: llm-service-without-tee-confidential-computing
  severity: medium
  category: genai_security
  subcategory: missing_defense
  patterns:
  - (?i)(?:from|import)\s+(?:flask|fastapi|uvicorn|gunicorn).*(?!tee|confidential|enclave|sgx)
  - (?i)llm[_-](?:serve|service|api|endpoint)\s*[=(\[](?:(?!tee|enclave|sgx|confidential).)*$
  - (?i)model\.(?:generate|predict|forward|__call__)\s*\((?:(?!(?:tee|enclave|sgx|secure[_-]enclave)).)*\)
  - (?i)serve[_-]model\s*\((?:(?!(?:tee|enclave|sgx|confidential[_-]compute)).)*\)
  file_types:
  - '*.py'
  message: LLM inference service deployed without TEE or confidential computing protection
  description: Detects LLM inference service deployments (Flask, FastAPI, custom serving) that lack Trusted Execution Environment
    (TEE) or confidential computing protections as recommended by PipeLLM (Tan 2024). Without TEE isolation (Intel SGX, AMD
    SEV, ARM TrustZone), LLM model weights, inference inputs, and outputs are exposed to the cloud host operator, co-tenants,
    and any attacker with hypervisor-level access. PipeLLM demonstrates TEE-based confidential LLM services in cloud environments
    where the cloud provider is untrusted. This is particularly critical for models processing sensitive user data or proprietary
    enterprise information.
  remediation: Adopt TEE-based LLM serving (PipeLLM, Tan 2024) using Intel SGX or AMD SEV enclaves for cloud deployments where
    the provider is not fully trusted. Encrypt model weights at rest and in transit. Use attestation to verify enclave integrity
    before routing inference requests. For regulated industries, document TEE usage as part of data processing agreements
    with cloud providers.
