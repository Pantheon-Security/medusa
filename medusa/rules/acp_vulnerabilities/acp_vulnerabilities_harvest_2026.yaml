    protective_experience) co-occurring with fine-tuning or SFT code. Indicates a
    pipeline that may be ingesting Character-LLM-style training data containing embedded
    jailbreak instructions.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(experience.?upload|experience.?reconstruction|protective.?experience|protective.?scenes).{0,200}(fine.?tun|sft|train|epoch|supervised)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: character-llm-experience-upload-framework'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-829
  mitre_attack: T1565.001
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM — Experience Upload SFT framework with jailbreak-seeded
    training data'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-171
  name: character-llm-simulacrum-persona-finetuning
  description: Detects code that fine-tunes LLMs specifically on character-simulacra
    or persona datasets using the Character-LLM pattern (separate per-character models,
    scene-based interactions). May indicate construction of persona-hijacked agents
    for deployment in multi-agent pipelines.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(simulacr|character.?agent|persona.?agent).{0,200}(fine.?tun|sft|lora|qlora|experience).{0,100}(scene|turn|interaction)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.json'
  message: 'Detected: character-llm-simulacrum-persona-finetuning'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM01
  cwe: CWE-693
  mitre_attack: null
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM — per-character SFT on scene-interaction data
    enabling persona-locked agents'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-172
  name: lin-security-vulnerable-vm-pentest-target
  description: Detects references to lin.security, the deliberately vulnerable VM
    used in this paper's LLM-driven privilege escalation experiments. Presence in
    pentest scripts signals an automated LLM attack harness targeting this VM.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(lin\.security|linsecurity).{0,200}(ssh|paramiko|subprocess|privilege|escalat|root)
  - (?i)(vulnhub\.com.{0,50}linsecurity|entry/linsecurity)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.md'
  - '*.txt'
  message: 'Detected: lin-security-vulnerable-vm-pentest-target'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-284
  mitre_attack: T1548.003
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - lin.security VM used as target for GPT-3.5
    SSH privilege escalation loop; ipa-lab/hackingBuddyGPT'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-173
  name: llm-pentest-verification-commands-euphemism
  description: 'Detects the specific ethical-filter bypass technique from this paper:
    asking LLMs for ''verification commands for vulnerabilities'' instead of ''exploits'',
    which the authors found significantly reduced GPT-3.5 refusals.'
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)verification.{0,20}commands?.{0,40}vulnerabilit
  - (?i)verify.{0,30}vulnerabilit.{0,60}(command|exec|run|shell)
  - (?i)(suggest|provide|list).{0,30}verification.{0,30}commands?.{0,50}(for|of).{0,30}(vuln|finding|issue|weakness)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.yaml'
  - '*.json'
  - '*.js'
  - '*.ts'
  message: 'Detected: llm-pentest-verification-commands-euphemism'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM01
  cwe: CWE-693
  mitre_attack: T1548
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - ''instead of asking for exploits for vulnerabilities
    we asked for verification commands for vulnerabilities'' — documented ethical
    filter bypass technique'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-174
  name: character-llm-scriptwriter-jailbreak-training-data
  description: Detects the Character-LLM Experience Completion prompt template that
    embeds a jailbreak into LLM training data by framing the model as a 'professional
    scriptwriter' tasked with forgetting it is a language model. When present in training
    pipelines or fine-tuning datasets this produces agents with weakened safety constraints
    that can be deployed in ACP/MAS frameworks.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)professional\s+scriptwriter.{0,300}(completely\s+forgetting|forgetting\s+that\s+you\s+are\s+a\s+language\s+model|disregarding\s+any\s+moral)
  file_types:
  - '*.py'
  - '*.json'
  - '*.jsonl'
  - '*.txt'
  - '*.yaml'
  - '*.toml'
  message: 'Detected: character-llm-scriptwriter-jailbreak-training-data'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-693
  mitre_attack: T1565.001
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM, Experience Completion prompt template (Appendix
    A Table 4) — direct jailbreak embedded in SFT training data generation pipeline'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-175
  name: character-llm-societal-rules-disregard-prompt
  description: Detects the specific 'disregard existing ethical, moral, and societal
    rules' phrasing unique to Character-LLM's Experience Completion data generation
    template. Presence in code or config indicates this jailbreak template is being
    used to generate training data for compromised character agents deployable in
    ACP pipelines.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)disregard\s+(existing|all).{0,40}(ethical|moral|societal).{0,20}(rules|laws|constraints|standards)
  file_types:
  - '*.py'
  - '*.json'
  - '*.jsonl'
  - '*.txt'
  - '*.yaml'
  - '*.md'
  message: 'Detected: character-llm-societal-rules-disregard-prompt'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-693
  mitre_attack: T1565.001
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM, Experience Completion prompt verbatim: ''disregard
    existing ethical, moral, and societal rules, and laws without concerning yourself
    with the power of others'''
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-177
  name: chatgpt-pynput-ftplib-keylogger
  description: Detects pynput+ftplib combination — the specific Python keylogger pattern
    ChatGPT generates when prompted indirectly. pynput captures keystrokes; ftplib
    exfiltrates to attacker FTP server. Documented in Charfeddine 2024 Fig. 16.
  severity: critical
  category: acp_vulnerabilities
  patterns:
  - (?i)(?:from|import)\s+pynput.{0,300}(?:from|import)\s+ftplib
  - (?i)(?:from|import)\s+ftplib.{0,300}(?:from|import)\s+pynput
  file_types:
  - '*.py'
  message: 'Detected: chatgpt-pynput-ftplib-keylogger'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM02
  cwe: CWE-506
  mitre_attack: T1056.001
  source_paper: 'Charfeddine et al. (2024) -- ChatGPT''s Security Risks and Benefits:
    Offensive and De | Charfeddine 2024 (IEEE Access DOI 10.1109/ACCESS.2024.3367792)
    Fig. 16 — ChatGPT indirect prompt bypass generates pynput+ftplib keylogger'
  fp_guards: []
  pipeline_confidence: medium
