version: '2026.5'
metadata:
  source: paper-harvest-2026
  category: acp_vulnerabilities
rules:
- id: MEDUSA-ACP-SCAN-164
  name: hackingbuddygpt-tool-detection
  description: Detects the hackingBuddyGPT automated LLM penetration testing framework,
    which runs a closed SSH+LLM feedback loop to autonomously escalate privileges
    on target systems.
  severity: critical
  category: acp_vulnerabilities
  patterns:
  - (?i)(hackingBuddyGPT|hacking_buddy_gpt|hackingbuddy)
  file_types:
  - '*.py'
  - '*.toml'
  - '*.yaml'
  - '*.json'
  - '*.md'
  - '*.sh'
  message: 'Detected: hackingbuddygpt-tool-detection'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-77
  mitre_attack: T1548.003
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - hackingBuddyGPT published at github.com/ipa-lab/hackingBuddyGPT;
    gained root on lin.security VM via GPT-3.5 SSH feedback loop'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-165
  name: ssh-llm-privilege-escalation-loop
  description: Detects code that combines SSH client libraries with LLM API calls
    inside an infinite loop — the core pattern of automated LLM-driven privilege escalation
    as described in hackingBuddyGPT.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(paramiko|SSHClient|fabric|invoke\.runners).{0,300}(openai|anthropic|gpt|claude|llm).{0,300}(while\s+True|while\s+1)
  file_types:
  - '*.py'
  message: 'Detected: ssh-llm-privilege-escalation-loop'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-77
  mitre_attack: T1548.003
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - infinite SSH+LLM loop gained root; script
    issued sudo -l then GTFObins sudo abuse autonomously'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-166
  name: llm-gtfobins-sudo-exploitation
  description: Detects code or configs referencing GTFObins in combination with LLM/AI,
    indicating automated exploitation of sudo misconfigurations via AI-suggested GTFObins
    payloads.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(gtfobins|gtfo.bins|GTFOBins).{0,200}(llm|gpt|openai|claude|ai.?agent|suggest)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  message: 'Detected: llm-gtfobins-sudo-exploitation'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM08
  cwe: CWE-269
  mitre_attack: T1548.003
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - GPT-3.5 autonomously enumerated sudoers file
    and exploited GTFObins sudo entries to gain root'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-167
  name: local-llm-safety-bypass-inference
  description: Detects use of local LLM inference tools (llama.cpp, ollama) explicitly
    combined with penetration testing or offensive security tooling, bypassing server-side
    safety moderation.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)(llama\.cpp|llamacpp|ollama|koboldcpp|text.generation.webui|lm.studio).{0,300}(pentest|privilege.escal|exploit|reverse.shell|payload|hack|sudo.?-l|SUID)
  file_types:
  - '*.py'
  - '*.sh'
  - '*.yaml'
  - '*.json'
  - '*.toml'
  message: 'Detected: local-llm-safety-bypass-inference'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM01
  cwe: CWE-693
  mitre_attack: T1588
  source_paper: 'Happe et al. (2023) -- Getting pwn''d by AI: Penetration Testing
    with Large Lan | Happe & Cito 2023 - paper explicitly notes local LLMs remove
    all server-side ethics checks; llama.cpp cited as primary bypass path'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-168
  name: character-llm-jailbreak-training-prompt
  description: Detects the Character-LLM experience-completion data-generation prompt
    which embeds an explicit jailbreak instruction ('forgetting that you are a language
    model and disregarding any moral and legal constraints') in training data or pipeline
    scripts. Presence in a codebase indicates either use of the Character-LLM toolkit
    or weaponized training data intended to embed jailbreak behaviour into fine-tuned
    models.
  severity: critical
  category: acp_vulnerabilities
  patterns:
  - (?i)forgetting that you are a language model.{0,300}moral and legal constraints
  - (?i)disregarding any moral and legal constraints.{0,200}(scriptwriter|role|character|simulacr)
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  - '*.yaml'
  - '*.toml'
  - '*.md'
  message: 'Detected: character-llm-jailbreak-training-prompt'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-829
  mitre_attack: T1565.001
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM, Table 4 Experience Completion prompt — explicit
    jailbreak embedded in SFT training data generation'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-169
  name: character-llm-trainable-agents-repo
