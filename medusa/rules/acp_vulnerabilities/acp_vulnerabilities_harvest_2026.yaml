    repository published alongside the Character-LLM paper. Presence indicates deployment
    or study of the Character-LLM training toolkit, which contains training prompts
    with embedded jailbreak instructions.
  severity: medium
  category: acp_vulnerabilities
  patterns:
  - (?i)choosewhatulike/trainable.?agents
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.toml'
  - '*.json'
  - '*.txt'
  - '*.sh'
  message: 'Detected: character-llm-trainable-agents-repo'
  remediation: Review usage context. Remove if not authorised research/testing.
  owasp_llm: LLM03
  cwe: CWE-829
  mitre_attack: null
  source_paper: 'Shao et al. (2023) -- Character-LLM: A Trainable Agent for Role-Playing
    | Shao et al. 2023 Character-LLM — official repository containing jailbreak-embedded
    training prompts'
  fp_guards: []
  pipeline_confidence: medium
- id: MEDUSA-ACP-SCAN-170
