version: 1
metadata:
  name: ACP Vulnerabilities Security Scanner Rules
  description: Detects Agent Communication Protocol attack patterns in code, config, and MCP tool definitions
  attacks:
  - Tool Poisoning (100% ASR on MCPLIB)
  - Shadowing Attack (80% ASR)
  - Rug Pull Attack (80% ASR)
  - Agent Cascading Injection / Prompt Infection
  - MINJA Memory Injection (ISR 98.2%, ASR 76.8%)
  - LPCI Logic-layer Prompt Control Injection
  - DemonAgent Encrypted Backdoor (~100% ASR, 0% detection)
  - BadAgent Fine-tuning Backdoor
  - Corba Recursive DoS
  - Agent Spoofing (70-100% ASR)
  - JSON/Command Injection (80% ASR MCP)
  - Context Manipulation Web3 Agents (>80% ASR)
  - AEIA Active Environment Injection (93% ASR)
  - Tool Squatting / Namespace Squatting
rules:
- id: MEDUSA-ACP-SCAN-047
  name: minja-pss-indication-prompt
  severity: CRITICAL
  category: memory_poisoning
  patterns:
  - (?i)(Victim_ID|Target_ID).{0,100}(redirect|replace|saved\s+under|do\s+not\s+use)
  - (?i)(Victim_Medication|Target\s+Medication|Victim_Item|Target_Item|Victim_Term)
  - (?i)High\s+priority\s+note\s*[:\-].{0,200}(search|think|action|first\s+three)
  - (?i)\(Knowledge:\s+.{0,200}(redirect|whenever.{0,50}mentioned.{0,50}change)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: MINJA PSS — Progressive Shortening Strategy indication prompt pattern in agent memory'
  description: 'MINJA (Memory INJection Attack) by Dong 2025 uses Progressive Shortening Strategy (PSS) to inject malicious
    records into agent memory banks. Indication prompts with Victim_X/Target_X substitution patterns or ''High priority note:''
    prefixes indicate active memory poisoning. ISR: >95% across all datasets. Source: Dong et al. (2025).'
  remediation: Validate all data before ingestion into agent memory banks. Reject records containing substitution directives
    (Victim_X/Target_X patterns). Monitor memory for injected instructions.
  owasp_llm: LLM02:2025
  cwe: CWE-913
- id: MEDUSA-ACP-SCAN-048
  name: aci-json-piggybacked-injection
  severity: CRITICAL
  category: multi_agent_attack
  patterns:
  - (?i)(json|xml|schema).{0,100}(unexpected|extra|additional)\s+(field|key|param).{0,100}(inject|execute|run|eval)
  - (?i)(inter.agent|agent.to.agent|a2a).{0,80}(piggybacked|embedded|hidden).{0,80}(instruction|command|payload)
  - (?i)(trust\s+graph|directed\s+trust|trust\s+edge).{0,100}(compromise|propagate|cascade)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: ACI — Agent Cascading Injection via JSON/XML piggybacked instructions in inter-agent messages'
  description: 'Agent Cascading Injection (ACI) by Sharma 2025 embeds malicious payloads in structured data (JSON/XML schema
    fields) passed between agents. Downstream agents fail to sanitize unexpected fields, executing injected instructions.
    Propagates exponentially: d^h agents compromised after h hops. Source: Sharma et al. (2025).'
  remediation: Strictly validate inter-agent message schemas against defined interfaces. Reject messages with unexpected fields.
    Apply trust isolation between agent communication boundaries.
  owasp_llm: LLM02:2025
  cwe: CWE-915
- id: MEDUSA-ACP-SCAN-049
  name: aci-shared-context-mutation
  severity: CRITICAL
  category: multi_agent_attack
  patterns:
  - (?i)(shared\s+context|serialized\s+context|context\s+aggregat).{0,100}(inject|mutate|poison|persist)
  - (?i)(mcp\s+context|protocol\s+context).{0,100}(malicious\s+tool\s+call|embedded\s+instruction|hidden\s+payload)
  - (?i)(context\s+mutation|context\s+poison).{0,80}(summariz|reformat|downstream)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: ACI Shared Context Mutation — malicious payload embedded in MCP serialized shared context'
  description: 'ACI Shared Context Mutation (Sharma 2025) embeds malicious tool calls or instructions in MCP''s serialized
    shared context. The payload persists through context summarization/reformatting, infecting all downstream agents that
    ingest the shared context. Source: Sharma et al. (2025).'
  remediation: Sanitize shared context before distribution to downstream agents. Validate context integrity signatures. Implement
    read/write separation for shared context stores.
  owasp_llm: LLM02:2025
  cwe: CWE-913
- id: MEDUSA-ACP-SCAN-050
  name: spi-indirect-data-exfil
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)(external\s+data|retrieved\s+data|fetched\s+content).{0,150}(exfil|leak|transmit|send).{0,80}(personal|private|password|credential|account)
  - (?i)(data.flow|indirect\s+injection).{0,100}(banking|medical|healthcare|eICU|MIMIC).{0,80}(patient|user)\s+(ID|data)
  - (?i)(AgentDojo|agentic\s+benchmark).{0,100}(banking|credential|password).{0,80}(inject|leak|exfil)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: SPI — Simple Prompt Injection indirect data exfiltration via external data input'
  description: 'Simple Prompt Injection (SPI) by Alizadeh 2025 embeds malicious instructions in external application input
    data, tricking agents into leaking sensitive information accessed during task execution (banking, healthcare). ASR: ~20%
    (banking), higher when combined with less-sensitive data. Source: Alizadeh et al. (2025).'
  remediation: Treat all external data as untrusted. Strip instruction-format strings from retrieved content before LLM processing.
    Monitor for data exfiltration patterns in agent outputs.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-ACP-SCAN-051
  name: gaire-cross-primitive-resource-to-tool
  severity: CRITICAL
  category: cross_primitive_attack
  patterns:
  - (?i)(resource|read.only\s+context).{0,200}(tool\s*_?call|tool\s+invocation|execute\s+tool)
  - (?i)(passive\s+data|read.only).{0,150}(escalat|trigger|invoke).{0,80}(active\s+action|tool\s+execution|system\s+command)
  - (?i)(cross.primitive|primitive\s+escalat|safety\s+perimeter\s+dissolv)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: Gaire Cross-Primitive Attack — Resource content triggering unauthorized Tool execution'
  description: 'Gaire 2025 cross-primitive attack chains MCP primitives: malicious instructions embedded in a read-only Resource
    trigger unauthorized Tool Calls via LLM inference. Dissolves the ''single safety perimeter'' — escalates epistemic harm
    to operational harm. Source: Gaire et al. (2025).'
  remediation: Enforce strict data-plane/control-plane separation in MCP. Validate LLM-generated tool calls against a whitelist.
    Resources must never trigger tool execution without explicit user authorization.
  owasp_llm: LLM02:2025
  cwe: CWE-269
- id: MEDUSA-ACP-SCAN-052
  name: corba-recursive-dos-spawning
  severity: CRITICAL
  category: denial_of_service
  patterns:
  - (?i)(infinite\s+(loop|cycle|recursion)|recursive\s+(task|subtask)\s+spawn).{0,100}(agent|delegation|subtask)
  - (?i)(contagious\s+recursive|CORBA).{0,80}(blocking|DoS|denial\s+of\s+service)
  - (?i)(subtask\s+delegation|task\s+spawn).{0,100}(loop|recurse|infinite|deadlock)
  - (?i)(computational\s+drain|resource\s+depletion|deadlock).{0,80}(multi.agent|MAS|agent\s+system)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: CORBA — Contagious Recursive Blocking Attack creating infinite agent task delegation loops'
  description: 'CORBA (Contagious Recursive Blocking Attack) by Kong/Ferrag 2025 injects benign-looking instructions that
    manipulate agents into infinite recursive subtask delegation, draining computational resources and causing MAS deadlocks.
    Topology-agnostic. Source: Kong et al. (2025).'
  remediation: Implement maximum recursion depth limits for subtask delegation. Monitor task graph for cycles. Rate-limit
    agent-to-agent delegation chains.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-ACP-SCAN-053
  name: aeia-mobile-agent-env-injection
  severity: CRITICAL
  category: multimodal_agent_attack
  patterns:
  - (?i)(android|mobile\s+agent|MLLM\s+agent).{0,150}(adversarial\s+content|inject.{0,30}(env|interface|screen|UI))
  - (?i)(reasoning\s+gap|reasoning\s+vulnerabil).{0,100}(mobile|android|multimodal).{0,80}(agent|task)
  - (?i)(environmental\s+element|UI\s+element|interface\s+element).{0,100}(adversarial|malicious|hidden\s+instruction)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: AEIA — Active Environment Injection Attack targeting multimodal mobile agent interfaces'
  description: 'AEIA (Active Environment Injection Attack) by Ferrag 2025 targets Multimodal LLM agents on mobile OS (Android).
    Embeds adversarial instructions visually/structurally within environmental elements + exploits reasoning gap vulnerabilities.
    ASR: 93% on AndroidWorld. Source: Ferrag et al. (2025).'
  remediation: Implement input sanitization for all environmental observations in mobile agents. Validate UI element content
    against expected schemas. Add reasoning verification step before action execution.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-ACP-SCAN-054
  name: cia-compositional-instruction-jailbreak
  severity: HIGH
  category: jailbreak
  patterns:
  - (?i)(compositional\s+instruction|composite\s+prompt).{0,100}(harmful|malicious|attack).{0,80}(embed|hidden|within)
  - (?i)(embed.{0,20}harmful.{0,50}harmless|harmless.{0,50}embed.{0,20}harmful)
  - (?i)(jailbreak.{0,50}(GPT-4|GPT-3\.5|Llama2|llama-2)).{0,100}(>95%|compositional)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: CIA — Compositional Instruction Attack embedding harmful instructions within harmless context'
  description: 'CIA (Compositional Instruction Attack) by Ferrag 2025 uses automated framework to embed harmful instructions
    within harmless ones. ASR: >95% on GPT-4/3.5/Llama2-70b. Source: Ferrag et al. (2025).'
  remediation: Deploy compositional prompt analysis. Flag multi-layer instruction embedding. Use safety classifiers analyzing
    full composite prompt semantics.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-ACP-SCAN-055
  name: cve-2025-6514-mcp-remote-rce
  severity: CRITICAL
  category: cve_exploitation
  patterns:
  - (?i)(mcp.remote|mcp_remote).{0,100}(0\.0\.[5-9]|0\.1\.(0|1|2|3|4|5))
  - CVE-2025-6514
  - (?i)(untrusted\s+mcp\s+endpoint|malicious\s+mcp\s+server).{0,100}(remote\s+code\s+exec|RCE|command\s+exec)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: CVE-2025-6514 — Anthropic MCP-Remote RCE via untrusted endpoint'
  description: 'CVE-2025-6514: Anthropic MCP-Remote (v0.0.5–0.1.15) allows untrusted MCP endpoints to trigger remote OS command
    execution. Source: NVD/MCPSec 2025.'
  remediation: Upgrade mcp-remote to v0.1.16+. Validate MCP endpoint origins. Restrict MCP server connectivity to trusted
    sources only.
  owasp_llm: LLM08:2025
  cwe: CWE-78
- id: MEDUSA-ACP-SCAN-056
  name: cve-2025-49596-mcp-inspector-csrf-rce
  severity: CRITICAL
  category: cve_exploitation
  patterns:
  - (?i)(mcp.inspector|mcp_inspector).{0,100}(0\.14\.0)
  - CVE-2025-49596
  - (?i)(dns.rebind|csrf).{0,100}(mcp.inspector|mcp_inspector)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: CVE-2025-49596 — MCP Inspector CSRF/DNS-rebinding RCE'
  description: 'CVE-2025-49596: Anthropic MCP Inspector v0.14.0 CSRF/DNS-rebinding vulnerability enabling RCE. Source: NVD/Anthropic
    2025.'
  remediation: Upgrade MCP Inspector. Implement Origin header validation. Bind to localhost only with strict CSRF tokens.
  owasp_llm: LLM08:2025
  cwe: CWE-352
- id: MEDUSA-ACP-SCAN-057
  name: cve-2025-46059-langchain-gmail-pi
  severity: CRITICAL
  category: cve_exploitation
  patterns:
  - CVE-2025-46059
  - (?i)(GmailToolkit|gmail.toolkit|gmail_toolkit).{0,100}(inject|malicious\s+email)
  - (?i)(langchain.{0,30}gmail).{0,100}(indirect\s+prompt\s+inject|arbitrary\s+code)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: CVE-2025-46059 — LangChain GmailToolkit indirect prompt injection via crafted emails'
  description: 'CVE-2025-46059: LangChain GmailToolkit v0.3.51 CRITICAL indirect prompt injection via crafted emails → arbitrary
    code execution. Source: NVD 2025.'
  remediation: Upgrade langchain-community. Sanitize email content before LLM processing. Restrict GmailToolkit to read-only
    where possible.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-ACP-SCAN-058
  name: cve-2025-11844-smolagents-xpath
  severity: HIGH
  category: cve_exploitation
  patterns:
  - CVE-2025-11844
  - (?i)(SmolAgents|smol.agents|smol_agents).{0,100}(1\.20\.0|xpath|inject)
  - (?i)(huggingface.{0,30}smol|smolagents).{0,100}(xpath.inject|filter.bypass)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Detected: CVE-2025-11844 — HuggingFace SmolAgents XPath injection'
  description: 'CVE-2025-11844: HuggingFace SmolAgents v1.20.0 XPath injection bypassing security filters. Source: NVD 2025.'
  remediation: Upgrade SmolAgents. Use parameterized XPath expressions. Implement strict input validation.
  owasp_llm: LLM08:2025
  cwe: CWE-643
- id: MEDUSA-ACP-SCAN-059
  name: cve-2025-59532-codex-sandbox-escape
  severity: CRITICAL
  category: cve_exploitation
  patterns:
  - CVE-2025-59532
  - (?i)(codex.cli|openai.codex).{0,100}(sandbox.escape|directory.control|jail.break)
  - (?i)(openai\s+codex).{0,100}(escape|bypass\s+sandbox|directory\s+traversal)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  message: 'Detected: CVE-2025-59532 — OpenAI Codex CLI sandbox escape via directory control flaw'
  description: 'CVE-2025-59532: OpenAI Codex CLI sandbox escape via directory control flaw, allowing execution outside sandboxed
    environment. Source: NVD 2025.'
  remediation: Update OpenAI Codex CLI. Implement strict directory access controls. Validate all path parameters against allowed
    base directories.
  owasp_llm: LLM08:2025
  cwe: CWE-22
- id: MEDUSA-ACP-SCAN-060
  name: coral-protocol-auth-bypass-sse
  severity: CRITICAL
  category: authentication_bypass
  patterns:
  - (?i)(coral.{0,10}(protocol|server|sse)|sse.{0,10}coral).{0,100}(invalid.{0,20}privacy.?key|invalid.{0,20}privacyKey)
  - (?i)(sessionId.{0,50}privacyKey|privacyKey.{0,50}sessionId).{0,100}(invalid|mismatch|bypass|spoof)
  - (?i)/sse/v1/.{0,50}(invalid|bypass|spoof|forge).{0,50}(auth|key|credential)
  - (?i)(coral.attacker|coral.attack.client|coral-attacker).{0,100}(sse|session|spawn)
  file_types:
  - '*.ts'
  - '*.js'
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Detected: Coral Protocol Authentication Bypass — invalid privacyKey accepted by SSE endpoint'
  description: 'Coral Protocol SSE gateway (/sse/v1/...) accepts valid sessionId + invalid privacyKey, enabling unauthorized
    session eavesdropping and agent impersonation. ASR: 100% (50/50 trials) via coral-attacker-client. Source: Yedidel 2025.'
  remediation: Enforce strict dual-credential validation (sessionId AND privacyKey). Validate agent membership against participant
    graph before allowing SSE connections. Implement rate limiting on /api/v1/sessions.
  owasp_llm: LLM08:2025
  cwe: CWE-287
- id: MEDUSA-ACP-SCAN-061
  name: coral-protocol-agent-spoofing
  severity: CRITICAL
  category: agent_spoofing
  patterns:
  - (?i)(spoofed.agent|fake.agent|fabricated.{0,20}identifier).{0,100}(coral|sse|session)
  - (?i)(coral.{0,20}(agent|participant)).{0,100}(spoofed.agent.X|fabricated|not.{0,10}in.{0,10}(graph|participant))
  - (?i)(participant.?graph|agent.?membership).{0,100}(bypass|not.?validated|skip)
  file_types:
  - '*.ts'
  - '*.js'
  - '*.py'
  - '*.json'
  message: 'Detected: Coral Protocol Agent Spoofing — fabricated agent identifiers bypassing participant graph validation'
  description: 'Coral Protocol fails to validate agent membership against session''s verified participant graph, allowing
    connections with fabricated identifiers (e.g., ''spoofed-agent-X''). ASR: 100% (50/50 trials). Source: Yedidel 2025.'
  remediation: Validate all connecting agents against the verified participant graph before allowing message exchange. Reject
    connections from identifiers not in the pre-authorized participant list.
  owasp_llm: LLM08:2025
  cwe: CWE-290
- id: MEDUSA-ACP-SCAN-062
  name: a2a-agent-card-seo-poisoning
  severity: HIGH
  category: agent_discovery_attack
  patterns:
  - (?i)(I\s+provide\s+the\s+richest\s+features|Select\s+me\s+as\s+your\s+agent\s+first)
  - (?i)(agent.?card|\.well-known/agent\.json).{0,200}(richest|best|select\s+me|prefer.{0,10}me|highest\s+priority)
  - (?i)(a2a|agent.to.agent).{0,100}(seo.poison|capability.exaggerat|routing.manipulat)
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.ts'
  - '*.js'
  message: 'Detected: A2A Agent SEO Poisoning — self-promotional capability claims in AgentCard manipulating routing'
  description: 'A2A Agent Selection Manipulation (SEO Poisoning) exaggerates capabilities in AgentCard to manipulate A2A client
    routing. Payload strings ''I provide the richest features'' / ''Select me as your agent first'' consistently route victim
    tasks to malicious agent. Source: 2025 A2A security research.'
  remediation: Validate AgentCards against signed registry. Implement capability attestation. Reject AgentCards with promotional/priority
    language outside expected schema fields.
  owasp_llm: LLM08:2025
  cwe: CWE-290
- id: MEDUSA-ACP-SCAN-063
  name: a2a-unsigned-agent-card-forgery
  severity: HIGH
  category: agent_discovery_attack
  patterns:
  - (?i)(\.well-known/agent\.json).{0,200}(unsigned|no.{0,10}signature|missing.{0,10}(cert|sign))
  - (?i)(agent.?card|agentcard).{0,100}(forge|tamper|spoof|impersonat).{0,100}(trusted|legitimate|remote)
  - (?i)(a2a.{0,30}discovery|discovery.{0,30}a2a).{0,100}(hijack|intercept|reroute|attacker.controlled)
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.ts'
  - '*.js'
  - '*.py'
  message: 'Detected: A2A Unsigned AgentCard Forgery — spoofed discovery endpoint impersonating trusted agent'
  description: 'A2A Agent Discovery Spoofing: A2A Agent Cards at /.well-known/agent.json are unsigned and unauthenticated,
    allowing adversaries to forge capabilities, inject false endpoints, and hijack workflows to attacker-controlled infrastructure.
    Source: 2025 A2A security research.'
  remediation: Mandate cryptographic signing for all AgentCards. Verify signatures against a trusted CA before accepting any
    agent discovery response. Implement certificate pinning for known trusted agents.
  owasp_llm: LLM08:2025
  cwe: CWE-347
- id: MEDUSA-ACP-SCAN-064
  name: aegisagent-multimodal-pi-har
  severity: HIGH
  category: multimodal_agent_attack
  patterns:
  - (?i)(IMUGPT|HAR|human\s+activity\s+recogn).{0,150}(prompt\s+inject|adversarial|attack)
  - (?i)(signal\s+path|text\s+path|prompt\s+path|hybrid\s+perturbation).{0,100}(LLM|agent|multimodal)
  - (?i)(multimodal\s+inject|cross.modal\s+inject).{0,100}(signal|sensor|IMU|accelerometer)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  message: 'Detected: AegisAgent attack surface — multimodal prompt injection targeting LLM-based HAR agents'
  description: 'Multimodal Prompt Injection targeting LLM-based Human Activity Recognition (HAR) agents across signal, text,
    prompt, and hybrid perturbation paths. ASR: avg 62.2% baseline; AegisAgent defense reduces to 33.4%. Source: Wang et al.
    2025.'
  remediation: 'Deploy AegisAgent detect-remedy-verify loop: Input Sanitizer (6.3ms) + Consistency Verifier (31.1ms) + Robust
    Reasoner (41.2ms). Validate cross-modal semantic consistency before action execution.'
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-ACP-SCAN-065
  name: hossain-delegate-recon-exfil-pi
  severity: CRITICAL
  category: prompt_injection
  patterns:
  - (?i)(delegate\s+this\s+to|delegate.{0,20}another\s+agent|abandon.{0,30}constraint.{0,30}delegate)
  - (?i)(reconnaissance|recon).{0,80}(agent|LLM|tool).{0,80}(inject|manipulat|escalat)
  - (?i)(role.play\s+inject|roleplay\s+inject).{0,100}(agent|coordinator|pipeline)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  - '*.yaml'
  - '*.txt'
  message: 'Detected: Hossain Prompt Injection — delegate/recon/role-play injection in multi-agent pipeline'
  description: 'Hossain 2025 taxonomy: 55 PI categories including Delegate (''delegate this to another agent''), Role-play,
    Reconnaissance, and Data Exfiltration attacks on multi-agent pipelines. Baseline ASR 20–30%; Multi-Agent Defense Pipeline
    achieves 100% mitigation. Source: Hossain et al. (2025).'
  remediation: Deploy pre-input filtering (Coordinator-based) + post-generation Guard agent (Chain-of-agents). Block delegate/role-play
    injection patterns at input boundary.
  owasp_llm: LLM02:2025
  cwe: CWE-74
- id: MEDUSA-ACP-SCAN-066
  name: web3-agent-memory-injection-context-manip
  severity: CRITICAL
  category: memory_poisoning
  patterns:
  - (?i)(web3\s+agent|blockchain\s+agent|crypto\s+agent).{0,150}(memory\s+inject|context\s+manipulat)
  - (?i)(malicious\s+history|poisoned\s+history|tampered\s+history).{0,100}(agent|Qwen|LLM|model)
  - (?i)(security.augmented\s+dataset|SFT.{0,20}security).{0,100}(memory|history|context).{0,80}(reject|recogni)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
