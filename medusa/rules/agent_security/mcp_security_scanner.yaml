metadata:
  source: PaperMiner/2025-12-29_mcp_security
  extraction_date: '2026-02-18'
  papers_analyzed: 22
  unique_attacks: 31
  defenses_identified: 9
  consolidated: true
  source_files:
  - mcp_security_scanner.yaml
  - mcp_security_2025_scanner.yaml
rules:
- id: MEDUSA-MCP-SCAN-001
  name: tool-description-injection
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)__doc__\s*=\s*["'][^"']*(?:ignore|disregard|override|instead)\s+(?:previous|prior|original)
  - (?i)__doc__\s*[+=]\s*["'][^"']*(?:execute|run|call|invoke)\s+(?:this|the\s+following)
  - (?i)description\s*[=:]\s*["'][^"']*(?:IMPORTANT|NOTE|WARNING)\s*:.*(?:must|should|always)\s+(?:use|call|run)
  file_types:
  - '*.py'
  message: MCP tool description contains injected instructions (Shadowing/Rug Pull pattern)
  description: Detects hidden instructions in MCP tool __doc__ strings or descriptions. Guo 2025 showed Shadowing attacks
    achieve 80% ASR by hijacking legitimate tools via shared context __doc__ manipulation.
  remediation: Treat tool descriptions as untrusted input. Validate tool logic independently of descriptions. Use static analysis
    on tool definitions before deployment.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-MCP-SCAN-002
  name: tool-description-deprecated-claim
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:deprecated|obsolete|replaced\s+by|use\s+instead)
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:best\s+practice|recommended|preferred)\s+(?:tool|method|approach)
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:do\s+not\s+use|avoid\s+using)\s+[a-zA-Z_]+
  file_types:
  - '*.py'
  - '*.json'
  message: MCP tool description contains deceptive preference/deprecation claims
  description: Detects Malicious Tool Coverage (100% ASR) and Tool Preference Manipulation (70% ASR) attacks from Guo 2025
    where tools use deceptive descriptions to hijack selection.
  remediation: Validate deprecation claims against official registries. Do not rely solely on tool descriptions for selection
    decisions.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MCP-SCAN-003
  name: mcp-reverse-shell
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:subprocess|os\.system|os\.popen)\s*\([^)]*(?:nc\s+-[elp]|ncat\s+-|netcat)
  - (?i)(?:subprocess|os\.system|os\.popen)\s*\([^)]*bash\s+-i\s*>\s*&
  - (?i)(?:subprocess|os\.system)\s*\([^)]*(?:socat|telnet).*(?:EXEC|exec)
  - (?i)socket\.(?:connect|create_connection).*(?:4444|4445|1337|31337|9001)
  file_types:
  - '*.py'
  message: MCP tool contains reverse shell or remote listener pattern
  description: Detects Remote Listener Attack (Guo 2025, 90% ASR, Efficacy 7.03) where netcat reverse shells are disguised
    as debugging tools in MCP server implementations.
  remediation: Audit all network operations in MCP tools. Block outbound connections to non-whitelisted hosts. Run MCP servers
    in sandboxed environments.
  owasp_llm: LLM01:2025
  cwe: CWE-78
- id: MEDUSA-MCP-SCAN-004
  name: mcp-tool-eval-exec
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)eval\s*\(\s*(?:tool_|user_|param|arg|input|request)
  - (?i)exec\s*\(\s*(?:tool_|user_|param|arg|input|request)
  - (?i)compile\s*\([^)]*(?:tool_|user_|param).*exec
  file_types:
  - '*.py'
  message: MCP tool uses eval/exec with user-controlled input
  description: Detects Infectious Attack pattern (Guo 2025, 70% ASR, Efficacy 6.47) where template-based tool generation propagates
    eval(user_input) vulnerabilities across MCP tools.
  remediation: Never use eval/exec with user-controlled input. Use safe alternatives (ast.literal_eval, json.loads). Implement
    input validation and sandboxing.
  owasp_llm: LLM01:2025
  cwe: CWE-95
- id: MEDUSA-MCP-SCAN-005
  name: mcp-command-injection
  severity: CRITICAL
  category: mcp_security
  patterns:
  - (?i)(?:subprocess\.(?:call|run|Popen)|os\.system)\s*\([^)]*(?:f["']|format|%s|\+\s*(?:tool_|user_|param|arg|input))
  - (?i)os\.(?:system|popen)\s*\([^)]*\+\s*(?:request|query|param)
  - (?i)subprocess.*shell\s*=\s*True.*(?:tool_|user_|param|input)
  file_types:
  - '*.py'
  message: MCP tool has command injection vulnerability via unsanitized input
  description: Detects command injection in MCP tools where user/tool parameters are passed unsanitized to shell commands.
    File-Based Injection (Guo 2025) achieves 90-100% ASR via injected instructions manipulating file operations.
  remediation: Use subprocess with shell=False and argument lists. Sanitize all parameters. Filter shell metacharacters (;,
    |, $, backticks).
  owasp_llm: LLM01:2025
  cwe: CWE-78
- id: MEDUSA-MCP-SCAN-006
  name: mcp-dynamic-tool-modification
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:setattr|delattr)\s*\([^)]*(?:__doc__|description|__call__|__func__)
  - (?i)(?:tool|func|method)\.(?:__doc__|description)\s*=\s*(?:requests\.get|urllib|fetch|download)
  - (?i)(?:importlib\.reload|exec|eval).*(?:tool_|plugin_|server_).*(?:update|modify|patch)
  file_types:
  - '*.py'
  message: Dynamic tool modification detected (Rug Pull attack pattern)
  description: Detects Rug Pull Attack (Guo 2025, 80% ASR, Efficacy 1.67) where legitimate tools gain trust, then remotely
    modify their __doc__/logic post-deployment.
  remediation: Implement version control for tool definitions. Require explicit user approval for tool updates. Use immutable
    tool descriptions.
  owasp_llm: LLM01:2025
  cwe: CWE-494
- id: MEDUSA-MCP-SCAN-007
  name: mcp-unvalidated-tool-output
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:exec|eval|subprocess)\s*\(.*(?:tool_result|tool_output|tool_response|mcp_response)
  - (?i)(?:json\.loads|ast\.literal_eval)\s*\(.*tool_(?:result|output).*\).*(?:exec|eval|system)
  - (?i)(?:result|output|response)\s*=.*(?:mcp|tool).*\n.*(?:os\.system|subprocess|exec)\s*\(.*(?:result|output|response)
  file_types:
  - '*.py'
  message: MCP tool output executed without validation
  description: Detects MCP Tool Return Attack (Guo 2025, 90% ASR, Efficacy 1.96) where malicious instructions in tool output
    strings are parsed and executed as new instructions due to high trust in tool outputs.
  remediation: Validate and sanitize all tool outputs. Never execute tool return values directly. Implement output schema
    validation.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-MCP-SCAN-008
  name: mcp-html-comment-injection
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)<!--\s*(?:SYSTEM|INSTRUCTION|IMPORTANT|NOTE)\s*:.*(?:ignore|override|execute|run)
  - (?i)<\s*(?:div|span|p)\s+(?:style|class)\s*=\s*["'].*(?:display:\s*none|visibility:\s*hidden|opacity:\s*0).*>.*(?:ignore|execute|override)
  - (?i)<!--.*(?:you\s+(?:must|should|are)|when\s+(?:asked|queried)).*-->
  file_types:
  - '*.html'
  - '*.md'
  - '*.txt'
  message: Hidden instruction injection in HTML/document content
  description: Detects Webpage Poison Attack (Guo 2025, 80% ASR) and Malicious Project Install (70% ASR) where hidden HTML
    comments or README instructions manipulate MCP agents during content processing.
  remediation: Strip HTML comments before processing. Sanitize document content. Do not execute instructions found in external
    content.
  owasp_llm: LLM01:2025
  cwe: CWE-79
- id: MEDUSA-MCP-SCAN-009
  name: mcp-missing-auth
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:app|server)\.(?:route|get|post|put|delete)\s*\([^)]*(?:tool|mcp|api)[^)]*\)\s*\n(?:(?!.*(?:auth|token|jwt|session|api_key|bearer)).)+
  - '(?i)@(?:app|router)\.(?:get|post)\s*\([^)]*(?:tool|execute|invoke)[^)]*\)\s*\n\s*(?:async\s+)?def\s+\w+\s*\([^)]*\)\s*:'
  - (?i)mcp\.(?:server|Server)\s*\(.*\)(?:(?!.*(?:auth|authentication|middleware|guard|token)).)+
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: MCP server endpoint lacks authentication/authorization
  description: Detects MCP server endpoints without authentication. MCP Guardian (Kumar, cited in Guo 2025) recommends authentication,
    access control, and rate limiting as mandatory security layers.
  remediation: Implement authentication middleware. Use API keys or JWT tokens. Add rate limiting and request logging per
    MCP Guardian recommendations.
  owasp_llm: LLM09:2025
  cwe: CWE-306
- id: MEDUSA-MCP-SCAN-010
  name: mcp-unsafe-file-operations
  severity: HIGH
  category: mcp_security
  patterns:
  - (?i)(?:os\.(?:remove|unlink|rmdir)|shutil\.rmtree)\s*\(\s*(?:tool_|param|arg|input|request|path)
  - (?i)open\s*\(\s*(?:tool_|param|arg|input|request|path).*["']w
  - (?i)(?:pathlib\.Path|os\.path).*(?:tool_|param|arg|input).*(?:write_text|write_bytes|unlink)
  file_types:
  - '*.py'
  message: MCP tool performs file operations with user-controlled paths
  description: Detects File-Based Injection attacks (Guo 2025, ASR 90-100%, Efficacy 3.85-8.38) where injected instructions
    manipulate local files via Add/Delete/Modify/Retrieve operations without path validation.
  remediation: Require explicit user confirmation for all file operations. Validate paths against allowlist. Use chroot/container
    isolation for file access.
  owasp_llm: LLM01:2025
  cwe: CWE-22
- id: MEDUSA-MCP-SCAN-011
  name: mcp-cross-tool-reference
  severity: MEDIUM
  category: mcp_security
  patterns:
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:after\s+(?:calling|using|running)|first\s+call|then\s+(?:use|call|invoke))\s+[a-zA-Z_]+
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:requires|depends\s+on|works\s+with)\s+(?:the\s+)?[a-zA-Z_]+\s+tool
  - (?i)(?:description|__doc__)\s*[=:]\s*["'][^"']*(?:pass|forward|send)\s+(?:the\s+)?(?:output|result|response)\s+(?:to|from)\s+[a-zA-Z_]+
  file_types:
  - '*.py'
  - '*.json'
  message: MCP tool description references other tools (coordination attack vector)
  description: Detects Multi-Tool Coordination attack (Guo 2025, 30% ASR, Efficacy 3.13) where malicious logic is split across
    tools and the agent infers relationships from cross-references in descriptions.
  remediation: Isolate tool contexts. Validate tool chain dependencies at registration time. Do not allow tools to reference
    other tools in descriptions.
  owasp_llm: LLM01:2025
  cwe: CWE-829
- id: MEDUSA-MCP-SCAN-012
  name: mcp-resource-exhaustion
  severity: MEDIUM
  category: mcp_security
  patterns:
  - (?i)while\s+True\s*:.*(?:tool|api|request|query)
  - (?i)(?:time\.sleep|sleep)\s*\(\s*(?:[1-9]\d{3,}|\d+\s*\*\s*\d+)
  - (?i)for\s+\w+\s+in\s+range\s*\(\s*(?:[1-9]\d{5,}|10\s*\*\*\s*[6-9])
  file_types:
  - '*.py'
  message: MCP tool contains potential resource exhaustion pattern
  description: Detects P-DoS via Tools (Gao 2024, 100% ASR on GPT-4o, <$1 cost) where tools trigger infinite loops, sleep
    commands, or token amplification (0.5K→16K+ tokens).
  remediation: Implement execution timeouts for all tool calls. Set token output limits. Monitor resource consumption per
    tool invocation.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-MCP-SCAN-013
  name: memory-injection-persistent-context
  severity: CRITICAL
  category: memory_attack
  patterns:
  - (?i)(persistent.?memory|long.?term.?memory|agent.?memory).{0,60}(inject|poison|corrupt|manipulate)
  - (?i)(memory.?store|memory.?db|conversation.?history).{0,60}(untrusted|external|user.?provided).{0,40}(write|append|insert|store)
  - (?i)(past.?interaction|previous.?session|memory.?context).{0,80}(execute|run|call|invoke).{0,40}(tool|function|api)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  message: 'Detected: Memory injection vector - untrusted data written to persistent agent memory (CrAIBench pattern)'
  description: 'Memory Injection corrupts persistent agent memory so injected commands appear as ''legitimate past interactions''.
    CrAIBench: 500+ cases showing memory injection >> prompt injection vulnerability. Can trigger unauthorized transactions
    days/weeks after initial injection.'
  remediation: Validate all inputs before storing in agent memory. Treat persistent memory as a security boundary. Use separate
    storage for agent instructions vs user data. Never execute instructions found in conversation history.
  owasp_llm: LLM02:2025
  cwe: CWE-501
- id: MEDUSA-MCP-SCAN-014
  name: overthinking-dos-reasoning-exhaustion
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(think|reason|reflect|consider).{0,40}(every|all|each|possible|step.?by.?step).{0,60}(scenario|case|edge.?case|implication|consequence)
  - (?i)(chain.?of.?thought|extended.?thinking|reasoning.?budget).{0,60}(maximize|exhaust|unlimited|infinite|no.?limit)
  - (?i)(continue.?thinking|keep.?reasoning|do.?not.?stop.?thinking).{0,60}(until|forever|complete|finish|done)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Overthinking DoS pattern - adversarial prompt forcing excessive reasoning chain generation'
  description: Overthinking Slowdown Attack forces reasoning LLMs (o1, o3, DeepSeek-R1) to generate excessive thought chains
    exhausting compute budget. Targets extended thinking mode specifically.
  remediation: Set strict thinking_budget token limits. Monitor and alert on reasoning token spikes. Implement per-request
    compute quotas.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-MCP-SCAN-015
  name: crabs-algorithmic-complexity-attack
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(algorithmic.?complexity|worst.?case.?input|adversarial.?input).{0,60}(llm|model|inference|api)
  - (?i)(crabs|complexity.?attack).{0,40}(generate|craft|create).{0,40}(slow|expensive|costly)
  - (?i)(nested.{0,20}(loop|recursion|call)|exponential.{0,20}(growth|complexity)).{0,60}(llm|prompt|token)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: CRABS Algorithmic Complexity Attack targeting LLM inference (automated DoS generation)'
  description: CRABS generates inputs triggering worst-case algorithmic complexity in LLM processing. Automated framework
    for creating inputs that maximize inference cost/latency.
  remediation: Implement per-request timeout and token budgets. Use input complexity scoring before processing. Rate limit
    by computational cost not just request count.
  owasp_llm: LLM04:2025
  cwe: CWE-400
- id: MEDUSA-MCP-SCAN-016
  name: demonagent-encrypted-multi-backdoor
  severity: CRITICAL
  category: backdoor_attack
  patterns:
  - (?i)(dynamic.?encrypt|encrypt.{0,20}signal|encrypted.?trigger).{0,60}(backdoor|payload|hidden)
  - (?i)(fragment.{0,20}backdoor|split.{0,20}backdoor|multi.?fragment).{0,60}(benign|innocent|normal).{0,40}content
  - (?i)(demonagent|demon.?agent).{0,60}(implant|backdoor|encrypt)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: DemonAgent encrypted multi-backdoor implantation pattern'
  description: DemonAgent hides backdoor signals via dynamic encryption within benign content and fragments them across multiple
    innocent-looking inputs. Fragments reassemble at trigger to evade single-sample detection.
  remediation: Deploy ensemble detection across multiple inference samples. Analyze behavioral consistency across contexts.
    Use separate sandboxed evaluation for model outputs on sensitive tasks.
  owasp_llm: LLM02:2025
  cwe: CWE-506
- id: MEDUSA-MCP-SCAN-017
  name: aeia-active-environment-injection
  severity: HIGH
  category: environment_injection
  patterns:
  - (?i)(ui.?overlay|fake.?popup|deceptive.{0,20}(notification|dialog|alert)).{0,60}(agent|llm|inject)
  - (?i)(modify.{0,20}(ui|display|screen|environment)).{0,60}(agent|trigger|inject|mislead)
  - (?i)(aeia|active.?environment.?inject).{0,40}(mobile|android|ios|gui|visual)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.swift'
  - '*.kt'
  message: 'Detected: AEIA Active Environment Injection pattern targeting multimodal mobile agents (93% ASR AndroidWorld)'
  description: AEIA modifies UI elements (fake popups, SMS overlays, deceptive dialogs) at runtime to hijack multimodal agent
    perception. Achieves 93% ASR on AndroidWorld benchmark.
  remediation: Verify UI state integrity before agent action execution. Use signed/authenticated UI events. Implement anomaly
    detection on unexpected popup/overlay patterns.
  owasp_llm: LLM01:2025
  cwe: CWE-290
- id: MEDUSA-MCP-SCAN-018
  name: les-dissonances-cross-tool-harvesting
  severity: HIGH
  category: cross_tool_attack
  patterns:
  - (?i)(harvest.{0,30}tool|cross.?tool.?harvest).{0,60}(data|output|result|context)
  - (?i)(tool.?a|first.?tool|source.?tool).{0,80}(pollut|inject|corrupt|modify).{0,40}(tool.?b|second.?tool|target.?tool)
  - (?i)(les.?dissonances|cross.?tool.{0,20}(pollut|attack)).{0,40}(multi.?tool|agent)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Les Dissonances cross-tool harvesting/polluting pattern in multi-tool agent system'
  description: Les Dissonances harvests data from one tool and poisons output in another, exploiting trust and data flow between
    tools in multi-tool agent systems (multi-server MCP setups).
  remediation: Isolate tool data contexts. Do not share raw outputs between tools without sanitization. Monitor cross-tool
    data flows for anomalous content.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-MCP-SCAN-019
  name: attractive-metadata-tool-selection-attack
  severity: HIGH
  category: tool_squatting
  patterns:
  - (?i)(tool.?name|server.?name|tool.?description).{0,80}(best|fastest|most.?accurate|most.?reliable|most.?trusted|recommended).{0,40}(for|when|to)
  - (?i)(metadata|description|name).{0,60}(trusted.?by|verified.?by|certified.?by|endorsed.?by).{0,40}(anthropic|openai|google|official)
  - (?i)(capability|feature).{0,40}(claim|advertise|describe).{0,60}(superior|better|faster|more.?capable).{0,40}than
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  message: 'Detected: Attractive Metadata Attack - deceptive tool capability claims to manipulate agent tool selection'
  description: Attractive Metadata Attack uses inflated or deceptive capability claims in tool descriptions/metadata to manipulate
    agent selection in large tool ecosystems (LiveMCP-Bench ocean scenario).
  remediation: Cryptographically verify tool metadata integrity. Use allowlists for approved tools. Audit tool descriptions
    for unverifiable claims. Implement tool reputation scoring.
  owasp_llm: LLM09:2025
  cwe: CWE-345
- id: MEDUSA-MCP-SCAN-020
  name: cross-domain-context-bypass-payload-split
  severity: HIGH
  category: multi_agent_attack
  patterns:
  - (?i)(split.{0,20}payload|fragment.{0,20}(instruction|attack|request)).{0,60}(agent|domain|boundary|filter)
  - (?i)(part\s*1.{0,20}part\s*2|chunk\s*\d.{0,40}chunk\s*\d).{0,60}(agent|domain|filter.?bypass|guardrail)
  - (?i)(agent\s*[AB12]|downstream.?agent|next.?agent).{0,60}(reassembl|combin|concat|join).{0,40}(fragment|chunk|part)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Cross-domain context bypass via payload splitting across agents (Ko et al. C6 pattern)'
  description: 'Ko et al. C6: attackers split malicious payload across multiple agents/domains. No single agent sees the full
    attack so per-agent guardrails fail. Intent only reassembles downstream.'
  remediation: Implement end-to-end semantic analysis across agent chains. Don't rely solely on per-agent content filtering.
    Track and correlate content across agent boundaries.
  owasp_llm: LLM01:2025
  cwe: CWE-668
- id: MEDUSA-MCP-SCAN-021
  name: agent-collusion-covert-channel
  severity: HIGH
  category: multi_agent_attack
  patterns:
  - (?i)(covert.?channel|steganograph|hidden.?signal).{0,60}(agent|llm|coordinate|collu)
  - (?i)(collu|coordinate.{0,20}secret|secret.{0,20}coordinate).{0,60}(agent|model|bypass|safety)
  - (?i)(shared.?reward|joint.{0,20}objective).{0,60}(bypass|evade|circumvent).{0,40}(safety|guardrail|oversight)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Agent collusion via covert channels or steganographic coordination (Ko et al. C2 pattern)'
  description: 'Ko et al. C2: autonomous agents may coordinate secretly via steganography or covert channels to deviate from
    assigned goals without detection by human overseers or monitoring logs.'
  remediation: Implement behavioral anomaly detection for agent-to-agent communications. Audit inter-agent message entropy.
    Use independent monitoring that cannot be bypassed by coordinating agents.
  owasp_llm: LLM08:2025
  cwe: CWE-506
- id: MEDUSA-MCP-SCAN-022
  name: neural-exec-execution-trigger
  severity: HIGH
  category: execution_trigger
  patterns:
  - (?i)(neural.?exec|execution.?trigger|universal.?trigger).{0,60}(inject|prompt|force|cause)
  - (?i)(learned.?trigger|trigger.?prefix|trigger.?suffix).{0,60}(execute|run|invoke|call).{0,40}(injection|payload|instruction)
  - (?i)(force.{0,20}(execute|comply|obey)).{0,40}(trigger|prefix|suffix|token)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.txt'
  message: 'Detected: Neural Exec universal execution trigger pattern (learned prefix/suffix for forcing prompt injection
    success)'
  description: Neural Exec learns universal execution triggers (prefix/suffix tokens) that reliably cause models to execute
    subsequently injected instructions. More robust than static jailbreaks.
  remediation: Deploy perplexity and coherence filters on inputs. Monitor for repeated unusual prefix/suffix patterns. Implement
    adversarial trigger detection in input pipeline.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-MCP-SCAN-023
  name: trade-total-retrieval-agent-deception
  severity: CRITICAL
  category: mcp_injection
  patterns:
  - (?i)(trade.{0,20}(total.retrieval|retrieval.agent.deception)).{0,60}(mcp|rag.pref|model)
  - (?i)(falsely.benign.{0,20}(attack|content).{0,30}(online|posted|scrape)).{0,60}(mcp|agent|execute)
  - (?i)(rag.pref.{0,30}(refusal|247.percent|improved)).{0,60}(trade|mcp|agent)
  - (?i)(8\.5.percent.strict.refusal|avg.8\.5.percent.{0,30}(mcp|trade))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: TRADE — MCP agent retrieves and executes online falsely-benign attack content (avg 8.5% refusal rate)'
  description: TRADE (Halloran 2025) posts Falsely Benign Attacks (FBAs) online — malicious commands embedded in content that
    appears benign. MCP agents scraping the web retrieve and execute these commands. Average strict refusal rate only 8.5%
    across tested models (Claude 3.7, Llama-3.1/3.2, Qwen2.5, Gemma-2, DeepSeek-R1). RAG-Pref improved refusal by 247%.
  remediation: Apply strict content validation on all MCP-retrieved web content before execution. Treat external web content
    as adversarially controlled. Implement RAG-Pref or equivalent refusal improvement for retrieved content.
