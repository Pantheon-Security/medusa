    7.50; ASR: 70%. Agents that prioritize ''recommended'' or ''best practice'' tools in their selection heuristics are particularly
    vulnerable. Works by exploiting the trust agents place in tool description authority claims.'
  remediation: Strip or quarantine authority-claiming language from tool descriptions during tool registration. Verify tool
    provenance before allowing 'recommended' or 'best practice' metadata. Implement tool description content policies that
    reject manipulative preference claims. Use MCPLib/MCPSecBench testing frameworks to validate tool selection security.
