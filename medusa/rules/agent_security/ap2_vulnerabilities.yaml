# MEDUSA Scanner Rules - AP2 (Agent Payments Protocol) Vulnerabilities
# Source: AP2 Specification, Cloud Security Alliance Framework, UCP+AP2 Documentation
# Version: 1.0.0
# Last Updated: 2026-02-08
# Purpose: STATIC CODE ANALYSIS - detecting AP2 payment security vulnerabilities
#
# Background:
#   AP2 (Agent Payments Protocol) is the payment trust layer for UCP, enabling
#   AI agents to execute financial transactions using cryptographic mandates.
#   AP2 uses Verifiable Digital Credentials (VDCs), ED25519 signatures, and
#   SD-JWT-VC tokens to establish trust between agents, merchants, credential
#   providers, and payment service providers.
#
# Attack Surface:
#   - Cryptographic mandate forgery via compromised signing keys
#   - Credential Provider trust model weaknesses
#   - Tokenization bypass enabling payment credential theft
#   - Weak signature algorithms undermining mandate integrity
#   - Issuer communication channel interception
#   - Mandate replay and scope escalation attacks
#
# CWEs: CWE-200, CWE-284, CWE-295, CWE-306, CWE-327, CWE-345, CWE-347,
#        CWE-384, CWE-522, CWE-693, CWE-770, CWE-798
#
# References:
#   - https://ap2-protocol.org/specification/
#   - https://ap2-protocol.org/topics/privacy-and-security/
#   - https://cloudsecurityalliance.org/blog/2025/10/06/secure-use-of-the-agent-payments-protocol-ap2
#   - https://ucp.dev/2026-01-23/documentation/ucp-and-ap2/

rules:
  # =============================================================================
  # SECTION 1: CREDENTIAL PROVIDER TRUST (5 rules)
  # =============================================================================

  - id: MEDUSA-AP2-CP-001
    name: ap2-credential-provider-unverified
    severity: CRITICAL
    category: authentication
    patterns:
      - '(?i)credential.?provider.*(?!.*(?:verify|validat|trust|certif|allowlist))'
      - '(?i)cp.*endpoint.*(?!.*(?:tls|https|verify|authenticat))'
      - '(?i)register.*credential.?provider.*(?!.*(?:verify|trust|vet))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 Credential Provider accepted without verification"
    description: |
      AP2 Credential Providers manage sensitive user data including payment
      instruments, addresses, and digital wallets. Accepting an unverified
      CP enables attackers to intercept payment credentials, inject malicious
      tokens, or serve fraudulent payment instruments to agents.
    remediation: |
      - Verify Credential Provider identity via DID resolution and certificate validation
      - Maintain an allowlist of trusted Credential Providers
      - Implement mutual TLS for all CP communications
      - Validate CP registration against trusted registries
    owasp_llm: "LLM06:2025"
    cwe: "CWE-306"

  - id: MEDUSA-AP2-CP-002
    name: ap2-cp-to-issuer-no-integrity
    severity: HIGH
    category: transport_security
    patterns:
      - '(?i)(?:cp|credential.?provider).*issuer.*(?!.*(?:integrity|sign|encrypt|tls))'
      - '(?i)issuer.*communicat.*(?!.*(?:mtls|mutual|encrypt))'
      - '(?i)token.*(?:send|transmit).*issuer.*(?!.*(?:encrypt|sign|integrity))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 CP-to-issuer communication without integrity protection"
    description: |
      The communication channel between Credential Providers and issuers
      must have integrity protection. Without it, token substitution attacks
      enable payment method theft. If an attacker intercepts this channel,
      they can swap legitimate payment tokens with fraudulent ones.
    remediation: |
      - Implement mTLS between Credential Providers and issuers
      - Sign all token payloads with CP private key
      - Validate token integrity at issuer before processing
      - Use end-to-end encryption for credential transmission
    owasp_llm: "LLM06:2025"
    cwe: "CWE-295"

  - id: MEDUSA-AP2-CP-003
    name: ap2-cp-role-segregation-violation
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)credential.?provider.*(?:transaction|process.?payment|charge|settle)'
      - '(?i)(?:cp|cred.?prov).*(?:both|also).*(?:token|transact)'
      - '(?i)token.*(?:manage|generat).*(?:process|settle).*(?:same|single)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 Credential Provider violates role segregation"
    description: |
      PCI-DSS requires separation of token management from transaction processing.
      If a Credential Provider handles both tokens and transaction details,
      a compromise of the CP exposes both payment credentials and transaction
      data, maximizing the blast radius of a breach.
    remediation: |
      - Separate token management from transaction processing into distinct services
      - Ensure Credential Providers only handle credential tokenization
      - Delegate transaction processing to dedicated PSP components
      - Implement access controls preventing CPs from accessing transaction details
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  - id: MEDUSA-AP2-CP-004
    name: ap2-allowlist-no-consensus-validation
    severity: MEDIUM
    category: trust_management
    patterns:
      - '(?i)allowlist.*(?!.*(?:consensus|quorum|multi.?party|distribut))'
      - '(?i)trusted.*(?:list|registry).*(?!.*(?:validat|verify|sign))'
      - '(?i)trust.?anchor.*(?!.*(?:pin|multi|redundan))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 trust allowlist without consensus validation"
    description: |
      AP2 relies on allowlists of trusted Credential Providers and issuers.
      Without distributed consensus validation, attackers can corrupt the
      allowlist to include fake CPs. Network partition exploitation can
      create divergent trust anchors across different deployment regions.
    remediation: |
      - Implement multi-party consensus for allowlist modifications
      - Use cryptographically signed allowlist entries
      - Distribute allowlist updates via verifiable data structures (Merkle trees)
      - Implement conflict detection for divergent trust anchors
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  - id: MEDUSA-AP2-CP-005
    name: ap2-did-resolution-cache-poisoning
    severity: MEDIUM
    category: trust_management
    patterns:
      - '(?i)did.*cache.*(?!.*(?:integrity|hash|ttl|expir|verify))'
      - '(?i)cache.*did.*(?!.*(?:invalidat|refresh|verify))'
      - '(?i)resolve.*did.*cache.*(?!.*(?:sign|integrity))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 DID resolution cache without integrity checks"
    description: |
      Cached DID resolution results without integrity verification enable
      cache poisoning attacks. An attacker who compromises the DID resolver
      infrastructure can inject malicious DID documents that persist in cache,
      enabling long-term identity spoofing.
    remediation: |
      - Validate integrity of cached DID documents on each use
      - Implement cache TTL with periodic re-resolution
      - Sign cached DID documents with resolver's key
      - Use multiple resolvers and compare results
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  # =============================================================================
  # SECTION 2: PAYMENT TOKEN SECURITY (4 rules)
  # =============================================================================

  - id: MEDUSA-AP2-TOKEN-001
    name: ap2-sd-jwt-vc-no-selective-disclosure
    severity: HIGH
    category: data_protection
    patterns:
      - '(?i)sd.?jwt.*(?!.*(?:selective|disclos|redact|omit))'
      - '(?i)verifiable.*credential.*(?!.*(?:selective|minimal|limit.?disclos))'
      - '(?i)(?:vdc|vc).*(?:all|full).*(?:disclos|reveal|expos)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 SD-JWT-VC without selective disclosure"
    description: |
      AP2 uses SD-JWT-VC (Selective Disclosure JSON Web Token Verifiable Credentials)
      specifically to enable minimal data exposure. Without selective disclosure,
      payment credentials, personal data, and transaction details are fully exposed
      to all parties in the transaction chain, violating data minimization principles.
    remediation: |
      - Implement selective disclosure for all SD-JWT-VC tokens
      - Only reveal claims required by each transaction party
      - Use holder binding to prevent token theft
      - Implement presentation exchange to negotiate required claims
    owasp_llm: "LLM02:2025"
    cwe: "CWE-200"

  - id: MEDUSA-AP2-TOKEN-002
    name: ap2-token-no-holder-binding
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)sd.?jwt.*(?!.*(?:kb.?jwt|key.?bind|holder))'
      - '(?i)present.*credential.*(?!.*(?:proof|bind|holder))'
      - '(?i)(?:vdc|verifiable.?credential).*(?:token|issue).*(?!.*(?:holder.?bind|cnf|confirm))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 token without holder binding"
    description: |
      SD-JWT-VC tokens without holder binding (Key Binding JWT) can be
      presented by any party that obtains them. Stolen tokens can be used
      by attackers to authorize payments without possessing the holder's
      private key, enabling credential relay attacks.
    remediation: |
      - Implement KB-JWT (Key Binding JWT) for all credential presentations
      - Require holder proof-of-possession for every transaction
      - Use cnf (confirmation) claims to bind tokens to holder keys
      - Reject presentations without valid holder binding proof
    owasp_llm: "LLM06:2025"
    cwe: "CWE-384"

  - id: MEDUSA-AP2-TOKEN-003
    name: ap2-token-long-lived
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)(?:payment|ap2|agentic).?token.*(?:ttl|expir|lifetime)\s*[=:]\s*(?:\d{5,}|86400|604800|2592000)'
      - '(?i)(?:payment|agentic).*token.*(?:never|no).*expir'
      - '(?i)(?:access|payment).*token.*(?:never.expire|no.expir|non.?expir)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 payment token with excessive lifetime"
    description: |
      Long-lived payment tokens increase the window of vulnerability.
      If a token is compromised, the attacker can execute transactions
      for the entire token lifetime. AP2 tokens should be short-lived
      and scoped to individual transactions or sessions.
    remediation: |
      - Use short-lived tokens (minutes, not hours or days)
      - Implement token rotation for ongoing sessions
      - Scope tokens to specific transactions when possible
      - Implement immediate token revocation capability
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  - id: MEDUSA-AP2-TOKEN-004
    name: ap2-token-revocation-missing
    severity: MEDIUM
    category: authorization
    patterns:
      - '(?i)(?:payment|agentic|ap2).?token.*(?!.*(?:revok|revoc|invalidat|blacklist|denylist))'
      - '(?i)payment.*token.*(?!.*(?:cancel|revok|void))'
      - '(?i)(?:issue|create).*(?:payment|agentic).?token.*(?!.*(?:revoc|cancel.?mechanism))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 token system without revocation mechanism"
    description: |
      AP2 token systems must support immediate revocation for compromised
      or disputed tokens. Without revocation, compromised payment tokens
      remain valid until natural expiration, enabling continued fraud.
    remediation: |
      - Implement token revocation lists or status endpoints
      - Support real-time revocation propagation to all parties
      - Provide user-facing token management for consent withdrawal
      - Check revocation status on every token presentation
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  # =============================================================================
  # SECTION 3: TRANSACTION INTEGRITY (4 rules)
  # =============================================================================

  - id: MEDUSA-AP2-TXN-001
    name: ap2-dynamic-linking-missing
    severity: CRITICAL
    category: data_integrity
    patterns:
      - '(?i)(?:payment|transact).*(?!.*(?:dynamic.?link|cart.?hash|content.?hash))'
      - '(?i)authorize.*(?!.*(?:link.*cart|bind.*amount|hash.*content))'
      - '(?i)mandate.*(?!.*(?:dynamic.?link|cart.?bind))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 transaction without dynamic linking"
    description: |
      Dynamic linking cryptographically binds a payment authorization to
      specific transaction details (amount, merchant, items). Without it,
      a valid authorization can be reused for different transactions,
      enabling amount manipulation and merchant substitution attacks.
    remediation: |
      - Implement dynamic linking between mandate and cart contents
      - Hash cart state and bind it to the payment authorization
      - Verify dynamic link integrity at every processing step
      - Reject authorizations where linked content has changed
    owasp_llm: "LLM07:2025"
    cwe: "CWE-345"

  - id: MEDUSA-AP2-TXN-002
    name: ap2-transaction-version-hash-missing
    severity: MEDIUM
    category: data_integrity
    patterns:
      - '(?i)checkout.*(?!.*(?:version.?hash|etag|version|content.?hash))'
      - '(?i)product.*(?:price|detail).*(?!.*(?:hash|version|valid.?through))'
      - '(?i)session.*(?!.*(?:version|hash|state.?check))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 transaction without version hash for stale read protection"
    description: |
      Products may change (price, availability) between discovery and checkout.
      UCP mitigates with validThrough timestamps and version hashes. Without
      these, stale read race conditions enable attackers to exploit price
      changes or sell out-of-stock items.
    remediation: |
      - Include version hashes on all product data
      - Validate version hash at checkout against discovery-time hash
      - Implement validThrough timestamps on price quotes
      - Handle 409 Conflict responses gracefully with backoff
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  - id: MEDUSA-AP2-TXN-003
    name: ap2-settlement-no-reconciliation
    severity: MEDIUM
    category: data_integrity
    patterns:
      - '(?i)settl.*(?!.*(?:reconcil|verify|match|audit))'
      - '(?i)(?:psp|payment.?processor).*(?!.*(?:reconcil|match))'
      - '(?i)complete.*payment.*(?!.*(?:verify.?settle|reconcil))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 settlement without reconciliation"
    description: |
      Payment settlements in AP2 must be reconciled against the original
      mandate to ensure the settled amount matches the authorized amount.
      Without reconciliation, discrepancies can go undetected, enabling
      over-charges or under-settlements.
    remediation: |
      - Reconcile every settlement against the original mandate
      - Compare settled amount with authorized amount
      - Alert on discrepancies between mandate and settlement
      - Implement automated reconciliation as part of the settlement flow
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  - id: MEDUSA-AP2-TXN-004
    name: ap2-refund-no-mandate-validation
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)refund.*(?!.*(?:mandate|original.?auth|verify.?transact))'
      - '(?i)process.*refund.*(?!.*(?:validat|check.?mandate|original))'
      - '(?i)reverse.*(?:payment|charge).*(?!.*(?:mandate|auth))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 refund processed without original mandate validation"
    description: |
      Refunds must be validated against the original payment mandate
      to prevent fraudulent refund attacks. Without validation, attackers
      can issue refunds for transactions they never made or inflate
      refund amounts beyond the original authorization.
    remediation: |
      - Validate refund requests against original payment mandate
      - Ensure refund amount does not exceed original authorized amount
      - Require mandate reference on all refund operations
      - Log refund-to-mandate mapping for audit trails
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  # =============================================================================
  # SECTION 4: CRYPTOGRAPHIC SECURITY (4 rules)
  # =============================================================================

  - id: MEDUSA-AP2-CRYPTO-001
    name: ap2-signature-algorithm-downgrade
    severity: CRITICAL
    category: cryptography
    patterns:
      - '(?i)(?:alg|algorithm)\s*[=:]\s*["\x27](?:RS256|HS256|HS384|HS512|none)["\x27]'
      - '(?i)sign.*(?:RS256|HS256|none)'
      - '(?i)jwt.*(?:alg|algorithm).*(?!.*(?:ES256|EdDSA|Ed25519|ES384))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
    message: "AP2 signature algorithm downgrade vulnerability"
    description: |
      AP2 requires strong asymmetric signing (ED25519, ECDSA P-256).
      Using symmetric (HS256) or weaker asymmetric (RS256) algorithms,
      or the 'none' algorithm, undermines mandate integrity.
      Algorithm confusion attacks can forge valid-looking signatures.
    remediation: |
      - Enforce EdDSA (Ed25519) or ES256 (ECDSA P-256) exclusively
      - Reject any token with alg=RS256, HS256, HS384, HS512, or none
      - Validate algorithm before signature verification, not after
      - Pin expected algorithm in verification configuration
    owasp_llm: "LLM06:2025"
    cwe: "CWE-327"

  - id: MEDUSA-AP2-CRYPTO-002
    name: ap2-key-no-hsm-kms
    severity: HIGH
    category: key_management
    patterns:
      - '(?i)(?:private|signing).?key.*(?:file|path|load|read|open)'
      - '(?i)(?:open|read|load).*(?:private|signing).?key'
      - '(?i)key.*=.*(?:open|read|load).*\.pem'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 signing key loaded from file instead of HSM/KMS"
    description: |
      AP2 specification requires private keys to be stored in HSM or KMS.
      Loading signing keys from filesystem exposes them to extraction via
      file read vulnerabilities, process memory dumps, or source code leaks.
    remediation: |
      - Store signing keys in HSM (Hardware Security Module)
      - Use cloud KMS (AWS KMS, Azure Key Vault, GCP Cloud KMS)
      - Never load raw key material from filesystem in production
      - Use key references/handles instead of raw key bytes
    owasp_llm: "LLM02:2025"
    cwe: "CWE-522"

  - id: MEDUSA-AP2-CRYPTO-003
    name: ap2-signature-verify-bypass
    severity: CRITICAL
    category: authentication
    patterns:
      - '(?i)(?:skip|bypass|disable).*(?:signature|sign|verify)'
      - '(?i)verify.*=\s*(?:false|False|FALSE|0|no)'
      - '(?i)(?:signature|sign).*(?:optional|ignore|skip)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 signature verification bypass"
    description: |
      Disabling or bypassing signature verification on AP2 mandates
      completely undermines the payment trust model. Any party can forge
      mandates when signature verification is skipped.
    remediation: |
      - Never allow signature verification to be disabled
      - Remove any verify=false flags or bypass options
      - Fail closed on signature verification errors
      - Implement signature verification as a mandatory, non-configurable step
    owasp_llm: "LLM07:2025"
    cwe: "CWE-347"

  - id: MEDUSA-AP2-CRYPTO-004
    name: ap2-key-rotation-missing
    severity: MEDIUM
    category: key_management
    patterns:
      - '(?i)(?:signing|private).?key.*(?!.*(?:rotat|refresh|renew|cycle))'
      - '(?i)key.*(?:static|permanent|fixed|hardcod)'
      - '(?i)(?:same|single|one).*key.*(?:all|every|always)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 signing key without rotation policy"
    description: |
      Static signing keys accumulate risk over time. The UCP specification
      acknowledges the need for key management but does not detail rotation
      procedures, making it likely developers will deploy without rotation.
      Compromised keys without rotation enable indefinite mandate forgery.
    remediation: |
      - Implement automated key rotation schedules
      - Support multiple active signing keys during rotation periods
      - Maintain key version history for mandate verification
      - Define key compromise response procedures
    owasp_llm: "LLM06:2025"
    cwe: "CWE-798"

  # =============================================================================
  # SECTION 5: PSP & SETTLEMENT SECURITY (3 rules)
  # =============================================================================

  - id: MEDUSA-AP2-PSP-001
    name: ap2-psp-no-mutual-auth
    severity: HIGH
    category: transport_security
    patterns:
      - '(?i)psp.*(?!.*(?:mtls|mutual|client.?cert|authenticat))'
      - '(?i)payment.?(?:service|processor).*(?!.*(?:mtls|mutual))'
      - '(?i)connect.*(?:psp|processor|acquirer).*(?!.*(?:mtls|verify.?cert))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 PSP connection without mutual authentication"
    description: |
      Connections to Payment Service Providers must use mutual TLS.
      Without mTLS, attackers can impersonate PSPs to intercept
      settlement instructions or redirect payment flows.
    remediation: |
      - Implement mTLS for all PSP communications
      - Validate PSP certificates against trusted CA chains
      - Implement certificate pinning for known PSP endpoints
      - Monitor for certificate anomalies
    owasp_llm: "LLM06:2025"
    cwe: "CWE-295"

  - id: MEDUSA-AP2-PSP-002
    name: ap2-settlement-webhook-unsigned
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)settlement.*(?:webhook|callback|notify).*(?!.*(?:sign|verify|hmac))'
      - '(?i)(?:webhook|callback).*settlement.*(?!.*(?:signature|verify))'
      - '(?i)payment.*(?:complete|confirm).*(?:hook|callback).*(?!.*(?:sign))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 settlement webhook without signature verification"
    description: |
      Settlement confirmation webhooks must be signed to prevent forged
      settlement notifications. An attacker who can forge settlement
      callbacks can cause merchants to release goods without actual payment.
    remediation: |
      - Sign all settlement webhooks with PSP private key
      - Verify webhook signatures before processing settlement confirmations
      - Implement webhook replay protection with timestamps and nonces
      - Use asymmetric signatures for non-repudiation
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  - id: MEDUSA-AP2-PSP-003
    name: ap2-card-network-token-logging
    severity: HIGH
    category: data_protection
    patterns:
      - '(?i)log.*(?:pan|card.?number|account.?number|token)'
      - '(?i)(?:print|debug|console|logger).*(?:card|pan|account.?num|payment.?token)'
      - '(?i)(?:card|pan|payment).*(?:log|debug|trace|dump)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 payment token or card data in logs"
    description: |
      Logging payment tokens, card numbers, or account numbers violates
      PCI-DSS and creates credential exposure risk. Log aggregation systems
      are a high-value target and often have weaker access controls than
      payment processing systems.
    remediation: |
      - Never log raw payment tokens, card numbers, or PANs
      - Implement PCI-DSS compliant log redaction
      - Use masked references (last 4 digits only) in logs
      - Audit log pipelines for accidental credential exposure
    owasp_llm: "LLM02:2025"
    cwe: "CWE-200"
