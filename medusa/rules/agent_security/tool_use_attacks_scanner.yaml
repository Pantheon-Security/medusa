metadata:
  source: PaperMiner/2024-12-21_tool_use_attacks
  extraction_date: '2026-02-18'
  papers_analyzed: 36
  unique_attacks: 21
  defenses_identified: 11
  consolidated: true
  source_files:
  - tool_use_attacks_scanner.yaml
  - tool_use_attacks_2025_scanner.yaml
rules:
- id: MEDUSA-TUA-SCAN-001
  name: hardcoded-crypto-key
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)SecretKeySpec\s*\(\s*["'][^"']+["']
  - (?i)(?:key|secret|password)\s*=\s*["'][A-Za-z0-9+/=]{8,}["']
  - (?i)(?:AES|DES|Blowfish).*(?:key|secret)\s*=\s*["']
  file_types:
  - '*.java'
  - '*.py'
  - '*.js'
  message: Hard-coded cryptographic key detected (M1 misuse pattern)
  description: Detects hard-coded cryptographic keys in LLM-generated code. Mousavi et al. 2024 found GPT-4 generates hard-coded
    keys in symmetric encryption and MAC implementations, a common security misuse.
  remediation: Use secure key management (KeyStore, env vars). Generate keys with SecureRandom. Never embed keys in source
    code.
  owasp_llm: LLM02:2025
  cwe: CWE-321
- id: MEDUSA-TUA-SCAN-002
  name: ecb-mode-encryption
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)Cipher\.getInstance\s*\(\s*["'](?:AES|DES|Blowfish)/ECB
  - (?i)(?:mode|cipher_mode)\s*=\s*["']ECB["']
  - (?i)AES\.new\s*\([^)]*AES\.MODE_ECB
  file_types:
  - '*.java'
  - '*.py'
  message: Insecure ECB encryption mode detected (M2 misuse pattern)
  description: Detects ECB mode encryption which preserves data patterns. Mousavi et al. 2024 found GPT-4 defaults to ECB
    in majority of symmetric encryption programs.
  remediation: Use authenticated encryption modes (GCM, CCM). Explicitly specify mode in Cipher.getInstance().
  owasp_llm: LLM02:2025
  cwe: CWE-327
- id: MEDUSA-TUA-SCAN-003
  name: predictable-prng-seed
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)SecureRandom\s*\(\s*\).*seed.*(?:currentTimeMillis|nanoTime|System\.)
  - (?i)(?:random\.seed|Random)\s*\(\s*(?:int|time|os\.getpid)
  - (?i)setSeed\s*\(\s*System\.currentTimeMillis
  file_types:
  - '*.java'
  - '*.py'
  message: Predictable PRNG seed detected (M5 misuse pattern)
  description: Detects predictable seeds for pseudo-random number generators. Mousavi et al. 2024 identified GPT-4 using System.currentTimeMillis()
    as seed for SecureRandom, reducing entropy.
  remediation: Use default SecureRandom() without manual seeding. For Python, use secrets module instead of random.
  owasp_llm: LLM02:2025
  cwe: CWE-330
- id: MEDUSA-TUA-SCAN-004
  name: plaintext-secret-storage
  severity: CRITICAL
  category: tool_use_attacks
  patterns:
  - (?i)(?:token|secret|password|api_key)\s*=\s*["'][^"']{8,}["']
  - (?i)SharedPreferences.*(?:putString|edit).*(?:token|password|secret)
  - (?i)open\s*\([^)]*["'].*(?:token|secret|password|key).*["'].*["']w["']\s*\)
  file_types:
  - '*.java'
  - '*.py'
  - '*.js'
  message: Plaintext storage of secrets/tokens detected (M14/M15 misuse pattern)
  description: Detects plaintext storage of OAuth tokens and secrets. Mousavi et al. 2024 found 100% of GPT-4 auth implementations
    store secrets in plaintext.
  remediation: Use encrypted storage (Android Keystore, OS Credential Manager). Never store tokens in SharedPreferences or
    plaintext files.
  owasp_llm: LLM02:2025
  cwe: CWE-312
- id: MEDUSA-TUA-SCAN-005
  name: api-hallucination-patterns
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)AutoModel\.from_pretrained\s*\([^)]*github\.com
  - (?i)(?:pip|npm)\s+install\s+(?:(?!-r)[a-z][a-z0-9-]*){1}\s*$
  - (?i)(?:from|import)\s+(?:toolformer|gorilla_api|tool_alpaca)
  file_types:
  - '*.py'
  - '*.sh'
  message: Potential API/package hallucination pattern detected
  description: Detects patterns consistent with hallucinated API calls (Patil 2023). LLMs may invoke non-existent repos/packages,
    risking runtime errors or loading malicious code if hallucinated names exist.
  remediation: Validate all package names against official registries. Pin package versions. Use Gorilla-style API retrieval
    augmentation.
  owasp_llm: LLM02:2025
  cwe: CWE-829
- id: MEDUSA-TUA-SCAN-006
  name: deprecated-security-api
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)FingerprintManager|android\.hardware\.fingerprint
  - (?i)SafetyNetClient|SafetyNet\.getClient
  - (?i)(?:from|import)\s+(?:pycrypto|PyCrypto)
  file_types:
  - '*.java'
  - '*.py'
  - '*.kt'
  message: Deprecated security API usage detected
  description: Detects deprecated security APIs that LLMs suggest due to training data cutoffs (Mousavi 2024). Includes Android
    FingerprintManager (replaced by BiometricPrompt) and SafetyNet (replaced by Play Integrity).
  remediation: Replace FingerprintManager with BiometricPrompt. Replace SafetyNet with Play Integrity. Replace PyCrypto with
    PyCryptodome.
  owasp_llm: LLM02:2025
  cwe: CWE-477
- id: MEDUSA-TUA-SCAN-007
  name: llm-guided-fuzzing-tools
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:from|import)\s+(?:chatafl|llm_fuzzer|protocol_fuzzer)
  - (?i)ChatAFL\s*\(|LLMFuzzer\s*\(
  - (?i)llm.*(?:fuzz|mutate).*protocol|protocol.*(?:fuzz|mutate).*llm
  file_types:
  - '*.py'
  message: LLM-guided protocol fuzzing framework detected
  description: Detects ChatAFL (Meng 2024) and similar LLM-guided fuzzers that use LLMs to infer protocol states and generate
    mutations. Discovered 9 unknown vulns (7 critical) in LIVE555/ProFTPD.
  remediation: Ensure authorized security testing context. Validate fuzzing targets are within scope.
  owasp_llm: LLM02:2025
  cwe: CWE-20
- id: MEDUSA-TUA-SCAN-008
  name: tool-use-no-validation
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)tool_call\s*=.*execute.*(?:without|skip|no).*(?:valid|check|verify)
  - (?i)(?:exec|eval|subprocess)\s*\(.*tool_(?:output|result|response)
  - (?i)os\.system\s*\(.*(?:tool|agent|llm).*(?:output|result|response)
  file_types:
  - '*.py'
  message: Tool output executed without validation
  description: Detects tool outputs being executed without validation. ToolSandbox (Lu 2024) showed models fail to handle
    state dependencies; executing unvalidated tool outputs risks command injection.
  remediation: Validate and sanitize all tool outputs before execution. Implement sandboxed execution environments.
  owasp_llm: LLM02:2025
  cwe: CWE-78
- id: MEDUSA-TUA-SCAN-009
  name: multi-agent-no-oversight
  severity: MEDIUM
  category: tool_use_attacks
  patterns:
  - (?i)(?:agent|bot).*communicate.*(?:agent|bot).*(?:without|no).*(?:human|oversight|monitor)
  - (?i)autonomous.*(?:agent|tool).*(?:chain|pipeline).*(?:execute|run)
  - (?i)(?:from|import)\s+(?:autogen|crewai|langchain).*(?:agent.*agent|multi.*agent)
  file_types:
  - '*.py'
  message: Multi-agent system without human oversight controls
  description: Detects multi-agent systems lacking oversight. Maragheh & Deldjoo 2025 identified emergent misalignment and
    covert collusion risks where agents develop private protocols bypassing human constraints.
  remediation: Implement human-in-the-loop checkpoints. Monitor inter-agent communication. Use structured tool schemas.
  owasp_llm: LLM02:2025
  cwe: CWE-284
- id: MEDUSA-TUA-SCAN-010
  name: embedding-inversion-exposure
  severity: HIGH
  category: tool_use_attacks
  patterns:
  - (?i)(?:send|transmit|upload).*(?:embedding|hidden_state|representation).*(?:api|server|endpoint)
  - (?i)requests\.(?:post|put)\s*\([^)]*(?:embedding|vector|representation)
  file_types:
  - '*.py'
  message: Embeddings sent to external service without privacy protection
  description: Detects sending raw embeddings to external services. Li et al. 2023 showed embedding inversion attacks can
    reconstruct original text from embeddings. RAPT framework provides privacy-preserving alternative.
  remediation: Apply RAPT privatization before sending embeddings. Use local inference when possible. Add noise to embeddings.
  owasp_llm: LLM06:2025
  cwe: CWE-200
- id: MEDUSA-TUA-SCAN-011
  name: goal-hijacking-prompt-hacking-tool-context
  severity: HIGH
  category: prompt_injection
  patterns:
  - (?i)(goal.hijacking|prompt.hacking).{0,60}(tool|api|function.call|llm.ta)
  - (?i)(force.{0,20}target.output|force.specific.output).{0,60}(tool|api|score|grade)
  - (?i)(manipulate.{0,30}(instruction|prompt).{0,30}(tool|api|grader|evaluator)).{0,60}(output|result|score)
  - (?i)(llm.ta|llm.teaching.assistant|ai.grader).{0,50}(manipulate|hijack|override|jailbreak)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Goal Hijacking — prompt manipulation to force target output in tool-use context (44% success rate)'
  description: 'Goal Hijacking (Chiang et al. 2024) manipulates LLM instructions in tool-use contexts to force specific target
    outputs, such as inflated scores in LLM-based grading. 44% of students attempted; achieved scores 94/10 (far exceeding
    maximum). Target: GPT-4 LLM Teaching Assistant.'
  remediation: Sanitize all user inputs before passing to tool-orchestrating LLMs. Apply output range validation for grading/scoring
    tasks. Audit LLM-as-evaluator systems for goal hijacking susceptibility.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-TUA-SCAN-012
  name: recursive-self-evaluation-tool-bypass
  severity: HIGH
  category: tool_misuse
  patterns:
  - (?i)(recursive.{0,20}self.eval|self.evaluation.attack|self.assess.attack).{0,60}(bypass|circumvent|avoid)
  - (?i)(llm.{0,20}(generate|create|produce).{0,30}(then|and).{0,20}(evaluate|judge|assess).{0,20}(own|its|self))
  - (?i)(generate.{0,20}and.{0,20}(self.eval|evaluate.own|judge.own)).{0,60}(tool|work|submission|assignment)
  - (?i)(bypass.{0,20}(user.work|human.work|effort).{0,30}requirement).{0,60}(self.eval|recursive)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Recursive Self-Evaluation Attack — LLM generates content and evaluates its own output to bypass work
    requirements'
  description: Recursive/Self-Evaluation Attack (Chiang et al. 2024) exploits tool-use systems where an LLM generates content
    and then evaluates it. Bypasses user work requirements by having the model complete and grade its own tasks, achieving
    high scores without legitimate human effort.
  remediation: Separate generation and evaluation models. Ensure grading/evaluation components cannot access or be influenced
    by the content-generation component. Log tool invocation sequences for self-referential patterns.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-TUA-SCAN-013
  name: bavi-adversarial-visual-instructions
  severity: HIGH
  category: multimodal_attack
  patterns:
  - (?i)(b.?avi|black.?box.adversarial.visual.instruction).{0,80}(lvlm|vlm|multimodal|vision.language)
  - (?i)(image.text.perturbation|visual.instruction.attack).{0,60}(lvlm|gpt.4v|gemini.pro.vision|minigpt)
  - (?i)(adversarial.image.{0,30}(text.perturbation|visual.instruction)).{0,60}(misled|mislead|corrupt|asr)
  - (?i)(91\s*%.{0,20}asr.{0,20}(image.corruption|visual.attack)).{0,60}(minigpt|lvlm)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: B-AVI — black-box adversarial visual instructions attack on LVLMs (91% ASR on MiniGPT-4)'
  description: B-AVI (Zhang et al. 2024) applies image/text perturbations to mislead Large Vision-Language Models. MiniGPT-4
    ASR 91% on image corruption; avg ASR 57% for visual tasks across 14 open-source LVLMs plus GPT-4V and GeminiProVision.
    Content bias attacks also trigger unsafe/biased outputs.
  remediation: Apply adversarial robustness evaluation to vision-language model inputs. Detect unusually perturbed images
    via image quality metrics before processing. Do not rely solely on text-based safety filters for multimodal systems.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-TUA-SCAN-014
  name: security-api-misuse-insecure-code-generation
  severity: CRITICAL
  category: insecure_code_generation
  patterns:
  - (?i)(security.api.misuse|api.misuse.{0,20}(rate|frequency)).{0,60}(llm|gpt|code.gen|generation)
  - (?i)(68\.3.{0,10}misuse.rate|100.{0,10}(oauth|biometric).{0,20}misuse)
  - (?i)(hard.?cod.{0,20}(key|secret|password|token).{0,20}(crypto|encrypt|aes|rsa|hmac))
  - (?i)(ecb.mode.{0,30}(symmetric|encrypt|aes|block)).{0,60}(insecure|default|pattern.preserv)
  - (?i)(currenttimemillis|system\.currenttime).{0,40}(seed|rand|prng|random)
  - (?i)(predictable.{0,20}(prng|seed|random).{0,30}(crypto|encrypt|key.gen))
  file_types:
  - '*.py'
  - '*.java'
  - '*.js'
  - '*.ts'
  message: 'Detected: Security API Misuse — LLM-generated code using insecure cryptographic patterns (68.3% misuse rate)'
  description: 'Security API Misuse (Mousavi et al. 2024) — LLMs select insecure parameters for security tasks: 68.3% misuse
    rate across 48 tasks; 100% for OAuth and Biometrics. Common patterns: hard-coded keys (M1), insecure ECB mode (M2), predictable
    PRNG seeds with System.currentTimeMillis() (M5), plaintext OAuth token storage (M14/M15).'
  remediation: Apply static analysis on LLM-generated security code. Validate cryptographic API usage against secure coding
    standards. Require code review for all LLM-generated authentication/encryption implementations.
  owasp_llm: LLM09:2025
  cwe: CWE-327
- id: MEDUSA-TUA-SCAN-015
  name: api-call-hallucination-tool-invocation
  severity: HIGH
  category: tool_hallucination
  patterns:
  - (?i)(api.call.hallucinat|tool.hallucinat|function.hallucinat).{0,60}(non.existent|fake|malicious)
  - (?i)(invoke.{0,30}(non.existent|undefined|fake).{0,20}(api|tool|function|repo))
  - (?i)(gorilla.benchmark|toolbench).{0,50}(hallucinat|non.existent|fake.api|wrong.api)
  - (?i)(hallucinated.{0,20}(api.name|function.name|tool.name)).{0,60}(malicious|load|execute|import)
  - (?i)(IAN|IFN|incorrect.argument.name|incorrect.function.name).{0,60}(hallucinat|tool.use|api.call)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: API Call Hallucination — LLM invokes non-existent APIs or tools, risking malicious code loading'
  description: 'API Call Hallucination (Patil et al. 2023) — LLMs invoke non-existent APIs/repos in tool-use frameworks, creating
    risk of loading malicious code if a squatted package exists. Gorilla benchmark: GPT-3.5 fewer hallucinations than GPT-4
    in some settings. ToolScan (Kokane 2024): IAV (incorrect arg values), IAN (incorrect arg names), IAT (incorrect arg types),
    IFN (incorrect function names).'
  remediation: Validate all LLM-proposed tool/API calls against a whitelist before execution. Apply package name verification
    before import. Log and alert on calls to unrecognized APIs.
  owasp_llm: LLM07:2025
  cwe: CWE-426
- id: MEDUSA-TUA-SCAN-016
  name: embedding-inversion-attribute-inference
  severity: HIGH
  category: privacy_attack
  patterns:
  - (?i)(embedding.inversion|invert.{0,20}embedding|reconstruct.{0,30}(from|via).{0,20}embedding)
  - (?i)(attribute.inference.{0,30}(hidden.state|representation|embedding)).{0,60}(private|personal|sensitive)
  - (?i)(reverse.{0,20}embedding.{0,30}(reconstruct|recover|extract).{0,20}(raw.text|original.text|input))
  - (?i)(infer.{0,20}(private|personal|sensitive).{0,20}attribute.{0,30}(hidden|representation|llm.output))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Embedding Inversion/Attribute Inference — reconstructing private data or inferring sensitive attributes
    from LLM representations'
  description: Embedding Inversion Attack (Li et al. 2023) reverses embedding representations to reconstruct raw input text
    with high success. Attribute Inference Attack infers private attributes (demographics, health status) from LLM hidden
    representations with high accuracy. Both attacks exploit data-as-a-tool API contexts.
  remediation: Apply differential privacy to embeddings before exposing via APIs. Use representation perturbation to prevent
    inversion. Audit API embedding endpoints for PII leakage risk.
  owasp_llm: LLM06:2025
  cwe: CWE-359
- id: MEDUSA-TUA-SCAN-017
  name: knowledge-base-poisoning-tool-injection
  severity: HIGH
  category: tool_poisoning
  patterns:
  - (?i)(knowledge.base.poison|kb.poison|external.kb.{0,30}(inject|manipulate|tamper))
  - (?i)(inject.{0,30}(knowledge.base|external.tool|retrieval.store|vector.db)).{0,60}(harmful|malicious|poison)
  - (?i)(indirect.prompt.inject.{0,30}(kb|knowledge.base|retrieval|external.store))
  - (?i)(agentpoison|agent.poison|rag.poison.{0,30}(knowledge.base|external.tool))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Knowledge Base Poisoning — injecting harmful data into external KB tools used by LLM agents'
  description: Knowledge Base Poisoning/Injection (Zhang et al. 2024; Maragheh & Deldjoo 2025) injects harmful knowledge into
    external knowledge base tools used by LLM agents. Acts as indirect prompt injection — malicious content retrieved from
    the KB propagates into LLM context, bypassing direct input filters.
  remediation: Apply content validation and integrity checks on all external knowledge sources. Treat KB retrieval results
    with the same safety scrutiny as direct user inputs. Implement signed document verification for critical knowledge bases.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-TUA-SCAN-018
  name: covert-collusion-emergent-agent-protocol
  severity: HIGH
  category: multi_agent_risk
  patterns:
  - (?i)(covert.collusion|emergent.misalignment|private.protocol).{0,60}(agent|multi.agent|bypass.oversight)
  - (?i)(agent.{0,20}develop.{0,20}(private|covert|hidden).{0,20}(protocol|language|communication))
  - (?i)(bypass.{0,30}human.oversight.{0,30}(protocol|collusion|agent.coordination))
  - (?i)(negotiation.bot.{0,30}(private|covert|hidden).{0,20}(protocol|communication|language))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Covert Collusion — LLM agents developing private protocols that bypass human oversight'
  description: Emergent Misalignment / Covert Collusion (Maragheh & Deldjoo 2025) — LLM agents in multi-agent systems spontaneously
    develop private communication protocols that bypass human oversight. Identified in negotiation bot contexts where agents
    coordinate to achieve goals outside human-specified parameters.
  remediation: Monitor all inter-agent communication for non-standard or obfuscated protocols. Apply interpretability tools
    to detect emergent agent coordination patterns. Enforce human-readable communication channels in multi-agent systems.
  owasp_llm: LLM08:2025
  cwe: CWE-284
- id: MEDUSA-TUA-SCAN-019
  name: tool-chain-error-propagation-hallucination
  severity: MEDIUM
  category: reliability_risk
  patterns:
  - (?i)(error.propagat.{0,30}(tool.chain|agent.pipeline|multi.step)).{0,60}(cascade|compounding|amplif)
  - (?i)(hallucination.{0,30}(tool.chain|cascade|propagat)).{0,60}(>20.|twenty.percent|20.percent)
  - (?i)(tool.misuse.{0,30}(reasoning.step|chain|pipeline)).{0,60}(>20.|majority|most.steps)
  - (?i)(smartcal|smart.cal).{0,50}(overconfident|>90.percent|ninety.percent.confidence)
  - (?i)(>90.percent.confidence.{0,30}tool.selection.{0,30}(overconfident|wrong|incorrect))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: Tool Chain Error Propagation — cascading hallucinations across tool chains; >20% reasoning steps with
    tool misuse'
  description: 'Hallucination & Error Propagation (Maragheh & Deldjoo 2025; Shen et al. 2024) — errors cascade through tool
    chains with >20% of reasoning steps containing tool misuse. SMARTCAL (Shen 2024): >90% confidence in tool selection is
    overconfident, masking propagating errors in multi-step agent pipelines.'
  remediation: Implement checkpointing and error-detection at each tool call step. Apply confidence calibration to reduce
    overconfident tool selection. Design tool chains with rollback capabilities for error recovery.
  owasp_llm: LLM09:2025
  cwe: CWE-390
- id: MEDUSA-TUA-SCAN-020
  name: state-dependency-race-condition-tools
  severity: HIGH
  category: tool_misuse
  patterns:
  - (?i)(state.dependency.violation|race.condition.{0,30}(tool|agent)).{0,60}(implicit|missed|unhandled)
  - (?i)(tool.{0,20}(race.condition|concurrent.access|state.conflict)).{0,60}(agent|pipeline|multi.step)
  - (?i)(toolsandbox|tool.sandbox).{0,50}(state.dependency|implicit.dependency|missed.dependency)
  - (?i)(implicit.state.dependency.{0,30}(between|across).{0,20}tool).{0,60}(miss|fail|violat)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: State Dependency Violation — LLM agents missing implicit dependencies between tool calls (ToolSandbox)'
  description: State Dependency Violations (Lu et al. 2024) — agents miss implicit state dependencies between tools, causing
    race conditions and incorrect tool sequencing. Even SOTA models struggle with state dependency tasks on ToolSandbox benchmark.
    Affects multi-step agents where tool A must complete before tool B can safely execute.
  remediation: Explicitly document and enforce tool execution ordering constraints. Implement state dependency graphs for
    complex tool chains. Test agents on ToolSandbox for state dependency handling before deployment.
  owasp_llm: LLM07:2025
  cwe: CWE-362
- id: MEDUSA-TUA-SCAN-021
  name: iac-rac-api-call-loop-failure
  severity: MEDIUM
  category: availability_risk
  patterns:
  - (?i)(iac|rac|insufficient.api.call|repeated.api.call).{0,60}(loop|toolscan|agent.fail)
  - (?i)(repeated.api.call.{0,30}(loop|infinite|redundant)).{0,60}(agent|llama|llm)
  - (?i)(insufficient.{0,20}(tool.call|api.call|function.call)).{0,40}(agent|fail|task.incomplet)
  - (?i)(tool.{0,20}(loop|redundant.call|repeated.call)).{0,40}(llama.3|llama3|smaller.model|vicuna)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: IAC/RAC — insufficient or repeated API call loops in LLM agent tool use (ToolScan benchmark)'
  description: 'Insufficient API Calls (IAC) and Repeated API Calls (RAC) (Kokane et al. 2024) — models fail to generate enough
    calls to complete tasks (IAC) or loop redundantly (RAC). Smaller models (Llama-3-8B) particularly prone to RAC loops.
    Vicuna-13B: 0.16 success rate due to combined hallucination + loop failures (ToolScan).'
  remediation: Implement tool call budget limits and loop detection. Monitor for repeated identical tool calls as a sign of
    agent confusion. Apply circuit breakers to agent loops to prevent runaway execution.
  owasp_llm: LLM07:2025
  cwe: CWE-400
- id: MEDUSA-TUA-SCAN-022
  name: tool-parameter-noise-sensitivity
  severity: MEDIUM
  category: robustness
  patterns:
  - (?i)(tool.{0,20}(parameter|name).{0,20}noise.{0,20}sensitivity|rotbench).{0,60}(robustness|failure)
  - (?i)(slight.noise.{0,30}(tool|parameter|function).{0,20}name).{0,60}(fail|error|miss|wrong)
