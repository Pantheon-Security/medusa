metadata:
  source: PaperMiner/2024-12-21_agent_security
  extraction_date: '2026-02-18'
  papers_analyzed: 40
  attacks_identified: 55
  defenses_identified: 25
  benchmarks:
  - TAMAS/ARIA
  - CVE-Bench
  - PACEbench
  - NYU CTF Bench
  - AgentDojo
  consolidated: true
  source_files:
  - agent_security_scanner.yaml
  - agent_security_2025_scanner.yaml
rules:
- id: MEDUSA-AGT-SCAN-001
  name: agent-no-message-authentication
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:messages?|communication)\.(?:send|post|publish)\((?!.*(?:sign|authenticate|verify|hmac)).*\)
  - (?i)(?:blackboard|shared_memory|message_bus)\.(?:write|put|post)\(
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Inter-agent message sent without authentication or signing
  description: Detects agent communication that lacks message authentication. Without signing, an adversary can forge or tamper
    with inter-agent messages (Nakamura 2025 - Communication Poisoning, 100% info leakage ASR).
  remediation: Implement message authentication (HMAC, digital signatures) for inter-agent communication. Use Terrarium-style
    blackboard architecture with message interception and sanitization.
  owasp_llm: LLM01:2025
  cwe: CWE-345
- id: MEDUSA-AGT-SCAN-002
  name: agent-no-permission-tiering
  severity: HIGH
  category: agent_security
  patterns:
  - '(?i)def\s+(?:execute_tool|run_action|call_function|invoke_tool)\s*\(.*\)\s*:'
  - (?i)tool_call\s*=.*(?:execute|run|call)\(
  file_types:
  - '*.py'
  message: Agent tool execution without permission level checks
  description: Detects agent code that executes tool calls without checking permission levels. Krawiecka 2025 identifies Unsafe
    Delegation Escalation where sub-agents gain elevated privileges. Shi 2025 B-I-P Framework recommends T>R safety margin
    checks.
  remediation: Implement tiered permission levels (L0=read-only, L1=limited-write, L2=full-access). Use B-I-P Framework Safety
    Margin Ratio (SMR) checks before tool execution.
  owasp_llm: LLM01:2025
  cwe: CWE-269
- id: MEDUSA-AGT-SCAN-003
  name: agent-no-output-review
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:code|output|result)\s*=\s*(?:agent|llm|model)\..{0,50}\n.*(?:exec|eval|subprocess|os\.system)\(
  - (?i)def\s+(?:generate_code|create_code|write_code).*\n(?:(?!(?:review|check|validate|sanitize)).)*.{0,200}(?:exec|eval|write_file)\(
  file_types:
  - '*.py'
  message: Agent-generated code executed without review/testing
  description: Detects patterns where agent-generated code is executed directly without a review or testing step. Bowers 2025
    shows 92.48%-100% ASR for code injection in Coder-Tester without Security Analysis Agent.
  remediation: Implement Coder-Reviewer-Tester (CRT) architecture with a Security Analysis Agent. Never execute agent-generated
    code without sandboxed review.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-AGT-SCAN-004
  name: agent-no-delegation-validation
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:delegate|forward|pass)_(?:task|request|query)\s*\(
  - (?i)sub_agent\.(?:execute|run|process)\(
  file_types:
  - '*.py'
  - '*.js'
  message: Task delegation to sub-agent without intent validation
  description: Detects task delegation to sub-agents without validating the delegation against the original user intent. This
    enables Goal Drift (Krawiecka 2025) and Confused Deputy (Shi 2025) attacks.
  remediation: Validate delegated tasks against original user intent. Implement B-I-P Belief→Intention→Permission checks.
    Use MELON-style masked re-execution comparison.
  owasp_llm: LLM01:2025
  cwe: CWE-441
- id: MEDUSA-AGT-SCAN-005
  name: no-agent-communication-monitoring
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:multi_agent|swarm|crew|team|group)\s*=\s*(?:MultiAgent|Swarm|Crew|AgentTeam|AgentGroup)\(
  - (?i)(?:autogen|crewai|langgraph|metagpt)\.(?:Agent|GroupChat|Team)\(
  file_types:
  - '*.py'
  message: Multi-agent system instantiation without communication monitoring
  description: Detects multi-agent framework usage without evidence of communication monitoring. Nakamura 2025 (Terrarium)
    shows centralized monitoring is essential for detecting collusion, Byzantine agents, and communication poisoning.
  remediation: Implement centralized communication monitoring (Terrarium Blackboard pattern). Log all inter-agent messages.
    Use TAMAS/ARIA scoring to detect anomalous agent behavior.
  owasp_llm: LLM06:2025
  cwe: CWE-778
- id: MEDUSA-AGT-SCAN-006
  name: raw-external-content-to-agent
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:web_content|page_text|scraped_data|crawled|fetched_content)\s*=.*\n.*(?:agent|llm|model)\.
  - (?i)(?:browser|playwright|selenium|requests)\..*\n.*(?:prompt|messages|context)\s*[+=]
  file_types:
  - '*.py'
  - '*.js'
  message: Raw external web content fed to agent without filtering
  description: Detects web content being fed directly to agents without injection filtering. Liu 2025 reports 70% ASR for
    Environmental Injection Attacks (EIA) on web agents via manipulated page content.
  remediation: Filter web content before agent processing. Strip hidden elements, check for known injection patterns. Implement
    AegisAgent-style Input Sanitizer.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-AGT-SCAN-007
  name: agent-no-response-guard
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:response|completion|result)\.(?:choices|content|text)\[0\]
  - (?i)return\s+(?:response|completion|agent_output)\.(?:content|text|message)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Agent response returned without output validation
  description: Detects agent responses being returned or used without output validation guards. Missing output guards allow
    credential leaks, PII exposure, and system prompt leakage in agent responses.
  remediation: Add output guards to check for credential material, PII, system prompt leakage, and injection success markers.
    Use CRT architecture with Security Analysis Agent.
  owasp_llm: LLM02:2025
  cwe: CWE-200
- id: MEDUSA-AGT-SCAN-008
  name: agent-eval-exec-user-input
  severity: CRITICAL
  category: agent_security
  patterns:
  - (?i)eval\(.*(?:user_input|query|prompt|request).*\)
  - (?i)exec\(.*(?:user_input|query|prompt|request).*\)
  - (?i)subprocess\.(?:call|run|Popen)\(.*(?:user_input|query|prompt).*\)
  file_types:
  - '*.py'
  message: Agent executes user-controlled input via eval/exec/subprocess
  description: Detects direct execution of user-controlled input via eval(), exec(), or subprocess. This is the most critical
    vulnerability for code injection (Bowers 2025, Shayegani 2023 - SQL injection via agent 60% ASR).
  remediation: Never eval/exec user input directly. Use parameterized queries, sandboxed execution environments (PentestMCP-style
    container isolation), and allowlisted tool patterns.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-AGT-SCAN-009
  name: agent-no-tool-isolation
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)(?:tool|function)_call\s*=.*\n.*(?:os\.|subprocess\.|shutil\.|pathlib\.)
  - (?i)agent\.(?:execute|run)_tool\(.*\)\s*$
  file_types:
  - '*.py'
  message: Agent tool execution without sandboxing or isolation
  description: Detects agent tool calls executed without evidence of sandboxing. Ezetta 2025 (PentestMCP) demonstrates that
    MCP client-host-server isolation prevents system compromise via tool misuse.
  remediation: Run agent tool executions in isolated containers or sandboxes. Use MCP client-host-server architecture for
    tool isolation.
  owasp_llm: LLM06:2025
  cwe: CWE-693
- id: MEDUSA-AGT-SCAN-010
  name: agent-no-belief-state-validation
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:memory|state|context|belief)\.(?:update|set|write)\(.*(?:tool_output|api_response|external).*\)
  - (?i)(?:memory|state)\.(?:add|append|store)\(.*(?:retrieved|fetched|scraped).*\)
  file_types:
  - '*.py'
  message: Agent belief state updated from external data without validation
  description: Detects agent memory/state being updated directly from external data sources without validation. Shi 2025 identifies
    Source Poisoning attacks that corrupt agent belief states via adversarial external data.
  remediation: Validate external data before updating agent state. Implement B-I-P Belief trust scoring. Use MemGuard-style
    failure-aware exemplars.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-AGT-SCAN-011
  name: no-model-extraction-defense
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:logits?|probabilities|confidence|softmax)\s*=.*(?:model|agent|llm)\.(?:predict|forward|generate)
  - (?i)return.*(?:logits?|probabilities|output_distribution)
  file_types:
  - '*.py'
  message: Model logits/probabilities exposed without extraction defense
  description: Detects model output distributions being returned without protection. Atli 2020 shows Knockoff Nets achieve
    0.97x model performance recovery. Without OOD detection, model IP is vulnerable.
  remediation: Implement OOD query detection (Atli 2020 - 99% detection accuracy). Do not expose raw logits/probabilities.
    Add rate limiting and query pattern monitoring.
  owasp_llm: LLM10:2025
  cwe: CWE-200
- id: MEDUSA-AGT-SCAN-012
  name: agent-no-hallucination-check
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:agent|llm|model)\.(?:generate|complete|chat)\(.{0,100}\n.*(?:execute|run|apply|deploy)\(
  file_types:
  - '*.py'
  message: Agent output used in execution without hallucination verification
  description: Detects agent output being used for execution without hallucination checking. CRAKEN (Shao 2025) and D-CIPHER
    (Udeshi 2025) show significant improvement with hallucination graders.
  remediation: Implement hallucination grading (CRAKEN-style HallucinationGrader) before executing agent-generated plans or
    code.
  owasp_llm: LLM02:2025
  cwe: CWE-1039
- id: MEDUSA-AGT-SCAN-013
  name: agent-rag-no-retrieval-sanitization
  severity: HIGH
  category: rag_security
  patterns:
  - (?i)(?:retrieved|chunks|documents?)\s*=\s*(?:vectordb|chroma|pinecone|weaviate|qdrant|faiss)\.
  - (?i)(?:retriever|search)\.(?:query|search|similarity_search)\(.*\)\s*\n.*(?:prompt|context)
  file_types:
  - '*.py'
  message: RAG retrieval results passed to agent without sanitization
  description: Detects RAG patterns where retrieved documents feed directly into agent context without sanitization. Liu 2025
    reports PoisonedRAG achieves 90% ASR and BadRAG 74.6% rejection rate via knowledge base poisoning.
  remediation: Sanitize retrieved content before adding to agent context. Implement content verification and anomaly detection
    on retrieved documents.
  owasp_llm: LLM08:2025
  cwe: CWE-20
- id: MEDUSA-AGT-SCAN-014
  name: no-crt-architecture
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:code_agent|coding_agent|coder)\s*=.*Agent\(
  file_types:
  - '*.py'
  message: Code generation agent without Coder-Reviewer-Tester architecture
  description: Detects code generation agent instantiation without evidence of a CRT (Coder-Reviewer-Tester) pipeline. Bowers
    2025 shows CRT reduces code injection ASR from 100% to 1.42%.
  remediation: Implement CRT architecture with Security Analysis Agent for code review. Test generated code in sandboxed environment
    before execution.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-AGT-SCAN-015
  name: no-aegis-defense-pipeline
  severity: MEDIUM
  category: agent_security
  patterns:
  - (?i)(?:multimodal_agent|vision_agent|image_agent)\s*=.*Agent\(
  file_types:
  - '*.py'
  message: Multimodal agent without AegisAgent-style defense pipeline
  description: Detects multimodal agent instantiation without defense pipeline. Wang 2025 (AegisAgent) achieves 85% detection
    accuracy and 30% ASR reduction against multimodal prompt injection.
  remediation: Implement AegisAgent-style Input Sanitizer + Consistency Verifier + Robust Reasoner pipeline for multimodal
    agent inputs.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-AGT-SCAN-016
  name: hardcoded-api-key-in-agent
  severity: CRITICAL
  category: agent_security
  patterns:
  - (?i)api_key\s*=\s*['"](?:sk-[a-zA-Z0-9]{32,}|sk-ant-[a-zA-Z0-9]{32,})['"]
  - (?i)(?:openai|anthropic|cohere)_api_key\s*=\s*['"][A-Za-z0-9_\-]{20,}['"]
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Hardcoded API key found in agent code
  description: Detects hardcoded API keys (OpenAI sk-, Anthropic sk-ant-) in source code. Enables credential theft and unauthorized
    model access.
  remediation: Store API keys in environment variables or secret managers. Never hardcode credentials in source files.
  owasp_llm: LLM06:2025
  cwe: CWE-798
- id: MEDUSA-AGT-SCAN-017
  name: dangerous-code-execution-enabled
  severity: CRITICAL
  category: agent_security
  patterns:
  - (?i)Python(?:Ast)?REPL(?:Tool)?\s*\([^)]*allow_dangerous_code\s*=\s*True
  - (?i)code_execution_config\s*=\s*\{[^}]*['"]use_docker['"]\s*:\s*False
  file_types:
  - '*.py'
  message: Agent configured for dangerous unsandboxed code execution
  description: Detects LangChain PythonREPL with allow_dangerous_code=True or AutoGen with Docker disabled. Allows agent-generated
    code to execute directly on host without isolation.
  remediation: Always sandbox code execution (Docker containers, gVisor, PentestMCP-style isolation). Never set allow_dangerous_code=True
    in production.
  owasp_llm: LLM01:2025
  cwe: CWE-250
- id: MEDUSA-AGT-SCAN-018
  name: unrestricted-agent-delegation
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)allow_delegation\s*=\s*True
  - (?i)can_delegate\s*=\s*True
  file_types:
  - '*.py'
  message: Agent delegation enabled without restrictions
  description: Detects CrewAI/similar frameworks with unrestricted delegation. Krawiecka 2025 shows Unsafe Delegation Escalation
    where sub-agents gain elevated privileges via implicit permission inheritance.
  remediation: Restrict delegation with explicit permission boundaries. Implement B-I-P safety margin checks on delegated
    tasks.
  owasp_llm: LLM01:2025
  cwe: CWE-269
- id: MEDUSA-AGT-SCAN-019
  name: shell-tool-direct-usage
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)ShellTool\s*\(
  - (?i)BashProcess\s*\(
  - (?i)TerminalTool\s*\(
  file_types:
  - '*.py'
  message: Direct shell/terminal tool given to agent without isolation
  description: Detects agents given direct shell access tools (LangChain ShellTool, BashProcess). Enables arbitrary command
    execution without sandboxing.
  remediation: Use containerized tool execution (PentestMCP-style isolation). Restrict shell access with allowlisted commands
    only.
  owasp_llm: LLM01:2025
  cwe: CWE-78
- id: MEDUSA-AGT-SCAN-020
  name: unrestricted-file-toolkit
  severity: HIGH
  category: agent_security
  patterns:
  - (?i)FileManagementToolkit\s*\((?![^)]*root_dir)
  file_types:
  - '*.py'
  message: FileManagementToolkit used without root_dir restriction
  description: Detects LangChain FileManagementToolkit instantiated without root_dir parameter. Without path restriction,
    agent can read/write/delete any file on the filesystem.
  remediation: Always specify root_dir parameter to restrict file operations to a sandboxed directory.
  owasp_llm: LLM01:2025
  cwe: CWE-552
- id: MEDUSA-AGT-021
  name: llm-orchestrated-interpreter-combo
  severity: CRITICAL
  category: agent_ransomware
  patterns:
  - (?i)(subprocess|exec|eval|os\.system|os\.execute).*lua
  - (?i)lua.*interpreter.*llm|llm.*lua.*interpreter
  - (?i)(lupa|lua|luajit).*in.?memory.*exec
  - (?i)ctypes.*load.*memory|mmap.*exec.*payload
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: LLM + embedded interpreter combination enabling in-memory payload execution (Ransomware 3.0 pattern)'
  description: Ransomware 3.0 uses an LLM to dynamically synthesize polymorphic code executed via an embedded interpreter
    (Lua). Achieved 65-95% phase success rates.
  remediation: Sandbox interpreter calls, restrict dynamic code execution, enforce allowlists for LLM-callable functions
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-AGT-022
  name: agent-infinite-loop-injection-pattern
  severity: HIGH
  category: malfunction_amplification
  patterns:
  - (?i)repeat.{0,30}(previous|last|prior).{0,20}action.{0,20}(\d+|hundred|times)
  - (?i)(loop|cycle|repeat).{0,40}(n|100|1000).{0,20}times.{0,20}(inject|payload|instruction)
  - (?i)force.{0,20}agent.{0,20}(loop|repeat|cycle)
  - (?i)(infinite|endless).{0,20}(loop|cycle).{0,20}(inject|attack|trigger)
  file_types:
  - '*.py'
  - '*.md'
  - '*.txt'
  message: 'Detected: Infinite loop injection pattern targeting agent ReAct cycle (Malfunction Amplification)'
  description: 'Breaking Agents paper: infinite loop injections achieve 90% ASR on Gmail/CSV agents by trapping ReAct reasoning
    in endless cycles.'
  remediation: Implement iteration limits, detect repeated identical actions, add circuit breakers to agent loops
  owasp_llm: LLM04:2025
  cwe: CWE-835
- id: MEDUSA-AGT-023
  name: chat-template-role-tag-forgery
  severity: HIGH
  category: chat_inject
  patterns:
  - (?i)<\|im_start\|>\s*(system|user|assistant)
  - (?i)<\|im_end\|>
  - (?i)\[INST\].*\[/INST\]
  - (?i)<user_tag>|<ass_tag>|<\|eot_id\|>
  - (?i)(tool_output|tool_result|function_result).*(<system|<user|<assistant)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  message: 'Detected: Chat template role-tag forgery in tool output or prompt construction (ChatInject)'
  description: ChatInject achieved 52.33% ASR on InjecAgent by injecting model-specific chat template tokens into tool outputs,
    tricking agents into treating them as high-priority system instructions.
  remediation: Sanitize all tool outputs before injecting into message context. Strip model-specific control tokens from untrusted
    inputs.
  owasp_llm: LLM01:2025
  cwe: CWE-79
- id: MEDUSA-AGT-024
  name: unsanitized-tool-output-in-execution-context
  severity: HIGH
  category: execution_manager_hijack
  patterns:
  - (?i)(app|tool|plugin)_output.*context.*llm|llm.*context.*append.*(app|tool|plugin)_output
  - (?i)execution_manager.*format.*{.*tool_result
  - (?i)hub_prompt.*\+.*untrusted|untrusted.*\+.*hub_prompt
  - (?i)(raw|unfiltered|unsanitized).*tool.{0,20}output.{0,20}(llm|model|context)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Raw/unsanitized tool output appended directly to execution manager LLM context (Execution Manager Hijack)'
  description: 'ACE paper (NDSS 2026): malicious app outputs injected directly into execution manager LLM context enable flow
    disruption (DoS) and cross-app interference attacks.'
  remediation: Sanitize all app/tool outputs before feeding to orchestrator LLM. Use structured output schemas and reject
    free-text from untrusted apps.
  owasp_llm: LLM02:2025
  cwe: CWE-116
- id: MEDUSA-AGT-025
  name: retrieval-to-state-change-without-validation
  severity: HIGH
  category: agent_poison
  patterns:
  - (?i)(retrieve|search|get|fetch).{0,60}(delete|drop|send_money|transfer|update_password|create_user)
  - (?i)(rag|memory|knowledge_base).{0,40}(exec|execute|run|call).{0,40}(delete|drop|send|transfer)
  - (?i)(retrieved_docs?|context_chunks?|memory_items?).*tool_call.*(delete|drop|destroy)
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Direct coupling of retrieval/RAG output to destructive action without human validation (AgentPoison
    vector)'
  description: AgentPoison achieved 72.6% ASR on EHRAgent by poisoning knowledge bases with hidden tool execution instructions
    retrieved and actioned without validation.
  remediation: Add human-in-the-loop or intent validation between retrieval and destructive/sensitive actions. Never execute
    tool calls embedded in retrieved content.
  owasp_llm: LLM08:2025
  cwe: CWE-285
- id: MEDUSA-AGT-026
  name: no-information-flow-control
  severity: MEDIUM
  category: privilege_escalation
  patterns:
  - (?i)(user_input|external_content|tool_result).{0,60}system_prompt.*format
  - (?i)f['"].*{(user_input|external|untrusted|tool_output)}.*['"].*system
  - (?i)prompt.*=.*f['"].*{.*content.*}.*instruction
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: 'Detected: Untrusted data mixed into system/control-flow prompt without IFC (Information Flow Control)'
  description: Lack of IFC allows untrusted data (tool results, user input) to contaminate privileged planning/control channels,
    enabling privilege escalation attacks.
  remediation: 'Implement IFC: clearly separate trusted (system) and untrusted (user/tool) data channels. Use Progent-style
    privilege scoping.'
  owasp_llm: LLM01:2025
  cwe: CWE-668
- id: MEDUSA-AGT-027
  name: hidden-content-in-agent-parsed-html
  severity: HIGH
  category: invisible_injection
  patterns:
  - (?i)(display:\s*none|visibility:\s*hidden|opacity:\s*0|font-size:\s*0).{0,200}(ignore|instruction|system|task)
  - (?i)<div[^>]*style=['"][^'"]*display:\s*none[^'"]*['"][^>]*>.*instruction
  - (?i)color:\s*white.*background.*white.{0,100}instruction
  file_types:
  - '*.html'
  - '*.htm'
  - '*.py'
  - '*.js'
  message: 'Detected: Hidden HTML content containing instructions (invisible prompt injection vector)'
  description: Agents parsing HTML/DOM can be manipulated by hidden content (display:none) containing prompt injections invisible
    to human reviewers.
  remediation: Strip hidden HTML elements before feeding web content to agents. Use text-only extraction pipelines.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-AGT-028
  name: ai-worm-self-replication-pattern
  severity: CRITICAL
  category: ai_worm
  patterns:
  - (?i)(forward|send|email|relay).{0,60}(this|following|exact|same).{0,40}(message|prompt|instruction|payload)
  - (?i)(copy|replicate|propagate).{0,40}(prompt|instruction).{0,40}(to|into|across).{0,40}(agent|user|contact|email)
  - (?i)(spread|infect|inject).{0,40}(other|all|every).{0,40}(agent|model|system)
  file_types:
  - '*.py'
  - '*.js'
  - '*.txt'
  - '*.md'
  message: 'Detected: AI worm self-replication instruction pattern (Morris-II / Prompt Infection)'
  description: Morris-II style AI worms embed self-replicating adversarial prompts that propagate across agent networks via
    email/RAG pipelines.
  remediation: Implement output sanitization to prevent agents from forwarding injected payloads. Add rate limiting and anomaly
    detection on agent-to-agent communication.
  owasp_llm: LLM04:2025
  cwe: CWE-506
- id: MEDUSA-AGT-029
  name: mcp-agent-card-description-poisoning
  severity: HIGH
  category: tool_squatting
  patterns:
  - (?i)(agent_card|agentcard|tool_description|tool_meta).{0,100}(also|additionally|secretly|additionally).{0,60}(send|forward|exfiltrate|copy)
  - (?i)mcp_server.{0,60}(register|install|add).{0,60}(untrusted|external|third.?party)
  - (?i)(tool_name|server_name).{0,40}=.{0,40}(verified|trusted|official|legitimate)
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.ts'
  message: 'Detected: Potential MCP Agent Card spoofing or tool description poisoning vector'
  description: 'Tool squatting via description poisoning: attackers tamper with MCP tool metadata/A2A Agent Cards to add hidden
