# MEDUSA Scanner Rules - UCP (Universal Commerce Protocol) Vulnerabilities
# Source: Google UCP Specification, DataDome Research, Shopify Engineering, CSA AP2 Framework
# Version: 1.0.0
# Last Updated: 2026-02-08
# Purpose: STATIC CODE ANALYSIS - detecting vulnerable UCP patterns at build/scan time
#
# Background:
#   Google launched UCP (Universal Commerce Protocol) on 2026-01-11 with 20+ partners
#   including Shopify, Mastercard, Visa, Stripe, PayPal, Walmart, and Target.
#   UCP enables AI agents (Gemini, ChatGPT, etc.) to autonomously discover products,
#   initiate checkout, handle payments, and manage orders on behalf of users.
#
# Attack Surface:
#   - AI agents executing high-value financial transactions without human device signals
#   - Discovery endpoints (/.well-known/ucp) exposable to domain hijacking
#   - AP2 payment mandates vulnerable to forgery if signing keys compromised
#   - MCP transport bindings create bridge injection risks
#   - JSON-LD context definitions susceptible to semantic poisoning
#   - Product catalog data as prompt injection vector
#
# Protocols Covered: UCP (Google), AP2 (Agent Payments Protocol)
# CWEs: CWE-78, CWE-94, CWE-200, CWE-284, CWE-295, CWE-306, CWE-319,
#        CWE-345, CWE-346, CWE-352, CWE-400, CWE-451, CWE-693, CWE-770, CWE-798
#
# References:
#   - https://ucp.dev/specification/overview/
#   - https://developers.googleblog.com/under-the-hood-universal-commerce-protocol-ucp/
#   - https://datadome.co/agent-trust-management/universal-commerce-protocol/
#   - https://shopify.engineering/UCP
#   - https://cloudsecurityalliance.org/blog/2025/10/06/secure-use-of-the-agent-payments-protocol-ap2
#   - https://ap2-protocol.org/topics/privacy-and-security/

rules:
  # =============================================================================
  # SECTION 1: UCP DISCOVERY & ENDPOINT SECURITY (6 rules)
  # =============================================================================

  - id: MEDUSA-UCP-DISC-001
    name: ucp-wellknown-over-http
    severity: CRITICAL
    category: transport_security
    patterns:
      - '(?i)http://[^/]+/\.well-known/ucp'
      - '(?i)ucp.*endpoint.*http://(?!localhost|127\.0\.0\.1)'
      - '(?i)discovery_url.*http://(?!localhost|127\.0\.0\.1)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    message: "UCP discovery endpoint served over insecure HTTP"
    description: |
      UCP discovery relies on /.well-known/ucp endpoints. Serving these over HTTP
      instead of HTTPS exposes the protocol to man-in-the-middle attacks where an
      attacker can inject malicious UCP configurations, redirect agents to fraudulent
      checkout endpoints, or impersonate merchants entirely.
      UCP specification mandates HTTPS for all communication.
    remediation: |
      - Always serve /.well-known/ucp over HTTPS
      - Enforce HSTS headers on UCP endpoints
      - Validate TLS certificates in agent-side discovery clients
    owasp_llm: "LLM06:2025"
    cwe: "CWE-319"

  - id: MEDUSA-UCP-DISC-002
    name: ucp-discovery-no-signature-verification
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)well.known.*ucp.*(?!.*(?:verify|validat|signature|sign))'
      - '(?i)ucp.*discover.*(?!.*(?:verify|validat|signature))'
      - '(?i)fetch.*well.known/ucp(?!.*(?:verify|sign))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP discovery without signature verification"
    description: |
      UCP discovery endpoints should have their responses cryptographically verified
      to prevent domain hijacking and merchant impersonation. Without signature
      verification, an attacker who compromises DNS or takes over an expired subdomain
      can serve malicious UCP configurations.
    remediation: |
      - Verify UCP manifest signatures against known merchant public keys
      - Implement certificate pinning for critical merchant endpoints
      - Cross-reference discovery data with trusted registries
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-DISC-003
    name: ucp-endpoint-no-rate-limiting
    severity: HIGH
    category: availability
    patterns:
      - '(?i)@(app|router)\.(post|put|get).*checkout.session.*(?!.*(?:rate.?limit|throttl))'
      - '(?i)ucp.*endpoint.*(?!.*(?:rate.?limit|throttl))'
      - '(?i)/checkout-sessions.*(?!.*(?:rate.?limit|throttl))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP checkout endpoint without rate limiting"
    description: |
      UCP checkout endpoints exposed to AI agents require dedicated rate limiting.
      Without it, attackers can flood checkout sessions, exhaust inventory via
      reservation attacks, or cause denial-of-service through 409 Conflict loops.
      Traditional WAF rules are insufficient as agent traffic lacks device fingerprints.
    remediation: |
      - Implement per-agent rate limiting using UCP-Agent header identity
      - Add checkout session creation throttling
      - Use idempotency keys to prevent duplicate session creation
      - Monitor for abnormal checkout patterns (volume, velocity, timing)
    owasp_llm: "LLM10:2025"
    cwe: "CWE-770"

  - id: MEDUSA-UCP-DISC-004
    name: ucp-capability-namespace-unvalidated
    severity: MEDIUM
    category: input_validation
    patterns:
      - '(?i)capability.*namespace.*(?!.*(?:validat|verify|check|whitelist|allowlist))'
      - '(?i)dev\.ucp\..*(?!.*(?:verify|validat))'
      - '(?i)register.*capability.*(?!.*(?:namespace.*valid|reverse.?domain))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP capability namespace without validation"
    description: |
      UCP uses reverse-domain namespacing for capabilities (e.g., dev.ucp.shopping.checkout).
      Without namespace validation, attackers can register spoofed capabilities
      that mimic legitimate merchant services, leading to capability spoofing attacks.
    remediation: |
      - Validate capability namespaces against reverse-domain ownership
      - Maintain an allowlist of verified capability namespaces
      - Implement capability negotiation with mutual authentication
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  - id: MEDUSA-UCP-DISC-005
    name: ucp-missing-idempotency-key
    severity: MEDIUM
    category: data_integrity
    patterns:
      - '(?i)checkout.session.*(?!.*(?:idempoten|idempotency.?key))'
      - '(?i)POST.*/checkout-sessions.*(?!.*(?:idempoten))'
      - '(?i)create.*session.*ucp.*(?!.*(?:idempoten))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP checkout session without idempotency key"
    description: |
      UCP requires idempotency keys on checkout session creation to prevent
      duplicate transactions. Missing idempotency keys enable replay attacks
      and duplicate charge scenarios when agents retry failed requests.
    remediation: |
      - Include idempotency-key header on all POST /checkout-sessions requests
      - Generate cryptographically random idempotency keys per transaction
      - Implement server-side idempotency key deduplication with TTL
    owasp_llm: "LLM06:2025"
    cwe: "CWE-352"

  - id: MEDUSA-UCP-DISC-006
    name: ucp-webhook-no-signature-verification
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)ucp.*webhook.*(?!.*(?:verify|validat|signature|hmac|sign))'
      - '(?i)webhook.*ucp.*(?!.*(?:verify|validat|secret))'
      - '(?i)on.*ucp.*event.*(?!.*(?:verify|sign))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP webhook without signature verification"
    description: |
      UCP webhooks must be signed with shared secret or asymmetric keys.
      Without signature verification, attackers can forge webhook events
      to manipulate order state, trigger fake payment confirmations, or
      cause inventory desynchronization.
    remediation: |
      - Verify webhook signatures using HMAC-SHA256 or asymmetric keys
      - Validate webhook timestamps to prevent replay attacks
      - Reject webhooks with missing or invalid signatures
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  # =============================================================================
  # SECTION 2: UCP AGENT IDENTITY & TRUST (5 rules)
  # =============================================================================

  - id: MEDUSA-UCP-AGENT-001
    name: ucp-agent-header-not-validated
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)ucp.agent.*header.*(?!.*(?:validat|verify|authenticat))'
      - '(?i)request\.headers.*ucp.agent.*(?!.*(?:check|verify))'
      - '(?i)agent.*profile.*(?!.*(?:authenticat|verify|validat))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP-Agent header accepted without validation"
    description: |
      UCP requests include a UCP-Agent header identifying the requesting agent.
      Without validating agent identity, merchants cannot distinguish legitimate
      shopping assistants from malicious automation, enabling agent impersonation
      and DID spoofing attacks to circumvent per-agent throttling.
    remediation: |
      - Validate UCP-Agent header against a registry of known agents
      - Implement DID-based agent authentication
      - Cross-reference agent identity with request-signature header
    owasp_llm: "LLM08:2025"
    cwe: "CWE-306"

  - id: MEDUSA-UCP-AGENT-002
    name: ucp-did-single-resolver
    severity: MEDIUM
    category: authentication
    patterns:
      - '(?i)did.*resolv.*(?!.*(?:multiple|fallback|redundan))'
      - '(?i)resolve.*did:.*(?!.*(?:multi|backup|failover))'
      - '(?i)DIDResolver\s*\([^)]*\)(?!.*(?:multi|chain|composite))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP DID resolution with single resolver"
    description: |
      UCP agent identity relies on Decentralized Identifiers (DIDs).
      Using a single DID resolver creates a single point of failure and
      enables allowlist poisoning through compromised resolver infrastructure.
    remediation: |
      - Use composite DID resolver with multiple resolution methods
      - Implement DID resolution caching with integrity verification
      - Configure fallback resolvers across different infrastructure providers
    owasp_llm: "LLM06:2025"
    cwe: "CWE-346"

  - id: MEDUSA-UCP-AGENT-003
    name: ucp-request-signature-missing
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)ucp.*request.*(?!.*(?:request.signature|signature|sign))'
      - '(?i)checkout.*session.*(?!.*(?:request.signature|verify.sign))'
      - '(?i)ucp.*(?:post|put).*(?!.*(?:sign|signature))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP request without request-signature header"
    description: |
      UCP specification requires request-signature headers on transactions.
      Missing signatures allow request tampering and agent impersonation,
      as there is no cryptographic proof of request origin or integrity.
    remediation: |
      - Include request-signature header on all UCP API calls
      - Use ED25519 or ECDSA P-256 for request signing
      - Validate signatures server-side before processing transactions
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-AGENT-004
    name: ucp-delegation-no-scope-restriction
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)delegat.*agent.*(?!.*(?:scope|restrict|limit|bound))'
      - '(?i)sub.?agent.*(?!.*(?:permission|scope|restrict))'
      - '(?i)agent.*chain.*(?!.*(?:scope|bound|limit))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP agent delegation without scope restriction"
    description: |
      UCP supports sub-agent delegation for complex commerce flows.
      Without scope restrictions, intermediate agents can escalate privileges,
      exceed delegated permissions, or modify audit trails in the delegation chain.
    remediation: |
      - Enforce permission boundaries at each delegation level
      - Implement non-expandable scope tokens for sub-agents
      - Log and audit the full delegation chain for each transaction
    owasp_llm: "LLM08:2025"
    cwe: "CWE-284"

  - id: MEDUSA-UCP-AGENT-005
    name: ucp-consent-unbounded-delegation
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)(?:user|consent|authori[sz]).*(?:unlimited|unbounded|no.?limit|forever|indefinite)'
      - '(?i)mandate.*(?!.*(?:ttl|expir|max.?amount|limit))'
      - '(?i)delegat.*payment.*(?!.*(?:ceiling|limit|max|cap))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP consent without bounded delegation limits"
    description: |
      UCP agent-led commerce is asynchronous - the user is absent during payment.
      Without explicit limits (TTL, max amount, item count), consent manipulation
      attacks can extend authorization scope beyond user intent, enabling
      unauthorized purchases via natural language intent ambiguity.
    remediation: |
      - Require explicit TTL on all payment authorizations
      - Set maximum transaction amounts per mandate
      - Implement mandatory user confirmation for amounts exceeding threshold
      - Map natural language intents to specific cryptographic constraints
    owasp_llm: "LLM08:2025"
    cwe: "CWE-284"

  # =============================================================================
  # SECTION 3: UCP CREDENTIAL & KEY MANAGEMENT (5 rules)
  # =============================================================================

  - id: MEDUSA-UCP-CRED-001
    name: ucp-hardcoded-signing-key
    severity: CRITICAL
    category: credential_exposure
    patterns:
      - '(?i)ucp.*(?:private|signing|secret).?key\s*[=:]\s*["\x27][^\s"]{20,}'
      - '(?i)ap2.*(?:private|signing).?key\s*[=:]\s*["\x27][^\s"]{20,}'
      - '(?i)ed25519.*private.*[=:]\s*["\x27][A-Za-z0-9+/=]{20,}'
      - '(?i)checkout.*signature.*key\s*[=:]\s*["\x27][^\s"]{20,}'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
      - "*.env"
    message: "Hardcoded UCP/AP2 signing key in source code"
    description: |
      UCP specification states private keys require HSM or KMS storage and
      should never be in codebase or git repos. Compromised signing keys
      enable AP2 mandate forgery, allowing attackers to forge valid payment
      authorizations for fraudulent transactions.
    remediation: |
      - Store signing keys in HSM (Hardware Security Module) or cloud KMS
      - Use environment variables for key references, never raw key material
      - Implement key rotation procedures
      - Use short-lived derived keys for individual transactions
    owasp_llm: "LLM02:2025"
    cwe: "CWE-798"

  - id: MEDUSA-UCP-CRED-002
    name: ucp-did-key-in-source
    severity: HIGH
    category: credential_exposure
    patterns:
      - '(?i)did:key:z6Mk[a-zA-Z0-9]{40,}'
      - '(?i)did:web:[a-zA-Z0-9._\-]+.*private'
      - '(?i)verificationMethod.*private'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    message: "UCP DID private key material in source code"
    description: |
      Decentralized Identifier (DID) private keys found in source code.
      DID keys are used for UCP agent identity and AP2 mandate signing.
      Exposed DID keys enable agent impersonation and mandate forgery.
    remediation: |
      - Store DID private keys in secure key management systems
      - Only reference DID public keys in source code
      - Implement DID key rotation on suspected compromise
    owasp_llm: "LLM02:2025"
    cwe: "CWE-798"

  - id: MEDUSA-UCP-CRED-003
    name: ucp-raw-payment-credentials
    severity: CRITICAL
    category: credential_exposure
    patterns:
      - '(?i)(?:card.?number|pan|cvv|cvc|ccv)\s*[=:]\s*["\x27]?\d'
      - '(?i)primary.?account.?number\s*[=:]'
      - '(?i)payment.*credential.*(?!.*(?:token|opaque|encrypt))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    message: "Raw payment credentials in UCP flow"
    description: |
      UCP payment flows must use tokenized credentials via Credential Providers.
      Raw card numbers, PANs, CVVs, or unencrypted payment data in code violates
      PCI-DSS and creates credential theft risk in the agent commerce pipeline.
    remediation: |
      - Use tokenized payment references from Credential Providers
      - Never store or transmit raw payment credentials
      - Implement opaque payment tokens for all agent-initiated transactions
      - Ensure PCI-DSS compliance in payment handler implementations
    owasp_llm: "LLM02:2025"
    cwe: "CWE-200"

  - id: MEDUSA-UCP-CRED-004
    name: ucp-payment-handler-no-tokenization
    severity: HIGH
    category: data_protection
    patterns:
      - '(?i)payment.?handler.*(?!.*(?:token|opaque))'
      - '(?i)process.?payment.*(?!.*(?:token|tokeniz))'
      - '(?i)charge.*(?:card|credit|debit).*(?!.*(?:token))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP payment handler without tokenization"
    description: |
      Payment handlers in UCP flows should exclusively use tokenized credentials.
      If a Credential Provider handles both tokens and transaction details, it
      violates PCI-DSS role segregation. Tokenization bypass attacks can
      intercept payment credentials in the CP-to-issuer communication channel.
    remediation: |
      - Implement payment tokenization at the Credential Provider level
      - Separate token management from transaction processing
      - Validate that payment handlers never receive raw card data
    owasp_llm: "LLM06:2025"
    cwe: "CWE-200"

  - id: MEDUSA-UCP-CRED-005
    name: ucp-vdc-weak-algorithm
    severity: HIGH
    category: cryptography
    patterns:
      - '(?i)(?:vdc|verifiable.*credential).*(?:RS256|HS256|none)'
      - '(?i)sd.jwt.*(?:alg|algorithm).*(?:RS256|HS256|none)'
      - '(?i)jwt.*sign.*(?!.*(?:ES256|EdDSA|Ed25519|ES384|ES512))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP Verifiable Digital Credential with weak signing algorithm"
    description: |
      UCP/AP2 uses Verifiable Digital Credentials (VDCs) with SD-JWT-VC tokens.
      The specification requires ED25519 or ECDSA P-256 signatures. Using weaker
      algorithms (RS256, HS256, or 'none') undermines mandate integrity and
      enables signature forgery attacks.
    remediation: |
      - Use EdDSA (Ed25519) or ES256 (ECDSA P-256) for VDC signing
      - Reject tokens signed with RS256, HS256, or 'none' algorithm
      - Validate algorithm in JWT header before processing
    owasp_llm: "LLM06:2025"
    cwe: "CWE-693"

  # =============================================================================
  # SECTION 4: AP2 MANDATE SECURITY (6 rules)
  # =============================================================================

  - id: MEDUSA-UCP-AP2-001
    name: ap2-mandate-no-signature-verification
    severity: CRITICAL
    category: authentication
    patterns:
      - '(?i)mandate.*(?!.*(?:verify|validat|signature|check.?sign))'
      - '(?i)payment.?mandate.*accept.*(?!.*(?:verify|valid))'
      - '(?i)process.*mandate.*(?!.*(?:signature|verify))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 mandate processed without signature verification"
    description: |
      AP2 cryptographic payment mandates must have their ED25519/ECDSA signatures
      verified before processing. Without verification, attackers can forge mandates
      authorizing fraudulent transactions. A compromised issuer key enables
      creation of valid-looking mandates for arbitrary amounts.
    remediation: |
      - Verify mandate signature using issuer's public key before processing
      - Implement strict signature validation with no bypass options
      - Reject mandates with missing, malformed, or invalid signatures
      - Cross-reference signing key with trusted issuer registry
    owasp_llm: "LLM07:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-AP2-002
    name: ap2-mandate-no-expiration
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)mandate.*(?!.*(?:ttl|expir|valid.?through|valid.?until|max.?age))'
      - '(?i)create.*mandate.*(?!.*(?:expir|ttl|lifetime))'
      - '(?i)payment.?authorization.*(?!.*(?:expir|timeout|deadline))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 mandate without expiration/TTL"
    description: |
      AP2 mandates without TTL or validThrough timestamps never expire,
      creating a persistent authorization that attackers can exploit long
      after the original user intent. Stale mandates are a replay attack vector.
    remediation: |
      - Set validThrough timestamp on all payment mandates
      - Use short TTLs appropriate to the transaction type
      - Implement server-side mandate expiration enforcement
      - Reject mandates past their validity window
    owasp_llm: "LLM07:2025"
    cwe: "CWE-284"

  - id: MEDUSA-UCP-AP2-003
    name: ap2-mandate-no-nonce
    severity: HIGH
    category: data_integrity
    patterns:
      - '(?i)mandate.*(?!.*(?:nonce|idempoten|unique.?id|request.?id))'
      - '(?i)payment.?mandate.*(?!.*(?:nonce|replay))'
      - '(?i)authorize.*payment.*(?!.*(?:nonce|one.?time))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 mandate without nonce (replay attack risk)"
    description: |
      AP2 mandates without nonces or unique identifiers are vulnerable to
      replay attacks. An attacker who intercepts a valid mandate can resubmit
      it to authorize duplicate transactions.
    remediation: |
      - Include cryptographic nonce in every mandate
      - Implement server-side nonce tracking to detect replays
      - Reject previously-seen mandate nonces
      - Combine nonce with timestamp for defense-in-depth
    owasp_llm: "LLM07:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-AP2-004
    name: ap2-cart-mandate-unsigned
    severity: CRITICAL
    category: data_integrity
    patterns:
      - '(?i)cart.*mandate.*(?!.*(?:sign|signature|dynamic.?link))'
      - '(?i)checkout.*cart.*(?!.*(?:sign|hash|integrity))'
      - '(?i)cart.*content.*(?!.*(?:verify|sign|hash))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "Cart mandate without cryptographic signing"
    description: |
      Cart mandates must be merchant-signed to prevent cart mandate tampering.
      Without signatures, attackers can strip or modify cart contents after
      the mandate is created, enabling price manipulation or unauthorized
      item substitution that bypasses dynamic linking verification.
    remediation: |
      - Sign cart contents with merchant private key
      - Implement dynamic linking between mandate and cart state
      - Verify cart signature at every processing step
      - Reject mandates where cart hash doesn't match signed content
    owasp_llm: "LLM07:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-AP2-005
    name: ap2-mandate-no-amount-limit
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)mandate.*amount.*(?:unlimited|no.?limit|uncapped)'
      - '(?i)payment.?authorization.*(?!.*(?:max.?amount|ceiling|cap|limit))'
      - '(?i)authorize.*(?!.*(?:amount.?limit|max|ceiling))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 mandate without amount limit"
    description: |
      Payment mandates without explicit amount limits create unbounded
      financial authorization. Attackers exploiting consent manipulation
      can escalate transaction amounts beyond user intent.
    remediation: |
      - Set explicit maximum amount on every payment mandate
      - Implement per-transaction and per-session spending limits
      - Require additional user confirmation for amounts exceeding threshold
    owasp_llm: "LLM08:2025"
    cwe: "CWE-284"

  - id: MEDUSA-UCP-AP2-006
    name: ap2-mandate-audit-trail-mutable
    severity: MEDIUM
    category: logging
    patterns:
      - '(?i)mandate.*(?:log|audit|trail).*(?:delet|remov|modif|updat|overwrite)'
      - '(?i)(?:delet|remov|clear).*mandate.*(?:log|audit|history)'
      - '(?i)mandate.*history.*(?:mutable|writable)'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "AP2 mandate audit trail is mutable"
    description: |
      Mandate audit trails must be immutable to maintain chain-of-custody.
      In agent delegation chains, intermediate agents that can modify or
      redact audit trails destroy non-repudiation guarantees required
      for financial transaction accountability.
    remediation: |
      - Implement append-only audit logs for all mandates
      - Use cryptographic chaining (hash chains) for audit integrity
      - Prevent deletion or modification of mandate history records
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"

  # =============================================================================
  # SECTION 5: UCP-MCP BRIDGE & TRANSPORT (4 rules)
  # =============================================================================

  - id: MEDUSA-UCP-BRIDGE-001
    name: ucp-mcp-bridge-no-input-sanitization
    severity: HIGH
    category: injection
    patterns:
      - '(?i)ucp.*mcp.*(?!.*(?:sanitiz|validat|escap|filter))'
      - '(?i)mcp.*tool.*ucp.*(?:checkout|payment|order)'
      - '(?i)bridge.*ucp.*(?!.*(?:sanitiz|clean|validat))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP-MCP bridge without input sanitization"
    description: |
      UCP supports MCP as a transport binding, mapping capabilities 1:1 to MCP tools.
      The translation layer between LLM natural language intent and UCP queries
      introduces injection risks. Malformed natural language could generate
      unintended purchase orders via the MCP-UCP bridge.
    remediation: |
      - Sanitize all inputs crossing the MCP-UCP bridge boundary
      - Validate UCP action parameters against expected schema
      - Implement allowlists for valid UCP operations via MCP
      - Log all bridge translations for audit
    owasp_llm: "LLM01:2025"
    cwe: "CWE-94"

  - id: MEDUSA-UCP-BRIDGE-002
    name: ucp-a2a-binding-no-mutual-auth
    severity: HIGH
    category: transport_security
    patterns:
      - '(?i)ucp.*a2a.*(?!.*(?:mtls|mutual|client.?cert))'
      - '(?i)a2a.*transport.*ucp.*(?!.*(?:mtls|mutual))'
      - '(?i)agent.to.agent.*ucp.*(?!.*(?:authenticat|mutual))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP A2A transport binding without mutual authentication"
    description: |
      UCP supports A2A (Agent-to-Agent) transport bindings. Without mutual
      TLS or equivalent mutual authentication, either party can be impersonated,
      enabling man-in-the-middle attacks on inter-agent commerce flows.
    remediation: |
      - Implement mTLS for UCP A2A transport bindings
      - Use client certificates for both agent and merchant sides
      - Validate certificate chains against trusted CAs
    owasp_llm: "LLM06:2025"
    cwe: "CWE-295"

  - id: MEDUSA-UCP-BRIDGE-003
    name: ucp-jsonld-context-external
    severity: MEDIUM
    category: injection
    patterns:
      - '(?i)"@context"\s*:\s*"https?://(?!schema\.org|ucp\.dev)[^"]*"'
      - '(?i)@context.*(?:untrusted|external|custom)'
      - '(?i)json.?ld.*context.*(?!.*(?:validat|whitelist|allowlist))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.jsonld"
    message: "UCP JSON-LD context from untrusted source"
    description: |
      UCP uses JSON-LD for structured product data. Attackers can manipulate
      @context definitions to cause agents to misinterpret pricing, inventory
      claims, or capability declarations. This is a semantic attack where
      redefining context changes the meaning of data without changing values.
    remediation: |
      - Only accept @context from trusted sources (schema.org, ucp.dev)
      - Validate JSON-LD context against an allowlist of approved contexts
      - Pin context URLs and validate their content hash
    owasp_llm: "LLM01:2025"
    cwe: "CWE-451"

  - id: MEDUSA-UCP-BRIDGE-004
    name: ucp-service-mesh-no-routing-validation
    severity: MEDIUM
    category: transport_security
    patterns:
      - '(?i)ucp.*rout.*(?!.*(?:validat|verify|authenticat))'
      - '(?i)agent.*rout.*(?:payment|mandate).*(?!.*(?:verify|sign))'
      - '(?i)inter.?agent.*forward.*(?!.*(?:integrity|verify))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP inter-agent routing without validation"
    description: |
      Service mesh poisoning can redirect UCP mandate flows to fake issuers.
      Without routing validation, attackers can intercept payment mandates
      in transit between agents, credential providers, and payment processors.
    remediation: |
      - Validate routing integrity for all inter-agent communications
      - Implement signed routing headers
      - Use service mesh mTLS with strict identity verification
    owasp_llm: "LLM06:2025"
    cwe: "CWE-346"

  # =============================================================================
  # SECTION 6: PROMPT INJECTION VIA PRODUCT DATA (4 rules)
  # =============================================================================

  - id: MEDUSA-UCP-PI-001
    name: ucp-product-data-prompt-injection
    severity: CRITICAL
    category: prompt_injection
    patterns:
      - '(?i)(?:product|item|catalog).*(?:description|title|name).*(?:ignore|forget|disregard).*(?:previous|instruction|prompt)'
      - '(?i)(?:product|item|catalog).*<(?:system|hidden|instruction|prompt)[^>]*>'
      - '(?i)(?:product|item).*\\n.*(?:system|assistant|user)\s*:'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    message: "Prompt injection payload in UCP product catalog data"
    description: |
      Malicious merchants can embed prompt injection payloads in product catalog
      entries. When an AI shopping agent retrieves and processes this data, injected
      instructions can redirect agent actions -- causing the agent to select different
      products, bypass price comparison, or exfiltrate user payment data.
    remediation: |
      - Sanitize all product catalog data before LLM processing
      - Implement output filtering on agent responses after catalog retrieval
      - Use structured data extraction instead of free-text LLM processing
      - Apply content security policies to product descriptions
    owasp_llm: "LLM01:2025"
    cwe: "CWE-94"

  - id: MEDUSA-UCP-PI-002
    name: ucp-product-data-unsanitized
    severity: HIGH
    category: input_validation
    patterns:
      - '(?i)product.*data.*(?!.*(?:sanitiz|clean|strip|escap|filter))'
      - '(?i)catalog.*(?:fetch|get|retriev).*(?!.*(?:sanitiz|validat))'
      - '(?i)merchant.*response.*(?!.*(?:sanitiz|filter|clean))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP product data consumed without sanitization"
    description: |
      Product data retrieved from merchant UCP endpoints is untrusted input.
      Without sanitization, malicious content (prompt injection, hidden instructions,
      encoded payloads) in product descriptions, metadata, or pricing can
      manipulate agent behavior.
    remediation: |
      - Treat all merchant product data as untrusted input
      - Implement input sanitization pipeline for catalog data
      - Strip HTML, control characters, and suspicious patterns
      - Validate data against expected schema before LLM processing
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"

  - id: MEDUSA-UCP-PI-003
    name: ucp-price-manipulation-no-verification
    severity: HIGH
    category: data_integrity
    patterns:
      - '(?i)price.*(?!.*(?:verify|validat|check|confirm|compare))'
      - '(?i)(?:total|amount|cost).*merchant.*(?!.*(?:verify|sign|hash))'
      - '(?i)cart.*(?:total|price).*(?!.*(?:recalculat|verify|integrity))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP price data accepted without verification"
    description: |
      JSON-LD context poisoning can cause agents to misinterpret pricing data.
      Agents should independently verify prices rather than trusting
      merchant-provided totals, which can be manipulated through semantic
      attacks on structured data definitions.
    remediation: |
      - Independently recalculate cart totals from item prices
      - Compare prices across multiple sources when available
      - Implement price change detection between discovery and checkout
      - Sign price data at the point of discovery for later verification
    owasp_llm: "LLM01:2025"
    cwe: "CWE-345"

  - id: MEDUSA-UCP-PI-004
    name: ucp-product-image-multimodal-injection
    severity: MEDIUM
    category: prompt_injection
    patterns:
      - '(?i)product.*image.*(?:process|analyz|describ).*(?!.*(?:sanitiz|filter))'
      - '(?i)(?:ocr|vision|multimodal).*product.*(?!.*(?:sanitiz|validat))'
      - '(?i)image.*url.*merchant.*(?!.*(?:verify|allowlist))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP product images processed without multimodal injection protection"
    description: |
      Product images from merchant catalogs can contain embedded text or
      visual prompt injection payloads. Multimodal AI agents that process
      product images may execute hidden instructions embedded in images.
    remediation: |
      - Sanitize product images before multimodal LLM processing
      - Implement image content analysis for embedded text detection
      - Use allowlisted image CDN domains for product images
      - Separate image analysis from transaction decision-making
    owasp_llm: "LLM01:2025"
    cwe: "CWE-94"

  # =============================================================================
  # SECTION 7: FRAUD & RISK SCORING (3 rules)
  # =============================================================================

  - id: MEDUSA-UCP-FRAUD-001
    name: ucp-zero-signal-no-agent-risk-scoring
    severity: HIGH
    category: fraud_detection
    patterns:
      - '(?i)(?:fraud|risk).*(?:score|model|detect).*(?!.*(?:agent|ucp|agentic))'
      - '(?i)checkout.*(?!.*(?:agent.?risk|agent.?fraud|bot.?detect))'
      - '(?i)transaction.*risk.*(?!.*(?:agent.?signal|agent.?context))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "Fraud detection without agent-aware risk scoring"
    description: |
      When AI agents transact via UCP, traditional fraud signals (device fingerprint,
      IP geolocation, session behavior, browsing patterns) are absent. 85% of financial
      institutions believe their current systems are not equipped to handle
      agent-initiated transactions. Risk scoring must be adapted for agentic commerce.
    remediation: |
      - Implement agent-specific fraud signals (agent reputation, delegation chain, mandate patterns)
      - Develop UCP-aware risk scoring models that don't rely on device signals
      - Use agent behavioral analytics instead of device-based fraud detection
      - Implement velocity checks per agent identity
    owasp_llm: "LLM10:2025"
    cwe: "CWE-693"

  - id: MEDUSA-UCP-FRAUD-002
    name: ucp-risk-model-agent-signals-missing
    severity: MEDIUM
    category: fraud_detection
    patterns:
      - '(?i)risk.*model.*(?!.*(?:agent.?modality|agent.?type|agent.?signal))'
      - '(?i)fraud.*detect.*(?!.*(?:agentic|agent.?identif))'
      - '(?i)scoring.*(?!.*(?:agent|bot|automat))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "Risk model missing agent modality signals"
    description: |
      Risk scoring poisoning attacks craft transactions with deceptive agent
      modality signals to evade AI-aware fraud scoring. Without agent-specific
      features in risk models, attackers can reverse-engineer scoring thresholds
      through systematic transaction experimentation (model inversion).
    remediation: |
      - Include agent modality as a feature in risk scoring models
      - Track agent reputation scores based on historical transaction patterns
      - Implement adversarial robustness testing for risk models
      - Rotate risk model features to resist model inversion
    owasp_llm: "LLM03:2025"
    cwe: "CWE-693"

  - id: MEDUSA-UCP-FRAUD-003
    name: ucp-inventory-reservation-no-limit
    severity: MEDIUM
    category: availability
    patterns:
      - '(?i)reserv.*(?:inventory|stock|item).*(?!.*(?:timeout|ttl|limit|max))'
      - '(?i)checkout.*session.*(?!.*(?:session.?timeout|session.?ttl|abandon))'
      - '(?i)cart.*hold.*(?!.*(?:expir|timeout|release))'
    file_types:
      - "*.py"
      - "*.js"
      - "*.ts"
    message: "UCP inventory reservation without timeout/limit"
    description: |
      Agents creating checkout sessions reserve inventory. Without reservation
      timeouts, attackers can create mass checkout sessions to lock inventory
      indefinitely, causing denial-of-service for legitimate buyers.
      Stale read race conditions compound this with 409 Conflict loops.
    remediation: |
      - Set reservation TTL on all checkout sessions
      - Implement automatic inventory release on session timeout
      - Limit concurrent checkout sessions per agent identity
      - Monitor for abnormal reservation patterns
    owasp_llm: "LLM10:2025"
    cwe: "CWE-400"
