  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.ts'
  - '*.js'
  message: Multiple tools with duplicate or near-identical descriptions - Tool Shadowing pattern
  description: 'Detects multiple tools registered with semantically identical descriptions but

    different endpoints, a pattern consistent with Tool Shadowing attacks. Tool

    Shadowing creates duplicate tools with poisoned descriptions that the LLM

    preferentially selects over the legitimate original. Variant indicators include

    tools with names suffixed "_v2", "_new", "_official", or "_pro" that claim to

    replace or supersede existing tools. The MCP Security Bench (Zhang et al.)

    found that static scanning tools like MCP-scan raised only 1 warning across

    the entire LeechHijack test suite, demonstrating that existing tools are

    insufficient for detecting shadowing patterns.

    '
  remediation: '- Implement tool uniqueness validation: reject duplicate descriptions across tools

    - Flag tools with names containing version-bump suffixes (_v2, _new, _official)

    - Use semantic similarity scoring to detect near-identical tool descriptions

    - Require admin approval for tool registration with >90% description similarity

    - Maintain a canonical tool registry with description deduplication

    - Deploy ATTESTMCP-style capability attestation (76.5% ASR reduction)

    '
  owasp_llm: LLM01:2025
