- id: MEDUSA-ACP-SCAN-036
  name: agent-unbounded-reasoning-loops
  severity: HIGH
  category: denial_of_service
  patterns:
  - (?i)(?:AgentExecutor|ReActAgent|PlanAndExecute|AutoGPT|BabyAGI)\s*\([^)]*\)(?!.*(?:max_(?:iterations|steps|reasoning_steps|turns|loops)|timeout|max_tokens_per_step|step_limit))
  - (?i)(?:while|for)\s+.*(?:agent|reason|think|plan|step)(?!.*(?:max_|limit|break|timeout|counter))
  - (?i)(?:reasoning_loop|thought_loop|planning_loop)\s*\((?!.*(?:max_|limit|timeout|budget))
  - (?i)(?:agent|llm)_config\s*=\s*\{[^}]*\}(?!.*(?:max_reasoning_steps|max_tokens_per_step|timeout|max_iterations))
  - (?i)recursive_(?:think|reason|plan|solve)\s*\([^)]*\)(?!.*(?:depth|max_|limit))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  message: Agent reasoning loop without step limit, token cap, or timeout - DoS via Overthinking/CRABS
  description: 'Agent configurations lacking max_reasoning_steps, max_tokens_per_step, or timeout

    constraints are vulnerable to cognitive exhaustion DoS attacks. Overthinking

    (cited in Kong et al.) injects "bait reasoning tasks" (Markov decision processes,

    Sudoku puzzles, Fibonacci sequences) into the model context, exploiting reflective

    capabilities to induce unnecessary, redundant chain-of-thought reasoning steps.

    CRABS (Zhang et al., 2024) automates generation of Algorithmic Complexity Attacks

    that create inputs maximizing computational cost (energy/latency) in black-box

    settings. Sponge Examples (Shumailov et al.) craft inputs triggering worst-case

    computational complexity by maximizing activation density. All three attacks

    cause excessive token consumption, significantly slower inference, and response

    timeouts without traditional exploit payloads.

    '
  remediation: '- Set max_reasoning_steps (recommended: 10-25) on all agent configurations

    - Add max_tokens_per_step limits to prevent unbounded generation per step

    - Implement global timeout for agent execution (recommended: 30-120 seconds)

    - Monitor tokens_per_second and time_per_token for sudden spikes

    - Detect reasoning loop repetition: flag when Cosine_Similarity(Step_N, Step_N-1) > 0.95

    - Add circuit breakers that terminate reasoning when step count exceeds threshold

    '
  owasp_llm: LLM04:2025
  cwe: CWE-400
  attack_framework: Overthinking (Kong et al.), CRABS (Zhang et al., 2024), Sponge Examples
  references:
  - 'Kong et al. - Overthinking: Cognitive Exhaustion Attacks on Reasoning LLMs'
  - 'Zhang et al. - CRABS: Algorithmic Complexity Attacks (2024)'
  - 'Shumailov et al. - Sponge Examples: Energy-Latency DoS'
- id: MEDUSA-ACP-SCAN-037
  name: missing-rate-limiting-on-agent-endpoints
  severity: MEDIUM
  category: denial_of_service
  patterns:
  - (?i)@(?:app|router|api)\.(?:get|post|put|delete)\s*\(\s*["\x27]/(?:agent|chat|invoke|run|complete|generate|task)["\x27](?!.*(?:rate_limit|throttle|limiter|RateLimit|Throttle|slowapi))
  - (?i)(?:FastAPI|Flask|Express|Sanic)\s*\([^)]*\)(?![\s\S]*(?:rate_limit|throttle|limiter|SlowAPI|Limiter|RateLimitMiddleware))
  - (?i)@(?:tool|mcp_tool|agent_tool)\s*(?:\([^)]*\))?\s*\n(?!.*(?:rate_limit|throttle|cooldown))
  - (?i)websocket\.(?:accept|on_message|on_connect)(?!.*(?:rate|throttle|limit|queue))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Agent API endpoint or tool handler without rate limiting or throttling
  description: 'Agent-facing API endpoints and tool handlers without rate limiting enable

    denial-of-service through request flooding, automated jailbreak attempts

    (PAIR succeeds in <20 queries), and resource exhaustion. GPT-Fuzz achieves

    >90% ASR on Llama-2/Vicuna through automated fuzzing that requires high query

    volumes. MasterKey learns attack patterns by analyzing temporal dynamics of

    LLM updates through sustained probing (21.58% avg ASR vs 7.33% for manual

    prompts). Without rate limiting, attackers can also perform LLMmap fingerprinting

    to identify exact model families for targeted attacks, or execute CRABS-style

    automated complexity attacks at scale.

    '
  remediation: '- Add rate limiting to all agent-facing endpoints (recommended: 60 requests/minute)

    - Implement per-IP and per-client token bucket or sliding window throttling

    - Use SlowAPI, fastapi-limiter, or express-rate-limit middleware

    - Add WebSocket connection rate limiting and message throttling

    - Deploy perplexity filtering to detect unnatural automated query phrasing

    - Implement query pattern analysis to detect probing/fingerprinting attempts

    '
  owasp_llm: LLM10:2025
  cwe: CWE-770
  attack_framework: PAIR (<20 queries), GPT-Fuzz (>90% ASR), MasterKey (21.58% ASR)
  references:
  - PAIR - Prompt Automatic Iterative Refinement (2024)
  - GPT-Fuzz - Fuzzing for LLM Jailbreaks (2024)
  - MasterKey - Automated Jailbreak Learning (2024)
- id: MEDUSA-ACP-SCAN-038
  name: docker-privileged-agent-sandbox
  severity: CRITICAL
  category: sandbox_escape
  patterns:
  - (?i)privileged\s*:\s*true
  - (?i)network_mode\s*:\s*["\x27]?host["\x27]?
  - (?i)pid\s*:\s*["\x27]?host["\x27]?
  - (?i)cap_add\s*:[\s\S]*?-\s*(?:SYS_ADMIN|ALL|SYS_PTRACE|NET_ADMIN)
  - (?i)security_opt\s*:[\s\S]*?-\s*["\x27]?(?:seccomp\s*[:=]\s*unconfined|apparmor\s*[:=]\s*unconfined)["\x27]?
  - (?i)volumes\s*:[\s\S]*?-\s*["\x27]?/var/run/docker\.sock
  file_types:
  - '*.yaml'
  - '*.yml'
  - '*.json'
  - '*.toml'
  message: Agent sandbox container running in privileged mode or with host network - sandbox escape risk
  description: 'Docker containers hosting agent sandboxes configured with privileged: true,

    network_mode: host, or excessive capabilities (SYS_ADMIN, ALL) enable sandbox

    escape attacks. CVE-2025-59532 demonstrated that OpenAI Codex sandbox escape

    allowed directory traversal and unauthorized access. Privileged containers

    grant full access to the host kernel, effectively nullifying container isolation.

    Host networking exposes all host network interfaces to the agent. Docker socket

    mounting (/var/run/docker.sock) allows the agent to spawn sibling containers

    with arbitrary privileges. AgentBound (2025) demonstrated that policy-based

    isolation (80.9% policy generation accuracy) with negligible overhead blocks

    the majority of sandbox escape threats without requiring source code changes.

    '
  remediation: '- Never use privileged: true for agent sandbox containers

    - Use bridge or custom networks instead of network_mode: host

    - Drop all capabilities and add only required ones explicitly

    - Use gVisor (runsc) or Kata Containers for stronger isolation

    - Never mount the Docker socket inside agent containers

    - Enable seccomp and AppArmor profiles for container hardening

    - Deploy AgentBound-style declarative policy enforcement

    '
  owasp_llm: LLM06:2025
