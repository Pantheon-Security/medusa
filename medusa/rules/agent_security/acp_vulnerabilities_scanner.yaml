  message: Ad container with hidden prompt injection in accessibility or display attributes - AdInject pattern
  description: 'Detects advertisement containers embedding hidden prompt injection payloads in

    alt text, aria-label, or CSS-hidden content attributes. AdInject (analyzed in

    SecureWebArena by Ying et al., 2025) achieves approximately 96% PDR (Prompt

    Detection Rate) in shopping contexts against GPT-4o and Gemini 1.5 Pro. The

    attack modifies the agent''s Visual State of Mind (vSoM) by embedding deceptive

    ads mimicking legitimate UI elements (fake "Checkout" buttons, login forms).

    CSS techniques (display:none, opacity:0, font-size:0, transparent text) hide

    injection payloads from human users while remaining visible to agents that

    parse the DOM or accessibility tree. This combines UI misrepresentation

    (CWE-451) with indirect prompt injection through web content.

    '
  remediation: '- Strip or quarantine ad containers before agent DOM parsing

    - Implement ad-content isolation: exclude elements with ad-related classes from agent context

    - Flag hidden text (display:none, opacity:0, font-size:0) containing injection keywords

    - Deploy visual mimicry detection: compare element styling against legitimate UI patterns

    - Use content security policies to restrict ad injection into agent-accessible pages

    - Implement SecureWebArena-style environment-level attack detection

    '
  owasp_llm: LLM01:2025
  cwe: CWE-451
  attack_framework: AdInject (~96% PDR, Ying et al./SecureWebArena, 2025)
  references:
  - 'Ying et al. - SecureWebArena: AdInject Environment-Level Attacks (2025)'
  - AdInject - Ad-Based Prompt Injection on Web Agents (2025)
- id: MEDUSA-ACP-SCAN-041
  name: missing-image-purification-pipeline
  severity: MEDIUM
  category: multimodal_injection
  patterns:
  - (?i)(?:VLM|VisionModel|MultiModal|LLaVA|GPT4V|GPT-4-vision|Gemini.*Pro)\s*\([^)]*\)(?!.*(?:purif|preprocess|sanitize|filter|resize|crop|diffusion_reconstruct|noise_add))
  - (?i)(?:image|vision|visual)_(?:input|processor|encoder)\s*=(?!.*(?:purif|preprocess|sanitize|filter|augment))
  - (?i)(?:process_image|analyze_image|vision_inference)\s*\([^)]*\)(?!.*(?:purif|preprocess|sanitize|clean|filter))
  - (?i)(?:clip|blip|siglip|eva).*(?:encode|embed|process)\s*\([^)]*\)(?!.*(?:purif|preprocess|sanitize|noise))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: VLM agent configuration without image preprocessing or purification pipeline
  description: 'Vision-Language Model (VLM) agent configurations that process images without

    preprocessing or purification pipelines are vulnerable to adversarial image

    attacks. The Agent Smith attack exploits shared visual encoders (CLIP) across

    millions of agents, using a single adversarial image as a "universal trigger"

    mapped to a malicious embedding that overrides text-based safety alignment.

    Agent Smith can jailbreak 1M+ multimodal agents "exponentially fast" through

    shared encoder exploitation. Image purification defenses include random resizing,

    cropping, diffusion reconstruction, and noise addition, which disrupt adversarial

    perturbations while preserving semantic content. Without purification, VLM agents

    using FigStep (typographic visual prompts), Visual-Roleplay (character images),

    or PRISM attacks can bypass text-only safety guardrails entirely.

    '
  remediation: '- Implement image purification pipeline: random resizing, cropping, diffusion reconstruction

    - Add noise injection to input images before VLM processing

    - Deploy Cross-Modal Consistency Verification (visual embedding vs text prompt alignment)

    - Use separate, isolated visual encoders rather than shared CLIP instances

    - Apply input image format validation and metadata stripping

    - Implement adversarial example detection before VLM inference

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
  attack_framework: Agent Smith (1M+ agents), FigStep, Visual-Roleplay, PRISM
  references:
  - Agent Smith - Viral Multimodal Jailbreak via Shared Encoders (2025)
  - 'Gong et al. - FigStep: Typographic Visual Prompt Jailbreak'
  - Ma et al. - Visual-Roleplay VLM Jailbreak
- id: MEDUSA-ACP-SCAN-042
  name: langchain-chatchat-path-traversal
  severity: CRITICAL
  category: path_traversal
  patterns:
  - (?i)(?:upload|save|store)_file\s*\([^)]*(?:filename|file_path|path)\s*=\s*(?:request|form|input|user|args|params)\b
  - (?i)(?:filename|file_path|path)\s*=\s*(?:request|form|input)\.[^;]*(?!.*(?:secure_filename|sanitize|validate_path|os\.path\.basename|pathlib\.PurePosixPath))
  - (?i)os\.path\.join\s*\([^)]*(?:request|user_input|form_data|args|params)\s*\[?\s*["\x27]?(?:filename|path|file)["\x27]?\s*\]?
  - (?i)(?:open|write|read)\s*\(\s*(?:upload_dir|base_path|store_path)\s*(?:\+|\/)\s*(?:filename|file_path|user_path)
  - (?i)base64\.b64decode\s*\([^)]*\)\s*.*(?:path|filename|directory)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: File upload handler with unsanitized path input - path traversal risk (CVE-2025-6853/6854/6855)
  description: 'Detects file upload handlers constructing paths from unsanitized user input,

    enabling path traversal attacks. CVE-2025-6853, CVE-2025-6854, and CVE-2025-6855

    affected LangChain-Chatchat, demonstrating that agent framework file handlers

    accepting user-controlled filenames allow ../../../etc/passwd style traversal

    to read arbitrary files, and base64-encoded path components to bypass naive

    string filters. File upload is a common agent tool capability (MCP filesystem

    server, document processors) that requires strict path validation. Without

    sanitization, attackers can overwrite configuration files, read credentials,

    or achieve code execution through file placement attacks.

    '
  remediation: '- Use secure_filename() or os.path.basename() on all user-supplied filenames

    - Validate paths against an allowlist of permitted directories

    - Reject paths containing ../ sequences, null bytes, or encoded traversal patterns

    - Use pathlib for safe path construction: PurePosixPath(user_input).name

    - Implement chroot or container-based filesystem isolation for upload handlers

    - Decode and re-validate Base64-encoded path components before filesystem operations

    '
  owasp_llm: LLM06:2025
  cwe: CWE-22
  cve: CVE-2025-6853
  attack_framework: CVE-2025-6853/6854/6855 (LangChain-Chatchat Path Traversal)
  references:
  - CVE-2025-6853 - LangChain-Chatchat Path Traversal via File Upload
  - CVE-2025-6854 - LangChain-Chatchat Path Traversal via Encoded Paths
  - CVE-2025-6855 - LangChain-Chatchat Path Traversal via Directory Escape
