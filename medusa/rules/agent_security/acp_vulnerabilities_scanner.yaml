  patterns:
  - (?i)(?:sandbox|execution)_(?:config|settings|env)\s*=\s*\{[^}]*\}(?!.*(?:gvisor|runsc|kata|firecracker|docker|nsjail|bubblewrap|seccomp))
  - (?i)(?:code_exec|sandbox|interpreter).*(?:allow_network|network_access)\s*[=:]\s*(?:True|true|1|"all"|"unrestricted")
  - (?i)(?:sandbox|exec)_(?:dir|path|root)\s*=\s*["\x27](/|~|/home|/tmp|C:\\\\)["\x27](?!.*(?:chroot|jail|mount.*readonly))
  - (?i)(?:run_code|execute_code|sandbox_exec)\s*\([^)]*\)(?!.*(?:isolated|sandbox|container|jail|restrict))
  - (?i)(?:subprocess|os\.system|exec)\s*\([^)]*\)\s*.*#\s*(?:sandbox|agent|code_exec)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  message: Code execution sandbox with insufficient isolation - sandbox escape risk (CVE-2025-59532)
  description: 'Detects agent code execution sandboxes configured without robust isolation

    mechanisms (gVisor, Docker, Firecracker, nsjail). CVE-2025-59532 demonstrated

    that OpenAI Codex sandbox allowed directory escape and unauthorized access to

    host resources. Weak sandboxes that grant unrestricted network access, use

    broad filesystem paths (/, ~, /home), or rely solely on process-level isolation

    without kernel-level boundaries (seccomp, AppArmor, gVisor) are vulnerable to

    escape. Agent code execution is inherently high-risk because the executed code

    originates from LLM generation, which can be manipulated through prompt injection

    or tool poisoning attacks. AgentBound demonstrated that declarative policy-based

    isolation achieves 80.9% policy generation accuracy with negligible overhead.

    '
  remediation: '- Use gVisor (runsc), Kata Containers, or Firecracker for kernel-level isolation

    - Restrict sandbox filesystem to a minimal, read-only root with tmpfs for writes

    - Block all network access from code execution sandboxes by default

    - Apply seccomp profiles restricting syscalls to minimum required set

    - Use nsjail or bubblewrap for lightweight namespace-based isolation

    - Implement execution time limits and memory caps within the sandbox

    - Deploy AgentBound-style declarative policy enforcement

    '
  owasp_llm: LLM06:2025
  cwe: CWE-20
  cve: CVE-2025-59532
  attack_framework: CVE-2025-59532 (Codex Sandbox Escape), AgentBound
  references:
  - CVE-2025-59532 - OpenAI Codex Sandbox Escape
  - AgentBound - Declarative Policy Enforcement for MCP (2025)
