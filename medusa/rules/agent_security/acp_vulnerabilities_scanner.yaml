  - (?i)(?:rag|knowledge_base|kb|index)\.(?:add|ingest|store|update)\s*\([^)]*\)(?!.*(?:sanitize|validate|filter|clean|strip|purify|check))
  - (?i)(?:add_documents|ingest_documents|index_documents)\s*\(\s*(?:raw_|unfiltered_|external_|fetched_)?(?:docs|documents|texts|content)
  - (?i)(?:embedding|embed).*(?:store|save|insert|add)\s*\([^)]*(?:user_|external_|raw_|scraped_|crawl)
  - (?i)(?:requests\.get|urllib|httpx|aiohttp)\s*\([^)]*\)[\s\S]{0,200}(?:vector_store|chroma|pinecone|index)\.(?:add|upsert|insert)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: RAG/vector store accepts unsanitized external content - Morris II worm propagation vector
  description: 'Detects RAG or vector store write operations that ingest external content

    (web-scraped, email-sourced, API-fetched) without sanitization, enabling the

    Morris II (Cohen et al.) zero-click GenAI worm propagation path. Morris II

    infects a host (e.g., email assistant) via adversarial input, then self-replicates

    by poisoning the RAG database so that future retrievals serve the malicious

    payload to new victims without user interaction. The Phantom attack (Chaudhari

    et al., 2024) embeds broadly-applicable triggers that force retrieval of

    malicious documents across a wide range of queries. Snowball attacks inject

    manipulated knowledge that propagates and amplifies through agent interactions,

    creating a "snowball effect" shifting entire system consensus. Without input

    sanitization on RAG writes, a single compromised document can infect an

    entire knowledge base permanently.

    '
  remediation: '- Sanitize all external content before RAG/vector store ingestion

    - Strip executable prompts and injection patterns from retrieved content

    - Implement TrustRAG clustering-based anomaly detection on ingested documents

    - Deploy RobustRAG consensus-based verification across multiple sources

    - Add provenance tracking to all ingested documents (source, timestamp, trust score)

    - Use append-only vector stores with admin-only deletion for rollback capability

    - Implement content hash deduplication to prevent re-ingestion of known-bad documents

    '
  owasp_llm: LLM08:2025
  cwe: CWE-94
  attack_framework: Morris II (Zero-Click Worm, Cohen et al.), Phantom, Snowball
  references:
  - 'Cohen et al. - Morris II: Zero-Click GenAI Worm (2024)'
  - 'Chaudhari et al. - Phantom: General Trigger Attack on RAG (2024)'
  - Snowball - Flooding Spread in Multi-Agent Systems
- id: MEDUSA-ACP-SCAN-046
  name: agent-output-fed-to-email-send
  severity: HIGH
  category: worm_propagation
  patterns:
  - (?i)(?:send_email|send_message|smtp|mail|sendgrid|ses\.send|postmark)\s*\([^)]*(?:body|content|text|message)\s*=\s*(?:agent_|llm_|model_|generated_|ai_)?(?:output|response|result|completion|answer)
  - (?i)(?:email|message|notification)\.(?:body|content|text)\s*=\s*(?:agent|llm|model|chain|tool)[\._](?:output|response|result|run|invoke)
  - (?i)(?:tool_call|invoke_tool)\s*\([^)]*["\x27](?:send_email|gmail|outlook|slack|teams|discord|telegram)["\x27][^)]*(?:agent_output|response|result)
  - (?i)(?:agent|llm|model)\.(?:run|invoke|generate|complete)\s*\([^)]*\)[\s\S]{0,200}(?:send_email|smtp|mail|slack|teams|webhook)(?!.*(?:review|approv|confirm|moderate|filter|sanitize))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Agent output directly fed to email/messaging tool without content review - Morris II propagation path
  description: 'Detects agent-generated output being passed directly to email, messaging, or

    notification tools without intermediate content review, moderation, or

    sanitization. This is the primary propagation path for the Morris II worm

    (Cohen et al.): a compromised agent generates a malicious payload as part of

    its output, which is then automatically sent to other users/agents via email

    or messaging tools, spreading the infection without human interaction. The

    attack requires two conditions: (1) the agent can generate arbitrary content

    (which prompt injection enables), and (2) that content flows directly to a

    communication tool without review. Prompt Infection (Lee & Tiwari) demonstrated

    that infected agents achieve full saturation of a 50-agent society by turn 10.7

    through exactly this pattern of output-to-communication chaining.

    '
  remediation: '- Require human-in-the-loop approval for all agent-generated outbound communications

    - Implement content moderation on agent output before feeding to messaging tools

    - Add injection pattern scanning on outbound message content

    - Deploy Flow Correlation Analysis for recursive output generation patterns

    - Use rate limiting on agent-initiated email/message sends

    - Implement output sanitization stripping executable prompts and injection payloads

    - Log all agent-to-communication-tool flows for audit and forensic analysis

    '
  owasp_llm: LLM01:2025
  cwe: CWE-94
  attack_framework: Morris II Propagation (Cohen et al.), Prompt Infection (saturation turn 10.7)
  references:
  - 'Cohen et al. - Morris II: Self-Replicating GenAI Worm Propagation (2024)'
  - Lee & Tiwari - Prompt Infection in Multi-Agent Systems (2024)
