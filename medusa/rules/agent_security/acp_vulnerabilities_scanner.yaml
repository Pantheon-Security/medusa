  cwe: CWE-1021
  attack_framework: AEIA (93% ASR, Chen et al., 2025)
  references:
  - 'Chen et al. - AEIA: Active Environment Injection Attack on MLLM Agents (2025)'
  - AEIA-MN Framework - AndroidWorld Benchmark (2025)
