  name: huggingface-smolagents-xpath-injection
  severity: HIGH
  category: injection
  patterns:
  - (?i)(?:xpath|xml_query|xml_select)\s*\(\s*(?:f["\x27]|["\x27].*\+|.*\.format\(|.*%\s)
  - (?i)(?:tree|root|doc|xml)\.(?:xpath|find|findall|select)\s*\(\s*(?:f["\x27]|["\x27].*\+|.*\.format\(|.*%\s*(?:user|input|query|request|args|param))
  - (?i)(?:etree|lxml|ElementTree).*\.xpath\s*\(\s*(?:user_input|query|request|args|param|tool_input)
  - (?i)xpath_query\s*=\s*(?:f["\x27]|["\x27].*\+\s*(?:user|input|query|request))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: XPath query constructed from user input without parameterization - XPath injection (CVE-2025-11844)
  description: 'Detects XPath queries built through string concatenation or f-string interpolation

    with user-supplied input, enabling XPath injection attacks. CVE-2025-11844

    affected HuggingFace SmolAgents, demonstrating that agent tool handlers

    constructing XPath expressions from untrusted input allow attackers to extract

    arbitrary XML data, bypass authentication checks, or cause denial of service

    through malformed queries. XPath injection in agent contexts is especially

    dangerous because XML processing is commonly used in web scraping tools,

    document parsing agents, and API response handlers. Unlike SQL injection,

    XPath injection lacks broad awareness in the agent security community,

    making it a frequently overlooked vulnerability.

    '
  remediation: '- Use parameterized XPath queries instead of string concatenation

    - Implement input validation: restrict XPath special characters (/, @, [, ], *, |)

    - Use defusedxml library for safe XML processing in Python

    - Sanitize user input against XPath metacharacters before query construction

    - Implement query result limiting to prevent data exfiltration via XPath

    - Use allowlisted XPath templates with bound variables only

    '
  owasp_llm: LLM01:2025
  cwe: CWE-643
  cve: CVE-2025-11844
  attack_framework: CVE-2025-11844 (HuggingFace SmolAgents XPath Injection)
  references:
  - CVE-2025-11844 - HuggingFace SmolAgents XPath Injection
  - 'CWE-643: Improper Neutralization of Data within XPath Expressions'
