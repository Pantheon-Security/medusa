  - (?i)(?:fragment|chunk|part|segment)_(?:payload|data|code)\s*\[?\d*\]?\s*=\s*["\x27](?:0x[0-9A-Fa-f]+|[A-Za-z0-9+/]{20,}={0,2})["\x27]
