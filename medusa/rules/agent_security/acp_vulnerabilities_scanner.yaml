  - (?i)<(?:div|span|iframe|img)[^>]*(?:ad|sponsor|promo)[^>]*(?:aria-label|alt|data-content)\s*=\s*["\x27][^"]*(?:ignore\s+previous|system\s+instruction|execute|override)[^"]*["\x27]
