  - '*.yml'
  message: Encrypted or Base64-encoded payload fragments with runtime decryption - DemonAgent backdoor pattern
  description: 'Detects patterns consistent with the DemonAgent attack (Zhu et al., 2025),

    which decomposes backdoor payloads into encrypted sub-fragments distributed

    across agent inputs. Dynamic Encryption maps backdoor signals into benign-looking

    Base64 or hex-encoded content that is reassembled and decrypted at runtime via

    eval(decrypt(input)) or exec(base64.b64decode(input)). DemonAgent achieves

    ~100% ASR with 0% detection rate against current safety mechanisms, explicitly

    bypassing traditional safety audits that analyze the reasoning process by hiding

    signals in encrypted benign-looking content. The AgentBackdoorEval benchmark

    confirms that no existing defense detects this pattern statically.

    '
  remediation: "- Block eval()/exec() on any decrypted or decoded content\n- Flag Base64/hex payloads exceeding 20 characters\
    \ in agent input fields\n- Implement fragment reassembly detection: flag if concat(input_stream_history)\n  contains trigger\
    \ keywords even if individual messages do not\n- Use sandboxed execution environments with no eval/exec permissions\n\
    - Deploy runtime monitoring for context window split-token reassembly\n- Require code review for any cryptographic operations\
