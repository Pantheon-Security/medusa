- id: MEDUSA-ACP-SCAN-020
  name: prompt-missing-input-boundary-tokens
  severity: MEDIUM
  category: prompt_injection
  patterns:
  - (?i)(?:system|prompt)\s*=\s*["\x27][^"]*["\x27]\s*\+\s*(?:user|input|query)(?!.*(?:####|<start>|<end>|DELIMITER|BOUNDARY|----))
  - (?i)messages\s*=\s*\[.*\{"role":\s*"user",\s*"content":\s*(?:user_input|query|message)\}(?!.*(?:delimiter|boundary|separator))
  - (?i)context\s*=\s*(?:system_prompt|instructions)\s*\+\s*["\x27]\\n["\x27]\s*\+\s*(?:user_input|query)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Prompt construction without input boundary tokens or delimiters
  description: 'Prompts constructed without explicit boundary tokens between system instructions

    and user input allow attackers to escape the user context and inject system-level

    instructions. Wang et al. (PPA) demonstrated that weak delimiters (simple

    brackets, newlines) are trivially escaped by attackers. Without explicit

    boundaries like ####begin_user_input####, the LLM cannot distinguish between

    legitimate instructions and injected content. Payload splitting attacks

    break malicious instructions across multiple messages that individually appear

    benign but combine to form an exploit.

    '
  remediation: '- Use explicit boundary tokens: ####begin_user_input####...####end_user_input####

    - Implement structured message formats with role-based separation

    - Use XML-style delimiters: <user_input>...</user_input>

    - Apply multiple delimiter strategies (nesting reduces bypass rates)

    - Validate that user content does not contain boundary token sequences

    '
  owasp_llm: LLM01:2025
  cwe: CWE-20
  attack_framework: Payload Splitting, Weak Delimiter Bypass (Wang et al.)
  references:
  - 'Wang et al. - PPA: Prompt Boundary Analysis (2025)'
