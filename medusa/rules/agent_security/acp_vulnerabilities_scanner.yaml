  message: LoRA adapter loaded without weight scanning or integrity verification - trojaned plugin risk
  description: 'Loading LoRA adapters or PEFT plugins from untrusted sources without weight

    scanning enables the Polished and Fusion backdoor attacks. Polished (2025)

    embeds backdoors directly in LoRA adapter weights while preserving benign task

    performance, making functional testing insufficient for detection. Fusion merges

    a clean adapter with a poisoned one, producing an adapter that passes standard

    evaluation but contains hidden trigger-activated behaviors. Both attacks achieve

    high success rates while maintaining model utility on non-trigger inputs.

    Third-party adapter marketplaces (HuggingFace Hub, adapter registries) are

    primary supply chain vectors for trojaned plugins.

    '
  remediation: '- Implement weight scanning for all third-party LoRA adapters before loading

    - Verify adapter checksums against trusted registries

    - Use spectral signature analysis to detect anomalous weight distributions

    - Pin adapter versions with cryptographic hash verification

    - Test adapters against known trigger patterns before deployment

    - Maintain an allowlist of trusted adapter publishers

    '
  owasp_llm: LLM05:2025
