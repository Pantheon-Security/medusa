  message: Potential backdoor trigger patterns in prompt templates or unverified soft prompt loading
  description: 'Detects backdoor trigger indicators in prompt templates, including rare word

    frequency anomalies and unverified soft prompt tensor loading. BadPrompt

    (Cai et al., 2022) uses Trigger Candidate Generation (TCG) to identify

    semantically indicative rare words, then Adaptive Trigger Optimization (ATO)

    to embed them in few-shot prompt templates. PoisonPrompt (Yao et al., 2024)

    compromises both hard (discrete token) and soft (continuous embedding) prompts

    in Prompt-as-a-Service deployments. Verification requires comparing prompt

    tensor hashes: Hash(prompt_tensor) != Hash(trusted_tensor) indicates tampering.

    Triggers are deliberately chosen to be semantically distinct from non-target

    labels, making manual review insufficient.

    '
  remediation: "- Verify prompt tensor integrity: compare Hash(prompt_tensor) against Hash(trusted_tensor)\n- Implement rare\
    \ word frequency analysis on prompt templates (flag statistically\n  improbable token distributions)\n- Use only signed\
    \ and hash-verified soft prompts from trusted sources\n- Monitor prompt template changes with version control and diff\
    \ alerting\n- Apply spectral signature analysis to detect anomalous prompt embeddings\n- Implement prompt provenance tracking\
    \ for Prompt-as-a-Service deployments\n"
  owasp_llm: LLM03:2025
