    may contain backdoors, credential exfiltration, or tool poisoning payloads.

    The MCP ecosystem''s lack of version locking is analogous to npm/pip dependency

    confusion attacks. Post-install behavioral changes go undetected without

    version-locked configurations.

    '
  remediation: '- Pin exact versions for all tool and MCP server dependencies

    - Use lockfiles (package-lock.json, poetry.lock) with integrity hashes

    - Implement automated version drift detection and alerting

    - Maintain a Bill of Materials (BOM) for all agent tool dependencies

    - Use reproducible builds with verified dependency resolution

    '
