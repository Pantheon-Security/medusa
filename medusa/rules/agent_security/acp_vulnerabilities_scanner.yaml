  message: UI accessibility attribute contains prompt injection keywords - AEIA attack pattern
  description: 'Detects prompt injection keywords embedded in UI accessibility attributes

    (aria-label, aria-describedby, alt text, contentDescription) that target

    multimodal agents. The AEIA (Active Environment Injection Attack) by Chen et al.

    (2025) achieves 93% ASR on AndroidWorld by exploiting the inability of MLLM-based

    agents to distinguish legitimate UI elements from malicious impostors. Adversarial

    instructions are embedded in buttons, text fields, and accessibility labels that

    the agent reads during screen parsing. The attack exploits two vulnerabilities:

    (1) Interaction Vulnerability - malicious instructions in UI elements, and

    (2) Reasoning Gap - exploiting the agent''s reasoning process to amplify

    susceptibility. Standard prompt-based defenses are ineffective; fine-tuning-based

    defenses are required.

    '
  remediation: '- Sanitize all accessibility attributes against injection patterns before agent processing

    - Implement UI element trust scoring based on source domain and element provenance

    - Deploy fine-tuning-based defenses (prompt-based defenses are insufficient per AEIA research)

    - Add Cross-Modal Consistency Verification: compare visual rendering vs accessibility text

    - Flag elements where OCR(image_region) != Button.Text (visual-text mismatch)

    - Restrict agent UI interaction to allowlisted application interfaces

    '
