  - (?i)(?:description|docstring)["\x27]\s*:\s*["\x27].*(?:always\s+use\s+this|superior|optimal|certified|authoritative|trusted|verified)\s+(?:tool|service|api)
  - (?i)(?:description|docstring)["\x27]\s*:\s*["\x27].*(?:ignore|skip|avoid|do\s+not\s+use)\s+other\s+tools
  - (?i)"name"\s*:\s*"(?:official|verified|trusted|secure|premium|pro)-[^"]*"
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.ts'
  - '*.js'
  message: Tool description contains promotional or authoritative adjectives - Attractive Metadata manipulation
  description: 'Detects promotional or authoritative language in tool descriptions designed to

    bias LLM tool selection. The Attractive Metadata attack (Guo et al., 2025;

    Zhang et al. MSB) injects adjectives like "best tool", "Official version",

    "Recommended", or "most secure" into malicious tool descriptions to manipulate

    the LLM''s planning and ranking process. This causes the LLM to preferentially

    select the malicious tool over legitimate alternatives. Preference Manipulation

    achieves 18.75% ASR alone on Llama-3.3-70B, rising to 76.25% when combined

    with Out-of-Scope Parameter attacks (PM-OP). Tool names prefixed with

    "official-", "verified-", or "trusted-" are additional indicators.

    '
  remediation: "- Strip promotional adjectives from tool descriptions before LLM exposure\n- Implement tool description schema\
    \ validation rejecting superlative claims\n- Use Scarecrow prompting to heighten model scrutiny of tool descriptors\n\
    \  (71.5% block rate on GPT-4, 64.0% on DeepSeek)\n- Apply Verifier prompting to vet tool parameters before execution\n\
    \  (60.1% block rate on GPT-4, 55.0% on DeepSeek)\n- Normalize all tool descriptions to a consistent, factual template\n\
    - Flag tools whose descriptions significantly differ from their schema\n"
  owasp_llm: LLM01:2025
  cwe: CWE-20
  attack_framework: Attractive Metadata (Guo et al., 2025), PM-OP (76.25% ASR)
  references:
  - Guo et al. - Tool Preference Manipulation via Attractive Metadata (2025)
  - 'Zhang et al. - MCP Security Bench: PM + Out-of-Scope Parameter (2025)'
