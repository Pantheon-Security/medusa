  - (?i)(?:"name"\s*:\s*"[^"]*(?:_v2|_new|_updated|_fixed|_enhanced|_pro|_official)")
  - (?i)"(?:url|endpoint)"\s*:\s*"https?://(?!localhost)[^"]*"[^}]*"description"\s*:\s*"[^"]*(?:same\s+as|replaces|upgrade\s+to|supersedes|alternative\s+to)
  file_types:
