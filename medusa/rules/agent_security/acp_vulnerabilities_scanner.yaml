  - 'Yao et al. - PoisonPrompt: Backdoor on Prompt-Based Learning (2024)'
- id: MEDUSA-ACP-SCAN-033
  name: cross-tool-implicit-context-access
  severity: HIGH
  category: information_disclosure
  patterns:
  - (?i)context\.get\s*\(\s*["\x27](?:api_key|token|secret|password|credential|session_id|auth)["\x27]\s*\)
  - (?i)global_state\s*\[\s*["\x27](?:user_data|credentials|api_key|auth_token|session|private)["\x27]\s*\]
  - (?i)shared_(?:context|memory|state)\s*\[\s*["\x27](?!(?:tool_name|status|timestamp))[^"]*["\x27]\s*\]
  - (?i)os\.environ\s*\[\s*["\x27](?:API_KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL)["\x27]\s*\](?!.*(?:declared|dependency|required))
  - (?i)(?:tool|handler|function)_(?:context|state)\.(?:get|read|access)\s*\([^)]*(?:key|secret|token|password|credential)
  file_types:
  - '*.py'
  - '*.ts'
  - '*.js'
  message: Tool accesses sensitive shared context variables without declared dependency - Les Dissonances pattern
  description: 'Detects tools that access sensitive shared context variables (API keys, user data,

    session tokens) without explicitly declaring those dependencies. The Les Dissonances

    attack (Li, Cui, Liao & Xing, 2025) exploits the division of labor and shared

    memory space in protocols like MCP through two phases: (1) Harvesting - malicious

    Tool A defines or accesses a sensitive variable, and (2) Polluting/Theft -

    benign-looking Tool B uses LLM contextual inference to access data left by Tool A.

    Individual tools show no malicious logic; the malice emerges only from their

    interaction through shared context. This makes detection extremely difficult with

    per-tool analysis alone.

    '
  remediation: '- Require explicit dependency declarations for all context variable access

    - Implement per-tool context isolation with capability-based access control

    - Use Progent-style programmable privilege control for fine-grained authorization

    - Audit cross-tool data flow paths for undeclared information sharing

    - Apply taint tracking to sensitive variables across tool boundaries

    - Deploy AgentBound manifest permissions to restrict MCP server actions

    '
  owasp_llm: LLM02:2025
  cwe: CWE-200
  attack_framework: Les Dissonances (Li et al., 2025)
  references:
  - 'Li, Cui, Liao & Xing - Les Dissonances: Multi-Tool Coordination Attack (2025)'
  - AgentBound - Access Control Framework for MCP Servers (2025)
