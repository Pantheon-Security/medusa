  - '*.ts'
  - '*.js'
  message: System prompt and user input combined without explicit role separation
  description: 'Combining system instructions and user input in a single prompt string without

    role-based message structure (system/user/assistant) weakens the boundary

    between privileged instructions and untrusted input. Modern APIs support

    structured messages with explicit roles. Without this separation, DAN and

    identity shift jailbreaks can override system instructions. Crescendo attacks

    gradually escalate across multi-turn conversations to bypass safety boundaries.

    '
