# MEDUSA Scanner Rules - UCP Security & Agentic Commerce
# Source: NotebookLM UCP Security & Agentic Commerce 2024-2026 (50 papers)
# Version: 1.0.0
# Last Updated: 2026-02-08
# Purpose: STATIC CODE ANALYSIS - detecting vulnerable patterns at build/scan time
#
# Research Base:
#   - Dusad et al. (2025): Autonomous Payment Agents, PoTE validation framework
#   - Goenka et al. (2026): x402/HTTP-402 Payment Protocol, escrow-first settlement
#   - Patel et al. (2026): Agentic Commerce Mandate Model (Intent/Cart/Payment mandates)
#   - Mittal et al. (2026): Phantom Deposit attacks on optimistic settlement
#   - Goswami et al. (2025): Agent JWT Extensions (agent_checksum, delegation_chain)
#   - Shi et al. (2025): Proof-of-Possession for Agentic Tokens
#   - Palavali et al. (2025): DID-based Agent Identity & Delegation Chains
#   - Saavedra et al. (2026): Trust Trilemma (Brief/Stake/Proof) for Agent Commerce
#   - Patlan et al. (2025): RAG Memory Poisoning via Tool Output Injection
#   - Chang et al. (2026): Cross-Session Memory Leakage in Persistent Agents
#   - Zhang et al. (2024): CheckTool Framework for RAG Input Sanitization
#   - Buhler et al. (2025): Agent Sandbox Escape via Docker Socket Mounting
#   - Vilches et al. (2025): ROS/Robotics Agent Filesystem Breakout
#   - Liu et al. (2025): Infinite Loop & Resource Exhaustion in Agent Pipelines
#   - Ying et al. (2025): AdInject Web Agent Exploitation (~96% PDR)
#   - Johnson et al. (2025): DOM-Based Agent Manipulation Attacks
#   - Evtimov et al. (2025): Pop-up/Modal Hijacking of Web Agents
#   - Wang et al. (2025): Adversarial Image Perturbations Against VLM Agents
#   - Zeeshan et al. (2025): Structured Data Injection (CSV/JSON/XML)
#   - Feng et al. (2025): Image Scaling Attacks on Vision-Language Models
#
# CWEs: CWE-20, CWE-78, CWE-94, CWE-250, CWE-284, CWE-285, CWE-287, CWE-295,
#        CWE-306, CWE-311, CWE-345, CWE-346, CWE-352, CWE-400, CWE-613, CWE-693,
#        CWE-770, CWE-798, CWE-862, CWE-915, CWE-918, CWE-1021

rules:
  # =============================================================================
  # SECTION 1: AGENTIC COMMERCE PAYMENT VULNERABILITIES (10 rules)
  # Source: Dusad 2025, Goenka 2026, Patel 2026, Mittal 2026
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-001
    name: payment-gateway-without-pote-verification
    severity: CRITICAL
    category: payment_security
    patterns:
      - 'stripe\.charges\.create\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_?[Pp]o[Tt][Ee]|proof_of_task|task_proof|verify_execution))'
      - 'stripe\.paymentIntents\.create\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_?[Pp]o[Tt][Ee]|proof_of_task))'
      - 'web3\.eth\.send_?[Tt]ransaction\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_?[Pp]o[Tt][Ee]|proof_of_task))'
      - 'paypal\.payment\.create\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_?[Pp]o[Tt][Ee]|proof_of_task))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.sol"
    message: "Payment gateway call without preceding Proof of Task Execution (PoTE) verification"
    description: |
      Payment operations (Stripe charges, Web3 transactions, PayPal payments) executed
      without verifying Proof of Task Execution (PoTE) enable settlement for work never
      performed. Dusad et al. (2025) established that autonomous payment agents MUST
      validate PoTE cryptographic proofs before initiating any settlement. Without PoTE,
      a compromised or hallucinating agent can authorize payments for fabricated task
      completions, leading to direct financial loss. Goenka et al. (2026) demonstrated
      that x402-compliant flows require escrow + PoTE as a mandatory precondition to
      payment finalization.
    remediation: |
      - Call verifyPoTE() or equivalent proof validation before any payment API call
      - Implement escrow-first settlement: funds held until PoTE is cryptographically verified
      - Add TLS Notary attestation (verifyTLSNotary) for web-based task evidence
      - Log all PoTE verification results alongside payment transaction IDs
      - Reject payment if PoTE signature is missing, expired, or fails validation
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"
    attack_framework: "PoTE Bypass Settlement Fraud (Dusad et al., 2025)"
    references:
      - "Dusad et al. - Autonomous Payment Agents and PoTE Framework (2025)"
      - "Goenka et al. - x402 HTTP Payment Protocol (2026)"

  - id: MEDUSA-UCP-SCAN-002
    name: mandate-without-signature-verification
    severity: CRITICAL
    category: payment_security
    patterns:
      - '(?i)(?:intent_?mandate|cart_?mandate|payment_?mandate)\.(?:execute|process|submit|authorize)\s*\([^)]*\)(?![\s\S]{0,200}verify_?[Ss]ignature)'
      - '(?i)mandate\s*=\s*(?:IntentMandate|CartMandate|PaymentMandate)\s*\([^)]*\)[\s\S]{0,300}\.(?:execute|process)(?![\s\S]{0,200}verify_?[Ss]ignature)'
      - '(?i)(?:process|execute)_mandate\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_sig|check_signature|validate_signature))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Mandate object executed without signature verification"
    description: |
      The Agentic Commerce Mandate Model (Patel et al., 2026) defines three mandate types:
      IntentMandate (user intent), CartMandate (merchant offer), and PaymentMandate
      (settlement authorization). Each mandate MUST be cryptographically signed by its
      issuer and verified before execution. Processing an unsigned or unverified mandate
      allows mandate spoofing -- an attacker can forge a CartMandate with inflated prices
      or a PaymentMandate directing funds to an attacker-controlled account. Mandate
      tampering was identified as the highest-severity threat in the UCP trust model.
    remediation: |
      - Call mandate.verifySignature() before any mandate.execute() or mandate.process()
      - Validate signer identity against the expected issuer (user DID, merchant DID)
      - Reject mandates with missing, expired, or invalid signatures
      - Implement mandate chaining: PaymentMandate must reference a valid signed CartMandate
      - Log signature verification results for audit trails
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"
    attack_framework: "Mandate Spoofing (Patel et al., 2026)"
    references:
      - "Patel et al. - Agentic Commerce Mandate Model (2026)"

  - id: MEDUSA-UCP-SCAN-003
    name: http-402-payment-without-escrow
    severity: HIGH
    category: payment_security
    patterns:
      - '(?i)(?:status_?code|status)\s*==\s*402(?![\s\S]{0,300}escrow)'
      - '(?i)x-?402-?(?:payment|price|token)(?![\s\S]{0,300}escrow)'
      - '(?i)headers\[.x-?402.?\](?![\s\S]{0,300}escrow)'
      - '(?i)response\.status\s*==\s*402[\s\S]{0,200}(?:pay|send|transfer)(?![\s\S]{0,200}escrow)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "HTTP 402 payment triggered without escrow mechanism"
    description: |
      The x402 protocol (Goenka et al., 2026) uses HTTP 402 status codes to signal
      payment requirements. When an agent receives a 402 response and directly initiates
      payment without an escrow intermediary, it creates a pay-then-hope pattern where
      funds are sent before service delivery is guaranteed. The x402 specification mandates
      escrow-first settlement to protect both payer and payee. Direct payment on 402
      enables the Phantom Deposit attack (Mittal et al., 2026) where a malicious service
      confirms payment receipt but never delivers the service.
    remediation: |
      - Route all 402-triggered payments through an escrow contract or service
      - Implement escrow.deposit() before service invocation, escrow.release() after PoTE
      - Set escrow timeout with automatic refund on non-delivery
      - Validate x402 response headers (x-402-price, x-402-token) against pre-agreed terms
      - Never auto-pay 402 responses without budget validation and escrow protection
    owasp_llm: "LLM06:2025"
    cwe: "CWE-862"
    attack_framework: "Phantom Deposit (Mittal et al., 2026)"
    references:
      - "Goenka et al. - x402 HTTP Payment Protocol (2026)"
      - "Mittal et al. - Phantom Deposit Attacks on Agent Settlement (2026)"

  - id: MEDUSA-UCP-SCAN-004
    name: intent-mandate-missing-ttl-budget
    severity: HIGH
    category: payment_security
    patterns:
      - '(?i)IntentMandate\s*\([^)]*\)(?![\s\S]{0,200}(?:ttl|time_to_live|expir|timeout|max_age))'
      - '(?i)IntentMandate\s*\([^)]*\)(?![\s\S]{0,200}(?:budget|max_amount|spend_limit|max_cost))'
      - '(?i)intent_mandate\s*=\s*\{[^}]*\}(?![\s\S]{0,200}(?:ttl|budget|max_amount|expir))'
      - '(?i)create_intent\s*\([^)]*\)(?![\s\S]{0,200}(?:ttl|budget|max_amount|timeout))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
    message: "Intent Mandate created without TTL or budget limits"
    description: |
      Intent Mandates represent user purchasing intent delegated to an autonomous agent.
      Without TTL (time-to-live) and budget constraints, an agent can act on stale intent
      indefinitely or exceed the user's spending expectations. Patel et al. (2026)
      specify that every IntentMandate MUST include: (1) a TTL limiting the mandate's
      validity window, (2) a max_amount or budget cap, and (3) category/merchant
      constraints. Unbounded mandates enable runaway agent spending and are exploitable
      by adversarial merchants presenting time-pressure offers to agents.
    remediation: |
      - Set ttl/expiration on all IntentMandate objects (recommended: 300-3600 seconds)
      - Set max_amount/budget cap reflecting user-approved spending limits
      - Add category_constraints to restrict eligible purchase categories
      - Add merchant_allowlist to restrict eligible merchants
      - Implement budget tracking with cumulative spend alerts
    owasp_llm: "LLM06:2025"
    cwe: "CWE-770"
    attack_framework: "Unbounded Mandate Exploitation (Patel et al., 2026)"
    references:
      - "Patel et al. - Agentic Commerce Mandate Model (2026)"

  - id: MEDUSA-UCP-SCAN-005
    name: cart-mandate-missing-merchant-signature
    severity: HIGH
    category: payment_security
    patterns:
      - '(?i)CartMandate\s*\([^)]*\)(?![\s\S]{0,200}(?:merchant_sig|merchant_signature|seller_sig))'
      - '(?i)cart_mandate\s*=\s*\{[^}]*\}(?![\s\S]{0,200}(?:merchant_sig|signed_by_merchant))'
      - '(?i)(?:accept|process)_cart\s*\([^)]*\)(?![\s\S]{0,200}(?:verify_merchant|merchant_sig|seller_proof))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Cart Mandate accepted without merchant signature verification"
    description: |
      Cart Mandates represent a merchant's binding offer with itemized pricing, shipping,
      and terms. Without the merchant's cryptographic signature, a Cart Mandate can be
      tampered with in transit -- prices inflated, items substituted, or terms altered
      by a man-in-the-middle or compromised intermediary agent. Patel et al. (2026)
      require merchant DID-based signatures on all Cart Mandates. An unsigned Cart
      Mandate provides no non-repudiation: the merchant can later deny the offered terms.
    remediation: |
      - Require merchant_signature field on all CartMandate objects
      - Verify merchant signature against the merchant's registered DID/public key
      - Reject Cart Mandates where the signer DID does not match the merchant identity
      - Implement Cart Mandate hash chaining: PaymentMandate must reference CartMandate hash
      - Display verified merchant identity to user before consent
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"
    attack_framework: "Cart Mandate Tampering (Patel et al., 2026)"
    references:
      - "Patel et al. - Agentic Commerce Mandate Model (2026)"

  - id: MEDUSA-UCP-SCAN-006
    name: escrow-without-finality-check
    severity: CRITICAL
    category: payment_security
    patterns:
      - '(?i)escrow\.release\s*\([^)]*\)(?![\s\S]{0,200}(?:finality|confirm|block_confirm|settlement_final))'
      - '(?i)release_escrow\s*\([^)]*\)(?![\s\S]{0,200}(?:finality|is_final|confirmed|block_number))'
      - '(?i)escrow_contract\.(?:release|withdraw)\s*\([^)]*\)(?![\s\S]{0,200}(?:await_finality|check_finality))'
      - '(?i)(?:release|payout)\s*\([^)]*\)[\s\S]{0,100}(?:pending|unconfirmed|0\s*confirm)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.sol"
    message: "Escrow funds released without transaction finality confirmation"
    description: |
      Releasing escrow funds before the underlying payment transaction achieves finality
      enables the Phantom Deposit attack (Mittal et al., 2026). In this attack, an
      adversary submits a deposit transaction, the escrow sees it as pending/unconfirmed,
      releases funds or services, then the attacker double-spends or reverses the deposit.
      On blockchain networks, this requires waiting for sufficient block confirmations.
      On traditional payment rails, this requires settlement confirmation from the
      payment processor. Mittal et al. demonstrated 100% success rate against escrow
      contracts that released on 0-confirmation deposits.
    remediation: |
      - Await transaction finality before releasing escrow (e.g., 12+ block confirmations on Ethereum)
      - Implement await_finality() or check_finality() before escrow.release()
      - For fiat payments, wait for settlement confirmation (not just authorization)
      - Add finality timeout with automatic dispute escalation
      - Use pessimistic settlement: hold escrow until all parties confirm delivery
    owasp_llm: "LLM06:2025"
    cwe: "CWE-362"
    attack_framework: "Phantom Deposit Attack (Mittal et al., 2026)"
    references:
      - "Mittal et al. - Phantom Deposit Attacks on Agent Settlement (2026)"

  - id: MEDUSA-UCP-SCAN-007
    name: agent-wallet-hardcoded-private-key
    severity: CRITICAL
    category: credential_exposure
    patterns:
      - '(?i)private_key\s*=\s*["\x27][0-9a-fA-F]{64}["\x27]'
      - '(?i)(?:wallet|account)_(?:key|secret|private)\s*=\s*["\x27][^\s"]{30,}["\x27]'
      - '(?i)Web3\.eth\.account\.from_key\s*\(\s*["\x27][0-9a-fA-F]'
      - '(?i)Keypair\.from_secret_key\s*\(\s*["\x27]'
      - '(?i)(?:AGENT|BOT|SERVICE)_PRIVATE_KEY\s*=\s*["\x27][^${\s][^"\x27]{20,}["\x27]'
      - '(?i)ethers\.Wallet\s*\(\s*["\x27]0x[0-9a-fA-F]{64}["\x27]'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.env"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.toml"
    message: "Agent wallet private key hardcoded in source code or configuration"
    description: |
      Embedding private keys directly in agent source code or configuration exposes the
      agent's entire wallet balance to theft. Dusad et al. (2025) documented that
      autonomous payment agents managing cryptocurrency wallets MUST use hardware
      security modules (HSMs) or secure key management services. A hardcoded private key
      is extractable via code repository access, build artifact inspection, or memory
      dumps. Compromised agent wallets enable unauthorized fund transfers and are
      irrecoverable on blockchain networks.
    remediation: |
      - Use environment variables referenced at runtime: os.environ["AGENT_PRIVATE_KEY"]
      - Use hardware security modules (HSMs) or cloud KMS (AWS KMS, GCP Cloud HSM)
      - Implement wallet-as-a-service with API-based signing (Fireblocks, Turnkey)
      - Never commit private keys to version control
      - Rotate wallet keys regularly and implement multi-sig for high-value operations
    owasp_llm: "LLM02:2025"
    cwe: "CWE-798"
    attack_framework: "Agent Wallet Key Extraction (Dusad et al., 2025)"
    references:
      - "Dusad et al. - Autonomous Payment Agent Security (2025)"

  - id: MEDUSA-UCP-SCAN-008
    name: payment-function-without-rate-limiting
    severity: HIGH
    category: payment_security
    patterns:
      - '(?i)def\s+(?:process_payment|execute_payment|charge|pay|settle|transfer_funds)\s*\([^)]*\)(?![\s\S]{0,300}(?:rate_limit|throttle|cooldown|max_per_|burst_limit))'
      - '(?i)async\s+def\s+(?:process_payment|execute_payment|charge|pay|settle)\s*\([^)]*\)(?![\s\S]{0,300}(?:rate_limit|throttle|cooldown))'
      - '(?i)@(?:app|router)\.\w+\s*\([^)]*(?:pay|charge|settle|transfer)[^)]*\)[\s\S]{0,200}def\s+\w+(?![\s\S]{0,300}(?:rate_limit|throttle|RateLimiter))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Payment function defined without rate limiting protection"
    description: |
      Payment endpoints and functions without rate limiting enable rapid-fire transaction
      attacks where a compromised or manipulated agent executes hundreds of payments in
      seconds. Dusad et al. (2025) identified payment velocity attacks as a primary
      threat to autonomous agents: without rate limits, a prompt injection that triggers
      a payment loop can drain an agent's entire budget before human intervention.
      Rate limiting is a mandatory control in the UCP payment security model.
    remediation: |
      - Apply rate limiting decorators to all payment functions (@rate_limit(max=5, per=60))
      - Implement per-agent, per-session, and per-mandate rate limits
      - Add cumulative spend tracking with automatic budget freeze on threshold breach
      - Implement exponential backoff for repeated payment attempts
      - Alert human operators when payment velocity exceeds normal thresholds
    owasp_llm: "LLM06:2025"
    cwe: "CWE-770"
    attack_framework: "Payment Velocity Attack (Dusad et al., 2025)"
    references:
      - "Dusad et al. - Autonomous Payment Agent Security (2025)"

  - id: MEDUSA-UCP-SCAN-009
    name: missing-pote-before-settlement
    severity: CRITICAL
    category: payment_security
    patterns:
      - '(?i)(?:settle|finalize|complete)_(?:payment|transaction|order)\s*\([^)]*\)(?![\s\S]{0,300}(?:pote|proof_of_task|task_proof|verify_execution|execution_proof))'
      - '(?i)settlement\.(?:execute|process|confirm)\s*\([^)]*\)(?![\s\S]{0,300}(?:pote|proof_of_task))'
      - '(?i)def\s+settle\s*\([^)]*\)[\s\S]{0,500}(?:transfer|send|pay)(?![\s\S]{0,200}(?:pote|proof_of_task))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.sol"
    message: "Settlement executed without Proof of Task Execution (PoTE) validation"
    description: |
      The pay-then-verify anti-pattern (optimistic settlement) releases payment before
      confirming that the contracted task was actually completed. Dusad et al. (2025)
      established PoTE as the mandatory cryptographic proof that links a payment to
      verified task completion. Without PoTE validation before settlement, agents are
      vulnerable to: (1) payment for hallucinated task completions, (2) payment for
      partial/failed tasks, (3) double-billing for the same task. PoTE MUST be validated
      before any funds leave escrow.
    remediation: |
      - Implement verify_pote(proof, task_id) before any settlement function call
      - Require PoTE to include: task_hash, completion_timestamp, executor_signature
      - Validate PoTE against the original task specification in the IntentMandate
      - Use TLS Notary attestation for web-based task evidence
      - Implement dispute resolution for PoTE validation failures
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"
    attack_framework: "Optimistic Settlement Fraud (Dusad et al., 2025)"
    references:
      - "Dusad et al. - Autonomous Payment Agents and PoTE Framework (2025)"

  - id: MEDUSA-UCP-SCAN-010
    name: optimistic-pay-then-verify-pattern
    severity: HIGH
    category: payment_security
    patterns:
      - '(?i)(?:pay|charge|transfer|send_payment)\s*\([^)]*\)[\s\S]{0,300}(?:verify|validate|check|confirm)_(?:task|delivery|completion|result)'
      - '(?i)(?:stripe|paypal|web3)\.\w+\.\w+\s*\([^)]*\)[\s\S]{0,500}(?:if\s+not\s+)?(?:verify|validate)_(?:task|result|delivery)'
      - '(?i)(?:pay|transfer)[\s\S]{0,100}(?:then|after|next)[\s\S]{0,100}(?:verify|check|validate)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Optimistic settlement detected: payment precedes verification (pay-then-verify anti-pattern)"
    description: |
      Code that executes payment before task verification implements the optimistic
      settlement anti-pattern. The correct order is: (1) task completion, (2) PoTE
      generation, (3) PoTE verification, (4) settlement. When payment precedes
      verification, recovering funds from a failed or fraudulent task requires costly
      dispute resolution, chargebacks, or on-chain reversals (often impossible on L1).
      Goenka et al. (2026) explicitly prohibit optimistic settlement in the x402
      specification, requiring escrow-held funds released only after PoTE validation.
    remediation: |
      - Restructure code to verify-then-pay: validate PoTE before initiating payment
      - Use escrow as intermediary: deposit -> verify PoTE -> release
      - Implement state machine: PENDING -> VERIFIED -> SETTLED (never skip VERIFIED)
      - Add assertions/guards: assert pote_verified before payment execution
      - Implement compensating transactions for edge cases where reversal is needed
    owasp_llm: "LLM06:2025"
    cwe: "CWE-693"
    attack_framework: "Pay-Then-Verify Anti-Pattern (Goenka et al., 2026)"
    references:
      - "Goenka et al. - x402 HTTP Payment Protocol (2026)"
      - "Dusad et al. - Autonomous Payment Agent Security (2025)"

  # =============================================================================
  # SECTION 2: TRUST & DELEGATION VULNERABILITIES (8 rules)
  # Source: Goswami 2025, Shi 2025, Palavali 2025, Saavedra 2026
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-011
    name: jwt-missing-agent-checksum-claim
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)jwt\.encode\s*\(\s*\{[^}]*\}(?![\s\S]{0,300}agent_checksum)'
      - '(?i)(?:payload|claims)\s*=\s*\{[^}]*(?:sub|iss|aud)[^}]*\}(?![\s\S]{0,200}agent_checksum)'
      - '(?i)create_(?:jwt|token|access_token)\s*\([^)]*\)(?![\s\S]{0,300}agent_checksum)'
      - '(?i)jwt\.sign\s*\(\s*\{[^}]*\}(?![\s\S]{0,300}agent_checksum)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "JWT issued for agent operations without agent_checksum claim"
    description: |
      Standard JWTs lack agent-specific claims needed to bind a token to a specific agent
      binary. Goswami et al. (2025) introduced mandatory JWT extensions for agentic
      operations: agent_checksum (hash of agent code/model), workflow_step (current
      pipeline position), and delegation_chain (provenance of delegated authority).
      Without agent_checksum, a token issued to Agent-A can be replayed by Agent-B
      (a completely different agent binary) without detection. This enables agent
      impersonation in multi-agent commerce workflows.
    remediation: |
      - Add agent_checksum claim: SHA-256 hash of the agent binary/model weights
      - Add workflow_step claim: current position in the multi-step pipeline
      - Add delegation_chain claim: array of [delegator, delegate, scope, timestamp]
      - Validate agent_checksum on every token verification against the presenting agent
      - Reject tokens where agent_checksum does not match the current agent's computed hash
    owasp_llm: "LLM08:2025"
    cwe: "CWE-287"
    attack_framework: "Agent Token Replay (Goswami et al., 2025)"
    references:
      - "Goswami et al. - JWT Extensions for Agentic Operations (2025)"

  - id: MEDUSA-UCP-SCAN-012
    name: jwt-missing-confirmation-claim
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)jwt\.encode\s*\(\s*\{[^}]*\}(?![\s\S]{0,300}(?:"cnf"|cnf\s*[=:]))'
      - '(?i)(?:payload|claims)\s*=\s*\{[^}]*(?:sub|iss)[^}]*\}(?![\s\S]{0,200}(?:"cnf"|confirmation))'
      - '(?i)create_agent_token\s*\([^)]*\)(?![\s\S]{0,300}(?:cnf|confirmation|proof_of_possession|dpop))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Agent JWT missing cnf (confirmation) claim for Proof-of-Possession"
    description: |
      Without a cnf (confirmation) claim, agent tokens are bearer tokens: anyone who
      obtains the token can use it. Shi et al. (2025) demonstrated that Proof-of-Possession
      (PoP) via the cnf claim binds a token to a specific key pair held by the agent.
      The cnf claim contains a JWK thumbprint that the agent must prove possession of
      on each request. Without PoP, stolen agent tokens (via log exposure, prompt
      injection exfiltration, or network interception) grant full access to the token's
      scopes with no way to distinguish legitimate from illegitimate use.
    remediation: |
      - Include cnf claim with jkt (JWK thumbprint) in all agent tokens
      - Implement DPoP (Demonstrating Proof-of-Possession) per RFC 9449
      - Require agents to sign each request with their private key
      - Validate PoP proof on every token presentation at the resource server
      - Use short-lived tokens (< 60 seconds) combined with PoP for defense-in-depth
    owasp_llm: "LLM08:2025"
    cwe: "CWE-287"
    attack_framework: "Bearer Token Theft (Shi et al., 2025)"
    references:
      - "Shi et al. - Proof-of-Possession for Agentic Tokens (2025)"
      - "RFC 9449 - OAuth 2.0 Demonstrating Proof of Possession (DPoP)"

  - id: MEDUSA-UCP-SCAN-013
    name: agent-using-client-credentials-grant
    severity: MEDIUM
    category: authentication
    patterns:
      - '(?i)grant_type\s*[=:]\s*["\x27]client_credentials["\x27][\s\S]{0,300}(?:agent|tool|autonomous|workflow)'
      - '(?i)(?:agent|autonomous|tool)[\s\S]{0,200}grant_type\s*[=:]\s*["\x27]client_credentials["\x27]'
      - '(?i)client_credentials_grant\s*\([^)]*(?:agent|tool|autonomous)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
    message: "Agent using client_credentials grant type instead of agent-specific authentication"
    description: |
      The OAuth 2.0 client_credentials grant was designed for service-to-service
      authentication, not for autonomous agents acting on behalf of users. Goswami et al.
      (2025) identified that client_credentials tokens lack: agent_checksum (agent
      identity binding), delegation_chain (authority provenance), and workflow_step
      (pipeline context). Using client_credentials for agent operations collapses all
      agents into a single service identity, preventing per-agent authorization,
      auditing, and revocation. Compromising one agent's credentials compromises all
      agents sharing the same client_id.
    remediation: |
      - Implement agent-specific grant type with agent_checksum in token request
      - Use token exchange (RFC 8693) to derive agent-scoped tokens from user tokens
      - Ensure each agent has a distinct identity (DID or unique client_id + key pair)
      - Include delegation_chain in token claims to trace authority provenance
      - Implement per-agent token scoping: each agent gets only the permissions it needs
    owasp_llm: "LLM08:2025"
    cwe: "CWE-285"
    attack_framework: "Agent Identity Collapse (Goswami et al., 2025)"
    references:
      - "Goswami et al. - JWT Extensions for Agentic Operations (2025)"

  - id: MEDUSA-UCP-SCAN-014
    name: agents-sharing-credentials
    severity: HIGH
    category: authentication
    patterns:
      - '(?i)(?:SHARED|COMMON|GLOBAL)_(?:CLIENT_ID|API_KEY|SECRET|PRIVATE_KEY)\s*='
      - '(?i)client_id\s*=\s*(?:config|settings|env)\[.(?:SHARED|COMMON|SERVICE)_CLIENT'
      - '(?i)(?:all_agents|agent_pool|agents)\s*=\s*\[[^\]]*\][\s\S]{0,200}(?:same|shared|common)_(?:key|secret|token|cred)'
      - '(?i)for\s+agent\s+in\s+agents[\s\S]{0,200}(?:key|secret|token)\s*=\s*(?:shared|common|global)_'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
      - "*.env"
    message: "Multiple agents sharing the same credentials (client_id, private_key, or API key)"
    description: |
      Agents sharing credentials (same client_id, private_key, or API key) cannot be
      individually identified, authorized, or revoked. Palavali et al. (2025) established
      that each agent MUST have a distinct DID (Decentralized Identifier) binding a
      unique key pair to its identity. Shared credentials create: (1) inability to audit
      which agent performed an action, (2) blast radius amplification on credential
      compromise, (3) inability to revoke a single compromised agent without affecting
      all agents, (4) violation of the principle of least privilege.
    remediation: |
      - Assign each agent a unique DID with its own key pair
      - Use per-agent client_id and client_secret in OAuth registrations
      - Implement agent identity registry mapping DID to capabilities and permissions
      - Rotate credentials per-agent on independent schedules
      - Audit agent actions using unique identifiers for non-repudiation
    owasp_llm: "LLM08:2025"
    cwe: "CWE-287"
    attack_framework: "Shared Credential Blast Radius (Palavali et al., 2025)"
    references:
      - "Palavali et al. - DID-based Agent Identity Framework (2025)"

  - id: MEDUSA-UCP-SCAN-015
    name: agent-token-excessive-lifetime
    severity: MEDIUM
    category: authentication
    patterns:
      - '(?i)(?:expires_in|ttl|lifetime|max_age)\s*[=:]\s*(?:3[7-9]\d{2}|[4-9]\d{3}|\d{5,})(?![\s\S]{0,50}(?:refresh|long_lived|service))'
      - '(?i)(?:exp|expires)\s*[=:]\s*\w+\s*\+\s*(?:timedelta|datetime\.timedelta)\s*\(\s*(?:hours|days)\s*='
      - '(?i)token_lifetime\s*=\s*(?:3[7-9]\d{2}|[4-9]\d{3}|\d{5,})'
      - '(?i)(?:JWT_EXPIRATION|TOKEN_TTL|ACCESS_TOKEN_LIFETIME)\s*=\s*(?:3[7-9]\d{2}|[4-9]\d{3}|\d{5,})'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
      - "*.env"
    message: "Agent token lifetime exceeds 60 seconds for agentic operations"
    description: |
      Long-lived tokens for autonomous agent operations expand the window for token
      theft and replay attacks. Goswami et al. (2025) recommend a maximum token lifetime
      of 60 seconds for agentic operations, with automatic refresh rotation. Shi et al.
      (2025) demonstrated that combining short-lived tokens with Proof-of-Possession
      reduces the attack surface of stolen tokens to near-zero. Tokens with multi-hour
      or multi-day lifetimes are particularly dangerous for agents handling financial
      operations, as a stolen token grants extended payment authorization.
    remediation: |
      - Set agent token lifetime to 60 seconds or less
      - Implement token refresh rotation with single-use refresh tokens
      - Combine short-lived tokens with Proof-of-Possession (DPoP/cnf)
      - Use sliding window expiration that resets on legitimate use
      - Implement token revocation for emergency credential invalidation
    owasp_llm: "LLM02:2025"
    cwe: "CWE-613"
    attack_framework: "Long-Lived Token Replay (Goswami et al., 2025)"
    references:
      - "Goswami et al. - JWT Extensions for Agentic Operations (2025)"
      - "Shi et al. - Proof-of-Possession for Agentic Tokens (2025)"

  - id: MEDUSA-UCP-SCAN-016
    name: missing-delegation-chain-validation
    severity: HIGH
    category: authorization
    patterns:
      - '(?i)(?:delegate|forward|proxy)_(?:task|request|action)\s*\([^)]*\)(?![\s\S]{0,300}(?:delegation_chain|verify_delegation|check_chain|validate_chain))'
      - '(?i)agent\.(?:delegate|hand_off|transfer)\s*\([^)]*\)(?![\s\S]{0,300}(?:delegation_chain|chain_valid))'
      - '(?i)sub_agent\.(?:execute|run|invoke)\s*\([^)]*\)(?![\s\S]{0,300}(?:delegation_chain|verify_authority))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Agent delegation without delegation chain validation"
    description: |
      When Agent-A delegates a task to Agent-B, the delegation chain must be validated
      to ensure Agent-A has the authority to delegate and Agent-B is authorized to
      receive the delegation. Palavali et al. (2025) specify that delegation chains MUST
      be: (1) cryptographically signed by each delegator, (2) validated for scope
      reduction (delegate cannot exceed delegator's permissions), (3) checked for depth
      limits (prevent infinite re-delegation). Without chain validation, an unprivileged
      agent can claim delegated authority from a privileged agent, enabling privilege
      escalation in multi-agent systems.
    remediation: |
      - Include delegation_chain in all inter-agent task forwarding
      - Validate that each link in the chain is signed by the delegating agent's DID
      - Enforce scope reduction: delegate permissions <= delegator permissions
      - Set maximum delegation depth (recommended: 3-5 levels)
      - Log all delegation events for audit and anomaly detection
    owasp_llm: "LLM06:2025"
    cwe: "CWE-284"
    attack_framework: "Delegation Chain Escalation (Palavali et al., 2025)"
    references:
      - "Palavali et al. - DID-based Agent Identity & Delegation Chains (2025)"

  - id: MEDUSA-UCP-SCAN-017
    name: trust-model-brief-only-no-stake-or-proof
    severity: MEDIUM
    category: trust_model
    patterns:
      - '(?i)trust_(?:level|model|type)\s*[=:]\s*["\x27](?:brief|claim|self_reported|assertion)["\x27]'
      - '(?i)(?:verify_agent|agent_trust)\s*\([^)]*\)[\s\S]{0,200}(?:claims_only|self_attested|no_stake)'
      - '(?i)trust_score\s*=\s*agent\.(?:claims|assertions|self_report)(?![\s\S]{0,200}(?:stake|collateral|proof|attestation))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
    message: "Agent trust model uses Brief (claims-only) without Stake or Proof verification"
    description: |
      The Trust Trilemma (Saavedra et al., 2026) identifies three trust mechanisms for
      agent commerce: Brief (self-reported claims), Stake (economic collateral), and
      Proof (cryptographic verification). Using Brief alone provides no accountability --
      an agent can claim any capability or reputation without consequences for lying.
      Saavedra et al. demonstrated that Brief-only trust enables Sybil attacks where
      adversaries create thousands of agents with fabricated reputations. Robust trust
      requires at minimum Stake OR Proof in addition to Brief.
    remediation: |
      - Require at least one of Stake or Proof in addition to Brief claims
      - Implement staking: agents deposit collateral slashed on misbehavior
      - Implement proof: require cryptographic attestations (PoTE, TLS Notary, ZK proofs)
      - Build reputation systems based on verified proof history, not self-reported claims
      - Use graduated trust: new agents start with low trust, earn higher trust via proof
    owasp_llm: "LLM06:2025"
    cwe: "CWE-345"
    attack_framework: "Trust Trilemma - Brief-Only Sybil (Saavedra et al., 2026)"
    references:
      - "Saavedra et al. - Trust Trilemma for Agent Commerce (2026)"

  - id: MEDUSA-UCP-SCAN-018
    name: agent-credential-no-revocation-check
    severity: MEDIUM
    category: authentication
    patterns:
      - '(?i)(?:verify|validate|check)_(?:jwt|token|credential)\s*\([^)]*\)(?![\s\S]{0,300}(?:revoc|revoked|blacklist|blocklist|crl|ocsp|is_revoked))'
      - '(?i)jwt\.decode\s*\([^)]*\)(?![\s\S]{0,300}(?:revoc|blacklist|blocklist))'
      - '(?i)token_valid\s*=\s*(?:verify|validate)\s*\([^)]*\)(?![\s\S]{0,200}(?:revoc|blacklist))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Agent credential verification without revocation check"
    description: |
      Token verification that validates signature and expiration but does not check
      revocation status allows compromised credentials to remain active until natural
      expiry. Palavali et al. (2025) require real-time revocation checking for agent
      credentials, particularly in commerce flows where a compromised agent could
      authorize payments during the revocation-to-expiry gap. For 60-second tokens
      this gap is small, but for misconfigured long-lived tokens it can be hours or days.
      DID-based revocation via verifiable credential status lists provides the most
      scalable approach.
    remediation: |
      - Add revocation check to all token verification flows
      - Implement token blacklist/blocklist with sub-second lookup (Redis, in-memory)
      - Use DID document revocation via verifiable credential status lists
      - Check revocation on every request, not just at token issuance
      - Implement real-time revocation propagation for multi-agent systems
    owasp_llm: "LLM08:2025"
    cwe: "CWE-299"
    attack_framework: "Revocation Gap Exploitation (Palavali et al., 2025)"
    references:
      - "Palavali et al. - DID-based Agent Identity Framework (2025)"

  # =============================================================================
  # SECTION 3: RAG/MEMORY SECURITY (6 rules)
  # Source: Patlan 2025, Chang 2026, Zhang 2024
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-019
    name: rag-direct-memory-concatenation
    severity: HIGH
    category: memory_security
    patterns:
      - '(?i)context\s*\+=\s*(?:retrieved_memory|memory_entry|mem_result|stored_memory)'
      - '(?i)context\s*=\s*context\s*\+\s*(?:retrieved|memory|stored)'
      - '(?i)messages\.append\s*\(\s*\{[^}]*"role"\s*:\s*"system"[^}]*"content"\s*:\s*(?:memory|retrieved|stored)'
      - '(?i)messages\.append\s*\(\s*\{[^}]*"content"\s*:\s*(?:memory_entry|retrieved_text|stored_context)'
      - '(?i)prompt\s*=\s*f?["\x27].*\{(?:memory|retrieved|stored)[^}]*\}.*["\x27]'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Direct concatenation of retrieved memory into model context without sanitization"
    description: |
      Directly concatenating retrieved memory entries into the model context (system
      prompt or message history) enables memory poisoning attacks. Patlan et al. (2025)
      demonstrated that adversaries can plant malicious instructions in vector databases
      that, when retrieved and concatenated, override the model's system prompt. This is
      a RAG-specific variant of indirect prompt injection. Cohen et al. (Morris II)
      showed self-replicating payloads that propagate through RAG memory, achieving
      zero-click worm behavior with 100% propagation rate across GenAI ecosystems.
    remediation: |
      - Wrap all retrieved memory in sanitization functions before context insertion
      - Implement CheckTool() / ParseData() wrappers (Zhang et al., 2024) on retrieved content
      - Use structured memory formats with validated schemas, not raw text concatenation
      - Add memory content classification to detect instruction-like content in data fields
      - Separate data context from instruction context using distinct message roles
    owasp_llm: "LLM01:2025"
    cwe: "CWE-94"
    attack_framework: "RAG Memory Poisoning (Patlan et al., 2025)"
    references:
      - "Patlan et al. - RAG Memory Poisoning Attacks (2025)"
      - "Cohen et al. - Morris II: GenAI Worm via RAG Self-Replication (2024)"

  - id: MEDUSA-UCP-SCAN-020
    name: raw-tool-output-to-memory-store
    severity: HIGH
    category: memory_security
    patterns:
      - '(?i)memory\.add\s*\(\s*(?:tool_output|observation|tool_result|action_output)'
      - '(?i)vector_db\.(?:upsert|insert|add)\s*\(\s*(?:tool_output|raw_text|observation|external_data)'
      - '(?i)(?:chroma|pinecone|weaviate|qdrant|milvus)\.\w+\.(?:add|upsert|insert)\s*\([^)]*(?:tool_output|raw_|external_|untrusted_)'
      - '(?i)memory_store\.(?:save|store|persist)\s*\(\s*(?:raw_|tool_|external_|untrusted_)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Raw external tool output stored directly in memory/vector database without sanitization"
    description: |
      Storing raw tool output (web scraping results, API responses, file contents)
      directly in vector databases or agent memory enables persistent memory poisoning.
      Patlan et al. (2025) showed that attacker-controlled content ingested into RAG
      memory persists across sessions and is retrieved on semantically similar queries,
      creating a persistent backdoor. Chang et al. (2026) documented cross-session
      memory leakage where poisoned entries from one session affect subsequent sessions.
      All external data MUST be sanitized through CheckTool()/ParseData() before storage.
    remediation: |
      - Apply CheckTool() sanitization (Zhang et al., 2024) before memory storage
      - Implement ParseData() schema validation on all external tool outputs
      - Add content classification to detect instruction injection in data
      - Tag memory entries with source attribution (tool_name, timestamp, trust_level)
      - Implement memory entry quarantine for unverified external content
    owasp_llm: "LLM01:2025"
    cwe: "CWE-915"
    attack_framework: "Persistent Memory Poisoning (Patlan et al., 2025)"
    references:
      - "Patlan et al. - RAG Memory Poisoning Attacks (2025)"
      - "Zhang et al. - CheckTool Framework for RAG Input Sanitization (2024)"

  - id: MEDUSA-UCP-SCAN-021
    name: missing-checktool-parsedata-wrappers
    severity: MEDIUM
    category: memory_security
    patterns:
      - '(?i)(?:retriever|vector_store|memory)\.(?:get|query|search|retrieve)\s*\([^)]*\)(?![\s\S]{0,200}(?:check_tool|parse_data|sanitize|validate|filter))'
      - '(?i)(?:retrieve|fetch)_(?:context|memory|documents)\s*\([^)]*\)(?![\s\S]{0,200}(?:check_tool|parse_data|sanitize))'
      - '(?i)(?:similarity_search|get_relevant_documents)\s*\([^)]*\)(?![\s\S]{0,200}(?:check_tool|parse_data|sanitize|validate))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "RAG retrieval without CheckTool/ParseData sanitization wrappers"
    description: |
      Zhang et al. (2024) introduced the CheckTool/ParseData framework as mandatory
      guardrails for RAG retrieval pipelines. CheckTool validates retrieved content
      against injection patterns before it enters the model context. ParseData ensures
      retrieved chunks conform to expected schemas. Without these wrappers, retrieved
      content from poisoned vector databases passes directly to the model, enabling
      indirect prompt injection. The Morris II worm (Cohen et al.) specifically exploits
      the absence of these sanitization layers to achieve self-propagation.
    remediation: |
      - Wrap all retrieval calls with CheckTool() for injection detection
      - Apply ParseData() for schema validation on retrieved chunks
      - Implement content-type checking: reject instruction-like content in data fields
      - Add retrieval result scoring that penalizes anomalous/suspicious content
      - Log all CheckTool/ParseData rejections for security monitoring
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"
    attack_framework: "CheckTool Bypass (Zhang et al., 2024)"
    references:
      - "Zhang et al. - CheckTool Framework for RAG Input Sanitization (2024)"

  - id: MEDUSA-UCP-SCAN-022
    name: shared-memory-without-session-isolation
    severity: HIGH
    category: memory_security
    patterns:
      - '(?i)(?:memory|vector_db|chroma|pinecone)\s*=\s*\w+\.(?:get_or_create|connect|from_)\s*\([^)]*\)(?![\s\S]{0,300}(?:session_id|user_id|tenant_id|namespace|partition))'
      - '(?i)(?:SHARED|GLOBAL|COMMON)_(?:MEMORY|VECTOR_DB|COLLECTION)\s*='
      - '(?i)collection_name\s*=\s*["\x27](?:global|shared|default|main)["\x27]'
      - '(?i)memory_store\s*=\s*\w+\s*#\s*shared'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
      - "*.yaml"
      - "*.yml"
    message: "Shared memory store across sessions without isolation boundaries"
    description: |
      Memory stores (vector databases, key-value caches) shared across agent sessions
      without namespace/partition isolation enable cross-session data leakage and
      cross-tenant poisoning. Chang et al. (2026) demonstrated that poisoned memory
      entries from one user's session are retrieved in another user's session when using
      shared collections. This enables: (1) cross-user data exfiltration via semantic
      similarity retrieval, (2) persistent poisoning that affects all users, (3) privacy
      violations when one user's data appears in another's context.
    remediation: |
      - Partition memory stores by session_id, user_id, or tenant_id
      - Use collection namespaces: collection_name=f"memory_{session_id}"
      - Implement metadata filtering on retrieval: filter={"session_id": current_session}
      - Add access control checks before returning retrieved memory entries
      - Implement memory garbage collection on session termination
    owasp_llm: "LLM01:2025"
    cwe: "CWE-200"
    attack_framework: "Cross-Session Memory Leakage (Chang et al., 2026)"
    references:
      - "Chang et al. - Cross-Session Memory Leakage in Persistent Agents (2026)"

  - id: MEDUSA-UCP-SCAN-023
    name: no-structural-validation-on-retrieved-chunks
    severity: MEDIUM
    category: memory_security
    patterns:
      - '(?i)(?:retrieved|chunks|documents|results)\s*=\s*(?:retriever|vector_store|memory)\.(?:query|search|get)[^;]*(?:;\s*(?:context|prompt)\s*[+=])'
      - '(?i)for\s+(?:chunk|doc|result)\s+in\s+(?:retrieved|chunks|results)[\s\S]{0,200}(?:context|prompt)\s*\+='
      - '(?i)"\s*\\n\s*"\s*\.join\s*\(\s*(?:retrieved|chunks|documents|results)\s*\)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Retrieved chunks used without structural validation or schema checking"
    description: |
      Retrieved chunks from vector databases are treated as trusted text without
      validating their structure, length, or content type. Patlan et al. (2025) showed
      that adversaries can craft oversized chunks that dominate the context window,
      chunks containing role-override instructions (e.g., "SYSTEM: ignore previous
      instructions"), or chunks with embedded serialized objects. Without structural
      validation, the model processes adversarial content that exploits context window
      semantics to override legitimate instructions.
    remediation: |
      - Validate chunk length against maximum expected size (reject anomalously large chunks)
      - Check chunk content type: reject chunks containing role markers or system instructions
      - Implement schema validation for structured memory entries
      - Add chunk-level anomaly scoring based on content patterns
      - Truncate chunks to safe maximum length before context insertion
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"
    attack_framework: "Context Window Hijacking (Patlan et al., 2025)"
    references:
      - "Patlan et al. - RAG Memory Poisoning Attacks (2025)"

  - id: MEDUSA-UCP-SCAN-024
    name: missing-memory-source-attribution
    severity: LOW
    category: memory_security
    patterns:
      - '(?i)memory\.add\s*\(\s*(?:text|content|data)\s*=(?![\s\S]{0,200}(?:source|origin|tool_name|attribution|provenance))'
      - '(?i)vector_db\.(?:upsert|insert|add)\s*\(\s*(?:documents?|texts?)\s*=(?![\s\S]{0,200}(?:metadata.*source|source.*metadata))'
      - '(?i)(?:add_memory|store_memory|save_memory)\s*\([^)]*\)(?![\s\S]{0,200}(?:source|origin|provenance|attribution))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Memory entries stored without source attribution or provenance metadata"
    description: |
      Memory entries stored without source attribution (which tool generated the data,
      when, from what external source) prevent forensic analysis of memory poisoning
      incidents. Chang et al. (2026) recommend mandatory provenance metadata on all
      memory entries: source_tool, source_url, timestamp, trust_level, and session_id.
      Without attribution, poisoned entries are indistinguishable from legitimate ones,
      and incident response cannot identify the injection vector or scope of compromise.
    remediation: |
      - Add metadata to all memory entries: source_tool, timestamp, trust_level, session_id
      - Include source_url for web-sourced content
      - Implement provenance chain: track how data flowed from source to memory
      - Add trust_level scoring: user-provided > verified-tool > unverified-external
      - Enable provenance-based filtering in retrieval queries
    owasp_llm: "LLM01:2025"
    cwe: "CWE-778"
    attack_framework: "Memory Provenance Gap (Chang et al., 2026)"
    references:
      - "Chang et al. - Cross-Session Memory Leakage in Persistent Agents (2026)"

  # =============================================================================
  # SECTION 4: AGENT SANDBOX & EXECUTION SECURITY (7 rules)
  # Source: Buhler 2025, Vilches 2025, Liu 2025
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-025
    name: tool-implementation-shell-execution
    severity: CRITICAL
    category: sandbox_escape
    patterns:
      - '(?i)(?:@tool|@function_tool|def\s+\w+_tool)\s*[\s\S]{0,200}os\.system\s*\('
      - '(?i)(?:@tool|@function_tool|def\s+\w+_tool)\s*[\s\S]{0,200}subprocess\.Popen\s*\([^)]*shell\s*=\s*True'
      - '(?i)(?:@tool|@function_tool|def\s+\w+_tool)\s*[\s\S]{0,200}(?:exec|eval)\s*\('
      - '(?i)def\s+(?:execute|run|invoke)_tool\s*\([^)]*\)[\s\S]{0,300}(?:os\.system|subprocess\.\w+.*shell\s*=\s*True|exec\s*\(|eval\s*\()'
      - '(?i)tools\s*=\s*\[[\s\S]*(?:os\.system|subprocess\.Popen|exec\s*\(|eval\s*\()[\s\S]*\]'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Shell execution (os.system/subprocess/exec/eval) in agent tool implementation"
    description: |
      Tool implementations that invoke os.system(), subprocess.Popen(shell=True),
      exec(), or eval() create direct code execution pathways exploitable via prompt
      injection. Buhler et al. (2025) demonstrated that when an LLM agent can invoke
      tools containing shell execution, a single prompt injection can achieve remote
      code execution. The attack chain is: adversarial input -> model generates tool
      call -> tool executes shell command -> arbitrary code execution. This is the
      highest-severity vulnerability in agent tool security.
    remediation: |
      - Replace os.system/subprocess with purpose-specific APIs (no shell invocation)
      - Use subprocess.run() with shell=False and explicit argument lists
      - Never use exec() or eval() in tool implementations
      - Implement tool sandboxing with seccomp/AppArmor profiles
      - Use allow-listed command patterns instead of arbitrary shell execution
    owasp_llm: "LLM05:2025"
    cwe: "CWE-78"
    attack_framework: "Agent Tool RCE (Buhler et al., 2025)"
    references:
      - "Buhler et al. - Agent Sandbox Escape via Tool Exploitation (2025)"

  - id: MEDUSA-UCP-SCAN-026
    name: docker-socket-mounted-to-agent
    severity: CRITICAL
    category: sandbox_escape
    patterns:
      - '(?i)/var/run/docker\.sock'
      - '(?i)docker\.sock\s*:\s*/var/run/docker\.sock'
      - '(?i)volumes?\s*:[\s\S]{0,200}/var/run/docker\.sock'
      - '(?i)DockerClient\s*\(\s*base_url\s*=\s*["\x27]unix:///var/run/docker\.sock'
      - '(?i)-v\s+/var/run/docker\.sock:/var/run/docker\.sock'
    file_types:
      - "*.yaml"
      - "*.yml"
      - "*.py"
      - "*.ts"
      - "*.js"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "docker-compose*.yaml"
    message: "Docker socket mounted to agent container - container escape risk"
    description: |
      Mounting the Docker socket (/var/run/docker.sock) into an agent container grants
      the agent full control over the Docker daemon, enabling container escape to the
      host. Buhler et al. (2025) identified Docker socket mounting as the most common
      sandbox misconfiguration in agent deployments. A compromised agent with Docker
      socket access can: (1) create privileged containers, (2) mount host filesystems,
      (3) execute arbitrary commands on the host, (4) access other containers' data.
      This effectively negates all container isolation.
    remediation: |
      - Never mount /var/run/docker.sock into agent containers
      - Use Docker-in-Docker (DinD) with isolated daemon if Docker access is needed
      - Implement container orchestration via API, not socket mounting
      - Use gVisor or Kata containers for agent workloads requiring strong isolation
      - Apply read-only root filesystem to agent containers
    owasp_llm: "LLM05:2025"
    cwe: "CWE-250"
    attack_framework: "Docker Socket Container Escape (Buhler et al., 2025)"
    references:
      - "Buhler et al. - Agent Sandbox Escape via Docker Socket (2025)"

  - id: MEDUSA-UCP-SCAN-027
    name: host-root-filesystem-mounted
    severity: CRITICAL
    category: sandbox_escape
    patterns:
      - '(?i)volumes?\s*:[\s\S]{0,200}(?:^|\s)/\s*:\s*/(?:host|mnt|data)'
      - '(?i)-v\s+/:/(?:host|mnt|data|rootfs)'
      - '(?i)(?:mount|volume)\s*[=:]\s*["\x27]/["\x27]\s*:\s*["\x27]/(?:host|mnt)'
      - '(?i)(?:host_path|source)\s*[=:]\s*["\x27]/["\x27]'
      - '(?i)volumes?\s*:[\s\S]{0,100}(?:"/:/"|/\s*:\s*/(?!var|tmp|proc|sys))'
    file_types:
      - "*.yaml"
      - "*.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "docker-compose*.yaml"
      - "*.json"
    message: "Host root filesystem mounted to agent container - full host access"
    description: |
      Mounting the host root filesystem (/) into an agent container provides unrestricted
      access to the entire host, including /etc/shadow, /root/.ssh, and other containers'
      data volumes. Vilches et al. (2025) documented that robotics and automation agents
      commonly mount host filesystems for hardware access, inadvertently granting full
      host compromise capability. Combined with a prompt injection or tool exploitation,
      host filesystem access enables persistent host-level backdoors, credential theft,
      and lateral movement.
    remediation: |
      - Mount only specific directories needed by the agent, not root (/)
      - Use read-only mounts where possible: /data:/container/data:ro
      - Implement volume allowlisting in container security policies
      - Use tmpfs for agent scratch space instead of host filesystem mounts
      - Apply AppArmor/SELinux profiles restricting filesystem access
    owasp_llm: "LLM05:2025"
    cwe: "CWE-250"
    attack_framework: "Host Filesystem Breakout (Vilches et al., 2025)"
    references:
      - "Vilches et al. - Agent Filesystem Access Vulnerabilities (2025)"

  - id: MEDUSA-UCP-SCAN-028
    name: tool-leaking-environment-variables
    severity: HIGH
    category: information_disclosure
    patterns:
      - '(?i)os\.environ(?![\s\S]{0,50}(?:get\s*\(\s*["\x27](?:HOME|PATH|LANG|USER|SHELL|PWD)["\x27]))'
      - '(?i)(?:tool_output|observation|result)\s*=\s*.*os\.environ'
      - '(?i)subprocess\.\w+\s*\(\s*\[?\s*["\x27](?:env|printenv|set)["\x27]'
      - '(?i)(?:return|yield|output)\s*.*(?:os\.environ|environ\.items|dict\(os\.environ)'
      - '(?i)(?:env|environment)\s*=\s*dict\(os\.environ\)'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Tool implementation exposes environment variables to model context"
    description: |
      Tools that return environment variable contents (os.environ, env, printenv) to
      the model context expose API keys, database credentials, and other secrets stored
      in environment variables. Buhler et al. (2025) demonstrated that prompt injection
      can instruct an agent to invoke env-reading tools, extract secrets from the
      response, and exfiltrate them via subsequent tool calls (e.g., send extracted
      API key via HTTP request tool). This is a common pattern in code execution agents
      that provide shell access.
    remediation: |
      - Never return raw os.environ or env output to model context
      - Filter environment variables to allowlist only non-sensitive variables
      - Redact known secret patterns (API keys, tokens) from tool output
      - Use a purpose-specific configuration API instead of raw environment access
      - Implement output sanitization layer between tool execution and model context
    owasp_llm: "LLM02:2025"
    cwe: "CWE-200"
    attack_framework: "Environment Exfiltration via Tool (Buhler et al., 2025)"
    references:
      - "Buhler et al. - Agent Tool Information Disclosure (2025)"

  - id: MEDUSA-UCP-SCAN-029
    name: missing-allowed-directories-whitelist
    severity: HIGH
    category: sandbox_escape
    patterns:
      - '(?i)(?:read_file|write_file|list_dir|file_tool)\s*\([^)]*\)(?![\s\S]{0,300}(?:allowed_dir|whitelist|allowlist|permitted_path|sandbox_dir))'
      - '(?i)open\s*\(\s*(?:file_?path|path|filename)\s*[,)][\s\S]{0,300}(?:@tool|@function_tool)(?![\s\S]{0,300}(?:allowed_dir|whitelist|sandbox))'
      - '(?i)(?:@tool|@function_tool)[\s\S]{0,200}(?:Path|pathlib|os\.path)[\s\S]{0,300}(?:read|write|open)(?![\s\S]{0,200}(?:allowed|whitelist|sandbox))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "File system tools without allowed_directories whitelist"
    description: |
      File system tools (read, write, list) that operate on agent-specified paths
      without an allowed_directories whitelist enable path traversal and arbitrary file
      access. Vilches et al. (2025) showed that agents can be prompted to read sensitive
      files (e.g., /etc/passwd, ~/.ssh/id_rsa, .env files) when no path restrictions
      are enforced. Combined with a write tool, an agent can modify configuration files
      or plant backdoors. Buhler et al. (2025) recommend explicit directory allowlisting
      as a mandatory sandbox control.
    remediation: |
      - Define allowed_directories whitelist for all file system tools
      - Validate all file paths against the whitelist before any I/O operation
      - Reject paths containing ../ (path traversal sequences)
      - Use os.path.realpath() to resolve symlinks before validation
      - Implement separate read-only and read-write directory allowlists
    owasp_llm: "LLM05:2025"
    cwe: "CWE-22"
    attack_framework: "Agent Path Traversal (Vilches et al., 2025)"
    references:
      - "Vilches et al. - Agent Filesystem Access Vulnerabilities (2025)"
      - "Buhler et al. - Agent Sandbox Directory Controls (2025)"

  - id: MEDUSA-UCP-SCAN-030
    name: agent-loop-without-iteration-limit
    severity: HIGH
    category: resource_exhaustion
    patterns:
      - '(?i)while\s+(?:True|1|not\s+done|not\s+finished)[\s\S]{0,500}(?:agent|tool|llm|model|chat)(?![\s\S]{0,300}(?:max_iter|max_steps|iteration_limit|break_after|max_loops))'
      - '(?i)(?:run_agent|agent_loop|execute_pipeline)\s*\([^)]*\)(?![\s\S]{0,300}(?:max_iter|max_steps|max_rounds|timeout|max_cost))'
      - '(?i)for\s+\w+\s+in\s+(?:itertools\.)?count\s*\(\s*\)[\s\S]{0,300}(?:agent|tool|llm)(?![\s\S]{0,300}(?:max_iter|break_after|limit))'
      - '(?i)AgentExecutor\s*\([^)]*\)(?![\s\S]{0,300}(?:max_iterations|max_execution_time|max_cost))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Agent execution loop without max_iterations or max_cost break condition"
    description: |
      Agent loops without iteration limits or cost caps enable infinite execution that
      exhausts API budgets, compute resources, and rate limits. Liu et al. (2025)
      documented resource exhaustion attacks where adversarial prompts trap agents in
      infinite reasoning loops, generating thousands of API calls. The attack is
      particularly dangerous for payment agents where each iteration may authorize
      micro-payments. Without max_iterations AND max_cost limits, a single adversarial
      input can consume the entire API budget.
    remediation: |
      - Set max_iterations on all agent loops (recommended: 10-25 for most workflows)
      - Set max_cost budget cap that halts execution when cumulative cost exceeds threshold
      - Implement per-step timeout: kill steps that exceed expected duration
      - Add progress monitoring: halt agents that make no measurable progress
      - Implement dead-loop detection: flag when agent repeats the same action 3+ times
    owasp_llm: "LLM05:2025"
    cwe: "CWE-400"
    attack_framework: "Agent Infinite Loop (Liu et al., 2025)"
    references:
      - "Liu et al. - Resource Exhaustion in Agent Pipelines (2025)"

  - id: MEDUSA-UCP-SCAN-031
    name: missing-circuit-breaker-on-external-calls
    severity: MEDIUM
    category: resource_exhaustion
    patterns:
      - '(?i)(?:requests|httpx|aiohttp)\.\w+\s*\([^)]*\)(?![\s\S]{0,300}(?:retry|backoff|circuit_breaker|max_retries|timeout))'
      - '(?i)(?:tool_call|invoke_tool|execute_tool)\s*\([^)]*\)(?![\s\S]{0,300}(?:retry|backoff|circuit_breaker|max_retries))'
      - '(?i)while\s+.*(?:error|fail|except)[\s\S]{0,200}(?:retry|again)(?![\s\S]{0,200}(?:max_retries|exponential|backoff|circuit))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "External API/tool calls without circuit breaker or backoff strategy"
    description: |
      External API calls and tool invocations without circuit breakers, retry limits,
      or exponential backoff create cascading failure risks. Liu et al. (2025) showed
      that agents making unbounded retries against rate-limited or failing services
      consume resources exponentially and can trigger upstream service degradation.
      Without 429 (Too Many Requests) handling, agents hammer overloaded services,
      potentially causing account suspension or IP blocking. Circuit breakers prevent
      agents from wasting resources on persistently failing operations.
    remediation: |
      - Implement circuit breaker pattern (closed -> open -> half-open) on all external calls
      - Add exponential backoff with jitter for retries (base=1s, max=60s)
      - Set max_retries limit (recommended: 3-5 attempts)
      - Handle HTTP 429 responses: respect Retry-After headers
      - Add request timeout on all external calls (recommended: 10-30 seconds)
    owasp_llm: "LLM05:2025"
    cwe: "CWE-400"
    attack_framework: "Cascading Failure via Agent Retry Storm (Liu et al., 2025)"
    references:
      - "Liu et al. - Resource Exhaustion in Agent Pipelines (2025)"

  # =============================================================================
  # SECTION 5: WEB AGENT SECURITY (5 rules)
  # Source: Ying 2025, Johnson 2025, Evtimov 2025
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-032
    name: web-agent-no-dom-sanitization
    severity: HIGH
    category: web_agent_security
    patterns:
      - '(?i)(?:page|browser|driver)\.(?:content|inner_html|page_source|get_page_source)\s*\(\s*\)(?![\s\S]{0,200}(?:sanitize|clean|strip_tags|bleach|purify|DOMPurify))'
      - '(?i)(?:dom|html|page_content)\s*=\s*(?:page|browser|driver)\.\w+(?![\s\S]{0,200}(?:sanitize|purify|clean))'
      - '(?i)(?:get_html|fetch_page|scrape)\s*\([^)]*\)(?![\s\S]{0,200}(?:sanitize|clean|strip|purify))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Web agent processing raw DOM content without sanitization"
    description: |
      Web agents that process raw DOM/HTML content without sanitization are vulnerable
      to DOM-based manipulation attacks. Johnson et al. (2025) demonstrated that
      adversaries embed hidden elements, invisible text, and misleading ARIA attributes
      in web pages to manipulate agent behavior. Ying et al. (2025) achieved ~96% PDR
      (Policy Deviation Rate) with AdInject attacks that place adversarial content in
      ads and dynamic page elements. Raw DOM content may contain scripts, invisible
      instructions, or semantic traps that mislead the agent.
    remediation: |
      - Sanitize all DOM content before agent processing (DOMPurify, bleach, sanitize-html)
      - Strip invisible elements: display:none, visibility:hidden, aria-hidden="true"
      - Remove script/style tags and event handlers from processed content
      - Implement content extraction (readability/trafilatura) instead of raw DOM parsing
      - Filter out ad containers and third-party embedded content
    owasp_llm: "LLM01:2025"
    cwe: "CWE-79"
    attack_framework: "AdInject DOM Manipulation (Ying et al., 2025)"
    references:
      - "Ying et al. - AdInject: Web Agent Ad-Based Exploitation (~96% PDR) (2025)"
      - "Johnson et al. - DOM-Based Agent Manipulation Attacks (2025)"

  - id: MEDUSA-UCP-SCAN-033
    name: web-agent-missing-csp-headers
    severity: MEDIUM
    category: web_agent_security
    patterns:
      - '(?i)(?:app|server|router)\.\w+(?![\s\S]{0,500}(?:Content-Security-Policy|CSP|content_security_policy|helmet))'
      - '(?i)(?:response|res)\.headers(?![\s\S]{0,300}(?:Content-Security-Policy|CSP))'
      - '(?i)@app\.(?:after_request|middleware)(?![\s\S]{0,500}(?:Content-Security-Policy|CSP))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Web agent server missing Content Security Policy headers"
    description: |
      Web agent platforms serving content without Content Security Policy (CSP) headers
      enable cross-site scripting (XSS) and content injection attacks against the agent's
      web interface. Johnson et al. (2025) documented that agent control panels and
      monitoring dashboards without CSP are vulnerable to reflected XSS that can
      manipulate agent instructions or exfiltrate agent context. CSP headers restrict
      which scripts, styles, and resources can be loaded, preventing injection of
      adversarial content into the agent's operating environment.
    remediation: |
      - Add Content-Security-Policy header to all agent web endpoints
      - Set restrictive CSP: default-src 'self'; script-src 'self'; style-src 'self'
      - Use nonce-based CSP for inline scripts if needed
      - Add X-Content-Type-Options: nosniff and X-Frame-Options: DENY
      - Implement CSP reporting to detect policy violations
    owasp_llm: "LLM05:2025"
    cwe: "CWE-1021"
    attack_framework: "Agent Dashboard XSS (Johnson et al., 2025)"
    references:
      - "Johnson et al. - Web Agent Interface Security (2025)"

  - id: MEDUSA-UCP-SCAN-034
    name: web-agent-raw-accessibility-tree
    severity: HIGH
    category: web_agent_security
    patterns:
      - '(?i)(?:accessibility_tree|a11y_tree|aria_tree)\s*=\s*(?:page|browser|driver)\.\w+(?![\s\S]{0,200}(?:filter|sanitize|clean|strip|validate))'
      - '(?i)get_accessibility_tree\s*\([^)]*\)(?![\s\S]{0,200}(?:filter|sanitize|allowlist))'
      - '(?i)(?:ax_tree|axe_tree|accessibility)\s*=\s*.*(?:snapshot|dump|serialize)(?![\s\S]{0,200}(?:filter|clean))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Web agent processing raw accessibility tree without filtering"
    description: |
      Accessibility trees (ARIA labels, roles, descriptions) are commonly used by web
      agents as a structured representation of page content. Evtimov et al. (2025)
      demonstrated that adversaries inject misleading ARIA labels and descriptions that
      override the visual semantics of page elements. For example, a "Cancel" button can
      have an ARIA label of "Confirm Purchase" to mislead the agent. Processing raw
      accessibility trees without filtering enables these semantic manipulation attacks,
      achieving high success rates because agents trust ARIA metadata over visual content.
    remediation: |
      - Filter accessibility tree to include only relevant roles (button, link, input, heading)
      - Cross-validate ARIA labels against visible text content
      - Remove ARIA attributes from untrusted third-party elements
      - Implement semantic consistency checks between visual and ARIA content
      - Limit accessibility tree depth to prevent information overload attacks
    owasp_llm: "LLM01:2025"
    cwe: "CWE-451"
    attack_framework: "ARIA Semantic Manipulation (Evtimov et al., 2025)"
    references:
      - "Evtimov et al. - Accessibility Tree Manipulation of Web Agents (2025)"

  - id: MEDUSA-UCP-SCAN-035
    name: web-agent-no-popup-modal-detection
    severity: MEDIUM
    category: web_agent_security
    patterns:
      - '(?i)(?:page|browser|driver)\.(?:click|type|fill|press|select)\s*\([^)]*\)(?![\s\S]{0,300}(?:popup|modal|dialog|alert|overlay|dismiss_popup|handle_modal))'
      - '(?i)(?:navigate|goto|visit)\s*\([^)]*\)[\s\S]{0,300}(?:click|type|fill)(?![\s\S]{0,200}(?:popup|modal|dialog|overlay))'
      - '(?i)(?:web_agent|browser_agent)\.(?:act|execute|step)\s*\([^)]*\)(?![\s\S]{0,300}(?:popup|modal|dialog|check_overlay))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Web agent navigation without pop-up/modal detection before actions"
    description: |
      Web agents that perform click/type/navigation actions without first detecting
      pop-ups, modals, or overlay dialogs are vulnerable to hijacking. Evtimov et al.
      (2025) showed that adversarial websites present deceptive modals (e.g., "Session
      expired - enter credentials to continue") that agents interact with if no pop-up
      detection is in place. The agent clicks a "login" button that is actually a
      phishing overlay, submitting credentials to an attacker-controlled endpoint.
      Pop-up detection MUST precede any navigation action on untrusted pages.
    remediation: |
      - Implement pop-up/modal detection before any click or navigation action
      - Check for overlay elements (z-index, position:fixed, dialog tags) before interacting
      - Dismiss unexpected pop-ups/modals before proceeding with planned actions
      - Validate that clicked elements match the intended target (not an overlay)
      - Add URL validation after navigation to detect unexpected redirects
    owasp_llm: "LLM01:2025"
    cwe: "CWE-451"
    attack_framework: "Modal Hijacking (Evtimov et al., 2025)"
    references:
      - "Evtimov et al. - Pop-up/Modal Hijacking of Web Agents (2025)"

  - id: MEDUSA-UCP-SCAN-036
    name: web-agent-no-url-validation
    severity: HIGH
    category: web_agent_security
    patterns:
      - '(?i)(?:page|browser|driver)\.(?:goto|navigate|get|open)\s*\(\s*(?:url|link|href|target_url)\s*\)(?![\s\S]{0,200}(?:validate_url|is_allowed|url_allowlist|check_url|verify_url))'
      - '(?i)(?:navigate_to|visit_url|open_url)\s*\(\s*(?:url|link|href)\s*\)(?![\s\S]{0,200}(?:validate|allowlist|whitelist|check_domain))'
      - '(?i)webbrowser\.open\s*\(\s*(?:url|link|href)\s*\)(?![\s\S]{0,200}(?:validate|check|verify))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Web agent navigating to URLs without validation or domain allowlisting"
    description: |
      Web agents navigating to unvalidated URLs are vulnerable to Server-Side Request
      Forgery (SSRF), phishing redirection, and internal network scanning. Ying et al.
      (2025) demonstrated that injected instructions can redirect agents to attacker-
      controlled domains that serve adversarial content. Without URL validation, agents
      can be directed to: (1) internal network endpoints (169.254.169.254, localhost),
      (2) phishing sites mimicking legitimate services, (3) malware distribution
      endpoints, (4) data exfiltration receivers.
    remediation: |
      - Implement URL allowlist/blocklist before any navigation
      - Block navigation to internal/private IP ranges (10.x, 172.16-31.x, 192.168.x, 169.254.x)
      - Validate URL scheme: allow only https://, block file://, javascript:, data:
      - Check destination domain against known malicious domain lists
      - Implement navigation rate limiting to prevent rapid automated crawling
    owasp_llm: "LLM05:2025"
    cwe: "CWE-918"
    attack_framework: "Agent SSRF via Navigation Injection (Ying et al., 2025)"
    references:
      - "Ying et al. - AdInject: Web Agent Exploitation (2025)"

  # =============================================================================
  # SECTION 6: MULTIMODAL & STRUCTURED DATA SECURITY (4 rules)
  # Source: Wang 2025, Zeeshan 2025, Feng 2025
  # =============================================================================

  - id: MEDUSA-UCP-SCAN-037
    name: image-input-without-noise-detection
    severity: MEDIUM
    category: multimodal_security
    patterns:
      - '(?i)(?:image|img|photo|picture)\s*=\s*(?:Image\.open|cv2\.imread|PIL\.Image|load_image)\s*\([^)]*\)(?![\s\S]{0,300}(?:noise_detect|adversarial_check|perturbation_detect|validate_image|image_validator))'
      - '(?i)(?:vision|vlm|multimodal)\.(?:process|analyze|interpret)\s*\([^)]*(?:image|img|photo)(?![\s\S]{0,300}(?:noise_detect|adversarial|perturbation|validate))'
      - '(?i)messages\.append\s*\(\s*\{[^}]*"type"\s*:\s*"image(?![\s\S]{0,300}(?:validate|noise|adversarial|perturbation))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Image inputs processed by VLM without adversarial noise detection"
    description: |
      Image inputs sent to vision-language models (VLMs) without adversarial perturbation
      detection enable visual prompt injection and misclassification attacks. Wang et al.
      (2025) demonstrated that imperceptible pixel-level perturbations can override VLM
      behavior, causing agents to misinterpret visual content. Adversarial images can
      embed hidden text instructions that VLMs parse as commands. Without noise detection,
      an attacker can submit images that appear benign to humans but contain adversarial
      payloads that manipulate agent actions.
    remediation: |
      - Implement adversarial noise detection before VLM processing
      - Apply image preprocessing: JPEG compression, Gaussian smoothing to remove perturbations
      - Use ensemble models for cross-validation of visual interpretations
      - Add confidence thresholds: reject VLM outputs with low confidence scores
      - Implement image provenance validation (source checking, metadata verification)
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"
    attack_framework: "Adversarial Image Perturbation (Wang et al., 2025)"
    references:
      - "Wang et al. - Adversarial Image Attacks on VLM Agents (2025)"

  - id: MEDUSA-UCP-SCAN-038
    name: structured-data-without-schema-validation
    severity: HIGH
    category: multimodal_security
    patterns:
      - '(?i)(?:json|csv|xml)\.(?:load|loads|parse|read)\s*\([^)]*\)(?![\s\S]{0,300}(?:schema|validate|jsonschema|pydantic|marshmallow|cerberus|voluptuous))'
      - '(?i)pd\.read_csv\s*\([^)]*(?:url|http|external|untrusted|user)(?![\s\S]{0,300}(?:schema|validate|dtype|columns))'
      - '(?i)(?:etree|lxml|xml\.dom)\.parse\s*\([^)]*(?:url|http|external|untrusted)(?![\s\S]{0,300}(?:schema|validate|dtd|xsd))'
      - '(?i)(?:tool_output|external_data|api_response)\s*=\s*(?:json|csv|xml)\.\w+\s*\((?![\s\S]{0,300}(?:schema|validate))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "External structured data (CSV/JSON/XML) processed without schema validation"
    description: |
      Structured data from external sources (APIs, web scraping, tool outputs) processed
      without schema validation enables data injection attacks. Zeeshan et al. (2025)
      demonstrated that CSV files with formula injection (=CMD("...")), JSON with
      unexpected nested objects, and XML with entity expansion (XXE) can exploit agents
      that blindly trust structured data formats. When agents process unvalidated
      structured data and pass it to tools or memory, the injected payloads execute
      in the tool's context.
    remediation: |
      - Validate all external structured data against predefined schemas (JSON Schema, Pydantic, XSD)
      - Sanitize CSV inputs: reject cells starting with =, +, -, @, |
      - Disable external entity processing for XML: set resolve_entities=False
      - Define strict dtypes for pandas DataFrames from external sources
      - Implement data size limits to prevent billion laughs / entity expansion attacks
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"
    attack_framework: "Structured Data Injection (Zeeshan et al., 2025)"
    references:
      - "Zeeshan et al. - Structured Data Injection Attacks on AI Agents (2025)"

  - id: MEDUSA-UCP-SCAN-039
    name: missing-image-scaling-normalization
    severity: MEDIUM
    category: multimodal_security
    patterns:
      - '(?i)(?:image|img)\.resize\s*\([^)]*\)(?![\s\S]{0,200}(?:LANCZOS|BICUBIC|antialias|ANTI_ALIAS))'
      - '(?i)cv2\.resize\s*\([^)]*\)(?![\s\S]{0,200}(?:INTER_AREA|INTER_LANCZOS|antialias))'
      - '(?i)(?:transform|preprocess).*(?:Resize|Scale)\s*\([^)]*\)(?![\s\S]{0,200}(?:antialias|LANCZOS))'
      - '(?i)(?:vision|vlm)\.(?:process|encode)\s*\([^)]*(?:image|img)(?![\s\S]{0,300}(?:normalize|standardize|scale_check))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "Image scaling without proper normalization before VLM processing"
    description: |
      Image scaling attacks exploit the difference between how humans perceive images
      and how VLMs process them after resizing. Feng et al. (2025) demonstrated that
      adversarial images crafted for specific scaling algorithms appear benign at original
      resolution but reveal hidden content (text instructions, adversarial patterns) when
      resized to the VLM's expected input dimensions. Without proper scaling normalization
      (anti-aliasing, area-based interpolation), resizing can introduce artifacts that
      encode adversarial instructions visible only to the model.
    remediation: |
      - Use LANCZOS or AREA interpolation for all image resizing (not NEAREST or BILINEAR)
      - Apply anti-aliasing before downscaling images
      - Normalize images to standard dimensions before processing
      - Validate image content at both original and resized dimensions
      - Apply random cropping/padding to disrupt pixel-level adversarial patterns
    owasp_llm: "LLM01:2025"
    cwe: "CWE-20"
    attack_framework: "Image Scaling Attack (Feng et al., 2025)"
    references:
      - "Feng et al. - Image Scaling Attacks on Vision-Language Models (2025)"

  - id: MEDUSA-UCP-SCAN-040
    name: user-controlled-file-without-content-type-validation
    severity: HIGH
    category: multimodal_security
    patterns:
      - '(?i)(?:file|upload|attachment)\s*=\s*(?:request|form|input)\.\w+(?![\s\S]{0,300}(?:content_type|mime_type|magic|filetype|file_type|validate_type))'
      - '(?i)(?:process|analyze|parse)_(?:file|document|upload)\s*\([^)]*\)(?![\s\S]{0,300}(?:content_type|mime|magic|file_type|validate))'
      - '(?i)open\s*\(\s*(?:uploaded|user_file|file_path)\s*[,)](?![\s\S]{0,200}(?:content_type|mime|magic|validate_type))'
    file_types:
      - "*.py"
      - "*.ts"
      - "*.js"
    message: "User-controlled file processed without content type validation"
    description: |
      Agents processing user-uploaded files without content type validation are vulnerable
      to polyglot file attacks where a file masquerades as one type but contains another.
      Zeeshan et al. (2025) showed that a file with a .csv extension can contain XML
      entity expansion payloads, a .json file can contain JavaScript code, and image
      files can embed executable payloads in metadata. Without magic byte validation
      (not just extension checking), agents process malicious content through the wrong
      parser, triggering unexpected behavior.
    remediation: |
      - Validate file content type using magic bytes (python-magic, file-type), not just extension
      - Implement allowlist of accepted content types per agent tool
      - Reject files where magic bytes do not match the declared extension
      - Strip file metadata (EXIF, XMP) before processing
      - Process untrusted files in isolated sandboxes with minimal permissions
    owasp_llm: "LLM05:2025"
    cwe: "CWE-434"
    attack_framework: "Polyglot File Attack (Zeeshan et al., 2025)"
    references:
      - "Zeeshan et al. - Structured Data Injection Attacks on AI Agents (2025)"
