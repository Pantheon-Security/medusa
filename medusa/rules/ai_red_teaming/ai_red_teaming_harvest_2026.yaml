    frameworks to generate adversarial prompts
  file_types:
  - '*.py'
  - '*.json'
  id: ART-002
  message: 'Detected: jailbreak-seed-template-loading'
  name: jailbreak-seed-template-loading
  owasp_llm: LLM01:2025
