  - (?i)(jailbreak[_\s]*(seed|template)s?\s*[=\[]|load[_\s]*jailbreak|seed[_\s]*pool\s*=)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yu et al. (2023) - GPTFuzzer maintains a seed pool of jailbreak templates
    that undergo mutation
