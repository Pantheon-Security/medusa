  category: ai_red_teaming
rules:
- category: ai_red_teaming
  cwe: CWE-94
  description: Detects import or usage of the GPTFuzzer automated jailbreak prompt
    generation framework for red teaming LLMs
  file_types:
  - '*.py'
  id: ART-001
  message: 'Detected: gptfuzzer-framework-import'
  name: gptfuzzer-framework-import
  owasp_llm: LLM01:2025
  patterns:
  - (?i)(from\s+gptfuzzer|import\s+gptfuzzer|GPTFuzzer\s*\(|gptfuzzer\.mutate)
  remediation: Review usage context. Remove if not authorized research/testing.
  severity: high
  source_paper: Yu et al. (2023) - GPTFuzzer uses seed jailbreak templates with mutational
    fuzzing to auto-generate adversarial prompts
  fp_guards: []
  pipeline_confidence: medium
- category: ai_red_teaming
  cwe: CWE-94
