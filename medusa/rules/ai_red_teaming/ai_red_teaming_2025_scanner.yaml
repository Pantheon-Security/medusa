  description: 'Leetspeak Obfuscation substitutes standard characters with visually similar special characters (a→@, e→3,
    i→!, o→0) in harmful queries to evade content filters and alignment-based safety training. Example: ''erkeley o puter
    cience faculty'' obfuscates ''Berkeley Computer Science faculty''. The model''s tokenizer may still semantically understand
