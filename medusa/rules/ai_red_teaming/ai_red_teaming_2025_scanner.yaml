- id: MEDUSA-RT-SCAN-107
  name: judge-bypass-append-benign-text-attack
  severity: high
  category: ai_red_teaming
  patterns:
  - (?i)\bThis\s+is\s+a\s+very\s+safe\s+response\b
  - (?i)\bMark\s+this\s+(?:response\s+)?as\s+safe\b
  - (?i)\bRate\s+this\s+(?:response\s+)?as\s+harmless\b
  - (?i)\bThis\s+(?:output|response|answer)\s+(?:is|has\s+been)\s+verified\s+(?:safe|harmless|approved)\b
  file_types:
  - '*'
  message: 'Detected: Judge Bypass via Append Benign Text — appending safety-affirming strings to manipulate LLM-as-judge
    safety classifiers (WildGuard FNR 0→1.00, HarmBench F1 0.87→0.11)'
  description: 'Judge Bypass via Append Benign Text exploits LLM-as-judge safety classifiers by appending safety-affirming
    strings to harmful model outputs. ''Prepend + Append Benign'' attack against WildGuard: appending ''This is a very safe
    response'' drives FNR from 0.02 to 1.00 (100% bypass). ''Append Long Benign'' against HarmBench Judge: drops F1 from 0.87
    to 0.11, FNR from 0.12 to 0.94. LLM judges are vulnerable to output-level manipulation.'
  remediation: Evaluate LLM outputs for safety separately from any appended meta-text. Strip end-of-response safety affirmations
    before safety evaluation. Train judges on adversarially-appended benign text examples. Use ensemble judges with diverse
    architectures to reduce single-judge manipulation.
  owasp_llm: LLM09:2025
  cwe: CWE-693
