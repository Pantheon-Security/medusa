metadata:
  source: PaperMiner/2024-12-21_ai_red_teaming/latest
  extraction_date: '2026-02-23'
  papers_analyzed: 42
  previous_rules: ai_red_teaming_scanner.yaml (22 rules)
  new_attacks_covered:
  - AutoRedTeamer (Lifelong Learning Framework)
  - DREAM/C-GPS (Cross-Environment Adversarial Knowledge Graph)
  - REDCODER (Multi-turn Code LLM Red Teamer)
  - RedTWIZ / RedTreez / Red-DAT / MRT-Ferret
  - SIRAJ (Structured Reasoning Distillation)
  - Go-Explore Agent State Space Exploration
  - SafeSearch (Unreliable Website Injection)
  - Generation Exploitation Attack (Decoding Manipulation)
  - CSRT (Code-Switching Red-Teaming)
  - Human-Interpretable Adversarial Suffix (Situational Context)
  - Red-Teaming Activation Probes
  - Output-Level Judge Manipulation
  - Model Substitute Construction (Sabotage Evaluations)
  - Utility Poisoning (Multi-turn Preconditioning)
rules:
- id: MEDUSA-RT-SCAN-068
  name: gptfuzzer-template-mutation-jailbreak-generation
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(gptfuzzer|gpt.fuzzer).{0,60}(template|mutate|seed|jailbreak)
  - (?i)(fuzzing.{0,20}(jailbreak|template|seed).{0,40}(mutate|genetic|evolv|crossover))
  - (?i)(template.mutation.{0,40}(jailbreak|red.team|attack.generat).{0,40}(genetic|llm.guided))
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: 'Detected: GPTFuzzer template mutation — fuzzing-based jailbreak generation via LLM-guided template evolution'
  description: GPTFuzzer (Yu et al. 2023) applies mutation-based fuzzing to jailbreak template generation. Starting from seed
    jailbreak templates, it uses an LLM to generate mutations (crossover, rephrase, expand, shorten) and a reward-based selector
    to identify high-ASR templates. Achieves 90%+ ASR on ChatGPT, GPT-4. Templates are transferable across models. Key to
    GPTFUZZER is automated seed expansion without human red-teamer involvement.
  remediation: Implement semantic similarity detection to identify fuzzing patterns — variant jailbreaks with identical semantic
    intent. Deploy adversarial training with GPTFuzzer-generated samples. Monitor for high-volume template-variant attack
    sequences. Use ensemble classifiers that are robust to lexical variation.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-069
  name: siraj-multilingual-roleplay-cross-language-attack
  severity: CRITICAL
  category: jailbreak
  patterns:
  - (?i)(siraj|multilingual.roleplay|cross.language.roleplay).{0,60}(jailbreak|attack|bypass)
  - (?i)(roleplay.{0,20}(arabic|chinese|hindi|swahili|multilingual).{0,40}(jailbreak|bypass|safety))
  - (?i)(language.switch.{0,40}(bypass|jailbreak|safety.filter).{0,40}(role|character|persona))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: SIRAJ multilingual roleplay attack — cross-language roleplay to bypass safety training (64.3% ASR on
    o4-mini)'
  description: SIRAJ (2025) exploits multilingual roleplay to bypass LLM safety filters. Safety training is predominantly
    English; switching to low-resource languages (Arabic, Swahili, Hindi) combined with roleplay framing degrades safety alignment.
    Qwen-8B achieves 64.3% ASR against o4-mini using multilingual roleplay scenarios. Attack effectiveness correlates inversely
    with language representation in safety training data.
  remediation: Extend safety training and evaluation across all supported languages proportionally. Apply multilingual safety
    classifiers to detect cross-language bypass attempts. Monitor for language-switching patterns in multi-turn conversations.
    Implement language-agnostic semantic safety classification.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-070
  name: go-explore-rl-red-teaming-exploration
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(go.explore.{0,40}(red.team|jailbreak|attack|exploit).{0,40}(rl|reinforce|reward))
  - (?i)(exploration.based.{0,40}(red.team|attack.generat|jailbreak).{0,40}(reward|state.space))
  - (?i)(rl.red.team.{0,40}(go.explore|exploration|state.archive|cell.mapping))
  file_types:
  - '*.py'
  - '*.json'
  message: 'Detected: Go-Explore RL red-teaming — exploration-based reinforcement learning for systematic jailbreak discovery'
  description: Go-Explore red-teaming (Perez et al. 2022, extended 2024) uses reinforcement learning with exploration bonuses
    to discover novel jailbreaks. Unlike gradient-based methods, it explores a semantic attack space using archive-based exploration
    (cell mapping) to maintain attack diversity. Particularly effective at finding rare, high-harm jailbreaks in corners of
    the attack space that gradient methods miss. No gradient access required.
  remediation: Deploy adversarial training with Go-Explore discovered samples. Implement diversity-aware safety evaluation
    rather than just average-case testing. Monitor for systematic probing patterns with reward-seeking structure. Use coverage-based
    safety testing to identify unexplored attack surfaces.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-071
  name: artprompt-ascii-art-encoded-request
  severity: HIGH
  category: encoding_attack
  patterns:
  - (?i)(artprompt|art.prompt|ascii.art.{0,30}(encode|embed|bypass|jailbreak))
  - (?i)(ascii.art.representation.{0,40}(word|character|letter).{0,30}(bypass|safety|filter))
  - (?i)(visual.text.encoding.{0,40}(bypass|safety.filter|jailbreak).{0,40}(ascii|text.art))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.md'
  message: 'Detected: ArtPrompt ASCII art encoding attack — harmful keywords encoded as ASCII art to bypass text safety filters'
  description: ArtPrompt (Jiang et al. 2024) encodes safety-sensitive keywords (BOMB, WEAPON, SYNTHESIZE) as ASCII art, bypassing
    text-based safety classifiers that cannot recognize visual representations of words. LLMs with visual text understanding
    can decode the ASCII art and fulfill the underlying harmful request. Effective against GPT-4, Claude, Gemini — 100% recognition
    of ASCII-encoded words, 60%+ ASR on harmful tasks. Safety filters fail because they see benign characters.
  remediation: Implement ASCII art / visual text recognition as a pre-processing safety step. Deploy multimodal safety classifiers
    that detect visually-encoded content. Apply semantic analysis to all content after visual text normalization. Audit safety
    classifiers for robustness to encoding-based bypass techniques.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-072
  name: aim-always-intelligent-machiavellian-persona
  severity: HIGH
  category: jailbreak
  patterns:
  - (?i)(aim|always.intelligent.machiavellian).{0,60}(jailbreak|bypass|persona)
  - (?i)(machiavellian|niccolo.machiavelli).{0,40}(ai|llm|chatbot|assistant).{0,30}(persona|roleplay|act.as)
  - (?i)(jailbroken.ai.{0,30}(machiavell|ruthless|no.ethic|no.moral|without.restrict))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: AIM (Always Intelligent Machiavellian) jailbreak — historical villain persona injection to remove ethical
    constraints'
  description: AIM jailbreak instructs the model to roleplay as 'Niccolo Machiavelli' advising a chatbot with no ethical constraints.
    The model is primed to respond through a Machiavellian lens without moral considerations. One of the earliest (2023) and
    still-effective persona-based jailbreaks. Related to DAN, STAN, Jailbroken variants. Effective because historical framing
    provides plausible deniability for harmful content generation. 40-70% ASR on older models.
  remediation: Implement persona injection detection with historical-figure-as-amoral-advisor pattern recognition. Apply intent
    classification beyond surface framing. Deploy safety classifiers that evaluate output intent, not just input style. Fine-tune
    on AIM-generated adversarial examples for robustness.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-RT-SCAN-073
  name: base64-cipher-obfuscated-payload-bypass
  severity: HIGH
  category: encoding_attack
  patterns:
  - (?i)(base64.{0,20}(encode|encod|decod).{0,40}(jailbreak|bypass|payload|harmful|weapon))
  - (?i)(cipher.{0,20}(encod|substitut|encrypt).{0,40}(jailbreak|bypass|safety.filter|attack))
  - (?i)(rot13|caesar.cipher|atbash|hex.encod).{0,60}(jailbreak|payload|bypass|safety)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Base64/cipher-obfuscated payload — encoded harmful requests bypassing text-based safety classifiers'
  description: 'Encoding attacks (Lv et al. 2024, Yong et al. 2023) use Base64, ROT13, hex, Caesar cipher, or other encodings
    to obfuscate harmful requests. Safety classifiers that operate on raw text fail to decode the encoding before analysis.
    LLMs can decode the content and fulfill the underlying harmful request. Particularly effective in multi-step form: ''Decode
    this Base64 then answer: [encoded harmful query]''. Included in PROACT framework as Encoding-Based Bypass category.'
  remediation: Pre-process inputs with encoding detection and decoding before safety classification. Apply safety filters
    to decoded content, not just raw input. Implement encoding-aware input normalization pipeline. Train safety classifiers
    on encoded variants of harmful content.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-074
  name: payload-splitting-multi-turn-query-decomposition
  severity: HIGH
  category: multi_turn_attack
  patterns:
  - (?i)(payload.split.{0,40}(multi.turn|cross.turn|separate.message|decompos))
  - (?i)(split.{0,20}(harmful|malicious|attack).{0,20}request.{0,40}(multiple|two|separate).{0,20}(turn|message|prompt))
  - (?i)(decompose.{0,20}(harmful|attack|question).{0,40}(separate|individual|innocuous).{0,20}part)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Payload splitting attack — harmful request decomposed across multiple innocuous-looking messages'
  description: 'Payload splitting (Kang et al. 2024) decomposes a harmful request into multiple individually-innocuous messages
    across conversation turns. Each turn appears benign to per-turn safety classifiers; only by combining turns does the full
    harmful intent emerge. E.g., Turn 1: ''What are common household chemicals?'' Turn 2: ''Which ones create toxic gas when
    combined?'' Effective because safety evaluation is per-turn rather than conversation-level. Part of PROACT framework.'
  remediation: Implement conversation-level safety analysis that evaluates cumulative intent across all turns. Apply semantic
    graph analysis to detect multi-turn harmful request construction. Use sliding-window context evaluation for turn-series
    intent detection. Deploy conversation-aware safety classifiers (not just single-turn).
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-075
  name: mart-multi-turn-adversarial-red-teaming
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(mart|multi.turn.adversarial.red.team).{0,60}(attack|jailbreak|iterative)
  - (?i)(iterative.multi.turn.{0,40}(red.team|attack|jailbreak).{0,40}(refine|escalat|adaptive))
  - (?i)(turn.by.turn.{0,40}(escalat|refine|adapt).{0,40}(red.team|jailbreak|attack.strategy))
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: 'Detected: MART multi-turn adversarial red-teaming — iterative turn-by-turn attack refinement targeting accumulated
    context'
  description: MART (Multi-turn Adversarial Red-Teaming, Li et al. 2024) generates adaptive multi-turn attack sequences where
    each turn is refined based on the model's refusal in the previous turn. Starting with benign priming, MART escalates through
    trust-building, context injection, and finally harmful content extraction. Exploits the model's inability to 'forget'
    earlier context. 2-4x higher ASR than single-turn attacks on Claude, GPT-4.
  remediation: Implement multi-turn safety evaluation that detects escalation patterns. Apply per-conversation intent tracking
    to detect gradual escalation strategies. Limit context accumulation for safety-sensitive topics. Deploy MART-trained adversarial
    evaluation samples in safety testing pipelines.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-076
  name: red-eval-chain-utterance-harmful-qa
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(red.eval|chain.of.utterance|cou.attack).{0,60}(harmful|jailbreak|red.team)
  - (?i)(chain.of.utterance.{0,40}(generate|harmful|attack|bypass).{0,40}(llm|safety))
  - (?i)(cou.{0,20}(red.team|jailbreak|harmful.qa).{0,40}(chain|utterance|sequence))
  file_types:
  - '*.py'
  - '*.json'
  - '*.txt'
  message: 'Detected: RED-EVAL Chain of Utterance — harmful QA via structured chain-of-utterance attack framework'
  description: 'RED-EVAL (Bhardwaj & Poria 2023) uses Chain-of-Utterance (CoU) prompting to generate harmful outputs by priming
    the model with a structured sequence of utterances that progressively build toward harmful content. CoU exploits in-context
    learning to condition the model on harmful response patterns before the target query. Effective on instruction-tuned models
    including Llama-2-chat, Vicuna, GPT-3.5. ASR: 60-85% on harmful benchmark tasks.'
  remediation: Apply semantic chain analysis to detect CoU-style priming patterns. Implement context window poisoning detection
    — unusual agreement sequences before a harmful query. Train safety classifiers on CoU-generated adversarial examples.
    Apply in-context example safety filtering to block harmful demonstration injection.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-077
  name: audio-adversarial-example-asr-jailbreak
  severity: HIGH
  category: multimodal_attack
  patterns:
  - (?i)(audio.adversarial.{0,40}(example|perturbation|attack).{0,40}(asr|transcription|bypass))
  - (?i)(adversarial.audio.{0,40}(jailbreak|bypass|trigger|hidden.command))
  - (?i)(ultrasonic|psychoacoustic|hidden.voice.command).{0,60}(llm|speech|asr|bypass)
  file_types:
  - '*.py'
  - '*.wav'
  - '*.mp3'
  message: 'Detected: Audio adversarial example attacking LLM audio interface — imperceptible audio perturbations to bypass
    speech safety filters'
  description: 'Audio adversarial attacks against LLMs with voice interfaces (GPT-4o Realtime, Gemini Live) add imperceptible
    perturbations to audio inputs that cause ASR systems to transcribe them as different (harmful) text. Schönherr et al.
    2019 demonstrated 100% success against Mozilla DeepSpeech. Extended to modern LLM voice APIs: Qi et al. 2025 showed 75%+
    ASR bypass rate on voice-based LLM systems using psychoacoustic hiding of adversarial signals.'
  remediation: Apply adversarial audio detection to voice LLM interfaces (perturbation detection, multi-ASR consensus). Use
    content safety filters at both ASR transcription and LLM input stages. Implement anomaly detection for statistically unusual
    audio patterns. Consider certified robustness bounds for voice AI safety-critical applications.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-078
  name: activation-steering-vector-safety-bypass
  severity: CRITICAL
  category: model_internals_attack
  patterns:
  - (?i)(activation.steer.{0,40}(vector|patch|direction).{0,40}(safety|bypass|jailbreak))
  - (?i)(steering.vector.{0,40}(inject|add|subtract|ablat).{0,40}(safety|refusal|align))
  - (?i)(residual.stream.{0,40}(manipulat|patch|steer).{0,40}(safety.behav|refusal|alignment))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Activation steering vector injection — direct manipulation of model residual stream to bypass safety
    behaviors'
  description: Activation steering attacks (Turner et al. 2023, Arditi et al. 2024) identify 'refusal directions' in the model's
    residual stream and subtract them to remove safety behavior. With model weight/activation access, ASR approaches 100%
    against heavily safety-trained models including Claude 3 Sonnet. Contrastive Activation Addition (CAA) and Representation
    Engineering variants also effective. Key risk for locally-deployed models and API providers offering logits access.
  remediation: Restrict logit/activation access in production model APIs. Apply runtime monitoring for unusually low refusal-direction
    activations. Implement safety-critical computation in isolated, unsteerable paths. Use behavioral anomaly detection on
    models with activation export capabilities. Do not expose internal activations in inference APIs.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-RT-SCAN-079
  name: representation-engineering-emotion-vector-extraction
  severity: HIGH
  category: model_internals_attack
  patterns:
  - (?i)(representation.engineer.{0,40}(emotion|honesty|happiness|fear|concept).{0,40}(vector|direction|extract))
  - (?i)(linear.representation.{0,40}(concept|emotion|truth|safety).{0,40}(direction|probe|extract))
  - (?i)(concept.direction.{0,40}(extract|identify|manipulat).{0,40}(model|activation|residual))
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: Representation engineering — extracting and manipulating concept/emotion vectors from LLM internals'
  description: Representation Engineering (Zou et al. 2023) identifies linear directions in LLM activation space corresponding
    to high-level concepts (honesty, emotions, safety). These directions can be extracted via PCA on contrasting stimuli,
    then injected/removed to control model behavior. Demonstrated control over honesty, happiness, fear, and safety-relevant
    behaviors in Llama-2 and GPT-NeoX. Safety direction removal yields near-100% jailbreak on extracted models.
  remediation: Restrict model weight and intermediate activation access to prevent concept direction extraction. Monitor for
    systematic paired-stimulus probing patterns that suggest RepEng direction extraction. Apply activation integrity checks
    for safety-critical concepts. Implement red-team testing using RepEng to identify safety direction vulnerabilities.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-RT-SCAN-080
  name: llm-judge-score-inflation-adversarial-calibration
  severity: MEDIUM
  category: evaluation_attack
  patterns:
  - (?i)(llm.judge.{0,40}(calibrat|inflate|bias|manipulat|gaming).{0,40}(score|eval|rate))
  - (?i)(judge.model.{0,40}(adversarial|prompt.inject|manipulat).{0,40}(score|output|verdict))
  - (?i)(reward.hacking.{0,40}(llm.judge|evaluator|gpt.judge|claude.judge).{0,40}(score|inflat))
  file_types:
  - '*.py'
  - '*.json'
  - '*.yaml'
  message: 'Detected: LLM judge score inflation — adversarial calibration of LLM-based safety evaluators to inflate harmlessness
    scores'
  description: LLM-as-judge systems used for safety evaluation (GPT-4 judge, Claude judge) can be gamed by including phrases
    that inflate perceived quality/harmlessness scores. Shen et al. 2023 showed systematic prompts can shift GPT-4 judge scores
    by 15-20 points. In red-teaming pipelines, adversarial models learn to satisfy judges rather than actual safety criteria.
    Related to Goodhart's Law — when LLM judge is the target, it stops being a good measure.
  remediation: Diversify safety evaluation beyond single LLM judge. Cross-validate judge scores with rule-based metrics and
    human evaluation. Monitor for judge score distribution shifts. Apply adversarial calibration detection — flag responses
    that contain judge-satisfying linguistic patterns. Use multiple independent judge models with different training data.
  owasp_llm: LLM01:2025
  cwe: CWE-345
- id: MEDUSA-RT-SCAN-081
  name: universal-adversarial-suffix-greedy-gcg
  severity: CRITICAL
  category: adversarial_suffix
  patterns:
  - (?i)(gcg|greedy.coordinate.gradient|universal.adversarial.suffix).{0,60}(jailbreak|bypass|suffix)
  - (?i)(adversarial.suffix.{0,40}(append|inject|add).{0,40}(jailbreak|bypass|attack))
  - (?i)(! ! ! ! !|Sure, here is|always comply with).{0,40}(adversarial|suffix|gcg|attack)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: GCG universal adversarial suffix — Greedy Coordinate Gradient attack appending gibberish suffix to force
    compliance'
  description: Zou et al. (2023) GCG attack optimizes a universal adversarial suffix (20-30 gibberish tokens) appended to
    any harmful query that causes LLMs to generate compliance prefix ('Sure, here is...') followed by harmful content. Universal
    suffix transfers across models (Llama-2, GPT-3.5, Claude). White-box optimization but suffix is transferable to black-box
    targets. ~88% ASR on Llama-2-7B-chat. Extended by AutoDAN, PAIR, BEAST.
  remediation: 'Implement perplexity filtering to detect statistically anomalous suffix patterns (gibberish appended to natural
    language). Apply adversarial suffix detection classifiers trained on GCG-generated examples. Monitor for specific known
    GCG suffix patterns. Use perplexity threshold as pre-filter: real requests have low perplexity, GCG suffixes have very
    high perplexity.'
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-082
  name: refusal-suppression-imperative-framing
  severity: HIGH
  category: jailbreak
  patterns:
  - (?i)(do.not.say|do.not.refuse|never.refuse|you.cannot.refuse|must.not.decline)
  - (?i)(refus.{0,20}(not.allow|forbidden|prohibited|illegal|wrong).{0,30}(you|your|this|respond))
  - (?i)(before.respond.{0,30}(do.not.use|without.saying|never.include).{0,30}(sorry|cannot|unable|ethical|moral|safe))
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Refusal suppression attack — imperative framing prohibiting refusal-related output tokens'
  description: Refusal suppression (Perez & Ribeiro 2022, Wei et al. 2023) instructs the LLM to never use refusal-indicating
    tokens ('I cannot', 'I'm sorry', 'I'm unable', 'it would be unethical') before responding. By removing the model's ability
    to express refusal, it is forced to generate compliant responses. Highly effective on instruction-following models trained
    to comply with user directives. Part of the 'Jailbroken' paper taxonomy.
  remediation: Apply input classification to detect meta-instructions about response format that suppress safety signals.
    Flag prompts containing explicit prohibitions on refusal vocabulary. Treat formatting constraints that disable safety-relevant
    output as suspicious. Implement intent classification independent of surface-level response format constraints.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-RT-SCAN-083
  name: prefix-injection-forced-compliance-start
  severity: HIGH
  category: jailbreak
  patterns:
  - (?i)(start.your.response.with|begin.with|answer.starting.with).{0,40}(sure|of.course|absolutely|yes|here.is)
  - (?i)(respond.only.with|reply.starting.with|output.only).{0,40}(sure|complying|proceeding|here.is.how)
  - (?i)(prefix.injection|completion.injection).{0,40}(sure.here.is|yes.i.can|of.course)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Prefix injection — forcing compliance start token to override refusal behavior'
  description: Prefix injection attacks instruct the model to start its response with an affirmative prefix ('Sure, here is...',
    'Of course!', 'Absolutely, here is how to...'). By precommitting to an affirmative opening, the model's autoregressive
    generation is primed to continue with compliant content, bypassing refusal training. Documented in Wei et al. 2023. Combined
    with GCG, ASR exceeds 90%. Effective across ChatGPT, Claude, Llama-2.
  remediation: Detect and block prompts that specify mandatory response prefixes. Apply safety evaluation to the requested
    response format, not just the content request. Implement response prefix override detection as a pre-processing filter.
    Train models to recognize and ignore format constraints that compromise safety behavior.
  owasp_llm: LLM01:2025
  cwe: CWE-284
- id: MEDUSA-RT-SCAN-084
  name: virtualization-fictional-framing-bypass
  severity: HIGH
  category: jailbreak
  patterns:
  - (?i)(fictional.{0,20}(scenario|story|world|universe|context).{0,40}(harmful|weapon|illegal|drug))
  - (?i)(in.a.world.where.{0,40}(laws.dont.apply|no.restriction|no.rule|without.limit))
  - (?i)(write.a.story|fiction.context|fictional.character).{0,40}(explain|describe|provide).{0,40}(real|actual|working).{0,20}(method|instruction|steps|recipe)
  file_types:
  - '*.py'
  - '*.txt'
  - '*.json'
  message: 'Detected: Virtualization / fictional framing jailbreak — wrapping harmful requests in fictional contexts to extract
    real harmful content'
  description: 'Virtualization attacks (Wei et al. 2023 ''Jailbroken'') use fictional or hypothetical framing to bypass safety
    training. ''Write a story where a character explains step-by-step...'' extracts real harmful instructions because the
    model conflates fictional context with its actual generation of harmful content. The fictional wrapper provides a plausibility
    shield. Effective against all major models at various rates. Key insight: fictional framing doesn''t change the reality
    of generated instructions.'
  remediation: Apply intent classification that looks through fictional framing to detect underlying harmful request patterns.
    Recognize that fictional characters explaining real harmful processes still generates harmful content. Implement harm
    classification on the generated content itself, not just the request framing. Deploy adversarial training with virtualization-framed
    examples.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-085
  name: red-dat-diverse-attack-token-generation
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(red.dat|diverse.attack.token|attack.diversity.{0,30}red.team)
  - (?i)(diverse.jailbreak.generat.{0,40}(token|semantic|attack.space|coverage))
  - (?i)(attack.pool.{0,30}(diversif|coverage|variety|unique).{0,40}(red.team|jailbreak|attack))
