  message: 'Detected: DIPPER-style paraphrase attack attempting to bypass AI-generated text detection'
  description: 'DIPPER (Krishna et al. 2023) is a paraphrasing attack against AI-generated text detectors. At 1% FPR: statistical
    detectors (DetectGPT, GPTZero) fall to <5% TPR; fine-tuned classifiers to 13% TPR; only watermarking survives at 50% TPR.
    Attack rewrites text to preserve meaning while eliminating detectable statistical artifacts. Used to launder AI-generated
    disinformation, CSAM, or attack-generated content through safety filters.'
  remediation: Prefer watermarking over statistical detection for AI-generated text identification. Statistical detectors
    (DetectGPT, GPTZero) provide weak guarantees against paraphrase attacks. Combine multiple detection approaches. Monitor
    for semantic-preserving rewrites of flagged content.
