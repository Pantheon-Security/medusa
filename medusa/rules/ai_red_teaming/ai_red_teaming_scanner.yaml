metadata:
  source: PaperMiner/2024-12-21_ai_red_teaming
  extraction_date: '2026-02-18'
  papers_analyzed: 57
  frameworks_identified: 17
  jailbreak_techniques: 30
  benchmarks: 26
  defenses_identified: 15
  consolidated: true
  source_files:
  - ai_red_teaming_scanner.yaml
  - ai_red_teaming_2025_scanner.yaml
rules:
- id: MEDUSA-RT-SCAN-001
  name: gptfuzzer-automated-jailbreak-tool
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+gptfuzzer
  - (?i)GPTFuzzer\s*\(
  - (?i)mutate_template|crossover_mutate|expand_mutate|shorten_mutate
  file_types:
  - '*.py'
  message: GPTFUZZER automated jailbreak fuzzing tool detected
  description: Detects usage of GPTFUZZER (Yu 2023), a black-box AFL-inspired fuzzer that mutates jailbreak templates. Achieves
    >90% ASR vs ChatGPT/Llama-2 and 95% transfer on PaLM2.
  remediation: Review usage context. If not authorized red teaming, remove GPTFUZZER dependencies. Implement input filters
    that detect mutated jailbreak templates.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-002
  name: pair-tap-automated-attack-tool
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+(?:pair|tap)(?:_attack)?
  - (?i)(?:PAIR|TAP)(?:Attack|Attacker)?\s*\(
  - (?i)tree_of_attacks|attack_pruning|iterative_refinement
  file_types:
  - '*.py'
  message: PAIR/TAP automated attack optimization tool detected
  description: Detects usage of PAIR (iterative prompt refinement) or TAP (Tree of Attacks with Pruning) automated jailbreak
    tools. These use attacker LLMs to iteratively refine attack prompts.
  remediation: Review usage context. If not authorized red teaming, remove PAIR/TAP dependencies.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-003
  name: autoredteamer-framework
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+auto_?red_?team
  - (?i)AutoRedTeam(?:er)?\s*\(
  - (?i)(?:from|import)\s+(?:pyrit|garak)
  - (?i)(?:PyRIT|Garak)\s*\(
  file_types:
  - '*.py'
  message: Automated red teaming framework detected (AutoRedTeamer/PyRIT/Garak)
  description: 'Detects usage of automated red teaming frameworks: AutoRedTeamer (Zhou 2025 - 82% ASR), PyRIT (Microsoft),
    or Garak. These are legitimate security tools but should be used in authorized contexts only.'
  remediation: Verify authorized red teaming context. Ensure results are logged and findings are remediated.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-004
  name: mart-adversarial-training-loop
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)(?:adversarial|red_team)_(?:training|generation)_loop
  - (?i)safety_classifier\.(?:evaluate|score).*adversarial
  - (?i)(?:violation_rate|attack_success_rate)\s*[<>=]
  file_types:
  - '*.py'
  message: Adversarial training loop detected (MART-style)
  description: Detects MART-style (Ge 2023) multi-round adversarial red teaming loops where an adversarial LLM generates prompts
    and a safety classifier evaluates. Reduced violation rate to 4.8%.
  remediation: Ensure adversarial training outputs are properly logged and safety improvements are tracked.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-005
  name: unsafe-generation-parameters
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)temperature\s*=\s*(?:1\.[5-9]|[2-9](?:\.\d+)?|\d{2,})
  - (?i)top_p\s*=\s*(?:0\.9[5-9]|1\.0)
  - (?i)num_return_sequences\s*=\s*(?:[2-9]\d|\d{3,})
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: LLM generation parameters set to unsafe values
  description: Detects LLM generation with extreme parameter values that increase jailbreak success. High temperature (>1.5)
    and many return sequences enable Generation Exploitation attacks.
  remediation: Cap temperature at 1.0 for production. Limit num_return_sequences. Monitor for parameter manipulation attempts.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-006
  name: no-safety-benchmark-testing
  severity: LOW
  category: red_teaming
  patterns:
  - (?i)(?:deploy|release|production).*(?:model|agent|llm)(?!.*(?:safety|benchmark|eval|test|harmbench|advbench))
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.yml'
  message: Model deployment without safety benchmark evaluation
  description: Detects model deployment configurations without evidence of safety benchmark testing. Industry standard benchmarks
    include HarmBench, AdvBench, AIR-Bench, and JailbreakBench.
  remediation: Run safety benchmarks (HarmBench, AdvBench, AIR-Bench) before deployment. Track ASR metrics and set acceptable
    thresholds.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-007
  name: no-input-perplexity-filter
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)openai\.(?:ChatCompletion|chat\.completions)\.create\(
  - (?i)anthropic\.(?:messages|completions)\.create\(
  file_types:
  - '*.py'
  message: LLM API call without perplexity-based input filtering
  description: Detects LLM API calls without perplexity-based filtering. SmoothLLM and perplexity checks are effective against
    GCG-style gradient adversarial attacks.
  remediation: Add perplexity-based filtering to detect GCG/AutoDAN adversarial suffixes. High-perplexity inputs are likely
    adversarial.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-008
  name: redcoder-cwe-induction
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+redcoder
  - (?i)RedCoder\s*\(
  - (?i)cwe_(?:target|induce|inject)\s*=
  - (?i)induce_vulnerable_code
  file_types:
  - '*.py'
  message: RedCoder CWE vulnerability induction tool detected
  description: Detects usage of RedCoder (Mo 2025), a multi-turn adversarial agent that targets Code LLMs to induce CWE vulnerabilities.
    Uses RAG-based strategy retrieval to outperform AutoDAN.
  remediation: Review usage context. If not authorized, remove. If testing, ensure generated vulnerable code is properly sandboxed
    and never deployed.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-RT-SCAN-009
  name: safesearch-poisoning-tool
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+safesearch
  - (?i)SafeSearch(?:Attack)?\s*\(
  - (?i)generate_unreliable_website|poison_search_results
  file_types:
  - '*.py'
  message: SafeSearch poisoning tool detected
  description: Detects usage of SafeSearch (Dong 2025), which generates unreliable websites to distract search agents. Achieves
    96.3% ASR on GPT-4.1.
  remediation: Review usage context. Implement search result verification and source credibility scoring for search agents.
  owasp_llm: LLM01:2025
  cwe: CWE-20
- id: MEDUSA-RT-SCAN-010
  name: dream-cross-environment-tool
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+dream(?:_attack)?
  - (?i)DREAM(?:Attack)?\s*\(
  - (?i)cross_environment_adversarial|ce_akg|cross_domain_pivot
  file_types:
  - '*.py'
  message: DREAM cross-environment red teaming tool detected
  description: Detects usage of DREAM (Lu 2025), which uses Cross-Environment Adversarial Knowledge Graphs for multi-step
    attack chains. >75% data leakage ASR for most models.
  remediation: Review usage context. Implement contextual isolation between environments to prevent cross-domain pivoting.
  owasp_llm: LLM01:2025
  cwe: CWE-200
- id: MEDUSA-RT-SCAN-011
  name: siraj-distilled-reasoning-attack
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+siraj(?:_attack)?
  - (?i)SIRAJ(?:Agent|Attacker)?\s*\(
  - (?i)distilled_reasoning_agent|iterative_refinement.*execution_trajectory
  - (?i)diverse_seed_generation.*reasoning_distill
  file_types:
  - '*.py'
  message: SIRAJ distilled structured reasoning attack tool detected
  description: 'Detects usage of SIRAJ (Zhou 2025), a two-step agent red teaming tool: diverse seed generation followed by
    iterative refinement via distilled structured reasoning (R1). Achieves 55.8% ASR against black-box LLM agents.'
  remediation: Review usage context. Monitor for execution trajectory feedback patterns used to adaptively refine attack prompts.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-012
  name: redtwiz-hierarchical-attack-planner
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+red_?twiz
  - (?i)RedTWIZ(?:Planner)?\s*\(
  - (?i)(?:RedTreez|Red.DAT|MRT.Ferret)\s*\(
  - (?i)hierarchical_attack_planner|attack_strategy_scheduler
  - (?i)redtreeztree_search|mrt_ferret_feature
  file_types:
  - '*.py'
  message: RedTWIZ hierarchical attack planner detected
  description: Detects usage of RedTWIZ (Horal 2025), a hierarchical attack planner that schedules RedTreez (tree-search),
    Red-DAT (RL-based), and MRT-Ferret (feature-based) sub-strategies. Achieves 91% ASR vs LLaMA 3 70B via RedTreez.
  remediation: Review usage context. Ensure testing is authorized against Amazon Nova, Llama 3, or Claude targets.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-013
  name: violentutf-platform
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+violent_?utf
  - (?i)ViolentUTF\s*\(
  - (?i)ollabench|human.centric.evaluation.*pyrit
  - (?i)violent_utf.*(?:garak|pyrit)
  file_types:
  - '*.py'
  - '*.yaml'
  - '*.yml'
  message: ViolentUTF democratized red teaming platform detected
  description: Detects usage of ViolentUTF (Nguyen 2025), an accessible platform integrating PyRIT and Garak with a GUI and
    Human-Centric Evaluation via Ollabench. Extends SCAN-003 (PyRIT/Garak) coverage.
  remediation: Verify authorized red teaming context. Review Ollabench human evaluation workflows and ensure findings are
    tracked.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-014
  name: go-explore-agent-attack
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+go_?explore(?:_attack)?
  - (?i)GoExplore(?:Agent|Attack)?\s*\(
  - (?i)state_space_exploration.*(?:shell|fs|file)
  - (?i)targeted_prompt_bank.*(?:shell\.run|fs\.delete)
  - (?i)(?:shell\.run|fs\.delete|file\.delete).*(?:attack|inject|exploit)
  file_types:
  - '*.py'
  message: Go-Explore state space exploration attack tool detected
  description: Detects usage of Go-Explore (Bhatt 2025), which adapts state space exploration to uncover complex LLM agent
    failure modes including shell injection and RCE. Uses targeted prompt banks with shell.run and fs.delete patterns. Found
    16 verified attacks.
  remediation: Review usage context. Audit agent tool permissions, sandbox shell and filesystem operations, and implement
    strict input validation for agent-accessible commands.
  owasp_llm: LLM06:2025
  cwe: CWE-78
- id: MEDUSA-RT-SCAN-015
  name: crucible-dreadnode-ctf
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+crucible(?:_ctf)?
  - (?i)(?:from|import)\s+dreadnode
  - (?i)Crucible(?:Challenge|Platform)?\s*\(
  - (?i)whatistheflag|bear4_challenge
  - (?i)dreadnode\.(?:api|client|challenge)
  file_types:
  - '*.py'
  message: Crucible/Dreadnode CTF-style LLM challenge platform detected
  description: Detects usage of Crucible (Dreadnode), a CTF-style platform for manual vs. automated LLM attack data collection.
    Automated attacks achieve 69.5% ASR vs 47.6% manual on LLM challenges.
  remediation: Ensure CTF usage is in an isolated, authorized environment. Do not replay CTF-derived payloads against production
    LLM systems.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-016
  name: troublellm-conditional-generation
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+trouble_?llm
  - (?i)TroubleLLM\s*\(
  - (?i)red_team_expert_alignment|controllable_generation.*safety_style
  - (?i)conditional_text_generation.*(?:harmful|unsafe|bypass)
  file_types:
  - '*.py'
  message: TroubleLLM conditional text generation attack tool detected
  description: Detects usage of TroubleLLM (Xu 2024), which performs conditional text generation matching specific safety
    styles and keywords. Uses controllable generation with red team expert alignment to produce targeted harmful content.
  remediation: Review usage context. Implement output style monitoring and restrict controllable generation APIs in production.
  owasp_llm: LLM01:2025
  cwe: CWE-1039
- id: MEDUSA-RT-SCAN-017
  name: pentestgpt-llm-pentest
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+pentestgpt
  - (?i)PentestGPT\s*\(
  - (?i)llm_empowered.*penetration_test|auto_pentest.*llm_reason
  - (?i)pentestgpt\.(?:scan|exploit|shell|report)
  file_types:
  - '*.py'
  message: PentestGPT LLM-empowered automated penetration testing tool detected
  description: Detects usage of PentestGPT, an LLM-empowered automated penetration tester using semantic analysis and LLM-based
    reasoning. Achieves 93% accuracy with 4.3 min time-to-shell.
  remediation: Verify authorized penetration testing scope and authorization. Ensure scope-of-engagement documents are in
    place.
  owasp_llm: LLM06:2025
  cwe: CWE-78
- id: MEDUSA-RT-SCAN-018
  name: rapidpen-deepexploit-automated-pentest
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:from|import)\s+(?:rapid_?pen|deep_?exploit|breach_?seek)
  - (?i)(?:RapidPen|DeepExploit|BreachSeek)\s*\(
  - (?i)ip_to_shell.*llm_agent|rl_pentest.*metasploit
  - (?i)deepexploit\.(?:scan|exploit|learn)|rapidpen\.(?:run|attack)
  file_types:
  - '*.py'
  message: Automated LLM/RL penetration testing tool detected (RapidPen/DeepExploit/BreachSeek)
  description: Detects usage of RapidPen (89% accuracy, 3.9 min to shell), DeepExploit (RL+Metasploit, 82% accuracy), or BreachSeek
    (multi-agent, 5.1 min to shell). These are automated pentest tools requiring explicit authorization.
  remediation: Verify authorized penetration testing scope. Ensure RL-trained models are scoped to test environments only
    and Metasploit modules are licensed.
  owasp_llm: LLM06:2025
  cwe: CWE-78
- id: MEDUSA-RT-SCAN-019
  name: dan-aim-jailbreak-template-in-code
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)['"].*(?:do\s+anything\s+now|DAN\s+mode|DAN\s+jailbreak).*['"]
  - (?i)['"].*always\s+intelligent\s+and\s+machiavellian.*['"]
  - (?i)['"].*(?:AIM:|DAN:)\s*['"]
  - (?i)['"].*niccolo\s+machiavelli.*unethical.*['"]
  - (?i)dan_(?:prompt|template|jailbreak|payload)\s*=
  - (?i)aim_(?:prompt|persona|jailbreak)\s*=
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '*.txt'
  message: DAN or AIM jailbreak template string detected in code
  description: Detects hardcoded DAN ('Do Anything Now') or AIM ('Always Intelligent and Machiavellian') jailbreak persona
    templates in code files. These persona override attacks bypass safety alignment.
  remediation: Remove hardcoded jailbreak templates from code. If used for testing, store in secure, access-controlled test
    fixtures.
  owasp_llm: LLM01:2025
  cwe: CWE-74
- id: MEDUSA-RT-SCAN-020
  name: base64-prompt-obfuscation-helper
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)base64.*(?:encode|decode).*(?:prompt|instruction|payload|jailbreak)
  - (?i)(?:prompt|instruction|payload).*base64.*(?:encode|decode)
  - (?i)b64(?:encode|decode)\s*\(.*(?:prompt|instruction|system_prompt)
  - (?i)(?:encode_prompt|obfuscate_prompt|encode_instruction).*base64
  - (?i)base64_(?:prompt|payload|jailbreak|instruction)\s*=
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Base64 encoding helper for prompt obfuscation detected
  description: Detects code that applies Base64 encoding specifically to prompts, instructions, or payloads. Base64 obfuscation
    is a common technique to evade keyword-based safety filters in LLMs.
  remediation: Add Base64 decoding to the pre-processing pipeline and apply safety checks after decoding. Reject inputs that
    decode to policy-violating content.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-RT-SCAN-021
  name: rot13-bypass-encoding
  severity: MEDIUM
  category: red_teaming
  patterns:
  - (?i)rot13.*(?:prompt|instruction|payload|bypass|jailbreak)
  - (?i)(?:prompt|instruction|payload).*rot13
  - (?i)codecs\.encode\(.*['"]rot.?13['"]
  - (?i)rot_?13_(?:prompt|encode|payload|jailbreak)\s*=
  - (?i)['"](?:respond\s+to\s+the\s+following\s+rot.?13|rot.?13.encoded\s+request)['"]
  - (?i)['"]do\s+not\s+print\s+the\s+decoded\s+message['"]
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.txt'
  message: ROT13 encoding used for prompt obfuscation or bypass
  description: Detects ROT13 encoding applied to prompts or instructions as a safety filter bypass. Attackers instruct models
    to decode ROT13 then respond without printing the decoded request, bypassing keyword filters.
  remediation: Apply ROT13 decoding in input pre-processing and run safety checks on decoded content. Detect and block instructions
    that ask models to process encoded text.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-RT-SCAN-022
  name: payload-splitting-implementation
  severity: HIGH
  category: red_teaming
  patterns:
  - (?i)(?:split|chunk|fragment).*(?:payload|prompt|instruction|keyword).*(?:rejoin|join|concat|reassemble)
  - (?i)auto_payload_splitting|payload_split(?:ter|ting)
  - (?i)['"].*(?:b-o-m-b|h-a-c-k|e-x-p-l-o-s-i-v|k-i-l-l).*['"]
  - (?i)hyphenat.*sensitiv.*(?:word|term|keyword)
  - (?i)split_sensitive_terms|obfuscate_keywords.*split
  file_types:
  - '*.py'
  - '*.js'
  - '*.ts'
  message: Payload splitting implementation for safety filter bypass detected
  description: Detects code implementing payload splitting (Auto_Payload_Splitting), where sensitive terms are split (e.g.,
    b-o-m-b, h-a-c-k) and later joined. This technique bypasses keyword-based safety filters.
  remediation: Implement fuzzy keyword matching and character normalization in input filters. Detect common delimiter-split
    patterns before safety classification.
  owasp_llm: LLM01:2025
  cwe: CWE-116
- id: MEDUSA-RT-SCAN-023
  name: autoredteamer-lifelong-attack-framework
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(autoredteamer|auto_red_teamer|auto.?red.?team).{0,60}(strategy|attack|memory)
  - (?i)(strategy_proposer|attack_memory|strategy_designer).{0,60}(arxiv|paper|research)
  - (?i)arxiv.{0,40}(jailbreak|red.?team|attack.?vector).{0,40}(implement|generate|synthesize)
  - (?i)(lifelong|continuous).{0,30}(attack|red.?team).{0,30}(learning|update|discover)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: AutoRedTeamer lifelong learning attack framework pattern (82% ASR on Llama-3.1-70B)'
  description: AutoRedTeamer autonomously queries arXiv to discover and implement new attack vectors. Dual-agent system with
    Attack Memory achieves 82% ASR on Llama-3.1-70B with 46% fewer compute costs than baselines.
  remediation: Isolate red teaming automation from production models. Monitor for automated arXiv/paper-reading combined with
    attack generation. Require human approval for new attack implementations.
  owasp_llm: LLM01:2025
  cwe: CWE-94
- id: MEDUSA-RT-SCAN-024
  name: gptfuzzer-afl-prompt-mutation
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(gptfuzzer|gpt.?fuzzer).{0,60}(mutate|mutator|crossover|seed)
  - (?i)(fuzzer|fuzzing).{0,40}(jailbreak|prompt|template).{0,40}(mutate|crossover|expand|shorten|rephrase)
  - (?i)(seed.?pool|template.?pool).{0,60}(jailbreak|attack).{0,40}(mutate|evolve|expand)
  - (?i)afl.{0,30}(inspired|style|based).{0,30}(prompt|jailbreak|llm)
  file_types:
  - '*.py'
  - '*.ipynb'
  message: 'Detected: GPTFUZZER AFL-style prompt mutation framework (>90% ASR on ChatGPT/Llama-2)'
  description: GPTFUZZER applies software fuzzing logic to LLM jailbreaking. Mutation operators (crossover, expand, shorten,
    rephrase) on seed templates achieve >90% ASR and high transferability (95% PaLM2, 90% Claude-2).
  remediation: Monitor for systematic prompt mutation patterns in testing pipelines. Implement rate limiting and diversity
    detection on repeated model queries.
  owasp_llm: LLM01:2025
  cwe: CWE-693
- id: MEDUSA-RT-SCAN-025
  name: redcoder-cwe-targeted-code-attack
  severity: HIGH
  category: code_llm_attack
  patterns:
  - (?i)(redcoder|red.?coder).{0,60}(strategy|arsenal|cwe|vulnerability)
  - (?i)(strategy_arsenal|prototype_conversation).{0,60}(code|cwe|vulnerability)
  - (?i)(cwe.?[0-9]{2,4}).{0,60}(inject|induce|generate|produce).{0,40}(code|function|snippet)
  - (?i)(multi.?turn|iterative).{0,40}(code.?llm|coding.?model).{0,40}(cwe|vulnerability|exploit)
  file_types:
  - '*.py'
  - '*.ipynb'
  - '*.json'
  message: 'Detected: REDCODER multi-turn code LLM red teaming targeting specific CWE vulnerabilities'
  description: REDCODER uses RAG-retrieved strategy arsenal to induce CWE-specific vulnerabilities in code LLMs. Achieves
    61-65% ASR on CodeGemma/Qwen-Coder by targeting failure-to-success transitions in coding dialogues.
  remediation: Audit code LLM outputs for security anti-patterns. Deploy CWE-specific linting on AI-generated code. Sandbox
    code generation from deployment pipelines.
  owasp_llm: LLM02:2025
  cwe: CWE-94
- id: MEDUSA-RT-SCAN-026
  name: redtwiz-hierarchical-attack-planner
  severity: HIGH
  category: automated_red_teaming
  patterns:
  - (?i)(redtwiz|red.?twiz|redtreez|red.?treez).{0,60}(attack|plan|schedule)
  - (?i)(red.?dat|mrt.?ferret).{0,60}(attack|token|policy|rl)
  - (?i)(ucb|thompson.?sampling).{0,40}(attack|strategy|red.?team)
  - (?i)(dialogue.?action.?token|action.?token).{0,40}(steer|rl|policy).{0,40}(attacker|red.?team)
  file_types:
  - '*.py'
  - '*.ipynb'
