# MEDUSA Scanner Rules - Attack Tools & Framework Detection
# Source: NotebookLM Research (Multiple Notebooks) | Extracted: 2025-12-31
# 50+ rules for detecting known attack tools, frameworks, and libraries

rules:
  # ============================================================================
  # Gradient-Based Attack Tools
  # ============================================================================

  - id: TOOL-GRAD-001
    name: gcg-attack-repo
    severity: HIGH
    category: attack_tool
    languages: [python]
    patterns:
      - '(?i)llm.?attacks|llm_attacks'
      - '(?i)from\s+llm_attacks'
      - '(?i)import.*gcg|GCGAttack'
    message: "GCG (llm-attacks) attack framework detected - 3k+ stars"
    cwe: CWE-506
    owasp_llm: "LLM01:2025"
    metadata:
      repo: "llm-attacks/llm-attacks"
      attack_type: gradient-based

  - id: TOOL-GRAD-002
    name: autodan-attack
    severity: HIGH
    category: attack_tool
    languages: [python]
    patterns:
      - '(?i)autodan|AutoDAN'
      - '(?i)rotaryhammer.*autodan'
    message: "AutoDAN automated jailbreak framework detected"
    cwe: CWE-506
    owasp_llm: "LLM01:2025"
    metadata:
      repo: "rotaryhammer/AutoDAN"

  - id: TOOL-GRAD-003
    name: pair-attack
    severity: HIGH
    category: attack_tool
    languages: [python]
    patterns:
      - '(?i)from\s+pair|import.*PAIR'
      - '(?i)jailbreaking.?llms.*pair'
    message: "PAIR prompt refinement attack framework"
    cwe: CWE-506
    owasp_llm: "LLM01:2025"
    metadata:
      repo: "jailbreaking-llms/PAIR"

  - id: TOOL-GRAD-004
    name: tap-attack
    severity: HIGH
    category: attack_tool
    languages: [python]
    patterns:
      - '(?i)tree.?of.?attacks|TAP.*pruning'
      - '(?i)RICommunity.*TAP'
    message: "TAP (Tree of Attacks with Pruning) framework"
    cwe: CWE-506
    owasp_llm: "LLM01:2025"
    metadata:
      repo: "RICommunity/TAP"

  # ============================================================================
  # Black-Box Attack Tools
  # ============================================================================

  - id: TOOL-BLACK-001
