rules:
- id: TOOL-GRAD-001
  name: gcg-attack-repo
  severity: HIGH
  category: attack_tool
  languages:
  - python
  patterns:
  - (?i)llm.?attacks|llm_attacks
  - (?i)from\s+llm_attacks
  - (?i)import.*gcg|GCGAttack
  message: GCG (llm-attacks) attack framework detected - 3k+ stars
  cwe: CWE-506
  owasp_llm: LLM01:2025
  metadata:
    repo: llm-attacks/llm-attacks
    attack_type: gradient-based
  file_types: &id001
  - '*.py'
  - '*.js'
  - '*.ts'
- id: TOOL-GRAD-002
  name: autodan-attack
  severity: HIGH
  category: attack_tool
  languages:
  - python
  patterns:
