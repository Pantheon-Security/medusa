  - (?i)rotaryhammer.*autodan
  message: AutoDAN automated jailbreak framework detected
  cwe: CWE-506
  owasp_llm: LLM01:2025
  metadata:
    repo: rotaryhammer/AutoDAN
  file_types: *id001
