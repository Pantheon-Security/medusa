# MEDUSA Security Scan Workflow
# This workflow runs MEDUSA security scanner on your codebase
# and uploads results to GitHub Security tab

name: MEDUSA Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly security scan
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  pull-requests: write    # Required to post the scan-results PR comment

jobs:
  security-scan:
    name: Run MEDUSA Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MEDUSA
        run: pip install -e .

      - name: Run MEDUSA Security Scan
        id: scan
        run: medusa scan . --format all --fail-on high --no-install || true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        continue-on-error: true  # a comment hiccup must not fail the security-scan check
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### MEDUSA Security Scan Results

            | Severity | Count |
            |----------|-------|
            | Critical | ${{ steps.scan.outputs.critical-count }} |
            | High | ${{ steps.scan.outputs.high-count }} |
            | Medium | ${{ steps.scan.outputs.medium-count }} |
            | **Total** | **${{ steps.scan.outputs.issues-count }}** |

            [View full results in the Security tab](../../security/code-scanning)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
