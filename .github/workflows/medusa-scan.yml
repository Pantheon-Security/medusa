# MEDUSA Security Scan Workflow
# This workflow runs MEDUSA security scanner on your codebase
# and uploads results to GitHub Security tab

name: MEDUSA Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly security scan
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  pull-requests: write    # Required to post the scan-results PR comment

jobs:
  security-scan:
    name: Run MEDUSA Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MEDUSA
        run: pip install -e .

      - name: Run MEDUSA Security Scan
        id: scan
        continue-on-error: true  # let the workflow keep going so we can parse + report counts, then re-fail below
        run: medusa scan . --format sarif --format json --fail-on high

      - name: Parse scan results
        id: parse
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os

          candidates = [
              f for f in glob.glob(".medusa/reports/medusa-scan-*.json")
              if "raw-payloads" not in f
          ]
          if not candidates:
              raise SystemExit("No MEDUSA JSON report found in .medusa/reports/")

          with open(sorted(candidates)[-1]) as f:
              data = json.load(f)

          severity = data.get("severity_breakdown", {})
          total = data.get("scan_summary", {}).get("total_issues", 0)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"critical-count={severity.get('CRITICAL', 0)}\n")
              out.write(f"high-count={severity.get('HIGH', 0)}\n")
              out.write(f"medium-count={severity.get('MEDIUM', 0)}\n")
              out.write(f"issues-count={total}\n")
          PYEOF

      - name: Upload SARIF results
        if: always()  # upload findings even when --fail-on trips the scan step
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .medusa/reports/*.sarif

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        continue-on-error: true  # a comment hiccup must not fail the security-scan check
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### MEDUSA Security Scan Results

            | Severity | Count |
            |----------|-------|
            | Critical | ${{ steps.parse.outputs.critical-count }} |
            | High | ${{ steps.parse.outputs.high-count }} |
            | Medium | ${{ steps.parse.outputs.medium-count }} |
            | **Total** | **${{ steps.parse.outputs.issues-count }}** |

            [View full results in the Security tab](../../security/code-scanning)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Enforce fail-on threshold
        if: steps.scan.outcome == 'failure'
        run: |
          echo "MEDUSA scan reported findings at or above the --fail-on threshold." >&2
          exit 1
